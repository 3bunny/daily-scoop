r latest outing, a new standout emerged: Emmitt Finnie. Finnie's performance was described as \"dazzling,\" indicating he played exceptionally well, likely contributing with crucial goals, assists, or impressive defensive plays that captivated fans and analysts alike. His ability to step up in a pivotal moment demonstrates the depth and resilience within the Red Wings' roster, proving that other players are ready to take on bigger roles. This victory is more than just two points in the standings; it's a statement that the team can adapt and succeed even after losing a foundational player. The Red Wings, a storied franchise in the National Hockey League (NHL), are looking to build momentum and establish a new identity. Finnie's stellar play and the team's collective effort suggest a promising path forward, showing that new talent can shine and contribute significantly to the team's success. This win could be a turning point, instilling belief among players and fans, and setting a positive tone for games to come as they aim to compete in the competitive NHL landscape.", "vocab": [{"word": "significant", "definition": "important or notable."}, {"word": "transition", "definition": "a process of changing from one state or condition to another."}, {"word": "departure", "definition": "the act of leaving."}, {"word": "dazzling", "definition": "extremely impressive or brilliant."}, {"word": "resilience", "definition": "the ability to recover quickly from difficulties."}, {"word": "foundational", "definition": "forming a base or basis; fundamental."}, {"word": "instilling", "definition": "gradually but firmly establishing an idea or attitude in a person's mind."}]}, "Advanced": {"text": "The Detroit Red Wings have notched a crucial victory, securing their first win since the high-profile trade of their cornerstone captain, Dylan Larkin. This triumph provides a significant psychological lift for a franchise navigating a pivotal period of recalibration and strategic realignment. Larkin, a revered figure and often the team's leading scorer and emotional compass, was recently dealt to another organization, a move that sent ripples through the Red Wings' fanbase and raised pertinent questions about the team's immediate competitiveness and long-term trajectory. The void left by such a prominent departure is substantial, encompassing not just offensive production but also leadership, veteran presence, and the intangible qualities that define a team's identity. Many pundits and fans alike speculated on the potential for a slump or a period of adjustment as the team sought to fill such a significant vacuum. Yet, in their most recent contest, a new narrative began to unfold, spearheaded by the remarkable performance of Emmitt Finnie. Finnie's play was universally lauded as \"dazzling,\" suggesting a display of exceptional skill, strategic acumen, and perhaps even game-changing moments, whether through clutch scoring, masterful playmaking, or tenacious defensive efforts that captivated spectators. His ability to rise to the occasion in a post-Larkin era underscores the depth and burgeoning talent within the Red Wings' prospect pool and existing roster, signaling that the team is not solely reliant on one star. This victory transcends mere statistical accumulation; it serves as a powerful affirmation that the team possesses the capacity to adapt, coalesce, and achieve success even in the absence of a franchise linchpin. For the Red Wings, a storied Original Six franchise in the National Hockey League (NHL) striving to reclaim past glories, this win is more than an isolated event. It represents a vital step in forging a new identity and demonstrating collective resilience. Finnie's stellar contribution, coupled with a cohesive team effort, offers a tangible blueprint for future success. It injects a much-needed dose of optimism and confidence, potentially catalyzing a positive shift in team morale and setting an encouraging precedent for the remainder of the season as they contend within a highly competitive league. This performance could very well mark the emergence of a new key contributor and signal a renewed sense of purpose for the entire squad, demonstrating that the team's strategic vision, even amidst significant personnel changes, is beginning to bear fruit.", "vocab": [{"word": "notched", "definition": "achieved or recorded (a victory or score)."}, {"word": "cornerstone", "definition": "an essential, indispensable, or fundamental part."}, {"word": "recalibration", "definition": "the process of adjusting or fine-tuning something to a new standard or setting."}, {"word": "trajectory", "definition": "the path followed by a projectile flying or an object moving under the action of given forces; figuratively, a course of development."}, {"word": "pundits", "definition": "experts or commentators who offer opinions on a particular subject, often in the media."}, {"word": "acumen", "definition": "the ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "coalesce", "definition": "come together to form one mass or whole."}, {"word": "linchpin", "definition": "a person or thing vital to an enterprise or organization."}]}}, "questions": [{"q": "What significant event happened to the Red Wings before this game?", "a": "Their star player, Dylan Larkin, was traded to another team."}, {"q": "Which player is highlighted for his excellent performance in the game?", "a": "Emmitt Finnie."}], "id": "a23e425a6bd", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxNWDhWLWpMc2trUHZ0NXg0clA2U215NkNIZTBpemxDM0QtNXVsZ2FMR3JObmhOMngzeTZOWUJQbkt3bWM2bWNfTkthUEl0YV9sRmd1Y3Y0RDRQM2hlLWpvenFycTY4WmFUanR2UmxkX2FKcERDWllJNFl3ZGlnLXVnRlpkc2hsMGhrX3RuRjhHdVNIU1UwRGlHbDJjYXAzMGwtOXZCdHF0aWpBSkVJZmc?oc=5", "published": "2026-11-26T12:39:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "South Korea Hikes Rates to Combat Rising Inflation", "excerpt": "South Korea's central bank raised its key interest rate recently to fight inflation and stabilize the national economy.", "levels": {"Beginner": {"text": "South Korea's main bank, called the central bank, has decided to raise its key interest rate. This means it will cost more to borrow money. The bank made this choice to help stop prices from going up too fast. When prices rise quickly, it is called inflation. Inflation makes things like food and gas more expensive for everyone.\n\nThe central bank's job is to keep the country's economy stable. By making borrowing more expensive, the bank hopes people and businesses will spend a little less money. When people spend less, the demand for goods and services can slow down. This can help prices stop rising so quickly. Many countries around the world are also seeing prices go up, and their banks are taking similar steps. This move aims to make sure that people's money can still buy enough things in the future.", "vocab": [{"word": "central bank", "definition": "The main bank of a country that manages its money and economy."}, {"word": "interest rate", "definition": "The extra money you pay when you borrow money, or the extra money you earn when you save money."}, {"word": "inflation", "definition": "When prices for many things go up over time, so your money buys less."}, {"word": "borrow", "definition": "To take money from a bank or person with the promise to pay it back later."}, {"word": "economy", "definition": "The system of how a country makes and uses money, goods, and services."}]}, "Intermediate": {"text": "The Bank of Korea, South Korea's central bank, has announced an increase in its benchmark interest rate. This decision is a direct response to rising inflation, which has been making everyday goods and services more expensive for consumers across the nation. By raising the cost of borrowing money, the central bank aims to curb the rapid increase in prices and stabilize the national economy.\n\nInflation occurs when the purchasing power of money decreases, meaning you need more money to buy the same items. This can be caused by various factors, including strong consumer demand and global supply chain issues. The Bank of Korea's primary goal is to maintain price stability. When interest rates go up, it becomes more expensive for commercial banks to borrow from the central bank, and in turn, they charge higher rates for loans to businesses and individuals. This can lead to less spending and investment, which helps to cool down the economy and slow the rate of inflation.\n\nThis monetary policy adjustment aligns with actions taken by other major central banks worldwide, many of whom are also battling high inflation rates driven by global events. While higher interest rates can help control prices, they can also slow down economic growth. The Bank of Korea must carefully balance these factors to ensure long-term economic health for South Korea.", "vocab": [{"word": "benchmark", "definition": "A standard or point of reference against which things may be compared or assessed."}, {"word": "curb", "definition": "To restrain or control something, especially something undesirable."}, {"word": "purchasing power", "definition": "The financial ability to buy products and services."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit to influence the economy."}, {"word": "stabilize", "definition": "To make something firm or steady; to prevent it from changing or getting worse."}, {"word": "economic growth", "definition": "An increase in the amount of goods and services produced per head of the population over a period of time."}]}, "Advanced": {"text": "The Bank of Korea (BOK), the nation's central monetary authority, has implemented a key interest rate hike, signaling its firm commitment to reining in persistent inflationary pressures. This policy adjustment comes as South Korea, like many global economies, grapples with elevated consumer prices driven by a confluence of robust demand, supply chain disruptions, and rising energy costs. The BOK's move aims to anchor inflation expectations and restore macroeconomic stability.\n\nRaising the benchmark rate, often referred to as the policy rate, directly increases the cost of borrowing for commercial banks. These higher costs are then typically passed on to businesses and consumers through more expensive loans for mortgages, car purchases, and business investments. The intended effect is to dampen aggregate demand, thereby reducing the upward pressure on prices. This strategy is a classic example of monetary tightening, designed to cool an overheating economy.\n\nWhile effective in combating inflation, such measures carry the inherent risk of slowing economic growth. Higher borrowing costs can deter investment and consumer spending, potentially leading to a deceleration in GDP expansion. The BOK's policy mandate involves balancing price stability with supporting sustainable economic activity, a delicate equilibrium in the current global climate of synchronized monetary tightening by major central banks, including the U.S. Federal Reserve and the European Central Bank.\n\nAnalysts anticipate that the BOK will continue to monitor economic indicators closely, including inflation trajectories, employment figures, and global economic developments, to inform future policy decisions. The central bank's forward guidance will be crucial in shaping market expectations regarding the pace and extent of further rate adjustments, as it navigates the complex trade-offs between taming inflation and mitigating the risk of an economic downturn.", "vocab": [{"word": "monetary authority", "definition": "An institution, usually a central bank, responsible for controlling the supply of money and credit in an economy."}, {"word": "reining in", "definition": "To control or limit something, often something that is growing or increasing rapidly."}, {"word": "inflationary pressures", "definition": "Factors or forces that cause a general increase in prices and fall in the purchasing value of money."}, {"word": "confluence", "definition": "A coming together of two or more things; a merging."}, {"word": "macroeconomic stability", "definition": "A state where an economy experiences steady growth, low inflation, and full employment, avoiding large fluctuations."}, {"word": "dampen aggregate demand", "definition": "To reduce the total demand for goods and services in an economy."}, {"word": "monetary tightening", "definition": "A central bank policy aimed at reducing the money supply and credit availability, typically by raising interest rates."}, {"word": "synchronized", "definition": "Occurring or operating at the same time or rate; coordinated."}]}}, "questions": [{"q": "What is the main reason South Korea's central bank raised its key interest rate?", "a": "The main reason is to fight inflation, which means controlling the rapid increase in prices for goods and services."}, {"q": "What is one potential effect of higher interest rates on consumers or businesses?", "a": "Higher interest rates make it more expensive for consumers and businesses to borrow money, which can lead to less spending and investment, potentially slowing economic growth."}], "id": "a6c766147ce", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxNRENlanlRSmRseFRua2hORlVoT0RXb1JUa3JuSFZtUWtCRDBWWHpCcHpJWE4tSVduV2wyejJZZzdMaUZCNVlwazlJZEpqT0JweDAtQXlhTkJGeGFqbUpmZGN4V3Z0QS1zZ2JzWlFHZnhuMWxKMUpTOTZNMkxSZEVWM1pWVzdYczJScmw3LTRSc1BKa2hmY1ZzZHZ3d2szVTZkcFVIbm83RVBrdlRCLXBHTnF6RWhnMVJjcUFBQTlDdnA4Q2diSV9PWUhzb0dYTVhFdXhJOFB2bHF2ZEd3SXBzUUlKYi10elhHWlYxeDhEOHJfUTR0UDBV?oc=5", "published": "2026-11-26T12:30:30+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "South Korea's Central Bank Raises Rates to Combat Inflation", "excerpt": "South Korea's central bank recently increased its key interest rate, aiming to slow down rising prices and stabilize the national economy.", "levels": {"Beginner": {"text": "The Bank of Korea is South Korea's main bank. It recently made an important decision. The bank decided to raise its key interest rate. This means that the cost of borrowing money will now be higher.\n\nWhy did they do this? The main reason is to fight inflation. Inflation happens when prices for many things, like food and gas, go up too much and too fast. When prices are high, people's money buys less. This makes life harder for everyone.\n\nBy raising the interest rate, the central bank hopes to slow down how much money people and businesses borrow. If people borrow less, they might spend less. When people spend less, the demand for goods and services can go down. This can help stop prices from rising so quickly.\n\nThis move is part of the central bank's job to keep the country's economy healthy and stable. They want to make sure prices do not get out of control. This decision affects banks, businesses, and everyday people in South Korea. It is a step to help the economy in the long run.", "vocab": [{"word": "Central bank", "definition": "The main bank of a country that controls its money supply."}, {"word": "Interest rate", "definition": "The extra money you pay when you borrow money, or earn when you save it."}, {"word": "Inflation", "definition": "When the prices of goods and services go up over time."}, {"word": "Economy", "definition": "How a country makes and uses money, goods, and services."}, {"word": "Borrow", "definition": "To take money from someone with the promise to pay it back later."}, {"word": "Prices", "definition": "The amount of money you need to pay for something."}]}, "Intermediate": {"text": "South Korea's central bank, the Bank of Korea, has announced a significant policy change, raising its key interest rate. This move is a direct response to persistent inflation, which has been driving up the cost of living for South Korean citizens. The decision aims to cool down the economy and bring price stability back to the nation.\n\nWhen a central bank raises its benchmark interest rate, it makes borrowing money more expensive for commercial banks. These banks then pass on higher costs to their customers, meaning loans for homes (mortgages), cars, and businesses become more costly. The idea is that higher borrowing costs will discourage both consumers and businesses from taking on new debt and spending as much. A reduction in consumer spending and investment can help to lower overall demand in the economy, which in turn can slow down the rate at which prices are increasing.\n\nInflation has been a global concern, fueled by factors such as supply chain disruptions, strong consumer demand, and higher energy prices. South Korea is not immune to these pressures. The Bank of Korea's action aligns with a broader trend seen in many other countries, where central banks are tightening monetary policy to combat rising prices.\n\nWhile raising interest rates is a key tool for fighting inflation, it also carries risks. Higher rates can slow down economic growth, potentially leading to less job creation or even job losses. The Bank of Korea is trying to find a balance: curbing inflation without causing a severe economic downturn. This decision reflects their commitment to maintaining a stable economic environment for the country.", "vocab": [{"word": "Monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit in an economy."}, {"word": "Persistent", "definition": "Continuing to exist or happen, especially for longer than is usual or desirable."}, {"word": "Cost of living", "definition": "The amount of money needed to sustain a certain standard of living, including basic expenses like housing, food, and transport."}, {"word": "Benchmark interest rate", "definition": "A standard interest rate used by central banks to influence other interest rates in the economy."}, {"word": "Mortgages", "definition": "Loans specifically for buying property or real estate."}, {"word": "Consumer spending", "definition": "The total money spent by households on goods and services."}, {"word": "Economic growth", "definition": "An increase in the production of goods and services in an economy over a period of time."}]}, "Advanced": {"text": "The Bank of Korea (BOK), South Korea's central bank, has implemented a further hike in its key interest rate, signaling a continued hawkish stance in its battle against persistent inflationary pressures. This latest move underscores the BOK's commitment to price stability amidst a challenging global economic landscape, where supply chain disruptions, robust demand, and elevated energy costs have fueled a broad surge in consumer prices.\n\nBy increasing its benchmark policy rate, the BOK aims to enact monetary tightening across the financial system. This action directly influences the cost of borrowing for commercial banks, which subsequently adjust their lending rates for various financial products, including mortgages, business loans, and consumer credit. The intended effect is a reduction in aggregate demand as higher borrowing costs deter both households and corporations from taking on new debt and engaging in discretionary spending or investment. A deceleration in demand is a critical mechanism for mitigating inflationary pressures.\n\nSouth Korea, an export-oriented economy heavily reliant on global trade, has been particularly susceptible to imported inflation, exacerbated by a weaker won against the U.S. dollar and volatile commodity prices. The BOK's decision aligns with a global trend among major central banks, including the U.S. Federal Reserve, which have aggressively raised rates to rein in inflation that has reached multi-decade highs in many regions. This synchronized tightening reflects a shared concern about the erosion of purchasing power and the potential for inflation expectations to become entrenched.\n\nHowever, this strategy is not without its complexities and potential trade-offs. While essential for taming inflation, higher interest rates can also dampen economic growth, potentially leading to a slowdown in investment, job creation, and overall economic activity. Policymakers face the delicate balancing act of cooling the economy sufficiently to bring inflation under control without precipitating a severe recession. Furthermore, the impact of such monetary policy decisions can be multifaceted, affecting currency valuation (potentially strengthening the won), capital flows, and the financial stability of highly leveraged sectors. The BOK's forward guidance and future rate decisions will be closely scrutinized for indications of how it navigates these economic headwinds while striving to anchor inflation expectations.", "vocab": [{"word": "Hawkish stance", "definition": "An aggressive approach to monetary policy, typically favoring higher interest rates to combat inflation, often prioritizing price stability over economic growth."}, {"word": "Monetary tightening", "definition": "A central bank policy aimed at reducing the money supply and credit availability in an economy, usually through higher interest rates, to curb inflation."}, {"word": "Persistent inflationary pressures", "definition": "Continuous and strong forces causing a general increase in prices and a fall in the purchasing value of money."}, {"word": "Aggregate demand", "definition": "The total demand for all goods and services produced in an economy at a given overall price level and in a given time period."}, {"word": "Discretionary spending", "definition": "Non-essential spending by consumers on goods and services that are not considered necessities, often reduced during economic slowdowns."}, {"word": "Mitigating", "definition": "Making something less severe, serious, or painful; reducing the negative impact of something."}, {"word": "Susceptible", "definition": "Likely or liable to be influenced or harmed by a particular thing."}, {"word": "Economic headwinds", "definition": "Factors or conditions that make economic growth more difficult or slow it down, acting as obstacles to progress."}]}}, "questions": [{"q": "What specific action did South Korea's central bank take regarding its key interest rate?", "a": "South Korea's central bank raised its key interest rate."}, {"q": "What is the primary goal of the central bank's decision to raise interest rates?", "a": "The primary goal is to fight inflation, meaning to slow down rising prices and stabilize the economy."}], "id": "ac24ed0503e", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxPemJqWE5wOUhoVXh0SC00ZV8xOTlXSTltY05POEN5WWdYeTg1OU1WeGctTEI5Yi04TUJldlVhOW1uUEZ0SHltRW5GWFVwcmNWcWpTT01lajQ1R3hsbDZHNXVIMkRBQ2ZjdjhBemdmQ3drVXozRHMwVlg5NmpDMnZIc0VfTzU1SlRRT3dSejRiZkpKU0NNLTVvZW44X3pzYW4wMG1MbTJ1RGZwbnVNUkVKenZDSWtnT1NoLUc3SHVEVWkwNmV5QlRDLW1IVmY4YXF3LUxxNXNXSHAzNFZRdWtNWGpJVm1lUkx0RzQ2dmVIRnlYOV90dFpvSXVfM2Q?oc=5", "published": "2026-11-26T12:30:30+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US Announces New Tariffs on China, EU, and Other Partners", "excerpt": "The United States has announced new taxes on goods from many countries, including major trading partners like China and the European Union.", "levels": {"Beginner": {"text": "The United States government has decided to put new taxes on goods coming from other countries. These new taxes are called tariffs. Many countries will be affected, including big trading partners like China and the European Union (EU). \n\nWhen the US puts a tariff on a product, it means that product will cost more when it is sold in America. For example, if a company in China makes a toy and sends it to the US, the US government will add a tax to that toy. This makes the toy more expensive for American shoppers to buy. \n\nThe US government says these new tariffs are to help American businesses. They want people to buy more products made in the US. But some people worry that these tariffs could make things more expensive for everyone. Other countries might also put their own taxes on American goods, which could make it harder for US companies to sell their products abroad. This is a big change for how the US trades with the rest of the world.", "vocab": [{"word": "tariffs", "definition": "extra taxes on goods coming into a country"}, {"word": "goods", "definition": "things that are made to be sold"}, {"word": "affected", "definition": "changed or influenced by something"}, {"word": "trading partners", "definition": "countries that buy and sell goods to each other"}, {"word": "shoppers", "definition": "people who buy things from stores"}, {"word": "abroad", "definition": "in or to a foreign country"}]}, "Intermediate": {"text": "The United States has announced a new round of tariffs, which are special taxes placed on imported goods. These levies will impact a wide range of America's major trading partners, notably including China and the European Union. This move signals a significant shift in US trade policy and could have broad economic implications.\n\nTariffs are typically imposed to make foreign products more expensive, thereby encouraging consumers and businesses to purchase domestically produced alternatives. The US government's rationale for these new tariffs often centers on protecting domestic industries from what it views as unfair competition or to address trade imbalances where one country sells much more to another than it buys. By increasing the cost of imports, the aim is to give American companies a competitive advantage.\n\nHowever, the introduction of tariffs can lead to several consequences. For consumers, it often means higher prices for imported goods, as the cost of the tariff is usually passed on. For businesses that rely on imported materials or components, their production costs can increase. Furthermore, tariffs can trigger retaliatory measures from affected countries. For instance, if the US places tariffs on goods from the EU, the EU might respond by imposing its own tariffs on American products. This can escalate into trade disputes, potentially harming global trade relations and economic growth. The decision to implement these new tariffs reflects an ongoing strategy by the US to reshape its economic relationships with key international players.", "vocab": [{"word": "levies", "definition": "taxes or fees collected by a government"}, {"word": "impact", "definition": "to have a strong effect on someone or something"}, {"word": "implications", "definition": "possible future effects or results"}, {"word": "rationale", "definition": "the set of reasons or logical basis for a course of action or belief"}, {"word": "domestically produced", "definition": "made or grown within one's own country"}, {"word": "retaliatory measures", "definition": "actions taken in return for an injury or offense, often in trade"}, {"word": "escalate", "definition": "to increase rapidly in intensity or magnitude"}]}, "Advanced": {"text": "The United States has announced a comprehensive set of new tariffs, marking a significant recalibration of its international trade policy. These import duties are poised to affect a broad spectrum of America's principal trading partners, most notably including economic powerhouses like China and the European Union. This strategic move underscores a continued commitment to leveraging trade policy as a tool for economic and geopolitical objectives.\n\nTariffs, essentially taxes on imported goods, are typically implemented to achieve several policy goals. Primarily, they aim to shield domestic industries from foreign competition, which policymakers might deem unfair or subsidized. By artificially increasing the cost of imported products, tariffs are intended to make domestically manufactured goods more competitive, thereby stimulating local production, safeguarding jobs, and potentially reducing trade deficits. The current administration's rationale often cites national security concerns, intellectual property theft, or the need to level the playing field against countries perceived to engage in unfair trade practices.\n\nHowever, the imposition of tariffs is a double-edged sword, carrying a host of potential economic repercussions. While they might offer short-term relief to specific domestic sectors, the costs are often borne by consumers through higher prices for goods and by businesses that rely on imported raw materials or components, leading to increased production expenses. Moreover, such protectionist measures frequently invite retaliatory tariffs from affected nations, sparking trade disputes that can disrupt global supply chains, diminish export opportunities for domestic firms, and dampen overall economic growth. The historical precedent suggests that prolonged trade conflicts can lead to reduced international cooperation and a fragmentation of the global trading system.\n\nThe decision to target major economic blocs like China and the EU signals a willingness to confront established trade relationships. For China, these tariffs could exacerbate existing tensions over technology and market access. For the EU, a key ally, they could strain diplomatic ties and complicate efforts to address other global challenges collaboratively. The long-term efficacy and broader implications of these tariffs will depend on the responses from affected countries and the resilience of the global economic framework.", "vocab": [{"word": "recalibration", "definition": "the act of adjusting or fine-tuning something, often a policy or strategy, to achieve a more precise or desired outcome"}, {"word": "poised", "definition": "ready or prepared for something to happen; in a state of balance or readiness"}, {"word": "leveraging", "definition": "using something to maximum advantage; applying a small amount of force to achieve a greater effect"}, {"word": "subsidized", "definition": "supported financially by a government or other organization to keep prices low or competitive"}, {"word": "double-edged sword", "definition": "something that has both favorable and unfavorable consequences; a situation that can be both beneficial and detrimental"}, {"word": "repercussions", "definition": "unintended consequences or effects, often negative, that result from an action or event"}, {"word": "protectionist measures", "definition": "government policies that restrict international trade, typically to protect domestic industries from foreign competition"}, {"word": "exacerbate", "definition": "to make a problem, bad situation, or negative feeling worse"}]}}, "questions": [{"q": "What are tariffs?", "a": "Tariffs are special taxes placed on goods that are imported into a country."}, {"q": "Which two major trading partners are specifically mentioned as being affected by the new US tariffs?", "a": "China and the European Union (EU) are specifically mentioned as being affected."}], "id": "a9ad0632cef", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c893r9ke5p97o?at_medium=RSS&at_campaign=rss", "published": "2026-11-26T12:01:40+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Judge halts order for Georgia’s Fulton County to give 2020 election records to state election board - The Seattle Times", "excerpt": "Judge halts order for Georgia’s Fulton County to give 2020 election records to state election board The Seattle Times", "levels": {"Beginner": {"text": "Judge halts order for Georgia’s Fulton County to give 2020 election records to state election board The Seattle Times", "vocab": []}, "Intermediate": {"text": "Judge halts order for Georgia’s Fulton County to give 2020 election records to state election board The Sea n higher as tech rebound holds after wild swings on Wall St Investing.com", "vocab": []}}, "questions": [], "id": "a5386591a30", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxNc09naTRBTHppblJfSEM4Y3UyYkZid0dzbkNJdVBkWnV5SGNMd2NvX1BuczV5a242ZEl6ZlRkX1FxOU1jVWtwZVEzQWcwWlJsZXZtVG5vbk9hVjlFUFdwcV9lTGZ1cy16ODhkQUF6MWhWMHhVZXo4eTBYRV9sMWN2a1NaV2hpQ1hHTWdqcjJJNU4wR2N1SG5zUW4zNVprRGhNVVVXVXYxV1BzeENfdDhBTm01VQ?oc=5", "published": "2026-11-26T12:42:31+09:00", "category": "finance", "category_title": "Finance"}, {"headline": "Blackshear Alumni Plan Thanksgiving Celebration in Hearne", "excerpt": "Blackshear alumni will celebrate Thanksgiving weekend in Hearne, Texas, with music, talent, and a community parade.", "levels": {"Beginner": {"text": "The former students, called alumni, of Blackshear High School are planning a big event. It will happen in the town of Hearne, Texas. The event is set for Thanksgiving weekend, a time when many people visit family. People will come together to celebrate their old school and community. There will be music for everyone to enjoy. A talent show will let people share their special skills, like singing or dancing. There will also be a fun parade through the town. This is a special time for the Blackshear alumni. They want to remember their school's history. They also want to see old friends and make new memories. The celebration helps keep the community strong and connected. It is a way to honor the school's past and bring joy to Hearne. Everyone in Hearne is invited to join the fun. It will be a weekend full of joy and community spirit for all ages.", "vocab": [{"word": "alumni", "definition": "former students of a school or university."}, {"word": "event", "definition": "a planned public or social occasion."}, {"word": "celebrate", "definition": "to honor or praise something, often with a party."}, {"word": "talent show", "definition": "a show where people perform skills like singing or dancing."}, {"word": "parade", "definition": "a public procession, often with music and floats."}, {"word": "community", "definition": "a group of people living in the same place or having a particular characteristic in common."}]}, "Intermediate": {"text": "Former students of Blackshear High School are organizing a significant community event, a multi-day celebration scheduled for Thanksgiving weekend in Hearne, Texas. Blackshear High School holds a special place in the town's history, having served as a vital educational institution, particularly for the Black community, before desegregation. The alumni association aims to bring together former classmates and local residents for a weekend of remembrance, festivity, and community building.\n\nThe planned activities include a variety of entertainment designed to appeal to all ages. There will be live music performances, showcasing local talent and different genres for all tastes, creating a lively atmosphere. A talent show will provide a platform for individuals to display their unique skills, from singing and dancing to poetry and comedy, encouraging participation from across the community. A highlight of the weekend will be a vibrant community parade. This procession is expected to feature decorated floats, marching bands, and local organizations, creating a colorful spectacle through the streets of Hearne and drawing spectators from near and far.\n\nThanksgiving weekend is a traditional time for family reunions and homecomings, making it an ideal period for alumni to return to their roots and reconnect with their hometown. This event not only serves as a reunion for former students but also as an opportunity to foster community spirit and preserve the rich heritage of Blackshear High School. It's a chance for different generations to connect, share stories, and ensure the school's legacy continues to thrive. The organizers hope the celebration will draw many visitors, boosting local morale, supporting local businesses, and providing a memorable experience for everyone involved in this cherished annual tradition.", "vocab": [{"word": "organizing", "definition": "planning and arranging an event or activity."}, {"word": "significant", "definition": "important or notable."}, {"word": "desegregation", "definition": "the ending of a policy of racial segregation."}, {"word": "alumni association", "definition": "a group of former students from a school or university."}, {"word": "festivity", "definition": "the celebration of something in a joyful way."}, {"word": "heritage", "definition": "something inherited from the past; traditions and culture."}, {"word": "foster", "definition": "to encourage the development of something good."}]}, "Advanced": {"text": "The Blackshear High School alumni association is orchestrating a comprehensive and culturally significant Thanksgiving weekend celebration in Hearne, Texas. This multi-day event aims to honor the enduring legacy of Blackshear High, an institution that played a pivotal role in the educational and social fabric of the Black community in Hearne, particularly during the era of segregation. For decades, Blackshear served not merely as a school but as a central pillar of community life, fostering leadership, academic excellence, and cultural pride. The gathering serves as both a nostalgic reunion for former students and a vibrant reaffirmation of community identity and historical continuity.\n\nThe meticulously planned agenda encompasses a diverse array of activities designed to engage all segments of the community. Musical performances will feature a spectrum of local and regional artists, spanning various genres and providing a lively soundtrack to the festivities. A highly anticipated talent showcase will offer a platform for residents of all ages to demonstrate their artistic and performative abilities, fostering a sense of shared accomplishment and local pride. The centerpiece of the weekend will undoubtedly be the grand community parade, a spectacle anticipated to draw considerable participation with elaborately decorated floats, spirited marching bands, and representatives from numerous local civic and social organizations, winding through the town's historic thoroughfares.\n\nThanksgiving weekend, a period traditionally associated with familial gatherings and ancestral homecomings, provides an opportune moment for alumni to reconnect with their roots and reinforce intergenerational bonds. Beyond mere social interaction, this event is a conscious effort to preserve the rich cultural heritage of Blackshear High School, ensuring its stories and contributions are passed down to younger generations. Such alumni-led initiatives are crucial for maintaining the institutional memory of historically Black schools, many of which faced closure or integration, leading to a potential loss of distinct identity and community cohesion. These gatherings become vital conduits for cultural transmission and collective memory.\n\nThe celebration is expected to have a tangible positive impact on the rural Hearne community, stimulating local commerce and bolstering civic morale. By attracting visitors and participants, it generates economic activity for local businesses, from restaurants to accommodation providers, providing a welcome boost during the holiday season. More profoundly, it reinforces the collective identity of Hearne residents, offering a powerful demonstration of community resilience and enduring spirit in the face of historical changes. The Blackshear alumni's dedication to this annual tradition underscores their commitment to both their alma mater and the broader community, ensuring that the legacy of Blackshear High School remains a vibrant and cherished part of Hearne's ongoing narrative, celebrating its past while building for its future.", "vocab": [{"word": "orchestrating", "definition": "skillfully planning and coordinating a complex event or situation."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "segregation", "definition": "the enforced separation of different racial groups in a country, community, or establishment."}, {"word": "reaffirmation", "definition": "the action of stating something again strongly; confirmation."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very thoroughly."}, {"word": "thoroughfares", "definition": "a road or path forming a route between two places, especially a main road in a town."}, {"word": "intergenerational", "definition": "relating to or occurring between different generations."}, {"word": "conduits", "definition": "channels for conveying something, often abstractly, like information or culture."}]}}, "questions": [{"q": "What kind of event are the Blackshear alumni planning?", "a": "The Blackshear alumni are planning a Thanksgiving weekend celebration featuring music, a talent show, and a community parade."}, {"q": "Where will this event take place?", "a": "The event will take place in Hearne, Texas."}], "id": "a78dcca5a87", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipgFBVV95cUxQeE9pMjRhSW9lQmFXX05neFBBSHE4UkIxQnhiTC1oLUhicnl2Q01yQzBMUUtUSGZwdmJGby1TMWVDZDAyQndqTXdtMlcyazYzMXViZDZjcWY2NjY1Q2cyMThzUmhGclBJN2VkbFo2WERlZmstV2ExTWpQX2RldWxORXIwV0E1Ymg3R05xWVZvU29NdVFEVGFuQjJBTWtyZzB5ajUxYnVn?oc=5", "published": "2026-11-26T12:45:00+09:00", "category": "entertainment", "category_title": "Entertainment"}, {"headline": "Andy Taylor's Rock Edge Defined Duran Duran's Sound", "excerpt": "Guitarist Andy Taylor brought a unique rock sound to Duran Duran, transforming the band and leaving a lasting impact.", "levels": {"Beginner": {"text": "Duran Duran is a very famous music band. Andy Taylor was their guitar player. He was very important for the band's sound. Andy Taylor added a \"rock edge\" to their music. This made Duran Duran special and helped them become popular.\n\nWhen Andy Taylor played guitar, the band sounded different. His style was strong and rocky. It helped Duran Duran become very popular in the 1980s. They had many hit songs, like \"Rio\" and \"Hungry Like the Wolf,\" which showed his unique guitar style.\n\nLater, Andy Taylor left the band. After he left, Duran Duran's music changed. It was not quite the same without his rock guitar. The band continued to make music, but their sound evolved. Andy Taylor's time with Duran Duran was key. He helped make them a big band and his guitar playing made their songs exciting. His influence was a big part of their success.", "vocab": [{"word": "band", "definition": "a group of musicians who play music together."}, {"word": "guitar player", "definition": "a person who plays the guitar."}, {"word": "sound", "definition": "the type of music a band makes."}, {"word": "rock edge", "definition": "a strong, energetic guitar style."}, {"word": "popular", "definition": "liked by many people."}, {"word": "evolved", "definition": "changed slowly over time."}]}, "Intermediate": {"text": "Duran Duran, the iconic British New Wave band, owes much of its distinctive early sound to guitarist Andy Taylor. His unique \"rock edge\" was a transformative element, setting the group apart from many of their synth-pop contemporaries and contributing significantly to their global success in the 1980s.\n\nTaylor joined Duran Duran in 1980, bringing a powerful, guitar-driven sensibility to a band that was already exploring electronic sounds. This fusion of rock guitar riffs with synthesizers created a dynamic and energetic style that became their trademark. Songs like \"Rio,\" \"Hungry Like the Wolf,\" and \"Girls on Film\" prominently featured his sharp, driving guitar work, which provided a crucial counterpoint to the band's more polished pop melodies and visual aesthetics.\n\nHis presence gave Duran Duran a harder, more aggressive musical foundation, which was vital for their appeal in both rock and pop markets. This blend allowed them to achieve massive popularity, topping charts worldwide and becoming MTV darlings.\n\nHowever, Andy Taylor's tenure with the band was not continuous. He first departed in 1986, leading to a noticeable shift in Duran Duran's musical direction. While the band continued to produce successful albums, their sound became generally smoother and less guitar-centric without Taylor's distinctive input. He later rejoined for a reunion in the early 2000s, contributing to the acclaimed album \"Astronaut,\" which saw a return to some of their earlier rock influences. Yet, his second departure meant the band once again adapted its approach.\n\nUltimately, Andy Taylor's contribution was instrumental in forging Duran Duran's original identity. His \"rock edge\" was more than just a guitar style; it was a foundational component that helped define an era-defining band and left an indelible mark on their musical legacy.", "vocab": [{"word": "iconic", "definition": "very famous and recognized, representing something."}, {"word": "distinctive", "definition": "easy to recognize because it is different from others."}, {"word": "transformative", "definition": "causing a big change."}, {"word": "fusion", "definition": "combining different things into one."}, {"word": "counterpoint", "definition": "something that contrasts with another thing, making it more interesting."}, {"word": "tenure", "definition": "the period of time someone holds a position or job."}, {"word": "instrumental", "definition": "very important in making something happen."}]}, "Advanced": {"text": "The enduring legacy of Duran Duran, one of the most commercially successful and culturally influential bands of the New Wave era, is inextricably linked to the formative contributions of its original guitarist, Andy Taylor. His distinctive \"rock edge\" was not merely a stylistic flourish but a foundational element that profoundly shaped the band's sonic identity, differentiating them from their synth-pop peers and propelling them to global superstardom.\n\nJoining Duran Duran in 1980, Taylor infused the nascent group with a potent, guitar-driven sensibility. At a time when synthesizers were increasingly dominant, his gritty, often aggressive guitar riffs provided a vital counterpoint to the band's electronic textures, sophisticated pop melodies, and polished visual aesthetic. This dynamic interplay between electronic innovation and raw rock energy became the hallmark of their early, most celebrated work. Tracks like \"Rio,\" \"Hungry Like the Wolf,\" and \"Girls on Film\" are emblematic of this synthesis, showcasing Taylor's sharp, driving guitar lines as integral to their infectious appeal.\n\nTaylor's presence was crucial in broadening Duran Duran's appeal beyond the burgeoning New Romantic scene. His guitar work lent the band a harder, more substantive musical underpinning, allowing them to resonate with both pop audiences and those who favored a more rock-oriented sound. This strategic blend was instrumental in their unprecedented success, leading to chart dominance worldwide and cementing their status as MTV pioneers.\n\nHowever, Taylor's association with the band was characterized by periods of departure and reunion. His initial exit in 1986 marked a significant inflection point, prompting a noticeable evolution in Duran Duran's sound. While the band continued to achieve commercial success, their subsequent output generally adopted a smoother, more atmospheric quality, often less reliant on the prominent guitar work that had defined their initial phase. A notable reunion occurred in the early 2000s, culminating in the critically acclaimed album \"Astronaut\" (2004), which saw a deliberate re-engagement with their earlier rock influences, largely attributed to Taylor's renewed involvement. Yet, his subsequent departure underscored the transient nature of this full original lineup.\n\nUltimately, Andy Taylor's \"rock edge\" was more than a mere stylistic choice; it was a transformative force that imbued Duran Duran with a unique sonic signature. His contributions were pivotal in establishing their original, groundbreaking identity, leaving an indelible imprint on their discography and ensuring his place as a key architect of their enduring musical heritage. The band's ability to adapt and thrive through various iterations speaks to their resilience, but the profound impact of Taylor's initial, defining guitar work remains a cornerstone of their legendary status.", "vocab": [{"word": "inextricably linked", "definition": "so closely connected that they cannot be separated."}, {"word": "formative contributions", "definition": "very important actions or influences that helped something develop its shape or character."}, {"word": "sonic identity", "definition": "the unique sound or musical style that defines a band or artist."}, {"word": "nascent", "definition": "just beginning to exist or develop."}, {"word": "emblematic", "definition": "serving as a symbol of a particular quality or concept; representative."}, {"word": "inflection point", "definition": "a moment when significant change occurs; a turning point."}, {"word": "transient nature", "definition": "the quality of lasting only for a short time; temporary."}, {"word": "indelible imprint", "definition": "a mark or effect that cannot be removed or forgotten."}]}}, "questions": [{"q": "What specific musical quality did Andy Taylor bring to Duran Duran?", "a": "Andy Taylor brought a \"rock edge\" to Duran Duran's music."}, {"q": "How did Duran Duran's sound generally change after Andy Taylor first left the band?", "a": "After Andy Taylor first left, Duran Duran's sound became generally smoother and less guitar-centric."}], "id": "aaff6784c5f", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxQNkxnb0RhaGZUbnJfdlllbElYMjZiWndoMzVFdnVob0xlZ191MmdEVXJKYjN0R0ZRTUFyT08weHFjZHBrQWFYMjctcHR6SnJDU3lFbnZQOURjM1JnNnM3OEpyZVFPeXp6NVNka3NDMm5sNUszQ05wUzNfOTNhelRfUEtpMkpycnIwRm9abmlrbTVJZjZZMGZPNGJQcjhTVlN1a0EzSGlZcFBSdnJUY0hwVQ?oc=5", "published": "2026-11-26T12:31:29+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
