ion and community Asbury Park Press", "levels": {"Beginner": {"text": "NJ Clearwater Festival celebrates music, conservation and community Asbury Park Press", "vocab": []}, "Intermediate": {"text": "NJ Clearwater Festival celebrates music, conservation and community Asbury Park Press", "vocab": []}, "Advanced": {"text": "NJ Clearwater Festival celebrates music, conservation and community Asbury Park Press", "vocab": []}}, "questions": [], "id": "af4a80659bd", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxPRGdVbjItWEV6M0xSeXhoX2N4R3BCVGQyWmFNWGJjWEFoei0zN0RVbmJ4YWVPUWJNSnRNNTloUGVfa29fakxVWTY3TWxTLUdZYTVJVjRKd2llUElwbkJqTkF2NklZQXJCbHFjYlgwZzFDbF9Ndk5kWXAzOC1ZYkhVMFBENUlDMzVIYk45SFFMcmlMVlQ3ZlJEVXdVeVhpMm8?oc=5", "published": "2026-09-06T07:25:00+09:00", "category": "entertainment"}, {"headline": "Two Las Vegas Strip shows closing, hundreds of entertainment workers losing jobs - FOX5 Vegas", "excerpt": "Two Las Vegas Strip shows closing, hundreds of entertainment workers losing jobs FOX5 Vegas", "levels": {"Beginner": {"text": "Two Las Vegas Strip shows closing, hundreds of entertainment workers losing jobs FOX5 Vegas", "vocab": []}, "Intermediate": {"text": "Two Las Vegas Strip shows closing, hundreds of entertainment workers losing jobs FOX5 Vegas", "vocab": []}, "Advanced": {"text": "Two Las Vegas Strip shows closing, hundreds of entertainment workers losing jobs FOX5 Vegas", "vocab": []}}, "questions": [], "id": "ae943af0eb8", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivAFBVV95cUxPUlFYZ2daNWUtbVY5SUE1blAtWHQyR2piVF9oekFLZ3ByaHZreE1mMFo2S1pwR3ZDYlNWSTFYMlZ0bEdNWnd0a1FPQnBKSTdSZDBRWXlPT21kWGRtTm5oQzNDN0E4cVdFbGRXbHpNUU9IeXlmS0pvUEtnUm9HZjI5U0ZwS3F1S1ZDQUdEMm14ZHZSZ2FvM2RMaUZlMzdNbVV3SUhfSkdqUUJsYUhoMlNndUNDek5rUmFFRGZBaw?oc=5", "published": "2026-09-06T07:24:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Climate Change to Bring More Air Travel Delays and Disruptions", "excerpt": "Air travelers may increasingly experience delays and diversions as climate change intensifies, bringing hotter temperatures and stormier skies.", "levels": {"Beginner": {"text": "Flying on an airplane might get harder in the future. Experts say that climate change is making the world hotter and storms stronger. This means more problems for planes and people who fly. \n\nWhen it is very hot, air becomes thinner. Planes need thicker air to lift off the ground easily. So, on very hot days, planes might need more time to take off, or they might have to carry less weight. This can cause delays. \n\nStrong storms are also a big problem. Thunderstorms and strong winds make it unsafe for planes to fly. Pilots might have to change their path or wait for the weather to clear. This means flights could be delayed or go to a different airport. These changes are called disruptions. \n\nPassengers will likely see more delays and flights going to new places. Airlines and airports are trying to find ways to deal with these weather changes. But travelers should be ready for more waiting and changes to their travel plans because of the weather.", "vocab": [{"word": "Experts", "definition": "People who know a lot about a specific topic."}, {"word": "Climate change", "definition": "Big changes in the world's weather over a long time."}, {"word": "Delays", "definition": "When something happens later than planned."}, {"word": "Disruptions", "definition": "Problems that stop something from continuing as usual."}, {"word": "Passengers", "definition": "People who travel in a vehicle, like a plane."}, {"word": "Airlines", "definition": "Companies that own and operate planes for travel."}]}, "Intermediate": {"text": "Air travel is facing growing challenges due to the intensifying effects of climate change. Experts warn that hotter temperatures and more frequent, severe storms will increasingly disrupt flights, leading to more delays and diversions for passengers. This trend suggests that travelers may need to adjust their expectations for future journeys.\n\nOne significant impact comes from rising global temperatures. Hotter air is less dense, which affects an aircraft's lift. For planes to take off safely, they require a certain amount of lift. On extremely hot days, especially at airports located at higher altitudes or with shorter runways, planes may need to reduce their weight by carrying less fuel or cargo, or they might require a longer takeoff run. This can result in flight delays, cancellations, or even restrictions on passenger numbers.\n\nFurthermore, climate change is contributing to more volatile weather patterns. This includes an increase in the intensity and frequency of thunderstorms, strong winds, and turbulence. Such conditions make flying hazardous, forcing pilots to alter flight paths, delay departures, or divert to alternative airports. Clear-air turbulence, which is invisible and difficult to predict, is also projected to become more common, posing additional safety and comfort concerns for passengers and crew.\n\nAviation authorities and airlines are actively exploring strategies to mitigate these challenges. These include developing more resilient infrastructure, improving weather forecasting technologies, and adapting operational procedures. However, the scale of the climate challenge means that passengers will likely experience a greater frequency of travel disruptions. Adapting to these new realities will be crucial for both the industry and its customers.", "vocab": [{"word": "Intensifying", "definition": "Becoming stronger or more extreme."}, {"word": "Disrupt", "definition": "To interrupt an event or process, causing problems."}, {"word": "Diversions", "definition": "When a flight changes its planned destination to land at a different airport."}, {"word": "Dense", "definition": "Having parts very close together; how much matter is in a certain space."}, {"word": "Volatile", "definition": "Changing rapidly and unpredictably, especially for the worse."}, {"word": "Turbulence", "definition": "Irregular motion of the air, causing a rough ride for aircraft."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}]}, "Advanced": {"text": "The global aviation industry is confronting an escalating array of operational challenges stemming from the accelerating impacts of climate change. A consensus among climate scientists and aviation experts indicates that a future characterized by hotter ambient temperatures and more extreme weather phenomena will inevitably lead to increased disruptions for air travelers, necessitating a fundamental shift in passenger expectations regarding punctuality and direct routes.\n\nOne of the most immediate and tangible consequences of a warming planet for aviation is the effect of elevated temperatures on aircraft performance. Hotter air is inherently less dense, which directly diminishes the aerodynamic lift generated by an aircraft's wings. This physical principle means that on exceptionally warm days, particularly at airports situated at higher altitudes or those with constrained runway lengths, aircraft may require significantly longer takeoff distances. To ensure safe operation, airlines might be compelled to implement weight restrictions, reducing fuel loads, cargo capacity, or even passenger numbers. Such operational adjustments frequently translate into flight delays, cancellations, and substantial logistical complexities for carriers.\n\nBeyond thermal challenges, climate change is also contributing to a marked increase in the frequency and intensity of severe weather events. This includes more powerful thunderstorms, stronger crosswinds, and an uptick in atmospheric turbulence. These conditions pose considerable safety risks, obliging pilots to navigate around hazardous weather systems, resulting in circuitous flight paths, prolonged holding patterns, or diversions to alternative airports. A particularly insidious aspect is the projected rise in clear-air turbulence (CAT), which is not associated with visible clouds and is therefore exceedingly difficult to detect with current onboard radar systems. The increased prevalence of CAT, often linked to amplified wind shear in the jet stream, presents significant discomfort and potential injury risks to passengers and crew, alongside operational inefficiencies.\n\nThe implications extend beyond mere inconvenience. Airlines face mounting pressure to adapt their fleets, infrastructure, and operational protocols. Investments in more robust weather forecasting technologies, the development of climate-resilient airport infrastructure, and the re-evaluation of flight planning strategies are becoming imperative. Regulatory bodies are also grappling with how to integrate these evolving climatic realities into air traffic management and safety standards.\n\nFor the traveling public, the message is clear: the era of predictable, uninterrupted air travel may be gradually receding. Passengers will likely need to cultivate a greater degree of flexibility and patience, as delays, diversions, and schedule alterations become more commonplace. While the industry strives to innovate and mitigate these effects, the pervasive influence of a changing climate on the very fabric of air travel is undeniable, demanding a collective adaptation from all stakeholders.", "vocab": [{"word": "Escalating", "definition": "Increasing rapidly in intensity or magnitude; becoming more extensive or serious."}, {"word": "Consensus", "definition": "A general agreement among a group of people; a shared opinion or position."}, {"word": "Inherent", "definition": "Existing in something as a permanent, essential, or characteristic attribute; intrinsic."}, {"word": "Aerodynamic", "definition": "Relating to the forces of air acting on objects in motion, such as aircraft."}, {"word": "Insidious", "definition": "Proceeding in a gradual, subtle way, but with harmful effects; treacherous."}, {"word": "Prevalence", "definition": "The fact or condition of being widespread or common at a particular time or in a particular place."}, {"word": "Imperative", "definition": "Of vital importance; crucial; a command or urgent necessity."}, {"word": "Pervasive", "definition": "Spreading widely throughout an area or a group of people; present everywhere."}]}}, "questions": [{"q": "What are two main ways climate change is expected to affect air travel?", "a": "Climate change is expected to make the world hotter and storms stronger, leading to more delays and diversions for flights."}, {"q": "Why might planes need to carry less weight on very hot days?", "a": "On very hot days, the air is less dense, which makes it harder for planes to get enough lift for takeoff. Carrying less weight helps ensure a safe takeoff."}], "id": "a8a97ce9af0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cm274p8m88lo?at_medium=RSS&at_campaign=rss", "published": "2026-09-06T08:20:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "UK Plans to Slash Paperwork for Small Businesses", "excerpt": "The UK government plans to significantly reduce the amount of paperwork small and medium-sized businesses need to complete, aiming to simplify rules.", "levels": {"Beginner": {"text": "The UK government wants to help small businesses. They plan to cut down on the amount of paperwork these businesses have to do. Paperwork means all the forms and documents companies must fill out regularly.\n\nJonathan Reynolds, who is in charge of business for the government, announced this plan. He said they want to make the rules simpler. Some small and medium-sized businesses (SMEs) might not have to fill out certain forms at all anymore. This change will save businesses time and money. It will make it easier for them to focus on their work and grow. Many small businesses find filling out forms takes a lot of effort. This new plan aims to make things simpler and help these companies succeed.", "vocab": [{"word": "paperwork", "definition": "Official forms and documents that need to be completed."}, {"word": "cut down", "definition": "To reduce the amount of something."}, {"word": "announced", "definition": "Made something known publicly."}, {"word": "simpler", "definition": "Easier to understand or do."}, {"word": "save time", "definition": "To use less time for a task."}]}, "Intermediate": {"text": "The United Kingdom government is moving to significantly reduce the administrative burden on its small and medium-sized enterprises (SMEs). Jonathan Reynolds, the Business Secretary, has announced plans to simplify corporate reporting rules and exempt some SMEs from specific form-filling requirements altogether. This initiative aims to free up valuable time and resources for businesses, allowing them to focus more on growth and innovation rather than compliance.\n\nSMEs are a vital part of the UK economy, employing a large percentage of the workforce and contributing significantly to economic output. However, they often face challenges due to the volume of regulatory paperwork they must complete. This can include financial reports, tax documents, and other official submissions. The current system can be time-consuming and costly, especially for smaller companies that may not have dedicated administrative staff.\n\nBy simplifying these rules, the government hopes to create a more business-friendly environment. The Business Secretary emphasized that reducing unnecessary bureaucracy will help these companies thrive, potentially leading to job creation and increased investment across the country. This move is expected to be widely welcomed by business owners who have long called for less red tape.", "vocab": [{"word": "administrative burden", "definition": "The amount of official work and tasks that need to be done."}, {"word": "enterprises", "definition": "Businesses or companies, especially small ones."}, {"word": "exempt", "definition": "To free someone or something from a duty or rule that others must follow."}, {"word": "corporate reporting", "definition": "The official documents and information that companies must provide about their finances and operations."}, {"word": "vital", "definition": "Extremely important or necessary."}, {"word": "bureaucracy", "definition": "A system of government or business where there are many complicated rules and processes."}]}, "Advanced": {"text": "The UK government is poised to implement significant reforms aimed at alleviating the administrative burden on the nation's small and medium-sized enterprises (SMEs). Business Secretary Jonathan Reynolds has unveiled a strategic initiative to streamline corporate reporting regulations and grant exemptions to certain SMEs from specific form-filling obligations entirely. This move is designed to liberate valuable time and resources for businesses, enabling them to channel their efforts into innovation, expansion, and productivity rather than compliance-related tasks.\n\nSMEs constitute the backbone of the British economy, accounting for a substantial proportion of employment and contributing significantly to the Gross Domestic Product. Despite their critical role, these businesses frequently contend with an onerous volume of regulatory paperwork, encompassing financial statements, tax declarations, and various statutory submissions. The existing regulatory framework can be both time-intensive and financially draining, particularly for nascent or smaller firms that may lack dedicated in-house administrative or legal departments.\n\nBy simplifying these intricate rules, the government endeavors to cultivate a more conducive environment for business growth and competitiveness. The Business Secretary underscored that a reduction in superfluous bureaucracy will empower these companies to flourish, potentially stimulating job creation, fostering investment, and enhancing overall economic dynamism across the country. This proactive approach is anticipated to garner widespread approbation from business advocacy groups and entrepreneurs who have consistently lobbied for a reduction in regulatory red tape. The reforms are expected to not only boost the operational efficiency of SMEs but also to reinforce the UK's appeal as a place to start and grow a business, aligning with broader governmental objectives for economic revitalization and fostering an entrepreneurial spirit.", "vocab": [{"word": "poised", "definition": "Ready and prepared to do something; in a state of readiness."}, {"word": "alleviating", "definition": "Making suffering, deficiency, or a problem less severe; easing."}, {"word": "streamline", "definition": "To make an organization or system more efficient and effective by simplifying procedures."}, {"word": "unveiled", "definition": "Revealed or announced something publicly for the first time."}, {"word": "onerous", "definition": "Involving a great deal of effort, trouble, or difficulty; burdensome."}, {"word": "conducive", "definition": "Making a certain situation or outcome likely or possible; favorable."}, {"word": "superfluous", "definition": "Unnecessary, especially through being more than enough."}, {"word": "approbation", "definition": "Approval or praise."}]}}, "questions": [{"q": "Who is the UK Business Secretary mentioned in the article?", "a": "The UK Business Secretary mentioned in the article is Jonathan Reynolds."}, {"q": "What is the main goal of the government's plan regarding paperwork for small businesses?", "a": "The main goal is to simplify corporate reporting rules and exempt some small and medium-sized enterprises (SMEs) from certain form-filling, thereby reducing their administrative burden and saving them time and money."}], "id": "a3dce07d35c", "source": "Business | The Guardian", "link": "https://www.theguardian.com/business/2026/sep/05/ministers-plan-to-slash-paperwork-rules-for-small-uk-businesses", "published": "2026-09-06T07:39:38+09:00", "category": "business", "category_title": "Business"}, {"headline": "Climate Change Brings Bumpy Skies, More Flight Delays", "excerpt": "Air travelers may face increasing disruptions like delays and diversions as global warming leads to hotter temperatures and more severe storms.", "levels": {"Beginner": {"text": "Climate change is making our world warmer and causing more big storms. This is starting to affect how planes fly. When the air gets hotter, it becomes thinner. Thinner air makes it harder for planes to take off because their wings need denser air to lift them up. This means planes might need longer runways, or they might have to carry less weight, like fewer bags or less fuel.\n\nAlso, we are seeing more strong storms and heavy winds. These storms are dangerous for planes. Pilots might have to fly around them, which makes the trip longer. Sometimes, flights have to land at a different airport, or they get delayed for many hours. In some cases, flights are cancelled completely for safety.\n\nSo, if you travel by plane, you might notice more changes to your flights. Airlines and airports are trying to find ways to deal with these new weather problems. But for now, passengers should be ready for more possible delays and changes when they fly, all because of a changing climate.", "vocab": [{"word": "warmer", "definition": "a little hot, not cold."}, {"word": "thinner", "definition": "not thick; less dense, like air that is hot."}, {"word": "lift", "definition": "the force that makes an airplane go up into the air."}, {"word": "dangerous", "definition": "not safe; can cause harm."}, {"word": "delayed", "definition": "made to wait; happening later than planned."}, {"word": "cancelled", "definition": "stopped; decided that something will not happen."}]}, "Intermediate": {"text": "Global climate change is increasingly impacting the aviation industry, leading to more challenging conditions for air travel. As the Earth's temperatures rise, the air becomes less dense. This reduced air density presents a significant issue for aircraft, particularly during takeoff. Planes rely on air density to generate lift over their wings. In hotter, less dense air, aircraft require longer runways to achieve the necessary speed for liftoff, or they must reduce their weight by carrying less fuel, fewer passengers, or less cargo. This can lead to operational inefficiencies and increased costs for airlines.\n\nBeyond temperature, climate change is also contributing to more frequent and intense extreme weather events. This includes severe thunderstorms, stronger winds, and increased turbulence. Such conditions pose direct safety risks and operational hurdles for flights. Pilots are often forced to alter flight paths to avoid dangerous weather, resulting in longer travel times and increased fuel consumption. Flights may be diverted to alternative airports, experience significant delays, or even be cancelled entirely to ensure passenger safety.\n\nThe cumulative effect of these changes means that air passengers are likely to experience more disruptions in their travel plans. The aviation sector is actively exploring strategies to adapt, such as developing more resilient aircraft, improving weather forecasting technologies, and adjusting air traffic management systems. However, these adaptations take time, and in the interim, travelers should anticipate a future with potentially more unpredictable and disrupted air journeys due to the evolving climate.", "vocab": [{"word": "impacting", "definition": "having a strong effect on something."}, {"word": "density", "definition": "how much matter is in a certain space; how thick or heavy something is."}, {"word": "generate", "definition": "to produce or create something."}, {"word": "extreme", "definition": "very great or severe; far beyond the usual or average."}, {"word": "turbulence", "definition": "sudden, violent movements of air that make a plane shake."}, {"word": "diverted", "definition": "sent in a different direction from the planned route."}, {"word": "disruptions", "definition": "problems that stop something from continuing as usual."}]}, "Advanced": {"text": "The global aviation sector is confronting a growing array of operational challenges stemming directly from the accelerating impacts of climate change. A primary concern is the phenomenon of rising atmospheric temperatures, which directly correlates with a decrease in air density. According to fundamental aerodynamic principles, aircraft generate lift by moving through air; less dense air necessitates greater speed or a longer distance to achieve the required lift for takeoff. This translates into practical limitations for airlines, potentially requiring longer runway lengths, imposing weight restrictions (fewer passengers, less cargo, or reduced fuel loads), and consequently, diminishing fuel efficiency and increasing operational costs. Such constraints are particularly acute at airports situated in hot climates or at high altitudes.\n\nFurthermore, climate change is widely projected to intensify the frequency and severity of extreme weather events. This includes more powerful thunderstorms, stronger crosswinds, and an increase in clear-air turbulence, which is particularly challenging to predict. These meteorological shifts compel airlines and air traffic control to implement more frequent flight path alterations, leading to extended flight times, higher fuel consumption, and increased carbon emissions. Diversions to alternative airports, prolonged ground delays, and outright flight cancellations are becoming more common occurrences, directly impacting passenger convenience and airline schedules. The economic ramifications extend beyond fuel costs, encompassing compensation for delayed passengers, rebooking expenses, and the broader logistical complexities of managing disrupted networks.\n\nThe industry is actively pursuing adaptive strategies. These include investments in more robust aircraft designs capable of operating efficiently in diverse conditions, advancements in meteorological forecasting to provide more precise and timely warnings, and the development of sophisticated air traffic management systems that can dynamically adjust flight paths to circumvent adverse weather. There is also a growing emphasis on sustainable aviation fuels and electric propulsion to mitigate aviation's own contribution to climate change. However, the pace of climate change often outstrips the rate of adaptation, suggesting that while solutions are being sought, passengers should prepare for a future where air travel is inherently more susceptible to environmental disruptions. The imperative for both mitigation and adaptation within aviation has never been more critical.", "vocab": [{"word": "confronting", "definition": "dealing with a difficult situation or problem directly."}, {"word": "accelerating", "definition": "increasing in speed or rate."}, {"word": "aerodynamic", "definition": "relating to the way air moves around things, especially planes, and how this affects their movement."}, {"word": "acute", "definition": "very serious or severe; keenly felt."}, {"word": "meteorological", "definition": "relating to the study of weather and weather conditions."}, {"word": "ramifications", "definition": "the complicated and unexpected results of an action or decision."}, {"word": "susceptible", "definition": "easily affected by something; vulnerable to."}, {"word": "imperative", "definition": "extremely important or urgent; a necessity."}]}}, "questions": [{"q": "What are two main ways climate change is affecting air travel, according to the articles?", "a": "Climate change is making the air hotter and thinner, and it is causing more frequent and intense extreme weather events like storms and strong winds."}, {"q": "Why might planes need longer runways or carry less weight in hotter weather?", "a": "In hotter weather, the air becomes less dense. Planes need denser air to generate enough lift for takeoff, so they might need more speed (requiring longer runways) or less weight to get off the ground safely."}], "id": "a8a97ce9af0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cm274p8m88lo?at_medium=RSS&at_campaign=rss", "published": "2026-09-06T08:20:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "France Debates Radical Plan to Cancel Central Bank Debt", "excerpt": "A prominent French politician proposes canceling government debt held by the central bank to ease the nation's financial burden.", "levels": {"Beginner": {"text": "France has a lot of money it needs to pay back. This is called national debt. It means the government owes money.\n\nA politician named Jean-Luc Mélenchon has an idea. He wants to cancel some of this debt. This debt is held by the central bank. A central bank is like a country's main bank. It helps manage money for the government.\n\nMélenchon's plan means the government would not have to pay back this money. He thinks this would help France. The country could then use more money for important things like schools or hospitals.\n\nSome people think this is a good idea. They say it will make France's money problems smaller. They believe it will help the country grow stronger.\n\nBut other people are worried. They say canceling debt could cause new problems. For example, prices for everyday things might go up a lot. This is called inflation. They also worry it could make people trust France's money system less.\n\nSo, there is a big discussion in France about this plan. People are thinking about the good parts and the bad parts of canceling central bank debt.", "vocab": [{"word": "Debt", "definition": "Money that one person or country owes to another."}, {"word": "Politician", "definition": "A person who works in government."}, {"word": "Central bank", "definition": "The main bank of a country, which manages its money supply."}, {"word": "Cancel", "definition": "To stop something from happening or existing; here, to stop owing money."}, {"word": "Inflation", "definition": "When prices for goods and services go up, and money buys less."}, {"word": "Trust", "definition": "To believe that someone or something is good, honest, or effective."}]}, "Intermediate": {"text": "France is currently facing significant financial challenges, largely due to its high national debt. This debt has grown, especially after the government spent a lot of money to support the economy during recent crises.\n\nIn response to this situation, Jean-Luc Mélenchon, a well-known left-wing politician and leader of the La France Insoumise (France Unbowed) party, has proposed a radical economic solution. His plan involves canceling a substantial portion of the French government's debt that is currently held by the European Central Bank (ECB).\n\nThe ECB, which is the central bank for countries using the euro, acquired a large amount of government bonds, including those from France, through programs designed to support the eurozone economy, such as quantitative easing. Mélenchon argues that this debt, effectively owed by the government to its own central bank system, should simply be written off.\n\nProponents of this idea suggest that canceling this debt would significantly reduce France's overall debt burden. This, they argue, would free up substantial funds that could then be invested in public services, social programs, or initiatives aimed at ecological transition, without needing to raise taxes or cut other essential spending.\n\nHowever, Mélenchon's proposal has met with strong opposition and warnings from many economists and financial institutions. Critics raise several serious concerns. They warn that such a move could lead to high inflation, as it might be seen as the central bank effectively printing money to finance government spending. This could devalue the euro and make everyday goods more expensive for citizens.\n\nFurthermore, opponents argue that canceling central bank debt would undermine the independence of the ECB, which is crucial for maintaining economic stability. It could also violate European Union treaties that prohibit monetary financing of governments. There are also fears that it could damage investor confidence in France and the wider eurozone, potentially making it more expensive for governments to borrow money in the future. The debate highlights the complex choices France faces in managing its economic future.", "vocab": [{"word": "National debt", "definition": "The total amount of money that a country's government has borrowed."}, {"word": "Radical", "definition": "Extreme or far-reaching, especially in politics or economics."}, {"word": "Propose", "definition": "To suggest a plan or idea for people to consider."}, {"word": "European Central Bank (ECB)", "definition": "The central bank for the euro area, responsible for monetary policy."}, {"word": "Quantitative easing", "definition": "A monetary policy where a central bank buys government bonds or other financial assets to inject money into the economy."}, {"word": "Proponents", "definition": "People who support an idea or plan."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Undermine", "definition": "To weaken or damage something, especially gradually or insidiously."}]}, "Advanced": {"text": "France is grappling with persistent fiscal challenges, marked by a national debt that has swelled considerably, particularly in the wake of the COVID-19 pandemic and subsequent energy crises. This substantial debt burden constrains the government's fiscal space and fuels ongoing debates about economic policy and future spending priorities.\n\nAgainst this backdrop, Jean-Luc Mélenchon, the influential leader of the left-wing La France Insoumise (LFI) party, has reignited discussions with his long-standing and often controversial proposal: the cancellation of a significant portion of French government debt held by the European Central Bank (ECB). Mélenchon, a prominent figure of the radical left, has consistently advocated for heterodox economic policies, challenging mainstream orthodoxies regarding public finance and monetary policy.\n\nHis plan specifically targets the government bonds acquired by the ECB through various asset purchase programs, such as the Pandemic Emergency Purchase Programme (PEPP) and the Asset Purchase Programme (APP). From Mélenchon's perspective, this debt is fundamentally different from debt owed to private investors. He argues that debt held by the central bank is \"owed to ourselves\" – an accounting entry within the public sector rather than a genuine financial liability that requires repayment in the traditional sense. Canceling this debt, he contends, would liberate the state from a substantial fiscal obligation, thereby creating significant budgetary room for vital public investments, particularly in areas like ecological transition, social welfare, and public services, without resorting to austerity measures or increased taxation.\n\nHowever, this radical proposition faces formidable opposition from mainstream economists, financial institutions, and political centrists. Critics articulate a range of serious concerns regarding the potential ramifications. A primary worry is the risk of triggering rampant inflation. They argue that such a cancellation could be perceived as a form of monetary financing of governments, effectively printing money to fund state expenditure. This could erode confidence in the euro, devalue the currency, and lead to a sharp increase in consumer prices, severely impacting citizens' purchasing power.\n\nFurthermore, opponents emphasize that debt cancellation would severely compromise the independence of the ECB, a cornerstone of its credibility and its ability to maintain price stability across the eurozone. They point to Article 123 of the Treaty on the Functioning of the European Union (TFEU), which explicitly prohibits monetary financing of governments by the central bank. A unilateral cancellation, even if conceptually different from direct financing, could be interpreted as a circumvention of this fundamental rule, potentially leading to legal challenges and undermining the entire institutional framework of the eurozone.\n\nBeyond legal and inflationary concerns, there are significant worries about market confidence. Such a move could deter international investors, raising France's future borrowing costs and potentially destabilizing financial markets across the continent. It could also set a dangerous precedent, encouraging other highly indebted member states to demand similar write-offs, thereby fostering fiscal indiscipline and jeopardizing the long-term stability of the euro area. While Mélenchon's ideas are often dismissed by the establishment, they reflect a growing public frustration with traditional debt management strategies and highlight the ongoing tension between fiscal prudence and the demand for increased public spending in a challenging economic environment.", "vocab": [{"word": "Fiscal challenges", "definition": "Difficulties related to government revenue, spending, and debt."}, {"word": "Heterodox", "definition": "Not conforming to accepted or orthodox standards or beliefs, especially in economics."}, {"word": "Liability", "definition": "A thing for which someone is responsible, especially a debt or financial obligation."}, {"word": "Austerity measures", "definition": "Strict economic policies implemented by a government to reduce public debt, typically by cutting spending."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "Rampant", "definition": "Flourishing or spreading unchecked, often in a negative sense (e.g., rampant inflation)."}, {"word": "Monetary financing", "definition": "The practice of a central bank directly funding government spending, often by buying government debt."}, {"word": "Precedent", "definition": "An earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}]}}, "questions": [{"q": "What is Jean-Luc Mélenchon's main proposal regarding France's national debt?", "a": "He proposes canceling a significant portion of the French government's debt that is held by the European Central Bank (ECB)."}, {"q": "What are two main concerns raised by critics of Mélenchon's plan?", "a": "Critics are concerned about the risk of high inflation and the potential for undermining the independence of the European Central Bank (ECB)."}], "id": "a4764e01313", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxPTVd4RmhRMUpZSzFQQW5ONVE1SzdnZzhQSkZSdEYxMl9Xbmk4Sm5ubnI5eU1oel9XTU9tYjE3MnhqWlJCTlMySktqQW5jR1JNSzBlc2dkTkZIeVFkVkhpb09vdmpIV3pIc1EzQ09DWFRvbWVNdTdxS3E1aC1zamxvQnR1ejRUYmJiUllMSjI1MWNpcTFUOVB6cVJjWHdIbEhTOXRF?oc=5", "published": "2026-09-06T07:48:21+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US and Iran Trade Ship Attacks Amid Rising Tensions", "excerpt": "The United States and Iran have reportedly launched retaliatory attacks on ships, marking a dangerous escalation in their ongoing conflict.", "levels": {"Beginner": {"text": "News reports say that the United States and Iran have attacked each other's ships. The US government said it hit three oil ships that belong to Iran. At the same time, Iran said it attacked three ships that have ties to the US. These attacks happened in the sea, making the area more dangerous for boats carrying goods. This is part of a bigger problem between the two countries. They have been in conflict for a long time. The US has put rules, called sanctions, on Iran, which makes it hard for Iran to sell its oil. Iran often uses ships to move its oil to other countries. The sea where these attacks happened is very important for world trade, especially for oil. When ships are attacked, it can make things more expensive for everyone. People around the world are watching this situation closely because they are worried about more fighting.", "vocab": [{"word": "hit", "definition": "To strike or make contact with something, often with force."}, {"word": "belong", "definition": "To be owned by someone or something."}, {"word": "ties", "definition": "Connections or links between people or things."}, {"word": "conflict", "definition": "A serious disagreement or fight."}, {"word": "sanctions", "definition": "Official orders or laws that limit trade or contact with a country, often to punish it."}, {"word": "worried", "definition": "Feeling anxious or concerned about something."}]}, "Intermediate": {"text": "A recent escalation in tensions between the United States and Iran has led to both nations reporting retaliatory attacks on ships. The US government stated that its forces struck three Iranian oil tankers. Concurrently, Iran announced that it had targeted three vessels with links to the United States. These incidents are part of a long-standing and complex rivalry between Washington and Tehran, often referred to as a 'shadow war' in the Middle East. The attacks reportedly took place in crucial maritime regions, which are vital for global trade, particularly for the transport of oil. The Strait of Hormuz and the Red Sea are examples of such strategic waterways where much of the world's oil supply passes. The US has imposed strict economic sanctions on Iran, aiming to curb its nuclear program and support for regional proxy groups. In response, Iran has sometimes threatened or acted against shipping in these sensitive areas. Such actions raise concerns about the safety of international shipping and could potentially disrupt global oil markets, leading to higher prices. The international community is closely monitoring these developments, fearing that further aggression could destabilize an already volatile region and potentially draw in other international actors.", "vocab": [{"word": "escalation", "definition": "A rapid increase; a rise to a higher level."}, {"word": "retaliatory", "definition": "Done in return for an injury or offense; striking back."}, {"word": "concurrently", "definition": "Happening at the same time."}, {"word": "rivalry", "definition": "Competition for the same objective or for superiority."}, {"word": "maritime", "definition": "Connected with the sea, especially in relation to seafaring commercial or military activity."}, {"word": "sanctions", "definition": "Official orders or laws that limit trade or contact with a country, often to punish it."}, {"word": "destabilize", "definition": "To make something unstable or cause it to lose balance."}]}, "Advanced": {"text": "The long-simmering geopolitical tensions between the United States and Iran have flared into direct, albeit unconfirmed, retaliatory maritime attacks. Washington reported that its forces successfully targeted three Iranian oil tankers, while Tehran simultaneously claimed to have struck three vessels with demonstrable links to the US. These incidents represent a significant and dangerous escalation in the protracted 'shadow war' that has characterized the relationship between the two adversaries across the Middle East. The attacks reportedly occurred in strategic waterways, such as the Strait of Hormuz and the Red Sea, which are indispensable conduits for a substantial portion of global oil shipments and international commerce. The broader context for these actions includes the stringent economic sanctions imposed by the US on Iran, designed to curtail its nuclear ambitions and its funding of regional proxy groups. Iran, in turn, has frequently threatened to disrupt shipping in these sensitive maritime domains as leverage against these punitive measures. The immediate ramifications of such hostilities extend to the security of international shipping lanes, potentially leading to increased insurance premiums for vessels and a spike in global crude oil prices, thereby impacting economies worldwide. Beyond the economic sphere, there is profound concern within the international community that these tit-for-tat exchanges could further destabilize an already volatile region, risking miscalculation and broader military engagement. Analysts are closely scrutinizing the precise nature of these attacks and the potential for a cascading series of responses that could draw in other regional and international actors, transforming a localized confrontation into a wider conflict with unpredictable consequences for global security and energy markets.", "vocab": [{"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "retaliatory", "definition": "Characterized by returning an injury or wrong; striking back in kind."}, {"word": "protracted", "definition": "Lasting for a long time or longer than expected or usual."}, {"word": "adversaries", "definition": "One's opponent in a contest, conflict, or dispute; enemies."}, {"word": "indispensable", "definition": "Absolutely necessary or essential."}, {"word": "stringent", "definition": "Strict, precise, and exacting."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "scrutinizing", "definition": "Examining or inspecting something closely and thoroughly."}]}}, "questions": [{"q": "What did the US government claim to have done?", "a": "The US government claimed to have hit three Iranian oil tankers."}, {"q": "What did Iran claim to have done?", "a": "Iran claimed to have targeted three ships linked to the US."}], "id": "a2e633eccf7", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cj64rrne643o?at_medium=RSS&at_campaign=rss", "published": "2026-09-06T07:44:07+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "US-Linked Individuals Meet Putin Amid Ukraine Tensions", "excerpt": "Americans Steve Witkoff and Jared Kushner, with past US ties, met Russian President Vladimir Putin in Moscow for Ukraine talks.", "levels": {"Beginner": {"text": "Americans Steve Witkoff and Jared Kushner recently met with Russian President Vladimir Putin in Moscow. They talked about the situation in Ukraine. Footage showed Mr. Putin greeting them. He said that the current situation \"is not so easy.\"\n\nThis meeting happened while there is a war in Ukraine. Russia and Ukraine have been fighting for a long time. Many countries around the world want the fighting to stop. The United States supports Ukraine in this conflict.\n\nMr. Witkoff is a businessman. Mr. Kushner worked for the US government before. He was an advisor to former President Donald Trump. They are not working for the current US government now.\n\nMeetings like this are important because they can help people talk about peace. Even if they are not official government talks, they show that different sides are trying to communicate. Everyone hopes for a peaceful end to the conflict in Ukraine.", "vocab": [{"word": "met", "definition": "came together with someone."}, {"word": "situation", "definition": "the way things are at a certain time."}, {"word": "war", "definition": "fighting between countries or groups."}, {"word": "supports", "definition": "helps or gives aid to."}, {"word": "peace", "definition": "a time when there is no war or fighting."}, {"word": "communicate", "definition": "to share information or ideas with others."}]}, "Intermediate": {"text": "Two prominent Americans, Steve Witkoff and Jared Kushner, recently held a meeting with Russian President Vladimir Putin in Moscow. The encounter, captured on footage, showed Putin greeting the individuals before remarking that the current situation \"is not so easy.\" This meeting comes amidst the ongoing and severe conflict in Ukraine, which has deeply impacted international relations.\n\nBoth Witkoff, a real estate developer, and Kushner, who served as a senior advisor in the Trump administration, are private citizens. They are not currently representing the official US government. However, their past connections to American political circles, particularly the previous administration, lend a certain informal weight to such discussions. The purpose of their visit, according to reports, was to engage in \"Ukraine talks,\" suggesting an effort to explore potential avenues for de-escalation or resolution.\n\nThe conflict in Ukraine, which began with a full-scale invasion by Russia in February 2022, has led to widespread destruction and a significant humanitarian crisis. The United States has been a staunch supporter of Ukraine, providing substantial military and financial aid. While official diplomatic channels between Washington and Moscow remain strained, unofficial or back-channel discussions sometimes occur in an attempt to find common ground or convey messages.\n\nPutin's comment about the situation not being \"easy\" likely reflects the complexities and challenges inherent in the current geopolitical landscape. Such meetings, even if informal, highlight the persistent global interest in finding a path towards peace and stability in Eastern Europe.", "vocab": [{"word": "prominent", "definition": "important and well-known."}, {"word": "encounter", "definition": "a meeting, especially one that is unexpected or brief."}, {"word": "amidst", "definition": "in the middle of or during."}, {"word": "private citizens", "definition": "people who are not working for the government."}, {"word": "avenues", "definition": "ways or methods of approaching something."}, {"word": "staunch", "definition": "very loyal and committed."}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}]}, "Advanced": {"text": "In a development that has drawn considerable attention, American real estate magnate Steve Witkoff and former White House senior advisor Jared Kushner recently held a meeting with Russian President Vladimir Putin in Moscow. Footage of the encounter depicted Putin extending greetings to the two individuals, subsequently remarking that the prevailing situation \"is not so easy.\" This high-profile interaction unfolds against the backdrop of the protracted and devastating conflict in Ukraine, which continues to exert immense pressure on global geopolitical stability.\n\nIt is crucial to contextualize the status of Witkoff and Kushner. Both are private citizens and do not hold official positions within the current US administration. Kushner, notably, served as a key advisor to his father-in-law, former President Donald Trump, and Witkoff is a prominent businessman with known ties to Trump. Their presence in Moscow, therefore, represents an unofficial engagement, distinct from formal diplomatic overtures between the United States government and the Kremlin. Reports indicate the discussions centered on \"Ukraine talks,\" suggesting an exploratory effort to ascertain potential pathways for de-escalation or future peace initiatives.\n\nThe full-scale invasion of Ukraine by Russia in February 2022 initiated a profound humanitarian catastrophe and reshaped the international order. The United States has been a principal architect of the international response, providing unprecedented levels of military, financial, and humanitarian assistance to Kyiv, while simultaneously imposing extensive sanctions on Moscow. Official diplomatic channels between Washington and Moscow have largely atrophied, making any direct communication, even through unofficial intermediaries, a subject of intense scrutiny.\n\nPutin's characterization of the situation as \"not so easy\" is open to interpretation but likely underscores the multifaceted complexities of the conflict, the entrenched positions of the belligerents, and the significant obstacles to a diplomatic resolution. Such a statement could be a candid assessment of the war's trajectory, a subtle signal of Russia's willingness to engage, or a rhetorical maneuver.\n\nWhile the precise objectives and outcomes of this particular meeting remain opaque, its occurrence highlights the persistent, albeit often informal, efforts by various actors to navigate the intricate web of international relations during times of acute crisis. Unofficial engagements, sometimes referred to as \"track two diplomacy,\" can occasionally serve as conduits for conveying messages or sounding out possibilities when formal channels are gridlocked. However, their efficacy is often limited by their lack of official mandate and the inherent distrust between warring parties. The meeting underscores the enduring global imperative to seek avenues for peace and stability in a region ravaged by conflict.", "vocab": [{"word": "magnate", "definition": "a wealthy and influential person, especially in business."}, {"word": "protracted", "definition": "lasting for a long time or longer than expected or usual."}, {"word": "contextualize", "definition": "to place (a word, event, etc.) in a context to make its meaning clearer."}, {"word": "overtures", "definition": "an approach or proposal made to someone with the aim of opening negotiations or establishing a relationship."}, {"word": "ascertain", "definition": "to find something out for certain; make sure of."}, {"word": "atrophied", "definition": "(of a body part or tissue) wasted away, typically due to the degeneration of cells, or become vestigial during evolution. (Used metaphorically for diplomatic channels becoming weak/unused)."}, {"word": "belligerents", "definition": "nations or parties engaged in war or conflict."}, {"word": "opaque", "definition": "not transparent; difficult to understand or explain."}]}}, "questions": [{"q": "Who were the two Americans who met with Vladimir Putin in Moscow?", "a": "The two Americans who met with Vladimir Putin were Steve Witkoff and Jared Kushner."}, {"q": "What did Vladimir Putin say about the current situation during the meeting?", "a": "Vladimir Putin said that the current situation \"is not so easy.\""}], "id": "ade31b05e0b", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cx2zqp46g8eo?at_medium=RSS&at_campaign=rss", "published": "2026-09-06T06:39:02+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Argentina 28-28 Australia: Pumas and Wallabies fight out thrilling draw in second Test", "excerpt": "Australia secure series win in Argentina for first time in history after an eight-try slugfest ends in a draw. It’s not a packed house unfor", "levels": {"Beginner": {"text": "Australia secure series win in Argentina for first time in history after an eight-try slugfest ends in a draw. It’s not a packed house unfortunately. Perhaps its economic reasons, perhaps it’s a sign of the sport’s popularity, or perhaps it’s because Australia aren’t a major draw. Continue reading...", "vocab": []}, "Intermediate": {"text": "Australia secure series win in Argentina for first time in history after an eight-try slugfest ends in a draw. It’s not a packed house unfortunately. Perhaps its economic reasons, perhaps it’s a sign of the sport’s popularity, or perhaps it’s because Australia aren’t a major draw. Continue reading...", "vocab": []}, "Advanced": {"text": "Australia secure series win in Argentina for first time in history after an eight-try slugfest ends in a draw. It’s not a packed house unfortunately. Perhaps its economic reasons, perhaps it’s a sign of the sport’s popularity, or perhaps it’s because Australia aren’t a major draw. Continue reading...", "vocab": []}}, "questions": [], "id": "ad16b65df17", "source": "Sport | The Guardian", "link": "https://www.theg const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
