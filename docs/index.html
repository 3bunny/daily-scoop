ys of entertainment mystateline.com", "vocab": []}}, "questions": [], "id": "ae38f5f6b6c", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxOblJpSEdxSlJRN1hiU3NYVEZ2aUNSUk5RS0tNODdPWkZoS01pYTNXYmxFcTJNTERiYnBKRGJXSXFmNFpxMG1CdjNmbzd2VTR6c01scS0tcUN5SmtwUExYR2ZkSG1OTFFnWnhSZXUxQ256dzhjM3djVGtpTGlvdDM3VXg0OVhPNUF6dHFyZC1XeC1BZkdDS0FTb1VfOHhhRXNyY2Zpcl9QR2VQaGtF0gGyAUFVX3lxTE5LT3pBMFNBQzlMY3p4RzlWQ290MW1tVzBCODBhSDBYRjFwWVgyNnd0aG9zN1ItSzZkM0NrQnRiZFh0Q19DQndIQVE1eXZMWC1wb3cxbldpYXBrODlyUXpOdVhvTkhCMDRzUG14U2gtb1o1cUVRRDduc0QybmRtenNqeXV2djFYRG5UZk52OVBjQk1vcFNpdVBTUEg4NGxKVThYV1JsaUwtenFzM3dlU1NPeEE?oc=5", "published": "2026-08-11T06:46:01+09:00", "category": "entertainment"}]}], "home": [{"headline": "Milpitas Council Puts Business Tax on November Ballot", "excerpt": "The Milpitas City Council has decided to let voters decide on a new business tax measure in the upcoming November election.", "levels": {"Beginner": {"text": "The city of Milpitas will ask its people to vote on a new business tax. The Milpitas City Council made this decision recently. They voted to put a \"business tax measure\" on the November ballot.\n\nWhat is a business tax? It is money that companies pay to the city. This money helps the city pay for important things. For example, it can help pay for police, fire fighters, parks, and keeping streets clean. These are called city services.\n\nThe City Council wants the people of Milpitas to decide if they want this new tax. When something is on the \"ballot,\" it means people will vote on it during an election. The election will be in November.\n\nIf voters say \"yes\" to the measure, businesses in Milpitas will pay a new tax. This could bring more money to the city. This money would help improve city services for everyone living in Milpitas. The council believes this tax could help the city have enough money for its needs.", "vocab": [{"word": "vote", "definition": "to choose someone or something in an election"}, {"word": "measure", "definition": "a plan or proposal that people vote on"}, {"word": "ballot", "definition": "a piece of paper used for voting in an election"}, {"word": "city", "definition": "a large town"}, {"word": "services", "definition": "things that a city provides for its people, like police or parks"}, {"word": "money", "definition": "coins or notes used to buy things"}]}, "Intermediate": {"text": "The Milpitas City Council has taken a significant step by voting to place a new business tax measure on the November ballot. This decision means that residents of Milpitas will have the final say on whether businesses operating within the city will pay an additional tax.\n\nA business tax is a levy imposed on companies to generate revenue for municipal services. Cities often use these funds to support essential public services such as police and fire departments, maintain parks and public spaces, fund libraries, and improve local infrastructure like roads and public transportation. The council's move suggests a potential need to bolster the city's financial resources.\n\nBy putting the measure on the ballot, the City Council is engaging in a democratic process, allowing the electorate to directly approve or reject the proposal. This approach ensures that the community has a direct voice in important fiscal decisions that could impact both local businesses and the quality of life for residents. The election is scheduled for November, giving voters time to consider the implications of the proposed tax.\n\nSupporters of the measure argue that new revenue is crucial for maintaining and enhancing city services, especially as Milpitas continues to grow. They believe that businesses, which benefit from the city's infrastructure and workforce, should contribute more to its upkeep. Opponents, however, might express concerns that such a tax could increase operational costs for businesses, potentially affecting their ability to grow or even leading some to consider relocating. The upcoming months will likely see public discussions and debates leading up to the crucial November vote.", "vocab": [{"word": "significant", "definition": "important or noticeable"}, {"word": "measure", "definition": "a proposed law or plan that people vote on"}, {"word": "revenue", "definition": "money that a government or organization receives from taxes or other sources"}, {"word": "municipal", "definition": "relating to a city or town or its governing body"}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., roads, buildings, power supplies) needed for the operation of a society or enterprise"}, {"word": "electorate", "definition": "all the people in a country or area who are entitled to vote in an election"}, {"word": "implications", "definition": "the possible results or effects of something"}]}, "Advanced": {"text": "The Milpitas City Council has made a pivotal decision, opting to present a new business tax measure to the city's electorate on the upcoming November ballot. This move signifies a direct appeal to voters to weigh in on a fiscal policy that could reshape the city's revenue streams and impact its economic landscape.\n\nA business tax, in this context, is a municipal levy designed to generate additional funds for public services. Cities frequently implement such taxes to augment their budgets, supporting critical functions like public safety, urban planning, park maintenance, and the upkeep of vital infrastructure. The Council's initiative underscores a potential strategic effort to address evolving budgetary demands and ensure the sustained provision of high-quality city services amidst growth and inflation.\n\nThe decision to place this proposal directly before the voters through a ballot measure is a testament to direct democracy, empowering the citizenry to make a definitive choice on local taxation. This process allows for extensive public deliberation and debate, ensuring that the community's preferences are directly reflected in the city's financial framework. The November election will therefore serve as a critical juncture for Milpitas residents to determine their collective fiscal priorities.\n\nAdvocates for the measure typically articulate that a new revenue stream is indispensable for bolstering the city's capacity to maintain and enhance essential services, particularly as the city experiences demographic and economic expansion. They contend that businesses, benefiting from the city's robust infrastructure, skilled workforce, and consumer base, should contribute equitably to the public coffers that facilitate their operations. Conversely, critics often voice apprehension that increased taxation could impose an undue burden on local enterprises, potentially stifling economic vitality, deterring new investments, or even prompting businesses to consider relocating to more fiscally lenient jurisdictions. The ensuing months are anticipated to feature robust public discourse, with various stakeholders articulating their perspectives on the potential economic ramifications and societal benefits of the proposed tax, culminating in a consequential vote that will shape Milpitas's financial future.", "vocab": [{"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else; central and essential."}, {"word": "electorate", "definition": "all the people in a country or area who are entitled to vote in an election."}, {"word": "fiscal", "definition": "relating to government revenue, especially taxes, or public finances."}, {"word": "revenue streams", "definition": "the income generated from a particular product or service, or from a specific source, for an organization or government."}, {"word": "municipal", "definition": "relating to a city or town or its governing body."}, {"word": "augment", "definition": "to make something greater by adding to it; increase."}, {"word": "indispensable", "definition": "absolutely necessary or essential."}, {"word": "economic vitality", "definition": "the strength and health of an economy, often characterized by growth, innovation, and job creation."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event, especially one that is not immediately obvious."}]}}, "questions": [{"q": "What did the Milpitas City Council vote to put on the November ballot?", "a": "The Milpitas City Council voted to put a business tax measure on the November ballot."}, {"q": "What kind of services might the money from a business tax help fund in Milpitas?", "a": "The money from a business tax might help fund services like police, fire departments, parks, libraries, and improving local infrastructure."}], "id": "ac502fb89f9", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxOQk44OUJsbGJWbDNZc0x2N0VjeU5vS1FWLTRQSUx1bmRCMWlMbHFILVJlMXN3cWh4OFMyZW9ybXQ4b0JlWDN2X0dkbmRGaTJ2VndWbjEzbjNub3RYR015VGF0dUFNc20weWF4WGJWVVFieE50a001dEtZNUZ0dnNXaWZkZHgta2xyZUVVYVRlYU1IWW9qd0ZuOW12R29aWVJw?oc=5", "published": "2026-08-11T07:20:59+09:00", "category": "business", "category_title": "Business"}, {"headline": "New Haven Prepares for Record Black Wall Street Week Business Turnout", "excerpt": "New Haven is getting ready to host its Black Wall Street Week, expecting the biggest participation from businesses yet.", "levels": {"Beginner": {"text": "New Haven, a city in Connecticut, is getting ready for a special event called Black Wall Street Week. This year, many businesses are expected to join, more than ever before. It will be the biggest gathering of businesses for this event yet.\n\nBlack Wall Street Week is a time to celebrate and support businesses owned by Black people. It helps these businesses grow and connect with the community. The name \"Black Wall Street\" comes from a historical area in Tulsa, Oklahoma. Long ago, this area was a very successful Black community with many thriving businesses. Today, Black Wall Street Week events like the one in New Haven aim to remember that success and build new success for Black entrepreneurs.\n\nWhen many businesses come together, it shows that the event is becoming more popular and important. It means more people want to support local Black-owned businesses. This helps the economy in New Haven and makes the community stronger. People can learn about new products and services, and business owners can meet each other and share ideas. This week is a chance for everyone to come together and support local growth.", "vocab": [{"word": "event", "definition": "A planned public or social occasion."}, {"word": "support", "definition": "To help someone or something."}, {"word": "community", "definition": "A group of people living in the same place or having a particular characteristic in common."}, {"word": "thriving", "definition": "Growing, developing, or being successful."}, {"word": "economy", "definition": "The system by which a country's money and goods are produced and used."}]}, "Intermediate": {"text": "The city of New Haven, Connecticut, is making preparations for its upcoming Black Wall Street Week, anticipating a record-breaking turnout of businesses. This annual event, which celebrates and promotes Black entrepreneurship, is set to see its largest participation to date, signaling growing interest and support within the community.\n\nBlack Wall Street Week draws its inspiration from the historic Greenwood district in Tulsa, Oklahoma. In the early 20th century, Greenwood was a vibrant and prosperous Black community, often referred to as \"Black Wall Street\" due to its concentration of successful Black-owned businesses and self-sustaining economy. Modern Black Wall Street Week initiatives, like the one in New Haven, aim to honor this legacy by fostering economic empowerment and creating opportunities for contemporary Black entrepreneurs. These events provide platforms for businesses to showcase their products and services, network with potential customers and partners, and access resources for growth.\n\nThe significant increase in business participation in New Haven highlights the expanding impact and relevance of Black Wall Street Week. A larger turnout means more diverse businesses will be represented, offering a wider range of goods and services to attendees. It also indicates a stronger collective effort to boost local economies and address historical economic disparities. For the city of New Haven, this growing engagement underscores a commitment to fostering an inclusive business environment where Black-owned enterprises can flourish. The week-long activities typically include workshops, panel discussions, and marketplaces, all designed to educate, inspire, and connect. This year's anticipated record turnout suggests a vibrant and impactful week ahead for New Haven's Black business community and its supporters.", "vocab": [{"word": "anticipating", "definition": "Expecting or predicting something."}, {"word": "entrepreneurship", "definition": "The activity of setting up a business or businesses, taking on financial risks in the hope of profit."}, {"word": "inspiration", "definition": "The process of being mentally stimulated to do or feel something, especially to do something creative."}, {"word": "prosperous", "definition": "Successful in material terms; flourishing financially."}, {"word": "fostering", "definition": "Encouraging the development of something, especially something good."}, {"word": "disparities", "definition": "Great differences or inequalities."}]}, "Advanced": {"text": "New Haven, Connecticut, is gearing up for its annual Black Wall Street Week, with organizers projecting the largest business turnout in the event's history. This significant increase in participation underscores the growing momentum behind initiatives aimed at celebrating and bolstering Black entrepreneurship within the region. The anticipated record engagement signals a robust commitment from the local business community and broader public to support and uplift Black-owned enterprises.\n\nThe concept of Black Wall Street Week is deeply rooted in the historical legacy of the Greenwood district in Tulsa, Oklahoma. In the early 20th century, Greenwood epitomized Black economic self-sufficiency, boasting a vibrant ecosystem of Black-owned businesses, professional services, and cultural institutions. Its tragic destruction in 1921 marked a profound setback for Black wealth accumulation and community development. Modern Black Wall Street Week events, such as the one being prepared in New Haven, serve as powerful contemporary affirmations of this legacy, striving to rebuild and amplify economic opportunities for Black entrepreneurs. These initiatives are crucial for addressing systemic inequities and fostering an inclusive economic landscape.\n\nThe projected record turnout in New Haven is particularly noteworthy. It suggests a heightened awareness and collective resolve to patronize and invest in Black-owned businesses, which often face unique challenges in accessing capital, markets, and networks. A larger assembly of businesses not only diversifies the offerings available to consumers but also strengthens the internal network among Black entrepreneurs, facilitating mentorship, collaboration, and resource sharing. This expanded participation can lead to tangible economic benefits, including job creation and increased local spending, thereby contributing to the overall economic vitality of New Haven.\n\nFurthermore, Black Wall Street Week typically encompasses a comprehensive program designed to empower and educate. This often includes business development workshops, pitch competitions, networking receptions, and cultural showcases. The increased attendance from businesses indicates that these platforms are resonating effectively, providing valuable tools and connections for growth. For New Haven, this burgeoning engagement is a testament to the city's dedication to cultivating an equitable and dynamic business environment. It reflects a broader societal shift towards recognizing and actively supporting the contributions of Black entrepreneurs, ensuring that the spirit of the original Black Wall Street continues to inspire and drive progress in the 21st century.", "vocab": [{"word": "projecting", "definition": "Estimating or forecasting something based on present trends or data."}, {"word": "bolstering", "definition": "Supporting or strengthening something."}, {"word": "epitomized", "definition": "Was a perfect example of; represented a typical or ideal example of."}, {"word": "affirmations", "definition": "Statements or actions that confirm or assert something to be true or valid, often with positive intent."}, {"word": "systemic inequities", "definition": "Unfair differences or injustices that are deeply embedded within a system, institution, or society, affecting certain groups disproportionately."}, {"word": "patronize", "definition": "To support a business, store, or restaurant, often by being a regular customer."}, {"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing or expanding quickly."}, {"word": "equitable", "definition": "Fair and impartial; treating everyone equally and justly, often in a way that addresses historical disadvantages."}]}}, "questions": [{"q": "What is Black Wall Street Week in New Haven preparing for?", "a": "It is preparing for its largest business turnout yet."}, {"q": "What historical event or place inspires Black Wall Street Week?", "a": "It is inspired by the historic Greenwood district in Tulsa, Oklahoma, often called \"Black Wall Street.\""}], "id": "a2973650117", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijgJBVV95cUxQcFJ0eHBJNUFPMm94Y1ExQlNpdEhzaG1aREFPWl9mYVRyZktNc0d1ejByVDdndy15RlJFU3BfeEtfVll1d2YxMmJiUjVGVGlldFNSNVc4aEVmbXIySk5kaTVVcnFjZ25ETUp5Ykd5NHdKSDV6NTJicEg0VW5zRURJUS1MZ3RvWGNnYU1GblNoZmVJeWhESTJuNVdBZm1HaG9vUTZKNFh5bzlBM1NDOVU2UFFsLU5NYXVmNEdENVlIZW9jS3ZiVUZ1NExsdXk3bGFZUmxpbEY0dmpDR2hVRW9KRHQyUERWMW5iN2ljcVVqajhhM1V3SjI5c3FJUnFNakxZU1BuY2dDSE9TeG12dEE?oc=5", "published": "2026-08-11T07:16:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "MicroStrategy CEO Calls Firm Bitcoin's 'Central Bank,' Citing Billions in Cash", "excerpt": "MicroStrategy's CEO Michael Saylor has described his company as Bitcoin's 'central bank,' highlighting its substantial financial reserves.", "levels": {"Beginner": {"text": "MicroStrategy's CEO, Michael Saylor, recently made a big statement. He said his company is like a \"central bank\" for Bitcoin. A central bank usually manages a country's money. Saylor means that MicroStrategy holds a lot of Bitcoin, more than many other companies. This makes them a very important player in the world of digital money.\n\nThe company also announced it has $4.75 billion in cash. This is a very large amount of money. Holding so much cash means the company has strong financial power. MicroStrategy has been buying Bitcoin for a long time. They believe Bitcoin is a good investment for the future. They see it as a digital asset that can grow in value.\n\nBy calling his company Bitcoin's central bank, Saylor wants to show how committed MicroStrategy is to this digital currency. They are not just buying Bitcoin; they are trying to be a leading force in its adoption and stability. This news shows MicroStrategy's strong position in both traditional finance with its cash, and in the new world of cryptocurrency with its Bitcoin holdings.", "vocab": [{"word": "CEO", "definition": "The main leader of a company."}, {"word": "Statement", "definition": "Something that someone says or writes officially."}, {"word": "Central bank", "definition": "A bank that manages a country's money supply and financial system."}, {"word": "Digital money", "definition": "Money that exists only on computers or online, like Bitcoin."}, {"word": "Investment", "definition": "Putting money into something to make more money later."}, {"word": "Committed", "definition": "Very dedicated to something."}]}, "Intermediate": {"text": "Michael Saylor, the Executive Chairman and co-founder of MicroStrategy, a prominent business intelligence firm, recently made a significant declaration. He stated that his company functions as a \"central bank\" for Bitcoin, a bold claim that underscores MicroStrategy's deep commitment to the cryptocurrency. Traditionally, a central bank manages a nation's currency, monetary policy, and financial stability. Saylor's analogy suggests that MicroStrategy, through its substantial accumulation of Bitcoin, plays a pivotal role in the digital asset's ecosystem, acting as a major holder and advocate.\n\nMicroStrategy has been a trailblazer among publicly traded companies in adopting Bitcoin as a primary treasury reserve asset. Under Saylor's leadership, the company began acquiring Bitcoin in large quantities, viewing it as a superior long-term store of value compared to traditional fiat currencies. This strategy has positioned MicroStrategy as one of the largest corporate holders of Bitcoin globally.\n\nAdding to its financial strength, the company also reported holding $4.75 billion in cash. This substantial cash reserve, alongside its significant Bitcoin holdings, highlights MicroStrategy's robust financial position. While the company is primarily known for converting its cash into Bitcoin, maintaining such a large cash balance could indicate strategic liquidity for future operations, potential market opportunities, or as a general financial buffer.\n\nSaylor's \"central bank\" comment reflects his vision for MicroStrategy not just as an investor, but as an influential entity within the Bitcoin space. It signals the company's intent to continue its role in promoting Bitcoin's adoption and stability, reinforcing its status as a key player in the evolving digital economy.", "vocab": [{"word": "Prominent", "definition": "Important and well-known."}, {"word": "Declaration", "definition": "A formal or official statement."}, {"word": "Underscores", "definition": "Emphasizes or highlights something."}, {"word": "Analogy", "definition": "A comparison between two things to explain or clarify."}, {"word": "Pivotal", "definition": "Extremely important and essential."}, {"word": "Trailblazer", "definition": "A person or company that is the first to do something new."}, {"word": "Substantial", "definition": "Large in amount or degree."}]}, "Advanced": {"text": "Michael Saylor, the Executive Chairman of MicroStrategy, a business intelligence and mobile software company, has once again positioned his firm at the forefront of the cryptocurrency discourse, declaring it to be Bitcoin's \"central bank.\" This audacious assertion reflects MicroStrategy's unparalleled commitment to Bitcoin as a primary treasury asset and its ambition to influence the digital currency's broader adoption and market dynamics. While a traditional central bank wields sovereign power to manage a national currency, control monetary policy, and ensure financial stability, Saylor's metaphor underscores MicroStrategy's role as a dominant institutional accumulator and steadfast proponent of Bitcoin.\n\nSince 2020, MicroStrategy, under Saylor's visionary leadership, has embarked on an aggressive strategy of converting its corporate cash reserves and raising capital through various financial instruments, including convertible notes, to acquire vast quantities of Bitcoin. This unconventional corporate treasury strategy has transformed the company into the largest publicly traded corporate holder of Bitcoin, accumulating hundreds of thousands of units of the digital asset. This strategic pivot was predicated on the belief that Bitcoin offers a superior long-term store of value and an inflation hedge compared to depreciating fiat currencies.\n\nIn a recent disclosure, the company also reported possessing a significant $4.75 billion in cash. This substantial liquidity, while seemingly counter-intuitive for a company whose core strategy revolves around Bitcoin acquisition, could serve multiple strategic purposes. It might represent operational reserves, capital earmarked for future Bitcoin purchases during market dips, or a robust buffer against market volatility and unforeseen expenditures. The coexistence of immense Bitcoin holdings with such a considerable cash balance highlights MicroStrategy's sophisticated financial engineering and its capacity to navigate both traditional and nascent digital asset markets.\n\nSaylor's \"central bank\" analogy is not merely hyperbole; it articulates a strategic intent. By consolidating a significant portion of the available Bitcoin supply among institutional holders, MicroStrategy aims to foster greater stability and legitimacy for the asset. This positioning seeks to attract more mainstream investment and accelerate Bitcoin's integration into the global financial architecture. The firm's actions and Saylor's pronouncements continue to shape the narrative around corporate Bitcoin adoption, solidifying MicroStrategy's status as a pivotal entity in the ongoing evolution of the digital economy.", "vocab": [{"word": "Discourse", "definition": "Written or spoken communication or debate."}, {"word": "Audacious", "definition": "Showing a willingness to take surprisingly bold risks."}, {"word": "Unparalleled", "definition": "Having no equal; unmatched."}, {"word": "Wields", "definition": "Holds and uses (a weapon or tool, or power or influence)."}, {"word": "Proponent", "definition": "A person who advocates a theory, proposal, or project."}, {"word": "Predicated", "definition": "Based on or established upon."}, {"word": "Counter-intuitive", "definition": "Contrary to intuition or to common-sense expectation."}, {"word": "Hyperbole", "definition": "Exaggerated statements or claims not meant to be taken literally."}]}}, "questions": [{"q": "Who is the CEO of MicroStrategy mentioned in the article?", "a": "The CEO of MicroStrategy mentioned in the article is Michael Saylor."}, {"q": "How much cash did MicroStrategy report holding?", "a": "MicroStrategy reported holding $4.75 billion in cash."}], "id": "a39db7c5858", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE5ESUx4UnNMaVo1TnFleUM4WWRNclNaUG55Vk5MMjRuUXl6U3ZCT0pqN3JXZWFQYWtSRVBZMDNpaV92eWRYR1p3c0QxR2xybEFmc3p2Uw?oc=5", "published": "2026-08-11T07:18:28+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Gold's Cosmic Genesis: From Neutron Stars to Earth", "excerpt": "Most of Earth's gold, in rings and banks, likely formed from ancient neutron star collisions before our Sun existed.", "levels": {"Beginner": {"text": "Have you ever wondered where gold comes from? Scientists say that most of the gold on Earth has an amazing story. It likely came from space, long, long ago.\nBefore our Sun was even born, huge stars called neutron stars crashed into each other. These crashes were very powerful. When they collided, they made new things, including gold.\nAfter these big crashes, the gold spread out into space. It traveled for a very long time. Later, when our planet Earth was forming, this gold became part of it.\nSo, the gold in your jewelry, like a wedding ring, or the gold kept in banks, is incredibly old. It's older than our Sun! It traveled across the universe to get here. This idea helps us understand more about our planet and the universe. It shows that even small pieces of gold have a cosmic past.", "vocab": [{"word": "collided", "definition": "crashed into each other"}, {"word": "spread out", "definition": "moved apart and covered a larger area"}, {"word": "forming", "definition": "starting to exist or grow"}, {"word": "incredibly", "definition": "extremely; very"}, {"word": "cosmic", "definition": "related to the universe or outer space"}]}, "Intermediate": {"text": "The shimmering gold we see in jewelry, dental fillings, and central bank reserves has a truly extraordinary origin story, according to scientific consensus. Researchers believe that the vast majority of Earth's gold was forged in the most violent events in the universe: the collision of neutron stars.\nThese cataclysmic events occurred billions of years ago, long before our solar system, including the Sun, even began to form. Neutron stars are incredibly dense remnants of massive stars that have exploded. Imagine an object the size of a city, but heavier than our Sun – that's a neutron star. When two of these ultra-dense objects spiral inward and crash into each other, they release an immense amount of energy and create conditions so extreme that heavy elements, like gold, can be produced. This process is known as the rapid neutron capture process, or r-process, where atomic nuclei rapidly absorb neutrons to build heavier elements.\nFollowing these powerful cosmic impacts, the newly formed gold was scattered across the vast expanse of space. Over immense periods of time, this interstellar gold dust traveled through the galaxy. Eventually, as our planet Earth began to coalesce from a swirling cloud of gas and dust – a process called accretion – much of this ancient, space-borne gold was swept up and incorporated into its rocky structure. This explains why gold is present in Earth's crust today.\nThis scientific understanding means that every piece of gold on Earth, whether it's a precious heirloom or a bar in a vault, is a relic from a distant, violent cosmic past. It highlights the deep connection between the formation of elements in space and the materials that make up our world today, offering a profound perspective on the age and journey of this valuable metal. It reminds us that even common materials have a universe-spanning history.", "vocab": [{"word": "consensus", "definition": "general agreement among a group of people"}, {"word": "forged", "definition": "created or shaped, often with great effort or heat"}, {"word": "cataclysmic", "definition": "relating to a violent, large-scale natural event"}, {"word": "remnants", "definition": "small remaining parts of something larger"}, {"word": "coalesce", "definition": "to come together to form one mass or whole"}, {"word": "accretion", "definition": "the process of growth or increase, typically by the gradual accumulation of additional layers or matter"}, {"word": "relic", "definition": "an object surviving from an earlier time, especially one of historical or sentimental interest"}]}, "Advanced": {"text": "The lustrous gold that adorns our jewelry, fills dental cavities, and underpins global financial systems as central bank reserves possesses an origin story far more dramatic and ancient than previously imagined. According to a robust scientific consensus, the vast majority of Earth's gold, along with other heavy elements, was not formed within our solar system but rather forged in the cataclysmic collision of neutron stars billions of years ago, predating the very existence of our Sun.\nNeutron stars are the incredibly dense, rapidly spinning remnants of massive stars that have undergone supernova explosions. Packing the mass of our Sun into a sphere merely the size of a city, their gravitational fields are immense, and their interiors are composed almost entirely of neutrons. When two such extraordinary objects, orbiting each other in a binary system, eventually spiral inward, shedding energy as gravitational waves, they merge in an event known as a kilonova. This merger unleashes an explosion of staggering energy, briefly outshining entire galaxies and emitting detectable gravitational waves, a phenomenon first directly observed in 2017.\nCrucially, the extreme conditions within a kilonova — temperatures reaching billions of degrees and an abundance of free neutrons — provide the perfect environment for the rapid neutron capture process, or r-process. In this thermonuclear crucible, atomic nuclei rapidly absorb neutrons, quickly building up to heavier, unstable isotopes that then decay into stable heavy elements, including gold, platinum, and uranium. This astrophysical mechanism is considered the primary pathway for the creation of elements heavier than iron in the universe, explaining their existence beyond the capabilities of standard stellar nucleosynthesis.\nFollowing these titanic cosmic impacts, the newly synthesized gold, along with other heavy elements, was ejected into the interstellar medium at relativistic speeds. Over eons, this enriched material dispersed throughout the nascent galaxy. As our solar system began to condense from a vast cloud of gas and dust approximately 4.6 billion years ago, through a process of gravitational accretion, much of this ancient, space-borne gold was gravitationally swept up and incorporated into the protoplanetary disk. Subsequently, as Earth coalesced, these precious metals became embedded within its rocky mantle and crust.\nThis profound astrophysical understanding transforms our perception of gold. Every gram of this precious metal is not merely a commodity but a tangible relic of a violent, universe-shaping event that occurred across unimaginable cosmic distances and timescales. It underscores the intricate connection between stellar evolution, nucleosynthesis, and the very composition of our planet, offering a compelling narrative that links the most mundane objects to the grandest cosmic phenomena. The relative rarity of kilonova events also provides a cosmic explanation for the scarcity of gold on Earth, making each piece a truly precious testament to the universe's most extreme processes.", "vocab": [{"word": "lustrous", "definition": "having a soft sheen or glow; shiny"}, {"word": "robust", "definition": "strong and healthy; in this context, well-established and supported by evidence"}, {"word": "predating", "definition": "existing or occurring at an earlier date than something else"}, {"word": "kilonova", "definition": "a transient astronomical event that occurs after the merger of two neutron stars or a neutron star and a black hole, emitting electromagnetic radiation and gravitational waves"}, {"word": "crucible", "definition": "a severe test or trial; in chemistry, a heat-resistant container for melting substances under extreme heat"}, {"word": "nucleosynthesis", "definition": "the cosmic formation of atoms more complex than the hydrogen atom"}, {"word": "relativistic", "definition": "relating to or denoting the theory of relativity, especially the increase of mass and energy with velocity approaching the speed of light"}, {"word": "nascent", "definition": "(especially of a process or organization) just coming into existence and beginning to display signs of future potential"}]}}, "questions": [{"q": "What is the main scientific theory about where most of Earth's gold came from?", "a": "Most of Earth's gold is believed to have been forged in the collision of neutron stars."}, {"q": "When did these events happen, relative to our Sun's existence?", "a": "These events happened billions of years ago, long before our Sun existed."}], "id": "af4f48da316", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixAJBVV95cUxPdzRXcWoxR1VLTjFLQzZQUlR1ZWhKdEF4VTZFU203U0tQYjg4S2sta1FnWFVSVXNvYndxX2xrOGFqRU5aeTQ3LTBPZFc5TEdvREZwSzdOS0c3RGR1NkszMjNERkk0ZG43N2dvNVhkZXJ6NHNjZWN6TVAyVzR3a29wX1FXaXFKVjBZMGtDSnBWSVB3c29fQmdTbl9vNWlOcWZORTk1dm1vbDBRTG9NOXNtdFpVeUdPa2lpc1JfVXRnQzFiQTh0RmFvc0hCelF5S2ltYzVKa2YxT0pFTGFqV3ZPYkF0enhxSnhEZVdpWlZIZXBVTGQ4aWNjb1FFZUw0dHRUVGhiTEZJLTVTeVZqQ1h2YXhrQmlRNktmbTNjWWdnSEl2Q05oX3NDa3FHZEwyM2hvMkh6a1RacnpqeFpNcS1vR2FYbHE?oc=5", "published": "2026-08-11T07:09:19+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Democrats Brace for Next Internal Policy Battle", "excerpt": "The Democratic Party is preparing for another significant internal conflict as its moderate and progressive wings clash over future policy directions.", "levels": {"Beginner": {"text": "The Democratic Party in the United States has different groups of people. Two main groups are called moderates and the left. These groups do not always agree on everything. They have different ideas about how the government should work and what laws to make.\n\nModerates usually want to make changes slowly. They might think about what is possible to do right now. The left, also called progressives, often want bigger and faster changes. They want to fix big problems quickly, like climate change or healthcare for everyone.\n\nBecause of these different ideas, the Democrats are now getting ready for a new big talk. This talk will be about what they should do next. It is like a friendly fight inside the party. They need to find ways to work together so they can pass new laws. If they cannot agree, it makes it harder for the party to get things done in the government. This internal discussion is important for the future of the party and the country.", "vocab": [{"word": "moderates", "definition": "People who have political ideas that are not extreme; they prefer small, slow changes."}, {"word": "progressives", "definition": "People who want big, fast changes to improve society and solve problems."}, {"word": "agree", "definition": "To have the same opinion or idea as someone else."}, {"word": "laws", "definition": "Rules made by the government that everyone must follow."}, {"word": "internal", "definition": "Happening inside a group or organization."}]}, "Intermediate": {"text": "The Democratic Party in the United States is once again facing a significant internal challenge as its moderate and progressive factions prepare for their next major policy debate. This ongoing tension between the party's two main wings is a recurring feature of modern American politics, often shaping legislative priorities and electoral strategies.\n\nModerates, often referred to as centrists, typically advocate for incremental changes and seek bipartisan compromise. They prioritize fiscal responsibility and market-based solutions, aiming for reforms that can gain broader support across the political spectrum. In contrast, the progressive wing, or 'the left,' pushes for more ambitious and transformative policies. They champion a stronger social safety net, aggressive action on climate change, universal healthcare, and systemic reforms to address inequality.\n\nThese ideological differences frequently lead to disagreements on key issues. For example, while both sides may agree on the need to address climate change, moderates might favor market incentives and gradual transitions, whereas progressives demand large-scale government investment and rapid decarbonization. Similarly, debates over government spending, social programs, and the scope of federal intervention often highlight the divide.\n\nThe upcoming 'big fight' will likely center on legislative agendas, budget allocations, or the party's messaging ahead of future elections. For the Democrats to effectively govern and achieve their goals, they must navigate these internal divisions and forge a unified path forward. The outcome of these internal discussions will have a substantial impact on the party's ability to pass legislation and maintain public support.", "vocab": [{"word": "factions", "definition": "Small organized groups within a larger one, especially in politics, that often disagree with the main group."}, {"word": "tension", "definition": "A feeling of nervousness, anxiety, or disagreement between people or groups."}, {"word": "incremental", "definition": "Involving a series of small changes or additions, rather than one large change."}, {"word": "bipartisan", "definition": "Involving the agreement or cooperation of two political parties that usually oppose each other."}, {"word": "transformative", "definition": "Causing a thorough or dramatic change in form or appearance."}, {"word": "ideological", "definition": "Based on or relating to a system of ideas and ideals, especially concerning economic or political theory and policy."}]}, "Advanced": {"text": "The Democratic Party is bracing for its next significant internal struggle, as the ideological chasm between its moderate and progressive wings continues to shape its legislative agenda and electoral strategy. This recurring dynamic is a defining feature of contemporary American politics, presenting both opportunities for robust debate and challenges to party unity and governance.\n\nModerates, often aligned with the party's historical centrist tradition, advocate for pragmatic, incremental reforms. Their approach typically emphasizes fiscal prudence, market-based solutions, and the necessity of bipartisan consensus to achieve legislative victories. They often seek to broaden the party's appeal to swing voters and independent constituencies, prioritizing electability and legislative feasibility. Figures like Senator Joe Manchin or Kyrsten Sinema have often embodied this wing, emphasizing compromise and a more cautious approach to policy expansion.\n\nConversely, the progressive wing, invigorated by grassroots movements and figures such as Senators Bernie Sanders and Representatives Alexandria Ocasio-Cortez, champions a more expansive vision of government intervention. They push for systemic transformations, including a robust social safety net, ambitious climate action, universal healthcare, and significant wealth redistribution. Their focus is often on addressing structural inequalities and systemic injustices, advocating for bold policies that may not always garner immediate bipartisan support but are seen as morally imperative.\n\nThese divergent philosophies manifest in critical policy debates. For instance, while both factions acknowledge the urgency of climate change, moderates might favor carbon pricing and technological innovation, whereas progressives demand massive public investment in renewable energy and stringent regulations. Similarly, discussions around infrastructure spending, social welfare programs, and tax reform frequently expose these deep-seated differences. The 'next big fight' could revolve around the specifics of a new budget, the scope of regulatory reform, or the party's messaging heading into a crucial election cycle.\n\nNavigating these internal divisions requires astute leadership and a delicate balancing act. The party's ability to forge a cohesive agenda, despite these ideological tensions, will be crucial for its legislative efficacy and its capacity to present a united front to the electorate. The outcome of these internal deliberations will not only determine the trajectory of specific policies but also influence the Democratic Party's long-term identity and its potential for sustained political power.", "vocab": [{"word": "chasm", "definition": "A profound difference between people, viewpoints, feelings, or interests; a wide gap."}, {"word": "pragmatic", "definition": "Dealing with things sensibly and realistically in a way that is based on practical rather than theoretical considerations."}, {"word": "fiscal prudence", "definition": "Careful and sensible management of money and resources, especially by a government."}, {"word": "bipartisan consensus", "definition": "General agreement or unity of opinion between two major political parties."}, {"word": "constituencies", "definition": "A body of voters in a specified area who elect a representative to a legislative body; also, a group of supporters or patrons."}, {"word": "invigorated", "definition": "Given strength or energy to; made more lively or effective."}, {"word": "systemic", "definition": "Relating to a system, especially as opposed to a particular part; affecting the whole system."}, {"word": "trajectory", "definition": "The path followed by a projectile flying or an object moving under the action of given forces; also, a course of development or a trend."}]}}, "questions": [{"q": "What are the two main groups within the Democratic Party that are often in disagreement?", "a": "The two main groups are moderates (or centrists) and the left (or progressives)."}, {"q": "What is a key difference in how moderates and progressives approach policy changes?", "a": "Moderates typically prefer incremental, slower changes and seek bipartisan compromise, while progressives advocate for more ambitious, faster, and transformative changes, often pushing for a stronger government role."}], "id": "a4e84336996", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxPRW9kUVhrT1pLWVRhTDZmRHhTRGIzVE5ZX3cwZDM2NDlRV0FLZ1IzSDBqMklEUkVBMHpKY0pRQk1SdWtHSlNFSDZBcWJYeHRWd1dyVlljSWRnWE5XNzBNUTFzU2ZzRjhJWDV0UFd5Smx1VVZ2VThiTG1QWElNaGJ6RzlaMk5lWERjUFVnWkR6djdUMTJrMHNrdlI5UERpcFpCa0ltTWJZUERTX29xTG15QV81MXBFWkxNZUNpVWVRNUhwbm8?oc=5", "published": "2026-08-11T06:54:47+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Trump Administration Suggests Splitting MMR Vaccine", "excerpt": "The Trump administration has recommended giving the measles, mumps, and rubella vaccine as three separate shots instead of one combined injection.", "levels": {"Beginner": {"text": "The Trump administration has a new idea about childhood vaccines. They want to give the MMR vaccine as three separate shots. MMR stands for Measles, Mumps, and Rubella. These are three common childhood diseases. Usually, children get one shot that protects them from all three at once. This is called the combined MMR vaccine.\n\nNow, the administration suggests giving three different shots. One shot for Measles, one for Mumps, and one for Rubella. This would mean children need to visit the doctor three times instead of just one time for these vaccines.\n\nVaccines help keep children healthy. They stop serious diseases from spreading. Many doctors and health experts believe the combined MMR shot is safe and effective. It helps make sure more children get protected because it's easier for parents. If parents have to make more doctor visits, some children might not get all the shots they need. This could make it easier for diseases like measles to spread again. This new idea is a big change for how children get their shots.", "vocab": [{"word": "vaccine", "definition": "A medicine that helps your body fight off diseases."}, {"word": "separate", "definition": "To keep things apart; not together."}, {"word": "diseases", "definition": "Illnesses or sicknesses."}, {"word": "combined", "definition": "Put together or joined as one."}, {"word": "spreading", "definition": "Moving from one person or place to another."}, {"word": "protected", "definition": "Kept safe from harm or danger."}]}, "Intermediate": {"text": "The Trump administration has put forward a recommendation concerning childhood vaccinations, specifically suggesting a change to how the measles, mumps, and rubella (MMR) vaccine is administered. Instead of the current practice of a single combined injection, the administration proposes separating it into three distinct shots, each given during a separate doctor's visit.\n\nCurrently, the MMR vaccine is a cornerstone of childhood immunization programs worldwide. It offers protection against three highly contagious viral diseases: measles, which can cause severe complications like pneumonia and brain damage; mumps, known for causing swollen glands and potentially leading to hearing loss; and rubella, which can be particularly dangerous for pregnant women and their unborn babies. The combined shot was developed to simplify the vaccination schedule, reduce the number of doctor visits, and improve overall vaccination rates.\n\nThis new suggestion to separate the MMR vaccine has raised concerns among public health experts and medical professionals. They argue that requiring multiple visits for what is currently a single immunization could create significant logistical challenges for parents. It might lead to a decrease in vaccination uptake, as some parents may find it difficult to schedule or attend three separate appointments. A drop in vaccination rates could potentially increase the risk of outbreaks of these preventable diseases, which have seen resurgences in some areas where immunization levels have declined.\n\nProponents of the combined MMR vaccine emphasize its proven safety and effectiveness over decades. They highlight that the current approach is efficient and has been instrumental in largely eradicating measles and mumps in many regions. The administration's rationale for this proposed separation has not been fully detailed, but it aligns with broader discussions in some circles about vaccine scheduling and parental choice.", "vocab": [{"word": "administered", "definition": "Given or applied, especially a medicine or treatment."}, {"word": "distinct", "definition": "Clearly different or separate."}, {"word": "cornerstone", "definition": "An essential, main, or most important part of something."}, {"word": "contagious", "definition": "Able to be spread from one person or organism to another."}, {"word": "complications", "definition": "New problems that make a medical situation more difficult or serious."}, {"word": "logistical", "definition": "Relating to the organization and planning of a complex operation."}, {"word": "uptake", "definition": "The action of taking up or absorbing something; in this context, the rate at which people get vaccinated."}, {"word": "eradicating", "definition": "Completely destroying or getting rid of something."}]}, "Advanced": {"text": "The Trump administration has issued a recommendation that could significantly alter the landscape of childhood immunization in the United States. The proposal suggests disaggregating the measles, mumps, and rubella (MMR) vaccine, currently administered as a single, trivalent injection, into three separate inoculations, each requiring a distinct medical appointment. This move, if implemented, would represent a substantial departure from established public health protocols and has immediately drawn scrutiny from medical and scientific communities.\n\nThe combined MMR vaccine has been a foundational element of pediatric preventative healthcare for decades. Its development was a triumph of public health, designed to efficiently confer immunity against three highly infectious viral diseases. Measles, once a common childhood ailment, can lead to severe complications such as pneumonia, encephalitis, and even death. Mumps, while often milder, can cause meningitis, orchitis, and permanent hearing loss. Rubella, though generally mild in children, poses a grave threat to pregnant women, potentially causing congenital rubella syndrome in newborns, characterized by birth defects like deafness, cataracts, and heart abnormalities. The efficacy and safety of the combined MMR vaccine have been rigorously affirmed through extensive research and real-world data over more than 50 years.\n\nPublic health experts are voicing considerable apprehension regarding the administration's recommendation. A primary concern is the potential for a decline in vaccination coverage. Requiring parents to schedule and attend three separate visits for what is currently a single, convenient immunization could introduce significant logistical hurdles, particularly for families with limited resources or access to healthcare. This increased burden could inadvertently lead to missed appointments and incomplete vaccination series, thereby diminishing herd immunity and elevating the risk of disease resurgence. Historically, regions with declining MMR vaccination rates have experienced outbreaks of measles, underscoring the critical importance of high immunization coverage.\n\nThe rationale underpinning this proposed disaggregation has not been comprehensively articulated by the administration. However, it resonates with a segment of the population that advocates for greater parental control over vaccination schedules and expresses skepticism about the safety of multiple antigens administered concurrently. Mainstream medical consensus, however, robustly supports the current combined vaccine, citing no evidence that separating the shots offers any safety advantage, while simultaneously introducing practical disadvantages.\n\nCritics suggest that such a recommendation, lacking clear scientific justification from leading health organizations like the CDC or WHO, could be perceived as pandering to vaccine-hesitant groups. It risks undermining public confidence in established vaccine science and potentially exacerbating the challenge of maintaining robust immunization rates essential for population health. The implications for healthcare infrastructure, including increased administrative burden and potential resource strain from additional appointments, also warrant careful consideration.", "vocab": [{"word": "disaggregating", "definition": "Separating something into its component parts; breaking down a whole into smaller, distinct units."}, {"word": "trivalent", "definition": "Referring to a vaccine that protects against three different strains or types of a disease, or three different diseases."}, {"word": "inoculations", "definition": "The act of vaccinating or immunizing someone against a disease; a shot or injection."}, {"word": "foundational", "definition": "Forming a base or groundwork; fundamental and essential."}, {"word": "confer", "definition": "To grant or bestow (a right, benefit, or title); in this context, to provide immunity."}, {"word": "encephalitis", "definition": "Inflammation of the brain, often caused by infection."}, {"word": "congenital rubella syndrome", "definition": "A condition in a baby that results from the mother being infected with the rubella virus during pregnancy, leading to birth defects."}, {"word": "rigorously affirmed", "definition": "Confirmed or validated with great thoroughness, precision, and strictness."}, {"word": "apprehension", "definition": "Anxiety or fear that something bad or unpleasant will happen."}, {"word": "logistical hurdles", "definition": "Difficulties or obstacles related to the organization and planning of complex activities."}, {"word": "inadvertently", "definition": "Without intention; accidentally."}, {"word": "herd immunity", "definition": "The resistance to the spread of a contagious disease within a population that results if a sufficiently high proportion of individuals are immune to the disease, especially through vaccination."}, {"word": "resurgence", "definition": "An increase or revival after a period of little activity, popularity, or occurrence."}, {"word": "underpinning", "definition": "Providing a basis or foundation for something."}, {"word": "comprehensively articulated", "definition": "Clearly and fully explained or expressed, covering all relevant aspects."}, {"word": "concurrently", "definition": "At the same time; simultaneously."}, {"word": "robustly", "definition": "In a strong and healthy way; strongly and firmly."}, {"word": "pandering", "definition": "Gratifying or indulging an immoral or distasteful desire, need, or habit; in this context, appealing to a group's specific desires, even if controversial."}, {"word": "exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}]}}, "questions": [{"q": "What specific vaccine does the Trump administration recommend separating?", "a": "The Trump administration recommends separating the Measles, Mumps, and Rubella (MMR) vaccine."}, {"q": "What is a main concern raised by public health experts about separating the MMR vaccine?", "a": "Public health experts are concerned that const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
