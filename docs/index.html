<style>
:root{--paper:#f7f3ea;--ink:#1c1a17;--muted:#6b6358;--rule:#d8cfbf;--accent:#8a1f1f;--accent2:#2a3d54;--pill:#efe8da;--ok:#2e7d4f}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
  line-height:1.65;overflow-wrap:break-word;word-break:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent2)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 120px}
header.top{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px}
header.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;letter-spacing:.03em;margin:.1em 0;font-size:clamp(30px,8vw,50px)}
.tag{font-style:italic;color:var(--muted);font-size:14px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tab{flex:0 0 auto;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
  background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 10px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.viewtitle{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:22px 0 4px;color:var(--accent)}
.card{padding:18px 0;border-bottom:1px solid var(--rule)}
.card:last-child{border-bottom:none}
.cat-tag{display:inline-block;font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent2);background:var(--pill);border:1px solid var(--rule);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.3}
.card .src{font-family:Helvetica,Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.excerpt{margin:0 0 10px;font-size:16px;color:var(--ink)}
.more{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}
/* article view */
.crumb{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.art-h{font-family:'Playfair Display',Georgia,serif;font-size:26px;line-height:1.25;margin:0 0 6px}
.art-src{font-family:Helvetica,Arial,sans-serif;font-size:12px;color:var(--muted);margin-bottom:16px}
.levels{display:flex;gap:0;border:1px solid var(--rule);border-radius:24px;overflow:hidden;margin:0 0 18px;background:#fff}
.levels button{flex:1;font-family:Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;border:none;background:none;padding:9px 6px;cursor:pointer;color:var(--muted)}
.levels button.active{background:var(--accent2);color:#fff}
.panel{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:14px 16px;margin:0 0 18px}
.panel h4{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
dl.vocab{margin:0}
dl.vocab dt{font-weight:700;margin-top:9px}
dl.vocab dd{margin:2px 0 0;font-size:15.5px}
.article-body p{font-size:17px;margin:0 0 15px}
.q{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.q:first-child{border-top:none;padding-top:0;margin-top:0}
.q .qq{font-weight:700;font-size:16px;margin:0 0 6px}
.q details summary{cursor:pointer;color:var(--accent2);font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;list-style:none}
.q details summary::-webkit-details-marker{display:none}
.q details summary::before{content:"Show answer ▸"}
.q details[open] summary::before{content:"Answer ▾"}
.q details p{margin:6px 0 0;font-size:15.5px}
.srclink{display:inline-block;margin-top:6px;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700}
/* bottom bar */
.navbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:1px;background:var(--rule);z-index:50;

#bionic-toggle{position:fixed;right:12px;bottom:62px;z-index:60;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;

criptions. It's a chance to discover if a particular trade sparks their interest and aptitude.\n\nMany trade careers, such as electricians, welders, plumbers, and HVAC technicians, are experiencing a growing demand for skilled workers. These professions often provide stable employment, competitive wages, and do not always require a traditional four-year university degree. Instead, individuals typically pursue vocational training programs, community college courses, or apprenticeships, which combine on-the-job learning with classroom instruction. These pathways can lead to successful and fulfilling careers without accumulating significant student debt.\n\nEvents like \"Hands-on Trade Up\" play a crucial role in addressing the national shortage of skilled labor. They present viable alternatives to traditional academic routes, encouraging students to consider diverse post-high school pathways. By allowing students to actively engage with different trades, the event helps them make informed decisions about their educational and professional futures. It also highlights the value and respect associated with these essential professions, contributing to a stronger local workforce and economy. Such exposure can demystify these careers and inspire the next generation of skilled workers.", "vocab": [{"word": "explore", "definition": "To investigate or discuss in detail; to travel through an unfamiliar area to learn about it."}, {"word": "practical", "definition": "Relating to actual experience or use rather than theory or imagination."}, {"word": "simulate", "definition": "To imitate the appearance or character of something."}, {"word": "vital", "definition": "Absolutely necessary or important; essential."}, {"word": "vocational", "definition": "Relating to an occupation or employment, especially one for which a person is specially trained."}, {"word": "shortage", "definition": "A state or situation in which something needed cannot be obtained in sufficient amounts."}, {"word" e-job learning with structured classroom instruction, enabling graduates to enter the workforce with specialized expertise and often without the substantial student debt associated with university education. This makes trade careers an increasingly attractive and financially sound option.\n\nEvents like \"Hands-on Trade Up\" are an imperative component of contemporary workforce development strategies. They serve to demystify trade careers, presenting them as highly respectable and economically viable alternatives to purely academic routes. By providing early exposure and active engagement, these programs empower students to make profoundly informed decisions regarding their post-secondary educational and professional trajectories. Furthermore, such initiatives are instrumental in fostering a robust local workforce, mitigating the skilled labor shortage, and bolstering economic resilience. They challenge outdated perceptions of vocational training, elevating the status of these essential professions and inspiring the next generation to consider careers that build, maintain, and innovate the world around us. This proactive engagement is vital for ensuring a continuous pipeline of talent that can meet the evolving needs of industry and society, contributing significantly to community well-being and progress.", "vocab": [{"word": "initiative", "definition": "An important new plan or program to solve a problem or achieve a goal."}, {"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "indispensable", "definition": "Absolutely necessary; essential."}, {"word": "acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "discern", "definition": "To perceive or recognize something; to distinguish."}, {"word": "remuneration", "definition": "Money paid for work or a service; salary or wages."}, {"word": "imperative", "definition": "Of vital importance; crucial." r for Skydance DTC — overseeing both HBO Max and Paramount+, Casey Bloys is staying put. Variety has confirmed that Bloys — whose contract with HBO was set to expire next year — has signed on for a new multiyear extension. Insiders […]", "vocab": []}}, "questions": [], "id": "a05915af6ae", "source": "Variety", "link": "https://variety.com/2026/tv/news/casey-bloys-new-deal-hbo-max-paramount-skydance-1236899664/", "published": "2026-10-06T09:33:19+09:00", "category": "entertainment"}, {"headline": "Men’s Basketball Announces 2026-27 Schedule With Times And Television Broadcast Assignments - friars.com", "excerpt": "Men’s Basketball Announces 2026-27 Schedule With Times And Television Broadcast Assignments friars.com", "levels": {"Beginner": {"text": "Men’s Basketball Announces 2026-27 Schedule With Times And Television Broadcast Assignments friars.com", "vocab": []}, "Intermediate": {"text": "Men’s Basketball Announces 2026-27 Schedule With Times And Television Broadcast Assignments friars.com", "vocab": []}, "Advanced": {"text": "Men’s Basketball Announces 2026-27 Schedule With Times And Television Broadcast Assignments friars.com", "vocab": []}}, "questions": [], "id": "abee0ee7137", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi1wFBVV95cUxNZEJJU3h3Z2ZXdDlqZU9ERlNud010SVkyQkl4TG1vTGNFczJSTTNlZHRGcnpaRTFVLW0xRWlHVUViRzc0eE5xWW1Ody1PdmlyRG9BY2pHMXl1S0YxUFNVR0pJN2lPQWNqZmsydEx6ZVI1TjI3SVFhZEQzSWEyamFjUFhKSDcwOWJocUpUOU1SRV85LXEwR1dydmgyWUQxeE1kamZZMTdCRkpQY1VoenFkVE1xS21uNGN4UkFEMHphMEFBT3Q5ZGY1RkFUM3pfWW1yWWNWa1ljYw?oc=5", "published": "2026-10-06T09:06:42+09:00", "category": "entertainment"}, {"headline": "Trump Says He’ll Pay for ‘Patriotic Ads’ Himself Following Controversy Around Taxpayer-Funded TV Spots", "excerpt": "After controversy erupted over Donald Trump’s administration buying TV ad time (with taxpayer dollars) to air advertisements endorsing the p", "levels": {"Beginner": {"text": "After controversy erupted over Donald Trump’s administration buying TV ad time (with taxpayer dollars) to air advertisements endorsing the president, Trump has now said he will fund what he calls “patriotic ads” himself. In a statement posted to Truth Social on Monday, Trump wrote: “The Radical Left is upset with the fact that I am […]", "vocab": []}, "Intermediate": {"text": "After controversy erupted over Donald Trump’s administration buying TV ad time (with taxpayer dollars) to air advertisements endorsing the president, Trump has now said he will fund what he calls “patriotic ads” himself. In a statement posted to Truth Social on Monday, Trump wrote: “The Radical Left is upset with the fact that I am […]", "vocab": []}, "Advanced": {"text": "After controversy erupted over Donald Trump’s administration buying TV ad time (with taxpayer dollars) to air advertisements endorsing the president, Trump has now said he will fund what he calls “patriotic ads” himself. In a statement posted to Truth Social on Monday, Trump wrote: “The Radical Left is upset with the fact that I am […]", "vocab": []}}, "questions": [], "id": "a6ddcab9533", "source": "Variety", "link": "https://variety.com/2026/tv/news/trump-pay-for-political-ads-himself-1236899674/", "published": "2026-10-06T09:04:56+09:00", "category": "entertainment"}]}], "home": [{"headline": "San Diego Ice Company Sees High Demand Amid Heat Wave", "excerpt": "A recent heat wave in San Diego has significantly increased demand for ice, boosting sales for local ice companies.", "levels": {"Beginner": {"text": "San Diego is having very hot weather. This hot weather is called a heat wave. When it is very hot, people need to stay cool. One way to stay cool is with ice. People put ice in their drinks. They also use ice to keep food fresh in coolers.\n\nAn ice company in San Diego is very busy right now. This company makes and sells ice. Because of the heat wave, many people want to buy ice. So, the company is selling a lot more ice than usual. Workers at the company are working hard to make enough ice for everyone.\n\nThe heat wave makes life harder for people. It is important to drink a lot of water and stay in cool places. The ice company helps people stay a little cooler during this hot time. They are providing an important product for the community.", "vocab": [{"word": "Heat wave", "definition": "a period of very hot weather."}, {"word": "Stay cool", "definition": "to keep your body temperature from getting too high."}, {"word": "Company", "definition": "a business that makes or sells things."}, {"word": "Busy", "definition": "actively doing a lot of work."}, {"word": "Demand", "definition": "when many people want to buy something."}, {"word": "Product", "definition": "something that is made or grown to be sold."}]}, "Intermediate": {"text": "San Diego is currently experiencing a significant heat wave, bringing unusually high temperatures to the region. This prolonged period of scorching weather has led residents and businesses alike to seek ways to stay cool and comfortable. The intense heat, which has seen temperatures climb well above average for this time of year, poses health risks and general discomfort for the population.\n\nOne industry seeing a direct and immediate impact from this extreme heat is the local ice production sector. A San Diego ice company has reported a substantial surge in demand for its products. With temperatures soaring, people are buying much more ice than usual. This includes individuals stocking up for personal use – to cool their drinks, fill coolers for beach trips or picnics, and keep perishable items fresh during power outages or outdoor events. Additionally, businesses such as restaurants, cafes, bars, and grocery stores rely heavily on ice to operate, and their increased needs further contribute to the heightened demand.\n\nTo meet this unprecedented need, the company's operations have ramped up considerably. Workers are busy producing, packaging, and delivering ice around the clock, often working extended shifts to ensure there's enough supply for the entire community. This busy period translates into significantly higher sales and revenue for the company, but it also puts considerable pressure on its staff, equipment, and logistical capabilities. Managing increased production while maintaining quality and timely distribution is a key challenge.\n\nAuthorities are advising residents to take serious precautions during the heat wave. These recommendations include staying hydrated by drinking plenty of water, avoiding strenuous outdoor activities during the hottest parts of the day, and seeking air-conditioned environments whenever possible. For many, a readily available supply of ice provides essential relief, helping them to cool down beverages and even reduce body temperature, thereby aiding in their ability to cope with the intense heat. The increased activity at the San Diego ice company underscores how crucial simple commodities like ice become when extreme weather conditions affect daily life and public well-being.", "vocab": [{"word": "Significant", "definition": "important or noticeable."}, {"word": "Soaring", "definition": "rising quickly to a high level."}, {"word": "Surge", "definition": "a sudden increase in something."}, {"word": "Perishable", "definition": "likely to spoil or decay quickly."}, {"word": "Ramped up", "definition": "increased the level or speed of something."}, {"word": "Essential", "definition": "absolutely necessary or important."}, {"word": "Cope", "definition": "to deal effectively with something difficult."}]}, "Advanced": {"text": "San Diego is currently grappling with an unprecedented heat wave, pushing temperatures into record-breaking territory and placing considerable strain on the region's infrastructure and residents. This prolonged meteorological event, often characterized by a persistent high-pressure system trapping warm air and exacerbated by urban heat island effects, has transformed a typically mild coastal climate into a sweltering environment. The intensity of this heat wave has prompted widespread public health advisories, urging caution and preventative measures to avoid heat-related illnesses.\n\nAmidst this scorching backdrop, one particular sector experiencing a dramatic operational shift is the local ice production industry. A prominent San Diego ice company has reported an extraordinary surge in demand, far exceeding typical seasonal fluctuations. This heightened need stems from both individual consumers seeking respite from the oppressive heat and a diverse array of commercial clients. Households are purchasing ice in bulk for cooling beverages, maintaining food safety in coolers during outdoor excursions, and as a general aid in personal cooling. Simultaneously, the robust hospitality sector – including restaurants, bars, and event venues – alongside grocery stores, convenience stores, and even medical facilities, has significantly increased its orders, underscoring ice's role as a critical commodity rather than a mere luxury.\n\nTo meet this burgeoning demand, the ice company has had to implement a robust and agile response. This involves ramping up production lines to their maximum capacity, often requiring extended shifts for personnel and round-the-clock operations to ensure continuous output. Logistical challenges are also considerable, encompassing the efficient distribution of large volumes of ice across the sprawling metropolitan area, managing increased fuel costs for delivery fleets, and ensuring the timely maintenance and repair of machinery operating under heavy usage. This period, while presenting immense operational and human resource challenges, simultaneously translates into a substantial bolstering of revenue for the company, highlighting the complex economic interplay between extreme weather events and specific industries.\n\nPublic health officials have issued urgent warnings, advising residents to prioritize hydration, limit strenuous outdoor activities, and seek refuge in air-conditioned spaces or designated cooling centers. The readily available supply of ice plays a crucial role in these mitigation strategies, not only for cooling drinks but also for therapeutic applications in cases of heat exhaustion or to simply lower ambient temperatures in non-air-conditioned settings. The intense activity at the San Diego ice company serves as a tangible illustration of how essential basic resources become during climate extremes, and how local businesses adapt with resilience to serve immediate community needs. This scenario also subtly underscores broader discussions about climate resilience and the increasing frequency and intensity of such extreme weather phenomena, prompting communities and infrastructure planners to reassess their preparedness for future environmental challenges.", "vocab": [{"word": "Unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "Grappling", "definition": "Struggling to deal with or overcome (a difficulty or challenge)."}, {"word": "Meteorological", "definition": "Relating to the branch of science concerned with the processes and phenomena of the atmosphere, especially as a means of forecasting the weather."}, {"word": "Surge", "definition": "A sudden powerful forward or upward movement, especially by a crowd or by a natural force such as the tide."}, {"word": "Bolstering", "definition": "Supporting or strengthening."}, {"word": "Logistical", "definition": "Relating to the organization and implementation of a complex operation."}, {"word": "Commodity", "definition": "A raw material or primary agricultural product that can be bought and sold, such as copper or coffee."}, {"word": "Mitigation", "definition": "The action of reducing the severity, seriousness, or painfulness of something."}, {"word": "Resilience", "definition": "The capacity to recover quickly from difficulties; toughness."}]}}, "questions": [{"q": "What is causing the high demand for ice in San Diego?", "a": "A heat wave is causing the high demand for ice in San Diego."}, {"q": "What kind of business is seeing increased sales because of the heat?", "a": "An ice company in San Diego is seeing increased sales because of the heat."}], "id": "a698cde9ddc", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitwFBVV95cUxQQlNacERGcW9ITkhmOEU1Z3cxNmI3bGpCbEpNWjdScGotbFdwRWtua2FRNlZtMHpvbmR2b1J0RnZKZTBSdmI3VmtUcjV6d3kxMmFVQ2ZkRmU2STlGbWpTbEJYTGV4QUFHdWxzNXpzdU1DNl9GQzByYUJSM0Y3X1hYNUphck5Va0JIbmR0ankwbExSTU1yMndrNWw0TW5xSVJNT3VOaVRlNkEyUm1MYVFoenpjUVJKdmc?oc=5", "published": "2026-10-06T09:21:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "High Schoolers Explore Trade Careers at Hands-On Event", "excerpt": "A special \"Trade Up\" event recently gave high school students a practical chance to experience various skilled trade professions firsthand.", "levels": {"Beginner": {"text": "High school students recently went to a special event called \"Hands-on Trade Up.\" This event let them try out different jobs that need special skills. These jobs are often called \"trade careers.\" \n\nAt the event, students could use tools and do small tasks, just like real workers. For example, they might try building something with wood, fixing a car engine, or learning about electricity. It was a chance to see what these jobs are really like.\n\nMany students think about going to college after high school. But trade careers are another good path. They can lead to well-paying jobs and do not always require a four-year college degree. Instead, people learn skills through special training programs or apprenticeships.\n\nEvents like \"Hands-on Trade Up\" are important. They help young people learn about different options for their future. By trying out these jobs, students can decide if a trade career might be a good fit for them. It helps them make smart choices about what they want to do after school.", "vocab": [{"word": "event", "definition": "A planned public or social occasion."}, {"word": "try out", "definition": "To test something to see if it is suitable or effective."}, {"word": "careers", "definition": "Jobs or professions that people do for a long time."}, {"word": "skills", "definition": "Abilities that people learn to do something well."}, {"word": "future", "definition": "The time that is to come."}, {"word": "important", "definition": "Having great value or meaning."}]}, "Intermediate": {"text": "High school students recently participated in a \"Hands-on Trade Up\" event, offering them a unique opportunity to explore various skilled trade professions. The initiative allowed young people to gain practical experience and insight into career paths that are vital to the economy and local communities.\n\nDuring the event, students engaged in a range of activities designed to simulate real-world tasks performed by tradespeople. They might have tried their hand at basic carpentry, automotive repair, electrical wiring, or plumbing. This direct, experiential learning helps students understand the daily realities and requirements of these jobs, moving beyond theoretical descriptions. It's a chance to discover if a particular trade sparks their interest and aptitude.\n\nMany trade careers, such as electricians, welders, plumbers, and HVAC technicians, are experiencing a growing demand for skilled workers. These professions often provide stable employment, competitive wages, and do not always require a traditional four-year university degree. Instead, individuals typically pursue vocational training programs, community college courses, or apprenticeships, which combine on-the-job learning with classroom instruction. These pathways can lead to successful and fulfilling careers without accumulating significant student debt.\n\nEvents like \"Hands-on Trade Up\" play a crucial role in addressing the national shortage of skilled labor. They present viable alternatives to traditional academic routes, encouraging students to consider diverse post-high school pathways. By allowing students to actively engage with different trades, the event helps them make informed decisions about their educational and professional futures. It also highlights the value and respect associated with these essential professions, contributing to a stronger local workforce and economy. Such exposure can demystify these careers and inspire the next generation of skilled workers.", "vocab": [{"word": "explore", "definition": "To investigate or discuss in detail; to travel through an unfamiliar area to learn about it."}, {"word": "practical", "definition": "Relating to actual experience or use rather than theory or imagination."}, {"word": "simulate", "definition": "To imitate the appearance or character of something."}, {"word": "vital", "definition": "Absolutely necessary or important; essential."}, {"word": "vocational", "definition": "Relating to an occupation or employment, especially one for which a person is specially trained."}, {"word": "shortage", "definition": "A state or situation in which something needed cannot be obtained in sufficient amounts."}, {"word": "apprenticeships", "definition": "A system where a new employee learns a skill or trade by working alongside an experienced worker."}]}, "Advanced": {"text": "High school students recently participated in a \"Hands-on Trade Up\" event, an innovative initiative designed to immerse them in the burgeoning world of skilled trade professions. This program offers a crucial opportunity for young individuals to gain tangible experience and invaluable insight into career pathways that are indispensable to the modern economy and local infrastructure.\n\nDuring the event, participants engaged in a diverse array of activities meticulously crafted to simulate the practical demands of various trades. Students might have wielded tools for basic carpentry, delved into the intricacies of automotive diagnostics, practiced electrical wiring, or tackled fundamental plumbing challenges. This direct, experiential learning approach is paramount, as it allows students to transcend theoretical descriptions and confront the tangible realities and requisite aptitudes for these professions. It's an unparalleled chance to cultivate practical acumen and discern if a particular trade resonates with their interests and capabilities, potentially sparking a lifelong passion and career trajectory.\n\nThe demand for skilled tradespeople—such as electricians, welders, plumbers, HVAC technicians, and construction workers—is experiencing a significant upswing across many regions, often referred to as the \"skills gap.\" This gap highlights a critical need for trained professionals to fill essential roles. These professions frequently offer robust employment stability, competitive remuneration, and often do not necessitate the pursuit of a traditional four-year university degree. Instead, individuals typically embark on rigorous vocational training programs, specialized community college courses, or comprehensive apprenticeships. These alternative pathways are highly effective, combining intensive on-the-job learning with structured classroom instruction, enabling graduates to enter the workforce with specialized expertise and often without the substantial student debt associated with university education. This makes trade careers an increasingly attractive and financially sound option.\n\nEvents like \"Hands-on Trade Up\" are an imperative component of contemporary workforce development strategies. They serve to demystify trade careers, presenting them as highly respectable and economically viable alternatives to purely academic routes. By providing early exposure and active engagement, these programs empower students to make profoundly informed decisions regarding their post-secondary educational and professional trajectories. Furthermore, such initiatives are instrumental in fostering a robust local workforce, mitigating the skilled labor shortage, and bolstering economic resilience. They challenge outdated perceptions of vocational training, elevating the status of these essential professions and inspiring the next generation to consider careers that build, maintain, and innovate the world around us. This proactive engagement is vital for ensuring a continuous pipeline of talent that can meet the evolving needs of industry and society, contributing significantly to community well-being and progress.", "vocab": [{"word": "initiative", "definition": "An important new plan or program to solve a problem or achieve a goal."}, {"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "indispensable", "definition": "Absolutely necessary; essential."}, {"word": "acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "discern", "definition": "To perceive or recognize something; to distinguish."}, {"word": "remuneration", "definition": "Money paid for work or a service; salary or wages."}, {"word": "imperative", "definition": "Of vital importance; crucial."}, {"word": "mitigate", "definition": "To make something less severe, serious, or painful."}]}}, "questions": [{"q": "What is the main purpose of the \"Hands-on Trade Up\" event?", "a": "The main purpose is to allow high school students to try out and learn about different skilled trade careers through practical, hands-on activities."}, {"q": "Name two reasons why trade careers are becoming more attractive for students.", "a": "Trade careers often offer stable employment and competitive wages, and they do not always require a four-year university degree, often leading to less student debt. There is also a growing demand for skilled workers in these fields."}], "id": "a045d9e1e33", "source": "     const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
