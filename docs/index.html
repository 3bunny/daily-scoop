<style>
:root{--paper:#f7f3ea;--ink:#1c1a17;--muted:#6b6358;--rule:#d8cfbf;--accent:#8a1f1f;--accent2:#2a3d54;--pill:#efe8da;--ok:#2e7d4f}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
  line-height:1.65;overflow-wrap:break-word;word-break:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent2)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 120px}
header.top{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px}
header.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;letter-spacing:.03em;margin:.1em 0;font-size:clamp(30px,8vw,50px)}
.tag{font-style:italic;color:var(--muted);font-size:14px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tab{flex:0 0 auto;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
  background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 10px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.viewtitle{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:22px 0 4px;color:var(--accent)}
.card{padding:18px 0;border-bottom:1px solid var(--rule)}
.card:last-child{border-bottom:none}
.cat-tag{display:inline-block;font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent2);background:var(--pill);border:1px solid var(--rule);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.3}
.card .src{font-family:Helvetica,Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.excerpt{margin:0 0 10px;font-size:16px;color:var(--ink)}
.more{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}
/* article view */
.crumb{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.art-h{font-family:'Playfair Display',Georgia,serif;font-size:26px;line-height:1.25;margin:0 0 6px}
.art-src{font-family:Helvetica,Arial,sans-serif;font-size:12px;color:var(--muted);margin-bottom:16px}
.levels{display:flex;gap:0;border:1px solid var(--rule);border-radius:24px;overflow:hidden;margin:0 0 18px;background:#fff}
.levels button{flex:1;font-family:Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;border:none;background:none;padding:9px 6px;cursor:pointer;color:var(--muted)}
.levels button.active{background:var(--accent2);color:#fff}
.panel{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:14px 16px;margin:0 0 18px}
.panel h4{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
dl.vocab{margin:0}
dl.vocab dt{font-weight:700;margin-top:9px}
dl.vocab dd{margin:2px 0 0;font-size:15.5px}
.article-body p{font-size:17px;margin:0 0 15px}
.q{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.q:first-child{border-top:none;padding-top:0;margin-top:0}
.q .qq{font-weight:700;font-size:16px;margin:0 0 6px}
.q details summary{cursor:pointer;color:var(--accent2);font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;list-style:none}
.q details summary::-webkit-details-marker{display:none}
.q details summary::before{content:"Show answer ▸"}
.q details[open] summary::before{content:"Answer ▾"}
.q details p{margin:6px 0 0;font-size:15.5px}
.srclink{display:inline-block;margin-top:6px;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700}
/* bottom bar */
.navbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:1px;background:var(--rule);z-index:50;
  box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.navbar button{flex:1;background:var(--paper);border:none;padding:13px 8px;font-family:Helvetica,Arial,sans-serif;
  font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer}
.navbar button:disabled{opacity:.35}
#bionic-toggle{position:fixed;right:12px;bottom:62px;z-index:60;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;

<script>
const ED = {"built": "2026-09-01", "categories": [{"key": "business", "title": "Business", "articles": [{"headline": "China Dissents from G20 Statement on 'Cheap Exports'", "excerpt": "China recently disagreed with other major economies at a G20 meeting over concerns about 'cheap exports' flooding global markets.", "levels": {"Beginner": {"text": "At a recent big meeting called the G20, countries talked about world trade. The G20 is a group of the world's largest economies. Many countries at the meeting were worried about products that are sold very cheaply. They said these \"cheap exports\" from some places are making it hard for other countries' businesses to sell their own goods. This can hurt jobs and companies in those countries.\n\nChina was at this meeting. But China did not agree with a statement that other countries wanted to make. This statement was against these very cheap exports. China's disagreement means that the big countries do not all have the same ideas about how trade should work. It shows there are different views on how countries should sell things to each other. This kind of disagreement can make it harder for countries to work together on trade rules in the future.", "vocab": [{"word": "G20", "definition": "A group of 20 major economies in the world."}, {"word": "exports", "definition": "Products that one country sells to another country."}, {"word": "worried", "definition": "Feeling concerned or anxious about something."}, {"word": "disagreement", "definition": "When people or groups have different opinions or do not agree."}, {"word": "businesses", "definition": "Companies or organizations that sell goods or services."}]}, "Intermediate": {"text": "China recently expressed its dissent from a statement proposed by other G20 nations regarding concerns over 'cheap exports' flooding global markets. The G20, which comprises the world's leading economies, held discussions where several members voiced worries about the impact of unusually low-priced goods on international trade.\n\nThese nations argue that when products are sold at prices significantly below their true cost or market value, it can create unfair competition. This practice, often referred to as 'dumping' in trade terms, can harm local industries in importing countries, leading to job losses and reduced economic activity. Countries like the United States and European Union members have frequently raised concerns about China's manufacturing capacity and its effect on global prices, particularly in sectors like steel, solar panels, and electric vehicles.\n\nChina's refusal to endorse the G20 statement highlights ongoing tensions in global trade. While other nations seek to protect their domestic markets from what they perceive as market-distorting practices, China often emphasizes its competitive advantage and the benefits of its efficient production. This divergence in views makes it challenging for major economic powers to establish unified approaches to global trade regulations and fair market practices, potentially leading to continued trade disputes.", "vocab": [{"word": "dissent", "definition": "To disagree with an official opinion or decision."}, {"word": "comprises", "definition": "To be made up of; to include."}, {"word": "unusually", "definition": "Not normal or typical; in a way that is different from what is expected."}, {"word": "competition", "definition": "The struggle among businesses to attract customers."}, {"word": "endorse", "definition": "To publicly support or approve of something."}, {"word": "divergence", "definition": "The process or state of separating and going in different directions."}]}, "Advanced": {"text": "China has reportedly dissented from a G20 statement that aimed to address concerns over 'cheap exports' inundating global markets. This development, highlighted by comments from officials like Bessent, underscores the persistent friction within the world's leading economies regarding international trade practices and market fairness. The G20, a forum for major industrialized and emerging economies, has increasingly become a platform for discussing the ramifications of global overcapacity and state-backed subsidies.\n\nMany G20 members, particularly Western nations, contend that certain countries, notably China, engage in practices that lead to the export of goods at artificially low prices. This phenomenon, often termed 'dumping,' is seen as a consequence of significant state subsidies and excess production capacity, which can distort global markets. The argument is that these 'cheap exports' create an uneven playing field, making it difficult for industries in importing countries to compete, ultimately leading to factory closures, job losses, and a decline in domestic manufacturing capabilities. Sectors such as steel, aluminum, solar technology, and more recently, electric vehicles, have been at the forefront of these trade disputes.\n\nChina's refusal to align with the proposed G20 statement signals its firm stance on its economic model and trade policies. Beijing often frames its competitive pricing as a natural outcome of efficient production and economies of scale, rather than unfair subsidies or market manipulation. This fundamental disagreement between China's approach to industrial policy and the free-market principles advocated by many G20 members complicates efforts to forge a consensus on global trade rules. Such divergences can lead to increased protectionist measures, retaliatory tariffs, and a fragmentation of the global trading system, posing significant challenges to multilateral cooperation and economic stability. The incident at the G20 meeting reflects the broader geopolitical and economic tensions that continue to shape international relations.", "vocab": [{"word": "dissented", "definition": "Expressed disagreement with a prevailing opinion, decision, or statement, especially in an official context."}, {"word": "inundating", "definition": "Flooding or overwhelming with a large quantity of something, often implying an excessive or problematic amount."}, {"word": "underscores", "definition": "Emphasizes the importance or truth of something; highlights."}, {"word": "ramifications", "definition": "The complex or unwelcome consequences of an action or event, especially when they are not immediately obvious."}, {"word": "contend", "definition": "Assert something as a position in an argument; to argue or debate."}, {"word": "artificially", "definition": "In a way that is not natural or genuine, often implying manipulation or contrivance."}, {"word": "divergences", "definition": "Instances of moving or developing in different directions; differences in opinion, policy, or approach."}, {"word": "multilateral", "definition": "Involving three or more parties, especially governments or international organizations."}]}}, "questions": [{"q": "What specific type of goods were G20 members concerned about, and what country dissented from the statement regarding them?", "a": "G20 members were concerned about 'cheap exports' or 'low-priced goods' flooding global markets. China dissented from the statement regarding these exports."}, {"q": "According to the articles, what are some potential negative impacts of 'cheap exports' on importing countries?", "a": "Potential negative impacts include unfair competition, harm to local industries, job losses, reduced economic activity, factory closures, and a decline in domestic manufacturing capabilities."}], "id": "a5121d8447a", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMigwFBVV95cUxPNW1KTnpvMXFBWjZzMFlqYjEwNWFsM2dWcXJrbDdJUkVFY0JiVk9BTERmZTlNWkNuNDlIa0k3aDRqVjZJbTM4X29LQm5YdTBucUd4MEMwRWZwY1dhRUozMVAzT0lTLVUzaHRobnRTVGJqTWVscHhYZ1czQ2hzeWhmd3ZCRdIBiAFBVV95cUxNeXlXMTVEMHcxYzJhRzl1X2Q4Qmc2dGl3SVJlMTAzWVNmcDNUazZfTjBzclRRNjlMVUtva1ROUUJYSFlYWG55ZWx4NVJfVnBOSjY1XzFPZVh4MFFMNVpROWRKeWhraW5HS3BxSmJ4Nk43eU5rVjM4YkZiaUdSSXdrNEtjQ0pwM3hN?oc=5", "published": "2026-09-02T08:33:42+09:00", "category": "business"}, {"headline": "Self-Flying Planes: Crop Sprayers Lead the Way to Autonomous Skies", "excerpt": "Pilot-free aircraft, especially those used for crop spraying, are showing how self-flying technology could change the future of aviation.", "levels": {"Beginner": {"text": "Self-flying planes are coming. These planes fly without a pilot inside. They are called 'autonomous' aircraft. One important use for these planes is spraying crops. Farmers use them to spray fields with water or special liquids. This helps plants grow well.\n\nThese crop-spraying planes are showing us how pilot-free flying can work safely. They are like the first step to a future where more planes fly themselves.\n\nRight now, most planes still have pilots. But technology is getting better. Soon, we might see more self-flying planes in different jobs. They could deliver packages or even carry people one day.\n\nThe idea is to make flying safer and more efficient. Without a pilot, planes might fly more directly. They could also fly more often. This new way of flying could change how we travel and move goods around the world. Crop-spraying drones are leading the way for this big change in the sky.", "vocab": [{"word": "Pilot", "definition": "A person who flies an aircraft."}, {"word": "Autonomous", "definition": "Able to work or fly by itself without a person controlling it."}, {"word": "Crops", "definition": "Plants grown by farmers, like corn or wheat."}, {"word": "Spray", "definition": "To send out a liquid in small drops."}, {"word": "Efficient", "definition": "Doing something well without wasting time or energy."}, {"word": "Technology", "definition": "The use of science for practical purposes, like making machines."}]}, "Intermediate": {"text": "The concept of self-flying planes, or autonomous aircraft, is moving from science fiction to reality. While commercial passenger flights still rely on human pilots, a significant advancement is occurring in specialized areas, particularly with crop-spraying aircraft. These pilot-free drones are demonstrating the practical capabilities and potential of autonomous flight.\n\nFarmers are increasingly using autonomous aircraft to spray their fields. These drones can apply water, fertilizers, or pesticides precisely, often reaching areas that are difficult for traditional manned aircraft or ground vehicles. This precision helps reduce waste and can improve crop yields. More importantly, it removes human pilots from potentially hazardous low-altitude flying conditions, enhancing safety.\n\nThese crop-spraying drones are at the forefront of developing and testing autonomous flight technology. They operate in controlled environments, which makes them ideal for refining the systems needed for pilot-free operation. The data and experience gained from these operations are crucial for the broader adoption of autonomous aviation.\n\nThe future implications of self-flying planes extend beyond agriculture. Proponents suggest that autonomous flight could lead to safer skies by eliminating human error, which is a factor in many accidents. It could also make air travel more efficient and potentially less expensive by optimizing flight paths and reducing operational costs.\n\nHowever, challenges remain. Regulators need to establish clear rules for autonomous aircraft, and public acceptance is vital, especially for passenger transport. The technology must also prove its reliability and security in diverse conditions. Nevertheless, the success of autonomous crop-spraying planes indicates a promising trajectory for the transformation of aviation.", "vocab": [{"word": "Autonomous", "definition": "Operating independently without human control."}, {"word": "Specialized", "definition": "Designed or developed for a particular purpose or area."}, {"word": "Pesticides", "definition": "Chemicals used to destroy insects or other organisms harmful to cultivated plants or animals."}, {"word": "Hazardous", "definition": "Dangerous or risky."}, {"word": "Forefront", "definition": "The leading or most important position or place."}, {"word": "Proponents", "definition": "People who support an idea or plan."}, {"word": "Trajectory", "definition": "The path followed by a moving object; here, a path of development."}]}, "Advanced": {"text": "The long-held vision of autonomous aircraft, once confined to the realm of science fiction, is steadily transitioning into a tangible reality. While the prospect of pilot-free commercial passenger jets remains a distant, albeit increasingly plausible, future, the groundwork for this revolutionary shift is being meticulously laid by specialized applications, most notably in the agricultural sector. Autonomous crop-spraying aircraft are not merely novelties; they are pioneering the operational protocols and technological advancements that will underpin broader autonomous aviation.\n\nThese sophisticated drones are transforming agricultural practices by offering unparalleled precision in the application of water, fertilizers, and pesticides. Equipped with advanced GPS, sensors, and artificial intelligence, they can navigate complex terrains, identify specific areas requiring treatment, and dispense substances with minimal waste. This targeted approach not only enhances crop yields and reduces environmental impact but also significantly mitigates the inherent risks associated with low-altitude flying for human pilots, thereby improving safety for agricultural workers.\n\nThe success of these crop-spraying operations is critical. They serve as real-world laboratories for refining the intricate systems required for truly autonomous flight, including obstacle avoidance, real-time decision-making, and robust communication protocols. The data gathered from thousands of hours of flight time in diverse environmental conditions provides invaluable insights for engineers and regulators alike, accelerating the development cycle for more complex autonomous platforms.\n\nBeyond agriculture, the implications of fully autonomous aviation are profound. Advocates contend that removing human error, a primary contributor to aviation accidents, could dramatically enhance air safety. Furthermore, autonomous systems promise greater operational efficiency through optimized flight paths, reduced fuel consumption, and the potential for continuous operation without crew rest requirements. This could lead to substantial cost savings for airlines and logistics companies, potentially making air travel and cargo transport more accessible and affordable.\n\nHowever, the path to widespread adoption is fraught with significant challenges. Regulatory frameworks worldwide are still grappling with how to certify and oversee autonomous aircraft, particularly concerning air traffic control integration and liability in the event of an incident. Public perception and acceptance also represent a formidable hurdle, especially for passenger transport, where trust in technology must supersede traditional reliance on human oversight. Cybersecurity concerns, ensuring these systems are impervious to malicious attacks, are paramount.\n\nDespite these obstacles, the trajectory is clear. The incremental successes in niche applications like crop spraying are paving the way for a phased introduction of autonomous capabilities across various aviation sectors, from cargo delivery and surveillance to urban air mobility. The transformation of the skies, spearheaded by these pilot-free pioneers, appears not a question of if, but when.", "vocab": [{"word": "Tangible", "definition": "Perceptible by touch; clear and definite; real."}, {"word": "Meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "Unparalleled", "definition": "Having no equal or rival; exceptional."}, {"word": "Mitigates", "definition": "Makes something less severe, serious, or painful."}, {"word": "Profound", "definition": "Very great or intense; having or showing great knowledge or insight."}, {"word": "Fraught", "definition": "Filled with or destined to result in (something undesirable)."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Impervious", "definition": "Not allowing fluid to pass through; unable to be affected by."}]}}, "questions": [{"q": "What kind of self-flying aircraft are mentioned as leading the way in pilot-free flying?", "a": "Autonomous crop-spraying aircraft are mentioned as leading the way in pilot-free flying."}, {"q": "Besides crop spraying, what are some potential benefits or future uses of self-flying planes mentioned in the articles?", "a": "Self-flying planes could make flying safer and more efficient, deliver packages, carry people, optimize flight paths, reduce operational costs, and be used for cargo delivery, surveillance, and urban air mobility."}], "id": "a3f3291157d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c1l123mmrg7o?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:27:35+09:00", "category": "business"}, {"headline": "Smart Ways to Save Money When Eating Out", "excerpt": "As dining out costs rise, many are looking for clever strategies to enjoy restaurant meals without breaking the bank.", "levels": {"Beginner": {"text": "Eating out at restaurants can be fun, but it can also be expensive. Many people want to find ways to save money when they go out to eat. Luckily, there are some smart tricks you can use.\n\nOne good way is to look for \"soft launches.\" This is when a new restaurant first opens. They might offer special discounts or cheaper prices to get people to try their food. It helps them practice and get feedback before they fully open.\n\nAnother trick is to eat at \"late sittings.\" This means going to dinner later in the evening. Sometimes, restaurants offer lower prices for tables that are booked later. They want to make sure all their tables are full, even at less popular times.\n\nYou can also look for special offers or vouchers online or in newspapers. Many restaurants have deals like \"buy one get one free\" or a percentage off your total bill. Planning ahead and looking for these deals can help you enjoy a meal out without spending too much money. Cooking at home is always the cheapest option, but these tips help when you want to treat yourself.", "vocab": [{"word": "expensive", "definition": "costing a lot of money."}, {"word": "save", "definition": "to keep money instead of spending it."}, {"word": "discounts", "definition": "reductions in the usual price of something."}, {"word": "offers", "definition": "special deals or prices."}, {"word": "vouchers", "definition": "small pieces of paper that give you a discount or free item."}, {"word": "treat", "definition": "to buy or do something special for yourself or someone else."}]}, "Intermediate": {"text": "The cost of dining out has been increasing, making it harder for many people to enjoy meals at restaurants without spending too much. However, with some clever planning and awareness, it's possible to find cheaper deals and save money.\n\nOne effective strategy is to look for \"soft launches.\" These occur when a new restaurant is about to open officially. During a soft launch, the restaurant might offer reduced prices, special set menus, or discounts on food to attract early customers. This period allows them to test their kitchen, service, and menu, while also generating buzz and getting valuable feedback from diners.\n\nAnother smart approach is to consider \"late sittings.\" Restaurants often have peak times, usually earlier in the evening. To ensure tables are filled during quieter periods, some establishments offer incentives for later bookings. Eating dinner a bit later can sometimes lead to better deals or special offers that are not available during prime dining hours.\n\nBeyond these specific timing strategies, there are other common ways to cut costs. Many restaurants provide \"early bird\" deals for diners who eat before a certain time, typically in the late afternoon or early evening. Loyalty programs, where you earn points or rewards for frequent visits, can also lead to future savings. Additionally, searching for online vouchers or promotional codes before you book can significantly reduce your bill. Websites and apps often list various discounts available for local eateries. While cooking at home remains the most budget-friendly option, these tips help make dining out more affordable.", "vocab": [{"word": "increasing", "definition": "getting bigger or growing in amount."}, {"word": "strategy", "definition": "a plan of action designed to achieve a goal."}, {"word": "effective", "definition": "successful in producing a desired or intended result."}, {"word": "incentives", "definition": "things that encourage or motivate someone to do something."}, {"word": "loyalty programs", "definition": "schemes that reward customers for repeatedly buying from a business."}, {"word": "promotional codes", "definition": "special codes that offer discounts or deals when used."}, {"word": "affordable", "definition": "inexpensive enough for people to buy."}]}, "Advanced": {"text": "In an era of escalating living costs and persistent inflation, the pleasure of dining out has become an increasingly significant expenditure for many consumers. As the hospitality sector grapples with rising operational costs, diners are becoming more discerning, actively seeking strategies to mitigate expenses without entirely foregoing the restaurant experience. Fortunately, a variety of shrewd approaches can help individuals enjoy culinary delights while keeping their budgets intact.\n\nOne highly effective method involves capitalizing on \"soft launches.\" These pre-opening phases for new restaurants serve multiple purposes: they allow the establishment to fine-tune its kitchen operations, train staff, and gather crucial customer feedback on the menu and service, all before its official grand opening. To incentivize patronage during this trial period, new venues frequently offer substantial discounts, fixed-price tasting menus at reduced rates, or complimentary items. For the savvy diner, this presents an excellent opportunity to experience a new eatery at a fraction of the eventual cost.\n\nAnother key strategy revolves around optimizing dining times, particularly through \"late sittings.\" Restaurants typically experience peak demand during conventional dinner hours. To maximize table occupancy and revenue during less popular slots, many establishments offer attractive deals for bookings made later in the evening. Similarly, \"early bird\" specials, designed to attract customers during the early evening lull, provide another avenue for cost savings. These off-peak promotions are a form of yield management, allowing restaurants to smooth out demand and ensure consistent patronage throughout their operating hours.\n\nBeyond timing, consumers can leverage a host of other tactics. Enrolling in restaurant loyalty programs can yield significant long-term benefits, accumulating points that translate into discounts, free meals, or exclusive offers. Many restaurants also partner with third-party aggregators and online booking platforms, which frequently feature exclusive vouchers, percentage-off deals, or 'two-for-one' promotions. Diligent research before booking, checking both the restaurant's direct website and popular deal sites, can uncover substantial savings. Furthermore, opting for lunch menus, which are often more affordably priced than dinner equivalents, or choosing set menus over à la carte options, can also contribute to a more economical dining experience. While home cooking remains the most financially prudent choice, these judiciously applied strategies enable food enthusiasts to continue enjoying the vibrant restaurant scene without undue financial strain.", "vocab": [{"word": "escalating", "definition": "increasing rapidly; becoming more intense or serious."}, {"word": "discerning", "definition": "having or showing good judgment; able to perceive subtle distinctions."}, {"word": "capitalize", "definition": "to take the chance to gain advantage from; to make the most of something."}, {"word": "incentivize", "definition": "to provide something (such as money or a reward) that encourages someone to do something."}, {"word": "aggregators", "definition": "websites or applications that collect and display information from various sources."}, {"word": "judiciously", "definition": "with good judgment or sense; wisely and carefully."}, {"word": "hospitality sector", "definition": "the industry that provides services to customers, including hotels, restaurants, and tourism."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}]}}, "questions": [{"q": "What is a 'soft launch' in the context of dining out?", "a": "A 'soft launch' is when a new restaurant opens for a trial period before its official grand opening, often offering discounts or special prices to test operations and get feedback."}, {"q": "Besides soft launches and late sittings, what are some other common ways mentioned to save money when eating out?", "a": "Other common ways include looking for early bird deals, using loyalty programs, finding online vouchers or promotional codes, opting for lunch menus, or choosing set menus."}], "id": "a70e2ea80c0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c2dy8kz867go?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:26:38+09:00", "category": "business"}, {"headline": "Thinktank Suggests Tax Rise for UK Defence Spending", "excerpt": "A UK thinktank proposes raising taxes on middle earners to fund increased defence spending, a move supported by former Chancellor John Healey.", "levels": {"Beginner": {"text": "A group called the Resolution Foundation says the UK needs more money for its army and navy. They think the government should ask people who earn a middle amount of money to pay more taxes. This extra money would help pay for better defence. \n\nJohn Healey, a important person in politics, agrees. He used to work for the government but he left his job. He left because he felt the government was not spending enough money on defence. He believes the country needs to be safer, and that means spending more. \n\nThe Resolution Foundation says that the UK's taxes are not as high as in some other countries. They call this a 'tax wedge'. They believe making this 'tax wedge' bigger, especially for middle earners, is a way to get the money needed. This idea could help the UK have a stronger defence.", "vocab": [{"word": "defence", "definition": "the protection of a country from attack"}, {"word": "taxes", "definition": "money that people pay to the government"}, {"word": "earners", "definition": "people who make money from their work"}, {"word": "agrees", "definition": "has the same opinion"}, {"word": "safer", "definition": "more protected from danger"}]}, "Intermediate": {"text": "A prominent UK thinktank, the Resolution Foundation, has put forward a proposal for how the country can fund significantly higher defence spending. They suggest that the government should consider increasing taxes on middle earners. This recommendation comes as the UK faces calls to bolster its military capabilities amid evolving global security challenges.\n\nThe thinktank highlights that the UK currently has an 'internationally low tax wedge.' The 'tax wedge' refers to the difference between what an employer pays for an employee and what the employee actually takes home after taxes and social contributions. The Resolution Foundation argues that this gap needs to widen, particularly for those in the middle-income bracket, to generate the necessary funds.\n\nThis idea resonates with John Healey, a former Chancellor who resigned from government in June. Healey's resignation was a protest against what he perceived as the previous administration's insufficient funding for defence. He has consistently advocated for a more robust financial commitment to national security. The thinktank's proposal offers a concrete pathway to achieve the increased defence budget that Healey and others believe is essential for the UK's future safety and international standing.", "vocab": [{"word": "prominent", "definition": "important and well-known"}, {"word": "proposal", "definition": "a plan or suggestion"}, {"word": "bolster", "definition": "to make something stronger or support it"}, {"word": "perceived", "definition": "understood or thought of in a particular way"}, {"word": "insufficient", "definition": "not enough; inadequate"}, {"word": "advocated", "definition": "publicly supported or recommended a particular cause or policy"}]}, "Advanced": {"text": "The Resolution Foundation, a respected UK thinktank, has issued a significant recommendation: to finance a substantial increase in defence spending, the government should contemplate raising taxes on middle-income earners. This proposition emerges amidst growing pressure for the UK to enhance its military capabilities and meet its NATO commitments in an increasingly volatile global security landscape.\n\nThe thinktank's analysis points to the UK's comparatively low 'tax wedge' as a key factor. The 'tax wedge' is the divergence between the total labour cost to an employer and the net disposable income received by an employee, encompassing income tax and social security contributions. The Resolution Foundation contends that this differential, particularly for middle earners, is lower than in many comparable advanced economies, suggesting a fiscal capacity that could be leveraged for defence.\n\nThis perspective aligns strongly with John Healey, who previously served as Chancellor. Healey's high-profile resignation from government in June stemmed from his profound disagreement with what he argued was the then-prime minister's inadequate provision for defence. His departure underscored a deep-seated concern within political circles regarding the nation's preparedness and the financial resources allocated to its armed forces. Healey has been a vocal proponent for a more robust defence budget, viewing it as indispensable for national security and the UK's international credibility.\n\nThe Resolution Foundation's suggestion, while potentially politically contentious, offers a concrete mechanism to address this funding gap. It posits that relying solely on cuts to other public services or increased borrowing might be unsustainable or insufficient. By targeting the 'tax wedge' on middle earners, the thinktank proposes a direct and potentially substantial revenue stream, challenging policymakers to confront difficult fiscal choices to safeguard the nation's strategic interests and fulfil its defence ambitions. The debate now shifts to how such a policy could be implemented without unduly burdening a crucial segment of the electorate.", "vocab": [{"word": "contemplate", "definition": "to think deeply or carefully about something, especially a possible future action or decision"}, {"word": "proposition", "definition": "a statement or assertion that expresses a judgment or opinion; a suggested plan or scheme"}, {"word": "divergence", "definition": "the process or state of separating and going in different directions; a difference or disparity"}, {"word": "encompassing", "definition": "including or covering a wide range of things; surrounding and holding within"}, {"word": "contends", "definition": "asserts something as a position in an argument; struggles to surmount a difficulty"}, {"word": "indispensable", "definition": "absolutely necessary or essential; not able to be done without"}, {"word": "contentious", "definition": "causing or likely to cause an argument; controversial"}, {"word": "electorate", "definition": "all the people in a country or area who are entitled to vote in an election"}]}}, "questions": [{"q": "What is the main suggestion made by the Resolution Foundation?", "a": "The Resolution Foundation suggests raising taxes on middle earners to fund increased defence spending."}, {"q": "Why did John Healey resign from his government position?", "a": "John Healey resigned because he believed the government was not adequately funding defence."}], "id": "ab4b8ef963f", "source": "Business | The Guardian", "link": "https://www.theguardian.com/politics/2026/sep/02/fund-defence-spending-from-tax-rise-on-middle-earners-thinktank-tells-healey", "published": "2026-09-02T08:01:16+09:00", "category": "business"}, {"headline": "S&P Upgrades Illinois' Credit Rating to 'A', Signaling Financial Strength", "excerpt": "Illinois' financial health has improved, as S&P Global Ratings upgraded the state's credit rating to 'A', a positive sign for its economy.", "levels": {"Beginner": {"text": "Illinois has received good news about its money. S&P Global Ratings, a big company that checks how states manage their finances, has given Illinois a better score. This score is called a credit rating. Illinois' rating went up to 'A'. This is a very good sign.\n\nA credit rating is like a report card for a state's financial health. When a state has a good rating, it means it is good at paying its bills and managing its money. This makes it easier and cheaper for the state to borrow money if it needs to build roads or schools.\n\nThis upgrade to 'A' is the best rating Illinois has had in a long time, over ten years. It shows that Illinois has been doing better with its budget. The state has been saving money and paying off its debts. This helps make its financial future stronger. People who lend money to Illinois will see it as a safer place to invest. This is good for everyone in Illinois because it can lead to more money for important services.", "vocab": [{"word": "upgrade", "definition": "to make something better or higher."}, {"word": "credit rating", "definition": "a score that shows how good a state or person is at paying back money."}, {"word": "financial health", "definition": "how well a state or person is managing their money."}, {"word": "borrow", "definition": "to take money from someone with the plan to pay it back later."}, {"word": "debt", "definition": "money that is owed to someone else."}, {"word": "budget", "definition": "a plan for how to spend and save money."}]}, "Intermediate": {"text": "Illinois has achieved a significant financial milestone. S&P Global Ratings, one of the leading credit rating agencies, has upgraded the state's general obligation credit rating to 'A'. This marks a notable improvement in Illinois' financial standing and is the highest rating the state has received from S&P in over a decade.\n\nA credit rating serves as an assessment of a borrower's ability to meet its financial obligations. For a state, a higher rating indicates stronger fiscal health and a lower risk for investors. The 'A' rating places Illinois firmly in the investment-grade category, signaling to bond markets that the state is a reliable borrower.\n\nThis upgrade carries several important benefits. Primarily, it means Illinois can borrow money at lower interest rates. When the state needs to fund major infrastructure projects, like roads, bridges, or schools, it often issues bonds. A better credit rating reduces the cost of borrowing, saving taxpayer money that can then be redirected to other essential public services. Furthermore, it enhances investor confidence, making Illinois bonds more attractive to a wider range of institutional investors.\n\nS&P cited several factors contributing to the upgrade. These include Illinois' sustained fiscal improvements, such as maintaining budget surpluses, paying down outstanding debt, and strengthening its reserves. The state's economy has also shown resilience. This consistent financial discipline over recent years has demonstrated a commitment to long-term fiscal stability, moving Illinois away from its historically challenging financial position. The upgrade reflects a positive outlook for the state's ongoing financial management.", "vocab": [{"word": "milestone", "definition": "an important event or stage in the development of something."}, {"word": "general obligation credit rating", "definition": "a rating for a state's promise to pay back money using all its available resources."}, {"word": "fiscal health", "definition": "the condition of a government's finances."}, {"word": "investment-grade", "definition": "a rating that shows a bond is a relatively safe investment."}, {"word": "infrastructure projects", "definition": "large public construction projects like roads, bridges, and buildings."}, {"word": "investor confidence", "definition": "how much investors trust that an investment will be safe and profitable."}, {"word": "fiscal discipline", "definition": "careful and controlled management of money by a government."}]}, "Advanced": {"text": "Illinois has achieved a significant financial turnaround, as S&P Global Ratings announced an upgrade to the state's general obligation credit rating, elevating it to 'A'. This marks the highest rating Illinois has received from S&P in over a decade, signaling a substantial improvement in its fiscal trajectory and market perception.\n\nA credit rating is a critical assessment by agencies like S&P, Moody's, and Fitch, evaluating a government's capacity and willingness to meet its financial obligations. An 'A' rating places Illinois firmly within the upper tier of investment-grade bonds, indicating a strong capacity to repay debt, albeit with some susceptibility to adverse economic conditions. This upgrade is particularly noteworthy given Illinois' long history of fiscal challenges, which saw its credit ratings languish at the lowest investment-grade levels, and even near junk status, for extended periods.\n\nThe implications of this upgrade are far-reaching. For the state, it translates directly into lower borrowing costs. When Illinois issues bonds to finance essential infrastructure projects—such as transportation networks, educational facilities, or public utilities—a higher credit rating allows it to secure more favorable interest rates. This reduction in debt service costs frees up hundreds of millions of taxpayer dollars annually, which can then be reallocated to vital public services, pension obligations, or further debt reduction efforts. Moreover, an improved rating enhances investor confidence, broadening the pool of potential bond buyers and potentially stabilizing bond prices.\n\nS&P attributed the upgrade to a confluence of factors demonstrating Illinois' commitment to fiscal responsibility. Key among these are several years of sustained budget surpluses, which have allowed the state to significantly pay down its bill backlog and bolster its rainy-day fund. The state's pension systems, while still a long-term challenge, have also seen efforts towards improved funding. Furthermore, Illinois' robust economic recovery post-pandemic, characterized by strong employment growth and a resilient tax base, has provided a stable revenue stream. The agency also noted the state's proactive management of its financial liabilities and a more disciplined approach to budgeting.\n\nThis positive development reflects a deliberate and consistent effort by state leadership to stabilize Illinois' finances. While the 'A' rating is a testament to progress, ongoing vigilance will be crucial to maintain this trajectory. Future challenges, including persistent pension liabilities and potential economic downturns, will continue to test the state's fiscal resilience. Nevertheless, this upgrade represents a pivotal moment, affirming Illinois' improved financial health and its enhanced standing in the municipal bond market.", "vocab": [{"word": "fiscal trajectory", "definition": "the path or direction of a government's financial health over time."}, {"word": "market perception", "definition": "how investors and the financial market view a particular asset or entity."}, {"word": "general obligation credit rating", "definition": "a rating for bonds backed by the full faith and credit (taxing power) of a government."}, {"word": "investment-grade bonds", "definition": "bonds considered to have a relatively low risk of default, making them suitable for institutional investors."}, {"word": "susceptibility", "definition": "the state of being easily affected or harmed by something."}, {"word": "confluence", "definition": "a coming together of two or more things; a convergence."}, {"word": "bolster", "definition": "to support or strengthen."}, {"word": "pension liabilities", "definition": "the financial obligations a government has to pay retirement benefits to its former employees."}]}}, "questions": [{"q": "What organization upgraded Illinois' credit rating?", "a": "S&P Global Ratings."}, {"q": "What is one major benefit for Illinois now that its credit rating has improved?", "a": "Illinois can borrow money at lower interest rates, saving taxpayer money, and it enhances investor confidence."}], "id": "a8940965984", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijgFBVV95cUxPamhDaUVMWVZSR1IxcG9VZUxWeEpVSlVJYXVzQnppX0pxS0RIRG9HSHlDT3RFVWUtVDljUGlOQWFIYVBMczB6OXlaN21fZGxNTnd0T0NCTFQzeExZRFU3RHpXdUVLS1RtNGdLT3Fua0N0VkdHQXR5a255OWhyblJGU1oxRkdjRkpiNFEydVlB?oc=5", "published": "2026-09-02T08:01:00+09:00", "category": "business"}]}, {"key": "economics", "title": "Economics", "articles": [{"headline": "Self-Flying Planes: Autonomous Aircraft Lead Aviation's Future", "excerpt": "Autonomous crop-spraying aircraft are pioneering pilot-free flight, demonstrating how self-flying technology could transform the future of aviation.", "levels": {"Beginner": {"text": "Imagine planes flying without a pilot inside. This is happening now! These are called 'self-flying planes' or 'autonomous aircraft'.\nRight now, small self-flying planes are very busy helping farmers. They spray crops with water or special liquids. This job used to be done by pilots in regular planes.\nUsing self-flying planes for crop spraying has many good points. First, it can be safer. Pilots don't have to fly low over fields, which can be a risky job. These autonomous planes can do the work without putting a human pilot in danger.\nSecond, these planes can work very precisely. They use special technology to spray only where needed. This saves money because less liquid is wasted. It also helps the environment by using fewer chemicals overall.\nThese special planes are showing us a new way to fly. They are like a first step for future planes that might fly people or deliver packages without a pilot. It's an exciting change for the sky and how we think about flying!", "vocab": [{"word": "Pilot", "definition": "A person who flies an aircraft."}, {"word": "Autonomous", "definition": "Able to work by itself, without human control."}, {"word": "Crops", "definition": "Plants grown by farmers for food."}, {"word": "Spray", "definition": "To send out small drops of liquid."}, {"word": "Precisely", "definition": "Exactly and carefully."}, {"word": "Environment", "definition": "The natural world around us."}]}, "Intermediate": {"text": "The future of aviation is taking flight, not with human pilots at the controls, but with autonomous aircraft. These self-flying planes are currently making significant advancements, particularly in the agricultural sector. Crop-spraying drones and aircraft are leading the way, demonstrating the practical applications and potential of pilot-free technology.\nTraditionally, crop spraying has been a hazardous task for human pilots, requiring low-altitude flights over uneven terrain. Autonomous aircraft eliminate this risk by performing these operations without a person on board. Equipped with advanced GPS and sensor technology, these planes can navigate fields with remarkable accuracy. They can identify specific areas requiring treatment, applying pesticides or fertilizers precisely where needed. This targeted approach not only reduces the amount of chemicals used, leading to environmental benefits, but also improves efficiency and lowers operational costs for farmers.\nThe success of autonomous crop-spraying is paving the way for broader adoption of pilot-free aviation. While passenger flights without pilots are still a distant prospect, the technology is being explored for cargo delivery, surveillance, and other specialized tasks. The development in agriculture serves as a crucial testing ground, allowing engineers to refine systems for navigation, safety protocols, and emergency responses.\nHowever, the widespread integration of autonomous aircraft faces challenges. Regulatory frameworks need to be established to ensure safety standards are met. Public acceptance is another key factor, as people become accustomed to the idea of flying in or alongside pilot-free vehicles. Despite these hurdles, the progress in autonomous crop-spraying suggests a transformative era for the skies, promising safer, more efficient, and environmentally friendly aerial operations.", "vocab": [{"word": "Aviation", "definition": "The activity of flying aircraft."}, {"word": "Autonomous", "definition": "Operating independently without human control."}, {"word": "Sector", "definition": "A part or division of an area or activity."}, {"word": "Hazardous", "definition": "Dangerous or risky."}, {"word": "Terrain", "definition": "A stretch of land, especially with regard to its physical features."}, {"word": "Precisely", "definition": "With great accuracy or exactness."}, {"word": "Regulatory", "definition": "Relating to the control or supervision of something by rules."}]}, "Advanced": {"text": "The aerospace industry is on the cusp of a profound transformation, spearheaded by the burgeoning field of autonomous aircraft. While the concept of pilotless planes might evoke images of science fiction, practical applications are already taking flight, most notably within the agricultural sector. Autonomous crop-spraying aircraft are not merely experimental prototypes; they are operational workhorses, demonstrating the tangible benefits and robust capabilities of pilot-free technology, thereby setting a precedent for wider adoption across various aviation domains.\n\nHistorically, aerial crop dusting and spraying have been among the most perilous tasks in aviation, demanding exceptional skill and exposing pilots to significant risks, including low-altitude flight, proximity to obstacles, and exposure to chemicals. Autonomous systems fundamentally mitigate these dangers. Equipped with sophisticated GPS, LiDAR, and advanced sensor arrays, these aircraft navigate agricultural landscapes with unparalleled precision. Integrated with artificial intelligence and machine learning algorithms, they can analyze real-time data to identify specific areas requiring treatment, optimizing the application of pesticides, fertilizers, or water. This targeted approach dramatically reduces chemical runoff, minimizes environmental impact, and enhances resource efficiency, translating into substantial cost savings for farmers and promoting sustainable agricultural practices.\n\nThe success witnessed in agricultural aviation serves as a critical proving ground for the maturation of autonomous flight technology. It allows engineers to rigorously test and refine complex systems for navigation, obstacle avoidance, redundant safety protocols, and emergency management in real-world, dynamic environments. The data and insights gleaned from these operations are invaluable for developing the robust certification standards and operational guidelines that will be essential for future applications.\n\nLooking beyond agriculture, the implications for the broader aviation ecosystem are immense. While fully autonomous passenger airliners remain a long-term aspiration, the technology is rapidly advancing for cargo logistics, surveillance, infrastructure inspection, and even urban air mobility. The transition to pilot-free operations promises to enhance safety by eliminating human error, increase operational efficiency by allowing for continuous flight cycles, and potentially reduce operational costs.\n\nHowever, the path to widespread integration is fraught with significant challenges. Establishing comprehensive regulatory frameworks that address air traffic management, cybersecurity, and liability is paramount. Public perception and trust represent another formidable hurdle; convincing the populace of the inherent safety and reliability of autonomous flight systems will require transparent communication and a flawless safety record. Ethical considerations, such as the role of human oversight in critical situations and the potential impact on aviation employment, also demand careful deliberation.\n\nDespite these complexities, the pioneering role of autonomous crop-spraying aircraft underscores a pivotal shift. They are not just spraying crops; they are cultivating the future of aviation, demonstrating that pilot-free flight is not only feasible but also offers compelling advantages that could revolutionize how we utilize our skies.", "vocab": [{"word": "Profound", "definition": "Very great or intense; having a deep impact or effect."}, {"word": "Spearheaded", "definition": "Led or initiated (an attack, movement, or project)."}, {"word": "Burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "Perilous", "definition": "Full of danger or risk; hazardous."}, {"word": "Mitigate", "definition": "To make less severe, serious, or painful."}, {"word": "Unparalleled", "definition": "Having no equal or comparison; exceptional or unmatched."}, {"word": "Redundant", "definition": "Not needed or useful; (in engineering) designed to be duplicated to ensure continued operation in case of failure."}, {"word": "Fraught", "definition": "Filled with or destined to result in (something undesirable)."}]}}, "questions": [{"q": "What kind of autonomous aircraft are currently leading the way in pilot-free flying?", "a": "Autonomous crop-spraying aircraft."}, {"q": "Name one benefit of using autonomous aircraft for crop spraying.", "a": "It can be safer for pilots, more precise in spraying, saves money, or helps the environment."}], "id": "a3f3291157d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c1l123mmrg7o?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:27:35+09:00", "category": "economics"}, {"headline": "Smart Tips to Save Money When Eating Out", "excerpt": "With restaurant prices rising, many people are looking for clever ways to enjoy meals out without spending too much money.", "levels": {"Beginner": {"text": "Eating out at restaurants can be fun, but it is also getting more expensive. Many people want to enjoy a meal outside their home without spending too much money. Luckily, there are smart ways to save.\n\nOne good way is to look for \"soft launches.\" This is when a new restaurant opens. They often give discounts to attract new customers. You can get a cheaper meal and try a new place.\n\nAnother tip is to eat at special times. Sometimes, restaurants have cheaper prices for lunch instead of dinner. Or they might have \"early bird\" deals if you eat before the busiest time. Eating later in the evening, after the main rush, can also sometimes offer deals.\n\nYou can also look for special offers online. Many websites and apps give discount codes for restaurants. Joining a restaurant's email list can also get you special deals and vouchers. Some restaurants have loyalty programs where you earn points for free food.\n\nBy planning a little, you can still enjoy tasty meals out and save your money. It's all about being smart before you go.", "vocab": [{"word": "expensive", "definition": "costs a lot of money."}, {"word": "discounts", "definition": "lower prices than usual."}, {"word": "attract", "definition": "to make someone interested in something."}, {"word": "deals", "definition": "special offers or agreements."}, {"word": "vouchers", "definition": "pieces of paper or codes that give you a discount."}, {"word": "loyalty programs", "definition": "systems where you get rewards for using a service many times."}]}, "Intermediate": {"text": "The pleasure of dining out has become increasingly costly for many consumers. With inflation impacting food prices, energy bills, and staff wages, restaurants are often forced to raise their menu prices. This trend means that enjoying a meal away from home now requires more careful planning to manage expenses.\n\nHowever, there are several effective strategies diners can employ to reduce the cost of eating out. One popular method involves seeking out \"soft launches.\" These are trial periods for new restaurants, during which they often offer significant discounts on food to gather feedback and build a customer base before their official grand opening. This presents a great opportunity to sample new cuisine at a reduced price.\n\nAnother smart approach is to consider dining during off-peak hours. Many establishments offer \"early bird\" menus or lunch specials that are considerably cheaper than their dinner counterparts. Similarly, some restaurants provide late-sitting deals, where prices are lower for tables booked later in the evening, after the main rush.\n\nLeveraging technology can also lead to savings. Many online platforms and restaurant-specific apps provide exclusive discount codes, vouchers, or \"buy-one-get-one-free\" offers. Signing up for restaurant newsletters or loyalty programs can also unlock personalized deals and accumulate points that can be redeemed for future meals or discounts. Furthermore, some restaurants allow customers to \"bring your own bottle\" (BYOB) for a small corkage fee, saving significantly on drink costs.\n\nBy being strategic and doing a little research, individuals can continue to enjoy the social and culinary experience of dining out without breaking the bank.", "vocab": [{"word": "inflation", "definition": "a general increase in prices and fall in the purchasing value of money."}, {"word": "consumers", "definition": "people who buy goods and services."}, {"word": "strategies", "definition": "plans of action designed to achieve a goal."}, {"word": "establishments", "definition": "businesses or organizations, often referring to restaurants or hotels."}, {"word": "off-peak hours", "definition": "times when a service is less busy or in demand."}, {"word": "leveraging", "definition": "using something to maximum advantage."}, {"word": "redeemed", "definition": "exchanged for money or goods/services."}]}, "Advanced": {"text": "The escalating cost of living has made the simple pleasure of dining out a luxury increasingly out of reach for many households. Restaurants themselves are grappling with a confluence of economic pressures, including soaring ingredient costs due to supply chain disruptions and climate change, rising energy prices, and the necessity of offering competitive wages to attract and retain staff. These factors inevitably translate into higher menu prices, prompting consumers to seek innovative ways to mitigate expenses without sacrificing the social and culinary experience.\n\nSavvy diners can employ a range of sophisticated strategies to navigate this challenging landscape. A prime opportunity often arises during \"soft launches\" – the preliminary operational phase of new eateries. During this period, establishments frequently offer substantial introductory discounts, sometimes up to 50% off food, to fine-tune their service, gather crucial customer feedback, and generate initial buzz before their official grand opening. This allows patrons to experience novel culinary concepts at a significantly reduced outlay.\n\nTiming is another critical element. Opting for off-peak dining, such as early bird specials or lunch menus, can yield considerable savings compared to prime dinner service. Many restaurants also introduce late-sitting deals, providing incentives for bookings later in the evening when the initial rush has subsided. Additionally, some venues offer fixed-price \"prix fixe\" menus or tasting menus that, while seemingly expensive, can offer better value than ordering à la carte, especially if they include multiple courses or wine pairings.\n\nFurthermore, digital engagement is paramount. Subscribing to restaurant newsletters, following social media channels, and utilizing dedicated dining apps often unlocks exclusive promotional codes, two-for-one offers, or loyalty points that accrue towards future discounts or complimentary meals. Some establishments permit \"Bring Your Own Bottle\" (BYOB) policies, charging a modest corkage fee, which can drastically reduce the overall bill given the typically high mark-ups on alcoholic beverages. Exploring restaurant aggregators and review sites can also reveal hidden gems offering excellent value.\n\nUltimately, a proactive and informed approach to dining out allows individuals to continue indulging in gastronomic experiences. By strategically planning visits, leveraging available promotions, and understanding the dynamics of restaurant pricing, consumers can effectively balance their desire for culinary exploration with their budgetary constraints.", "vocab": [{"word": "escalating", "definition": "increasing rapidly."}, {"word": "confluence", "definition": "a coming together of two or more things."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}, {"word": "patrons", "definition": "customers, especially of a restaurant or hotel."}, {"word": "outlay", "definition": "an amount of money spent on something."}, {"word": "culinary", "definition": "relating to cooking or the kitchen."}, {"word": "paramount", "definition": "more important than anything else."}, {"word": "gastronomic", "definition": "relating to the art or science of good eating."}]}}, "questions": [{"q": "What is one reason why eating out has become more expensive?", "a": "Eating out has become more expensive because of rising food prices, energy costs, and staff wages."}, {"q": "Name three different strategies people can use to save money when dining at restaurants.", "a": "Three strategies people can use are looking for \"soft launches\" at new restaurants, dining during off-peak hours (like lunch or early bird specials), and using online discount codes or loyalty programs."}], "id": "a70e2ea80c0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c2dy8kz867go?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:26:38+09:00", "category": "economics"}, {"headline": "Destry Confirmed as New Central Bank Chief", "excerpt": "Destry has been confirmed as the new head of the country's central bank, taking on a crucial role in managing the nation's economy.", "levels": {"Beginner": {"text": "Destry is the new boss of the country's central bank. This is a very important job. The central bank helps manage the country's money. It tries to keep prices stable so things don't get too expensive. This helps everyone in the country.\n\nWhen Destry starts, he will lead efforts to make sure the economy stays strong. The central bank also sets interest rates. These rates affect how much it costs to borrow money, like for a house or a business. If interest rates are high, borrowing costs more. If they are low, borrowing is cheaper.\n\nThe government confirmed Destry for this role. People hope he will do a good job guiding the economy. A strong central bank helps businesses grow and people find jobs. Destry's appointment means new leadership for this key institution. His decisions will impact how money works for families and companies across the nation. This news is important for the country's financial future.", "vocab": [{"word": "boss", "definition": "the person in charge of a group or organization."}, {"word": "stable", "definition": "not changing much; steady."}, {"word": "economy", "definition": "the system of how money is made and used in a country."}, {"word": "interest rates", "definition": "the extra money you pay when you borrow money, or earn when you save money."}, {"word": "impact", "definition": "to have a strong effect on something."}]}, "Intermediate": {"text": "Destry has been officially confirmed as the new chief of the nation's central bank, an appointment that carries significant weight for the country's economic future. This role is pivotal in shaping monetary policy, which involves managing the supply of money and credit to achieve economic stability and growth.\n\nThe central bank's primary responsibilities include controlling inflation, which is the rate at which prices for goods and services rise. By adjusting key interest rates, the central bank influences borrowing costs for consumers and businesses, thereby impacting spending and investment decisions. For example, raising interest rates can cool down an overheating economy and curb inflation, while lowering them can stimulate economic activity during a slowdown.\n\nDestry's confirmation comes at a time when many economies are navigating complex challenges, such as global inflation pressures, supply chain disruptions, and the need to foster sustainable growth. As the new chief, Destry will be tasked with making critical decisions that balance these competing objectives. The central bank also plays a crucial role in maintaining the stability of the financial system, overseeing banks, and ensuring confidence in the national currency.\n\nThe appointment process typically involves a nomination by the government, followed by a confirmation hearing or approval from a legislative body. Destry's leadership will be closely watched by financial markets, businesses, and the public, as the central bank's actions directly influence employment levels, consumer purchasing power, and overall economic prosperity. His tenure will be defined by how effectively he steers the economy through upcoming challenges and opportunities.", "vocab": [{"word": "confirmed", "definition": "officially stated that something is true or correct."}, {"word": "pivotal", "definition": "extremely important and central to something."}, {"word": "monetary policy", "definition": "the actions a central bank takes to control the amount of money and credit in an economy."}, {"word": "inflation", "definition": "a general increase in prices and fall in the purchasing value of money."}, {"word": "stimulate", "definition": "to encourage something to grow, develop, or become active."}, {"word": "disruptions", "definition": "problems that interrupt an event, activity, or process."}, {"word": "tenure", "definition": "the period of time when someone holds an important job or position."}]}, "Advanced": {"text": "Destry has officially been confirmed as the new governor of the nation's central bank, an appointment of profound significance for the trajectory of the country's economic landscape. This pivotal role places Destry at the helm of monetary policy, a complex framework designed to manage the money supply, credit conditions, and interest rates to foster macroeconomic stability, sustainable growth, and price equilibrium.\n\nThe central bank's mandate typically encompasses several critical objectives: maintaining price stability by controlling inflation, promoting maximum sustainable employment, and ensuring the stability of the financial system. To achieve these, the governor wields considerable influence over tools such as the benchmark interest rate, open market operations, and reserve requirements. For instance, in an environment of escalating inflation, the central bank might implement tighter monetary policy, raising interest rates to dampen aggregate demand and curb price pressures. Conversely, during economic downturns, accommodative policies, like lowering rates or quantitative easing, can be deployed to inject liquidity and stimulate economic activity.\n\nDestry's confirmation arrives at a juncture marked by multifaceted global economic challenges, including persistent inflationary pressures stemming from supply chain bottlenecks and geopolitical tensions, alongside the imperative to navigate potential slowdowns in international trade and investment. The new governor will be tasked with calibrating monetary policy to strike a delicate balance between containing inflation without stifling economic growth, a challenge often referred to as achieving a \"soft landing.\" Furthermore, the central bank's independence from political interference is paramount, allowing it to make decisions based purely on economic data and long-term stability rather than short-term political expediency.\n\nThe appointment process, often involving rigorous parliamentary scrutiny following a government nomination, underscores the gravity of the position. Financial markets, domestic businesses, and international investors will meticulously scrutinize Destry's initial policy statements and actions for indications of the central bank's future direction. The effectiveness of Destry's tenure will largely hinge on the ability to anticipate and respond adeptly to evolving economic conditions, communicate policy clearly, and maintain credibility in an increasingly interconnected and volatile global economy. This leadership transition is expected to shape the nation's financial outlook for years to come.", "vocab": [{"word": "governor", "definition": "the chief official of a central bank."}, {"word": "trajectory", "definition": "the path or course that something follows."}, {"word": "pivotal", "definition": "extremely important and central to the success of something."}, {"word": "macroeconomic stability", "definition": "a state where a country's economy experiences steady growth, low inflation, and low unemployment."}, {"word": "mandate", "definition": "an official order or commission to do something; the authority given to a central bank to achieve certain goals."}, {"word": "wields", "definition": "holds and uses (a weapon or tool); exercises (power or influence)."}, {"word": "calibrating", "definition": "adjusting or fine-tuning something to ensure accuracy or optimal performance."}, {"word": "paramount", "definition": "more important than anything else; supreme."}]}}, "questions": [{"q": "What is one main responsibility of a central bank, as mentioned in the articles?", "a": "One main responsibility of a central bank is to manage the country's money supply and keep prices stable (control inflation)."}, {"q": "What kind of decisions will Destry, as the new central bank chief, need to make regarding interest rates?", "a": "Destry will need to decide whether to raise or lower interest rates to influence borrowing costs, spending, and economic growth, balancing inflation control with economic stimulation."}], "id": "a1c91011070", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxPeXJKYWxWUkNCZVhRbXVMUEJyN3dlWXNtWFctaG9BVXJIMUdmNFBvQ3VYOHRRZndjZU92Qml4ZXZaNEVDbW5uVV9zcFdPRXlSRTdscHg5UFUxSm1KTzRYZWpWa2t2LVluLURDVUU3RDYtWFJvbHNKajdLeEJXc29ZV0kxYzBFQTRlMi1nSU9QRm1Pd1VKanFQWVNOVkdMUld4X0ppYjAzNU8?oc=5", "published": "2026-09-02T08:26:15+09:00", "category": "economics"}, {"headline": "Schroders Bullish on Gold Amid Central Bank Buying", "excerpt": "Investment firm Schroders is more optimistic about gold's future, pointing to strong purchases by central banks around the world.", "levels": {"Beginner": {"text": "A big investment company called Schroders thinks gold prices will go up. They are now more positive about gold. The main reason for this is that central banks are buying a lot of gold. Central banks are like the main banks for countries. They keep money safe and manage the economy.\n\nGold is often seen as a safe place to put money. When the economy is not certain, or when prices for things are going up (this is called inflation), many people and banks like to buy gold. It helps protect their money's value.\n\nSchroders also noted that some investors are buying gold when its price drops a little. This is called 'dip buying.' These buyers believe the price will go back up soon. Because central banks are buying so much, it makes gold look like a strong investment for the future. This strong demand from big banks helps keep gold's value high.", "vocab": [{"word": "bullish", "definition": "Expecting prices to rise."}, {"word": "central banks", "definition": "Main banks for countries that manage money and the economy."}, {"word": "inflation", "definition": "When prices for goods and services go up over time."}, {"word": "protect", "definition": "To keep safe from harm or loss."}, {"word": "demand", "definition": "The desire of buyers for a product or service."}]}, "Intermediate": {"text": "Schroders, a global asset management company, has turned more optimistic, or 'bullish,' on the outlook for gold. This shift in sentiment is largely attributed to the sustained purchasing of the precious metal by central banks worldwide. Central banks serve as the financial authorities for their respective nations, managing monetary policy and holding reserves to ensure economic stability.\n\nGold has long been considered a safe-haven asset, meaning investors often turn to it during times of economic uncertainty, geopolitical instability, or when there are concerns about inflation. Its value tends to hold up better than other assets when markets are volatile or when the purchasing power of traditional currencies is eroding. Central banks buy gold to diversify their foreign exchange reserves, hedge against inflation, and maintain financial stability.\n\nAccording to Schroders, the consistent demand from these powerful institutions is a significant factor supporting gold's price. Furthermore, the firm observes that 'dip buyers' are entering the market. These are investors who purchase an asset after its price has fallen slightly, anticipating that it will rebound. This behavior indicates confidence among a segment of investors that gold's long-term trajectory is upward. The combination of strong institutional buying and opportunistic investor interest suggests a robust foundation for gold's future performance.", "vocab": [{"word": "optimistic", "definition": "Hopeful and confident about the future."}, {"word": "attributed", "definition": "Regarded as belonging to or caused by."}, {"word": "precious metal", "definition": "A valuable metal like gold or silver, often used in jewelry or as an investment."}, {"word": "safe-haven asset", "definition": "An investment that is expected to retain or increase in value during times of market turbulence."}, {"word": "diversify", "definition": "To spread investments across different assets to reduce risk."}, {"word": "rebound", "definition": "To recover in value, price, or strength after a decline."}]}, "Advanced": {"text": "Schroders, a prominent global asset management firm, has articulated a decidedly more bullish stance on gold, citing robust and sustained purchasing activity by central banks as a primary catalyst. This shift in outlook underscores a growing confidence in the precious metal's future performance amidst a complex macroeconomic landscape.\n\nCentral banks globally are significant players in the gold market, often acquiring the metal to diversify their foreign exchange reserves, hedge against inflationary pressures, and bolster financial stability. In an era marked by persistent inflation concerns, geopolitical tensions, and fluctuating currency values, gold's traditional role as a store of value and a safe-haven asset becomes particularly compelling. Unlike fiat currencies, gold is not subject to the same inflationary pressures or credit risks, making it an attractive component of a nation's reserve portfolio.\n\nSchroders' analysis highlights that this institutional demand provides a formidable floor for gold prices, suggesting that any significant downward movements are likely to be temporary. The firm also notes the presence of 'dip buyers' – investors who strategically acquire assets after a price decline, anticipating a subsequent recovery. This behavior reflects a broader market sentiment that views gold's current valuation as an opportune entry point, further reinforcing its price stability.\n\nThe cumulative effect of sustained central bank accumulation and opportunistic investor engagement creates a powerful demand dynamic. This structural demand, coupled with ongoing uncertainties in global financial markets, positions gold favorably. As central banks continue to prioritize reserve diversification and inflation protection, their consistent buying acts as a strong underpinning for gold's valuation, potentially driving its price higher in the medium to long term. This trend suggests that gold is not merely reacting to short-term market fluctuations but is benefiting from fundamental shifts in global monetary policy and risk management strategies.", "vocab": [{"word": "articulated", "definition": "Expressed clearly and effectively."}, {"word": "catalyst", "definition": "An agent that provokes or speeds significant change or action."}, {"word": "macroeconomic", "definition": "Relating to the branch of economics concerned with large-scale or general economic factors, such as interest rates and national productivity."}, {"word": "bolster", "definition": "To support or strengthen."}, {"word": "fiat currencies", "definition": "Government-issued currency that is not backed by a physical commodity like gold or silver, but by the government that issued it."}, {"word": "formidable", "definition": "Inspiring fear or respect through being impressively
