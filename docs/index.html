 vocalist of the Oak Ridge Boys, died Saturday in Hendersonville, Tenn., following complications from bronchitis and pneumonia after a battle with cancer. He was 83. Both his family and the band announced his death. “We appreciate all of your love, support, and prayers. Please continue to lift us up in this […]", "vocab": []}}, "questions": [], "id": "a8e79f1c5d1", "source": "Variety", "link": "https://variety.com/2026/music/people-news/richard-sterban-dead-oak-ridge-boys-bass-vocalist-1236947870/", "published": "2026-11-15T10:05:06+09:00", "category": "entertainment"}, {"headline": "LIVE! A Music Calendar: Emily Ann Roberts brings big country sound to River Valley - Northwest Arkansas Democrat-Gazette", "excerpt": "LIVE! A Music Calendar: Emily Ann Roberts brings big country sound to River Valley Northwest Arkansas Democrat-Gazette", "levels": {"Beginner": {"text": "LIVE! A Music Calendar: Emily Ann Roberts brings big country sound to River Valley Northwest Arkansas Democrat-Gazette", "vocab": []}, "Intermediate": {"text": "LIVE! A Music Calendar: Emily Ann Roberts brings big country sound to River Valley Northwest Arkansas Democrat-Gazette", "vocab": []}, "Advanced": {"text": "LIVE! A Music Calendar: Emily Ann Roberts brings big country sound to River Valley Northwest Arkansas Democrat-Gazette", "vocab": []}}, "questions": [], "id": "a5a3635b15a", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxNSnQtUElFNC10aUEzQWFwMzBHOUFXc1N0d0hOdUR1eGxUTVhJLU1PLWpqZnNqcExWUkQxRm5aWXY0WmVFYU1ZUEhQZTZGUVFKZnBlekE2bTEtVlB3RFJyRmxmZ3oycnR4bk5GRTllNF9UcmR4REhqcV9lWXJaMTI2T0lZRjRwSkVUY1ViSUZacll6NzJP?oc=5", "published": "2026-11-15T10:00:00+09:00", "category": "entertainment"}, {"headline": "Danny Boyle On 'Ink', The Architecture Of His Movies & '28 Years Later' - Deadline", "excerpt": "Danny Boyle On 'Ink', The Architecture Of His Movies & '28 Years Later' Deadline", "levels": {"Beginner": {"text": "Danny Boyle On 'Ink', The Architecture Of His Movies & '28 Years Later' Deadline", "vocab": []}, "Intermediate": {"text": "Danny Boyle On 'Ink', The Architecture Of His Movies & '28 Years Later' Deadline", "vocab": []}, "Advanced": {"text": "Danny Boyle On 'Ink', The Architecture Of His Movies & '28 Years Later' Deadline", "vocab": []}}, "questions": [], "id": "ae17301cac9", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijwFBVV95cUxNckJkWG9lbTlhdzYxSUZsUWFvdEZadnFGQ2RJTWVlXzFTXzJGekdBbkJKUlVQbi1RaUFkcUF0X3BvcWRCX2lVZWdCZDJTU0tIQzRwNU9SSGYwd01kaFdiRlhxRWI3c05tazc0RzF1WXlscUNEbjJoNWZZbHU5SWNqQXZWeEVoanJSLVZidXdEWQ?oc=5", "published": "2026-11-15T10:00:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "China and US Discuss Trade, Tariffs at First Council Meeting", "excerpt": "Officials from China and the United States have held their first trade council meeting, focusing on tariffs and farm product exchanges.", "levels": {"Beginner": {"text": "China and the United States recently had an important meeting. This was the first time their new trade council met. Officials from both countries talked about trade, which means buying and selling goods between them. A big topic was tariffs. Tariffs are like extra taxes on goods that come from another country. For example, if the US sells something to China, China might add a tariff, making it more expensive for Chinese buyers. The US also has tariffs on Chinese goods.\n\nThey also talked a lot about farm trade. This includes products like corn, soybeans, and meat. Both China and the US buy and sell a lot of these farm goods to each other. These discussions are important because China and the US are two of the biggest economies in the world. When they talk, they try to solve problems and make trade better for everyone. This meeting shows they want to keep talking and find ways to work together on trade issues.", "vocab": [{"word": "trade", "definition": "The activity of buying and selling goods and services."}, {"word": "tariffs", "definition": "Extra taxes on goods bought from another country."}, {"word": "officials", "definition": "People who have important jobs in the government."}, {"word": "farm trade", "definition": "Buying and selling products that come from farms, like food."}, {"word": "economies", "definition": "The system of how a country makes and uses money and goods."}]}, "Intermediate": {"text": "Officials from China and the United States recently held their inaugural meeting of a newly established trade council. This significant gathering focused on key economic issues, primarily tariffs and agricultural trade between the two global powers. The meeting marks an important step in ongoing efforts to manage their complex economic relationship.\n\nTariffs, which are taxes imposed by a government on imported goods, have been a central point of contention in trade relations between Beijing and Washington for several years. Both countries have placed tariffs on a wide range of products from the other, leading to increased costs for businesses and consumers. These discussions aimed to address some of these existing trade barriers and explore potential solutions for reducing them.\n\nAnother major agenda item was farm trade. China is a significant buyer of American agricultural products, including soybeans, corn, and pork, while the U.S. also imports various food items from China. Ensuring smooth and fair trade in these vital sectors is crucial for the economies of both nations and for global food supply chains. The council discussed ways to facilitate this trade and resolve any disputes.\n\nThis first meeting of the trade council indicates a willingness from both sides to engage in direct dialogue to address their economic differences. While immediate breakthroughs are often not expected from such initial talks, the establishment of the council and the commencement of these discussions are seen as positive signs for maintaining communication channels and working towards a more stable trade environment.", "vocab": [{"word": "inaugural", "definition": "The first of its kind; marking the beginning of something."}, {"word": "established", "definition": "Created or set up formally."}, {"word": "contention", "definition": "Disagreement or dispute."}, {"word": "imposed", "definition": "Forced something to be accepted or put in place."}, {"word": "agricultural", "definition": "Relating to farming or agriculture."}, {"word": "facilitate", "definition": "To make an action or process easier."}, {"word": "breakthroughs", "definition": "Sudden, dramatic, and important discoveries or developments."}]}, "Advanced": {"text": "High-level officials from China and the United States recently convened for the inaugural session of a newly constituted trade council, signaling a renewed commitment to direct dialogue amidst persistent economic tensions. The discussions primarily centered on the contentious issues of bilateral tariffs and the crucial domain of agricultural trade, reflecting the intricate and often fraught nature of the world's two largest economies' commercial relationship.\n\nTariffs, essentially duties levied by a government on imported goods, have been a flashpoint in U.S.-China relations since the onset of a trade war several years ago. Both nations have implemented punitive tariffs across a broad spectrum of products, impacting global supply chains, increasing production costs for businesses, and ultimately affecting consumer prices. The council's agenda included exploring mechanisms to mitigate these existing trade barriers and foster a more predictable and equitable trading environment. The complexity of unwinding these tariffs, which have become deeply embedded in economic structures, presents a formidable challenge.\n\nAgricultural trade emerged as another pivotal topic. China stands as a preeminent importer of American farm commodities, including substantial volumes of soybeans, corn, and various meat products, while the U.S. also sources a range of agricultural goods from China. The stability and expansion of this sector are not only economically vital for both countries but also have significant implications for global food security. Discussions aimed at streamlining trade processes, resolving phytosanitary and other regulatory hurdles, and ensuring market access were paramount.\n\nThis first meeting of the trade council underscores a strategic recognition by both Beijing and Washington of the imperative to maintain open communication channels, even as geopolitical competition intensifies. While immediate, sweeping resolutions to deeply entrenched trade disputes are rarely achieved in initial dialogues, the establishment and activation of such a high-level forum are crucial for de-escalating tensions, managing disagreements, and identifying areas for potential cooperation. The outcomes of these ongoing deliberations will be closely watched for their potential to shape the trajectory of U.S.-China economic relations and, by extension, global commerce.", "vocab": [{"word": "convened", "definition": "To come together or cause to come together for a meeting or activity."}, {"word": "inaugural", "definition": "Marking the beginning of an institution, activity, or series; the first of its kind."}, {"word": "contentious", "definition": "Causing or likely to cause an argument; controversial."}, {"word": "bilateral", "definition": "Involving two parties, especially countries."}, {"word": "punitive", "definition": "Inflicting or intended as punishment."}, {"word": "mitigate", "definition": "To make less severe, serious, or painful."}, {"word": "preeminent", "definition": "Surpassing all others; very distinguished in some way."}, {"word": "phytosanitary", "definition": "Relating to the health of plants, especially with respect to the requirements of international trade."}]}}, "questions": [{"q": "What two main topics were discussed at the trade council meeting between China and the US?", "a": "The two main topics discussed were tariffs and farm trade."}, {"q": "Why is the establishment and meeting of this new trade council considered important?", "a": "The establishment and meeting of this new trade council are important because they show a willingness from both China and the US to engage in direct dialogue, manage economic differences, and work towards a more stable trade environment, despite ongoing tensions."}], "id": "aaa52870b6d", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiWEFVX3lxTFBqQ1duTHBiZFVhamtMRloyRm4xelZ1d3FtRlVZb0pld0tKbU8tam1lUTFJODFsUzgzMWo2el8zZnFTaF9nOXhGaEFyS0hqMlUxdnpWRzVGN3I?oc=5", "published": "2026-11-15T10:20:23+09:00", "category": "business", "category_title": "Business"}, {"headline": "WNC Restaurant Closes After 13 Years", "excerpt": "A Western North Carolina restaurant has closed its doors after serving the community for thirteen years.", "levels": {"Beginner": {"text": "A restaurant in Western North Carolina is closing down. This news was shared by WYFF. The restaurant was open for 13 years. That is a long time for a business to be open. Many people in the local community will miss eating there.\n\nWhen a restaurant closes, it can be sad for many. The owners and the people who worked there might feel sad. Also, the customers who liked the food and the place will miss it. Restaurants close for different reasons. Sometimes, it costs too much money to run them. Other times, not enough customers come to eat. Or maybe the owners want to stop working.\n\nThis restaurant was a part of the Western North Carolina area for over a decade. It was a place where friends and families could meet and share meals. Its closure means one less familiar spot in the neighborhood. It shows how businesses can change over time.", "vocab": [{"word": "closing", "definition": "stopping business permanently"}, {"word": "community", "definition": "the people living in one area"}, {"word": "local", "definition": "from a specific area nearby"}, {"word": "miss", "definition": "feel sad that something is gone"}, {"word": "costs", "definition": "the money needed to run a business"}, {"word": "customers", "definition": "people who buy things or services"}]}, "Intermediate": {"text": "A restaurant located in Western North Carolina (WNC) has announced its closure after operating for thirteen years. The news was reported by WYFF, marking the end of an era for a local establishment that served the community for over a decade.\n\nThirteen years is a significant run in the competitive restaurant industry, where many new businesses struggle to survive their first few years. Many factors can lead to a restaurant closing its doors. These often include economic challenges, such as rising operational costs for ingredients, rent, and employee wages. Increased competition from new eateries or a shift in customer dining preferences can also play a role. Sometimes, owners decide to retire or pursue other ventures, bringing a successful run to a natural close. While the specific reasons for this WNC restaurant's closure were not detailed, these are common pressures faced by small businesses across the region.\n\nThe closure of a long-standing restaurant has a noticeable impact. Employees face job displacement, and the local economy loses a business that contributed to its vitality through jobs and local spending. For the community, it means losing a familiar and often beloved gathering place. Local restaurants frequently become more than just places to eat; they are social hubs where people celebrate special occasions, meet friends, and create lasting memories. They contribute significantly to the unique character and charm of an area.\n\nWestern North Carolina is known for its vibrant local businesses and unique culinary scene, attracting both residents and tourists. The departure of this particular establishment will undoubtedly be felt by its regular patrons and the broader community, highlighting the constant evolution and challenges within the local business landscape.", "vocab": [{"word": "announced", "definition": "made known publicly"}, {"word": "operating", "definition": "managing and running a business"}, {"word": "significant", "definition": "important or noticeable"}, {"word": "competitive", "definition": "involving a lot of rivalry between businesses"}, {"word": "operational costs", "definition": "the money spent to keep a business running (like rent, wages)"}, {"word": "displacement", "definition": "the process of being forced to move from a job or home"}, {"word": "patrons", "definition": "regular customers of a business"}]}, "Advanced": {"text": "A long-standing culinary establishment in Western North Carolina (WNC) is ceasing operations after a 13-year tenure, according to reports from WYFF. This closure underscores the inherent volatility of the hospitality sector, even for businesses that have achieved considerable longevity and cultivated a loyal customer base. The news serves as a poignant reminder of the constant flux within local economies.\n\nThirteen years represents a substantial period of sustained operation, often indicating a strong connection with the local populace and a consistent offering that resonated with community tastes. In an industry notorious for high turnover rates, such a duration speaks volumes about the dedication of its proprietors and the establishment's ability to adapt over time. However, even well-regarded institutions are not immune to the complex pressures that can culminate in a decision to close. The journey of any independent restaurant is fraught with obstacles, from initial investment to daily management.\n\nThe reasons behind such closures are often a confluence of factors. Escalating overheads, including rising commercial rents, increasing labor costs, and supply chain disruptions affecting ingredient prices, can significantly erode profit margins, making sustained profitability difficult. Shifting consumer preferences, intensified market competition from new entrants, or even the owners' personal considerations, such as retirement or a desire to pursue new ventures, can all contribute to the final decision. While specific details regarding this WNC restaurant's closure remain undisclosed, these are pervasive challenges confronting independent eateries nationwide, particularly those operating in regions with seasonal tourism or evolving demographics.\n\nSuch closures have a profound ripple effect, extending beyond the immediate cessation of business. Employees face the immediate hardship of job displacement, necessitating a search for new employment in a dynamic labor market. Moreover, the broader community experiences the loss of a familiar social hub and a contributor to the local economy. Local restaurants frequently serve as more than mere dining venues; they are cultural touchstones, fostering community identity, hosting celebrations, and providing informal gathering spaces that enrich the social fabric of a region. Their absence can alter the character of a neighborhood.\n\nWestern North Carolina, with its vibrant tourism industry and distinct local culture, often fosters a robust ecosystem of independent businesses, including a diverse culinary scene that draws visitors and residents alike. The departure of this particular eatery will undoubtedly leave a void for its loyal clientele and marks a poignant moment for the local gastronomic landscape. It reflects the ongoing dynamism and formidable challenges faced by small businesses navigating an increasingly complex economic environment, reminding us of the transient nature of even cherished local institutions.", "vocab": [{"word": "culinary establishment", "definition": "a business that prepares and serves food, like a restaurant"}, {"word": "ceasing operations", "definition": "stopping a business from running"}, {"word": "tenure", "definition": "the period of time during which something exists or someone holds a position"}, {"word": "volatility", "definition": "the tendency to change rapidly and unpredictably, especially for the worse"}, {"word": "confluence of factors", "definition": "a situation where several things come together or combine, often to produce a particular result"}, {"word": "escalating overheads", "definition": "increasing regular costs of running a business (like rent, utilities, salaries)"}, {"word": "ripple effect", "definition": "a situation in which one event causes a series of other events to happen"}, {"word": "poignant", "definition": "evoking a keen sense of sadness or regret"}]}}, "questions": [{"q": "How long was the WNC restaurant open before it closed?", "a": "The restaurant was open for 13 years."}, {"q": "Which news source reported on the restaurant's closure?", "a": "WYFF reported on the restaurant's closure."}], "id": "a642a209364", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxOTWkxd1lNNk90R1A3RVRnMG5CN1FTWG9wY3BxYlBwSTU2bE1vRnRVTmgxbkFObndlN1hBd2szZDFZUjgyV3NpYlROTUdZcXRvaTBXWGpwX1ZVNHNOdGNHNm9XcHdFWUdkc0gxSG1QblBKRkhKdDhmX2c0aEN5ZE5xS1N1VzlxcGJFNEl3?oc=5", "published": "2026-11-15T10:17:24+09:00", "category": "business", "category_title": "Business"}, {"headline": "Central Bank's Divided Rate Hike Decision to Be Explained", "excerpt": "New details are expected soon about a central bank's recent decision to raise interest rates, which was not unanimously supported by its members.", "levels": {"Beginner": {"text": "A country's central bank recently made an important choice: it decided to raise interest rates. When interest rates go up, it means that borrowing money, for example for a house or a car, becomes more expensive. Central banks often do this to help control inflation. Inflation is when prices for everyday things like food, gas, and clothes go up too quickly, making your money buy less. The central bank's main job is to keep the economy stable and prices steady.\n\nHowever, the decision to raise rates was \"split.\" This means that not everyone on the central bank's committee agreed on the best path forward. Some members might have strongly supported the rate hike, believing it was necessary to fight rising prices. Others might have wanted to wait longer or raise rates by a smaller amount, perhaps worrying about slowing down economic growth too much.\n\nSoon, more information will be shared about why the decision was split. This new information will help people understand the different ideas and reasons behind the central bank's important choice. It is important for the public and businesses to understand these decisions because they affect the economy and how much money people have to spend. The central bank wants to be clear about its actions and the reasons for them.", "vocab": [{"word": "Central bank", "definition": "an important bank that manages a country's money and economy."}, {"word": "Interest rates", "definition": "the extra money you pay when you borrow money, or earn when you save money."}, {"word": "Raise", "definition": "to make something higher or increase it."}, {"word": "Decision", "definition": "a choice that someone makes after thinking about it."}, {"word": "Inflation", "definition": "when prices for goods and services go up over time, making money buy less."}, {"word": "Economy", "definition": "the system by which a country's money, industry, and trade are organized."}]}, "Intermediate": {"text": "A central bank recently announced its decision to implement an interest rate hike, a move designed to address persistent inflation. An interest rate hike means the cost of borrowing money increases, which typically slows down spending and investment across the economy. Central banks use this tool as part of their monetary policy to cool down an overheating economy and bring rising prices under control.\n\nHowever, the recent decision to raise rates was not unanimous; it was a \"split\" call among the central bank's policymakers. This indicates that there were differing views among the members of the committee responsible for setting monetary policy. Some policymakers likely argued for the necessity of a rate hike to aggressively combat inflation, which has been a significant concern in many economies globally. Others might have expressed reservations, perhaps fearing that a rate increase could excessively dampen economic growth or lead to job losses.\n\nMore details are expected to emerge soon, shedding \"fresh light\" on the specific reasons behind this divided vote. Central banks typically release minutes or detailed statements from their meetings, which provide insights into the discussions, arguments, and concerns raised by individual members. This transparency is crucial for financial markets and the public to understand the central bank's thinking and future policy direction.\n\nUnderstanding the nuances of a split decision helps market participants and businesses anticipate future economic conditions and policy adjustments. It reveals the complex balancing act central banks face: trying to stabilize prices without stifling economic activity. The upcoming information will offer a clearer picture of the challenges and differing perspectives that shaped this key monetary policy decision.", "vocab": [{"word": "Monetary policy", "definition": "actions a central bank takes to manage the money supply and credit conditions to influence the economy."}, {"word": "Inflation", "definition": "a general increase in prices and a fall in the purchasing value of money."}, {"word": "Hike", "definition": "an increase, especially in prices, costs, or rates."}, {"word": "Policymakers", "definition": "individuals who make official rules or plans, especially in government or a central bank."}, {"word": "Economic growth", "definition": "an increase in the production of goods and services in an economy over time."}, {"word": "Transparency", "definition": "the quality of being open, honest, and clear in operations and decisions."}, {"word": "Minutes", "definition": "a written record of what was said and decided at a meeting."}]}, "Advanced": {"text": "A prominent central bank recently concluded its monetary policy meeting with a decision to implement an interest rate hike, a move widely anticipated yet underscored by a notable lack of consensus among its policymakers. This action, a cornerstone of monetary tightening, aims to curb persistent inflationary pressures that have challenged economies globally. By increasing the benchmark interest rate, the central bank seeks to elevate the cost of borrowing across the financial system, thereby dampening aggregate demand and moderating price increases.\n\nCrucially, the decision was characterized as a \"split vote,\" indicating a divergence of opinion within the central bank's rate-setting committee. Such a split suggests that while a majority ultimately favored the rate increase, a significant minority likely harbored reservations or advocated for an alternative course of action. These dissenting views often stem from differing macroeconomic forecasts, varying interpretations of incoming economic data, or distinct philosophical approaches to the central bank's dual mandate of price stability and maximum sustainable employment. Some members may have argued for a more aggressive stance to anchor inflation expectations, while others might have expressed concerns about the potential for overtightening to precipitate an economic slowdown or exacerbate financial stability risks.\n\nThe forthcoming release of the meeting minutes is expected to shed \"fresh light\" on the specific deliberations and the rationale underpinning these divergent perspectives. These detailed records typically provide invaluable insights into the arguments presented by individual committee members, the economic models and data points they emphasized, and the specific risks they weighed. This level of transparency is paramount for financial market participants, analysts, and the public to gain a comprehensive understanding of the central bank's internal dynamics and its forward guidance.\n\nA split decision, particularly when accompanied by robust debate revealed in the minutes, can signal a more nuanced and potentially less predictable path for future monetary policy. It highlights the complex trade-offs inherent in managing a modern economy, where policymakers must navigate the delicate balance between mitigating inflation and fostering robust economic growth. The insights gleaned from these minutes will be closely scrutinized for clues regarding the committee's collective conviction, the potential for future policy shifts, and the overall trajectory of the economy. Understanding these internal debates is vital for market participants to calibrate their expectations and for businesses to plan their investment strategies in an environment of ongoing economic uncertainty.", "vocab": [{"word": "Deliberations", "definition": "long and careful discussions or considerations, especially in a formal meeting."}, {"word": "Consensus", "definition": "a general agreement among a group of people, or the process of reaching such an agreement."}, {"word": "Monetary tightening", "definition": "a central bank policy aimed at reducing the money supply and credit in an economy, typically by raising interest rates."}, {"word": "Divergence", "definition": "the process or state of separating or becoming different in opinion or direction."}, {"word": "Macroeconomic", "definition": "relating to the performance, structure, behavior, and decision-making of an economy as a whole, rather than individual markets."}, {"word": "Transparency", "definition": "the quality of being open, honest, and clear in operations, allowing for easy access to information."}, {"word": "Implications", "definition": "the conclusions that can be drawn from something, although not explicitly stated; possible future effects or results."}, {"word": "Mitigate", "definition": "to make something less severe, serious, or painful; to lessen the gravity of a situation."}]}}, "questions": [{"q": "What kind of organization made the decision to raise interest rates?", "a": "A central bank."}, {"q": "What does it mean when a central bank's decision is described as \"split\"?", "a": "It means that not all members of the central bank's committee agreed on the decision to raise interest rates."}], "id": "a276a5b8e19", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihwFBVV95cUxQUkhwUUE3bHI5MDFCWTJJcVZreWFmdXhqVXRyWUVZTUNqcGFGVGlmWWNicXgwYWJYbG9IR1VURjRLTU1wUi1aMldGaXJHZHpUSlpLMjlXdXlPbDlPVTYtNnR0ZlJ3dHE0ZU1iNTVkR2J0V3ZwTXhRdU1sdGF0TkZDczNpLXNMeVE?oc=5", "published": "2026-11-15T10:00:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Bank of Korea Buys Gold ETF Shares Amid Price Dip", "excerpt": "South Korea's central bank recently purchased gold investment funds as global gold prices experienced a decline, according to a local report.", "levels": {"Beginner": {"text": "The Bank of Korea, which is South Korea's main bank, recently bought some gold. It bought shares in something called a Gold ETF. An ETF is like a big basket of investments. This one holds gold.\n\nThe news comes from the Seoul Economic Daily newspaper. The Bank of Korea bought the gold when its price was going down. Many people think buying something when its price is low is a smart idea.\n\nWhy does a country's main bank buy gold? Gold is often seen as a safe place to put money, especially when the economy is uncertain. It can help protect a country's money, called reserves, from big changes in value. Central banks, like the Bank of Korea, keep reserves to help their country's economy stay strong. Buying gold adds a different kind of asset to these reserves. This helps the bank have a mix of different things, making its money safer overall.", "vocab": [{"word": "Bank of Korea", "definition": "South Korea's main bank, responsible for its money and economy."}, {"word": "ETF", "definition": "A type of investment fund that holds assets like gold."}, {"word": "Shares", "definition": "Small parts of a company or fund that you can buy."}, {"word": "Reserves", "definition": "Money and valuable assets a country's central bank holds."}, {"word": "Uncertain", "definition": "Not sure or not stable; likely to change."}, {"word": "Asset", "definition": "Something valuable that a person or company owns."}]}, "Intermediate": {"text": "The Bank of Korea (BoK), South Korea's central bank, recently made a strategic move by purchasing shares in gold Exchange Traded Funds (ETFs). This acquisition was reported by the Seoul Economic Daily and occurred during a period when global gold prices were experiencing a decline. Such dips can sometimes be influenced by factors like a stronger US dollar or rising interest rates, which make other investments more attractive.\n\nCentral banks around the world manage a country's foreign exchange reserves, which are assets held by the central bank in foreign currencies. These reserves are crucial for maintaining economic stability and supporting the national currency. Gold has long been considered a vital component of these reserves. It serves as a safe-haven asset, meaning its value often holds steady or even increases during times of economic or geopolitical uncertainty, offering a hedge against inflation and currency fluctuations.\n\nThe decision by the Bank of Korea to buy gold ETFs while prices were falling suggests a long-term investment strategy. By acquiring gold at a lower cost, the central bank aims to enhance the diversification of its reserve portfolio. Diversification involves spreading investments across various asset classes to reduce overall risk. Gold ETFs provide an accessible way to invest in gold without directly holding the physical metal, offering liquidity and ease of trading. This approach allows the central bank to benefit from potential future price increases while mitigating immediate market volatility.\n\nThis move aligns with a broader trend among central banks globally, many of whom have been increasing their gold holdings in recent years. They seek to strengthen their financial resilience and protect against potential economic shocks. The Bank of Korea's purchase underscores its commitment to prudent reserve management and safeguarding the nation's economic interests amidst a dynamic global financial landscape.", "vocab": [{"word": "Strategic", "definition": "Done as part of a careful plan, especially a long-term one."}, {"word": "Acquisition", "definition": "The act of buying or getting something, often a company or asset."}, {"word": "Foreign exchange reserves", "definition": "Assets held by a central bank in foreign currencies to support its economy."}, {"word": "Safe-haven asset", "definition": "An investment expected to retain or increase value during market downturns."}, {"word": "Hedge", "definition": "An investment made to reduce the risk of adverse price movements in an asset."}, {"word": "Diversification", "definition": "Spreading investments across different assets to reduce overall risk."}, {"word": "Prudent", "definition": "Acting with careful thought and good judgment for the future."}]}, "Advanced": {"text": "The Bank of Korea (BoK), the Republic of Korea's central bank, has reportedly made a significant move in its reserve management strategy by acquiring shares in gold Exchange Traded Funds (ETFs). This development, highlighted by the Seoul Economic Daily, took place during a period characterized by a notable dip in global gold prices. Such market corrections are often influenced by a confluence of factors, including a strengthening U.S. dollar, rising real interest rates, or shifts in investor sentiment towards riskier assets, temporarily diminishing gold's appeal.\n\nCentral banks globally are entrusted with the critical responsibility of managing a nation's foreign exchange reserves, a portfolio of assets primarily denominated in foreign currencies. These reserves are indispensable for maintaining macroeconomic stability, facilitating international trade, and bolstering confidence in the national currency. Gold has historically occupied a pivotal role within these reserve portfolios, revered for its intrinsic value and its function as a counter-cyclical asset. It serves as a quintessential safe-haven, offering a robust hedge against inflationary pressures, currency depreciation, and geopolitical uncertainties, thereby preserving purchasing power.\n\nThe BoK's decision to augment its gold holdings via ETFs during a price downturn signals a calculated, long-term perspective on asset allocation. This approach allows the central bank to capitalize on lower entry points, potentially enhancing future returns as gold prices recover. Investing in gold ETFs, rather than physical bullion, offers several distinct advantages for institutional investors like central banks. These include superior liquidity, lower administrative and storage costs, and the ease of transaction execution, making it an efficient vehicle for strategic reserve adjustments without the logistical complexities of physical metal. This strategic acquisition is aimed at further diversifying the BoK's reserve portfolio, thereby mitigating concentration risks and enhancing overall financial resilience against market volatility.\n\nThis move by the Bank of Korea resonates with a broader, discernible trend among central banks worldwide. In recent years, many monetary authorities have been systematically increasing their gold reserves, driven by a desire to de-dollarize, fortify their balance sheets, and safeguard against systemic financial shocks. The rationale often extends beyond purely economic considerations to encompass geopolitical risk management, as gold is perceived as a universally accepted store of value independent of any single nation's fiscal or monetary policy. In an increasingly multipolar global economic order, gold offers a tangible asset that is not subject to the jurisdiction or sanctions of any one government, providing an added layer of security.\n\nThe BoK's prudent management of its reserves, underscored by this latest gold purchase, reflects a proactive stance in navigating the complexities of the global financial landscape. It reinforces the central bank's commitment to ensuring the long-term stability and security of South Korea's economic foundations, positioning the nation favorably amidst evolving global economic paradigms and potential future disruptions. This strategic accumulation of gold assets is a testament to a forward-looking approach to national wealth preservation.", "vocab": [{"word": "Confluence", "definition": "A coming together or merging of two or more things, often factors or events."}, {"word": "Denominated", "definition": "Expressed or named in a specified unit of currency."}, {"word": "Indispensable", "definition": "Absolutely necessary or essential; impossible to do without."}, {"word": "Counter-cyclical", "definition": "Tending to move in the opposite direction to the overall trend of the economy or market."}, {"word": "Augment", "definition": "To make something greater by adding to it; to increase."}, {"word": "Mitigating", "definition": "Making something less severe, serious, or painful; alleviating."}, {"word": "De-dollarize", "definition": "To reduce reliance on the U.S. dollar in international transactions, trade, or reserves."}, {"word": "Paradigms", "definition": "Typical examples, patterns, or models of something; a framework of assumptions."}]}}, "questions": [{"q": "What did the Bank of Korea recently purchase, according to the news item?", "a": "The Bank of Korea recently purchased shares in gold Exchange Traded Funds (ETFs)."}, {"q": "Why do central banks often hold gold as part of their reserves?", "a": "Central banks often hold gold because it is considered a safe-haven asset, offering a hedge against inflation, currency fluctuations, and economic or geopolitical uncertainty, helping to diversify their reserves."}], "id": "a961cc30418", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilgFBVV95cUxPQ1NWTUlTdFFCSlV2dUR1V1FWNzN6TmVtTFM1Z2FMZ1VsbFZiNVlIek5Wc1BYY2NwRWxFZnVtNlQ2Q29yU3JFX1ptWldsMEhOaWNhWXNmZ0NDdktHbjNJc0NqVm9nY0VvaTE2dEFQZmZrdTd6RjJqT1ozZ3B3ajJCeDViM0x4RDRkamhCSnVRYU1jbzZkVVE?oc=5", "published": "2026-11-15T09:54:10+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "UK Considers Age of Consent Change After Russell Brand Allegations", "excerpt": "The UK government is reviewing the age of consent after serious allegations against entertainer Russell Brand sparked a national discussion.", "levels": {"Beginner": {"text": "The UK government is thinking about changing an important law. This law is called the \"age of consent.\" It means the age when a person is legally old enough to agree to sexual activity. In the UK, this age is usually 16 years old. This law helps protect young people.\n\nThis discussion started after a woman made serious claims against Russell Brand. Russell Brand is a well-known entertainer. The woman, Mia Latter, said that when she was 16 years old, Russell Brand hurt her. At that time, he was 30. Mia Latter is now 37. She chose to tell her story publicly, which is a brave step.\n\nThe Deputy Prime Minister, a senior government leader, talked about this. He said that changing the age of consent would be a very big decision for the country. However, he also stated that it \"deserves proper consideration and scrutiny.\" This means the government will look at the idea very carefully. They want to make sure laws keep young people safe and that justice is served. This move shows the government is listening to public concerns.", "vocab": [{"word": "consent", "definition": "permission to do something."}, {"word": "claims", "definition": "statements that something is true, often without proof."}, {"word": "entertainer", "definition": "a person who performs for people, like an actor or comedian."}, {"word": "publicly", "definition": "in a way that everyone can know or see."}, {"word": "official", "definition": "a person who holds an important position in an organization or government."}, {"word": "decision", "definition": "a choice that you make after thinking about something."}]}, "Intermediate": {"text": "The UK government has announced it will consider calls to change the legal \"age of consent.\" This significant review comes in the wake of serious allegations made against the prominent entertainer, Russell Brand. The current age of consent in the UK is 16, meaning individuals aged 16 and over are legally able to agree to sexual activity. This law is fundamentally designed to protect young people from exploitation and ensure that any sexual activity is consensual and free from coercion.\n\nThe discussion was specifically triggered after a woman, Mia Latter, waived her right to anonymity to publicly accuse Russell Brand. Ms. Latter, now 37, alleged she was orally raped by Brand when she was a 16-year-old schoolgirl and he was 30. Waiving anonymity means she made the conscious decision to reveal her identity, rather than remaining anonymous, in order to share her experience and bring the issue into the public domain. This act of coming forward has added significant weight to the calls for a review.\n\nThe Deputy Prime Minister, Oliver Dowden, addressed the issue, acknowledging the gravity of the situation. He described changing the age of consent as a \"massive step\" for the country, recognizing the profound societal implications such a change would entail. However, he firmly emphasized that the matter \"deserves proper consideration and scrutiny.\" This indicates that while it's a complex issue with potentially wide-ranging legal, social, and ethical implications, the government is committed to a thorough and careful examination of the proposals.\n\nSuch a review would involve careful analysis of existing legislation, consultation with legal experts, child protection advocates, and public opinion. The government's commitment to \"consideration and scrutiny\" suggests they will undertake a comprehensive process to understand the potential impacts of any change. This move highlights the powerful impact that high-profile allegations can have on public policy and underscores the ongoing national debate surrounding the protection of vulnerable young people. The outcome of this review could lead to significant changes in how the law defines consent and safeguards minors, reflecting evolving societal standards and concerns.", "vocab": [{"word": "allegations", "definition": "claims or accusations that someone has done something wrong, typically without proof."}, {"word": "prominent", "definition": "important and well-known."}, {"word": "waived", "definition": "given up a right or claim voluntarily."}, {"word": "anonymity", "definition": "the state of being unknown by name."}, {"word": "gravity", "definition": "extreme importance or seriousness."}, {"word": "scrutiny", "definition": "careful and thorough examination."}, {"word": "implications", "definition": "the possible results or effects of an action or decision."}]}, "Advanced": {"text": "The United Kingdom government has signaled its intent to formally consider amending the legal age of consent, a move prompted by recent high-profile allegations against the entertainer Russell Brand. This potential legislative shift underscores the profound impact that individual testimonies, particularly in cases involving public figures, can have on national policy and societal discourse. The current age of consent in the UK stands at 16, a threshold designed to safeguard adolescents from sexual exploitation and ensure that all sexual activity is genuinely consensual, free from undue influence or coercion.\n\nThe impetus for this governmental review stems directly from the courageous decision of Mia Latter, now 37, to waive her right to anonymity. Ms. Latter publicly alleged she was orally raped by Brand when she was a 16-year-old schoolgirl and he was 30. Her decision to come forward, revealing her identity, has been widely recognized as a pivotal moment, shifting the conversation from generalized accusations to a specific, named account, thereby intensifying public and political pressure for a re-evaluation of existing protections for minors.\n\nDeputy Prime Minister Oliver Dowden addressed the matter, acknowledging the immense societal and legal ramifications inherent in any alteration to the age of consent. He characterized such a change as a \"massive step,\" indicative of the deep consideration required for a policy with such far-reaching consequences. Nevertheless, Dowden unequivocally stated that the issue \"deserves proper consideration and scrutiny,\" signaling the government's commitment to a thorough, evidence-based examination rather than a dismissive stance. This commitment implies a comprehensive process involving legal experts, child protection agencies, social scientists, and public consultation.\n\nThe debate surrounding the age of consent is multifaceted, touching upon developmental psychology, legal definitions of capacity, and evolving societal norms regarding youth autonomy and protection. Critics of the existing age often argue that 16-year-olds, while legally able to consent, may still be vulnerable to manipulation or lack the full emotional maturity to make such significant decisions, particularly when power imbalances exist, as in relationships with much older adults. Conversely, proponents of the current age emphasize the importance of recognizing the agency of young people and avoiding unnecessary criminalization of consensual relationships between individuals close in age.\n\nA governmental review would likely involve an in-depth analysis of comparative international legislation, the efficacy of current safeguarding measures, and the potential unintended consequences of raising the age. It would also need to navigate the complexities of public opinion, which is often polarized on such sensitive issues. The outcome, whether it leads to legislative reform or a reaffirmation of the status quo, will undoubtedly reflect a significant moment in the UK's ongoing efforts to balance individual liberties with the imperative to protect its most vulnerable citizens. This episode highlights how allegations against high-profile individuals can serve as catalysts for broader societal introspection and policy re-evaluation.", "vocab": [{"word": "amending", "definition": "making minor changes to (a text, piece of legislation, etc.) in order to make it fairer or more accurate."}, {"word": "legislative shift", "definition": "a change in laws or the process of making laws."}, {"word": "societal discourse", "definition": "the ongoing conversation and debate within a society about important issues."}, {"word": "impetus", "definition": "the force or energy that causes something to happen or develop."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}, {"word": "unequivocally", "definition": "in a way that leaves no doubt; unambiguously."}, {"word": "catalysts", "definition": "a person or thing that precipitates an event or change."}]}}, "questions": [{"q": "What specific event prompted the UK government to consider changing the age of consent?", "a": "The UK government began considering changes to the age of consent after Mia Latter publicly alleged she was raped by Russell Brand when she was 16."}, {"q": "According to the Deputy Prime Minister, what kind of process will the government undertake regarding this issue?", "a": "The Deputy Prime Minister stated that changing the age of consent would be a \"massive step\" but \"deserves proper consideration and scrutiny,\" indicating a thorough and careful examination process."}], "id": "ab9cfd2796d", "source": "Politics | The Guardian", "link": "https://www.theguardian.com/law/2026/nov/15/uk-government-to-consider-changing-age-of-consent-after-allegations-against-russell-brand", "published": "2026-11-15T09:17:14+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Surviving Ebola: Fighting Fear and Misinformation in DR Congo", "excerpt": "Fear and misinformation complicate Ebola treatment in DR Congo, but one doctor's survival offers a powerful message of hope.", "levels": {"Beginner": {"text": "Dr. Kamwanga got very sick with Ebola in DR Congo. Her own mother was scared. She told Dr. Kamwanga not to go to the hospital for help. Many people in DR Congo are afraid of Ebola treatment. They hear wrong information. They think going to a clinic will make them worse or even kill them. But Dr. Kamwanga went for treatment. She is now well and healthy. She is living proof that people can survive Ebola if they get help. Ebola is a serious disease that can spread quickly. It causes fever and makes people very weak. Health workers try hard to stop it. They want to help sick people get better. But fear makes their job very hard. Dr. Kamwanga now tells her story. She wants everyone to know that getting treatment is important. It can save lives. She hopes her story will help others trust doctors and get the care they need. This will help stop the sickness from spreading more in her country.", "vocab": [{"word": "Sick", "definition": "Not well; ill."}, {"word": "Scared", "definition": "Afraid; feeling fear."}, {"word": "Treatment", "definition": "Medical care given to a patient for an illness or injury."}, {"word": "Survive", "definition": "To stay alive; to continue to live after a dangerous event."}, {"word": "Spreading", "definition": "Moving or passing from one person or place to another."}, {"word": "Trust", "definition": "To believe that someone or something is reliable, good, and honest."}]}, "Intermediate": {"text": "Dr. Kamwanga faced a difficult personal challenge during an Ebola outbreak in the Democratic Republic of Congo (DR Congo). When she contracted the deadly virus, her own mother, influenced by widespread fear and misinformation, advised her against seeking medical treatment. This situation highlights a major obstacle in controlling the Ebola epidemic: a deep-seated distrust within communities towards health facilities and interventions. DR Congo has experienced multiple Ebola outbreaks over the years, making community engagement and trust particularly challenging. Many people in the region believe false rumors that treatment centers are dangerous or that healthcare workers are not to be trusted. This often leads individuals to avoid seeking help, allowing the virus to spread further and making containment efforts more difficult.\n\nEbola is a severe and often fatal disease. Symptoms include fever, severe headache, muscle pain, fatigue, diarrhea, vomiting, and sometimes unexplained bleeding. It spreads through direct contact with the blood or body fluids of an highly infected person. Early diagnosis and prompt treatment are crucial for improving a patient's chances of survival. Modern medical care, including supportive therapies and new antiviral drugs, has significantly improved outcomes for those who seek help early.\n\nDespite her mother's fears, Dr. Kamwanga chose to seek professional medical care. She successfully recovered from the illness, becoming a powerful testament to the effectiveness of modern Ebola treatments. Her personal story is now a vital tool in combating the misinformation that plagues the region. By sharing her experience, Dr. Kamwanga hopes to encourage others to overcome their fears, trust healthcare providers, and seek timely treatment, ultimately helping to mitigate the impact of future outbreaks in her community and country.", "vocab": [{"word": "Outbreak", "definition": "A sudden increase in the number of cases of a disease."}, {"word": "Misinformation", "definition": "False or inaccurate information, especially that which is intended to deceive."}, {"word": "Contracted", "definition": "Caught or became infected with a disease."}, {"word": "Distrust", "definition": "The feeling that someone or something cannot be relied upon; suspicion."}, {"word": "Crucial", "definition": "Extremely important or necessary."}, {"word": "Testament", "definition": "Proof or evidence of something."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}]}, "Advanced": {"text": "The Democratic Republic of Congo (DR Congo) has long grappled with recurrent Ebola outbreaks, but the challenge extends far beyond medical containment. The personal ordeal of Dr. Kamwanga, a survivor of the deadly virus, starkly illustrates the profound impact of fear and misinformation that often undermines public health efforts. When she contracted Ebola, her own mother, swayed by pervasive community narratives, urged her to shun conventional medical treatment, fearing it would lead to her demise. This deeply personal account mirrors a broader societal struggle against deeply entrenched skepticism and distrust towards healthcare systems.\n\nThe history of conflict, political instability, and previous public health crises in DR Congo has fostered an environment where conspiracy theories and false information about diseases like Ebola can proliferate rapidly. This often leads to community resistance against crucial interventions, including vaccination campaigns, safe burial practices, and, critically, seeking early treatment at designated facilities. Such resistance not only endangers individuals but also complicates epidemiological tracking and containment strategies, allowing the virus to spread unchecked in vulnerable populations.\n\nEbola Virus Disease (EVD) is a severe, often fatal illness in humans. Transmitted through direct contact with the blood, secretions, organs, or other bodily fluids of infected people, and surfaces and materials contaminated with these fluids, EVD presents with symptoms such as sudden onset of fever, intense weakness, muscle pain, headache, and sore throat, followed by vomiting, diarrhea, rash, impaired kidney and liver function, and in some cases, both internal and external bleeding. Without prompt medical intervention, the mortality rate can be extremely high.\n\nHowever, significant advancements in medical science, including the development of effective antiviral treatments and vaccines, have dramatically improved survival rates for those who receive care early. Dr. Kamwanga's decision to defy the prevailing fear and seek professional medical attention proved life-saving. Her subsequent recovery offers irrefutable evidence of treatment efficacy.\n\nNow, Dr. Kamwanga leverages her lived experience as a powerful advocate. By openly sharing her journey, she directly confronts the stigma and misinformation surrounding Ebola, working to rebuild trust between communities and health authorities. Her narrative is instrumental in demonstrating that survival is not only possible but increasingly probable with timely medical care, thereby encouraging greater acceptance of public health initiatives and fostering resilience in the face of future outbreaks. Her story is a poignant reminder that combating an epidemic requires not just scientific breakthroughs, but also a profound understanding of human behavior and robust community engagement.", "vocab": [{"word": "Grappled", "definition": "Struggled or dealt with something difficult or challenging."}, {"word": "Pervasive", "definition": "Existing in or spreading throughout every part of something, often in an unwelcome way."}, {"word": "Shun", "definition": "To persistently avoid, ignore, or reject someone or something."}, {"word": "Proliferate", "definition": "To increase rapidly in number; multiply quickly."}, {"word": "Epidemiological", "definition": "Relating to the branch of medicine dealing with the incidence, distribution, and possible control of diseases and other factors relating to health."}, {"word": "Efficacy", "definition": "The ability to produce a desired or intended result; effectiveness."}, {"word": "Instrumental", "definition": "Serving as a crucial means, agent, or tool in achieving a goal."}, {"word": "Poignant", "definition": "Evoking a keen sense of sadness or regret; deeply moving or touching."}]}}, "questions": [{"q": "What was Dr. Kamwanga's mother's advice when Dr. Kamwanga contracted Ebola?", "a": "Her mother advised her against seeking medical treatment due to fear and misinformation."}, {"q": "How does Dr. Kamwanga's personal story help in the fight against Ebola in DR Congo?", "a": "Her survival serves as proof that treatment can be effective, helping to combat misinformation, build trust in healthcare, and encourage others to seek timely medical care."}], "id": "ab15377206e", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmvg2e2q28w1o?at_medium=RSS&at_campaign=rss", "published": "2026-11-15T09:06:55+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Chargers' Kendall Williamson: Sidelined for Week 10 - CBS Sports", "excerpt": "Chargers' Kendall Williamson: Sidelined for Week 10 CBS Sports", "levels": {"Beginner": {"text": "Chargers' Kendall Williamson: Sidelined for Week 10 CBS Sports", "vocab": []}, "Intermediate": {"text": "Chargers' Kendall Williamson: Sidelined for Week 10 CBS Sports", "vocab": []}, "Advanced": {"text": "Chargers' Kendall Williamson: Sidelined fo icles/CBMi2gFBVV95cUxOXzBucndMbVN3Nm9rbFMxbEd5aFlQWWd1M2VhZ25XX3VwY1F6TWtfazFnampRZjlMaUZjeU01Z2NhSlVwbkN2eXpHRFVLNzhZX3JzZ3B5cmxqT2dDOGRvOHR5Q04wRkRTR1JkTlhjcGZtTXNfWHlFdFQ5d0tpUHQ2ZnZSaUJjSHFOcmN2RkV0d1F5T1NUN2w5MkFUaFlIVXF2cGNXa2JjSDA1WjBHV200ZkxFNEFFSFcxeTZET0dBRGNlTzFtbllidzIydDBNaUFlR094Um95YnR2QQ?oc=5", "published": "2026-11-15T10:07:03+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
