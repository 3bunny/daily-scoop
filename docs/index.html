s and households. The G20 finance chiefs are tasked with navigating this delicate balance, seeking to foster a path towards sustainable growth while maintaining financial stability.\n\nCompounding these economic headwinds are significant geopolitical developments, notably the \"Iran war strains\" mentioned in the news. This phrase encapsulates the escalating tensions and potential for conflict in the broader Middle East, a region indispensable to global energy markets. Any major disruption to oil production or vital shipping lanes, such as the Strait of Hormuz or the Red Sea, could trigger a sharp increase in crude oil prices. Such a surge would inevitably exacerbate global inflationary pressures, undermine consumer and business confidence, and potentially derail the fragile global economic recovery. The discussions will likely explore strategies to mitigate these risks and ensure the resilience of global supply chains.\n\nBeyond immediate crises, the agenda extends to long-term structural issues. These include strengthening the international financial architecture, addressing sovereign debt vulnerabilities in developing nations, promoting digital taxation frameworks, and mobilizing finance for climate action and sustainable development goals. Achieving consensus on these complex issues is crucial, as fragmented approaches could hinder collective progress.\n\nThe two-day gathering provides an opportunity for these key economic policymakers to exchange insights, assess shared risks, and endeavor to forge a coordinated response to the multifaceted challenges confronting the global financial system. The outcomes, while not always immediate policy shifts, often lay the groundwork for future international cooperation and signal a collective commitment to safeguarding global economic prosperity.", "vocab": [{"word": "Convened", "definition": "Gathered for a formal meeting."}, {"word": "Headwinds", "definition": "Difficult conditions or forces that make progress harder."}, {"word": "Monetary policies", "definition": "Actions taken by a central bank to control the supply of money and credit, often through interest rates."}, {"word": "Stifling", "definition": "Preventing something from developing or being successful."}, {"word": "Compounding", "definition": "Making something worse, especially a problem or a negative situation."}, {"word": "Exacerbate", "definition": "To make a problem, bad situation, or negative feeling worse."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "Resilience", "definition": "The ability to recover quickly from difficulties; toughness."}, {"word": "Consensus", "definition": "General agreement among all the people in a group."}]}}, "questions": [{"q": "What group of leaders is holding a two-day meeting?", "a": "The G20 finance chiefs (or finance ministers and central bank governors)."}, {"q": "What is one major geopolitical concern that is influencing the discussions at the meeting?", "a": "Tensions in the Middle East (or Iran war strains, or potential conflict near Iran)."}], "id": "a4d9485adf5", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMic0FVX3lxTE5QdHQyV0lDNkQzYUlWQWlkbjVGN19MZ00tYl9DZDJvV3l3LUg0dWdlMlpuZlp3R1dyYkh5MnRuMUZBdkNBWlduYjF6ell5dlk0cUdMYTlmblhHZHdjTDVqellMS3NXb05KbTlVN196RkotTTg?oc=5", "published": "2026-09-01T08:01:56+09:00", "category": "economics"}, {"headline": "US Actions at G20 Meetings Cause Disagreement", "excerpt": "The United States has caused tension among G20 nations by inviting Russia to meetings and restricting access for some journalists.", "levels": {"Beginner": {"text": "The United States has made some G20 countries unhappy. This happened because the US invited Russia to meetings. The US also stopped some news reporters from coming to these meetings.\n\nThe G20 is a group of 20 big countries. They talk about money and the world economy. Many countries, especially in the West, do not want Russia at these meetings. This is because Russia started a war in Ukraine. These countries want to keep Russia away from important world talks.\n\nBut the US decided to invite Russia. This made other G20 ministers feel \"irked,\" which means annoyed or bothered. They think Russia should not be treated as a normal partner.\n\nAlso, some journalists could not enter the meetings. Journalists tell people what is happening. Stopping them from reporting can make it harder for people to know the news. This move also caused problems.\n\nSo, the US actions at the G20 meetings have created some tension and disagreement among the world's major economies.", "vocab": [{"word": "unhappy", "definition": "not happy; sad or annoyed."}, {"word": "invited", "definition": "asked someone to come to a place or event."}, {"word": "stopped", "definition": "made something not continue; prevented."}, {"word": "reporters", "definition": "people who find and tell news stories."}, {"word": "war", "definition": "a fight between countries or groups using weapons."}, {"word": "tension", "definition": "a feeling of worry, anger, or stress between people or groups."}]}, "Intermediate": {"text": "The United States has caused significant disagreement among G20 nations by inviting Russia to participate in recent meetings. This decision has \"irked\" or annoyed ministers from several member countries. Adding to the controversy, the US also restricted access for some journalists covering these important international discussions.\n\nThe G20, or Group of Twenty, is a forum for the world's major economies to discuss global economic and financial issues. Its members represent a large portion of the world's GDP and population. Since Russia's full-scale invasion of Ukraine in early 2022, many Western nations have sought to isolate Moscow diplomatically and economically. They have imposed sanctions and largely excluded Russian officials from high-level international gatherings.\n\nTherefore, the US invitation to Russia for G20 meetings, which typically involve finance ministers and central bank governors, has been met with concern by allies. Countries like Canada and some European nations have publicly expressed their discomfort with Russia's presence, arguing that it undermines efforts to condemn Russia's actions in Ukraine and treat it as a pariah state.\n\nFurthermore, the decision to bar certain journalists from covering the G20 proceedings has raised questions about transparency and press freedom. Journalists play a crucial role in informing the public about diplomatic efforts and policy decisions. Limiting their access can hinder public understanding and oversight of international events.\n\nThese actions by the United States have created a notable rift within the G20, highlighting ongoing challenges in managing international relations amidst geopolitical tensions and differing approaches to engaging with Russia. The incident underscores the complexities of maintaining unity within such a diverse group of nations.", "vocab": [{"word": "disagreement", "definition": "a situation where people have different opinions."}, {"word": "participate", "definition": "to take part in an activity or event."}, {"word": "controversy", "definition": "a public disagreement or debate, often involving strong opinions."}, {"word": "forum", "definition": "a place or meeting where people can exchange ideas and discuss issues."}, {"word": "isolate", "definition": "to keep a country or group separate from others."}, {"word": "undermines", "definition": "makes something weaker or less effective."}, {"word": "transparency", "definition": "the quality of being open, honest, and easy to understand."}]}, "Advanced": {"text": "The United States has generated considerable diplomatic friction within the Group of Twenty (G20) by extending an invitation to Russia for recent ministerial meetings. This move has reportedly \"irked\" numerous G20 ministers, particularly from Western allies, who advocate for Russia's continued international isolation following its full-scale invasion of Ukraine. Compounding the issue, the US also imposed restrictions on access for certain journalists tasked with covering these high-stakes international deliberations.\n\nThe G20 serves as the premier forum for international economic cooperation, bringing together the world's major advanced and emerging economies. Its members collectively account for over 80% of global GDP and two-thirds of the world's population, making its deliberations pivotal for addressing global challenges from financial stability to climate change. Since February 2022, a significant bloc of G20 nations, including the European Union, Canada, and the United Kingdom, have implemented extensive sanctions against Russia and have largely sought to exclude Russian officials from multilateral platforms, viewing their presence as legitimizing an aggressor state.\n\nAgainst this backdrop, the US decision to facilitate Russia's participation in G20 meetings – which typically involve finance ministers and central bank governors – has been met with palpable discomfort and criticism. Allies argue that such invitations contradict the broader strategy of diplomatic and economic pressure aimed at compelling Russia to cease its aggression. They contend that engaging with Russia in a seemingly normal fashion sends a mixed signal and could inadvertently undermine the unified front against Moscow. The US, however, might argue that maintaining channels of communication, even with adversaries, is crucial for de-escalation and managing global risks, a stance often adopted by host nations of major international gatherings.\n\nFurthermore, the restrictions placed on journalistic access have sparked concerns regarding press freedom and the transparency of international diplomacy. A free and open press is fundamental to democratic accountability, enabling the public to understand the rationale behind policy decisions and the dynamics of global governance. Limiting the ability of accredited journalists to report on G20 proceedings can foster an environment of opacity, potentially eroding public trust and hindering informed discourse on critical global issues. Such actions are often viewed as antithetical to the principles of open multilateralism that the G20 purports to uphold.\n\nThis episode underscores the intricate balancing act faced by the US as a G20 host, navigating the imperative of maintaining the forum's functionality while accommodating the diverse and often conflicting geopolitical stances of its members. The resultant friction highlights the deep divisions that persist within the international community regarding the appropriate engagement with Russia and the broader challenges to consensus-building in a fragmented global order.", "vocab": [{"word": "diplomatic friction", "definition": "tension or disagreement between countries or their representatives."}, {"word": "advocate", "definition": "to publicly support or recommend a particular cause or policy."}, {"word": "compounding", "definition": "making something worse or more intense, often by adding to an existing problem."}, {"word": "deliberations", "definition": "long and careful discussions or considerations of a matter."}, {"word": "premier forum", "definition": "the leading or most important platform for discussion and cooperation."}, {"word": "palpable", "definition": "(of a feeling or atmosphere) so intense as to be almost touched or felt; easily perceived."}, {"word": "antithetical", "definition": "directly opposed to or contrasting with something else."}, {"word": "multilateralism", "definition": "the principle of cooperation among several countries in pursuit of common goals."}]}}, "questions": [{"q": "What two main actions by the US caused disagreement among G20 ministers?", "a": "The US invited Russia to G20 meetings and barred some journalists from attending."}, {"q": "Why are some G20 countries unhappy about Russia's invitation?", "a": "Many Western nations want to isolate Russia diplomatically and economically because of its invasion of Ukraine."}], "id": "a0e7d8df7be", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxOTDY4ZlJsY3c3S2d4bGo2T2FyVEVyNmY2UzltakRiUktLUnlSWUk4YlFQSXd4VnlQUWtrbDZaR1pYZEVLV2d1UEdZLW05N0xIdWZFSjRzN1VUaXlQQnNJY0hQMnl1cEw3ZWQzY3dVbmRXNTk2b21McGh5YW9OdWVRbDAwVi1aZWY2Z3g1a1BaVUxaRm9XaHo3czZJU0VCWU1ucDNETUV2eVFqMXM?oc=5", "published": "2026-09-01T07:14:41+09:00", "category": "economics"}]}, {"key": "politics", "title": "Politics", "articles": [{"headline": "Man Found Guilty in Tupac Shakur Murder Case After Decades", "excerpt": "After decades of mystery, a man has been found guilty in the 1996 murder of iconic rapper Tupac Shakur.", "levels": {"Beginner": {"text": "Tupac Shakur was a very famous rapper. He was killed in 1996. His death became a big mystery. Many people wondered who did it for a long time. For almost 30 years, no one was arrested for his murder. This changed in 2023. A man named Duane 'Keffe D' Davis was arrested then. Now, a court has found Duane 'Keffe D' Davis guilty of Tupac's murder. This happened in Las Vegas, USA. This news is very important. It means a famous mystery has finally been solved. Tupac Shakur was a big star in music. His songs were loved by many. His death was a sad event for his fans. The police kept working on the case for many years. Finding someone guilty after so long shows that justice can still happen. It brings an end to a long period of questions and theories about what happened that night. Many people will feel a sense of peace knowing the case is closed.", "vocab": [{"word": "Rapper", "definition": "A person who performs rap music."}, {"word": "Killed", "definition": "To cause someone to die."}, {"word": "Mystery", "definition": "Something that is difficult to understand or explain."}, {"word": "Arrested", "definition": "Taken by the police because they think you did a crime."}, {"word": "Guilty", "definition": "Having done a crime."}, {"word": "Unsolved", "definition": "A problem or mystery that has not been explained or found an answer to."}]}, "Intermediate": {"text": "Tupac Shakur, one of the most famous and influential rappers of all time, was tragically murdered in 1996. His death, which occurred during a drive-by shooting in Las Vegas, became one of popular culture's biggest unsolved cases. For nearly three decades, countless theories circulated about who was responsible for the fatal shots, but no arrests were made, leaving the case a persistent and frustrating mystery for fans and law enforcement alike. This long-standing situation changed dramatically in September 2023 when Duane 'Keffe D' Davis was arrested. Davis was accused of being involved in the fatal shooting that claimed Shakur's life, a crime that sent shockwaves through the music industry and beyond. Recently, a court has found Duane 'Keffe D' Davis guilty of Tupac Shakur's murder. This conviction marks a major and long-awaited development in what had become known as a \"cold case.\" The murder of Tupac Shakur had been a source of intense fascination and speculation for fans, music historians, and investigators alike. His music continues to be celebrated globally, and his untimely death left a profound void in the hip-hop world, cementing his legend while leaving a cloud of unanswered questions. The verdict brings a significant sense of closure to a mystery that has captivated the world for generations. It highlights the persistence of law enforcement in pursuing justice, demonstrating that even after many years, accountability can be sought. This outcome is a testament to the dedication of those who continued to work on the case, finally providing answers to a question that has lingered for nearly 30 years and offering a measure of peace to Shakur's family and admirers.", "vocab": [{"word": "Influential", "definition": "Having a lot of power to affect others."}, {"word": "Unsolved case", "definition": "A crime that has not been explained or for which no one has been caught."}, {"word": "Circulated", "definition": "To move around or pass from person to person."}, {"word": "Accused", "definition": "To say that someone has done something wrong."}, {"word": "Drive-by shooting", "definition": "A shooting in which the person who fires the gun is in a moving vehicle."}, {"word": "Conviction", "definition": "The act of proving that a person is guilty of a crime."}, {"word": "Closure", "definition": "The feeling that a difficult or unpleasant event has been concluded."}]}, "Advanced": {"text": "The long-standing enigma surrounding the 1996 murder of iconic rapper Tupac Shakur has finally seen a significant breakthrough. Duane 'Keffe D' Davis has been found guilty of Shakur's murder, bringing a definitive legal conclusion to one of popular culture's most enduring mysteries. Shakur, a prodigious artist and a central figure in the intense East Coast-West Coast hip-hop rivalry, was fatally shot in a drive-by incident in Las Vegas on September 7, 1996. He succumbed to his injuries six days later, at the age of 25, leaving behind a monumental musical legacy that continues to resonate globally. For nearly three decades, the case remained a notorious cold case, fueling myriad conspiracy theories, countless documentaries, and intense public speculation across various media platforms. Despite Shakur's immense fame and the high-profile nature of his death, which occurred just hours after attending a Mike Tyson fight, no arrests were made until September 2023, when Davis was taken into custody in Henderson, Nevada. Davis, a self-proclaimed former gang leader, had previously admitted in various interviews and in his 2019 memoir, \"Compton Street Legend,\" to being in the vehicle from which the fatal shots were fired. These admissions, coupled with other investigative efforts, reportedly played a crucial role in the renewed investigation and his eventual indictment by a grand jury. The prosecution argued that Davis orchestrated the shooting in retaliation for an earlier altercation involving Shakur and Davis's nephew, Orlando Anderson, who was also in the car that night and has since died. This conviction represents a monumental moment for the criminal justice system and for the millions of fans who have sought answers for generations. It underscores the relentless pursuit of justice, demonstrating that even when decades have passed and initial leads have gone cold, accountability can still be achieved. The verdict not only provides a measure of closure for Shakur's family and admirers but also serves as a testament to the enduring power of investigative journalism and the potential for new evidence or admissions to revive dormant cases. This development closes a significant chapter on a saga that has profoundly shaped discussions about hip-hop history, celebrity, and the complexities of urban crime, offering a long-awaited resolution to a mystery that has captivated the global imagination for nearly 30 years and continues to influence cultural narratives.", "vocab": [{"word": "Enigma", "definition": "A person or thing that is mysterious, puzzling, or difficult to understand."}, {"word": "Iconic", "definition": "Very famous and recognized by many people, often representing a particular idea or era."}, {"word": "Prodigious", "definition": "Remarkably great in extent, size, or degree; exceptional."}, {"word": "Myriad", "definition": "A countless or extremely great number of people or things."}, {"word": "Indictment", "definition": "A formal accusation by a grand jury that there is enough evidence for a criminal trial."}, {"word": "Orchestrated", "definition": "Planned and coordinated the elements of a complex situation or event to produce a desired effect."}, {"word": "Retaliation", "definition": "The action of harming someone because they have harmed oneself; revenge."}, {"word": "Dormant", "definition": "(Of a case or issue) temporarily inactive or in abeyance."}]}}, "questions": [{"q": "What year was Tupac Shakur murdered?", "a": "Tupac Shakur was murdered in 1996."}, {"q": "Who was found guilty of Tupac Shakur's murder?", "a": "Duane 'Keffe D' Davis was found guilty of Tupac Shakur's murder."}], "id": "a20667f7667", "source": "BBC News", "link": "https://www.bbc.co.uk/news/videos/ckg7yrwp70qo?at_medium=RSS&at_campaign=rss", "published": "2026-09-01T09:31:20+09:00", "category": "politics"}, {"headline": "Supreme Court Allows White House Ballroom Construction", "excerpt": "The U.S. Supreme Court has allowed a White House ballroom project to continue, despite a top judge's concerns about its legality.", "levels": {"Beginner": {"text": "The U.S. Supreme Court has made a big decision about a building project. It said that a plan to build a ballroom at the White House can continue. This project was started when Donald Trump was president.\n\nA ballroom is a large room used for parties and important events. The White House is where the U.S. President lives and works. So, building a new room there is a big deal.\n\nHowever, not all the judges agreed with this decision. Chief Justice John Roberts, who is the most important judge on the Supreme Court, did not agree. He wrote that the building work is \"likely unlawful.\" This means he thinks it might be against the law or not follow the correct rules.\n\nThe Supreme Court is the highest court in the United States. Its job is to decide important legal questions and make sure laws are followed. In this case, the court's decision means that the construction of this White House ballroom can go forward for now. Chief Justice Roberts' disagreement shows that there are serious questions about whether this building project is fully legal. The court's ruling allows the work to keep going, even with these legal concerns from a top judge. People will be watching to see what happens next with the ballroom.", "vocab": [{"word": "Supreme Court", "definition": "The highest court in a country."}, {"word": "ballroom", "definition": "A large room used for dancing and parties."}, {"word": "Chief Justice", "definition": "The main or head judge of the Supreme Court."}, {"word": "unlawful", "definition": "Not allowed by law; illegal."}, {"word": "construction", "definition": "The process of building something."}, {"word": "ruling", "definition": "An official decision by a court or judge."}]}, "Intermediate": {"text": "The U.S. Supreme Court has given the green light for a controversial construction project at the White House to proceed. The nation's highest judicial body cleared the way for a ballroom project, initiated during the presidency of Donald Trump, to continue despite significant legal challenges.\n\nThis decision means that work on the White House ballroom can move forward. However, the ruling was not unanimous. Chief Justice John Roberts, the head of the Supreme Court, issued a notable dissent. In his written statement, Chief Justice Roberts expressed strong reservations, stating that the \"construction is likely unlawful.\" This indicates a belief that the project may not comply with existing laws or regulations governing federal property and presidential authority.\n\nThe Supreme Court's role is to interpret the Constitution and federal laws, and its decisions are final. When it \"clears the way,\" it often means it has overturned a lower court's order that had paused the project, or it has declined to intervene to stop it. In this instance, the court's action allows the legal dispute surrounding the ballroom to continue, but without halting the physical construction in the meantime.\n\nThe dissent from the Chief Justice highlights the serious nature of the legal questions involved. Such a statement from the court's most senior member underscores that the project's legality remains a significant point of contention. While the court's majority decision permits the building to continue, the Chief Justice's warning suggests that the project could still face future legal hurdles if it is ultimately found to violate federal statutes or constitutional principles. This ongoing legal battle reflects broader debates about presidential powers and the use of government resources.", "vocab": [{"word": "controversial", "definition": "Causing a lot of disagreement or public discussion."}, {"word": "judicial body", "definition": "A group of people who make legal decisions, like a court."}, {"word": "unanimous", "definition": "Agreed to by everyone involved; all members agreeing."}, {"word": "dissent", "definition": "A strong disagreement with an official decision or opinion."}, {"word": "reservations", "definition": "Feelings of doubt or hesitation about something."}, {"word": "comply", "definition": "To follow rules or laws."}, {"word": "statutes", "definition": "Written laws passed by a legislative body."}]}, "Advanced": {"text": "The U.S. Supreme Court has issued a significant order, effectively clearing the path for the continuation of a controversial ballroom construction project at the White House. This decision by the nation's highest judicial authority allows the building work, initiated during the administration of former President Donald Trump, to proceed, despite persistent legal challenges concerning its legitimacy.\n\nThe Court's action, often interpreted as a refusal to intervene or an overturning of a lower court's injunction, means that the physical construction of the White House ballroom can move forward without immediate judicial impediment. However, the ruling was far from a consensus, notably drawing a sharp dissent from Chief Justice John Roberts. In a rare and pointed written statement, Chief Justice Roberts articulated profound reservations, asserting unequivocally that the \"construction is likely unlawful.\" This powerful declaration from the Court's most senior member signals deep concerns regarding the project's adherence to federal statutes, appropriations law, or constitutional provisions governing the use of government property and presidential authority.\n\nThe Supreme Court's primary function is to serve as the ultimate arbiter of constitutional and federal law. Its decisions carry immense weight and often set precedents. In this specific context, while the majority's order permits the construction to continue, it does not definitively rule on the ultimate legality of the project itself. Instead, it allows the underlying legal dispute to unfold in lower courts, but without imposing a halt on the physical work in the interim. This procedural posture means that while the project can advance, it remains subject to potential future legal scrutiny and could theoretically be ordered to cease or even be dismantled if a final judicial determination finds it to be unlawful.\n\nChief Justice Roberts' dissent is particularly salient. As the institutional leader of the judiciary, his public questioning of the project's legality lends considerable gravitas to the concerns raised by its opponents. Such a statement from the Chief Justice often reflects a fundamental disagreement over legal principles or the proper scope of executive power. The ongoing legal challenge likely involves questions about whether the project received proper congressional authorization, whether federal funds were appropriately allocated, or if it constitutes an impermissible private enhancement of public property.\n\nThis episode underscores the intricate interplay between executive initiatives, judicial oversight, and the enduring debates surrounding the boundaries of presidential prerogative. The decision, while clearing a procedural hurdle for the construction, simultaneously amplifies the legal cloud hanging over the White House ballroom project, ensuring that its ultimate fate will likely remain a subject of intense legal and public discourse.", "vocab": [{"word": "effectively", "definition": "In effect; in actual fact, though not officially or explicitly."}, {"word": "legitimacy", "definition": "The quality of being rightful, valid, or acceptable according to law or established principles."}, {"word": "injunction", "definition": "An official order from a court telling someone to stop doing something or to do something."}, {"word": "impediment", "definition": "A hindrance or obstruction in doing something; a barrier."}, {"word": "consensus", "definition": "General agreement among a group of people; a shared opinion or position."}, {"word": "articulated", "definition": "Expressed clearly and distinctly; put into words."}, {"word": "unequivocally", "definition": "In a way that leaves no doubt; unambiguously and clearly."}, {"word": "salient", "definition": "Most noticeable or important; prominent."}]}}, "questions": [{"q": "What did the U.S. Supreme Court decide regarding the White House ballroom project?", "a": "The Supreme Court decided to allow the construction of the White House ballroom to continue."}, {"q": "Who disagreed with the Supreme Court's decision, and what was their main reason?", "a": "Chief Justice John Roberts disagreed with the decision, stating that the construction is \"likely unlawful.\""}], "id": "a10836e6b82", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c9w457e7ydlo?at_medium=RSS&at_campaign=rss", "published": "2026-09-01T07:38:24+09:00", "category": "politics"}, {"headline": "America's Biggest Government Buildings: A Look at Federal Giants", "excerpt": "The United States houses some of the world's largest government buildings, serving vital functions for the nation.", "levels": {"Beginner": {"text": "The United States has many big buildings where the government works. One of the biggest is called The Pentagon. It is in Virginia, near Washington D.C. The Pentagon is the main place for the country's defense. It is where the Department of Defense works. This department helps keep the country safe.\n\nThe Pentagon is very, very big. It has five sides, which is why it is called the Pentagon. Many thousands of people work there every day. They work on plans to protect the United States. It is like a small city inside.\n\nAnother important building is the U.S. Capitol Building. This building is in Washington D.C. It has a big dome on top. This is where the U.S. Congress meets. Congress makes laws for the country. So, these big buildings are very important for how the United States is run. They help the government do its job for all Americans.", "vocab": [{"word": "Pentagon", "definition": "A very large building in the U.S. where the country's defense work happens."}, {"word": "Defense", "definition": "Protecting a country from harm."}, {"word": "Department", "definition": "A part of a large organization, like a government."}, {"word": "Capitol Building", "definition": "An important building in Washington D.C. where laws are made."}, {"word": "Congress", "definition": "The group of people who make laws for the United States."}, {"word": "Protect", "definition": "To keep someone or something safe from danger."}]}, "Intermediate": {"text": "The United States is home to some of the world's most expansive and functionally critical government buildings. Among these, The Pentagon stands out as arguably the largest office building globally by floor area, serving as the headquarters for the U.S. Department of Defense. Located in Arlington, Virginia, just across the Potomac River from Washington D.C., its colossal structure houses approximately 23,000 military and civilian employees.\n\nCompleted in 1943 during World War II, The Pentagon was designed to consolidate the War Department's numerous offices scattered across Washington D.C. Its distinctive five-sided shape and five concentric rings of corridors make it an architectural marvel, allowing for surprisingly quick movement within its vast interior. The work conducted here is central to national security, involving strategic planning, military operations, and defense policy.\n\nBeyond The Pentagon, other significant government structures define the landscape of the nation's capital. The U.S. Capitol Building, with its iconic dome, is another prominent example. Situated at the eastern end of the National Mall in Washington D.C., it serves as the meeting place for the U.S. Congress, the legislative branch of the federal government. Here, senators and representatives debate and pass laws that govern the country. Its grandeur and historical significance make it a powerful symbol of American democracy.\n\nThese massive federal buildings are more than just offices; they are operational hubs and historical landmarks that underpin the functioning of the American government, from national defense to lawmaking.", "vocab": [{"word": "Expansive", "definition": "Covering a large area; very big."}, {"word": "Headquarters", "definition": "The main office or center of an organization."}, {"word": "Consolidate", "definition": "To combine several things into a single, more effective whole."}, {"word": "Distinctive", "definition": "Having a special quality or feature that makes it easily recognizable."}, {"word": "Concentric", "definition": "Having a common center."}, {"word": "Legislative", "definition": "Relating to the process of making laws."}, {"word": "Grandeur", "definition": "The quality of being magnificent and impressive."}]}, "Advanced": {"text": "The United States boasts an array of colossal government edifices, many of which are not only architectural marvels but also critical operational hubs for the nation's governance and defense. Foremost among these in terms of sheer scale is The Pentagon, situated in Arlington, Virginia. As the headquarters for the U.S. Department of Defense, it holds the distinction of being one of the largest office buildings in the world by floor area, encompassing over 6.5 million square feet. This gargantuan structure accommodates a daily population of roughly 26,000 military and civilian personnel, making it a veritable city unto itself.\n\nConstructed with remarkable speed during the early years of World War II, The Pentagon was completed in 1943. Its design was revolutionary, featuring a distinctive five-sided shape and five concentric rings of corridors, allowing for efficient internal navigation despite its immense footprint. The building's primary function is to serve as the nerve center for U.S. military planning, intelligence gathering, and defense policy formulation, playing an indispensable role in national security operations globally.\n\nBeyond The Pentagon, the federal landscape of Washington D.C. is replete with other monumental government buildings. The U.S. Capitol Building, with its iconic dome dominating the city skyline, stands as a powerful emblem of American democracy. It is the legislative seat of the federal government, where the bicameral U.S. Congress—comprising the Senate and the House of Representatives—convenes to deliberate, debate, and enact federal legislation. Its neoclassical architecture and rich history underscore its symbolic importance as the focal point of American lawmaking.\n\nOther significant structures include the vast complexes of the Federal Triangle, housing numerous executive branch agencies such as the Department of Commerce, the Environmental Protection Agency, and the Internal Revenue Service. These buildings, often characterized by their imposing classical designs, represent the extensive bureaucratic apparatus required to administer a nation of over 330 million people. Together, these colossal structures are not merely places of work; they are tangible manifestations of governmental power, historical continuity, and the intricate machinery of a modern democratic state.", "vocab": [{"word": "Edifices", "definition": "Large, imposing buildings."}, {"word": "Operational hubs", "definition": "Central places where activities or operations are managed and coordinated."}, {"word": "Sheer scale", "definition": "The immense size or extent of something."}, {"word": "Gargantuan", "definition": "Extremely large; gigantic."}, {"word": "Veritable", "definition": "Being in fact the thing named and not just a resemblance; true."}, {"word": "Indispensable", "definition": "Absolutely necessary or essential."}, {"word": "Replete", "definition": "Filled or well-supplied with something."}, {"word": "Bureaucratic apparatus", "definition": "The complex system of government administration, often implying a large and sometimes cumbersome structure."}]}}, "questions": [{"q": "What is often considered the largest government building in the United States by floor area?", "a": "The Pentagon is often considered the largest government building in the United States by floor area."}, {"q": "What is the main purpose of the U.S. Capitol Building?", "a": "The U.S. Capitol Building serves as the meeting place for the U.S. Congress, where senators and representatives debate and pass laws for the country."}], "id": "aebbeee6876", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilwFBVV95cUxPYU4tVWdrMUdoclFLNjdwamVXTkxQSDBSc1p2VkN4SEtIbmYwcXJJWmN2Q0RLSkFBZjMwdVdiS1F6V2FiajEyWVRmdjltVHl0NGJlSjJlQ1hfc09mVDZVM29zNlRMX0JtQlFjRkIzTGJsclVKR3FpZEltR0ZzZUNTUEFxTTlmdFVuQUlabndCeHZyMENPZllN?oc=5", "published": "2026-09-01T07:30:00+09:00", "category": "politics"}, {"headline": "Trump Officials Cut Political Interference Ban from Census Policy", "excerpt": "Officials overseeing the U.S. Census Bureau removed a rule designed to prevent political influence from its scientific work, following a controversial report.", "levels": {"Beginner": {"text": "The U.S. government has a group called the Census Bureau. This group counts all the people in the country every ten years. This count is very important. It helps decide how many lawmakers each state gets and how money is shared for things like schools and hospitals.\n\nRecently, officials who manage the Census Bureau made a big change. They removed a rule from their policy. This rule was put in place to stop politics from affecting the science and work done by the Census Bureau. It was there to make sure the bureau's work was fair and based only on facts, not political ideas.\n\nThis change happened after the Census Bureau shared a report. This report was connected to a group that supports former President Trump. After this report came out, the rule against political interference was cut from the bureau's guidelines. This means there is now no clear rule saying that political ideas cannot influence the scientific work of the Census Bureau. This news was reported by NPR.", "vocab": [{"word": "Census Bureau", "definition": "A government group that counts people."}, {"word": "important", "definition": "Having a lot of meaning or value."}, {"word": "officials", "definition": "People who have power in a government or organization."}, {"word": "rule", "definition": "A statement that tells you what is allowed or not allowed."}, {"word": "politics", "definition": "Ideas and activities related to governing a country."}, {"word": "influence", "definition": "To affect how someone thinks or acts."}]}, "Intermediate": {"text": "Officials overseeing the U.S. Census Bureau have removed a key provision from the agency's scientific integrity policy. This provision specifically prohibited political interference in the bureau's scientific work. The change was made after the Census Bureau released a report that was linked to a think tank aligned with former President Donald Trump.\n\nThe Census Bureau is a vital part of the U.S. government. Every ten years, it conducts a nationwide count of every person living in the country. This decennial census data is crucial for many reasons, including determining the number of congressional representatives each state receives and how billions of dollars in federal funding are distributed to communities for schools, hospitals, and infrastructure.\n\nThe scientific integrity policy was established to ensure that the bureau's data collection and analysis remain free from political bias or manipulation. Its purpose is to uphold public trust in the accuracy and neutrality of government statistics. The removal of the language banning political interference has raised concerns among some observers, who fear it could open the door to undue political influence on the bureau's critical work.\n\nNPR first reported on this development, highlighting that the decision to cut the anti-interference language followed the publication of a Census Bureau report. This report, which drew attention due to its ties to a Trump-aligned organization, preceded the policy alteration. The move means that the explicit safeguard against political influence in the bureau's scientific endeavors is no longer formally stated in its guidelines.", "vocab": [{"word": "provision", "definition": "A condition or requirement in a legal document."}, {"word": "prohibited", "definition": "Not allowed; forbidden."}, {"word": "scientific integrity", "definition": "The principle of conducting scientific research honestly and without bias."}, {"word": "vital", "definition": "Extremely important or necessary."}, {"word": "decennial", "definition": "Happening every ten years."}, {"word": "bias", "definition": "A strong feeling for or against one thing or group, usually in a way considered to be unfair."}, {"word": "safeguard", "definition": "A measure taken to protect something or to prevent something undesirable."}]}, "Advanced": {"text": "Officials within the parent agency overseeing the U.S. Census Bureau have controversially rescinded a crucial clause from the bureau's scientific integrity policy. This specific clause explicitly forbade political interference in the scientific processes and findings of the Census Bureau. This significant policy shift occurred in the wake of the bureau's publication of a report that had demonstrable ties to a think tank closely aligned with former President Donald Trump.\n\nThe U.S. Census Bureau stands as a cornerstone institution of American democracy. Its constitutionally mandated decennial count of every resident is far more than a simple enumeration; it forms the bedrock for critical governmental functions. The data collected directly dictates the apportionment of seats in the House of Representatives, thereby shaping political representation, and guides the allocation of hundreds of billions of dollars in federal funding for essential public services, ranging from healthcare and education to transportation infrastructure across states and localities.\n\nThe scientific integrity policy, from which the anti-interference language was excised, was initially conceived to shield the bureau's rigorous data collection, analysis, and dissemination from partisan pressures or manipulation. Its fundamental objective is to preserve the impartiality and accuracy of government statistics, thereby fostering public confidence in the reliability of official information. Critics argue that the removal of such an explicit prohibition against political interference could erode this trust and potentially compromise the bureau's independence, opening avenues for perceived or actual political influence over its methodologically sensitive work.\n\nNPR's investigation brought this development to light, emphasizing the temporal proximity between the release of the Census Bureau report—which garnered scrutiny due to its affiliation with a Trump-aligned organization—and the subsequent alteration of the scientific integrity policy. The report's unusual origins and its connection to a politically partisan entity appear to have precipitated the review and ultimate removal of the protective language. This action effectively eliminates a formal, explicit safeguard designed to insulate the bureau's scientific endeavors from external political considerations.\n\nThe implications of this policy change extend beyond the Census Bureau itself. It raises broader questions about the autonomy and integrity of scientific research within federal agencies, particularly those whose work directly informs policy and resource distribution. Maintaining a clear demarcation between scientific findings and political agendas is paramount for evidence-based governance and for sustaining the public's belief in the objectivity of government institutions. The absence of an explicit ban on political interference may, therefore, be interpreted as a weakening of the institutional bulwarks against politicization, potentially setting a precedent for other agencies.", "vocab": [{"word": "rescinded", "definition": "Canceled or revoked (a law, order, or agreement)."}, {"word": "crucial", "definition": "Extremely important; vital."}, {"word": "demonstrable", "definition": "Able to be shown or proven."}, {"word": "cornerstone", "definition": "An essential, founding, or main part of something."}, {"word": "apportionment", "definition": "The action of distributing something, especially seats in a legislative body, in a fair or appropriate way."}, {"word": "excised", "definition": "Removed by cutting out."}, {"word": "impartiality", "definition": "Fairness; the principle of treating all equally; lack of bias."}, {"word": "precipitated", "definition": "Caused (an event or situation, typically a bad one) to happen suddenly, unexpectedly, or prematurely."}]}}, "questions": [{"q": "What specific type of language was removed from the Census Bureau's scientific integrity policy?", "a": "Language banning political interference was removed from the Census Bureau's scientific integrity policy."}, {"q": "Why is the work of the U.S. Census Bureau considered important for the country?", "a": "The Census Bureau's work is important because it counts people, which helps determine congressional representation and how federal funding is distributed for public services like schools and hospitals."}], "id": "a9c5d6e11b7", "source": "NPR Topics: Politics", "link": "https://www.npr.org/2026/08/31/nx-s1-5948057/department-commerce-census-bureau-scientific-integrity", "published": "2026-09-01T07:24:12+09:00", "category": "politics"}, {"headline": "Wildfires Threaten Orangutans in Borneo as Habitats Burn", "excerpt": "Devastating wildfires in Indonesia are destroying critical forest habitats, putting hundreds of orangutans at severe risk of survival.", "levels": {"Beginner": {"text": "Big fires are burning in Indonesia, on an island called Borneo. These fires are destroying the homes of many orangutans. Orangutans are large, orange apes that live in trees. They need the forest to find food and stay safe. Hundreds of these animals are now in danger because their homes are burning away.\n\nBorneo is a big island in Southeast Asia. Many unique animals live there, but orangutans are special. They spend most of their lives in the trees. The fires make it hard for them to find food like fruits and leaves. They also lose their safe places to sleep.\n\nWhen the forests burn, orangutans have nowhere to go. Some might get hurt by the fire, and others might not find enough to eat. This puts their lives at risk. People who work to protect animals are worried. They want to help the orangutans and stop the fires. It is important to save these amazing animals and their forest homes.", "vocab": [{"word": "fires", "definition": "large, uncontrolled burning areas."}, {"word": "destroying", "definition": "breaking something completely so it cannot be used."}, {"word": "homes", "definition": "places where animals live."}, {"word": "danger", "definition": "a situation where something bad might happen."}, {"word": "protect", "definition": "to keep someone or something safe from harm."}, {"word": "forests", "definition": "large areas of land covered with trees."}]}, "Intermediate": {"text": "Large wildfires are currently raging across parts of Indonesia, particularly on the island of Borneo. These devastating fires are destroying vast areas of tropical rainforest, which serve as the natural habitat for hundreds of orangutans. Orangutans, known for their distinctive reddish-brown fur and arboreal lifestyle, are critically endangered and rely entirely on these forests for survival.\n\nBorneo is a major island in Southeast Asia, shared by Indonesia, Malaysia, and Brunei. The fires are primarily affecting the Indonesian part, known as Kalimantan. While dry seasons can make forests more susceptible to burning, many of these fires are started by humans. They are often linked to land clearing practices, especially for establishing palm oil plantations and other agricultural ventures.\n\nWhen their forest homes burn, orangutans face immense threats. They lose their primary sources of food, such as fruits, leaves, and insects, and their safe places to sleep high in the trees. Many are displaced, forced to flee into unfamiliar territories, where they risk starvation, injury, or even conflict with human populations. Young orangutans are particularly vulnerable without their mothers.\n\nConservation groups and local authorities are working to rescue displaced animals and combat the blazes. However, the scale of the destruction poses a significant challenge. Protecting these forests is crucial not only for the survival of orangutans but also for maintaining the rich biodiversity of Borneo and helping to regulate global climate patterns. The ongoing fires highlight the urgent need for sustainable land management practices to prevent future ecological disasters.", "vocab": [{"word": "raging", "definition": "burning with great intensity and spreading quickly."}, {"word": "habitat", "definition": "the natural home or environment of an animal, plant, or other organism."}, {"word": "critically endangered", "definition": "facing an extremely high risk of extinction in the wild."}, {"word": "susceptible", "definition": "likely or liable to be influenced or harmed by a particular thing."}, {"word": "displaced", "definition": "forced to move from one's home or usual environment."}, {"word": "conservation groups", "definition": "organizations that work to protect animals, plants, and natural resources."}, {"word": "ecological disasters", "definition": "events that cause widespread harm to the environment."}]}, "Advanced": {"text": "Extensive wildfires are currently ravaging vast expanses of tropical rainforest in the Indonesian portion of Borneo, known as Kalimantan. These catastrophic blazes are obliterating critical habitats for hundreds of orangutans, pushing an already critically endangered species closer to the brink of extinction. Orangutans, characterized by their distinctive reddish-brown pelage and arboreal existence, are endemic to Borneo and Sumatra and play a pivotal role as seed dispersers in their forest ecosystems.\n\nThe prevalence of these fires is exacerbated by a prolonged dry season, often intensified by phenomena like El Niño. However, the overwhelming majority are anthropogenic in origin, frequently ignited for land clearing. This practice facilitates the expansion of agricultural plantations, particularly for palm oil, and other industrial activities. The burning of peatlands, which are highly combustible and store immense amounts of carbon, further complicates firefighting efforts and releases significant greenhouse gases into the atmosphere.\n\nFor orangutans, the destruction of their forest homes represents an existential threat. Their primary food sources – a diverse diet of fruits, leaves, bark, and insects – vanish, leading to widespread starvation. Their arboreal lifestyle means the loss of canopy cover leaves them exposed and vulnerable. Displaced individuals are often forced into fragmented landscapes or human settlements, increasing the likelihood of human-wildlife conflict, injury, or poaching. Infants and juveniles, entirely dependent on their mothers for survival and learning essential foraging skills, are particularly susceptible to the devastating impacts.\n\nInternational conservation organizations, alongside local governmental agencies and indigenous communities, are engaged in multifaceted efforts to mitigate the crisis. These initiatives include emergency rescues of stranded orangutans, establishment of rehabilitation centers, and reforestation projects. However, the sheer scale of the environmental degradation underscores systemic challenges related to land tenure, law enforcement, and the global demand for commodities like palm oil. Addressing the root causes requires robust policy frameworks, sustainable economic alternatives for local populations, and stringent enforcement against illegal land clearing. The recurrent nature of these fires highlights an urgent imperative for comprehensive, long-term strategies to safeguard Borneo's irreplaceable biodiversity and mitigate climate change impacts.", "vocab": [{"word": "ravaging", "definition": "Causing severe and extensive damage to something."}, {"word": "obliterating", "definition": "Destroying utterly; wiping out completely."}, {"word": "endemic", "definition": "Native or restricted to a certain country or area; found only in a specific place."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "anthropogenic", "definition": "Originating in human activity, especially in relation to environmental pollution or effects."}, {"word": "exacerbated", "definition": "Made (a problem, bad situation, or negative feeling) worse or more severe."}, {"word": "existential threat", "definition": "A threat to the very existence or fundamental nature of something."}, {"word": "stringent", "definition": "(Of regulations, requirements, or conditions) strict, precise, and exacting."}]}}, "questions": [{"q": "What is the main threat to orangutans mentioned in the news item?", "a": "Wildfires destroying their natural habitat in Borneo."}, {"q": "Besides the direct destruction of their homes, what other dangers do orangutans face due to the fires?", "a": "They lose food sources, shelter, risk starvation, injury, and can be forced into conflict with humans."}], "id": "a4b07bbc28e", "source": "BBC News", "link": "https://www.bbc.co.uk/news/videos/c74emdn49kdo?at_medium=RSS&at_campaign=rss", "published": "2026-09-01T07:05:43+09:00", "category": "politics"}]}, {"key": "sports", "title": "Sports", "articles": [{"headline": "Chiefs Sign Preseason Standout to Practice Squad", "excerpt": "The Kansas City Chiefs have added a promising player who performed well in preseason games to their practice squad, offering a chance for development.", "levels": {"Beginner": {"text": "The Kansas City Chiefs football team has signed a new player. This player did very well in the games before the regular season started. These games are called the preseason. The Chiefs decided to sign him to their practice squad.\n\nA practice squad is a group of players who train with the main team. They are not on the active roster, which means they don't play in regular games yet. But they practice with the team and can learn a lot. It's a chance for them to get better and maybe join the main team later.\n\nFor the Chiefs, signing a player who stood out in the preseason is a good move. It means they saw talent and potential. This player will now work hard with the team, hoping to show he can play in the big games. It's an important step for any young player hoping to make it in professional football. The Chiefs are the current champions of the NFL, so joining them is a great opportunity.", "vocab": [{"word": "signed", "definition": "agreed to hire someone for a job or team"}, {"word": "preseason", "definition": "games played before the main sports season begins"}, {"word": "practice squad", "definition": "a group of players who train with a team but don't play in games yet"}, {"word": "roster", "definition": "a list of players on a team"}, {"word": "potential", "definition": "the ability to develop or achieve something in the future"}, {"word": "champions", "definition": "the winners of a competition or league"}]}, "Intermediate": {"text": "The Kansas City Chiefs, the reigning Super Bowl champions, have made a strategic move by signing a player who performed exceptionally well during the recent preseason games. This player has been added to the team's practice squad, providing him with an opportunity to further develop his skills within a top-tier NFL organization.\n\nThe preseason is a crucial period for teams to evaluate new talent and for players to showcase their abilities in a competitive environment. For a player to be identified as a \"standout\" means he demonstrated significant promise and skill against other professional athletes. While not immediately joining the 53-man active roster, a spot on the practice squad is a valuable stepping stone.\n\nMembers of the practice squad train daily with the active roster, participate in team meetings, and learn the team's plays and strategies. This intensive exposure allows players to refine their techniques and adapt to the demanding pace of the National Football League. They are essentially on standby, ready to be promoted to the active roster if injuries occur or if their performance warrants a spot.\n\nFor the Chiefs, securing a promising player for their practice squad ensures they retain talent that impressed during the evaluation phase. It also offers depth and flexibility, allowing the team to call upon a familiar player if needed during the long NFL season. This move reflects the team's ongoing commitment to scouting and player development, even after the initial roster cuts.", "vocab": [{"word": "reigning", "definition": "currently holding a title, like a champion"}, {"word": "strategic", "definition": "done as part of a plan to achieve a goal"}, {"word": "exceptionally", "definition": "in a way that is much greater than usual; outstandingly"}, {"word": "crucial", "definition": "extremely important or necessary"}, {"word": "showcase", "definition": "to display or present something in its best light"}, {"word": "stepping stone", "definition": "an event or opportunity that helps one to achieve a goal"}, {"word": "refine", "definition": "to improve something by making small changes"}]}, "Advanced": {"text": "The Kansas City Chiefs, fresh off their Super Bowl victory, have bolstered their organizational depth by signing a notable preseason performer to their practice squad. This acquisition underscores the team's meticulous approach to roster management and player development, even as the regular season looms.\n\nThe preseason serves as a critical proving ground for aspiring NFL players, a crucible where talent is tested against professional competition. For an individual to be singled out as a \"standout\" indicates a level of performance that transcended mere participation, suggesting a player who demonstrated significant upside and potential for future contribution. While the initial 53-man roster represents the immediate competitive core, the practice squad is an indispensable component of any successful NFL franchise.\n\nPlayers on the practice squad are integral to the team's operations. They participate in daily practices, often simulating opposing teams' schemes and personnel, thereby contributing directly to the preparation of the active roster. This immersive environment provides an invaluable opportunity for these players to acclimate to the professional regimen, absorb complex playbooks, and hone their physical and technical skills under the tutelage of NFL coaches. Furthermore, it offers a pathway to the active roster, as practice squad members can be elevated at any point during the season to fill vacancies created by injuries or strategic adjustments.\n\nFor the Chiefs, securing a player who impressed during the evaluation period is a shrewd move. It allows them to retain a promising asset within their system, preventing him from potentially signing with another team. This strategic foresight provides a crucial layer of roster flexibility and injury insurance, ensuring that the team has readily available, system-familiar talent to draw upon. This ongoing commitment to cultivating talent, from the draft through the preseason and onto the practice squad, is a hallmark of well-managed organizations and a key factor in sustained competitive success in the demanding landscape of the National Football League.", "vocab": [{"word": "bolstered", "definition": "supported or strengthened something"}, {"word": "acquisition", "definition": "the act of gaining possession of something; in sports, a new player"}, {"word": "meticulous", "definition": "showing great attention to detail; very careful and precise"}, {"word": "crucible", "definition": "a severe test or trial; a place or situation in which concentrated forces interact to cause or influence change or development"}, {"word": "transcended", "definition": "went beyond the limits of; surpassed"}, {"word": "indispensable", "definition": "absolutely necessary or essential"}, {"word": "acclimate", "definition": "to become accustomed to a new climate or to new conditions"}, {"word": "shrewd", "definition": "having or showing sharp powers of judgment; astute"}]}}, "questions": [{"q": "What is a practice squad in professional football?", "a": "A practice squad is a group of players who train with the main team but are not on the active roster, meaning they don't play in regular games yet. They can be promoted to the active roster if needed."}, {"q": "Why is signing a 'preseason standout' to the practice squad considered a good move for a team?", "a": "It's a good move because it allows the team to retain a promising player who showed talent during evaluation games, providing depth, flexibility, and an opportunity for the player to develop further within the team's system."}], "id": "a54ee89ff87", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxORWRHUDJFcHI2TlJtM0dBT1pLbVlqWkdvb2h4RlExck1EbmpaQWlrR2FST0dGOUVYc0lCaEU4aVlzYld1cWx1REs2b3k2QURXT0JrT3o0NFpuSUd2UGFoWl91RGE4LTRneUlMUExhSkEzUTdHMURGRjZCb2IxU3FTYW1LV0hoclE3M0ZR?oc=5", "published": "2026-09-01T09:38:00+09:00", "category": "sports"}, {"headline": "Trae Young, a former Norman North and OU basketball … - Yahoo Sports", "excerpt": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "levels": {"Beginner": {"text": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "vocab": []}, "Advanced": {"text": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "vocab": []}}, "questions": [], "id": "a2041e4404b", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNSFNFeGxJU0dQY1BpTF84RmxUdWpXSWd1Y042cm01N25ub0NFS1U5OGxqNnFjUDJrZG9iOG03a2N4UF9sX2p2U1JueHBocmU4NXJ1dGp0Q1JTREFkRFFKZWs3YVFLRDF3Y3lLSzEzUVNWSEt1blkxUV9YaV9TdFFMRTBWMEtMZw?oc=5", "published": "2026-09-01T09:35:30+09:00", "category": "sports"}, {"headline": "SB Nation fans think Ohio State wins the Big Ten - Yahoo Sports", "excerpt": "SB Nation fans think Ohio State wins the Big Ten Yahoo Sports", "levels": {"Beginner": {"text": "SB Nation fans think Ohio State wins the Big Ten Yahoo Sports", "vocab": []}, "Intermediate": {"text": "SB Nation fans think Ohio State wins the Big Ten Yahoo Sports", "vocab": []}, "Advanced": {"text": "SB Nation fans think Ohio State wins the Big Ten Yahoo Sports", "vocab": []}}, "questions": [], "id": "aafe919117a", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMif0FVX3lxTFBKVVc3bHFEX0d6YjJvWlJFdVE4cVJBQ2x0YnBZMlF2SFFGdmhhZU15UHNJNFl4TnBLNWVqdHBSWWdxM2JfQWR4ZkpXcnpOVF
