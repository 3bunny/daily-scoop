dvanced": {"text": "St. Joe Company reports hotel surge across Bay & Walton counties WJHG", "vocab": []}}, "questions": [], "id": "a04dfed656a", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimgFBVV95cUxQd0RSOVJLSUNaTHNlM0FqZ2tWYnRONTRNTVVFTEVCLUVWTDRGN2ZRQzJQRm9GdzRtNkFjLXR0OUlCZ1Q3VmdlOXZMMmVMYk1CVHdzOGdxOVIyd0oyS2NfYkkzeWh5cUdsRUY1SXZMNzZwNnlrb1JoUDh6YTlWTHVZenN4UnVjUkFqY2YxLXp1aGFOOXl1YVJla3Zn0gGuAUFVX3lxTFB3THFrd0pLM3I4c1dNbEk3TW1IRWxyTEYzZHlnVThsb1A5a0tONVV3azBBNEZsLVR0dkF5dEFWZk80OEZKNjhwN0VpY2NrT3dPbFBsZFJ4S3FrWnp3a29PQUJyU0puUi1PY1gwenRjNjNNY2Y2dTVuQ2NlbnVvdEVDTkMydW1LRHFWT1FhVUdPQXFVT0NMaVBnLTIxSWdkeWt2ZG1EUC1aSWl2V3k3dw?oc=5", "published": "2026-09-25T08:48:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Bond Market Worries: What Rising Rates Mean for Your Money", "excerpt": "The bond market is experiencing significant turbulence, leading to higher borrowing costs for governments, businesses, and everyday consumers.", "levels": {"Beginner": {"text": "The bond market is currently facing some big problems, often described as \"freaking out.\" But what does this mean for you?\n\nBonds are like loans. When you buy a bond, you are lending money to a government or a company. They promise to pay you back later, plus a little extra money called interest. Right now, the prices of these loans (bonds) are going down, and the interest they offer is going up.\n\nWhy is this happening? One main reason is inflation. Inflation means that prices for everyday things like food and gas are rising quickly. When inflation is high, the money you get back from a bond in the future won't buy as much as it used to. So, investors want more interest to make up for this.\n\nCentral banks, which are like the main banks in a country, are trying to stop inflation. They do this by making it more expensive to borrow money. This means if you want to buy a house, your mortgage loan will likely have a higher interest rate. Car loans and business loans also become more expensive. This affects how much money people and companies have to spend, which can slow down the economy.", "vocab": [{"word": "Bonds", "definition": "Like a loan you give to a government or company, expecting to be paid back with interest."}, {"word": "Market", "definition": "A place or system where people buy and sell things, like financial products."}, {"word": "Inflation", "definition": "When prices for goods and services rise generally, and the purchasing power of money falls."}, {"word": "Central bank", "definition": "The main bank in a country that manages its money supply and interest rates."}, {"word": "Borrow", "definition": "To take money from someone or a bank with the promise to pay it back, usually with interest."}]}, "Intermediate": {"text": "The bond market is currently experiencing significant volatility, a situation often described by financial experts as \"freaking out.\" This turbulence has important implications for both the economy and individual finances.\n\nBonds are essentially debt instruments, representing loans made to governments or corporations. Investors buy bonds, lending money, and in return, they receive regular interest payments and their principal back at maturity. When the bond market \"freaks out,\" it typically means bond prices are falling, and their yields (the return investors get) are rising. Bond prices and yields move in opposite directions.\n\nOne of the primary drivers behind this recent market distress is persistent high inflation. When prices for goods and services rise quickly, the purchasing power of future bond payments decreases. To compensate for this loss, investors demand higher yields on new bonds, which in turn pushes down the value of existing bonds with lower yields.\n\nCentral banks, such as the U.S. Federal Reserve, are actively raising benchmark interest rates to combat inflation. This monetary policy tightening makes new bonds more attractive and further contributes to the decline in value of older, lower-yielding bonds. The goal is to cool down economic demand and bring inflation under control.\n\nThe implications for individuals and the broader economy are substantial. Higher bond yields translate directly into increased borrowing costs. For consumers, this means higher interest rates on mortgages, car loans, and credit cards. Businesses face higher costs when borrowing to invest or expand, which can slow economic growth. Governments also see their debt servicing costs rise as they issue new bonds to fund public services. This complex interplay between inflation, central bank policy, and investor expectations is reshaping the financial landscape.", "vocab": [{"word": "Volatility", "definition": "Quick and unpredictable changes in prices or conditions in a market."}, {"word": "Yields", "definition": "The total return an investor earns on a bond, expressed as a percentage."}, {"word": "Monetary policy", "definition": "Actions taken by a central bank to control the money supply and credit conditions to influence the economy."}, {"word": "Implications", "definition": "The possible effects or results of something."}, {"word": "Mortgages", "definition": "Loans specifically used to purchase a house or property, typically repaid over many years."}, {"word": "Debt servicing", "definition": "The payments made to cover the interest and principal on a loan or debt."}]}, "Advanced": {"text": "The global bond market is currently grappling with significant turbulence, a phenomenon often characterized by market participants as \"freaking out.\" This period of heightened volatility reflects a complex interplay of macroeconomic forces, primarily persistent inflation and aggressive monetary policy tightening by central banks worldwide.\n\nBonds, as fundamental fixed-income securities, represent debt instruments through which governments and corporations borrow capital from investors. In exchange for the principal, bondholders receive periodic interest payments (coupons) and the return of their principal at maturity. The current market distress is largely manifested in a sharp decline in bond prices, which, by inverse relationship, translates into a substantial rise in bond yields. This upward trajectory in yields is a direct response to elevated inflation expectations. Investors demand a higher rate of return to offset the erosion of future purchasing power caused by rising consumer prices.\n\nCentral banks, including the U.S. Federal Reserve, the European Central Bank, and the Bank of England, have embarked on an aggressive campaign of interest rate hikes to tame inflation. By increasing benchmark rates, central banks make new debt more attractive, thereby diminishing the relative value of existing bonds with lower coupon rates. This policy tightening aims to cool economic demand and bring inflation back to target levels, typically around 2%.\n\nThe ramifications of a \"freaking out\" bond market are far-reaching, impacting various facets of the economy. For consumers, the most immediate effect is an increase in borrowing costs. Mortgage rates, auto loans, and credit card interest rates are closely tied to benchmark bond yields, making financing more expensive and potentially dampening demand for big-ticket items like homes and cars.\n\nCorporations also face a higher cost of capital. Businesses rely on bond markets to fund expansion, research and development, and operational needs. Elevated yields mean higher interest expenses, which can compress profit margins, deter investment, and potentially slow job creation. Furthermore, governments, which are among the largest issuers of bonds, confront rising debt servicing costs. As existing government bonds mature and new ones are issued at higher yields, the fiscal burden on national budgets increases, potentially diverting funds from other public services or necessitating tax adjustments.\n\nThe current environment also reflects investor uncertainty regarding the future path of inflation and economic growth. There's a delicate balance central banks must strike: curbing inflation without triggering a severe recession. The bond market, often seen as a forward-looking indicator, is pricing in these uncertainties, leading to rapid shifts in sentiment and asset valuations. This period underscores the critical role of bond markets in transmitting monetary policy and influencing the broader financial landscape.", "vocab": [{"word": "Turbulence", "definition": "A state of disorder or instability, especially in financial markets, characterized by unpredictable changes."}, {"word": "Fixed-income securities", "definition": "Investments that provide a return in the form of regular, fixed interest payments and the return of principal at maturity, such as bonds."}, {"word": "Macroeconomic forces", "definition": "Large-scale economic factors or trends, such as inflation, interest rates, and economic growth, that affect an entire economy."}, {"word": "Monetary policy tightening", "definition": "Actions taken by a central bank to reduce the money supply and raise interest rates, typically to combat inflation."}, {"word": "Ramifications", "definition": "The far-reaching and often complex or unwelcome consequences of an action or event."}, {"word": "Fiscal burden", "definition": "The financial cost or responsibility placed on a government or economy, often related to public spending or debt."}, {"word": "Forward-looking indicator", "definition": "An economic statistic or market behavior that tends to predict future economic activity or trends."}, {"word": "Transmitting", "definition": "The process by which something, such as monetary policy signals or economic effects, is passed from one part of the system to another."}]}}, "questions": [{"q": "What is one main reason the bond market is currently experiencing turbulence?", "a": "One main reason is persistent high inflation, which leads investors to demand higher yields, and central banks' efforts to combat inflation by raising interest rates."}, {"q": "How do rising bond yields affect individuals, such as those looking to buy a house or car?", "a": "Rising bond yields lead to higher interest rates on various loans, including mortgages and car loans, making it more expensive for individuals to borrow money for these purchases."}], "id": "a799e3ee06b", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMie0FVX3lxTE9TdmlpTmlrZWppS2ZjMHJSMll0aXF5Q2tYc1FRcmdrbldENHRiTW9RVE5QWVZJOEtRTTEzMmFfdjIxMnpGd1FCTmxyUnF6dUZDY2ZDTUpTc3N4cWlZRWo4RmFuVUdKbWRTYkg3blRvbjdrOVJwTXpkUkFaSQ?oc=5", "published": "2026-09-25T08:37:35+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "X-planes: Are they needed in the new era of drones?", "excerpt": "Where do America's X-plane projects fit in an era of cheap drones?", "levels": {"Beginner": {"text": "Where do America's X-plane projects fit in an era of cheap drones?", "vocab": []}, "Intermediate": {"text": "Where do America's X-plane projects fit in an era of cheap drones?", "vocab": []}, "Advanced": {"text": "Where do America's X-plane projects fit in an era of cheap drones?", "vocab": []}}, "questions": [], "id": "a041d8f447c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c9q92x359xdo?at_medium=RSS&at_campaign=rss", "published": "2026-09-25T08:03:53+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US and China Leaders: Politeness Masks Deep Divisions", "excerpt": "Despite outward friendliness, a significant power struggle and disagreements existed between the leaders of the United States and China.", "levels": {"Beginner": {"text": "Two very important leaders, Donald Trump from the United States and Xi Jinping from China, met. They showed politeness to each other. This means they were very friendly and respectful in their meetings. They might have shared meals or polite talks. However, the news said that this friendly behavior was \"masking\" something else. \"Masking\" means hiding. What was hidden? There was a \"rift of powers\" between their countries. A \"rift\" means a big disagreement or a split. The United States and China are two very powerful countries. They have different ideas about many things, like trade and how the world should work. Even though the leaders smiled and were polite, these big problems were still there. Their friendly actions helped to make things look good on the surface. But underneath, the serious differences between the two nations remained. This is common in world politics where leaders try to keep good relations even when their countries have big issues. The Seattle Times reported on this meeting.", "vocab": [{"word": "leaders", "definition": "Important people who guide a country or group."}, {"word": "politeness", "definition": "Being kind and respectful to others."}, {"word": "masking", "definition": "Hiding something."}, {"word": "rift", "definition": "A big disagreement or split."}, {"word": "powers", "definition": "Strong countries or groups with a lot of influence."}, {"word": "surface", "definition": "The outside part or what something looks like at first."}]}, "Intermediate": {"text": "During a period of significant global tension, former U.S. President Donald Trump and Chinese President Xi Jinping held meetings where they displayed considerable politeness and formal courtesy. News reports, including one from The Seattle Times, highlighted that these diplomatic gestures, described as \"bonding over granite and politesse,\" served to mask deeper underlying disagreements between the two global powers.\n\n\"Politesse\" refers to formal politeness and refined social behavior, often seen in high-level diplomatic exchanges. While leaders engaged in pleasantries and perhaps exchanged gifts or shared meals, the core issues dividing the United States and China remained prominent. The phrase \"rift of powers\" points to fundamental differences in their geopolitical strategies, economic interests, and even their political systems.\n\nThroughout Trump's presidency, relations between Washington and Beijing were often strained. Key areas of contention included trade imbalances, with the U.S. imposing tariffs on Chinese goods, and disputes over intellectual property rights. Beyond economics, there were also significant disagreements regarding human rights, China's military expansion in the South China Sea, and its technological ambitions.\n\nDespite these serious points of friction, leaders often maintain a facade of cordiality during face-to-face interactions. This diplomatic approach aims to prevent open conflict and keep lines of communication open, even when substantive progress on core issues is difficult to achieve. The outward display of respect and friendliness, therefore, acted as a strategic tool to manage, rather than resolve, the inherent tensions between two of the world's most influential nations. The Seattle Times article underscored this dynamic, noting how superficial pleasantries often conceal the complex realities of international relations.", "vocab": [{"word": "tension", "definition": "A feeling of strain or stress between people or countries."}, {"word": "courtesy", "definition": "Polite behavior; good manners."}, {"word": "diplomatic", "definition": "Relating to the management of relationships between countries."}, {"word": "underlying", "definition": "Existing beneath the surface; fundamental."}, {"word": "prominent", "definition": "Important and easily noticed."}, {"word": "contention", "definition": "Disagreement or argument."}, {"word": "cordiality", "definition": "Friendly and polite behavior."}]}, "Advanced": {"text": "During a critical juncture in international relations, the interactions between then-U.S. President Donald Trump and Chinese President Xi Jinping were often characterized by a striking duality. While public appearances and high-level meetings frequently showcased formal politeness and diplomatic pleasantries—described by The Seattle Times as \"bonding over granite and politesse\"—these outward displays often served to obscure the profound and escalating \"rift of powers\" between the two global behemoths.\n\n\"Politesse,\" in this context, refers to the refined and often elaborate social graces and formal courtesies exchanged between heads of state. This could manifest as reciprocal state visits, elaborate dinners, carefully worded statements, and the exchange of symbolic gifts. Such gestures are integral to the choreography of international diplomacy, designed to maintain a veneer of stability and mutual respect, even when substantive policy disagreements are acute. The \"granite\" metaphor might allude to the enduring, perhaps unyielding, nature of their respective national interests, or even the material solidity of state gifts, contrasting with the more ephemeral nature of pleasantries.\n\nThe \"rift of powers\" speaks to a deep-seated and multifaceted strategic competition. Under the Trump administration, U.S.-China relations deteriorated significantly across several fronts. Economically, the U.S. initiated a trade war, imposing substantial tariffs on Chinese imports, citing unfair trade practices, intellectual property theft, and forced technology transfers. This economic friction was compounded by ideological differences, with Washington increasingly challenging Beijing's authoritarian governance model and its human rights record, particularly concerning Xinjiang and Hong Kong.\n\nGeopolitically, the rivalry extended to the South China Sea, where China's assertive territorial claims and militarization efforts clashed with U.S. freedom of navigation operations. Furthermore, competition in advanced technologies, such as 5G and artificial intelligence, became a central battleground, with the U.S. seeking to curb China's technological ascendancy and influence.\n\nThe diplomatic niceties, therefore, were not indicative of a genuine convergence of interests but rather a sophisticated mechanism for managing inherent tensions. They allowed both leaders to project an image of constructive engagement while simultaneously pursuing divergent national agendas. This strategic politeness aimed to prevent an outright collapse of communication channels and to mitigate the risk of miscalculation, even as the underlying structural and ideological antagonisms continued to deepen. The Seattle Times article aptly captured this complex dynamic, highlighting how the veneer of cordiality often belies the intricate and often adversarial realities of great power competition.", "vocab": [{"word": "duality", "definition": "The state of having two parts, often opposite, or a dual character."}, {"word": "obscure", "definition": "To make something unclear or difficult to understand; to hide."}, {"word": "behemoths", "definition": "Something enormous in size or power."}, {"word": "choreography", "definition": "The planned arrangement of movements or actions, especially in a complex situation."}, {"word": "veneer", "definition": "A superficial or attractive appearance that covers something less appealing."}, {"word": "acute", "definition": "Very serious or intense."}, {"word": "antagonisms", "definition": "Active hostility or opposition."}, {"word": "adversarial", "definition": "Involving conflict or opposition."}]}}, "questions": [{"q": "What did the news article say the politeness between Xi and Trump was \"masking\"?", "a": "The news article stated that the politeness was \"masking a rift of powers\" between their countries."}, {"q": "Name two general areas of disagreement or \"rift\" between the United States and China mentioned in the articles.", "a": "Two general areas of disagreement mentioned are trade issues (like tariffs and unfair practices) and geopolitical strategies (like military expansion or technological competition)."}], "id": "a8ecc95ceb9", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixAFBVV95cUxNUzRMQ1Jjak9xQ0x2V3hXb0h4N2JDekpyd2RNbzVaM2R1djNoY3pjQ2VVVnJHNTVDMEVnUmlvQjY5a09BOWgwcE44TUF2SVh5MjFGRjZTV3NNV3hrWEE1VXlDMUs3dXU2OTNmbkZ0YXpQME9TZmFMQzF3OGtCbG5FQjVoYURBTWhnZU1hU0FLd09NSGdiSkdsNWdzYzA3VW81Nl8tNmxLWkdZWlBudUhveUxsQzdYTUZQbjAwOEpXVmx6bVZf?oc=5", "published": "2026-09-25T09:04:08+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Netanyahu Criticizes Opponents in UN Speech Ahead of Election", "excerpt": "Israeli Prime Minister Benjamin Netanyahu used his recent speech at the United Nations to strongly criticize his opponents as an election approaches.", "levels": {"Beginner": {"text": "Mr. Benjamin Netanyahu, the leader of Israel, recently gave a speech at the United Nations. This is a very important place where leaders from many countries meet. In his speech, Mr. Netanyahu talked about people who do not agree with his ideas. He spoke very strongly against his critics. He was not shy or afraid to say what he thought. He showed no shame in his words. This happened because an election is coming soon in Israel. When an election is near, leaders often speak strongly. They want to show people why they should vote for them. Mr. Netanyahu used this big international stage, the United Nations, to share his message not only with other countries but also with voters back home in Israel. He wanted to make his position clear and gather support for his party. It is a common strategy for politicians to use important events to talk about their political goals, especially when an election is around the corner.", "vocab": [{"word": "leader", "definition": "The person who is in charge of a country or group."}, {"word": "speech", "definition": "A formal talk given to a group of people."}, {"word": "United Nations", "definition": "An important international group where countries work together."}, {"word": "critics", "definition": "People who say what they think is wrong with something or someone."}, {"word": "election", "definition": "A time when people vote to choose their leaders."}, {"word": "strategy", "definition": "A plan used to achieve a goal."}]}, "Intermediate": {"text": "Israeli Prime Minister Benjamin Netanyahu recently delivered a significant speech at the United Nations General Assembly, a prominent global platform typically reserved for discussing international issues and fostering cooperation among nations. However, Netanyahu notably used this opportunity to strongly criticize his political opponents and those who disagree with his policies. He did so without hesitation or apology, appearing \"unabashed\" in his direct and forceful approach.\n\nThe timing of this address was particularly crucial, as an election is rapidly approaching in Israel. Political leaders frequently leverage major public appearances, even international ones, to bolster their domestic support and rally their base. By assailing his critics on such a prominent international stage, Netanyahu likely aimed to energize his voter base and draw a clear distinction between himself and his rivals. This tactic allows a leader to project strength, conviction, and a clear vision to both a global audience and, perhaps more importantly, to the electorate at home.\n\nNetanyahu's speech, therefore, served a dual purpose: an address to the world community and a powerful message to Israeli voters. He sought to define the political landscape ahead of the upcoming polls, framing the debate in terms that favor his leadership and agenda. Using the United Nations as a backdrop amplified his message, giving it an added layer of importance and visibility. This kind of political maneuvering is a common strategy in the lead-up to elections, as leaders strive to gain every possible advantage and solidify their position with the voting public. His willingness to openly challenge his detractors on such a stage underscores his characteristic political style.", "vocab": [{"word": "delivered", "definition": "Gave a speech or message."}, {"word": "platform", "definition": "A stage or opportunity to express views publicly."}, {"word": "criticize", "definition": "To express disapproval of someone or something."}, {"word": "unabashed", "definition": "Not ashamed or embarrassed; confident in one's actions."}, {"word": "crucial", "definition": "Extremely important or essential."}, {"word": "bolster", "definition": "To support or strengthen something."}, {"word": "electorate", "definition": "All the people in a country or area who are entitled to vote in an election."}]}, "Advanced": {"text": "Israeli Prime Minister Benjamin Netanyahu recently utilized the esteemed podium of the United Nations General Assembly to deliver a forceful and unapologetic critique of his political adversaries, a move widely interpreted as a strategic maneuver in the lead-up to a looming national election. Far from adopting the diplomatic decorum often associated with such a global forum, Netanyahu demonstrated an \"unabashed\" willingness to directly \"assail\" those who challenge his leadership and policies, both domestically and potentially internationally. This assertive stance, delivered without apparent reservation, underscored his characteristic political style.\n\nThe General Assembly, typically a venue for heads of state to address pressing global issues, foster international cooperation, and articulate their nation's foreign policy objectives, was strategically repurposed by Netanyahu. His speech was not merely an international address but a potent domestic political statement, meticulously designed to resonate with his base and define the electoral battleground. By launching a vigorous verbal attack on his critics from such a high-profile stage, he aimed to project an image of unwavering resolve and strength, characteristics often valued by his supporters. This approach allowed him to frame the upcoming election as a stark choice between his decisive leadership and the perceived weaknesses or misguided policies of his opponents, thereby galvanizing his core constituency.\n\nThis tactic is characteristic of Netanyahu's long political career, marked by a combative style and a readiness to confront detractors head-on. The timing was paramount: with an election on the horizon, leaders frequently exploit significant public platforms to consolidate their support, differentiate themselves from rivals, and energize their party's activists. The international spotlight of the UN amplified his message, lending it an additional layer of gravitas and ensuring widespread media coverage, both at home and abroad. This dual impact is invaluable for a politician facing a competitive election, allowing them to simultaneously address foreign policy and domestic political exigencies.\n\nFurthermore, by taking a confrontational stance on the world stage, Netanyahu could also be appealing to a segment of the Israeli electorate that values a strong, defiant leader in the face of perceived external and internal pressures. His speech served to rally his political base, reinforce his narrative of being a strong protector of Israel's interests, and potentially marginalize his opponents by associating them with criticism or weakness. Such a performance underscores the intricate interplay between international diplomacy and domestic political considerations, particularly for leaders navigating complex geopolitical landscapes while simultaneously campaigning for re-election. His unabashed approach signals a clear intent to dominate the political discourse and shape public opinion as the election draws nearer, leveraging the global stage for intensely local political gain.", "vocab": [{"word": "utilized", "definition": "Used something for a practical purpose."}, {"word": "esteemed", "definition": "Highly respected and admired."}, {"word": "podium", "definition": "A small platform on which a person may stand to give a speech."}, {"word": "adversaries", "definition": "One's opponents in a contest, conflict, or dispute."}, {"word": "decorum", "definition": "Behavior in keeping with good taste and propriety."}, {"word": "assail", "definition": "To make a violent verbal attack on someone or something."}, {"word": "galvanizing", "definition": "Shocking or exciting someone into taking action."}, {"word": "exigencies", "definition": "Urgent needs or demands."}]}}, "questions": [{"q": "What international body did Benjamin Netanyahu address?", "a": "Benjamin Netanyahu addressed the United Nations General Assembly."}, {"q": "Why was the timing of Netanyahu's speech considered important in relation to his home country?", "a": "The timing was important because an election was nearing in Israel, and leaders often use major public platforms like the UN to criticize opponents, rally support, and define their political agenda for voters back home."}], "id": "ad4249a0104", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPV3M5WFQ3dWgtUjZfSDZobUpacEMybWFHMUxhUWt0UDhpcEM3LUxqdERqazkxQ2xOaTR0YzJxRlNDMlZZTGpDaDBXYTMxTk92dUptSnJRdGJwbjhTZks2dERWRVpwbzFtWFBEMmNWWU45Y3p1RWRrbjJGTU9PZjFhdkhmSnMyTk0yUnZhaFNtdmt1YWt0RWxvbkNkbXJ0bXpwa1QzV3FTdERHMU5IejMzYUdn?oc=5", "published": "2026-09-25T08:59:06+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "$+⚽️+【Live Sports)@+!】 Green Bay Packers vs Atlanta Falcons in the 2026 HS Football - czechinvest.gov.cz", "excerpt": "$+⚽️+【Live Sports)@+!】 Green Bay Packers vs Atlanta Falcons in the 2026 HS Football czechinvest.gov.cz", "levels": {"Beginner": {"text": "$+⚽️+【Live Sports)@+!】 Green Bay Packers vs Atlanta Falcons in the 2026 HS Football czechinvest.gov.cz", "vocab": []}, "Intermediate": {"text": "$+⚽️+【Live Sports)@+!】 Green Bay Packers vs Atlanta Falcons in the 2026 HS Football c const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
