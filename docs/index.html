me", "excerpt": "A recent exchange between former President Donald Trump and a Republican senator highlights ongoing debate about making daylight saving time permanent.", "levels": {"Beginner": {"text": "Daylight Saving Time (DST) is when we move our clocks forward in spring and back in fall. This means we have more daylight in the evening during summer. But then we have darker mornings in winter. Many people don't like changing clocks twice a year. They want to make Daylight Saving Time permanent. This means clocks would stay forward all year. We would not change them anymore.\n\nFormer President Donald Trump likes the idea of permanent Daylight Saving Time. He thinks it would be good for the country. However, a Republican senator does not agree with him. They had a disagreement, or \"traded barbs,\" about this idea. This means they argued about it.\n\nSupporters say permanent DST would give people more light in the evenings. This could be good for businesses and make people happier. It might also mean fewer car accidents. But others worry about darker mornings, especially for children going to school. Some doctors also say changing time can be bad for our health. The idea of permanent Daylight Saving Time has been discussed for a long time. It is still a big topic in the United States. People are still talking about if it is a good idea or not.", "vocab": [{"word": "permanent", "definition": "staying the same forever; not changing"}, {"word": "disagreement", "definition": "when people do not agree with each other"}, {"word": "traded barbs", "definition": "argued or said sharp things to each other"}, {"word": "supporters", "definition": "people who like an idea and want it to happen"}, {"word": "topic", "definition": "a subject that people talk or write about"}]}, "Intermediate": {"text": "Daylight Saving Time (DST) is a practice where clocks are adjusted forward by one hour during warmer months, typically in spring, and then set back in the fall. The main goal is to make better use of natural daylight, providing more light in the evenings. However, the twice-yearly clock change has become a source of frustration and debate for many Americans.\n\nThe idea of making Daylight Saving Time permanent, meaning clocks would not change at all throughout the year, has gained significant attention. Former President Donald Trump has publicly expressed his support for this proposal, believing it would benefit the nation by providing more evening daylight year-round.\n\nRecently, this issue sparked a public disagreement, or \"trade of barbs,\" between Trump and an unnamed Republican senator. While the specific details of their exchange were not fully disclosed in the summary, it highlights the ongoing division among lawmakers and the public regarding DST's future.\n\nProponents of permanent DST argue that it could boost the economy by encouraging more evening activities, such as shopping and dining. They also suggest it might reduce energy consumption, though studies on this are mixed. Furthermore, advocates point to potential health benefits, claiming that avoiding the \"spring forward\" and \"fall back\" transitions could lead to fewer sleep disruptions and a decrease in seasonal depression. Some also believe more evening daylight could lead to fewer traffic accidents and crimes.\n\nConversely, opponents raise concerns about the impact of permanent DST, particularly during winter months. They argue that darker mornings, especially in northern states, could pose safety risks for children waiting for school buses and negatively affect people's circadian rhythms. Medical experts often suggest that a permanent standard time, rather than permanent DST, aligns better with human biology. The debate continues to be a complex one, with strong arguments on both sides.", "vocab": [{"word": "adjusted", "definition": "changed slightly to make it better or more accurate"}, {"word": "frustration", "definition": "the feeling of being annoyed or upset because you cannot change or achieve something"}, {"word": "proposal", "definition": "a formal suggestion or plan"}, {"word": "disclosed", "definition": "made known or revealed to the public"}, {"word": "proponents", "definition": "people who support an idea, plan, or policy"}, {"word": "boost", "definition": "to help something increase, improve, or become more successful"}, {"word": "conversely", "definition": "in a way that is opposite to something else; on the other hand"}]}, "Advanced": {"text": "The recurring debate over Daylight Saving Time (DST) has once again captured national attention, with a recent public exchange between former President Donald Trump and a Republican senator highlighting the persistent divisions surrounding its future. The core of the contention revolves around the proposition of making DST permanent, thereby eliminating the biannual clock changes that have long been a source of both convenience and consternation for Americans.\n\nDaylight Saving Time, first widely adopted in the United States during World War I and later standardized by the Uniform Time Act of 1966, was initially conceived to conserve energy and extend daylight into the evening hours during warmer months. However, its efficacy and overall impact have been subjects of continuous scrutiny. The practice involves advancing clocks by one hour in the spring (\"spring forward\") and reverting them in the fall (\"fall back\"), a ritual that many find disruptive to sleep patterns and daily routines.\n\nFormer President Trump has been a vocal advocate for permanent DST, often expressing his belief that it would foster a more productive and enjoyable lifestyle for citizens by providing more usable daylight in the evenings throughout the year. His stance aligns with a growing sentiment among the public and some lawmakers who champion the economic and societal benefits of year-round evening light.\n\nThe \"trade of barbs\" between Trump and the unnamed Republican senator underscores the political complexities inherent in this issue. While the specific arguments exchanged were not detailed in the summary, such disagreements typically reflect broader ideological and practical considerations. Supporters of permanent DST, for instance, frequently cite potential boons for retail and hospitality sectors, as extended evening daylight can encourage more after-work activities. They also point to studies suggesting a reduction in traffic accidents and crime rates, and an improvement in public mood and mental health due to increased exposure to natural light.\n\nConversely, a significant contingent, including various health organizations and some scientists, argues for the abolition of DST altogether, advocating for a permanent return to standard time. They contend that permanent DST, particularly in winter, would result in excessively dark mornings, especially in higher latitudes, posing safety concerns for commuters and schoolchildren. More critically, medical research suggests that the misalignment of our internal circadian rhythms with external light-dark cycles, exacerbated by permanent DST, could have detrimental long-term health effects, including increased risks of heart attacks, strokes, and sleep disorders. The Sunshine Protection Act, which sought to make DST permanent nationwide, passed the Senate in 2022 but stalled in the House, illustrating the legislative hurdles that remain. The ongoing discourse reflects a deeply entrenched debate with diverse stakeholders and significant implications for daily life across the nation.", "vocab": [{"word": "contention", "definition": "a point of disagreement or argument, often in a debate"}, {"word": "proposition", "definition": "a statement or assertion that expresses a judgment or opinion; a formal proposal or plan"}, {"word": "biannual", "definition": "happening twice a year"}, {"word": "consternation", "definition": "feelings of anxiety or dismay, typically at something unexpected that causes confusion"}, {"word": "efficacy", "definition": "the ability to produce a desired or intended result; effectiveness"}, {"word": "advocate", "definition": "a person who publicly supports or recommends a particular cause, policy, or idea"}, {"word": "boons", "definition": "a thing that is helpful or beneficial; a blessing or advantage"}, {"word": "exacerbated", "definition": "made a problem, bad situation, or negative feeling worse or more severe"}]}}, "questions": [{"q": "What does it mean to make Daylight Saving Time permanent?", "a": "Making Daylight Saving Time permanent means that clocks would not change twice a year; they would stay on the 'forward' setting all year long."}, {"q": "What is the main disagreement between former President Trump and the Republican senator about?", "a": "The main disagreement is about whether to make Daylight Saving Time permanent."}], "id": "aa503d09bea", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxQMFh4Mk5rZlBiOEhSUV9nM2VuVkpJajZFMzFLdXFMRkVLU19XZXhoTU5fRE5PeS1iaFlKeExxaHNnTW1MYjRyX0t3a2F6UGFla2s0REdiTGRnUmlDTnlVclVUQnNSR05YRGhKNmVZMTlXQlNzaEJqMnBidzh2b1RhZ3ZVbEFPN2I4RU84cS1jQjlfa3dLeEpzUkhwaGJZYUoySnZma3FSdDNpMVRUWXFZTlcwWDhIc3o3aFc4?oc=5", "published": "2026-10-04T09:08:45+09:00", "category": "business", "category_title": "Business"}, {"headline": "Jalen Milroe's Unique Profile Piques Seahawks' Interest", "excerpt": "Alabama quarterback Jalen Milroe's unique athleticism and arm talent could offer significant value to the Seattle Seahawks.", "levels": {"Beginner": {"text": "Jalen Milroe is a young football player who plays quarterback for the University of Alabama. News reports say he might be very useful for the Seattle Seahawks team this season.\n\nThe Seahawks are a professional football team in the NFL. They are always looking for good players. Jalen Milroe is known for being a strong player. He can run with the ball very fast, and he can throw it far. These skills make him a \"dual-threat\" quarterback, meaning he can both run and pass.\n\nFor Jalen Milroe to play for the Seahawks this season, he would need to be chosen in the NFL Draft. The Draft is when professional teams pick new players from colleges. If the Seahawks pick him, he could join their team.\n\nMany people think Jalen Milroe has a lot of potential. This means he could become a very good player in the future. He could learn from the Seahawks' current quarterbacks, like Geno Smith. Having a player like Milroe could help the Seahawks for many years. He might bring new energy and different ways to play the game.", "vocab": [{"word": "Quarterback", "definition": "The player who leads the team's offense and throws the ball."}, {"word": "Professional", "definition": "Playing a sport for money, not just for fun."}, {"word": "Draft", "definition": "A system where sports teams choose new players from colleges."}, {"word": "Potential", "definition": "The ability to develop into something better in the future."}, {"word": "Skills", "definition": "Abilities or talents that a person has."}]}, "Intermediate": {"text": "Jalen Milroe, the dynamic quarterback from the University of Alabama, is generating buzz as a potential valuable asset for the Seattle Seahawks in the upcoming NFL season. Reports suggest that Milroe possesses a unique skill set that could significantly benefit the professional football franchise.\n\nMilroe has had a notable college career, showcasing his athleticism and strong arm as a dual-threat quarterback. He is known for his ability to extend plays with his legs, making crucial runs, while also delivering powerful throws downfield. This combination of rushing and passing prowess makes him an intriguing prospect for NFL teams looking for modern offensive versatility.\n\nFor Milroe to join the Seahawks this season, he would need to be selected in the annual NFL Draft. The draft is a crucial event where professional teams acquire new talent from college ranks. If the Seahawks choose to draft him, he would then become part of their roster, potentially learning from veteran quarterbacks like Geno Smith and Sam Howell.\n\nThe Seahawks currently have an established starter in Geno Smith and recently acquired Sam Howell as a backup. However, teams often look to the future, and a player like Milroe could be seen as a developmental prospect. This means he might not start immediately but could be groomed over time to become a future leader for the team. His \"unique value\" could stem from his high ceiling and the distinct challenges his playing style presents to defenses. Acquiring a talent like Milroe could provide the Seahawks with a long-term strategic advantage, adding depth and a different dimension to their quarterback room.", "vocab": [{"word": "Dynamic", "definition": "Full of energy and new ideas; able to change and adapt."}, {"word": "Asset", "definition": "A useful or valuable thing or person."}, {"word": "Franchise", "definition": "A professional sports team."}, {"word": "Prowess", "definition": "Skill or expertise in a particular activity or field."}, {"word": "Prospect", "definition": "A person likely to succeed or be chosen for something in the future."}, {"word": "Developmental", "definition": "Relating to the process of growth or development over time."}, {"word": "Strategic", "definition": "Relating to a plan of action designed to achieve a major or overall aim."}]}, "Advanced": {"text": "Jalen Milroe, the highly athletic quarterback from the University of Alabama, has emerged as a compelling figure in discussions surrounding the Seattle Seahawks' future roster construction. Speculation suggests that Milroe's unique attributes could offer significant strategic value to the NFC West franchise in the upcoming NFL season, potentially reshaping their quarterback room dynamics.\n\nMilroe's collegiate tenure at Alabama was marked by flashes of brilliance, particularly his exceptional mobility and formidable arm strength. He demonstrated the capacity to extend plays outside the pocket, evading pressure and delivering deep throws, embodying the modern dual-threat quarterback archetype. While his athleticism and big-play capability are undeniable, scouts have also noted areas for refinement, such as consistency in short-to-intermediate passing accuracy and decision-making under duress. These aspects are typical developmental hurdles for many young signal-callers transitioning to the professional ranks.\n\nFor Milroe to contribute to the Seahawks this season, he would need to be selected in the forthcoming NFL Draft. This annual event is pivotal for teams to infuse their rosters with collegiate talent. Should the Seahawks invest draft capital in Milroe, he would join an established quarterback corps featuring veteran starter Geno Smith and recent acquisition Sam Howell. While Smith remains the incumbent, and Howell offers a proven backup, the NFL's evolving landscape often necessitates a long-term vision for the most critical position on the field.\n\nMilroe's \"unique value\" likely stems from his high ceiling as a developmental prospect. He possesses elite physical tools that, if honed, could translate into a formidable NFL starter. His raw talent offers a distinct offensive dimension that could be leveraged in specific packages or as a future cornerstone. Acquiring Milroe would represent a forward-thinking move by the Seahawks, providing an opportunity to cultivate a quarterback with a different stylistic profile than their current options. This strategic depth could prove invaluable, offering insurance, competition, and a potential succession plan, aligning with the growing trend of teams prioritizing athletic, high-upside quarterbacks in the draft. The integration of such a talent could offer the Seahawks a versatile piece for both immediate tactical considerations and sustained competitive relevance.", "vocab": [{"word": "Compelling", "definition": "Evoking interest, attention, or admiration in a powerfully irresistible way."}, {"word": "Attributes", "definition": "Qualities or characteristics belonging to a person or thing."}, {"word": "Strategic value", "definition": "The importance or worth of something in achieving a long-term plan or overall aim."}, {"word": "Collegiate tenure", "definition": "The period of time spent at a college or university."}, {"word": "Archetype", "definition": "A very typical example of a certain person or thing."}, {"word": "Refinement", "definition": "The process of improving something by making small changes, often referring to skills."}, {"word": "Duress", "definition": "Pressure or threats used to compel someone to do something; in sports, intense pressure during a game."}, {"word": "Incumbent", "definition": "The person currently holding a particular office or position."}]}}, "questions": [{"q": "Who is Jalen Milroe and what team is reportedly interested in him?", "a": "Jalen Milroe is a college quarterback from the University of Alabama, and the Seattle Seahawks are reportedly interested in him."}, {"q": "What does 'unique value' likely refer to for Jalen Milroe in the context of professional football?", "a": "For Jalen Milroe, 'unique value' likely refers to his specific combination of strong arm, athleticism, and ability to run, making him a 'dual-threat' quarterback with high potential for a modern NFL offense."}], "id": "a07e11b9821", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxOTWlQNkphclZZczVXSTBKRWUxWWFHT0xUbTY3RDNEVXpIVGs3TlZXM0tzRV9ZSFZPdXI2R2JNdF9seFA4VHBvMDMyTzUyQ3ZRaGFoNE95em9PSTUxYXJpdmFGcWlTcGpXc0ViOWY0Z0pmLU1GVXltRGl1X19hRnFTQWNIWnRuYnZRSnE1MWRKTDhyX1N0TFB6YTJIY3lCd0JPNC1RMDJ6eUhRY2dwc3VTNHZlUXZzS2toZFhSbUpDNDIwaTVsRDJBZU1sNEg5Y1BNME9BblA4N2Q?oc=5", "published": "2026-10-04T09:06:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Iranian Rial Hits New Low Amid Central Bank Dollar Sales", "excerpt": "Iran's currency, the rial, has fallen to a new record low value, prompting its central bank to sell U.S. dollars.", "levels": {"Beginner": {"text": "Iran's money, called the rial, is now worth less than before. It has reached a new low point. This means you need more rials to buy things like food or goods from other countries. This makes life harder for people in Iran.\n\nIran's main bank, the central bank, is trying to help. It is selling U.S. dollars. When the central bank sells dollars, it hopes to make the rial stronger. It wants to stop the rial from losing more value. This is a common way for countries to try and keep their money stable.\n\nThe rial has been getting weaker for a long time. One big reason is that other countries, especially the United States, have put rules on Iran. These rules are called sanctions. Sanctions make it hard for Iran to sell its oil and do business with many parts of the world. This limits how much foreign money Iran can get.\n\nBecause of this, Iran's economy is having problems. Prices for everyday things are going up very fast. This is called inflation. When prices go up, people's money buys less. The central bank's action is a way to try and make the economy more stable. But many people in Iran are worried about their money and how much things cost. They hope the rial will get stronger soon.", "vocab": [{"word": "Rial", "definition": "The name of Iran's money."}, {"word": "Low point", "definition": "The lowest value something has reached."}, {"word": "Central bank", "definition": "The main bank of a country that manages its money and economy."}, {"word": "Sanctions", "definition": "Rules put by countries to limit trade or business with another country as a punishment."}, {"word": "Inflation", "definition": "When prices for things go up very fast, meaning your money buys less."}, {"word": "Stable", "definition": "Not changing much, steady and firm."}]}, "Intermediate": {"text": "The Iranian rial, the national currency of Iran, has recently fallen to an unprecedented low value against major foreign currencies, particularly the U.S. dollar. This significant depreciation marks a new challenge for Iran's already struggling economy and impacts the daily lives of its citizens.\n\nIn response to the rial's sharp decline, Iran's central bank has initiated measures to stabilize the currency. The bank is actively selling U.S. dollars into the market. The goal of this intervention is to increase the supply of dollars, which in turn is intended to strengthen the rial's value and prevent further depreciation. This is a common strategy employed by central banks globally to manage currency fluctuations and maintain economic stability.\n\nThe continuous weakening of the rial is largely attributed to a combination of factors. Foremost among these are the severe economic sanctions imposed by the United States. These sanctions restrict Iran's ability to export oil, its primary source of foreign currency revenue, and limit its access to international financial systems. This makes it difficult for Iran to earn and hold foreign currency, putting significant downward pressure on the rial's value.\n\nDomestically, Iran is also grappling with high inflation. The cost of goods and services has been rising rapidly, eroding the purchasing power of ordinary citizens. This inflation is partly a consequence of the sanctions, which disrupt supply chains and increase import costs, and partly due to internal economic policies. When prices rise quickly, people's savings lose value, and daily expenses become more burdensome.\n\nThe central bank's move to sell dollars is a critical, albeit often temporary, effort to address the currency crisis. However, the effectiveness of such interventions can be limited, especially when underlying economic issues like persistent sanctions and high inflation continue to exert pressure.", "vocab": [{"word": "Currency", "definition": "The system of money used in a particular country."}, {"word": "Depreciation", "definition": "A decrease in the value of a currency compared to other currencies."}, {"word": "Stabilize", "definition": "To make something firm or steady; to prevent it from changing or getting worse."}, {"word": "Intervention", "definition": "An action taken by a government or central bank to influence the economy or financial markets."}, {"word": "Sanctions", "definition": "Official orders or laws stopping trade or communication with another country as a punishment."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Purchasing power", "definition": "The financial ability to buy products and services; how much your money can buy."}]}, "Advanced": {"text": "The Iranian rial has plummeted to an unprecedented low against major international currencies, particularly the U.S. dollar, signaling deepening economic distress within the Islamic Republic. This latest depreciation underscores the severe pressures on Iran's financial system and the daily lives of its citizens, who face an escalating cost-of-living crisis.\n\nIn an attempt to staunch the rial's rapid decline, Iran's central bank has reportedly initiated significant sales of U.S. dollars on the open market. This foreign exchange intervention is a conventional monetary policy tool aimed at bolstering the domestic currency. By increasing the supply of dollars, the central bank seeks to reduce their price relative to the rial, thereby strengthening the latter and mitigating further depreciation. However, the efficacy of such measures is often constrained by the magnitude of underlying economic challenges and the limited foreign currency reserves available to the central bank.\n\nThe persistent weakening of the rial is a multifaceted issue, primarily driven by the crippling economic sanctions reimposed by the United States following its withdrawal from the 2015 nuclear deal. These sanctions severely restrict Iran's ability to export crude oil, its principal source of hard currency earnings, and isolate its financial sector from global banking networks. This drastically limits the inflow of foreign currency, creating a chronic shortage that inevitably devalues the rial and fuels a robust parallel market for foreign exchange.\n\nCompounding these external pressures are significant domestic economic woes. Iran has been battling rampant inflation, with annual rates often soaring well into double digits, sometimes even triple digits. This hyperinflation erodes the purchasing power of Iranian households, diminishing savings and exacerbating the cost-of-living crisis. Government budget deficits, often financed by printing money, further fuel inflationary spirals and undermine confidence in the national currency.\n\nMoreover, political uncertainties, regional tensions, and a lack of investor confidence contribute to capital flight and a preference for holding stable foreign assets over the volatile rial. The existence of a thriving black market for foreign exchange, where the rial often trades at a significantly weaker rate than the official central bank rate, further complicates efforts to manage the currency and reflects the true market sentiment.\n\nThe central bank's intervention, while a necessary tactical response, is unlikely to offer a long-term solution without addressing the root causes of the rial's instability. The ongoing economic hardship, marked by rising unemployment and declining living standards, continues to fuel public discontent. The trajectory of the rial remains a critical barometer of Iran's economic health and its ability to navigate a complex geopolitical landscape.", "vocab": [{"word": "Plummeted", "definition": "Fallen very quickly and suddenly from a high level."}, {"word": "Depreciation", "definition": "A reduction in the value of an asset over time, especially a currency's value relative to others."}, {"word": "Staunch", "definition": "To stop or check the flow of something, especially a decline or loss."}, {"word": "Intervention", "definition": "An action taken by a government or central bank to influence the economy or financial markets, often to stabilize a currency."}, {"word": "Efficacy", "definition": "The ability to produce a desired or intended result; effectiveness."}, {"word": "Sanctions", "definition": "Economic or political measures taken by one or more states to compel another state to change a policy, often involving restrictions on trade or finance."}, {"word": "Rampant", "definition": "(Especially of something unwelcome or unpleasant) flourishing or spreading unchecked."}, {"word": "Hyperinflation", "definition": "Monetary inflation occurring at a very high rate, often leading to a rapid and continuous increase in prices."}]}}, "questions": [{"q": "What is the name of Iran's currency?", "a": "Iran's currency is called the rial."}, {"q": "What are two main reasons mentioned for the Iranian rial losing value?", "a": "Two main reasons are the economic sanctions imposed by other countries (especially the United States) and high inflation within Iran."}], "id": "ae4a9f2681a", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitwFBVV95cUxNUXZUTFl2UWhXcWhmZGRNMDhZVklvdGhnS0czUll4SUR3WEgyZDNzaEc1ZFRRQjFfRjVqalR5cXU1a3RfZkFrUE04R2JKY2ZnajNSTzlkWVo2ZzNWUE5pSGViX0t4N0VzLWN0cUtoSlV3RlpDc0pNcGhMV3dkVzEyTU00RGtTV2xFdTZpeWJWOXdub1BKOHlkZ05rdXIyUlhaRXB4ODlhem9QOU40WkI3dXYwdmRNUUk?oc=5", "published": "2026-10-04T07:33:53+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Sri Lanka Central Bank Holds Key Rate Amid Global Inflation Concerns", "excerpt": "Sri Lanka's central bank holds key interest rate steady, aiming to control rising prices influenced by global events.", "levels": {"Beginner": {"text": "Sri Lanka's central bank has decided to keep its main interest rate at 8.75%. This means the cost of borrowing money will stay the same for now. A central bank helps manage a country's money. It uses interest rates to control how much money people spend.\n\nWhen prices for things go up quickly, it's called inflation. Sri Lanka has seen high inflation recently. The central bank wants to stop prices from rising too fast. By keeping interest rates steady, they hope to make sure the economy does not get too hot.\n\nOne reason for high prices is problems far away. News reports say that conflicts in the Middle East, like the \"Iran war,\" are making oil prices higher around the world. Higher oil prices mean everything costs more to make and transport. This makes inflation worse in many countries, including Sri Lanka.\n\nSri Lanka has faced big money problems in the past few years. The central bank is working to make the country's economy stronger and more stable. Keeping the interest rate unchanged is part of this plan to manage prices and help the economy recover slowly.", "vocab": [{"word": "central bank", "definition": "A special bank that manages a country's money."}, {"word": "interest rate", "definition": "The extra money you pay when you borrow money, or earn when you save."}, {"word": "inflation", "definition": "When prices for goods and services go up over time."}, {"word": "conflicts", "definition": "Fights or disagreements between countries or groups."}, {"word": "economy", "definition": "How a country makes and uses money and goods."}, {"word": "recover", "definition": "To get better after a difficult time."}]}, "Intermediate": {"text": "Sri Lanka's central bank has announced its decision to maintain the key interest rate at 8.75%. This move signals the bank's continued cautious approach to managing the nation's economy amidst ongoing challenges. The Standing Deposit Facility Rate (SDFR) and the Standing Lending Facility Rate (SLFR) remain unchanged, influencing borrowing costs across the financial system.\n\nCentral banks use interest rates as a primary tool to control inflation, which is the rate at which prices for goods and services rise. By holding rates steady, the Central Bank of Sri Lanka (CBSL) aims to anchor inflation expectations and ensure price stability. Higher interest rates typically discourage borrowing and spending, which can help cool down an overheating economy and bring inflation under control.\n\nThe CBSL noted that global factors are significantly impacting domestic inflation. Specifically, geopolitical tensions in the Middle East, often referred to in news as the \"Iran war,\" are contributing to elevated global energy prices. Sri Lanka, being an importer of oil, is particularly vulnerable to these international price fluctuations. When oil prices rise, it increases the cost of transportation and production for many goods, leading to higher prices for consumers.\n\nSri Lanka has been navigating a severe economic crisis in recent years, marked by high inflation, foreign exchange shortages, and a default on its international debt. The country has been working with the International Monetary Fund (IMF) on a recovery program. The central bank's current monetary policy stance is part of a broader strategy to restore macroeconomic stability, rebuild foreign reserves, and foster sustainable economic growth. The decision to hold rates suggests the bank believes its current policy is sufficient to manage inflation without stifling the fragile recovery.", "vocab": [{"word": "maintain", "definition": "To keep something at the same level or in the same condition."}, {"word": "cautious", "definition": "Careful to avoid potential problems or dangers."}, {"word": "inflation expectations", "definition": "What people think prices will do in the future."}, {"word": "geopolitical tensions", "definition": "Difficult or strained relationships between countries, often involving political and geographical factors."}, {"word": "vulnerable", "definition": "Easily hurt or affected by something."}, {"word": "macroeconomic stability", "definition": "A state where a country's economy is generally healthy and predictable, with low inflation and steady growth."}, {"word": "stifling", "definition": "Preventing something from happening or developing normally."}]}, "Advanced": {"text": "The Central Bank of Sri Lanka (CBSL) has opted to maintain its benchmark interest rates, holding the Standing Deposit Facility Rate (SDFR) and the Standing Lending Facility Rate (SLFR) at 8.75% and 9.75% respectively. This decision underscores the central bank's commitment to its disinflationary path while carefully balancing the need for price stability with the imperative of fostering a nascent economic recovery. The move signals a continued data-dependent approach, acknowledging both domestic economic indicators and persistent global headwinds.\n\nMonetary policy in Sri Lanka is currently navigating a complex landscape. The CBSL's primary mandate is to achieve and maintain price stability, which it addresses through managing inflation expectations and controlling aggregate demand. By keeping policy rates unchanged, the bank aims to reinforce the credibility of its anti-inflationary stance, preventing a resurgence of inflationary pressures that could derail the fragile economic rebound. Higher rates typically cool demand by making borrowing more expensive for businesses and consumers, thereby reducing spending and theoretically lowering price increases.\n\nA significant factor influencing the CBSL's decision is the impact of external shocks on domestic inflation. The central bank explicitly cited ongoing geopolitical tensions in the Middle East, which have been colloquially referred to as the \"Iran war\" in some reports, as a key driver of elevated global commodity prices, particularly crude oil. Sri Lanka, a net importer of energy, is highly susceptible to these international price fluctuations. Surges in global oil prices translate directly into higher import bills, increased production costs for industries, and subsequently, higher consumer prices, exacerbating imported inflation.\n\nSri Lanka has recently emerged from an unprecedented economic crisis, characterized by hyperinflation, severe foreign exchange shortages, and a sovereign debt default. The country is currently implementing a comprehensive reform program supported by the International Monetary Fund (IMF), which includes fiscal consolidation, debt restructuring, and structural reforms alongside prudent monetary policy. The central bank's current stance reflects a delicate balancing act: ensuring that monetary conditions remain sufficiently restrictive to guide inflation towards its medium-term target without unduly stifling the nascent growth momentum that is crucial for debt sustainability and long-term prosperity. The decision suggests that the CBSL assesses the current policy rate as appropriately calibrated to manage these multifaceted challenges.", "vocab": [{"word": "benchmark interest rates", "definition": "Standard interest rates used by central banks to influence other interest rates in the economy."}, {"word": "disinflationary path", "definition": "A period where the rate of inflation is slowing down, but still positive."}, {"word": "imperative", "definition": "Something that is extremely important or urgent."}, {"word": "nascent", "definition": "Just coming into existence and beginning to display signs of future potential."}, {"word": "aggregate demand", "definition": "The total demand for all goods and services produced in an economy."}, {"word": "resurgence", "definition": "The act of rising or increasing again after a period of decline."}, {"word": "exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}, {"word": "calibrated", "definition": "Carefully adjusted or set to a precise standard or for a particular purpose."}]}}, "questions": [{"q": "What is the main decision made by Sri Lanka's central bank?", "a": "The central bank decided to keep its key interest rate unchanged at 8.75%."}, {"q": "What global factor is mentioned as contributing to high inflation in Sri Lanka?", "a": "Geopolitical tensions in the Middle East (or \"Iran war\" as mentioned in the summary) are cited as contributing to elevated global energy prices, which in turn drive up inflation."}], "id": "a890e9fc5ed", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5VRE1adnZZQjlHX0oyXzVaUzdYaG1xUmRnaWJ4Sm5EVTZsYmcxY0ttS3pUeUd6RHNwNUFpSi1zZl9lcXViekx6SmpjMnlFNzBiQldRXzhB0gFWQVVfeXFMTlVETVp2dllCOUdfSjJfNVpTN1hobXFSZGdpYnhKbkRVNmxiZzFjS21LelR5R3pEc3A1QWlKLXNmX2VxdWJ6THpKamMyeUU3MGJCV1FfOEE?oc=5", "published": "2026-10-04T06:23:01+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Cornell President Addresses Frat House Rape Allegations", "excerpt": "Cornell's president called allegations of a woman drugged and gang-raped at a fraternity 'deeply disturbing,' vowing the university 'must do better.'", "levels": {"Beginner": {"text": "Cornell University's president, Michael Kotlikoff, has spoken about serious claims. A woman said she was drugged and then sexually assaulted at a house belonging to a fraternity. Fraternities are social groups for male students at universities. President Kotlikoff said these claims are \"deeply disturbing.\" This means they are very upsetting and worrying. He also said that Cornell University \"must do better.\" This means the university needs to improve how it handles such situations and keeps students safe.\n\nThe university is taking these allegations very seriously. They will likely start an investigation to find out what happened. When something like this is reported, it is important for universities to act quickly and fairly. They need to support the person who made the report and also look into the facts. Sexual assault is a very serious crime. Universities work to make sure their campuses are safe places for all students. This incident reminds everyone that safety is very important. Cornell wants to make sure all students feel secure and respected. They are working to prevent such terrible events from happening again.", "vocab": [{"word": "claims", "definition": "things that someone says happened."}, {"word": "fraternity", "definition": "a social club for male students at a university."}, {"word": "disturbing", "definition": "very upsetting or worrying."}, {"word": "allegations", "definition": "serious claims that someone has done something wrong."}, {"word": "investigation", "definition": "an official check to find out facts about something."}, {"word": "campus", "definition": "the land and buildings of a university or college."}]}, "Intermediate": {"text": "Cornell University President Michael Kotlikoff has addressed serious allegations concerning a fraternity house on campus. A woman reported that she was drugged and subsequently gang-raped at one of the university's fraternity residences. President Kotlikoff described these claims as \"deeply disturbing,\" indicating the profound concern and gravity with which the university views the situation. He emphasized that Cornell University \"must do better\" in its efforts to ensure student safety and address incidents of sexual assault.\n\nFraternities are social organizations for male students, often with their own houses near university campuses. These groups are a common part of university life in the United States, but they have also faced scrutiny regarding issues like alcohol abuse and sexual misconduct. The allegations at Cornell highlight ongoing challenges universities face in preventing and responding to sexual violence within their communities. This incident serves as a stark reminder of the persistent issues surrounding campus safety and the need for continuous vigilance.\n\nThe university is expected to launch a thorough investigation into the reported incident. Such investigations typically involve gathering evidence, interviewing witnesses, and determining appropriate actions, which can range from disciplinary measures against individuals to changes in fraternity policies or even their suspension. Universities have a responsibility to create a safe environment for all students and to respond effectively when such serious incidents occur. This includes providing support for survivors, ensuring a fair process for all involved, and implementing preventative measures. President Kotlikoff's statement underscores the institution's commitment to addressing these issues and improving its response to ensure the well-being of its student body. It also signals a broader institutional reflection on how to foster a culture of respect and accountability across campus.", "vocab": [{"word": "addressed", "definition": "spoke about or dealt with."}, {"word": "allegations", "definition": "claims that someone has done something wrong, often serious."}, {"word": "subsequently", "definition": "happening after something else."}, {"word": "profound", "definition": "very great or intense."}, {"word": "scrutiny", "definition": "careful and close examination."}, {"word": "misconduct", "definition": "unacceptable or improper behavior."}, {"word": "vigilance", "definition": "keeping careful watch for possible danger or difficulties."}]}, "Advanced": {"text": "Cornell University President Michael Kotlikoff has issued a powerful statement in response to deeply troubling allegations of sexual assault at a campus fraternity house. A woman has come forward, reporting that she was drugged and subsequently gang-raped at a fraternity residence, prompting President Kotlikoff to declare these claims \"deeply disturbing\" and to assert that the university \"must do better.\" This incident has reignited critical discussions about campus safety, accountability within Greek life, and the institutional response to sexual violence.\n\nFraternities, historically significant social organizations for male students, often operate with a degree of autonomy while being affiliated with universities. While they contribute to campus social life for many, they have also been a recurring focal point for controversies involving alcohol-related incidents, hazing, and, most critically, sexual assault. The current allegations at Cornell underscore the persistent challenges universities face in balancing student freedoms with the imperative to ensure a safe and respectful environment for all members of their community. This delicate balance often involves navigating complex legal frameworks, including Title IX regulations in the United States, which mandate that universities address sexual discrimination and violence.\n\nThe university is now expected to initiate a comprehensive investigation into the reported events. Such inquiries are multifaceted, involving law enforcement if a criminal complaint is filed, as well as internal university processes. These processes typically entail gathering forensic evidence, interviewing all parties involved and potential witnesses, and reviewing relevant policies and procedures. The outcomes can range from severe disciplinary actions against individuals, including expulsion, to sanctions against the fraternity itself, such as suspension or permanent disbandment. The rigor and transparency of these investigations are crucial for maintaining trust within the university community and demonstrating a genuine commitment to justice.\n\nPresident Kotlikoff's acknowledgment that Cornell \"must do better\" signals a commitment to not only address this specific incident but also to critically re-evaluate and enhance the university's broader strategies for preventing sexual violence and supporting survivors. This includes strengthening educational programs on consent, bystander intervention, and responsible conduct, as well as ensuring accessible and confidential reporting mechanisms. Universities across the nation grapple with these complex issues, striving to foster a culture where sexual assault is unequivocally condemned, and victims feel empowered to come forward, confident in the institution's capacity for a just and compassionate response. The incident at Cornell serves as a poignant reminder of the ongoing societal challenge of sexual violence and the crucial role higher education institutions play in fostering a safer, more equitable future, demanding continuous vigilance and proactive measures to protect their student populations.", "vocab": [{"word": "allegations", "definition": "unproven claims or assertions, typically of wrongdoing."}, {"word": "subsequently", "definition": "after a particular thing has happened; afterward."}, {"word": "reignited", "definition": "caused to start burning or shining again; revived or renewed."}, {"word": "autonomy", "definition": "the right or condition of self-government; independence."}, {"word": "imperative", "definition": "of vital importance; crucial."}, {"word": "multifaceted", "definition": "having many different aspects or features."}, {"word": "disciplinary actions", "definition": "measures taken to correct or punish behavior that violates rules or standards."}, {"word": "unequivocally", "definition": "in a way that leaves no doubt; unambiguously."}]}}, "questions": [{"q": "What did Cornell University President Michael Kotlikoff say about the allegations?", "a": "He described the allegations as \"deeply disturbing\" and stated that the university \"must do better.\""}, {"q": "What kind of organization is a fraternity?", "a": "A fraternity is a social organization or club for male students at a university or college."}], "id": "a8c1678f514", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ckly0leelnz4o?at_medium=RSS&at_campaign=rss", "published": "2026-10-04T09:11:25+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Ghana Considers End to Bus Preaching", "excerpt": "Ghana, a Christian-majority country, is debating whether to end the long-standing tradition of pastors preaching on public buses.", "levels": {"Beginner": {"text": "Ghana is a country in Africa. Many people in Ghana are Christian. Pastors, who are religious leaders, often preach on public buses. This means they talk about their religion to passengers. It has been a common thing to see and hear this on buses for a long time. They share messages and sometimes ask for donations.\n\nBut now, this might change. Some people do not like the preaching. They say it can be noisy and disturbing. Other passengers might feel uncomfortable or distracted. The government or transport leaders are thinking about stopping it. If they stop it, pastors will not be able to preach on buses anymore.\n\nThis change would be big for Ghana. It would mean that a common religious practice in public places might end. People are talking about this decision. Some believe it is good for passenger comfort and safety. Others think it might limit religious freedom. The future of bus preaching in Ghana is now being discussed.", "vocab": [{"word": "pastors", "definition": "Religious leaders, often in Christian churches."}, {"word": "preach", "definition": "To give a religious talk."}, {"word": "public buses", "definition": "Large vehicles that carry many people for a fee."}, {"word": "common", "definition": "Happening often or found in many places."}, {"word": "uncomfortable", "definition": "Not feeling relaxed or at ease."}, {"word": "limit", "definition": "To put a stop to something or reduce it."}]}, "Intermediate": {"text": "Ghana, a vibrant nation in West Africa, is characterized by its deeply religious society, with a significant majority of its citizens identifying as Christian. This strong faith is often visible in public life, and for decades, it has been a widespread and accepted practice for Christian pastors and evangelists to preach on public transport vehicles, especially buses. These religious leaders typically deliver sermons, offer prayers, and sometimes seek financial contributions from passengers, transforming ordinary commutes into spiritual sessions. This tradition underscores the profound integration of faith into the fabric of daily Ghanaian life.\n\nNevertheless, this long-established custom is now under review and may soon face considerable restrictions or even a complete prohibition. Reports, including one from the BBC, indicate that transport authorities and government bodies are actively considering policies to curtail this practice. Key motivations behind this potential change include numerous complaints from passengers regarding excessive noise, which can be highly disruptive, and the discomfort some individuals feel when subjected to unsolicited religious messages. Furthermore, there are growing concerns about the potential for drivers to be distracted, posing a safety risk, and the general desire to maintain a peaceful environment within public spaces.\n\nThe ongoing discussion underscores a fundamental tension between the constitutional right to religious freedom and the collective right of all passengers to a comfortable, quiet, and undisturbed journey. While many Ghanaians value the spiritual upliftment offered by these preachers, an increasing number believe that public transport should serve as a neutral zone, free from proselytization. As transport operators and government officials deliberate, they must carefully balance these diverse viewpoints. A decision to ban or limit bus preaching would represent a notable evolution in how religious expression is regulated within Ghana's public domain, potentially setting a new precedent for other public spaces.", "vocab": [{"word": "widespread", "definition": "Happening in many places or among many people."}, {"word": "evangelists", "definition": "People who try to persuade others to become Christian."}, {"word": "solicit", "definition": "To ask for something, often money or support."}, {"word": "scrutiny", "definition": "Careful and close examination."}, {"word": "disruptive", "definition": "Causing problems and stopping something from continuing normally."}, {"word": "unsolicited", "definition": "Not asked for; given or offered without being requested."}, {"word": "precedent", "definition": "An earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}]}, "Advanced": {"text": "Ghana, a West African nation renowned for its vibrant cultural tapestry and profound spiritual inclinations, is predominantly Christian, with faith deeply interwoven into the daily lives of its populace. For generations, a distinctive feature of public transport, particularly intercity and urban buses, has been the ubiquitous presence of Christian pastors and evangelists delivering sermons, leading prayers, and occasionally soliciting offerings from passengers. This practice, often seen as a spontaneous expression of religious devotion and evangelism, reflects the nation's strong spiritual ethos and the pervasive role of faith in its social fabric. It has long been an accepted, if sometimes contentious, aspect of the Ghanaian commute.\n\nHowever, this deeply entrenched custom is now under intense scrutiny, with a potential prohibition looming. Recent reports, notably from the BBC, highlight that Ghanaian transport authorities and government bodies are actively considering regulatory measures to curtail or outright ban preaching on public conveyances. The impetus for this re-evaluation stems from a confluence of factors. Foremost among these are persistent passenger complaints regarding the excessive noise levels generated by preachers, which many find highly disruptive to their peace and quiet. Furthermore, a growing segment of the commuting public expresses discomfort and a sense of imposition when subjected to unsolicited religious proselytization, especially given the diverse religious and non-religious backgrounds of passengers. Safety concerns also feature prominently, with arguments that preaching can distract drivers, thereby compromising road safety.\n\nThe impending decision encapsulates a complex societal debate, pitting the constitutional guarantees of religious freedom and freedom of expression against the collective rights of citizens to a comfortable, safe, and neutral public space. Proponents of the ban argue that while religious expression is vital, it should not infringe upon the rights of others or compromise public order and safety. They advocate for public transport to be a secular environment, accommodating all citizens irrespective of their beliefs. Conversely, those who defend the practice often invoke religious liberty, asserting that restricting preaching amounts to an infringement on their right to evangelize and share their faith in public forums. They contend that such bans could set a dangerous precedent for limiting religious activities in other public domains.\n\nThe outcome of this deliberation will have significant implications for religious practice in Ghana. It will necessitate a careful balancing act by policymakers, who must navigate the sensitivities of a highly religious society while upholding principles of public welfare and individual rights. The potential cessation of bus preaching would not merely alter the daily commute but could also reshape the boundaries of religious expression in Ghana's public sphere, prompting broader discussions about the intersection of faith, public space, and individual autonomy in a modernizing nation.", "vocab": [{"word": "ubiquitous", "definition": "Present, appearing, or found everywhere."}, {"word": "ethos", "definition": "The characteristic spirit of a culture, era, or community as manifested in its beliefs and aspirations."}, {"word": "contentious", "definition": "Causing or likely to cause an argument; controversial."}, {"word": "impetus", "definition": "The force or energy with which a body moves; the force that makes something happen or happen more quickly."}, {"word": "confluence", "definition": "The junction of two rivers; a coming together of people or things."}, {"word": "proselytization", "definition": "The act of attempting to convert someone from one religion, belief, or opinion to another."}, {"word": "secular", "definition": "Not connected with religious or spiritual matters."}, {"word": "autonomy", "definition": "The right or condition of self-government; independence."}]}}, "questions": [{"q": "What is a common religious practice on public buses in Ghana that might stop?", "a": "Pastors preaching on public buses."}, {"q": "What are two main reasons mentioned for considering a ban on this practice?", "a": "Passenger complaints about noise and discomfort, and concerns about driver distraction and safety."}], "id": "a352d8b8931", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cwnvln99v2ygo?at_medium=RSS&at_campaign=rss", "published": "2026-10-04T08:37:46+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Illini hand over Cannon Trophy in disappointing loss to Purdue - Yahoo Sports", "excerpt": "Illini hand over Cannon Trophy in disappointing loss to Purdue Yahoo Sports", "levels": {"Beginner": {"text": "Illini hand over Cannon Trophy in disappointing loss to Purdue Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Illini hand over Cannon Trophy in disappointing loss to Purdue Yahoo Sports", "vocab": []}, "Advanced": {"text": "Illini hand over Cannon Trophy in disappointing loss to Purdue Yahoo Sports", "vocab": []}}, "questions": [], "id": "a8adba70cb0", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNR3lEVHZObjY0S2JrVjNPVFMxcXYyYnBGZkgybVN3YTlzbXhtajZ4OEZuV3NMZ1padExGdkxQSXFyRzhQOThfbTdETlJHeG1CQUZvbUdCSjh5TnRtcFdsM2ZZd0taeTZuX29YaEk1aU5XT2JBSGM1ZHBYbVVSYlAyS01URl9Pdw?oc=5", "published": "2026-10-04T09:06:29+09:00", "category": "sports", "category_titl const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
