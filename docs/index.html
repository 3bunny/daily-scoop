ion when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilgFBVV95cUxNRkZENmRQbWRXb0FtUHB5c3VhTXFNdHdIek15WHNhUU5MdU5lQVdGenEtSmk0dEMxekdjWXRtejdfUGlDQW9PM2tvUTRtbm1VLXpVNWlBeHRhVHVCUHNVd3ZtNE02VEpfMVZMWkdLVFNyenRKdnh4eU5xWVlubVZwTWVxM00zbEVJS2tBZUdyNXk4M01iemc?oc=5", "published": "2026-08-07T09:21:00+09:00", "category": "entertainment"}, {"headline": "What's new to streaming this week? (Aug. 7, 2026) - Mashable", "excerpt": "What's new to streaming this week? (Aug. 7, 2026) Mashable", "levels": {"Beginner": {"text": "What's new to streaming this week? (Aug. 7, 2026) Mashable", "vocab": []}, "Intermediate": {"text": "What's new to streaming this week? (Aug. 7, 2026) Mashable", "vocab": []}, "Advanced": {"text": "What's new to streaming this week? (Aug. 7, 2026) Mashable", "vocab": []}}, "questions": [], "id": "a54e236eeac", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMic0FVX3lxTE94NlFGRmY2VHlaRTQzV2k3akowVGZXVm9PWHd0aHdZZzJUcnd6Y3F1bFdFaVVSYkZLdzdhR3dyS2c0dkFjRWxCNDZWdllSS3NpMXVwMVBPR2Uzdk1aNEtONzljMWY5NHpyOG9SNGMxa21yY1k?oc=5", "published": "2026-08-07T09:07:02+09:00", "category": "entertainment"}]}], "home": [{"headline": "Rodney Scott's Former Partner Files for Bankruptcy", "excerpt": "A former business partner of famous pitmaster Rodney Scott has filed for Chapter 7 bankruptcy, signaling financial difficulties.", "levels": {"Beginner": {"text": "Rodney Scott is a very famous chef. He is known for making delicious barbecue. Many people love his food. News came out that someone who used to be his business partner has filed for Chapter 7 bankruptcy.\n\nWhat does this mean? When a person or a company files for Chapter 7 bankruptcy, it means they have many debts and cannot pay them. A court will then help. The court will look at what the person or company owns, like property or equipment. These things are called assets. The court might sell these assets. The money from selling these things is used to pay back some of the debts. After this, some remaining debts might be cleared away. This process helps people or businesses get a fresh start when they are in big financial trouble.\n\nIt is important to remember that this is Rodney Scott's *former* partner. This means they are not working together anymore. The news does not say why they stopped being partners or what led to the bankruptcy. But it shows that even businesses connected to famous people can face hard times.", "vocab": [{"word": "famous", "definition": "well-known by many people."}, {"word": "partner", "definition": "a person who works with another person in a business."}, {"word": "bankruptcy", "definition": "a legal process for people or businesses who cannot pay their debts."}, {"word": "debts", "definition": "money that is owed to someone else."}, {"word": "court", "definition": "a place where legal cases are decided by a judge."}, {"word": "assets", "definition": "things of value that a person or company owns."}]}, "Intermediate": {"text": "Rodney Scott, the acclaimed pitmaster and James Beard Award winner, is a prominent figure in the American barbecue scene. His unique whole-hog cooking style has earned him widespread recognition and a dedicated following. Recent reports indicate that a former business partner of Scott's has filed for Chapter 7 bankruptcy, signaling significant financial challenges.\n\nChapter 7 bankruptcy is a legal process often referred to as \"liquidation bankruptcy.\" When an individual or business files for Chapter 7, they are typically unable to repay their debts. In this process, a court-appointed trustee takes control of the debtor's non-exempt assets. These assets are then sold, and the proceeds are distributed among the creditors to partially satisfy the outstanding debts. Once the process is complete, many remaining debts are discharged, providing the debtor with a \"fresh start.\" This type of bankruptcy is usually pursued when a business is no longer viable or an individual's financial situation is beyond recovery through repayment plans.\n\nIt's crucial to note that the filing involves a *former* business partner, meaning the individual is no longer actively involved in a partnership with Rodney Scott. The specific details regarding the nature of their past partnership, the reasons for its dissolution, or the direct causes leading to the bankruptcy filing have not been publicly disclosed. However, the news highlights the often challenging economic landscape for businesses, particularly within the competitive hospitality industry. Even ventures associated with well-known personalities can face considerable financial pressures, demonstrating the inherent risks involved in business operations.", "vocab": [{"word": "acclaimed", "definition": "praised or celebrated by many people."}, {"word": "pitmaster", "definition": "a skilled chef who specializes in cooking barbecue, especially in a pit."}, {"word": "liquidation", "definition": "the process of selling all the assets of a business or person to pay debts."}, {"word": "assets", "definition": "valuable items or property owned by a person or company."}, {"word": "creditors", "definition": "people or companies to whom money is owed."}, {"word": "discharged", "definition": "legally released from a debt or obligation."}, {"word": "hospitality industry", "definition": "businesses that provide services like food, drink, and lodging to customers."}]}, "Advanced": {"text": "Rodney Scott, a culinary icon celebrated for his mastery of whole-hog barbecue and recipient of the prestigious James Beard Award, has cultivated a significant presence in the American gastronomic landscape. His distinctive approach to traditional Southern cooking has garnered him national acclaim and a loyal clientele. Recent disclosures reveal that an individual identified as a former business partner of Scott's has initiated Chapter 7 bankruptcy proceedings, underscoring profound financial distress.\n\nChapter 7 bankruptcy, often termed \"liquidation bankruptcy,\" represents a legal recourse for individuals or entities facing insurmountable debt. This process entails the appointment of a bankruptcy trustee, who assumes control over the debtor's non-exempt assets. The trustee's mandate is to systematically liquidate these assets, with the resultant proceeds then distributed equitably among the creditors to partially satisfy outstanding financial obligations. A pivotal outcome of Chapter 7 is the discharge of most unsecured debts, affording the debtor a \"fresh start\" unburdened by past liabilities. This pathway is typically pursued when a business is deemed no longer viable or an individual's financial insolvency is beyond resolution through reorganization or repayment plans.\n\nThe filing specifically pertains to a *former* business associate, indicating a prior professional relationship that has since been dissolved. The precise contours of their partnership, the circumstances precipitating its termination, and the direct catalysts for the bankruptcy filing remain undisclosed in public reports. Nevertheless, this development serves as a stark reminder of the inherent volatility and formidable challenges pervasive within the modern business environment, particularly within the highly competitive and capital-intensive hospitality sector. Operational complexities, fluctuating market demands, escalating costs, and unforeseen economic headwinds can collectively exert immense pressure, even on ventures ostensibly linked to renowned personalities.\n\nWhile Rodney Scott's current enterprises continue to thrive, the bankruptcy of a former associate underscores the broader economic currents impacting entrepreneurs and small businesses. It highlights the intricate web of financial interdependencies and the potential for past collaborations to have lingering, albeit indirect, implications. The legal proceedings will now unfold under the purview of the bankruptcy court, determining the disposition of assets and the ultimate resolution of the outstanding financial claims.", "vocab": [{"word": "culinary", "definition": "relating to cooking or the kitchen."}, {"word": "gastronomic", "definition": "relating to the art and science of good eating; the practice of cooking and eating good food."}, {"word": "disclosures", "definition": "the act of making secret or new information known."}, {"word": "insolvency", "definition": "the state of being unable to pay debts."}, {"word": "trustee", "definition": "an individual or firm that holds and administers assets for the benefit of another party. In bankruptcy, they manage the debtor's estate."}, {"word": "liquidate", "definition": "to convert assets into cash, especially for the purpose of paying debts."}, {"word": "volatility", "definition": "the tendency to change rapidly and unpredictably, especially for the worse."}, {"word": "economic headwinds", "definition": "factors or conditions that make economic growth more difficult or slow it down."}]}}, "questions": [{"q": "Who is Rodney Scott known for being?", "a": "Rodney Scott is a famous pitmaster, known for his barbecue."}, {"q": "What does it mean when someone files for Chapter 7 bankruptcy?", "a": "It means they cannot pay their debts, and a court will help sell their assets to pay some of the money owed, often leading to a \"fresh start\" by discharging remaining debts."}], "id": "ac46be35090", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi3AJBVV95cUxNbF9FSTBrMGJCUllUc3JEQ2pvVXloc3JxZk1TR1J2TmVSUE1zeXRHeDhOLVFMaU03a1pSeHp2RE8tX1k2MWlCNElid2NIdzl2SXBpcVNWaUFIT0Y2eWlRZWh2MlRQdHY0SUh2S291ckF0WnRSWHNPNFIwcUVsckVkNjB4SmkwdU1kZzdmV3BBU0RJWkpJX1lNOXRYd3l0UWtKOTRRVDZIX3NEaUZHTENRWXhBN1U1Mk8tT2w2eU9SbU1wSFE3Vm1uUzZLTGRTNUhtTHFLR0dDdG5ZZWxfNnNhanNtWEJWRmhtYnAxajlGQXJndkl6N09ReWppR2YzbmNIejVFbmFpNDVBc0MwOEVfOVBKby1paVdGQWkyc08weHZwSUVwUThPTHBoOFZfa1U1dXNoY0k4bzVPTEV6Rl9ybzBhYkl2UlJCZU01QU94UjNpOTZiaGN3T0JjWkQ?oc=5", "published": "2026-08-07T10:12:37+09:00", "category": "business", "category_title": "Business"}, {"headline": "US Imposes Tariff on Key Chip Material to Counter China", "excerpt": "The U.S. has imposed a 15% tariff on polysilicon, a vital material for computer chips, to counter China's global supply dominance.", "levels": {"Beginner": {"text": "The United States has put a new tax on a special material called polysilicon. This tax is 15% and is called a tariff. Polysilicon is very important because it is used to make computer chips. These chips are in many things we use every day, like phones and computers.\n\nThe U.S. government made this decision to help American companies. It also wants to reduce how much it depends on China for this material. China makes most of the world's polysilicon. This means China has a very strong control over its supply.\n\nBy adding this tariff, the U.S. hopes to make it harder for Chinese polysilicon to be sold cheaply in America. This could encourage more polysilicon to be made in the U.S. or from other countries. The goal is to make sure the U.S. has a steady and safe supply of this important material for its technology.", "vocab": [{"word": "tariff", "definition": "A special tax put on goods coming into a country."}, {"word": "material", "definition": "The stuff that something is made from."}, {"word": "chips", "definition": "Small electronic parts used in computers and phones."}, {"word": "depends", "definition": "To need someone or something for support or help."}, {"word": "supply", "definition": "The amount of something that is available."}]}, "Intermediate": {"text": "The United States has recently imposed a 15% tariff on polysilicon, a crucial material essential for the production of semiconductors. This move by the U.S. government is specifically aimed at countering China's significant control over the global supply of this key component.\n\nPolysilicon is a highly purified form of silicon that serves as the foundational raw material for manufacturing silicon wafers, which are then used to create computer chips (semiconductors) and solar panels. China currently holds a near-monopoly in global polysilicon production, meaning it produces the vast majority of the world's supply.\n\nThe imposition of this tariff is part of a broader strategy by the U.S. to reduce its reliance on Chinese supply chains, particularly for strategically important technologies. By making Chinese polysilicon more expensive through the tariff, the U.S. hopes to encourage domestic production or diversify its sources from other allied nations. This aims to protect American industries and ensure a more secure supply of materials vital for its technology sector and renewable energy initiatives.\n\nThis action also reflects ongoing trade tensions between the U.S. and China, as both countries compete for technological leadership and control over critical global supply chains. While the tariff could potentially lead to higher costs for some products in the short term, the long-term goal for the U.S. is to strengthen its own industrial base and lessen its vulnerability to disruptions in foreign supply.", "vocab": [{"word": "imposed", "definition": "To force a new rule, tax, or law to be obeyed."}, {"word": "crucial", "definition": "Extremely important or necessary."}, {"word": "semiconductors", "definition": "Materials or devices, like computer chips, that conduct electricity better than insulators but not as well as metals."}, {"word": "monopoly", "definition": "When one company or country has complete control over a product or service."}, {"word": "reliance", "definition": "The state of needing someone or something for support."}, {"word": "diversify", "definition": "To make something more varied or different."}]}, "Advanced": {"text": "In a significant move to address perceived vulnerabilities in its technology supply chain, the United States has unilaterally imposed a 15% tariff on polysilicon, a highly refined form of silicon critical for the production of semiconductors and solar photovoltaic cells. This strategic decision, announced by the Trump administration, is explicitly designed to counter China's overwhelming dominance in the global polysilicon market.\n\nPolysilicon serves as the fundamental raw material for manufacturing silicon wafers, which are subsequently processed into the integrated circuits that power virtually all modern electronic devices, from smartphones to advanced military hardware. It is also indispensable for the burgeoning renewable energy sector, forming the core component of most solar panels. China has, over the past two decades, strategically invested heavily in this sector, achieving a near-monopoly on global polysilicon production capacity and output.\n\nThe tariff's imposition is rooted in a broader geopolitical and economic strategy to decouple critical U.S. industries from an over-reliance on Chinese supply chains. By increasing the cost of imported Chinese polysilicon, the U.S. aims to incentivize domestic production, foster the development of alternative supply sources from allied nations, and thereby mitigate the risks associated with a single dominant supplier. This initiative is part of ongoing efforts to bolster national security and economic resilience in key technological areas.\n\nCritics of such tariffs often point to potential short-term economic repercussions, such as increased manufacturing costs for U.S. companies that rely on polysilicon, which could translate into higher prices for consumers or reduced competitiveness for American-made goods. However, proponents argue that the long-term strategic benefits of securing vital supply chains and fostering domestic industrial capabilities outweigh these immediate challenges. This action underscores the escalating trade tensions and technological rivalry between the world's two largest economies, as both nations vie for supremacy in critical high-tech sectors and control over global supply chain nodes. The move is expected to further complicate the intricate web of international trade relations, potentially inviting retaliatory measures from Beijing.", "vocab": [{"word": "unilaterally", "definition": "Done by one person or group without the agreement or participation of others."}, {"word": "polysilicon", "definition": "A highly purified form of silicon, used as the raw material for semiconductors and solar cells."}, {"word": "strategic", "definition": "Relating to a plan of action designed to achieve a major or overall aim."}, {"word": "dominance", "definition": "Power and influence over others; a position of control."}, {"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "decouple", "definition": "To separate or disconnect something from something else."}, {"word": "mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "retaliatory", "definition": "Characterized by an act of returning an injury or wrong; taking revenge."}]}}, "questions": [{"q": "What percentage is the new tariff on polysilicon?", "a": "The new tariff on polysilicon is 15%."}, {"q": "What is polysilicon primarily used for?", "a": "Polysilicon is primarily used to make computer chips (semiconductors) and solar panels."}], "id": "ade6a41a386", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cdrvn686dljo?at_medium=RSS&at_campaign=rss", "published": "2026-08-07T10:03:35+09:00", "category": "business", "category_title": "Business"}, {"headline": "Trump Imposes 15% Tariff on Key Chip Material", "excerpt": "Former President Trump has imposed a 15% tariff on polysilicon, a key chip material, to counter China's global production dominance.", "levels": {"Beginner": {"text": "Former President Trump has put a new tax on an important material. This material is called polysilicon. The new tax is 15%. Polysilicon is very important because it is used to make computer chips. These chips are tiny parts that make computers, phones, and cars work.\n\nA \"tariff\" is a special tax on goods that come from other countries. When the U.S. buys polysilicon from China, this new tax will make it more expensive.\n\nThe main reason for this new tax is to challenge China. China makes almost all of the world's polysilicon. This means China has a \"monopoly\" on it. A monopoly is when one country or company controls most of something. The U.S. worries that relying too much on one country for such a key material is not good.\n\nThe U.S. wants to make sure it has enough of its own important materials. This move is part of a bigger effort to compete with China in technology. It aims to help the U.S. make more of its own computer chips and other important products, making the country stronger and less dependent on others.", "vocab": [{"word": "Tariff", "definition": "A special tax on goods that come from other countries."}, {"word": "Material", "definition": "A substance that things are made from."}, {"word": "Chips", "definition": "Small electronic parts used in computers, phones, and other devices."}, {"word": "Monopoly", "definition": "When one country or company controls almost all of the production or sale of a product."}, {"word": "Relying", "definition": "Needing or depending on someone or something."}, {"word": "Dependent", "definition": "Needing someone or something else for support or help."}]}, "Intermediate": {"text": "Former President Trump has imposed a 15% tariff on polysilicon, a crucial material for modern technology. This move is designed to counter China's significant dominance in the global production of this key substance. Polysilicon is essential for manufacturing semiconductors, commonly known as computer chips, which power everything from smartphones and cars to advanced military equipment. It is also a vital component in solar panels, used for renewable energy.\n\nA tariff is a tax placed on goods imported from other countries. By adding a 15% tax to polysilicon coming from China, the U.S. aims to make Chinese polysilicon more expensive. This could encourage American companies to buy polysilicon from other sources or to increase domestic production, reducing reliance on China.\n\nChina currently holds a near-monopoly in global polysilicon production, accounting for a very large share of the world's supply. This level of control raises concerns about supply chain vulnerability and economic leverage. If one country controls most of a critical material, it could potentially disrupt supplies or dictate prices, impacting industries worldwide.\n\nThis tariff is part of a broader strategy by the U.S. to secure its supply chains for critical technologies and reduce its economic dependence on China. The U.S. government views semiconductors as a strategic asset, crucial for national security and economic competitiveness. Efforts to boost domestic manufacturing of chips and their components have been ongoing, with the goal of ensuring a stable and secure supply. The new tariff reflects continued trade tensions between the two economic superpowers, aiming to rebalance global manufacturing capabilities and protect American interests.", "vocab": [{"word": "Imposed", "definition": "To force a rule, tax, or punishment on someone or something."}, {"word": "Crucial", "definition": "Extremely important or necessary."}, {"word": "Semiconductors", "definition": "Electronic components that are essential for computer chips and other electronic devices."}, {"word": "Dominance", "definition": "Power and control over others."}, {"word": "Vulnerability", "definition": "The state of being exposed to the possibility of being attacked or harmed, either physically or emotionally."}, {"word": "Leverage", "definition": "The power to influence a person or situation to achieve a particular outcome."}, {"word": "Domestic", "definition": "Relating to or existing within one's own country; not foreign."}]}, "Advanced": {"text": "In a significant move aimed at bolstering national security and economic resilience, former President Trump has levied a 15% tariff on polysilicon, a foundational material for the global technology sector. This protectionist measure targets China's near-monopolistic control over the production of this critical substance, which is indispensable for manufacturing high-tech semiconductors and photovoltaic cells. Semiconductors, or computer chips, are the bedrock of modern digital infrastructure, powering everything from consumer electronics and artificial intelligence to advanced defense systems. Similarly, polysilicon is a key component in solar panels, central to the transition towards renewable energy.\n\nThe tariff, a tax on imported goods, is designed to increase the cost of Chinese-produced polysilicon, thereby making alternative sources more competitive or incentivizing domestic production within the United States. China has strategically developed its polysilicon industry over decades, now accounting for a substantial majority of the world's supply. This concentration of production capacity in a single nation, particularly a geopolitical rival, has raised profound concerns among U.S. policymakers regarding supply chain vulnerabilities and potential economic coercion.\n\nThe rationale behind this tariff extends beyond mere economic competition; it is deeply intertwined with national security imperatives. A sole reliance on any one country for such a pivotal material creates a single point of failure that could be exploited during times of geopolitical tension, potentially disrupting critical industries and military capabilities. This policy aligns with broader U.S. efforts to de-risk supply chains, reduce strategic dependencies, and foster greater self-sufficiency in key technological domains. It echoes previous actions taken during the Trump administration, which saw the imposition of wide-ranging tariffs on Chinese goods as part of an escalating trade war.\n\nWhile the tariff aims to rebalance global manufacturing and enhance supply chain resilience, its implementation carries potential ramifications. In the short term, U.S. manufacturers of semiconductors and solar panels might face increased input costs, which could be passed on to consumers or impact profit margins. Globally, such measures can lead to price volatility, shifts in international trade flows, and the risk of retaliatory tariffs from affected nations. However, proponents argue that these short-term costs are a necessary investment for long-term strategic security and the diversification of critical material sources. The ultimate objective is to cultivate a more robust and geographically dispersed supply chain, mitigating future disruptions and safeguarding technological leadership in an increasingly complex global landscape.", "vocab": [{"word": "Levied", "definition": "Formally imposed (a tax, fee, or fine)."}, {"word": "Foundational", "definition": "Forming a base or groundwork; fundamental."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "Monopolistic", "definition": "Relating to a situation where one entity has exclusive control over a commodity or service."}, {"word": "Indispensable", "definition": "Absolutely necessary or essential."}, {"word": "Geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "Protectionist", "definition": "The theory or practice of shielding a country's domestic industries from foreign competition by taxing imports."}, {"word": "Diversification", "definition": "The process of developing a wider range of products, interests, or investments to reduce risk."}]}}, "questions": [{"q": "What material is the new tariff being placed on?", "a": "The new tariff is being placed on polysilicon."}, {"q": "Why is the U.S. concerned about China's role in producing this material?", "a": "The U.S. is concerned because China holds a near-monopoly in global polysilicon production, which raises issues about supply chain vulnerability, economic leverage, and national security."}], "id": "ade6a41a386", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cdrvn686dljo?at_medium=RSS&at_campaign=rss", "published": "2026-08-07T10:03:35+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Meta Fined $567 Million for Child Safety Issues in Landmark Ruling", "excerpt": "Meta, the parent company of Instagram and Facebook, faces a $567 million fine from a New Mexico judge over child safety concerns.", "levels": {"Beginner": {"text": "Social media company Meta has been ordered to pay a large fine. A judge in New Mexico said Meta must pay $567 million. Meta owns popular apps like Instagram, Facebook, and WhatsApp. The judge made this decision because Meta's apps have harmed children.\n\nThis is a very big fine, one of the largest ever for child safety against a social media company. It shows that courts are serious about protecting young people online. Many people worry about how social media affects kids, especially their mental health. Things like cyberbullying or seeing bad content can be very damaging.\n\nMeta and other social media companies are now under more pressure. They need to make their platforms safer for children. This ruling means they must work harder to protect young users from harm and create better online environments for everyone.", "vocab": [{"word": "fined", "definition": "Made to pay money as a punishment."}, {"word": "judge", "definition": "A person in court who makes decisions about laws."}, {"word": "platforms", "definition": "Websites or apps where people can share things, like social media."}, {"word": "harmed", "definition": "Caused hurt or damage to someone or something."}, {"word": "ruling", "definition": "An official decision made by a judge or court."}, {"word": "safety", "definition": "Being protected from danger or harm."}]}, "Intermediate": {"text": "Social media giant Meta, the parent company of Instagram, Facebook, and WhatsApp, has been hit with a significant financial penalty. A New Mexico judge ordered Meta to pay an additional $567 million, citing the harm its platforms have caused to children.\n\nThis ruling represents one of the largest child safety fines ever levied against a social media company. It underscores growing concerns from parents, educators, and lawmakers about the impact of social media on the well-being of young users. Issues such as cyberbullying, exposure to inappropriate content, and the addictive nature of certain platform features have been widely discussed as contributing to mental health challenges among adolescents.\n\nThe $567 million penalty is part of ongoing legal scrutiny faced by Meta regarding its responsibility to protect minors online. Courts and regulators are increasingly demanding that tech companies implement stronger safeguards and design their products with the safety of young users in mind. This particular judgment from New Mexico adds to the mounting pressure on Meta and its peers to address these critical issues more effectively.\n\nThe decision sends a clear message to the technology industry that the legal system is prepared to hold companies accountable for the negative implications their services may have on vulnerable populations, particularly children. It highlights a broader societal push for greater corporate responsibility in the digital age.", "vocab": [{"word": "penalty", "definition": "A punishment for breaking a law or rule."}, {"word": "underscores", "definition": "Emphasizes or highlights something important."}, {"word": "well-being", "definition": "The state of being healthy, happy, and comfortable."}, {"word": "addictive", "definition": "Causing a strong desire that is hard to control."}, {"word": "scrutiny", "definition": "Careful and close examination of something."}, {"word": "safeguards", "definition": "Measures taken to protect someone or something."}, {"word": "implications", "definition": "Possible results or effects of an action or decision."}]}, "Advanced": {"text": "In an unprecedented move against a major tech corporation, a New Mexico judge has ordered Meta Platforms, Inc., the parent company behind ubiquitous social media platforms Instagram, Facebook, and WhatsApp, to pay an additional $567 million. This substantial financial penalty stems from findings that Meta's platforms have inflicted significant harm upon children.\n\nThis ruling marks one of the most substantial child safety judgments ever imposed on a social media giant, signaling an escalating legal and regulatory environment for companies operating in the digital sphere. The litigation underscores a growing societal consensus regarding the detrimental effects of social media on the psychological well-being of minors. Concerns frequently raised include the platforms' role in exacerbating body image issues, fostering cyberbullying, exposing young users to inappropriate content, and employing algorithmic designs that can contribute to addictive behaviors and prolonged screen time.\n\nWhile the specific details of the New Mexico case remain under wraps beyond the summary, the 'additional' nature of the $567 million payment suggests it is part of a broader, ongoing legal challenge or settlement related to Meta's practices concerning youth. This aligns with a national trend of increased scrutiny from state attorneys general and federal lawmakers, who are actively exploring legislative solutions, such as the Kids Online Safety Act (KOSA) in the U.S., to mandate stricter protections for children online.\n\nMeta, like other tech companies, faces the complex challenge of balancing user engagement with robust safety protocols, particularly for its youngest demographic. This judgment serves as a powerful reminder of corporate culpability when these balances are not adequately maintained. It reinforces the demand from child advocacy groups and public health experts for more transparent data practices, age-appropriate design, and proactive content moderation to mitigate the risks associated with social media use among adolescents. The ramifications of this ruling are likely to resonate across the tech industry, compelling platforms to re-evaluate their approaches to child safety and digital ethics.", "vocab": [{"word": "unprecedented", "definition": "Never done or known before; without previous instance."}, {"word": "ubiquitous", "definition": "Present, appearing, or found everywhere."}, {"word": "inflicted", "definition": "Caused (something unpleasant or painful) to be suffered by someone or something."}, {"word": "litigation", "definition": "The process of taking legal action; a lawsuit."}, {"word": "exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}, {"word": "algorithmic", "definition": "Relating to or involving algorithms, which are sets of rules or calculations followed by a computer."}, {"word": "culpability", "definition": "A state of deserving blame for something wrong or harmful."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event."}]}}, "questions": [{"q": "What company was fined and for what primary reason?", "a": "Meta, the parent company of Instagram, Facebook, and WhatsApp, was fined for harming children through its platforms."}, {"q": "Which state's judge issued this ruling, and what was the amount of the fine?", "a": "A New Mexico judge issued the ruling, ordering Meta to pay $567 million."}], "id": "a7421870348", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cd7lz3wr2rlo?at_medium=RSS&at_campaign=rss", "published": "2026-08-07T09:54:03+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US Imposes Tariff on Chip Material to Counter China", "excerpt": "The US government has placed a 15% tax on a vital material for computer chips, aiming to challenge China's control.", "levels": {"Beginner": {"text": "The United States government has put a new tax on a very important material. This material is called polysilicon, and it is used to make computer chips. Computer chips are like the brains of our phones, computers, and many other electronics. The new tax is 15%. This means that if companies in the U.S. buy this material from other countries, they will pay 15% more.\n\nThis new tax is aimed at China. China makes most of the world's polysilicon. This gives China a lot of control over this important material. The U.S. wants to stop China from having so much control. They want to make it easier for other countries, or even the U.S. itself, to make more polysilicon. This is part of a bigger effort by the U.S. to change how it trades with China, especially for key technology parts. The U.S. wants to make sure it has its own supply of important materials.", "vocab": [{"word": "tax", "definition": "extra money you pay to the government when you buy something."}, {"word": "material", "definition": "a substance that things are made from."}, {"word": "chips", "definition": "small electronic parts used in computers and phones."}, {"word": "control", "definition": "the power to manage or direct something."}, {"word": "supply", "definition": "the amount of something that is available to be used."}]}, "Intermediate": {"text": "The United States government has announced a new 15% tariff on polysilicon, a critical material used in the production of computer chips. This move is designed to counter China's significant dominance in the global polysilicon market. Polysilicon is a purified form of silicon, essential for manufacturing semiconductors, which are the fundamental components of nearly all modern electronic devices, from smartphones to advanced military equipment. Its importance extends to solar panels as well, making it a vital resource for both technology and renewable energy sectors.\n\nChina currently holds a near-monopoly on global polysilicon production, meaning it produces the vast majority of the world's supply. This concentration of production in one country raises significant concerns for the U.S. regarding supply chain security and economic competition. The U.S. government believes that relying heavily on a single foreign source for such a crucial material poses risks to its national security and technological independence.\n\nBy imposing a 15% tariff, the U.S. aims to make polysilicon imported from China more expensive for American buyers. This increased cost could encourage U.S. companies to seek alternative suppliers from other countries or to invest in and expand domestic production facilities within the United States. The ultimate goal is to diversify the supply chain and reduce America's reliance on China for this key component. This action is part of a broader strategy by the U.S. to address what it views as unfair trade practices and to protect its technological advantage. The tariff reflects ongoing trade tensions between the two economic superpowers, particularly in high-tech sectors, as both nations compete for global leadership in critical technologies.", "vocab": [{"word": "tariff", "definition": "a tax placed on goods coming into a country."}, {"word": "critical", "definition": "extremely important or necessary."}, {"word": "dominance", "definition": "having power and control over others."}, {"word": "monopoly", "definition": "when one company or country controls all or most of a particular product or service."}, {"word": "semiconductor", "definition": "a material used to make electronic components like computer chips."}, {"word": "supply chain", "definition": "the system of people and companies involved in getting a product from its raw material to the customer."}, {"word": "domestic", "definition": "relating to one's own country."}]}, "Advanced": {"text": "The United States government, under the Trump administration, has imposed a 15% tariff on polysilicon, a strategically critical material indispensable for the fabrication of semiconductors and solar panels. This decisive action is explicitly aimed at countering China's near-monopolistic control over global polysilicon production, a situation that Washington views as a significant vulnerability for its economic security and technological independence. The tariff underscores the escalating geopolitical competition between the two global powers, particularly in high-technology sectors.\n\nPolysilicon, a highly purified form of silicon, serves as the foundational raw material for virtually all integrated circuits and photovoltaic cells. Its pervasive use across advanced electronics, telecommunications infrastructure, and renewable energy systems underscores its profound strategic importance. From powering the most sophisticated microprocessors in data centers to enabling the widespread adoption of solar energy, polysilicon is a linchpin of modern technological advancement. China's aggressive investment and state-backed subsidies have enabled it to achieve overwhelming dominance in this sector, producing an estimated 80% of the world's polysilicon. This concentration creates a single point of failure in the global supply chain, raising alarms in capitals concerned about geopolitical leverage and economic coercion. The U.S. fears that such reliance could be exploited during times of international tension, potentially disrupting critical industries.\n\nThe imposition of this tariff is a direct continuation of the broader trade and technology rivalry that has characterized U.S.-China relations in recent years. By making Chinese-sourced polysilicon more expensive, the tariff is intended to incentivize American manufacturers to diversify their sourcing away from China, explore alternative international suppliers, or accelerate investment in domestic polysilicon production capabilities. This strategy aligns with a wider U.S. effort to \"decouple\" critical supply chains from potential adversaries and enhance national resilience in key industrial sectors. The goal is not just to level the playing field but to actively foster a more robust and geographically diverse supply network for essential components.\n\nCritics of such tariffs often point to potential downsides, including increased costs for U.S. businesses and consumers, which could be passed on through higher prices for electronics or solar panels. There is also the inherent risk of retaliatory measures from Beijing, potentially escalating trade disputes. However, proponents argue that the long-term benefits of securing vital supply chains and reducing reliance on a geopolitical rival outweigh these short-term economic pressures. The move reflects a growing consensus within U.S. policy circles that maintaining leadership in foundational technologies like semiconductors requires proactive measures to safeguard access to essential raw materials and manufacturing capacity. The administration emphasizes that securing access to these materials is not merely an economic issue but a matter of national security, ensuring that the U.S. retains control over the components vital for its defense, infrastructure, and future innovation. This tariff represents a calculated step in a broader strategy to reshape global technology supply chains and mitigate strategic vulnerabilities.", "vocab": [{"word": "imposed", "definition": "officially forced a rule, tax, or punishment to be obeyed or accepted."}, {"word": "strategically", "definition": "in a way that is carefully planned to achieve a particular goal, especially in military, political, or business contexts."}, {"word": "indispensable", "definition": "absolutely necessary or essential."}, {"word": "monopolistic", "definition": "relating to a situation where one company or country has complete control over a particular product or service."}, {"word": "vulnerability", "definition": "the state of being exposed to the possibility of being attacked or harmed, either physically or emotionally."}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "incentivize", "definition": "to motivate or encourage someone to do something."}, {"word": "resilience", "definition": "the ability to recover quickly from difficulties; toughness."}]}}, "questions": [{"q": "What material is the new U.S. tariff imposed on?", "a": "The new U.S. tariff is imposed on polysilicon."}, {"q": "Why did the U.S. government impose this tariff?", "a": "The U.S. government imposed this tariff to counter China's near-monopoly in global polysilicon production and reduce its own reliance on China for this critical material."}], "id": "ade6a41a386", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cdrvn686dljo?at_medium=RSS&at_campaign=rss", "published": "2026-08-07T10:03:35+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Meta Fined $567M in Major Child Safety Ruling", "excerpt": "Meta, the company behind Instagram and Facebook, has been ordered to pay a large fine for harming children online.", "levels": {"Beginner": {"text": "Meta, the company that owns popular apps like Instagram and Facebook, has been ordered to pay a very large amount of money. A judge in New Mexico said Meta must pay $567 million. This big fine is because the company's apps have harmed children.\n\nThis decision is about child safety online. It is the biggest fine ever given to a social media company for issues related to harming children. Many young people use social media apps every day. But sometimes, these apps can have bad effects on kids.\n\nThe ruling means that companies like Meta need to work harder to keep children safe when they are using the internet. People want social media to be a good and safe place for everyone, especially for young users. This fine sends a clear message to big tech companies. They must protect the children who use their platforms. It shows that judges are serious about making sure kids are safe online.", "vocab": [{"word": "fined", "definition": "ordered to pay money as punishment."}, {"word": "judge", "definition": "a person who decides cases in a court of law."}, {"word": "apps", "definition": "short for applications, programs on phones or computers."}, {"word": "harmed", "definition": "hurt or caused damage to."}, {"word": "safety", "definition": "being protected from danger or harm."}, {"word": "ruling", "definition": "an official decision made by a judge or court."}]}, "Intermediate": {"text": "Meta, the technology giant behind widely used platforms such as Instagram, Facebook, and WhatsApp, has been ordered to pay a substantial fine. A judge in New Mexico has mandated that the company pay $567 million due to the harm its services have caused to children. This decision is a major development in the ongoing debate about child safety online.\n\nThis significant financial penalty marks the largest child safety ruling ever imposed on a social media company. The decision highlights growing concerns about how social media platforms impact young users. While these platforms offer ways to connect and share, they have also faced criticism for features and content that can negatively affect children's well-being, including issues like cyberbullying, exposure to harmful material, and potential addiction.\n\nThe ruling underscores the increasing legal scrutiny faced by tech companies regarding their responsibility for user safety, particularly for minors. Critics argue that social media companies often design their platforms in ways that can be addictive or expose young people to inappropriate content, without implementing sufficient safeguards. This New Mexico case is part of a larger trend where states and governments are seeking to hold these companies accountable for their impact on youth mental health and development.\n\nThis judgment sends a powerful message to Meta and the broader tech industry. It emphasizes that companies must prioritize the protection of their youngest users and implement stronger measures to ensure a safer online environment. The case reflects a broader societal push for greater accountability from social media giants to safeguard children from potential online harms, urging them to rethink their design and moderation practices to better serve the welfare of young people.", "vocab": [{"word": "substantial", "definition": "large in amount or degree."}, {"word": "mandated", "definition": "officially ordered or required."}, {"word": "penalty", "definition": "a punishment for breaking a law or rule."}, {"word": "scrutiny", "definition": "careful and close examination."}, {"word": "safeguards", "definition": "measures taken to protect someone or something."}, {"word": "accountability", "definition": "the state of being responsible for something and having to explain your actions."}, {"word": "welfare", "definition": "the health, happiness, and fortunes of a person or group."}]}, "Advanced": {"text": "Meta Platforms, Inc., the tech behemoth overseeing ubiquitous social media platforms like Instagram, Facebook, and WhatsApp, has been hit with a monumental fine. A New Mexico judge has ordered the company to remit $567 million, citing profound harm inflicted upon children through its services. This landmark ruling represents the largest child safety penalty ever levied against a social media entity, signaling an escalating legal and societal reckoning for the tech industry. The decision reflects a hardening stance from judicial bodies regarding the accountability of digital platforms for their impact on vulnerable populations.\n\nThe judgment emerges amidst a burgeoning global discourse concerning the detrimental effects of social media on youth mental health and development. Critics contend that Meta's platforms, despite their connective utility, are often engineered with addictive algorithms and features that can expose minors to inappropriate content, cyberbullying, and foster unhealthy comparisons, all while lacking robust age verification and content moderation mechanisms. This particular ruling underscores a growing judicial willingness to attribute direct liability to tech companies for the societal repercussions of their design choices and operational oversights, moving beyond self-regulation to enforced compliance.\n\nThe New Mexico case is not an isolated incident but rather indicative of a broader trend wherein states and federal governments are intensifying their efforts to regulate social media companies. Lawmakers and advocacy groups worldwide are increasingly demanding greater transparency and more stringent protections for young users, often pointing to research that links excessive social media use to increased rates of anxiety, depression, and body image issues among adolescents. This legal action serves as a potent reminder that the era of minimal oversight for digital platforms, particularly concerning vulnerable populations, may be drawing to a close, paving the way for more interventionist regulatory approaches.\n\nFor Meta, this substantial fine adds to a growing list of legal challenges and regulatory pressures it faces globally, ranging from antitrust concerns to data privacy violations. The company has consistently maintained its commitment to child safety, often introducing new tools and features aimed at protecting younger users, such as parental controls and age-appropriate content settings. However, rulings like this suggest that such measures are perceived as insufficient by judicial bodies and the public alike, highlighting a gap between corporate initiatives and perceived societal needs. The implications extend beyond the financial penalty, potentially setting a significant precedent for future litigation and regulatory frameworks aimed at compelling social media giants to fundamentally re-evaluate their product development philosophies and prioritize the digital well-being of their youngest demographic. This case reinforces the imperative for tech firms to transcend mere compliance, embracing a proactive stance on ethical design and user protection that genuinely safeguards the next generation of digital citizens.", "vocab": [{"word": "behemoth", "definition": "something enormous, especially a powerful and influential organization."}, {"word": "ubiquitous", "definition": "present, appearing, or found everywhere."}, {"word": "remit", "definition": "to send money as payment."}, {"word": "levied", "definition": "imposed (a tax, fee, or fine)."}, {"word": "reckoning", "definition": "a time when past mistakes or misdeeds must be paid for."}, {"word": "burgeoning", "definition": "beginning to grow or increase rapidly."}, {"word": "stringent", "definition": "strict, precise, and exacting."}, {"word": "precedent", "definition": "an earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}]}}, "questions": [{"q": "What company was fined and how much money was it ordered to pay?", "a": "Meta, the parent company of Instagram, Facebook, and WhatsApp, was ordered to pay $567 million."}, {"q": "According to the news article, why was Meta fined?", "a": "Meta was fined because its social media apps were found to have caused harm to children."}], "id": "a7421870348", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cd7lz3wr2rlo?at_medium=RSS&at_campaign=rss", "published": "2026-08-07T09:54:03+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Mexico Backs FIFA's Biennial World Cup Plan", "excerpt": "Mexico has announced its support for FIFA President Gianni Infantino's controversial proposal to hold the men's World Cup every two years.", "levels": {"Beginner": {"text": "Mexico now supports a big idea from FIFA. FIFA is the world's football organization. Its president, Gianni Infantino, wants the World Cup to happen more often. Right now, the World Cup happens every four years. Mr. Infantino wants it to happen every two years.\n\nMexico's football leaders say they agree with this plan. They think it could help football grow in many countries. They believe more World Cups would give more teams a chance to play in the big tournament.\n\nThis idea is not new. FIFA has been talking about it for some time. Some people like the idea, but others do not. Some big football groups in Europe and South America do not want the World Cup every two years. They worry it would be too much for players. They also think it might make the World Cup less special if it happens so often.\n\nBut Mexico has now joined other countries that support the change. This shows that there are different opinions about how often the biggest football event should take place.", "vocab": [{"word": "supports", "definition": "agrees with and helps."}, {"word": "organization", "definition": "a group of people working together for a goal."}, {"word": "president", "definition": "the leader of a group or country."}, {"word": "often", "definition": "many times; frequently."}, {"word": "tournament", "definition": "a competition with many games to find a winner."}, {"word": "special", "definition": "better or more important than usual."}]}, "Intermediate": {"text": "Mexico has officially announced its backing for FIFA President Gianni Infantino's proposal to stage the men's World Cup every two years. This move adds another significant voice to the ongoing debate surrounding the future frequency of football's most prestigious international tournament.\n\nCurrently, the FIFA World Cup takes place every four years, a tradition that has been in place for decades, making it a highly anticipated global event. Infantino and FIFA argue that a biennial World Cup would create more opportunities for national teams worldwide, particularly those from smaller footballing nations, to participate in the global showpiece event. Proponents also suggest it could boost football development across all regions and generate increased revenues for FIFA and its member associations. These funds, they claim, could then be reinvested into grassroots football and infrastructure projects.\n\nHowever, the proposal has met with considerable opposition from major football confederations, including UEFA (Europe) and CONMEBOL (South America). These bodies, along with many top leagues and player unions, express serious concerns about player welfare, citing potential burnout from an already congested match calendar. They also fear that holding the World Cup more frequently could dilute its unique prestige and impact on the global sporting landscape, potentially overshadowing continental competitions like the European Championship or the Copa América.\n\nDespite this resistance, some regions, like the Confederation of African Football (CAF), have previously indicated support for the biennial plan. Mexico, a prominent footballing nation in CONCACAF (North, Central America, and Caribbean), now joins this group, highlighting the divided opinions within the global football community on this transformative proposal. The debate is expected to continue as FIFA seeks to gather broader consensus for its vision, which would represent a fundamental shift in international football's structure.", "vocab": [{"word": "backing", "definition": "support or approval."}, {"word": "proposal", "definition": "a plan or suggestion put forward for consideration."}, {"word": "prestigious", "definition": "respected and admired, often because of high quality or importance."}, {"word": "biennial", "definition": "happening every two years."}, {"word": "proponents", "definition": "people who support an idea or plan."}, {"word": "confederations", "definition": "groups of football associations from a particular continent or region."}, {"word": "dilute", "definition": "to make something weaker or less effective by spreading it out."}]}, "Advanced": {"text": "Mexico has formally declared its support for FIFA President Gianni Infantino's contentious proposal to transition the men's World Cup to a biennial cycle. This endorsement from a significant footballing nation within CONCACAF adds further complexity to an already polarized debate that challenges decades of established tradition in international football.\n\nThe current quadrennial schedule of the FIFA World Cup has long been a cornerstone of the global football calendar, imbuing the tournament with an unparalleled sense of anticipation and exclusivity. Infantino and FIFA leadership contend that a shift to a biennial format would democratize access to the pinnacle of international football, offering more frequent opportunities for national teams, particularly those from developing footballing nations, to compete on the world stage. Proponents also underscore the potential for substantial revenue generation, which FIFA asserts would be equitably distributed among its 211 member associations, thereby fostering global football development, improving infrastructure, and enhancing competitive balance. This financial injection, they argue, is crucial for nations that lack the resources of major European leagues.\n\nHowever, the initiative has encountered formidable opposition from powerful footballing blocs, most notably UEFA and CONMEBOL, representing Europe and South America respectively. These confederations, along with influential leagues such as the Premier League and La Liga, and global player unions like FIFPRO, have voiced profound concerns. Their primary objections revolve around player welfare, warning of increased physical and mental strain due to an already saturated fixture list. They also argue that a more frequent World Cup would inevitably diminish its unique allure and commercial value, potentially cannibalizing the appeal of continental championships like the UEFA European Championship and the Copa América, and disrupting the delicate balance of the international match calendar. Critics also point out the potential for increased travel and environmental impact.\n\nThe debate also encompasses broader geopolitical and economic dimensions within the sport. While some confederations, such as the Confederation of African Football (CAF), have previously expressed openness or support, viewing the proposal as a pathway to greater financial and developmental equity, others perceive it as a power grab by FIFA, seeking to consolidate its influence and revenue streams at the expense of established regional competitions and club football. Mexico's alignment with FIFA's vision underscores the deep divisions and competing interests at play, reflecting a global fault line between those prioritizing traditional structures and those advocating for radical reform. The outcome of this strategic push by FIFA remains uncertain, but it promises to reshape the landscape of international football for generations to come, necessitating extensive negotiations and a delicate balancing act to reconcile divergent perspectives and safeguard the sport's integrity.", "vocab": [{"word": "contentious", "definition": "causing or likely to cause an argument; controversial."}, {"word": "biennial", "definition": "happening every two years."}, {"word": "quadrennial", "definition": "happening every four years."}, {"word": "democratize", "definition": "to make something accessible to everyone, not just a select few."}, {"word": "proponents", "definition": "people who advocate or support a theory, proposal, or course of action."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "cannibalizing", "definition": "reducing the sales or market share of one product by introducing a new product by the same producer; here, reducing the appeal or value of one competition by making another more frequent."}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}]}}, "questions": [{"q": "What is Gianni Infantino's proposal for the World Cup?", "a": "He proposes holding the men's World Cup every two years instead of every four years."}, {"q": "Why do some football organizations oppose the biennial World Cup plan?", "a": "They are concerned about player welfare, potential burnout, fixture congestion, and the dilution of the World Cup's prestige and impact on other competitions."}], "id": "a30ac47498e", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilgFBVV95cUxQVTkyNFdsOWN1WGRva3czYjctNktEbWU1UDU3YUFKZHBZMEt6SFFsRkd3SV9HQUJza1dtVUU1QW1uQTZESVdsZG5XNXgwZEV2cWJBckZSZC1razZxeXVJX1FMakplSjNkVUVkOVpycEV0VUgxdHJmSEtPeXJCblUxMWhqZ0R3ZVU0YXJTSXlNVlhRLTh1ekE?oc=5", "published": "2026-08-07T10:18:33+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "SCHS is selling All-Sports Passes - wnegradio.com", "excerpt": "SCHS is selling All-Sports Passes wnegradio.com", "levels": {"Beginner": {"text": "SCHS is selling All-Sports Passes wnegradio.com", "vocab": []}, "Intermediate": {"text": "SCHS is selling All-Sports Passes wnegradio.com", "vocab": []}, "Advanced": {"text": "SCHS is selling All-Sports Passes wnegradio.com", "vocab": []}}, "questions": [], "id": "a9f66c55716", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiZ0FVX3lxTE55MjdNLWxVYjRYb19uMFF5Z3Z4ODNlZm0ycktiX2QxSWtLVm4xQkdRU2tORnpaTjk3MmFVSVd2a3RFN2Q3cGozYy1vSm5QVjREajlJaXUxbzVhUHBnbHlZS3E5eU9LNFU?oc=5", "published": "2026-08-07T10:12:04+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "US Stock Market Today – Thursday, August 6, 2026 - stl.news", "excerpt": "US Stock Market Today – Thursday, August 6, 2026 stl.news", "levels": {"Beginne function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
