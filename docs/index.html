Sports", "vocab": []}}, "questions": [], "id": "a0680a02a70", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNdFE5czFqTUFMbV9sUFB4Qy04QzJ4QkVrV1NtalMxMUZIdHlvS0NJYzJaYkZaVUNxMDMtUE9UNHY5c2k1Uy1vRjdUZlBscFpiMS1BU2JzOUh6QV8yZWR5NG1oUWVXcWVxSjZEeDRmQWJsSlRXbDZwUGZleFVWVjZGWTdhWDJJUQ?oc=5", "published": "2026-11-23T10:30:00+09:00", "category": "sports"}]}, {"key": "finance", "title": "Finance", "articles": [{"headline": "Is a +52% November run the start or the end for this AI-picked ad-tech name? - Investing.com", "excerpt": "Is a +52% November run the start or the end for this AI-picked ad-tech name? Investing.com", "levels": {"Beginner": {"text": "Is a +52% November run the start or the end for this AI-picked ad-tech name? Investing.com", "vocab": []}, "Intermediate": {"text": "Is a +52% November run the start or the end for this AI-picked ad-tech name? Investing.com", "vocab": []}, "Advanced": {"text": "Is a +52% November run the start or the end for this AI-picked ad-tech name? Investing.com", "vocab": []}}, "questions": [], "id": "a6b3d58168d", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixwFBVV95cUxQSHFmRUM4YmdPa2hXTzN6czJxaFpuM1VlTW03UWNJb044TzdxWkw2SGdMYU1YQnRDRGJFM1pNUVFvSmx6VmI1d1JzaldrWk9ySnZqWjNreXRVY3g5RU5ZRm93ck1SWjYyNjFEY1ZlY3NNOUJhVzd2d0hPZjVwVUhLb0hrbjBqeFdqUDlLZFZsTGdNYmtOemppMGNVMjJwZFFKZFFJYWVlNGthQVB4OG5MR2dnQWRRVDJnRGoxbml1LW9icXZCM0pF?oc=5", "published": "2026-11-23T11:01:53+09:00", "category": "finance"}, {"headline": "Stock Market Sees Sharpest Drop in 19 Months", "excerpt": "The stock market recently experienced its worst week in 19 months, a significant sell-off that often signals further declines for investors.", "levels": {"Beginner": {"text": "The stock market had a very bad week recently. It was the worst week for the market in 19 months, which is about a year and a half. When the market falls a lot like this, it is called a \"sell-off.\" This means many people are selling their company shares.\n\nExperts say that when there is a big sell-off, the market often continues to fall more. This can make people worried about their money. The stock market is where parts of companies, called shares, are bought and sold. When you buy shares, you invest in a company. If the company does well, your shares might be worth more. But if many people sell, the value of shares goes down. This bad week means that many investments have lost value, affecting people's savings and future plans. It's a time when investors need to be careful.", "vocab": [{"word": "market", "definition": "A place where things are bought and sold, like company shares."}, {"word": "fell", "definition": "Went down in value or amount."}, {"word": "worst", "definition": "The lowest or most unpleasant."}, {"word": "months", "definition": "Periods of about 30 days."}, {"word": "sell-off", "definition": "A time when many people sell their shares, making prices fall."}, {"word": "investments", "definition": "Money put into something to make a profit."}]}, "Intermediate": {"text": "The stock market recently experienced its most significant decline in nearly two years, marking its worst weekly performance in 19 months. This sharp downturn is known as a \"sell-off,\" a period characterized by widespread selling of company shares by investors, leading to a rapid fall in stock prices across various sectors.\n\nHistorically, when the market undergoes such a substantial sell-off, it often signals that further declines might follow. This trend can create significant anxiety among investors, as their portfolios and retirement savings can lose considerable value. A sell-off usually happens when investors become worried about the economy, rising inflation, increasing interest rates, or other global events, causing them to sell their holdings rapidly to avoid bigger losses. This collective action drives prices down further.\n\nThe stock market is a crucial part of the global economy, allowing companies to raise money by selling shares and offering individuals a way to invest and potentially grow their wealth over time. When the market is volatile, like it has been, it reflects a period of heightened uncertainty. This recent performance indicates a notable shift in investor sentiment, suggesting growing concerns about future economic conditions and corporate earnings. While market corrections are a normal part of investing cycles, the severity and speed of this particular drop have drawn considerable attention from financial analysts and individual investors alike, prompting many to wonder about the market's direction in the coming weeks and months and how it might impact their financial well-being.", "vocab": [{"word": "significant", "definition": "Important or noticeable."}, {"word": "decline", "definition": "A continuous decrease in value or quality."}, {"word": "widespread", "definition": "Happening or existing in many places or among many people."}, {"word": "historically", "definition": "In the past; according to history."}, {"word": "anxiety", "definition": "A feeling of worry, nervousness, or unease."}, {"word": "volatile", "definition": "Changing rapidly and unpredictably, especially for the worse."}, {"word": "sentiment", "definition": "A general feeling or opinion."}]}, "Advanced": {"text": "The equities market has just concluded its most challenging week in nearly two years, registering its steepest decline in 19 months. This pronounced downturn, widely characterized as a significant \"sell-off,\" saw investors divest from a broad spectrum of assets, triggering a rapid depreciation in stock valuations across major indices. The velocity and breadth of this decline have prompted considerable concern among financial analysts and market participants.\n\nSuch substantial market corrections are rarely isolated events; historical analysis frequently indicates that an initial sharp decline often precedes further market weakness. This phenomenon is typically fueled by a confluence of macroeconomic factors, including escalating inflation concerns, the prospect of aggressive interest rate hikes by central banks to curb price increases, geopolitical instability, supply chain disruptions, and fears of an impending economic recession. The collective apprehension among investors can lead to a \"herd mentality,\" where widespread panic selling exacerbates the downward pressure on prices, creating a self-reinforcing cycle of capitulation.\n\nThe implications of such a severe sell-off are far-reaching. For individual investors, particularly those nearing retirement or relying on their portfolios for income, it can translate into substantial erosion of wealth and impact long-term financial security. For corporations, declining stock prices can make it more challenging to raise capital, signal reduced consumer confidence, and potentially dampen future investment and hiring plans. Market analysts are now scrutinizing economic indicators, corporate earnings reports, and central bank communications with heightened vigilance, attempting to recalibrate expectations for the coming quarters and discern whether this correction is a temporary blip or the precursor to a more prolonged bear market.\n\nHistorically, periods following severe market drops have shown varied trajectories. While some corrections are relatively short-lived, others can evolve into protracted bear markets, characterized by sustained declines of 20% or more. The current environment demands a careful assessment of risk, with many financial advisors urging investors to maintain a long-term perspective, review their asset allocation, and consider diversification strategies to mitigate potential further losses. The historical context of past severe downturns, such as those that saw significant portions of portfolios like $500,000 diminish over several weeks, serves as a stark reminder of market volatility. Navigating these turbulent times requires not only a robust understanding of market dynamics but also a disciplined approach to investing, emphasizing prudence and resilience against short-term fluctuations.", "vocab": [{"word": "equities market", "definition": "Another term for the stock market, referring to shares of ownership in companies."}, {"word": "pronounced", "definition": "Very noticeable or strong."}, {"word": "divest", "definition": "To sell off assets, especially shares, often to reduce risk or for ethical reasons."}, {"word": "confluence", "definition": "A coming together of several things, often negative factors."}, {"word": "exacerbates", "definition": "Makes a problem, bad situation, or negative feeling worse."}, {"word": "capitulation", "definition": "The act of giving up; in finance, it refers to investors selling off holdings in a panic, accepting losses."}, {"word": "erosion", "definition": "The gradual wearing away or destruction of something, like value or wealth."}, {"word": "prudence", "definition": "The quality of being careful and sensible; cautiousness."}]}}, "questions": [{"q": "What is a \"sell-off\" in the stock market?", "a": "A sell-off is when many investors sell their company shares quickly, causing stock prices to fall rapidly."}, {"q": "According to the article, what often happens after a big sell-off?", "a": "Historically, a big sell-off often means that the market might continue to fall further in the future."}], "id": "a042b780d1f", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAJBVV95cUxOaHBVWTBtd0FvcWt5blc4TUNVdlZYUlUzd0hIQVhWa215WFBfbi1yd0QtMUN5ZmdvT3YzX24yQzVfMGQ4dlFhTy0zdlNtVXFNZFc1T244b0psWXZCai1VYXJIeENNWDZlUmloWDVrT3Z4MEZjV01ZcFRaUTJjdkxha1lBMldNbXY5TTZucFNZUEZ4UUc1TXNzYmdTTWhHODU2dVdUQXAtYjdDRlZUUGxtQkpZWjl2a0xmelFhcWRKQjBCQ3ltUXpTcW1LNnJoZHgyczNBeWhFT2lFYXRWdXcwbTlzaDdzSXZnVThzVmdZaTVTN0M3XzZLWnBuZ2VmRnBCeTNrSlRCbFBadGxacGtBNlpLdEgyRDdQY3dkLTE3dE5oSkJqcU9Ed3BySVM?oc=5", "published": "2026-11-23T10:47:00+09:00", "category": "finance"}, {"headline": "Clariant and CD&R Eye Ashland Acquisition", "excerpt": "Chemical companies Clariant and CD&R are reportedly in discussions to buy Ashland, a specialty chemical firm, signaling a potential major business deal.", "levels": {"Beginner": {"text": "Two big companies, Clariant and CD&R, are talking about buying another company called Ashland. This news comes from Bloomberg, a company that reports on business stories. Ashland makes special chemicals that are used in many different products. \n\nClariant is a company from Switzerland that also makes chemicals. CD&R is a company that invests money in other businesses. When one company buys another, it is called an acquisition. These talks mean that Clariant and CD&R might work together to take over Ashland. \n\nBuying another company can help businesses grow bigger or offer new products. It is a common thing in the world of business. If this deal happens, it would be a big change for Ashland and its workers. For now, they are just talking, so nothing is final yet. People who follow the stock market are watching to see what happens next with these companies.", "vocab": [{"word": "acquire", "definition": "to buy or get something"}, {"word": "discussions", "definition": "talks or conversations about something"}, {"word": "specialty", "definition": "a specific type of product or service"}, {"word": "invests", "definition": "puts money into something to make more money"}, {"word": "stock market", "definition": "a place where parts of companies are bought and sold"}]}, "Intermediate": {"text": "Swiss chemical producer Clariant and U.S. private equity firm Clayton, Dubilier & Rice (CD&R) are reportedly in advanced discussions to acquire Ashland, a prominent American specialty chemical company. The news was first reported by Bloomberg, citing sources familiar with the matter, indicating a potentially significant transaction in the global chemical industry.\n\nAshland, headquartered in Wilmington, Delaware, is known for its wide range of specialty ingredients and materials used in various consumer and industrial markets, including personal care, pharmaceuticals, construction, and food and beverage. An acquisition by Clariant and CD&R could allow the companies to expand their market reach and product portfolios.\n\nClariant, a global leader in specialty chemicals, could benefit from Ashland's strong presence in certain high-growth segments. CD&R, a well-known private equity firm, often invests in companies with the aim of improving their operations and increasing their value before selling them later. This type of joint acquisition, where a strategic buyer (Clariant) partners with a financial investor (CD&R), is common for large-scale deals.\n\nWhile the discussions are ongoing, there is no guarantee that a deal will be finalized. Such acquisitions typically involve complex negotiations regarding price, financing, and regulatory approvals. Investors and industry observers will be closely monitoring the situation for further developments, as a successful acquisition would reshape parts of the specialty chemical landscape.", "vocab": [{"word": "producer", "definition": "a company or person that makes goods"}, {"word": "private equity firm", "definition": "a company that invests in other businesses, often buying them completely"}, {"word": "prominent", "definition": "important and well-known"}, {"word": "transaction", "definition": "a business deal or agreement"}, {"word": "portfolio", "definition": "a collection of investments, products, or services"}, {"word": "regulatory approvals", "definition": "official permission from government bodies needed for certain business actions"}]}, "Advanced": {"text": "The global specialty chemicals sector is abuzz with reports that Swiss chemical giant Clariant and U.S. private equity powerhouse Clayton, Dubilier & Rice (CD&R) are engaged in advanced negotiations to acquire Ashland, a leading American producer of specialty ingredients. Bloomberg initially broke the news, citing unnamed sources with direct knowledge of the confidential discussions, underscoring the potential for a transformative deal within the industry.\n\nAshland, headquartered in Wilmington, Delaware, has carved out a significant niche by developing and manufacturing a diverse array of specialty chemicals and ingredients. Its products are integral to various high-value applications across consumer and industrial markets, including personal care, pharmaceuticals, construction materials, and food and beverage additives. A successful acquisition would strategically bolster the combined entity's market footprint and technological capabilities, particularly in segments where Ashland holds a competitive edge.\n\nFor Clariant, a company focused on specialty chemicals and sustainable solutions, an acquisition of Ashland could offer substantial synergies. It would provide access to new customer bases, expand its product offerings, and potentially enhance its research and development pipeline. This move aligns with a broader industry trend of consolidation, where major players seek to achieve economies of scale and diversify their portfolios to mitigate market volatility.\n\nCD&R, a seasoned private equity firm, typically invests in mature companies with strong market positions, aiming to drive operational improvements and foster growth before an eventual exit. Their involvement suggests a structured approach to value creation, likely involving a strategic partnership with Clariant to leverage both operational expertise and financial capital. Such 'club deals,' involving both a strategic buyer and a financial sponsor, are increasingly common for large-scale transactions that require significant capital and a multifaceted integration strategy.\n\nWhile the discussions are reportedly well underway, the completion of such a complex deal is contingent upon numerous factors, including satisfactory due diligence, agreement on valuation, securing financing, and obtaining requisite antitrust and regulatory clearances. The market will undoubtedly be scrutinizing every development, as a successful acquisition would not only redefine the competitive landscape of specialty chemicals but also present significant implications for shareholders, employees, and customers of all three entities.", "vocab": [{"word": "abuzz", "definition": "filled with excitement, activity, or talk about something"}, {"word": "powerhouse", "definition": "a very powerful or influential person, group, or organization"}, {"word": "transformative", "definition": "causing a significant and fundamental change"}, {"word": "integral", "definition": "essential or necessary for completeness"}, {"word": "synergies", "definition": "the increased effectiveness that results when two or more people or companies work together"}, {"word": "consolidation", "definition": "the process of combining multiple smaller entities into a single, larger one"}, {"word": "contingent upon", "definition": "dependent on something else happening or being true"}, {"word": "antitrust", "definition": "relating to legislation designed to prevent companies from forming monopolies or engaging in anti-competitive practices"}]}}, "questions": [{"q": "Which two companies are reportedly in talks to acquire Ashland?", "a": "Clariant and Clayton, Dubilier & Rice (CD&R) are reportedly in talks to acquire Ashland."}, {"q": "What kind of products does Ashland make?", "a": "Ashland makes specialty chemicals and ingredients used in various consumer and industrial markets, such as personal care, pharmaceuticals, and construction."}], "id": "a9ab29ad611", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxPMnZTQ0NlZEtGYmhMbWtCbGF6X25EekZ2Mlp1Yy1oYnIzazhBRi0tdmlSa25zWUpOM3hnMXgyU2FpcW9uOENYRDg0N1ZRTWlTUWdrSDkwQXZjYUpDblhzc214akhiajhNMUZIUnk5UlhrR1Y3SEpjbGhiMDVWSTZKcC0yUDdMTmVhSk5fRWFCVzlXUFoxNGl0Mk9EX1hkcDRxTUNOT3ZFSlJKRVhYdkVLaUdvcG9fQQ?oc=5", "published": "2026-11-23T10:44:46+09:00", "category": "finance"}, {"headline": "Wall Street futures jump after major indexes enter correction territory - Investing.com", "excerpt": "Wall Street futures jump after major indexes enter correction territory Investing.com", "levels": {"Beginner": {"text": "Wall Street futures jump after major indexes enter correction territory Investing.com", "vocab": []}, "Intermediate": {"text": "Wall Street futures jump after major indexes enter correction territory Investing.com", "vocab": []}, "Advanced": {"text": "Wall Street futures jump after major indexes enter correction territory Investing.com", "vocab": []}}, "questions": [], "id": "a293abdd7e6", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixwFBVV95cUxNSm42cjYzNEJGOTZTa0E1YU5tZTZUckVxWXl4YU1aeDc5QjRMMk9jMUl2Xzh2dVl6Nm5tamxVS1FWNE1XdkxNaFQzeXctNUEyRlBUS3czWDlQaG5LN2pvYVVCWlpFTW9pM0ZJXzBsajVTcG1lUU1OeXhtRWhDNDZ3d3l3NWE5RmxVLW9JbUVpbnh1a2h3ZHhMWkRFVFY1UmFYbnRUeFhOZmI5b3BkOTRkY0h6Y241NHc5Tk1sUlhwaFc5dHdTVTZN?oc=5", "published": "2026-11-23T10:36:58+09:00", "category": "finance"}, {"headline": "GIFT City Boosts Global Financial Ties for 2026 FinTech Festival", "excerpt": "India's GIFT City is strengthening its international financial connections, preparing to showcase its potential at the Singapore FinTech Festival in 2026.", "levels": {"Beginner": {"text": "GIFT City is a special place in India. It helps with money and technology. It wants to work with other countries around the world. This helps India's economy grow.\n\nThere is a big meeting called the Singapore FinTech Festival. \"FinTech\" means using technology for financial services, like banking or payments. Many people from different countries go to this festival to share ideas and make new connections.\n\nGIFT City is getting ready for this important festival in 2026. They want to show everyone what they can do. Their goal is to make more global financial partnerships. This means working together with banks and tech companies from other nations.\n\nBy making these partnerships, GIFT City hopes to become a major center for finance and technology. This will bring new jobs and investments to India. It is an important step for India to connect more with the global economy.", "vocab": [{"word": "special", "definition": "different from what is usual; not ordinary."}, {"word": "technology", "definition": "the use of science in practical ways, like computers."}, {"word": "economy", "definition": "how a country makes and uses money and goods."}, {"word": "festival", "definition": "a special event or celebration."}, {"word": "partnerships", "definition": "when two or more people or groups work together."}, {"word": "investments", "definition": "putting money into something to make more money."}]}, "Intermediate": {"text": "GIFT City, officially known as Gujarat International Finance Tec-City, is India's ambitious project to establish a world-class financial and technology hub. Located in the state of Gujarat, it aims to serve as a gateway for global capital and financial services into and out of India. The city is actively working to strengthen its international connections and attract foreign businesses, positioning itself as a key player in the global financial landscape.\n\nA significant platform for these ongoing efforts is the Singapore FinTech Festival, a globally recognized event that brings together leaders, innovators, and investors in financial technology (FinTech). FinTech refers to the innovative use of technology to improve and automate financial services, from mobile banking to digital payments and blockchain. GIFT City is preparing to significantly advance its global financial partnerships at the 2026 edition of this prestigious festival.\n\nBy actively participating in and leveraging the Singapore FinTech Festival, GIFT City seeks to showcase its unique regulatory framework as India's first International Financial Services Centre (IFSC). This framework offers competitive advantages, including tax incentives and a business-friendly environment, designed to attract international financial institutions. The goal is to foster collaborations with global banks, investment firms, insurance companies, and technology innovators.\n\nThese strategic partnerships are crucial for GIFT City's vision of becoming a prominent global financial hub, competing with established centers worldwide. They are expected to facilitate cross-border investments, encourage the exchange of expertise, and drive innovation within India's rapidly expanding financial sector. Ultimately, strengthening these international ties will contribute significantly to India's broader economic growth, create new job opportunities, and deepen its integration into the global financial system. This proactive approach underscores India's commitment to becoming a major force in the international finance arena.", "vocab": [{"word": "ambitious", "definition": "having a strong desire to succeed or achieve something."}, {"word": "hub", "definition": "a central and important place where a lot of activity happens."}, {"word": "gateway", "definition": "a way to enter or exit a place or system."}, {"word": "FinTech", "definition": "(Financial Technology) technology used to improve and automate financial services."}, {"word": "regulatory framework", "definition": "a system of rules and laws that control how something operates."}, {"word": "foster", "definition": "to encourage the development or growth of something."}, {"word": "prominent", "definition": "important and well-known."}]}, "Advanced": {"text": "GIFT City, or Gujarat International Finance Tec-City, stands as India's pioneering endeavor to create a globally competitive financial and technology hub. Conceived as an International Financial Services Centre (IFSC), it is strategically positioned to channel global capital flows and facilitate sophisticated financial services for both domestic and international markets. This ambitious initiative represents a critical component of India's broader economic strategy, aiming to elevate its stature in the global financial architecture and cement its role as a significant economic power.\n\nIn a proactive move to solidify its international footprint and attract crucial foreign direct investment, GIFT City is intensifying its efforts to forge global financial partnerships. A significant focal point for these strategic engagements is the upcoming Singapore FinTech Festival in 2026. This festival is renowned as a preeminent global gathering for financial technology (FinTech) innovators, policymakers, and investors, offering an unparalleled platform for strategic outreach, thought leadership, and collaborative ventures. FinTech, encompassing everything from digital payments and blockchain to AI-driven financial analytics and green finance solutions, is rapidly transforming the industry, and GIFT City aims to be at the forefront of this evolution.\n\nGIFT City's robust participation at such a high-profile international event is designed to underscore its unique value proposition and competitive advantages. As India's sole IFSC, it operates under a distinct, progressive regulatory regime, offering a highly conducive environment for international financial entities. This includes a competitive tax structure, such as exemptions on various levies, streamlined business processes, and a robust legal framework tailored for cross-border transactions, including the ability to conduct business in foreign currencies. The objective is to attract a diverse array of global players, including multinational banks, asset management firms, insurance giants, and cutting-edge FinTech startups, thereby fostering a dynamic and vibrant ecosystem.\n\nThe strategic imperative behind advancing these partnerships extends beyond mere capital attraction. It encompasses facilitating crucial knowledge transfer, promoting talent mobility, and co-creating innovative financial solutions that address both regional and global challenges. By integrating more deeply into the international financial system, GIFT City aims to enhance India's economic resilience, diversify its financial offerings, and position itself as a thought leader in emerging financial technologies and sustainable finance. This sustained engagement at platforms like the Singapore FinTech Festival is instrumental in realizing GIFT City's ambition to become a formidable global financial nerve center, capable of rivaling established hubs like Singapore, Dubai, and London. Ultimately, these concerted efforts are pivotal in driving India's economic ascent on the world stage and establishing a robust, future-ready financial infrastructure.", "vocab": [{"word": "pioneering", "definition": "involving new ideas or methods; being the first to do something."}, {"word": "endeavor", "definition": "an attempt to achieve a goal."}, {"word": "stature", "definition": "the importance or reputation gained by ability or achievement."}, {"word": "preeminent", "definition": "surpassing all others; very distinguished in some way."}, {"word": "conducive", "definition": "making a certain situation or outcome likely or possible."}, {"word": "regulatory regime", "definition": "a system of rules and laws governing a particular activity or sector."}, {"word": "strategic imperative", "definition": "a crucial action or objective that is essential for long-term success."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}]}}, "questions": [{"q": "What is GIFT City aiming to do at the Singapore FinTech Festival in 2026?", "a": "GIFT City is aiming to advance its global financial partnerships and showcase its potential as an International Financial Services Centre (IFSC) at the Singapore FinTech Festival in 2026."}, {"q": "Why is building global financial partnerships important for GIFT City and India?", "a": "Building global financial partnerships is important because it helps GIFT City attract foreign investment, facilitate cross-border transactions, exchange expertise, drive innovation in the financial sector, and ultimately contribute to India's economic growth and integration into the global financial system."}], "id": "a2e3e480abe", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimAFBVV95cUxQY1p2Zy11RlNGamV3M3UtT3NLUHJucThLZFpmeUp1eWp3YU1KVENNODI4YmFuRl9aaTFXcnhrYVdIaTNzODJmQ1pQQ3JmTm1TdVh2cjdXZnZ2YkFsTW0wRnl5Umg4R0gxSUlaVk5kRndkSDhLUUVDWWtvazNPcThEcEl3N2NfQXNYU21EUWltQUJkTFBjRXlPMA?oc=5", "published": "2026-11-23T10:30:00+09:00", "category": "finance"}]}, {"key": "entertainment", "title": "Entertainment", "articles": [{"headline": "Don Toliver’s Manchester Concert Evacuated After Suspected Tear Gas Released Into Crowd", "excerpt": "Don Toliver’s concert at Co-op Live in Manchester, England ended in an evacuation as tear gas was released in the crowd on Sunday. “It is un", "levels": {"Beginner": {"text": "Don Toliver’s concert at Co-op Live in Manchester, England ended in an evacuation as tear gas was released in the crowd on Sunday. “It is understood that a substance believed to be tear gas was let off in the crowd towards the end of a concert,” wrote the Greater Manchester Police in a statement. According […]", "vocab": []}, "Intermediate": {"text": "Don Toliver’s concert at Co-op Live in Manchester, England ended in an evacuation as tear gas was released in the crowd on Sunday. “It is understood that a substance believed to be tear gas was let off in the crowd towards the end of a concert,” wrote the Greater Manchester Police in a statement. According [
