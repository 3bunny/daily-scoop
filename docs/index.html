 when they have a special chance. This kind of play is important in hockey. Fans were excited to see Konecny score and the Flyers play so strongly against the Canucks. It was a big moment for the team.", "vocab": [{"word": "goal", "definition": "When a player shoots the puck into the net during a game."}, {"word": "team", "definition": "A group of players who play a sport together."}, {"word": "game", "definition": "A competition played by rules, like hockey."}, {"word": "score", "definition": "To get points in a game, often by making a goal."}, {"word": "player", "definition": "A person who plays a sport."}, {"word": "advantage", "definition": "A better position or chance to succeed."}]}, "Intermediate": {"text": "In a recent National Hockey League (NHL) matchup, the Philadelphia Flyers showcased their offensive strength against the Vancouver Canucks. A key moment in the game involved Flyers forward Travis Konecny, who successfully netted his team's third power play goal of the contest. A power play occurs when one team gains a numerical advantage on the ice because an opposing player has been sent to the penalty box for an infraction, such as tripping or hooking. This temporary imbalance creates a crucial opportunity for the team with more players to generate scoring chances and put significant pressure on the opponent's defense. Konecny's goal underscored the Flyers' efficiency in capitalizing on these special team situations. Scoring three power play goals in a single game is an impressive feat, indicating strong strategic execution and teamwork among the players. It suggests that the Flyers were highly effective at moving the puck quickly, finding open lanes for shots, and converting their opportunities when playing with an extra skater. This kind of performance can significantly influence the momentum of a game, shifting it in favor of the team that successfully converts these chances. Power play goals are often a deciding factor in securing a victory in professional hockey, as they can quickly change the score. The ability to consistently score on power plays is a valuable asset for any NHL team, demonstrating both individual skill and collective discipline. Special teams, which include both power plays and penalty kills, are a vital component of modern hockey strategy, with teams dedicating significant practice time to perfecting them. This particular goal by Konecny highlighted Philadelphia's potent offense and their capacity to exploit opponent penalties, giving them a significant boost in their game against the Canucks. It was a strong display of their offensive prowess and strategic advantage.", "vocab": [{"word": "matchup", "definition": "A competition or game between two teams or players."}, {"word": "numerical advantage", "definition": "Having more players on the ice than the other team."}, {"word": "infraction", "definition": "A violation of a rule or law in a game."}, {"word": "crucial", "definition": "Extremely important or essential."}, {"word": "capitalize", "definition": "To make good use of something; to take advantage of a situation."}, {"word": "momentum", "definition": "The force or speed of movement; in sports, it refers to the flow or feeling of a game."}, {"word": "potent", "definition": "Having great power, influence, or effect."}]}, "Advanced": {"text": "In a recent National Hockey League (NHL) encounter, the Philadelphia Flyers demonstrated a formidable offensive display, particularly excelling in special teams play against the Vancouver Canucks. The spotlight shone brightly on Flyers forward Travis Konecny, who registered a pivotal power play goal, marking it as the third such tally for his team during the contest. This accomplishment is profoundly significant, as power plays represent critical junctures in hockey where a team gains a numerical superiority on the ice due to an opponent incurring a penalty for infractions such as hooking, tripping, or holding. These temporary advantages are designed to reward disciplined play and punish infractions, offering a prime opportunity to shift game momentum and significantly impact the scoreboard. Konecny's goal was not merely a point on the scoresheet; it was indicative of the Flyers' strategic acumen and their capacity to execute complex plays under pressure. Scoring three power play goals in a single game is an exceptional feat, underscoring a high level of coordination, precise puck movement, and shooting efficiency from the unit. It reflects a well-drilled unit capable of dissecting an opponent's penalty kill formation, creating high-danger scoring chances, and ultimately converting them with clinical precision. The strategic importance of special teams cannot be overstated in contemporary NHL hockey. Teams dedicate extensive practice time to refining their power play schemes and penalty kill strategies, recognizing that these situations often determine the outcome of tightly contested games. A highly effective power play can demoralize an opponent, force them into more cautious play, and provide a consistent source of offense, even when five-on-five play is stagnant. Konecny's contribution highlighted not only his individual skill and scoring touch but also the collective prowess of the Flyers' power play unit, which demonstrated excellent puck distribution, net-front presence, and timely shots. Their ability to consistently capitalize on opponent errors speaks volumes about their offensive depth, tactical discipline, and the coaching staff's meticulous preparation. This performance against the Canucks suggests a team that is not only capable of generating offense but also strategically adept at exploiting every available advantage, turning defensive lapses into crucial scoring opportunities. Such efficiency in special teams play is often a hallmark of successful playoff contenders, providing a crucial edge in high-stakes environments where goals are at a premium and every scoring chance must be maximized. The Flyers' demonstration of power play dominance serves as a strong statement about their offensive capabilities and their potential to be a formidable force in the league, signaling their readiness to compete at a high level throughout the season and beyond.", "vocab": [{"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "execute", "definition": "To carry out or put into effect (a plan, order, or course of action)."}, {"word": "dissecting", "definition": "Analyzing and examining something in minute detail, often to understand its structure or workings."}, {"word": "prowess", "definition": "Skill or expertise in a particular activity or field."}, {"word": "capitalize", "definition": "To make good use of (an opportunity or situation)."}, {"word": "adept", "definition": "Very skilled or proficient at something."}]}}, "questions": [{"q": "Which player scored the power play goal for the Flyers?", "a": "Travis Konecny scored the power play goal for the Flyers."}, {"q": "What does it mean for a goal to be a 'power play goal' in hockey?", "a": "A power play goal is scored when one team has more players on the ice than the other team, usually because an opponent is in the penalty box for an infraction."}], "id": "a153502c8a1", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikgFBVV95cUxONU9KUlA1d282d3FCakNBV3ZnVVlPRFdGTW5Qa1A5YVUxRUNsQnBrb2l6RXRlTVZNNkh6NHpqOEl1YjRMazg2akdwWHJNWERxeTljYnlsdEE1VEwwLXBWMnhtSXRWQWx3RWU5S25pS0Q4alZZUms1VGxVcWVyT1FnUWtoSGN2N2JHdWhqLXMxaG8zZw?oc=5", "published": "2026-11-28T12:26:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Former Vikings Quarterback Becomes Free Agent, Future Uncertain", "excerpt": "A quarterback who once played for the Minnesota Vikings has been released, leading to speculation about his next career move in the NFL.", "levels": {"Beginner": {"text": "A football player, a quarterback, who used to play for the Minnesota Vikings team, has been released. This means he is now without a team. He is a free agent, which means he can look for a new team to play for.\n\nA quarterback is a very important player in football. They lead the team and throw the ball to other players. When a team lets a player go, it can be for different reasons. Maybe the team wants to try new players, or maybe they need to save money.\n\nNow, many people are wondering where this former Vikings quarterback will go next. Other teams in the National Football League (NFL) might want him. Some teams might need a new starting quarterback, or they might need a good player to help their main quarterback.\n\nThis is a common part of professional sports. Players often move between teams. It gives them a chance to find a good fit, and it gives teams a chance to make their roster stronger. Everyone will watch to see which team signs him. It is an exciting time for football fans.", "vocab": [{"word": "quarterback", "definition": "The main player on a football team who throws the ball."}, {"word": "released", "definition": "To be let go from a sports team."}, {"word": "team", "definition": "A group of players who play a sport together."}, {"word": "free agent", "definition": "A player who is not signed to any team and can choose where to play next."}, {"word": "sign", "definition": "To agree to play for a new team."}, {"word": "roster", "definition": "The list of all the players on a sports team."}]}, "Intermediate": {"text": "A significant development in the National Football League (NFL) has seen a quarterback, who previously played for the Minnesota Vikings, released from his current team. This move immediately makes him a free agent, meaning he is now eligible to sign with any of the league's 31 other franchises. The news has sparked considerable speculation among sports analysts and fans regarding his potential next destination.\n\nThe quarterback position is arguably the most critical in professional football, with teams often building their entire offensive strategy around their signal-caller. A player's release can stem from various factors, including salary cap considerations, a team's desire to move in a different strategic direction, or a need to open up a roster spot for younger talent. For a veteran player, a release can sometimes offer an opportunity for a fresh start in a new environment.\n\nNow, the focus shifts to which NFL teams might be interested in acquiring his services. Several scenarios could unfold. Teams in need of an experienced starting quarterback, perhaps due to injury or underperformance, might view him as a viable option. Other franchises could be looking for a reliable backup to support their primary starter, or to add valuable depth to their quarterback room. The offseason period, particularly during free agency, is a dynamic time when teams actively reshape their rosters.\n\nWhile the specific reasons for his release are not detailed, the market for quarterbacks in the NFL is always active. Teams constantly evaluate talent to strengthen their competitive edge. This former Vikings quarterback now faces a crucial decision in his career, weighing factors like playing time, team fit, and contract offers. His next signing will undoubtedly be a closely watched event in the league.", "vocab": [{"word": "eligible", "definition": "Allowed to do something or be chosen."}, {"word": "franchises", "definition": "Professional sports teams."}, {"word": "speculation", "definition": "Guessing about something without having all the facts."}, {"word": "salary cap", "definition": "A limit on how much money a sports team can spend on player salaries."}, {"word": "viable", "definition": "Possible to do or succeed."}, {"word": "depth", "definition": "Having many good players for a position, not just the main ones."}, {"word": "dynamic", "definition": "Always changing and developing."}]}, "Advanced": {"text": "The National Football League's intricate ecosystem of player movement has been highlighted once again with the recent release of a quarterback who previously donned the purple and gold of the Minnesota Vikings. This strategic decision by his former club immediately thrusts him into the competitive landscape of NFL free agency, prompting widespread conjecture among league observers and media outlets like Yahoo Sports regarding his next professional trajectory.\n\nThe quarterback position remains the undisputed fulcrum of any NFL franchise, dictating offensive schemes, game management, and ultimately, a team's championship aspirations. A player's release, particularly a veteran signal-caller, can be predicated on a confluence of factors: the prohibitive financial ramifications of an existing contract against the backdrop of the league's salary cap, a strategic pivot towards youth and development, or simply a mutual parting of ways to allow a player to seek a more suitable role. This particular release underscores the transient nature of professional football careers and the constant evaluation of talent and value.\n\nThe ensuing market for a quarterback with prior NFL experience is always robust, albeit nuanced. Potential landing spots for the former Viking could be diverse. Contending teams might seek an experienced, steady hand to serve as a high-caliber backup, providing insurance against injury to their incumbent starter or offering mentorship to younger players. Conversely, rebuilding franchises might consider him a viable bridge starter, capable of leading a team while a rookie quarterback develops, or providing competition in a quarterback room lacking established talent. Teams with unexpected injuries at the position during training camp or early in the season could also emerge as urgent suitors.\n\nFinancial considerations will undoubtedly play a pivotal role in his next contract. His market value will be assessed based on his recent performance, leadership qualities, and the specific needs of potential acquiring teams. The decision for the player himself will involve a careful calibration of factors such as the opportunity for playing time, the competitive outlook of the prospective team, and the overall fit within a new offensive system. As the NFL offseason progresses, the narrative surrounding this prominent free agent will continue to evolve, offering a compelling case study in the strategic machinations of professional football roster construction.", "vocab": [{"word": "intricate", "definition": "Very complicated or detailed."}, {"word": "donned", "definition": "Put on (an item of clothing)."}, {"word": "conjecture", "definition": "An opinion or conclusion formed on the basis of incomplete information."}, {"word": "fulcrum", "definition": "The central or essential part of something."}, {"word": "predicated", "definition": "Based on or established on."}, {"word": "ramifications", "definition": "The consequences of an action or event, especially when complex or unwelcome."}, {"word": "incumbent", "definition": "Currently holding an office or position."}, {"word": "machinations", "definition": "A plot or scheme."}]}}, "questions": [{"q": "What happened to a quarterback who used to play for the Minnesota Vikings?", "a": "He was released from his team and is now a free agent, meaning he can sign with any other team."}, {"q": "Why might other NFL teams be interested in signing a released quarterback?", "a": "Teams might need a new starter due to injury or underperformance, or they might want a reliable backup or to add valuable depth to their roster."}], "id": "a48e9e7205a", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxPZXRJVlhxbGRDNnE5dGhRMDJGOUFCUGlHV1Nwa24xaFVNNFZYWnZOYnhiODExWTAtV25tOUNuRkhDZ2RKcGlXaWR4MV96OFZnXzlaVWZfNUh5RDFWeTlpU29nLWhEWVc2RERPeFRFa2pOLUgwbUhzNW1Md2Z5S0QxWlAxdWkwTDJ4ZFE?oc=5", "published": "2026-11-28T12:25:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Colombian Stock Market Rises, COLCAP Index Up 1.53%", "excerpt": "Colombia's main stock index, COLCAP, rose by 1.53% at the close of trading, signaling a positive day for investors.", "levels": {"Beginner": {"text": "The stock market in Colombia had a good day. Stocks went higher when trading finished. The main number that shows how the market is doing, called COLCAP, went up by 1.53 percent. This means that the value of many company shares increased. When stocks go up, it is usually good news for people who own them, called investors. They might see their money grow. \n\nA stock market is a place where people buy and sell small parts of companies. These parts are called stocks or shares. When the COLCAP index rises, it often shows that investors feel positive about the economy in Colombia. A rise of 1.53% is a good sign, suggesting that businesses are doing well or that people expect them to do well in the future. This positive movement can make more people want to invest their money.", "vocab": [{"word": "Stocks", "definition": "Small parts of companies that people can buy and sell."}, {"word": "Market", "definition": "A place or system where things are bought and sold."}, {"word": "Index", "definition": "A number that shows how a group of things, like stocks, is performing."}, {"word": "Up", "definition": "Higher; increased in value or amount."}, {"word": "Trade", "definition": "The act of buying and selling goods or services, or stocks."}, {"word": "Investors", "definition": "People who put money into something, like stocks, hoping to make more money."}]}, "Intermediate": {"text": "Colombia's stock market experienced a positive close to its trading day, with the main index, COLCAP, recording a significant increase. The COLCAP index climbed by 1.53% by the end of trading, indicating a generally optimistic sentiment among investors. This upward movement means that the overall value of shares listed on the Colombian Exchange (BVC) saw an appreciation.\n\nThe COLCAP index serves as a benchmark for the performance of the most liquid and largest companies trading on the Bolsa de Valores de Colombia. A rise of 1.53% suggests that investors have growing confidence in the economic outlook for Colombia. When the market performs well, it can encourage more investment, both from within the country and from international sources. This can lead to economic growth and potentially higher returns for those who have invested in Colombian companies.\n\nSuch market fluctuations are a normal part of the financial world, influenced by a variety of factors including company earnings, economic data, and global events. However, a solid gain like the one seen by the COLCAP index is generally viewed as a healthy sign for the country's capital markets and its broader economy. It reflects a positive day for many portfolios holding Colombian stocks.", "vocab": [{"word": "Benchmark", "definition": "A standard or point of reference against which things may be compared or assessed."}, {"word": "Performance", "definition": "How well an investment, company, or market is doing over a period of time."}, {"word": "Optimistic", "definition": "Feeling hopeful and confident about the future or the success of something."}, {"word": "Confidence", "definition": "A feeling of trust in someone or something; belief in one's own or another's ability or reliability."}, {"word": "Economy", "definition": "The system by which a country's money and goods are produced and used."}, {"word": "Fluctuations", "definition": "Irregular rising and falling in number or amount; changes."}, {"word": "Portfolio", "definition": "A collection of financial investments, such as stocks, bonds, and real estate."}]}, "Advanced": {"text": "The Colombian stock market concluded its trading session on a decidedly buoyant note, with its primary equity index, COLCAP, registering a robust gain of 1.53%. This significant uptick at the close of trade underscores a prevailing positive sentiment among market participants and reflects an appreciation in the valuation of a broad spectrum of Colombian listed companies. The COLCAP index, which serves as a crucial barometer for the health and direction of Colombia's capital markets, comprises the most liquid and largest stocks traded on the Bolsa de Valores de Colombia (BVC).\n\nSuch a substantial daily increase is often interpreted as a strong indicator of investor confidence, potentially driven by favorable macroeconomic data, positive corporate earnings reports, or an improved outlook for specific sectors within the Colombian economy. While the exact catalysts for this particular surge were not detailed, market movements of this magnitude typically signal a collective belief in the country's economic resilience and growth prospects. For both domestic and international investors, a rising COLCAP index enhances portfolio returns and can attract further foreign direct investment, bolstering the national economy.\n\nIn the broader context of Latin American markets, Colombia's performance can be influenced by global commodity prices, particularly oil, given its significant export role. A positive close, especially one exceeding a percentage point, suggests that any prevailing external pressures were either mitigated or overshadowed by strong internal market dynamics. This positive trajectory contributes to a more attractive investment landscape, potentially encouraging greater liquidity and diversification opportunities within the Colombian equity market. Sustained upward trends are vital for long-term economic stability and for fostering an environment conducive to business expansion and job creation.", "vocab": [{"word": "Buoyant", "defini function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
