an Central Banks - News and Statistics IndexBox", "vocab": []}, "Advanced": {"text": "ICBC President: Commercial Banks Face Tougher AI Transition Than Central Banks - News and Statistics IndexBox", "vocab": []}}, "questions": [], "id": "a8894d4a5fd", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxObW1HOW5lNU9UNlhCWTlucURnTFlHY3hRaWRTSEFnZ2c1eXRSUXJDaGQ5RXlQVC1mMmxYVFBEMzdMZk1JWmp0VnBNbDA1RGN5d21xalhxMURSaGIzdHpxU1JwSlkyNS13OFZxX0RrdFlNNnlVTmJpT3lzX2s2b1BFRmlNUmoxUGNHenc1M1hCR1U2aGxYME5IUHdzS3QxVHhRcTRTckFUOVA5ODduVndCQ1N1UGlrQQ?oc=5", "published": "2026-10-21T09:00:20+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "DBRS: Local banks keep reducing cost of risk - eKathimerini.com", "excerpt": "DBRS: Local banks keep reducing cost of risk eKathimerini.com", "levels": {"Beginner": {"text": "DBRS: Local banks keep reducing cost of risk eKathimerini.com", "vocab": []}, "Intermediate": {"text": "DBRS: Local banks keep reducing cost of risk eKathimerini.com", "vocab": []}, "Advanced": {"text": "DBRS: Local banks keep reducing cost of risk eKathimerini.com", "vocab": []}}, "questions": [], "id": "abb0d09c945", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPTjVlRW9TM1B6U1BONVd6c01HbGRiMVdMQ3JTZ094NF9qeVBFcUl3WnZXUWdUdWZ0OFNqRVJiVlp0VGlHeHRvMnp6SW1Vc1FuRkN5VlRuX011VW1hVEg1UU9vXzZNNXFFY0RzYkxlN0FyY0U0NjlCbzdHTUJ2cTF2elp5bVN4MlFveEtZTFhONlZZWVE?oc=5", "published": "2026-10-21T09:00:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Borneo's Fires Cause Widespread Toxic Haze in Southeast Asia", "excerpt": "Intense fires in Indonesia's Borneo region create toxic haze, making hundreds of thousands sick across Southeast Asia.", "levels": {"Beginner": {"text": "Fires are burning in Indonesia, especially on the island of Borneo. These fires have been going on for many months. They make a lot of smoke, which is called haze. This haze is very thick and dangerous.\n\nThe smoke is not just in Indonesia. It has spread across many countries in Southeast Asia. Places like Malaysia and Singapore are also covered in this bad air.\n\nMany people are getting sick because of the haze. Hundreds of thousands of people have breathing problems. Children and old people are especially at risk. Schools sometimes close because the air is too unhealthy.\n\nWhy are there so many fires? People often burn forests to clear land. They do this to grow palm trees, which are used to make palm oil. This oil is in many foods and products. When peatlands (wet, swampy ground) catch fire, they burn for a very long time and make a lot of smoke.\n\nGovernments are trying to stop the fires and help people. But it is a very big problem. The haze makes life hard for many people in the region.", "vocab": [{"word": "Haze", "definition": "Smoke or mist that makes it hard to see."}, {"word": "Spread", "definition": "To move and cover a larger area."}, {"word": "Sick", "definition": "Not healthy; ill."}, {"word": "Breathing", "definition": "Taking air in and out of your body."}, {"word": "Clear land", "definition": "To remove trees and plants from an area of ground."}, {"word": "Region", "definition": "A large area of a country or the world."}]}, "Intermediate": {"text": "For several months, vast fires have been raging across Indonesia, particularly on the island of Borneo. These extensive blazes are producing a dense, toxic smoke known as haze, which has enveloped large parts of Southeast Asia. This environmental crisis is causing severe health issues for a significant portion of the population.\n\nThe fires are often started to clear land for agricultural purposes, primarily for palm oil and pulpwood plantations. Many of these fires occur on peatlands, which are rich in organic matter. Once ignited, peatlands burn slowly underground for weeks or even months, releasing massive amounts of smoke and carbon into the atmosphere. This makes them incredibly difficult to extinguish.\n\nThe resulting haze has spread far beyond Indonesia's borders, affecting neighboring countries such as Malaysia, Singapore, and parts of Thailand and Brunei. Air quality in these areas has plummeted to hazardous levels, leading to widespread public health concerns. Hundreds of thousands of people have sought medical attention for respiratory problems, eye irritation, and skin conditions. Vulnerable groups, including children, the elderly, and those with pre-existing conditions, are particularly susceptible.\n\nBeyond health impacts, the haze disrupts daily life. Schools are frequently closed, flights are delayed or cancelled due to poor visibility, and economic activities are hampered. The ecological damage is also immense, threatening biodiversity, including endangered species like orangutans, whose habitats are being destroyed.\n\nGovernments in the region are working to combat the fires and mitigate the effects of the haze. However, the scale of the problem, combined with challenging weather conditions and the economic drivers behind land clearing, makes it a persistent and complex issue requiring sustained effort.", "vocab": [{"word": "Raging", "definition": "Burning with great force or intensity."}, {"word": "Enveloped", "definition": "Covered or surrounded completely."}, {"word": "Agricultural", "definition": "Related to farming."}, {"word": "Ignited", "definition": "Started to burn; caught fire."}, {"word": "Plummeted", "definition": "Fell very quickly and suddenly."}, {"word": "Respiratory", "definition": "Related to breathing."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}]}, "Advanced": {"text": "For several protracted months, Indonesia, particularly the biodiverse island of Borneo, has been grappling with extensive and persistent fires, unleashing a pervasive, toxic haze across Southeast Asia. This recurrent environmental catastrophe has precipitated a severe public health crisis and significant ecological devastation throughout the region.\n\nThe genesis of these fires is largely anthropogenic, driven by the clearing of land for industrial agriculture, primarily palm oil and pulpwood plantations. A critical exacerbating factor is the burning of vast peatlands. These carbon-rich, waterlogged soils, once drained for cultivation, become highly flammable. When ignited, peat fires smolder deep underground for extended periods, releasing colossal quantities of greenhouse gases and particulate matter into the atmosphere, making them exceptionally challenging to detect and extinguish. The dense smoke contains fine particulate matter (PM2.5), carbon monoxide, and other noxious gases, posing grave health risks.\n\nThe transboundary haze has blanketed an expansive geographical area, impacting not only Indonesia but also neighboring nations like Malaysia, Singapore, Brunei, and parts of Thailand and the Philippines. Air quality indices in affected urban centers have frequently soared into \"hazardous\" or \"very unhealthy\" categories, prompting widespread public health advisories. Medical facilities have reported a surge in patients presenting with acute respiratory infections, asthma exacerbations, conjunctivitis, and various dermatological complaints. Vulnerable demographics, including infants, the elderly, and individuals with chronic respiratory or cardiovascular conditions, face heightened susceptibility to severe health outcomes.\n\nBeyond the immediate health implications, the haze inflicts substantial socio-economic disruption. Schools are compelled to close, air travel is frequently grounded or delayed due to severely reduced visibility, and outdoor economic activities are curtailed, incurring significant financial losses. Environmentally, the fires decimate critical rainforest habitats, threatening endemic and endangered species such as orangutans, pygmy elephants, and Sumatran rhinos, pushing them closer to extinction. The destruction also contributes significantly to global carbon emissions.\n\nRegional governments, often with international assistance, deploy resources for firefighting efforts, cloud seeding to induce rain, and provide medical aid. However, the sheer scale of the blazes, coupled with El Niño-induced dry conditions and the complex interplay of economic imperatives and weak law enforcement, renders effective mitigation an arduous, long-term endeavor. Addressing this annual crisis necessitates robust policy implementation, sustainable land management practices, and enhanced regional cooperation to prevent future recurrences.", "vocab": [{"word": "Protracted", "definition": "Lasting for a long time or longer than expected or usual."}, {"word": "Grappling", "definition": "Struggling to deal with or overcome a difficulty or challenge."}, {"word": "Anthropogenic", "definition": "Originating in human activity."}, {"word": "Exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}, {"word": "Smolder", "definition": "Burn slowly with smoke but no flame."}, {"word": "Particulate matter", "definition": "Tiny solid or liquid particles suspended in a gas."}, {"word": "Transboundary", "definition": "Crossing a boundary, especially a national border."}, {"word": "Imperatives", "definition": "Things that are extremely important or urgent; essential duties."}]}}, "questions": [{"q": "What is the main cause of the fires in Indonesia mentioned in the article?", "a": "The fires are mainly caused by people clearing land for agriculture, especially for palm oil and pulpwood plantations."}, {"q": "Name at least three negative impacts of the haze described in the article.", "a": "Negative impacts include people getting sick with breathing problems, schools closing, flights being delayed or cancelled, and habitats for endangered animals being destroyed."}], "id": "aeb0cb9068c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cqm2dzwdmmywo?at_medium=RSS&at_campaign=rss", "published": "2026-10-21T08:51:43+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Kenya Addresses Ebola Concerns Amid US Travel Advisory", "excerpt": "Kenya's government is working to reassure the public and international visitors after nine Ebola cases were confirmed and the US issued a travel advisory.", "levels": {"Beginner": {"text": "Ebola is a serious disease. Nine people in Kenya have been found to have Ebola. This news makes some people worried.\nThe United States has told its citizens to think again about visiting Kenya. They said this because of the Ebola cases. This is called a travel advisory.\nBut the government of Kenya wants everyone to know they are working hard. They say they are trying to stop the disease from spreading. They want people to feel safe.\nEbola can make people very sick. It spreads from person to person. Doctors and health workers are helping the sick people. They are also looking for other people who might have the disease.\nKenya is an East African country. Many tourists like to visit Kenya for its wildlife and beautiful places. The government knows it is important to keep people safe and to tell the world that they are in control. They are giving information to make sure people understand the situation. They hope to stop more cases and keep the country safe for everyone.", "vocab": [{"word": "Disease", "definition": "A sickness that affects people or animals."}, {"word": "Spread", "definition": "To move from one person or place to another."}, {"word": "Worried", "definition": "Feeling anxious or uneasy about something."}, {"word": "Travel", "definition": "To go from one place to another, often for a holiday or business."}, {"word": "Safe", "definition": "Not in danger or likely to be harmed."}, {"word": "Control", "definition": "To manage or limit something."}]}, "Intermediate": {"text": "Kenya is currently addressing public health concerns following the confirmation of nine Ebola cases within its borders. This situation has drawn international attention, leading the United States to issue a travel advisory for its citizens planning to visit the East African nation.\nThe U.S. government has advised its citizens to \"reconsider travel\" to Kenya due to the confirmed Ebola cases. Such advisories are standard practice to inform travelers about potential health and safety risks, prompting them to exercise increased caution. This type of warning can significantly impact Kenya's vital tourism industry, which relies heavily on international visitors.\nIn response, the Kenyan government has acted swiftly to reassure both its own population and the global community. Health officials have emphasized that comprehensive measures are being implemented to contain the virus and prevent its wider transmission. These efforts include rigorous contact tracing, isolation of suspected cases, and providing specialized medical care for those infected. Public awareness campaigns are also underway to educate citizens on prevention methods and symptoms.\nEbola is a severe, often fatal, viral disease. It is primarily transmitted through direct contact with the blood, body fluids, and tissues of infected animals or people. Symptoms typically manifest as fever, severe headache, muscle pain, fatigue, diarrhea, vomiting, and unexplained bleeding. Rapid detection, isolation, and supportive care are critical for managing cases and controlling the spread of the disease.\nKenya, a prominent tourist destination known for its wildlife safaris and beautiful coastlines, recognizes the importance of maintaining public confidence and ensuring the safety of residents and visitors alike. The government's strategy focuses on transparent communication, robust public health interventions, and international cooperation to mitigate the risk and demonstrate effective control over the situation.", "vocab": [{"word": "Confirmed", "definition": "Proven to be true or real."}, {"word": "Advisory", "definition": "An official warning or recommendation."}, {"word": "Contain", "definition": "To keep something harmful within limits; to control."}, {"word": "Transmission", "definition": "The process of passing a disease from one person or animal to another."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "Interventions", "definition": "Actions taken to improve a situation, especially a medical one."}, {"word": "Robust", "definition": "Strong and healthy; able to withstand difficult conditions."}]}, "Advanced": {"text": "Kenya is currently grappling with a significant public health challenge following the confirmation of nine Ebola cases, a development that has prompted a robust international response, including a travel advisory from the United States. This situation underscores the delicate balance between stringent public health vigilance and the potential socioeconomic implications for nations heavily reliant on international engagement and tourism.\nThe U.S. State Department's decision to issue a \"reconsider travel\" advisory for Kenya, citing the Ebola outbreak, is a standard protocol designed to inform its citizens of elevated health risks. While intended as a precautionary measure, such advisories can have profound repercussions, particularly for Kenya's burgeoning tourism sector, a cornerstone of its economy. The perception of widespread risk, even if the actual cases are localized and contained, can significantly deter international visitors and impact foreign investment, thereby compounding the challenges faced by the government in managing the crisis.\nIn response, the Kenyan government has launched a concerted, multi-sectoral effort to provide reassurance and demonstrate its capacity for effective disease control. Health authorities are emphasizing the immediate implementation of comprehensive epidemiological surveillance, rigorous contact tracing protocols, and the swift isolation of suspected and confirmed cases. Public health campaigns are being widely disseminated to enhance community awareness regarding symptom recognition, stringent hygiene protocols, and the critical importance of early reporting, all of which are crucial elements in preventing wider community transmission and mitigating panic.\nEbola Virus Disease (EVD) is a severe, often fatal, viral hemorrhagic fever. Its primary mode of transmission involves direct contact with the blood, bodily fluids, or tissues of infected animals or symptomatic individuals. The incubation period can range from 2 to 21 days, with symptoms typically including abrupt onset of fever, intense weakness, muscle pain, headache, and sore throat, often followed by vomiting, diarrhea, rash, impaired kidney and liver function, and in some cases, internal and external bleeding. The rapid deployment of specialized medical teams, adherence to strict infection control measures, and community engagement are paramount in effectively managing outbreaks and limiting mortality.\nKenya, a pivotal East African nation renowned for its vibrant tourism industry, including iconic wildlife safaris and pristine coastal resorts, recognizes the imperative of maintaining international confidence and safeguarding its economic stability. The government's strategy involves transparent communication, robust public health infrastructure deployment, and proactive engagement with international health organizations such as the World Health Organization (WHO) to mitigate the spread and restore normalcy. These ongoing efforts aim not only to contain the current outbreak swiftly but also to reinforce the nation's long-term preparedness for future health crises, ensuring the sustained safety and stability essential for its continued development and prosperity.", "vocab": [{"word": "Grappling", "definition": "Struggling to deal with a difficult problem or situation."}, {"word": "Underscores", "definition": "Emphasizes or highlights the importance of something."}, {"word": "Repercussions", "definition": "Unintended consequences of an event or action, especially negative ones."}, {"word": "Epidemiological", "definition": "Relating to the branch of medicine that deals with the incidence, distribution, and possible control of diseases and other factors relating to health."}, {"word": "Disseminated", "definition": "Spread or dispersed widely."}, {"word": "Paramount", "definition": "More important than anything else; supreme."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "Prosperity", "definition": "The state of being successful, especially financially."}]}}, "questions": [{"q": "Why did the United States issue a travel advisory for Kenya?", "a": "The United States issued a travel advisory for Kenya because nine cases of Ebola were confirmed in the country."}, {"q": "What is the Kenyan government doing to address the Ebola situation?", "a": "The Kenyan government is working to reassure people, implementing measures to contain the virus, monitoring the situation, identifying contacts, providing medical care, and conducting public awareness campaigns."}], "id": "a948397bb66", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c693z948px0jo?at_medium=RSS&at_campaign=rss", "published": "2026-10-21T08:41:30+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "PENINSULA ADVENTURE SPORTS: Salt Creek 24 set for this weekend - Peninsula Daily News", "excerpt": "PENINSULA ADVENTURE SPORTS: Salt Creek 24 set for this weekend Peninsula Daily News", "levels": {"Beginner": {"text": "PENINSULA ADVENTURE SPORTS: Salt Creek 24 set for this weekend Peninsula Daily News", "vocab": []}, "Intermediate": {"text": "PENINSULA ADVENTURE SPORTS: Salt Creek 24 set for this weekend Peninsula Daily News", "vocab": []}, "Advanced": {"text": "PENIN an buy."}, {"word": "Winner", "definition": "Something that does very well, like a stock whose price goes up a lot."}, {"word": "Investors", "definition": "People who buy stocks or other things hoping to make money."}, {"word": "Banks", "definition": "Places where people keep money and get loans."}, {"word": "Economy", "definition": "How a country makes and uses money and goods."}, {"word": "Shares", "definition": "Small pieces of ownership in a company, also called stock."}]}, "Intermediate": {"text": "Washington Trust Bancorp experienced a significant increase in its stock price today, marking it as a \"winner\" in the financial markets. This positive movement indicates strong investor confidence in the company and the broader banking sector. When a company's stock rises, it means that more investors are buying its shares, driving up their value and signaling a positive outlook from the investment community.\n\nWashington Trust Bancorp is a bank holding company, which means it owns and controls several banking institutions. These banks provide a wide range of essential financial services to individuals and businesses, including savings and checking accounts, mortgage loans, business loans, and wealth management. The performance of such institutions is often closely tied to the overall economic health, as a robust economy typically leads to higher demand for credit and other banking services, which in turn can boost bank profitability.\n\nSeveral general factors can contribute to a stock's strong performance. These might include widespread market optimism, favorable economic data, or a positive shift in sentiment towards specific sectors like finance. For a bank holding company like Washington Trust Bancorp, a stable economic environment reduces the risk of loan defaults, while rising interest rates can sometimes be beneficial, allowing banks to earn more from the interest charged on loans. Investor perception of a company's management, its financial stability, and its growth prospects also play a crucial role.\n\nToday's upward trend suggests that investors view Washington Trust Bancorp as a sound and promising investment. They likely anticipate continued growth and profitability, or perhaps they are reacting to positive, albeit general, trends within the financial industry that favor banking institutions. This increased demand for its shares reflects a positive outlook from the investment community, making it a notable day for the company and its shareholders who now hold more valuable assets.", "vocab": [{"word": "Significant", "definition": "Important or noticeable."}, {"word": "Confidence", "definition": "A feeling of trust or belief in something."}, {"word": "Shares", "definition": "Units of ownership in a company, bought and sold by investors."}, {"word": "Holding company", "definition": "A company that owns other companies."}, {"word": "Financial services", "definition": "Money-related help, like banking, loans, or managing investments."}, {"word": "Economic climate", "definition": "The general state of the economy, including how strong or weak it is."}, {"word": "Profitability", "definition": "The ability of a business to make money."}]}, "Advanced": {"text": "Washington Trust Bancorp witnessed a notable surge in its stock valuation today, positioning it as a standout performer in the financial markets. This upward trajectory signals robust investor confidence, not only in the specific prospects of the company but also potentially reflecting a broader positive sentiment within the banking sector. A significant rise in a company's stock price typically indicates increased demand from investors, who are willing to pay a premium for its shares, thereby elevating its market capitalization – the total value of all its outstanding shares.\n\nAs a bank holding company, Washington Trust Bancorp oversees a portfolio of banking subsidiaries that offer a comprehensive suite of financial products and services. These range from traditional retail banking, such as deposit accounts and consumer loans, to commercial lending, wealth management, and trust services. The intrinsic health and performance of such institutions are inextricably linked to macroeconomic conditions. A buoyant economy, characterized by low unemployment and sustained growth, generally translates into higher loan demand, reduced credit risk, and improved net interest margins for banks, as they can charge more for loans relative to what they pay for deposits.\n\nThe catalysts for a stock's strong performance are multifaceted. They can include overarching market optimism, the release of favorable economic indicators, or a sector-specific re-evaluation by analysts and institutional investors. For banking entities, factors such as the prevailing interest rate environment are particularly pertinent; a rising rate scenario can enhance profitability by widening the spread between what banks pay on deposits and what they earn on loans. Furthermore, a stable regulatory landscape, characterized by predictable and supportive government policies, and a perceived reduction in systemic financial risks can significantly bolster investor appetite for banking stocks. Investor confidence is also often influenced by a company's balance sheet strength, its asset quality, and its ability to adapt to evolving market conditions.\n\nWhile specific catalysts for Washington Trust Bancorp's particular surge today were not detailed, the general market dynamics suggest that investors are either anticipating strong future earnings, reacting to positive industry-wide trends, or perhaps re-evaluating the company's intrinsic value based on its operational efficiency or strategic initiatives. A positive shift in investor sentiment often stems from a belief in the company's effective management, its strategic positioning within its market, or its resilience in navigating economic fluctuations. The increased valuation benefits existing shareholders and can also provide the company with greater flexibility for future capital-raising initiatives, such as issuing new shares, or for strategic acquisitions that could further expand its market presence. This robust performance underscores a favorable outlook from the investment community, highlighting a significant day for the company's market standing and its long-term strategic potential.", "vocab": [{"word": "Valuation", "definition": "The process of determining how much something is worth, especially a company or its stock."}, {"word": "Trajectory", "definition": "The path or course that something is following, often used for trends."}, {"word": "Robust", "definition": "Strong and healthy; able to withstand difficult conditions."}, {"word": "Market capitalization", "definition": "The total value of a company's outstanding shares, calculated by multiplying the share price by the number of shares."}, {"word": "Subsidiaries", "definition": "Companies controlled by a parent company."}, {"word": "Macroeconomic", "definition": "Relating to the economy of a whole country or large region, rather than individual markets."}, {"word": "Catalysts", "definition": "Events or factors that cause a significant change or action."}, {"word": "Pertinent", "definition": "Relevant or applicable to a particular matter."}, {"word": "Systemic", "definition": "Relating to a system as a whole, often used for risks affecting an entire financial system."}, {"word": "Intrinsic value", "definition": "The true, inherent worth of an asset, often different from its market price."}]}}, "questions": [{"q": "What does it mean when a company's stock is called a \"winner\"?", "a": "It means the stock price went up, and its shares became more valuable."}, {"q": "What kind of company is Washington Trust Bancorp?", "a": "It is a bank holding company that owns and operates various banking institutions."}], "id": "af3232971f4", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", " const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
