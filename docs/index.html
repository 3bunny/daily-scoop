 election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiekFVX3lxTFBWYUJzSjJCcF9pWEQ1anI1d25ZWUxtb0JiVkQtNHROSHBIOUd5RHdoM05ZR0IxVEVRc241V3dUSWN1TTJGck5RNVIzSzJCb0hTbi1maWtDS3AxblVQdjRkWXFfR1FpODNzQUN2cWRSbEtIRERBcVc2d1Zn?oc=5", "published": "2026-10-20T08:47:00+09:00", "category": "politics"}, {"headline": "Morocco's First Female PM Faces Complex Challenges for Women's Rights", "excerpt": "Fatima El Mansouri, Morocco's first female Prime Minister, faces a delicate balancing act to advance women's rights amidst powerful traditional and political forces.", "levels": {"Beginner": {"text": "Morocco has its first female Prime Minister, Fatima El Mansouri. This is a big step for the country. She wants to help women in Morocco have more rights and better lives.\n\nBut her job is not easy. She faces many challenges. The King of Morocco has a lot of power. Religious leaders, called clerics, also have strong ideas about women's roles. These ideas are often traditional. Also, women's rights groups, called feminists, want faster changes. They push for more freedom and equality for women.\n\nFatima El Mansouri must work with all these groups. She needs to find a way to make progress for women without causing big problems. It is a difficult balance. She hopes to improve laws about family and work for women. Her role is important for the future of women in Morocco. Many people are watching to see what she will do.", "vocab": [{"word": "Prime Minister", "definition": "The main leader of a country's government."}, {"word": "Challenges", "definition": "Difficult problems or tasks."}, {"word": "Clerics", "definition": "Religious leaders."}, {"word": "Traditional", "definition": "Old ways of doing things; beliefs from the past."}, {"word": "Feminists", "definition": "People who believe women should have the same rights and opportunities as men."}, {"word": "Progress", "definition": "Moving forward or making improvements."}]}, "Intermediate": {"text": "Morocco has appointed its first female Prime Minister, Fatima El Mansouri, marking a significant moment for the North African nation. Her new role places her at the forefront of efforts to advance women's rights, a long-standing issue in the country. However, her path is fraught with complex political and social barriers, requiring a delicate balancing act.\n\nPrime Minister El Mansouri must navigate the interests and influences of several powerful entities. The Moroccan monarchy, led by King Mohammed VI, holds substantial authority and plays a crucial role in shaping national policy and social reforms. Alongside the monarchy, influential religious clerics represent traditional Islamic interpretations that often define women's roles within society and family law. Their views can sometimes conflict with modern aspirations for gender equality.\n\nOn the other side, various women's rights organizations and feminist groups are actively campaigning for comprehensive reforms. They advocate for greater political representation, economic empowerment, and changes to the Moudawana, Morocco's family code, which governs marriage, divorce, and child custody. These groups often push for more rapid and extensive changes than traditional institutions might favor.\n\nEl Mansouri's challenge is to bridge these diverse perspectives. She must seek common ground to introduce meaningful reforms that improve the lives of Moroccan women, while respecting the country's cultural and religious heritage. Her success will depend on her ability to build consensus and demonstrate tangible progress in areas such as legal equality, access to education, and participation in the workforce. Her appointment itself is a symbol of potential change, but the real work lies in transforming that potential into reality for millions of women.", "vocab": [{"word": "Appointed", "definition": "Chosen for a job or position."}, {"word": "Significant", "definition": "Important or noticeable."}, {"word": "Fraught", "definition": "Full of problems or difficulties."}, {"word": "Entities", "definition": "Things that exist as separate and distinct units."}, {"word": "Substantial", "definition": "Large in amount, value, or importance."}, {"word": "Aspirations", "definition": "Strong desires to achieve something."}, {"word": "Consensus", "definition": "General agreement among a group of people."}]}, "Advanced": {"text": "Morocco has ushered in a new era with the appointment of Fatima El Mansouri as its first female Prime Minister, a landmark development for the North African kingdom. Her elevation to this pivotal role places her squarely at the nexus of a long-standing national dialogue concerning women's rights and gender equality. However, her tenure is anticipated to be a complex tightrope walk, as she endeavors to advance reforms while navigating entrenched political, religious, and social barriers.\n\nPrime Minister El Mansouri's mandate requires her to skillfully manage the often-divergent expectations of three powerful constituencies. Foremost among these is the Moroccan monarchy, with King Mohammed VI wielding considerable executive and spiritual authority. The King has historically been a catalyst for social reforms, including the significant overhaul of the Moudawana (family code) in 2004, which granted women more rights. Yet, any further legislative changes must align with the monarchy's vision for gradual modernization and national stability.\n\nConcurrently, influential religious clerics and conservative elements within society represent traditional interpretations of Islamic law that often delineate women's roles within the domestic sphere and advocate for a patriarchal social structure. Their considerable sway over public opinion and their resistance to what they perceive as Western-imposed liberal values pose a formidable challenge to progressive reforms. El Mansouri will need to engage these groups cautiously, seeking to frame advancements in women's rights within an authentic Moroccan and Islamic context.\n\nConversely, a vibrant and increasingly vocal feminist movement, comprising various women's rights organizations and civil society groups, is pressing for accelerated and more comprehensive changes. They advocate for full legal parity, enhanced political representation, economic empowerment, and an end to all forms of discrimination. These groups often express frustration with the pace of reform and will likely exert pressure on El Mansouri to deliver tangible results quickly.\n\nEl Mansouri's strategic imperative will be to forge a delicate equilibrium, crafting policies that can garner broad societal acceptance while genuinely improving the status of Moroccan women. This involves not only legislative amendments but also fostering cultural shifts and ensuring effective implementation of existing laws. Her success will be measured by her ability to build cross-sectional alliances, articulate a compelling vision for gender equity that resonates across the political spectrum, and translate policy into palpable improvements in women's daily lives, from educational opportunities to economic participation and protection against violence. Her appointment is a potent symbol, but its true legacy will depend on her capacity to navigate these intricate dynamics and catalyze substantive, enduring change.", "vocab": [{"word": "Ushered in", "definition": "To mark the beginning of something new."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Nexus", "definition": "A connection or series of connections linking two or more things; the central and most important point or place."}, {"word": "Tenure", "definition": "The period during which someone holds an important job or position."}, {"word": "Entrenched", "definition": "Firmly established and difficult or unlikely to change; ingrained."}, {"word": "Delineate", "definition": "To describe or portray something precisely."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Palpable", "definition": "(Of a feeling or atmosphere) so intense as to be almost touched or felt; easily perceived."}]}}, "questions": [{"q": "Who is Fatima El Mansouri, and what is her main goal in her new role?", "a": "Fatima El Mansouri is Morocco's first female Prime Minister, and her main goal is to advance women's rights in the country."}, {"q": "What are the three main groups or entities that present challenges to Fatima El Mansouri's efforts to advance women's rights?", "a": "The three main groups or entities are the King (monarchy), religious leaders (clerics), and women's rights organizations (feminists)."}], "id": "a0cb848b911", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmqxn4gggdw4o?at_medium=RSS&at_campaign=rss", "published": "2026-10-20T08:30:03+09:00", "category": "politics"}, {"headline": "El Niño Intensifies, Bringing Global Weather Changes", "excerpt": "The powerful El Niño climate pattern is growing stronger, causing significant shifts in weather around the world, from droughts to heavy rains.", "levels": {"Beginner": {"text": "El Niño is a natural event that makes the Pacific Ocean water warmer than usual. This warm water changes weather all over the world. Right now, a very strong El Niño is happening. It is making many places feel different weather.\n\nOne big change is that some areas get less rain. This can cause droughts, where the land gets very dry. For example, countries like Australia and parts of Asia might have less water for farms. Other places might get much more rain than usual. This can lead to floods, where water covers the land. Parts of North and South America might see more heavy storms.\n\nEl Niño also often makes the whole world a little warmer. This means we might have hotter days. It can affect fish in the ocean too, as they move to find cooler water. Scientists are watching this strong El Niño closely. They want to understand all the ways it is changing our planet's weather. People need to be ready for these different weather conditions.", "vocab": [{"word": "warmer", "definition": "a little hot"}, {"word": "changes", "definition": "makes different"}, {"word": "droughts", "definition": "long periods with no rain"}, {"word": "floods", "definition": "when water covers land that is usually dry"}, {"word": "planet", "definition": "the Earth"}, {"word": "conditions", "definition": "the state of something, like the weather"}]}, "Intermediate": {"text": "El Niño is a significant natural climate pattern characterized by the unusual warming of ocean surface waters in the central and eastern tropical Pacific Ocean. This phenomenon has a profound influence on global weather systems, leading to a variety of impacts across continents. Currently, the world is experiencing one of the strongest El Niño events ever recorded, which continues to intensify and reshape weather patterns globally.\n\nHistorically, El Niño events are associated with several distinct weather shifts. Many regions experience reduced rainfall, leading to severe droughts. For instance, countries in Southeast Asia and Australia often face drier conditions, which can harm agriculture and increase the risk of wildfires. Conversely, other parts of the world, particularly sections of North and South America, may encounter heavier than average rainfall, resulting in increased risks of flooding and landslides.\n\nBeyond precipitation changes, El Niño typically contributes to a general warming trend across the globe. This can lead to higher average temperatures, impacting ecosystems and human activities. Marine life is also affected; as ocean temperatures rise, some fish species migrate to cooler waters, which can impact fishing industries. Scientists and meteorologists are closely monitoring this powerful El Niño to better predict its ongoing effects and help communities prepare for the diverse weather challenges it presents. Understanding these patterns is crucial for managing resources and ensuring public safety.", "vocab": [{"word": "phenomenon", "definition": "a fact or situation that is observed to exist or happen, especially one whose cause or explanation is in question"}, {"word": "profound", "definition": "very great or intense"}, {"word": "continents", "definition": "any of the world's main continuous expanses of land (Africa, Antarctica, Asia, Australia, Europe, North America, South America)"}, {"word": "severe", "definition": "very great; intense"}, {"word": "conversely", "definition": "introducing a statement or idea which reverses one just made or suggested"}, {"word": "precipitation", "definition": "rain, snow, sleet, or hail that falls to the ground"}, {"word": "ecosystems", "definition": "a biological community of interacting organisms and their physical environment"}, {"word": "crucial", "definition": "extremely important, essential"}]}, "Advanced": {"text": "The global climate is currently under the significant influence of El Niño, a powerful natural climate oscillation defined by the anomalous warming of sea surface temperatures in the central and eastern equatorial Pacific Ocean. This dynamic phenomenon profoundly alters atmospheric circulation and precipitation patterns worldwide, leading to a cascade of diverse meteorological impacts. The present El Niño event is noted as one of the most intense on record, continuing to strengthen and exert its far-reaching effects across the planet.\n\nHistorically, the manifestation of El Niño has been consistently linked to a range of predictable, yet often severe, weather anomalies. Many regions, particularly those in Southeast Asia, Australia, and parts of Africa, typically experience prolonged periods of reduced rainfall, culminating in widespread drought conditions. These droughts can devastate agricultural sectors, exacerbate water scarcity, and heighten the risk of catastrophic wildfires. In stark contrast, other areas, notably along the Pacific coasts of North and South America, often contend with significantly increased precipitation, leading to an elevated threat of severe flooding, mudslides, and coastal erosion.\n\nBeyond its influence on regional precipitation, El Niño is a major contributor to elevated global average temperatures. The release of heat from the warmer Pacific waters into the atmosphere can push global temperature records higher, intensifying heatwaves and impacting sensitive ecosystems. Marine environments are particularly vulnerable; warmer ocean temperatures can lead to coral bleaching events and force commercially important fish stocks to migrate, disrupting established fisheries. Climate scientists and meteorological agencies are meticulously tracking this formidable El Niño, employing sophisticated models to refine predictions of its trajectory and duration. Such detailed forecasting is indispensable for governments and communities to implement robust mitigation strategies, manage critical resources, and enhance resilience against the complex and varied challenges posed by this pervasive climate driver.", "vocab": [{"word": "oscillation", "definition": "a regular fluctuation or variation, often referring to a back-and-forth movement or change in a system"}, {"word": "anomalous", "definition": "deviating from what is standard, normal, or expected; unusual"}, {"word": "cascade", "definition": "a process whereby something, typically information or a reaction, is passed on through a succession of stages or from one thing to another"}, {"word": "meteorological", "definition": "relating to the branch of science concerned with the processes and phenomena of the atmosphere, especially as a means of forecasting the weather"}, {"word": "manifestation", "definition": "an event, action, or object that clearly shows or embodies something, especially a theory or an abstract idea"}, {"word": "culminating", "definition": "reaching a climax or point of highest development"}, {"word": "exacerbate", "definition": "make (a problem, bad situation, or negative feeling) worse"}, {"word": "indispensable", "definition": "absolutely necessary"}, {"word": "pervasive", "definition": "spreading widely throughout an area or a group of people (especially of an unwelcome influence or physical effect)"}]}}, "questions": [{"q": "What is El Niño?", "a": "El Niño is a natural climate pattern where the ocean surface waters in the central and eastern tropical Pacific Ocean become warmer than usual."}, {"q": "Name two different ways El Niño can affect weather around the world.", "a": "El Niño can cause droughts (less rain) in some areas and heavy rainfall and floods in others. It also often leads to warmer global temperatures."}], "id": "ab5209da5d5", "source": "BBC News", "link": "https://www.bbc.co.uk/weather/articles/c6dx07dznpyyo?at_medium=RSS&at_campaign=rss", "published": "2026-10-20T08:08:25+09:00", "category": "politics"}]}, {"key": "sports", "title": "Sports", "articles": [{"headline": "First Patriots injury report as short week prep begins - 98.5 The Sports Hub", "excerpt": "First Patriots injury report as short week prep begins 98.5 The Sports Hub", "levels": {"Beginner": {"text": "First Patriots injury report as short week prep begins 98.5 The Sports Hub", "vocab": []}, "Intermediate": {"text": "First Patriots injury report as short week prep begins 98.5 The Sports Hub", "vocab": []}, "Advanced": {"text": "First Patriots injury report as short week prep begins 98.5 The Sports Hub", "vocab": []}}, "questions": [], "id": "a8da3109286", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimgFBVV95cUxOeFB3aU9qOEhvTHE4Y0ZuQVNvR2xfUFl2bW4tZHc5Z251UHpVdkFXVENxRjRQblRqa09Ndnh6SlJ5TFF5Zm5IYVBoblNOQVBNU291VE1ycVNacXliLXM5dVMtRHpQNnZDRm5oajZJS3hTSXFTUGFWZTU0YXhaWnIybkxHMVBlVU9nZEhkb3hMbzlGNzhRZVBlLU5R?oc=5", "published": "2026-10-20T09:43:22+0 t Was Hell\" After Teasing New Rihanna Music - E! News", "excerpt": "A$AP Rocky Jokes \"It Was Hell\" After Teasing New Rihanna Music E! News", "levels": {"Beginner": {"text": "A$AP Rocky Jokes \"It Was Hell\" After Teasing New Rihanna Music E! News", "vocab": []}, "Intermediate": {"text": "A$AP Rocky Jokes \"It Was Hell\" After Teasing New Rihanna Music E! News", "vocab": []}, "Advanced": {"text": "A$AP Rocky Jokes \"It Was Hell\" After Teasing New Rihanna Music E! News", "vocab": []}}, "questions": [], "id": "a89c98f1ee7", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxNUnc4WGw0ckdKSlo1bmM2eEtvQjB2dGtSRzdyWWFQREs5THVPMk5lWDlCY0xDOFRYQTJ0ZWRFcHZWTV93LWRIWi10bUhxV2NvZ1BaQWdOYlVnOHhKd2lzLVFSRzRVVS1xbkxMb1dINXUtYm1QUW1naHdXNzV5N01uVU5wVGY3bGxZSllLdWFmQjhBRHdnelFWVko3YXd0YUl1?oc=5", "published": "2026-10-20T09:23:39+09:00", "category": "entertainment"}]}], "home": [{"headline": "California Wine Faces Lasting Challenge in Canadian Market After Trade Spat", "excerpt": "Even if a trade dispute ends, experts worry Canadian consumers might continue to avoid California wines, posing a long-term challenge.", "levels": {"Beginner": {"text": "California wine is popular in many places, including Canada. But now, there is a problem. A \"trade dispute\" happened between the U.S. and Canada. This dispute made it harder for California to sell its wine to Canada.\n\nBecause of this problem, Canadians started buying less California wine. They might have tried wines from other countries instead. Now, some people are worried. Mr. Schiff, an expert, thinks that even if the trade dispute stops, Canadians might still not buy as much California wine as before.\n\nThis is because people get used to new things. If they found other wines they like, they might keep buying them. This would be bad news for California's wine makers. Canada is a big market for them. They want Canadians to buy their wine again. It will be a challenge to win back these customers. The wine industry hopes to find ways to make Canadians love California wine again.", "vocab": [{"word": "popular", "definition": "liked by many people"}, {"word": "dispute", "definition": "a disagreement or argument"}, {"word": "harder", "definition": "more difficult"}, {"word": "expert", "definition": "a person with special knowledge or skill"}, {"word": "market", "definition": "a place or system where goods are bought and sold"}, {"word": "challenge", "definition": "a difficult task or situation"}]}, "Intermediate": {"text": "California's renowned wine industry is facing a significant challenge concerning its presence in the Canadian market. For some time, a trade dispute between the United States and Canada has impacted the flow and sales of California wines across the border. Such disputes often involve tariffs or other trade barriers, making imported goods more expensive or less accessible for consumers.\n\nDuring this period of trade friction, Canadian consumers likely adjusted their purchasing habits. Faced with potentially higher prices or fewer options for California wines, many may have explored and grown accustomed to wines from other regions or countries. This shift in consumer behavior is now a major concern for California vintners.\n\nAccording to observations by figures like Schiff, there's a strong possibility that these new consumer preferences could persist even after the trade dispute is officially resolved. Once consumers discover alternative products they enjoy, they often stick with them, making it difficult for the original product to regain its market share. This phenomenon is known as \"brand loyalty\" or \"habit formation.\"\n\nCanada represents a crucial export market for California wines, making this potential long-term shift in consumer demand a serious economic issue for the state's wine producers. Re-establishing a strong foothold and winning back Canadian customers will require concerted efforts, potentially involving new marketing strategies, competitive pricing, and promotional campaigns to remind consumers of the quality and appeal of California wines. The industry aims to mitigate these lasting repercussions and restore its strong position in the Canadian market.", "vocab": [{"word": "renowned", "definition": "famous for something"}, {"word": "dispute", "definition": "a serious argument or disagreement"}, {"word": "impacted", "definition": "had a strong effect on something"}, {"word": "consumers", "definition": "people who buy goods and services"}, {"word": "habits", "definition": "regular ways of doing things"}, {"word": "persist", "definition": "to continue to exist or happen"}, {"word": "vintners", "definition": "people who make wine"}]}, "Advanced": {"text": "California's globally renowned wine industry finds itself in a precarious predicament regarding its significant Canadian export market. A protracted trade dispute between the United States and Canada has cast a long shadow over sales, and experts, including figures like Schiff, are now expressing concern that the repercussions could be enduring, even after a formal resolution to the trade friction.\n\nTrade disputes typically involve the imposition of tariffs, quotas, or other non-tariff barriers that increase the cost or complexity of importing goods. During the period these barriers were in place, Canadian consumers, facing higher prices or reduced availability of California wines, demonstrably shifted their purchasing patterns. This disruption provided an impetus for consumers to explore and adopt wines from alternative global regions, such as France, Italy, Australia, or even domestic Canadian producers. The initial friction, while perhaps temporary in policy, has fostered a \"new normal\" in Canadian wine consumption.\n\nThe core of the current apprehension lies in the stickiness of consumer behavior. Once new purchasing habits are formed and consumers discover satisfactory alternatives, these preferences can become deeply entrenched. Even if the trade landscape normalizes and California wines become competitively priced and readily available again, winning back market share from established new favorites is a formidable challenge. This phenomenon is well-documented in economics, where initial market disruptions can lead to permanent changes in demand curves, as consumers are often reluctant to revert to previous choices once they've found acceptable substitutes.\n\nCanada has historically been one of the most vital export markets for California wines, representing a substantial portion of the industry's international revenue. The potential for a sustained downturn in demand, irrespective of trade policy changes, poses a significant economic threat to California vintners, impacting vineyards, wineries, and associated agricultural sectors across the state. This long-term shift could necessitate a re-evaluation of market diversification strategies and a greater emphasis on domestic sales or other emerging markets.\n\nTo mitigate these potential long-term effects, the California wine industry will likely need to implement robust and innovative strategies. These could include aggressive marketing campaigns focused on re-engaging Canadian consumers, targeted promotional offers, and potentially even adjustments to distribution channels or product lines to better align with evolving Canadian tastes. The goal will be to remind consumers of the quality, heritage, and value proposition of California wines and to dislodge the newly formed loyalties to competing products. The challenge underscores the broader fragility of international trade relations and their profound, often lasting, impact on specific industries and consumer landscapes, demanding strategic adaptation and resilience from affected sectors.", "vocab": [{"word": "precarious", "definition": "Not safely or securely held or in position; dangerously likely to fall or collapse. In this context, referring to the industry's unstable position."}, {"word": "protracted", "definition": "Lasting for a long time or longer than expected or usual."}, {"word": "repercussions", "definition": "Unintended consequences that are usually negative."}, {"word": "impetus", "definition": "A driving force or stimulus; something that makes a process or activity happen or happen more quickly."}, {"word": "entrenched", "definition": "Firmly established and difficult or unlikely to change; ingrained."}, {"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable; very difficult to overcome."}, {"word": "vintners", "definition": "People who make wine; wine producers."}, {"word": "mitigate", "definition": "To make something less severe, serious, or painful; to lessen the gravity of a situation."}]}}, "questions": [{"q": "What is the main concern for California wine producers regarding the Canadian market?", "a": "The main concern is that Canadian consumers might continue to avoid California wines, even after the trade dispute is resolved, because they have developed new purchasing habits and preferences."}, {"q": "Why might Canadian consumers continue to avoid California wine even after the trade dispute is resolved?", "a": "During the dispute, consumers likely explored and grew accustomed to wines from other regions or countries. Once these new habits are formed and satisfactory alternatives are found, preferences can become deeply entrenched, making it difficult for them to revert to previous choices."}], "id": "a49859d16f8", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikgFBVV95cUxNNEhDX1U3b0d5OXJyLTdDcngxN052amllSjR1REhkZTZVamFaU1dfaW5Ib2ZDNnhxWjhhaEdyUHEwY1VhM1RuUkNkRkdndUJFY3dhLTE3b25iN0ZmVW9qQUI3LWFqNUdiWTdDRW1xNF9SSmlKZU40dVFTSW9lUXhaS1JqZjFrOUpGbXV0NnRxSUlxQQ?oc=5", "published": "2026-10-20T09:39:04+09:00", "category": "business", "category_title": "Business"}, {"headline": "Halsey Real Estate Welcomes Charisse Childers to Team", "excerpt": "Charisse Childers has joined Halsey Real Estate, bringing her experience to help clients buy and sell properties in the local market.", "levels": {"Beginner": {"text": "Charisse Childers has joined Halsey Real Estate. This is a company that helps people buy and sell homes and land. Charisse is now part of their team.\n\nJoining a real estate team means she will work with others to help customers. She will help people find new houses or sell their old ones. This is an important job because buying or selling a home is a big decision for many families.\n\nHalsey Real Estate is happy to have Charisse. They believe she will bring good experience to her new role. Her work will help the company serve more people in the community.\n\nWhen someone joins a company like this, it often means they have skills that can help the business grow. Charisse will likely use her skills to assist clients through the process of buying or selling property. This is good news for the company and for the people who need help with real estate. She will be a new face helping local families.", "vocab": [{"word": "joined", "definition": "became a part of a group or team."}, {"word": "Real Estate", "definition": "the business of buying and selling land and buildings."}, {"word": "team", "definition": "a group of people working together."}, {"word": "customers", "definition": "people who buy goods or services from a company."}, {"word": "community", "definition": "the people living in one particular area or town."}, {"word": "skills", "definition": "abilities to do something well."}]}, "Intermediate": {"text": "Charisse Childers has officially joined the team at Halsey Real Estate, a well-known firm specializing in property transactions. This move marks a significant addition to the company's professional staff, enhancing its capacity to serve clients across the local market.\n\nHalsey Real Estate is recognized for assisting individuals and families with buying, selling, and investing in residential and commercial properties. The firm plays a crucial role in facilitating one of life's most significant financial decisions for many people: acquiring or divesting real estate assets.\n\nIn her new capacity, Ms. Childers is expected to leverage her experience to guide clients through the often-complex processes of real estate transactions. This includes helping buyers find suitable homes, assisting sellers in marketing their properties effectively, and negotiating deals to ensure favorable outcomes for all parties involved. Her expertise will be valuable in navigating market trends, understanding property values, and providing personalized service that meets individual client needs.\n\nThe real estate market can be dynamic and challenging, making the role of an experienced agent invaluable. Agents like Ms. Childers provide essential guidance, from initial property searches and viewings to handling paperwork and closing procedures. Their knowledge helps clients make informed decisions and avoid potential pitfalls.\n\nThe addition of Charisse Childers is anticipated to strengthen Halsey Real Estate's presence and service offerings within the community. Companies often seek experienced professionals to expand their reach and improve client satisfaction. Her involvement is expected to contribute positively to the firm's reputation and its ability to handle a greater volume of business, especially in a competitive sector where client trust is paramount.\n\nThis development is good news for both Halsey Real Estate and its current and prospective clients. With an expanded team, the firm can continue to provide high-quality service, ensuring that property transactions are handled efficiently and professionally. Ms. Childers' arrival underscores the company's commitment to growth and excellence in the local real estate market.", "vocab": [{"word": "firm", "definition": "a company or business."}, {"word": "specializing", "definition": "focusing on a particular area or type of work."}, {"word": "capacity", "definition": "the ability to do something."}, {"word": "leverage", "definition": "to use something effectively to achieve a result."}, {"word": "transactions", "definition": "business deals, especially buying or selling."}, {"word": "dynamic", "definition": "constantly changing and active."}, {"word": "paramount", "definition": "more important than anything else."}]}, "Advanced": {"text": "Halsey Real Estate, a prominent player in the local property market, has announced the strategic addition of Charisse Childers to its esteemed team of real estate professionals. This move is poised to bolster the firm's operational capabilities and deepen its engagement with clients navigating the complexities of property acquisition and disposition.\n\nThe real estate sector is inherently dynamic, characterized by fluctuating market conditions, evolving regulatory frameworks, and intense competition. In such an environment, the recruitment of seasoned professionals like Ms. Childers is a critical component of a firm's growth strategy. Her integration into Halsey Real Estate's ranks is expected to enhance the company's capacity to deliver bespoke services, ranging from residential sales and purchases to commercial leasing and investment advisories.\n\nWhile specific details of Ms. Childers' prior professional engagements were not immediately disclosed, her appointment signals a commitment by Halsey Real Estate to reinforce its expertise. Individuals joining established real estate firms often bring a diverse skill set, including strong negotiation tactics, a comprehensive understanding of local zoning laws, marketing prowess, and robust client relationship management abilities. These attributes are invaluable in guiding clients through what is often one of the most significant financial decisions of their lives.\n\nThe role of a real estate agent has expanded beyond mere transactional facilitation. Today's agents act as trusted advisors, market analysts, and strategic partners, requiring a nuanced understanding of economic indicators, community development, and property valuation methodologies. Ms. Childers' arrival is anticipated to contribute to Halsey Real Estate's ability to offer this holistic support, ensuring clients are well-informed and confident throughout their real estate journey. Her expertise will likely be instrumental in identifying emerging market opportunities and tailoring solutions to diverse client needs.\n\nFor Halsey Real Estate, this strategic hire represents an investment in its future growth and continued market leadership. Expanding the team with experienced talent allows the firm to manage a larger portfolio of listings and cater to a broader client base, thereby strengthening its competitive edge. It also reflects a proactive approach to meeting the demands of an active property market, where local knowledge and personalized service remain paramount. The firm's vision is to consistently provide unparalleled service, and new talent is key to achieving that.\n\nThe broader community stands to benefit as well. A robust and well-staffed real estate firm contributes to the efficiency of the housing market, facilitating smoother transactions and supporting local economic activity. By ensuring that property transactions are handled with professionalism and integrity, firms like Halsey Real Estate play a vital role in fostering trust and stability within the local economy. With Charisse Childers now on board, Halsey Real Estate is better positioned to uphold its reputation for excellence and provide unparalleled service to individuals and businesses seeking expert guidance in the intricate world of real estate.", "vocab": [{"word": "prominent", "definition": "important and well-known."}, {"word": "bolster", "definition": "to support or strengthen something."}, {"word": "acquisition", "definition": "the act of buying or obtaining something, especially property or assets."}, {"word": "disposition", "definition": "the act of selling or getting rid of something, especially property or assets."}, {"word": "inherently", "definition": "in a permanent, essential, or characteristic way."}, {"word": "bespoke", "definition": "custom-made; tailored to individual needs or specifications."}, {"word": "prowess", "definition": "great skill or ability in a particular activity or field."}, {"word": "nuanced", "definition": "having subtle differences in meaning, expression, or quality."}]}}, "questions": [{"q": "Who recently joined Halsey Real Estate?", "a": "Charisse Childers recently joined Halsey Real Estate."}, {"q": "What kind of services does Halsey Real Estate provide to its clients?", "a": "Halsey Real Estate helps clients with buying, selling, and investing in residential and commercial properties, guiding them through complex transactions and market trends."}], "id": "a6cbf23bf13", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxNM3ppYlJCQWxkTk5iSDlJUENVWFZMbHVDUVVnbkVKUjVKZXJkVHdLZ1k2dzhVdUFaRlZaNnFWcmJWemFBMC00RmoyaEhQME00U3pZOF9JYWZIdTBVTjJXdlBSMUw2cmQ0a1hoSjJ5RHFrYjUxZ1U1NVNVaHJnZlNzTEdjR0hLWlZY?oc=5", "published": "2026-10-20T09:26:15+09:00", "category": "business", "category_title": "Business"}, {"headline": "South Korea's Central Bank: Rates Steady Now, Hike Coming", "excerpt": "South Korea's central bank will likely keep interest rates the same in October, but a rate hike is expected in November.", "levels": {"Beginner": {"text": "South Korea's central bank, a big bank that helps manage the country's money, is expected to make an important decision soon. On October 22, the bank will likely decide to keep its main interest rate the same. This means the cost of borrowing money will not change for now.\n\nHowever, many people think the central bank will raise this rate in November. When the central bank raises interest rates, it makes borrowing money more expensive for people and businesses. For example, if you want to take out a loan for a house or a car, it might cost you more each month.\n\nWhy would the bank do this? One main reason is to control prices. If prices for goods and services are going up too fast, it's called inflation. When borrowing money becomes more expensive, people might spend a little less. This can help slow down how fast prices are rising. The central bank wants to keep the country's economy stable and ensure prices don't get too high, which can hurt everyone. This move shows the bank is watching the economy closely.", "vocab": [{"word": "central bank", "definition": "A big bank that manages a country's money and economy."}, {"word": "interest rate", "definition": "The extra money you pay when you borrow money, or earn when you save money."}, {"word": "borrow", "definition": "To take money from a bank or person with the promise to pay it back later."}, {"word": "prices", "definition": "The amount of money you need to pay for something."}, {"word": "inflation", "definition": "When prices for many things go up over time."}, {"word": "economy", "definition": "How a country makes and uses money, goods, and services."}]}, "Intermediate": {"text": "South Korea's central bank, known as the Bank of Korea (BOK), is preparing for a significant policy decision regarding the nation's interest rates. According to recent expectations, the BOK is widely anticipated to maintain its benchmark interest rate at its current level during the upcoming meeting on October 22. This decision would keep borrowing costs stable for the immediate future.\n\nHowever, this stability is expected to be temporary. Financial analysts and economists largely predict that the BOK will proceed with an interest rate hike in November. This move would mark a shift in the central bank's monetary policy, making it more expensive for consumers and businesses to borrow money, for instance, for mortgages or business investments.\n\nThe primary motivation behind such a hike is to address rising inflationary pressures. Like many countries globally, South Korea has seen an increase in the cost of goods and services, driven by factors such as higher commodity prices and disruptions in global supply chains. By raising interest rates, the central bank aims to cool down the economy, reduce consumer spending, and thereby curb the pace of inflation.\n\nWhile controlling inflation is a key objective, the BOK also needs to balance this with supporting economic recovery. The South Korean economy has been recovering from the impact of the global pandemic, and aggressive rate hikes could potentially slow this growth. The expected November hike suggests the central bank believes the economy is robust enough to handle higher borrowing costs, and that tackling inflation and potential financial imbalances, such as rising household debt, is becoming a more pressing concern. This strategic approach reflects the bank's commitment to maintaining long-term price stability and a healthy financial system.", "vocab": [{"word": "benchmark interest rate", "definition": "The main interest rate set by a central bank, which influences other rates in the economy."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the money supply and credit conditions in an economy."}, {"word": "inflationary pressures", "definition": "Factors or conditions that cause prices to rise in an economy."}, {"word": "economic recovery", "definition": "The process of an economy getting stronger and growing again after a period of decline."}, {"word": "curb", "definition": "To limit or control something, often to reduce its negative effects."}, {"word": "robust", "definition": "Strong, healthy, and able to withstand difficult conditions."}, {"word": "financial imbalances", "definition": "Situations where parts of the financial system are not stable or balanced, for example, due to excessive debt."}]}, "Advanced": {"text": "The Bank of Korea (BOK), South Korea's central bank, is poised to maintain its benchmark policy rate at its current level during its scheduled meeting on October 22. This decision, widely anticipated by market analysts, signals a temporary pause before an expected shift towards a more hawkish monetary stance. A significant majority of economists and financial institutions project that the BOK will implement an interest rate hike in November, marking a proactive measure to address burgeoning economic concerns.\n\nThis impending rate adjustment is primarily driven by persistent inflationary pressures that have been building both domestically and globally. South Korea, like many advanced economies, has experienced a surge in consumer prices, fueled by elevated global commodity prices, ongoing disruptions in supply chains, and robust domestic demand. By increasing the policy rate, the BOK aims to temper aggregate demand, thereby mitigating the upward trajectory of inflation and anchoring inflation expectations. Higher borrowing costs for households and businesses, including for mortgages and corporate loans, are intended to cool an overheating economy.\n\nBeyond inflation, the central bank is also grappling with concerns over financial stability, particularly the rapid accumulation of household debt. A gradual normalization of interest rates is seen as a crucial tool to manage these systemic risks, preventing potential asset bubbles and ensuring the long-term health of the financial system. The BOK's communication has increasingly highlighted the need to address these imbalances, even as the economy continues its recovery trajectory from the pandemic-induced downturn.\n\nThe timing of this anticipated hike in November suggests that the BOK assesses the South Korean economy to be sufficiently resilient to absorb tighter monetary conditions. While supporting economic growth remains a key objective, the central bank appears to be prioritizing price stability and financial prudence. This move also aligns with a broader global trend where central banks, including the U.S. Federal Reserve, are contemplating or beginning to taper extraordinary stimulus measures implemented during the pandemic. The BOK's decision reflects a delicate balancing act, navigating global economic headwinds while safeguarding domestic economic stability and future growth prospects. The market will be closely watching the BOK's forward guidance for further clues on the pace and extent of future policy normalization.", "vocab": [{"word": "benchmark policy rate", "definition": "The official interest rate set by a central bank, serving as a reference point for all other interest rates in the economy."}, {"word": "hawkish monetary stance", "definition": "A central bank's policy position that favors higher interest rates to control inflation, even if it means potentially slowing economic growth."}, {"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "aggregate demand", "definition": "The total demand for all goods and services produced in an economy at a given price level and in a given time period."}, {"word": "mitigating", "definition": "Making something less severe, serious, or painful; alleviating."}, {"word": "anchoring inflation expectations", "definition": "The process by which a central bank ensures that people expect inflation to remain stable and predictable, which helps to keep actual inflation stable."}, {"word": "financial prudence", "definition": "The quality of being careful and sensible in managing money and financial affairs, especially to avoid risk or debt."}, {"word": "economic headwinds", "definition": "Factors or conditions that make economic growth more difficult or slower, acting as obstacles."}]}}, "questions": [{"q": "What is the main decision the Bank of Korea is expected to make regarding interest rates in October and November?", "a": "The Bank of Korea is expected to keep interest rates the same in October but is widely predicted to raise them in November."}, {"q": "What are two main reasons why the central bank might decide to raise interest rates?", "a": "The central bank might raise interest rates to control rising prices (inflation) and to manage concerns about financial stability, such as increasing household debt."}], "id": "a2acdd44d9b", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxNRlhEb1c1OS1kZy1wc0paMktybGc1SFAxMlZSLWVEUXZQaHdNOTExdXZOMmtWbWZ1LVNzVEVUOTNSUWxwZ3VMaXFNVDd0VUV3SWdRYTZKcXdaQlB6SWpXeFhsMjcxUkZubVB3R1Y3SUhMY1B3Z29lalI2S2FjLVh3TDNmNTVxbTZHa3pxTl83emVjdjQ5MFNJUnd1NEpIZXJUWUh1ODZPekpZTjR6b01DeWxoa1ZGQQ?oc=5", "published": "2026-10-20T09:42:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "China's Central Bank Expected to Set Yuan Exchange Rate", "excerpt": "Reuters estimates China's central bank will set the yuan's daily reference rate against the US dollar at 6.6813.", "levels": {"Beginner": {"text": "China has a special bank called the PBOC. PBOC stands for People's Bank of China. It is China's central bank. This bank helps manage China's money. One important job is to set the value of China's money, called the yuan.\n\nEvery day, the PBOC tells the market a special number. This number is called the reference rate. It shows how much one US dollar is worth in yuan. For example, if the rate is 6.6813, it means one US dollar can buy 6.6813 yuan.\n\nA news group called Reuters thinks the PBOC will set this rate at 6.6813 today. This is an estimate, meaning it's what Reuters expects to happen. The PBOC uses this rate to guide the market. It helps keep the yuan's value stable.\n\nA stable yuan is good for China's economy. It helps businesses that sell things to other countries. It also helps control prices inside China. The PBOC watches the economy closely. It makes decisions to help China's money stay strong and steady. This daily rate is a key tool for them.", "vocab": [{"word": "Central bank", "definition": "A main bank that manages a country's money."}, {"word": "Yuan", "definition": "The money used in China."}, {"word": "Reference rate", "definition": "A special number set daily to show money's value."}, {"word": "Estimate", "definition": "A guess about what will happen."}, {"word": "Stable", "definition": "Staying mostly the same, not changing much."}, {"word": "Economy", "definition": "How a country makes and uses money and goods."}]}, "Intermediate": {"text": "The People's Bank of China (PBOC), which serves as China's central bank, is expected to announce its daily reference rate for the yuan against the US dollar. According to an estimate from Reuters, the rate is anticipated to be set at 6.6813. This daily fixing is a crucial tool the PBOC uses to manage the value of its national currency, the yuan (also known as the renminbi).\n\nUnlike many major currencies that float freely based purely on market demand, the yuan operates within a managed float system. This means the PBOC plays an active role in influencing its exchange rate. Each morning, before the domestic market opens, the central bank sets a \"mid-point\" reference rate. The yuan is then allowed to trade within a narrow band, typically 2% above or below this reference rate.\n\nThe PBOC's management of the yuan's value is important for several reasons. A stable and predictable exchange rate helps Chinese exporters by making their goods more competitive in international markets. It also helps to control inflation by influencing the cost of imported goods. Furthermore, it contributes to overall financial stability within China's economy.\n\nThe specific rate of 6.6813 suggests the PBOC's current stance on the yuan's valuation. While Reuters' figure is an estimate, it provides insight into market expectations regarding the central bank's policy. The PBOC considers various factors when determining this rate, including economic data, international trade balances, and the performance of other major currencies. By setting this daily rate, the PBOC aims to balance the needs of its export-oriented economy with broader goals of economic stability and growth. This ongoing management ensures the yuan remains a key element in global trade while serving China's domestic economic objectives.", "vocab": [{"word": "Central bank", "definition": "A national bank that controls a country's money supply and banking system."}, {"word": "Reference rate", "definition": "A daily exchange rate set by a central bank to guide currency trading."}, {"word": "Managed float", "definition": "An exchange rate system where a currency's value is influenced by the central bank, not just market forces."}, {"word": "Exporters", "definition": "Companies or individuals who sell goods to other countries."}, {"word": "Inflation", "definition": "The rate at which prices for goods and services rise, and purchasing power falls."}, {"word": "Valuation", "definition": "The process of determining the current worth of something, like a currency."}, {"word": "Economic stability", "definition": "A state where a country's economy is not experiencing large fluctuations or crises."}]}, "Advanced": {"text": "The People's Bank of China (PBOC), the nation's influential central bank, is anticipated to establish its daily reference rate for the yuan (also known as the renminbi) against the US dollar at 6.6813, according to a Reuters estimate. This daily \"fixing\" is a cornerstone of China's meticulously managed currency regime, offering a crucial barometer of the PBOC's policy intentions and its ongoing efforts to steer the yuan's trajectory.\n\nUnlike currencies that operate under a pure free-float system, where market forces of supply and demand solely dictate value, the yuan adheres to a managed float. This framework grants the PBOC significant latitude in influencing the exchange rate. Each trading day, before the onshore market commences, the central bank announces a mid-point reference rate. The yuan is then permitted to trade within a prescribed band, typically 2% either side of this central parity rate. This mechanism allows for some market-driven movement while preventing excessive volatility and speculative attacks.\n\nThe PBOC's proactive management of the yuan's valuation is driven by a multifaceted array of economic objectives. A carefully calibrated exchange rate is instrumental in bolstering China's vast export sector, ensuring that Chinese goods remain competitively priced in global markets. Simultaneously, it serves as a vital tool for macroeconomic stability, helping to mitigate imported inflation by influencing the cost of foreign goods and raw materials. Furthermore, a predictable currency environment is conducive to fostering foreign direct investment and maintaining overall financial equilibrium within the world's second-largest economy.\n\nThe Reuters estimate of 6.6813 offers market participants a preliminary glimpse into the PBOC's likely stance. While not an official announcement, such estimates, often derived from surveys of financial institutions, provide valuable insights into prevailing market sentiment and expectations. The central bank's decision-making process for setting this daily rate is complex, integrating a broad spectrum of indicators. These include domestic economic performance, inflation outlook, global trade dynamics, capital flows, and the movements of other major currencies, particularly the US dollar. The PBOC also considers its broader monetary policy goals, such as supporting economic growth or rebalancing the economy towards domestic consumption.\n\nThe ongoing debate surrounding the yuan's exchange rate often centers on the balance between market liberalization and state control. Critics of China's managed float argue that it can distort global trade balances, while proponents contend it provides essential stability for a developing economy undergoing profound structural transformation. By meticulously adjusting the daily reference rate, the PBOC navigates these intricate pressures, aiming to optimize the yuan's role as both a facilitator of international commerce and a pillar of China's domestic economic resilience. This daily ritual underscores the unique nature of China's financial system and its profound implications for global finance.", "vocab": [{"word": "Anticipated", "definition": "Expected or looked forward to."}, {"word": "Cornerstone", "definition": "The fundamental or essential part of something."}, {"word": "Meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "Trajectory", "definition": "The path or course followed by a moving object or a developing idea/situation."}, {"word": "Latitude", "definition": "Freedom to choose how to act or what to do."}, {"word": "Instrumental", "definition": "Serving as a crucial means, agent, or tool."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "Conducive", "definition": "Making a certain situation or outcome likely or possible."}]}}, "questions": [{"q": "What is the name of China's central bank mentioned in the article?", "a": "The People's Bank of China (PBOC)."}, {"q": "What is the main function of the daily reference rate set by the PBOC?", "a": "It guides the market value of the yuan and helps the PBOC manage the currency's stability."}], "id": "aa7435e76e7", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPUU1YMEt3Tm5ockktdkh1MFBaekZqV081S29xeVA5UjUyYnljRUhub0c5VGJKUTZRMkVYZTlLQ21MSUFoYlFjbk1FX056ZGJIdlgwY0RFRnY0Rl90aXFBMGtWR01JUXktd3NmNGdUQUgyUWJ2enhaM2ZfVE9xWWVJeUNnNVVDSWcwM3lxME04c0JWcXEwOUxHd21YY1JJQzJYQ2 const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
