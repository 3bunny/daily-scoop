iety has learned. The series, which starred Tracy Morgan in the title role, originally debuted on Paramount+ back in November 2025. News of the series ending comes as little surprise, as it failed to find a significant audience upon its debut and considering Morgan’s […]", "vocab": []}}, "questions": [], "id": "a67dad6a340", "source": "Variety", "link": "https://variety.com/2026/tv/news/crutch-canceled-paramount-plus-1236809888/", "published": "2026-07-25T07:00:00+09:00", "category": "entertainment"}, {"headline": "First look: Vinyl Room opens at Mandalay Bay with Las Vegas music-inspired design - FOX5 Vegas", "excerpt": "First look: Vinyl Room opens at Mandalay Bay with Las Vegas music-inspired design FOX5 Vegas", "levels": {"Beginner": {"text": "First look: Vinyl Room opens at Mandalay Bay with Las Vegas music-inspired design FOX5 Vegas", "vocab": []}, "Intermediate": {"text": "First look: Vinyl Room opens at Mandalay Bay with Las Vegas music-inspired design FOX5 Vegas", "vocab": []}, "Advanced": {"text": "First look: Vinyl Room opens at Mandalay Bay with Las Vegas music-inspired design FOX5 Vegas", "vocab": []}}, "questions": [], "id": "a126e9dd65c", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxNcDAwOUlrTm1obGJodzFYUE9ncUtzaHdqOGo0amU4azRzTnpIVGZobUI5N3RDdnVmYUxadXpsckFNTzdsbHJ4RWR5bFEwQnBsaUp3VjhQdWNYa29NWHZQb3FNdmpCY2dVcUpqOFA4VXoxRVJuS1hYNVQ5TlI2RVZRcFFnVGNVUmlBdXpzYUJWMDM0MkwyMWFHenpMRHlYZzdCWElkR21jSGsxMFllQmJWVkVWWDU3Zw?oc=5", "published": "2026-07-25T06:57:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Detroit Fans Divided on Potential Tarik Skubal Trade", "excerpt": "Detroit Tigers fans are discussing whether their star pitcher, Tarik Skubal, should be traded to another team for future talent.", "levels": {"Beginner": {"text": "Tarik Skubal is a very good pitcher for the Detroit Tigers baseball team. Many fans in Detroit love watching him play. But now, people are talking about a big idea: could Tarik Skubal be traded to a different team? A trade means one team sends a player to another team. In return, the first team gets other players or things that can help them. Fans of the Tigers have different thoughts about this. Some fans want the team to keep Tarik Skubal. They think he helps the Tigers win games now. They like seeing him pitch for Detroit. Other fans think trading him might be a good idea for the future. They believe if the Tigers trade Skubal, they could get many young, good players. These new players could help the team become much stronger in a few years. So, it's a hard choice for the team. Do they keep their star pitcher now, or do they trade him to get ready for a better future? People in Detroit are talking a lot about what the Tigers should do with Tarik Skubal. It's a big decision for the team and its fans.", "vocab": [{"word": "pitcher", "definition": "A player who throws the ball from the mound to the batter in baseball."}, {"word": "team", "definition": "A group of players who play a sport together against another group."}, {"word": "trade", "definition": "To exchange a player for other players or assets with another team."}, {"word": "fans", "definition": "People who like and support a sports team or player."}, {"word": "future", "definition": "The time that will come after the present."}, {"word": "decision", "definition": "A choice that someone makes after thinking about it."}]}, "Intermediate": {"text": "The Detroit Tigers' talented left-handed pitcher, Tarik Skubal, has become the subject of much discussion among fans and sports analysts. The question on everyone's mind is whether the Tigers might trade him to another team. A potential trade involves sending a player to a different organization in exchange for other players, often younger prospects, or valuable assets like draft picks. Skubal is considered a valuable asset because he is a high-performing pitcher who is still relatively young and under team control for several more seasons. This means his salary is controlled by the team, making him very attractive to other clubs. Tigers fans are divided on what the team should do. One group believes the Tigers should keep Skubal. They see him as a cornerstone of the current team, a player who helps them win games now and could be part of a future championship contender. Trading him, they argue, would be a step backward for a team that needs star power. However, another significant portion of the fanbase believes that trading Skubal could be a smart strategic move for the team's long-term future. The Tigers have been in a rebuilding phase for several years, aiming to develop young talent. By trading a highly sought-after player like Skubal, the team could acquire a large package of promising young prospects. These prospects could then form the core of a stronger team in the coming years. The Detroit Free Press has reported on these fan discussions, highlighting the difficult decision facing the Tigers' front office. It's a classic sports dilemma: pursue immediate success with a star player, or build for a stronger future by trading him for young talent.", "vocab": [{"word": "talented", "definition": "Having a natural ability to do something well."}, {"word": "discussion", "definition": "The act of talking about something with other people."}, {"word": "potential", "definition": "Possible in the future, but not yet actual."}, {"word": "valuable", "definition": "Worth a lot of money or very useful."}, {"word": "prospects", "definition": "Young players who are expected to become good in the future."}, {"word": "rebuilding", "definition": "The process of making a team strong again by acquiring new, often young, players."}, {"word": "dilemma", "definition": "A situation in which a difficult choice has to be made between two or more alternatives."}]}, "Advanced": {"text": "The Detroit Tigers' ace left-hander, Tarik Skubal, finds himself at the epicenter of intense trade speculation, a topic that has deeply divided the team's passionate fanbase and ignited considerable discussion among sports pundits. As the trade deadline approaches, the question of whether the Tigers should move their highly coveted pitcher has become a central strategic dilemma for the organization. Skubal's value is exceptionally high. He is a young, dominant starter with a proven track record of elite performance, and crucially, he remains under team control for several more seasons through the arbitration process. This contractual situation makes him an incredibly attractive asset for any contending team looking to bolster its rotation, as they would acquire a top-tier pitcher without the immediate burden of a massive long-term free-agent contract. For many Tigers supporters, the notion of trading Skubal is anathema. They view him as the undisputed ace, a foundational piece around whom a competitive team should be built. Keeping him, they argue, signals a commitment to winning in the near term and provides fans with an immediate reason for optimism, especially as the team endeavors to emerge from a prolonged period of rebuilding. His presence offers a tangible connection to potential success and a star player to rally behind. Conversely, a substantial segment of the fanbase and many baseball analysts advocate for maximizing Skubal's trade value. Given the Tigers' current position – a team still very much in a rebuilding phase with a farm system that, while improving, could benefit from an influx of high-end talent – trading Skubal now could yield a monumental return. Such a package would likely include multiple top prospects, potentially accelerating the team's timeline to contention by several years. This strategic approach prioritizes the long-term health and sustainability of the franchise over short-term gains, acknowledging that one star pitcher, however brilliant, cannot single-handedly transform a team into a championship contender. The Detroit Free Press has extensively covered the divergent opinions within the fanbase, underscoring the complex calculus facing the Tigers' front office. It's a classic organizational tightrope walk: balancing the desire for immediate fan gratification and competitive relevance with the imperative to construct a sustainable winner for the future. The decision regarding Tarik Skubal will undoubtedly be a defining moment for the current Tigers' regime.", "vocab": [{"word": "epicenter", "definition": "The central point of something, often a difficult or intense situation."}, {"word": "speculation", "definition": "The forming of a theory or conjecture without firm evidence; guessing about future events."}, {"word": "dilemma", "definition": "A situation in which a difficult choice has to be made between two or more alternatives, especially equally undesirable ones."}, {"word": "arbitration", "definition": "A process in sports where an independent third party helps resolve contract disputes between a player and a team, typically for players with a certain amount of service time."}, {"word": "anathema", "definition": "Something or someone that one vehemently dislikes; a strong curse or condemnation."}, {"word": "foundational", "definition": "Serving as a base or foundation; fundamental."}, {"word": "maximizing", "definition": "Making the most of something; increasing it to its greatest possible extent."}, {"word": "imperative", "definition": "Of vital importance; crucial; a command or urgent requirement."}]}}, "questions": [{"q": "What is the main topic of discussion among Detroit Tigers fans?", "a": "The main topic of discussion is the potential trade of their pitcher, Tarik Skubal."}, {"q": "What are the two main reasons fans give for either keeping or trading Tarik Skubal?", "a": "Some fans want to keep him because he helps the team win games now. Other fans want to trade him to get young players (prospects) to build a stronger team for the future."}], "id": "af432340a7f", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiygFBVV95cUxNX0FiSTZHTVl4a0lQU29YWU9SMEMydnhrS0xudHFjM3ZVRndEa0FOUkNmcGJuQWoyaUtUUHY4QjN6MVoxencyRnlUclVfRDJKZDRrdkhlaVVrMlYtU2pkcnEwMERGSERURW5DQ3RtTUstY21zblkzSUtKSE01SkV2NnVkZVZRWnpnS1dMNjRDSVc5dzRIS08yVDhieHI3ak5vZkk1ZXdHYnZ5RzVnZHJQWmVSZHRCcXZKYm01Q05XWW5LUTdVVFUzQVJ3?oc=5", "published": "2026-07-25T07:41:10+09:00", "category": "business", "category_title": "Business"}, {"headline": "Red Sox Trade Deadline Nears Amid Rumors", "excerpt": "With the Major League Baseball trade deadline approaching in just ten days, the Boston Red Sox are at the center of various player trade rumors.", "levels": {"Beginner": {"text": "The Boston Red Sox baseball team is in the news. There are many \"rumors\" about them. Rumors are talks about things that might happen, but are not certain. These rumors are about players. The Red Sox might trade some players. To \"trade\" means to exchange players with another team.\n\nWhy do teams trade players? They want to make their team stronger. They want to win more games. There is a special day coming soon. It is called the \"trade deadline.\" This is the last day teams can trade players.\n\nThe deadline is only 10 days away. So, the Red Sox need to decide fast. Will they trade players to help them win now? Or will they trade players for future players? Fans are watching closely. They want to know what the Red Sox will do. It's an important time for the team. Everyone hopes the team will improve and play well. This decision can change how the team plays for the rest of the season and even next year. The team wants to be the best it can be.", "vocab": [{"word": "Rumors", "definition": "Talks about things that might happen, but are not certain."}, {"word": "Trade", "definition": "To exchange something, like players between teams."}, {"word": "Deadline", "definition": "A specific time or date by which something must be completed."}, {"word": "Team", "definition": "A group of people who play a sport together."}, {"word": "Players", "definition": "People who play a sport."}, {"word": "Improve", "definition": "To make something better."}]}, "Intermediate": {"text": "The Boston Red Sox are currently a major topic in baseball news as the Major League Baseball (MLB) trade deadline rapidly approaches. With just ten days left until the deadline, speculation is high regarding which players the Red Sox might acquire or trade away.\n\nThe trade deadline is a crucial date in the MLB calendar. It's the last opportunity for teams to exchange players before the end of the regular season. For teams like the Red Sox, this period involves significant strategic decisions.\n\nTeams generally fall into two categories at the deadline: \"buyers\" or \"sellers.\" Buyers are teams that believe they have a chance to make the playoffs and win a championship. They look to acquire talented players to bolster their current roster. Sellers, on the other hand, are teams that are not performing well. They often trade their experienced players to other teams in exchange for younger players, known as \"prospects,\" or future draft picks, aiming to rebuild for the next season.\n\nThe Red Sox's position often dictates their approach. If they are performing strongly, they might seek to add a key pitcher or a powerful hitter to strengthen their lineup for a playoff push. If their season has been disappointing, they might consider trading veteran players to gain assets for the future. Fans and analysts are closely watching the team's management to see what strategy they will adopt. The decisions made in the next ten days could significantly impact the Red Sox's performance for the remainder of this season and set the stage for their long-term trajectory. This period is always filled with intense discussions and potential surprises.", "vocab": [{"word": "Speculation", "definition": "Thinking or guessing about something without having all the facts."}, {"word": "Crucial", "definition": "Extremely important or essential."}, {"word": "Acquire", "definition": "To get or obtain something."}, {"word": "Roster", "definition": "The list of players on a sports team."}, {"word": "Prospects", "definition": "Young players who are expected to become good in the future."}, {"word": "Strategy", "definition": "A plan of action designed to achieve a long-term or overall aim."}, {"word": "Trajectory", "definition": "The path or course that something is following or will follow."}]}, "Advanced": {"text": "The Boston Red Sox organization finds itself at a pivotal juncture as the Major League Baseball (MLB) trade deadline looms, now just ten days away. The air is thick with rumors and intense speculation regarding potential player movements, a common phenomenon as teams across the league strategize for both immediate success and future sustainability.\n\nThe MLB trade deadline is arguably one of the most significant dates on the professional baseball calendar. It represents the final opportunity for franchises to engage in player transactions before the postseason push, forcing front offices to make critical decisions that can have profound ramifications for their current season and long-term trajectory.\n\nTeams typically approach the deadline as either \"buyers\" or \"sellers.\" Contending teams, or \"buyers,\" are those firmly in the playoff hunt, seeking to bolster their existing roster with proven talent to enhance their championship aspirations. They might target a veteran starting pitcher, a reliable bullpen arm, or a power bat to address specific weaknesses. Conversely, \"sellers\" are teams that have underperformed and are looking towards the future. They often trade valuable, experienced players whose contracts are expiring or who command high salaries, in exchange for promising young prospects, international bonus pool money, or future draft capital. This strategy aims to replenish their farm system and rebuild for subsequent seasons.\n\nThe Red Sox's management faces the arduous task of navigating these complex market dynamics. Their current standing in the league will heavily influence their approach. Are they legitimate contenders who should invest in high-impact acquisitions, potentially sacrificing future assets? Or is their performance indicative of a need to recalibrate, perhaps by moving some veteran players to acquire younger talent and improve the farm system? The balance between short-term competitiveness and long-term organizational health is a constant challenge.\n\nThe decisions made in the coming days will not only shape the Red Sox's roster for the remainder of the season but will also send a clear message to the fanbase about the club's direction. These transactions often involve intricate negotiations, salary considerations, and the evaluation of player value, making the period leading up to the deadline a hotbed of activity and potential surprises for fans and analysts alike. The outcome will undoubtedly set the tone for the team's immediate future and its strategic path forward.", "vocab": [{"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Juncture", "definition": "A particular point in events or time, especially a critical one."}, {"word": "Looming", "definition": "(Of an event regarded as threatening or significant) about to happen."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "Bolster", "definition": "To support or strengthen."}, {"word": "Aspirations", "definition": "A strong hope or ambition of achieving something."}, {"word": "Arduous", "definition": "Involving or requiring strenuous effort; difficult and tiring."}, {"word": "Trajectory", "definition": "The path or course that something is following or will follow, often referring to a development or progression."}]}}, "questions": [{"q": "What is the main topic of the news article?", "a": "The main topic is the Boston Red Sox and the rumors surrounding potential player trades as the MLB trade deadline approaches."}, {"q": "What is the purpose of the trade deadline in baseball?", "a": "The trade deadline is the last day teams can exchange players, allowing them to either improve their roster for a playoff push or trade players for future assets if they are rebuilding."}], "id": "ae0322961e5", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikgFBVV95cUxQZTM2MGZOUnVqZVNReUIxV0V6ZEdNYlNYcG9vRU5hcTNjcTJLY2xiS24yX0p2XzRTdmN5UXpELWdhdXkxeTdzZGtGcXVtMTdpMV8ybWFHR2FnME12NWxIaDJtN0xQZEJQVVhtTExnbTJ0ajQxeEJfT2tRRDhGV0VFb09KdTFMR2JtUnA2V28xVnRVdw?oc=5", "published": "2026-07-25T07:28:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "ECB Seeks Public Input on New Euro Banknote Designs", "excerpt": "The European Central Bank has unveiled new euro banknote designs, seeking public opinion on safer, more durable, and greener currency.", "levels": {"Beginner": {"text": "The European Central Bank (ECB) wants to make new euro money. They have shown some ideas for new designs. People can now look at these designs and say what they think. This is a chance for everyone to help choose how the new euro banknotes will look.\n\nThe ECB said the new money will be better in a few ways. First, it will be safer. This means it will be harder for bad people to copy the money. Second, the new banknotes will last longer. They will be stronger, so they won't get old or torn quickly. Third, making the new money will be \"greener.\" This means it will be better for our planet and use less harmful things when printed.\n\nThe euro is the money used by many countries in Europe. It is important for this money to be modern and safe. The ECB will choose the final design by the end of this year. So, soon we will know what the new euro money will look like.", "vocab": [{"word": "banknotes", "definition": "Paper money."}, {"word": "designs", "definition": "The way something looks or is planned."}, {"word": "safer", "definition": "More protected from danger or harm."}, {"word": "last longer", "definition": "To stay in good condition for more time."}, {"word": "greener", "definition": "Better for the environment; less harmful to the planet."}, {"word": "choose", "definition": "To pick one thing from a group."}]}, "Intermediate": {"text": "The European Central Bank (ECB) has taken a significant step towards updating the euro banknotes by unveiling a shortlist of potential new designs. The public is now invited to provide their feedback on these proposed looks, playing a direct role in shaping the future appearance of Europe's common currency. This public consultation period is an important part of the selection process.\n\nThe initiative to redesign the banknotes stems from several key objectives. Firstly, the ECB aims to enhance the security features of the new bills, making them more difficult to counterfeit. This is crucial for maintaining trust in the currency. Secondly, the new banknotes are intended to be more durable, meaning they will withstand daily use for a longer period before needing replacement. This not only improves user experience but also has economic benefits.\n\nFurthermore, a significant focus is on ensuring a \"greener\" production process. The ECB is committed to reducing the environmental impact of manufacturing currency, aligning with broader European sustainability goals. This involves exploring more eco-friendly materials and production methods.\n\nThe euro is the official currency for 20 of the 27 member states of the European Union, used by over 340 million people. Modernizing its physical form is a complex but necessary task. The current series of euro banknotes has been in circulation for many years, and periodic updates are essential to stay ahead of counterfeiting technologies and to reflect contemporary values. The final design is expected to be announced by the end of the year, marking a new chapter for the euro.", "vocab": [{"word": "unveiling", "definition": "Showing something new for the first time."}, {"word": "feedback", "definition": "Opinions or reactions to something."}, {"word": "initiative", "definition": "A new plan or process to achieve something."}, {"word": "enhance", "definition": "To improve or make better."}, {"word": "counterfeit", "definition": "To make a fake copy of something, like money, to deceive."}, {"word": "durable", "definition": "Able to last a long time, even with frequent use."}, {"word": "sustainability", "definition": "Using resources in a way that does not harm the environment for future generations."}]}, "Advanced": {"text": "The European Central Bank (ECB) has advanced its plans for the next generation of euro banknotes by publicly presenting a shortlist of innovative design concepts. This move initiates a crucial phase of public consultation, inviting citizens across the Eurozone to contribute their perspectives and preferences, thereby directly influencing the aesthetic and thematic direction of the currency used by over 340 million people. This participatory approach underscores the ECB's commitment to ensuring the banknotes resonate with the diverse populace they serve.\n\nThe impetus behind this comprehensive redesign endeavor is multifaceted, addressing both practical and strategic considerations. Paramount among these is the imperative to bolster the security features of the banknotes. As counterfeiting technologies evolve, a robust update is essential to mitigate the risks of fraud and maintain public confidence in the integrity of the euro. The new series aims to incorporate cutting-edge anti-counterfeiting measures, making the currency more secure against illicit replication.\n\nBeyond security, a significant objective is to enhance the durability of the banknotes. By employing more resilient materials and advanced printing techniques, the ECB seeks to extend the lifespan of each note, reducing the frequency of replacements and, consequently, the environmental footprint associated with production. This focus on longevity also translates into improved cost-efficiency for the Eurosystem.\n\nFurthermore, the ECB is placing a strong emphasis on the environmental sustainability of the entire production lifecycle. This commitment aligns with broader European Union objectives for a greener economy. The new banknotes are envisioned to be produced using more eco-friendly materials and processes, minimizing their ecological impact from manufacturing to disposal. This holistic approach reflects a growing global awareness of environmental responsibility.\n\nThe euro, serving as the official currency for 20 of the 27 EU member states, is not merely a medium of exchange but also a symbol of European integration and identity. Periodic redesigns, such as this one, are vital not only to preempt counterfeiting threats but also to ensure the currency remains modern, relevant, and reflective of contemporary European values. The current \"Europa series\" has been in circulation for a considerable period, necessitating an update. The public's input will now be meticulously reviewed, with the final design selection anticipated by the close of the year, heralding a new era for Europe's physical currency.", "vocab": [{"word": "innovative", "definition": "Featuring new methods; advanced and original."}, {"word": "initiates", "definition": "Causes something to begin; starts."}, {"word": "participatory", "definition": "Involving the active participation of many people."}, {"word": "impetus", "definition": "The force or energy with which a body moves; a driving force or motivation."}, {"word": "paramount", "definition": "More important than anything else; supreme."}, {"word": "bolster", "definition": "To support or strengthen."}, {"word": "mitigate", "definition": "To make less severe, serious, or painful."}, {"word": "resilient", "definition": "Able to withstand or recover quickly from difficult conditions."}]}}, "questions": [{"q": "What are three main goals for the new euro banknote designs?", "a": "The new euro banknotes are meant to be safer, more durable, and involve greener production."}, {"q": "When is the final design for the new euro banknotes expected to be announced?", "a": "The final design is expected to be announced by the end of the year."}], "id": "a1444f27434", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi4AFBVV95cUxPVE5feGlrN3BWVlVGOHAyVmVBSVNseWdoMXItVlpQc0pKamJYZFRnQ2ZaWEdQdnZ6OHRJQlgwUk5FMHNlUWp6ZWJ2NlRWdU1nekpuUTJHMFBQX1RQd2o5eDZadFl3QlpvQlIwT3hBY09nVnBPNHF6X25TNktITzNJMnE5cnEycDViSU1RU196YTZDbzJHaVA1Yy1KQXBVV2hzYUp2RFpOLUZjQ0haZHFlb29VSlhSMWdxREZvdzZqQXprcHE3cXJSZWpLQUVBQ1FEdERkb2VlWThwLU5rdXZrYg?oc=5", "published": "2026-07-25T07:50:22+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "ECB Officials Suggest Fewer Rate Hikes Ahead", "excerpt": "ECB officials signal future interest rate increases might be less frequent or large than anticipated.", "levels": {"Beginner": {"text": "The European Central Bank (ECB) helps manage money for countries that use the Euro. Recently, some people thought the ECB would raise interest rates many times. Raising interest rates means it costs more to borrow money.\n\nBut now, officials from the ECB are saying that they might not raise rates as much as expected. This means the cost of borrowing money might not go up so fast.\n\nThe ECB's job is to keep prices stable. When prices go up too quickly, it's called inflation. Raising interest rates can help slow down inflation. However, raising rates too much can also slow down the economy.\n\nSo, ECB officials are trying to find a balance. They want to stop prices from rising too much, but they also want to help the economy stay strong. Their recent comments suggest they are thinking carefully about how many more times they should raise rates. This news is important for businesses and people who borrow money in Europe.", "vocab": [{"word": "European Central Bank (ECB)", "definition": "A big bank that helps manage money for countries in Europe that use the Euro."}, {"word": "Officials", "definition": "Important people who work for an organization, like the ECB."}, {"word": "Interest rates", "definition": "The extra money you pay when you borrow money, or the money you earn when you save it."}, {"word": "Raise", "definition": "To make something higher or bigger."}, {"word": "Inflation", "definition": "When the prices of things like food and clothes go up quickly."}, {"word": "Economy", "definition": "The system of how money is made and used in a country or region."}]}, "Intermediate": {"text": "Officials from the European Central Bank (ECB) are indicating that the pace and scale of future interest rate increases might be less aggressive than financial markets had anticipated. This signals a potential shift in the central bank's approach to monetary policy, following a period of significant rate hikes aimed at taming high inflation across the Eurozone.\n\nThe ECB is the central bank for the 20 countries that use the Euro currency. Its primary mandate is to maintain price stability, meaning keeping inflation at a target of 2%. Over the past year, the ECB, like many other central banks globally, has been raising its key interest rates to combat rapidly rising prices. Higher interest rates make borrowing more expensive for consumers and businesses, which in turn can reduce spending and cool down inflationary pressures.\n\nHowever, these rate hikes also carry the risk of slowing down economic growth too much, potentially leading to a recession. The recent comments from ECB officials suggest they are carefully weighing these risks. They might believe that the previous rate increases are already having the desired effect on inflation, or they might be concerned about the resilience of the Eurozone economy.\n\nThis downplaying of further aggressive rate hikes could provide some relief to borrowers and businesses, as it implies that the cost of loans might not climb as steeply as once feared. Investors and analysts will now be closely watching for more details on the ECB's future policy decisions, as these will have a significant impact on the economic outlook for Europe.", "vocab": [{"word": "European Central Bank (ECB)", "definition": "The central bank responsible for monetary policy for the 20 countries that use the Euro."}, {"word": "Interest rate increases", "definition": "Decisions by a central bank to make the cost of borrowing money higher."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Monetary policy", "definition": "The actions taken by a central bank to control the supply of money and credit to achieve economic goals."}, {"word": "Economic growth", "definition": "An increase in the amount of goods and services produced in a country or region."}, {"word": "Price stability", "definition": "The goal of a central bank to keep inflation low and predictable, usually around 2%."}, {"word": "Eurozone", "definition": "The group of European Union member states that have adopted the euro as their common currency."}]}, "Advanced": {"text": "Officials within the European Central Bank (ECB) are reportedly tempering expectations for an aggressive continuation of interest rate hikes, suggesting a potentially less hawkish stance in the coming months. This development indicates a nuanced recalibration of the central bank's monetary policy strategy, following a sustained period of significant tightening designed to bring down persistent inflation across the Eurozone.\n\nThe ECB, as the monetary authority for the 20 nations comprising the Eurozone, operates with a primary mandate of achieving and maintaining price stability, targeting an annual inflation rate of 2%. In response to a surge in inflationary pressures, largely driven by supply chain disruptions, energy price volatility, and robust demand, the ECB embarked on an unprecedented series of rate increases over the past year. These hikes aimed to cool the economy by making borrowing more expensive, thereby dampening aggregate demand and curbing price growth. The impact of these moves extends beyond direct borrowing costs, affecting everything from mortgage rates to corporate investment decisions.\n\nHowever, the cumulative impact of these successive rate adjustments is now a significant consideration. There is a growing recognition among policymakers that overly aggressive tightening could precipitate an unwarranted economic deceleration or even a recession, potentially undermining the very stability the bank seeks to foster. The recent rhetoric from ECB officials suggests a belief that the transmission mechanism of previous rate hikes is effectively working its way through the economy, and that the existing policy stance may be sufficient to guide inflation back towards the target without further drastic measures. This perspective often aligns with a \"dovish\" outlook, prioritizing economic growth stability alongside inflation control.\n\nThis downplaying of additional substantial rate increases could significantly influence market sentiment, potentially leading to a moderation in bond yields and a slight easing of financial conditions. For businesses and consumers, it implies that the cost of capital and borrowing might not escalate as sharply as previously feared, offering some reprieve and potentially supporting investment. However, the ECB remains vigilant, emphasizing a data-dependent approach. Future decisions will hinge on incoming economic indicators, particularly inflation data, wage growth, and the overall macroeconomic outlook for the Eurozone. The delicate balancing act involves ensuring price stability while safeguarding against an undue contraction in economic activity, a challenge that continues to define central bank policy globally amidst varying economic conditions and fiscal policies across member states.", "vocab": [{"word": "Monetary policy", "definition": "The strategies employed by a central bank to manage the money supply and credit conditions, influencing interest rates and economic activity."}, {"word": "Hawkish", "definition": "A stance in monetary policy that favors higher interest rates to control inflation, even if it risks slowing economic growth."}, {"word": "Inflationary pressures", "definition": "Factors or forces that tend to cause a general rise in prices and a fall in the purchasing power of money."}, {"word": "Economic deceleration", "definition": "A slowdown in the rate of economic growth."}, {"word": "Market sentiment", "definition": "The overall attitude of investors toward a particular market or financial instrument."}, {"word": "Transmission mechanism", "definition": "The process by which changes in monetary policy (like interest rate adjustments) affect the broader economy."}, {"word": "Data-dependent approach", "definition": "A policy-making strategy that relies heavily on the latest economic statistics and indicators to guide decisions."}, {"word": "Dovish", "definition": "A stance in monetary policy that favors lower interest rates to stimulate economic growth, even if it risks higher inflation."}]}}, "questions": [{"q": "What is the main message from European Central Bank officials?", "a": "European Central Bank officials are suggesting that future interest rate increases might not be as frequent or large as some people expected."}, {"q": "Why do central banks like the ECB typically raise interest rates?", "a": "Central banks raise interest rates to combat inflation, which is when prices for goods and services rise too quickly. Higher rates make borrowing more expensive, which can slow down spending and cool the economy."}], "id": "ab82756d0a4", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipAFBVV95cUxNWTdfM3B0aWY0dzk0ZDhDWmdxbnloUHhZZXo1dS1BdGZiTlBxSF9BSTBFNUFvRFdyc1k0Y2NpVEFpMnJwVzNPU2hmbUlOUXdTVi03dW5ySWNkaVVUdzhzYkIzNFdPQ0dsVE0xS0g0ckVlbXB0UEd5T3MxbFhfdXo0bHB5RjgtTlZjLWI3MGZtNGx0aGlBTkttMmd4b0hxLW5aMktMUA?oc=5", "published": "2026-07-25T07:14:01+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Six Killed in West Bank Shootings Amid Conflicting Reports", "excerpt": "Six people, including four Palestinians and two Israelis, have been killed in recent shootings in the West Bank, with conflicting accounts of the events.", "levels": {"Beginner": {"text": "Sad news comes from the West Bank. Six people have died in shootings there. Four of the people who died were Palestinians, and two were Israelis. This area is a place where both Israelis and Palestinians live, and sometimes there are fights.\n\nThere are different stories about what happened. Palestinians say that people from their villages were attacked by Israeli settlers. Settlers are Israelis who live in settlements in the West Bank. They say these settlers came and caused trouble.\n\nBut the Israeli army tells a different story. They say a Palestinian person took a weapon. This person then shot at hikers. Hikers are people who walk in nature for fun. So, one side says settlers attacked villagers, and the other side says a Palestinian attacked hikers. It is not clear exactly what happened, and both sides have lost people. The situation in the West Bank is often difficult, and many people hope for peace.", "vocab": [{"word": "shootings", "definition": "Events where guns are used to shoot people."}, {"word": "died", "definition": "Past tense of 'die'; stopped living."}, {"word": "villages", "definition": "Small towns or groups of houses in the countryside."}, {"word": "settlers", "definition": "People who move to a new place to live, often forming a community."}, {"word": "weapon", "definition": "An object like a gun or knife used for fighting or defense."}, {"word": "hikers", "definition": "People who go for long walks in the countryside or mountains."}]}, "Intermediate": {"text": "A tragic incident in the West Bank has resulted in the deaths of six individuals. Four Palestinians and two Israelis were killed in recent shootings, highlighting the ongoing tensions in the disputed territory. The West Bank is a region where Israelis and Palestinians reside, and it is frequently a flashpoint for conflict.\n\nDetails surrounding the events remain contested, with both sides presenting different narratives. Palestinian sources report that villagers came under attack by Israeli settlers. These settlers are Israelis who live in communities built in the West Bank, a territory largely populated by Palestinians. According to Palestinian accounts, these attacks led to the casualties among their community.\n\nConversely, the Israeli military has offered a different explanation. They state that a Palestinian individual seized a weapon and opened fire on a group of hikers. Hikers are people enjoying recreational walks, often in natural areas. This account suggests an act of aggression by a Palestinian against Israeli civilians.\n\nThese conflicting reports underscore the deep divisions and lack of agreement on the ground. Such incidents often lead to cycles of violence and further complicate efforts to achieve peace in the region. International observers frequently call for investigations into such events to establish facts and prevent further escalation. The West Bank has been under Israeli occupation since 1967, a key factor contributing to the complex political and security situation.", "vocab": [{"word": "tragic", "definition": "Causing great sadness or suffering."}, {"word": "incident", "definition": "An event or occurrence, often one that is unpleasant."}, {"word": "disputed", "definition": "Argued about; a territory claimed by more than one group."}, {"word": "narratives", "definition": "Stories or accounts of events, often from a particular point of view."}, {"word": "conversely", "definition": "Introducing a statement that is opposite to one just made; on the other hand."}, {"word": "escalation", "definition": "An increase in the intensity or seriousness of something, like a conflict."}, {"word": "occupation", "definition": "The control of a country or area by a foreign military force."}]}, "Advanced": {"text": "A recent spate of violence in the West Bank has resulted in the fatalities of six individuals, comprising four Palestinians and two Israelis. This tragic incident underscores the volatile security situation and the deeply entrenched, often conflicting, narratives that characterize the Israeli-Palestinian conflict in the disputed territory. The West Bank, a land central to the aspirations of both peoples, frequently witnesses such deadly confrontations.\n\nAccording to Palestinian sources, the violence commenced when villagers were subjected to attacks by Israeli settlers. These settlers reside in communities established within the West Bank, a territory predominantly inhabited by Palestinians and under Israeli military occupation since the 1967 Six-Day War. Palestinian accounts suggest that these settler incursions precipitated the loss of life within their communities, framing the events as acts of aggression against a civilian population.\n\nIn stark contrast, the Israeli military has presented a fundamentally different sequence of events. Their official statement indicates that a Palestinian assailant appropriated a weapon and subsequently opened fire on a group of Israeli hikers. This narrative portrays the incident as a targeted act of terrorism against Israeli civilians engaged in recreational activity, emphasizing the threat posed by militant elements within the Palestinian population.\n\nThe divergence in these accounts is not uncommon in the West Bank, where every incident is often viewed through distinct lenses, shaped by historical grievances, political objectives, and personal experiences. Such discrepancies make it exceedingly difficult for independent observers to ascertain the precise chronology and instigators of violence, further exacerbating mistrust and hindering prospects for de-escalation. The international community routinely calls for thorough and impartial investigations into these events to establish facts and hold perpetrators accountable, yet the highly politicized environment often impedes such efforts.\n\nThese fatalities contribute to a grim tally in a region perpetually on edge. The cycle of violence, fueled by settlement expansion, military operations, and acts of resistance or terrorism, continues to claim lives and deepen the chasm between Israelis and Palestinians, making the pursuit of a lasting peace agreement an increasingly formidable challenge.", "vocab": [{"word": "spate", "definition": "A large number of similar things or events appearing or occurring in quick succession."}, {"word": "fatalities", "definition": "Deaths, especially those caused by an accident or violence."}, {"word": "entrenched", "definition": "Firmly established and difficult or unlikely to change; deeply rooted."}, {"word": "commenced", "definition": "Began; started."}, {"word": "incursions", "definition": "Sudden attacks or raids into an area, often by an outside group."}, {"word": "precipitated", "definition": "Caused (an event or situation, typically a bad one) to happen suddenly, unexpectedly, or prematurely."}, {"word": "divergence", "definition": "The process or state of separating and going in different directions; a difference in opinion or approach."}, {"word": "exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}]}}, "questions": [{"q": "How many Palestinians and Israelis were killed in the West Bank shootings?", "a": "Four Palestinians and two Israelis were killed."}, {"q": "What are the two main conflicting accounts of how the shootings started?", "a": "Palestinians say villagers were attacked by settlers, while the Israeli military says a Palestinian stole a weapon and opened fire on hikers."}], "id": "a844c107590", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cx2rxmye4k3o?at_medium=RSS&at_campaign=rss", "published": "2026-07-25T07:49:59+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Democrats Reshape Primary Calendar, South Carolina Leads 2028 Race", "excerpt": "Democrats have approved a new 2028 presidential primary calendar, placing South Carolina first to prioritize diverse Black and Latino voters.", "levels": {"Beginner": {"text": "Democrats have made a big change to how they will choose their candidate for president in 2028. They have approved a new calendar for the primary elections. A primary election is when people vote to pick who they want to represent their party in the main election.\n\nNow, South Carolina will be the very first state where Democrats vote. This is different from past elections, where states like Iowa and New Hampshire usually went first. The Democratic Party decided to put South Carolina first because it wants to give more importance to Black voters. These voters are a very strong part of the Democratic Party.\n\nAfter South Carolina, Nevada will be the second state to hold its primary. Nevada has many Latino voters, who are also very important to the party. This new plan helps make sure that people running for president talk to many different kinds of people right from the start.\n\nOther states that will vote early in the new calendar include New Hampshire, New Mexico, Michigan, and Virginia. This new order shows that the Democratic Party wants its presidential candidates to connect with a diverse group of voters early in the election process.", "vocab": [{"word": "candidate", "definition": "a person who wants to be chosen for a job or position."}, {"word": "primary election", "definition": "an election where people choose who will represent their party."}, {"word": "importance", "definition": "the quality of being important or having a lot of meaning."}, {"word": "diverse", "definition": "including many different types of people."}, {"word": "connect", "definition": "to meet and talk with someone; to build a relationship."}]}, "Intermediate": {"text": "The Democratic Party has officially approved a significant overhaul of its presidential primary calendar, setting a new path for the 2028 election cycle. This decision places South Carolina at the forefront, making it the first state to hold a Democratic presidential primary. This marks a notable departure from decades of tradition, which typically saw Iowa and New Hampshire kicking off the nominating process with their caucuses and primaries.\n\nThe primary motivation behind this calendar shift is to elevate the voices and influence of Black and Latino voters, who constitute crucial demographic blocs within the Democratic Party. South Carolina, with its substantial Black electorate, is seen as a more representative starting point for candidates seeking to build broad support across the party's base. Nevada, which boasts a significant Latino population, is slated to hold the second primary, further emphasizing the party's commitment to diverse electorates early in the campaign.\n\nThe new early primary states also include New Hampshire, New Mexico, Michigan, and Virginia. While New Hampshire traditionally held the first primary, its position has been adjusted to follow South Carolina and Nevada. This new sequence aims to ensure that presidential hopefuls engage with a wider array of voters, including working-class communities and urban populations, much earlier in their campaigns.\n\nParty leaders believe that starting the primary season in more diverse states will better prepare their eventual nominee to compete effectively in a general election. It forces candidates to address issues important to a broader cross-section of the American public from the outset, rather than focusing solely on the concerns of predominantly white, rural states. This strategic move is intended to strengthen the party's foundation and appeal to a wider range of voters across the country.", "vocab": [{"word": "overhaul", "definition": "a complete change and improvement of a system or method."}, {"word": "departure", "definition": "an act of leaving a place or changing from a usual way of doing things."}, {"word": "motivation", "definition": "the reason or reasons one has for acting or behaving in a particular way."}, {"word": "demographic blocs", "definition": "groups of people sharing common characteristics, like age, race, or income."}, {"word": "electorate", "definition": "all the people in a country or area who are entitled to vote in an election."}, {"word": "nominee", "definition": "a person who has been formally chosen to represent their party in an election."}, {"word": "strategic", "definition": "relating to a plan of action designed to achieve a major or overall aim."}]}, "Advanced": {"text": "The Democratic Party has officially ratified a sweeping revision of its presidential primary calendar for the 2028 election cycle, a move poised to fundamentally alter the initial stages of the nominating contest. This pivotal decision positions South Carolina as the inaugural primary state, marking a profound departure from the long-standing tradition that historically saw Iowa's caucuses and New Hampshire's primary kick off the race for the White House. Critics have long argued that these predominantly white, rural states did not accurately reflect the national Democratic electorate.\n\nThis strategic realignment is primarily driven by a desire to empower and amplify the voices of Black and Latino voters, demographics that form the bedrock of the Democratic coalition. South Carolina, with its substantial Black electorate, is now deemed a more representative crucible for candidates to test their appeal and build a robust foundation of support. Following closely, Nevada, boasting a significant Latino population and a strong union presence, is slated to host the second primary, further underscoring the party's deliberate commitment to engaging diverse electorates from the earliest possible juncture.\n\nThe revised early primary schedule also includes New Hampshire, New Mexico, Michigan, and Virginia. While New Hampshire has fiercely guarded its first-in-the-nation status for decades, its placement has been adjusted, a contentious point for some state officials who fear diminished influence. This new sequence is meticulously designed to compel presidential hopefuls to engage with a broader spectrum of voters – encompassing working-class communities, urban centers, and various racial and ethnic groups – much earlier in their campaigns. The party aims to ensure that candidates are tested on issues relevant to a wider national audience, rather than just those of a few early states.\n\nParty strategists contend that initiating the primary season in more demographically representative states will better equip their eventual nominee to mount a competitive general election campaign. It necessitates that candidates articulate policy positions and campaign messages that resonate with a wider cross-section of the American public from the outset, rather than tailoring their initial appeals to the often-unrepresentative concerns of predominantly white, rural states. This \"front-loading\" of diverse states is intended to foster a more inclusive and resilient party platform, better reflecting the party's national base.\n\nThe implications of this calendar shift are far-reaching. It could reshape candidate recruitment, campaign spending patterns, and the very issues that dominate early debates. Candidates will need to demonstrate viability and appeal to diverse communities from day one, potentially altering the types of candidates who emerge as frontrunners and challenging traditional campaign playbooks. This bold recalibration reflects the Democratic Party's ongoing effort to adapt its electoral strategy to the nation's evolving demographics and to ensure its nominating process reflects its core values and electoral priorities. The decision signals a clear intent to prioritize a more inclusive and representative path to the presidency, potentially influencing how both parties approach future nomination contests.", "vocab": [{"word": "ratified", "definition": "formally approved or confirmed, making it officially valid."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else; central and essential."}, {"word": "demographics", "definition": "the statistical characteristics of human populations (e.g., age, race, income), especially used to identify consumer markets or political groups."}, {"word": "crucible", "definition": "a severe test or trial, or a place or situation in which concentrated forces interact to cause or influence change or development."}, {"word": "contentious", "definition": "causing or likely to cause an argument; controversial or disputable."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "articulate", "definition": "to express (an idea or feeling) fluently and coherently, making it clear and understandable."}, {"word": "recalibration", "definition": "the act of adjusting or re-evaluating something, especially in relation to new circumstances or a new standard."}]}}, "questions": [{"q": "What is the main change the Democrats made to their primary election calendar?", "a": "The Democrats changed their primary election calendar to make South Carolina the first state to hold a presidential primary for the 2028 election."}, {"q": "Why did the Democratic Party decide to place South Carolina first in the new primary calendar?", "a": "The Democratic Party placed South Carolina first to prioritize and elevate the voices of Black and Latino voters, who are crucial demographic groups within the party."}], "id": "a24f57a115c", "source": "NPR Topics: Politics", "link": "https://www.npr.org/2026/07/24/nx-s1-5906834/dnc-primary-election-calendar-south-carolina-2028", "published": "2026-07-25T06:50:41+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Game #103, Athletics at Twins Game Thread - Yahoo Sports", "excerpt": "Game #103, Athletics at Twins Game Thread Yahoo Sports", "levels": {"Beginner": {"text": "Game #103, Athletics at Twins Game Thread Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Game #103, Athletics at Twins Game Thread Yahoo Sports", "vocab": []}, "Advanced": {"text": "Game #103, Athletics at Twins Game Thread Yahoo Sports", "vocab": []}}, "questions": [], "id": "a81deb9845f", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihAFBVV95cUxNbkNnYjhkVC1aRkVYTGh5SVJ4QmZFLVlmTGo3Z21JMDkwUlUzQlJRVVRiZnRPZWYzYlljNThmVjZZQkRWRGM2WmVjM0dvcmQtSUU1QXhHcGRKVlpoZ2VndUdWN0hCaHNpSWIxRVNxbGVaRG1FR3dNM2R3SEt3enBpc2M2OWI?oc=5", "published": "2026-07-25T07:43:48+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Hoops Wire Sam Amico and CBS Sports' Brad Botkin on LeBron going to 76ERS - Cleveland 19 News", "excerpt": "Hoops Wire Sam Amico and CBS Sports' Brad Botkin on LeBron going to 76ERS Cleveland 19 News", "levels": {"Beginner": {"text": "Hoops Wire Sam Amico and CBS Sports' Brad Botkin on LeBron going to 76ERS Cleveland 19 News", "vocab": []}, "Intermediate": {"text": "Hoops Wire Sam Amico and CBS Sports' Brad Botkin on LeBron going to 76ERS Cleveland 19 News", "vocab": []}, "Advanced": {"text": "Hoops Wire Sam Amico and CBS Sports' Brad Botkin on LeBron going to 76ERS Cleveland 19 News", "vocab": []}}, "questions": const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
