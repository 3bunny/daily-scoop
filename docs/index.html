f normal pressure hydrocephalus, a disorder he was diagnosed with in 2025. On SiriusXM’s Billy Joel channel Wednesday, the singer talked about the surgery he agreed to after noticing “my balance was not good, I had this sensation of […]", "vocab": []}}, "questions": [], "id": "af4e6ec5a48", "source": "Variety", "link": "https://variety.com/2026/music/news/billy-joel-brain-surgery-after-diagnosis-1236856601/", "published": "2026-09-10T08:05:29+09:00", "category": "entertainment"}, {"headline": "Column: Stop curating your self-image — you aren’t a celebrity - The Daily Tar Heel", "excerpt": "Column: Stop curating your self-image — you aren’t a celebrity The Daily Tar Heel", "levels": {"Beginner": {"text": "Column: Stop curating your self-image — you aren’t a celebrity The Daily Tar Heel", "vocab": []}, "Intermediate": {"text": "Column: Stop curating your self-image — you aren’t a celebrity The Daily Tar Heel", "vocab": []}, "Advanced": {"text": "Column: Stop curating your self-image — you aren’t a celebrity The Daily Tar Heel", "vocab": []}}, "questions": [], "id": "a1cbde982c9", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxPdTFkS0NQNEFScTRGY0xlZzhMZ2hKdDNFd202NVJYci1weE9KT2dRc3hiSmNJbDhSUm9abHFsSFlyNTN0T2oxbGZObnl0THY1b2Q1MEIyTk1LbnFIeGFVVzJUUDhLaU9lcXpXUlJIMHlVQ0QwUUw1Sk9MTDZvODQwbnNqVUV6WUFtV0RuVE96elpKMURINlVpUDN6R05GMlZv?oc=5", "published": "2026-09-10T08:04:46+09:00", "category": "entertainment"}, {"headline": "How ‘The Shards’ Made Music the Star of the Show - Rolling Stone", "excerpt": "How ‘The Shards’ Made Music the Star of the Show Rolling Stone", "levels": {"Beginner": {"text": "How ‘The Shards’ Made Music the Star of the Show Rolling Stone", "vocab": []}, "Intermediate": {"text": "How ‘The Shards’ Made Music the Star of the Show Rolling Stone", "vocab": []}, "Advanced": {"text": "How ‘The Shards’ Made Music the Star of the Show Rolling Stone", "vocab": []}}, "questions": [], "id": "a7e3f7f02be", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxQVU5fT19IU19WOUJLOWc0YkxhLXAzY3hxY3NhcXhzaFVUSWtmR2YtRm8wZkw4bVlsNmZ0dVlvdUg4bnRCQ0JwSWVPamsyMTZ1THpNcTJWaVNYcVZubHExMHBCTTBlOEd6cEFyNTlLdlNQTjA2R3QxdHhnQ294bW1DYmV5VUdab1l0Y1lQYlRMX2x4ZzVmSS1Fb1NlMDVQLTBYSGtzR05DWHBmUQ?oc=5", "published": "2026-09-10T08:00:00+09:00", "category": "entertainment"}, {"headline": "Folk Fest 101: Your guide to a weekend of music and community on the lakefront - Evanston RoundTable", "excerpt": "Folk Fest 101: Your guide to a weekend of music and community on the lakefront Evanston RoundTable", "levels": {"Beginner": {"text": "Folk Fest 101: Your guide to a weekend of music and community on the lakefront Evanston RoundTable", "vocab": []}, "Intermediate": {"text": "Folk Fest 101: Your guide to a weekend of music and community on the lakefront Evanston RoundTable", "vocab": []}, "Advanced": {"text": "Folk Fest 101: Your guide to a weekend of music and community on the lakefront Evanston RoundTable", "vocab": []}}, "questions": [], "id": "a667b5bc14b", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMie0FVX3lxTE9NWkl2Z2FCeGdMcElLMzl4dERMbnJPTGRtUk82WFBmSFNxTnA3LU5qWEx5UEJURU5OeEprU2d2YnhPbTJldUxFQ3RiZjNFV2JNTW5vZjVrODZzd1RtbFlnTTNVZW1LZFVteTFFVUh3MlRyX0w4SEstQkxxOA?oc=5", "published": "2026-09-10T07:53:23+09:00", "category": "entertainment"}]}], "home": [{"headline": "Canada Looks Beyond U.S. for New Trade Partners", "excerpt": "Canada is actively expanding its international trade relationships, seeking new markets beyond its traditional reliance on the United States.", "levels": {"Beginner": {"text": "Canada wants to sell its goods to more countries around the world. For a long time, Canada sold most of its products, like wood, oil, and cars, to its neighbor, the United States. This was easy because they share a very long border and have strong ties.\n\nBut now, Canada thinks it's a good idea to have more friends to trade with. Why is Canada doing this? If one country buys most of your goods, it can be risky. If that country buys less, it can hurt Canada's economy. So, Canada wants to sell to many different places. This way, if sales to one country go down, sales to others might go up. This makes Canada's economy stronger and safer.\n\nCanada is looking at countries in Asia, like China and Japan, and also countries in Europe. They are trying to make new deals to sell more things there. This shift means Canada is working hard to find new buyers for its products around the world. It's an important plan for Canada's future business and helps Canada rely less on just one big customer.", "vocab": [{"word": "trade", "definition": "the activity of buying and selling goods and services."}, {"word": "goods", "definition": "things that are made to be sold."}, {"word": "rely", "definition": "to need or depend on someone or something."}, {"word": "economy", "definition": "how a country makes and uses money and goods."}, {"word": "partners", "definition": "countries or companies that work together in business."}]}, "Intermediate": {"text": "Canada is making a strategic move to diversify its trade relationships, aiming to reduce its significant economic dependence on the United States. Historically, the U.S. has been Canada's largest trading partner by far, largely due to geographic proximity, integrated supply chains, and agreements like NAFTA, now known as USMCA. This close relationship means a vast majority of Canadian exports traditionally head south of the border.\n\nHowever, relying too heavily on a single market carries inherent risks. Economic downturns or policy changes in the U.S. can have a substantial impact on Canada's economy. To mitigate these risks and seek new growth opportunities, Canada is actively pursuing new markets across the globe. This strategy is about building economic resilience and ensuring long-term prosperity for the nation.\n\nThe Canadian government has been working to forge new trade agreements and strengthen existing ties with other regions. For example, Canada has a comprehensive trade agreement with the European Union, known as CETA, which aims to boost trade in goods and services. It is also a member of the Comprehensive and Progressive Agreement for Trans-Pacific Partnership (CPTPP), connecting it to key economies in the Asia-Pacific region, including Japan, Australia, and Vietnam.\n\nThese efforts represent a deliberate shift to expand Canada's global footprint, opening doors for Canadian businesses to reach new consumers and reduce their reliance on the U.S. market. This diversification is seen as crucial for Canada's economic future and its ability to withstand global economic shifts.", "vocab": [{"word": "diversify", "definition": "to make something more varied or different."}, {"word": "dependence", "definition": "relying on someone or something for support."}, {"word": "proximity", "definition": "nearness in space, time, or relationship."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}, {"word": "resilience", "definition": "the ability to recover quickly from difficulties."}, {"word": "agreements", "definition": "formal decisions or promises between countries or groups."}, {"word": "footprint", "definition": "the impact or influence of something, often in a specific area."}]}, "Advanced": {"text": "Canada is embarking on a deliberate and strategic recalibration of its international trade policy, actively seeking to diminish its historically profound economic reliance on the United States. For decades, the U.S. has been Canada's preeminent trading partner, a relationship underpinned by geographic contiguity, deeply integrated supply chains, and robust multilateral agreements such as NAFTA, now succeeded by the USMCA. This symbiotic relationship has meant that an overwhelming proportion of Canadian exports, from natural resources to manufactured goods, have traditionally flowed south across the border.\n\nHowever, the inherent vulnerabilities of over-reliance on a singular market have become increasingly apparent. Fluctuations in U.S. economic cycles, coupled with the potential for protectionist trade policies or geopolitical shifts, can exert significant pressure on Canada's economic stability. The imperative to foster greater economic resilience and unlock new avenues for growth has thus propelled Canada to proactively cultivate and expand its commercial ties with a broader array of global partners. This diversification strategy is not merely a hedge against risk but also an ambitious pursuit of long-term prosperity in a dynamic global economy.\n\nTo achieve this, the Canadian government has been vigorously pursuing a multi-pronged approach. It has championed comprehensive trade agreements, notably the Comprehensive Economic and Trade Agreement (CETA) with the European Union, which has significantly liberalized trade in goods and services across the Atlantic. Concurrently, Canada is a pivotal member of the Comprehensive and Progressive Agreement for Trans-Pacific Partnership (CPTPP), an ambitious pact linking it to dynamic economies across the Asia-Pacific, including Japan, Australia, Singapore, and Vietnam. These agreements are instrumental in providing Canadian businesses with preferential access to vast new consumer bases and supply networks.\n\nFurthermore, Canada is investing in diplomatic and commercial initiatives to strengthen bilateral relationships with emerging markets in Latin America, Africa, and other parts of Asia. This concerted effort represents a fundamental shift in Canada's trade architecture, moving beyond a largely North American-centric model towards a more globally distributed network. While the U.S. will undoubtedly remain a crucial partner, this strategic pivot is designed to enhance Canada's economic sovereignty, foster innovation, and secure its position in an evolving international trade landscape.", "vocab": [{"word": "recalibration", "definition": "the process of adjusting or fine-tuning something to improve its performance or accuracy."}, {"word": "preeminent", "definition": "surpassing all others; very distinguished in some way."}, {"word": "contiguity", "definition": "the state of bordering or being in direct contact with something."}, {"word": "symbiotic", "definition": "a relationship between two different things or people that is mutually beneficial."}, {"word": "vulnerabilities", "definition": "weaknesses or susceptibilities to harm or attack."}, {"word": "imperative", "definition": "of vital importance; crucial."}, {"word": "multi-pronged", "definition": "involving several different parts or approaches."}, {"word": "sovereignty", "definition": "supreme power or authority, especially of a state to govern itself."}]}}, "questions": [{"q": "What is Canada trying to achieve by shifting its trade relationships?", "a": "Canada is trying to reduce its dependence on the U.S. market, mitigate economic risks, and find new growth opportunities by diversifying its trade partners."}, {"q": "Name two specific trade agreements or regions Canada is focusing on for new trade.", "a": "Canada is focusing on the European Union (through CETA) and the Asia-Pacific region (through CPTPP)."}], "id": "a675867ea3b", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxPVFF1RWNkYnRuUGRSS0JUdDdZNFpwQk9Pb0ZoN0REUzZ4Y2s4SXgzVDk1czh5a0Nnb0EtaWpFeWh4cGxLZjYxbzBtbjNYM3F6bVVyQXFCSmVETUR5Nm1RUlA1Zk9ZMEFfa0JMald6OFo3QkE0VDBteEVPVE02b05KdmZvWWJOUzB1YU9QXzFCNUR2bjJEMk1YODM5NF92MlQx?oc=5", "published": "2026-09-10T08:37:23+09:00", "category": "business", "category_title": "Business"}, {"headline": "Bradenton Memorial Honors 9/11 Victims with World Trade Center Steel", "excerpt": "A Bradenton memorial featuring World Trade Center steel serves as a poignant reminder of the tragic 9/11 attacks.", "levels": {"Beginner": {"text": "A special memorial stands in Bradenton, Florida. It is made from a piece of steel from the World Trade Center. This building was in New York City. On September 11, 2001, a very sad event happened. Terrorists used airplanes to crash into the World Trade Center towers. They also attacked another building called the Pentagon. Another plane crashed in a field in Pennsylvania. Many people lost their lives that day. Almost 3,000 people died. This day is known as 9/11.\n\nThe steel piece in Bradenton helps people remember what happened. It helps them remember the people who died. It also honors the brave people who helped others. Memorials like this are important. They help us never forget sad events. They remind us to be kind and strong. People visit the Bradenton memorial to think about 9/11. It is a place for quiet thought and respect. It shows that even far from New York, people remember. This memorial helps keep the memory of 9/11 alive for everyone.", "vocab": [{"word": "memorial", "definition": "A statue, building, or other object made to help people remember a person or event."}, {"word": "steel", "definition": "A very strong metal, often used for building."}, {"word": "towers", "definition": "Very tall buildings."}, {"word": "terrorists", "definition": "People who use violence to scare others and achieve their goals."}, {"word": "remember", "definition": "To keep a person or event in your mind; not to forget."}]}, "Intermediate": {"text": "In Bradenton, Florida, a significant memorial stands as a lasting tribute to the victims of the September 11, 2001, terrorist attacks. This memorial prominently features a piece of steel recovered from the wreckage of the World Trade Center in New York City. Such artifacts serve as powerful, tangible links to the tragic events of that day.\n\nOn September 11, 2001, the United States experienced a series of coordinated terrorist attacks. Hijacked airplanes were deliberately crashed into the Twin Towers of the World Trade Center, causing both massive structures to collapse. Another plane struck the Pentagon in Arlington, Virginia, and a fourth plane, United Airlines Flight 93, crashed into a field in Shanksville, Pennsylvania, after passengers and crew fought back against the hijackers. Nearly 3,000 innocent lives were lost in these horrific attacks, making it the deadliest act of terrorism on U.S. soil.\n\nThe Bradenton memorial, like many others across the nation, plays a crucial role in commemorating 9/11. It provides a solemn place for reflection, allowing individuals and communities to remember those who perished and to honor the first responders and ordinary citizens who displayed extraordinary courage. By preserving a piece of the World Trade Center, the memorial ensures that the memory of 9/11 endures, fostering a sense of national unity and resilience in the face of adversity. It reminds us of the importance of vigilance and the enduring human spirit.", "vocab": [{"word": "tribute", "definition": "An act, statement, or gift that is intended to show gratitude, respect, or admiration."}, {"word": "artifact", "definition": "An object made by a human being, typically one of historical or cultural interest."}, {"word": "coordinated", "definition": "Organized so that different parts work together effectively."}, {"word": "perished", "definition": "Died, especially in a violent, sudden, or unfortunate way."}, {"word": "commemorating", "definition": "Recalling and showing respect for someone or something in an official way."}, {"word": "resilience", "definition": "The ability to recover quickly from difficulties; toughness."}]}, "Advanced": {"text": "In Bradenton, Florida, a poignant memorial stands as a solemn testament to one of the most devastating days in modern American history: September 11, 2001. Central to this tribute is a salvaged piece of steel from the World Trade Center, a tangible fragment imbued with the profound weight of the tragic events it represents. Such artifacts serve not merely as relics, but as powerful conduits for collective memory and ongoing remembrance across the nation.\n\nThe 9/11 attacks constituted an unprecedented series of four coordinated terrorist strikes by al-Qaeda against the United States. On that fateful morning, hijacked commercial airliners were deliberately flown into the Twin Towers of the World Trade Center in New York City, leading to their catastrophic collapse and the destruction of surrounding buildings. Another plane struck the Pentagon, the headquarters of the U.S. Department of Defense, in Arlington, Virginia. A fourth aircraft, United Airlines Flight 93, crashed into a field near Shanksville, Pennsylvania, after heroic passengers and crew members confronted the hijackers, preventing its intended target, likely the U.S. Capitol or the White House. These attacks claimed the lives of nearly 3,000 individuals from over 90 countries, marking the deadliest act of terrorism ever on American soil and profoundly altering the global geopolitical landscape.\n\nThe Bradenton memorial, like hundreds of others established in communities nationwide, plays a vital role in processing collective trauma and fostering enduring remembrance. It offers a sacred space for contemplation, allowing visitors to reflect on the immense loss, honor the extraordinary bravery of first responders and ordinary citizens, and reaffirm a commitment to national unity and vigilance. The presence of World Trade Center steel imbues these local memorials with a direct, visceral connection to Ground Zero, symbolizing both the destruction wrought and the indomitable spirit of recovery and resilience. These memorials ensure that the legacy of 9/11 continues to resonate, educating future generations about the attacks and reinforcing the imperative to 'never forget' the lives lost and the lessons learned.", "vocab": [{"word": "poignant", "definition": "Evoking a keen sense of sadness or regret; deeply moving."}, {"word": "testament", "definition": "Something that serves as a sign or evidence of a specified fact, event, or quality."}, {"word": "imbued", "definition": "Inspired or permeated with a feeling or quality."}, {"word": "conduits", "definition": "Channels for conveying something; in this context, pathways for memory."}, {"word": "unprecedented", "definition": "Never done or known before; without previous instance."}, {"word": "catastrophic", "definition": "Involving or causing sudden great damage or suffering."}, {"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "indomitable", "definition": "Impossible to subdue or defeat."}]}}, "questions": [{"q": "What is the main feature of the 9/11 memorial in Bradenton, Florida?", "a": "The main feature of the 9/11 memorial in Bradenton, Florida, is a piece of steel recovered from the World Trade Center."}, {"q": "Why are memorials like the one in Bradenton important for communities?", "a": "Memorials like the one in Bradenton are important because they help people remember the victims of the attacks, honor heroes, provide a place for reflection, and ensure that the tragic events and lessons of 9/11 are never forgotten."}], "id": "a3239705062", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxPcWJDaFl2eTFDQ283dDNtYnJLbGhvTTFiUUc4VkItbFh2c1ZNQ1NpbDNSemJPRjl6ODJVNDgwaS1FTkJBM3dwRWZfbjVuY3Nfc1pCM1hNWmNTVlJPZXAyeEpUMEoxZDJHbENUWi04bzRqMlYtWVlpT1JjV2R2aUpPWFN3ZWlVU1hydFMxYlNSUkRXWVFXZWVPcnZBdTFsbk1C0gG0AUFVX3lxTE9XMXJGNHladVFIRTZYcjNRX3BQMmx0cUgwLTZ1amdfRFdrVlowU2ludmpPWXRaY3VzQWRKeVBxM0x2SjhJQWpEeU1FWnpGbF9raFlMbnZJQURYWjlXYlZWeURMcnhHYmgtWGw5dkNQc1dVeFk3YjB0VE1vdEktNVZNVFgzb05NZXBxYUZWUkYyVkVYSHgyeDhxNlQ1WjlLdXU0U3BWaWhwZFRCbG1udFdCdGVJWg?oc=5", "published": "2026-09-10T08:28:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Top Bosses Reveal Key to Workplace Success", "excerpt": "Top business leaders reveal what helps individuals stand out and succeed in today's competitive job market.", "levels": {"Beginner": {"text": "Many people want to do well at their jobs. But what makes someone really stand out? Top business leaders have shared their ideas. They say one important thing is to keep learning and be ready to change.\n\nThe world of work is always moving. New tools and ways of doing things come out all the time. If you can learn new skills, you will be very helpful to your company. For example, computers and software change fast. If you can learn how to use new programs, you will be a strong employee.\n\nBosses like people who are flexible. This means they can try new tasks and work in different ways. If a problem comes up, someone who is ready to learn can find new solutions. This helps the whole team and the business grow.\n\nSo, to succeed at work, don't stop learning. Be open to new ideas and new challenges. This will help you shine in any job. It shows you can grow and help your company grow too. This is what many top bosses believe is the key.", "vocab": [{"word": "Succeed", "definition": "To do well or achieve a goal."}, {"word": "Workplace", "definition": "The place where people work, like an office or factory."}, {"word": "Important", "definition": "Having a lot of meaning or value."}, {"word": "Skills", "definition": "Abilities to do something well."}, {"word": "Flexible", "definition": "Able to change easily."}, {"word": "Key", "definition": "The most important part of something."}]}, "Intermediate": {"text": "In today's competitive job market, many people are looking for ways to stand out and achieve career success. What truly makes an individual valuable to an organization? According to insights from several top business leaders, the most crucial quality is adaptability combined with a commitment to continuous learning.\n\nThe professional landscape is constantly evolving. Rapid technological advancements, shifting market demands, and new global challenges mean that the skills valued today might be different tomorrow. Business leaders emphasize that employees who can quickly learn new tools, embrace different methodologies, and adjust to changing priorities are indispensable. This isn't just about acquiring a new technical skill; it's about cultivating a mindset that welcomes change and sees it as an opportunity for growth, rather than a threat.\n\nAn adaptable employee is not only resilient in the face of uncertainty but also proactive in seeking out new knowledge. They understand that their professional development is an ongoing journey, not a destination. For instance, as artificial intelligence reshapes various industries, those willing to learn how to integrate AI into their work or develop new complementary skills will be at a significant advantage. This readiness to evolve helps companies stay innovative and competitive.\n\nThis core quality allows individuals to navigate complex problems, contribute innovative solutions, and remain relevant throughout their careers. It fosters a dynamic work environment where teams can pivot quickly to meet new challenges and seize new opportunities. Ultimately, top bosses agree that while specific expertise is valuable, the ability to learn and adapt is the fundamental characteristic that drives long-term success for both individuals and the companies they work for. It's the essential ingredient for thriving in a fast-paced world.", "vocab": [{"word": "Competitive", "definition": "Involving competition, where people try to be better than others."}, {"word": "Crucial", "definition": "Extremely important or necessary."}, {"word": "Adaptability", "definition": "The ability to change or adjust to new conditions."}, {"word": "Evolving", "definition": "Developing gradually, changing over time."}, {"word": "Indispensable", "definition": "Absolutely necessary; essential."}, {"word": "Resilient", "definition": "Able to recover quickly from difficulties."}, {"word": "Fundamental", "definition": "Forming a necessary base or core."}]}, "Advanced": {"text": "In an increasingly dynamic and often unpredictable global economy, the quest for sustained professional achievement and differentiation in a crowded workplace remains a paramount concern for individuals and organizations alike. Recent insights gleaned from a panel of six prominent business leaders underscore a singular, overarching attribute deemed indispensable for success: the meta-skill of continuous adaptability coupled with a proactive learning mindset.\n\nThis consensus emerges against a backdrop of unprecedented technological disruption, rapid globalization, and constantly shifting market paradigms. Traditional career paths, once defined by static skill sets, are now giving way to fluid trajectories demanding perpetual skill acquisition and strategic unlearning. Top executives highlight that while specialized technical competencies are undoubtedly valuable, their shelf-life can be remarkably short. What truly distinguishes high-performers is their capacity to not only absorb new information but also to critically evaluate, integrate, and apply it in novel contexts, thereby transforming challenges into opportunities.\n\nThe emphasis on adaptability extends beyond merely reacting to change; it encompasses a forward-looking posture that anticipates future trends and actively seeks opportunities for growth and reinvention. This proactive stance is vital for navigating the complexities of modern business, from leveraging emerging technologies like artificial intelligence and blockchain to understanding evolving consumer behaviors and geopolitical shifts. Employees who embody this learning agility are not merely cogs in a machine; they become catalysts for innovation, driving organizational resilience and competitive advantage. They are the ones who can pivot strategies effectively when market conditions shift unexpectedly or new competitors emerge.\n\nCultivating this meta-skill requires more than just formal training; it involves fostering intellectual curiosity, embracing ambiguity, and developing a robust problem-solving framework. It means viewing setbacks not as failures but as invaluable learning experiences, extracting lessons that inform future actions. For individuals, this translates into a commitment to lifelong learning, whether through formal education, online courses, mentorship, or simply staying abreast of industry developments. This self-driven development is often what separates those who merely perform from those who truly excel and lead.\n\nFor companies, nurturing such a culture necessitates providing resources for continuous professional development, encouraging cross-functional collaboration, and creating psychological safety for experimentation and risk-taking. Organizations that champion a learning culture, where employees are empowered to explore new ideas and even fail fast, are better positioned to innovate and maintain relevance. This symbiotic relationship between individual initiative and organizational support forms the bedrock of a future-proof workforce.\n\nUltimately, the message from these influential figures is clear: in an era where the only constant is change, the ability to learn, unlearn, and relearn is the ultimate currency of career longevity and organizational vitality. It is the strategic imperative that empowers individuals to not just survive, but to truly thrive and lead in the complex, ever-evolving professional landscapes of tomorrow.", "vocab": [{"word": "Paramount", "definition": "More important than anything else; supreme."}, {"word": "Indispensable", "definition": "Absolutely necessary; essential."}, {"word": "Meta-skill", "definition": "A skill that enables the acquisition and application of other skills, often related to learning or problem-solving."}, {"word": "Disruption", "definition": "Disturbance or interruption of an event, activity, or process, often implying a significant, transformative change."}, {"word": "Paradigms", "definition": "A typical example or pattern of something; a model, often referring to a fundamental change in approach or underlying assumptions."}, {"word": "Proactive", "definition": "(Of a person or action) creating or controlling a situation by causing something to happen rather than responding to it after it has happened."}, {"word": "Catalysts", "definition": "A person or thing that precipitates an event or change; an agent that provokes or speeds significant change or action."}, {"word": "Symbiotic", "definition": "Characterized by a relationship of mutual benefit or dependence."}]}}, "questions": [{"q": "What is the main quality top business leaders say is key to success in the workplace?", "a": "Top business leaders say that continuous adaptability and a proactive learning mindset are key to success."}, {"q": "Why is this quality especially important in today's job market?", "a": "This quality is important because the professional world is constantly changing due to new technologies, market demands, and global challenges, requiring individuals to constantly learn and adjust."}], "id": "a9ab5ac9a50", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cn5dew594n6o?at_medium=RSS&at_campaign=rss", "published": "2026-09-10T08:02:20+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "UK Childcare 'Cliff Edge' Forces Parents to Cut Work Hours", "excerpt": "A UK childcare rule is causing some higher-paid parents to work less or stop working to keep their benefits, critics say.", "levels": {"Beginner": {"text": "UK families can get help with childcare. This help is for families with young children. But there is a problem. If one parent earns £100,000 or more in a year, the family loses all this help. It's like falling off a “cliff edge” – all support stops at once.\n\nThis rule makes some parents work less. They do this to stay below the £100,000 limit. If they earn more, they lose the free childcare. Often, it is mothers who reduce their work hours or even stop working. This means they earn less money and might not grow in their jobs.\n\nPeople who think this rule is bad are called critics. They say the government should change it. They want a system that helps parents more fairly. They believe the current rule hurts families and the economy. They want the Chancellor, a top government official, to fix this “cliff edge.”", "vocab": [{"word": "Childcare", "definition": "help looking after children"}, {"word": "Support", "definition": "help or assistance"}, {"word": "Earn", "definition": "to get money for working"}, {"word": "Rule", "definition": "an official instruction that says how things must be done"}, {"word": "Critics", "definition": "people who say that something is bad or wrong"}, {"word": "Government", "definition": "the group of people who control a country"}]}, "Intermediate": {"text": "The UK's childcare support system is facing criticism for a specific rule that creates a “cliff edge” for families. This rule affects parents with young children who receive government help for childcare costs. Since the latest expansion of taxpayer-funded childcare in 2024, families where both parents earn less than £100,000 a year can be entitled to 30 hours of taxpayer-funded childcare each week.\n\nHowever, the problem arises when one parent's income reaches or exceeds the £100,000 threshold. At this point, the family loses all entitlement to the childcare support, rather than seeing it gradually reduced. This sudden loss of benefits acts as a strong disincentive for higher-earning parents to continue working full-time or to seek promotions that would push their income over the limit.\n\nCritics argue that this “all or nothing” approach often prompts parents, particularly mothers, to cut back on their work hours or even stop working entirely. They do this to ensure their family remains eligible for the valuable childcare subsidy. This not only impacts individual careers and family finances but also has broader implications for the economy, potentially reducing the workforce and tax revenues, and hindering gender equality in the workplace.\n\nSenior figures and critics are now urging the government to address this issue. They are calling on the Chancellor to reform the system, suggesting a more gradual tapering of benefits rather than a sharp cut-off. The goal is to create a fairer system that supports parents' career progression and ensures access to childcare without penalizing those who earn slightly more.", "vocab": [{"word": "Threshold", "definition": "a level or limit at which something changes"}, {"word": "Entitlement", "definition": "the right to have or do something"}, {"word": "Expansion", "definition": "the act of making something larger or more extensive"}, {"word": "Taxpayer-funded", "definition": "paid for by money collected from people's taxes"}, {"word": "Impact", "definition": "the effect or influence that something has"}, {"word": "Disincentive", "definition": "something that discourages a person from doing something"}, {"word": "Chancellor", "definition": "the senior government minister responsible for financial matters (in the UK)"}]}, "Advanced": {"text": "The United Kingdom's taxpayer-funded childcare system is under intense scrutiny due to a contentious “cliff edge” rule that critics argue is inadvertently penalizing higher-earning parents and undermining economic productivity. Since the latest expansion of childcare provisions in 2024, families with young children are eligible for 30 hours of free weekly childcare, provided both parents earn less than £100,000 annually. The UK has some of the highest childcare costs globally, making the 30 hours of free provision an indispensable financial lifeline for many families. The crux of the controversy lies in the abrupt cessation of this benefit: if one parent's income reaches or exceeds the £100,000 threshold, the family immediately loses all entitlement to the support.\n\nThis “all or nothing” mechanism creates a significant disincentive for individuals, particularly those approaching the income cap, to pursue career advancement or increase their working hours. The financial benefit of 30 hours of subsidized childcare is substantial, making the sudden loss of this support a powerful deterrent to earning beyond the threshold. Consequently, many parents, disproportionately mothers, are compelled to reduce their working hours or even withdraw from the workforce entirely to ensure their family retains eligibility for the crucial childcare subsidy. This phenomenon not only stifles individual career progression and earning potential but also exacerbates existing gender disparities in the workplace.\n\nEconomists and social commentators highlight the broader fiscal and societal implications of this policy design. By discouraging higher earners from maximizing their contributions, the system potentially reduces the overall tax base and limits economic growth. Furthermore, it can trap skilled professionals in lower-paid or part-time roles, leading to a suboptimal allocation of human capital. The current structure, intended to support families, paradoxically creates a barrier to financial independence and career development for a segment of the population. This scenario presents a complex policy challenge: balancing the need for targeted support with the desire to avoid creating perverse incentives within the tax and benefits system.\n\nThere are mounting calls from senior figures and advocacy groups for the government to address this policy conundrum. They are urging the Chancellor to implement reforms that would introduce a more gradual tapering of childcare benefits as income rises, rather than the current abrupt cut-off. Such a change would mitigate the disincentive to earn more, allowing parents to progress in their careers without facing a punitive financial penalty. A revised approach, perhaps involving a sliding scale or a higher, more flexible threshold, could better align the childcare policy with broader economic objectives of encouraging employment and productivity. The objective is to foster a childcare system that genuinely supports working families, promotes workforce participation, and contributes positively to the national economy, rather than creating an arbitrary barrier to prosperity.", "vocab": [{"word": "Scrutiny", "definition": "careful and thorough examination"}, {"word": "Contentious", "definition": "causing or likely to cause an argument; controversial"}, {"word": "Disincentive", "definition": "a factor that discourages a particular action"}, {"word": "Exacerbates", "definition": "makes a problem, bad situation, or negative feeling worse"}, {"word": "Fiscal", "definition": "relating to government revenue, especially taxes"}, {"word": "Conundrum", "definition": "a confusing and difficult problem or question"}, {"word": "Mitigate", "definition": "make less severe, serious, or painful"}, {"word": "Arbitrary", "definition": "based on random choice or personal whim, rather than any reason or system"}]}}, "questions": [{"q": "What is the main problem with the UK's childcare support system, according to critics?", "a": "The main problem is a \"cliff edge\" where families lose all childcare support if one parent earns £100,000 or more, which can lead parents to reduce work hours."}, {"q": "Who is most often affected by this rule, and what do they tend to do?", "a": "Mothers are often most affected, and they tend to cut back on work hours or stop working entirely to keep the childcare benefits."}], "id": "a9071091ab1", "source": "Economics | The Guardian", "link": "https://www.theguardian.com/society/2026/sep/10/uk-chancellor-urged-to-remove-100k-childcare-cliff-edge-prompting-parents-to-cut-work-hours", "published": "2026-09-10T08:01:08+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "UK Childcare Policy Faces Criticism Over £100k Income Limit", "excerpt": "UK childcare policy faces criticism over an income limit, prompting parents to cut work hours or lose support.", "levels": {"Beginner": {"text": "Many families in the UK get help with childcare costs. This help is for parents with young children. The government gives money for up to 30 hours of childcare each week. This support is very important for working parents.\n\nBut there is a rule that some people are worried about. If a family earns more than £100,000 a year, they might lose all this help. This rule is called a 'cliff edge' because the support stops suddenly.\n\nCritics say this rule makes parents change their jobs. Often, one parent, usually the mother, might work less. They do this to keep their family's income below £100,000. If they earn just a little bit more, they lose all the childcare money. This can make it harder for parents to work full-time or get promotions.\n\nPoliticians are now asking the UK's finance minister, called the Chancellor, to change this rule. They want to make the system fairer so parents don't have to choose between earning more money and getting childcare support.", "vocab": [{"word": "Childcare", "definition": "Looking after children while parents work."}, {"word": "Support", "definition": "Help or money given to someone."}, {"word": "Rule", "definition": "An official instruction that says how things must be done."}, {"word": "Critics", "definition": "People who say what is wrong with something."}, {"word": "Chancellor", "definition": "The UK government minister in charge of money."}, {"word": "Fairer", "definition": "More just or equal for everyone."}]}, "Intermediate": {"text": "The UK's current childcare policy is facing significant criticism due to a specific income threshold that many say creates a 'cliff edge' for working parents. This policy, which expanded in 2024, offers up to 30 hours of taxpayer-funded childcare per week for families with young children. However, there's a crucial condition: both parents in a household must earn less than £100,000 annually to qualify for this support. If one parent's income crosses this £100,000 mark, even by a small amount, the family instantly loses all entitlement to the childcare subsidy.\n\nThis abrupt withdrawal of support is what critics refer to as a 'cliff edge.' It means that a family earning £99,999 might receive substantial childcare assistance, while another family earning £100,001 receives nothing. This sudden loss of benefits can amount to thousands of pounds, effectively penalizing parents for earning slightly more.\n\nThe policy has led to unintended consequences. Many higher-paid employees, particularly mothers, are reportedly cutting back their working hours or even declining promotions to keep their household income below the £100,000 threshold. The aim is to avoid losing the valuable childcare entitlement, which can be essential for their ability to work. This situation can hinder career progression and reduce the overall workforce participation of skilled individuals.\n\nJohn Healey, a prominent figure, has urged the UK Chancellor of the Exchequer, the country's finance minister, to address this issue. Critics argue that the current system is unfair and discourages economic growth by disincentivizing higher earnings. They are calling for a more gradual tapering of childcare support as income rises, rather than an all-or-nothing approach, to ensure parents are not forced to make difficult choices between career advancement and essential family support.", "vocab": [{"word": "Threshold", "definition": "A level or point at which something starts or changes."}, {"word": "Entitlement", "definition": "The right to have or do something."}, {"word": "Subsidy", "definition": "Money given by a government or organization to help reduce the cost of a product or service."}, {"word": "Abrupt", "definition": "Sudden and unexpected."}, {"word": "Penalizing", "definition": "Punishing someone for doing something."}, {"word": "Disincentivizing", "definition": "Making someone less likely to do something."}, {"word": "Tapering", "definition": "Gradually decreasing the amount of something."}]}, "Advanced": {"text": "The United Kingdom's childcare policy framework is currently under intense scrutiny, particularly concerning a contentious income threshold that critics contend creates a significant 'cliff edge' for working families. Since its latest expansion in 2024, the government's flagship initiative provides up to 30 hours of taxpayer-funded childcare per week for families with preschool-aged children. However, eligibility for this crucial support is contingent upon a strict criterion: both parents within a household must individually earn less than £100,000 annually. Should either parent's income surpass this figure, even marginally, the family is immediately rendered ineligible for any childcare subsidy whatsoever.\n\nThis abrupt cessation of benefits has been widely decried as a 'cliff edge' because of its disproportionate impact. A family earning £99,999 per parent could receive substantial financial assistance, potentially amounting to thousands of pounds annually, while a family where one parent earns £100,001 is entirely deprived of this support. This stark disparity creates a powerful disincentive for career progression and increased earnings, as the marginal gain from a pay rise or promotion can be entirely negated by the sudden loss of childcare funding.\n\nThe policy's ramifications extend beyond mere financial calculations. Evidence suggests it often compels higher-earning individuals, predominantly mothers, to strategically reduce their working hours, decline promotions, or even exit the workforce altogether. This is done to ensure their household income remains below the £100,000 threshold, thereby preserving their entitlement to vital childcare. Such decisions, while rational for individual families navigating the current system, collectively contribute to a reduction in skilled labor force participation, particularly among women, and can exacerbate existing gender pay gaps. It also represents a potential drag on economic productivity, as highly qualified professionals are effectively discouraged from maximizing their earning potential.\n\nProminent political figures, including John Healey, have vociferously urged the Chancellor of the Exchequer to undertake a comprehensive review and reform of this policy. Arguments for reform center on the premise that the current all-or-nothing approach is inherently inequitable and counterproductive. Proponents of change advocate for a more nuanced, tapered withdrawal of childcare support as income rises, mirroring systems in other advanced economies. This would ensure that families are not abruptly penalized for incremental increases in earnings and would foster a more supportive environment for parents seeking to advance their careers while managing family responsibilities. Addressing this 'cliff edge' is seen as essential for promoting both social equity and economic dynamism within the UK.", "vocab": [{"word": "Framework", "definition": "A basic structure underlying a system, concept, or text."}, {"word": "Contentious", "definition": "Causing or likely to cause an argument; controversial."}, {"word": "Flagship", "definition": "The best or most important one of a group of things."}, {"word": "Contingent", "definition": "Subject to change; dependent on."}, {"word": "Decried", "definition": "Publicly denounced or criticized."}, {"word": "Disparity", "definition": "A great difference."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "Vociferously", "definition": "In a loud and forceful manner."}]}}, "questions": [{"q": "What is the main problem with the UK's childcare policy, according to critics?", "a": "Critics say the main problem is a £100,000 income limit, which acts as a 'cliff edge,' causing families to lose all childcare support if their income slightly exceeds this threshold."}, {"q": "How does this policy affect parents' work decisions?", "a": "The policy often makes higher-earning parents, especially mothers, reduce their work hours or decline promotions to keep their income below £100,000 and retain their childcare entitlement."}], "id": "a9071091ab1", "source": "Politics | The Guardian", "link": "https://www.theguardian.com/society/2026/sep/10/uk-chancellor-urged-to-remove-100k-childcare-cliff-edge-prompting-parents-to-cut-work-hours", "published": "2026-09-10T08:01:08+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Republicans Begin Preparations for 2026 Midterm Elections", "excerpt": "With the 2026 midterm elections on the horizon, Republicans are starting to strategize and discuss potential candidates and key issues.", "levels": {"Beginner": {"text": "Republicans are starting to think about the 2026 elections. These elections are important because people will vote for new leaders in Congress. Congress is where laws are made for the country. The Republican party wants to win more seats in these elections. This means they want more of their members to become leaders.\n\nThey are beginning to make a plan for how to win. They will talk about important topics like the economy, which is about jobs and money. They will also talk about other issues that people care about. Many people will watch to see who might run for office. The 2026 elections are still some time away, but political groups start planning early to get ready. Winning these elections could change how the government works.", "vocab": [{"word": "elections", "definition": "when people vote for their leaders"}, {"word": "Congress", "definition": "a group of people who make laws for a country"}, {"word": "party", "definition": "a group of people with similar political ideas"}, {"word": "seats", "definition": "positions or places in government"}, {"word": "economy", "definition": "how a country makes and uses money"}]}, "Intermediate": {"text": "The Republican Party is beginning to lay the groundwork for the 2026 midterm elections. These elections, which take place in the middle of a president's term, are crucial for determining the balance of power in the U.S. Congress, including both the House of Representatives and the Senate. Republicans aim to either maintain or gain control of these legislative bodies.\n\nDiscussions are likely underway within the party regarding potential candidates who could run for various offices. Strategizing also involves identifying key issues that will resonate with voters. Common themes for Republican campaigns often include economic stability, border security, government spending, and national defense. The party will work to refine its message on these topics to appeal to a broad base of voters.\n\nHistorically, midterm elections can be challenging for the party that holds the presidency. This often creates an opportunity for the opposing party to make gains. As 2026 approaches, the political landscape will continue to evolve, and the Republican Party's early preparations are a sign of their focus on these important electoral contests.", "vocab": [{"word": "midterm elections", "definition": "elections held in the middle of a president's four-year term"}, {"word": "balance of power", "definition": "how much control different political parties have in government"}, {"word": "legislative bodies", "definition": "groups of people who make laws, like Congress"}, {"word": "strategizing", "definition": "planning carefully to achieve a goal"}, {"word": "resonate", "definition": "to have a strong emotional effect or impact on someone"}, {"word": "political landscape", "definition": "the current state of political affairs or conditions"}]}, "Advanced": {"text": "As the political calendar continues to advance, the Republican Party is already commencing preliminary preparations for the pivotal 2026 midterm elections. These elections are not merely routine contests; they represent a critical juncture for the control of both chambers of the U.S. Congress – the House of Representatives and the Senate. The outcomes will significantly influence the legislative agenda and the efficacy of the presidential administration during its latter half.\n\nInternal discussions within the Republican apparatus are likely focusing on several strategic pillars. Candidate recruitment is paramount, as the party seeks to identify and cultivate strong contenders who can effectively challenge incumbents or secure open seats. Concurrently, efforts are underway to refine the party's messaging, ensuring it resonates with a diverse electorate across various demographics and geographic regions. Key policy areas expected to feature prominently include fiscal responsibility, national security, border control, and addressing inflationary pressures.\n\nHistorical trends often show that midterm elections can serve as a referendum on the sitting president's performance, frequently resulting in gains for the opposition party. This dynamic presents both an opportunity and a challenge for Republicans, who will aim to capitalize on any perceived dissatisfaction with the current administration while simultaneously defending their own policy positions and legislative records. Fundraising efforts will also intensify, as securing adequate financial resources is essential for robust campaign operations.\n\nThe political landscape leading up to 2026 will undoubtedly be shaped by the preceding 2024 presidential and congressional elections. The Republican Party's ability to present a unified front, articulate a compelling vision, and mobilize its base will be crucial in determining its success in these high-stakes electoral contests, which will ultimately redefine the balance of power in Washington.", "vocab": [{"word": "preliminary", "definition": "happening before a more important action or event; initial"}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else"}, {"word": "efficacy", "definition": "the ability to produce a desired or intended result; effectiveness"}, {"word": "apparatus", "definition": "a complex organization or system, especially a political one"}, {"word": "paramount", "definition": "more important than anything else; supreme"}, {"word": "electorate", "definition": "all the people in a country or area who are entitled to vote in an election"}, {"word": "referendum", "definition": "a direct vote by the electorate on a particular proposal or issue, often used metaphorically to describe an election's broader meaning"}, {"word": "mobilize", "definition": "to prepare and organize (troops) for active service, or more generally, to organize and encourage people to act"}]}}, "questions": [{"q": "What type of elections are Republicans preparing for in 2026?", "a": "Republicans are preparing for the midterm elections in 2026."}, {"q": "What are some common issues Republicans often focus on in their campaigns?", "a": "Republicans often focus on issues such as economic stability, border security, government spending, and national defense."}], "id": "aa9ada36065", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxNcGhLbFlsR3FhWmVTclZSTWJ5VnZ0ZnhLSDJJSWo2anRJaEFacVNxelZTaEF0TVlzdExnQldfYnRmMW5Yb0F4VUNfeW1ROExMekl6eml0YktKY3E1YjVzXzQ1T2lLTlctby1KNExyYklGLXVKalFzRjhwaWZPWWZTWlJnRjlYQ0ZmVmpSRGQ3NzcwMXNkMmp3eFI5WjVRSVRRNUV2ODRydWlFZ210TkxRalIzQ0xOZTc3dmc?oc=5", "published": "2026-09-10T07:28:05+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "The Acrisure Stadium experience will be different this year. Here are the changes the Steelers have in mind. - Pittsburgh Post-Gazette", "excerpt": "The Acrisure Stadium experience will be different this year. Here are the changes the Steelers have in mind. Pittsburgh Post-Gazette", "levels": {"Beginner": {"text": "The Acrisure Stadium experience will be different this year. Here are the changes the Steelers have in mind. Pittsburgh Post-Gazette", "vocab": []}, "Intermediate": {"text": "The Acrisure Stadium experience will be different this year. Here are the changes the Steelers have in mind. Pittsburgh Post-Gazette", "vocab": []}, "Advanced": {"text": "The Acrisure Stadium experience will be different this year. Here are the changes the Steelers have in mind. Pittsburgh Post-Gazette", "vocab": []}}, "questions": [], "id": "a1d131bf5fc", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxNVTUxV3JuSUI2R2V6cFFrcFZwN3U5T2F6N0t6bWZ0UkRYSG01bTQyR3ZTU1JTLUFYYlNwRWl3UGY1X0ppamNiUHQ2MVF2VlA1NjNhS1NiZGVPeXIzb2ZwN1RWcW1aYkg2aHk0RXdiQzhrMHNxMW05XzRFejZ6eVE5bHQxcVN2RDdrQUFfQXJ1QXFsR0RCNzE2dlI2LXVIWldrV3V6VTJJYy1Gd2lNVUE?oc=5", "published": "2026-09-10T08:34:03+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "WDBJ7 Announces \"Hometown Sports Huddle\" for September 2026", "excerpt": "WDBJ7's popular local sports program, \"Hometown Sports Huddle,\" is scheduled for September 9, 2026, promising in-depth community sports coverage.", "levels": {"Beginner": {"text": "WDBJ7, a local TV station, will show a special program. It is called \"Hometown Sports Huddle.\" This show will be on September 9, 2026.\n\n\"Hometown Sports Huddle\" talks about sports in our town. It covers local teams and athletes. Many people like to watch local sports. It helps them feel connected to their community.\n\nThe program on WDBJ7 will share news about high school games and other local sports events. It is a good way to learn about what is happening with our teams. Local sports are very important. They bring people together. Families and friends often watch games together.\n\nThis show helps celebrate the hard work of local athletes. It also highlights coaches and volunteers. So, mark your calendar for September 9, 2026. You can watch \"Hometown Sports Huddle\" on WDBJ7 to enjoy news about our local sports world. It will be an exciting program for everyone who loves sports in our area.", "vocab": [{"word": "local", "definition": "From or in a particular area, town, or city."}, {"word": "program", "definition": "A show on TV or radio."}, {"word": "community", "definition": "All the people living in one area or town."}, {"word": "connected", "definition": "Feeling a bond or link with others."}, {"word": "athletes", "definition": "People who play sports."}, {"word": "celebrate", "definition": "To show that an event or person is important by doing something special."}]}, "Intermediate": {"text": "WDBJ7, a prominent local television station, has announced an upcoming broadcast of its popular program, \"Hometown Sports Huddle.\" This special edition is scheduled to air on September 9, 2026, promising an in-depth look at the regional sports scene and its impact on the community.\n\n\"Hometown Sports Huddle\" has become a staple for sports enthusiasts in the community, offering comprehensive coverage of local athletic achievements. The program typically features highlights from high school football, basketball, and other scholastic sports, alongside updates on college teams and community-based leagues. It serves as a vital platform for showcasing the talent and dedication of local athletes and coaches, providing recognition that might otherwise be overlooked by national media.\n\nThe broadcast on September 9, 2026, falls during a busy period for many sports, particularly the heart of high school football season, making it a timely opportunity for fans to catch up on scores, standings, and key player performances. WDBJ7, const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
