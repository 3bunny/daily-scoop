borrow money, or get when you save money."}]}, "Intermediate": {"text": "The Reserve Bank of India (RBI), the nation's central bank, has demonstrated notable success in managing the flow of US dollars into and out of the Indian economy. This effective management has helped maintain stability in the Indian rupee's exchange rate against the dollar.\n\nDollar flows are crucial for any economy. When foreign investors bring dollars into India, or when Indian companies earn dollars from exports, these dollars need to be managed. Conversely, when foreign investors take their money out, or when India imports goods, dollars leave the country. The RBI's role is to ensure these movements do not cause sharp fluctuations in the rupee's value, which could harm trade and investment. Its recent performance in this area has been widely recognized.\n\nWith the currency market relatively stable due to the RBI's efforts, attention is now shifting more intensely to its other primary mandate: controlling inflation. Inflation refers to the general increase in prices for goods and services over time, which reduces the purchasing power of money. High inflation can make everyday necessities like food, fuel, and housing more expensive for households and can create uncertainty for businesses.\n\nThe RBI's success in managing dollar flows means it has more room to maneuver its monetary policy tools, such as adjusting interest rates, to combat rising prices. This success, however, also raises the stakes in the inflation fight. Having effectively tackled one major economic challenge, the central bank is now under increased pressure to deliver similar results in bringing inflation down to its target levels. This ongoing battle is vital for ensuring long-term economic stability and improving the living standards of Indian citizens.", "vocab": [{"word": "central bank", "definition": "The main bank of a country that manages money supply and interest rates."}, {"word": "exchange rate", "definition": "The value of one country's money compared to another country's money."}, {"word": "fluctuations", "definition": "Changes, especially small, irregular, or unpredictable ones."}, {"word": "mandate", "definition": "An official order or instruction to do something."}, {"word": "purchasing power", "definition": "The amount of goods and services that can be bought with a unit of currency."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the money supply and interest rates."}, {"word": "stakes", "definition": "The level of risk or importance involved in a situation."}]}, "Advanced": {"text": "The Reserve Bank of India (RBI), acting as the nation's central monetary authority, has garnered significant commendation for its adept management of foreign exchange flows, particularly concerning the US dollar. This robust capital account management has been instrumental in mitigating volatility in the Indian rupee's exchange rate, thereby fostering a degree of macroeconomic stability that is crucial for investor confidence and trade.\n\nThe dynamics of dollar flows are complex, encompassing foreign direct investment, portfolio investments, remittances, and trade surpluses or deficits. The RBI's interventions, including accumulating foreign exchange reserves during periods of strong inflows and deploying them strategically during outflows, have successfully smoothed out potential disruptions. This proactive approach has prevented sharp depreciations or appreciations of the rupee, which could otherwise destabilize export competitiveness, import costs, and overall financial markets. The relative calm in the currency market is a testament to the central bank's sophisticated policy toolkit and execution.\n\nWith the external sector exhibiting resilience, the spotlight has now intensified on the RBI's other paramount objective: inflation targeting. Inflation, characterized by a sustained increase in the general price level of goods and services, erodes purchasing power and can hinder economic growth if left unchecked. Persistent inflationary pressures, often exacerbated by global commodity price volatility and domestic supply-side constraints, pose a significant challenge to household budgets and business planning.\n\nThe central bank's success in navigating the complexities of dollar flows has, paradoxically, elevated the expectations and stakes in its ongoing battle against inflation. This achievement provides the RBI with greater policy space, allowing it to focus more intently on domestic price stability without being unduly constrained by external sector concerns. However, it also means that any perceived shortcomings in controlling inflation will be scrutinized more closely, given the demonstrated capability in other areas. The RBI's monetary policy committee will need to judiciously deploy its instruments, such as the repo rate, to anchor inflation expectations and guide it towards its mandated target range, ensuring that the hard-won currency stability translates into tangible benefits for the broader economy and populace.", "vocab": [{"word": "monetary authority", "definition": "The institution responsible for controlling a country's money supply and credit conditions."}, {"word": "adept", "definition": "Very skilled or proficient at something."}, {"word": "mitigating", "definition": "Making something less severe, serious, or painful."}, {"word": "macroeconomic stability", "definition": "A state where an economy experiences steady growth, low inflation, and stable exchange rates."}, {"word": "volatility", "definition": "The tendency of a market or price to change rapidly and unpredictably."}, {"word": "disruptions", "definition": "Disturbances or problems that interrupt an event, activity, or process."}, {"word": "paramount", "definition": "More important than anything else; supreme."}, {"word": "judiciously", "definition": "With good judgment or sense."}]}}, "questions": [{"q": "What specific area has the Reserve Bank of India (RBI) recently shown success in managing?", "a": "The Reserve Bank of India (RBI) has recently shown success in managing dollar flows into and out of the Indian economy."}, {"q": "How does the RBI's success in managing dollar flows affect the importance of its fight against inflation?", "a": "The RBI's success in managing dollar flows means it has more policy space to focus on domestic price stability. However, it also raises the stakes, putting increased pressure on the central bank to deliver similar results in controlling inflation, as its capability in other areas has been demonstrated."}], "id": "abae0854a54", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxPY3gtZnhnZ0NXUXNyUG5UM2szTkRGZkJOZHdBSnZkMEExV1lUZVg5UTRGV1NxcmhvanNtVGFzOTBlVnFvMEFSeURDNGdVbkQ5SXpUTmF0SEZXdndCb3J0RUp2eS05Uy1fb2psQ3QwRUZWZnYtMVFSMTJ6c2dwRkw4RXlJU19vOWVnejhSWW5Cc3VmcHFUbmt2OFV3TEJoN2RjaGd2ZU9obEF6N3poWS1ZMGJoMA?oc=5", "published": "2026-10-01T09:00:00+09:00", "category": "economics"}]}, {"key": "politics", "title": "Politics", "articles": [{"headline": "US Supreme Court Clears Way for Christa Pike Execution", "excerpt": "The U.S. Supreme Court has allowed the execution of Christa Pike to proceed, overturning a lower court's temporary halt.", "levels": {"Beginner": {"text": "The highest court in the United States, the Supreme Court, has made a big decision. It said that the execution of a woman named Christa Pike can go forward. An execution is when the government puts someone to death as punishment for a very serious crime.\n\nChrista Pike was scheduled to be executed on Wednesday. This means it was planned for her to die by lethal injection. Lethal injection is a way to carry out the death penalty using special medicines.\n\nBut before it could happen, a different court, a lower court, stopped it. This court put a \"pause\" on the execution. A pause means it was stopped for a short time.\n\nNow, the Supreme Court has removed that pause. This means the execution can happen. Christa Pike was found guilty of murder. She has been on death row for a long time. This decision by the Supreme Court is the final word in her case for now.", "vocab": [{"word": "execution", "definition": "when the government puts someone to death as punishment."}, {"word": "scheduled", "definition": "planned to happen at a certain time."}, {"word": "paused", "definition": "stopped for a short time."}, {"word": "allowed", "definition": "given permission for something to happen."}, {"word": "crime", "definition": "an action that is against the law."}, {"word": "guilty", "definition": "found to have committed a crime."}]}, "Intermediate": {"text": "The U.S. Supreme Court has issued a significant ruling, allowing the execution of Christa Pike to proceed. Pike, who was convicted of murder, is set to be executed by lethal injection, a common method of capital punishment in the United States.\n\nHer execution was initially scheduled for earlier on Wednesday. However, a lower federal court intervened, granting a temporary stay, which effectively paused the process. This stay was granted to allow for further review of her legal challenges, a common step in death penalty cases where inmates seek to exhaust all possible appeals.\n\nThe Supreme Court's decision overturns that temporary halt, clearing the way for the state to carry out the death sentence. This ruling means that the highest judicial body in the country has found no reason to prevent the execution from moving forward at this time, often after reviewing the procedural aspects of the lower court's decision.\n\nChrista Pike was convicted in 1996 for the murder of another teenager. She has spent decades on death row, the section of a prison for inmates awaiting execution. Death penalty cases often involve lengthy and complex appeals processes, where lawyers challenge convictions or sentences in various courts. These appeals can focus on new evidence, alleged legal errors during the trial, or questions about the constitutionality of the punishment itself. The legal system allows for multiple levels of review to ensure fairness and adherence to the law, especially in cases involving capital punishment.\n\nThe Supreme Court's action typically signifies that all major legal avenues for appeal have been exhausted or that the court has declined to hear further arguments. For individuals on death row, a Supreme Court decision to deny a stay or an appeal often represents the final legal hurdle. This development brings Pike closer to becoming one of the few women executed in the U.S. since the reinstatement of capital punishment in 1976.", "vocab": [{"word": "ruling", "definition": "an official decision by a court or other authority."}, {"word": "convicted", "definition": "found guilty of a crime by a court."}, {"word": "lethal injection", "definition": "a method of execution using a fatal dose of drugs."}, {"word": "capital punishment", "definition": "the legal authorization to kill someone as punishment for a crime; the death penalty."}, {"word": "intervened", "definition": "got involved in a situation to change or stop something."}, {"word": "stay", "definition": "a temporary halt or suspension of a legal proceeding or sentence."}, {"word": "appeals processes", "definition": "the legal steps taken to ask a higher court to review a lower court's decision."}]}, "Advanced": {"text": "The United States Supreme Court has rendered a pivotal decision, effectively clearing the path for the execution of Christa Pike, a woman convicted of murder. Pike is slated to face lethal injection, the predominant method of capital punishment employed across states that retain the death penalty.\n\nHer execution had been initially scheduled for earlier on Wednesday. However, a lower federal court issued a temporary stay, a judicial reprieve that momentarily halted the proceedings. This stay was typically granted to allow for a more thorough examination of outstanding legal challenges brought forth by Pike's defense team, a common procedural step in the intricate landscape of death penalty litigation. Such challenges often argue issues like ineffective assistance of counsel, prosecutorial misconduct, or questions regarding the defendant's mental competency.\n\nThe Supreme Court's subsequent order rescinded that temporary halt, thereby reinstating the state's authority to proceed with the death sentence. This ruling from the nation's highest judicial body signifies that, after reviewing the arguments and the lower court's rationale, it found no compelling legal or constitutional grounds to further impede the execution at this juncture. The Court often limits its review to procedural questions rather than re-examining the factual guilt or innocence of the condemned, focusing instead on whether due process was followed and if any constitutional rights were violated during the lower court proceedings.\n\nChrista Pike was convicted in 1996 for the brutal murder of a fellow teenager. Her nearly three decades on death row underscore the protracted nature of capital punishment cases in the U.S., characterized by exhaustive appeals processes. These legal challenges, spanning multiple tiers of the judiciary, frequently scrutinize trial procedures for potential errors, question the effectiveness of legal counsel, or challenge the constitutionality of the sentence itself under the Eighth Amendment's prohibition against cruel and unusual punishment. The meticulous review system aims to ensure due process and mitigate the risk of irreversible error in cases involving the ultimate penalty, given its finality.\n\nThe Supreme Court's decision to deny a stay or reject an appeal typically represents the final substantive legal recourse available to a condemned inmate. While last-minute clemency petitions to state governors remain a possibility, the Court's action often marks the culmination of the judicial review phase. Pike's case has drawn particular attention as executions of women remain exceedingly rare in the U.S. since the Supreme Court reinstated capital punishment in 1976. Her impending execution highlights the ongoing legal and ethical debates surrounding the death penalty, including its application, fairness, and the lengthy delays inherent in the appeals system. Critics often point to the disproportionate application of the death penalty based on race and socioeconomic status, as well as the potential for executing innocent individuals, as reasons for its abolition. Supporters, conversely, argue for its role in justice for heinous crimes and as a deterrent.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else; central and essential."}, {"word": "slated", "definition": "Scheduled or planned to happen at a particular time."}, {"word": "predominant", "definition": "Present as the strongest or main element; most common or influential."}, {"word": "judicial reprieve", "definition": "A temporary postponement or cancellation of a punishment, granted by a court or legal authority."}, {"word": "rescinded", "definition": "Revoked, canceled, or repealed (a law, order, or agreement), making it no longer valid."}, {"word": "reinstating", "definition": "Restoring (someone or something) to their former position, state, or authority."}, {"word": "protracted", "definition": "Lasting for a long time or longer than expected or usual; extended in duration."}, {"word": "culmination", "definition": "The highest or climactic point of something, especially as attained after a long time; the final result or outcome."}]}}, "questions": [{"q": "What was the main decision made by the US Supreme Court regarding Christa Pike?", "a": "The US Supreme Court allowed the execution of Christa Pike to proceed."}, {"q": "What method of execution is planned for Christa Pike?", "a": "Lethal injection is the planned method of execution."}], "id": "a46bebc92c7", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cq8r6rjdvlx6o?at_medium=RSS&at_campaign=rss", "published": "2026-10-01T09:19:20+09:00", "category": "politics"}, {"headline": "Swiss glaciers suffer 'disastrous' year of ice loss, threatening water supplies", "excerpt": "Scientists say such rapid melting is no longer surprising given the pace of climate change.", "levels": {"Beginner": {"text": "Scientists say such rapid melting is no longer surprising given the pace of climate change.", "vocab": []}, "Intermediate": {"text": "Scientists say such rapid melting is no longer surprising given the pace of climate change.", "vocab": []}, "Advanced": {"text": "Scientists say such rapid melting is no longer surprising given the pace of climate change.", "vocab": []}}, "questions": [], "id": "a57cf8874c0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c6n9w0ypjwl9o?at_medium=RSS&at_campaign=rss", "published": "2026-10-01T09:08:23+09:00", "category": "politics"}, {"headline": "The children dying in India's remote tribal heartland", "excerpt": "At least 32 children have died in India's Balaghat district since May amid outbreaks of measles and malaria.", "levels": {"Beginner": {"text": "At least 32 children have died in India's Balaghat district since May amid outbreaks of measles and malaria.", "vocab": []}, "Intermediate": {"text": "At least 32 children have died in India's Balaghat district since May amid outbreaks of measles and malaria.", "vocab": []}, "Advanced": {"text": "At least 32 children have died in India's Balaghat district since May amid outbreaks of measles and malaria.", "vocab": []}}, "questions": [], "id": "ad1a19ef8b0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmn9wr84v1qno?at_medium=RSS&at_campaign=rss", "published": "2026-10-01T08:41:34+09:00", "category": "politics"}, {"headline": "China has cracked down on AI relations some time away, but planning for such big meetings starts early. This shows how important global trade is for all countries.", "vocab": [{"word": "Ambassador", "definition": "A person who represents their country in another country or at international meetings."}, {"word": "Ministerial", "definition": "A meeting of government ministers (important officials)."}, {"word": "Trade", "definition": "The activity of buying and selling goods and services."}, {"word": "Economy", "definition": "The system of how money and goods are made and used in a country."}, {"word": "Global", "definition": "Relating to the whole world."}, {"word": "Rules", "definition": "Instructions that say how things must be done."}]}, "Intermediate": {"text": "Ambassador Greer, representing the United States, is scheduled to deliver the opening remarks at the 2026 G20 Trade Ministerial. This significant international gathering will bring together trade ministers from the world's 20 largest economies. The G20, or Group of Twenty, plays a crucial role in global economic governance, addressing key issues that affect international finance and trade.\n\nAs the United States Trade Representative (USTR), Ambassador Greer's role involves developing and coordinating U.S. trade policy and negotiating trade agreements. Her participation at the G20 Ministerial underscores the U.S. commitment to fostering open, fair, and rules-based international trade. The meeting in 2026 will serve as a platform for member countries to discuss various aspects of global commerce.\n\nDiscussions at such ministerials typically cover a wide range of topics. These often include strategies for promoting economic growth, resolving trade disputes, strengthening global supply chains, and adapting to new challenges like digital trade and climate change impacts on commerce. Ministers will aim to find common ground and cooperative solutions to ensure a stable and prosperous global trading system.\n\nAmbassador Greer's opening address will likely outline the U.S. perspective on these critical issues, emphasizing the importance of collaboration among G20 nations. The preparatory work for such high-level meetings begins well in advance, highlighting the strategic importance of these discussions for shaping future international trade policies and fostering stronger economic ties among member states. The 2026 event is anticipated to be a pivotal moment for global trade dialogue.", "vocab": [{"word": "Scheduled", "definition": "Planned to happen at a particular time."}, {"word": "Ministerial", "definition": "A meeting where government ministers (important officials) discuss important issues."}, {"word": "Crucial", "definition": "Extremely important or necessary."}, {"word": "Fostering", "definition": "Encouraging the development of something."}, {"word": "Disputes", "definition": "Arguments or disagreements, especially official ones."}, {"word": "Supply chains", "definition": "The sequence of processes involved in the production and distribution of a commodity."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}]}, "Advanced": {"text": "Ambassador Greer, the United States Trade Representative (USTR), is slated to deliver the keynote opening remarks at the 2026 G20 Trade Ministerial. This high-level international forum, comprising trade ministers from the world's twenty leading economies, serves as a critical platform for shaping global trade policy and economic cooperation. The G20's influence extends across international finance, development, and commerce, making its ministerial meetings pivotal for addressing contemporary global challenges.\n\nThe USTR's participation, particularly in a prominent speaking role, underscores the United States' proactive engagement in multilateral trade discussions. Ambassador Greer's mandate involves formulating and executing U.S. trade policy, negotiating complex international agreements, and advocating for American economic interests on the global stage. Her address in 2026 will likely articulate the U.S. vision for an open, equitable, and resilient international trading system, emphasizing the imperative of rules-based governance.\n\nThe agenda for the 2026 Ministerial is expected to encompass a broad spectrum of pressing issues. These typically include strategies to bolster economic recovery and sustainable growth, mitigate protectionist tendencies, and enhance the robustness of global supply chains, which have been tested by recent geopolitical events and health crises. Discussions will also likely delve into the evolving landscape of digital trade, the integration of climate considerations into trade policy, and mechanisms for resolving persistent trade frictions among member states. The G20 provides a unique opportunity for these major economies, representing over 80% of global GDP, to forge consensus on complex trade matters.\n\nAmbassador Greer's opening statement will undoubtedly set the tone for the deliberations, outlining key priorities and potential areas for collaborative action. The preparatory diplomatic efforts for such a significant gathering commence well in advance, reflecting the intricate interplay of national interests and collective aspirations for global economic stability. The outcomes of the 2026 G20 Trade Ministerial are anticipated to have far-reaching implications for international commerce, influencing trade flows, investment patterns, and the future trajectory of global economic integration. This event represents a crucial juncture for advancing a shared prosperity agenda amidst an increasingly complex global trade environment.", "vocab": [{"word": "Slated", "definition": "Scheduled or planned to happen."}, {"word": "Keynote", "definition": "The main speech at a conference, setting out the central theme."}, {"word": "Comprising", "definition": "Consisting of; made up of."}, {"word": "Multilateral", "definition": "Involving three or more parties, especially countries."}, {"word": "Mandate", "definition": "An official order or commission to do something; the authority to carry out a policy."}, {"word": "Articulate", "definition": "To express an idea or feeling fluently and coherently."}, {"word": "Bolster", "definition": "To support or strengthen."}, {"word": "Mitigate", "definition": "To make less severe, serious, or painful."}, {"word": "Trajectory", "definition": "The path or course that something is following or will follow."}]}}, "questions": [{"q": "Who is Ambassador Greer?", "a": "Ambassador Greer is the United States Trade Representative (USTR)."}, {"q": "What is the main purpose of the G20 Trade Ministerial meeting?", "a": "The main purpose is for trade ministers from major economies to discuss global trade issues, promote economic cooperation, and address challenges in international commerce."}], "id": "a97d6094bc6", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi4wFBVV95cUxPbnFPQkNvV3BxS2V2aXFPWWNhcW1QbFRUa20tdU5qenh4X1hRbm9MakREeDN6NTNULWpXZlJQVTh1NUc2VW5oZjZEOVMwZUxkRzNhZURTd2tuSlBfNWVrLVNOdF9jeTM3ZjUxekZkRFVjTjNqNG04THl5Zng1YlZxbENSSnlaVXNCcjdkNUt0bkhDY3NkY2Q2MmY4b1RuRW9QaFZQYWJZYWFEMnV5ZFdoNnlYbEZpQzh6cVZfQU1iRnBBS0gyRFBOWkRQb3JYTl9RXy1CZEN1TkRuM19HdzNHcER5SQ?oc=5", "published": "2026-10-01T09:54:08+09:00", "category": "business", "category_title": "Business"}, {"headline": "Golden State Valkyries Emerge as WNBA Business Force", "excerpt": "The new Golden State Valkyries basketball team is quickly becoming a major business success in the growing Women's National Basketball Association.", "levels": {"Beginner": {"text": "The Golden State Valkyries are a new basketball team. They will play in the WNBA, which is a women's professional basketball league. This team is based in the San Francisco Bay Area. They are set to start playing in the year 2025.\n\nMany people are excited about the Valkyries. The team is owned by the same group that owns the Golden State Warriors, a very famous NBA team. This ownership group has a lot of experience in sports business. They know how to make a team successful.\n\nThe WNBA is becoming very popular. More and more fans are watching games and supporting teams. The Valkyries are seen as a strong new business in the league. They have already shown great success in getting fans and selling tickets, even before their first game. This shows that women's basketball is growing fast. The team's strong start suggests it will be a big part of the WNBA's future.", "vocab": [{"word": "team", "definition": "A group of players who play a sport together."}, {"word": "league", "definition": "A group of sports teams that play against each other."}, {"word": "owned", "definition": "To have something as your property."}, {"word": "fans", "definition": "People who like and support a sports team or person."}, {"word": "popular", "definition": "Liked by many people."}, {"word": "success", "definition": "The good result of something you tried to do."}]}, "Intermediate": {"text": "The Golden State Valkyries are poised to become a significant new force in the Women's National Basketball Association (WNBA). This expansion franchise, based in the vibrant San Francisco Bay Area, is scheduled to begin play in the 2025 season, bringing professional women's basketball to one of the largest and most affluent sports markets in the United States.\n\nWhat makes the Valkyries stand out as a \"business powerhouse\" even before their inaugural game is the formidable backing they receive. The team is owned by GSW Sports Ventures, the same experienced ownership group behind the highly successful Golden State Warriors of the NBA. This group brings a wealth of expertise in sports management, marketing, and fan engagement, which is proving crucial in establishing the new WNBA team. Their proven track record with the Warriors provides a strong foundation for building a successful WNBA franchise from the ground up.\n\nThe WNBA itself is experiencing unprecedented growth, with increasing viewership, rising valuations for its teams, and a surge in corporate investment. The league has seen a dramatic increase in fan interest, media coverage, and sponsorship deals in recent years. The addition of the Valkyries capitalizes on this momentum. The Bay Area market, known for its passionate sports fans and strong economy, offers immense potential for a women's professional sports team. Early indicators, such as rapid season ticket deposit sales, suggest a strong local appetite for the team, demonstrating the market's readiness to embrace women's basketball.\n\nThe Valkyries' strategic launch and strong financial foundation are designed to ensure long-term viability and competitiveness within the league. Their emergence reflects a broader trend of increasing recognition and investment in women's sports, positioning the Golden State Valkyries not just as a new team, but as a key player in the WNBA's ongoing expansion and commercial success. This strategic move by GSW Sports Ventures highlights the growing confidence in the WNBA's future as a major professional sports league.", "vocab": [{"word": "poised", "definition": "Ready and prepared for something."}, {"word": "franchise", "definition": "A professional sports team."}, {"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "expertise", "definition": "Special skill or knowledge that you get from experience, training, or study."}, {"word": "unprecedented", "definition": "Never done or known before."}, {"word": "capitalize on", "definition": "To take advantage of something."}, {"word": "viability", "definition": "The ability to work successfully."}]}, "Advanced": {"text": "The Golden State Valkyries are rapidly establishing themselves as a formidable entity within the Women's National Basketball Association (WNBA), signaling a new era of strategic expansion and commercial prowess for the league. Set to debut in the 2025 season, this Bay Area-based franchise is not merely another addition; it represents a meticulously planned venture leveraging the robust infrastructure and market penetration of its parent company, GSW Sports Ventures, the ownership group behind the NBA's Golden State Warriors. This strategic alignment is a blueprint for how new sports franchises can achieve immediate impact and long-term sustainability.\n\nThe designation of the Valkyries as a \"business powerhouse\" stems from several interconnected factors. Foremost is the unparalleled operational and marketing acumen provided by GSW Sports Ventures. Their proven track record with the Warriors, encompassing everything from state-of-the-art arena development to sophisticated fan engagement strategies and lucrative corporate partnerships, offers a significant competitive advantage. This organizational synergy allows the Valkyries to bypass many of the initial hurdles new sports franchises typically face, accelerating their path to market dominance and financial stability. The ability to tap into an existing, highly successful sports ecosystem provides an invaluable head start in a competitive landscape.\n\nFurthermore, the WNBA itself is experiencing an unprecedented surge in popularity, viewership, and investment. This growth is fueled by a confluence of factors: increasing media visibility, a rising generation of highly skilled athletes, and a demographic shift towards greater appreciation and support for women's professional sports. The league's recent expansion efforts, including the Valkyries, are a direct response to this burgeoning demand, with team valuations reaching record highs and significant capital flowing into the ecosystem. The Bay Area, a region renowned for its affluent demographic, technological innovation, and passionate sports culture, provides an exceptionally fertile ground for cultivating a dedicated WNBA fanbase and securing high-value sponsorships. The market's progressive outlook and strong corporate presence make it an ideal location for a franchise aiming for both athletic and commercial excellence.\n\nEarly indicators underscore the Valkyries' promising trajectory. The rapid accumulation of season ticket deposits, even years before their first game, demonstrates a profound local enthusiasm and a clear market validation for the franchise. This early financial commitment, coupled with the strategic alignment with existing corporate partners of the Warriors, positions the Valkyries for immediate commercial success and robust revenue generation. Their entry into the league is not just about adding a team; it's about catalyzing further investment and elevating the WNBA's overall profile as a premier professional sports league. The Valkyries embody the evolving landscape of sports business, where strategic investment in women's athletics is increasingly recognized as a lucrative and impactful endeavor, poised to redefine industry benchmarks and inspire future ventures in women's professional sports globally.", "vocab": [{"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "prowess", "definition": "Skill or expertise in a particular activity or field."}, {"word": "meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "synergy", "definition": "The interaction or cooperation of two or more organizations, substances, or other agents to produce a combined effect greater than the sum of their separate effects."}, {"word": "unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "confluence", "definition": "The flowing together of two or more streams or rivers, or the coming together of people or things."}, {"word": "catalyze", "definition": "To cause or accelerate a process or reaction."}]}}, "questions": [{"q": "What is the name of the new WNBA team discussed in the article?", "a": "The new WNBA team is called the Golden State Valkyries."}, {"q": "What factors contribute to the team being considered a 'business powerhouse'?", "a": "The team is considered a 'business powerhouse' due to its ownership by GSW Sports Ventures (owners of the Golden State Warriors), the strong Bay Area market, and the overall growth and investment in the WNBA."}], "id": "a4b07fe12c3", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxNOUNPRTM4T0F4VVV3QXNJci1YZmliV3pKa1VFbzJJTnJ6aXFSbGRJcVMyNzJqdjJpa3pKOUJBamNUbG4zZUVZcW5FTEo4ZHpySkE2cEl5SW5GS3JrMWZKUkxTWEdfMjZkQUtXc0FNaTY5cTBLR0MyeGxoWS1Xa0VBTlBsNHZhck9haU90U21xZ1F1RlVSY0YxRHZpX3RMQUxaMUN0ZlpPdVU0TFZiaFd4czVhZTluSWhM?oc=5", "published": "2026-10-01T09:38:49+09:00", "category": "business", "category_title": "Business"}, {"headline": "BOJ Debated Rate Hikes Amid Rising Prices", "excerpt": "Japan's central bank discussed raising interest rates at its September meeting as inflation continues to climb, a new report shows.", "levels": {"Beginner": {"text": "The Bank of Japan (BOJ) is Japan's main bank. It recently held a meeting in September to talk about important money matters. At this meeting, the bank's leaders discussed the idea of raising interest rates. Interest rates are like the extra money you pay when you borrow money, or the money banks pay you for keeping your savings with them.\n\nFor a long time, prices in Japan did not go up much. The BOJ kept interest rates very low to help the economy grow and encourage people to spend money. But now, things are changing. Prices for many goods and services in Japan are starting to go up more quickly. This is called inflation.\n\nBecause of rising prices, some people at the BOJ think it might be time to make borrowing money a bit more expensive. Raising interest rates could help to slow down how fast prices are increasing. However, it could also mean that businesses and people might find it harder to borrow money for new projects or big purchases. The BOJ is watching the economy closely to decide the best way forward and keep prices stable.", "vocab": [{"word": "Bank", "definition": "A place where people keep money and borrow money."}, {"word": "Meeting", "definition": "When a group of people come together to talk and make decisions."}, {"word": "Interest rates", "definition": "The extra money you pay when you borrow money, or earn when you save money."}, {"word": "Prices", "definition": "How much money you need to pay for things you buy."}, {"word": "Inflation", "definition": "When prices for many things go up over time."}, {"word": "Economy", "definition": "How a country makes and uses money, goods, and services."}]}, "Intermediate": {"text": "The Bank of Japan (BOJ), which is Japan's central bank, held an important policy meeting in September. During this meeting, policymakers discussed the possibility of raising interest rates. This information was revealed in a \"summary of opinions\" released by the BOJ, which details the views of the bank's board members.\n\nFor many years, the BOJ has maintained an \"ultra-loose\" monetary policy. This means they kept interest rates extremely low, and even negative, to fight deflation (a general fall in prices) and stimulate economic growth. This approach was unique among major global central banks for a long time. However, Japan's inflation rate has recently risen above the BOJ's 2% target and stayed there for several months.\n\nThis sustained increase in prices is now prompting the central bank to consider a shift in its strategy. Some board members felt it was necessary to debate the appropriate timing for future rate hikes, especially given the rising inflation and signs of wage growth. Higher interest rates would make borrowing more expensive for consumers and businesses, which could help to slow down price increases. But it could also potentially slow down overall economic activity.\n\nMost other major central banks around the world have already raised their interest rates significantly to combat global inflation. This difference in policy has contributed to a weakening of the Japanese yen against other currencies, making imports more expensive for Japan. The BOJ is carefully monitoring various economic data, including inflation trends and wage growth, before making any firm decisions about its next steps. The future of Japan's monetary policy is now a key focus for global financial markets.", "vocab": [{"word": "Central bank", "definition": "The main bank of a country that manages the money supply and oversees other banks."}, {"word": "Policy meeting", "definition": "A formal gathering where important decisions about a country's economic strategy are made."}, {"word": "Ultra-loose", "definition": "A monetary strategy where interest rates are kept very low to boost the economy."}, {"word": "Deflation", "definition": "A general decrease in prices, which can be harmful to an economy."}, {"word": "Inflation rate", "definition": "The speed at which the general level of prices for goods and services is increasing."}, {"word": "Policymakers", "definition": "Individuals who make important decisions, especially concerning government or economic policy."}, {"word": "Monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit to influence the economy."}]}, "Advanced": {"text": "The Bank of Japan (BOJ) engaged in a significant debate regarding the timing and necessity of further interest rate hikes during its September monetary policy meeting, as revealed in a recently published \"summary of opinions.\" This discussion signals a potential pivot from the BOJ's long-standing ultra-loose monetary policy, which has been a cornerstone of its efforts to combat persistent deflation and stimulate economic growth for over a decade.\n\nJapan's core consumer inflation has now exceeded the central bank's 2% target for an extended period, driven by factors such as rising import costs and a weakening yen. The summary indicated that some board members emphasized the need to consider the appropriate timing for future rate adjustments, particularly if the BOJ's price target is achieved in a sustainable manner, accompanied by robust wage growth. This internal deliberation comes at a critical juncture.\n\nWhile global central banks, including the U.S. Federal Reserve and the European Central Bank, have aggressively tightened monetary policy to curb inflation, the BOJ has largely maintained its accommodative stance, including its yield curve control (YCC) framework. This policy divergence has contributed to a significant depreciation of the Japanese yen, making imports more expensive and fueling domestic inflation. The BOJ's cautious approach stems from its desire to ensure that inflation is demand-driven and sustained, rather than merely cost-push, and that wage increases are sufficient to support consumer spending. A premature tightening could stifle a nascent economic recovery.\n\nConversely, delaying too long risks embedding higher inflation expectations among the public and businesses. The summary also highlighted concerns about the potential impact of future rate hikes on financial markets and the broader economy, with some members advocating for clear communication to avoid market disruption and ensure a smooth transition. Investors are closely watching for any signals of an impending policy shift, which could have profound implications for global financial markets, particularly the yen and Japanese government bonds. The BOJ's upcoming meetings will be crucial in determining the trajectory of Japan's monetary policy normalization, balancing the need to address inflation with the imperative to support sustainable economic growth.", "vocab": [{"word": "Monetary policy", "definition": "Actions undertaken by a central bank to control the money supply and credit conditions to influence economic activity, such as inflation and growth."}, {"word": "Ultra-loose", "definition": "An extremely accommodative monetary policy, typically characterized by very low or negative interest rates and extensive asset purchases (quantitative easing), aimed at stimulating economic activity."}, {"word": "Deflation", "definition": "A sustained decrease in the general price level of goods and services, often associated with a contraction in the money supply, reduced consumer spending, and economic stagnation."}, {"word": "Pivot", "definition": "A significant change in strategy, direction, or policy, often in response to changing circumstances or data."}, {"word": "Accommodative stance", "definition": "A monetary policy approach aimed at stimulating economic growth by keeping interest rates low and making credit readily available."}, {"word": "Yield curve control (YCC)", "definition": "A monetary policy tool where a central bank targets a specific yield for government bonds of a certain maturity, buying or selling bonds as needed to maintain that target."}, {"word": "Policy divergence", "definition": "A situation where central banks in different countries pursue significantly different monetary policies, leading to varied economic outcomes and currency movements."}, {"word": "Depreciation", "definition": "A decrease in the value of a currency relative to other currencies, meaning it takes more of the depreciated currency to buy a unit of another currency."}, {"word": "Trajectory", "definition": "The path or course that something is following or is expected to follow, often implying a trend or direction over time."}]}}, "questions": [{"q": "What was the main topic of discussion at the Bank of Japan's September meeting?", "a": "The main topic of discussion was the possibility and timing of raising interest rates."}, {"q": "Why is the Bank of Japan considering a change in its monetary policy?", "a": "The Bank of Japan is considering a change because inflation in Japan has risen above its 2% target and has been sustained for several months."}], "id": "a936c608afa", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxNdzJocjN0YVk0QkZXc0dZRUc5dWgwdHhOQmxBSWNsV0JfVnBMd2JIY0U0OGwzdnh0V0VjamtrWnhQeHNSTC1abDZraUI5OGN2MTFwZDBXN2tlakJHMWNqeGZVUWFUTVJIYzhiYmMyaGNET0NZYlFaTU5OQUJZUDBuS1VGQWZYMkotb2hCZm56UThuSEpjS2FycnZUcldzdTF1Vm43bG10eVQ0S3pWc1dmdkVkN24xZFZBMDA4?oc=5", "published": "2026-10-01T09:15:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US Fed Official Stresses Need to Lower Inflation", "excerpt": "A U.S. central bank official, Neel Kashkari, emphasized that reducing high inflation remains a crucial task for the institution.", "levels": {"Beginner": {"text": "The U.S. central bank, called the Federal Reserve or \"the Fed,\" helps manage the country's money. One of its main jobs is to keep prices stable. Recently, a Fed official named Neel Kashkari said that the Fed must work to lower inflation.\n\nInflation means that prices for things like food and gas are going up. When prices go up, your money buys less than it used to. This can make life harder for many people because their money doesn't go as far.\n\nThe Federal Reserve tries to control inflation. When prices are rising too fast, the Fed can make it more expensive to borrow money. This usually means people and businesses spend less, which can help slow down how fast prices are increasing.\n\nMr. Kashkari is the president of the Federal Reserve Bank of Minneapolis. He believes it is very important for the Fed to continue its efforts to bring prices back down to a normal level. This will help the economy stay strong and help people's money keep its value.", "vocab": [{"word": "central bank", "definition": "A main bank that helps a country's economy."}, {"word": "inflation", "definition": "When prices for goods and services go up."}, {"word": "stable", "definition": "Not changing much; staying the same."}, {"word": "borrow", "definition": "To take money from someone with a plan to pay it back."}, {"word": "economy", "definition": "How a country makes and uses money and goods."}]}, "Intermediate": {"text": "Neel Kashkari, a prominent official with the U.S. central bank, the Federal Reserve, has stated that the institution must prioritize reducing inflationary pressures. His remarks highlight the Fed's ongoing commitment to bringing price stability back to the American economy.\n\nThe Federal Reserve, often called \"the Fed,\" serves as the central bank of the United States. Its primary responsibilities include managing the nation's money supply, supervising banks, and maintaining stable prices and maximum employment. High inflation, which means a sustained increase in the general level of prices for goods and services, erodes the purchasing power of money. This makes everyday items more expensive and can negatively impact households and businesses, especially those with fixed incomes.\n\nTo combat inflation, the Fed typically employs monetary policy tools, most notably adjusting interest rates. By raising its benchmark interest rate, the Fed makes borrowing money more expensive for banks, which in turn leads to higher interest rates for consumers and businesses on loans for homes, cars, and investments. This action is designed to cool down economic activity, reduce demand, and ultimately slow the rate at which prices are rising.\n\nKashkari, who is the president of the Federal Reserve Bank of Minneapolis, emphasized that these efforts are crucial. He believes that ensuring prices do not continue to climb rapidly is essential for the long-term health of the economy and for protecting the value of people's savings and wages. The Fed's goal is generally to achieve an inflation rate of around 2% over time, which is considered healthy for economic growth.", "vocab": [{"word": "prominent", "definition": "Important and well-known."}, {"word": "prioritize", "definition": "To treat something as more important than other things."}, {"word": "inflationary pressures", "definition": "Forces that cause prices to rise."}, {"word": "purchasing power", "definition": "The amount of goods and services that money can buy."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the money supply and interest rates."}, {"word": "benchmark interest rate", "definition": "A standard interest rate used as a reference for other rates."}, {"word": "erodes", "definition": "Slowly wears away or reduces something."}]}, "Advanced": {"text": "Neel Kashkari, the president of the Federal Reserve Bank of Minneapolis, recently underscored the imperative for the U.S. central bank to actively mitigate inflationary pressures. His comments reinforce the Federal Reserve's unwavering focus on achieving price stability, a cornerstone of its dual mandate alongside fostering maximum sustainable employment.\n\nThe Federal Reserve, as the nation's central bank, wields significant influence over the U.S. economy. Its mandate involves not only supervising the banking system and providing financial services but critically, conducting monetary policy to promote stable prices and moderate long-term interest rates. Persistent high inflation, characterized by a broad and sustained increase in the cost of goods and services, diminishes the real value of wages and savings, thereby eroding consumer purchasing power and creating economic uncertainty. Such an environment can distort investment decisions and impede long-term economic growth.\n\nTo counter elevated inflation, the Fed primarily utilizes its monetary policy tools, with adjustments to the federal funds rate being the most prominent. By raising this benchmark rate, the central bank increases the cost of borrowing for commercial banks, which then translates into higher interest rates for a wide array of loans across the economy – from mortgages and auto loans to business investments. This tightening of financial conditions is designed to temper aggregate demand, thereby alleviating price pressures by reducing overall spending and investment.\n\nKashkari's remarks highlight the ongoing commitment within the Federal Open Market Committee (FOMC), the Fed's primary policymaking body, to navigate the complexities of the current economic landscape. While the Fed has made considerable strides in bringing down inflation from its multi-decade highs, officials remain vigilant against any resurgence. The ultimate objective is to guide inflation back towards the Fed's target of 2% over the medium term, a level generally considered conducive to healthy economic expansion without generating undue volatility. This requires a delicate balance, as overly aggressive tightening could risk triggering a significant economic slowdown or recession, while insufficient action could allow inflation to become entrenched. The challenge lies in calibrating policy to achieve a \"soft landing\" – cooling the economy enough to curb inflation without causing a sharp downturn.", "vocab": [{"word": "underscored", "definition": "Emphasized or highlighted the importance of something."}, {"word": "imperative", "definition": "Extremely important or urgent; a necessity."}, {"word": "mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "cornerstone", "definition": "An essential, fundamental, or foundational part of something."}, {"word": "wields", "definition": "Holds and uses (a weapon or tool, or power or influence) effectively."}, {"word": "diminishes", "definition": "Makes or becomes less; reduces."}, {"word": "temper aggregate demand", "definition": "To reduce the total demand for goods and services in an economy."}, {"word": "conducive", "definition": "Making a certain situation or outcome likely or possible."}]}}, "questions": [{"q": "What is one of the main jobs of the Federal Reserve mentioned in the article?", "a": "One of the main jobs of the Federal Reserve is to keep prices stable (or manage the country's money, or maintain stable prices and maximum employment)."}, {"q": "How does the Federal Reserve typically try to lower inflation?", "a": "The Federal Reserve typically tries to lower inflation by raising interest rates, which makes borrowing money more expensive and slows down spending."}], "id": "a743910ef57", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMizAFBVV95cUxQeGs0UnZzM041cE5NTExELTJwRElrSDU3Z0VQZFZNYnZQVWprc1VxRGNET1FxY0pFaFIwQ2dwY1JYZ2F0VEJnczdna1dWQVFuQzJTdkV4MEowUmdZa0I3djNKaTVIM0lGdnA2Tk8xQUJvN1ZTTExmQkZMT01TQjYyVHZSR0RvalUyZ1VvZ011QmxrYlhpVzcxMEFVN0ZocnJwMDhWLW5EZ1hlakFtMHJ6U0ZmUkZVVG1BQVdNdjN1ay01RU9BM1FNRklzSEo?oc=5", "published": "2026-10-01T09:11:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US Supreme Court Clears Way for Christa Pike Execution", "excerpt": "The U.S. Supreme Court has allowed the execution of Christa Pike to proceed, overturning a lower court's temporary halt.", "levels": {"Beginner": {"text": "The highest court in the United States, the Supreme Court, has made a big decision. It said that the execution of a woman named Christa Pike can go forward. An execution is when the government puts someone to death as punishment for a very serious crime.\n\nChrista Pike was scheduled to be executed on Wednesday. This means it was planned for her to die by lethal injection. Lethal injection is a way to carry out the death penalty using special medicines.\n\nBut before it could happen, a different court, a lower court, stopped it. This court put a \"pause\" on the execution. A pause means it was stopped for a short time.\n\nNow, the Supreme Court has removed that pause. This means the execution can happen. Christa Pike was found guilty of murder. She has been on death row for a long time. This decision by the Supreme Court is the final word in her case for now.", "vocab": [{"word": "execution", "definition": "when the government puts someone to death as punishment."}, {"word": "scheduled", "definition": "planned to happen at a certain time."}, {"word": "paused", "definition": "stopped for a short time."}, {"word": "allowed", "definition": "given permission for something to happen."}, {"word": "crime", "definition": "an action that is against the law."}, {"word": "guilty", "definition": "found to have committed a crime."}]}, "Intermediate": {"text": "The U.S. Supreme Court has issued a significant ruling, allowing the execution of Christa Pike to proceed. Pike, who was convicted of murder, is set to be executed by lethal injection, a common method of capital punishment in the United States.\n\nHer execution was initially scheduled for earlier on Wednesday. However, a lower federal court intervened, granting a temporary stay, which effectively paused the process. This stay was granted to allow for further review of her legal challenges, a common step in death penalty cases where inmates seek to exhaust all possible appeals.\n\nThe Supreme Court's decision overturns that temporary halt, clearing the way for the state to carry out the death sentence. This ruling means that the highest judicial body in the country has found no reason to prevent the execution from moving forward at this time, often after reviewing the procedural aspects of the lower court's decision.\n\nChrista Pike was convicted in 1996 for the murder of another teenager. She has spent decades on death row, the section of a prison for inmates awaiting execution. Death penalty cases often involve lengthy and complex appeals processes, where lawyers challenge convictions or sentences in various courts. These appeals can focus on new evidence, alleged legal errors during the trial, or questions about the constitutionality of the punishment itself. The legal system allows for multiple levels of review to ensure fairness and adherence to the law, especially in cases involving capital punishment.\n\nThe Supreme Court's action typically signifies that all major legal avenues for appeal have been exhausted or that the court has declined to hear further arguments. For individuals on death row, a Supreme Court decision to deny a stay or an appeal often represents the final legal hurdle. This development brings Pike closer to becoming one of the few women executed in the U.S. since the reinstatement of capital punishment in 1976.", "vocab": [{"word": "ruling", "definition": "an official decision by a court or other authority."}, {"word": "convicted", "definition": "found guilty of a crime by a court."}, {"word": "lethal injection", "definition": "a method of execution using a fatal dose of drugs."}, {"word": "capital punishment", "definition": "the legal authorization to kill someone as punishment for a crime; the death penalty."}, {"word": "intervened", "definition": "got involved in a situation to change or stop something."}, {"word": "stay", "definition": "a temporary halt or suspension of a legal proceeding or sentence."}, {"word": "appeals processes", "definition": "the legal steps taken to ask a higher court to review a lower court's decision."}]}, "Advanced": {"text": "The United States Supreme Court has rendered a pivotal decision, effectively clearing the path for the execution of Christa Pike, a woman convicted of murder. Pike is slated to face lethal injection, the predominant method of capital punishment employed across states that retain the death penalty.\n\nHer execution had been initially scheduled for earlier on Wednesday. However, a lower federal court issued a temporary stay, a judicial reprieve that momentarily halted the proceedings. This stay was typically granted to allow for a more thorough examination of outstanding legal challenges brought forth by Pike's defense team, a common procedural step in the intricate landscape of death penalty litigation. Such challenges often argue issues like ineffective assistance of counsel, prosecutorial misconduct, or questions regarding the defendant's mental competency.\n\nThe Supreme Court's subsequent order rescinded that temporary halt, thereby reinstating the state's authority to proceed with the death sentence. This ruling from the nation's highest judicial body signifies that, after reviewing the arguments and the lower court's rationale, it found no compelling legal or constitutional grounds to further impede the execution at this juncture. The Court often limits its review to procedural questions rather than re-examining the factual guilt or innocence of the condemned, focusing instead on whether due process was followed and if any constitutional rights were violated during the lower court proceedings.\n\nChrista Pike was convicted in 1996 for the brutal murder of a fellow teenager. Her nearly three decades on death row underscore the protracted nature of capital punishment cases in the U.S., characterized by exhaustive appeals processes. These legal challenges, spanning multiple tiers of the judiciary, frequently scrutinize trial procedures for potential errors, question the effectiveness of legal counsel, or challenge the constitutionality of the sentence itself under the Eighth Amendment's prohibition against cruel and unusual punishment. The meticulous review system aims to ensure due process and mitigate the risk of irreversible error in cases involving the ultimate penalty, given its finality.\n\nThe Supreme Court's decision to deny a stay or reject an appeal typically represents the final substantive legal recourse available to a condemned inmate. While last-minute clemency petitions to state governors remain a possibility, the Court's action often marks the culmination of the judicial review phase. Pike's case has drawn particular attention as executions of women remain exceedingly rare in the U.S. since the Supreme Court reinstated capital punishment in 1976. Her impending execution highlights the ongoing legal and ethical debates surrounding the death penalty, including its application, fairness, and the lengthy delays inherent in the appeals system. Critics often point to the disproportionate application of the death penalty based on race and socioeconomic status, as well as the potential for executing innocent individuals, as reasons for its abolition. Supporters, conversely, argue for its role in justice for heinous crimes and as a deterrent.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else; central and essential."}, {"word": "slated", "definition": "Scheduled or planned to happen at a particular time."}, {"word": "predominant", "definition": "Present as the strongest or main element; most common or influential."}, {"word": "judicial reprieve", "definition": "A temporary postponement or cancellation of a punishment, granted by a court or legal authority."}, {"word": "rescinded", "definition": "Revoked, canceled, or repealed (a law, order, or agreement), making it no longer valid."}, {"word": "reinstating", "definition": "Restoring (someone or something) to their former position, state, or authority."}, {"word": "protracted", "definition": "Lasting for a long time or longer than expected or usual; extended in duration."}, {"word": "culmination", "definition": "The highest or climactic point of something, especially as attained after a long time; the final result or outcome."}]}}, "questions": [{"q": "What was the main decision made by the US Supreme Court regarding Christa Pike?", "a": "The US Supreme Court allowed the execution of Christa Pike to proceed."}, {"q": "What method of execution is planned for Christa Pike?", "a": "Lethal injection is the const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
