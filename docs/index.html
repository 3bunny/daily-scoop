s together to support Highland School District’s music program The Troy Times Tribune", "vocab": []}}, "questions": [], "id": "a647cbc81b5", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivAFBVV95cUxQOG8xU1BuNnR6a09KM0hPN3JkSThQbWYtX0RyVWtsT2ZVaHFrdXQ0WkNwbkRJT3E3QkY2aEpnZDh0dklsblRKczNaYkNwZzQyZjFVWjB1SU5rODI3Y3B6aG1Qem9kMFJvbjU0Q0w5NGNqNUV1dGZLcGJ3ZlhxZHl2ZnlkN1Njcm9ZdWJMSy1YeFU1V2RhN0otWERNcHh2WXoxanV1WDV6UEY3eEd6V0RvRFY3SmNyZk14U2VXaQ?oc=5", "published": "2026-11-27T12:03:08+09:00", "category": "entertainment"}]}], "home": [{"headline": "Report Highlights Sri Lanka's Persistent Trade Deficit with China", "excerpt": "A new report reveals Sri Lanka consistently imports far more goods from China than it exports, leading to a significant trade imbalance.", "levels": {"Beginner": {"text": "A new report talks about how Sri Lanka trades with China. Trading means buying and selling things between countries. Sri Lanka buys many things from China. This is called importing. But Sri Lanka does not sell as many things to China. This is called exporting. When a country buys more than it sells, it has a \"trade deficit.\" This report shows that Sri Lanka has a big trade deficit with China. This means Sri Lanka spends more money buying goods from China than it earns by selling goods to China. This can be a problem for Sri Lanka's money situation. It means the country's economy might not be as strong. Sri Lanka needs to find ways to sell more goods to other countries, including China, to help its economy get better. China is a very big country that makes many products. Sri Lanka often buys things like machines, electronics, and clothes from China. To balance trade, Sri Lanka would need to export more of its own products, like tea, spices, or garments, to China.", "vocab": [{"word": "Import", "definition": "To bring goods into a country from another country."}, {"word": "Export", "definition": "To send goods to another country for sale."}, {"word": "Deficit", "definition": "When a country spends more money than it earns."}, {"word": "Economy", "definition": "How a country makes and uses money and goods."}, {"word": "Balance", "definition": "When things are equal or in a good state."}]}, "Intermediate": {"text": "A recent report has shed light on Sri Lanka's trade balance with China, highlighting a significant and persistent imbalance between the two nations. A trade balance measures the difference between a country's total exports and total imports over a specific period. When a country imports more goods and services than it exports, it experiences a trade deficit. The report indicates that Sri Lanka consistently faces a substantial trade deficit with China, meaning the island nation spends considerably more on Chinese products than it earns from selling its own goods to China.\n\nSri Lanka's imports from China often include a wide range of manufactured goods, such as machinery, electronics, textiles, and construction materials, which are essential for its development and consumer needs. In contrast, Sri Lanka's exports to China are more limited, typically comprising raw materials, agricultural products like tea and spices, and some garments. This disparity in the types and volumes of goods exchanged contributes significantly to the trade gap.\n\nThis persistent trade imbalance has broader implications for Sri Lanka's economy, especially given its recent economic challenges. A large and ongoing trade deficit can lead to a drain on a country's foreign currency reserves, making it harder to pay for essential imports or service its foreign debts. Sri Lanka has faced a severe foreign exchange crisis and a substantial sovereign debt burden in recent years, making the management of its external trade relationships even more critical. China is not only a major trading partner but also a significant creditor to Sri Lanka, having provided substantial loans for infrastructure projects, which further intertwines their economic ties.\n\nAddressing this trade asymmetry is crucial for Sri Lanka's long-term economic stability. The country needs to explore strategies to boost its exports to China and diversify its export base to other markets. This could involve improving the competitiveness of its local industries, seeking better market access for its products in China, and attracting more foreign investment to enhance its production capabilities. Understanding and actively managing this bilateral trade relationship is key to Sri Lanka's economic recovery and future prosperity.", "vocab": [{"word": "Imbalance", "definition": "A situation where things are not equal or in correct proportions."}, {"word": "Persistent", "definition": "Continuing to exist or occur over a prolonged period."}, {"word": "Disparity", "definition": "A great difference between two or more things."}, {"word": "Foreign currency reserves", "definition": "Money held by a central bank in foreign currencies, used for international payments."}, {"word": "Sovereign debt", "definition": "The amount of money that a country's government has borrowed from other countries or institutions."}, {"word": "Creditor", "definition": "A person, company, or country to whom money is owed."}, {"word": "Asymmetry", "definition": "Lack of equality or equivalence between parts or aspects of something."}]}, "Advanced": {"text": "A recent report, published by The China-Global South Project, has meticulously analyzed Sri Lanka's trade balance with China, underscoring a structural and persistent trade deficit that carries significant macroeconomic implications for the island nation. A trade balance, a critical component of a country's current account, reflects the net sum of its exports and imports of goods and services. For Sri Lanka, the report highlights a consistent pattern where its imports from China vastly outweigh its exports, leading to a substantial and widening trade gap.\n\nSri Lanka's import basket from China is diverse, encompassing a broad spectrum of manufactured goods, advanced machinery, electronics, textiles, and construction materials, all vital for its industrial development and consumer market demands. Conversely, Sri Lanka's export profile to China remains comparatively narrow, primarily consisting of raw materials, agricultural commodities such as tea and spices, and some low-value-added manufactured items like garments. This fundamental asymmetry in trade composition and value chain integration largely accounts for the chronic deficit.\n\nThe ramifications of this sustained trade imbalance are profound, particularly in the context of Sri Lanka's recent economic vulnerabilities. A large and enduring trade deficit exerts considerable pressure on a nation's foreign exchange reserves, exacerbating challenges in servicing external debt obligations and financing essential imports. Sri Lanka has navigated a severe foreign exchange crisis and a substantial sovereign debt restructuring in recent years, making the prudent management of its external sector paramount. China's dual role as Sri Lanka's primary trading partner and its largest bilateral creditor further complicates this dynamic, intertwining trade deficits with debt sustainability concerns. The financing of large-scale infrastructure projects, often undertaken with Chinese loans, has contributed to Sri Lanka's debt burden, while the operational phase of these projects has not always generated sufficient export revenue to offset import costs or debt repayments.\n\nAddressing this complex trade asymmetry necessitates a multi-pronged strategic approach. Sri Lanka must prioritize enhancing the competitiveness and diversification of its export industries, moving beyond traditional commodities to higher-value-added manufactured goods and services. This requires significant investment in industrial capacity, technological upgrading, and human capital development. Furthermore, actively seeking improved market access and preferential trade agreements with China could facilitate a greater influx of Sri Lankan products into the vast Chinese market. Simultaneously, prudent fiscal management and a focus on import substitution for non-essential goods, where feasible, could alleviate some pressure on the trade balance. The report implicitly suggests that a comprehensive reassessment of Sri Lanka's economic engagement with China, balancing developmental needs with fiscal prudence and export promotion, is indispensable for fostering long-term macroeconomic stability and reducing external vulnerabilities.", "vocab": [{"word": "Meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "Macroeconomic", "definition": "Relating to the branch of economics concerned with large-scale or general economic factors, such as interest rates and national productivity."}, {"word": "Structural", "definition": "Relating to the basic framework or essential foundation of something, often implying a deep-seated or inherent characteristic."}, {"word": "Asymmetry", "definition": "Lack of equality or equivalence between parts or aspects of something; an imbalance."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event, especially one that is not immediately obvious."}, {"word": "Prudent", "definition": "Acting with or showing care and thought for the future; wise and careful in practical affairs."}, {"word": "Diversification", "definition": "The process of developing a wider range of products, markets, or investments to reduce risk or increase opportunities."}, {"word": "Indispensable", "definition": "Absolutely necessary or essential; impossible to do without."}]}}, "questions": [{"q": "What does a 'trade deficit' mean for a country like Sri Lanka?", "a": "A trade deficit means that Sri Lanka buys more goods from another country (like China) than it sells to that country."}, {"q": "Why is a large trade deficit a problem for Sri Lanka's economy?", "a": "A large trade deficit can reduce a country's foreign currency reserves, make it harder to pay for essential imports, and complicate the repayment of foreign debts, impacting overall economic stability."}], "id": "a9781a15f7f", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMid0FVX3lxTFBIY1RlSDd0bDVIM2Q1bkF5bEs3a29UcHpKb2k0QVVwaFlkVHpFdUpBa0s4WHZJWWZBRjJtcVJTU09xRkg0dFFTQ1FlSVFLUjZkSFVmdnJCMEV0TGRlaTJDN1I0RlRuVExrenEtTUowSS1LdFNLdUUw?oc=5", "published": "2026-11-27T12:35:59+09:00", "category": "business", "category_title": "Business"}, {"headline": "U.S. Stock Futures Climb, Nasdaq Leads Gains in Quiet Trading", "excerpt": "U.S. stock futures showed strong increases, with the tech-heavy Nasdaq index rising significantly during a period of reduced trading activity.", "levels": {"Beginner": {"text": "U.S. stock futures went up a lot. This means people expect stock prices to be higher when the market opens later. The Nasdaq index, which has many big technology companies, rose by 1.7%. This was a good sign for these companies.\n\nThe trading was \"holiday-thinned.\" This means fewer people were buying and selling stocks because of a holiday. When fewer people trade, prices can sometimes move more quickly. Even with fewer traders, the market showed strength.\n\nStock futures are like a guess about where the market will go. If futures rise, it often means investors feel good about the economy and companies. This positive feeling can make people want to buy more stocks. The rise in futures suggests that investors are hopeful for the coming trading day. It shows a positive start for the stock market after the holiday period. This news is important for people who own stocks or are interested in the economy.", "vocab": [{"word": "futures", "definition": "agreements to buy or sell something later, often used to guess future prices."}, {"word": "index", "definition": "a list or group of stocks that shows how a part of the market is doing."}, {"word": "rose", "definition": "went up, increased."}, {"word": "trading", "definition": "the act of buying and selling stocks or other goods."}, {"word": "economy", "definition": "how a country makes and uses money and goods."}, {"word": "investors", "definition": "people who put money into companies or stocks hoping to make more money."}]}, "Intermediate": {"text": "U.S. stock futures experienced a notable increase, signaling a positive outlook for the upcoming trading session. The Nasdaq 100 futures, representing a basket of major technology and growth companies, climbed by 1.7%. This significant rise suggests renewed investor confidence, particularly in the tech sector, which has a strong influence on the overall market.\n\nThe gains occurred during what is known as \"holiday-thinned trade.\" This term refers to a period when fewer market participants, such as institutional investors and individual traders, are active due to a public holiday. Reduced trading volume can sometimes lead to amplified price movements, as there are fewer buyers and sellers to absorb large orders. Despite the lower liquidity, the upward momentum in futures indicates a clear directional bias among active traders.\n\nStock futures are contracts that obligate a buyer or seller to transact a specific asset at a predetermined price on a future date. They are widely used as an indicator of market sentiment before the official opening of stock exchanges. A sharp rise in futures often reflects optimism about corporate earnings, economic data, or general market conditions. This particular surge follows a period where investors are closely watching inflation trends and central bank policies, making any strong market signal noteworthy.\n\nThe positive movement in Nasdaq futures could be interpreted as a sign that investors are shrugging off some previous concerns or are anticipating favorable developments. It provides an early indication of potential market behavior, suggesting that the trading day could begin with a bullish tone. This development is crucial for market analysts and investors as they plan their strategies for the post-holiday trading week.", "vocab": [{"word": "notable", "definition": "important or significant."}, {"word": "outlook", "definition": "a view into the future; what is likely to happen."}, {"word": "sector", "definition": "a part of the economy that includes many companies doing similar things (e.g., technology sector)."}, {"word": "participants", "definition": "people or groups who take part in an activity, like trading."}, {"word": "volume", "definition": "the total amount of something traded, like the number of stocks bought and sold."}, {"word": "sentiment", "definition": "a general feeling or opinion, especially among a group of people."}, {"word": "bullish", "definition": "expecting prices to rise in the financial market."}]}, "Advanced": {"text": "U.S. stock futures registered a sharp ascent, acting as a potent precursor to a potentially robust trading session. The Nasdaq 100 futures, a key barometer for the technology and growth sectors, surged by an impressive 1.7%. This substantial uptick underscores a discernible shift in investor sentiment, particularly favoring high-growth equities that often drive broader market performance.\n\nThe significant gains transpired amidst \"holiday-thinned trade,\" a characteristic period marked by diminished market liquidity and reduced participation from institutional and retail investors alike. While lower trading volume can sometimes exacerbate price volatility, leading to outsized movements on relatively small orders, the sustained upward trajectory in futures suggests a strong underlying conviction among active market participants. This environment can amplify directional biases, making the pronounced rise in Nasdaq futures particularly noteworthy as an indicator of prevailing optimism.\n\nStock futures are sophisticated financial instruments, essentially derivative contracts that obligate parties to transact an underlying asset at a predetermined price and date. Beyond their role in hedging and speculation, they serve as critical bellwethers for market direction and investor appetite prior to the official opening of major exchanges. A sharp increase, such as the one observed, typically reflects a confluence of positive factors: anticipation of favorable corporate earnings reports, encouraging macroeconomic data, or a general abatement of systemic risks. In the current economic climate, where inflation concerns and central bank monetary tightening policies loom large, any strong bullish signal is meticulously scrutinized.\n\nThe robust performance of Nasdaq futures could be interpreted as investors either discounting previous headwinds or positioning themselves for an anticipated rebound in technology stocks. It suggests a potential rotation back into growth assets, possibly driven by expectations of moderating inflation or a more dovish stance from central banks in the foreseeable future, though specific catalysts were not immediately apparent. This early market signal provides invaluable intelligence for portfolio managers and algorithmic trading systems, influencing pre-market strategies and setting the tone for the day's trading. The move highlights the market's dynamic nature, capable of significant shifts even under conditions of reduced liquidity, and offers a glimpse into evolving investor confidence as the post-holiday trading week commences.", "vocab": [{"word": "ascent", "definition": "the act of rising or moving upwards."}, {"word": "precursor", "definition": "something that comes before another and indicates its approach."}, {"word": "barometer", "definition": "something that indicates changes in something else, like a measure or indicator."}, {"word": "discernible", "definition": "able to be seen, recognized, or understood."}, {"word": "exacerbate", "definition": "to make a problem, bad situation, or negative feeling worse."}, {"word": "liquidity", "definition": "the ease with which an asset or security can be converted into ready cash without affecting its market price."}, {"word": "bellwethers", "definition": "indicators or predictors of future trends."}, {"word": "confluence", "definition": "a coming together of two or more things; a meeting or gathering."}]}}, "questions": [{"q": "What does \"holiday-thinned trade\" mean for the stock market?", "a": "It means fewer people are buying and selling stocks due to a holiday, which can sometimes lead to bigger price changes because there are fewer traders to absorb large orders."}, {"q": "Which major stock index showed a significant rise in its futures?", "a": "The Nasdaq index (specifically Nasdaq 100 futures) showed a significant rise."}], "id": "aa30bcadfbc", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxPUnU4cWlNcVQ3V3NzWWpsdnctZWVwbmJRX3Jrd0k1WDJEa1p0eUxhckdQQnpoZWZ6R3E2RjBoU25BdFpDYXhpVDFjMnlUdWpLRDJraGwzQW5TQ19hWHNKMWpWb01TMWNJb1pZMXV5TVBic2FXQndRLUFPbHZTejRyVDJGeVNYYkVFQW1xVEVvczBUZ2lDS3V5aldxYW12dDR1TjJELXBhMFBxVERTdTJhT3lZLWxpSmNjSGNtM1Nnd21yUQ?oc=5", "published": "2026-11-27T12:20:28+09:00", "category": "business", "category_title": "Business"}, {"headline": "Bank of Japan Warns on Digital Money and AI Risks", "excerpt": "Japan's central bank is calling for new rules and protections to manage the potential dangers of digital currencies and artificial intelligence in the financial system.", "levels": {"Beginner": {"text": "The Bank of Japan is Japan's main bank. It helps keep the country's money safe and stable. Recently, the Bank of Japan talked about new types of money called \"digital money.\" This is money that only exists on computers, not as coins or paper bills. Examples include cryptocurrencies or new digital money a country might make.\n\nThe bank also talked about \"AI.\" AI stands for Artificial Intelligence. It means computers that can think and learn, like humans. AI is used more and more in banks and finance.\n\nThe Bank of Japan said we need \"safeguards\" for digital money and AI. Safeguards are like safety rules or protections. They want to make sure these new technologies do not cause problems.\n\nWhy do they need safeguards? Digital money can be risky. It might be used for bad things, or its value could change very fast. AI could also make mistakes or be used by bad people to steal money.\n\nSo, the Bank of Japan wants to make sure that as digital money and AI grow, they are used in a safe way. This will help protect people's money and keep the financial system strong. They are asking for rules to prevent problems before they happen.", "vocab": [{"word": "main bank", "definition": "The most important bank in a country, usually run by the government."}, {"word": "digital money", "definition": "Money that only exists on computers, not as physical coins or paper."}, {"word": "AI (Artificial Intelligence)", "definition": "Computers that can think and learn like people."}, {"word": "safeguards", "definition": "Rules or protections to keep something safe."}, {"word": "risky", "definition": "Having a chance of danger or loss."}, {"word": "financial system", "definition": "All the banks, money, and ways people buy and sell things in a country."}]}, "Intermediate": {"text": "The Bank of Japan (BOJ), the central bank of Japan, has recently highlighted the growing need for robust safeguards against the potential risks associated with digital currencies and artificial intelligence (AI) within the financial sector. Central banks like the BOJ play a crucial role in maintaining economic stability and ensuring the safety of a nation's financial system.\n\nDigital money refers to various forms of currency that exist purely in electronic form. This includes cryptocurrencies like Bitcoin, stablecoins (digital currencies designed to maintain a stable value), and potentially Central Bank Digital Currencies (CBDCs), which are digital versions of a country's fiat currency issued by its central bank. While these innovations offer potential benefits like faster payments and greater efficiency, they also introduce new challenges. Concerns include their potential use in illicit activities, risks to financial stability if their value fluctuates wildly, and issues related to data privacy and cybersecurity.\n\nArtificial Intelligence is rapidly transforming the financial industry, from automated trading and credit scoring to fraud detection and customer service. AI systems can process vast amounts of data quickly, leading to more efficient operations. However, the BOJ warns that AI also carries significant risks. These include algorithmic bias, where AI systems might make unfair decisions, and the potential for system failures or cyberattacks that could disrupt critical financial services. There's also the challenge of understanding how complex AI models make decisions, making it harder to regulate them effectively.\n\nThe BOJ's call for safeguards emphasizes the importance of proactive measures. They are advocating for clear regulatory frameworks, strong cybersecurity protocols, and international cooperation to manage these emerging technologies. The goal is to harness the benefits of digital innovation while mitigating the dangers, thereby protecting consumers and ensuring the long-term resilience of the global financial system. This stance aligns with many other central banks worldwide that are grappling with similar issues.", "vocab": [{"word": "robust", "definition": "Strong and healthy; able to withstand difficult conditions."}, {"word": "financial sector", "definition": "The part of the economy that deals with money, such as banks and investment companies."}, {"word": "cryptocurrencies", "definition": "Digital or virtual currencies that use cryptography for security and operate independently of a central bank."}, {"word": "illicit activities", "definition": "Activities that are illegal or not allowed."}, {"word": "algorithmic bias", "definition": "When an AI system makes unfair or incorrect decisions due to flaws in its data or programming."}, {"word": "regulatory frameworks", "definition": "Systems of rules and laws designed to control or govern a particular industry or activity."}, {"word": "mitigating", "definition": "Making something less severe, serious, or painful."}]}, "Advanced": {"text": "The Bank of Japan (BOJ) has issued a significant call for comprehensive safeguards to address the burgeoning risks posed by the rapid proliferation of digital currencies and advanced artificial intelligence (AI) technologies within the global financial landscape. As a pivotal central bank, the BOJ's mandate extends beyond monetary policy to encompass financial stability, making its pronouncements on emerging technologies particularly salient.\n\nDigital currencies, broadly encompassing cryptocurrencies, stablecoins, and the nascent development of Central Bank Digital Currencies (CBDCs), present a multifaceted challenge. While they promise enhanced efficiency in payments, greater financial inclusion, and potentially new avenues for monetary policy transmission, their unchecked growth could introduce systemic vulnerabilities. The BOJ's concerns likely revolve around the potential for illicit finance, given the pseudonymous nature of some digital assets, and the inherent volatility of many cryptocurrencies, which could spill over into broader financial markets. Furthermore, the operational resilience and cybersecurity of digital payment infrastructures are paramount, as breaches could have widespread repercussions. The issuance of CBDCs, while offering greater control and stability, also necessitates careful consideration of privacy implications, design choices, and their potential impact on commercial banks.\n\nArtificial intelligence is fundamentally reshaping financial services, from sophisticated algorithmic trading and credit risk assessment to predictive analytics and fraud detection. The BOJ acknowledges AI's transformative potential for efficiency gains and innovation. However, it simultaneously highlights a spectrum of inherent risks. These include the opacity of complex AI models (\"black box\" problem), which can hinder regulatory oversight and accountability, and the potential for algorithmic bias to perpetuate or even amplify existing societal inequalities in areas like lending or insurance. Moreover, the interconnectedness of AI systems could create new vectors for systemic risk, where a failure in one highly leveraged AI model could cascade through the entire financial ecosystem. Ethical considerations, data governance, and the potential for AI-driven market manipulation also underscore the urgency of robust regulatory responses.\n\nThe BOJ's advocacy for safeguards underscores a proactive approach to governance in an era of accelerating technological change. This entails developing agile regulatory frameworks that can adapt to evolving innovations, strengthening international cooperation to harmonize standards across jurisdictions, and investing in advanced cybersecurity defenses. The objective is not to stifle innovation but to cultivate a resilient and trustworthy digital financial environment that protects consumers, preserves financial stability, and supports sustainable economic growth. This position reflects a growing consensus among global financial authorities grappling with the dual imperative of fostering innovation while prudently managing its associated risks.", "vocab": [{"word": "burgeoning", "definition": "Growing or developing quickly."}, {"word": "proliferation", "definition": "Rapid increase in the number or amount of something."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "salient", "definition": "Most noticeable or important."}, {"word": "multifaceted", "definition": "Having many different aspects or features."}, {"word": "systemic vulnerabilities", "definition": "Weaknesses in a whole system (like the financial system) that could lead to widespread failure."}, {"word": "opacity", "definition": "The quality of being difficult to understand or explain; lack of transparency."}, {"word": "agile regulatory frameworks", "definition": "Flexible and adaptive systems of rules and laws that can quickly respond to new developments."}]}}, "questions": [{"q": "What two main technological areas did the Bank of Japan call for safeguards against?", "a": "The Bank of Japan called for safeguards against digital money and Artificial Intelligence (AI)."}, {"q": "Why does the Bank of Japan believe safeguards are necessary for these technologies?", "a": "The Bank of Japan believes safeguards are necessary to prevent risks such as financial instability, cybersecurity threats, illicit activities, algorithmic bias, and to protect consumers and the overall financial system."}], "id": "a9576bb6b39", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxPUHZZTDVfX003Tmhadk1NbWFCVmIxSVZYcnE2dUFDaUJpTE5vODhyNnN4RFN3b1VQTTg1VWp6Nm9Ub0pBT0gtb2dGTnRHOUxyZHlqTlBqbHVMajVXLVZPTU1xUlU3dURtWlVLY2w3Y0czSnFKUTRCNkNNSHR5QTJkazluU0dNZTJtYXBpZGs2Tk03VWk0YkdXaG9KMlNoR2lMaXpmc0ZwM0hQUllHMEstZHN3emFmM1A2RWs3WGNxcF9CTVE?oc=5", "published": "2026-11-27T12:41:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Argentina Bans Central Bank from Printing Money for Government", "excerpt": "Argentina's central bank is now banned from printing money for the government, a key step in President Milei's fight against inflation.", "levels": {"Beginner": {"text": "Argentina has a big problem: prices are going up very fast. This is called inflation. For a long time, the government often printed new money to pay for things it needed. But printing too much money makes prices rise even more.\n\nNow, there is a new rule in Argentina. The country's main bank, called the central bank, cannot print money to give to the government anymore. This rule has passed. President Javier Milei wanted this change. He believes it will help stop inflation and make the economy better.\n\nThis new ban is a big step. It means the government must find other ways to pay for its spending, like collecting taxes or borrowing money. It cannot just ask the central bank to print more. This change aims to make prices more stable for people in Argentina. It is an important part of the country's plan to fix its economy.", "vocab": [{"word": "Inflation", "definition": "When prices for goods and services go up a lot over time."}, {"word": "Central bank", "definition": "The main bank of a country that controls its money and banking system."}, {"word": "Print money", "definition": "To make new paper money and coins."}, {"word": "Government", "definition": "The group of people who control a country or state."}, {"word": "Rule", "definition": "An official instruction that says how things must be done."}, {"word": "Passed", "definition": "Was approved or accepted, usually by a group of lawmakers."}]}, "Intermediate": {"text": "Argentina has long struggled with high inflation, a persistent economic challenge that erodes the purchasing power of its citizens. A significant factor contributing to this problem has been the practice of the central bank printing money to finance the government's budget deficits. When the government spends more than it collects in taxes, it often relies on the central bank to create new currency, which increases the money supply and drives up prices, making goods and services more expensive for everyone.\n\nIn a crucial development, Argentina has now approved a ban preventing its central bank from directly printing money to fund the national treasury. This measure represents a cornerstone of President Javier Milei's economic agenda. Milei, who campaigned on promises of radical fiscal discipline and combating inflation, views this ban as essential to stabilizing the country's economy and restoring confidence. For decades, the central bank's role in directly financing the government has been a major source of monetary expansion.\n\nThe ban passed through the legislative process, a key step for President Milei's economic plans, even if it wasn't achieved with his absolute, unchallenged control. This suggests that while the core measure was approved, there might have been political negotiations involved to secure its passage. The new rule forces the government to seek alternative, more sustainable methods of funding its operations, such as increasing tax revenue or securing loans, rather than resorting to inflationary monetary emission.\n\nEconomists generally agree that limiting a central bank's ability to finance government spending directly is vital for controlling inflation and maintaining currency stability. This move is seen as a serious attempt by Argentina to break its cycle of high inflation and build a more predictable economic future, signaling a commitment to sounder financial practices.", "vocab": [{"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Persistent", "definition": "Continuing to exist or happen for a long time."}, {"word": "Budget deficits", "definition": "When a government spends more money than it collects in taxes and other revenue."}, {"word": "Fiscal discipline", "definition": "The practice of carefully managing government spending and debt."}, {"word": "Monetary emission", "definition": "The act of a central bank creating and putting new money into circulation."}, {"word": "Legislative process", "definition": "The system by which laws are proposed, debated, and approved."}, {"word": "Stabilizing", "definition": "Making something steady, firm, or less likely to change."}]}, "Advanced": {"text": "Argentina has long been plagued by chronic hyperinflation and profound economic instability, a cycle often exacerbated by the central bank's role in directly financing the national treasury. For decades, when the government faced persistent fiscal deficits—spending significantly more than it collected in revenue—it frequently resorted to monetary emission, effectively printing new currency to cover its expenses. This practice, while providing short-term liquidity, inevitably led to a rapid expansion of the money supply, devaluing the national currency, the peso, and fueling runaway inflation, which has severely eroded public trust, savings, and economic predictability.\n\nIn a landmark legislative move, Argentina has now enacted a ban prohibiting its central bank from directly funding the government through monetary creation. This pivotal reform is a cornerstone of President Javier Milei's radical economic agenda, aimed at dismantling the structural causes of Argentina's economic woes. Milei, who campaigned on a platform of stringent fiscal austerity, deep spending cuts, and a commitment to achieving a fiscal surplus, views this ban as indispensable for restoring macroeconomic stability and reining in inflation, which has consistently been among the highest globally. The move represents a significant departure from decades of fiscal profligacy and central bank subservience to political demands.\n\nThe passage of this ban, described as occurring \"without Milei's full lock,\" suggests that while the measure was ultimately approved, its journey through the legislative chambers was likely not a mere rubber stamp. This phrase implies that the President's administration navigated political hurdles and potentially engaged in negotiations or compromises to secure its enactment, rather than imposing it through unchallenged executive authority or decree. Nevertheless, its approval signals a profound shift in the country's economic policy framework and a commitment to greater central bank autonomy.\n\nThis prohibition on direct central bank financing forces the government to adopt more orthodox and sustainable methods of funding, such as robust tax collection, responsible debt issuance in capital markets, or significant expenditure cuts. It aims to instill genuine central bank independence, shielding it from political pressures to monetize public debt and thereby allowing it to focus on its primary mandate of price stability. The long-term objective is to break the inflationary spiral, stabilize the Argentine peso, and foster an environment conducive to domestic and foreign investment, ultimately promoting sustained economic growth.\n\nWhile the ban is a critical first step, its success hinges on consistent fiscal discipline and broader structural reforms across the economy. The challenges remain formidable, including managing public expectations, navigating potential social unrest stemming from austerity measures, and rebuilding investor confidence in an economy scarred by repeated crises. However, this legislative victory marks a decisive break from past practices, signaling Argentina's intent to forge a new path towards economic solvency and long-term stability.", "vocab": [{"word": "Chronic hyperinflation", "definition": "A severe and persistent form of inflation where prices rise extremely rapidly and continuously over a long period."}, {"word": "Fiscal deficits", "definition": "When government expenditures exceed its revenues, leading to a shortfall that often needs to be financed."}, {"word": "Monetary emission", "definition": "The process by which a central bank creates new money and introduces it into the economy, often by purchasing government bonds."}, {"word": "Pivotal reform", "definition": "A crucial or extremely important change that is central to a larger strategy or transformation."}, {"word": "Fiscal austerity", "definition": "A set of economic policies, typically implemented by governments, to reduce government budget deficits through spending cuts, tax increases, or both."}, {"word": "Legislative chambers", "definition": "The two houses of a parliament or congress (e.g., Senate and House of Representatives) where laws are debated and passed."}, {"word": "Central bank autonomy", "definition": "The independence of a central bank from political interference, allowing it to make monetary policy decisions based on economic factors rather than political expediency."}, {"word": "Economic solvency", "definition": "The ability of a country or entity to meet its long-term financial obligations and debts."}]}}, "questions": [{"q": "What is the main purpose of the new ban approved in Argentina?", "a": "The main purpose of the new ban is to prevent Argentina's central bank from printing money to fund government spending, aiming to combat high inflation."}, {"q": "Who is President Javier Milei, and what is his stance on this economic measure?", "a": "President Javier Milei is the current president of Argentina. He strongly supports this economic measure as a cornerstone of his agenda to achieve fiscal discipline and stabilize the economy by fighting inflation."}], "id": "ac997136cf9", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipAFBVV95cUxNRVlzZ21aV3pDVGZVQVAyZ0N1RlFtbUNLLWdlTjR2MDdaVjRxSXhLMjNMeVlrWXYzby11aXd3MnZlQ1F5dEl1eVNBZ0dYa2x3emNQamQydGVpV2FxSUFRS0RMZm4wOVBjTHFlOWUzeU1COVNKRWdRTWN3WEs0Z0hKMHdUaWlVc0lQb2F4dDhMRFNCMFd2Y0w5dzdzdVZSWngwNXRXUg?oc=5", "published": "2026-11-27T12:30:59+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "New Zealand Elects New Government, Christopher Luxon Becomes Prime Minister", "excerpt": "New Zealand recently held a general election, leading to a change in leadership as the National Party formed a new coalition government.", "levels": {"Beginner": {"text": "New Zealand had an important election recently. People voted for new leaders for their country. The election happened in October 2023.\n\nThe National Party won the most votes. Their leader is Christopher Luxon. He will now be the new Prime Minister of New Zealand. The Prime Minister is the main leader of the country's government.\n\nThe Labour Party was the old government. Their leader was Chris Hipkins. They did not win enough votes this time.\n\nTo form a government, the National Party needed help from other parties. They made an agreement with two other groups: the ACT Party and New Zealand First. This is called a coalition government. It means different parties work together to lead the country.\n\nThis election means New Zealand has a new team in charge. They will make decisions for the country. Many people hope the new government will help with things like the cost of living.", "vocab": [{"word": "election", "definition": "A time when people vote to choose their leaders."}, {"word": "party", "definition": "A group of people with similar ideas who work together in politics."}, {"word": "leader", "definition": "The person in charge of a group or country."}, {"word": "Prime Minister", "definition": "The main leader of the government in some countries, like New Zealand."}, {"word": "government", "definition": "The group of people who control a country or state."}, {"word": "coalition", "definition": "When different political parties work together to form a government."}]}, "Intermediate": {"text": "New Zealand recently concluded a significant general election, resulting in a change of government and a new Prime Minister. The election, held on October 14, 2023, saw voters choose their representatives for the nation's parliament. This democratic process determines which political parties will form the government and make decisions for the country.\n\nThe centre-right National Party emerged as the largest party, securing the most seats. Its leader, Christopher Luxon, is now set to become the Prime Minister of New Zealand. This marks a notable shift in power from the previous centre-left Labour Party government, which had been in office for six years. Chris Hipkins, who had served as Prime Minister since early 2023, led the Labour Party during this election.\n\nWhile the National Party won the most votes, they did not achieve an outright majority of seats in parliament. This meant they needed to form a coalition government with other parties to gain enough support to govern effectively. After several weeks of detailed negotiations, the National Party successfully formed an agreement with two smaller right-leaning parties: the ACT Party and New Zealand First. These negotiations involved discussions on shared policies and ministerial roles.\n\nThis coalition agreement outlines how the three parties will work together to lead the country and implement their policies. Christopher Luxon officially took office as Prime Minister, leading this new multi-party government. The change reflects a public desire for new approaches to key issues, such as the economy and the rising cost of living, which were prominent topics during the election campaign. The Labour Party now moves into opposition, where its role is to scrutinize the new government's actions and propose alternative solutions. The election outcome represents a clear mandate from voters for a new direction.", "vocab": [{"word": "concluded", "definition": "Finished or brought to an end."}, {"word": "parliament", "definition": "The group of people who make the laws in a country."}, {"word": "emerged", "definition": "Came out or became known."}, {"word": "outright majority", "definition": "Winning more than half of the votes or seats, without needing help from others."}, {"word": "negotiations", "definition": "Formal discussions between people trying to reach an agreement."}, {"word": "implement", "definition": "To put a plan or decision into action."}, {"word": "mandate", "definition": "The authority given by voters to a political party to govern."}]}, "Advanced": {"text": "New Zealand recently navigated a pivotal general election, culminating in a significant shift in its political landscape and the formation of a new centre-right coalition government. The election, held on October 14, 2023, saw citizens cast their ballots to determine the composition of the 123-seat unicameral Parliament, a crucial exercise in democratic governance that reflects the will of the electorate.\n\nThe centre-right National Party, led by Christopher Luxon, secured a decisive victory, emerging as the largest party with the highest number of seats. This outcome positioned Luxon to become the new Prime Minister, succeeding Chris Hipkins of the centre-left Labour Party. Labour had governed for six years, with Hipkins taking the helm earlier in 2023 after Jacinda Ardern's resignation. The election results indicated a clear public mandate for change, driven by widespread concerns over economic performance, persistent inflation, and the escalating cost of living, which dominated campaign discourse. Voters appeared to favour National's promises of fiscal responsibility and tax cuts.\n\nDespite their strong showing, the National Party did not achieve an absolute majority, necessitating the formation of a coalition government. This triggered several weeks of complex and often protracted negotiations with potential partners, a common feature of New Zealand's proportional representation electoral system. Ultimately, National forged a governing alliance with two other right-leaning parties: the libertarian-leaning ACT Party, led by David Seymour, and the populist New Zealand First party, led by veteran politician Winston Peters. The inclusion of New Zealand First, known for its pragmatic and sometimes unpredictable stance, added a layer of complexity to the coalition talks, requiring careful balancing of diverse policy priorities.\n\nThe extensive coalition agreements, publicly released, detail the policy agenda and ministerial portfolios across the three parties. These documents typically involve compromises and strategic alignments on key areas such as economic management, law and order, and healthcare, all designed to ensure a stable working relationship and effective governance. Christopher Luxon officially assumed the role of Prime Minister, leading a government tasked with addressing the nation's economic challenges, delivering on its electoral promises, and navigating a complex global environment. The transition marks a significant realignment of power, with the Labour Party moving into opposition, where it will play a critical role in scrutinizing government policy, holding the executive accountable, and offering alternative perspectives. This election underscores the dynamic nature of New Zealand politics and the electorate's willingness to re-evaluate its leadership in response to evolving national priorities. The new government faces the immediate challenge of implementing its agenda while managing the expectations of its diverse support base.", "vocab": [{"word": "pivotal", "definition": "Of great importance, especially in deciding the outcome of something."}, {"word": "culminating", "definition": "Reaching a final stage or high point."}, {"word": "unicameral", "definition": "(Of a legislative body) having a single legislative chamber."}, {"word": "mandate", "definition": "The authority to carry out a policy or course of action, given by the electorate to a candidate or party."}, {"word": "protracted", "definition": "Lasting for a long time or longer than expected or usual."}, {"word": "libertarian-leaning", "definition": "Tending towards a political philosophy that advocates for minimal government intervention in personal, social, and economic affairs."}, {"word": "populist", "definition": "A political approach that strives to appeal to ordinary people who feel that their concerns are disregarded by established elite groups."}, {"word": "pragmatic", "definition": "Dealing with things sensibly and realistically in a way that is based on practical rather than theoretical considerations."}, {"word": "fiscal", "definition": "Relating to government revenue, especially taxes, and expenditure."}]}}, "questions": [{"q": "Which political party won the most seats in the recent New Zealand election?", "a": "The National Party won the most seats."}, {"q": "Who became the new Prime Minister of New Zealand after the election?", "a": "Christopher Luxon became the new Prime Minister."}], "id": "a23ac45fcfb", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxOREdFZHFwTWxmaVg1NUI0ekxTQk53ZWFMcjdQOGFMbzNTOXhBcnZrWk0tX0o5ejNsNzR3alI0SlZiSUtNSE5lSTFJOU5Xb21YNWo5YkYzeFFqbkNlTGhpTkxpUkZQY1hENUc1UHotREhpZXlDZHE1M2ZvOWgtaXZwV2pfckFXbFQtb3VydGVDSUFody1UeGhlempUN2ctVUI5OVNZU3hicGlYQUE?oc=5", "published": "2026-11-27T12:29:36+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "New Zealand Election: National Party One Seat Short of Majority", "excerpt": "New Zealand's recent election results show the National Party-led group is one seat short of forming a government, requiring further negotiations.", "levels": {"Beginner": {"text": "New Zealand had an election recently. People voted for new leaders. The National Party won the most votes. It is a big party that wants to lead the country. But to lead, a party or group of parties needs a special number of seats in parliament. This number is called a majority.\n\nThe National Party, with its friends, is one seat short of this majority. This means they do not have enough power by themselves to make a government. They need 61 seats to have a majority. Right now, they have 60 seats with their main partner, the ACT Party.\n\nSo, the National Party needs to talk to another small party. This small party might be New Zealand First. If New Zealand First joins them, they will have enough seats. Then, they can form a new government and start making decisions for the country. This talking and joining is called forming a coalition. It takes time to agree on things.", "vocab": [{"word": "Election", "definition": "When people vote to choose their leaders."}, {"word": "Parliament", "definition": "The group of people who make laws for a country."}, {"word": "Majority", "definition": "More than half of the votes or seats needed."}, {"word": "Coalition", "definition": "When different political parties work together."}, {"word": "Government", "definition": "The group of people who officially control a country."}]}, "Intermediate": {"text": "New Zealand's recent general election has concluded, but the path to forming a new government remains uncertain. The right-leaning bloc, led by the National Party, has fallen just one seat short of securing the parliamentary majority needed to govern. This outcome means complex negotiations are now underway to establish a stable administration.\n\nUnder New Zealand's Mixed-Member Proportional (MMP) electoral system, parties often need to form coalitions to reach the 61-seat threshold in the 120-seat Parliament. The National Party, along with its preferred partner, the ACT Party, currently holds 60 seats. This leaves them in a position where they must seek support from at least one additional party to achieve a working majority.\n\nThe most likely \"kingmaker\" in this scenario is the New Zealand First party, led by veteran politician Winston Peters. New Zealand First, which has previously formed governments with both major parties, holds a crucial number of seats that could tip the balance. Discussions between National, ACT, and New Zealand First are expected to be extensive, as they will need to agree on policy priorities and ministerial roles.\n\nUntil a formal agreement is reached and a new government is sworn in, the country's current administration remains in a caretaker capacity. The process of coalition building is a standard feature of MMP systems, designed to ensure broader representation, but it can also lead to prolonged periods of political negotiation. The focus now is on whether these parties can bridge their differences to form a cohesive government for the next parliamentary term.", "vocab": [{"word": "General election", "definition": "A national vote to choose representatives for government."}, {"word": "Parliamentary majority", "definition": "More than half of the seats in parliament, needed to pass laws."}, {"word": "Coalition", "definition": "An agreement between two or more political parties to work together in government."}, {"word": "Electoral system", "definition": "The rules and methods used for conducting elections and counting votes."}, {"word": "Kingmaker", "definition": "A person or party whose support is essential for others to form a government."}, {"word": "Caretaker capacity", "definition": "When a government continues to operate temporarily after an election until a new one is formed."}]}, "Advanced": {"text": "New Zealand's recent general election has ushered in a period of political uncertainty, as the right-leaning bloc, spearheaded by the National Party, has narrowly missed securing the outright parliamentary majority required to form a government. Falling short by a single seat, the outcome necessitates intricate coalition negotiations, a common feature under the nation's Mixed-Member Proportional (MMP) electoral system.\n\nThe National Party, having emerged as the largest party, is poised to lead a government, but its alliance with the libertarian ACT Party currently commands only 60 seats in the 120-member Parliament. This configuration leaves them one seat shy of the crucial 61-seat threshold, compelling them to engage with other parties to forge a stable administration. The MMP system, designed to ensure proportional representation, frequently results in hung parliaments where no single party or pre-election bloc achieves an absolute majority, thereby empowering smaller parties to act as \"kingmakers.\"\n\nIn this electoral landscape, the veteran-led New Zealand First party, under Winston Peters, is widely perceived as the pivotal player. With its distinct nationalist and populist platform, NZ First has a track record of aligning with both left and right-wing governments in the past, making it a pragmatic, albeit potentially demanding, coalition partner. The forthcoming discussions between National, ACT, and NZ First are anticipated to be protracted and complex, encompassing a wide array of policy concessions, ministerial portfolios, and the overall direction of the next government.\n\nThe protracted nature of these negotiations means the incumbent Labour government will continue in a caretaker capacity, managing day-to-day affairs without making significant policy shifts, until a new government is formally constituted. The challenge for the National Party leadership will be to reconcile the ideological differences and policy priorities of its prospective partners, particularly given NZ First's often unpredictable negotiating stance. A successful resolution will not only secure a governing majority but also lay the groundwork for a cohesive legislative agenda. Failure to form a viable coalition could potentially lead to a minority government or, in extreme circumstances, even another election, though this is rare. The political dexterity demonstrated in these post-election manoeuvres will ultimately determine New Zealand's governmental trajectory for the coming term.", "vocab": [{"word": "Ushered in", "definition": "Marked the beginning of something new or important."}, {"word": "Spearheaded", "definition": "Led or initiated an activity or movement."}, {"word": "Outright majority", "definition": "A clear and complete majority, without needing any additional support."}, {"word": "Necessitates", "definition": "Makes something necessary as a result."}, {"word": "Intricate", "definition": "Very complicated or detailed."}, {"word": "Hung parliament", "definition": "A parliament in which no political party or coalition has an absolute majority of seats."}, {"word": "Pivotal player", "definition": "A person or group that is extremely important and central to a situation."}, {"word": "Protracted", "definition": "Lasting for a long time or longer than expected."}]}}, "questions": [{"q": "What is the main problem the National Party faces after the election?", "a": "The National Party, with its partners, is one seat short of having enough seats to form a government."}, {"q": "Which party is likely to be important in helping the National Party form a government?", "a": "The New Zealand First party is likely to be important in helping the National Party form a government."}], "id": "a3fecb4a8c1", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c670278qk879o?at_medium=RSS&at_campaign=rss", "published": "2026-11-27T12:28:15+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "The Hidden Operation Behind the Biggest Sporting Event on Earth - Yahoo Sports", "excerpt": "The Hidden Operation Behind the Biggest Sporting Event on Earth Yahoo Sports", "levels": {"Beginner": {"text": "The Hidden Operation Behind the Biggest Sporting Event on Earth Yahoo Sports", "vocab": []}, "Intermediate": {"text": "The Hidden Operation Behind the Biggest Sporting Event on Earth Yahoo Sports", "vocab": []}, "Advanced": {"text": "The Hidden Operation Behind the Biggest Sporting Event on Earth Yahoo Sports", "vocab": []}}, "questions": [], "id": "a3b091c5ce5", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimwFBVV95cUxQejE1QVVpNTlibV9QVGl5MkxSdjVPbE1wSjFwQ2w2clIzMS1SX09ndnN1VkN1WFYyaXZKb25zbWtQOXVJM0VRbXdtMEZJU2hqNW1lZG1DS09iTFd6SzgtUDN1WnNmdmZlSnhtc0x4Q2RMM1JhZkJKbHdvRVVfYmc3eWNFekJQMUYyTmM3dWxobXV4MmdQWDVhZTF1RQ?oc=5", "published": "2026-11-27T12:32:00+09:00", "category": " const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
