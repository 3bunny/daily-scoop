 follow financial rules.", "vocab": [{"word": "Couple", "definition": "two people who are married or in a romantic relationship."}, {"word": "Charges", "definition": "official statements that someone has done something wrong or illegal."}, {"word": "Hid", "definition": "past tense of 'hide,' meaning to put something in a place where it cannot be seen or found."}, {"word": "Company", "definition": "a business or organization that makes or sells things."}, {"word": "Felony", "definition": "a very serious crime."}, {"word": "Court", "definition": "a place where legal cases are heard by a judge."}]}, "Intermediate": {"text": "A couple residing in Plymouth, Minnesota, is currently facing significant legal challenges. They have been hit with felony charges for allegedly concealing a substantial sum of money, specifically $813,000, within a company bank account. This development has brought their financial dealings under intense scrutiny from law enforcement and financial authorities.\n\nThe act of hiding such a large amount of money in a business account often suggests an attempt to evade financial obligations, such as taxes, or to keep assets from creditors. While the specific motivations are part of the ongoing investigation, the nature of the charges indicates a serious breach of financial regulations and potentially criminal intent. Felony charges are reserved for grave offenses and carry severe penalties upon conviction, which can include lengthy prison sentences and substantial monetary fines, as well as damage to one's reputation.\n\nAuthorities are actively pursuing this case, and the couple will soon appear in court to address the allegations. The legal process will involve prosecutors presenting evidence to a judge and possibly a jury, who will then determine guilt or innocence. This type of financial investigation typically involves examining bank records, company ledgers, and other financial documents to trace the movement of funds. The goal is to establish how the money was acquired, why it was hidden, and who benefited from its concealment.\n\nThis incident serves as a stark reminder of the legal ramifications associated with financial misconduct and the importance of transparent financial practices. Businesses and individuals are expected to adhere to strict reporting requirements to ensure fairness and prevent illicit activities. The outcome of this case will likely underscore the seriousness with which authorities treat attempts to circumvent financial laws.", "vocab": [{"word": "Residing", "definition": "living in a particular place."}, {"word": "Allegedly", "definition": "used when something is said to be true but has not been proven."}, {"word": "Concealing", "definition": "hiding something."}, {"word": "Substantial", "definition": "large in amount or value."}, {"word": "Scrutiny", "definition": "careful and thorough examination."}, {"word": "Evade", "definition": "to avoid doing something, especially something illegal or unpleasant."}, {"word": "Ramifications", "definition": "the possible results or effects of an action or decision."}]}, "Advanced": {"text": "A Plymouth, Minnesota couple finds themselves embroiled in a serious legal predicament, facing felony charges for the alleged illicit concealment of $813,000 within a corporate bank account. This significant development has triggered an intensive investigation into their financial practices, drawing the attention of both local law enforcement and federal financial regulatory bodies, highlighting the pervasive reach of financial crime enforcement.\n\nThe act of surreptitiously stashing a considerable sum of money in a business entity's account typically signals an attempt to circumvent legal and financial obligations. Such maneuvers are often employed to evade tax liabilities, shield assets from creditors during bankruptcy proceedings, or even to launder funds derived from other unlawful activities. While the precise criminal intent remains a central focus of the ongoing prosecutorial scrutiny, the gravity of the felony charges underscores a profound breach of established financial statutes and a potential disregard for economic transparency. Conviction for such offenses carries severe punitive measures, including protracted incarceration, substantial pecuniary penalties, and irreparable damage to one's professional and personal standing, often leading to long-term reputational ruin.\n\nThe legal proceedings are anticipated to commence shortly, with the couple slated for court appearances to formally respond to the indictment. The prosecutorial strategy will entail presenting a compelling body of evidence, meticulously gathered through forensic accounting and extensive document review, to a presiding judge and potentially a jury. This investigative process typically involves a deep dive into bank statements, corporate ledgers, tax filings, communications records, and other pertinent financial instruments to meticulously trace the provenance and trajectory of the funds. Financial institutions are often compelled to cooperate with such investigations, providing access to transaction histories and account details, which are crucial for building a robust case. The objective is to definitively ascertain the means by which the money was acquired, the rationale behind its clandestine placement, and the ultimate beneficiaries of its concealment, thereby establishing a clear chain of culpability.\n\nThis incident serves as a salient illustration of the stringent legal ramifications associated with financial impropriety and the paramount importance of adherence to robust financial reporting standards. Both corporate entities and private citizens are mandated to operate within a framework of strict regulatory compliance, designed to foster equitable economic practices, maintain market integrity, and deter illicit financial undertakings that undermine public trust. The eventual verdict in this high-profile case is poised to reinforce the unwavering resolve of authorities to prosecute individuals who endeavor to subvert the integrity of the financial system, sending a clear message about the severe consequences of such clandestine dealings and the broader societal impact of financial malfeasance.", "vocab": [{"word": "Embroiled", "definition": "involved in a difficult or complicated situation."}, {"word": "Illicit", "definition": "forbidden by law, rules, or custom."}, {"word": "Concealment", "definition": "the action of hiding something or preventing it from being known."}, {"word": "Surreptitiously", "definition": "in a way that attempts to avoid notice or attention; secretly."}, {"word": "Circumvent", "definition": "find a way around (an obstacle or difficulty)."}, {"word": "Prosecutorial scrutiny", "definition": "close and careful examination by legal authorities responsible for bringing criminal cases to court."}, {"word": "Pecuniary", "definition": "relating to or consisting of money."}, {"word": "Indictment", "definition": "a formal accusation by a grand jury that there is enough evidence for a criminal trial."}]}}, "questions": [{"q": "What is the main accusation against the Plymouth couple?", "a": "The couple is accused of hiding $813,000 in a company bank account, leading to felony charges."}, {"q": "What are some potential reasons people might hide money in a company account, as mentioned in the articles?", "a": "People might hide money to evade tax liabilities, shield assets from creditors during bankruptcy, or to launder funds from other unlawful activities."}], "id": "aa42a52d6c0", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinAFBVV95cUxPVWdyUmo2SVpoMExSaDVWblNmb3FIaGpUc292bmdodlFjdnU3NEY5bkRDTVdWZktoaGJsVTZ4NHVxWi1GN0hzZ0JfMEY3U0NjTFptZ2g0amZCSEpmZ0VCNnpCOXg4X0dKZmkzNk16WnpHYTQtbGpVWkUzdGhObmtpVWJ4NnZMY2RxMnlDdEo2MUZjM0htaDd2QlR1RFo?oc=5", "published": "2026-07-26T07:32:45+09:00", "category": "business", "category_title": "Business"}, {"headline": "College Park Business Faces Public Backlash After Reporter Visit", "excerpt": "A College Park business recently experienced significant public criticism following a visit from FOX 5 Atlanta reporter Rick Jackson.", "levels": {"Beginner": {"text": "A business in College Park, Georgia, is facing problems. Many people are upset with the business. This trouble started after Rick Jackson visited the place. Rick Jackson is a reporter for FOX 5 Atlanta news.\n\nNews reporters often visit different places to find stories. They tell people what is happening in the community. After Rick Jackson's visit, the College Park business got \"backlash.\" This means many people shared negative comments and feelings about the business. They might have posted online or talked about it.\n\nWe do not know exactly why people are upset. The news report from Rick Jackson might have shown something that made people unhappy. When a news story comes out, it can make customers feel strongly. Sometimes, businesses have to work hard to fix their image after such news. This event shows how news can quickly change how people feel about a local store or company. The business now needs to deal with these negative feelings from the public.", "vocab": [{"word": "business", "definition": "a company that sells things or services."}, {"word": "facing", "definition": "dealing with a difficult situation."}, {"word": "reporter", "definition": "a person who finds and tells news stories."}, {"word": "backlash", "definition": "a strong negative reaction from many people."}, {"word": "upset", "definition": "feeling unhappy, angry, or worried."}, {"word": "image", "definition": "the way people think about a person or company."}]}, "Intermediate": {"text": "A local business situated in College Park, Georgia, has recently encountered considerable public criticism, often referred to as \"backlash.\" This wave of negative sentiment emerged following a visit to the establishment by Rick Jackson, a prominent news reporter from FOX 5 Atlanta.\n\nRick Jackson is well-known in the Atlanta area for his investigative reporting and for covering local stories that are significant to the community. When a news reporter like Jackson visits a business, it typically signals that a story is being developed for public broadcast, often focusing on consumer issues, community concerns, or unique business practices. While the specific details of Jackson's report regarding the College Park business have not been widely disclosed, the subsequent public reaction indicates that the coverage likely sparked strong opinions and concerns among viewers.\n\nPublic backlash can manifest in various ways, including a surge of negative comments on social media platforms, unfavorable online reviews, or direct complaints to the business or regulatory bodies. For any business, such widespread criticism can significantly impact its reputation and erode consumer trust. Companies often rely heavily on positive public perception and word-of-mouth to attract and retain customers. When a news story casts a business in a negative light, it can quickly undermine years of effort in building a good standing, potentially leading to a decline in patronage and revenue.\n\nThis incident underscores the powerful influence of local media on community businesses. News reports can swiftly shape public opinion, and businesses must be prepared to manage their public relations effectively, especially when under media scrutiny. The College Park business is now tasked with addressing these public concerns, potentially through public statements, corrective actions, or direct engagement with affected customers, all in an effort to restore its standing within the community.", "vocab": [{"word": "encountered", "definition": "experienced or met with."}, {"word": "considerable", "definition": "large in amount or degree."}, {"word": "sentiment", "definition": "a feeling or opinion."}, {"word": "prominent", "definition": "important and well-known."}, {"word": "disclosed", "definition": "revealed or made known."}, {"word": "reputation", "definition": "the general opinion that people have about someone or something."}, {"word": "scrutiny", "definition": "careful and close examination."}]}, "Advanced": {"text": "A College Park establishment has recently found itself at the epicenter of significant public disapproval, experiencing what is commonly termed \"backlash.\" This wave of negative sentiment was triggered by a visit from Rick Jackson, a veteran investigative reporter with FOX 5 Atlanta, whose presence often portends a forthcoming news segment examining local issues.\n\nRick Jackson holds a distinguished position within Atlanta's media landscape, recognized for his incisive reporting on consumer affairs, community grievances, and business practices that warrant public attention. His visits to commercial entities are typically precursors to reports designed to inform the public, and occasionally, to hold businesses accountable for their operations or service delivery. While the precise nature and content of Jackson's report concerning the College Park business remain largely undisclosed, the ensuing public outcry strongly suggests that the coverage highlighted aspects that resonated negatively with viewers, prompting a swift and vocal response across various platforms.\n\nThe manifestation of this backlash can be multifaceted, encompassing a deluge of critical comments across social media platforms, a proliferation of unfavorable online reviews, and direct complaints lodged with the business itself or relevant regulatory agencies. For any commercial enterprise, such widespread public condemnation poses a substantial threat to its brand equity and consumer confidence. Businesses meticulously cultivate positive public perception, understanding its critical role in customer acquisition and retention. A news report that casts an organization in an unfavorable light can rapidly erode years of goodwill, potentially leading to a precipitous decline in patronage, revenue, and overall market standing. The immediacy and virality of digital media further amplify the challenge, as negative narratives can spread globally in moments.\n\nThis incident serves as a potent reminder of the profound influence wielded by local media outlets over community commerce and public discourse. News narratives possess the capacity to instantaneously mold public opinion, necessitating that businesses maintain robust and proactive public relations strategies, particularly when operating under intense media scrutiny. The College Park business is now confronted with the imperative task of mitigating these public concerns. This may involve issuing transparent public statements, implementing visible corrective measures to address the underlying issues, or engaging directly and empathetically with aggrieved customers to rebuild trust. Navigating such a crisis effectively is crucial for salvaging its reputation, demonstrating accountability, and ensuring its long-term viability within the competitive market. The way a business responds to such scrutiny can often define its future trajectory more than the initial incident itself.", "vocab": [{"word": "epicenter", "definition": "the central point of something, typically a difficult or unpleasant situation."}, {"word": "portends", "definition": "is a sign or warning that something, especially something momentous or calamitous, is likely to happen."}, {"word": "distinguished", "definition": "successful, authoritative, and commanding great respect."}, {"word": "incisive", "definition": "(of a person or mental process) intelligently analytical and clear-thinking; accurate and to the point."}, {"word": "precursors", "definition": "a person or thing that comes before another of the same kind; a forerunner."}, {"word": "proliferation", "definition": "rapid increase in the number or amount of something."}, {"word": "brand equity", "definition": "the commercial value that derives from consumer perception of the brand name of a particular product or service, rather than from the product or service itself."}, {"word": "mitigating", "definition": "making something less severe, serious, or painful."}]}}, "questions": [{"q": "What kind of reaction did the College Park business receive after Rick Jackson's visit?", "a": "The business received \"backlash,\" which means strong negative public criticism or reaction."}, {"q": "Why is a news reporter's visit often significant for a business?", "a": "A news reporter's visit often signals that a story is being developed for public broadcast, which can significantly impact the business's reputation and public perception, either positively or negatively."}], "id": "aaf64fb7d3d", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE5SbDRXaFhDOFFiVXlXOG5lMTJMV1lBZTZwVDRvcjUzb2tfVlMwREhiVEdaMS13bWxENzREVi1mSmJLcVNFeDAwOTVYRWREc2dieVAzS3V2OEFrNVVxbUZXZ0NWN1_SAWpBVV95cUxOUU9UVC1tclZQdGdHamJPYTJLNVBLRDlDTUNnSzZPSGVRX25fa1BVSE5IY0dtdXdkTi1mVEcwbm0tQ19paU9mUDVtcHhwTm10SXVoWm1VZkdkQzVINHNSRE14ellkQmRDWXNR?oc=5", "published": "2026-07-26T07:26:03+09:00", "category": "business", "category_title": "Business"}, {"headline": "Shinkin Central Bank's Unique Financial Instrument Explained", "excerpt": "Shinkin Central Bank, a key financial institution in Japan, issues special certificates that are traded on the stock exchange.", "levels": {"Beginner": {"text": "Shinkin Central Bank is a special bank in Japan. It helps many smaller banks called \"shinkin banks.\" These shinkin banks are like local credit unions. Shinkin Central Bank makes sure these local banks are strong and stable.\n\nThe bank has a special kind of share called \"Preferred Subscription Certificates.\" These are like parts of the bank that people can buy. They are traded on the Tokyo Stock Exchange, which is where shares are bought and sold. The code for these shares is TSE:8421.\n\nWhen people look at these shares, they often check something called \"price to book forward.\" This is a way to see how much the shares cost compared to the bank's value. It helps investors understand if the shares are expensive or not. A \"forward\" look means they are thinking about the future value of the bank. This information helps people who want to invest in Shinkin Central Bank's special shares. It shows how the market sees the bank's future financial health.", "vocab": [{"word": "Special", "definition": "Different from usual; not ordinary."}, {"word": "Stable", "definition": "Not likely to change or fall; strong and steady."}, {"word": "Certificates", "definition": "Official papers that show you own something."}, {"word": "Traded", "definition": "Bought and sold on a market."}, {"word": "Value", "definition": "How much something is worth."}, {"word": "Future", "definition": "The time that is to come."}]}, "Intermediate": {"text": "Shinkin Central Bank plays a crucial role in Japan's financial landscape. It serves as the central financial institution for a network of \"shinkin banks,\" which are essentially member-owned credit unions operating at a local level across Japan. The Central Bank provides financial stability, liquidity, and various support services to these shinkin banks, ensuring their sound operation and contributing to regional economic development.\n\nOne of the financial instruments issued by Shinkin Central Bank is its \"Preferred Subscription Certificates,\" identified by the ticker TSE:8421 on the Tokyo Stock Exchange. These certificates are a type of hybrid security, combining features of both debt and equity. They typically offer a fixed dividend payment to investors but usually do not carry voting rights, unlike common shares. For Shinkin Central Bank, issuing these certificates is a way to raise capital, strengthening its financial base to continue supporting the shinkin bank system.\n\nInvestors and analysts often examine the \"price to book forward\" ratio for these certificates. This metric compares the current market price of a certificate to the bank's projected book value per share in the future. Book value represents the net asset value of the bank, essentially what would be left if all assets were sold and all debts paid. A \"forward\" ratio uses future estimates, providing insight into how the market anticipates the bank's performance and asset growth. A higher price-to-book forward ratio might suggest that investors expect strong future earnings or growth, while a lower ratio could indicate undervaluation or concerns about future prospects. This valuation tool helps investors assess the potential return and risk associated with Shinkin Central Bank's unique certificates.", "vocab": [{"word": "Crucial", "definition": "Extremely important or necessary."}, {"word": "Landscape", "definition": "The overall situation or environment, especially in a particular area."}, {"word": "Liquidity", "definition": "The ability to easily convert assets into cash without losing value."}, {"word": "Hybrid", "definition": "Something made by combining two different elements."}, {"word": "Dividend", "definition": "A payment made by a company to its shareholders, usually a portion of its profits."}, {"word": "Projected", "definition": "Estimated or forecast for the future."}, {"word": "Undervaluation", "definition": "When something is considered to be worth more than its current market price."}]}, "Advanced": {"text": "Shinkin Central Bank occupies a distinctive and pivotal position within Japan's intricate financial architecture. It functions as the apex financial institution for the nation's extensive network of shinkin banks, which are community-based credit unions. Unlike commercial banks, shinkin banks are member-owned cooperatives primarily serving small and medium-sized enterprises (SMEs) and local residents, fostering regional economic vitality. Shinkin Central Bank's mandate encompasses providing comprehensive financial services, including deposit-taking, lending, and settlement operations, to its member shinkin banks. Crucially, it also plays a significant role in ensuring the systemic stability and liquidity of the shinkin banking sector, acting as a lender of last resort and a conduit for monetary policy transmission.\n\nAmong its capital-raising instruments, Shinkin Central Bank issues \"Preferred Subscription Certificates,\" identifiable by the Tokyo Stock Exchange ticker TSE:8421. These certificates are sophisticated hybrid securities, exhibiting characteristics of both debt and equity. Typically, they offer a fixed or floating dividend yield, providing a predictable income stream for investors, but generally lack the voting rights associated with common stock. From the issuer's perspective, these certificates are an effective mechanism for bolstering regulatory capital, particularly Tier 1 capital, without diluting the control of existing stakeholders. This capital infusion is vital for Shinkin Central Bank to maintain robust financial health and fulfill its mandate of supporting the shinkin banking system, especially in times of economic volatility or regulatory adjustments.\n\nFinancial analysts and institutional investors meticulously scrutinize the \"price to book forward\" ratio for these Preferred Subscription Certificates. This valuation multiple compares the current market price of the certificate to the bank's projected book value per share for a future period. Book value, fundamentally, represents the accounting value of a company's equity, derived by subtracting total liabilities from total assets. The \"forward\" aspect introduces a crucial predictive element, reflecting market expectations regarding the bank's future profitability, asset growth, and capital accumulation. A higher price-to-book forward ratio typically signals strong market confidence in the bank's future earnings power, growth trajectory, and efficient asset utilization. Conversely, a lower ratio might suggest market skepticism, potential undervaluation, or anticipated challenges to profitability and asset quality. For a unique entity like Shinkin Central Bank, whose primary objective is systemic stability rather than maximizing shareholder profit, this metric offers nuanced insights into how the market assesses its long-term viability, capital adequacy, and the perceived risk-return profile of its specialized financial instruments. Understanding this ratio is paramount for sophisticated investors seeking to gauge the intrinsic value and future prospects of such a distinctive financial institution.", "vocab": [{"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Intricate", "definition": "Very complicated or detailed."}, {"word": "Mandate", "definition": "An official order or commission to do something; the authority to carry out a policy."}, {"word": "Conduit", "definition": "A channel for conveying something, especially information or money."}, {"word": "Bolstering", "definition": "Supporting or strengthening."}, {"word": "Diluting", "definition": "Making something weaker or less effective by adding something else."}, {"word": "Meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "Nuanced", "definition": "Characterized by subtle shades of meaning or expression."}]}}, "questions": [{"q": "What is the main role of Shinkin Central Bank in Japan?", "a": "It acts as a central financial institution that supports local credit unions, known as shinkin banks, ensuring their stability and providing financial services."}, {"q": "What does \"Preferred Subscription Certificates\" refer to, and why might Shinkin Central Bank issue them?", "a": "They are a type of special security issued by Shinkin Central Bank, combining features of debt and equity. The bank issues them to raise capital and strengthen its financial base."}], "id": "acfd657aeb0", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimAFBVV95cUxNYlVoY0preGxQa3NCRmM0OUtiZm4wWnpPVmdCQWNkMmJlWVRJbGNuTlFZbnBJaFdWM1Z0R0pZYUJkYkVPckx5SGZ2cFVtVWpWb2lSbGx0Z21vMWdfWlZWS2ZjemVYZDZJY3d2TGZrbWpFR3F4QkV0UlBfWThDMVZGdjd1dWdMblV5cTNyMENtNnBtSmhocURjeg?oc=5", "published": "2026-07-26T05:55:29+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Iran's Economy Battles Persistent Monthly Inflation Shocks", "excerpt": "Iran's economy battles severe, persistent inflation, experiencing monthly price surges similar to the United States' 2022 peak.", "levels": {"Beginner": {"text": "Iran is facing a big problem with prices. Things like food and clothes are getting more expensive very quickly. This is called inflation. It means your money buys less than before.\n\nIn Iran, prices go up almost every month. This is like the big price increases the United States saw in 2022, but Iran experiences this problem much more often. Many people in Iran are finding it hard to buy what they need for daily life. Their money does not go as far as it used to. This makes life very difficult for families.\n\nThe country's economy has some big challenges. One reason for these high prices is that other countries have put rules, called sanctions, on Iran. These rules make it hard for Iran to trade with many parts of the world. This affects how much money the country has and how much things cost. The government is trying to fix the economy, but it is a slow and hard process. People hope that prices will become more stable soon so they can afford basic goods again.", "vocab": [{"word": "Inflation", "definition": "When prices for things go up a lot, so your money buys less."}, {"word": "Expensive", "definition": "Costing a lot of money."}, {"word": "Economy", "definition": "How a country makes and uses money and goods."}, {"word": "Sanctions", "definition": "Rules put by other countries to limit trade or business."}, {"word": "Struggle", "definition": "To have a very hard time doing something."}, {"word": "Stable", "definition": "Not changing much; staying the same."}]}, "Intermediate": {"text": "Iran is currently grappling with a severe and persistent economic challenge: high inflation. Prices for essential goods and services are rising rapidly, almost on a monthly basis. This situation is often compared to the significant inflation spike experienced in the United States in 2022, but in Iran, this level of price increase is a much more frequent occurrence, indicating a deeper, more structural economic issue.\n\nInflation means that the purchasing power of money decreases over time. For ordinary Iranian citizens, this translates into a constant struggle to afford basic necessities like food, housing, and medicine. Savings quickly lose their value, making it difficult for families to plan for the future or maintain their standard of living.\n\nSeveral factors contribute to Iran's ongoing inflation crisis. A major cause is the extensive international sanctions, particularly those imposed by the United States. These sanctions severely restrict Iran's ability to sell oil and engage in international trade, limiting its foreign currency earnings. This, in turn, weakens the national currency, the Iranian Rial, making imported goods more expensive and fueling domestic price increases.\n\nFurthermore, internal economic mismanagement and a lack of diverse revenue streams exacerbate the problem. The government often relies on printing more money to cover its expenses, which further devalues the currency and pushes prices higher. While the government has stated its commitment to controlling inflation, the complex interplay of external pressures and internal policies makes finding a quick solution challenging. The persistent nature of this inflation profoundly impacts the daily lives and long-term economic stability of millions of Iranians.", "vocab": [{"word": "Persistent", "definition": "Continuing to exist or happen for a long time."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Purchasing power", "definition": "The amount of goods and services that can be bought with a unit of currency."}, {"word": "Sanctions", "definition": "Official orders or laws stopping trade or communication with another country as a punishment."}, {"word": "Currency", "definition": "The system of money used in a particular country."}, {"word": "Exacerbate", "definition": "To make a problem, bad situation, or negative feeling worse."}, {"word": "Stability", "definition": "The state of being steady and not changing."}]}, "Advanced": {"text": "Iran is currently enduring a profound and protracted period of high inflation, a socio-economic crisis characterized by rapid and relentless price increases for goods and services. This inflationary environment is so severe that it is frequently likened to the peak inflation shock experienced by the United States in 2022, but with a critical distinction: in Iran, such significant price surges are not an anomaly but a near-monthly occurrence, underscoring a deeply entrenched structural economic vulnerability rather than a temporary market aberration.\n\nThe erosion of purchasing power is a daily reality for millions of Iranians. As the national currency, the Iranian Rial, continues to depreciate, the cost of living escalates dramatically. This makes essential commodities, from foodstuffs to pharmaceuticals, increasingly unaffordable, pushing more families into poverty and diminishing the quality of life for the middle class. Savings are rapidly devalued, eliminating financial security and stifling long-term investment or planning.\n\nThe roots of Iran's persistent inflation are multifaceted and deeply intertwined. Foremost among them are the stringent international sanctions, particularly those re-imposed and expanded by the United States. These punitive measures severely curtail Iran's ability to export oil, its primary revenue source, and restrict its access to the global financial system. This limits foreign currency reserves, exacerbates the depreciation of the Rial, and inflates the cost of imported raw materials and finished goods, which then permeates the domestic economy.\n\nCompounding these external pressures are internal economic challenges. Decades of economic mismanagement, including inefficient state-owned enterprises, a large public sector, and a reliance on oil revenues, have left the economy susceptible to shocks. Furthermore, the government's fiscal policies, often involving the monetization of budget deficits through the printing of money, directly fuel inflationary spirals. The lack of economic diversification and a robust private sector further constrains growth and resilience.\n\nWhile Iranian authorities have articulated strategies to combat inflation, including monetary tightening and efforts to boost domestic production, the efficacy of these measures is often undermined by the overarching impact of sanctions and the inherent structural weaknesses. The persistent inflationary pressures not only create immediate hardship but also pose significant risks to social cohesion and political stability, making it one of the most pressing challenges facing the nation.", "vocab": [{"word": "Protracted", "definition": "Lasting for a long time or longer than expected or usual."}, {"word": "Socio-economic", "definition": "Relating to or concerned with the interaction of social and economic factors."}, {"word": "Aberration", "definition": "A departure from what is normal, usual, or expected, typically an unwelcome one."}, {"word": "Depreciate", "definition": "To diminish in value over a period of time."}, {"word": "Commodities", "definition": "A raw material or primary agricultural product that can be bought and sold, such as copper or coffee."}, {"word": "Stringent", "definition": "(Of regulations, requirements, or conditions) strict, precise, and exacting."}, {"word": "Monetization", "definition": "The process of converting something into money or currency."}, {"word": "Efficacy", "definition": "The ability to produce a desired or intended result."}]}}, "questions": [{"q": "What is the main economic problem Iran is facing, according to the article?", "a": "Iran is facing severe and persistent high inflation, meaning prices for goods and services are rising very quickly."}, {"q": "What are some key reasons mentioned for Iran's high inflation?", "a": "Key reasons include extensive international sanctions (especially from the United States), internal economic mismanagement, and the depreciation of the national currency (Iranian Rial)."}], "id": "a1cd9b0ca57", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE4xYXphUFkwR2pEVm9acUkxWC15cThXSDlUQ3BxNVZBMTExeVptLWtsdkc5eFZCSTlodUNiZ2RJRnZPdmI0NDduNFVUeUhkblkxSmc?oc=5", "published": "2026-07-26T05:31:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Alex Eala's Wimbledon Run Ignites Philippine Tennis Boom", "excerpt": "Filipino tennis star Alex Eala's success at Wimbledon is making the sport, once for the wealthy, popular with everyday people.", "levels": {"Beginner": {"text": "Alex Eala is a young tennis player from the Philippines. She did very well at Wimbledon, a big tennis tournament. Because of her success, many more people in her country are now interested in tennis.\n\nBefore Alex Eala, tennis was mostly a sport for rich people in the Philippines. Most Filipinos loved other sports like basketball and boxing. These two sports were very popular for a long time.\n\nBut now, things are changing. Alex Eala's good performance at Wimbledon has made tennis popular for everyone. Everyday Filipinos are watching and learning about tennis. Her success makes many people proud. It shows that Filipinos can be great at tennis too, not just basketball or boxing. This is a big change for sports in the Philippines. More young people might want to play tennis now.", "vocab": [{"word": "player", "definition": "a person who plays a sport or game."}, {"word": "popular", "definition": "liked by many people."}, {"word": "rich", "definition": "having a lot of money or valuable possessions."}, {"word": "sport", "definition": "an activity involving physical exertion and skill in which an individual or team competes against another or others."}, {"word": "country", "definition": "a nation or territory."}, {"word": "changing", "definition": "becoming different."}]}, "Intermediate": {"text": "A young Filipino tennis sensation, Alex Eala, is sparking a remarkable change in her home country's sports landscape. Her impressive performance at Wimbledon, one of the world's most prestigious tennis tournaments, has ignited a widespread passion for the sport among everyday Filipinos.\n\nTraditionally, the Philippines has been a nation obsessed with basketball and boxing. These sports have produced national heroes like Manny Pacquiao and are deeply woven into the country's cultural fabric. For decades, basketball courts dotted every neighborhood, and major boxing matches brought the entire nation to a standstill. Tennis, on the other hand, was largely perceived as an elite pastime, reserved for the wealthy and privileged, with limited accessibility for the general public due to the cost of equipment, coaching, and court access.\n\nHowever, Alex Eala's burgeoning success, particularly her strong showing in the Wimbledon junior tournaments, is rapidly altering this perception. Her achievements on the international stage have brought tennis into the mainstream, inspiring a new generation of fans and aspiring athletes. Filipinos are now following her journey with immense national pride, seeing her as a symbol of what their country can achieve in a sport previously considered out of reach.\n\nEala's rise has shown that talent can emerge from anywhere, challenging the long-held belief that tennis is only for a select few. This \"smash hit\" moment for tennis is not just about one player; it represents a significant cultural shift, making the sport more inclusive and accessible to all. Her story is encouraging more young people to pick up a racket, potentially leading to a boom in tennis participation and development across the archipelago. This newfound enthusiasm could reshape the country's sporting identity, moving beyond its traditional strongholds.", "vocab": [{"word": "sensation", "definition": "a person or thing that causes great excitement and interest."}, {"word": "ignited", "definition": "started or caused to burn; here, caused a strong feeling to begin."}, {"word": "traditionally", "definition": "according to tradition; as has been done for a long time."}, {"word": "perceived", "definition": "understood or thought of in a particular way."}, {"word": "burgeoning", "definition": "beginning to grow or increase rapidly."}, {"word": "aspirational", "definition": "relating to or characterized by a strong desire to achieve something high or great."}, {"word": "reshape", "definition": "change the shape or form of something."}]}, "Advanced": {"text": "The Philippines, a nation long captivated by the electrifying dunks of basketball and the formidable punches of boxing, is witnessing an unprecedented shift in its sporting affections. At the heart of this cultural metamorphosis is Alex Eala, a prodigious young tennis player whose compelling run at Wimbledon has catalyzed a nationwide embrace of a sport once considered the exclusive preserve of the affluent.\n\nFor generations, the sporting landscape of the archipelago has been dominated by two giants. Basketball, with its ubiquitous courts and fervent local leagues, and boxing, which has produced global icons like Manny Pacquiao, are deeply ingrained in the Filipino psyche, often serving as powerful vehicles for national identity and social mobility. Tennis, conversely, has historically struggled to penetrate this cultural stronghold. Perceived as an elitist pursuit, its high entry barriers—expensive equipment, specialized coaching, and limited public court access—rendered it largely inaccessible to the broader demographic, confining its appeal to a privileged few.\n\nHowever, Eala's burgeoning career, marked by significant achievements on the junior international circuit, including Grand Slam junior titles, and her notable performance at Wimbledon, has dramatically altered this socio-economic perception. Her prowess on the hallowed grass courts of Wimbledon, even in junior categories, resonated deeply with her compatriots, sparking a collective sense of pride and possibility. She has become a formidable role model, demonstrating that Filipino talent can not only compete but excel on the global tennis stage.\n\nThis \"smash hit\" phenomenon extends beyond mere viewership; it is fostering a tangible increase in grassroots interest. Local tennis clubs and coaches are reporting a surge in inquiries, particularly from younger demographics eager to emulate Eala's success. Her journey is dismantling the long-standing stereotype of tennis as an exclusive sport, transforming it into an aspirational endeavor for everyday Filipinos. This shift is crucial for diversifying the nation's sporting talent pool and cultivating a more inclusive athletic culture.\n\nEala's impact underscores the profound influence individual athletes can wield in shaping national narratives. Her success is not just about winning matches; it's about challenging entrenched perceptions, democratizing access, and inspiring a nation to reimagine its sporting future. As more young Filipinos pick up rackets, fueled by Eala's trailblazing path, the country stands on the cusp of a tennis boom that could redefine its sporting identity for decades to come, moving beyond its traditional strongholds to embrace a broader spectrum of athletic excellence.", "vocab": [{"word": "captivated", "definition": "strongly attracted and held the attention of someone."}, {"word": "metamorphosis", "definition": "a process of transformation, or change."}, {"word": "prodigious", "definition": "remarkably or impressively great in extent, size, or degree; extraordinary."}, {"word": "catalyzed", "definition": "caused or accelerated (a process or event)."}, {"word": "ubiquitous", "definition": "present, appearing, or found everywhere."}, {"word": "democratizing", "definition": "making something accessible to everyone."}, {"word": "cultivating", "definition": "trying to acquire or develop (a quality, sentiment, or skill)."}, {"word": "trailblazing", "definition": "being a pioneer in a particular field or activity."}]}}, "questions": [{"q": "What two sports were traditionally most popular in the Philippines before Alex Eala's success?", "a": "Basketball and boxing were traditionally the most popular sports in the Philippines."}, {"q": "How has Alex Eala's performance at Wimbledon changed the perception of tennis in the Philippines?", "a": "Alex Eala's Wimbledon performance has changed the perception of tennis from being an elite sport for the wealthy to a popular and accessible sport for everyday Filipinos, inspiring national pride and new interest."}], "id": "a7919f80beb", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c3v0lyrndn7o?at_medium=RSS&at_campaign=rss", "published": "2026-07-26T07:15:14+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Brazil Denies Visas to U.S. Group Questioning Election System", "excerpt": "Brazil has refused visas for a U.S. group that wanted to question its election system, according to officials.", "levels": {"Beginner": {"text": "Brazil said no to some people from the United States. These people wanted to visit Brazil as part of a group, called a \"delegation.\" This group wanted to look at Brazil's election system. They thought there might be problems with how Brazil votes and wanted to say the elections were not fair.\n\nBut Brazil's government did not let them come. They denied their visas. A visa is a special paper that lets you enter a country. Without it, you cannot go.\n\nOfficials in Brazil said the U.S. group wanted to \"impugn\" their election system. This means they wanted to say the elections were not fair or correct. Brazil's government believes its elections are safe and fair. This happened after Brazil had a big election recently, where a new president was chosen. Some people, especially in the U.S., had questions about this election. But Brazil's officials are firm. They do not want outside groups to question their voting process in this way. They see it as trying to make their system look bad. So, the U.S. group cannot come to Brazil.", "vocab": [{"word": "Denied", "definition": "Said no to; refused to allow."}, {"word": "Visas", "definition": "Official documents or stamps placed in a passport that allow a person to enter another country."}, {"word": "Delegation", "definition": "A group of people chosen to represent others."}, {"word": "Impugn", "definition": "To say that something is not right or fair."}, {"word": "Officials", "definition": "People who have an important position in a government or organization."}, {"word": "Election", "definition": "When people vote to choose leaders."}]}, "Intermediate": {"text": "Brazil has reportedly denied visas to a United States delegation that intended to visit the country to question its election system. According to officials, the Brazilian government views the delegation's stated purpose as an attempt to \"impugn\" the integrity of its democratic process. A visa is an official endorsement allowing a traveler to enter, stay in, or pass through a country. Without these essential documents, the U.S. group cannot proceed with their planned visit.\n\nThe delegation, reportedly composed of conservative U.S. lawmakers and activists, had expressed doubts about the fairness and security of Brazil's recent presidential election. This election, held in late 2022, saw Luiz Inácio Lula da Silva defeat incumbent Jair Bolsonaro. Bolsonaro, much like former U.S. President Donald Trump, had frequently questioned the reliability of electronic voting machines and suggested the possibility of fraud, though no widespread irregularities were ever proven by official bodies.\n\nBrazilian authorities have consistently defended their electoral system as robust and transparent. They argue that the electronic voting machines are secure and that the results are reliable. The country's top electoral court, the Superior Electoral Court (TSE), has repeatedly affirmed the integrity of the process. By denying the visas, Brazil's government is signaling its firm stance against what it perceives as external interference in its sovereign affairs and an effort to undermine public trust in its institutions.\n\nThis decision highlights the sensitivity surrounding election integrity in many democracies today, especially when external parties seek to challenge established processes without official invitation or concrete evidence. The Brazilian government's action underscores its commitment to protecting its electoral sovereignty and preventing any actions that could destabilize its political landscape. It also reflects a broader global trend where nations are increasingly protective of their internal political processes against perceived foreign meddling.", "vocab": [{"word": "Delegation", "definition": "A group of people chosen to represent others, often at a conference or meeting."}, {"word": "Impugn", "definition": "To challenge the truth, honesty, or validity of something, often by expressing doubts."}, {"word": "Integrity", "definition": "The quality of being honest and having strong moral principles; soundness."}, {"word": "Incumbent", "definition": "The person currently holding a particular office or position."}, {"word": "Robust", "definition": "Strong and healthy; able to withstand difficult conditions or challenges."}, {"word": "Sovereign", "definition": "Having supreme power or authority; independent and self-governing."}, {"word": "Interference", "definition": "The act of getting involved in a situation without invitation or welcome, often to prevent something from happening or to change its outcome."}]}, "Advanced": {"text": "Brazil has reportedly rebuffed a United States delegation by denying their visa applications, effectively preventing their planned visit to scrutinize the country's electoral system. Officials within the Brazilian government indicated that the delegation's explicit aim to \"impugn\" the integrity of its democratic processes was deemed an unacceptable form of external interference. A visa, an indispensable travel document, serves as official authorization for a foreign national to enter, transit through, or remain within a country for a specified period. The absence of these crucial endorsements renders the delegation's travel plans unfeasible.\n\nThe U.S. delegation, reportedly comprising conservative lawmakers and activists, had voiced significant skepticism regarding the fairness and security of Brazil's recent presidential election. This contentious election, held in late 2022, culminated in the victory of Luiz Inácio Lula da Silva over the then-incumbent Jair Bolsonaro. Bolsonaro, echoing sentiments often articulated by former U.S. President Donald Trump, had frequently cast aspersions on the reliability of Brazil's electronic voting machines and insinuated the possibility of widespread electoral fraud. However, these claims were consistently refuted by Brazilian electoral authorities, and no substantive evidence of widespread irregularities was ever substantiated. The delegation's stated intention to \"investigate\" these unproven claims was therefore seen by Brazil as an attempt to legitimize baseless accusations.\n\nBrazilian authorities, particularly the Superior Electoral Court (TSE), have steadfastly defended their electoral system as highly robust, transparent, and impervious to manipulation. They maintain that the electronic voting machines are technologically secure and that the results accurately reflect the will of the electorate. The denial of visas represents a decisive stance by the Brazilian government against what it perceives as an unwarranted intrusion into its sovereign affairs and a deliberate attempt to erode public confidence in its democratic institutions. This move is consistent with Brazil's long-standing position that its electoral processes are internal matters, subject to domestic scrutiny and regulation, not external challenges based on unsubstantiated allegations.\n\nThis diplomatic maneuver underscores the heightened sensitivity surrounding election integrity in contemporary democracies, especially when external entities seek to challenge established electoral frameworks without official invitation or compelling evidence. The Brazilian government's action is a clear assertion of its commitment to safeguarding its electoral sovereignty and preventing any perceived destabilization of its political landscape. It also reflects a broader international trend where nations are increasingly vigilant in protecting their internal political processes from what they consider to be foreign meddling or undue influence, particularly from groups that align with specific political factions rather than offering neutral observation. The incident highlights the delicate balance between international scrutiny and national sovereignty in an interconnected world, emphasizing that while transparency is valued, the right of a nation to manage its internal affairs without perceived hostile interference remains paramount.", "vocab": [{"word": "Rebuffed", "definition": "Rejected in a blunt or abrupt manner; refused."}, {"word": "Scrutinize", "definition": "To examine or inspect closely and thoroughly, often with critical attention."}, {"word": "Impugn", "definition": "To challenge the truth, validity, or honesty of (a statement or motive); to call into question, often implying an accusation."}, {"word": "Contentious", "definition": "Causing or likely to cause an argument; controversial; involving heated dispute."}, {"word": "Cast aspersions", "definition": "To make damaging or unpleasant remarks or judgments about someone or something; to attack the reputation or integrity of."}, {"word": "Impervious", "definition": "Not allowing fluid to pass through; unable to be affected by or hurt by."}, {"word": "Sovereignty", "definition": "The full right and power of a governing body over itself, without any interference from outside sources."}, {"word": "Paramount", "definition": "More important than anything else; supreme in importance."}]}}, "questions": [{"q": "Why did Brazil deny visas to the U.S. delegation?", "a": "Brazil denied visas because it viewed the delegation's aim to \"impugn\" its election system as external interference and an attempt to undermine public trust in its democratic process."}, {"q": "What was the U.S. delegation's goal in visiting Brazil?", "a": "The U.S. delegation's goal was to question or challenge the fairness and security of Brazil's recent presidential election, specifically aiming to \"impugn\" its election system."}], "id": "a803039efe7", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitwFBVV95cUxQQWxWMWluUFJhdlVULTlseEZ3RXR0X2wyeDd1c3h3bGt6T1BPbk94Ml93bVNQblExSmJ4cllqaVlCMjcwUXUtcThWMEo3RFM5R2JzNTlhX1N5UEszcENHMlliejk2S19fSlUtR1ZEVWpNc19uZm42YTI4cVM0YWNkN0lmX0ZWd21xYmIyWEMxY2hkVWtMY016N3VmTkJrNDhFeGl5eC1WNnU0TW9lV3BqX091OUJWckk?oc=5", "published": "2026-07-26T06:37:26+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Heavyweight Boxing Night Features Joshua and Sheeraz", "excerpt": "Boxing fans are ready for a night of big fights, including former world champion Anthony Joshua in the main event and Hamzah Sheeraz defending his title.", "levels": {"Beginner": {"text": "Tonight, there is a big boxing event happening. The main fight is between Anthony Joshua and Kristian Prenga. Anthony Joshua is a famous boxer. People expect these boxers to enter the ring around 10:50 PM in the UK.\n\nBefore the main fight, there is another important match. Hamzah Sheeraz, a boxer from Britain, is fighting Simon Zachenhuber from Germany. Hamzah Sheeraz is defending his WBO super-middleweight title. This means he is trying to keep his championship belt. Many people think Hamzah Sheeraz will win this fight easily. He is called a \"big favourite.\"\n\nThe announcer, Thomas Treiber, called this fight the \"co-main event.\" This means it's a very important fight, but not the most important one of the night. The fight with Anthony Joshua will happen after Hamzah Sheeraz's match. Boxing fans are excited to watch these strong athletes compete. It promises to be an exciting night for sports lovers.", "vocab": [{"word": "event", "definition": "an important planned public or social occasion."}, {"word": "famous", "definition": "known about by many people."}, {"word": "defending", "definition": "trying to keep something, like a title or championship."}, {"word": "title", "definition": "a championship or prize in a sport."}, {"word": "favourite", "definition": "a person or team expected to win."}, {"word": "compete", "definition": "to take part in a contest or game."}]}, "Intermediate": {"text": "Boxing fans are eagerly anticipating a significant night of fights, headlined by former unified world heavyweight champion Anthony Joshua. He is set to face Kristian Prenga in what promises to be a compelling heavyweight contest. Joshua, a two-time world champion, remains one of the biggest draws in boxing, and his presence guarantees a high-profile event. The ring walks for the highly anticipated main event are scheduled for approximately 10:50 PM British Summer Time (BST), indicating a late night for UK viewers and a prime-time slot for the sport's biggest stars.\n\nBefore Joshua steps into the ring, another exciting bout will take place. British boxer Hamzah Sheeraz will defend his WBO super-middleweight title against Germany’s Simon Zachenhuber. Sheeraz, who boasts an impressive undefeated record, is widely considered a strong favourite to retain his championship belt. This title defense is a crucial moment in his career, as he aims to solidify his position in the competitive super-middleweight division and continue his ascent in the sport. A victory would further enhance his reputation as a rising star.\n\nThe event's master of ceremonies, Thomas Treiber, optimistically described Sheeraz's fight as the \"co-main event.\" While it is indeed a high-profile match featuring a world title on the line, the true main event of the evening will undoubtedly be the heavyweight clash involving Anthony Joshua, a global superstar in the sport. Heavyweight boxing often captures the most attention due to the power and drama involved. This setup ensures that spectators will enjoy a full evening of high-stakes boxing, building anticipation for the climactic showdown.", "vocab": [{"word": "anticipated", "definition": "expected or looked forward to."}, {"word": "headlined", "definition": "featured as the most important performer or item."}, {"word": "unified", "definition": "having multiple championship titles from different organizations."}, {"word": "compelling", "definition": "evoking interest, attention, or admiration in a powerful and irresistible way."}, {"word": "defend", "definition": "to fight to keep a title or position."}, {"word": "crucial", "definition": "extremely important or necessary."}, {"word": "solidify", "definition": "to make something stronger or more definite."}]}, "Advanced": {"text": "The boxing world is abuzz with anticipation for a high-stakes fight night, featuring a compelling lineup of talent culminating in a heavyweight clash. Former unified world heavyweight champion Anthony Joshua is slated to headline the event, facing Kristian Prenga in what is expected to be a significant bout. Joshua, a two-time world champion and Olympic gold medalist, continues to be a monumental draw in professional boxing, with his fights consistently attracting global attention and substantial pay-per-view numbers. His career trajectory has seen him reclaim and lose world titles, adding a layer of intrigue to every performance as he seeks to re-establish himself at the very pinnacle of the sport. The spectacle of his ring walk, a moment often imbued with drama and fanfare, is scheduled for approximately 10:50 PM British Summer Time (BST), setting the stage for a late-night climax for UK audiences and a prime-time broadcast across various international markets.\n\nPreceding the main event, British sensation Hamzah Sheeraz will step into the ring to defend his WBO super-middleweight title against Germany’s Simon Zachenhuber. Sheeraz, an undefeated prospect with a formidable knockout record, is widely regarded as a substantial favourite to successfully retain his championship belt. This title defense is a pivotal moment in his burgeoning career, offering an opportunity to further cement his status within the highly competitive super-middleweight division. A dominant performance would not only extend his unbeaten streak but also enhance his burgeoning reputation as one of Britain's most promising boxing talents. The WBO title itself is one of the four major world championships in professional boxing, underscoring the importance of this contest for Sheeraz as he navigates the path towards potential unification bouts in the future.\n\nThe event's master of ceremonies, Thomas Treiber, optimistically labeled Sheeraz's title defense as the \"co-main event.\" While this designation acknowledges the fight's considerable importance and the presence of a world title, it subtly underscores the unparalleled star power of Anthony Joshua. Heavyweight boxing historically commands the most significant attention and revenue in the sport, making Joshua's presence the undeniable focal point for promoters and broadcasters alike. The strategic placement of Sheeraz's high-stakes bout immediately before the main event serves to build momentum and ensure a continuous flow of excitement for spectators, priming them for the evening's ultimate attraction. This carefully curated fight card promises an evening of intense competition, culminating in a marquee heavyweight encounter that will undoubtedly capture the headlines and fuel discussions among boxing aficionados for days to come.", "vocab": [{"word": "abuzz", "definition": "filled with excitement or activity."}, {"word": "culminating", "definition": "reaching a climax or point of highest development."}, {"word": "slated", "definition": "scheduled or planned to happen."}, {"word": "monumental", "definition": "very great or important."}, {"word": "imbued", "definition": "inspired or permeated with a feeling or quality."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "burgeoning", "definition": "beginning to grow or increase rapidly; flourishing."}, {"word": "aficionados", "definition": "people who are very knowledgeable and enthusiastic about an activity, subject, or pastime."}]}}, "questions": [{"q": "What is the main event of the boxing night?", "a": "The main event is the heavyweight boxing match between Anthony Joshua and Kristian Prenga."}, {"q": "Which British boxer is defending a WBO title in the co-main event?", "a": "Hamzah Sheeraz is defending his WBO super-middleweight title."}], "id": "a64f4a28611", "source": "Sport | The Guardian", "link": "https://www.theguardian.com/sport const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
