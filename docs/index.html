etition […]", "vocab": []}, "Intermediate": {"text": "Sylvester Stallone is reminiscing about his now-infamous rivalry with fellow action star Arnold Schwarzenegger through the 1980s and 1990s — and why they only laid down the hatchet when the latter ran for governor of California. In a recent interview on “The Rest Is Entertainment” podcast, the “Rocky” actor answered whether he felt the competition […]", "vocab": []}, "Advanced": {"text": "Sylvester Stallone is reminiscing about his now-infamous rivalry with fellow action star Arnold Schwarzenegger through the 1980s and 1990s — and why they only laid down the hatchet when the latter ran for governor of California. In a recent interview on “The Rest Is Entertainment” podcast, the “Rocky” actor answered whether he felt the competition […]", "vocab": []}}, "questions": [], "id": "a5e0aae3087", "source": "Variety", "link": "https://variety.com/2026/film/news/sylvester-stallone-rivalry-arnold-schwarzenegger-1236942209/", "published": "2026-11-08T09:35:17+09:00", "category": "entertainment"}]}], "home": [{"headline": "Ravens Keep Henry, Giants Inquire About Hill", "excerpt": "The Baltimore Ravens confirm they will not trade star running back Derrick Henry, as the New York Giants inquire about Justice Hill.", "levels": {"Beginner": {"text": "The Baltimore Ravens have made a clear decision about their star running back, Derrick Henry. They will not trade him to another team. Henry recently joined the Ravens, and he is an important player for their offense. This news comes after some rumors that other teams might want him. The Ravens want Henry to stay and help them win games in the upcoming season.\n\nMeanwhile, another NFL team, the New York Giants, showed interest in another Ravens running back, Justice Hill. The Giants called the Ravens to ask about Hill. However, the news report does not say if any trade talks went further. Justice Hill is also a valuable player for the Ravens, contributing to their running game and special teams.\n\nIt seems the Ravens are happy with their running backs and plan to keep them for the upcoming season. Fans are excited to see Henry and Hill play together, strengthening the team's running attack.", "vocab": [{"word": "trade", "definition": "to exchange something for something else, often between sports teams"}, {"word": "player", "definition": "a person who plays a sport or game"}, {"word": "team", "definition": "a group of people who play a sport together"}, {"word": "rumors", "definition": "stories or information that are not proven to be true"}, {"word": "offense", "definition": "the part of a sports team that tries to score points"}, {"word": "valuable", "definition": "very useful or important"}]}, "Intermediate": {"text": "The Baltimore Ravens have unequivocally stated their intention to keep star running back Derrick Henry, confirming he will not be traded. This decision comes despite recent speculation that other NFL teams might be interested in acquiring the veteran player. Henry, a prominent figure in the league, recently signed with the Ravens, and the team views him as a cornerstone of their offensive strategy for the upcoming season.\n\nHenry's arrival in Baltimore was a significant move, aimed at bolstering the team's already formidable running game. His presence is expected to provide a powerful ground attack, complementing quarterback Lamar Jackson's dynamic playmaking ability. The Ravens' commitment to Henry underscores their ambition to compete for a championship.\n\nSeparately, reports indicate that the New York Giants made an inquiry about another Ravens running back, Justice Hill. The Giants reportedly contacted the Ravens to discuss Hill, though the extent of these discussions or whether they progressed to formal trade negotiations remains unclear. Hill has been a key contributor for the Ravens, excelling in both the running back rotation and on special teams. His versatility and reliable performance make him a valuable asset to the Baltimore roster.\n\nWhile the Giants may be exploring options to strengthen their own backfield, the Ravens' stance on both Henry and Hill suggests they are content with their current running back depth and are not looking to make significant changes before the season begins.", "vocab": [{"word": "unequivocally", "definition": "in a way that is clear and leaves no doubt"}, {"word": "speculation", "definition": "the act of forming opinions or theories without firm evidence"}, {"word": "acquiring", "definition": "getting or obtaining something"}, {"word": "cornerstone", "definition": "an essential, main, or important part of something"}, {"word": "bolstering", "definition": "supporting or strengthening something"}, {"word": "inquiry", "definition": "a request for information"}, {"word": "versatility", "definition": "the ability to adapt or be adapted to many different functions or activities"}]}, "Advanced": {"text": "The Baltimore Ravens have definitively shut down any notion of trading star running back Derrick Henry, reaffirming their commitment to the formidable rusher. This declaration comes amidst the usual NFL offseason churn of trade rumors and player movement speculation. Henry, a highly coveted veteran, recently inked a deal with the Ravens, a strategic acquisition intended to solidify their ground game and enhance their championship aspirations. His integration into the offense is seen as pivotal, providing a powerful complement to quarterback Lamar Jackson's unique skillset and adding another dimension to an already potent attack.\n\nHenry's presence is expected to be a significant factor in the Ravens' offensive scheme, offering a bruising, downhill running style that can wear down opposing defenses and control the clock. The team's decision to retain him underscores their belief in his continued elite performance and his fit within their established offensive philosophy. This move signals a clear intent to maximize their competitive window with a roster built for deep playoff runs.\n\nConcurrently, reports have surfaced detailing an inquiry from the New York Giants regarding another Ravens running back, Justice Hill. The Giants' outreach to the Ravens suggests they are actively exploring options to bolster their own backfield, potentially seeking a dynamic and reliable contributor. While the nature and depth of these discussions remain undisclosed, such inquiries are a common occurrence in the NFL, as teams continuously assess player availability and market value.\n\nJustice Hill has proven to be a valuable asset for the Ravens, demonstrating consistent performance in a rotational role and excelling on special teams. His versatility, speed, and reliability make him an attractive prospect for teams in need of backfield depth. However, the Ravens' apparent reluctance to engage in trade talks for either Henry or Hill indicates a strong satisfaction with their current running back corps and a strategic decision to maintain continuity and depth as they prepare for a challenging season.", "vocab": [{"word": "definitively", "definition": "in a way that is conclusive and without any doubt"}, {"word": "reaffirming", "definition": "stating again strongly; confirming a previous commitment or belief"}, {"word": "coveted", "definition": "greatly desired or wished for"}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else"}, {"word": "bruising", "definition": "characterized by or causing physical force or impact, often used to describe a powerful, aggressive style of play"}, {"word": "concomitantly", "definition": "in conjunction with something else; at the same time"}, {"word": "undisclosed", "definition": "not revealed or made known"}, {"word": "corps", "definition": "a body or group of people associated together, often in a military or professional context (here, a group of players)"}]}}, "questions": [{"q": "What decision have the Baltimore Ravens made about Derrick Henry?", "a": "The Baltimore Ravens have decided they will not trade Derrick Henry."}, {"q": "Which NFL team showed interest in Justice Hill?", "a": "The New York Giants showed interest in Justice Hill."}], "id": "a7648000b63", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxNeGNrbnAyWWFRem1fZU8yX0dsMUNTRnozYkFVVHJ2N0Z4aTQ5UGRUbU0wWkNYV1R1Zm94azVFTzhmMkpmRS1Wck4wNHpoVGZudDVVbG03aGd0S2FQWmpyQllZRUZxd0FEd3Z4SWdsRFJLb0NIVUc2QkN1YmFSTnhhWjlwTS11aU1Gb1ZsdnlVTVl1cGowZkl5cTZBZk82WDQwY0daV2ZnSDdGTUcwM1ZLQTRxUQ?oc=5", "published": "2026-11-08T09:42:19+09:00", "category": "business", "category_title": "Business"}, {"headline": "Brewers' Trevor Megill a Trade Target for Two MLB Teams", "excerpt": "Relief pitcher Trevor Megill of the Milwaukee Brewers is reportedly attracting trade interest from at least two Major League Baseball teams.", "levels": {"Beginner": {"text": "Trevor Megill is a baseball player. He plays for the Milwaukee Brewers team. News says that two other teams might want him. They could talk to the Brewers about a trade. A trade means one team gives a player to another team. In return, the first team gets other players or money. This helps teams get stronger.\n\nMegill is a pitcher. He throws the ball for his team. Pitchers are very important in baseball games. The Brewers might trade Megill to get new players they need. Or, they might trade him to get young players for the future. Many teams want good pitchers. So, Megill is a player that other teams are watching.\n\nThis kind of news happens often in sports. Teams always try to make their group of players better. If a trade happens, Megill will play for a new team. The Brewers will get something back. It is a way for teams to change their players during the season or in the off-season. We will wait to see if a trade really happens for Trevor Megill.", "vocab": [{"word": "player", "definition": "a person who plays a sport or game."}, {"word": "team", "definition": "a group of people who play a sport together."}, {"word": "trade", "definition": "when teams exchange players."}, {"word": "pitcher", "definition": "a player who throws the ball in baseball."}, {"word": "important", "definition": "having a lot of meaning or value."}, {"word": "news", "definition": "information about recent events."}]}, "Intermediate": {"text": "Trevor Megill, a relief pitcher for the Milwaukee Brewers, is reportedly a player drawing interest from other Major League Baseball teams. Recent news suggests that at least two teams are considering contacting the Brewers to discuss a potential trade for Megill. In professional sports, a trade involves one team exchanging a player for other players, prospects (young players still developing), or sometimes money. This strategy allows teams to strengthen their roster, address specific needs, or build for the future.\n\nMegill has established himself as a valuable arm in the Brewers' bullpen. Relief pitchers are crucial for closing out games or getting key outs in late innings. His performance has made him an attractive asset for teams looking to bolster their pitching staff, especially those aiming for a playoff run. The Brewers, like all MLB teams, constantly evaluate their roster and future plans. Trading a player like Megill could provide them with resources to fill other gaps, acquire younger talent, or free up salary space.\n\nThe decision to trade a player is complex. A team might consider moving a player if they believe they can get a good return, or if the player's contract situation makes a trade logical. For the Brewers, assessing Megill's value on the trade market against his contributions to their current team will be key. Other teams, particularly those in contention, are always on the lookout for reliable relievers who can make an immediate impact.\n\nWhile specific interested teams have not been named, the speculation highlights Megill's effectiveness and the dynamic nature of the baseball trade market. Such discussions are common throughout the baseball season, especially as the trade deadline approaches. Fans and analysts will be watching closely to see if the Brewers decide to move Trevor Megill and what kind of package they might receive in return, shaping the team's direction for the current season and beyond.", "vocab": [{"word": "reportedly", "definition": "according to what some people say."}, {"word": "potential", "definition": "possible to happen."}, {"word": "exchange", "definition": "to give something and receive something else."}, {"word": "roster", "definition": "the list of players on a team."}, {"word": "bullpen", "definition": "the group of relief pitchers on a baseball team."}, {"word": "crucial", "definition": "extremely important or necessary."}, {"word": "speculation", "definition": "guessing about something without having all the facts."}]}, "Advanced": {"text": "Trevor Megill, a prominent relief pitcher for the Milwaukee Brewers, has become a subject of considerable trade speculation across Major League Baseball. Recent reports indicate that at least two undisclosed franchises are poised to initiate discussions with the Brewers regarding a potential acquisition of the right-hander. This development underscores the perennial strategic maneuvering within MLB, where teams constantly assess their assets to optimize both immediate competitiveness and long-term organizational health.\n\nIn professional baseball, trades serve as a vital mechanism for roster construction and recalibration. Teams engage in these transactions to address specific positional deficiencies, bolster their depth, acquire promising young talent (prospects), or manage payroll obligations. For a contending team, securing a reliable, high-leverage reliever like Megill could be the crucial piece needed to solidify a bullpen for a deep postseason run. Conversely, a team in a rebuilding phase might seek to offload veteran players for future draft picks or high-upside prospects.\n\nMegill has distinguished himself as an effective late-inning arm, often deployed in critical situations to preserve leads or mitigate damage. His performance metrics and contract status—typically a key factor in trade valuations—make him an attractive commodity. For the Brewers, evaluating Megill's market value against his ongoing contributions to their current roster presents a strategic dilemma. Should they be positioned as buyers, his presence is invaluable. However, if the club perceives an opportunity to acquire a substantial return that aligns with broader organizational objectives, a trade becomes a viable consideration.\n\nThe landscape of MLB trades is intricate, influenced by factors such as player performance, remaining contract control, team payrolls, and the overall competitive window of both the buying and selling clubs. Teams often target relievers like Megill due to their ability to make an immediate impact without requiring a significant long-term commitment, making them ideal targets for teams on the cusp of contention. The Brewers' front office will undoubtedly weigh the potential influx of prospect capital or roster flexibility against the immediate void Megill's departure would create in their bullpen.\n\nWhile the identities of the interested teams remain unconfirmed, the mere existence of such reports highlights Megill's perceived value within the league. This type of trade chatter is a common fixture of the baseball calendar, intensifying as the trade deadline approaches. It reflects the constant flux of player movement and the strategic calculations undertaken by general managers aiming to gain a competitive edge. The ultimate decision regarding Trevor Megill's future will have implications for both the Brewers' immediate aspirations and the trajectory of any acquiring club, making this a situation closely monitored by baseball enthusiasts and analysts alike.", "vocab": [{"word": "speculation", "definition": "The forming of a theory or conjecture without firm evidence; guessing about something without having all the facts."}, {"word": "undisclosed", "definition": "Not revealed or made known to others; secret."}, {"word": "perennial", "definition": "Lasting or existing for a long or apparently infinite time; constantly recurring."}, {"word": "recalibration", "definition": "The process of adjusting or fine-tuning something to improve its performance or accuracy."}, {"word": "deficiencies", "definition": "Shortcomings or imperfections; a lack or shortage."}, {"word": "bolster", "definition": "To support or strengthen; to improve something or make it stronger."}, {"word": "commodity", "definition": "A useful or valuable thing, often referring to a player as a valuable asset that can be traded."}, {"word": "intricate", "definition": "Very complicated or detailed; having many interconnected parts."}]}}, "questions": [{"q": "What team does Trevor Megill currently play for?", "a": "Trevor Megill currently plays for the Milwaukee Brewers."}, {"q": "What is the main reason teams make trades in baseball?", "a": "Teams make trades to get new players, improve their roster, address specific needs, or build for the future."}], "id": "a4a48f02ad9", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihAFBVV95cUxOeTAyWnVXaG1Fd29SWGlBX2lnZU9VV2dyQ3FQYlRXYmdock5sdVIwZ0FFSjVwdHJiMW5WS1FIczAyNmJuNFpvanBGdWZaWmhKNktRMXdRZmxOYmlQeWg5SWVkOURVM2V2Vmx6NDlHZVNDYjMwaVlXd3MyNllXelpuT2gzUF8?oc=5", "published": "2026-11-08T09:41:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "God's Pantry Helps 7,000 Families for Thanksgiving in Central Kentucky", "excerpt": "God's Pantry Food Bank prepared 7,000 Thanksgiving meal boxes, bringing holiday cheer to families in need in central Kentucky.", "levels": {"Beginner": {"text": "God's Pantry Food Bank helped many families in central Kentucky. They packed 7,000 special boxes for Thanksgiving. These boxes had food for a holiday meal. Many families need help to have a good Thanksgiving dinner.\n\nThanksgiving is a big holiday in the United States. People often eat a large meal with turkey and other foods. But some families do not have enough money to buy all this food. That is why food banks like God's Pantry are very important.\n\nVolunteers worked hard to put the food into the boxes. They filled each box with items like canned vegetables, stuffing mix, and sometimes even a turkey voucher. A voucher is like a ticket to get something. This way, families could cook a nice meal at home.\n\nThe food bank gives food to people all year, not just for holidays. But Thanksgiving is a special time when many people want to help others. Giving these food boxes helps families feel happy and cared for during the holiday season. It shows that the community supports them.", "vocab": [{"word": "packed", "definition": "put things into a box or bag."}, {"word": "families", "definition": "groups of people living together, often parents and children."}, {"word": "holiday", "definition": "a special day when people celebrate something."}, {"word": "money", "definition": "coins or paper used to buy things."}, {"word": "volunteers", "definition": "people who work without getting paid, to help others."}, {"word": "community", "definition": "all the people living in one area."}]}, "Intermediate": {"text": "God's Pantry Food Bank recently completed a significant effort to support families in central Kentucky during the Thanksgiving holiday. The organization successfully packed and distributed 7,000 Thanksgiving meal boxes, ensuring that thousands of households would have the ingredients for a traditional holiday dinner. This initiative is crucial for many families who face economic challenges, especially with rising costs of living.\n\nThanksgiving is a cherished American holiday, traditionally celebrated with a large meal shared among family and friends. However, for a growing number of individuals and families, affording such a feast can be a significant burden. Food banks like God's Pantry step in to bridge this gap, providing essential food assistance throughout the year and particularly during peak holiday seasons.\n\nThe process of preparing these 7,000 boxes involved a large-scale community effort. Numerous volunteers dedicated their time to sort donations, assemble the boxes, and prepare them for distribution. Each box was carefully filled with a variety of non-perishable items, such as canned green beans, corn, cranberry sauce, stuffing mix, and gravy packets. Often, these boxes also include a voucher for a fresh turkey, allowing families to complete their holiday meal.\n\nThe demand for food assistance has been increasing, partly due to ongoing economic pressures like inflation, which makes groceries more expensive. Food banks play a vital role in addressing food insecurity, which is when people do not have reliable access to enough affordable, nutritious food. By providing these Thanksgiving boxes, God's Pantry not only offers practical help but also brings a sense of dignity and normalcy to families during a time of celebration. It underscores the power of community support in ensuring that no one goes without a holiday meal.", "vocab": [{"word": "distributed", "definition": "gave out to many different people or places."}, {"word": "initiative", "definition": "an important new plan or program."}, {"word": "economic challenges", "definition": "difficulties related to money and finances."}, {"word": "cherished", "definition": "valued and loved very much."}, {"word": "non-perishable", "definition": "food that does not spoil quickly and can be stored for a long time."}, {"word": "inflation", "definition": "a general increase in prices and a fall in the purchasing value of money."}, {"word": "food insecurity", "definition": "not having enough reliable access to affordable, healthy food."}]}, "Advanced": {"text": "God's Pantry Food Bank has once again demonstrated its profound commitment to alleviating food insecurity in central Kentucky, successfully orchestrating the packing and distribution of 7,000 Thanksgiving meal boxes. This monumental undertaking ensures that thousands of households, many grappling with persistent economic challenges, will have the means to partake in a traditional holiday feast. The initiative is particularly salient given the current economic climate, where inflationary pressures continue to strain household budgets and amplify the demand for charitable food assistance.\n\nThanksgiving, a cornerstone of American cultural identity, is typically characterized by communal gatherings and an abundant meal. Yet, for an increasing segment of the population, the aspiration of a festive holiday dinner remains out of reach. Food banks like God's Pantry serve as critical safety nets, offering consistent food provisions year-round and escalating their efforts significantly during periods of heightened need, such as the holiday season. Their work is indispensable in mitigating the effects of poverty and economic instability on vulnerable communities.\n\nThe logistical complexity of preparing 7,000 comprehensive meal boxes necessitates a highly coordinated community response. Hundreds of dedicated volunteers converged, dedicating countless hours to the meticulous tasks of sorting incoming donations, assembling the diverse array of food items, and preparing the boxes for efficient distribution across the region. Each box is thoughtfully curated to include essential non-perishable staples—such as canned vegetables, cranberry sauce, and various baking mixes—often complemented by a voucher for a fresh turkey, thereby empowering families to prepare a complete, culturally resonant meal in their own homes.\n\nThe escalating demand for food aid is a stark indicator of broader socio-economic trends. Persistent inflation, particularly in grocery prices, coupled with stagnant wages for many, has exacerbated food insecurity across the nation. Food banks are on the front lines, not merely providing sustenance but also offering a crucial sense of normalcy and dignity to families during times of celebration that might otherwise be marked by deprivation. This annual Thanksgiving drive by God's Pantry Food Bank powerfully underscores the resilience of community spirit and the collective resolve to ensure that the foundational joy of a holiday meal is accessible to all, reinforcing social cohesion and mutual support in the face of adversity.", "vocab": [{"word": "alleviating", "definition": "making suffering, deficiency, or a problem less severe."}, {"word": "orchestrating", "definition": "planning and organizing something complex or difficult."}, {"word": "grappling", "definition": "struggling to deal with something difficult or challenging."}, {"word": "salient", "definition": "most noticeable or important."}, {"word": "cornerstone", "definition": "an essential, indispensable, or fundamental part."}, {"word": "indispensable", "definition": "absolutely necessary; essential."}, {"word": "logistical complexity", "definition": "the difficulty involved in planning and carrying out a complicated operation."}, {"word": "exacerbated", "definition": "made a problem, bad situation, or negative feeling worse."}]}}, "questions": [{"q": "How many Thanksgiving boxes did God's Pantry Food Bank pack?", "a": "God's Pantry Food Bank packed 7,000 Thanksgiving boxes."}, {"q": "What is the main purpose of God's Pantry Food Bank's Thanksgiving initiative?", "a": "The main purpose is to help families in central Kentucky who are in need have a traditional Thanksgiving meal."}], "id": "a6f83ff3884", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMizgFBVV95cUxOZjg2dFctVnNPb3FoMHRpY1dsZFBrdnM0bWJseVBTOG5OaHBGSmNZVDJsX1pEWE1Eb0QtN09pMGdoU2V1SVhUaTVBci1nV1RIUVV1NHRpWTZfbjNCOXRCV2dnSXJiaW9hZ1Q4c19qdi02aUNsWXF5UkpDaEVGbGYzYTZtVHF2VFZGTk5BR051VnJISVZmMVI4ZHB5OV9feW9RN3VmODlIR1haNGlkcGV4Nk4ydm5GUlRaRFNPdG5LaTdyQ1VudDRaT2Rkbzkzd9IB0wFBVV95cUxNVTkwS01BS1JmemhsU0dwb0Exb3JoaER4ZUR4cmVpdGF1bldpNnpkTEtsSUFNSkJfT3VaSUlzT2hxQUgtVVJfSTdubHhWZE5yR2JnS1JYQ09RNXNTQUF5U2NHdlVPUGpKQ1dmMHRTdFpDc1d3RkFEdllNbkJCT0xETzBkcENPZHdFYkgxcHdhS3h0d011QkJXeUFUbllfZjJZWVhKaU5ubVZ1aXRWdThKbkNONG9BVjMxRzRzR2dka0VQbk52OTNNaGhKZDJvekRLbWNZ?oc=5", "published": "2026-11-08T08:38:51+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Labubu Toy Mania Fades, Pop Mart Sees Revenue Drop", "excerpt": "The once-unstoppable popularity of Labubu, the fluffy monster collectible toy, is now declining, impacting its maker, Pop Mart.", "levels": {"Beginner": {"text": "Labubu toys were very popular. These toys are like small, fluffy monsters. Many people wanted to buy them. They often came in \"blind boxes,\" so you didn't know which one you would get until you opened it. This made collecting them exciting. Labubu became a big trend, and people loved finding all the different characters.\n\nA company called Pop Mart makes Labubu toys. Pop Mart made a lot of money because so many people bought these toys. For a while, it seemed like everyone wanted a Labubu.\n\nBut now, things are changing. Fewer people are buying Labubu toys. The excitement for these \"fluffy monsters\" is going down. This means Pop Mart is not making as much money as before. Their revenue, which is the money they earn, has fallen. This shows that even very popular toys can lose their appeal. Trends can change quickly. Pop Mart will need to find new popular toys to keep its business strong as the Labubu mania ends.", "vocab": [{"word": "Popular", "definition": "liked by many people."}, {"word": "Toys", "definition": "objects for children to play with."}, {"word": "Trend", "definition": "something that is popular for a short time."}, {"word": "Company", "definition": "a business that makes or sells things."}, {"word": "Revenue", "definition": "the money a company earns."}, {"word": "Appeal", "definition": "the quality of being attractive or interesting."}]}, "Intermediate": {"text": "The widespread enthusiasm for Labubu, the quirky collectible monster toys, appears to be fading. What was once an unstoppable trend, driving significant sales for its parent company, Pop Mart, is now showing signs of decline. This shift is reflected in Pop Mart's recent financial reports, which indicate a fall in revenue.\n\nLabubu toys, known for their distinctive \"fluffy monster\" designs, gained immense popularity, especially within the \"art toy\" and collectible market. A key part of their appeal was the \"blind box\" sales model, where customers purchase a sealed box without knowing which specific character or design is inside. This element of surprise and the thrill of collecting rare editions fueled a collecting frenzy among fans, making Labubu a cultural phenomenon in many regions.\n\nPop Mart, a Chinese toy giant, built much of its recent success on the back of characters like Labubu. The company specializes in creating and distributing designer toys, often collaborating with artists to produce limited-edition series. For a period, the demand for Labubu seemed insatiable, with new releases often selling out quickly and collectors eagerly seeking out complete sets.\n\nHowever, the market for collectibles can be highly volatile. Consumer tastes evolve, and what is trendy today may not be tomorrow. The waning appetite for Labubu suggests a possible saturation of the market or a general shift in consumer interest towards other novelties. As the \"fluffy monster mania\" dies down, Pop Mart faces the challenge of adapting its strategy. The company will likely need to diversify its offerings and introduce new, compelling characters to maintain its growth and financial health in the competitive collectible toy industry.", "vocab": [{"word": "Enthusiasm", "definition": "strong feeling of excitement and interest."}, {"word": "Collectible", "definition": "an item that people like to collect."}, {"word": "Distinctive", "definition": "easy to recognize because it is different."}, {"word": "Immense", "definition": "extremely large or great."}, {"word": "Phenomenon", "definition": "something that is observed to happen or exist, often unusual or interesting."}, {"word": "Volatile", "definition": "likely to change suddenly and unexpectedly."}, {"word": "Diversify", "definition": "to make something more varied or different."}]}, "Advanced": {"text": "The seemingly unstoppable hype surrounding Labubu, the quirky collectible monster figures, is now showing definitive signs of abatement. This decline in consumer appetite for the popular \"fluffy monster\" series has directly impacted its parent company, Pop Mart, leading to a noticeable fall in its recent revenue figures. The trajectory of Labubu's popularity offers a compelling case study in the inherent volatility and rapid shifts characteristic of the contemporary collectible market.\n\nLabubu figures, part of the broader \"art toy\" phenomenon, captivated a global audience with their unique aesthetics and the engaging \"blind box\" sales model. This strategy, where purchasers acquire a sealed box without prior knowledge of the specific figure inside, generated an addictive element of surprise and scarcity. It fueled a fervent collecting culture, transforming Labubu from a niche product into a mainstream sensation and a significant revenue driver for Pop Mart, a prominent Chinese designer toy manufacturer. The company's business model heavily relies on intellectual property (IP) development and collaboration with artists to produce limited-edition, highly sought-after series, making it a key player in the global art toy scene.\n\nFor a considerable period, the demand for Labubu appeared insatiable. New releases frequently sold out within minutes, and secondary markets thrived as collectors vied for complete sets or rare variants. This unprecedented surge in popularity propelled Pop Mart's growth and cemented its position as a leader in the burgeoning art toy sector, demonstrating the immense power of viral trends in consumer goods.\n\nHowever, the lifecycle of trend-driven collectibles is often finite and susceptible to rapid shifts in consumer sentiment. Several factors could contribute to Labubu's diminishing returns. Market saturation, where an abundance of similar products or too many iterations of the same character dilute its novelty, is a common pitfall. Economic slowdowns can also curb discretionary spending on non-essential items like collectibles, as consumers prioritize necessities. Furthermore, the relentless pursuit of newness inherent in consumer culture means that even the most beloved characters eventually face competition from emerging trends and fresh intellectual properties. The challenge for Pop Mart now is to manage this inevitable decline gracefully.\n\nPop Mart now confronts the strategic imperative of navigating this post-peak phase. While Labubu's legacy as a cultural icon is likely secure, its capacity to drive exponential revenue growth may be waning. The company's future success will hinge on its ability to continually innovate, diversify its IP portfolio, and accurately anticipate evolving consumer preferences, ensuring it can pivot effectively to new phenomena in the dynamic and competitive world of designer collectibles. This requires not just new products, but a deep understanding of evolving market dynamics and consumer psychology.", "vocab": [{"word": "Abatement", "definition": "the process of becoming less intense or widespread."}, {"word": "Trajectory", "definition": "the path followed by a projectile or other moving object; here, the course of development."}, {"word": "Aesthetics", "definition": "a set of principles concerned with the nature and appreciation of beauty."}, {"word": "Fervent", "definition": "having or displaying a passionate intensity."}, {"word": "Insatiable", "definition": "(of an appetite or desire) impossible to satisfy."}, {"word": "Burgeoning", "definition": "beginning to grow or increase rapidly; flourishing."}, {"word": "Discretionary", "definition": "available for use at the discretion of the user; optional."}, {"word": "Imperative", "definition": "an essential or urgent thing."}]}}, "questions": [{"q": "What company makes Labubu toys?", "a": "Pop Mart."}, {"q": "What is happening to the popularity of Labubu toys?", "a": "Their popularity is declining, and fewer people are buying them."}], "id": "a8db85b64c2", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmvg652l927lo?at_medium=RSS&at_campaign=rss", "published": "2026-11-08T08:02:35+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "What the world's media made of NZ's election cliffhanger - RNZ", "excerpt": "What the world's media made of NZ's election cliffhanger RNZ", "levels": {"Beginner": {"text": "What the world's media made of NZ's election cliffhanger RNZ", "vocab": []}, "Intermediate": {"text": "What the world's media made of NZ's election cliffhanger RNZ", "vocab": []}, "Advanced": {"text": "What the world's media made of NZ's election cliffhanger RNZ", "vocab": []}}, "questions": [], "id": "a07579fab9c", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiogFBVV95cUxOS21iM0RyTXlnYjJXcWcxUVRxRWRTSjZLZFUwVElTdHFFSnpFVW53aGgxemstVzJoYjVfSFVYTnFkV21qMGNvdHpkN2paVTNaeWlvN0tnTXd5MldsNE43b2VGc0R2OWRUX2xfQkUxc0ZwTG9JeEdXQzBncUk3b1kzZFRlZXc0Vnhvekl6X1NleklPTlBkQV9qZUlZWjZrT3ZHcnc?oc=5", "published": "2026-11-08T09:36:34+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Ex-military chief Gadi Eisenkot, opponent of Netanyahu, tapped to form government - The Washington Post", "excerpt": "Ex-military chief Gadi Eisenkot, opponent of Netanyahu, tapped to form government The Washington Post", "levels": {"Beginner": {"text": "Ex-military chief Gadi Eisenkot, opponent of Netanyahu, tapped to form government The Washington Post", "vocab": []}, "Intermediate": {"text": "Ex-military chief Gadi Eisenkot, opponent of Netanyahu, tapped to form government The Washington Post", "vocab": []}, "Advanced": {"text": "Ex-military chief Gadi Eisenkot, opponent of Netanyahu, tapped to form government The Washington Post", "vocab": []}}, "questions": [], "id": "acf9805ec61", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixAFBVV95cUxPNkNJbUh4ZFl6NzBHZjJZVU85UGhmUnIzSnBXZUhrczJyNldvUWNHYndxc293NGFwOG1Yb2JaeEdmVW1nYWU1dmdrYVJXU2NVdFZERGN6TjZSUFk3WmhzTjdHd2RZdWx5OFZQOEx6V3lOeVY5dTlwV0pidXZ6RWN3MVlPU20xQWJmcjlPdzJtSlZWMld0QkpESFVkbEpfa3k4ZzJhc2Z1QzR2OGdEdlFfQ3VBWjZvZWtDSXhuN0taZFNFU1E4?oc=5", "published": "2026-11-08T09:34:37+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Clarke Defeats Billam-Smith in Major Boxing Upset", "excerpt": "Chev Clarke secured a significant victory over former world champion Chris Billam-Smith, marking a big moment in his professional boxing career.", "levels": {"Beginner": {"text": "In a recent boxing match, Chev Clarke won against Chris Billam-Smith. This was a big surprise for many people. Chris Billam-Smith was a world champion before, which means he was one of the best boxers in his weight class. But in this fight, Chev Clarke was stronger.\n\nChris Billam-Smith was knocked down during the fight. This means he fell to the ground after a punch. The referee then stopped the fight, giving the win to Chev Clarke. This was the first time in Chris Billam-Smith's professional career that he was stopped like this. It was a very important win for Chev Clarke.\n\nThis fight was not for a title; it was a regular match. However, it showed that Chev Clarke is a strong new boxer to watch. Interestingly, Clarke had also beaten Billam-Smith when they were amateur boxers, before they became professionals. So, this win repeats an earlier success for Clarke.", "vocab": [{"word": "champion", "definition": "A person who has won a competition or contest."}, {"word": "knocked down", "definition": "To be hit and fall to the ground during a fight."}, {"word": "stopped", "definition": "When a boxing match is ended by the referee before the final round."}, {"word": "professional", "definition": "Someone who gets paid for playing a sport or doing a job."}, {"word": "amateur", "definition": "Someone who does something for enjoyment, not as a job or for money."}, {"word": "victory", "definition": "An act of winning a game, fight, or competition."}]}, "Intermediate": {"text": "In a significant boxing upset, Chev Clarke defeated former cruiserweight world champion Chris Billam-Smith in a non-title bout. The fight saw Billam-Smith knocked down and stopped for the first time in his professional career, marking a pivotal moment for both fighters.\n\nChris Billam-Smith, known for his formidable presence in the cruiserweight division, entered the ring as a highly respected figure, having previously held a world title. However, Clarke delivered a powerful performance that led to the referee's intervention, ending the contest prematurely. This outcome is particularly noteworthy as it represents a major setback for Billam-Smith's professional trajectory and a significant boost for Clarke's burgeoning career.\n\nThe victory holds added historical context: Clarke had previously bested Billam-Smith during their amateur days. Repeating this success on the professional stage underscores Clarke's potential and ability to compete at the highest level. While the bout was not for a championship title, the implications are substantial. For Clarke, it signals his arrival as a serious contender in the cruiserweight division. For Billam-Smith, it prompts a re-evaluation of his path forward after experiencing his first professional stoppage loss. The boxing world will now watch closely to see how both athletes respond to this impactful result.", "vocab": [{"word": "upset", "definition": "An unexpected victory, especially when a less favored competitor wins."}, {"word": "cruiserweight", "definition": "A weight class in boxing, typically for fighters heavier than light heavyweight but lighter than heavyweight."}, {"word": "bout", "definition": "A boxing or wrestling match."}, {"word": "intervention", "definition": "The act of stepping in to stop or change a situation, often by a referee."}, {"word": "trajectory", "definition": "The path or course that something or someone is taking."}, {"word": "burgeoning", "definition": "Beginning to grow or develop rapidly."}, {"word": "contender", "definition": "A person or team that competes for a championship or top position."}]}, "Advanced": {"text": "In a compelling and unexpected turn of events, Chev Clarke delivered a career-defining performance, vanquishing former cruiserweight world champion Chris Billam-Smith in a non-title professional boxing bout. The contest culminated in Billam-Smith's first-ever professional stoppage loss, a result that sends significant ripples through the cruiserweight division and reshapes the narrative for both combatants.\n\nBillam-Smith, a formidable presence and a respected figure in the 200-pound weight class, entered the ring with a professional record that, until this encounter, had never seen him halted by an opponent. His reign as a world champion had solidified his status, making this defeat all the more impactful. Clarke's decisive victory, achieved by knocking down and stopping the seasoned champion, underscores his burgeoning ascendancy in the sport and signals his serious intent to challenge for top honors.\n\nThe historical resonance of this particular matchup adds another layer of intrigue. Clarke had previously bested Billam-Smith during their amateur careers, a fact that now gains unprecedented significance as he replicates that success on the professional stage. This repeat victory not only validates Clarke's talent but also suggests a psychological edge he may hold over his more experienced counterpart. For Billam-Smith, the ramifications are substantial; a first stoppage loss at this stage of his career necessitates a thorough re-evaluation of his training, strategy, and future trajectory. It raises questions about his durability and ability to withstand top-tier professional pressure.\n\nWhile the bout was not contested for a championship, its outcome is arguably more pivotal than many title fights. It has catapulted Clarke into the conversation as a legitimate threat within the cruiserweight ranks, while simultaneously presenting a significant challenge for Billam-Smith to overcome. The boxing world will undoubtedly be scrutinizing their next moves, eager to witness how this impactful result influences their respective paths forward in a highly competitive division.", "vocab": [{"word": "vanquishing", "definition": "To defeat thoroughly, especially in a battle or contest."}, {"word": "culminated", "definition": "Reached the highest point or final stage of development."}, {"word": "ramifications", "definition": "Complex or unwelcome consequences of an action or event."}, {"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "ascendancy", "definition": "Occupation of a position of dominant power or influence."}, {"word": "unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "scrutinizing", "definition": "Examining or inspecting closely and thoroughly."}, {"word": "catapulted", "definition": "To launch or propel suddenly and with great force, often into a new situation or position."}]}}, "questions": [{"q": "Who won the boxing match between Chris Billam-Smith and Chev Clarke?", "a": "Chev Clarke won the boxing match."}, {"q": "What significant event happened to Chris Billam-Smith for the first time in his professional career during this fight?", "a": "Chris Billam-Smith was knocked down and stopped for the first time in his professional career."}], "id": "afbe54d4118", "source": "BBC Sport", "link": "https://www.bbc.co.uk/sport/boxing/articles/c6ly3mr522vpo?at_medium=RSS&at_campaign=rss", "published": "2026-11-08T09:55:21+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Michigan State's Starting QB Returns for Big Rivalry Game", "excerpt": "Michigan State's starting quarterback is back from injury, ready to play in a highly anticipated game against rival Michigan.", "levels": {"Beginner": {"text": "Michigan State University's main football player, the starting quarterback, is coming back to play. He was hurt before, but now his injury is better. This is good news for the team. The quarterback will play in a very important game this weekend. Michigan State will play against its big rival, the University of Michigan.\n\nThis game is always special. It is a big event for fans of both schools. Many people watch when Michigan State plays Michigan. The teams want to win this game very much. It is called a rivalry game because the teams are from the same state and have played each other for many years.\n\nHaving the starting quarterback back is a big deal. He is a very important player. He helps the team score points and win games. With him on the field, Michigan State hopes to do well against Michigan. Fans are excited to see him play again and lead his team. It will be an exciting game for sure.", "vocab": [{"word": "quarterback", "definition": "The main player on a football team who throws the ball."}, {"word": "injury", "definition": "A hurt part of the body."}, {"word": "rival", "definition": "A team or person that another team or person competes against often."}, {"word": "event", "definition": "Something important that happens."}, {"word": "score", "definition": "To get points in a game."}, {"word": "lead", "definition": "To guide or be in charge of."}]}, "Intermediate": {"text": "Michigan State University's football team has received a significant boost ahead of its highly anticipated rivalry game against the University of Michigan. The Spartans' starting quarterback, who has been sidelined due to injury, is now cleared to return to action. This news brings considerable optimism to the team and its supporters as they prepare for one of the most important matchups of their season.\n\nThe return of a starting quarterback is always a pivotal moment for any football program, especially when facing a formidable opponent like Michigan. The quarterback position is crucial for offensive strategy and execution, often dictating the flow and outcome of a game. His absence had undoubtedly impacted Michigan State's performance in recent weeks, making his return a welcome development for both the coaching staff and players. His leadership on the field is considered invaluable.\n\nThe rivalry between Michigan State and Michigan is one of college football's most storied and intense. Known as \"The Paul Bunyan Trophy\" game, it holds immense pride and bragging rights for both universities and their fan bases across the state of Michigan. These games are often unpredictable, regardless of the teams' records leading up to the contest, with emotions running high on both sides.\n\nWith their key offensive leader back on the field, Michigan State will aim to leverage his experience and skill to challenge Michigan's defense. His presence is expected to energize the entire team and provide a strategic advantage that was missing during his recovery. The return could also boost team morale significantly, giving them an extra edge. Fans are eagerly awaiting Saturday's kickoff, hoping their revitalized squad can secure a crucial victory in the Big Ten Conference standings, which could impact their season goals and bowl game aspirations.", "vocab": [{"word": "significant", "definition": "Important or noticeable."}, {"word": "anticipated", "definition": "Expected or looked forward to."}, {"word": "sidelined", "definition": "Unable to play or participate because of injury."}, {"word": "pivotal", "definition": "Very important or crucial."}, {"word": "formidable", "definition": "Inspiring fear or respect through being powerful, intense, or capable."}, {"word": "leverage", "definition": "To use something to maximum advantage."}, {"word": "morale", "definition": "The confidence, enthusiasm, and discipline of a person or group at a particular time."}]}, "Advanced": {"text": "Michigan State University's football program is experiencing a significant resurgence of optimism as its starting quarterback has been medically cleared to return to action for the highly anticipated clash against in-state rival, the University of Michigan. This pivotal development injects a crucial element of experience and leadership back into the Spartans' offensive scheme, just in time for one of the most consequential matchups on their annual calendar. The news, widely reported by sports outlets, has immediately shifted the narrative surrounding Saturday's contest.\n\nThe absence of a starting signal-caller due to injury can profoundly disrupt a team's rhythm and strategic capabilities. For Michigan State, navigating several weeks without their primary offensive architect presented considerable challenges, impacting their consistency and overall performance. His return is not merely about having a skilled player back; it signifies the re-establishment of a familiar command structure and a potential psychological uplift for the entire squad. The quarterback's ability to read defenses, make quick decisions, and execute complex plays is indispensable, especially in high-stakes contests where precision and composure are paramount.\n\nThe rivalry between Michigan State and Michigan transcends typical conference matchups, embodying a deep-seated historical animosity and intense competition for state bragging rights. Annually contested for \"The Paul Bunyan Trophy,\" this game often carries disproportionate weight, capable of defining a team's season regardless of its broader record. The atmosphere surrounding these encounters is typically electric, fueled by generations of passionate fan bases and a shared geographical proximity, creating an environment unlike any other in college football.\n\nFor Michigan State, the return of their veteran quarterback offers a renewed strategic flexibility. Opposing defenses will now have to contend with a more experienced and proven passer, potentially opening up running lanes and diversifying the play-calling options. This could force Michigan's formidable defense to adjust its game plan, which might have been tailored to exploit a less seasoned backup quarterback. The pressure on the returning QB will be immense; not only is he expected to perform at a high level immediately, but he also carries the hopes of a fan base desperate for a victory over their arch-rival. His performance will be scrutinized, given the magnitude of the game.\n\nBeyond the immediate emotional impact, a strong performance in this game could have significant ramifications for Michigan State's trajectory within the Big Ten Conference. A win against a top-tier opponent like Michigan can dramatically alter perceptions, improve bowl eligibility prospects, and build crucial momentum for the latter half of the season. Conversely, Michigan will be keen to maintain its dominance in the rivalry and solidify its position as a contender for the Big Ten Championship and potentially a spot in the national playoffs. The stage is set for a compelling contest, with the Spartans' revitalized offense, led by their returning star, poised to challenge their formidable adversaries in what promises to be a memorable showdown.", "vocab": [{"word": "resurgence", "definition": "An increase or revival after a period of little activity, popularity, or occurrence."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "signal-caller", "definition": "A term for a quarterback, emphasizing their role in directing the offense."}, {"word": "indispensable", "definition": "Absolutely necessary or essential."}, {"word": "transcends", "definition": "Goes beyond the range or limits of (something abstract, typically a conceptual field or division)."}, {"word": "animosity", "definition": "Strong hostility or opposition."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "scrutinized", "definition": "Examined or inspected closely and thoroughly."}]}}, "questions": [{"q": "What is the main news about Michigan State's football team?", "a": "Their starting quarterback is returning to play after being injured."}, {"q": "Which team will Michigan State play against in this important game?", "a": "They will play against their rival, the University of Michigan."}], "id": "a458fc27ae8", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihwFBVV95cUxNelZEdjE2dHdmTGlWUEhXc2llMkI4c3lnTjRoZWlKZzZySVB2Uld0bS1aV0V6a0xvdVZIS0RTXzlSVDh4T1hPejdUNTVnVVhMNTJrN1RpSXJsdElHeG1RRm9sZDVLUzBERDlWOGgtaEh4RVA3ZlhBS2JrMkZWbmNZNWdUMTc0REk?oc=5", "published": "2026-11-08T09:53:58+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Lime (LIME) Stock Fair Value Falls After Lower Analyst Targets And Weaker Guidance - Yahoo Finance", "excerpt": "Lime (LIME) Stock Fair Value Falls After Lower Analyst Targets And Weaker Guidance Yahoo Finance", "levels": {"Beginner": {"text": "Lime (LIME) Stock Fair Value Falls After Lower Analyst Targets And Weaker Guidance Yahoo Finance", "vocab": []}, "Intermediate": {"text": "Lime (LIME) Stock Fair Value Falls After Lower Analyst Targets And Weaker Guidance Yahoo Finance", "vocab": const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
