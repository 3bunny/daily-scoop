haracteristic in common"}]}, "Intermediate": {"text": "Cape Cod, a picturesque peninsula in Massachusetts, is renowned for its stunning beaches, charming towns, and vibrant natural environment. It attracts millions of tourists annually, drawn by its scenic beauty and coastal charm. However, with popularity comes the challenge of maintaining its pristine condition, as litter and waste can accumulate, posing a threat to both the ecosystem and the visitor experience.\n\nAddressing this ongoing challenge is a dedicated group of senior women who have taken it upon themselves to regularly clean up Cape Cod's public spaces. These committed volunteers spend countless hours meticulously collecting discarded items such as plastic bottles, fishing gear, and other debris from beaches, dunes, and walking trails. Their work is entirely voluntary, driven by a shared passion for preserving the natural heritage of their beloved region.\n\nThe impact of their consistent efforts is significant. By removing harmful waste, they help protect marine life and local wildlife from entanglement and ingestion of plastics. Their actions also contribute to a healthier environment, ensuring that the delicate balance of coastal ecosystems is maintained. Furthermore, their visible presence and tireless work serve as an inspiration to others, encouraging greater environmental awareness and responsibility within the community.\n\nThis group exemplifies the power of local volunteerism. Their dedication not only keeps Cape Cod beautiful for residents and tourists alike but also highlights how individual and collective actions can make a substantial difference in environmental conservation.", "vocab": [{"word": "picturesque", "definition": "visually attractive, especially in a quaint or pretty style"}, {"word": "renowned", "definition": "known or talked about by many people; famous"}, {"word": "pristine", "definition": "in its original condition; unspoiled"}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully"}, {"word": "debris", "definition": "scattered pieces of waste or remains"}, {"word": "ecosystem", "definition": "a biological community of interacting organisms and their physical environment"}, {"word": "conservation", "definition": "the protection of animals, plants, and natural resources"}]}, "Advanced": {"text": "Cape Cod, a distinctive hook-shaped peninsula in southeastern Massachusetts, stands as a cherished natural treasure and a major economic engine for the region, drawing millions with its iconic lighthouses, expansive sandy beaches, and vibrant marine ecosystems. Yet, the very popularity that fuels its tourism industry also presents a persistent challenge: the accumulation of litter and anthropogenic waste, which threatens the delicate ecological balance and detracts from the area's pristine allure.\n\nIn response to this pervasive issue, a remarkable cadre of senior women has emerged as a formidable force for environmental stewardship. Operating as a dedicated volunteer collective, these women commit countless hours to the painstaking task of cleaning Cape Cod's diverse landscapes. Their work extends beyond mere aesthetics, involving the meticulous removal of everything from discarded plastics and fishing line to microplastics embedded in the sand, from the shores, dunes, and intricate network of walking trails.\n\nTheir sustained efforts yield profound ecological benefits. The removal of plastic debris, in particular, mitigates the severe risks posed to marine fauna, preventing entanglement, injury, and the ingestion of harmful materials that can permeate the food chain. By diligently clearing these pollutants, the volunteers contribute directly to the health of coastal habitats, safeguarding species ranging from shorebirds to seals. Furthermore, their visible commitment serves as a powerful catalyst for community engagement, fostering a heightened sense of environmental responsibility among residents and visitors alike.\n\nBeyond the tangible environmental improvements, this group of senior volunteers embodies an inspiring narrative of civic participation and resilience. Their unwavering dedication demonstrates that age is no barrier to impactful activism, and their collective action galvanizes a broader appreciation for local conservation initiatives. They are not merely picking up trash; they are actively preserving a vital natural heritage, ensuring that future generations can continue to experience the unparalleled beauty and ecological richness of Cape Cod. Their work underscores the imperative of grassroots efforts in addressing global environmental challenges, proving that localized, consistent action can indeed effect substantial, positive change.", "vocab": [{"word": "anthropogenic", "definition": "originating in human activity"}, {"word": "detracts", "definition": "reduces or takes away the worth or value of"}, {"word": "pristine", "definition": "in its original condition; unspoiled and pure"}, {"word": "cadre", "definition": "a small group of people specially trained for a particular purpose or profession"}, {"word": "stewardship", "definition": "the careful and responsible management of something entrusted to one's care, especially the environment"}, {"word": "mitigates", "definition": "makes something less severe, serious, or painful"}, {"word": "galvanizes", "definition": "shocks or excites (someone) into taking action"}, {"word": "imperative", "definition": "of vital importance; crucial"}]}}, "questions": [{"q": "What is the main activity of the group of older women on Cape Cod?", "a": "The group of older women volunteers to clean up trash and litter from the beaches and natural areas of Cape Cod."}, {"q": "Why are their efforts important for Cape Cod?", "a": "Their efforts are important because they protect the environment, safeguard marine and local wildlife, maintain the natural beauty for residents and tourists, and inspire others to be more environmentally responsible."}], "id": "aef061c4d73", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivgFBVV95cUxNZktGVUZycm8xbkJmdmNBZFg5aEd3QW5UdnQ1QTlJQnVoNGxSd0ZYV3k0eHZXOTZrWGZVcnU4N3k4UlVVOTZnOEo3anF1UzhOQWZETEItd2NqZG9CenBmdUpJYVR4U1RfMEFfczJmVU9FdGRqMVBuSkRCUFpYdnFwQlkwSGdJX2pybDBRY1g3cDAySzlNVWdtc3RuOVR5cll0NnRGS1k1aklXMjZNNl83alp1d0lEV2RzLXV2SF9n?oc=5", "published": "2026-07-20T05:00:02+09:00", "category": "politics"}, {"headline": "US Soldier Killed in Iraq Amid Rising Regional Tensions", "excerpt": "A US soldier died in Iraq from an Iranian-linked attack, following another deadly assault on American forces in Jordan.", "levels": {"Beginner": {"text": "A US soldier has died in Iraq. Another soldier was hurt. The US military said an \"Iranian attack\" caused this. This sad news came just one day after two US soldiers were killed in Jordan. That attack in Jordan was from a drone.\n\nUS soldiers are in Iraq and Jordan to help. They work with local armies. Their job is to fight groups like ISIS and keep the area safe. They train local forces.\n\nBut now, there are many problems in the Middle East. Attacks on US forces have increased a lot recently. This makes the situation very tense and dangerous. The US government has said it will protect its soldiers. They are watching the situation closely. People are worried about more fighting in the region.\n\nThis event shows how dangerous the Middle East is right now. It reminds everyone of the risks soldiers take every day. The US military is investigating the attack in Iraq. They want to find out exactly who is responsible for hurting their soldiers. This is a serious situation.", "vocab": [{"word": "died", "definition": "stopped living."}, {"word": "hurt", "definition": "injured; caused pain to."}, {"word": "attack", "definition": "an act of violence or aggression."}, {"word": "soldiers", "definition": "people who serve in an army."}, {"word": "tense", "definition": "feeling nervous or worried; a situation with a lot of stress."}, {"word": "region", "definition": "a large area of a country or the world."}]}, "Intermediate": {"text": "A United States soldier was killed and another injured in Iraq following an \"Iranian attack,\" the US military reported. This incident occurred just one day after two American service members died in a drone attack in Jordan, marking a significant escalation of tensions in the Middle East.\n\nThe attack in Iraq, attributed by the US military to Iranian-backed groups, adds to a growing number of assaults on US forces stationed in the region. American troops are deployed in Iraq and Syria as part of Operation Inherent Resolve, a mission primarily focused on countering the Islamic State (ISIS) and supporting local security forces. Their presence aims to prevent the resurgence of the extremist group and maintain stability.\n\nThe deadly drone strike in Jordan, which killed two US soldiers, was also linked by US officials to Iran-backed militias operating in the area. This series of attacks highlights the volatile security environment, particularly exacerbated by the ongoing conflict between Israel and Hamas in Gaza. Iran-backed groups have intensified their operations against US interests, claiming solidarity with Palestinians and demanding an end to US support for Israel.\n\nUS officials have condemned these attacks and vowed to respond. The incidents place increasing pressure on the Biden administration to deter further aggression without triggering a wider regional conflict. The situation underscores the complex challenges faced by the United States in balancing its strategic interests with the safety of its personnel in a highly unstable part of the world. Investigations into both attacks are ongoing to determine the exact perpetrators and plan appropriate responses.", "vocab": [{"word": "injured", "definition": "physically harmed or wounded."}, {"word": "attributed", "definition": "regarded as belonging to or caused by."}, {"word": "escalation", "definition": "an increase in the intensity or seriousness of something."}, {"word": "deployed", "definition": "stationed (troops or equipment) for military action."}, {"word": "volatile", "definition": "likely to change rapidly and unpredictably, especially for the worse."}, {"word": "condemned", "definition": "expressed strong disapproval of."}, {"word": "deter", "definition": "discourage someone from doing something by instilling doubt or fear."}]}, "Advanced": {"text": "A United States service member was killed and another sustained injuries in Iraq following what the US military described as an \"Iranian attack,\" a grim development that underscores the escalating regional tensions. This fatality occurred merely a day after two American soldiers perished in a drone assault in Jordan, signaling a perilous intensification of hostilities targeting US personnel in the Middle East.\n\nThe attack in Iraq, which the US military has attributed to Iran-backed militias, represents a continuation of a persistent campaign of aggression against US forces. These militias, often operating under the umbrella of the \"Islamic Resistance in Iraq,\" have launched dozens of rocket and drone attacks on US bases in Iraq and Syria since the onset of the Israel-Hamas conflict. Their stated objective is to pressure the United States to withdraw its troops and cease its support for Israel. American forces are deployed in the region as part of Operation Inherent Resolve, a multinational coalition dedicated to advising, assisting, and enabling local partners in the enduring defeat of ISIS.\n\nThe preceding drone strike in Jordan, which claimed the lives of two US soldiers and injured many more, was a particularly brazen assault on a critical logistical outpost. US officials have unequivocally linked this attack to Iran-backed groups, emphasizing the sophisticated nature of the drone operation. This or the NBA. Many people believe he will be a star in the future. The Mavericks are getting Risacher, which means they are adding a promising young talent to their team.\n\nThis kind of trade helps teams get new players who can help them win more games. It changes how the teams look and play. This news comes from 'Hoops Rumors,' a source that shares basketball news and predictions.", "vocab": [{"word": "major", "definition": "very important or serious."}, {"word": "trade", "definition": "when teams exchange players."}, {"word": "defender", "definition": "a player who tries to stop the other team from scoring."}, {"word": "prospect", "definition": "a young player who is expected to be very good."}, {"word": "talented", "definition": "having a natural ability to do something well."}, {"word": "promising", "definition": "showing signs of future success."}]}, "Intermediate": {"text": "Reports from 'Hoops Rumors' suggest a significant three-team trade is currently in motion within the National Basketball Association (NBA). This complex deal is expected to see Luguentz Dort, a prominent defensive player, join the Atlanta Hawks. Simultaneously, Zaccharie Risacher, a highly-touted draft prospect, is reportedly heading to the Dallas Mavericks.\n\nLuguentz Dort has built a strong reputation as a formidable perimeter defender during his tenure with the Oklahoma City Thunder. His ability to guard multiple positions and bring consistent intensity on defense makes him a valuable asset for any team. For the Atlanta Hawks, acquiring Dort could substantially bolster their defensive capabilities, an area they have frequently aimed to strengthen. He offers veteran experience and a physical presence on the court.\n\nZaccharie Risacher, a promising French forward, was widely regarded as one of the top prospects in the recent NBA Draft. His reported move to Dallas indicates the Mavericks' strategy to add young, high-upside talent to complement their established stars. Risacher's potential as a versatile scorer and defender makes him an exciting long-term addition, offering future growth for the franchise.\n\nThree-team trades are a common mechanism in the NBA, allowing franchises to navigate salary cap restrictions, acquire specific player archetypes, or consolidate draft assets. While the complete details of what each team is sending and receiving are still being reported, these moves signal strategic shifts for all involved organizations. This trade could significantly reshape the rosters of the Hawks and Mavericks as they prepare for the upcoming season, aiming to enhance their overall competitiveness and future prospects.", "vocab": [{"word": "prominent", "definition": "important or famous."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively powerful or capable."}, {"word": "perimeter defender", "definition": "a player who guards opponents on the outside (perimeter) of the basketball court."}, {"word": "bolster", "definition": "to support or strengthen."}, {"word": "highly-touted", "definition": "praised or advertised enthusiastically."}, {"word": "prospect", "definition": "a person or thing regarded as likely to succeed or be important in the future."}, {"word": "high-upside", "definition": "having a lot of potential for future success or improvement."}]}, "Advanced": {"text": "In a significant development reverberating through the National Basketball Association, 'Hoops Rumors' has reported the impending finalization of a complex three-team trade. This multi-faceted transaction is poised to send Luguentz Dort, a tenacious defensive stalwart, to the Atlanta Hawks, while highly-coveted draft prospect Zaccharie Risacher is reportedly destined for the Dallas Mavericks. The third team involved, though not explicitly detailed in its full contributions, would facilitate the movement of assets necessary to balance the deal.\n\nDort, who has carved out a distinctive niche as one of the league's premier perimeter defenders during his tenure with the Oklahoma City Thunder, brings an invaluable blend of physicality, defensive versatility, and relentless effort. His acquisition by the Hawks signals a clear intent to fortify their defensive infrastructure, an area that has often been identified as a critical vulnerability for the franchise. Dort's ability to guard multiple positions, disrupt opposing offenses, and provide a consistent motor could offer a much-needed defensive anchor for Atlanta, complementing their existing offensive firepower and potentially elevating their overall team identity. This move suggests the Hawks are prioritizing immediate defensive impact and veteran presence.\n\nConversely, the Mavericks' reported acquisition of Zaccharie Risacher, a French forward who was a consensus top-tier talent in the recent NBA Draft, underscores a strategic pivot towards youth and long-term potential. Risacher's impressive combination of size, shooting touch, and defensive instincts makes him an intriguing prospect with considerable upside. Integrating such a high-ceiling talent could significantly enhance Dallas's future trajectory, offering a potential third foundational piece to develop alongside their established core. For the Mavericks, this move represents an investment in future competitiveness and a commitment to acquiring young assets with star potential, aligning with a long-term team-building philosophy.\n\nThree-team trades are intricate mechanisms often employed by NBA front offices to navigate the league's stringent salary cap regulations, optimize asset allocation, and address specific roster deficiencies simultaneously. While the complete contours of the deal – including the specific draft capital or additional players involved from each franchise – remain subject to official confirmation, the reported movements suggest a calculated re-shaping of competitive priorities. For the Thunder, parting with Dort would imply a further commitment to their youth movement and potentially acquiring additional draft capital or cap flexibility. This maneuver could have profound implications for the competitive landscape of both conferences, influencing team building philosophies and player valuations across the league as teams vie for championship contention in an increasingly dynamic environment.", "vocab": [{"word": "reverberating", "definition": "(of an effect) being felt or continuing to be felt throughout a place or system; having a far-reaching effect."}, {"word": "impending", "definition": "about to happen; imminent."}, {"word": "tenacious", "definition": "not readily relinquishing a position, principle, or course of action; determined."}, {"word": "stalwart", "definition": "a loyal, reliable, and hardworking supporter or participant in an organization or team."}, {"word": "multi-faceted", "definition": "having many aspects or sides."}, {"word": "fortify", "definition": "to strengthen (a place) with defensive works or capabilities."}, {"word": "infrastructure", "definition": "the fundamental facilities and systems serving an organization or area; in this context, the foundational elements of a team's strategy or defense."}, {"word": "trajectory", "definition": "the path or course of development of something."}]}}, "questions": [{"q": "Which two players are mentioned as moving to new teams in this trade?", "a": "Luguentz Dort and Zaccharie Risacher."}, {"q": "Which two teams are reportedly receiving new players in this trade?", "a": "The Atlanta Hawks and the Dallas Mavericks."}], "id": "a4f8fa8e9d0", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinAFBVV95cUxOdjV1dmdELVM5bDBDVnhxTThvVERhXzBhZzBqdVJKNUpGdGdneTFXMHhSMmYyMG55TjA5RUxHSVRoLUd0WkhHcU1Cd0MtWjd0UnU5NkFKNTNiaTg3TlVsVE1zWTJpQ24wV1J3Z0FtV0lORWotQnBoVmlkTEQzSFBEVk5WRV9aVXA0ZHlDSG9jSGY3SG1rRzZLR21RSFk?oc=5", "published": "2026-07-20T07:27:02+09:00", "category": "business", "category_title": "Business"}, {"headline": "Thunder Announce Lu Dort Trade to Atlanta Hawks", "excerpt": "The Oklahoma City Thunder have officially announced that they have traded key defensive player Lu Dort to the Atlanta Hawks.", "levels": {"Beginner": {"text": "The Oklahoma City Thunder basketball team has made a big change. They have traded a player named Lu Dort. Lu Dort will now play for the Atlanta Hawks team.\n\nA trade in sports means that players move from one team to another. Teams do this to try and make their team better. Lu Dort is known for playing strong defense. This means he is good at stopping other players from scoring points. He has been an important player for the Thunder.\n\nNow, Lu Dort will move to a new city and play with new teammates in Atlanta. The Atlanta Hawks will get a player who can help them stop other teams. The Thunder will get something in return, like other players or future chances to pick new players. This news was officially told by the Thunder team. A sports website called HoopsHype also reported this trade. It is a common part of the National Basketball Association (NBA), which is the main basketball league in the United States. Teams are always looking for ways to improve their roster, which is the list of players on their team.", "vocab": [{"word": "Trade", "definition": "When sports teams exchange players."}, {"word": "Player", "definition": "A person who plays a sport."}, {"word": "Team", "definition": "A group of players who play a sport together."}, {"word": "Defense", "definition": "The part of a game where players try to stop the other team from scoring."}, {"word": "Announce", "definition": "To tell people something officially or publicly."}, {"word": "League", "definition": "A group of sports teams that play against each other."}]}, "Intermediate": {"text": "The Oklahoma City Thunder have officially announced a significant roster change, trading guard/forward Lu Dort to the Atlanta Hawks. This move, reported by sports news outlet HoopsHype, sees a key defensive presence shift conferences within the National Basketball Association (NBA).\n\nLu Dort has been a prominent figure for the Thunder, especially known for his tenacious perimeter defense. Since joining the league, he has earned a reputation as a defensive specialist, often tasked with guarding the opposing team's best offensive players. His effort and intensity on the court have made him a fan favorite and a valuable asset for Oklahoma City.\n\nFor the Atlanta Hawks, acquiring Dort could provide a substantial boost to their defensive capabilities. The Hawks have often sought to improve their defense, and Dort's ability to lock down opponents on the wing could be a crucial addition. He brings a physical style of play and a commitment to the defensive end that can elevate a team's overall performance. This trade suggests the Hawks are looking to strengthen their roster to compete more effectively.\n\nOn the other side, the Thunder's decision to trade Dort might align with their ongoing strategy of rebuilding and accumulating future assets. While Dort was a valuable contributor, such trades often involve teams exchanging players for draft picks or other players that fit a long-term vision. This allows the Thunder to continue shaping their team for the future. For Dort, this means a new chapter in his NBA career, adapting to a new system and new teammates in Atlanta. The official announcement confirms the completion of this player movement, marking a notable transaction in the league.", "vocab": [{"word": "Officially", "definition": "In a formal and authorized way."}, {"word": "Roster", "definition": "The list of players on a sports team."}, {"word": "Prominent", "definition": "Important or well-known."}, {"word": "Tenacious", "definition": "Holding firmly to something; persistent and determined."}, {"word": "Defensive specialist", "definition": "A player who is particularly skilled at stopping opponents from scoring."}, {"word": "Acquiring", "definition": "Getting or obtaining something."}, {"word": "Rebuilding", "definition": "The process of making a sports team strong again by getting new players and developing young talent."}]}, "Advanced": {"text": "The Oklahoma City Thunder have officially announced a significant transaction, confirming the trade of their tenacious guard/forward, Lu Dort, to the Atlanta Hawks. This move, initially reported across various sports platforms including HoopsHype, signals a strategic shift for both franchises within the competitive landscape of the National Basketball Association (NBA).\n\nLu Dort has carved out a formidable reputation as one of the league's premier perimeter defenders since entering the NBA as an undrafted free agent. His relentless effort, physical play, and ability to guard multiple positions have made him an invaluable asset, often tasked with stifling the opposing team's most potent offensive threats. His journey from an overlooked prospect to a vital contributor underscores his dedication and impact on the court for the Thunder.\n\nFor the Atlanta Hawks, the acquisition of Dort represents a clear intent to bolster their defensive intensity and versatility. The Hawks have historically sought to enhance their defensive metrics, and Dort's arrival provides a much-needed stopper against elite opposing guards and wings. His presence is expected to complement their existing offensive firepower, offering a crucial balance that could elevate their contention status. Dort's ability to disrupt passing lanes and contest shots adds a new dimension to Atlanta's defensive schemes, potentially transforming their identity on that end of the floor.\n\nConversely, the Thunder's decision to part ways with Dort aligns with their well-documented long-term strategy of asset accumulation and roster flexibility. While Dort was a fan favorite and a consistent performer, such trades often facilitate the acquisition of future draft capital or other young prospects that fit a rebuilding timeline. This allows Oklahoma City to continue optimizing their asset portfolio, creating salary cap space, and fostering the development of their burgeoning young core. The intricacies of NBA trades often involve salary matching and future considerations, highlighting the complex financial and strategic planning undertaken by general managers.\n\nFor Dort himself, this trade marks a new chapter, presenting an opportunity to integrate into a new system and contribute to a team with different aspirations. The official announcement solidifies the completion of this high-profile player movement, underscoring the dynamic nature of professional sports and the continuous pursuit of competitive advantage. This transaction will undoubtedly be scrutinized for its immediate and long-term implications for both the Thunder's ongoing rebuild and the Hawks' pursuit of championship contention.", "vocab": [{"word": "Tenacious", "definition": "Holding fast; persistent; determined; not easily letting go."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Premier", "definition": "First in importance, order, or position; leading."}, {"word": "Stifling", "definition": "Preventing something from happening or developing; or, making someone unable to breathe properly."}, {"word": "Potent", "definition": "Having great power, influence, or effect."}, {"word": "Bolster", "definition": "To support or strengthen; to prop up."}, {"word": "Asset accumulation", "definition": "The process of gathering or acquiring valuable resources or properties, often for future benefit."}, {"word": "Intricacies", "definition": "The details, especially of an intricate or complex subject."}]}}, "questions": [{"q": "Which two NBA teams are involved in the trade of Lu Dort?", "a": "The Oklahoma City Thunder and the Atlanta Hawks."}, {"q": "What is Lu Dort particularly known for as a basketball player?", "a": "He is known for his strong defense, especially perimeter defense."}], "id": "a1cdb170ec7", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixAFBVV95cUxNZUZiM25yaXRLRDY1Ti1Gc2RKWTItcEExcEFLT2RSZFBncml1Q1hUc1NGeF9pT2tEcW51NklKQkltMXlORzAwYi1JQ3ppaVhncTNLX3ZRRGljcHpOQnhaT2VSYjdiU2RJRnBKNWFjY2dOZHpTSC1YbmFBajNpaXpJU291VldIUE13TFJ5SklFaU1jYkZGY21kZXdsM3RVRTNTVXg0OUlsWnpMZVF6dGZiVGt2bXEyb2VvaVZoNWV0bWliQjBv?oc=5", "published": "2026-07-20T07:27:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Iran Reveals Bank Lending Data Amid Economic Scrutiny", "excerpt": "Iran's Central Bank has disclosed the volume of bank lending, providing key insights into the nation's financial health and economic activity.", "levels": {"Beginner": {"text": "Iran's banks lend money to people and businesses. This is important for the country's economy. When banks lend money, people can buy homes or cars. Businesses can use loans to grow, buy new machines, or hire more workers. This helps the economy get stronger.\n\nRecently, Iran shared information about how much money its banks have lent. This information comes from the Central Bank of Iran, which is like the main bank of the country. It helps manage money and banks.\n\nKnowing the amount of bank lending helps people understand the economy better. It shows if businesses are investing and if people are spending. Iran's economy has faced some challenges, like high prices for goods. So, this data is important for leaders to see how the economy is doing and make plans. It helps them decide how to support businesses and families. The disclosure of this data is a step towards showing more about the country's financial situation.", "vocab": [{"word": "lend", "definition": "to give money to someone for a short time, expecting them to give it back."}, {"word": "economy", "definition": "the system of how money is made and used in a country."}, {"word": "loans", "definition": "money that is lent to someone and must be paid back."}, {"word": "central bank", "definition": "the main bank of a country that manages money and other banks."}, {"word": "challenges", "definition": "difficult situations or problems."}, {"word": "disclosure", "definition": "the act of making something known or telling people about it."}]}, "Intermediate": {"text": "Iran's Central Bank has recently disclosed the volume of bank lending, offering a significant glimpse into the nation's economic landscape. Bank lending is a crucial indicator of economic activity, as it directly fuels investment, consumer spending, and job creation. When banks provide loans, businesses can expand operations, invest in new technologies, and hire more employees, while individuals can finance major purchases like homes or vehicles. This flow of credit is essential for economic growth and stability across various sectors.\n\nThe Central Bank of Iran (CBI) is responsible for overseeing the country's monetary policy and financial system. Its decision to release these figures provides valuable data for economists, policymakers, and the public to assess the health of the Iranian economy. Iran has faced considerable economic pressures, including international sanctions and persistent inflation, which have impacted its financial markets and the ability of businesses to secure funding. Understanding the scale of bank lending helps to gauge the private sector's access to capital and its capacity for expansion.\n\nMonitoring the volume of bank lending allows authorities to understand how credit is flowing through the economy. A healthy lending environment can signal confidence and stimulate growth, while a slowdown might indicate caution or tighter financial conditions. This information is vital for the CBI to formulate appropriate monetary policies, such as adjusting interest rates, to manage inflation and support economic development. The transparency offered by this disclosure helps in making informed decisions to navigate the country's complex economic challenges and foster a more stable financial future. It also allows international observers to better understand the internal dynamics of Iran's financial system.", "vocab": [{"word": "disclosed", "definition": "revealed or made known to the public."}, {"word": "indicator", "definition": "something that shows the condition or existence of something else."}, {"word": "fuels", "definition": "supports or encourages the growth or development of something."}, {"word": "monetary policy", "definition": "actions taken by a central bank to control the supply of money and credit to achieve economic goals."}, {"word": "sanctions", "definition": "official orders or laws stopping trade or communication with a country as a punishment."}, {"word": "persistent", "definition": "continuing to exist or happen, especially for a long time."}, {"word": "transparency", "definition": "the quality of being open, honest, and not secret."}]}, "Advanced": {"text": "The Central Bank of Iran (CBI) has recently unveiled the aggregate volume of bank lending, a disclosure that offers critical insights into the nation's financial stability and economic trajectory. In any economy, the flow of credit from financial institutions is a fundamental driver of growth, facilitating capital formation, stimulating consumer demand, and fostering entrepreneurial activity. Loans enable businesses to undertake significant investments in infrastructure, technology, and human capital, thereby enhancing productivity and creating employment opportunities. Concurrently, accessible credit empowers individuals to make substantial purchases, contributing to overall market liquidity and economic dynamism.\n\nFor Iran, a nation grappling with the multifaceted challenges of international sanctions and endemic inflation, the transparency surrounding bank lending data is particularly salient. The CBI, as the principal architect of monetary policy, utilizes such macroeconomic indicators to calibrate its strategies for managing liquidity, controlling inflationary pressures, and bolstering the private sector. The volume of lending serves as a barometer for investor confidence and the private sector's capacity for expansion and innovation amidst a restrictive economic environment. A robust lending trend might suggest resilience and adaptation, while a contraction could signal deepening economic headwinds.\n\nAnalysts and policymakers will scrutinize this data to discern patterns in credit allocation across various sectors, identifying areas of strength or vulnerability. For instance, a disproportionate allocation to speculative ventures over productive enterprises could exacerbate inflationary pressures or create asset bubbles. Conversely, targeted lending towards manufacturing or export-oriented industries could be indicative of strategic economic diversification efforts. The CBI's role extends beyond mere disclosure; it involves actively shaping the lending landscape through regulatory frameworks, reserve requirements, and interest rate adjustments to ensure financial system stability and align credit flows with national economic objectives.\n\nThis move towards greater data transparency, while seemingly a routine economic report, holds added significance for Iran. It allows for a more informed assessment by both domestic and international observers regarding the efficacy of current economic policies and the genuine health of the financial sector. In an economy often characterized by opacity due, in part, to external pressures, the release of such granular data can foster greater trust and potentially attract much-needed foreign direct investment, albeit within the confines of existing geopolitical realities. Ultimately, understanding the dynamics of bank lending is indispensable for navigating Iran's complex economic terrain and charting a sustainable path forward.", "vocab": [{"word": "unveiled", "definition": "revealed or made public for the first time."}, {"word": "aggregate", "definition": "formed or calculated by the combination of many separate units or items; total."}, {"word": "trajectory", "definition": "the path or course followed by a moving object or a developing situation."}, {"word": "salient", "definition": "most noticeable or important."}, {"word": "endemic", "definition": "regularly found among particular people or in a certain area; widespread and persistent."}, {"word": "calibrate", "definition": "to adjust or fine-tune something to achieve a desired output or result."}, {"word": "barometer", "definition": "something that reflects changes in circumstances or opinions."}, {"word": "scrutinize", "definition": "to examine or inspect closely and thoroughly."}]}}, "questions": [{"q": "What is the main purpose of banks lending money in an economy?", "a": "Banks lend money to help businesses grow, create jobs, and allow individuals to make large purchases, which stimulates overall economic activity."}, {"q": "Which institution in Iran is responsible for disclosing the volume of bank lending and managing monetary policy?", "a": "The Central Bank of Iran (CBI) is responsible for disclosing bank lending data and managing the country's monetary policy."}], "id": "a1aeb43fcc2", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE44OUFpaVVLczVPWGRVWFZDdlRDM3ZDQmxlcnpTX2pjYnppWEJHdEZwRTZOMDZLQjROY0R0dXlMNWRNZVZTaWdHTWw0MDc4Z1dNeUZJMw?oc=5", "published": "2026-07-20T06:22:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Dollar Hits Record High Against Taka in Bangladesh", "excerpt": "The US Dollar has hit a new record against the Bangladeshi Taka, driven by increased imports and lower remittances.", "levels": {"Beginner": {"text": "The US Dollar is now worth more Bangladeshi Taka than ever before. One US Dollar is now Tk 123.60. This is a new record. This change means that things Bangladesh buys from other countries, called \"imports,\" will cost more money. For example, if Bangladesh buys oil or machines from abroad, it needs US Dollars to pay. If dollars are more expensive, these things cost more Taka.\n\nAnother reason for this is \"remittances.\" Remittances are money that people working in other countries send back home to Bangladesh. When less money comes back, Bangladesh has fewer US Dollars. When there are fewer US Dollars available, and many people want to buy them (like for imports), the price of the dollar goes up. This makes life harder for people in Bangladesh because many things, like food and fuel, might become more expensive. The country's central bank tries to manage this, but it's a big challenge.", "vocab": [{"word": "Dollar", "definition": "The money used in the United States."}, {"word": "Taka", "definition": "The money used in Bangladesh."}, {"word": "Imports", "definition": "Goods that a country buys from other countries."}, {"word": "Remittances", "definition": "Money sent home by people working in foreign countries."}, {"word": "Expensive", "definition": "Costing a lot of money."}, {"word": "Central bank", "definition": "The main bank of a country that manages its money."}]}, "Intermediate": {"text": "Bangladesh is grappling with a significant economic challenge as the US Dollar has reached an unprecedented exchange rate against the Bangladeshi Taka. The dollar now stands at Tk 123.60, marking a new record high. This depreciation of the Taka means that more local currency is needed to buy one US Dollar, making foreign goods and services more costly for the nation.\n\nThis situation is primarily driven by two key factors: higher imports and lower remittances. Bangladesh relies heavily on imports for essential goods such as fuel, raw materials, and machinery. When imports increase, the demand for US Dollars to pay for these goods also rises significantly. Businesses need dollars to complete their international transactions, creating pressure on the foreign exchange market.\n\nConcurrently, the supply of US Dollars in the country has decreased due to a decline in remittances. Remittances are the crucial funds sent home by Bangladeshi expatriates working abroad. These funds are a major source of foreign currency for Bangladesh, helping to balance its international payments. A sustained drop in remittances means less foreign currency is entering the economy, exacerbating the dollar shortage.\n\nThe imbalance between high demand for dollars (due to increased imports) and low supply of dollars (due to reduced remittances) inevitably pushes the dollar's value up. This makes imported goods more expensive for consumers and businesses in Bangladesh, directly contributing to inflation. The Bangladesh Bank, the country's central bank, often intervenes in the foreign exchange market by selling dollars from its reserves to stabilize the Taka. However, persistent pressures can deplete these reserves and make intervention difficult. This trend can affect the overall economy, making it harder for the country to manage its finances, control prices, and maintain economic stability.", "vocab": [{"word": "Unprecedented", "definition": "Never done or known before."}, {"word": "Exchange rate", "definition": "The value of one currency compared to another."}, {"word": "Depreciation", "definition": "A decrease in the value of a currency."}, {"word": "Imports", "definition": "Goods and services brought into a country from abroad."}, {"word": "Remittances", "definition": "Money sent by people working abroad to their families in their home country."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Central bank", "definition": "The national bank that provides financial and banking services for its country's government and commercial banking system, as well as implementing monetary policy."}]}, "Advanced": {"text": "Bangladesh's economy is grappling with significant headwinds as the US Dollar has reached an unprecedented exchange rate of Tk 123.60 against the Bangladeshi Taka, marking a new record high. This substantial depreciation of the Taka has profound implications for the nation's economic stability and its citizens' purchasing power.\n\nThe primary drivers behind this sharp rise in the dollar's value are a surge in import payments and a sustained decline in remittances. Bangladesh's economy is heavily reliant on imports for a wide array of goods, including essential commodities like fuel, industrial raw materials, capital machinery, and even consumer staples. The robust demand for these imports necessitates a high volume of US Dollars for international transactions, placing immense pressure on the foreign exchange market. Businesses, from manufacturing to retail, require dollars to procure their inputs, and a more expensive dollar translates directly into higher operational costs.\n\nConcurrently, the supply side of the foreign exchange equation has weakened considerably due to a noticeable drop in remittances. Remittances, the funds sent home by the large Bangladeshi diaspora working abroad, have historically been a critical pillar of the country's foreign currency inflows, contributing significantly to its balance of payments. A reduction in these inflows means fewer dollars are entering the economy, exacerbating the existing dollar shortage. This dual pressure—high demand from imports and diminished supply from remittances—creates a perfect storm for currency depreciation.\n\nThe ramifications of a depreciating Taka are multifaceted. For consumers, it translates into higher prices for imported goods, including food, electronics, and fuel, directly fueling inflationary pressures across the economy. This erodes the purchasing power of households, particularly those with fixed incomes. For businesses, increased import costs can reduce profitability, potentially leading to slower economic growth, reduced investment, and even job losses in import-dependent sectors. Furthermore, the cost of servicing foreign debt, both public and private, increases when the local currency weakens against the dollar.\n\nThe Bangladesh Bank, the country's central bank, has been actively intervening in the foreign exchange market, selling dollars from its foreign currency reserves to try and stabilize the Taka. However, these interventions are unsustainable in the long run if the underlying imbalances persist, as they deplete the nation's vital reserves. The central bank faces a delicate balancing act: supporting the Taka without excessively draining reserves, while also managing inflation. Addressing the root causes will require a combination of fiscal and monetary policies aimed at reducing import demand, boosting export earnings, and encouraging formal channels for remittance inflows. The current exchange rate dynamics underscore the structural vulnerabilities within Bangladesh's external sector and pose a significant challenge to its macroeconomic management.", "vocab": [{"word": "Headwinds", "definition": "Factors or circumstances that make progress difficult or slow."}, {"word": "Unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "Depreciation", "definition": "A reduction in the value of a currency relative to other currencies, making imports more expensive and exports cheaper."}, {"word": "Ramifications", "definition": "The complex or unwelcome consequences of an action or event."}, {"word": "Exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}, {"word": "Inflationary pressures", "definition": "Economic forces that tend to increase the general price level of goods and services in an economy."}, {"word": "Fiscal and monetary policies", "definition": "Fiscal policy involves government spending and taxation; monetary policy involves managing the supply of money and credit, typically by a central bank."}, {"word": "Macroeconomic management", "definition": "The process of overseeing and guiding the performance of a country's overall economy."}]}}, "questions": [{"q": "What is the new record exchange rate of the US Dollar against the Bangladeshi Taka?", "a": "The new record exchange rate is Tk 123.60 for one US Dollar."}, {"q": "What are the two main reasons mentioned for the dollar's rise against the Taka?", "a": "The two main reasons are higher imports and lower remittances."}], "id": "a8cbb5ed617", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxQcTRJU3VUaWxtYnhvWHlYUGJRWWdXUlREUUxleFRxT1J6VVBiVjRtODcyMzZxUVh5eW1RNkxjOVVXRzNST0hUNVJPbGtJODNGVmZJZ2Z6c21hWWVkVzJXZFdXczhOUzlLeExXNksxWUFfX2dudWwyV1YwQUV2UzV3V2E1VDRDQVZKeEI1SUxnTXo3QkROZmVuS0xueXl1SVFxWUp1WGM3Z3RueEYwTXVNdlBsZjJCWjRTY3k00gHHAUFVX3lxTE5Ba1dTOE1HTzhQSGxZWnFZSTlKeWVnSjcyeVZrQnkwSTR3TEVhSUpCV19GZ1BCeXVvR3lUaExEYmxQWUZPUnhwQjBfODFYWEIwZTFGaGprU3JCWmR6U2VOVlNnUmFuamNtempEMmxZTVpqX2dVbTJfQWd4bU13X0tRTlJVT3J2dHlzMEdTS2ZxMkpWRjFISWhBMEs2c000NmpKSkp4bEVjdTF1ZzJlQ0k5d3N3VndZd28zWjNKX3NzU3J3X1ZyNmM?oc=5", "published": "2026-07-20T04:43:25+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "FBI Ends Investigations into ICE Confrontations", "excerpt": "Federal agents have been informed that the FBI will no longer investigate incidents involving U.S. Immigration and Customs Enforcement (ICE) agents.", "levels": {"Beginner": {"text": "The FBI will no longer look into problems involving ICE. This news comes from a report. ICE stands for Immigration and Customs Enforcement. They are a government group that works with immigration laws. The FBI is another government group. It investigates crimes. \n\nBefore, if there were problems or fights during ICE actions, the FBI might investigate. This was to make sure everything was done correctly. Now, the FBI will stop doing these investigations. \n\nThis change means that a different group might need to check on ICE actions. Or, there might be less checking overall. People want to know who will make sure ICE agents follow rules. This is important for how the government works and for people's rights. The Seattle Times shared this information.", "vocab": [{"word": "investigate", "definition": "to look into something carefully to find facts"}, {"word": "confrontations", "definition": "situations where people meet face-to-face, often in an angry or difficult way"}, {"word": "immigration", "definition": "the process of people moving to live in a new country"}, {"word": "agents", "definition": "people who work for a government agency"}, {"word": "rights", "definition": "things that people are allowed to have or do by law"}]}, "Intermediate": {"text": "Federal agents have been informed that the Federal Bureau of Investigation (FBI) will no longer conduct investigations into incidents involving U.S. Immigration and Customs Enforcement (ICE) agents. This significant policy shift was reported by The Seattle Times.\n\nPreviously, the FBI would often step in to investigate allegations of misconduct or excessive force during ICE operations. These investigations were part of a broader system of oversight, ensuring that federal agents adhered to legal standards and respected civil liberties. The FBI, as the primary federal investigative agency, played a role in examining potential criminal acts or serious policy violations by other federal entities.\n\nICE is responsible for enforcing immigration laws, including arrests, detentions, and deportations. Their operations can sometimes lead to tense encounters, and past incidents have drawn scrutiny from civil rights groups and the public. The FBI's involvement provided an independent layer of review for such confrontations.\n\nThe decision to cease these investigations raises questions about accountability and oversight for ICE actions. Without the FBI's involvement, it is unclear which federal body will now be responsible for independently examining serious allegations against ICE personnel. This change could impact how complaints are handled and how the public perceives the transparency and fairness of immigration enforcement operations. The implications of this new directive are likely to be debated by lawmakers and advocacy organizations.", "vocab": [{"word": "conduct", "definition": "to organize and carry out an activity"}, {"word": "allegations", "definition": "claims or statements that someone has done something wrong, often without proof"}, {"word": "misconduct", "definition": "unacceptable or improper behavior, especially by an employee or professional"}, {"word": "oversight", "definition": "the action of supervising someone or something, especially to ensure that rules are followed"}, {"word": "adhered", "definition": "followed a rule, belief, or instruction exactly"}, {"word": "accountability", "definition": "the fact or condition of being responsible for one's actions and being able to explain them"}]}, "Advanced": {"text": "Federal agents across the United States have reportedly been informed that the Federal Bureau of Investigation (FBI) will no longer initiate or pursue investigations into confrontations involving U.S. Immigration and Customs Enforcement (ICE) agents. This significant directive, first brought to light by The Seattle Times, marks a notable shift in inter-agency oversight mechanisms within the federal government.\n\nHistorically, the FBI, as the nation's premier federal law enforcement agency, has often served as an independent investigative body for serious allegations of misconduct, excessive force, or potential civil rights violations committed by personnel from other federal agencies, including ICE. This role was crucial for maintaining public trust, ensuring adherence to constitutional principles, and providing a layer of accountability for actions taken during immigration enforcement operations, which can frequently be contentious and high-stakes.\n\nICE, operating under the Department of Homeland Security, is tasked with enforcing immigration laws, a mandate that involves extensive operations ranging from workplace raids to border enforcement and deportations. These activities, by their very nature, can lead to tense encounters with individuals and communities, often drawing intense scrutiny from civil liberties advocates and human rights organizations. When such confrontations escalated or involved allegations of criminal behavior or severe policy breaches by ICE agents, the FBI's involvement offered a mechanism for impartial review, separate from ICE's internal disciplinary processes.\n\nThe cessation of FBI investigations into these incidents raises profound questions regarding the future of accountability and transparency for ICE operations. Critics and civil rights groups are likely to voice concerns that removing this external investigative layer could diminish oversight, potentially leading to a perception of reduced consequences for agent misconduct. It also prompts inquiries into which alternative federal entity, if any, will assume the responsibility for independently scrutinizing serious complaints against ICE personnel, or if such incidents will now fall solely under internal Department of Homeland Security review, which some argue may lack the necessary independence.\n\nThis policy change could have far-reaching implications for how allegations of abuse or unlawful conduct during immigration enforcement are addressed, potentially impacting legal recourse for affected individuals and shaping public perception of federal immigration agencies. The precise reasons behind this directive, whether stemming from resource reallocation, a redefinition of jurisdictional boundaries, or a broader policy shift, remain subject to further clarification and debate.", "vocab": [{"word": "initiate", "definition": "to cause something to begin; to start or set in motion"}, {"word": "directive", "definition": "an official or authoritative instruction or order"}, {"word": "oversight mechanisms", "definition": "systems or processes designed to supervise or monitor an organization or activity to ensure it meets standards or rules"}, {"word": "premier", "definition": "first in importance, order, or position; leading"}, {"word": "contentious", "definition": "causing or likely to cause an argument; controversial"}, {"word": "scrutiny", "definition": "critical observation or examination"}, {"word": "cessation", "definition": "the fact or process of ending or being brought to an end"}, {"word": "jurisdictional boundaries", "definition": "the limits or extent of a legal or administrative authority's power or territory"}]}}, "questions": [{"q": "What two federal agencies are mentioned in the news item?", "a": "The two federal agencies mentioned are the FBI (Federal Bureau of Investigation) and ICE (Immigration and Customs Enforcement)."}, {"q": "What specific change in policy has been reported regarding these agencies?", "a": "The reported policy change is that the FBI will no longer investigate confrontations involving ICE agents."}], "id": "a75a754853a", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMizgFBVV95cUxQaWd0MExhYWhoSVdtSE9scElwM2xoRlpMMjIwZl81eFl1czdWWk1mTnRqaE04NFlUR0I5bTRCVE4waEE0eGhDaHNBZzJCYWthR0VtTjNRREhiNmVHYWFVcE5qRmlfcGMwRmtYand6MTd6Y3VCUjRldW1NaXNWb0wzVDZsNC1Kcy1JZnNzMlBmQzZHOFQ0WmlETklKOTBONlZKSXYzVDVIakpaTEVfMGdPMjVwbUEwZGFVVlFJbHlrb0VISUJGeXJXY1ZPczltdw?oc=5", "published": "2026-07-20T06:54:40+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Flash Floods Hit New York and New Jersey After Heavy Rain", "excerpt": "Torrential rain caused severe flash floods in New York and New Jersey, submerging streets and subway stations, disrupting daily life.", "levels": {"Beginner": {"text": "Heavy rain fell on New York and New Jersey. This rain was very strong, like a \"torrential rain.\" It caused \"flash floods.\" Flash floods mean a lot of water comes very fast. Streets in cities like New York City became like rivers. Water went into subway stations too. People had to walk through deep water, which is called \"wading.\"\n\nThe floods made it hard for people to travel. Subway trains stopped in some places. Cars could not drive on many roads. This made daily life difficult for many people. Emergency workers helped where they could. They told people to be careful and stay safe.\n\nWhen there are flash floods, it can be dangerous. The water can be deep and move quickly. It can also hide dangers like potholes. So, it is important to listen to weather warnings. People should avoid flooded areas. This heavy rain showed how quickly weather can change things in big cities. It was a big problem for New York and New Jersey.", "vocab": [{"word": "Torrential rain", "definition": "Very heavy rain."}, {"word": "Flash floods", "definition": "A lot of water that comes very fast."}, {"word": "Wading", "definition": "Walking through water."}, {"word": "Subway stations", "definition": "Places where underground trains stop."}, {"word": "Dangerous", "definition": "Not safe; can cause harm."}]}, "Intermediate": {"text": "Torrential rain recently struck parts of New York and New Jersey, leading to widespread flash floods. The intense downpour caused significant disruption, transforming city streets into rushing waterways and sending cascades of water into subway stations. Residents in affected areas were seen wading through deep water, struggling to navigate the sudden inundation.\n\nThe severe weather event prompted authorities to issue flood warnings and advisories across the region. Transportation systems were particularly hard hit. Many subway lines experienced delays or complete suspensions, and numerous roads became impassable due to high water levels. This created considerable challenges for commuters and daily life, with many people unable to reach their destinations or even leave their homes safely.\n\nFlash floods pose serious risks, not only to property but also to personal safety. The rapid accumulation of water can sweep away vehicles and individuals, and submerged hazards like open manholes or debris can be hidden from view. Emergency services were active, urging residents to avoid flooded areas and to follow official guidance. The event highlighted the vulnerability of urban infrastructure to extreme weather, emphasizing the need for robust drainage systems and effective emergency preparedness. As the water slowly receded, the cleanup effort began, but the impact of the unexpected deluge was felt throughout the region.", "vocab": [{"word": "Torrential", "definition": "Very heavy and strong (rain)."}, {"word": "Flash floods", "definition": "Sudden, severe flooding caused by heavy rain."}, {"word": "Disruption", "definition": "A disturbance or problem that interrupts an event or process."}, {"word": "Wading", "definition": "Walking with effort through water or another liquid or viscous substance."}, {"word": "Impassable", "definition": "(Of a road or path) impossible to travel along or over."}, {"word": "Vulnerability", "definition": "The state of being exposed to the possibility of being attacked or harmed, either physically or emotionally."}]}, "Advanced": {"text": "A deluge of torrential rain recently unleashed widespread chaos across metropolitan areas of New York and New Jersey, triggering severe flash floods that paralyzed transportation and disrupted daily life for millions. The intense precipitation transformed urban landscapes, with water cascading dramatically into subterranean subway stations and turning major thoroughfares into treacherous, fast-moving rivers. Eyewitness accounts and viral social media footage depicted residents wading through waist-deep water, struggling against strong currents in what were normally bustling streets.\n\nAuthorities swiftly issued emergency flood warnings and advisories, urging residents to exercise extreme caution and avoid non-essential travel. The impact on the region's intricate transportation network was profound. Numerous subway lines faced extensive delays, partial closures, or complete suspensions, stranding commuters and exacerbating rush-hour congestion. Surface roads became largely impassable, with vehicles submerged and emergency services struggling to navigate the inundated infrastructure. This widespread disruption underscored the inherent vulnerability of densely populated urban centers to extreme weather phenomena.\n\nFlash floods, characterized by their rapid onset and destructive power, present significant hazards. Beyond the immediate threat of drowning, the swift-moving water can dislodge and carry heavy debris, compromise structural integrity, and conceal dangerous submerged obstacles such as open manholes or downed power lines. The economic repercussions can also be substantial, encompassing property damage, business interruptions, and costly infrastructure repairs. This event serves as a stark reminder of the increasing frequency and intensity of extreme weather patterns, often linked to climate change, which place immense strain on existing urban drainage systems and emergency response capabilities.\n\nAs the immediate threat subsided and waters began to recede, the arduous task of assessment and cleanup commenced. Local and state agencies coordinated efforts to restore normalcy, but the incident prompted renewed discussions about enhancing urban resilience, upgrading aging infrastructure, and developing more robust early warning systems to mitigate the devastating effects of future meteorological events. The recent inundation in New York and New Jersey stands as a potent illustration of the challenges faced by modern cities in adapting to an increasingly unpredictable climate.", "vocab": [{"word": "Deluge", "definition" const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
