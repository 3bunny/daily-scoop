ious guy,” wrote O’Malley. […]", "vocab": []}, "Intermediate": {"text": "Anthony Clark, an actor and comedian best known for starring in six seasons of “Yes, Dear,” died Tuesday. He was 62. Clark’s death was announced by his “Yes, Dear” co-star Mike O’Malley, who shared the news on Wednesday in a statement posted to X. “Anthony Clark died yesterday. He was a hilarious guy,” wrote O’Malley. […]", "vocab": []}, "Advanced": {"text": "Anthony Clark, an actor and comedian best known for starring in six seasons of “Yes, Dear,” died Tuesday. He was 62. Clark’s death was announced by his “Yes, Dear” co-star Mike O’Malley, who shared the news on Wednesday in a statement posted to X. “Anthony Clark died yesterday. He was a hilarious guy,” wrote O’Malley. […]", "vocab": []}}, "questions": [], "id": "a0fe31cf628", "source": "Variety", "link": "https://variety.com/2026/tv/people-news/anthony-clark-dead-yes-dear-1236945796/", "published": "2026-11-12T11:16:45+09:00", "category": "entertainment"}]}], "home": [{"headline": "Kerrigan and Kelly in Washington Reporter: Small Businesses Are Winning With AI. Policymakers Should Keep Up - Small Business & Entrepreneurship Council", "excerpt": "Kerrigan and Kelly in Washington Reporter: Small Businesses Are Winning With AI. Policymakers Should Keep Up Small Business & Entrepreneursh", "levels": {"Beginner": {"text": "Kerrigan and Kelly in Washington Reporter: Small Businesses Are Winning With AI. Policymakers Should Keep Up Small Business & Entrepreneurship Council", "vocab": []}, "Intermediate": {"text": "Kerrigan and Kelly in Washington Reporter: Small Businesses Are Winning With AI. Policymakers Should Keep Up Small Business & Entrepreneurship Council", "vocab": []}, "Advanced": {"text": "Kerrigan and Kelly in Washington Reporter: Small Businesses Are Winning With AI. Policymakers Should Keep Up Small Business & Entrepreneurship Council", "vocab": []}}, "questions": [], "id": "ac234447630", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxQTkNUNkJ0bHNheTVHNE5JTlBPX2szVUR6RHc0SHZiM2R1VXR2TDU2X2hOWFZIUVY3SEJPYmlyT0p5Z1VNWWhqdlE0YjR5aXY4NFJNdE43UFJTaDczMDZkdml1ck9HY3B2VmJSVXhIdHNsbkYwZWNXZUdad2YwOXh6X0lmT2RuZXVhbm1vWmpvekFNdVpOLVFxMTBNZFN3WHBIa3FUVlVRMTE3ZW9pdTJZZ3lKVmkyRkZuVFVEZHhZVjZRQjZQb3pmNWtXS1pXN2YxU1RzYzhGd3I?oc=5", "published": "2026-11-12T11:31:30+09:00", "category": "business", "category_title": "Business"}, {"headline": "FBI Investigation Revealed for Lansing Massage Business", "excerpt": "Federal court documents have unveiled an ongoing FBI investigation into a massage business located in Lansing, Michigan, drawing public attention.", "levels": {"Beginner": {"text": "News reports show that the FBI is looking into a business in Lansing, Michigan. This business is a massage parlor. The information about this investigation comes from official papers filed in a federal court. These court papers tell us that the FBI, which is a big police group for the whole country, is doing an investigation. \n\nWhen the FBI investigates, it means they are trying to find out if any laws were broken. For this Lansing massage business, the court papers confirm that an investigation is happening. We do not know many details about why the FBI is looking into the business yet. \n\nFederal court documents are important because they are public records. This means people can often see them. They help make sure that government actions are open and fair. The community in Lansing might be interested in knowing more as the investigation continues. It is important to remember that an investigation does not mean anyone is guilty, only that officials are looking into something.", "vocab": [{"word": "investigation", "definition": "A careful study or search to find out facts."}, {"word": "business", "definition": "A company or shop that sells things or services."}, {"word": "federal", "definition": "Related to the central government of a country, not just one state."}, {"word": "documents", "definition": "Official papers or records."}, {"word": "community", "definition": "All the people living in one area or town."}]}, "Intermediate": {"text": "Federal court documents have revealed that the FBI is conducting an investigation involving a massage business in Lansing, Michigan. This development signals a formal inquiry by a major federal law enforcement agency into the operations of a local establishment.\n\nThe Federal Bureau of Investigation (FBI) is responsible for investigating violations of federal law across the United States. Their involvement often indicates that the alleged activities could be serious, potentially crossing state lines, or falling under specific federal statutes. While the specific nature of the allegations against the Lansing massage business has not been publicly disclosed, the existence of federal court documents confirms that a significant probe is underway.\n\nCourt documents are crucial because they provide an official record of legal proceedings. Once filed, many of these documents become public information, promoting transparency in the justice system. This allows the public, including local residents and news organizations, to track the progress of cases and understand the actions taken by federal authorities. However, some details might be kept private or 'sealed' temporarily to protect the integrity of an ongoing investigation or sensitive information.\n\nThe Lansing community will likely follow this situation closely. It is important to remember that an investigation is a process of gathering facts and does not imply guilt. The legal system ensures that all individuals and businesses are presumed innocent until proven otherwise through due process. Further details are expected to emerge as the investigation progresses and more information becomes part of the public record.", "vocab": [{"word": "revealed", "definition": "Made known or shown something that was secret or unknown before."}, {"word": "conducting", "definition": "Organizing and carrying out an activity or process."}, {"word": "alleged", "definition": "Stated as a fact but without proof; claimed."}, {"word": "disclosed", "definition": "Made secret or new information known."}, {"word": "transparency", "definition": "The quality of being open, honest, and easy to understand."}, {"word": "integrity", "definition": "The quality of being honest and having strong moral principles; also, the state of being whole and undivided."}]}, "Advanced": {"text": "Federal court documents have brought to light an ongoing FBI investigation centered on a massage business operating in Lansing, Michigan. This disclosure underscores the rigorous oversight exercised by federal agencies and signals a significant legal development for the local community.\n\nThe Federal Bureau of Investigation, as the principal investigative arm of the U.S. Department of Justice, typically intervenes in cases involving violations of federal statutes. These can encompass a broad spectrum of offenses, from financial irregularities and fraud to more serious crimes such as human trafficking or organized crime, though no specific allegations have been publicly articulated in connection with this Lansing establishment. The FBI's involvement suggests that the scope of the inquiry extends beyond local jurisdictional boundaries or involves complexities that necessitate federal resources and expertise.\n\nThe emergence of this information via federal court filings highlights the fundamental principle of judicial transparency. Once documents are submitted to a federal court, they generally become part of the public record, allowing for public scrutiny of legal proceedings. This mechanism is crucial for maintaining accountability within the justice system and informing the citizenry. However, it is common practice for certain sensitive details to be redacted or for entire filings to be temporarily sealed by court order to safeguard the integrity of an ongoing investigation, protect confidential informants, or prevent the premature disclosure of evidence.\n\nFor the Lansing community, this development signifies a formal federal inquiry into a local business's operations. While the existence of an investigation does not equate to an indictment or a finding of guilt, it does confirm that federal authorities perceive sufficient grounds to pursue a detailed examination. Businesses subject to such scrutiny often face considerable operational and reputational challenges. As the legal process unfolds, further details regarding the nature and scope of the investigation are anticipated to enter the public domain, providing greater clarity on the federal government's concerns and potential legal actions.", "vocab": [{"word": "disclosure", "definition": "The action of making new or secret information known."}, {"word": "underscores", "definition": "Emphasizes the importance of something."}, {"word": "principal", "definition": "Most important, main, or primary."}, {"word": "encompass", "definition": "Include a wide range of things."}, {"word": "articulated", "definition": "Expressed or stated clearly and distinctly."}, {"word": "jurisdictional", "definition": "Relating to the official power to make legal decisions and judgments."}, {"word": "scrutiny", "definition": "Critical observation or examination."}, {"word": "reputational", "definition": "Relating to the beliefs or opinions that are generally held about someone or something."}]}}, "questions": [{"q": "What federal agency is conducting the investigation?", "a": "The FBI (Federal Bureau of Investigation)."}, {"q": "What type of business is involved in the investigation?", "a": "A massage business."}], "id": "a43f629e9d7", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitwFBVV95cUxOTUZwa1owbU1uYWl6eXpzWXAyUDlZTk5keXhCM1BIQkNlaHVFWmZGbUFDN29hNjVWZGFicXNwZDVlamR1U0dDQVZzZGkzUmZtUXJ1ZlUxWU81NlhSUDYzWDVkaVFqbF9lN3JyWFU4TkFlelZEaUZBc2N1dllleHphenFreXlSUV9PMFFxUmRkbTFVSXV0WEgyM3NEekpFN19QcjFHOF9lR0FKSlN4cGdIVllmbWJ2U3M?oc=5", "published": "2026-11-12T11:24:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Gold Price Falls as Traders Watch Inflation and Fed Decisions", "excerpt": "Gold prices have dropped below US$4,000, as investors closely monitor rising inflation and upcoming decisions from the US Federal Reserve.", "levels": {"Beginner": {"text": "The price of gold has gone down. It is now below US$4,000. People who buy and sell gold, called traders, are watching two main things. First, they are looking at inflation. Inflation means that prices for goods and services are going up. This makes money worth a little less. Second, traders are listening to what the Federal Reserve says. The Federal Reserve, or 'the Fed,' is like the main bank for the United States. It helps control the economy.\n\nWhen inflation is high, people sometimes buy gold because they think it is a safe place for their money. Gold can keep its value better than regular money during these times. But the Fed can change interest rates. If the Fed raises interest rates, it can make other investments, like savings accounts, look more attractive. This means people might sell gold to put their money into other things that now offer a better return. This is why gold prices are falling right now, as traders try to understand what the Fed will do next and how inflation will change.", "vocab": [{"word": "traders", "definition": "People who buy and sell things like gold or stocks."}, {"word": "inflation", "definition": "When prices for things go up, and your money buys less."}, {"word": "Federal Reserve", "definition": "The main bank in the U.S. that helps manage the economy."}, {"word": "economy", "definition": "How a country makes and uses money and goods."}, {"word": "interest rates", "definition": "The extra money you pay to borrow money, or earn when you save money."}]}, "Intermediate": {"text": "The price of gold has recently fallen below the US$4,000 mark. This decline is largely due to financial traders carefully evaluating two significant economic factors: persistent inflation and anticipated policy decisions from the U.S. Federal Reserve.\n\nInflation, which is the general increase in prices and fall in the purchasing value of money, typically makes gold an attractive investment. Investors often view gold as a 'safe haven' asset, meaning its value tends to hold up or even increase when the economy is uncertain or when the value of currency is eroding due to inflation. However, the actions of the Federal Reserve, the central bank of the United States, play a crucial role in influencing gold's appeal.\n\nThe Fed's primary tools to combat inflation include raising interest rates. When interest rates rise, it makes other investments, such as government bonds or high-yield savings accounts, more appealing because they offer better returns. This increases the 'opportunity cost' of holding gold, which does not pay interest or dividends. As traders assess the likelihood of the Fed continuing to raise rates to cool down the economy and bring inflation under control, they may choose to sell their gold holdings in favor of these interest-bearing assets. This shift in investor sentiment and capital allocation directly contributes to the downward pressure on gold prices, reflecting the market's expectation of future monetary policy.", "vocab": [{"word": "decline", "definition": "A decrease or fall in amount or value."}, {"word": "persistent", "definition": "Continuing to exist or occur for a long time."}, {"word": "anticipated", "definition": "Expected or looked forward to."}, {"word": "safe haven", "definition": "An investment that is considered safe during times of economic uncertainty."}, {"word": "eroding", "definition": "Gradually wearing away or decreasing in value."}, {"word": "opportunity cost", "definition": "The value of the next best alternative that was not taken when a decision was made."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit."}]}, "Advanced": {"text": "The precious metal gold has experienced a notable dip, with its price falling below the significant US$4,000 threshold. This market movement is largely attributable to the intricate interplay of investor sentiment, persistent inflationary pressures, and the hawkish stance of the U.S. Federal Reserve, as traders meticulously evaluate the broader economic landscape.\n\nHistorically, gold has served as a quintessential safe-haven asset, often appreciating in value during periods of economic instability or when the purchasing power of fiat currencies is eroded by inflation. Its appeal stems from its tangible nature and perceived intrinsic value, offering a hedge against currency debasement. However, the current economic environment presents a nuanced challenge to this traditional dynamic. While inflation remains elevated, prompting some to seek refuge in gold, the aggressive monetary tightening by the Federal Reserve is exerting counteracting forces.\n\nThe Federal Reserve, in its mandate to achieve price stability, has been systematically raising benchmark interest rates. Higher interest rates increase the yield on alternative, interest-bearing assets such as Treasury bonds and high-yield savings accounts. This creates a significant opportunity cost for holding non-yielding assets like gold. As the real returns on fixed-income investments become more attractive, the relative appeal of gold diminishes. Traders are keenly observing the Fed's rhetoric and economic data for clues regarding the trajectory of future rate hikes, which directly influences their asset allocation strategies.\n\nFurthermore, a stronger U.S. dollar, often a byproduct of rising interest rates, can also weigh on gold prices. Gold is typically priced in dollars, so a stronger dollar makes gold more expensive for holders of other currencies, potentially dampening demand. The confluence of these factors – the Fed's commitment to reining in inflation through rate hikes, the subsequent increase in opportunity cost for gold, and a strengthening dollar – collectively contributes to the downward pressure observed in the gold market. Investors are recalibrating their portfolios in anticipation of continued monetary policy adjustments, leading to the recent price depreciation.", "vocab": [{"word": "attributable", "definition": "Capable of being assigned as a cause or source."}, {"word": "intricate interplay", "definition": "A complex interaction or relationship between different elements."}, {"word": "hawkish stance", "definition": "An aggressive or firm position, especially regarding monetary policy, often favoring higher interest rates to control inflation."}, {"word": "meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "quintessential", "definition": "Representing the most perfect or typical example of a quality or class."}, {"word": "fiat currencies", "definition": "Currency that a government has declared to be legal tender, but is not backed by a physical commodity like gold."}, {"word": "monetary tightening", "definition": "Actions by a central bank to reduce the money supply and credit, typically by raising interest rates, to curb inflation."}, {"word": "recalibrating", "definition": "Adjusting or resetting something to account for new information or conditions."}]}}, "questions": [{"q": "What two main factors are traders assessing that are causing gold prices to fall?", "a": "Traders are assessing inflation and remarks/decisions from the Federal Reserve."}, {"q": "Why might higher interest rates make gold less attractive to investors?", "a": "Higher interest rates make other investments, like bonds or savings accounts, more appealing because they offer better returns, increasing the 'opportunity cost' of holding gold which does not pay interest."}], "id": "a9e4adddbf0", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiygFBVV95cUxQZHN5cmE3QXBHV2ZlMU81cVQ3LW1OMkVRdWpUcXU1cmJ4amZXTGFoWnZsUFJmYzZ6bllzWEhyNWx0NlEzOGF4WVZMM0VDLVU0enpBYWVNMlNkZkdjbXhNS2FwRkdqeDNGTThLSGJyeDdCTm9qR3lFeVdyUG41b0lEMUpyTFFSbW9xVjdHOFZCMVdWLVpnOGhOZTVVTVQwMnB1NW9selN3Q01UdnFJNlZaQVRDNkJVdWVSdjdoYXNsM185R0JLOHdQU0xn?oc=5", "published": "2026-11-12T11:04:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "China's Central Bank Pledges Economic Support, Boosts Domestic Demand", "excerpt": "China's central bank announced plans to strengthen economic adjustments and encourage more spending within the country to support growth.", "levels": {"Beginner": {"text": "China's main bank, called the central bank, has made an important promise. It vows to take action to help the country's economy. The bank wants to make sure the economy stays strong and grows steadily. One big goal is to boost domestic demand. This means encouraging people and businesses inside China to buy more goods and services. When people buy more, businesses make more money, and the economy gets stronger.\n\nThe central bank will use special tools to help. These tools are part of what is called \"counter-cyclical adjustment.\" This is a way to smooth out the economy. If the economy is slowing down, the bank can make it easier to borrow money, which helps businesses and people spend more. If the economy is growing too fast, the bank can slow it down a little to keep things stable. By boosting domestic demand and using these tools, China's central bank aims to support healthy economic growth for the country.", "vocab": [{"word": "Central bank", "definition": "The main bank of a country that manages money and helps the economy."}, {"word": "Vows", "definition": "Promises strongly to do something."}, {"word": "Economy", "definition": "How a country makes, uses, and shares money and goods."}, {"word": "Boost", "definition": "To make something bigger, better, or stronger."}, {"word": "Demand", "definition": "The desire of people to buy goods and services."}, {"word": "Support", "definition": "To help something succeed or continue."}]}, "Intermediate": {"text": "China's central bank, the People's Bank of China (PBOC), has announced a strong commitment to bolstering the nation's economic stability and growth. The PBOC vows to step up its counter-cyclical adjustment efforts and significantly boost domestic demand. These measures are crucial for ensuring a more balanced and resilient economic recovery.\n\nCounter-cyclical adjustment refers to the actions taken by a central bank to smooth out the ups and downs of the economic cycle. When the economy faces a slowdown, the PBOC can implement policies like lowering interest rates or increasing the money supply to stimulate economic activity. Conversely, if the economy overheats, it can tighten monetary policy to prevent inflation.\n\nBoosting domestic demand means encouraging consumers and businesses within China to spend more. This is vital for several reasons. A strong domestic market helps reduce the economy's reliance on exports, making it less vulnerable to global economic shocks. It also fosters a more sustainable growth model, driven by internal consumption and investment. In the current climate, with global uncertainties and some domestic challenges, enhancing consumer confidence and spending is a key priority for policymakers.\n\nThe PBOC's pledge signals its readiness to deploy various monetary policy tools to achieve these goals, aiming to maintain a stable financial environment and support the ongoing economic recovery following recent global and domestic pressures.", "vocab": [{"word": "Monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit in an economy."}, {"word": "Counter-cyclical adjustment", "definition": "Economic policies designed to smooth out fluctuations in the business cycle, such as stimulating growth during a downturn."}, {"word": "Domestic demand", "definition": "The total spending by households and businesses within a country on goods and services."}, {"word": "Stimulate", "definition": "To encourage something to grow, develop, or become more active."}, {"word": "Recovery", "definition": "The process of returning to a normal or improved state after a difficult period, especially in an economy."}, {"word": "Consumer confidence", "definition": "How optimistic consumers feel about the state of the economy and their own financial situation, influencing their spending habits."}, {"word": "Vulnerable", "definition": "Exposed to the possibility of being attacked or harmed, either physically or emotionally."}]}, "Advanced": {"text": "China's central bank, the People's Bank of China (PBOC), has issued a resolute commitment to fortifying the nation's economic resilience and fostering sustained growth. The PBOC has vowed to significantly strengthen its counter-cyclical adjustment framework and redouble efforts to bolster domestic demand, signaling a proactive stance amidst evolving economic dynamics.\n\nCounter-cyclical adjustment involves the strategic deployment of monetary policy tools to mitigate the severity of economic fluctuations. During periods of economic deceleration, the PBOC can ease monetary conditions through measures such as reducing benchmark interest rates, lowering reserve requirement ratios for banks, or injecting liquidity via open market operations. Conversely, to temper inflationary pressures or asset bubbles during an overheating economy, it can adopt a more restrictive stance. This proactive management aims to ensure a smoother economic trajectory, preventing sharp downturns or unsustainable booms.\n\nElevating domestic demand is paramount for China's long-term economic rebalancing and stability. A robust internal market reduces the economy's susceptibility to external shocks, such as shifts in global trade or geopolitical tensions. It also underpins a more sustainable growth paradigm, transitioning from an export and investment-led model to one driven by consumption and indigenous innovation. In the wake of recent global economic headwinds and specific domestic challenges, including property sector deleveraging and fluctuating consumer sentiment, stimulating internal consumption and investment is a critical policy imperative.\n\nThe PBOC's pledge underscores its readiness to utilize its comprehensive monetary policy toolkit to navigate these complexities. This includes not only conventional instruments but potentially also targeted lending facilities designed to support specific sectors or small and medium-sized enterprises. The central bank aims to maintain a prudent monetary stance, ensuring ample liquidity while addressing structural impediments to growth and managing financial risks. By strategically enhancing counter-cyclical measures and invigorating domestic spending, China's central bank seeks to anchor economic expectations and cultivate a more stable and prosperous economic future.", "vocab": [{"word": "Counter-cyclical adjustment", "definition": "Deliberate policy actions, typically by a central bank, designed to smooth out economic fluctuations and mitigate the severity of business cycles."}, {"word": "Domestic demand", "definition": "The total spending by households and firms within a country on goods and services, a key driver of internal economic growth."}, {"word": "Monetary policy toolkit", "definition": "The full range of instruments and strategies a central bank employs to manage the money supply, credit conditions, and interest rates in an economy."}, {"word": "Economic headwinds", "definition": "Factors or forces that hinder economic growth or make it more difficult, often originating from external or systemic challenges."}, {"word": "Deleveraging", "definition": "The process of reducing the amount of debt, typically by paying off existing debts or selling assets to reduce liabilities."}, {"word": "Structural impediments", "definition": "Fundamental, often long-standing, problems or barriers within an economic system that hinder its efficient functioning or growth."}, {"word": "Prudent", "definition": "Acting with careful consideration for the future; exercising good judgment and caution, especially in financial matters."}, {"word": "Sustained", "definition": "Continuing for an extended period without interruption or weakening; maintained at a certain level."}]}}, "questions": [{"q": "What two main actions did China's central bank promise to take?", "a": "China's central bank promised to step up counter-cyclical adjustment and boost domestic demand."}, {"q": "Why is boosting domestic demand important for China's economy?", "a": "Boosting domestic demand helps reduce the economy's reliance on exports, makes it less vulnerable to global shocks, and fosters a more sustainable growth model driven by internal consumption and investment."}], "id": "a9997008222", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMifEFVX3lxTE5iSFo1LWlBUzRRUlQyVHpTYXlOSzJwOXhXMHRJUkV2OHpfRWJtOEVuTTMyZTdVMldXaDZCSFpRMFJCNXh1VWZRR2NYYjlYUzBYaU9ESXF5TzFZZUdDZVpGbUI4czdyZHRKU1VlQUVtSXJ3eF9CMnpZbFUtRHY?oc=5", "published": "2026-11-12T10:12:17+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Brooklyn Building Collapse Kills One, Injures Twelve", "excerpt": "A three-story building in Brooklyn, New York, collapsed, leading to one fatality and leaving twelve people injured, with search efforts ongoing.", "levels": {"Beginner": {"text": "A building in Brooklyn, New York, fell down. It was a three-story building. This sad event happened recently. One person died because of the collapse. Also, twelve other people got hurt. Emergency workers, like firefighters, quickly came to the place. They are looking for more people. Some people might be stuck under the fallen parts of the building. These parts are called rubble. Rescuers are working hard to find anyone still trapped. They use special tools and dogs to help them search. The area around the building is now closed. It is important to keep everyone safe while the search continues. People in the neighborhood are sad and worried. The cause of why the building fell is not known yet. Officials will investigate to find out what happened. Building safety is very important to prevent such accidents.", "vocab": [{"word": "collapsed", "definition": "fell down suddenly"}, {"word": "injured", "definition": "hurt physically"}, {"word": "rescuers", "definition": "people who save others from danger"}, {"word": "trapped", "definition": "stuck in a place and unable to move"}, {"word": "rubble", "definition": "broken pieces of stone, brick, etc., from a building that has fallen down"}, {"word": "investigate", "definition": "to try to find out the facts about something"}]}, "Intermediate": {"text": "A three-story building in Brooklyn, New York, tragically collapsed, resulting in one confirmed fatality and injuries to twelve other individuals. The incident occurred recently, prompting a large-scale emergency response from city authorities. Firefighters and other emergency services rushed to the scene in the Brooklyn neighborhood, where they immediately began search and rescue operations. Rescuers are actively sifting through the extensive rubble, which consists of broken concrete, wood, and other debris, in hopes of finding anyone who might still be trapped underneath. Specialized equipment, including heavy machinery and trained K9 units, are being utilized to aid in the meticulous search efforts. The area surrounding the collapsed structure has been secured, and residents have been advised to avoid the vicinity to ensure safety and allow emergency personnel to work without hindrance. The injured individuals were transported to local hospitals for treatment, with the severity of their conditions currently unknown. This devastating event has raised concerns within the community regarding building safety and maintenance standards. Authorities have stated that an investigation will be launched to determine the exact cause of the collapse. Such inquiries typically examine factors like structural integrity, age of the building, and any recent construction work or modifications. The immediate focus, however, remains on the critical task of locating any potential survivors.", "vocab": [{"word": "tragically", "definition": "in a way that involves great sadness or suffering"}, {"word": "fatality", "definition": "a death caused by an accident or disaster"}, {"word": "prompting", "definition": "causing or bringing about an action or feeling"}, {"word": "extensive", "definition": "covering a large area; great in amount"}, {"word": "debris", "definition": "scattered pieces of waste or remains"}, {"word": "vicinity", "definition": "the area near or surrounding a particular place"}, {"word": "structural integrity", "definition": "the ability of a structure to withstand a load without breaking"}]}, "Advanced": {"text": "A devastating incident unfolded in Brooklyn, New York, as a three-story building suffered a catastrophic collapse, claiming one life and leaving a dozen individuals injured. The sudden structural failure prompted an immediate and extensive emergency response, transforming the quiet neighborhood into a bustling scene of urgent rescue operations. Fire Department of New York (FDNY) personnel, alongside other emergency services, converged on the site, deploying specialized search and rescue teams. These teams are meticulously sifting through the immense volume of concrete, twisted metal, and splintered wood that constitutes the rubble, employing advanced acoustic sensors and highly trained K9 units in their desperate efforts to locate any potential survivors still trapped beneath the wreckage. The scale of the operation underscores the inherent dangers and complexities involved in urban search and rescue. The injured, whose conditions range from minor to potentially serious, were swiftly transported to nearby medical facilities for urgent care. The incident has sent shockwaves through the community, reigniting critical discussions about infrastructure resilience and the stringent enforcement of building codes. While the immediate priority remains the humanitarian effort, authorities have confirmed that a comprehensive investigation will be initiated to ascertain the precise cause of the collapse. This inquiry will likely delve into various factors, including the building's age, its maintenance history, any recent renovations or modifications, the integrity of its foundational elements, and compliance with local construction regulations. Such investigations are crucial for preventing future tragedies and ensuring public safety in densely populated urban environments. The emotional toll on residents and first responders is palpable, as the community grapples with the sudden loss and the uncertainty surrounding the fate of those still unaccounted for. The painstaking work of recovery and investigation is expected to continue for an extended period, providing a somber reminder of the vulnerabilities inherent in urban development.", "vocab": [{"word": "catastrophic", "definition": "involving or causing sudden great damage or suffering"}, {"word": "structural failure", "definition": "the loss of load-carrying capacity of a component or member within a structure or of the structure itself"}, {"word": "converged", "definition": "came together from different directions so as to meet"}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely"}, {"word": "ascertain", "definition": "find something out for certain; make sure of"}, {"word": "stringent", "definition": "(of regulations, requirements, or conditions) strict, precise, and exacting"}, {"word": "resilience", "definition": "the capacity to recover quickly from difficulties; toughness"}, {"word": "palpable", "definition": "(of a feeling or atmosphere) so intense as to be almost touched or felt"}]}}, "questions": [{"q": "How many people were injured in the building collapse?", "a": "Twelve people were injured in the building collapse."}, {"q": "What are rescuers doing at the site of the collapsed building?", "a": "Rescuers are searching for people who may be trapped under the rubble of the collapsed building."}], "id": "ac8a7bae6f4", "source": "BBC News", "link": "https://www.bbc.co.uk/news/videos/c60rkwjj7x7go?at_medium=RSS&at_campaign=rss", "published": "2026-11-12T11:33:12+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Trump Administration Eyes Sale of Public Lands, Shrinking Federal Estate", "excerpt": "The Trump administration aims to sell public lands, potentially shrinking the federal estate and sparking debate over environmental protection and public access.", "levels": {"Beginner": {"text": "The Trump administration wants to sell some land that belongs to the government. This land is called \"public land.\" Public land is for everyone to use, like national parks and forests. People go there to hike, camp, and enjoy nature. It is a big part of the country's natural beauty.\n\nThe administration wants to sell this land to make the government smaller. They also think selling it could help the economy by allowing new businesses or homes. But many people are worried. They believe these lands should stay public. They want to protect nature and keep places open for people to visit and enjoy for many years.\n\nSelling public land means less space for animals and plants to live safely. It also means fewer places for people to enjoy outside activities. This idea is a big topic of discussion in the country. Some people agree with selling the land, saying it helps reduce government costs. Others strongly disagree, arguing it harms the environment and public access. It's about what is best for the country's future and its natural places.", "vocab": [{"word": "administration", "definition": "the group of people who manage a country or organization."}, {"word": "public land", "definition": "land owned by the government for everyone to use."}, {"word": "forests", "definition": "large areas of land covered with trees."}, {"word": "economy", "definition": "the system by which a country's money and goods are produced and used."}, {"word": "protect", "definition": "to keep safe from harm or damage."}, {"word": "access", "definition": "the right or opportunity to use or see something."}]}, "Intermediate": {"text": "The Trump administration has expressed interest in selling off portions of the vast federal estate, a move that would significantly reduce the amount of land owned by the U.S. government. This proposal involves divesting what are known as \"public lands,\" which include national parks, national forests, and other federally managed areas that are accessible to citizens for recreation, conservation, and resource use across the country. These lands represent a significant portion of the American landscape, from deserts to mountains.\n\nProponents of selling these lands often argue that it could help reduce the national debt, stimulate local economies through resource extraction, agriculture, or development, and return control to state or private entities. They suggest that the federal government manages too much land inefficiently and that private ownership could lead to more productive use, fostering economic growth in rural areas. This approach aligns with a philosophy of smaller government and less federal oversight.\n\nHowever, this idea faces strong opposition from environmental groups, conservationists, and many members of the public. Opponents argue that public lands are vital for preserving biodiversity, protecting natural habitats, and providing essential recreational opportunities like hiking, camping, and hunting for millions of Americans. They fear that selling these lands could lead to irreversible environmental damage, limit public access to cherished natural spaces, and prioritize short-term economic gains over long-term ecological and public benefits. Many also point to the historical importance of these lands for indigenous communities.\n\nThe debate over the future of federal lands is a long-standing one in American politics, often pitting development interests against conservation efforts. The Trump administration's proposal reignites this discussion, highlighting differing views on the role of government in land ownership and management, and the delicate balance between economic growth and environmental stewardship. The outcome of such proposals could have lasting impacts on the nation's natural heritage.", "vocab": [{"word": "federal estate", "definition": "all the land owned by the national government."}, {"word": "divesting", "definition": "selling off assets, often to reduce size or focus on core activities."}, {"word": "proponents", "definition": "people who support an idea or plan."}, {"word": "stimulate", "definition": "to encourage something to grow, develop, or become active."}, {"word": "conservationists", "definition": "people who advocate for the protection of animals, plants, and natural resources."}, {"word": "biodiversity", "definition": "the variety of life in the world or in a particular habitat."}, {"word": "stewardship", "definition": "the careful and responsible management of something entrusted to one's care."}]}, "Advanced": {"text": "The Trump administration has signaled a clear intent to pursue policies aimed at significantly shrinking the federal estate, a move that would entail the divestiture of substantial tracts of public lands across the United States. This initiative, articulated by various administration officials, aligns with a broader philosophy advocating for reduced federal land ownership and management, potentially transferring control to state governments or private entities. The federal estate encompasses a vast array of landscapes, from national parks and forests to wildlife refuges and lands managed by the Bureau of Land Management (BLM), all currently held in trust for the American public.\n\nHistorically, the United States has grappled with the question of federal land ownership since its inception. While early policies often encouraged westward expansion and private settlement, the late 19th and early 20th centuries saw the establishment of national parks and forests, driven by conservation movements and a recognition of the intrinsic value of natural resources and scenic beauty. Today, these lands provide critical habitats for countless species, offer unparalleled recreational opportunities, and serve as vital sources of clean water and other natural resources.\n\nAdvocates for divesting federal lands often articulate a rationale rooted in economic efficiency, fiscal responsibility, and local control. They contend that federal management is often bureaucratic and inefficient, leading to underutilized resources and missed economic opportunities. Arguments frequently include the potential to reduce the national debt through land sales, stimulate local economies through increased resource extraction (e.g., logging, mining, energy development), and empower states and local communities to make decisions more attuned to regional needs. This perspective often emphasizes the idea that private ownership or state control could foster greater accountability and more productive land use.\n\nConversely, the proposal faces vehement opposition from a broad coalition of environmental organizations, conservation groups, outdoor recreation enthusiasts, and indigenous communities. Critics argue that such divestitures would jeopardize irreplaceable natural ecosystems, threaten endangered species, and undermine the public's long-standing right to access these cherished spaces. They highlight the federal government's unique capacity and mandate to manage large, interconnected ecosystems and protect resources that transcend state boundaries. Concerns are also raised about the potential for fragmentation of habitats, increased pollution from unchecked development, and the prioritization of short-term commercial interests over long-term ecological integrity and public welfare. Many also point to the historical and cultural significance of these lands, particularly for Native American tribes.\n\nThe debate underscores a fundamental philosophical divergence regarding the purpose and stewardship of public lands. It pits economic development and property rights against environmental protection and public trust. The Trump administration's renewed emphasis on this agenda ensures that the future of America's natural heritage will remain a contentious and pivotal issue in national policy discussions, with profound implications for the environment, economy, and the character of the nation.", "vocab": [{"word": "entail", "definition": "to involve something as a necessary or inevitable part or consequence."}, {"word": "divestiture", "definition": "the action or process of selling off subsidiary business interests or investments."}, {"word": "encompasses", "definition": "surrounds and has or holds within it."}, {"word": "intrinsic", "definition": "belonging naturally; essential."}, {"word": "articulate", "definition": "to express (an idea or feeling) fluently and coherently."}, {"word": "vehement", "definition": "showing strong feeling; forceful, passionate, or intense."}, {"word": "jeopardize", "definition": "to put (someone or something) into a situation in which there is a danger of loss, harm, or failure."}, {"word": "philosophical divergence", "definition": "a difference in fundamental beliefs or principles."}]}}, "questions": [{"q": "What is the main proposal of the Trump administration regarding public lands?", "a": "The Trump administration proposes selling public lands and shrinking the federal estate."}, {"q": "According to the articles, what are two main reasons given by opponents for *not* selling public lands?", "a": "Opponents argue that selling public lands could lead to environmental damage, limit public access, jeopardize natural habitats and biodiversity, or prioritize short-term economic gains over long-term ecological and public benefits."}], "id": "a52c0059eee", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi0gFBVV95cUxPZ1JrYWhyanhpUU9XTVZWVnBLQ3V2NU1KMlJNVGRJaExwYzhIMjgwYmlrNDhWbVBPTGhWbHA4QVJTUFdJSVphdjdmYUk1ejVMY2lLc3ZOUEJrN1FBVTVIXzBwazlvRk1iektBRzZ1eG9GWHBEWFNqdENKUkhnRElJNnJHNVdoUzBkNlBiblZJcW5pc2pCdU9sRTE4TWJjT3phc0ZBNFNIelFvNjNpR3IxNUxOMXlJUGsyRWczR1NNdExwZkxTV18zMFd1eEZiV280TXc?oc=5", "published": "2026-11-12T11:21:34+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Bull Dogs Athletes Earn Top State and Conference Honors", "excerpt": "Bull Dogs athletes received prestigious All-State, All-District, and All-HHC awards, recognizing their outstanding performance in high school sports.", "levels": {"Beginner": {"text": "The Bull Dogs, a local high school sports team, have received great news. Some of their players were chosen for special awards. These awards show that the players are very good at their sports.\n\nA few Bull Dogs players were named \"All-State.\" This means they are among the best athletes in the whole state. It is a big honor to be picked for All-State.\n\nOther players from the Bull Dogs team also got important awards. They were named \"All-District\" and \"All-HHC.\" \"All-District\" means they are top players in their local area. \"All-HHC\" means they are top players in their sports league, called the Hoosier Heritage Conference.\n\nThese awards are given to high school athletes who play very well. They show that the Bull Dogs team has many talented players. It also shows that the players worked hard and practiced a lot.\n\nGetting these awards makes the school and the community proud. It helps the players feel good about their efforts. It also lets everyone know that the Bull Dogs have a strong sports program. This news is a happy moment for the team and their supporters.", "vocab": [{"word": "All-State", "definition": "Chosen as one of the best players in the whole state."}, {"word": "All-District", "definition": "Chosen as one of the best players in a local area or region."}, {"word": "All-HHC", "definition": "Chosen as one of the best players in the Hoosier Heritage Conference (a sports league)."}, {"word": "honor", "definition": "A special award or recognition that shows respect."}, {"word": "talented", "definition": "Having a natural ability to do something well."}, {"word": "community", "definition": "The people living in one particular area or town."}]}, "Intermediate": {"text": "The local high school athletic program, known as the Bull Dogs, is celebrating significant achievements as several of its athletes have earned prestigious individual honors. These accolades highlight the exceptional talent and dedication within the team across various prep sports.\n\nA select group of Bull Dogs players has been named \"All-State,\" a highly coveted distinction in high school athletics. This recognition means these athletes are considered among the elite performers across the entire state in their respective sports. Selection for All-State typically involves a rigorous evaluation process by coaches and sports journalists, based on statistical performance, leadership, and overall impact on their team's success throughout the season.\n\nIn addition to the statewide honors, numerous other Bull Dogs athletes have been recognized at the regional and conference levels. They have been named \"All-District\" and \"All-HHC.\" \"All-District\" signifies their status as top players within a specific geographic district, showcasing their dominance against local competition. \"All-HHC\" refers to the Hoosier Heritage Conference, a competitive athletic league. Being named All-HHC indicates that these players stood out as leading contributors within their conference, demonstrating superior skill and performance.\n\nThese awards are more than just trophies; they represent the culmination of countless hours of practice, discipline, and teamwork. For the athletes, such recognition can be a significant boost to their morale and a valuable addition to their athletic resumes, potentially opening doors for collegiate recruitment and scholarship opportunities. For the Bull Dogs program, these honors underscore its reputation as a strong and successful athletic institution, fostering both individual excellence and collective achievement. The community takes immense pride in these young athletes' accomplishments, which serve as an inspiration for future generations.", "vocab": [{"word": "achievements", "definition": "Things done successfully, usually after a lot of effort."}, {"word": "prestigious", "definition": "Respected and admired as important or of high quality."}, {"word": "coveted", "definition": "Greatly desired or wished for."}, {"word": "elite", "definition": "A select group that is superior in terms of ability or qualities to the rest of a group or society."}, {"word": "rigorous", "definition": "Extremely thorough, careful, and strict."}, {"word": "culmination", "definition": "The highest or climactic point of something, especially as attained after a long time."}, {"word": "collegiate recruitment", "definition": "The process by which colleges and universities seek to enroll student-athletes."}]}, "Advanced": {"text": "The Bull Dogs athletic program, a cornerstone of local high school sports, is currently basking in the glow of significant individual distinctions, with multiple athletes earning coveted All-State, All-District, and All-HHC commendations. These accolades not only celebrate exceptional individual prowess but also underscore the depth of talent and the robust competitive spirit fostered within the school's various teams.\n\nThe designation of \"All-State\" represents the pinnacle of high school athletic achievement, placing these Bull Dogs athletes among the most formidable competitors across the entire state in their respective disciplines. Selection for this elite tier is a rigorous process, typically involving nominations from opposing coaches, statistical validation, and critical assessment by sports media panels. It signifies not just outstanding individual performance but often a transformative impact on team dynamics and overall seasonal success. For many young athletes, an All-State nod is a crucial stepping stone, significantly enhancing their profile for collegiate recruitment and potential athletic scholarships, charting a clearer trajectory toward higher-level competition.\n\nBeyond the statewide recognition, a substantial contingent of Bull Dogs players has also garnered \"All-District\" and \"All-HHC\" honors. \"All-District\" status acknowledges their superior performance within a defined geographical region, highlighting their dominance over local rivals. The \"All-HHC\" distinction, referring to the highly competitive Hoosier Heritage Conference, is particularly noteworthy. This conference is renowned for its strong athletic programs, and earning a spot on the All-HHC team is a testament to an athlete's consistent excellence and leadership within a challenging league environment. Such conference-level awards are vital for recognizing the consistent effort and skill required to excel week in and week out against formidable opponents.\n\nThese collective and individual honors reflect a sustained commitment to excellence within the Bull Dogs program, from dedicated coaching staff to the unwavering support of the school and community. They serve as a powerful affirmation of the athletes' relentless dedication, discipline, and the countless hours invested in training and competition. Moreover, these achievements extend beyond personal glory, fostering a sense of collective pride and inspiring younger students to pursue athletic and academic excellence. The consistent stream of such high-level recognition solidifies the Bull Dogs' reputation as an unparalleled force in prep sports, contributing significantly to the vibrant local sports culture and providing invaluable developmental experiences for its student-athletes.", "vocab": [{"word": "basking", "definition": "Enjoying or taking pleasure in something, often warmth or praise."}, {"word": "distinctions", "definition": "Marks of honor or recognition for excellence or superior achievement."}, {"word": "pinnacle", "definition": "The most successful point; the highest or climactic point of something."}, {"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "trajectory", "definition": "The path or course that something takes over time; a path of development or progress."}, {"word": "contingent", "definition": "A group of people united by some common feature, forming part of a larger group."}, {"word": "renowned", "definition": "Known or talked about by many people; famous for a particular skill, achievement, or quality."}, {"word": "unparalleled", "definition": "Having no equal or parallel; exceptional or unprecedented."}]}}, "questions": [{"q": "What are the three main types of awards mentioned in the article that Bull Dogs athletes received?", "a": "The three main types of awards mentioned are All-State, All-District, and All-HHC."}, {"q": "According to the article, what is one significant benefit for athletes who receive \"All-State\" recognition?", "a": "One significant benefit for athletes receiving \"All-State\" re   const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
