nner": {"text": "‘Behemoth!’ Review: Pedro Pascal Is a Classical Cellist Skating Through a Midlife Crisis in Tony Gilroy’s Elevated Bauble of a Music Drama Variety", "vocab": []}, "Intermediate": {"text": "‘Behemoth!’ Review: Pedro Pascal Is a Classical Cellist Skating Through a Midlife Crisis in Tony Gilroy’s Elevated Bauble of a Music Drama Variety", "vocab": []}, "Advanced": {"text": "‘Behemoth!’ Review: Pedro Pascal Is a Classical Cellist Skating Through a Midlife Crisis in Tony Gilroy’s Elevated Bauble of a Music Drama Variety", "vocab": []}}, "questions": [], "id": "a355defe38b", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxPRENvY3lickVEbUZwc2NIbkhPd3VGNVd3TFE4S0YzR3VvUnZVMG9MNmRIcHBhU3JFbHk2WTJkbHExRnN6LTdSYk9EX0lwR1dvbmZ2LU5WM25MZUMyZGxnQ1JKRFAyeF9nTG8xbUEwd25iWjBuQk5IcjM2a1dhajFVcjU1S1ZJeDI1ZFVzeDZaVWdvUlJE?oc=5", "published": "2026-10-03T09:00:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Chicago Businesses Thrive Amid White Sox Postseason Buzz", "excerpt": "Local businesses in Chicago are experiencing a significant boost thanks to the excitement surrounding the White Sox's strong postseason performance.", "levels": {"Beginner": {"text": "The Chicago White Sox baseball team is playing very well. They are in the \"postseason,\" which means they are playing important games to win a championship. This makes many fans very happy and excited.\n\nBecause of this excitement, businesses in Chicago are doing very well. This is called \"booming business.\" When the White Sox play in the postseason, more people want to celebrate.\n\nFans buy many things. They buy White Sox shirts, hats, and other team merchandise. They also go to games and buy tickets. At the stadium, they buy food and drinks. Bars and restaurants near the stadium also get more customers.\n\nThis means shops selling team gear are busy. Places to eat and drink are also busy. Even businesses that help people get to the games might see more customers. The White Sox's good performance is helping many local companies make more money. It's a happy time for fans and businesses in Chicago.", "vocab": [{"word": "postseason", "definition": "Important games played after the regular season to decide a champion."}, {"word": "championship", "definition": "A big competition to find the best team."}, {"word": "excitement", "definition": "A feeling of being very happy and interested."}, {"word": "booming business", "definition": "When companies are making a lot of money and doing very well."}, {"word": "merchandise", "definition": "Items like shirts and hats with a team's logo or name."}, {"word": "customers", "definition": "People who buy things or services from a store or business."}]}, "Intermediate": {"text": "The city of Chicago is buzzing with energy as the White Sox baseball team advances through the postseason. This period of high-stakes games, where teams compete for the ultimate championship, has ignited significant enthusiasm among fans across the region. This wave of excitement is not only filling stadiums but also creating a substantial economic boost for local businesses.\n\nAccording to reports, businesses in Chicago are experiencing a \"boom\" directly linked to the White Sox's strong performance. This phenomenon is common in sports cities when a local team performs well in major competitions. Fans, eager to show their support and celebrate their team's success, increase their spending on a variety of goods and services.\n\nRetailers selling White Sox merchandise, such as jerseys, caps, and souvenirs, are seeing a surge in sales. Sports apparel stores and official team shops are particularly busy as fans stock up on gear to wear to games or while watching from home. Beyond merchandise, the hospitality sector is also benefiting greatly. Bars and restaurants, especially those located near Guaranteed Rate Field, the White Sox's home stadium, are reporting increased customer traffic and revenue. People gather to watch games together, enjoy meals, and celebrate victories.\n\nFurthermore, the demand for game tickets naturally rises during the postseason, leading to higher ticket sales and related revenue for the team and the league. This increased activity also has a ripple effect on other services, including public transportation and parking facilities, as more people travel to and from games. The White Sox's journey through the postseason is clearly a win-win situation, bringing joy to fans and a welcome financial uplift to Chicago's economy.", "vocab": [{"word": "advances", "definition": "Moves forward in a competition or process."}, {"word": "high-stakes", "definition": "Involving great risk or important consequences."}, {"word": "ignited", "definition": "Started or caused to burn; here, caused enthusiasm to begin."}, {"word": "phenomenon", "definition": "A fact or situation that is observed to exist or happen, often something remarkable."}, {"word": "retailers", "definition": "Businesses that sell goods directly to the public."}, {"word": "surge", "definition": "A sudden, strong increase."}, {"word": "hospitality sector", "definition": "Businesses that provide services like food, drink, and lodging (e.g., restaurants, bars, hotels)."}]}, "Advanced": {"text": "Chicago's urban landscape is currently abuzz with a palpable sense of civic pride and excitement, largely attributable to the stellar performance of the White Sox baseball team in the Major League Baseball postseason. This period of intense competition, culminating in the pursuit of the World Series championship, invariably galvanizes a city's populace, transforming widespread fan enthusiasm into a significant economic stimulus for local enterprises.\n\nWGN-TV reports indicate a substantial \"boom\" in business activity across Chicago, directly correlating with the White Sox's deep playoff run. This economic uplift is a well-documented phenomenon in cities hosting successful professional sports franchises. The heightened emotional investment from the fanbase translates directly into increased consumer spending across various sectors, creating a ripple effect that benefits a diverse array of businesses.\n\nForemost among the beneficiaries are retail outlets specializing in sports apparel and memorabilia. Official team stores, as well as independent sports retailers, are experiencing unprecedented demand for jerseys, caps, commemorative items, and other branded merchandise. This surge in sales extends beyond game-day purchases, as fans seek to display their allegiance and celebrate their team's achievements in their daily lives.\n\nThe hospitality industry, encompassing restaurants, bars, and potentially even hotels, is also witnessing a considerable uptick in patronage. Establishments in close proximity to Guaranteed Rate Field, the White Sox's home stadium, report significantly higher foot traffic and revenue, particularly on game days and during watch parties. Fans congregate to share the collective experience, leading to increased sales of food, beverages, and other services. This extends to establishments throughout the metropolitan area, as the general celebratory atmosphere encourages social gatherings.\n\nBeyond direct consumer spending, the postseason generates substantial revenue through ticket sales, broadcast rights, and corporate sponsorships, which indirectly inject capital into the local economy. Ancillary businesses, such as transportation services (public transit, ride-sharing, parking facilities) and even local media outlets, also experience heightened activity. The increased visibility and positive national attention garnered by a successful team can also have long-term benefits for a city's image and tourism appeal.\n\nThis cyclical relationship between athletic success and economic vitality underscores the profound impact professional sports can have beyond the realm of entertainment. The White Sox's current postseason journey is not merely a series of baseball games; it represents a powerful catalyst for community engagement and a tangible boost to Chicago's commercial landscape, demonstrating how collective civic enthusiasm can translate into measurable economic prosperity.", "vocab": [{"word": "palpable", "definition": "So intense as to be almost touched or felt; easily perceived."}, {"word": "attributable", "definition": "Capable of being assigned as a cause or source; caused by."}, {"word": "galvanizes", "definition": "Shocks or excites (someone) into taking action, often by a strong emotional response."}, {"word": "enterprises", "definition": "Businesses or companies, especially those that are large or require effort."}, {"word": "correlating", "definition": "Having a mutual relationship or connection; showing a statistical relationship."}, {"word": "unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "patronage", "definition": "The support given by a customer to a business, especially regularly."}, {"word": "ancillary", "definition": "Providing necessary support to the primary activities or operation of an organization, system, etc."}]}}, "questions": [{"q": "What is causing businesses in Chicago to experience a 'boom'?", "a": "The excitement surrounding the White Sox's strong performance in the postseason is causing businesses in Chicago to experience a 'boom'."}, {"q": "Name two types of businesses that are benefiting from the White Sox's postseason success.", "a": "Retailers (selling merchandise) and the hospitality sector (bars and restaurants) are two types of businesses benefiting from the White Sox's success."}], "id": "a22c930a2d2", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxNZnZsUktoaS1wdWZnQ0lOa0RMR1N3Z3ZYQkNMUXFkdHRaUS0xcGh4aHRSX1ZNdUhlQXVpMWZOaldCRjF6VFB5Ty02ejVoNFU3dEg0UFZrNWEybmdoT3FJbGU3RVpROXowWjBST0ZlOXlGaHJaOWY5QTRFbmlSRkFZMThaZmRha2pIMkJkazMxam9KVDjSAZgBQVVfeXFMTnRsdWN0eHBpVGZJNThjWExjTGpwRHk0dHNEUWRBRV92cjVUVlkzTDZhYlVhWXh6S295X1hob1RTcm9tXzVlV21HTDdZS3BsM1hoOTg4LXZ4ZnlZR0xEMVZkNVIxVy1Bd05DLVhwelQ2cnhEYlFLQmdobmkzc1ZOejloUlFvMFNBVWozU0RfOWM1ckJnSUtKNTA?oc=5", "published": "2026-10-03T09:31:55+09:00", "category": "business", "category_title": "Business"}, {"headline": "Walton Family Launches Bentonville Tech Institute for Regional Growth", "excerpt": "The Walton family is building a new technology institute in Bentonville, Arkansas, to boost tech education and create jobs.", "levels": {"Beginner": {"text": "The Walton family is starting a new school in Bentonville, Arkansas. It is called the Bentonville Institute of Technology. \"Breaking ground\" means they have started building it. This new place will teach people about technology.\n\nThe Walton family is famous for Walmart stores. They want to help Bentonville grow. This institute will help people learn new skills for jobs. Many new jobs are in technology. So, this school will be important for the future.\n\nBentonville is a city where Walmart began. The Walton family often helps the city with new projects. This technology institute is one of those projects. It will give students a chance to learn about computers, coding, and other tech things.\n\nLearning these skills can help people get good jobs. It can also bring more technology companies to Bentonville. This is good for the city's economy. The Walton family hopes this institute will make Bentonville a strong place for technology and new ideas. It is a big step for education and jobs in the area.", "vocab": [{"word": "Institute", "definition": "A place for learning or doing research."}, {"word": "Technology", "definition": "The use of science for practical purposes, like computers or machines."}, {"word": "Breaking ground", "definition": "Starting the construction of a building or project."}, {"word": "Skills", "definition": "Abilities that you can do well, often learned through practice."}, {"word": "Economy", "definition": "The system of how money, jobs, and goods work in a country or area."}, {"word": "Projects", "definition": "Planned tasks or activities that take time and effort to complete."}]}, "Intermediate": {"text": "The Walton family has officially begun construction on a significant new educational facility in Bentonville, Arkansas: the Bentonville Institute of Technology. A \"groundbreaking\" ceremony recently marked the start of building this institution, which aims to become a crucial hub for technological education and workforce development in the region. This initiative represents a major investment in the future of Northwest Arkansas.\n\nKnown globally as the founders of Walmart, the Walton family has a long history of philanthropic investment in their home state, particularly in Bentonville, the city where the retail giant was founded. This new institute is part of their broader vision to enhance educational opportunities and stimulate economic growth, moving beyond traditional sectors. It will focus on providing specialized training in various technology fields, preparing students for the demands of modern tech jobs that are increasingly vital in today's global economy.\n\nThe Bentonville Institute of Technology is designed to address a growing need for skilled tech professionals, not just locally but across the nation. By offering programs in areas such as software development, data science, cybersecurity, and artificial intelligence, the institute intends to create a robust pipeline of talent. This initiative is expected to attract more technology companies to the area, further diversifying Bentonville's economy beyond its strong retail roots and transforming it into a tech-savvy community.\n\nLocal leaders and educators believe the institute will play a crucial role in shaping the future of the region. It will not only equip individuals with valuable, in-demand skills, thereby improving job prospects and earning potential, but also position Bentonville as a burgeoning center for innovation and technological advancement. The Walton family's commitment to this project underscores their dedication to fostering a vibrant and prosperous community through strategic investments in education and infrastructure, ensuring a competitive edge for the region in the digital age.", "vocab": [{"word": "Facility", "definition": "A place or building used for a particular purpose."}, {"word": "Groundbreaking", "definition": "A ceremony to celebrate the start of construction for a new building."}, {"word": "Philanthropic", "definition": "Relating to the act of giving money and time to help make life better for other people."}, {"word": "Stimulate", "definition": "To encourage something to grow, develop, or become active."}, {"word": "Hub", "definition": "A central and important place where a lot of activity happens."}, {"word": "Pipeline", "definition": "A system or process for supplying something, often referring to a flow of talent or resources."}, {"word": "Diversifying", "definition": "Making something more varied or different, especially in business or economy."}]}, "Advanced": {"text": "The Walton family has commenced construction on a transformative educational endeavor in Bentonville, Arkansas: the Bentonville Institute of Technology. A recent groundbreaking ceremony signaled the official start of development for this ambitious institution, poised to become a pivotal center for technological education and advanced workforce development throughout the region. This significant investment underscores the family's ongoing commitment to fostering innovation, economic resilience, and a high-skilled talent pool in their home state.\n\nGlobally recognized as the progenitors of Walmart, the Walton family maintains a profound philanthropic legacy in Arkansas, with Bentonville serving as the epicenter of many of their initiatives. The Institute of Technology aligns with their expansive vision to elevate educational pathways and catalyze economic diversification in Northwest Arkansas. It is specifically designed to deliver specialized, cutting-edge training across a spectrum of technology disciplines, thereby equipping a new generation of professionals with the competencies required for the rapidly evolving demands of the 21st-century tech landscape. This strategic move aims to future-proof the regional economy against shifts in traditional industries.\n\nThe establishment of the Bentonville Institute of Technology directly addresses a critical shortage of skilled tech professionals, a challenge faced by economies nationwide and a barrier to growth in emerging sectors. By curating comprehensive programs in high-demand fields such as software engineering, data analytics, cybersecurity, artificial intelligence, and advanced manufacturing technologies, the institute aims to cultivate a robust talent pipeline. This strategic initiative is anticipated to not only retain local talent, preventing brain drain, but also to attract external tech enterprises and startups, thereby significantly broadening Bentonville's economic base beyond its foundational retail sector and positioning it as a formidable tech ecosystem. The goal is to create a virtuous cycle of innovation and job creation.\n\nStakeholders, including civic leaders, educational administrators, and industry representatives, view the institute as an instrumental force in shaping the region's future trajectory. Beyond empowering individuals with lucrative, in-demand skills, it is expected to cement Bentonville's reputation as a burgeoning nexus for innovation and technological prowess, potentially fostering a vibrant research and development environment. The Walton family's steadfast dedication to this monumental project exemplifies their strategic approach to community building, leveraging substantial capital to fortify educational infrastructure and ensure the region's sustained competitiveness in an increasingly digital and interconnected world. This institute represents a cornerstone in their efforts to cultivate a dynamic, future-ready workforce and economy, contributing to a more diversified and resilient regional identity.", "vocab": [{"word": "Commenced", "definition": "Began; started."}, {"word": "Transformative", "definition": "Causing a complete and significant change."}, {"word": "Pivotal", "definition": "Extremely important and central to the success or development of something."}, {"word": "Progenitors", "definition": "The originators, founders, or ancestors of something."}, {"word": "Philanthropic legacy", "definition": "A lasting positive impact resulting from charitable giving and good works."}, {"word": "Catalyze", "definition": "To cause or accelerate an event or process."}, {"word": "Competencies", "definition": "The abilities, skills, and knowledge needed to perform a job or task successfully."}, {"word": "Curating", "definition": "Selecting, organizing, and presenting information or resources carefully."}, {"word": "Nexus", "definition": "A central or important connection or link between a number of things."}, {"word": "Prowess", "definition": "Great skill or ability in a particular activity or field."}, {"word": "Fortify", "definition": "To strengthen or reinforce something, often to make it more resilient."}]}}, "questions": [{"q": "What is the name of the new educational facility being built in Bentonville?", "a": "The Bentonville Institute of Technology."}, {"q": "What is one main goal of the Bentonville Institute of Technology?", "a": "To teach people technology skills, create a talent pipeline, or diversify Bentonville's economy."}], "id": "a2a236941da", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiogFBVV95cUxQME1IdDZRM29idkduamswWVZlVDh1T003d1RjcUlNZmdaR3FKOTF2WWdHcDNFYllhVHE2RGlMSXJXUm95eGVjTDFDZ1ZkaUkwTnFWUmNKY1FyNFBjN0pFb19USWd4RGZLR2hYVHRkMWl3N2pOYmx4TjFpQ2kwQzZYR0ctbjd6VlJYbmFPd3Q3Rl85QlI5Vlg3clhHc0NSczE4dlE?oc=5", "published": "2026-10-03T09:25:23+09:00", "category": "business", "category_title": "Business"}, {"headline": "DoJ Won't Reopen Powell Probe Over Fed Building Costs", "excerpt": "The U.S. Justice Department has decided not to reopen a criminal investigation into former Federal Reserve chair Jerome Powell regarding renovation cost overruns.", "levels": {"Beginner": {"text": "The U.S. Justice Department will not start a new criminal investigation into Jerome Powell. Mr. Powell used to be the head of the Federal Reserve, which is America's central bank. The first investigation was about money spent on fixing up the bank's building. They spent more money than planned, which are called \"cost overruns.\" A spokesperson from the department said this on Friday.\n\nEven though Mr. Powell won't be investigated again, officials might still look at how the building project was managed. Attorney general Todd Blanche told Bloomberg News that they have not stopped looking into the project's oversight. If they find any evidence that something wrong happened, they could take action. So, while the focus on Mr. Powell is over, the project itself could still be checked. This means the government wants to make sure public money was used correctly for the building work. The Federal Reserve is an important institution for the country's economy.", "vocab": [{"word": "Justice Department", "definition": "A part of the U.S. government that deals with laws and justice."}, {"word": "Federal Reserve", "definition": "The central bank of the U.S. that manages money."}, {"word": "Investigation", "definition": "An official check to find facts about something."}, {"word": "Cost overruns", "definition": "When a project spends more money than planned."}, {"word": "Oversight", "definition": "Watching to make sure things are done correctly."}, {"word": "Action", "definition": "Doing something to solve a problem or punish wrongdoing."}]}, "Intermediate": {"text": "The U.S. Justice Department has announced it will not reopen a criminal investigation into former Federal Reserve chair Jerome Powell. The initial inquiry focused on cost overruns related to a renovation project at the central bank's building. A department spokesperson confirmed this decision on Friday, bringing a degree of closure to a matter that had drawn public attention.\n\nJerome Powell served as the chair of the Federal Reserve, often called the \"Fed,\" which is the central bank of the United States. The Fed plays a crucial role in the nation's economy by setting interest rates, managing the money supply, and overseeing banks. Its independence from political influence is considered vital for economic stability. The previous investigation concerned how much money was spent on upgrading the Fed's headquarters. \"Cost overruns\" mean that the actual expenses for the renovation project went significantly beyond the original budget, raising questions about financial management.\n\nWhile the criminal investigation specifically targeting Mr. Powell will not be revived, the broader examination of the renovation project's management is not entirely closed. Attorney general Todd Blanche, in comments to Bloomberg News, stated that officials have not ruled out continuing to review the project's oversight. This means that the Justice Department could still take action if new evidence of wrongdoing related to the project's management comes to light. The distinction is important: the focus shifts from a specific criminal probe into the former chair to a general review of how the project was supervised and executed. This ensures accountability for public funds used in major government projects, even if no criminal intent is found for specific individuals. The Federal Reserve's operations are vital for economic stability, making transparency in its projects essential to maintain public trust in this key financial institution.", "vocab": [{"word": "Reopen", "definition": "To start something again after it was stopped."}, {"word": "Inquiry", "definition": "An official investigation or questioning."}, {"word": "Crucial", "definition": "Extremely important or necessary."}, {"word": "Renovation", "definition": "The process of repairing and improving a building."}, {"word": "Budget", "definition": "A plan for how much money can be spent and how it will be spent."}, {"word": "Oversight", "definition": "The act of supervising someone or something, especially to ensure it is done correctly."}, {"word": "Accountability", "definition": "The state of being responsible for something and having to explain your actions."}]}, "Advanced": {"text": "The U.S. Department of Justice (DoJ) has formally declined to reopen a criminal investigation into former Federal Reserve chair Jerome Powell, bringing a measure of resolution to a matter that had cast a shadow over the central bank's administrative practices. The initial scrutiny stemmed from significant cost overruns associated with a major renovation project at the Federal Reserve's headquarters. A DoJ spokesperson confirmed the decision on Friday, indicating that the department found insufficient grounds to pursue further criminal proceedings against Powell. This announcement follows a period of internal review by the DoJ, which had previously examined the allegations.\n\nJerome Powell, who served as the 16th chair of the Federal Reserve, presided over the nation's central bank during a period of considerable economic volatility, including the COVID-19 pandemic and subsequent inflationary pressures. The Federal Reserve's mandate is multifaceted, encompassing the management of monetary policy, the promotion of financial stability, and the supervision of banking institutions. The integrity and perceived independence of the Fed are paramount to its effectiveness, making any allegations of impropriety, particularly concerning its leadership, a matter of intense public and congressional concern. The renovation project in question, a substantial undertaking to modernize the central bank's facilities, reportedly incurred expenses that far exceeded initial budgetary projections, triggering the initial investigation into potential mismanagement or malfeasance. Such discrepancies in public spending often draw the attention of oversight bodies and the press, given the imperative for fiscal responsibility.\n\nWhile the criminal inquiry specifically targeting Mr. Powell has been shelved, the broader examination of the renovation project's financial administration and oversight remains an active area of interest for the Justice Department. Attorney general Todd Blanche, in comments to Bloomberg News, underscored that officials have not precluded the possibility of continuing to scrutinize the project's oversight mechanisms. This distinction is crucial: while a criminal prosecution of the former chair is off the table, the DoJ reserves the right to pursue action should compelling evidence of systemic wrongdoing or negligence in the project's execution come to light. Such actions could range from civil penalties against contractors or officials to investigations into other individuals involved in the project's management, ensuring that accountability is sought where appropriate.\n\nThe decision not to reopen the probe into Powell does not necessarily exonerate all aspects of the project's handling but rather signifies that the legal threshold for criminal charges against the former chair has not been met. Federal prosecutors typically require a high bar of evidence, demonstrating intent and a clear violation of law, before proceeding with indictments. For an institution as vital as the Federal Reserve, ensuring robust accountability for public funds and maintaining transparent governance are essential to upholding public trust and safeguarding its institutional credibility. The ongoing potential for scrutiny into the project's oversight underscores the government's commitment to fiscal prudence and ethical conduct within its most critical agencies, reinforcing the principle that even high-ranking officials are subject to review.", "vocab": [{"word": "Declined", "definition": "Formally refused to do something."}, {"word": "Scrutiny", "definition": "Critical observation or examination."}, {"word": "Stemmed from", "definition": "Originated or came from."}, {"word": "Multifaceted", "definition": "Having many different aspects or features."}, {"word": "Paramount", "definition": "More important than anything else; supreme."}, {"word": "Malfeasance", "definition": "Wrongdoing, especially by a public official."}, {"word": "Precluded", "definition": "Prevented from happening or made impossible."}, {"word": "Exonerate", "definition": "To clear someone from blame or guilt."}]}}, "questions": [{"q": "What did the U.S. Justice Department decide regarding former Federal Reserve chair Jerome Powell?", "a": "The U.S. Justice Department decided not to reopen a criminal investigation into former Federal Reserve chair Jerome Powell."}, {"q": "What is the Justice Department still considering looking into, even though the investigation into Powell is closed?", "a": "The Justice Department is still considering looking into the project's oversight and potentially taking action if evidence of wrongdoing related to the project's management comes to light."}], "id": "a6efd5cf8f4", "source": "Economics | The Guardian", "link": "https://www.theguardian.com/business/2026/oct/02/doj-fed-chair-jerome-powell-investigation", "published": "2026-10-03T07:32:21+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Almost All Companies Now Using AI, Survey Reveals", "excerpt": "A new survey shows that nearly every company is now using artificial intelligence, highlighting a rapid shift in how businesses operate globally.", "levels": {"Beginner": {"text": "A new report says that almost all companies now use AI. AI stands for Artificial Intelligence. It means computers can do smart things, like humans. The report from Valor International found that 96% of companies use AI in some way. This is a very big number.\n\nCompanies use AI for many things. For example, AI can help answer customer questions quickly. It can also help businesses understand a lot of information fast. This makes work easier and saves time. Some companies use AI to make their products better or to find new ideas.\n\nUsing AI helps companies work smarter and faster. It can help them save money too. Because of this, more and more businesses are starting to use AI tools. It shows that AI is becoming a very important part of how companies do business today. It helps them stay modern and competitive. This trend is growing quickly around the world.", "vocab": [{"word": "AI (Artificial Intelligence)", "definition": "Computers that can think and learn like people."}, {"word": "Report", "definition": "A paper or document that gives facts and information."}, {"word": "Companies", "definition": "Businesses or groups that make or sell things."}, {"word": "Customers", "definition": "People who buy goods or services from a company."}, {"word": "Tools", "definition": "Things that help you do a job."}, {"word": "Competitive", "definition": "Trying to be better than others."}]}, "Intermediate": {"text": "A recent survey by Valor International reveals a significant trend: 96% of companies report that they are currently utilizing Artificial Intelligence (AI) in their operations. This high percentage underscores the rapid and widespread adoption of AI technologies across various industries worldwide. The findings suggest that AI is no longer a niche technology but a fundamental component of modern business strategy, transforming how work is done and decisions are made.\n\nCompanies are deploying AI for a diverse range of applications. Common uses include automating routine tasks, which boosts operational efficiency and reduces costs. AI is also extensively used for data analysis, helping businesses process vast amounts of information to identify trends, make informed decisions, and predict future outcomes. Furthermore, AI-powered tools are enhancing customer service through chatbots and personalized recommendations, improving customer engagement and satisfaction. In product development, AI assists in design, testing, and optimization, accelerating innovation cycles and bringing new products to market faster.\n\nThe widespread integration of AI reflects its proven benefits, such as increased productivity, enhanced decision-making capabilities, and the ability to gain a competitive edge in the market. As AI technologies become more accessible and sophisticated, businesses are increasingly leveraging them to streamline processes, innovate offerings, and adapt to evolving market demands. This pervasive adoption indicates a transformative shift in how businesses operate, signaling AI's indispensable role in the global economy. While the benefits are clear, this rapid shift also brings discussions about the future of work and the need for employees to develop new skills to work alongside AI systems.", "vocab": [{"word": "Utilizing", "definition": "Using something effectively."}, {"word": "Operations", "definition": "The activities involved in running a business."}, {"word": "Underscores", "definition": "Emphasizes or highlights something."}, {"word": "Automating", "definition": "Making a process or system work automatically without human help."}, {"word": "Efficiency", "definition": "The quality of being able to do a task successfully without wasting time or energy."}, {"word": "Integration", "definition": "The process of combining different things so they work together as one."}, {"word": "Indispensable", "definition": "Absolutely necessary or essential."}]}, "Advanced": {"text": "A recent comprehensive survey conducted by Valor International has unveiled a striking statistic: an overwhelming 96% of companies globally report that they are actively incorporating Artificial Intelligence (AI) into their operational frameworks. This figure not only signifies the pervasive penetration of AI across diverse industry sectors but also underscores a profound paradigm shift in contemporary business methodologies. AI, once considered a futuristic concept, has rapidly cemented its status as an indispensable strategic imperative for enterprises aiming to maintain competitiveness and drive innovation in an increasingly data-driven world.\n\nThe applications of AI within these organizations are multifaceted and sophisticated. Businesses are leveraging AI for advanced predictive analytics, enabling them to forecast market trends, consumer behavior, and potential supply chain disruptions with unprecedented accuracy. Machine learning algorithms are optimizing everything from logistics and inventory management to personalized marketing campaigns and fraud detection. Customer relationship management (CRM) is being revolutionized by AI-powered chatbots and virtual assistants that provide instant, tailored support, thereby enhancing customer satisfaction and loyalty. Furthermore, in research and development, AI accelerates the discovery of new materials, drug compounds, and product designs, significantly shortening innovation cycles and fostering breakthroughs.\n\nThis widespread adoption is driven by a compelling array of benefits. Companies are realizing substantial gains in operational efficiency, leading to cost reductions and improved resource allocation. AI facilitates superior data processing and analysis, transforming raw data into actionable insights that inform strategic decision-making. The ability to automate complex, repetitive tasks frees human capital to focus on higher-value, creative, and strategic initiatives. Moreover, AI offers a crucial competitive advantage, allowing firms to personalize offerings, anticipate market shifts, and respond with agility, thereby solidifying their market position.\n\nHowever, the rapid integration of AI also presents a complex landscape of challenges. These include the imperative for workforce upskilling and reskilling to adapt to new human-AI collaboration models, addressing ethical considerations such as algorithmic bias and data privacy, and navigating the significant initial investment costs and technical complexities associated with AI implementation. Regulatory frameworks are also struggling to keep pace with the rapid advancements, creating uncertainty. Despite these hurdles, the survey's findings unequivocally demonstrate that AI is no longer an optional enhancement but a core component of modern enterprise architecture, fundamentally reshaping the global economic landscape and setting the trajectory for future business evolution. Its continued evolution promises to unlock even greater potential, while simultaneously demanding careful consideration of its broader societal impacts.", "vocab": [{"word": "Pervasive", "definition": "Spreading widely throughout an area or a group of people."}, {"word": "Paradigm shift", "definition": "A fundamental change in approach or underlying assumptions."}, {"word": "Indispensable", "definition": "Absolutely necessary; essential."}, {"word": "Multifaceted", "definition": "Having many different aspects or features."}, {"word": "Predictive analytics", "definition": "The use of data, statistical algorithms, and machine learning techniques to identify the likelihood of future outcomes based on historical data."}, {"word": "Operational efficiency", "definition": "The capability of an enterprise to deliver products or services to its customers in the most cost-effective manner possible while ensuring high quality."}, {"word": "Algorithmic bias", "definition": "Systematic and repeatable errors in a computer system that create unfair outcomes, such as favoring one group over others."}, {"word": "Trajectory", "definition": "The path followed by a projectile flying or an object moving under the action of given forces; figuratively, a path or course."}]}}, "questions": [{"q": "What percentage of companies reported using AI according to the Valor International survey?", "a": "According to the Valor International survey, 96% of companies reported using AI."}, {"q": "Name two different ways companies are using AI in their operations, as mentioned in the article.", "a": "Companies are using AI for various operations, including automating routine tasks, data analysis, enhancing customer service through chatbots, and assisting in product development."}], "id": "a386c7d4469", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxPTklwYjM2Q0tzS1Q2U1VRWVFEc1FoMkR6dVRJdlhJYjlGdGIxakl0bmFJWHRnOGVyanAxemFrd0lTeFZQSUtGM3pkN2JpVnlIUkM4QTJtOVNraEhOa3h5LV9LVm55Y1BIbHZnVWxuUzRsYklwUkVxVU4zUEpRUmFwN2kwYl9qNXJPbDRVS25mZ0lnbTl0YUItb1dubXdsSjlGQWhhbG5yZnRfdExHTldhY3hma2dJeFVud1Zv0gHKAUFVX3lxTE56X290ZTZpVVNwdU5BUWNXYjQ2Z0otOGpYTzEwc0ZvNXp0M291T3FDSXAtckxkVVJMOWs1MThXM2poaUoxcFVKOUptYzFPYWhHcktnV1hUbk1VVFBObGtnSWVmeVNZQWpybGJ5ZWtCdEhjVTUtU2oxdGNoc0NFUUp4TE1rZm5FRDhNMWNaSjFnVVhQTlNvaEJHWG9saWxISERlc3NHQXU3ME5Dc2FoV0l1TWtRVkQ3aWNsVzhOMEl2anBuTTRESG9zWWc?oc=5", "published": "2026-10-03T06:00:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Agency Diverts $1.4 Billion in Science Funds", "excerpt": "A government agency has reportedly redirected $1.4 billion intended for scientific research, sparking concerns about funding oversight.", "levels": {"Beginner": {"text": "A government agency has moved a lot of money. This money, $1.4 billion, was supposed to be for science. Congress, which makes laws, said this money *must* go to science projects. But the agency used it for other things instead.\n\nThis is a very big amount of money. People are worried because science is important. Science helps us learn new things about the world. It helps us find cures for sicknesses and make new technology. When money meant for science is used elsewhere, these important projects might not get finished.\n\nCongress sets rules for how government money should be spent. These rules are important to make sure money goes to the right places. When an agency changes where the money goes, it can cause problems. It means the agency did not follow the rules Congress made. This situation makes people ask questions about how government agencies use public money. It shows why it's important for agencies to be careful with funds given for specific tasks.", "vocab": [{"word": "Agency", "definition": "a government office or organization."}, {"word": "Diverted", "definition": "changed the direction or purpose of something."}, {"word": "Funds", "definition": "money, especially money saved or made available for a particular purpose."}, {"word": "Mandated", "definition": "ordered or required by law or authority."}, {"word": "Congress", "definition": "the group of people who make laws in the United States."}, {"word": "Science", "definition": "the study of the natural and physical world through observation and experiment."}]}, "Intermediate": {"text": "A government agency has reportedly redirected a substantial sum of $1.4 billion that was originally designated for scientific initiatives. These funds had been specifically mandated by Congress, meaning the legislative body had legally directed them towards science-related projects. Instead, the agency chose to allocate the money for different purposes.\n\nThis significant diversion of funds raises serious questions about government accountability and the proper use of taxpayer money. When Congress appropriates funds for specific areas like scientific research, it often reflects national priorities and aims to support critical advancements. Scientific endeavors are vital for innovation, economic growth, public health, and national security. Redirecting such a large sum could potentially hinder important research projects, slow down discoveries, and impact the careers of scientists working on these initiatives.\n\nThe incident highlights the importance of congressional oversight. Congress has the responsibility to ensure that government agencies spend money as intended by law. When an agency deviates from these mandates, it can undermine public trust and create tension between the executive and legislative branches of government. This situation prompts a closer examination of how agencies manage their budgets and adhere to legislative directives, emphasizing the need for transparency in government spending to ensure funds are used effectively and for their intended purposes.", "vocab": [{"word": "Redirected", "definition": "sent in a different direction or to a different purpose."}, {"word": "Designated", "definition": "officially assigned or set apart for a specific purpose."}, {"word": "Mandated", "definition": "officially required or ordered by a law or authority."}, {"word": "Accountability", "definition": "the fact or condition of being responsible for one's actions and required to explain them."}, {"word": "Priorities", "definition": "things that are regarded as more important than others."}, {"word": "Oversight", "definition": "the action of supervising something, especially to ensure that it is being done correctly."}, {"word": "Transparency", "definition": "the condition of being open, honest, and clear in operations."}]}, "Advanced": {"text": "A significant controversy has emerged following reports that a government agency circumvented congressional directives by diverting $1.4 billion in funds explicitly appropriated for scientific research. This substantial sum, earmarked by the legislative branch, was reportedly reallocated by the agency for other, unspecified purposes, raising profound concerns about executive branch adherence to legislative mandates and fiscal accountability.\n\nThe appropriation process in the United States is a cornerstone of democratic governance, with Congress holding the \"power of the purse.\" When specific funds are mandated for areas like scientific research, it reflects a deliberate legislative judgment regarding national strategic priorities, ranging from public health advancements and environmental protection to technological innovation and national security. Such a large-scale diversion can have far-reaching ramifications, potentially stalling critical research projects, disrupting long-term scientific planning, and impacting the nation's global competitiveness in key scientific fields. It also poses a direct challenge to the principle of separation of powers, where the executive branch is expected to implement laws as passed by Congress.\n\nThis incident underscores the critical role of congressional oversight in maintaining the integrity of the budgetary process. The legislative branch is tasked with rigorous scrutiny of how taxpayer dollars are spent, ensuring that agencies operate within the bounds of their statutory authority. A unilateral reallocation of congressionally appropriated funds by an executive agency can be seen as an overreach, potentially setting a problematic precedent for future budgetary discretion. It erodes public trust in governmental institutions and raises questions about the transparency and ethical stewardship of public resources. The implications extend beyond immediate financial concerns, touching upon the foundational principles of governance, the efficacy of scientific enterprise, and the delicate balance of power within the federal system. This situation will likely prompt intense congressional inquiry and calls for reinforced mechanisms to prevent similar diversions in the future, safeguarding the legislative intent behind federal funding.", "vocab": [{"word": "Circumvented", "definition": "found a way around (an obstacle or difficulty), typically in a clever or dishonest way."}, {"word": "Appropriated", "definition": "formally set aside for a specific use, especially by a legislature."}, {"word": "Earmarked", "definition": "designated (money or resources) for a particular purpose."}, {"word": "Reallocated", "definition": "distributed again or differently."}, {"word": "Ramifications", "definition": "a complex or unwelcome consequence of an action or event."}, {"word": "Oversight", "definition": "the action of supervising something, especially to ensure that it is being done correctly and legally."}, {"word": "Scrutiny", "definition": "critical observation or examination."}, {"word": "Precedent", "definition": "an earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}]}}, "questions": [{"q": "What kind of funds were diverted by the agency?", "a": "Science funds."}, {"q": "Why is it a concern when an agency diverts funds that Congress has specifically mandated for a particular purpose?", "a": "It raises concerns about accountability, transparency, and whether national priorities set by the legislative branch are being respected, potentially impacting important research and public trust."}], "id": "a88f95be14a", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxQMDkxZnRWTUtQQUpBeUxJRDU2VFhSaUx3N1M0T1d5M3VsREtURDJsdkpuckNJaV9hSlQtZFJ0WWxScEc0SGJnTlZjSDByV3VLQ1k3U256X19BZTI4OWJMS3RVdGQ4MEgySFoxWXB2QU85a1RER3NJUmhkMUZWNHd2SHdWMFdyR2x3NE1TeVpwNnBOMzR4Y3JFNFJkUXV5OTVYYWxSYzUxM2JHT2FUbFVFa2dGMml1OEMtWnVna2RuX1JWUQ?oc=5", "published": "2026-10-03T08:58:58+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "South Africa Confronts Violence Against Women After Tragic Discovery", "excerpt": "The discovery of 12 women's bodies near Johannesburg has brought South Africa's severe problem of gender-based violence into sharp focus.", "levels": {"Beginner": {"text": "South Africa is facing a big problem: violence against women. Recently, police found the bodies of 12 women near Johannesburg. This sad discovery has made many people talk about how serious this issue is in the country.\n\nMany women in South Africa suffer from violence. This can be physical harm or other types of abuse. It happens too often. The government and many groups are trying to stop it.\n\nSome men in South Africa are also working hard to end this violence. They believe that all men must help. They are speaking out and teaching other men that violence against women is wrong. They want to change how some men think and act. Their message is clear: \"Every man needs to play a part\" to make South Africa safer for women. They hope that by working together, they can stop this terrible problem and protect women.", "vocab": [{"word": "violence", "definition": "actions that hurt people."}, {"word": "discovered", "definition": "found something for the first time."}, {"word": "problem", "definition": "a difficult situation that needs to be solved."}, {"word": "suffer", "definition": "to feel pain or sadness."}, {"word": "protect", "definition": "to keep someone safe from harm."}, {"word": "safer", "definition": "more safe; less dangerous."}]}, "Intermediate": {"text": "South Africa is once again confronting its severe and persistent problem of violence against women. The recent discovery of 12 women's bodies near Johannesburg has tragically highlighted the widespread issue of gender-based violence (GBV) in the country. This grim finding has reignited urgent calls for action from all sectors of society, emphasizing the critical need for change.\n\nGender-based violence, which includes physical, sexual, and emotional abuse, is a deeply entrenched problem in South Africa. The country has one of the highest rates of femicide – the killing of women because of their gender – in the world. This violence affects women and girls from all backgrounds, impacting their safety, well-being, and fundamental human rights. Experts point to a complex mix of historical factors, societal norms, and economic inequalities that contribute to this crisis, creating a pervasive culture of violence that harms communities.\n\nCrucially, many men in South Africa are actively working to challenge and end this violence. They are stepping forward, recognizing that men must be part of the solution. These initiatives involve educating other men about respectful relationships, speaking out against harmful behaviors, and promoting accountability for actions. Groups of men are organizing workshops, community dialogues, and public awareness campaigns to shift cultural attitudes and foster a sense of shared responsibility. Their message, often articulated as \"Every man needs to play a part,\" emphasizes that stopping GBV is not just a women's issue, but a societal responsibility that requires active participation from men. By engaging in these efforts, they aim to create a safer and more equitable environment for all women in South Africa.", "vocab": [{"word": "confronting", "definition": "dealing with a difficult situation or problem."}, {"word": "persistent", "definition": "continuing to exist or happen for a long time."}, {"word": "highlighted", "definition": "drew attention to something important."}, {"word": "gender-based violence (GBV)", "definition": "harmful acts directed at an individual based on their gender."}, {"word": "femicide", "definition": "the killing of a woman or girl, especially by a man and for reasons connected with her gender."}, {"word": "entrenched", "definition": "firmly established and difficult to change."}, {"word": "accountability", "definition": "the fact or condition of being responsible for one's actions."}]}, "Advanced": {"text": "South Africa is once again grappling with the profound and systemic crisis of violence against women, a pervasive issue tragically underscored by the recent discovery of 12 women's bodies near Johannesburg. This harrowing finding has not only shocked the nation but has also reignited an urgent national dialogue on the deeply entrenched problem of gender-based violence (GBV) and the imperative for comprehensive societal reform. The incident serves as a grim reminder of the daily dangers many women face in a country where such atrocities are alarmingly common.\n\nThe statistics on GBV in South Africa are stark, positioning the nation among those with the highest rates of femicide globally. This violence, encompassing physical assault, sexual abuse, psychological torment, and economic exploitation, disproportionately affects women and girls across all socio-economic strata. Experts and human rights advocates attribute this crisis to a complex interplay of historical legacies, including apartheid's disruption of social structures, deeply rooted patriarchal norms, persistent economic inequalities, and a culture of impunity that often allows perpetrators to evade justice. This confluence of factors perpetuates a cycle of violence that undermines social cohesion, erodes trust in institutions, and obstructs national development, creating a pervasive climate of fear for many.\n\nIn response to this dire situation, a growing movement of South African men is actively challenging the status quo, recognizing their indispensable role in dismantling GBV. These initiatives extend beyond mere condemnation, focusing on proactive engagement and transformative change. Groups of men are organizing community workshops, educational programs in schools, and public awareness campaigns designed to foster respectful masculinity, challenge harmful stereotypes, and promote non-violent conflict resolution. They advocate for a fundamental shift in societal attitudes, emphasizing that the fight against GBV is not solely a women's issue but a collective responsibility requiring the active participation and accountability of every man. This includes encouraging men to critically examine their own biases and behaviors, and to actively model equitable relationships.\n\nLeaders within these movements articulate a clear message: \"Every man needs to play a part.\" This involves not only refraining from violence but also actively intervening when witnessing abuse, speaking out against misogynistic attitudes, and advocating for stronger legal frameworks and more effective law enforcement responses. Their efforts are crucial in fostering a culture where violence against women is unequivocally rejected and perpetrators are held to account, thereby breaking the cycle of impunity. While the path to eradicating GBV is arduous and multifaceted, the increasing engagement of men offers a vital glimmer of hope, signaling a collective commitment to building a safer, more just, and equitable South Africa for all its citizens. This sustained commitment from all segments of society is essential for achieving lasting change and ensuring the safety and dignity of every woman.", "vocab": [{"word": "grappling", "definition": "struggling to deal with a difficult problem or issue."}, {"word": "systemic", "definition": "relating to a system, affecting an entire system rather than just one part; deeply ingrained."}, {"word": "pervasive", "definition": "spreading widely throughout an area or a group of people; present everywhere."}, {"word": "harrowing", "definition": "acutely distressing or painful; extremely upsetting."}, {"word": "impunity", "definition": "exemption from punishment or freedom from the injurious consequences of an action."}, {"word": "patriarchal", "definition": "relating to a system of society or government controlled by men, where men hold primary power."}, {"word": "dismantling", "definition": "taking apart a system or organization; gradually ending something."}, {"word": "unequivocally", "definition": "in a way that leaves no doubt; unambiguously and clearly."}]}}, "questions": [{"q": "What recent event in South Africa brought attention to the problem of violence against women?", "a": "The discovery of 12 women's bodies near Johannesburg brought attention to the problem of violence against women."}, {"q": "According to the article, what role do some men in South Africa believe they need to play in ending this violence?", "a": "Some men in South Africa believe they need to actively participate in ending violence against women by educating others, speaking out against harmful behaviors, promoting accountability, and challenging societal attitudes, as 'Every man needs to play a part'."}], "id": "a5f1ddd9b98", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cm3eqegwpzl4o?at_medium=RSS&at_campaign=rss", "published": "2026-10-03T08:56:21+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Dave Portnoy, Barstool Sports are off Fox’s ‘Big Noon Kickoff’: Sources - The New York Times", "excerpt": "Dave Portnoy, Barstool Sports are off Fox’s ‘Big Noon Kickoff’: Sources The New York Times", "levels": {"Beginner": {"text": "Dave Portnoy, Barstool Sports are off Fox’s ‘Big Noon Kickoff’: Sources The New York Times", "vocab": []}, "Intermediate": {"text": "Dave Portnoy, Barstool Sports are off Fox’s ‘Big Noon Kickoff’: Sources The New York Times", "vocab": []}, "Advanced": {"text": "Dave Portnoy, Barstool Sports are off Fox’s ‘Big Noon Kickoff’: Sources The New York Times", "vocab": []}}, "questions": [], "id": "a5bc2a2e390", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipAFBVV95cUxNXzF5X0RKYU1pSnBJZ0h4T2JnLW5kZklFY2RVODNlc2ZROGJheTRnMlRMSnJXdUY4bkJjMjhrRFdXOXZFYTJEVVJTMzM3ODF2YXhyUHhEaEJFYTFmd2kyX2NFdnA5dWc1OGJQbXZNTy1ZQVREbWxHYlM3ajlabVhzb3kwUWp3anNtSUZFbDFEdWtkT01WWXZ2Y19UekFlcnlzbE5sMg?oc=5", "published": "2026-10-03T09:45:55+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Friday Night Frenzy for Section IV football - Yahoo Sports", "excerpt": "Friday Night Frenzy for Section IV football Yahoo Sports", "levels": {"Beginner": {"text": "Friday Night Frenzy for Section IV football Ya function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
