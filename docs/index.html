ertainment (SPHR) Shares Are Sliding Today - Yahoo Finance", "excerpt": "Why Sphere Entertainment (SPHR) Shares Are Sliding Today Yahoo Finance", "levels": {"Beginner": {"text": "Why Sphere Entertainment (SPHR) Shares Are Sliding Today Yahoo Finance", "vocab": []}, "Intermediate": {"text": "Why Sphere Entertainment (SPHR) Shares Are Sliding Today Yahoo Finance", "vocab": []}, "Advanced": {"text": "Why Sphere Entertainment (SPHR) Shares Are Sliding Today Yahoo Finance", "vocab": []}}, "questions": [], "id": "a078c07be8e", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxNdmkxQS1BSXhRbDVSMDNUbVF1YWxGNDFwV2h6Y3kyc1k3VTBUb0phSEZfRV9zNlBwMnYya3c0SnVlSXFvdkdjdFVtVVU4ZTVubDVSTHFXMFo0eV9nc0VzX2ZzSTRiU3JfOFROajBOWXhRRzR5MXFHbmJIQVA2ZHNVWGZTV3lRUFRfN2xNTUxIZnlScmY2eWxsbENhRWtkWGl2anZr?oc=5", "published": "2026-07-10T07:31:42+09:00", "category": "entertainment"}]}], "home": [{"headline": "Europe's Biggest Port Sued Over Climate Goals", "excerpt": "Europe's biggest port, Rotterdam, is being sued to accelerate its transition away from fossil fuels and become greener.", "levels": {"Beginner": {"text": "The Port of Rotterdam is a very big port in Europe. It is the biggest one. Many ships come and go from this port. They carry goods and fuel all over the world. This port is very important for trade.\n\nNow, some groups want the port to be \"greener.\" This means they want the port to use less fossil fuels. Fossil fuels are things like oil and gas. They make pollution and are bad for the Earth's climate. When we burn them, they release harmful gases.\n\nA group has started a lawsuit against the Port of Rotterdam. A lawsuit is when people go to court to ask for something. This group wants the port to change faster. They want it to stop working so much with companies that use fossil fuels. They believe the port should move more quickly to clean energy.\n\nThe port says it is already working to be greener. It wants to use more clean energy and reduce its environmental impact. But the groups say it is not fast enough. They want the port to do more, and do it quickly. This is a big challenge for the port. It needs to find new ways to power ships and port activities without harming the planet so much. This lawsuit adds more pressure on the port to make these changes happen sooner.", "vocab": [{"word": "Port", "definition": "A place where ships can load and unload goods."}, {"word": "Greener", "definition": "More friendly to the environment; causing less pollution."}, {"word": "Fossil fuels", "definition": "Natural fuels like coal, oil, or gas, formed from dead plants and animals."}, {"word": "Pollution", "definition": "Harmful things in the air, water, or land."}, {"word": "Lawsuit", "definition": "A case in a court of law involving a claim by one party against another."}, {"word": "Challenge", "definition": "A difficult task or problem."}]}, "Intermediate": {"text": "The Port of Rotterdam, recognized as Europe's largest port, is facing increasing pressure to accelerate its transition towards more sustainable operations. Environmental organizations have initiated a lawsuit, demanding that the port significantly reduce its dependence on fossil fuel companies and embrace greener practices more rapidly.\n\nThis legal action highlights a growing global concern about the environmental impact of major industrial hubs. Ports like Rotterdam are crucial gateways for international trade, but they also contribute to carbon emissions through shipping, logistics, and the handling of fossil fuels such as oil and gas. These fuels are a primary source of greenhouse gases, which are linked to climate change and global warming.\n\nThe lawsuit, filed by environmental groups, argues that the Port of Rotterdam's current plans to become carbon neutral are too slow. They contend that the port, as a major player in the global energy supply chain, has a responsibility to act more decisively in phasing out fossil fuel activities. The groups are pushing for concrete commitments and a faster timeline for the port to shift towards renewable energy sources and cleaner logistics.\n\nPort authorities have stated that they are already committed to sustainability and have various initiatives underway to reduce their environmental footprint. These include projects focused on providing shore power for ships, developing renewable energy generation within the port area, and promoting cleaner fuels. However, the plaintiffs in the lawsuit believe these efforts are insufficient given the urgency of the climate crisis. The outcome of this legal challenge could set a precedent for other major ports worldwide, influencing how quickly they adopt more environmentally friendly policies and adapt to global climate goals.", "vocab": [{"word": "Transition", "definition": "The process or a period of changing from one state or condition to another."}, {"word": "Sustainable", "definition": "Able to be maintained at a certain rate or level, often referring to environmental friendliness."}, {"word": "Initiated", "definition": "Began or started something, especially a formal process or action."}, {"word": "Dependence", "definition": "The state of relying on or being controlled by someone or something else."}, {"word": "Emissions", "definition": "The production and discharge of something, especially gas or radiation into the atmosphere."}, {"word": "Precedent", "definition": "An earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}, {"word": "Insufficient", "definition": "Not enough; inadequate for a particular purpose."}]}, "Advanced": {"text": "The Port of Rotterdam, a colossal nexus of global trade and Europe's preeminent maritime gateway, finds itself at the epicenter of a burgeoning legal and environmental dispute. A coalition of environmental organizations has launched a significant lawsuit, compelling the port to drastically accelerate its divestment from fossil fuel operations and expedite its transition to a more sustainable, carbon-neutral future.\n\nThis legal challenge underscores the escalating global imperative to decarbonize industrial infrastructure, particularly those critical to international logistics and energy supply chains. As a pivotal hub for the transshipment and refining of oil and gas, Rotterdam's operations inherently contribute to substantial greenhouse gas emissions, exacerbating the climate crisis. The plaintiffs argue that despite the port's stated sustainability ambitions, its current trajectory is woefully inadequate to meet the urgent demands of climate action. They contend that the port's strategic plans do not reflect the necessary urgency to phase out its deep-seated reliance on fossil fuel firms and infrastructure.\n\nThe lawsuit seeks judicial intervention to mandate a more aggressive timeline for the port's green transformation. This includes demanding concrete, measurable steps towards integrating renewable energy sources, electrifying port operations, and fostering a supply chain that prioritizes cleaner fuels and sustainable shipping practices. The environmental groups assert that the port, given its immense economic leverage and strategic importance, bears a profound responsibility to lead in this global shift, rather than merely adapt incrementally.\n\nPort authorities, while acknowledging their commitment to environmental stewardship, maintain that they are already implementing a comprehensive suite of initiatives aimed at reducing their ecological footprint. These encompass pioneering projects in shore power for vessels, developing infrastructure for alternative fuels like hydrogen and ammonia, and investing in carbon capture technologies. However, the plaintiffs view these efforts as piecemeal and lacking the systemic overhaul required to align with the Paris Agreement's objectives. The outcome of this high-stakes litigation could establish a significant legal precedent, influencing regulatory frameworks and corporate responsibilities for major industrial complexes across Europe and beyond, compelling them to recalibrate their operational strategies in the face of mounting climate pressure. The case highlights the tension between economic imperatives and environmental exigencies in the modern global economy.", "vocab": [{"word": "Colossal", "definition": "Extremely large or great in size, extent, or degree."}, {"word": "Nexus", "definition": "A connection or series of connections linking two or more things; a central and most important point or place."}, {"word": "Preeminent", "definition": "Surpassing all others; very distinguished in some way, holding a superior position."}, {"word": "Divestment", "definition": "The action or process of selling off subsidiary business interests or investments, often for ethical or financial reasons."}, {"word": "Expedite", "definition": "To make an action or process happen sooner or be accomplished more quickly."}, {"word": "Imperative", "definition": "Of vital importance; crucial, or an urgent need or demand."}, {"word": "Exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}, {"word": "Judicial intervention", "definition": "The act of a court or judge becoming involved in a matter to resolve a dispute or enforce a law."}]}}, "questions": [{"q": "What is the main reason environmental groups are suing the Port of Rotterdam?", "a": "They want the port to cut its dependence on fossil fuel firms and become greener faster."}, {"q": "What is the Port of Rotterdam's significance in Europe?", "a": "It is Europe's biggest port and a major hub for global trade."}], "id": "a860c5a021c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c39y78rwrmno?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:51+09:00", "category": "business", "category_title": "Business"}, {"headline": "We saved £6,000 on holidays by swapping homes with strangers", "excerpt": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "levels": {"Beginner": {"text": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "vocab": []}, "Intermediate": {"text": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "vocab": []}, "Advanced": {"text": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "vocab": []}}, "questions": [], "id": "ac1c018dc47", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ce8kkerxz74o?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:38+09:00", "category": "business", "category_title": "Business"}, {"headline": "Pressure builds on Europe's biggest port to be greener", "excerpt": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "levels": {"Beginner": {"text": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "vocab": []}, "Intermediate": {"text": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "vocab": []}, "Advanced": {"text": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "vocab": []}}, "questions": [], "id": "a860c5a021c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c39y78rwrmno?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:51+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Home Swapping: A Smart Way to Save on Holidays", "excerpt": "Many people are now choosing to swap homes with strangers to enjoy affordable holidays and explore new places without high accommodation costs.", "levels": {"Beginner": {"text": "More and more people are finding a new way to go on holiday without spending too much money. They are swapping homes with other people. This means you stay in someone else's house for your holiday, and they stay in your house for theirs. It's like a big exchange.\n\nThe BBC News talked about this growing idea. People can save a lot of money, sometimes thousands of pounds, because they don't have to pay for a hotel or a rented flat. Instead, their place to stay is free. This makes holidays much cheaper.\n\nWhen you swap homes, you get to live like a local person. You can cook your own food and feel comfortable, just like in your own house. It's a fun and easy way to see new places. This trend is becoming popular because it helps families and friends travel more often. It's a smart choice for holidays.", "vocab": [{"word": "swap", "definition": "to give something and get something else in return."}, {"word": "holiday", "definition": "a time when you do not have to work or go to school, and can relax or travel."}, {"word": "save", "definition": "to keep money so that you can use it later, especially to buy something."}, {"word": "cost", "definition": "the amount of money needed to buy, do, or get something."}, {"word": "trend", "definition": "a general direction in which something is developing or changing."}, {"word": "comfortable", "definition": "feeling physically relaxed and free from pain."}]}, "Intermediate": {"text": "A growing number of travelers are discovering an innovative approach to vacationing: home swapping. This trend involves individuals or families exchanging their residences for a period, allowing them to enjoy holidays in new locations without the significant expense of hotels or rental properties. The BBC has highlighted this practice, noting its increasing popularity as a cost-effective travel solution that is gaining traction globally.\n\nThe core appeal of home swapping lies in its substantial financial benefits. By completely eliminating accommodation costs, travelers can achieve significant savings, often amounting to thousands of pounds or dollars per trip. These savings can then be allocated to other aspects of their holiday, such as activities, dining, or extended stays, making travel more accessible and frequent for many families and individuals. This economic advantage is particularly attractive in times of rising living costs.\n\nBeyond the financial advantages, home exchange offers a unique and authentic travel experience. Guests stay in a real home, often fully equipped with all the amenities of daily life, from kitchens to comfortable living spaces. This allows for a more immersive experience, enabling travelers to live like locals, shop at neighborhood markets, and explore areas beyond typical tourist zones. It provides a sense of comfort and familiarity that a hotel often cannot. Online platforms specifically designed for home exchange facilitate these arrangements, providing tools for matching homes, setting clear agreements, and building trust through detailed profiles, reviews, and secure messaging systems. While the idea of swapping homes with strangers might seem daunting to some, the structured nature of these platforms helps mitigate risks and fosters a community of like-minded travelers seeking genuine and affordable adventures. This method is transforming how many people plan and enjoy their getaways, offering both economic relief and enriching experiences.", "vocab": [{"word": "innovative", "definition": "introducing new ideas, methods, or ways of doing something."}, {"word": "significant", "definition": "important, large, or noticeable."}, {"word": "accommodation", "definition": "a place to live or stay, especially on holiday or for study."}, {"word": "authentic", "definition": "real, true, or genuine; not fake."}, {"word": "immersive", "definition": "providing a feeling of being completely involved in something."}, {"word": "facilitate", "definition": "to make an action or process easier."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}]}, "Advanced": {"text": "The burgeoning trend of home swapping is revolutionizing the travel industry, offering a compelling alternative to traditional holiday accommodation. As highlighted by BBC News, an increasing number of individuals and families are embracing the concept of exchanging residences, enabling them to explore diverse destinations without the prohibitive costs associated with hotels or short-term rentals. This practice is gaining unprecedented traction globally, driven by a confluence of economic pressures and a desire for more authentic and sustainable travel experiences.\n\nAt its heart, home exchange is a testament to financial prudence. By circumventing the need to pay for lodging, travelers can realize substantial savings, often amounting to thousands of currency units per trip. These considerable financial dividends can then be strategically reallocated towards enriching cultural activities, gourmet dining, or extending the duration of their sojourns. This economic advantage is particularly pertinent in an era of escalating living expenses and discretionary spending constraints, making international and domestic travel more attainable for a broader demographic.\n\nBeyond the fiscal benefits, home swapping offers a profound experiential dimension. Unlike the standardized offerings of hotels, staying in a private residence provides a unique window into local life. Guests are afforded the opportunity for genuine cultural immersion, living within a community, utilizing local amenities, and discovering hidden gems far removed from typical tourist trails. The comfort and familiarity of a fully equipped home – complete with kitchens, living areas, and often gardens – foster a sense of belonging and flexibility that is rarely found in commercial lodging. This allows for a more relaxed pace of travel, catering to families, remote workers, and those seeking a deeper connection with their temporary surroundings.\n\nThe operational framework for these exchanges has evolved significantly, moving from informal agreements to sophisticated online platforms. These dedicated websites and apps streamline the matching process, allowing users to create detailed profiles, specify their preferences, and browse a global inventory of homes. Crucially, these platforms incorporate robust mechanisms to foster trust and security, including comprehensive review systems, identity verification, and standardized exchange agreements. While the initial notion of entrusting one's home to a stranger might seem daunting, the established communities and protocols within these platforms effectively mitigate potential risks, cultivating a network of discerning travelers committed to mutual respect and shared experiences. This innovative model not only democratizes travel but also champions a more sustainable and community-oriented approach to exploring the world.", "vocab": [{"word": "burgeoning", "definition": "rapidly growing or developing; flourishing."}, {"word": "compelling", "definition": "powerfully evoking interest, attention, or admiration; irresistible."}, {"word": "prohibitive", "definition": "(especially of costs) so high as to prevent or deter most people from doing something."}, {"word": "unprecedented", "definition": "never having happened or existed before; without previous instance."}, {"word": "confluence", "definition": "a coming together of two or more things, typically ideas, events, or circumstances."}, {"word": "financial prudence", "definition": "the wise and careful management of money and resources."}, {"word": "cultural immersion", "definition": "the deep engagement with and absorption into a different culture, often by living within it."}, {"word": "discerning", "definition": "having or showing good judgment and understanding; perceptive."}]}}, "questions": [{"q": "What is the primary benefit of home swapping for holidays?", "a": "The primary benefit of home swapping is saving a significant amount of money on accommodation costs, as travelers do not have to pay for hotels or rental properties."}, {"q": "Besides saving money, what other advantages does home swapping offer to travelers?", "a": "Beyond financial savings, home swapping offers an authentic and immersive travel experience, allowing travelers to live like locals, enjoy the comfort of a fully equipped home, and explore areas beyond typical tourist spots."}], "id": "ac1c018dc47", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ce8kkerxz74o?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:38+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US and Iran Exchange Strikes Amidst Regional Tensions", "excerpt": "The United States and Iran have recently exchanged military strikes, leading to casualties and increasing regional tensions.", "levels": {"Beginner": {"text": "The United States and Iran have been involved in recent attacks. The US military, through a group called Centcom, said it hit many targets. These targets were linked to Iran. Centcom stated it attacked 90 different places. These attacks happened in the Middle East.\n\nSadly, these events have caused people to die. Iran's health ministry reported that 14 people have been killed. These deaths happened since Tuesday. This shows that the situation between the US and Iran is difficult. Both sides have taken action. The US says its attacks are a response to earlier actions. These actions make the region more tense. People are worried about what might happen next. It is important for countries to talk and find peaceful ways to solve problems. This news highlights the ongoing challenges in the area.", "vocab": [{"word": "attacks", "definition": "acts of violence or fighting."}, {"word": "targets", "definition": "places or things chosen to be hit or attacked."}, {"word": "killed", "definition": "caused someone to die."}, {"word": "military", "definition": "the armed forces of a country."}, {"word": "tensions", "definition": "feelings of anger or worry between people or countries."}, {"word": "region", "definition": "a large area of a country or the world."}]}, "Intermediate": {"text": "The United States and Iran have recently engaged in a series of military strikes, escalating tensions in the Middle East. The U.S. Central Command (CENTCOM) announced that its forces conducted retaliatory strikes against 90 targets linked to Iran. These targets were reportedly associated with Iran's Islamic Revolutionary Guard Corps (IRGC) and its affiliated militia groups. The strikes aimed at facilities used for command and control, intelligence, missile and drone storage, and logistics.\n\nThese actions by the U.S. come in response to recent attacks on U.S. personnel in the region. Meanwhile, Iran's health ministry has reported a tragic outcome, stating that 14 people have been killed since Tuesday due to these ongoing hostilities. The exact locations of these casualties were not specified in the initial reports, but they underscore the human cost of the escalating conflict.\n\nThe situation reflects a dangerous cycle of action and reaction between Washington and Tehran. The U.S. maintains that its strikes are defensive, intended to deter further aggression and protect its forces. However, Iran views such actions as a violation of sovereignty and a threat to regional stability. International observers are closely monitoring the developments, expressing concerns that the tit-for-tat exchanges could further destabilize an already volatile region. The continued exchange of strikes highlights the deep-seated animosity and the complex geopolitical challenges facing the Middle East.", "vocab": [{"word": "engaged", "definition": "involved in an activity."}, {"word": "retaliatory", "definition": "done as a response to an attack or injury."}, {"word": "affiliated", "definition": "officially attached or connected to an organization."}, {"word": "casualties", "definition": "people killed or injured in a war or accident."}, {"word": "escalating", "definition": "increasing rapidly in intensity."}, {"word": "deter", "definition": "discourage someone from doing something by instilling doubt or fear."}, {"word": "volatile", "definition": "likely to change rapidly and unpredictably, especially for the worse."}]}, "Advanced": {"text": "The geopolitical landscape of the Middle East has been further destabilized by a recent surge in military exchanges between the United States and Iran, marking a significant escalation of long-standing tensions. The U.S. Central Command (CENTCOM) confirmed it executed a substantial series of retaliatory strikes, targeting approximately 90 sites associated with Iran's Islamic Revolutionary Guard Corps (IRGC) and its various proxy militia groups across the region. These precision strikes reportedly hit command and control centers, intelligence facilities, missile and drone storage depots, and logistical infrastructure, all critical components supporting the operational capabilities of these Iranian-backed entities.\n\nThese robust U.S. actions were undertaken in direct response to a recent deadly drone attack on a U.S. military outpost, which resulted in the deaths of American service members. Washington has consistently stated its intent to protect its personnel and assets in the region, viewing these strikes as a necessary measure to re-establish deterrence and prevent further aggression. Conversely, the Iranian Health Ministry has issued a grim report, confirming that 14 individuals have been killed since Tuesday amidst these heightened hostilities. While the specific locations and circumstances of these fatalities remain somewhat ambiguous in initial reports, they undeniably underscore the tragic human cost inherent in this ongoing cycle of violence.\n\nThe timing of these intensified exchanges coincides with a period of heightened regional sensitivity, including significant internal events within Iran. Analysts suggest that both sides are navigating a precarious balance, aiming to project strength and resolve without inadvertently triggering a broader, unmanageable conflict. The intricate web of alliances and rivalries in the Middle East means that such direct confrontations carry substantial risks of wider regional ramifications, potentially drawing in other state and non-state actors. Diplomatic efforts, though often fraught, are seen as crucial to de-escalate the situation and prevent a full-scale conflagration. The persistent belligerent posturing from both Washington and Tehran continues to fuel concerns among international observers about the long-term stability of an already volatile and strategically vital part of the world.", "vocab": [{"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "retaliatory", "definition": "characterized by an act of returning an injury or wrong."}, {"word": "proxy", "definition": "a person or entity authorized to act on behalf of another; in this context, groups supported by a state to fight its battles indirectly."}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., buildings, roads, power supplies) needed for the operation of a society or enterprise."}, {"word": "deterrence", "definition": "the action of discouraging an action or event through instilling doubt or fear of the consequences."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}, {"word": "belligerent", "definition": "hostile and aggressive; showing a readiness to fight."}, {"word": "conflagration", "definition": "an extensive and destructive fire; used metaphorically for a large-scale conflict."}]}}, "questions": [{"q": "What U.S. military command stated it hit 90 targets?", "a": "The U.S. Central Command (CENTCOM) reported hitting 90 targets."}, {"q": "How many people did I const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
