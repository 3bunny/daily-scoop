 earlier this month that Bautista was in talks to play […]", "vocab": []}}, "questions": [], "id": "a36b2c31576", "source": "Variety", "link": "https://variety.com/2026/tv/news/dave-bautista-kratos-god-of-war-tv-series-amazon-1236839394/", "published": "2026-08-21T07:00:00+09:00", "category": "entertainment"}, {"headline": "Breakaway Music Festival returns to Palladium Aug. 21 and 22 - Worcester Magazine", "excerpt": "Breakaway Music Festival returns to Palladium Aug. 21 and 22 Worcester Magazine", "levels": {"Beginner": {"text": "Breakaway Music Festival returns to Palladium Aug. 21 and 22 Worcester Magazine", "vocab": []}, "Intermediate": {"text": "Breakaway Music Festival returns to Palladium Aug. 21 and 22 Worcester Magazine", "vocab": []}, "Advanced": {"text": "Breakaway Music Festival returns to Palladium Aug. 21 and 22 Worcester Magazine", "vocab": []}}, "questions": [], "id": "a751c2d2e87", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi4gFBVV95cUxOWDRiYm5ZUDNjMU81dVRZaDhMWW1ROEJrZ1NCalRZWXY3RG5wY1lNZ1ZWRVJXNDFsYlU3ck9BUmFXN1ZzbmtGX0RIYlczYkZtM1NMV0hvYnZxOFZJU3drWHBlNWs0LWFscTJXNTNPSldQeE5EdHJscFdWVFpNNE53ZE95cE9mcVk1MzhRbkxrUGVMSXZfcnNhSzA5OFhrM2dGbDZ4c3hUUXItTG9CeVlZZ01BNU5sZjlPa3gtWnRuMS1iM3NrT2R0dm5hUWNoOVMwdjBiZzMycG9JY2h1YmJKcVZB?oc=5", "published": "2026-08-21T06:58:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Rick Jackson Details Plan to Separate Business from State if Elected", "excerpt": "Rick Jackson details his plan to separate private business from state affairs if elected, aiming to prevent conflicts of interest.", "levels": {"Beginner": {"text": "Rick Jackson is a person who wants to be elected to a government job. He has a business. If people vote for him and he wins, he says he will change how his business works with the state government. He wants to \"unwind\" it. This means he will stop his business from doing work with the state. He is doing this to avoid a problem called a \"conflict of interest.\" A conflict of interest happens when a person's private business could make money from their government job. Rick Jackson wants to make sure his decisions as a government leader are fair for everyone. He does not want his own business to get special help. He explained his plan to make sure this does not happen. This is important so people can trust their leaders.", "vocab": [{"word": "elected", "definition": "chosen by a vote for a job."}, {"word": "business", "definition": "a company that sells things or services."}, {"word": "state", "definition": "the government of a region in a country."}, {"word": "avoid", "definition": "to stay away from something."}, {"word": "plan", "definition": "a set of actions to do something."}, {"word": "trust", "definition": "believing that someone is honest and good."}]}, "Intermediate": {"text": "Rick Jackson, a candidate seeking election to a state office, has outlined his intentions regarding his private business interests should he be successful. He has stated his plan to \"unwind\" his company's existing or potential dealings with the state government if he wins. This move is designed to prevent what are known as conflicts of interest. A conflict of interest occurs when a public official's personal financial situation could influence their decisions in office, potentially leading to unfair advantages for their own business or perceived favoritism.\n\nJackson's explanation aims to assure voters that his focus, if elected, will be solely on public service and the welfare of the state's citizens. By separating his business operations from state affairs, he seeks to establish a clear ethical boundary. This is a common and important concern for candidates who own businesses, as the public expects transparency and impartiality from its leaders. Many citizens worry that politicians might use their power to benefit their own companies or those of their associates, rather than making decisions that are best for everyone.\n\nHis commitment to unwinding these connections demonstrates an effort to uphold the integrity of the office he is seeking. He detailed how he plans to manage this transition, ensuring that his role as a public servant remains uncompromised by private financial considerations. This proactive approach is crucial for building and maintaining public trust in government, showing that he prioritizes the public good above personal gain. Such measures are often seen as vital for good governance, ensuring that decisions are made based on merit and public benefit, rather than private profit. It's a standard practice for many elected officials to divest from or distance themselves from their business ventures to avoid even the appearance of impropriety, reinforcing the principle that public office is a public trust.", "vocab": [{"word": "candidate", "definition": "a person trying to be elected to a position."}, {"word": "intentions", "definition": "plans or aims; what someone means to do."}, {"word": "potential", "definition": "possible in the future; capable of becoming something."}, {"word": "conflicts of interest", "definition": "situations where a person's private gain could affect their official decisions."}, {"word": "transparency", "definition": "the quality of being open and clear about actions and decisions."}, {"word": "impartiality", "definition": "treating all people or groups equally; not favoring one over another."}, {"word": "governance", "definition": "the way a country, state, or organization is managed or ruled."}]}, "Advanced": {"text": "Rick Jackson, a prominent political candidate vying for a state office, has proactively addressed a critical ethical concern often raised when individuals with significant private sector holdings seek public office. He has articulated a comprehensive strategy to \"unwind\" his business relationships with the state government if he secures election. This initiative is designed to preemptively mitigate potential conflicts of interest, a cornerstone of ethical governance. The core principle is to ensure that official policy decisions and state contracts are not perceived as, or actually, benefiting his personal financial portfolio.\n\nPublic scrutiny of candidates' financial entanglements is intense, particularly in an era demanding heightened transparency from elected officials. Jackson's proposed measures aim to establish an impermeable barrier between his private commercial ventures and his public duties. He detailed the mechanisms he intends to employ, which could range from divesting certain assets, placing others into a blind trust, or recusing himself from any governmental decisions directly impacting his former business interests. This commitment is crucial for fostering public confidence and upholding the integrity of the office.\n\nThe history of American politics is replete with instances where real or perceived conflicts of interest have eroded public trust, underscoring the importance of such proactive disclosures. By clearly outlining his plan, Jackson seeks to reassure the electorate that his focus, if elected, will be solely on public service, unburdened by private financial considerations. This move is a strategic effort to demonstrate a commitment to ethical standards and to avoid any appearance of impropriety, which can be just as damaging to public trust as actual misconduct. It aligns with best practices for public officials to create a clear separation between their personal financial interests and their governmental responsibilities, thereby safeguarding the impartiality of their decisions and the fairness of public administration. This commitment is often a key differentiator for voters evaluating candidates' suitability for high office.\n\nFurthermore, the concept of \"unwinding\" business ties is not merely about avoiding direct financial gain, but also about preventing the subtle influence that prior business relationships might exert. Even without direct contracts, a public official's past connections could create an environment where certain businesses receive preferential treatment, or where policies are inadvertently shaped to favor specific industries in which the official once had a stake. Jackson's explicit declaration aims to dispel such concerns, signaling a clear intent to prioritize the public good above all else. This level of transparency and commitment to ethical boundaries is increasingly expected by an informed populace, who are wary of the potential for corruption or self-serving agendas within government. His detailed explanation serves to build a foundation of trust, a vital component for any successful political tenure, and sets a precedent for accountability in public service.", "vocab": [{"word": "proactively", "definition": "taking action to prevent something from happening, rather than reacting to it."}, {"word": "articulated", "definition": "expressed or stated clearly and effectively."}, {"word": "preemptively", "definition": "done as a measure against something possible, anticipated, or feared; to prevent it."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}, {"word": "cornerstone", "definition": "an essential, indispensable, or fundamental part or principle."}, {"word": "scrutiny", "definition": "careful and critical examination or observation."}, {"word": "divesting", "definition": "selling off assets, investments, or property."}, {"word": "electorate", "definition": "all the people in a country or area who are entitled to vote in an election."}]}}, "questions": [{"q": "What is Rick Jackson planning to do with his business if he is elected?", "a": "He plans to separate or \"unwind\" his business dealings with the state government."}, {"q": "Why is it important for a politician to separate their business interests from their public office?", "a": "It is important to avoid conflicts of interest, ensure fair decisions, prevent personal financial gain from influencing public policy, and maintain public trust."}], "id": "a9c1d1cb22f", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi8AFBVV95cUxNRHhWeFlaSi1UWHduWFRyVTBWU2tGeUFBYXdlaUhfVFhTZnVuaWYyYUNSa1lRUmwwbzdtU2NaYjYwVmI3Q052YTN6Z2hsSjVoX2lEblE4OWp2S3dQMVBmMnFWaFd6bHlEUU1KV3c2ZmFoMkFUZWt3dDRhekVSblktZ2F2ZzZIMUk2ZmJVQXVLRmstdUVjaEstUF9qT2JtSk5XRVUzdkM2ckpqOW95V2k2TmdBcmNvY1B2MjZkLUhLWHMxM1VLM0RnbHJkd3N1REhoSXBZdVptNU9oZmRwZWtyUkhyXzdfWHdnbXd5bUM4N2c?oc=5", "published": "2026-08-21T07:08:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Lexington Fire: How Nearby Buildings Were Saved", "excerpt": "Three months after a major fire in Uptown Lexington, effective fire safety measures and quick response saved nearby buildings.", "levels": {"Beginner": {"text": "Three months ago, there was a big fire in Uptown Lexington. It was a very serious fire. Many buildings were close to where the fire started. People worried that the fire would spread to other shops and homes.\n\nBut good news! The fire did not spread to the buildings nearby. This was because of a few important things. First, firefighters worked very hard and very fast. They came quickly and fought the flames to stop them.\n\nAlso, the buildings had good safety rules. These rules mean buildings are made with special materials that do not burn easily. They also have special walls called firewalls that help stop fire from moving from one building to another. Because of these rules and the brave firefighters, many buildings were kept safe. This shows how important it is to have good fire safety in our towns.", "vocab": [{"word": "fire", "definition": "Flames and heat that destroy things."}, {"word": "spread", "definition": "To move and cover a larger area."}, {"word": "nearby", "definition": "Close to something."}, {"word": "rules", "definition": "Instructions that tell you what you can or cannot do."}, {"word": "safe", "definition": "Not in danger or harmed."}, {"word": "important", "definition": "Having a lot of meaning or value."}]}, "Intermediate": {"text": "Three months have passed since a significant fire broke out in Uptown Lexington. The blaze caused considerable damage to the building where it originated. However, despite its intensity and the close proximity of other structures in the downtown area, the fire remarkably did not spread to adjacent buildings.\n\nThis successful containment is attributed to a combination of crucial factors. Firstly, the Lexington Fire Department responded swiftly and effectively. Their rapid deployment and strategic efforts were instrumental in controlling the flames and preventing them from jumping to neighboring properties.\n\nSecondly, modern building codes and construction practices played a vital role. These regulations often mandate the use of fire-resistant materials in construction. More importantly, many buildings are designed with firewalls. Firewalls are special barriers built into structures to prevent the passage of fire and smoke for a specific period, effectively compartmentalizing a building or separating it from others.\n\nThis incident highlights the importance of robust fire safety regulations and a well-prepared emergency response system in protecting urban centers. It demonstrates how investing in proper building standards and a capable fire department can prevent widespread destruction and safeguard a community's infrastructure.", "vocab": [{"word": "significant", "definition": "Important or noticeable."}, {"word": "originated", "definition": "Began or started at a particular place."}, {"word": "adjacent", "definition": "Next to or adjoining something else."}, {"word": "attributed", "definition": "Regarded as belonging to or caused by."}, {"word": "crucial", "definition": "Extremely important or necessary."}, {"word": "mandate", "definition": "To officially require or order something."}, {"word": "robust", "definition": "Strong and healthy; able to withstand difficult conditions."}]}, "Advanced": {"text": "Three months have elapsed since a major conflagration erupted in Uptown Lexington, yet the aftermath serves as a compelling testament to effective urban fire resilience rather than widespread devastation. Despite the intensity of the blaze, which caused substantial damage to its originating structure, its containment within that property, preventing propagation to adjacent buildings, underscores a confluence of critical preventative measures and rapid emergency intervention.\n\nKey among these protective elements are contemporary building codes, which rigorously mandate the incorporation of fire-resistant materials and sophisticated compartmentalization strategies. Robust firewalls, for instance, are architectural safeguards engineered to impede the horizontal and vertical spread of flames and smoke, thereby buying crucial time for evacuation and allowing firefighters to establish effective suppression perimeters. These structural components are often designed to withstand extreme temperatures for specified durations, acting as crucial barriers in a dense urban fabric.\n\nFurthermore, the swift and coordinated response of the Lexington Fire Department was indispensable. Their strategic deployment of resources, including specialized equipment and personnel, coupled with aggressive suppression tactics, was pivotal in preventing the fire from breaching established firebreaks and escalating into a wider urban inferno. The department's preparedness and training are vital in mitigating the potential for catastrophic loss.\n\nUrban planning principles also play a significant role. Thoughtful building separation, adherence to setback requirements, and the maintenance of accessible routes for emergency vehicles contribute significantly to mitigating fire risk in densely populated areas. These elements collectively enhance a city's capacity to manage and recover from such incidents.\n\nThis event offers a compelling case study in the efficacy of proactive fire safety infrastructure and a well-drilled emergency services framework. It reinforces the ongoing necessity for communities to invest in and rigorously enforce building standards, ensuring the long-term safety, economic vitality, and historical preservation of their downtown cores against the persistent threat of urban fires.", "vocab": [{"word": "conflagration", "definition": "An extensive and destructive fire."}, {"word": "testament", "definition": "Proof or evidence that something exists or is true."}, {"word": "propagation", "definition": "The action of spreading or being spread."}, {"word": "confluence", "definition": "A coming together of two or more things."}, {"word": "mandate", "definition": "To officially require or order something; to give official permission for something to happen."}, {"word": "compartmentalization", "definition": "The division of something into separate sections or categories, especially to prevent spread."}, {"word": "indispensable", "definition": "Absolutely necessary or essential."}, {"word": "efficacy", "definition": "The ability to produce a desired or intended result; effectiveness."}]}}, "questions": [{"q": "What happened in Uptown Lexington three months ago?", "a": "A big fire happened in Uptown Lexington."}, {"q": "What are some things that helped stop the fire from spreading to other buildings?", "a": "Firefighters, good building rules, fire-resistant materials, and firewalls helped stop the fire from spreading."}], "id": "a98c3817bf5", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirwFBVV95cUxPR3FNQWpfa1V4ZTR3WU1CU2FBQWloV2pETHJ4VV81UER1cGlQUDFqTGhqdTMxdlRCQnFCLVBicko1d0NVQzVING9NYVh0N2UyU0xvbF9NWTd4RTk2cmxvQm9QdVlhdW9nMkY5azJodlh4TTNCUlFJZ1N4T29pSDRPZWswM1ZyQnlZcHZIcWUzXzJlOGpmdUt1T3Q5YmlNb3lrSEoydG83S1RWQXlUVXc4?oc=5", "published": "2026-08-21T06:58:42+09:00", "category": "business", "category_title": "Business"}, {"headline": "Central Coast Police Hunt Bicyclist Bank Robber", "excerpt": "Authorities on the Central Coast are actively searching for a suspect who robbed a local bank while using a bicycle as their getaway vehicle.", "levels": {"Beginner": {"text": "Police on the Central Coast are looking for a person. This person robbed a bank recently. The robber used a bicycle to get away after taking money from the bank. This happened in a local community. Police are working hard to find the person who did this. They are asking people in the area to help. If you saw anything strange or someone on a bike acting suspiciously near a bank, please tell the police. The police want to keep everyone safe. They are checking security cameras from the bank and nearby places. They hope these cameras will show them who the robber is. Finding a robber who used a bike is a bit unusual for police. They are patrolling the area more to make sure people feel safe. It is important for the community to work with the police to solve this crime. They want to catch the robber quickly.", "vocab": [{"word": "Police", "definition": "People whose job is to make sure laws are followed and to catch criminals."}, {"word": "Robbed", "definition": "Took money or property illegally from a place or person."}, {"word": "Bank", "definition": "A place where people keep their money and can borrow money."}, {"word": "Bicycle", "definition": "A vehicle with two wheels, moved by pushing pedals with your feet."}, {"word": "Searching", "definition": "Looking very carefully for something or someone."}, {"word": "Suspect", "definition": "A person who police think might have committed a crime."}]}, "Intermediate": {"text": "Police on California's Central Coast are conducting an intensive search for an individual who recently robbed a local bank. The suspect, reportedly a bicyclist, used a bike as their escape vehicle after the incident. The robbery occurred at a bank branch in a quiet Central Coast community, though the exact location has not been publicly released by authorities. Law enforcement confirmed that the incident took place yesterday afternoon. The suspect entered the bank, demanded money from a teller, and then fled the scene on a bicycle with an undisclosed amount of cash. Fortunately, no injuries were reported among bank employees or customers during the robbery. Local police departments, possibly collaborating with federal agencies, are actively involved in the investigation. They are reviewing surveillance footage from the bank and surrounding businesses, hoping to identify the individual responsible. Police are also increasing patrols in the area to reassure residents and are urging anyone with information to come forward. While a detailed description of the suspect is still vague, initial reports suggest they were wearing dark clothing and possibly a helmet. The use of a bicycle as a getaway vehicle is somewhat uncommon for bank robberies, making this case distinctive. The public's cooperation is crucial in helping officers apprehend the suspect and maintain community safety.", "vocab": [{"word": "Intensive", "definition": "Involving a lot of effort or activity in a short period."}, {"word": "Suspect", "definition": "A person believed to have committed a crime."}, {"word": "Getaway vehicle", "definition": "A vehicle used to escape quickly after committing a crime."}, {"word": "Undisclosed", "definition": "Not revealed or made known to the public."}, {"word": "Surveillance footage", "definition": "Video recordings from security cameras, often used for monitoring."}, {"word": "Apprehend", "definition": "To catch and arrest someone who has committed a crime."}, {"word": "Crucial", "definition": "Extremely important or necessary."}]}, "Advanced": {"text": "Law enforcement agencies across California's Central Coast have initiated a comprehensive manhunt for an individual responsible for a recent bank robbery, notable for the suspect's unconventional choice of a bicycle as a getaway vehicle. The incident, which unfolded yesterday afternoon at a local financial institution in a seemingly tranquil Central Coast community, has prompted heightened vigilance among residents and a robust response from authorities.\n\nAccording to preliminary reports, the unidentified suspect entered the bank branch, presented a demand for funds, and subsequently absconded with an undisclosed sum of cash. Fortunately, no physical injuries were sustained by bank employees or customers during the brief but alarming encounter. The suspect was last seen fleeing the scene on a bicycle, a detail that has added a unique dimension to the ongoing investigation.\n\nLocal police departments, potentially in conjunction with federal agencies like the FBI, are meticulously piecing together evidence. This includes an exhaustive review of surveillance footage from the bank's internal cameras and external security systems, as well as those from neighboring businesses along potential escape routes. Investigators are also canvassing the area, interviewing witnesses, and seeking any pertinent information that could lead to the identification and apprehension of the perpetrator.\n\nThe use of a bicycle, while seemingly less efficient than a motor vehicle for a quick escape, presents distinct challenges for law enforcement. Bicycles can navigate narrow pathways, blend more easily into urban or suburban environments, and are less conspicuous than cars, especially in areas with extensive bike paths. This mode of escape might suggest a suspect familiar with the local terrain or one attempting to deliberately complicate pursuit.\n\nCommunity leaders and law enforcement officials are urging the public to remain vigilant but not unduly alarmed. Increased police patrols are visible throughout the affected areas, aiming to reassure residents and deter further criminal activity. Authorities have emphasized the critical role of public assistance in such investigations, encouraging anyone who may have observed suspicious activity or individuals matching a general description (e.g., dark clothing, helmet, backpack) to contact them immediately. While specific details about the suspect's appearance remain limited, any piece of information, no matter how minor it seems, could prove instrumental in solving the case. The swift resolution of such crimes is paramount to maintaining public trust and safety within the community.", "vocab": [{"word": "Comprehensive", "definition": "Including all or nearly all elements or aspects of something; complete."}, {"word": "Unconventional", "definition": "Not based on or conforming to what is generally done or believed; unusual."}, {"word": "Tranquil", "definition": "Free from disturbance; calm and peaceful."}, {"word": "Absconded", "definition": "Left hurriedly and secretly, typically to avoid detection of or arrest for an unlawful action."}, {"word": "Meticulously", "definition": "In a way that shows great attention to detail; very thoroughly and carefully."}, {"word": "Canvassing", "definition": "To thoroughly survey an area or interview people to gather information or opinions."}, {"word": "Instrumental", "definition": "Serving as a means of pursuing an aim or policy; essential or crucial."}, {"word": "Paramount", "definition": "More important than anything else; supreme."}]}}, "questions": [{"q": "What kind of vehicle did the robber use to escape from the bank?", "a": "The robber used a bicycle to escape."}, {"q": "What are the police doing to try and find the robber?", "a": "The police are searching, reviewing surveillance footage, increasing patrols, and asking the public for any information or assistance."}], "id": "a6484e3edf5", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimgFBVV95cUxOMm9XcVE0b29CSHpVekdpQjJ5OW90R3I3LXd3c2hkc25UZk9JdjJVRHB6a1BNZk1iY2F3LWtlUmtDUlJjOFIxNWdjdTIzQlpmRXBNdWlNdWpPYXJ1U1NleVkxc0YwdUFRY3ljTmFzOFh2aUpDcGIwX0JfV09PNzM2RXVCQmdfTDBNczJFY1FFT1MxR1lMLU84bk9B?oc=5", "published": "2026-08-21T07:15:57+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "FBI Raids Home of Former US Rep. Eric Swalwell in Assault Probe", "excerpt": "Former U.S. Representative Eric Swalwell faces federal investigation into sexual assault allegations, following FBI raids and device seizures.", "levels": {"Beginner": {"text": "Former US Representative Eric Swalwell is in the news. The FBI is looking into him. This is a big police group in the United States.\n\nLast Saturday, FBI agents took phones and computers from Mr. Swalwell. This happened at an airport in San Francisco. The next day, Sunday, they went to his house in Washington, D.C. They searched his home. This is called a raid.\n\nWhy are they doing this? It is part of a federal investigation. This means the government is checking something serious. Mr. Swalwell is accused of sexual assault. These are very serious claims. He left his job as a representative in April because of these accusations.\n\nCNN reported this news. They said sources close to the investigation shared the information.\n\nNow, other groups are also looking into Mr. Swalwell. The Manhattan District Attorney’s Office is one. The Los Angeles Sheriff’s Department is another. They have also started their own investigations.\n\nSo, Mr. Swalwell is facing investigations from different places. These investigations are about the sexual assault allegations.", "vocab": [{"word": "Representative", "definition": "A person chosen to speak or act for a group of people."}, {"word": "FBI", "definition": "A main police group in the United States."}, {"word": "Seized", "definition": "Took something quickly and by force."}, {"word": "Raid", "definition": "A sudden visit by police to search a place."}, {"word": "Accused", "definition": "Said someone did something wrong."}, {"word": "Allegations", "definition": "Claims that someone has done something wrong, but not yet proven."}]}, "Intermediate": {"text": "Former U.S. Representative Eric Swalwell is currently the subject of multiple investigations following serious allegations. The Federal Bureau of Investigation (FBI) has taken significant steps in a federal probe related to sexual assault claims against him.\n\nAccording to reports from CNN, FBI agents seized electronic devices from Mr. Swalwell at the San Francisco airport last Saturday. The following day, Sunday, authorities conducted a raid on his home in Washington, D.C. These actions are part of a broader federal investigation.\n\nSources familiar with the investigation told CNN that the probe centers on sexual assault allegations. These accusations ultimately led Mr. Swalwell, a Democrat representing California’s Bay Area, to resign from his position in Congress in April. His resignation came amidst growing pressure and scrutiny surrounding the claims.\n\nThe FBI's involvement signifies a serious legal inquiry, as the agency handles major federal crimes. The seizure of devices and the raid on his residence indicate that investigators are actively gathering evidence as part of their ongoing work.\n\nBeyond the federal investigation, other law enforcement agencies have also initiated their own inquiries. The Manhattan District Attorney’s Office and the Los Angeles Sheriff’s Department have both opened criminal investigations into Mr. Swalwell. This means he is now facing scrutiny from state and local authorities in addition to the federal government.\n\nThese overlapping investigations highlight the gravity of the allegations. Mr. Swalwell has not yet publicly commented on these specific new developments regarding the FBI actions, but the legal process is clearly moving forward on several fronts.", "vocab": [{"word": "Subject", "definition": "A person or thing being discussed or investigated."}, {"word": "Allegations", "definition": "Claims or statements that someone has done something wrong, often without proof yet."}, {"word": "Probe", "definition": "A thorough investigation into a crime or other matter."}, {"word": "Conducted", "definition": "Organized and carried out an activity."}, {"word": "Resign", "definition": "To formally leave a job or position."}, {"word": "Scrutiny", "definition": "Careful and close examination or observation."}, {"word": "Initiated", "definition": "Began or started something."}]}, "Advanced": {"text": "Former U.S. Representative Eric Swalwell, a Democrat who previously represented California’s Bay Area, is facing intensified legal scrutiny as federal and local authorities advance investigations into sexual assault allegations that prompted his resignation from Congress earlier this year. The Federal Bureau of Investigation (FBI) has reportedly taken significant enforcement actions, signaling a deepening federal probe.\n\nAccording to detailed reports from CNN, FBI agents executed a seizure of electronic devices from Mr. Swalwell at the San Francisco International Airport last Saturday. This was followed by a raid on his Washington, D.C., residence the subsequent day. These coordinated actions underscore the gravity of the ongoing federal investigation, which sources familiar with the inquiry have confirmed is centered on the sexual assault allegations.\n\nThese accusations surfaced publicly and generated considerable controversy, ultimately leading to Mr. Swalwell’s departure from his congressional seat in April. While the specific details of the allegations remain largely undisclosed to the public, the FBI’s direct involvement, including the collection of digital evidence and a physical search of his property, indicates a substantive phase in the investigative process. The FBI, as the primary federal investigative agency, typically becomes involved in cases that involve potential federal crimes or cross-state jurisdictions, lending significant weight to the seriousness of the matter.\n\nThe legal challenges for Mr. Swalwell are not confined to the federal level. Both the Manhattan District Attorney’s Office and the Los Angeles Sheriff’s Department have independently launched their own criminal investigations. This multi-jurisdictional approach means Mr. Swalwell is now contending with potential legal proceedings from various governmental bodies, each pursuing its own line of inquiry into the allegations. Such parallel investigations are common in high-profile cases, especially when alleged incidents may have occurred in different locations or involve different legal statutes.\n\nThe former congressman has not yet issued a public statement specifically addressing these recent FBI actions. His resignation statement in April alluded to a desire to focus on his family and personal matters, but did not directly address the specifics of the allegations. The unfolding developments suggest that the legal ramifications of the accusations are becoming increasingly pronounced, potentially leading to formal charges as evidence is meticulously gathered and reviewed by prosecutors. The outcome of these intricate investigations will undoubtedly have significant implications for Mr. Swalwell’s future and could set precedents for how public figures are held accountable for serious personal misconduct.", "vocab": [{"word": "Intensified", "definition": "Became stronger or more extreme."}, {"word": "Scrutiny", "definition": "Critical observation or examination."}, {"word": "Executed", "definition": "Carried out or performed (an action or order)."}, {"word": "Subsequent", "definition": "Coming after something in time; following."}, {"word": "Underscore", "definition": "Emphasize the importance of something."}, {"word": "Substantive", "definition": "Having a firm basis in reality and therefore important, meaningful, or considerable."}, {"word": "Multi-jurisdictional", "definition": "Involving or extending over several different legal or administrative areas."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}]}}, "questions": [{"q": "What is the main reason former U.S. Representative Eric Swalwell is under investigation?", "a": "He is under investigation for sexual assault allegations."}, {"q": "Which law enforcement agencies, besides the FBI, have also opened investigations into Mr. Swalwell?", "a": "The Manhattan District Attorney’s Office and the Los Angeles Sheriff’s Department."}], "id": "ab3c1d4a30d", "source": "Economics | The Guardian", "link": "https://www.theguardian.com/us-news/live/2026/aug/20/donald-trump-national-debt-borrowing-record-michael-cohen-canada-iran-latest-news-updates", "published": "2026-08-21T07:12:27+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Fishermen Rescued After Five Days Adrift in Cool Box", "excerpt": "Two fishermen were miraculously found alive after spending five days lost at sea off the coast of Mexico, surviving inside a cool box.", "levels": {"Beginner": {"text": "Two fishermen were lost at sea. Their names are not known, but they are 53 and 32 years old. They went fishing on August 14. Their boat was far from the coast of Mexico, about 75 miles away. They lost contact with their fishing group.\n\nFor five days, the men were alone in the big ocean. They were adrift, meaning their boat was just floating without power. It was a very dangerous time. The ocean can be cold, and there is no fresh water to drink. They had to be very strong to survive.\n\nWhat helped them stay safe? They used a cool box. A cool box is like a big plastic container, often used to keep food and drinks cold. It helped them stay together and perhaps offered some protection from the sun and waves. After five long days, people found them. They were rescued and brought back to land. Everyone was happy they were safe after such a difficult time at sea.", "vocab": [{"word": "lost", "definition": "unable to find the way; not knowing where you are."}, {"word": "adrift", "definition": "floating without being tied or steered."}, {"word": "dangerous", "definition": "not safe; likely to cause harm."}, {"word": "survive", "definition": "to stay alive, especially in a difficult situation."}, {"word": "cool box", "definition": "a container used to keep things cold, often for picnics."}, {"word": "rescued", "definition": "saved from danger or a difficult situation."}]}, "Intermediate": {"text": "Two Mexican fishermen, aged 53 and 32, have been rescued after an extraordinary five-day ordeal adrift in the Pacific Ocean. Their incredible story of survival began on August 14 when they lost contact with their fishing cooperative. They were approximately 75 miles off the coast of Mexico when their vessel encountered trouble, leaving them stranded in the vast expanse of the sea.\n\nThe men's fishing boat, which was likely small, became disabled, leaving them without power or direction. The ocean is a perilous place, and being adrift for several days poses severe risks, including dehydration, exposure to the elements, and hypothermia, especially during cooler nights. However, the two fishermen demonstrated remarkable resourcefulness.\n\nThey managed to stay together and find refuge inside a cool box – a large, insulated container typically used for storing food and ice. This simple item became their makeshift life raft, offering some protection from the sun's harsh rays and the relentless ocean waves. It likely helped them conserve body heat and provided a small, stable platform in the otherwise turbulent waters.\n\nAfter five agonizing days of uncertainty, a search and rescue operation successfully located the men. The details of their rescue, such as which vessel found them, were not immediately released, but the news brought immense relief to their families and the local fishing community. Their safe return highlights the dangers faced by those who work at sea and the importance of maritime safety protocols.", "vocab": [{"word": "ordeal", "definition": "a very unpleasant and difficult experience."}, {"word": "cooperative", "definition": "a business or organization owned and managed by the people who work in it or use its services."}, {"word": "stranded", "definition": "left without the means to move from somewhere."}, {"word": "perilous", "definition": "full of danger or risk."}, {"word": "dehydration", "definition": "a dangerous lack of water in the body."}, {"word": "resourcefulness", "definition": "the ability to find quick and clever ways to overcome difficulties."}, {"word": "refuge", "definition": "a safe place or shelter from danger."}]}, "Advanced": {"text": "In a remarkable testament to human resilience and ingenuity, two Mexican fishermen, aged 53 and 32, have been successfully rescued after enduring a harrowing five-day ordeal adrift in the unforgiving expanse of the Pacific Ocean. Their incredible saga of survival began on August 14, when they lost all contact with their fishing cooperative, approximately 75 miles off the vibrant coast of Mexico.\n\nThe men's fishing vessel, likely a smaller craft common in coastal fisheries, became incapacitated, leaving them at the mercy of the elements. The open ocean presents a myriad of life-threatening challenges for those lost at sea: relentless sun exposure leading to severe sunburn and heatstroke, the constant threat of dehydration without access to fresh water, and the risk of hypothermia during the cooler nights. Furthermore, the psychological toll of isolation and uncertainty can be immense.\n\nHowever, these two individuals demonstrated extraordinary resourcefulness. They managed to secure themselves within a large, insulated cool box – a common item used for preserving catches and provisions. This seemingly mundane container transformed into their improvised life raft, offering a crucial degree of protection from the sun's scorching rays and the ceaseless battering of ocean waves. It likely helped them retain vital body heat and provided a small, albeit precarious, platform amidst the turbulent waters, preventing them from being swept away.\n\nMaritime authorities, alerted to their disappearance, initiated search and rescue operations. The vastness of the Pacific makes such efforts incredibly challenging, akin to finding a needle in a haystack. The precise details of how they were ultimately spotted and by which vessel remain to be fully disclosed, but their discovery brought profound relief to their anxious families and the close-knit local fishing community. Their safe return underscores the inherent perils faced by those who derive their livelihood from the sea and serves as a powerful reminder of the critical importance of robust maritime safety protocols, emergency beacons, and the indomitable spirit of survival.", "vocab": [{"word": "resilience", "definition": "the ability to recover quickly from difficulties; toughness."}, {"word": "ingenuity", "definition": "the quality of being clever, original, and inventive."}, {"word": "harrowing", "definition": "acutely distressing or painful."}, {"word": "unforgiving", "definition": "not allowing for mistakes or weakness; harsh and relentless."}, {"word": "incapacitated", "definition": "deprived of strength or power; made unable to function."}, {"word": "myriad", "definition": "a countless or extremely great number of people or things."}, {"word": "precarious", "definition": "not securely held or in position; dangerously likely to fall or collapse."}, {"word": "indomitable", "definition": "impossible to defeat or subdue; unconquerable."}]}}, "questions": [{"q": "How long were the two fishermen lost at sea?", "a": "The two fishermen were lost at sea for five days."}, {"q": "What item did the fishermen use to help them survive while adrift?", "a": "The fishermen used a cool box to help them survive while adrift."}], "id": "a2509b89d9d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/videos/c1l10g94yg1o?at_medium=RSS&at_campaign=rss", "published": "2026-08-21T05:41:31+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Former Pakistan PM Imran Khan Hospitalized from Jail", "excerpt": "Pakistan's former Prime Minister, Imran Khan, was taken from jail to Shifa International Hospital for medical treatment.", "levels": {"Beginner": {"text": "Imran Khan, who used to be the leader of Pakistan, was taken to a hospital. He was in jail, but now he is at Shifa International Hospital. This happened with many guards around him, showing it was a very important move. Local news said he went for medical help.\n\nMr. Khan was the Prime Minister of Pakistan. This is like being the main leader of the country. He was also a famous cricket player before he became a politician. Many people know him.\n\nHe has been in jail for some time. He faces different legal problems. When important people like former leaders go to the hospital, many people pay attention. They want to know if he is okay. The hospital is in Islamabad, the capital city. His health is a big topic for people in Pakistan. His transfer shows that even jailed leaders get medical care when needed. The heavy security was to keep everything safe and orderly during the move.", "vocab": [{"word": "Former", "definition": "Someone who had a job or title before."}, {"word": "Jail", "definition": "A place where people are kept as punishment or while waiting for trial."}, {"word": "Hospital", "definition": "A place where sick or injured people get medical care."}, {"word": "Security", "definition": "Protection from danger, often by guards or police."}, {"word": "Treatment", "definition": "Medical care given to a patient for an illness or injury."}]}, "Intermediate": {"text": "Imran Khan, Pakistan's former Prime Minister and a prominent political figure, was recently transferred from Adiala jail to Shifa International Hospital in Islamabad. The move, reported by local media, occurred under tight security measures, highlighting the sensitive nature of his situation. He was taken for medical treatment, though specific details about his condition were not immediately released.\n\nKhan, a former international cricket star, led the Pakistan Tehreek-e-Insaf (PTI) party and served as Prime Minister from 2018 until his ouster in April 2022 through a no-confidence vote. Since then, he has faced a series of legal challenges and has been detained on various charges, including allegations of corruption. His arrest and subsequent jailing in August 2023 sparked widespread protests and a period of significant political instability across the country.\n\nHis transfer to a private hospital has drawn considerable public attention. Given his high profile, any development regarding his health is closely monitored by his supporters, political opponents, and the media. The hospital, Shifa International, is a well-known medical facility in the capital. The heavy security presence during his transfer underscores the authorities' concern for both his safety and maintaining order.\n\nThis event adds another layer to Pakistan's already turbulent political landscape. While the precise reason for his hospitalization remains undisclosed, it has naturally led to speculation about his well-being and the potential implications for the ongoing political discourse in Pakistan. His supporters will be keen for updates, while the government will likely ensure transparency regarding his medical care.", "vocab": [{"word": "Prominent", "definition": "Important and well-known."}, {"word": "Transferred", "definition": "Moved from one place to another."}, {"word": "Sensitive", "definition": "Needing to be dealt with carefully because it might cause problems or offense."}, {"word": "Ouster", "definition": "The act of removing someone from a position of power."}, {"word": "Allegations", "definition": "Claims that someone has done something wrong, but not yet proven."}, {"word": "Instability", "definition": "A state of being uncertain or not steady; prone to change."}, {"word": "Turbulent", "definition": "Characterized by conflict, disorder, or confusion."}]}, "Advanced": {"text": "Imran Khan, the former Prime Minister of Pakistan and a towering figure in the nation's political arena, was recently transported from Adiala jail to Shifa International Hospital in Islamabad for medical treatment. The transfer, executed under stringent security protocols and widely reported by local media outlets, underscores the profound political sensitivity surrounding Khan's detention and health. While the specific nature of his ailment was not immediately disclosed, the move has ignited considerable public and media scrutiny, given his high-profile status.\n\nKhan's journey from an international cricket legend to the premiership of Pakistan was remarkable. He founded the Pakistan Tehreek-e-Insaf (PTI) party, championing an anti-corruption platform, and served as Prime Minister from 2018 until his removal via a no-confidence vote in April 2022. Since his ouster, he has been embroiled in a plethora of legal challenges, ranging from allegations of corruption and misuse of state gifts to charges related to official secrets. His arrest and subsequent incarceration in August 2023 on corruption charges triggered widespread civil unrest and exacerbated an already volatile political climate across Pakistan. The legal battles have largely been seen by his supporters as politically motivated attempts to sideline him.\n\nThe decision to move Khan to a private medical facility like Shifa International Hospital, a reputable institution in the capital, reflects the authorities' recognition of his high-profile status and the need for appropriate medical care. The heavy security detail accompanying his transfer was not merely for his protection but also to manage potential public gatherings or demonstrations, given his substantial support base. This event inevitably fuels speculation about his current health condition and its potential ramifications for the country's political trajectory, especially as Pakistan prepares for upcoming elections.\n\nPakistan has been navigating a period of intense political turbulence, marked by economic challenges, a crackdown on dissent, and a highly polarized political landscape. Khan's continued detention and any developments concerning his well-being are thus viewed through a political lens, with both his ardent supporters and political adversaries closely monitoring the situation. His hospitalization could potentially influence ongoing legal proceedings or even the broader political narrative. The government will likely be under pressure to ensure transparency regarding his medical status to mitigate further public unrest or accusations of mistreatment. Historically, the health of prominent political figures in Pakistan has often been a subject of intense public interest and political maneuvering. This episode serves as a stark reminder of the delicate balance between judicial process, political power, and public sentiment in a nation grappling with profound internal divisions and seeking stability.", "vocab": [{"word": "Stringent", "definition": "(Of regulations, requirements, or conditions) strict, precise, and exacting."}, {"word": "Profound", "definition": "(Of a state, quality, or emotion) very great or intense."}, {"word": "Embroiled", "definition": "Involved deeply in an argument, conflict, or difficult situation."}, {"word": "Plethora", "definition": "A large or excessive amount of something."}, {"word": "Exacerbated", "definition": "Made (a problem, bad situation, or negative feeling) worse."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "Mitigate", "definition": "Make less severe, serious, or painful."}, {"word": "Maneuvering", "definition": "A movement or series of moves requiring skill and care; a carefully planned scheme."}]}}, "questions": [{"q": "From which jail was Imran Khan taken to the hospital?", "a": "He was taken from Adiala jail."}, {"q": "What was the general reason for Imran Khan's transfer to the hospital?", "a": "He was taken for medical treatment."}], "id": "a6247c5125d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ckgdr9vr50po?at_medium=RSS&at_campaign=rss", "published": "2026-08-21T05:40:17+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Kurt Warner Praises Ty Simpson's 'Feel for the Game' - Yahoo Sports", "excerpt": "Kurt Warner Praises Ty Simpson's 'Feel for the Game' Yahoo Sports", "levels": {"Beginner": {"text": "Kurt Warner Praises Ty Simpson's 'Feel for the Game' Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Kurt Warner Praises Ty Simpson's 'Feel for the Game' Yahoo Sports", "vocab": []}, "Advanced": {"text": "Kurt Warner Praises Ty Simpson's 'Feel for the Game' Yahoo Sports", "vocab": []}}, "questions": [], "id": "a57ce737b2c", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihwFBVV95cUxOSVhCTy11ekpEMGxITHM3UU9TMW5WZXJzVHluUGdURTdGSUxGV3d1WjFoMzBuV0xxb0VsajhRSnRtVkthVWMtaXI2cXppZHJqNU1YWGNoTmpYNldST1dLQjdfXzFDYmhTRHVYUUZqVEZ3bHk0dWtRZlc4NFJuTVo5dnNUbzVjTjg?oc=5", "published": "2026-08-21T07:14:03+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Rangers Secure Win in Conference League Play-off, Despite Stodgy Performance", "excerpt": "Rangers secured a victory against Jablonec in their Conference League play-off, though the performance was widely described as unconvincing.", "levels": {"Beginner": {"text": "Rangers, a well-known football team, recently played a game against Jablonec. This match was part of a big competition called the UEFA Europa Conference League. It was the first part of two games, known as the \"first leg\" of a play-off. The winner of these two games will move forward in the tournament.\n\nRangers won the game against Jablonec. This is good news because winning the first leg gives them an advantage for the next match. However, the news report said that the game was not very exciting to watch. People felt that Rangers did not play their best. The team's performance was described as \"stodgy,\" meaning it was dull and not very lively.\n\nEven though the game was not pretty, getting a win is very important. It means Rangers are closer to reaching the next stage of the competition. They will play Jablonec again in the second leg, and they will want to play better. Fans hope to see a more exciting and strong performance from their team next time. This victory helps Rangers keep their hopes alive in the European tournament.", "vocab": [{"word": "Beat", "definition": "To win against another team or person in a game or competition."}, {"word": "Leg", "definition": "One of two games played by the same teams in a competition, with the winner decided by the total score from both games."}, {"word": "Play-off", "definition": "A game or series of games played to decide a winner or a place in a competition, often after a tie or to qualify for a later stage."}, {"word": "Performance", "definition": "How well someone or a team plays or does something."}, {"word": "Advantage", "definition": "A condition or situation that puts one in a better or more favorable position."}, {"word": "Tournament", "definition": "A competition involving a large number of competitors playing a series of games to determine an overall winner."}]}, "Intermediate": {"text": "Rangers Football Club recently secured a crucial victory over Czech side Jablonec in the first leg of their UEFA Europa Conference League play-off tie. While the win provides a vital advantage for the Scottish champions, the match itself was widely characterized by an unconvincing and uninspired performance.\n\nThe game, which was part of the inaugural season of UEFA's third-tier club competition, was described by BBC Sport as a \"stodgy\" affair, lacking the excitement and attacking fluidity typically expected from Rangers. Despite the less-than-stellar display, the team managed to clinch a win, which is paramount in a two-legged European fixture where the aggregate score determines progression.\n\nThe Europa Conference League offers clubs an additional pathway to European football, providing both financial incentives and valuable continental experience. For Rangers, qualifying for the group stage is a significant objective, enhancing their club's profile and revenue streams. The first leg result means they head into the return fixture with a lead, but the nature of the performance will undoubtedly be a talking point for manager and fans alike.\n\nPundits have suggested that the team struggled to create clear-cut chances and appeared somewhat disjointed in their attacking efforts. Jablonec likely adopted a disciplined defensive strategy, making it difficult for Rangers to break through. The upcoming second leg will be a test of character and tactical adjustment, as Rangers will need to deliver a more cohesive and dynamic showing to confirm their place in the group stages and avoid any potential upsets. A stronger performance will be crucial to satisfy supporters and maintain momentum in their European campaign.", "vocab": [{"word": "Secured", "definition": "To successfully get or achieve something, often after effort."}, {"word": "Crucial", "definition": "Extremely important or necessary, especially in relation to the success or failure of something."}, {"word": "Unconvincing", "definition": "Not seeming real, true, or effective; failing to persuade or impress."}, {"word": "Stodgy", "definition": "Dull, heavy, or uninspired, often used to describe a performance or style."}, {"word": "Advantage", "definition": "A condition or circumstance that puts one in a favorable or superior position."}, {"word": "Pundits", "definition": "Experts who regularly comment on a particular subject, especially in the media."}, {"word": "Fluidity", "definition": "The quality of being smooth, continuous, and graceful, often referring to movement or play in sports."}]}, "Advanced": {"text": "Rangers Football Club clinched a vital victory against Czech side Jablonec in the inaugural leg of their UEFA Europa Conference League play-off tie. The 1-0 win, while providing a crucial aggregate advantage, was widely critiqued for its uninspired and lacklustre performance, leaving many observers with a sense of unease despite the positive result.\n\nBBC Sport's Tom English vividly described the match as a \"stodgy 12-course banquet of huff and puff,\" a colourful metaphor highlighting the team's struggle to convert possession into meaningful opportunities and penetrate a resolute Jablonec defence. This assessment underscores the prevailing sentiment that the Scottish champions failed to live up to expectations in terms of their attacking potency and overall tactical execution.\n\nThe Europa Conference League, established as UEFA's third-tier club competition, offers an alternative route to European football for clubs across the continent. Qualification for the lucrative group stage is a significant objective for Rangers, bringing both substantial financial rewards and an enhanced club profile on the continental stage. The importance of navigating this play-off successfully cannot be overstated, as it directly impacts the club's European aspirations and financial health.\n\nManager Steven Gerrard's tactical approach and player execution came under scrutiny following the match. The team appeared disjointed in their build-up play, lacking the incisive passing and creative spark expected from a side of Rangers' calibre. While Jablonec likely adopted a disciplined and compact defensive strategy, Rangers' inability to unlock their opponents with greater conviction raised questions about their offensive cohesion.\n\nThe narrow margin of victory leaves the tie finely poised, despite Rangers holding the lead. The return leg in the Czech Republic will be a formidable test, demanding a more cohesive, dynamic, and assertive display from the Scottish champions. The pressure will be on to deliver a convincing performance and avoid any potential upsets that could jeopardise their European journey. Fans and commentators will be looking for a significant improvement in attacking potency and defensive solidity to ensure a smoother passage to the group stages. The manager will undoubtedly be working to address the tactical shortcomings observed in the first leg to ensure a more dominant and assured performance in the decisive second encounter.", "vocab": [{"word": "Inaugural", "definition": "Marking the beginning of an institution, activity, or series; the first of its kind."}, {"word": "Clinched", "definition": "Secured or confirmed (a deal, victory, or championship) decisively."}, {"word": "Aggregate", "definition": "A total amount of points, goals, or scores accumulated over a series of games or matches."}, {"word": "Lacklustre", "definition": "Lacking in vitality, force, or conviction; uninspired or dull."}, {"word": "Scrutiny", "definition": "Critical observation or examination, often in a detailed and careful way."}, {"word": "Disjointed", "definition": "Lacking a coherent sequence or connection; disconnected or disorganized."}, {"word": "Incisive", "definition": "(Of a person or mental process) intelligently analytical and clear-thinking; (of an action) quick, direct, and effective."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}]}}, "questions": [{"q": "What competition were Rangers playing in?", "a": "Rangers were playing in the UEFA Europa Conference League."}, {"q": "How was Rangers' performance described in the news item?", "a": "Rangers' performance was described as 'stodgy' and 'unconvincing' (or 'huff and puff')."}], "id": "a6d2a668451", "source": "BBC Sport", "link": "https://www.bbc.co.uk/sport/football/articles/c98v73n24j2o?at_medium=RSS&at_campaign=rss", "published": "2026-08-21T07:09:11+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "(ZQQ) Equity Market Report (ZQQ:CA) - Stock Traders Daily", "excerpt": "(ZQQ) Equity Market Report (ZQQ:CA) Stock Traders Daily", "levels": {"Beginner": {"text": "(ZQQ) Equity Market Report (ZQQ:CA) Stock Traders Daily", "vocab": []}, "Intermediate": {"text": "(ZQQ) Equity Market Report (ZQQ:CA) Stock Traders Daily", "vocab": []}, "Advanced": {"text": "(ZQQ) Equity Market Report (ZQQ:CA) Stock Traders Daily", "vocab": []}}, "questions": [], "id": "ab7cfdbae07", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxNQ2NRMEZ2OEpMWWJ4V3hMa1dvcnpEVTlzVFdkU3Z1N2I5cldKejVlOF9kaS1aeWY0ZHlxNkl6RmtaNXJNZlJDNzI0N1VpVFdZZ0JickdNVU1QS2FIcTFEdi1BelpoZGxrRFNFa1lpZ0xfYUVZR0RRY3F5bGZicVJXOHRUWmVOSEFOSmc?oc=5", "published": "2026-08-21T07:06:52+09:00", "category": "finance", "category_title": "Finance"}, {"headline": "Asian Stocks Set to Fall as Bonds Resume Decline: Markets Wrap - Bloomberg.com", "excerpt": "Asian Stocks Set to Fall as Bonds Resume Decline: Markets Wrap Bloomberg.com", "levels": {"Beginner": {"text": "Asian Stocks Set to Fall as Bonds Resume Decline: Markets Wrap Bloomberg.com", "vocab": []}, "Intermediate": {"text": "Asian Stocks Set to Fall as Bonds Resume Decline: Markets Wrap Bloomberg.com", "vocab": []}, "Advanced": {"text": "Asian Stocks Set to Fall as Bonds Resume Decline: Markets Wrap Bloomberg.com", "vocab": []}}, "questions": [], "id": "a6b7c1a91fb", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxNOGs3R29oXzVEVlA0bHFwajZ0cjhDQmFGNnZqbDYwcEFtcmdxM2NvWFBXMTNXN19xcW9kVDZPMnlFNWdGMkh2WHpydVlIOHhBcTZnUnlxc0lXSVRwYVczS0tyanBnNnQtRXlqYTRBaWZVSVFibEtPMWdrMEhfbVVfVnRSRmVOSGJQNFZOQjBtZEpPcUND?oc=5 1OWRHZTFkWmR5UEtQUFpBeG5UZkVXa0ZhZ0ZLVFA4LWFXM3FRbWNIckFUSnZSVWRsVDBzLUYwSnBlbVR4d3NPcGNyREk4M2MyS3k5SHJDb2R5UHQ4UnJ4N1VmNVBLVVQzRVF2djV4bjJRblNrSUJUZEIyZVEwbmdKcHo0eEdHRzB0cklf?oc=5", "published": "2026-08-21T07:01:45+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
