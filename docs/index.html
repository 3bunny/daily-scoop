6Slg0bVExNnA3bGpfYXdpU1dwbUNXeVpBUjVMMDhwYTVmdmRkMUpVUw?oc=5", "published": "2026-09-29T10:06:07+09:00", "category": "entertainment"}, {"headline": "‘Hirayasumi’ Anime Unveils Footage, Key Visual and Lead Voice Cast Ahead of NHK Debut", "excerpt": "New footage from the anime adaptation of Shinzo Keigo’s manga “Hirayasumi” has been unveiled, along with a key visual and the principal voic", "levels": {"Beginner": {"text": "New footage from the anime adaptation of Shinzo Keigo’s manga “Hirayasumi” has been unveiled, along with a key visual and the principal voice cast, ahead of the series’ January 2027 premiere on Japan’s NHK General TV. Viz Media and Shogakukan-Shueisha Productions (ShoPro) released the material. International streaming plans have yet to be revealed. Production +h., […]", "vocab": []}, "Intermediate": {"text": "New footage from the anime adaptation of Shinzo Keigo’s manga “Hirayasumi” has been unveiled, along with a key visual and the principal voice cast, ahead of the series’ January 2027 premiere on Japan’s NHK General TV. Viz Media and Shogakukan-Shueisha Productions (ShoPro) released the material. International streaming plans have yet to be revealed. Production +h., […]", "vocab": []}, "Advanced": {"text": "New footage from the anime adaptation of Shinzo Keigo’s manga “Hirayasumi” has been unveiled, along with a key visual and the principal voice cast, ahead of the series’ January 2027 premiere on Japan’s NHK General TV. Viz Media and Shogakukan-Shueisha Productions (ShoPro) released the material. International streaming plans have yet to be revealed. Production +h., […]", "vocab": []}}, "questions": [], "id": "a020b7faf5b", "source": "Variety", "link": "https://variety.com/2026/tv/news/hirayasumi-anime-footage-voice-cast-nhk-debut-1236877801/", "published": "2026-09-29T09:43:37+09:00", "category": "entertainment"}, {"headline": "100 groups take the stage at Carrboro Music Festival for its 29th year - The Daily Tar Heel", "excerpt": "100 groups take the stage at Carrboro Music Festival for its 29th year The Daily Tar Heel", "levels": {"Beginner": {"text": "100 groups take the stage at Carrboro Music Festival for its 29th year The Daily Tar Heel", "vocab": []}, "Intermediate": {"text": "100 groups take the stage at Carrboro Music Festival for its 29th year The Daily Tar Heel", "vocab": []}, "Advanced": {"text": "100 groups take the stage at Carrboro Music Festival for its 29th year The Daily Tar Heel", "vocab": []}}, "questions": [], "id": "ad4db807b1f", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxOTXRxbnJUaUVma0F2WmR3VEVCQUdlQ0dlUi1ySnRCdGZ1aXptT3IwTEJaMlhTRkFONGI0S2RDNHFoajJKMVlFYXZrcXp0NzF6SEpJbWZtQmQ4czNDLVBTNUE3LWYxV2pqZmlFeTNTVkEwTENtek9STFFlTm1tamFLWWV3X1cxU01O?oc=5", "published": "2026-09-29T09:32:12+09:00", "category": "entertainment"}]}], "home": [{"headline": "OpenAI Halts New AI Model Rollout Over Safety Concerns", "excerpt": "OpenAI, a leading AI company, has decided not to release a new artificial intelligence model, citing important safety concerns.", "levels": {"Beginner": {"text": "OpenAI, a big company that makes smart computer programs called AI, has decided not to release a new one. This new program, an AI model, was stopped because of important safety worries.\n\nThe person who leads safety at OpenAI explained why. He said the model \"didn't quite meet the bar.\" This means it was not safe enough for the company's rules. OpenAI wants to make sure its AI tools are very safe before anyone uses them.\n\nAI models are like clever computer brains. They can do many things, such as writing texts, making pictures, or answering questions. Because these programs are powerful, it is very important that they are safe and do not cause problems. Companies like OpenAI spend a lot of time checking their AI for any issues. They want to prevent any harm or unexpected actions from their technology. This decision shows that OpenAI takes safety very seriously. They would rather wait and make sure their new AI model is completely ready and secure for everyone to use.", "vocab": [{"word": "AI", "definition": "Smart computer programs that can learn and do tasks."}, {"word": "Model", "definition": "A computer program or system designed for a specific task."}, {"word": "Safety", "definition": "Being protected from harm or danger."}, {"word": "Release", "definition": "To make something available to the public."}, {"word": "Worries", "definition": "Feelings of concern or anxiety."}, {"word": "Prevent", "definition": "To stop something from happening."}]}, "Intermediate": {"text": "OpenAI, a leading artificial intelligence company, has announced its decision to halt the rollout of a new AI model. The company stated that the model did not meet its internal safety standards, leading to the indefinite postponement of its public release. This move highlights the growing emphasis on responsible development within the rapidly evolving field of AI.\n\nAccording to the BBC News report, OpenAI's safety chief indicated that the model \"didn't quite meet the bar\" of the firm's security protocols. This suggests that during internal testing, the new AI system exhibited behaviors or capabilities that raised concerns regarding potential risks or unintended consequences. The company emphasizes its commitment to responsible AI development, prioritizing safety and ethical considerations above rapid deployment. This approach is crucial as AI technologies become more powerful and widespread.\n\nAI models are sophisticated computer programs designed to perform tasks that typically require human intelligence, such as understanding language, generating text, or recognizing patterns. As these technologies become more advanced and integrated into various aspects of daily life, ensuring their safety and reliability is paramount. The AI industry, including major players like OpenAI, faces increasing scrutiny regarding the potential societal impacts of powerful AI systems, from job displacement to the spread of misinformation.\n\nThis decision by OpenAI underscores a growing trend within the AI sector to prioritize caution. Developers are increasingly aware of the need to thoroughly evaluate AI systems for biases, potential misuse, or unforeseen emergent properties before they are widely adopted. By delaying the release, OpenAI demonstrates a commitment to its safety principles, even if it means slowing down the pace of innovation. This aims to build public trust and ensure that future AI advancements are both powerful and benign, contributing positively to society rather than posing new challenges.", "vocab": [{"word": "Halt", "definition": "To stop something, often suddenly."}, {"word": "Rollout", "definition": "The official launch or introduction of a new product or service."}, {"word": "Standards", "definition": "A required or agreed level of quality or attainment."}, {"word": "Protocols", "definition": "Official procedures or systems of rules governing affairs of state or diplomatic occasions."}, {"word": "Prioritizing", "definition": "To treat something as more important than other things."}, {"word": "Scrutiny", "definition": "Critical observation or examination."}, {"word": "Benign", "definition": "Not harmful or dangerous."}]}, "Advanced": {"text": "OpenAI, a preeminent developer in the field of artificial intelligence, has made the significant decision to indefinitely postpone the rollout of a new AI model, citing profound safety concerns. This move, reported by BBC News, underscores a growing industry-wide imperative to prioritize robust security and ethical considerations over the rapid deployment of advanced AI capabilities. It highlights the complex challenges inherent in developing increasingly powerful and autonomous systems.\n\nThe company's safety chief articulated that the model \"didn't quite meet the bar\" of OpenAI's stringent security standards. This suggests that during rigorous internal evaluations, the AI system likely exhibited emergent behaviors or potential vulnerabilities that could pose unforeseen risks if released to the public. Such risks might encompass anything from generating harmful misinformation or biased content to exhibiting unpredictable autonomous actions. OpenAI has consistently positioned itself as a proponent of responsible AI development, emphasizing a commitment to mitigating potential societal harms even as it pushes the boundaries of technological innovation. This proactive stance is crucial in an era where AI's capabilities are rapidly expanding.\n\nThe broader context for this decision is the escalating global discourse surrounding AI safety and governance. As AI models become increasingly sophisticated and pervasive, their potential impact on various facets of human society — from economic structures and employment to information integrity and national security — necessitates meticulous oversight. Leading AI organizations are under intensified scrutiny from policymakers, academics, and the public alike to ensure that powerful AI systems are developed and deployed with utmost caution and transparency. The industry is grappling with how to balance rapid innovation with the imperative to prevent unintended consequences.\n\nThis incident is not isolated; it reflects a critical juncture in the AI industry where the pursuit of groundbreaking advancements must be carefully balanced with a proactive approach to risk management. The development of large language models and other generative AI systems has revealed complex challenges, including the difficulty in fully predicting their outputs or understanding their internal reasoning processes. Consequently, comprehensive testing for robustness, fairness, and potential misuse has become an indispensable phase in the AI product lifecycle, often involving red-teaming and adversarial testing methodologies.\n\nBy choosing to delay the release, OpenAI is signaling a strong adherence to its foundational safety principles, even at the potential cost of short-term competitive advantage. This commitment is vital for fostering public trust, which is arguably the most crucial currency for the long-term viability and societal acceptance of artificial intelligence. It sets a precedent that the ethical implications and potential for harm must be thoroughly addressed before powerful AI technologies are unleashed upon the world, contributing to a more considered and conscientious trajectory for AI development globally and reinforcing the notion that \"moving fast and breaking things\" may not be suitable for foundational technologies like advanced AI.", "vocab": [{"word": "Preeminent", "definition": "Surpassing all others; very distinguished in some way."}, {"word": "Postpone", "definition": "To delay an event or action until a later time."}, {"word": "Imperative", "definition": "Of vital importance; crucial."}, {"word": "Stringent", "definition": "(Of regulations, requirements, or conditions) strict, precise, and exacting."}, {"word": "Articulated", "definition": "Expressed an idea or feeling fluently and coherently."}, {"word": "Mitigating", "definition": "Making something less severe, serious, or painful."}, {"word": "Discourse", "definition": "Written or spoken communication or debate."}, {"word": "Indispensable", "definition": "Absolutely necessary."}]}}, "questions": [{"q": "Why did OpenAI decide to stop the release of its new AI model?", "a": "OpenAI decided to stop the release because the new AI model did not meet the company's internal safety standards."}, {"q": "What is the main reason companies like OpenAI prioritize safety in AI development?", "a": "Companies like OpenAI prioritize safety to prevent potential risks, harm, or unintended consequences that powerful AI systems could cause, and to build public trust."}], "id": "a74455c8e46", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cm5y5nynl75ko?at_medium=RSS&at_campaign=rss", "published": "2026-09-29T10:18:24+09:00", "category": "business", "category_title": "Business"}, {"headline": "Burnham Proposes Public Body for Electricity Grid Investment", "excerpt": "Andy Burnham, Mayor of Greater Manchester, plans to create a new public body to invest in the electricity grid, aiming to lower energy costs for consumers.", "levels": {"Beginner": {"text": "Andy Burnham, who is the Mayor of Greater Manchester, wants to create a new public group. This group will focus on the electricity system. Its main job will be to put money into the electricity grid. The electricity grid is like a big network that brings power to homes and businesses.\n\nMr. Burnham believes that investing in this system will help make energy cheaper for everyone. Many people in the UK are currently paying high prices for their electricity and gas. By improving the way electricity is delivered, the new public body hopes to bring these costs down.\n\nThis idea means that a public organization, not just private companies, would have a role in managing and improving the power network. This could help make sure the system is modern and works well for all parts of the country. It's a plan to help families save money on their energy bills and make the UK's power supply stronger.", "vocab": [{"word": "Mayor", "definition": "The leader of a city or town."}, {"word": "Public group", "definition": "An organization controlled by the government or for the benefit of everyone."}, {"word": "Electricity system", "definition": "All the parts that make and deliver electricity."}, {"word": "Electricity grid", "definition": "The network of wires and power stations that carry electricity."}, {"word": "Investing", "definition": "Putting money into something to make it better or get a profit later."}, {"word": "Cheaper", "definition": "Costing less money."}]}, "Intermediate": {"text": "Andy Burnham, the prominent Mayor of Greater Manchester, is set to unveil plans for a new public body dedicated to investing in the UK's electricity grid. This initiative aims to modernize the nation's power infrastructure and, crucially, reduce energy costs for consumers across the country.\n\nThe proposal suggests that a publicly owned entity would play a significant role in upgrading and expanding the electricity network. Currently, much of the investment and management of the grid is handled by private companies. Burnham's vision is that a public body could secure lower borrowing costs and make long-term strategic decisions that prioritize public benefit over private profit. This approach, he argues, could lead to more efficient infrastructure development and ultimately lower bills for households and businesses struggling with high energy prices.\n\nInvesting in the electricity grid is vital for several reasons. An aging infrastructure needs significant upgrades to ensure reliability and meet growing demand. Furthermore, as the UK transitions towards renewable energy sources like wind and solar, the grid must be adapted to handle these new forms of generation and distribution. A robust and modern grid is essential for integrating more green energy, which can help reduce reliance on volatile fossil fuel markets and contribute to the country's climate goals.\n\nThis move reflects a broader debate within the UK about the role of public ownership in essential services. Proponents argue it offers greater control, better planning, and potentially lower costs for consumers. Burnham's announcement is expected to highlight how such a body could accelerate the transition to a sustainable energy future while providing tangible financial relief to families.", "vocab": [{"word": "Prominent", "definition": "Important and well-known."}, {"word": "Unveil", "definition": "To show or make known for the first time."}, {"word": "Initiative", "definition": "A new plan or process to achieve something."}, {"word": "Infrastructure", "definition": "The basic systems and services needed for a country or organization to function, like roads, power, and water."}, {"word": "Entity", "definition": "Something that exists as a single, separate unit."}, {"word": "Prioritize", "definition": "To treat something as more important than other things."}, {"word": "Volatile", "definition": "Likely to change suddenly and unexpectedly, especially for the worse."}]}, "Advanced": {"text": "Andy Burnham, the influential Mayor of Greater Manchester and a significant figure within the Labour Party, is poised to announce a groundbreaking proposal for a new public body tasked with strategic investment in the United Kingdom's electricity grid. This ambitious initiative is framed as a critical step towards both modernizing the nation's energy infrastructure and delivering substantial reductions in consumer energy costs.\n\nThe core of Burnham's plan involves establishing a publicly owned entity that would channel investment into upgrading and expanding the national electricity network. This represents a potential shift from the current model, where private companies largely manage and finance grid development. Proponents of public investment argue that such a body could leverage lower borrowing rates, typical of government-backed institutions, and adopt a long-term, holistic planning approach unconstrained by short-term shareholder demands. This, it is contended, would lead to more efficient capital allocation, accelerate infrastructure deployment, and ultimately translate into lower transmission and distribution charges for households and businesses grappling with persistently high energy bills.\n\nThe rationale for significant grid investment is multifaceted. The UK's aging electricity infrastructure requires substantial modernization to enhance resilience, accommodate increasing demand, and facilitate the widespread integration of renewable energy sources. As the nation commits to ambitious net-zero targets, the grid must evolve to handle intermittent generation from wind and solar farms, manage bidirectional power flows, and support the burgeoning electric vehicle charging network. A robust, smart grid is indispensable for achieving energy security, decarbonization goals, and reducing susceptibility to the volatility of international fossil fuel markets.\n\nThis proposal also reignites a broader ideological debate concerning the role of public ownership in essential utilities. Advocates suggest it offers greater democratic accountability, strategic coherence, and the potential to prioritize social and environmental outcomes alongside economic efficiency. Critics, however, often raise concerns about potential bureaucratic inefficiencies, political interference, and the capacity of public bodies to innovate at the pace of the private sector. Burnham's announcement is expected to articulate how this specific public body would be structured to mitigate such risks while maximizing its capacity to drive down costs and accelerate the transition to a sustainable, secure energy future for all Britons. The success of such a venture would hinge on its operational independence and its ability to attract top engineering and management talent.", "vocab": [{"word": "Influential", "definition": "Having a great deal of influence on someone or something."}, {"word": "Poised", "definition": "Ready to do something at any moment."}, {"word": "Groundbreaking", "definition": "Innovative; introducing new ideas or methods."}, {"word": "Strategic", "definition": "Relating to the identification of long-term or overall aims and interests and the means of achieving them."}, {"word": "Leverage", "definition": "To use something to maximum advantage."}, {"word": "Holistic", "definition": "Characterized by comprehension of the parts of something as intimately interconnected and explicable only by reference to the whole."}, {"word": "Multifaceted", "definition": "Having many different aspects or features."}, {"word": "Indispensable", "definition": "Absolutely necessary."}]}}, "questions": [{"q": "What is Andy Burnham's main proposal regarding the electricity grid?", "a": "Andy Burnham proposes creating a new public body to invest in and modernize the UK's electricity grid."}, {"q": "According to the article, what are two reasons why investing in the electricity grid is important for the UK?", "a": "Investing in the electricity grid is important to reduce energy costs for consumers, modernize aging infrastructure, ensure reliability, meet growing demand, and integrate renewable energy sources."}], "id": "a8b1f25c9e1", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cqn4k9nypxjro?at_medium=RSS&at_campaign=rss", "published": "2026-09-29T09:40:29+09:00", "category": "business", "category_title": "Business"}, {"headline": "OpenAI Halts New AI Model Release Due to Safety Concerns", "excerpt": "AI leader OpenAI has paused the launch of a new artificial intelligence model, citing that it did not meet its strict internal safety standards.", "levels": {"Beginner": {"text": "OpenAI, a big company that makes artificial intelligence (AI), has decided not to release a new AI model. This new model was planned to come out soon, but the company stopped it. The main reason for this decision is safety. OpenAI's chief of safety said the new model was not safe enough. It did not meet the company's rules for security. \n\nAI models are computer programs that can learn and do many tasks, like writing text or creating images. Because these programs are powerful, it is very important that they are safe. Companies like OpenAI want to make sure their AI tools do not cause problems or harm people. \n\nBy stopping the release, OpenAI is showing that safety is very important to them. They want to be sure that any new AI technology they share with the world is secure and works well without risks. This means they will work more on the model to make it safer before it can be used by others.", "vocab": [{"word": "release", "definition": "To make something available to the public."}, {"word": "model", "definition": "A computer program that can learn and perform tasks."}, {"word": "safety", "definition": "Being protected from danger or harm."}, {"word": "chief", "definition": "The most important person in a group or organization."}, {"word": "security", "definition": "Protection against harm or danger."}, {"word": "risks", "definition": "Possible dangers or problems."}]}, "Intermediate": {"text": "OpenAI, a leading artificial intelligence (AI) company, has made a significant decision to halt the rollout of a new AI model. The company announced that the model, which was nearing its public release, did not meet its internal safety and security standards. This move underscores OpenAI's commitment to responsible AI development, prioritizing safety over immediate deployment.\n\nThe company's safety chief stated that the new model 'didn't quite meet the bar' of their stringent security protocols. This indicates that despite the advanced capabilities the model likely possessed, it failed to pass critical safety assessments designed to prevent potential misuse or unintended negative consequences. AI models are complex systems capable of generating text, images, and even code, making their safe operation a paramount concern for developers and the public alike.\n\nThe decision highlights the growing importance of ethical considerations and robust safety measures in the rapidly evolving field of artificial intelligence. As AI technology becomes more powerful and integrated into daily life, companies like OpenAI face increasing scrutiny to ensure their products are not only innovative but also secure and beneficial. By pausing the release, OpenAI demonstrates a willingness to delay product launches to address potential vulnerabilities, reinforcing trust in their development process. This approach is crucial for building confidence in AI as it continues to advance.", "vocab": [{"word": "halt", "definition": "To stop something from happening or continuing."}, {"word": "rollout", "definition": "The official launch or introduction of a new product or service."}, {"word": "underscores", "definition": "Emphasizes or highlights the importance of something."}, {"word": "stringent", "definition": "Strict, precise, and exacting rules or standards."}, {"word": "protocols", "definition": "Official procedures or systems of rules."}, {"word": "paramount", "definition": "More important than anything else; supreme."}, {"word": "vulnerabilities", "definition": "Weaknesses that could be exploited or cause harm."}]}, "Advanced": {"text": "OpenAI, a prominent developer in the field of artificial intelligence, has made a pivotal decision to indefinitely postpone the planned unveiling of a new AI model. The company's rationale for this delay centers on the model's failure to satisfy its rigorous internal safety and security benchmarks. This move by a leading AI firm underscores the escalating importance of responsible development and the complex ethical quandaries inherent in advancing cutting-edge AI technologies.\n\nThe safety chief at OpenAI articulated that the model 'didn't quite meet the bar' of the firm's established security standards. This statement implies that despite potentially significant advancements in its capabilities, the AI system did not pass comprehensive evaluations designed to mitigate risks such as generating harmful content, perpetuating biases, or exhibiting unpredictable behaviors. The development of powerful AI models, capable of sophisticated tasks from creative writing to complex problem-solving, necessitates stringent oversight to prevent unintended societal implications or potential misuse.\n\nThis decision by OpenAI sets a notable precedent within the AI industry, signaling a prioritization of safety protocols over the competitive pressure to release new products. As AI systems become increasingly autonomous and integrated into critical infrastructure, the potential for unforeseen consequences grows exponentially. Companies are grappling with the challenge of balancing innovation with the imperative to ensure that these technologies are robust, transparent, and aligned with human values. The incident highlights the ongoing debate within the AI community regarding effective governance, risk assessment frameworks, and the necessity for robust internal review processes.\n\nOpenAI's commitment to shelving a product that falls short of its safety threshold reinforces the notion that the pursuit of advanced AI must be accompanied by an equally robust commitment to ethical safeguards. This approach is vital for fostering public trust and ensuring that the transformative potential of artificial intelligence is realized responsibly, without compromising security or societal well-being. It also suggests that the 'bar' for AI safety is continually being raised as models become more powerful.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "postpone", "definition": "To delay an event or action to a later time or date."}, {"word": "unveiling", "definition": "The first public showing or announcement of a new product or plan."}, {"word": "rigorous", "definition": "Extremely thorough, exhaustive, and accurate; strict and demanding."}, {"word": "ethical quandaries", "definition": "Difficult situations or dilemmas that involve moral principles and choices."}, {"word": "mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "precedent", "definition": "An earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}, {"word": "imperative", "definition": "Of vital importance; crucial."}]}}, "questions": [{"q": "Why did OpenAI decide not to release its new AI model?", "a": "OpenAI decided not to release its new AI model because it did not meet the company's internal safety and security standards."}, {"q": "What does this decision suggest about OpenAI's priorities?", "a": "This decision suggests that OpenAI prioritizes safety and responsible AI development over the immediate release of new products."}], "id": "a74455c8e46", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cm5y5nynl75ko?at_medium=RSS&at_campaign=rss", "published": "2026-09-29T10:18:24+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Burnham Proposes Public Body to Boost Electricity Grid Investment", "excerpt": "Greater Manchester Mayor Andy Burnham plans a new public body to invest in the electricity grid, aiming to lower energy costs.", "levels": {"Beginner": {"text": "Andy Burnham, who is the Mayor of Greater Manchester, has a new plan. He wants to create a special public group. This group will help put money into the electricity grid. The electricity grid is like a big network of wires and power lines that brings electricity to our homes and schools.\n\nThe main idea is to make electricity cheaper for everyone. It also aims to make sure we have enough power for the future. Our old electricity system needs to be better. It needs to work well with new types of energy, like power from the sun and wind.\n\nMr. Burnham will talk about this plan soon. He thinks that local people should have more say in how their energy system works. This new public group will help make sure the electricity grid is strong and ready for what's next. It's about making energy better and more affordable for families and businesses in the region. This is a big step to improve how we get power every day.", "vocab": [{"word": "Mayor", "definition": "The leader of a city or town."}, {"word": "Public", "definition": "For everyone, not just one person or company."}, {"word": "Electricity grid", "definition": "The system of wires and power stations that brings electricity to homes."}, {"word": "Invest", "definition": "To put money into something to make it better or get more money back."}, {"word": "Affordable", "definition": "Not too expensive; easy to pay for."}, {"word": "Region", "definition": "A large area of land, often with its own government or special features."}]}, "Intermediate": {"text": "Andy Burnham, the Mayor of Greater Manchester, is set to announce a significant new initiative aimed at transforming the region's energy landscape. He plans to establish a public body specifically designed to invest in and modernize Greater Manchester's electricity grid. This strategic move is intended to ensure a more reliable, sustainable, and cost-effective energy supply for residents and businesses across the metropolitan area.\n\nThe proposed public body would focus on upgrading the existing electricity network, which is crucial for meeting future energy demands and effectively integrating renewable energy sources. Currently, the national grid, which serves the entire country, faces considerable challenges in adapting to the increasing amount of power generated from wind and solar farms. These older systems were not built to handle the variable nature of renewable energy or the complex two-way flow of power. By enabling local investment, Greater Manchester hopes to accelerate its transition to a greener, more resilient, and efficient energy system.\n\nMr. Burnham believes that greater local control over essential energy infrastructure is vital. He argues that a public body can prioritize the needs of the community, such as reducing energy bills for households and improving energy security, rather than solely focusing on private profit motives. This approach could lead to more strategic and long-term investments in essential power lines, substations, and smart grid technologies that benefit the entire region.\n\nThe announcement is expected to be made during a key speech, where the Mayor will outline the full scope of the plan and its potential economic and environmental benefits. This initiative reflects a growing trend towards regional authorities taking a more active role in critical infrastructure projects, particularly in areas like energy and transport. By taking charge of grid investment, Greater Manchester aims to set an example for how cities can build a sustainable and affordable energy future for their citizens, reducing reliance on outdated systems and external market fluctuations.", "vocab": [{"word": "Initiative", "definition": "A new plan or process to solve a problem or achieve a goal."}, {"word": "Establish", "definition": "To set up or create something, like an organization or system."}, {"word": "Modernize", "definition": "To make something more up-to-date or suitable for current needs."}, {"word": "Infrastructure", "definition": "The basic physical systems of a country or region, like roads, power lines, and water supply."}, {"word": "Integrate", "definition": "To combine different things so they work together effectively."}, {"word": "Resilient", "definition": "Able to recover quickly from difficulties; tough."}, {"word": "Prioritize", "definition": "To treat something as more important than other things."}]}, "Advanced": {"text": "Andy Burnham, the influential Mayor of Greater Manchester, is poised to unveil a groundbreaking proposal: the establishment of a new public body dedicated to strategic investment in the region's electricity grid. This ambitious initiative underscores a growing regional determination to exert greater control over critical infrastructure, aiming to deliver a more robust, sustainable, and economically viable energy future for its constituents. The move is a direct response to the pressing need for grid modernization and a strategic effort to mitigate the impact of volatile energy markets on local communities.\n\nThe rationale behind this move is multifaceted. The existing national electricity grid, largely privatized and aging, faces significant challenges in accommodating the rapid expansion of renewable energy sources and meeting escalating demand. Its architecture was primarily designed for centralized power generation, often from large fossil fuel plants, making it less adept at integrating distributed energy from solar panels and wind farms, which often generate power intermittently and require more flexible grid management. These national bottlenecks can slow down the connection of new green energy projects and lead to higher costs. By creating a localized investment vehicle, Greater Manchester seeks to circumvent these issues, facilitating targeted upgrades to substations, transmission lines, and the deployment of advanced smart grid technologies. This localized approach is envisioned to accelerate the transition to a decarbonized energy system, enhancing energy security and significantly reducing carbon emissions across the conurbation.\n\nBurnham has long advocated for devolution of power, arguing that local authorities are better positioned to understand and address the specific needs of their communities. He contends that a public body, free from the profit-driven imperatives of private utility companies, can prioritize long-term public benefit, such as lowering energy bills for households and businesses, fostering local green job creation, and ensuring equitable access to affordable energy. This model could also enable more innovative financing mechanisms, potentially drawing on local bonds or public funds, and a greater degree of public accountability in energy planning and delivery, ensuring investments align with community priorities rather than shareholder returns.\n\nThe Mayor is expected to elaborate on the comprehensive scope of this plan during a forthcoming major speech, likely at a regional conference, where he will detail the proposed structure and funding mechanisms. This announcement resonates with broader national discussions about energy resilience, the ongoing cost of living crisis, and the imperative to upgrade Britain's aging infrastructure to meet climate targets. The proposed public body could serve as a blueprint for other metropolitan areas seeking to gain autonomy over their energy supply and accelerate their net-zero ambitions. While critics might raise concerns about the complexities of integrating a regional public body with the existing national regulatory framework and market mechanisms, proponents argue that such a bold intervention is necessary to unlock the full potential of local renewable generation and insulate consumers from volatile global energy markets, ultimately fostering a more self-sufficient, sustainable, and equitable energy ecosystem for Greater Manchester.", "vocab": [{"word": "Poised", "definition": "Ready or prepared for something to happen."}, {"word": "Groundbreaking", "definition": "Innovative; introducing new ideas or methods."}, {"word": "Constituents", "definition": "The people who live and vote in an area, represented by an elected official."}, {"word": "Multifaceted", "definition": "Having many different parts or aspects."}, {"word": "Decarbonized", "definition": "Having removed or significantly reduced carbon emissions, especially from energy production."}, {"word": "Devolution", "definition": "The transfer of power or authority from a central government to a local or regional government."}, {"word": "Imperatives", "definition": "Things that are extremely important or urgent; essential duties."}, {"word": "Conurbation", "definition": "An extended urban area, typically consisting of several towns merging with a city."}]}}, "questions": [{"q": "What is Andy Burnham's main plan for Greater Manchester's electricity system?", "a": "He plans to create a new public body to invest in and modernize the region's electricity grid."}, {"q": "What are two key goals of this plan, according to the articles?", "a": "To make energy cheaper (or reduce energy costs/bills) and to improve the reliability and sustainability of the energy supply, especially by integrating renewable energy sources."}], "id": "a8b1f25c9e1", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cqn4k9nypxjro?at_medium=RSS&at_campaign=rss", "published": "2026-09-29T09:40:29+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "New Law in India's Maharashtra State Affects Religious Conversions", "excerpt": "A new law in India's Maharashtra state is causing concern among religious groups, raising questions about freedom of faith and personal choice.", "levels": {"Beginner": {"text": "A new rule is starting in Maharashtra, a state in India. This rule is about changing your religion. It is called an \"anti-conversion law.\" This law makes it harder for people to change their faith. If someone wants to change their religion, they might need to tell the government first. Some people worry about this new law. They think it might stop people from choosing their own religion freely. India is a country where many different religions live together. The country's rules say people can choose their own faith. But now, this new law could make that choice more difficult for some. Churchgoers and other religious groups are talking about what this means for them. They are asking if people will still have the freedom to pick their own beliefs without problems. This law wants to stop people from being forced to change religion. But critics say it could also stop people who want to change religion by their own choice.", "vocab": [{"word": "rule", "definition": "a statement that says what is allowed or what must be done."}, {"word": "state", "definition": "a part of a country with its own government."}, {"word": "religion", "definition": "a system of faith and worship."}, {"word": "faith", "definition": "strong belief in a religion."}, {"word": "freedom", "definition": "the power or right to act, speak, or think as one wants."}, {"word": "critics", "definition": "people who say what they think is wrong or bad about something."}]}, "Intermediate": {"text": "The Indian state of Maharashtra is introducing a new \"anti-conversion law,\" which is generating significant discussion and concern. This legislation aims to regulate religious conversions, making the process more stringent for individuals who wish to change their faith. While the stated purpose of such laws is often to prevent forced or fraudulent conversions, critics argue they can infringe upon an individual's fundamental right to religious freedom.\n\nUnder this new law, individuals seeking to convert to another religion may be required to notify local authorities in advance. Religious leaders facilitating conversions might also face new obligations. This development in Maharashtra is not unique; several other Indian states, particularly those governed by the Bharatiya Janata Party (BJP), have similar anti-conversion statutes in place. These laws have historically been a point of contention, often viewed by religious minorities as a tool that could be misused to harass or discriminate against them.\n\nConcerns are being raised about how the law might affect personal choice and the constitutional guarantee of freedom of religion in India. Many believe that choosing one's faith is a deeply personal decision that should not require government approval or oversight. Churchgoers and various religious organizations in Maharashtra are now grappling with the implications of this new legal framework, questioning its impact on their ability to practice and propagate their beliefs freely. The debate highlights the ongoing tension between state regulation and individual religious liberty in India.", "vocab": [{"word": "legislation", "definition": "a law or set of laws made by a government."}, {"word": "regulate", "definition": "to control an activity or process, especially by using rules."}, {"word": "stringent", "definition": "very strict and precise."}, {"word": "infringe", "definition": "to limit or restrict someone's rights or freedom."}, {"word": "constitutional", "definition": "relating to a country's constitution, which outlines its basic laws and rights."}, {"word": "contention", "definition": "disagreement or argument."}, {"word": "grappling", "definition": "struggling to deal with or understand something difficult."}]}, "Advanced": {"text": "The Indian state of Maharashtra is poised to implement a new anti-conversion law, a move that has ignited considerable debate and apprehension among various religious communities and civil liberties advocates. This legislation, which seeks to regulate and restrict religious conversions, is part of a broader trend seen across several Indian states, particularly those governed by the Hindu nationalist Bharatiya Janata Party (BJP). While proponents argue these laws are essential to curb forced or fraudulent conversions, critics contend they often disproportionately target religious minorities and undermine the secular fabric of the nation.\n\nThe proposed Maharashtra law, similar to statutes in states like Uttar Pradesh and Madhya Pradesh, typically mandates that individuals intending to convert provide prior notification to district authorities, often weeks in advance. Religious leaders officiating such conversions may also be subject to legal scrutiny and penalties if proper procedures are not followed. This bureaucratic oversight is viewed by many as an unwarranted intrusion into deeply personal matters of faith and conscience, potentially creating an environment ripe for harassment and discrimination.\n\nIndia's Constitution enshrines the right to freedom of conscience and the right freely to profess, practice, and propagate religion. However, anti-conversion laws are frequently challenged on the grounds that they infringe upon these fundamental rights, particularly the right to choose one's faith and the right to privacy. Critics highlight that the onus of proving a conversion is not coerced often falls on the individual converting, rather than the state proving coercion, thereby reversing the usual legal presumption of innocence. This can lead to arbitrary arrests and social ostracization.\n\nReligious organizations, including Christian groups and others, are expressing profound concern over the potential implications of the law. They fear it could be weaponized to impede missionary activities, criminalize voluntary conversions, and exacerbate communal tensions. The debate surrounding these laws underscores a fundamental tension in India: balancing the state's purported interest in preventing exploitation with the constitutional imperative to safeguard individual religious liberty and maintain a pluralistic society. The implementation of this law in Maharashtra is expected to intensify the ongoing legal and social discourse on religious freedom in the country.", "vocab": [{"word": "poised", "definition": "ready to do something at any moment."}, {"word": "apprehension", "definition": "anxiety or fear that something bad or unpleasant will happen."}, {"word": "proponents", "definition": "people who support an idea or course of action."}, {"word": "disproportionately", "definition": "to an extent that is too large or too small in comparison with something else."}, {"word": "secular fabric", "definition": "the non-religious foundation or structure of a society, ensuring equal treatment for all religions."}, {"word": "mandates", "definition": "officially orders or requires something."}, {"word": "unwarranted", "definition": "not justified or authorized."}, {"word": "enshrines", "definition": "preserves (a right, tradition, or idea) in a form that ensures it will be protected and respected."}]}}, "questions": [{"q": "What is the main topic of the article?", "a": "The main topic is a new anti-conversion law in India's Maharashtra state that affects religious freedom."}, {"q": "What is one concern people have about this new law?", "a": "People are concerned that the law might limit individuals' freedom to choose their own religion or could be misused to harass religious minorities."}], "id": "a02b3b0e5d7", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmj4jg2vxvpdo?at_medium=RSS&at_campaign=rss", "published": "2026-09-29T09:50:19+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "US Prosecutors Reopen Cornell University Alleged Rape Case", "excerpt": "US prosecutors have reopened an investigation into an alleged gang rape at a Cornell University fraternity house in 2024.", "levels": {"Beginner": {"text": "US prosecutors are looking again at a case from Cornell University. This happened after a woman started a legal case, called a civil lawsuit. She says she was drugged and raped at a fraternity house in 2024.\n\nA fraternity house is a special club for male students at a university. The woman says the incident happened there. When prosecutors reopen a case, it means they are investigating it again. They want to find out what happened.\n\nThe original case was about an alleged gang rape. \"Alleged\" means it is said to have happened, but it is not yet proven in court. The woman's civil lawsuit made the prosecutors look at the case with new eyes. A civil lawsuit is when one person sues another person or group for money or to make something right. It is different from a criminal case, which is about breaking the law.\n\nThis news means the authorities are taking the woman's claims seriously. They will gather more information and evidence to understand the situation better. The university campus community is likely watching this case closely.", "vocab": [{"word": "Prosecutors", "definition": "Lawyers who work for the government and try to prove someone broke the law."}, {"word": "Reopen", "definition": "To start looking at something again after it was stopped."}, {"word": "Alleged", "definition": "Said to have happened, but not yet proven."}, {"word": "Fraternity", "definition": "A social club for male students at a university or college."}, {"word": "Lawsuit", "definition": "A legal problem between two people or groups that is decided in court."}, {"word": "Drugged", "definition": "Given drugs, often without knowing or agreeing."}]}, "Intermediate": {"text": "US prosecutors have decided to reopen an investigation into an alleged gang rape at Cornell University. This significant development comes after a woman filed a civil lawsuit earlier this year, alleging she was drugged and raped at a fraternity house in 2024.\n\nThe decision to reopen the case indicates that new information or a fresh perspective has emerged, prompting authorities to re-examine the incident. An \"alleged\" crime means that the act is claimed to have occurred, but it has not yet been proven in a court of law. The initial investigation might have stalled or concluded without charges, but the civil lawsuit has brought the matter back into the spotlight for criminal consideration.\n\nA civil lawsuit is a legal action brought by one party against another, typically seeking monetary compensation or a specific action, rather than criminal punishment. In this instance, the woman's civil suit details her claims of being drugged and sexually assaulted at a fraternity house on the Cornell campus. Fraternities are social organizations for male students, often with their own residential houses, and they have sometimes been associated with allegations of misconduct on university campuses.\n\nThe reopening of a criminal investigation following a civil action is not uncommon. Civil cases can sometimes uncover evidence or compel testimony that was not available or considered during initial criminal inquiries. This move by prosecutors signals a renewed commitment to thoroughly investigate the woman's allegations. The case highlights ongoing concerns about campus safety and the handling of sexual assault claims at universities across the country.", "vocab": [{"word": "Investigation", "definition": "A formal inquiry or systematic examination to discover and examine the facts of a situation."}, {"word": "Civil lawsuit", "definition": "A legal case where one person or group sues another for money or to make them do something, rather than for criminal punishment."}, {"word": "Allegations", "definition": "Claims or statements that someone has done something wrong or illegal, but which are not yet proven."}, {"word": "Fraternity house", "definition": "A building where members of a fraternity (a social club for male students) live or meet."}, {"word": "Reopened", "definition": "Started again or resumed after being closed, stopped, or concluded."}, {"word": "Campus", "definition": "The grounds and buildings of a university, college, or school."}, {"word": "Misconduct", "definition": "Unacceptable or improper behavior, especially by an employee or professional person."}]}, "Advanced": {"text": "US prosecutors have made the notable decision to reopen a criminal investigation into an alleged gang rape at Cornell University, a move that underscores the persistent challenges of addressing sexual assault within academic institutions. This development follows the filing of a civil lawsuit by a woman who alleges she was drugged and subsequently raped at a fraternity house on the Ithaca campus in 2024.\n\nThe reopening of a criminal case, particularly one that may have previously been closed or deemed inconclusive, is a significant procedural step. It suggests that the civil litigation, which typically seeks monetary damages or specific relief rather than criminal penalties, has either unearthed new evidence, compelled testimony, or presented a compelling narrative that warrants a fresh look by law enforcement. Prosecutors operate under a different burden of proof than civil courts, requiring evidence beyond a reasonable doubt for a conviction. The woman's civil complaint, by detailing her allegations of being incapacitated by drugs and then sexually assaulted, has evidently provided sufficient impetus for a renewed criminal inquiry.\n\nFraternity houses, often central to social life on American university campuses, have frequently been the subject of scrutiny regarding incidents of sexual misconduct and hazing. This case at Cornell adds to a broader national conversation about campus safety, the culture within Greek life organizations, and the efficacy of institutional responses to such grave allegations. Universities, while often conducting their own internal investigations and disciplinary proceedings, operate separately from the criminal justice system. The involvement of federal or state prosecutors elevates the matter to a different legal plane, with potentially more severe consequences for those found responsible.\n\nThe principle of due process dictates that all parties involved are entitled to fair treatment under the law. While the allegations are serious, the reopening of the investigation means a thorough and impartial examination of all available evidence will now proceed. This process aims to ascertain the facts, determine if criminal acts occurred, and, if so, hold perpetrators accountable. The outcome of this renewed investigation will undoubtedly be closely watched by the Cornell community and advocates for victims of sexual assault, potentially setting a precedent for how civil actions can influence criminal justice outcomes in similar cases.", "vocab": [{"word": "Underscores", "definition": "Emphasizes or highlights the importance of something."}, {"word": "Procedural", "definition": "Relating to or denoting an established or prescribed way of doing something, especially in a legal or governmental context."}, {"word": "Civil litigation", "definition": "The process of taking legal action in a civil court, typically to resolve disputes between individuals or organizations."}, {"word": "Impetus", "definition": "The force or energy with which a body moves; also, something that makes a process or activity happen or happen more quickly."}, {"word": "Scrutiny", "definition": "Critical observation or examination, often implying a detailed and careful inspection."}, {"word": "Efficacy", "definition": "The ability to produce a desired or intended result; effectiveness."}, {"word": "Due process", "definition": "Fair treatment through the normal judicial system, especially as a citizen's entitlement."}, {"word": "Accountable", "definition": "Required or expected to justify actions or decisions; responsible."}]}}, "questions": [{"q": "What prompted US prosecutors to reopen the case at Cornell University?", "a": "US prosecutors reopened the case after the woman filed a civil lawsuit."}, {"q": "Where did the alleged incident take place?", "a": "The alleged incident took place at a fraternity house at Cornell University."}], "id": "a1615fe98f1", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c5wyzrm0n74ro?at_medium=RSS&at_campaign=rss", "published": "2026-09-29T09:38:23+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Senate Rejects Proposal to Cap College Sports Ticket Prices", "excerpt": "The U.S. Senate has voted against a plan that would have limited how much universities can increase ticket prices for college sports.", "levels": {"Beginner": {"text": "The U.S. Senate recently said no to a new plan. This plan wanted to stop college sports tickets from getting too expensive. Many people like to watch college sports, like football and basketball, at universities.\n\nSome people thought that tickets cost too much money. They believed it was hard for fans, especially students, to go to games. So, they wanted a rule to limit how much ticket prices could go up each year.\n\nBut the Senate did not agree. Universities use the money they get from selling tickets. This money helps pay for many things in their sports programs. For example, it helps pay for coaches, sports fields, and scholarships for student-athletes. If ticket prices were limited, universities might get less money.\n\nBecause the Senate said no, universities can still decide how much to charge for tickets. This means ticket prices for college sports might continue to rise. Fans will need to pay what the universities ask to watch their favorite teams play.", "vocab": [{"word": "Senate", "definition": "A part of the U.S. government that makes laws."}, {"word": "Proposal", "definition": "A plan or idea that is suggested for people to think about."}, {"word": "Limit", "definition": "To stop something from getting bigger or going past a certain point."}, {"word": "College sports", "definition": "Games like football or basketball played by students at universities."}, {"word": "Universities", "definition": "Large schools where people go to study after high school."}, {"word": "Fans", "definition": "People who really like and support a sports team or person."}]}, "Intermediate": {"text": "The U.S. Senate recently voted against a plan that aimed to put a cap on how much ticket prices for college sports could increase. This decision means that universities will continue to have control over setting their ticket prices, which could lead to higher costs for fans attending games.\n\nCollege sports, especially football and basketball, are very popular in the United States and generate a lot of money for universities. This revenue comes from ticket sales, TV deals, and merchandise. This income is crucial for funding athletic departments, paying for coaches' salaries, maintaining facilities, and providing scholarships for student-athletes.\n\nThe proposal to limit ticket price increases came from some lawmakers concerned about affordability. They argued that rising ticket costs make it difficult for many fans, including students and families, to attend games. Supporters of the proposal believed that capping increases would make college sports more accessible to a wider audience.\n\nHowever, many senators opposed the measure. Their main concern was the financial impact on university athletic programs. They argued that limiting ticket revenue could force universities to cut back on sports programs, reduce scholarships, or invest less in facilities. Opponents also highlighted that universities often reinvest this money directly back into student-athlete welfare and educational opportunities.\n\nThe defeat of the proposal reflects a preference for allowing market forces to determine ticket prices. While this maintains financial flexibility for college athletic departments, it also means that fans should expect ticket prices to continue rising in line with demand and operational costs. The debate underscores the ongoing tension between the commercial aspects of college sports and the desire for accessibility for its dedicated fanbase.", "vocab": [{"word": "Senate", "definition": "One of the two houses of the U.S. Congress, responsible for making laws."}, {"word": "Proposal", "definition": "A formal suggestion or plan put forward for consideration."}, {"word": "Limit", "definition": "To restrict the size, amount, or extent of something; to set a maximum."}, {"word": "Revenue", "definition": "The income that a business or organization receives, especially from sales or services."}, {"word": "Affordability", "definition": "The state of being inexpensive enough for people to buy or pay for."}, {"word": "Accessible", "definition": "Able to be reached or entered; easy for people to obtain or use."}, {"word": "Financial impact", "definition": "The effect that something has on money or finances."}]}, "Advanced": {"text": "The United States Senate recently delivered a decisive blow to a legislative initiative aimed at reining in the escalating cost of college sports tickets. The proposal, which sought to impose federal limits on the rate at which universities could increase ticket prices for athletic events, was ultimately defeated. This outcome signals a continued hands-off approach to the financial operations of collegiate athletics, ensuring that institutions will retain autonomy over their ticketing strategies. This decision carries significant ramifications for both university athletic departments and the millions of fans who follow college sports.\n\nCollegiate athletics, particularly major Division I football and basketball, constitutes a multi-billion-dollar industry in the U.S., serving as a significant revenue engine for many universities. These funds are crucial for sustaining comprehensive athletic programs, covering expenses such as coaching salaries, state-of-the-art facilities, travel, and, critically, scholarships for student-athletes across numerous sports. Proponents of unrestricted pricing argue that ticket sales are a vital component of this financial ecosystem, enabling universities to maintain competitive programs and provide robust support for their athletes.\n\nThe defeated proposal emerged from a growing chorus of concerns regarding the affordability and accessibility of college sports. Advocates for price caps contended that unchecked price hikes were increasingly alienating a substantial portion of the fanbase, including students, alumni, and families, for whom attending games was becoming a prohibitive luxury. They posited that federal intervention was necessary to safeguard the grassroots appeal of college sports and ensure that these cultural institutions remained accessible to a broad demographic, rather than becoming exclusive spectacles.\n\nHowever, strong opposition coalesced around arguments emphasizing institutional autonomy and the potential for adverse economic consequences. Opponents in the Senate underscored that mandating price controls could severely curtail the revenue streams essential for funding athletic scholarships, improving infrastructure, and investing in athlete welfare programs. They argued that such limitations might compel universities to reduce the scope of their athletic offerings or diminish the quality of support provided to student-athletes, thereby undermining the very programs the revenue is intended to sustain. Furthermore, many senators expressed skepticism about federal government overreach into the financial management of private and public universities, preferring to allow market dynamics to dictate pricing structures.\n\nThe Senate's vote reflects a prevailing legislative reluctance to intervene directly in the economic models of collegiate sports, despite ongoing debates about amateurism, athlete compensation, and the commercialization of the enterprise. While this decision grants universities continued financial latitude, it simultaneously places the onus on them to balance revenue generation with fan engagement and affordability. For the dedicated fanbase, the implication is clear: the upward trajectory of ticket prices is likely to persist, driven by demand, operational costs, and the competitive pressures inherent in high-stakes college athletics. This outcome reinforces the complex interplay between sports, finance, and public policy within the American higher education landscape.", "vocab": [{"word": "Legislative initiative", "definition": "A formal proposal for a new law or policy."}, {"word": "Reining in", "definition": "To control or limit something that is growing or increasing too quickly."}, {"word": "Escalating", "definition": "Increasing rapidly in amount, extent, or intensity."}, {"word": "Autonomy", "definition": "The right or condition of self-government; independence to make one's own decisions."}, {"word": "Ramifications", "definition": "The complex or unwelcome consequences of an action or event."}, {"word": "Prohibitive", "definition": "(Of a cost or fee) so high as to prevent someone from doing something."}, {"word": "Coalesced", "definition": "To come together to form one mass or whole; to unite for a common purpose."}, {"word": "Skepticism", "definition": "A doubtful attitude towards something, especially regarding its truth or effectiveness."}]}}, "questions": [{"q": "What did the U.S. Senate recently v 9fM2UzUEJuMS1DNVRWM2R4TWZjNXFnRzJnUWhSQjNkeHVTTkFCcHl0b0NMc0tuOXF0Y3V6MmZkaW5rbHAtTHR4MndwUk1IN1c2cXNnb3paSkNHUFlpcnF2RDlZcXBPTXhjWmM4SjVVZkxkenBsZjdWcVJWYjJ1V01kc2V3?oc=5", "published": "2026-09-29T10:10:00+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
