under.\n\nSecond, he talked about Canada basketball. Shai is from Canada. He plays for his country's national team. He is a very important player for Canada. The team has been doing very well. They hope to play in big games like the Olympics. Shai is proud to play for Canada and wants to help them win.\n\nThird, he also talked about his new haircut! This was a fun, light topic. It shows that even famous athletes talk about everyday things.\n\nShai Gilgeous-Alexander is a key player for his club team and his country. He is excited about his future in basketball.", "vocab": [{"word": "famous", "definition": "known by many people."}, {"word": "trade", "definition": "when sports teams exchange players."}, {"word": "journey", "definition": "a trip or a path through life."}, {"word": "national team", "definition": "a sports team that represents a whole country."}, {"word": "proud", "definition": "feeling happy and good about something you or someone you know has done."}, {"word": "athlete", "definition": "a person who is good at sports."}]}, "Intermediate": {"text": "NBA star Shai Gilgeous-Alexander, a standout guard for the Oklahoma City Thunder, recently shared his thoughts on several key aspects of his career and personal life. His comments, reported by The Oklahoman, covered a significant trade that shaped his path, his leadership role with Canada's national basketball team, and even a lighter note about his new haircut.\n\nGilgeous-Alexander reflected on the trade that brought him to Oklahoma City. This pivotal moment occurred in 2019 when he was part of a major deal that sent Paul George to the Los Angeles Clippers. This trade was instrumental in facilitating Kawhi Leonard's decision to join the Clippers, as Leonard wanted another star alongside him. For SGA, it meant moving from the Clippers, where he had played his rookie season, to the Thunder. He views this move as a crucial turning point, allowing him to grow into the All-Star player he is today, leading a young and exciting Thunder team.\n\nBeyond his NBA career, Gilgeous-Alexander spoke passionately about his commitment to Canada basketball. As one of the country's most prominent athletes, he plays a vital role on the men's national team. Under his leadership, Canada has achieved significant success, including qualifying for major international tournaments like the FIBA World Cup and securing a spot in the upcoming Olympic Games. He expressed his pride in representing his homeland and his determination to help the team reach new heights on the global stage.\n\nFinally, in a more casual moment, SGA also touched upon his new haircut. While a minor detail, it offered a glimpse into the personal side of the high-profile athlete, showing that even professional sports stars have everyday interests and changes in style.\n\nShai Gilgeous-Alexander continues to be a central figure for both the Thunder and Team Canada, with his reflections highlighting his journey and ambitions in the world of basketball.", "vocab": [{"word": "standout", "definition": "a person or thing that is much better than others."}, {"word": "pivotal", "definition": "very important, having a central role in something."}, {"word": "instrumental", "definition": "very important in helping something to happen."}, {"word": "facilitating", "definition": "making an action or process easy or easier."}, {"word": "prominent", "definition": "important and well-known."}, {"word": "commitment", "definition": "a promise or firm decision to do something."}, {"word": "ambitions", "definition": "a strong desire to do or achieve something."}]}, "Advanced": {"text": "Oklahoma City Thunder's All-NBA guard, Shai Gilgeous-Alexander, recently offered candid insights into pivotal moments of his burgeoning career, his profound connection to Canadian basketball, and even a lighthearted take on his updated appearance. His remarks, reported by The Oklahoman, underscore his thoughtful approach to both his professional trajectory and national identity.\n\nGilgeous-Alexander delved into the intricacies of the trade that ultimately landed him in Oklahoma City. In 2019, he was a key component of the blockbuster deal that sent perennial All-Star Paul George to the Los Angeles Clippers. This transaction was widely understood to be instrumental in appeasing Kawhi Leonard, who reportedly conditioned his move to the Clippers on the acquisition of another superstar. For SGA, then a promising rookie with the Clippers, the trade represented a significant, albeit initially unexpected, redirection of his career. He has since articulated how this shift, moving him from a supporting role to the undisputed leader of a rebuilding Thunder franchise, was crucial for his development into one of the league's elite talents. His reflections highlight a mature perspective on how unforeseen circumstances can forge a path to greater opportunity and personal growth.\n\nBeyond his NBA exploits, Gilgeous-Alexander articulated his deep-seated pride and unwavering commitment to Canada's national basketball program. As the undisputed cornerstone of the men's national team, he has spearheaded a remarkable resurgence in Canadian basketball. Under his leadership, the team has not only secured berths in prestigious international tournaments, such as the FIBA World Cup, but also clinched a coveted spot in the upcoming Olympic Games, marking a significant milestone for the nation. SGA's dedication extends beyond mere participation; he embodies the aspirations of a country increasingly making its mark on the global basketball stage, striving to elevate Canada to perennial contender status.\n\nIn a more casual vein, Gilgeous-Alexander also commented on his new haircut, a minor personal detail that nonetheless offers a glimpse into the human element behind the athletic persona. Such moments of personal disclosure, however brief, serve to humanize elite athletes, reminding fans of their relatable experiences amidst the intense scrutiny of professional sports.\n\nShai Gilgeous-Alexander's recent commentary provides a comprehensive overview of his journey, from navigating complex league transactions to embracing national leadership, all while maintaining a grounded perspective on his personal evolution. His narrative is one of resilience, ambition, and a profound sense of purpose, both on and off the court.", "vocab": [{"word": "candid", "definition": "truthful and straightforward; frank."}, {"word": "burgeoning", "definition": "beginning to grow or increase rapidly; flourishing."}, {"word": "trajectory", "definition": "the path followed by a projectile flying or an object moving under the action of given forces; a path or course taken."}, {"word": "intricacies", "definition": "the quality of being intricate; complex or complicated details."}, {"word": "instrumental", "definition": "serving as a means of pursuing an aim or policy; essential or crucial."}, {"word": "appeasing", "definition": "pacify or placate (someone) by acceding to their demands."}, {"word": "cornerstone", "definition": "an essential, indispensable, or fundamental ingredient or principle."}, {"word": "spearheaded", "definition": "be the leader of (an attack or movement)."}]}}, "questions": [{"q": "What three main topics did Shai Gilgeous-Alexander discuss?", "a": "Shai Gilgeous-Alexander discussed a trade involving Kawhi Leonard, his role with Canada basketball, and his new haircut."}, {"q": "How did the trade involving Kawhi Leonard ultimately lead Shai Gilgeous-Alexander to play for the Oklahoma City Thunder?", "a": "The trade involving Kawhi Leonard led to Paul George being traded to the Los Angeles Clippers to play alongside Leonard. As part of that deal, Shai Gilgeous-Alexander was traded from the Clippers to the Oklahoma City Thunder."}], "id": "a0195dae04d", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi9gFBVV95cUxNcVc4dWxOdE9pS296ZEpldkFKTUJQVDgwbElWZFRKSkZoeVYxT3Q4R0g0VE9fUVl4bm53bHNCVUN1d05BUUc0X1lZRzkxSFJiQXZzV2Y0Ykh4V0pxcnRoaTNtcXlQYjRZc0hEeUV0QWc1LXBFTjRoU1FGU2ZWWkZXdHN3X2Rvbm1UUDVwa3ZScThicDNzcmF4bi00ZVJ2Vks0b0VBdk0zY0k0UGVXeWhieXNPOUk2dXRCVEVUbGQ4bDVuTHYwT3o3WHktUEYtUW43eE03S1Via0ZRT1hWN0stMk1jMWNCN2p5cF9QVGxBdDdkZUdIamc?oc=5", "published": "2026-07-05T07:38:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Yankees Face Crucial Trade Deadline to Boost Roster", "excerpt": "The New York Yankees face a critical trade deadline, aiming to acquire new players to strengthen their team and boost championship hopes.", "levels": {"Beginner": {"text": "The New York Yankees are a very famous baseball team. They play many games during the baseball season. Right now, the Yankees need to make their team stronger. There is a special time called the \"trade deadline.\" This is when baseball teams can swap players with other teams. It's like exchanging players to get new ones.\n\nA recent report says that the Yankees have more needs than before. This means they need to find more good players to join their team. They want to get players who can help them win more games and play better. The trade deadline is coming soon, and it's a very important time for the Yankees. They must try hard to get the right players. If they get good new players, their team can become much stronger. This will help them compete better against other teams and try to win the championship. It is a big moment for the team to improve and reach their goals for the season.", "vocab": [{"word": "team", "definition": "A group of people who play a sport together."}, {"word": "season", "definition": "A part of the year when a sport is played."}, {"word": "trade", "definition": "To exchange something for something else, like players between teams."}, {"word": "deadline", "definition": "A specific time or date by which something must be done."}, {"word": "stronger", "definition": "Having more power or ability; better."}, {"word": "compete", "definition": "To try to win against others."}]}, "Intermediate": {"text": "The New York Yankees, one of baseball's most storied franchises, are approaching a crucial period in their season: the trade deadline. This annual event marks a specific point when Major League Baseball teams can make trades, exchanging players with other clubs to improve their rosters. Recent reports indicate that the Yankees have identified additional areas where their team needs strengthening, making this deadline particularly significant for their aspirations.\n\nFor a team like the Yankees, known for their relentless pursuit of championships, the trade deadline is a strategic opportunity. Teams typically use this window to address weaknesses that have emerged during the first half of the season, add depth to their bench or pitching staff, or acquire specific talent that can push them closer to their goals. This might involve seeking a more consistent hitter, a reliable relief pitcher, or an upgrade in defense at a key position. The front office must carefully evaluate the market, considering available players, their contracts, and the cost in terms of prospects or other players.\n\nThe pressure on the Yankees to perform well is always immense, and failing to address perceived deficiencies at the deadline can have significant consequences for their playoff aspirations and fan morale. Acquiring the right players can provide a much-needed boost, injecting new energy and skill into the lineup and potentially turning their season around. Conversely, inaction or poor trades can hinder their chances of success and lead to disappointment. As the deadline draws near, fans and analysts alike will be closely watching to see how the Yankees' management \"attacks\" this critical juncture. Their goal is clear: to transform their wish list into tangible improvements on the field and strengthen their bid for a championship title, ensuring they remain competitive in a challenging league.", "vocab": [{"word": "franchise", "definition": "A professional sports team, especially one that is well-known."}, {"word": "crucial", "definition": "Extremely important or essential."}, {"word": "deadline", "definition": "A specific time or date by which something must be completed."}, {"word": "roster", "definition": "The list of players on a team."}, {"word": "strategic", "definition": "Related to a plan of action designed to achieve a major goal."}, {"word": "deficiencies", "definition": "Lacks or imperfections; weaknesses."}, {"word": "aspirations", "definition": "Strong hopes or ambitions for achievement."}]}, "Advanced": {"text": "The New York Yankees, a franchise synonymous with championship contention, are facing an increasingly imperative trade deadline as the Major League Baseball season progresses. Recent analyses suggest that the team's \"wish list\" of needs has expanded, underscoring the urgency for aggressive and astute maneuvering in the player market. This annual juncture represents a pivotal moment for teams to recalibrate their rosters, addressing emergent weaknesses or bolstering existing strengths for a sustained playoff push.\n\nFor a high-profile organization like the Yankees, the trade deadline is fraught with strategic complexities. General managers must meticulously weigh the immediate benefits of acquiring veteran talent against the long-term implications of depleting their prospect pool – the young, promising players who represent the future of the franchise. The market itself is a dynamic ecosystem, characterized by \"buyers\" (contending teams seeking upgrades) and \"sellers\" (rebuilding teams offloading valuable assets for future returns). Identifying undervalued talent, navigating salary cap considerations, and outmaneuvering rival clubs in negotiations require a sophisticated understanding of both baseball analytics and human dynamics. The scarcity of impact players often inflates prices, demanding difficult decisions regarding the allocation of resources, whether it's trading away highly-touted prospects or taking on significant financial commitments.\n\nThe strategic decisions made at the deadline can define a season. Teams must assess whether they are legitimate contenders worthy of \"going all-in,\" or if they should adopt a more conservative approach, preserving future assets. For the Yankees, given their historical expectations and substantial payroll, the default posture is almost always that of a buyer. However, the challenge lies in identifying the *right* players who can make a difference without overpaying or disrupting team chemistry. This involves scouting, statistical analysis, and understanding how a new player will integrate into the existing clubhouse culture.\n\nThe pressure on the Yankees is perpetually immense, fueled by a demanding fan base and a rich history of success. Failure to adequately address perceived deficiencies at this critical juncture can have profound ramifications, potentially jeopardizing their postseason berth and eroding confidence in the front office's strategic vision. A well-executed trade deadline can galvanize a clubhouse, inject vital new energy, and provide the specific skill sets necessary to overcome formidable opponents. Conversely, a passive approach or missteps in player acquisition can exacerbate existing problems, leading to a disappointing finish and intense scrutiny from media and supporters. As the deadline approaches, all eyes will be on the Yankees' management to demonstrate their resolve and strategic acumen, transforming their identified needs into tangible on-field improvements that solidify their quest for another World Series title.", "vocab": [{"word": "imperative", "definition": "Extremely important or urgent; essential."}, {"word": "astute", "definition": "Having or showing an ability to accurately assess situations or people and turn this to one's advantage; shrewd."}, {"word": "juncture", "definition": "A particular point in events or time; a critical moment."}, {"word": "meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "depleting", "definition": "Using up the supply or resources of; reducing."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event, especially one that is not immediately obvious."}, {"word": "galvanize", "definition": "Shock or excite (someone) into taking action; spur into action."}, {"word": "acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}]}}, "questions": [{"q": "What is the 'trade deadline' in baseball?", "a": "The trade deadline is a specific time when baseball teams can exchange players with other teams to improve their rosters."}, {"q": "Why is the upcoming trade deadline particularly important for the New York Yankees?", "a": "The trade deadline is important for the Yankees because they have identified additional needs for their team and want to acquire new players to strengthen their roster and improve their chances of winning."}], "id": "a3a632e5d59", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxQUHF3RTJCU3Zmd3hQZDE4NVU3X2VXT2t2Tl9ZeUtzeXo5dTZxUjhYRWlHUVhXWS1aYjhFT3NiOXlDb3pqWE9ySk9FaWNEcVZZMy04em5CUGFsOVNFSlZPVmx5QnVHZXJUUkFvRmJCLUc2V1FKMjNUNGxsaGtjMkZXX204bkh0XzRmd1VHYnZsMkMxek9wUXdadEdXSUJCdzFDSW1MUEdBNW93clNm?oc=5", "published": "2026-07-05T07:33:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "National Bank Seeks Income Boost, Central Bank Asks Government for Support", "excerpt": "National Bank aims to lease its HQ tower for income, prompting the central bank to request special government facilities.", "levels": {"Beginner": {"text": "National Bank wants to rent out its main office building. This building is where the bank's main operations are, its headquarters. By leasing parts of its headquarters, the bank hopes to get more money. This plan will help the bank improve its income and financial health. Banks usually make money from giving out loans and charging interest. But renting out property can be another way for a bank to earn money. This is called non-interest income.\n\nThe central bank has also become involved in this situation. The central bank is a very important bank that helps control other banks and keeps the country's money system stable. It has written a letter to the government. In this letter, the central bank asked the government for special help for National Bank. These \"special facilities\" would make it easier for National Bank to lease its building and achieve its goal.\n\nThis move could help National Bank become stronger financially. The government will now look at the central bank's request. This shows that important financial groups are working together to support National Bank's plan to boost its earnings.", "vocab": [{"word": "headquarters", "definition": "the main office or building of a company."}, {"word": "leasing", "definition": "renting out a property for a period of time."}, {"word": "income", "definition": "money that a person or company earns."}, {"word": "central bank", "definition": "a country's main bank that controls other banks and money."}, {"word": "facilities", "definition": "special help or services provided."}, {"word": "financial", "definition": "relating to money or how money is managed."}]}, "Intermediate": {"text": "National Bank, a prominent commercial financial institution, is planning a strategic move to lease out significant portions of its headquarters tower. This initiative is designed to substantially boost the bank's income, aiming to diversify its revenue streams beyond its traditional lending activities. By monetizing its valuable real estate assets, National Bank seeks to enhance its overall financial stability and improve operational efficiency. This approach allows the bank to generate income from resources that might otherwise be underutilized.\n\nThe plan has garnered the attention and involvement of the central bank, which plays a critical role in overseeing the nation's monetary policy and regulating the entire banking sector. The central bank has formally approached the government, submitting a request for \"special facilities\" specifically for National Bank. While the precise details of these facilities have not been publicly disclosed, they are commonly understood to encompass various forms of governmental support. This could include regulatory exemptions, specific tax incentives, or other types of assistance designed to streamline the leasing process and make the opportunity more appealing to potential tenants.\n\nThis direct request from the central bank to the government underscores the perceived importance of this plan for National Bank's financial health and, by extension, for broader financial stability. Commercial banks typically generate their primary income through interest earned on loans. However, strategies like leasing out non-core assets, such as excess office space, enable banks to generate non-interest income. This diversification of earnings can be particularly crucial during periods of economic uncertainty or when traditional loan growth slows, helping to stabilize overall profitability and reduce dependence on a single income source.\n\nThe government's upcoming consideration of the central bank's appeal highlights a collaborative effort between financial regulators and the state to support the banking sector. A positive decision on these special facilities could potentially set a precedent, encouraging other financial institutions to explore similar strategies for asset optimization and income generation. The financial community will be closely monitoring the outcome of the government's review.", "vocab": [{"word": "strategic", "definition": "carefully planned to achieve a specific goal."}, {"word": "diversifying", "definition": "spreading investments or activities over different areas to reduce risk."}, {"word": "monetizing", "definition": "converting an asset into money."}, {"word": "overseeing", "definition": "supervising or managing something."}, {"word": "disclosed", "definition": "revealed or made known."}, {"word": "precedent", "definition": "an earlier event or action that is regarded as an example or guide."}, {"word": "optimization", "definition": "the act of making the best or most effective use of a situation or resource."}]}, "Advanced": {"text": "National Bank, a prominent commercial lending institution, is embarking on a strategic initiative to unlock value from its substantial real estate holdings by leasing out significant portions of its headquarters tower. This move is primarily aimed at bolstering its non-interest income, a critical component for enhancing overall profitability and mitigating risks associated with an over-reliance on traditional interest-based revenue streams. By optimizing its asset utilization, the bank seeks to fortify its balance sheet and improve its capital adequacy ratios, which are vital indicators of financial resilience and regulatory compliance. This strategy aligns with a global trend among financial institutions to diversify revenue sources and reduce vulnerability to market volatility.\n\nThe proposal has garnered the attention and active involvement of the nation's central bank, the primary regulatory authority responsible for maintaining financial stability and overseeing the integrity of the banking system. The central bank has formally communicated with the government, submitting a comprehensive request for \"special facilities\" to support National Bank's endeavor. While the specific contours of these facilities remain undisclosed, they are likely to encompass a suite of governmental interventions. These could range from favorable tax treatments and expedited regulatory approvals for property conversion or leasing agreements, to potential assistance in attracting anchor tenants or even direct financial guarantees that would de-risk the investment for prospective lessees. The central bank's involvement suggests a recognition of the broader economic benefits or systemic importance of National Bank's financial health.\n\nThe central bank's direct advocacy for a commercial bank's asset monetization strategy underscores the perceived systemic importance of National Bank's financial health. It suggests that the central bank views this initiative not merely as a commercial decision, but as a measure contributing to broader financial sector stability. Such interventions are often considered when a significant financial institution seeks to strengthen its position, particularly in an economic climate where traditional revenue growth might be constrained or capital requirements are tightening. Diversifying income through non-core asset utilization is a recognized strategy for banks globally to enhance earnings stability and reduce vulnerability to interest rate fluctuations or credit cycle downturns, thereby fostering a more robust financial ecosystem.\n\nThe government's forthcoming deliberation on this request will be closely scrutinized by market participants and financial analysts. A positive response, particularly one involving significant \"special facilities,\" could establish a noteworthy precedent for how regulatory bodies and governments collaborate to support asset optimization strategies within the banking sector. It could also signal a broader policy stance encouraging financial institutions to re-evaluate their non-core assets for income generation, potentially leading to a wave of similar initiatives. Conversely, a rejection or a lukewarm response might indicate reservations about direct governmental involvement in commercial asset management or concerns about setting potentially problematic precedents regarding state aid. The outcome will undoubtedly influence future strategic planning across the financial industry, highlighting the delicate balance between market-driven initiatives and regulatory support aimed at systemic resilience.", "vocab": [{"word": "bolstering", "definition": "supporting or strengthening something."}, {"word": "mitigating", "definition": "making something less severe, serious, or painful."}, {"word": "fortify", "definition": "to strengthen or reinforce a position, especially financially."}, {"word": "capital adequacy ratios", "definition": "a measure of a bank's capital in relation to its risk-weighted assets, indicating its ability to absorb losses."}, {"word": "contours", "definition": "the specific details, outline, or scope of something."}, {"word": "endeavor", "definition": "an attempt to achieve a goal or undertake a difficult task."}, {"word": "systemic importance", "definition": "the significance of an institution whose failure could trigger a collapse of the entire financial system."}, {"word": "scrutinized", "definition": "examined or inspected very closely and carefully."}]}}, "questions": [{"q": "What is National Bank's main goal in leasing its headquarters tower?", "a": "National Bank's main goal is to boost its income and improve its financial health by earning money from renting out its property."}, {"q": "Why has the central bank become involved in National Bank's plan?", "a": "The central bank has become involved because it is asking the government for \"special facilities\" to help National Bank lease its building, indicating support for the plan's importance to financial stability."}], "id": "ab9df584d3a", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxQWTBuS1RYbXF0S011MlhwVHdEbFY5ZFUzYlowODktSFBUczFQbmFwNm9NTl9QMkJGYktHdFpEeUd0QWd1WXNzN1pySl83ZndvT2padVdlaURlZUhwTFRYNkdKVzh3bDhNdDI0RVZWSzlLd3JnR0VubkxQZTRTUWV3Z3ZNTXB1T3Bnb05ncmRyVTh2SG1qMy1KS2huZzNlTVhfN25BWENfNEhFRkNidXFzaFZsanp5OTZPWnfSAb8BQVVfeXFMTnFLZm1sYjBOZmFZVHZjNmI1alZZZjdCSXlsVmRaM0J0bDZNVHVremc3TEVDRW5SR3BVWURyZ0NaOXpmVTFUSGg3ZVdObE1scjlRVDY4YURsTFdJWk5UQ1UweDdxVnFpYi1OSEplY0lVQ0FoWnJLUjhCbXlTZFFRQ3NweW00MjlMYUkwVUVxb01qX0p2YVhndjdTVkJzRVZuU19NR1A4V2Y1M09Ld1lEZkVkRFpEMHkyZS1LTDdHaWM?oc=5", "published": "2026-07-05T06:40:53+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Former HSBC Staff Demand 120 Months' Salary Over Alleged Violations", "excerpt": "Former HSBC employees are demanding 120 months' salary, alleging the bank violated labor laws during their termination in Bangladesh.", "levels": {"Beginner": {"text": "Some people who used to work at HSBC bank are asking for a lot of money. They were fired from their jobs. Now, they want 120 months' worth of their salary. This means they want ten years of pay. They say that HSBC did not follow the rules when they fired them. These rules are called labor laws, and they protect workers. The former staff say the bank broke these important laws. \n\nThis situation is happening in Bangladesh. When a company fires someone, there are certain steps they must follow. Workers have rights, and companies must respect these rights. The former employees believe HSBC did not respect their rights. They are making a big demand for money because they feel they were treated unfairly. They hope to get the money they believe they are owed due to these alleged rule breaks.", "vocab": [{"word": "fired", "definition": "Lost a job, usually because the employer decided to end the employment."}, {"word": "salary", "definition": "The money a person earns for working, usually paid regularly."}, {"word": "rules", "definition": "Instructions that tell you what you are allowed or not allowed to do."}, {"word": "labor laws", "definition": "Rules that protect workers and say how companies must treat them."}, {"word": "unfairly", "definition": "In a way that is not right or just."}]}, "Intermediate": {"text": "A group of former employees from HSBC bank in Bangladesh is making a significant financial demand. They are seeking 120 months' worth of their gross salary, which amounts to ten years of pay, following their termination from the bank. The ex-staff members allege that HSBC violated established labor laws during the process of ending their employment.\n\nLabor laws are put in place to protect the rights of workers and ensure fair treatment by employers. These laws often dictate proper procedures for hiring, working conditions, and crucially, for termination. The former HSBC staff claim that the bank failed to adhere to these legal requirements, leading to what they consider an unjust dismissal. Their demand for such a substantial amount of compensation reflects their belief that the bank's actions were a serious breach of their rights.\n\nThis kind of dispute can often lead to legal action or mediation. When employees feel their rights have been violated, they can seek redress through the courts or labor tribunals. The outcome of such cases can set precedents for how companies handle employee terminations in the future. For HSBC, these allegations present a challenge that could impact its reputation and potentially result in a considerable financial settlement if the claims are substantiated.", "vocab": [{"word": "significant", "definition": "Important or noticeable."}, {"word": "terminated", "definition": "Ended someone's employment; fired them."}, {"word": "allege", "definition": "To state that someone has done something wrong, but without proof."}, {"word": "violated", "definition": "Broke or failed to follow a law, rule, or agreement."}, {"word": "compensation", "definition": "Money given to someone because they have suffered an injury or loss."}, {"word": "dispute", "definition": "A disagreement or argument."}]}, "Advanced": {"text": "A contentious labor dispute has emerged in Bangladesh, where a cohort of former HSBC employees is collectively demanding an extraordinary 120 months' worth of their gross salary, equating to a decade of remuneration. These ex-staff members contend that their termination by the multinational banking giant constituted a blatant disregard for established labor laws and statutory protections afforded to workers.\n\nThe allegations center on the premise that HSBC failed to adhere to the prescribed legal frameworks governing employee dismissal. Labor laws are meticulously crafted to safeguard workers' rights, ensuring due process, fair compensation, and protection against arbitrary or unlawful termination. The former employees assert that the bank's actions bypassed these critical provisions, rendering their dismissals unjust and illegal. Their substantial financial claim underscores the perceived severity of the alleged infractions and the significant impact on their livelihoods.\n\nSuch high-stakes demands typically escalate into protracted legal battles, often involving labor courts or specialized tribunals. The outcome of these proceedings can have far-reaching implications, not only for the individuals involved but also for corporate labor practices and the interpretation of employment legislation within the jurisdiction. For HSBC, these allegations pose a considerable reputational risk and could necessitate a substantial financial outlay if the claims are substantiated through judicial review. Furthermore, the case could set a precedent for future labor disputes in the country, influencing how other major corporations manage workforce reductions or terminations. The bank will likely need to mount a robust defense against these serious accusations to mitigate potential damages and uphold its operational integrity.", "vocab": [{"word": "contentious", "definition": "Causing or likely to cause an argument; controversial."}, {"word": "cohort", "definition": "A group of people with a shared characteristic, often used in a professional context."}, {"word": "remuneration", "definition": "Money paid for work or a service; salary or wages."}, {"word": "contend", "definition": "To assert something as a position in an argument; to claim."}, {"word": "blatant", "definition": "Done openly and unashamedly, often in a negative sense; obvious."}, {"word": "statutory", "definition": "Required, permitted, or enacted by statute (law)."}, {"word": "infractions", "definition": "Violations or breaches of a law, agreement, or rule."}, {"word": "substantiated", "definition": "Supported with proof or evidence; confirmed as true."}]}}, "questions": [{"q": "What is the main demand of the former HSBC staff?", "a": "The former HSBC staff are demanding 120 months' worth of their gross salary."}, {"q": "Why are the former employees making this demand?", "a": "They are making this demand because they allege that HSBC violated labor laws during their termination."}], "id": "a8a650bbde2", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxPV0U0NmE1QkJodG8yOFZPQzFvdTZRa0RsbkpjaWZ0cWJBS3R5MVJLRGNCcUZLTGliWVVoRzlIZjZLTHhOYWYtTkdSVEdMUFlkVFhiUzloRTF6M1J0Q2oxc3llQ1J5bUtFNm14dnNCWml4M3lyb0p6TTZhVlJneHRzZUg0YXFhUDJXS1gwOWdJTXRXVUtTclg0UlBHckFLS1NaSkpRbkloUDdZdEFvV2lXRGtyYkJ2cmFPZzIySHNqRWrSAcYBQVVfeXFMUHNZVUhvOGRWUEVfU2g0WU5LR3JJXzhXckdhTDVhRUpjNXNWZFRWVDFNU1d5bktXRU9IRkt1SDdtaGFIb2d2YkpOLTFsRTl1M3U2dDNEYzVVQmpBVVVJNzVaazV1Q3ZfRDhQVExjSEp1ZmhIOWhpTWl0cTRlZE5pSXFLYUwxRzhaUzh0ZjB5ZEdjalJEbEtiT29udG5PXzJYdmZMRDQ2YU1WR041RWJuc2tNVjZDLVBBQ25ZZnRZMmx4LThZYkd3?oc=5", "published": "2026-07-05T06:30:46+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "117 Signatories Urge India-Pakistan Dialogue Amid Tensions", "excerpt": "A group of 117 prominent individuals has signed a letter urging India and Pakistan to resume talks amidst political polarization.", "levels": {"Beginner": {"text": "A group of 117 people has written a letter to India and Pakistan. These people want the two countries to start talking to each other again. This is called dialogue. India and Pakistan are neighbors, but they often have problems and disagreements. Their politics are very divided, which means people have strong, different ideas. The letter says that talking is very important, especially when there are many problems. It asks leaders in both countries to find ways to speak and work together. The people who signed the letter believe that talking can help solve problems and make things more peaceful. They hope that dialogue will help reduce the tension between India and Pakistan. This letter shows that many people want to see better relations between these two important nations. They think that peace and stability in the region depend on India and Pakistan finding common ground through discussion.", "vocab": [{"word": "Dialogue", "definition": "talking between two or more groups."}, {"word": "Urge", "definition": "to strongly ask or advise someone to do something."}, {"word": "Politics", "definition": "the activities of government and how countries are run."}, {"word": "Solve", "definition": "to find an answer to a problem."}, {"word": "Tension", "definition": "a feeling of worry, anger, or stress between people or countries."}, {"word": "Peaceful", "definition": "quiet and calm, without fighting or trouble."}]}, "Intermediate": {"text": "A collective of 117 prominent individuals has issued an urgent appeal for India and Pakistan to resume bilateral dialogue amidst a period of heightened political polarization. The signatories, who include academics, former diplomats, and activists from various fields, have penned a letter emphasizing the critical importance of communication between the two nuclear-armed neighbors. India and Pakistan share a long and often troubled history, marked by several wars and ongoing geopolitical tensions, particularly over the disputed region of Kashmir. Diplomatic ties have frequently been strained, and direct talks have often stalled.\n\nThe letter highlights that the current political climate in both nations is deeply divided, making constructive engagement even more challenging but also more necessary. In such an environment, the absence of direct communication channels can exacerbate misunderstandings and increase the risk of minor incidents escalating into larger crises. The signatories argue that dialogue is not a concession but an imperative for peace and stability in South Asia. By urging a return to sustained talks, they aim to foster an environment where complex issues can be discussed, and potential solutions explored through peaceful means. They believe that consistent diplomatic engagement is essential for regional stability and for addressing shared challenges like poverty, public health, and climate change, which affect millions across the subcontinent. This initiative by civil society members underscores a widespread desire for de-escalation and a pathway towards a more peaceful coexistence between India and Pakistan, stressing that official channels for discussion must be reopened to prevent further deterioration of relations. The lack of formal dialogue has often left a vacuum, filled by rhetoric and mistrust, making it harder to build bridges between the two nations.", "vocab": [{"word": "Collective", "definition": "a group of people working together or sharing an interest."}, {"word": "Prominent", "definition": "important and well-known."}, {"word": "Bilateral", "definition": "involving two groups or countries."}, {"word": "Polarized", "definition": "divided into two sharply opposing groups or sets of opinions."}, {"word": "Signatories", "definition": "people who have signed a document."}, {"word": "Geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "Diplomatic", "definition": "relating to the management of relationships between countries."}, {"word": "De-escalation", "definition": "the process of reducing the intensity of a conflict or situation."}]}, "Advanced": {"text": "A collective of 117 influential signatories, comprising distinguished academics, former diplomats, civil society leaders, and public intellectuals, has issued a compelling appeal for India and Pakistan to re-engage in sustained bilateral dialogue. This urgent call comes amidst a period characterized by deeply entrenched political polarization within both nations and a protracted freeze in official communication channels between the two nuclear-armed neighbors. The historical trajectory of India-Pakistan relations has been fraught with periods of intense conflict, including multiple wars, and persistent geopolitical friction, notably concerning the contested territory of Kashmir and cross-border security concerns. The prolonged absence of regular, high-level diplomatic engagement has often exacerbated mistrust, fueled nationalist rhetoric, and significantly hindered efforts towards fostering regional stability.\n\nThe letter critically underscores that the prevailing political climate, marked by heightened nationalism and partisan divisions, makes the resumption of constructive dialogue not merely advisable but an absolute imperative. In such an environment, the lack of direct, formal communication mechanisms can lead to dangerous miscalculations, allowing minor incidents to rapidly escalate into significant crises with potentially devastating consequences. The signatories articulate that dialogue should not be perceived as a concession to the other side, but rather as a fundamental instrument for de-escalation, conflict resolution, and the pursuit of shared regional prosperity. They advocate for a multi-track approach to diplomacy, suggesting that even if official government-to-government talks remain challenging, channels for track-two diplomacy involving non-governmental actors, cultural exchanges, and civil society initiatives should be actively explored and supported to build trust at various levels.\n\nFurthermore, the appeal emphasizes that consistent diplomatic engagement is indispensable for addressing a myriad of transnational challenges that transcend national borders, such as climate change, public health crises, water resource management, and economic development. These issues profoundly impact the lives of millions across the South Asian subcontinent and demand collaborative solutions that are impossible without open lines of communication. The collective voice of these signatories reflects a widespread sentiment among informed citizens and experts who recognize the profound implications of continued animosity and the potential dividends of rapprochement. Their initiative serves as a poignant reminder that while political leadership bears the primary responsibility for charting a path forward, civil society plays a crucial, often catalytic, role in advocating for peace, fostering an environment conducive to dialogue, and preventing further deterioration of an already fragile relationship. Ultimately, the letter aims to pave the way for a more stable, cooperative, and prosperous future for both India and Pakistan.", "vocab": [{"word": "Compelling", "definition": "evoking interest, attention, or admiration in a powerfully irresistible way."}, {"word": "Protracted", "definition": "lasting for a long time or longer than expected or usual."}, {"word": "Geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "Exacerbated", "definition": "made a problem, bad situation, or negative feeling worse."}, {"word": "Imperative", "definition": "of vital importance; crucial."}, {"word": "De-escalation", "definition": "the process of reducing the intensity of a conflict or potentially violent situation."}, {"word": "Rapprochement", "definition": "an establishment or resumption of harmonious relations."}, {"word": "Catalytic", "definition": "causing or accelerating a process or event."}]}}, "questions": [{"q": "What is the main purpose of the letter signed by 117 people?", "a": "The letter urges India and Pakistan to resume dialogue and communication to ease tensions and address shared challenges."}, {"q": "Why do the signatories believe dialogue is important, especially now?", "a": "They believe dialogue is crucial because of the current deeply polarized political climate, which makes communication challenging but also more necessary to prevent misunderstandings and potential escalation of conflicts."}], "id": "a27a1481274", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxNbjF1aDIwVU5iV2k2aTUteTNNWFFlZFJrUU4tQTJkYUVlVFBHMmp6OWFLb2o2S1h5M19XVmlsRjQyX3lKOFgtM1BQRjNPampyLWtnamNwNFo4VlV4eFh2bWxnVEYtdDR6c0tkckFGWU9Hd2tIVkxJRFdodDc5RFdvMXZzRDhrRmxTZS1UdmVRc2JjQ1I0SllBU2NoWFgzaVBl?oc=5", "published": "2026-07-05T06:30:00+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "New Book Explores Respect's Role in Global Politics", "excerpt": "A new book by Reinhard Wolf, due in 2025, examines how respect and disrespect shape international politics.", "levels": {"Beginner": {"text": "A new book is coming out in 2025. It is called \"Status, States, and Moral Sentiments: How Respect and Disrespect Shape International Politics.\" Reinhard Wolf wrote this book. Oxford University Press will publish it.\n\nThe book talks about how countries treat each other. It looks at respect and disrespect. When countries respect each other, they can work together better. They can solve problems peacefully. But when countries feel disrespected, it can cause problems. They might not want to cooperate. This can make world politics harder.\n\nThink about how people act. If someone feels respected, they are usually happy to help. If they feel disrespected, they might get angry or refuse to work with others. Countries are a bit like that too. They care about their \"status,\" which means their position or importance in the world.\n\nThis new book will help us understand why countries act the way they do. It shows that feelings like respect are very important in global affairs. It is 300 pages long and is part of a series called \"Perspectives on Politics.\" We can read it next year to learn more about this important topic. Understanding respect can help make the world a more peaceful place.", "vocab": [{"word": "Book", "definition": "Something you read with pages."}, {"word": "Publish", "definition": "To print and sell books or magazines."}, {"word": "Respect", "definition": "A feeling of admiration for someone or something."}, {"word": "Disrespect", "definition": "A lack of respect; treating someone without politeness."}, {"word": "Politics", "definition": "The activities of government, or how countries manage their relationships."}, {"word": "Cooperate", "definition": "To work together with someone for a shared goal."}]}, "Intermediate": {"text": "A significant new academic work, \"Status, States, and Moral Sentiments: How Respect and Disrespect Shape International Politics,\" is set to be released in 2025. Penned by Reinhard Wolf and published by Oxford University Press, this 300-page volume promises to shed light on the often-overlooked emotional dimensions of global affairs. It is part of the esteemed \"Perspectives on Politics\" series.\n\nThe book's central theme explores how the concepts of status, respect, and disrespect profoundly influence the interactions and decisions of nations on the international stage. In international relations, \"status\" refers to a country's perceived standing, prestige, and influence relative to others. Nations often strive to maintain or enhance their status, viewing it as crucial for their security and prosperity.\n\nWhen countries feel their status is acknowledged and they are treated with respect, it can foster cooperation, facilitate diplomatic solutions, and strengthen alliances. Respect can build trust and encourage states to engage in constructive dialogue, even when disagreements arise. Conversely, perceived disrespect or a challenge to a nation's status can lead to resentment, mistrust, and even conflict. History is replete with examples where slights or perceived insults have escalated tensions, making peaceful resolutions more difficult.\n\nWolf's work suggests that these \"moral sentiments\" – the feelings of being respected or disrespected – are not merely secondary factors but are fundamental drivers of foreign policy. Understanding these emotional undercurrents is vital for analysts and policymakers seeking to navigate the complexities of world politics. The book aims to provide a comprehensive framework for analyzing how these sentiments shape international behavior, offering insights into why nations choose certain paths, whether cooperative or confrontational. Its release next year will likely spark important discussions within the field of international relations.", "vocab": [{"word": "Academic", "definition": "Relating to education and scholarship; intellectual."}, {"word": "Dimensions", "definition": "Aspects or features of a situation, problem, or thing."}, {"word": "Profoundly", "definition": "Deeply or intensely; in a way that has a great effect."}, {"word": "Status", "definition": "The relative importance or standing of a person or thing in a particular group or society."}, {"word": "Foster", "definition": "To encourage the development or growth of something good."}, {"word": "Diplomatic", "definition": "Relating to the management of relationships between countries."}, {"word": "Confrontational", "definition": "Tending to deal with situations in an aggressive or hostile way."}]}, "Advanced": {"text": "A forthcoming scholarly publication, \"Status, States, and Moral Sentiments: How Respect and Disrespect Shape International Politics,\" authored by Reinhard Wolf and slated for release by Oxford University Press in 2025, promises to be a significant contribution to the field of international relations theory. This 300-page volume, part of the distinguished \"Perspectives on Politics\" series, delves into the often-underestimated role of intersubjective recognition and emotional dynamics in shaping state behavior and global governance.\n\nWolf's central thesis, as suggested by the title, posits that the moral sentiments of respect and disrespect are not peripheral to, but rather constitutive of, international politics. Traditional realist and liberal theories often prioritize material power, security dilemmas, or economic interdependence. However, this work appears to align with constructivist approaches by emphasizing the social construction of identity, status, and norms, arguing that states' perceptions of their standing and how they are regarded by others profoundly influence their foreign policy choices and willingness to cooperate or contend.\n\nThe concept of \"status\" in international relations is multifaceted, encompassing elements of prestige, influence, and recognition of sovereignty and legitimate interests. Nations frequently engage in status-seeking behaviors, whether through military buildup, economic development, or leadership in international institutions, not solely for tangible gains but also for the symbolic affirmation of their importance. Perceived slights, historical grievances, or the denial of deserved recognition can trigger strong reactions, ranging from diplomatic protests to outright military confrontation. Such sentiments can undermine trust, complicate multilateral negotiations, and fuel revisionist tendencies in the international system.\n\nConversely, mutual respect can serve as a crucial lubricant for international cooperation, fostering an environment conducive to dialogue, compromise, and the peaceful resolution of disputes. When states feel their core interests and identity are respected, they are more likely to adhere to international norms and institutions, even when short-term national interests might suggest deviation. Wolf's analysis likely explores how these sentiments are generated, maintained, and challenged, offering a nuanced understanding of their causal mechanisms and policy implications.\n\nThis book is poised to enrich the discourse on international political sociology and foreign policy analysis. By bringing moral sentiments to the forefront, it encourages scholars and practitioners to look beyond purely rationalist calculations and consider the deeply human, albeit often masked, emotional drivers that underpin statecraft. Its release in 2025 will undoubtedly stimulate new research and provide a robust framework for interpreting the complex interplay of power, identity, and emotion in global affairs.", "vocab": [{"word": "Forthcoming", "definition": "About to happen or appear; imminent."}, {"word": "Intersubjective", "definition": "Relating to or existing between conscious minds; shared by more than one conscious observer."}, {"word": "Constitutive", "definition": "Forming a part of something; essential in forming or making something."}, {"word": "Prioritize", "definition": "To treat something as more important than other things; to put in order of importance."}, {"word": "Multifaceted", "definition": "Having many different aspects or features; complex."}, {"word": "Revisionist", "definition": "Advocating the revision of an accepted theory, belief, or policy, often with a view to changing the status quo."}, {"word": "Lubricant", "definition": "A substance that reduces friction; metaphorically, something that helps to make a process easier or smoother."}, {"word": "Underpin", "definition": "To support, justify, or form the basis for something."}]}}, "questions": [{"q": "What is the title of the new book mentioned in the article?", "a": "The title of the new book is \"Status, States, and Moral Sentiments: How Respect and Disrespect Shape International Politics.\""}, {"q": "Who is the author of the book?", "a": "The auth const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
