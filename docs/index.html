fornia State University, Sacramento (CSUS) has started a new program. It's called the AI Management concentration. This program is part of the College of Business. AI stands for Artificial Intelligence. AI is when computers can think and learn like people. It's becoming very important in many jobs and companies.\n\nThe new concentration will teach students how to manage AI in businesses. This means they will learn how to use AI tools and projects. They will also learn how to make good decisions about AI. Many companies need people who understand both business and AI. This program will help students get ready for these kinds of jobs.\n\nStudents who study AI Management will learn skills for the future. They can work in technology companies or other businesses that use AI. CSUS wants to help its students get good jobs and be leaders in the new world of technology. This new program shows that CSUS is looking ahead to what businesses need. It's a big step for the university to help students succeed.", "vocab": [{"word": "Program", "definition": "A plan of activities or studies."}, {"word": "Concentration", "definition": "A special area of study within a larger subject."}, {"word": "Artificial Intelligence (AI)", "definition": "Computers that can think and learn like humans."}, {"word": "Manage", "definition": "To control or be in charge of something."}, {"word": "Businesses", "definition": "Companies or organizations that buy and sell goods or services."}, {"word": "Succeed", "definition": "To achieve a desired aim or result."}]}, "Intermediate": {"text": "California State University, Sacramento (CSUS) is stepping into the future of business education. The university's College of Business has officially launched a new concentration in AI Management. This specialized program aims to equip students with the essential skills needed to navigate the rapidly evolving landscape of artificial intelligence within the corporate world.\n\nArtificial Intelligence, or AI, refers to the development of computer systems capable of performing tasks that typically require human intelligence, such as problem-solving, learning, and decision-making. Its integration into various industries, from healthcare to finance and retail, is transforming how businesses operate and innovate. As AI becomes more prevalent, there's a growing demand for professionals who can not only understand this technology but also strategically manage its implementation and ethical implications.\n\nThe AI Management concentration is designed to be a crucial addition for students pursuing a business degree, potentially as part of an MBA or other relevant programs. It will focus on teaching students how to lead AI projects, understand data analytics, develop AI strategies, and address the ethical considerations associated with AI technologies. Graduates will be prepared for roles that bridge the gap between technical AI development and business strategy, such as AI project managers, business intelligence analysts, and technology consultants.\n\nBy offering this forward-thinking program, CSUS aims to empower its students to become leaders in the digital economy. The initiative reflects the university's commitment to providing relevant, in-demand education that directly responds to the needs of the modern job market, ensuring its graduates are well-positioned for successful careers in an AI-driven future.", "vocab": [{"word": "Officially", "definition": "In a formal or authorized way."}, {"word": "Concentration", "definition": "A specialized area of study within a larger academic program."}, {"word": "Artificial Intelligence (AI)", "definition": "Computer systems that can perform tasks requiring human intelligence."}, {"word": "Navigate", "definition": "To find the way through a difficult or complex situation."}, {"word": "Prevalent", "definition": "Widespread in a particular area or at a particular time."}, {"word": "Implementation", "definition": "The process of putting a decision or plan into effect."}, {"word": "Ethical", "definition": "Relating to moral principles or the branch of knowledge dealing with these."}]}, "Advanced": {"text": "California State University, Sacramento (CSUS) is proactively addressing the evolving demands of the global economy with the launch of its new AI Management concentration within the College of Business. This strategic initiative is designed to cultivate a new generation of business leaders adept at harnessing the transformative power of artificial intelligence while navigating its complex managerial and ethical dimensions.\n\nArtificial Intelligence (AI) represents a paradigm shift in how industries operate, innovate, and compete. Encompassing machine learning, natural language processing, and advanced analytics, AI systems are increasingly integral to strategic decision-making, operational efficiency, and customer engagement across virtually every sector. The rapid proliferation of AI technologies has, however, created a significant void in the workforce: a shortage of professionals who possess both a profound understanding of business principles and the specialized acumen required to govern AI initiatives effectively.\n\nThe AI Management concentration is meticulously structured to bridge this critical gap. It will provide students, particularly those pursuing an MBA or other advanced business degrees, with an interdisciplinary curriculum. This curriculum will delve into the strategic deployment of AI, project lifecycle management for AI solutions, data governance, predictive analytics, and the intricate ethical and societal implications of AI. Students will gain proficiency in translating complex technical AI concepts into actionable business strategies, ensuring responsible innovation and sustainable growth.\n\nGraduates of this program will be uniquely positioned for high-demand roles such as AI strategy consultants, AI product managers, data ethics officers, and business transformation specialists. They will be equipped to lead cross-functional teams, articulate the value proposition of AI investments, and mitigate risks associated with AI adoption. By integrating cutting-edge technological insights with core business competencies, CSUS is empowering its alumni to drive organizational change and maintain a competitive edge in an increasingly automated and data-centric world.\n\nThis forward-thinking educational offering underscores CSUS's commitment to academic excellence and its responsiveness to market dynamics. By preparing students not just to use AI, but to manage and lead with it, the university is solidifying its role in developing the human capital essential for navigating the opportunities and challenges presented by the Fourth Industrial Revolution. The concentration is a testament to the university's vision for fostering innovation and preparing its graduates for impactful leadership in the global digital landscape.", "vocab": [{"word": "Proactively", "definition": "Acting in anticipation of future problems, needs, or changes."}, {"word": "Strategic initiative", "definition": "A plan or program designed to achieve a major goal, often with long-term implications."}, {"word": "Adept", "definition": "Very skilled or proficient at something."}, {"word": "Paradigm shift", "definition": "A fundamental change in approach or underlying assumptions."}, {"word": "Proliferation", "definition": "Rapid increase in the number or amount of something."}, {"word": "Acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "Interdisciplinary", "definition": "Relating to more than one branch of knowledge or study."}, {"word": "Mitigate", "definition": "To make something less severe, serious, or painful."}]}}, "questions": [{"q": "What is the name of the new program launched by CSU Sacramento's College of Business?", "a": "The new program is called the AI Management concentration."}, {"q": "Why is this new program important for students and businesses?", "a": "It's important because it prepares students for jobs in the growing field of AI, helping businesses manage and use AI effectively and ethically."}], "id": "ac811cee9ea", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMie0FVX3lxTE5tRTEtSHJzUThoUE5tQkJCNmtTbHFZQkl4RGJUbWhuazdIM3RRVFd5MzZwZlFjQk5haGNmSnNwRmdOMW9KdWxTVXBWM0FqeE5iSmY2Z2kzeDlWYmU1dmxGaHZUUjlXSzlzeWhSSExNQkQ4bzB1V3VDUlFxRQ?oc=5", "published": "2026-08-01T07:40:33+09:00", "category": "business", "category_title": "Business"}, {"headline": "Many Retirees Launch New Family Businesses", "excerpt": "A growing number of individuals are choosing to leave retirement and start new businesses, often involving their families.", "levels": {"Beginner": {"text": "More and more older people are deciding to start new businesses. These people were retired, meaning they stopped working. But now, they are going back to work, often with their family members. This trend is becoming popular. \n\nWhy are they doing this? Sometimes, people miss working. They might feel bored after they stop their old jobs. Starting a new business gives them something exciting to do. It helps them stay busy and use their skills. \n\nWorking with family can be very special. It lets parents, children, and even grandchildren build something together. They can share ideas and help each other. This can make the family stronger and create new memories. \n\nStarting a business after retirement can also help with money. It gives people a new way to earn income. It shows that age is just a number, and you can always learn new things and begin new projects. It's a way to stay active and happy.", "vocab": [{"word": "retired", "definition": "stopped working permanently, usually because of age."}, {"word": "trend", "definition": "a general direction in which something is developing or changing."}, {"word": "skills", "definition": "abilities that you have learned and can do well."}, {"word": "special", "definition": "better, greater, or otherwise different from what is usual."}, {"word": "income", "definition": "money that a person earns."}]}, "Intermediate": {"text": "A notable trend is emerging where a growing number of individuals are choosing to re-enter the workforce or launch new ventures after formally retiring. This phenomenon often involves establishing a family business, driven by a desire for continued engagement, financial stability, or the pursuit of a long-held passion. For many, the traditional concept of retirement can bring unexpected boredom or a feeling of lacking purpose. Starting a business, especially with family members, offers a fresh challenge and a meaningful way to contribute.\n\nThese 'unretirees' are leveraging their lifetime of experience, accumulated knowledge, and often, their savings, to create something new. They might be driven by a specific business idea they always wanted to explore, or a desire to leave a legacy for their children and grandchildren. Working alongside family members can strengthen bonds, facilitate the transfer of valuable skills and wisdom, and provide a supportive environment for entrepreneurship.\n\nWhile starting any business comes with inherent risks and demands, older entrepreneurs often bring a level of maturity, patience, and problem-solving abilities developed over decades. They may also have a clearer vision of what they want to achieve. This trend not only provides economic benefits through job creation and new services but also offers significant personal rewards, allowing individuals to remain mentally active, socially connected, and fulfilled in their later years. It challenges the conventional view of retirement as a complete cessation of productive activity.", "vocab": [{"word": "emerging", "definition": "starting to appear or become known."}, {"word": "ventures", "definition": "new business activities or projects that involve risk."}, {"word": "phenomenon", "definition": "a fact or situation that is observed to exist or happen, especially one whose cause or explanation is in question."}, {"word": "leveraging", "definition": "using something to maximum advantage."}, {"word": "legacy", "definition": "something left or handed down by a predecessor."}, {"word": "inherent", "definition": "existing in something as a permanent, essential, or characteristic attribute."}, {"word": "cessation", "definition": "the fact or process of ending or being brought to an end."}]}, "Advanced": {"text": "The traditional paradigm of retirement as a definitive cessation of professional activity is undergoing a significant redefinition, largely driven by a demographic shift towards 'unretirement,' particularly evident in the burgeoning trend of older adults launching new family enterprises. This phenomenon is multifaceted, often spurred by a confluence of factors including evolving economic landscapes, a desire for sustained intellectual engagement, and the pursuit of intergenerational collaboration.\n\nMany individuals, finding conventional retirement lacking in purpose or mental stimulation, are leveraging decades of accumulated expertise and capital to embark on entrepreneurial ventures. This isn't merely about financial necessity, though supplementary income can certainly be a motivator. More profoundly, it reflects a desire for continued relevance, a channel for creativity, and an opportunity to apply a lifetime of wisdom in a tangible way. The family business model, in particular, offers a compelling framework, providing not only a vehicle for financial supplementation or wealth creation but also a powerful mechanism for legacy building and the transfer of invaluable tacit knowledge to younger generations.\n\nThese 'encore entrepreneurs' often possess a unique blend of attributes: resilience forged through diverse career paths, a pragmatic approach to problem-solving, and a robust professional network. While the entrepreneurial path presents inherent risks and demands considerable adaptability, the psychological benefits of sustained productivity, social connection, and the profound satisfaction derived from co-creating a venture with loved ones are proving to be potent motivators. This trend challenges ageist stereotypes and highlights the immense, often untapped, potential within the older demographic.\n\nFurthermore, the establishment of family businesses by retirees contributes positively to local economies, fostering job creation and innovation. It also addresses societal concerns about an aging population, demonstrating that older citizens can remain vibrant, contributing members of the workforce and entrepreneurial ecosystem. This evolving landscape of later-life work underscores a broader cultural shift, where personal fulfillment and lifelong learning are increasingly prioritized over a static, disengaged retirement.", "vocab": [{"word": "paradigm", "definition": "a typical example or pattern of something; a model."}, {"word": "burgeoning", "definition": "beginning to grow or increase rapidly; flourishing."}, {"word": "confluence", "definition": "the flowing together of two or more streams, or a coming together of people or things."}, {"word": "tacit", "definition": "understood or implied without being stated openly."}, {"word": "resilience", "definition": "the capacity to recover quickly from difficulties; toughness."}, {"word": "pragmatic", "definition": "dealing with things sensibly and realistically in a way that is based on practical rather than theoretical considerations."}, {"word": "potent", "definition": "having great power, influence, or effect."}, {"word": "ecosystem", "definition": "a complex network or interconnected system, often referring to a business or technological environment."}]}}, "questions": [{"q": "What is one common reason people decide to start a new business after retiring?", "a": "Many people start new businesses after retiring because they miss working, feel bored, or want to pursue a long-held passion."}, {"q": "What are some benefits of starting a family business for retirees?", "a": "Benefits include staying mentally active, earning new income, strengthening family bonds, transferring knowledge to younger generations, and leaving a legacy."}], "id": "a94ba4421ee", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxNZXJJdkJuSjVSSUlNbWNwYmc3WV9USFJDZWlpd2taRktlYXQyR1gwdDRwYU1tN3BodzhYQkpPT3YyenFpN0U2ejQwWGxQWnNFeDFTUVZvTG1GXzdvLUh0dFFubndpemNsemt1RnhXNk5ZU3dLQng0OTgtRFgxemI2NW5JV3FxWmJzWjRuQXJpUjlDN1U?oc=5", "published": "2026-08-01T07:36:12+09:00", "category": "business", "category_title": "Business"}, {"headline": "Former Fed Official Considers Fewer Central Bank Meetings", "excerpt": "A former Federal Reserve official, Kevin Warsh, is reportedly considering a plan to reduce the number of meetings held by the U.S. central bank.", "levels": {"Beginner": {"text": "A man named Kevin Warsh, who used to work at the Federal Reserve, is thinking about a new idea. The Federal Reserve, or \"the Fed,\" is like America's central bank. It helps manage the country's money and tries to keep prices stable. It also works to help people find jobs.\n\nRight now, the Fed has important meetings many times a year. At these meetings, officials talk about the economy and decide on things like interest rates. Interest rates affect how much it costs to borrow money. These decisions are very important for everyone.\n\nMr. Warsh is reportedly considering a plan to have fewer of these meetings. This news was reported by the New York Times. If the Fed met less often, it might make fewer changes to its money rules. Some people think this could make the economy more predictable. Others might worry that the Fed would not be able to react quickly to new problems. This idea is still being discussed.", "vocab": [{"word": "Federal Reserve", "definition": "The central bank of the United States."}, {"word": "central bank", "definition": "A main bank that manages a country's money and banks."}, {"word": "stable", "definition": "Staying mostly the same; not changing much."}, {"word": "economy", "definition": "How a country makes and uses money, goods, and services."}, {"word": "interest rates", "definition": "The extra money you pay when you borrow money, or earn when you save money."}, {"word": "predictable", "definition": "Easy to know what will happen next."}]}, "Intermediate": {"text": "Kevin Warsh, a former governor of the Federal Reserve, is reportedly exploring a proposal to decrease the frequency of meetings held by the U.S. central bank. This news was initially reported by the New York Times.\n\nThe Federal Reserve is the central bank of the United States. Its primary responsibilities include managing the nation's monetary policy, aiming for stable prices (controlling inflation), and promoting maximum employment. To achieve these goals, the Fed's main policymaking body, the Federal Open Market Committee (FOMC), currently meets eight times a year, approximately every six weeks.\n\nDuring these scheduled meetings, FOMC members discuss the state of the economy, assess financial conditions, and make crucial decisions regarding interest rates and other policy tools. These decisions have a significant impact on borrowing costs for businesses and consumers, and on the overall economic activity.\n\nWarsh's consideration of fewer meetings suggests a potential shift in how the Fed operates. Proponents of such a change might argue that less frequent meetings could lead to more deliberate policy adjustments and reduce market volatility, fostering greater predictability. However, critics might express concerns that fewer meetings could diminish the Fed's agility and responsiveness to unforeseen economic shifts or crises. The discussion around this idea highlights ongoing debates about the optimal structure and operation of the nation's central bank.", "vocab": [{"word": "governor", "definition": "A high-ranking official, in this case, at the Federal Reserve."}, {"word": "proposal", "definition": "A plan or suggestion put forward for consideration."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the money supply and credit conditions to influence the economy."}, {"word": "inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "predictability", "definition": "The quality of being able to be foreseen or known in advance."}, {"word": "volatility", "definition": "The tendency to change rapidly and unpredictably, especially for the worse."}, {"word": "agility", "definition": "The ability to move quickly and easily, or to react quickly to changes."}]}, "Advanced": {"text": "Kevin Warsh, a former Federal Reserve governor and a prominent voice in economic policy circles, is reportedly contemplating a significant structural change for the U.S. central bank: reducing the number of its scheduled policy meetings. This consideration, initially brought to light by the New York Times, sparks a broader discussion about the optimal operational cadence for the Federal Reserve in managing the nation's economy.\n\nThe Federal Reserve, as the central bank of the United States, operates with a dual mandate: to foster maximum employment and maintain price stability. To fulfill these critical objectives, its primary policymaking body, the Federal Open Market Committee (FOMC), convenes eight times annually, approximately every six weeks. These deliberations are pivotal, as they culminate in decisions regarding the federal funds rate and other monetary policy tools that profoundly influence credit conditions, investment, and overall economic activity.\n\nWarsh's reported contemplation of fewer meetings suggests a preference for a more deliberate and less reactive approach to monetary policy. Proponents of such a shift often argue that reducing meeting frequency could mitigate market volatility by fostering greater long-term policy consistency and reducing the potential for short-term, knee-jerk reactions to transient economic data. A less frequent schedule might encourage more comprehensive analysis and consensus-building among committee members, potentially leading to more robust and enduring policy frameworks.\n\nConversely, critics might contend that fewer meetings could diminish the Fed's agility and responsiveness, hindering its capacity to address unforeseen economic shocks or rapidly evolving financial conditions. In an increasingly complex and interconnected global economy, the ability to convene swiftly and adjust policy as circumstances dictate is often seen as a crucial attribute for a central bank. The current eight-meeting schedule allows for regular assessments and adjustments, providing a balance between stability and flexibility.\n\nThis debate is not entirely new; discussions about the Fed's meeting frequency and communication strategy have surfaced periodically. Warsh's reintroduction of this idea underscores an ongoing philosophical divergence within economic policy circles regarding the optimal balance between predictability, transparency, and responsiveness in central banking. Any actual change would require significant internal consensus and potentially external legislative support, reflecting a fundamental re-evaluation of the Fed's operational rhythm.", "vocab": [{"word": "prominent", "definition": "Important or well-known."}, {"word": "contemplating", "definition": "Thinking deeply and at length about something."}, {"word": "dual mandate", "definition": "A two-part official goal or responsibility, in this case, for the Federal Reserve (maximum employment and price stability)."}, {"word": "deliberations", "definition": "Long and careful consideration or discussion."}, {"word": "mitigate", "definition": "To make something less severe, serious, or painful."}, {"word": "volatility", "definition": "The state of being unstable or prone to rapid and unpredictable change, especially in markets."}, {"word": "agility", "definition": "The ability to move quickly and easily, or to think and understand quickly."}, {"word": "consensus", "definition": "General agreement among a group of people."}]}}, "questions": [{"q": "Who is Kevin Warsh?", "a": "Kevin Warsh is a former governor of the Federal Reserve."}, {"q": "What is the main idea Kevin Warsh is reportedly considering for the Federal Reserve?", "a": "He is reportedly considering a plan to reduce the number of policy meetings the Federal Reserve holds each year."}], "id": "ac8ebda3a04", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijwFBVV95cUxPa1NEVkFiYmQ1TUdyaGhvSkRfY2FnOHlJRlpSQ2t0Tzh4c1I5N3lsQzd6YnI2TEdsMnk4UmZ2ZmNXUDhmN1pTVjVNb2Y3Z1NaY1FaaHRqTU1HMnp4dkIzZWdoUExCc25NQUl0MnRITkN5c19FeUxyOXU1VlB4bWpXM2EzZ2M1R1kxYUxyc05JSQ?oc=5", "published": "2026-08-01T07:21:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Social Platforms Unite Against 'AI Slop'", "excerpt": "Major social media and content platforms like Snapchat and YouTube are joining forces to combat the spread of low-quality, fake AI-generated content.", "levels": {"Beginner": {"text": "Snapchat is now working with other big apps to stop bad content made by artificial intelligence, or AI. AI can create text, pictures, or videos very fast. Sometimes, what AI makes is not true or is very low quality. People call this \"AI slop.\"\n\nMany popular online places like YouTube, LinkedIn, and Substack are also trying to fight this problem. They want to make sure that what you see online is real and helpful. If AI makes too much fake content, it can be hard for people to know what is true. This can cause problems and spread wrong information.\n\nThese companies are putting new rules in place. They are also using tools to find and remove this \"AI slop.\" Their goal is to keep their platforms safe and trustworthy for everyone. It's an important step to make sure the internet stays a good place to learn and share.", "vocab": [{"word": "apps", "definition": "Programs or software designed for mobile devices or computers."}, {"word": "artificial intelligence (AI)", "definition": "Computer systems that can do things that usually need human intelligence, like learning or solving problems."}, {"word": "fake", "definition": "Not real or true."}, {"word": "content", "definition": "Information, like text, pictures, or videos, found on websites or apps."}, {"word": "trustworthy", "definition": "Able to be relied on as honest or truthful."}, {"word": "rules", "definition": "Instructions that tell you what you are allowed or not allowed to do."}]}, "Intermediate": {"text": "Snapchat has joined a growing list of prominent online platforms that are actively working to combat the proliferation of low-quality or misleading AI-generated content, often referred to as \"AI slop.\" This collective effort includes major players such as YouTube, LinkedIn, and Substack, all aiming to maintain the integrity and trustworthiness of their digital spaces.\n\nThe rapid advancement of artificial intelligence tools has made it easier than ever for users to generate vast amounts of text, images, and videos. While AI offers many benefits, it also presents the challenge of distinguishing authentic human-created content from machine-generated material that can be inaccurate, repetitive, or even designed to spread misinformation. \"AI slop\" specifically refers to this kind of low-effort, often deceptive content that floods online platforms.\n\nThe primary concern for these platforms is the potential for \"AI slop\" to erode user trust and spread false narratives. Misinformation can have serious real-world consequences, and a deluge of low-quality content can make it difficult for users to find reliable information or engage in meaningful discussions.\n\nTo address this, companies are implementing new policies, developing advanced detection tools, and enhancing their content moderation efforts. For instance, YouTube has introduced rules requiring creators to disclose when realistic content has been generated by AI. LinkedIn is focusing on protecting professional discourse, while Substack aims to safeguard the quality of independent journalism. Snapchat's involvement underscores the widespread recognition across the tech industry that a concerted strategy is necessary to manage the impact of generative AI and ensure a healthy online environment for its global user base.", "vocab": [{"word": "combat", "definition": "To fight against something, especially a problem or an issue."}, {"word": "proliferation", "definition": "A rapid increase in the number or amount of something."}, {"word": "integrity", "definition": "The quality of being honest and having strong moral principles; also, the state of being whole and undivided."}, {"word": "misinformation", "definition": "False or inaccurate information, especially that which is intended to deceive."}, {"word": "disclose", "definition": "To make something known or reveal it."}, {"word": "policies", "definition": "Official rules or ways of doing things that a company or organization follows."}, {"word": "discourse", "definition": "Written or spoken communication or debate."}]}, "Advanced": {"text": "In a significant move reflecting the escalating challenges posed by generative artificial intelligence, Snapchat has formally joined a growing consortium of prominent digital platforms committed to mitigating the proliferation of low-quality, often deceptive, AI-generated content. This collective endeavor, which includes industry titans like YouTube, LinkedIn, and Substack, underscores a shared imperative to safeguard the veracity and integrity of online ecosystems against what has colloquially become known as \"AI slop.\"\n\nThe ubiquitous availability of sophisticated AI tools has democratized content creation to an unprecedented degree. While this innovation offers immense potential for creativity and efficiency, it simultaneously presents a formidable challenge: distinguishing authentic human expression from machine-generated output that can range from merely repetitive and uninspired to actively misleading or factually incorrect. \"AI slop\" encapsulates this spectrum of low-effort, often algorithmically-produced content that threatens to inundate digital spaces, eroding trust and potentially undermining factual discourse.\n\nThe core concern driving these platforms' proactive stance is the potential for \"AI slop\" to foster widespread disinformation and diminish the overall quality of user experience. A deluge of synthetic content can obscure legitimate information, manipulate public opinion, and even pose intellectual property concerns for human creators. The long-term implications include a degradation of critical thinking skills among users and a general erosion of confidence in online sources.\n\nTo counter this burgeoning threat, platforms are deploying a multi-faceted strategy. This includes the implementation of stringent new content policies, such as YouTube's requirement for creators to explicitly disclose AI-generated realistic content. LinkedIn is fortifying its professional networking environment against AI-driven spam and fabricated profiles, while Substack is focused on preserving the credibility of independent journalism and long-form writing. Furthermore, significant investment is being directed towards developing advanced AI detection technologies and enhancing human moderation capabilities to identify and remove problematic content more efficiently. Snapchat's participation highlights the industry's recognition that effective stewardship of digital environments in the age of generative AI necessitates a collaborative and adaptive approach, ensuring that innovation serves to enrich, rather than compromise, the global user base's access to reliable and valuable information. This ongoing battle is crucial for maintaining the health and utility of the internet as a whole.", "vocab": [{"word": "consortium", "definition": "A group of companies or organizations that have joined together to undertake an enterprise too large for any of them individually."}, {"word": "mitigating", "definition": "Making something less severe, serious, or painful."}, {"word": "proliferation", "definition": "A rapid increase in the number or amount of something, especially something undesirable."}, {"word": "ubiquitous", "definition": "Present, appearing, or found everywhere."}, {"word": "veracity", "definition": "Conformity to facts; accuracy; truthfulness."}, {"word": "disinformation", "definition": "False information which is intended to mislead, especially propaganda issued by a government organization to a rival power or by a political party to the public."}, {"word": "stewardship", "definition": "The careful and responsible management of something entrusted to one's care."}, {"word": "algorithmic", "definition": "Relating to or characteristic of an algorithm (a process or set of rules to be followed in calculations or other problem-solving operations, especially by a computer)."}]}}, "questions": [{"q": "What is \"AI slop\" and why are platforms like Snapchat trying to stop it?", "a": "\"AI slop\" refers to low-quality, often misleading or fake content generated by artificial intelligence. Platforms are trying to stop it because it can erode user trust, spread misinformation, and make it difficult for users to find reliable information."}, {"q": "Name at least three online platforms mentioned in the article that are fighting against AI-generated content.", "a": "Snapchat, YouTube, LinkedIn, and Substack are mentioned as platforms fighting against AI-generated content."}], "id": "a9e7d925a60", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c77g6dm5pr8o?at_medium=RSS&at_campaign=rss", "published": "2026-08-01T06:57:59+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Labour's Bev Craig Wins Greater Manchester Mayoral Election", "excerpt": "Bev Craig of the Labour Party has won the Greater Manchester mayoral byelection, taking a powerful local leadership role.", "levels": {"Beginner": {"text": "The Labour Party won a big election in Greater Manchester. Bev Craig is the new mayor. She is from the Labour Party. She used to lead the Manchester city council. Now, she will be the mayor of Greater Manchester. This is a very important job. The mayor helps lead the whole region, not just one city.\n\nBev Craig is taking over from Andy Burnham. He was the mayor before her. This win is good news for the Labour Party. In some recent local elections, other parties like Reform UK and the Greens won some areas. But now, Labour has won those areas back in this election. This shows that many people in Greater Manchester voted for Labour.\n\nThe mayor of Greater Manchester has a lot of power. This job is one of the most powerful political jobs outside of London's main government, called Westminster. Bev Craig will help make important decisions for the people living in Greater Manchester. She will work to improve the region. This election was a byelection, which means it happened outside of a regular big election.", "vocab": [{"word": "election", "definition": "When people vote to choose a leader."}, {"word": "mayor", "definition": "A leader of a city or region."}, {"word": "party", "definition": "A group of people with similar ideas about how to run a country."}, {"word": "region", "definition": "A large area of land, often with its own government."}, {"word": "council", "definition": "A group of people chosen to make rules for a city or area."}, {"word": "powerful", "definition": "Having a lot of control or influence."}]}, "Intermediate": {"text": "The Labour Party has secured a significant victory in the Greater Manchester mayoral byelection, with Bev Craig elected as the new mayor. Craig, who previously served as the leader of Manchester City Council, will now take on one of the most influential political positions outside of the UK's central government in Westminster. This win marks a notable success for Labour, especially as it reclaims areas that had recently seen gains by the Reform UK and Green parties in local elections held in May.\n\nBev Craig succeeds Andy Burnham, who had served as the mayor of Greater Manchester prior to this election. The role of mayor for a combined authority like Greater Manchester involves substantial responsibilities, including overseeing transport, housing, policing, and economic development across the region. This position allows the mayor to make key decisions that directly impact the lives of millions of residents.\n\nThe byelection result is particularly important for the Labour Party as it demonstrates a reversal of fortunes in some areas. In the recent May local elections, Reform UK and the Greens had managed to win some council seats and increase their vote share in parts of Greater Manchester. Labour's decisive win in this mayoral race suggests a strong re-engagement of voters with the party in this key northern region.\n\nGreater Manchester is a large metropolitan area in North West England, comprising ten boroughs. The mayor acts as a strategic leader for this entire region, working to improve public services and drive economic growth. Craig's election is seen as a clear mandate from the electorate to continue Labour's agenda for the region.", "vocab": [{"word": "secured", "definition": "Successfully obtained or achieved."}, {"word": "significant", "definition": "Important or notable."}, {"word": "influential", "definition": "Having a great deal of power to affect something."}, {"word": "reclaims", "definition": "Gets something back that was lost or taken."}, {"word": "succeeds", "definition": "Takes over a position or role from someone else."}, {"word": "mandate", "definition": "The authority given to an elected group of people to govern."}, {"word": "electorate", "definition": "All the people in a country or area who are entitled to vote in an election."}]}, "Advanced": {"text": "The Labour Party has achieved a resounding victory in the Greater Manchester mayoral byelection, with Bev Craig, the current leader of Manchester City Council, elected to the powerful regional post. This outcome represents a significant political triumph for Labour, as it successfully reclaims electoral ground that had recently seen inroads made by the Reform UK and Green parties during the local elections held in May. Craig's ascension to the mayoralty positions her as one of the most influential political figures operating outside the direct purview of Westminster.\n\nBev Craig will now assume the mantle from Andy Burnham, who previously held the office of Mayor of Greater Manchester. The role of a directly elected mayor for a combined authority, such as Greater Manchester, is one of considerable executive power and strategic oversight. The mayor is tasked with shaping policy and directing initiatives across critical domains including transport infrastructure, housing development, policing, and fostering economic growth throughout the expansive metropolitan region. This executive authority enables the mayor to enact substantial changes that profoundly affect the daily lives and future prospects of millions of constituents.\n\nThe byelection result carries particular resonance for the Labour Party, signaling a robust reversal of recent electoral trends in certain areas. The local elections in May had witnessed Reform UK and the Greens making notable gains, securing council seats and increasing their overall vote share in various parts of Greater Manchester. Labour's decisive win in this high-profile mayoral contest therefore suggests a strong re-affirmation of voter confidence in the party within this crucial northern stronghold, potentially indicating a broader shift in public sentiment.\n\nGreater Manchester encompasses a vast urban agglomeration in North West England, comprising ten distinct metropolitan boroughs. The mayor serves as the principal strategic leader for this entire conurbation, charged with enhancing public services, driving sustainable economic development, and championing the region's interests on a national stage. Craig's election is widely interpreted as a clear mandate from the electorate, endorsing Labour's established agenda for regional development and social welfare. Her transition from a prominent role in municipal governance to a regional executive position underscores her extensive experience in local administration and her deep-rooted understanding of Manchester's intricate political and socio-economic landscape. This victory not only consolidates Labour's hold on a key urban power base but also offers a potential barometer for national political sentiment ahead of future general elections.", "vocab": [{"word": "resounding", "definition": "Emphatic and unmistakable; leaving no doubt about the outcome."}, {"word": "ascension", "definition": "The act of rising to an important position or a higher level of power."}, {"word": "mayoralty", "definition": "The office or period of office of a mayor."}, {"word": "purview", "definition": "The scope of the influence or concerns of something; the range of a person's or organization's authority."}, {"word": "mantle", "definition": "A role or responsibility that passes from one person to another, often implying a significant burden or honor."}, {"word": "constituents", "definition": "A member of a constituency; a person who is represented by an elected official."}, {"word": "conurbation", "definition": "An extended urban area, typically consisting of several towns merging with a city, forming a continuous urban environment."}, {"word": "barometer", "definition": "Something that reflects changes in circumstances or opinions, serving as an indicator or measure."}]}}, "questions": [{"q": "Who is the new mayor of Greater Manchester?", "a": "Bev Craig."}, {"q": "Which political party did the new mayor represent?", "a": "The Labour Party."}], "id": "a79e94c4db3", "source": "Politics | The Guardian", "link": "https://www.theguardian.com/politics/2026/jul/31/labour-wins-decisive-victory-in-greater-manchester-mayoral-byelection", "published": "2026-08-01T07:01:45+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Hamas Offers Disarmament for Israeli Withdrawal from Gaza", "excerpt": "Hamas has stated it would disarm its military wing if Israel halts its strikes and withdraws from the Gaza Strip, though significant obstacles remain.", "levels": {"Beginner": {"text": "Hamas, a group that controls Gaza, has said something important. They said they would stop fighting and give up their weapons. But this would only happen if Israel stops its attacks and leaves Gaza. Gaza is a small area where many Palestinians live.\n\nIsrael is a country next to Gaza. Israel and Hamas have been fighting for a long time. Right now, Israel has soldiers and is doing military actions in Gaza. Hamas wants these actions to stop. They also want Israeli soldiers to leave Gaza completely.\n\nThis offer from Hamas is a big step. However, it is not easy to make this happen. There are many problems, or \"obstacles,\" that make an agreement hard. Both sides have different ideas about what should happen next. Trust between them is very low.\n\nMany people hope for peace in the region. But reaching a deal like this would need a lot of talks and agreements from both Hamas and Israel.", "vocab": [{"word": "controls", "definition": "has power over a place or group."}, {"word": "disarm", "definition": "to give up weapons; to stop fighting with weapons."}, {"word": "attacks", "definition": "acts of violence or fighting."}, {"word": "withdraws", "definition": "leaves a place."}, {"word": "obstacles", "definition": "problems that make something difficult."}]}, "Intermediate": {"text": "Hamas, the Palestinian militant group that governs the Gaza Strip, has put forward a conditional offer regarding its future. The group stated it would disarm its military wing if Israel ceases its military operations and completely withdraws its forces from Gaza. This proposal comes amidst ongoing intense conflict in the region.\n\nThe Gaza Strip is a densely populated Palestinian territory. Hamas has been the de facto governing authority there since 2007. Israel, a neighboring country, has been engaged in a prolonged conflict with Hamas, which it designates as a terrorist organization. Israel's current military campaign in Gaza aims to dismantle Hamas's capabilities and secure the release of hostages taken by the group.\n\nHamas's offer to disarm represents a significant potential shift in the long-standing conflict dynamics. However, numerous and substantial obstacles stand in the way of any such agreement. Deep-seated mistrust between the two parties is a major hurdle. Israel has previously expressed skepticism about Hamas's intentions and its willingness to genuinely abandon its armed struggle.\n\nFor an agreement to materialize, complex negotiations would be required. These would likely involve international mediators. Key challenges include defining what \"disarm\" truly means, ensuring Israel's security concerns are met, and addressing the fate of the remaining hostages. The political will on both sides to make such concessions is also a critical factor. The international community is closely watching these developments, hoping for a path towards de-escalation and a lasting peace.", "vocab": [{"word": "conditional", "definition": "depending on certain terms or conditions."}, {"word": "ceases", "definition": "stops."}, {"word": "dismantle", "definition": "to take apart or break down; to get rid of."}, {"word": "skepticism", "definition": "doubt about the truth or sincerity of something."}, {"word": "materialize", "definition": "to happen or become real."}, {"word": "concessions", "definition": "things given up or allowed in order to reach an agreement."}]}, "Advanced": {"text": "Hamas, the Islamist militant group that has governed the Gaza Strip since 2007, has reportedly conveyed an offer to disarm its military capabilities. This significant proposal is contingent upon Israel halting its extensive military offensive and completely withdrawing its forces from the besieged Palestinian enclave. The announcement, emerging from a period of intense hostilities, introduces a complex new dimension to the protracted conflict that has long defined the region.\n\nThe Gaza Strip, a densely populated territory, has been at the heart of the Israeli-Palestinian conflict for decades. Hamas, designated a terrorist organization by Israel and several Western nations, seized control of Gaza from the Palestinian Authority in 2007. Its foundational charter calls for the destruction of Israel, a stance that has fueled decades of animosity and violence. Israel's current military campaign, launched in response to Hamas's devastating October 7th attacks, aims to eradicate the group's military infrastructure, dismantle its governance capabilities, and secure the release of all remaining hostages.\n\nThe prospect of Hamas disarming, if genuine, would represent a seismic shift in the geopolitical landscape of the region. However, the path to such an outcome is fraught with formidable obstacles. Foremost among these is the profound and entrenched mistrust between Israel and Hamas, exacerbated by years of conflict, broken ceasefires, and unfulfilled agreements. Israeli officials have consistently voiced deep skepticism regarding Hamas's sincerity, viewing such offers as potential tactical maneuvers rather than a fundamental change in ideology or strategy. The group's past actions, including its continued rocket fire and tunnel construction, contribute to this skepticism.\n\nFor any disarmament deal to materialize, intricate and likely indirect negotiations would be essential, almost certainly requiring robust international mediation from powers like Egypt, Qatar, and the United States. Critical issues to be addressed would include the precise definition and rigorous verification of \"disarmament\" – whether it means merely giving up rockets or dismantling its entire command structure and paramilitary forces. Furthermore, mechanisms for ensuring Israel's long-term security, the immediate and unconditional release of all hostages, and the future governance of Gaza post-Hamas would need comprehensive solutions. The internal political dynamics within both Israel, where public opinion is deeply scarred by the October 7th attacks, and Hamas, which faces pressure from various factions, would exert immense pressure on any potential agreement. The international community, while cautiously acknowledging the offer, remains acutely aware of the historical precedents and the immense challenges inherent in transforming such a proposal into a tangible and enduring peace.", "vocab": [{"word": "contingent upon", "definition": "dependent on; conditional on."}, {"word": "besieged", "definition": "surrounded by military forces; under attack."}, {"word": "protracted", "definition": "lasting for a long time or longer than expected."}, {"word": "eradicate", "definition": "to destroy completely; to put an end to."}, {"word": "seismic shift", "definition": "a major, dramatic change."}, {"word": "fraught with", "definition": "filled with (something undesirable); full of."}, {"word": "entrenched", "definition": "firmly established and difficult to change."}, {"word": "rigorous verification", "definition": "thorough and strict checking to confirm accuracy or compliance."}]}}, "questions": [{"q": "What is Hamas's main condition for disarming its military wing?", "a": "Hamas's main condition for disarming  because prices can go up or down. Right now, this big gamble is looking more risky. This means there is a higher chance that people who invest money might not make as much, or could even lose some.\n\nWhy is it riskier? One reason is that prices for many things are going up. This is called inflation. When prices rise, your money buys less. To stop prices from rising too fast, big banks like the Federal Reserve make it more expensive to borrow money. They do this by raising interest rates. When borrowing money costs more, businesses might slow down, and people might spend less.\n\nThese changes can make investors worry. They might think that companies will not earn as much money in the future. When investors worry, they might sell their stocks, which can make stock prices fall. So, the U.S. stock market is now facing more uncertainty, and people are watching it carefully to see what happens next.", "vocab": [{"word": "gamble", "definition": "An activity that involves risk, hoping to win something."}, {"word": "risky", "definition": "Involving a chance of loss or danger."}, {"word": "inflation", "definition": "When prices for goods and services go up over time."}, {"word": "interest rates", "definition": "The cost of borrowing money."}, {"word": "investors", "definition": "People who put money into something hoping to make more money."}, {"word": "uncertainty", "definition": "A situation where things are not known or fixed."}]}, "Intermediate": {"text": "The U.S. financial markets, often seen as a significant indicator of the nation's economic health and a major area for investment, are currently showing signs of increased risk. What some observers call the \"biggest gamble\" in the economy, referring to the stock market and other investments, appears to be entering a period of greater uncertainty. This means that the potential for market volatility – quick ups and downs in prices – and even a downturn is growing.\n\nSeveral key economic factors are contributing to this heightened risk. A primary concern is inflation, the sustained rise in the general price level of goods and services. High inflation eroding purchasing power can make businesses' costs higher, potentially reducing their profits. In response to persistent inflation, the U.S. central bank, the Federal Reserve, has been raising interest rates. Higher interest rates make it more expensive for businesses to borrow money for expansion and for consumers to take out loans for big purchases like homes or cars.\n\nThis tightening of monetary policy is designed to cool down the economy and bring inflation under control. However, there's a delicate balance: if interest rates rise too much or too quickly, it could slow economic growth significantly, potentially leading to an economic slowdown or even a recession. Investors are closely monitoring corporate earnings reports and consumer spending trends for signs of weakness. The combination of high inflation, rising interest rates, and the potential for slower economic growth is making the outlook for the U.S. financial markets more precarious, prompting caution among market participants.", "vocab": [{"word": "financial markets", "definition": "Places where people buy and sell things like stocks, bonds, and other investments."}, {"word": "indicator", "definition": "Something that shows the state or level of something else."}, {"word": "volatility", "definition": "The tendency of a market or price to change rapidly and unpredictably."}, {"word": "inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Federal Reserve", "definition": "The central bank of the United States, which manages the nation's money supply and interest rates."}, {"word": "monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit in an economy."}, {"word": "recession", "definition": "A period of temporary economic decline during which trade and industrial activity are reduced."}]}, "Advanced": {"text": "The intricate landscape of the U.S. financial markets, often characterized as the economy's most significant speculative venture, is currently signaling an escalation of inherent risks. This assessment, highlighted by recent analyses, points to a period where market participants must contend with heightened volatility and the potential for substantial valuation adjustments. The underlying dynamics suggest a confluence of macroeconomic headwinds that are collectively eroding investor confidence and recalibrating risk appetites.\n\nCentral to this evolving risk profile is the persistent challenge of inflation. Despite efforts to temper price pressures, the sustained elevation of consumer and producer prices continues to be a formidable concern. This inflationary environment directly impacts corporate profitability by increasing input costs and can dampen consumer demand as purchasing power diminishes. In response, the Federal Reserve has embarked on an aggressive monetary tightening cycle, systematically raising the benchmark federal funds rate. This strategy aims to cool an overheated economy and bring inflation back to its target, but it introduces significant collateral effects.\n\nHigher interest rates translate into increased borrowing costs for both corporations and individuals, potentially stifling capital expenditure, business expansion, and consumer credit-driven spending. The delicate balance for policymakers lies in engineering a \"soft landing\" – bringing inflation down without precipitating a severe economic contraction. However, the risk of over-tightening leading to a significant economic slowdown or even a recession is a palpable concern among economists and market strategists.\n\nFurthermore, global supply chain disruptions, geopolitical tensions, and fluctuating energy prices add layers of complexity and unpredictability to the economic outlook. These external factors can exacerbate domestic inflationary pressures and introduce additional uncertainty regarding corporate earnings forecasts and future economic growth trajectories. Investors are scrutinizing corporate balance sheets, consumer sentiment indicators, and labor market data for any definitive signals of either resilience or impending weakness. The current environment demands a sophisticated understanding of interconnected economic variables, as the \"biggest gamble\" in the U.S. economy navigates a period of profound re-evaluation and elevated systemic risk.", "vocab": [{"word": "speculative venture", "definition": "An investment or activity that involves a high risk of loss but also a chance of significant profit."}, {"word": "escalation", "definition": "A rapid increase; a rise to a higher level."}, {"word": "confluence", "definition": "A coming together of two or more things; a merging."}, {"word": "macroeconomic headwinds", "definition": "Negative economic factors that hinder growth or progress on a large scale."}, {"word": "monetary tightening cycle", "definition": "A period when a central bank raises interest rates and reduces the money supply to combat inflation."}, {"word": "collateral effects", "definition": "Unintended or secondary consequences of an action or policy."}, {"word": "precipitating", "definition": "Causing an event or situation, typically a bad one, to happen suddenly, unexpectedly, or prematurely."}, {"word": "systemic risk", "definition": "The risk of collapse of an entire financial system or market, as opposed to the collapse of a single entity."}]}}, "questions": [{"q": "What is generally referred to as the \"biggest gamble\" in the U.S. economy in these articles?", "a": "The U.S. stock market or financial markets."}, {"q": "Name two key economic factors mentioned that are making the U.S. financial markets look riskier.", "a": "Inflation and rising interest rates (or the Federal Reserve raising interest rates)."}], "id": "a2865898dca", "source": "\"stock market OR finance OR const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
