s", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxPVnN4b2p3WGdva00xSTE2ZXFOTUdoNF9ibHFSSTdraTd2TE1DQ0JfT1huTkVnRXBudTR4M1FoWTNodklZMmJOczFLdGRxd1gzNXc0Z3VHdHNKZHJyTnRwTG9WMVZ1ck5vazk3MmhTbVRFOURTaWZWUTJQdW01Q181ZVpiX1NpeEd3dzhz?oc=5", "published": "2026-10-30T10:07:41+09:00", "category": "entertainment"}, {"headline": "‘Beef’ Actor Justin H. Min’s ‘Journey There,’ Hong Sangsoo’s Locarno Winner ‘Nowhere to Lay My Eyes’ Rack Up International Sales for Finecut", "excerpt": "Hong Sangsoo’s “Nowhere to Lay My Eyes,” a triple prizewinner at the 79th Locarno Film Festival, and Kim Jin-yu’s “Journey There,” the first", "levels": {"Beginner": {"text": "Hong Sangsoo’s “Nowhere to Lay My Eyes,” a triple prizewinner at the 79th Locarno Film Festival, and Kim Jin-yu’s “Journey There,” the first Korean production to star “Beef” actor Justin H. Min, have picked up a new batch of territory deals through Seoul-based sales outfit Finecut. For “Nowhere to Lay My Eyes,” Carlotta Films has […]", "vocab": []}, "Intermediate": {"text": "Hong Sangsoo’s “Nowhere to Lay My Eyes,” a triple prizewinner at the 79th Locarno Film Festival, and Kim Jin-yu’s “Journey There,” the first Korean production to star “Beef” actor Justin H. Min, have picked up a new batch of territory deals through Seoul-based sales outfit Finecut. For “Nowhere to Lay My Eyes,” Carlotta Films has […]", "vocab": []}, "Advanced": {"text": "Hong Sangsoo’s “Nowhere to Lay My Eyes,” a triple prizewinner at the 79th Locarno Film Festival, and Kim Jin-yu’s “Journey There,” the first Korean production to star “Beef” actor Justin H. Min, have picked up a new batch of territory deals through Seoul-based sales outfit Finecut. For “Nowhere to Lay My Eyes,” Carlotta Films has […]", "vocab": []}}, "questions": [], "id": "a88e7f8bfe3", "source": "Variety", "link": "https://variety.com/2026/film/news/beef-actor-justin-h-min-journey-there-hong-sangsoo-film-sales-1236934722/", "published": "2026-10-30T10:06:54+09:00", "category": "entertainment"}]}], "home": [{"headline": "Billions in Crypto Frozen After Suspected Binance Hack", "excerpt": "Binance, a major crypto exchange, froze billions in digital assets after a suspected hack, promising to cover user losses.", "levels": {"Beginner": {"text": "Binance is a very big company where people buy and sell digital money, called cryptocurrency. Recently, there was a big problem. It looks like someone tried to hack into Binance's system. Because of this problem, a lot of digital money, worth billions of dollars, is now stuck. People cannot move or use this money right now.\n\nBinance quickly stopped all trading and moving of money. They did this to check everything and make sure it is safe. The company said it will pay back all the money that users might lose because of this problem. They have a special fund to do this.\n\nThis event shows that even big companies dealing with digital money can have security issues. It is important for people to know that digital money can sometimes be risky. Binance is working hard to fix the problem and keep everyone's money safe. They want to make sure people can trust them again.", "vocab": [{"word": "Binance", "definition": "A very big company for digital money."}, {"word": "cryptocurrency", "definition": "Digital money that uses computers to be safe."}, {"word": "hack", "definition": "To get into a computer system without permission."}, {"word": "stuck", "definition": "Cannot move or be used."}, {"word": "trading", "definition": "Buying and selling things."}, {"word": "fund", "definition": "A special amount of money saved for a purpose."}]}, "Intermediate": {"text": "Binance, one of the world's largest cryptocurrency exchanges, recently faced a significant security incident. The company reported a suspected hack that led to the freezing of digital assets worth billions of dollars. This means that a large amount of cryptocurrency held on the platform became inaccessible, preventing users from moving or trading their funds. Cryptocurrency is a type of digital money that uses cryptography for security, and exchanges like Binance allow people to buy, sell, and store these digital assets.\n\nFollowing the detection of the suspected breach, Binance took immediate action. The exchange temporarily suspended all transactions and withdrawals to conduct thorough security checks. This measure was put in place to contain the potential damage and investigate the extent of the incident. Such suspensions are common practice in the financial industry when security is compromised, allowing companies to secure their systems before resuming normal operations.\n\nCrucially, Binance has assured its users that it will \"cover all losses\" resulting from the breach. The company maintains a dedicated \"Secure Asset Fund for Users\" (SAFU fund), which is specifically designed to protect user funds in such unforeseen circumstances. This commitment aims to reassure investors and maintain confidence in the platform, which handles a massive volume of global crypto trading.\n\nThis event highlights the inherent security challenges within the rapidly evolving cryptocurrency market. While digital currencies offer new ways to manage money, exchanges like Binance are often targets for cybercriminals due to the vast amounts of wealth they manage. The incident serves as a reminder of the importance of robust security protocols and the potential risks associated with holding assets on centralized platforms. Binance is working to restore full services while reinforcing its security measures, emphasizing its dedication to user safety.", "vocab": [{"word": "exchange", "definition": "A place where people buy and sell things, like money or stocks."}, {"word": "incident", "definition": "An event, often an unpleasant one."}, {"word": "assets", "definition": "Things of value owned by a person or company."}, {"word": "inaccessible", "definition": "Unable to be reached or used."}, {"word": "suspended", "definition": "Temporarily stopped."}, {"word": "breach", "definition": "A break in a rule or agreement, especially a security one."}, {"word": "reassure", "definition": "To make someone feel less worried."}]}, "Advanced": {"text": "Binance, the preeminent global cryptocurrency exchange, is grappling with the aftermath of a suspected security breach that has led to the unprecedented freezing of digital assets valued in the billions of dollars. The incident, which saw a substantial portion of user funds rendered inaccessible, underscores the persistent vulnerabilities inherent in even the most sophisticated centralized crypto platforms. Users were unable to execute transactions or withdraw their holdings, creating significant market apprehension and highlighting the fragility of trust in the digital asset ecosystem.\n\nUpon detecting the anomaly, Binance swiftly initiated a comprehensive response. The exchange immediately halted all deposit and withdrawal functionalities across its vast ecosystem to conduct an exhaustive forensic investigation. This decisive action, while disruptive, is standard protocol in mitigating potential further compromise and allowing security teams to pinpoint the vector of attack and patch any exploited vulnerabilities. The scale of Binance's operations, processing billions in daily trades and serving millions of users worldwide, makes such an interruption particularly impactful for the broader crypto market, often causing ripples across altcoin prices and investor sentiment.\n\nIn a crucial move to assuage investor concerns, Binance reiterated its commitment to fully indemnify users for any losses incurred. The exchange maintains a substantial \"Secure Asset Fund for Users\" (SAFU fund), established specifically to safeguard user assets against such catastrophic events. This fund, capitalized by a percentage of trading fees, is a cornerstone of Binance's risk management strategy and a vital component in restoring trust after a security compromise. The existence of such a fund is often cited by exchanges as a key differentiator, offering a layer of protection not always available in traditional financial markets.\n\nThe incident serves as a stark reminder of the dual nature of the cryptocurrency landscape: its innovative potential coupled with significant operational risks. While blockchain technology itself is lauded for its cryptographic security, the centralized exchanges that facilitate access to these digital assets remain attractive targets for highly organized cybercriminal syndicates. These platforms aggregate immense wealth, making them prime candidates for sophisticated phishing attacks, software exploits, or insider threats. The challenge lies in securing vast, interconnected digital infrastructures against ever-evolving threats.\n\nRegulators globally have consistently highlighted the need for enhanced security protocols and consumer protection within the burgeoning crypto sector. This latest breach at a titan like Binance will undoubtedly intensify calls for stricter oversight and more robust industry standards, potentially influencing future legislative frameworks. As Binance endeavors to restore full functionality and fortify its defenses, the episode will likely prompt a broader re-evaluation of security paradigms across the entire decentralized finance (DeFi) space, emphasizing the delicate balance between innovation, accessibility, and impregnable security in a volatile market.", "vocab": [{"word": "preeminent", "definition": "Surpassing all others; very distinguished."}, {"word": "grappling", "definition": "Struggling to deal with something difficult."}, {"word": "unprecedented", "definition": "Never done or known before."}, {"word": "apprehension", "definition": "Anxiety or fear that something bad or unpleasant will happen."}, {"word": "anomaly", "definition": "Something that deviates from what is standard, normal, or expected."}, {"word": "indemnify", "definition": "Compensate (someone) for harm or loss."}, {"word": "syndicates", "definition": "Groups of individuals or organizations combined to promote a common interest."}, {"word": "paradigms", "definition": "Typical examples or patterns of something; a model."}]}}, "questions": [{"q": "What action did Binance take immediately after detecting the suspected security breach?", "a": "Binance immediately suspended all transactions and withdrawals to conduct thorough security checks."}, {"q": "How does Binance plan to cover any losses users might experience due to the incident?", "a": "Binance plans to cover all losses using its dedicated \"Secure Asset Fund for Users\" (SAFU fund)."}], "id": "a4ea100d2eb", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cwg7xp8kx4v5o?at_medium=RSS&at_campaign=rss", "published": "2026-10-30T10:20:57+09:00", "category": "business", "category_title": "Business"}, {"headline": "Bengals Remain Cautious of Titans Despite Player Trade", "excerpt": "The Cincinnati Bengals are staying alert and respectful of the Tennessee Titans, even after a trade involving a player named Simmons.", "levels": {"Beginner": {"text": "The Cincinnati Bengals football team is getting ready to play. They are being very careful about the Tennessee Titans team. Some people might think the Titans are weaker because they made a trade. A player named Simmons was part of this trade. But the Bengals still think the Titans are strong. They know that in football, things can change quickly. The Bengals remember that games in November are often very important. This means teams play very hard at that time of year. The Bengals want to be ready for any challenge. They respect all their opponents. They know that every game matters a lot. Good teams always stay focused. They do not think any game will be easy. The Bengals play in a big league called the NFL. They want to win many games to get to the playoffs. The playoffs are special games at the end of the season. To get there, they must win tough games like the one against the Titans. So, even with the trade, the Bengals will work hard. They know the Titans will also try their best. It's important for teams to always give 100%.", "vocab": [{"word": "careful", "definition": "thinking about what you are doing so you do not make mistakes."}, {"word": "trade", "definition": "when one team gives a player to another team."}, {"word": "strong", "definition": "powerful; not weak."}, {"word": "important", "definition": "having a lot of meaning or value."}, {"word": "respect", "definition": "to think good things about someone or something."}, {"word": "focused", "definition": "giving all your attention to one thing."}]}, "Intermediate": {"text": "The Cincinnati Bengals are maintaining a cautious approach as they prepare to face the Tennessee Titans. Despite a recent trade involving a player named Simmons, which might lead some to believe the Titans are less formidable, the Bengals coaching staff and players are not underestimating their upcoming opponent. This professional mindset highlights their understanding that success in the National Football League (NFL) requires constant vigilance and respect for every team.\nThe phrase, \"'November Is What They Remember',\" from the Bengals' perspective, likely refers to the critical nature of games played later in the season. November often marks a pivotal period where teams are fighting for playoff positions, and past performances in these high-stakes matchups can leave a lasting impression. The Bengals are aware that the Titans, regardless of roster changes, will bring a competitive spirit, especially in such crucial games.\nPlayer trades are a common part of professional sports, often aimed at improving a team's future prospects or addressing immediate needs. While a trade might alter a team's dynamics, experienced teams like the Bengals know that it doesn't automatically weaken an opponent. They anticipate a tough contest and are focusing on their own preparation, strategy, and execution. The AFC conference, where both teams compete, is known for its strong competition, making every victory vital for securing a spot in the postseason. The Bengals' stance reflects a mature understanding of the league's competitive landscape, emphasizing that past events or roster adjustments do not diminish the challenge of a future game. This strategic outlook ensures they remain disciplined and do not fall into the trap of complacency. Their focus is on the present game and the task at hand, aiming to perform at their peak against a team they clearly still regard as a serious contender.", "vocab": [{"word": "cautious", "definition": "careful to avoid potential problems or dangers."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "underestimating", "definition": "to think that someone or something is less important or capable than they really are."}, {"word": "vigilance", "definition": "the action or state of keeping careful watch for possible danger or difficulties."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "dynamics", "definition": "the forces or properties that stimulate growth, development, or change within a system or process."}, {"word": "complacency", "definition": "a feeling of uncritical satisfaction with oneself or one's achievements."}]}, "Advanced": {"text": "The Cincinnati Bengals are approaching their upcoming matchup against the Tennessee Titans with a pronounced sense of caution, a strategic posture that underscores their disciplined approach to professional football. This vigilance persists despite a recent roster adjustment involving a player named Simmons, a move that might typically be perceived as potentially diminishing the Titans' immediate strength. The Bengals' perspective, however, reflects a sophisticated understanding of NFL competition, where no opponent is ever truly underestimated, regardless of perceived vulnerabilities or recent personnel changes.\nThe adage, \"'November Is What They Remember',\" cited by the Bengals, carries significant weight within the league's narrative. November often marks a critical juncture in the NFL calendar, a period when playoff aspirations solidify or falter. Games during this month are frequently high-stakes affairs, and a team's performance can indelibly shape its season's trajectory and public perception. For the Bengals, this likely serves as a reminder that the Titans, a perennial contender, possess the capacity for strong late-season surges, and past encounters, particularly those with significant implications, are not easily forgotten. It emphasizes the need to prepare for a team that will undoubtedly elevate its play when the stakes are highest.\nPlayer trades, while a fundamental aspect of team management in professional sports, introduce complex variables. Such transactions can be driven by various factors, from cap space considerations to strategic retooling for future seasons. While a trade might indeed alter a team's immediate composition and dynamics, the Bengals' sustained wariness suggests a recognition that the core competitive spirit and coaching acumen of the Titans remain intact. Elite teams understand that perceived weaknesses can sometimes galvanize an opponent, fostering a collective resolve to defy expectations.\nThe AFC conference is notoriously competitive, with a multitude of franchises vying for limited postseason berths. In such an environment, every divisional or conference game carries immense weight, making a meticulous and respectful approach to each opponent paramount. The Bengals' stance is a testament to their organizational maturity, demonstrating an aversion to complacency and a commitment to rigorous preparation. They are not merely preparing for the Titans as they appear on paper post-trade, but for the formidable challenge that a well-coached, professional NFL team inherently presents, especially one with a history of resilience. This nuanced perspective is crucial for sustained success in a league defined by its parity and unpredictable outcomes, ensuring the Bengals remain focused on execution and strategic superiority rather than succumbing to premature assumptions about their adversary's capabilities. Their focus remains squarely on their own performance, ensuring that their game plan is robust enough to counter any potential strategy the Titans might deploy, thereby upholding the professional standard expected of a Super Bowl-caliber team.", "vocab": [{"word": "pronounced", "definition": "very noticeable or marked; distinct."}, {"word": "posture", "definition": "a particular way of dealing with or regarding something; an approach or attitude."}, {"word": "adage", "definition": "a proverb or short statement expressing a general truth."}, {"word": "juncture", "definition": "a particular point in events or time."}, {"word": "indelibly", "definition": "in a way that cannot be forgotten or removed."}, {"word": "acumen", "definition": "the ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "galvanize", "definition": "to shock or excite (someone) into taking action."}, {"word": "paramount", "definition": "more important than anything else; supreme."}]}}, "questions": [{"q": "Why are the Cincinnati Bengals being cautious about the Tennessee Titans?", "a": "The Cincinnati Bengals are being cautious about the Tennessee Titans because they respect their opponent and do not want to underestimate them, even after a trade involving a player named Simmons that might make some think the Titans are weaker."}, {"q": "What does the phrase \"'November Is What They Remember'\" likely refer to in the context of NFL football?", "a": "In NFL football, the phrase \"'November Is What They Remember'\" likely refers to the critical importance of games played later in the season, particularly in November, which can significantly impact a team's chances for the playoffs and leave a lasting impression on their season's trajectory."}], "id": "aa54b73310a", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxPRmlocnh3SndtRmh0eU4wX2ZYRldyLXZjbzVLeW9VOGxRNWY5a2tUWTNTSjA2dVJ2SmtoNUMyU0JyaFZEUDlRRFlTcFJsa000MTRrT09pamtia2NvamNaei1qbzJacEY4YjZPeThRNXdSTnpuNFByaFhUWlpFQlMtajUtTjA1ZDhzWTFlVHNvVTVjQVVXekZHSW1QcmlDYUp4M1N5YXZUSE9zU2VoX0pZekJOVGFCTDBPRkJ6T0NoVFFYdWc?oc=5", "published": "2026-10-30T10:19:31+09:00", "category": "business", "category_title": "Business"}, {"headline": "Lagarde Steps Down from ECB, Citing Inability to Remain Neutral", "excerpt": "Christine Lagarde is stepping down as ECB President, stating she can no longer remain neutral on global issues.", "levels": {"Beginner": {"text": "Christine Lagarde is leaving her important job. She is the President of the European Central Bank, or ECB. This bank helps manage money for many countries in Europe. It tries to keep prices stable so things don't get too expensive.\n\nMs. Lagarde said she is stepping down because she cannot stay quiet about things happening in the world. People in her job usually do not share strong opinions on political or global events. They need to be seen as fair and not take sides.\n\nBut Ms. Lagarde feels she needs to speak more freely. Her decision means she wants to talk openly about big world problems. She has been the leader of the ECB since 2019. Before that, she worked at another big financial group called the International Monetary Fund. Her leaving is a big change for the ECB and for Europe's economy.", "vocab": [{"word": "important", "definition": "having great value or meaning."}, {"word": "manage", "definition": "to control or be in charge of something."}, {"word": "stable", "definition": "not likely to change or fail; steady."}, {"word": "quiet", "definition": "not making much noise; not speaking much."}, {"word": "opinions", "definition": "what someone thinks about a particular thing."}, {"word": "freely", "definition": "without limits or restrictions."}]}, "Intermediate": {"text": "Christine Lagarde, the President of the European Central Bank (ECB), has announced her decision to step down from her influential role. Her departure marks a significant moment for the institution responsible for monetary policy across the eurozone. Lagarde, who has led the ECB since 2019, stated that she can no longer maintain the neutrality traditionally expected of a central bank chief when it comes to global events.\n\nCentral bankers are typically required to remain apolitical and objective. This is crucial for maintaining the independence and credibility of institutions like the ECB, which aims to keep inflation under control and ensure economic stability for the 20 countries that use the euro currency. By avoiding strong political statements, central bank leaders help assure markets and the public that their decisions are based purely on economic data, not political agendas.\n\nHowever, Lagarde's statement suggests a personal desire to engage more directly with pressing international challenges. While she did not specify which \"world events\" prompted her decision, it implies a wish to speak out on issues such as geopolitical tensions, climate change, or social inequalities, which are increasingly intertwined with economic stability. Her leadership has been instrumental in guiding the eurozone through periods of uncertainty, including the economic fallout from the pandemic and the recent fight against rising prices.\n\nLagarde's tenure at the ECB followed a distinguished career, including serving as Managing Director of the International Monetary Fund (IMF) and as France's Minister of Finance. Her stepping down opens a key leadership position at a critical time for Europe's economy, as the ECB continues to grapple with inflation and growth challenges.", "vocab": [{"word": "influential", "definition": "having a lot of power to affect others or events."}, {"word": "monetary policy", "definition": "the actions a central bank takes to control the money supply and interest rates."}, {"word": "eurozone", "definition": "the group of European Union countries that use the euro as their common currency."}, {"word": "neutrality", "definition": "the state of not supporting or helping either side in a conflict or disagreement."}, {"word": "apolitical", "definition": "not interested or involved in politics."}, {"word": "credibility", "definition": "the quality of being trusted and believed in."}, {"word": "intertwined", "definition": "connected or linked together closely."}]}, "Advanced": {"text": "Christine Lagarde, the formidable President of the European Central Bank (ECB), has declared her intention to resign from her pivotal position, citing an inability to uphold the rigorous standard of neutrality traditionally incumbent upon central bank governors in the face of escalating global events. Her departure, effective immediately, sends ripples through financial markets and political circles, marking a significant juncture for the institution tasked with safeguarding monetary stability across the 20-nation eurozone.\n\nThe rationale behind Lagarde's decision underscores a fundamental tension inherent in the role of a modern central banker. Traditionally, leaders of institutions like the ECB are expected to maintain a scrupulous distance from political discourse and partisan affiliations. This detachment is paramount to preserving the independence and perceived objectivity of monetary policy decisions, ensuring they are predicated solely on economic imperatives rather than political expediency. The ECB's primary mandate is price stability, and its credibility hinges on the public and markets believing its actions are free from external influence.\n\nLagarde's statement, however, suggests a profound personal conviction that the traditional confines of central bank neutrality are no longer tenable amidst a confluence of complex, interconnected global challenges. While she refrained from specifying the \"world events\" in question, her remarks implicitly point to a desire to engage more vociferously with issues such as geopolitical fragmentation, the existential threat of climate change, widening social inequalities, or perhaps even the erosion of democratic norms – all of which have profound economic ramifications but often fall outside the direct purview of monetary policy.\n\nHer tenure at the ECB, commencing in 2019, has been characterized by navigating unprecedented economic turbulence, from the immediate fallout of the COVID-19 pandemic to the subsequent surge in inflation exacerbated by supply chain disruptions and geopolitical conflicts. Lagarde, the first woman to lead the ECB, has been instrumental in steering the eurozone through these crises, implementing innovative policy tools and communicating the bank's strategy with characteristic clarity and resolve.\n\nPrior to her ECB presidency, Lagarde commanded respect on the international stage as Managing Director of the International Monetary Fund (IMF) and earlier as France's Minister of Finance. Her extensive experience at the nexus of finance, economics, and international diplomacy positions her uniquely for a more overtly political or advocacy-oriented role. Her resignation thus not only creates a leadership vacuum at a critical moment for European economic governance but also signals a potential shift in her own distinguished career trajectory, hinting at a future where her considerable influence might be deployed without the constraints of institutional impartiality. The search for her successor will undoubtedly be a closely watched process, given the ongoing challenges of inflation, economic growth, and geopolitical instability confronting the eurozone.", "vocab": [{"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "incumbent upon", "definition": "necessary as a duty or responsibility for someone."}, {"word": "scrupulous", "definition": "extremely thorough, careful, and attentive to details; also, very concerned to avoid doing wrong."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "predicated solely on", "definition": "based entirely or exclusively on."}, {"word": "tenable", "definition": "able to be maintained or defended against attack or objection."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}]}}, "questions": [{"q": "What is Christine Lagarde's current role from which she is stepping down?", "a": "She is the President of the European Central Bank (ECB)."}, {"q": "What reason did she give for her decision to step down?", "a": "She stated that she can no longer remain neutral on world events."}], "id": "a70c0c1ff66", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxQT3dMenJ3LTFxbHJhYkptU1VXQm1ZRk5HWXFzQ0xrcWI4MnBRM1gwVTRjUWxzajU4UDNJQmFxRlZWUXFEM1FQbmZKM2M0b1IwVU81UHhDWWNhZ05xd2lEMVByMkcxd1k3NTY2MnRxLTdLR3VoNEdFaVMzQ0JqVFlCMzQtQWs0SFZx?oc=5", "published": "2026-10-30T10:21:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Binance Freezes Billions After Suspected Crypto Hack", "excerpt": "Binance, a major crypto exchange, froze billions in digital assets and suspended transactions after a suspected hack, promising to cover losses.", "levels": {"Beginner": {"text": "Binance is a very big company where people buy and sell digital money called cryptocurrency. Recently, something bad happened. Binance thinks someone tried to hack their system. A hack means someone tries to get into a computer system without permission.\n\nBecause of this suspected hack, Binance had to stop some things. They froze, or stopped access to, a lot of cryptocurrency. This amount is worth billions of dollars. When money is frozen, people cannot move it or use it.\n\nBinance also stopped all buying and selling of crypto on their platform for a short time. This is called suspending transactions. They did this to check everything and make sure their system is safe.\n\nThe company said it will fix any problems. They promised to \"cover all losses.\" This means if anyone lost their digital money because of the hack, Binance will give it back to them. They are working hard to make sure their users' money is safe and that trading can start again soon. This kind of event shows that even big companies need to be very careful with online security.", "vocab": [{"word": "Binance", "definition": "A very large company where people trade digital money."}, {"word": "cryptocurrency", "definition": "Digital money that uses strong computer codes to be safe."}, {"word": "hack", "definition": "When someone tries to get into a computer system without permission."}, {"word": "froze", "definition": "Stopped access to something, like money, so it cannot be used."}, {"word": "transactions", "definition": "Buying or selling things, especially money or goods."}, {"word": "cover all losses", "definition": "To pay back money that someone lost."}]}, "Intermediate": {"text": "Binance, one of the world's largest cryptocurrency exchanges, has taken significant action following a suspected security breach. The company announced that it has frozen digital assets worth billions of dollars after identifying what it believes to be an attempt to compromise its systems.\n\nA cryptocurrency exchange like Binance acts as a marketplace where users can buy, sell, and trade various digital currencies such as Bitcoin and Ethereum. The suspected hack prompted Binance to immediately suspend all transactions on its platform. This temporary halt allows the company to conduct thorough security checks and investigate the incident fully.\n\nFreezing assets and suspending trading are critical steps to prevent further potential losses and protect user funds. The company has reassured its customers that it will \"cover all losses\" incurred as a result of the breach. This commitment means that if any user's cryptocurrency was stolen or affected by the incident, Binance pledges to reimburse them.\n\nSuch security incidents, while concerning, highlight the ongoing challenges in the rapidly evolving world of digital finance. Binance's swift response and promise to cover losses are aimed at maintaining user confidence and ensuring the integrity of its platform. The company is working to restore full services as quickly and safely as possible, emphasizing its dedication to robust security protocols. This event serves as a reminder of the importance of strong cybersecurity measures for all financial platforms, especially those dealing with high-value digital assets.", "vocab": [{"word": "exchange", "definition": "A place or system where people trade things, like money or goods."}, {"word": "security breach", "definition": "An event where someone gets unauthorized access to a computer system or data."}, {"word": "digital assets", "definition": "Money or other valuable items that exist only in electronic form, like cryptocurrency."}, {"word": "suspend", "definition": "To temporarily stop something from happening."}, {"word": "thorough", "definition": "Done carefully and completely, with attention to detail."}, {"word": "reimburse", "definition": "To pay back money to someone, especially money they have spent or lost."}, {"word": "protocols", "definition": "Official rules or procedures that must be followed."}]}, "Advanced": {"text": "Binance, a dominant force in the global cryptocurrency market, has initiated a comprehensive response following a suspected significant security vulnerability. The exchange confirmed it has frozen digital assets amounting to billions of dollars and temporarily halted all transactions on its platform. This decisive action was taken after the identification of what appears to be a sophisticated attempt to compromise its robust security infrastructure.\n\nAs a centralized cryptocurrency exchange, Binance facilitates the trading of a vast array of digital currencies, acting as a crucial intermediary for millions of users worldwide. The potential cyberattack necessitated an immediate suspension of all trading activities, enabling the company to undertake exhaustive security audits and forensic investigations. This proactive measure is designed to isolate the threat, prevent further propagation of any breach, and safeguard the integrity of user holdings.\n\nCrucially, Binance has issued a strong assurance to its user base, pledging to \"cover all losses\" that may have been sustained due to the incident. This commitment is vital for mitigating reputational damage and maintaining user confidence in an industry often characterized by volatility and security concerns. The promise to fully reimburse affected users underscores the responsibility centralized exchanges bear for the security of assets entrusted to them.\n\nThis incident, while disruptive, highlights the persistent challenges associated with cybersecurity in the digital asset landscape. Even with advanced protective measures, exchanges remain attractive targets for malicious actors. The rapid evolution of attack vectors demands continuous vigilance and adaptation of security protocols. Furthermore, such events often draw heightened scrutiny from regulators globally, who are increasingly focused on consumer protection and systemic risk within the burgeoning cryptocurrency sector. Binance's swift, transparent communication and commitment to restitution are critical steps in navigating the aftermath and reinforcing its position as a reliable platform amidst an inherently risky environment. The incident serves as a stark reminder that robust security architecture and rapid incident response are paramount for any entity operating at the scale of a global financial institution in the digital age.", "vocab": [{"word": "dominant force", "definition": "A powerful and influential presence in a particular area or industry."}, {"word": "vulnerability", "definition": "A weakness or flaw in a system that could be exploited by an attacker."}, {"word": "compromise", "definition": "To expose something to danger or risk, often by allowing unauthorized access."}, {"word": "infrastructure", "definition": "The basic physical and organizational structures and facilities needed for the operation of an enterprise."}, {"word": "exhaustive", "definition": "Comprehensive and thorough; examining or including all elements or aspects."}, {"word": "mitigating", "definition": "Making something less severe, serious, or painful."}, {"word": "reputational damage", "definition": "Harm caused to the good name or public image of a person or organization."}, {"word": "restitution", "definition": "The act of restoring something to its original state or condition, or compensating for loss or injury."}]}}, "questions": [{"q": "What action did Binance take after the suspected hack?", "a": "Binance froze billions in digital assets and suspended all transactions on its platform."}, {"q": "What has Binance promised to do for its users regarding potential losses?", "a": "Binance has promised to \"cover all losses,\" meaning they will reimburse users who lost money due to the incident."}], "id": "a4ea100d2eb", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cwg7xp8kx4v5o?at_medium=RSS&at_campaign=rss", "published": "2026-10-30T10:20:57+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Justice Department Subpoenas California Officials in Election Scrutiny", "excerpt": "The U.S. Justice Department has issued subpoenas to California officials, signaling a significant escalation in its review of state election practices.", "levels": {"Beginner": {"text": "The U.S. government is looking closely at elections in California. The Justice Department, a part of the government, has sent special papers called \"subpoenas\" to officials in California. These papers ask the officials to give information and documents about how elections are run.\n\nThis is a serious step. It means the Justice Department wants to check election rules and processes. They want to make sure that elections are fair and correct for everyone. Officials in California must now provide the requested papers and details. This action shows that the government is taking a deeper look at how votes are cast and counted in the state.\n\nElections are very important for a country. They let people choose their leaders and decide who will represent them. The Justice Department's job is to make sure laws are followed and that everyone's right to vote is protected. By sending these subpoenas, they are showing that they are paying close attention to how California manages its votes. This action is part of a bigger effort to look at elections more carefully across the country, ensuring trust in the voting system.", "vocab": [{"word": "Justice Department", "definition": "A part of the U.S. government that enforces laws."}, {"word": "subpoenas", "definition": "Official papers that order someone to give information or documents."}, {"word": "officials", "definition": "People who hold an important position in the government."}, {"word": "elections", "definition": "Times when people vote to choose their leaders."}, {"word": "scrutiny", "definition": "Careful and close examination."}, {"word": "fair", "definition": "Treating everyone equally and correctly."}]}, "Intermediate": {"text": "The U.S. Justice Department has taken a significant step by issuing subpoenas to officials in California. This action marks an escalation in the federal government's scrutiny of election administration within the state. Subpoenas are legal orders that compel individuals or organizations to provide specific documents or testimony. In this case, California officials are being asked to furnish information related to the state's election processes and procedures.\n\nThe Justice Department, which is responsible for enforcing federal laws and ensuring justice for all Americans, is focusing on election integrity. This involves verifying that voting systems are secure, voter registration rolls are accurate, and that all eligible citizens have the opportunity to cast their ballots without undue obstacles. While states traditionally manage their own elections, the federal government has an oversight role, particularly concerning federal elections and civil rights.\n\nThis move suggests that the Justice Department is conducting a thorough review of how California administers its elections. It could involve examining various aspects, such as voter registration databases, ballot handling protocols, and post-election audits. The specific officials targeted by these subpoenas have not been publicly named, but they likely include individuals from the Secretary of State's office and potentially county election registrars who oversee local voting operations.\n\nThe issuance of subpoenas indicates a formal investigation or a serious inquiry, moving beyond simple requests for information. It underscores the federal government's commitment to ensuring confidence in the electoral process, especially given recent national discussions about election security and fairness. This development highlights the ongoing tension between state autonomy in election management and federal interest in upholding national election standards.", "vocab": [{"word": "issuing", "definition": "Officially giving out or sending something, like an order."}, {"word": "subpoenas", "definition": "Legal documents that require someone to appear in court or provide documents."}, {"word": "escalation", "definition": "A situation becoming more serious or intense."}, {"word": "scrutiny", "definition": "Close and careful examination or observation."}, {"word": "integrity", "definition": "The quality of being honest and having strong moral principles; here, referring to the fairness and trustworthiness of elections."}, {"word": "administers", "definition": "Manages and takes responsibility for the running of something."}, {"word": "autonomy", "definition": "The right or condition of self-government; independence."}]}, "Advanced": {"text": "The U.S. Justice Department has significantly intensified its oversight of California's election administration by issuing subpoenas to state officials. This legal maneuver represents a notable escalation in federal scrutiny, compelling California authorities to furnish an array of documents and potentially testimony related to their electoral processes. A subpoena is a powerful legal instrument, obligating recipients to comply under penalty of law, signaling that the Justice Department's inquiry has moved beyond preliminary information gathering into a more formal investigative phase. This action reflects a broader national focus on election integrity and security, following contentious debates and challenges to election outcomes in recent years.\n\nThe Department of Justice, tasked with upholding federal law and safeguarding civil rights, is particularly focused on ensuring the integrity and security of the nation's electoral system. This encompasses a broad spectrum of concerns, including the accuracy of voter registration databases, the robustness of ballot chain-of-custody procedures, the efficacy of voter identification protocols, and the overall fairness and accessibility of voting mechanisms. While election management is primarily a state responsibility, enshrined in the U.S. Constitution, the federal government maintains a critical oversight role, especially regarding federal elections and the enforcement of voting rights legislation like the Voting Rights Act of 1965. This often creates a dynamic tension between state autonomy and federal imperatives.\n\nThis latest development suggests a comprehensive review of California's election practices. Potential areas of examination could include the state's processes for voter roll maintenance, provisional ballot handling, signature verification procedures for mail-in ballots, and post-election audit methodologies. Although the specific officials targeted by these subpoenas have not been publicly identified, they are likely senior figures within the California Secretary of State's office, which oversees statewide elections, and possibly county-level election registrars responsible for local implementation. The scope of the subpoenas will dictate the breadth of documents and information required, ranging from internal communications to detailed operational logs.\n\nThe issuance of subpoenas often precedes or accompanies a formal investigation, indicating that the Justice Department perceives potential issues or requires more detailed, legally binding information than voluntary requests would yield. This action underscores the federal government's heightened commitment to bolstering public confidence in the electoral process, particularly in an era marked by intense national debate over election security and alleged irregularities. It also highlights the intricate balance and occasional friction between state sovereignty in election administration and federal imperatives to ensure uniform application of voting laws and protect democratic principles. The outcome of this scrutiny could influence future election policies and practices, not only in California but potentially across other states facing similar federal oversight, setting precedents for the extent of federal intervention in state-run elections.", "vocab": [{"word": "intensified", "definition": "Became stronger or more extreme; increased in degree or strength."}, {"word": "oversight", "definition": "The action of supervising something, especially to ensure that it is being done correctly and legally."}, {"word": "subpoenas", "definition": "Writs (formal legal documents) ordering a person to attend a court or provide documents, often under penalty for failure."}, {"word": "compelling", "definition": "Forcing or obligating someone to do something; requiring strong attention or compliance."}, {"word": "electoral processes", "definition": "The systematic methods, procedures, and stages by which elections are conducted, from voter registration to ballot counting."}, {"word": "integrity", "definition": "The quality of being honest and having strong moral principles; in this context, referring to the soundness, fairness, and trustworthiness of elections."}, {"word": "autonomy", "definition": "The right or condition of self-government, especially in a particular sphere; independence from external control."}, {"word": "imperatives", "definition": "Things that are essential or urgent; principles or commands that must be followed without exception."}]}}, "questions": [{"q": "What U.S. government department issued the subpoenas to California officials?", "a": "The U.S. Justice Department."}, {"q": "What is the main purpose of the Justice Department's action regarding California's elections?", "a": "To scrutinize or carefully examine California's election processes to ensure they are fair, correct, and follow laws, and to ensure election integrity and security."}], "id": "a3d15c4a096", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi1AFBVV95cUxPWkJtYnhDMm1aQzBIRW5oSmRaeGJmVHFzczJXcV83THVjcEpjaWhfUEZuNmpHWXJhVDZWalRRZk9DelNFVHRBVU5Ybk9wSnc4dmUySjRmUkNDYWdkRkUwS29mSU5fRHNHR2xoVzN2RV9jY2NjTHV6ZzlEMktieUtyRG94RlRjU0I4WndOZkpHLUZjMlNpZFluLW85dGVvUm9VLVRQaUVDZ2FiSnIzUmIxaWpSUVFGZWx3RnJMa1UyOF9SVUdNaFNOMTZOeTdPMlE1dmxUeA?oc=5", "published": "2026-10-30T10:19:13+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Misinformation Threatens Elections as Voting Day Nears", "excerpt": "False information about voting can spread quickly online, confusing people and making it harder to have fair and trustworthy elections.", "levels": {"Beginner": {"text": "Elections are very important. They are how people choose their leaders. When an election is close, like less than a week away, it is important for everyone to have correct information.\n\nSometimes, false information, called misinformation, starts to spread. This can happen on the internet or through social media. Misinformation is not true. It can tell people the wrong day to vote, or the wrong place. It might say that voting is not safe, even when it is.\n\nWhen misinformation spreads, it can make people confused. They might not know what is true and what is false. This can make them not want to vote, or they might vote based on wrong ideas.\n\nNews organizations and other groups try to stop misinformation. They check facts to make sure information is true. It is important for everyone to be careful. Before you believe something about voting, try to check if it is true. Look at trusted news sources or official government websites. This helps make sure elections are fair and that everyone can vote with the right information.", "vocab": [{"word": "elections", "definition": "Times when people choose their leaders by voting."}, {"word": "misinformation", "definition": "False or wrong information."}, {"word": "spreads", "definition": "Moves or goes to many places or people."}, {"word": "confused", "definition": "Not able to think clearly or understand."}, {"word": "trusted", "definition": "Believed to be honest and true."}, {"word": "official", "definition": "From a government or a person in charge."}]}, "Intermediate": {"text": "As Election Day approaches, often less than a week away, the integrity of the voting process becomes a critical concern. A significant challenge in modern democracies is the rapid spread of misinformation, which can undermine public trust and influence voter behavior. Misinformation refers to false or inaccurate information, often shared without the intent to deceive, but which can still cause significant harm.\n\nThis false information frequently circulates on social media platforms and through various online channels. It can take many forms, such as incorrect dates or locations for polling stations, misleading claims about voter registration requirements, or unfounded allegations of widespread fraud in the voting system. The goal, whether intentional or not, is often to sow confusion, discourage participation, or sway public opinion.\n\nWhen voters encounter conflicting or untrue information, it can lead to uncertainty and distrust in the electoral process itself. This can result in lower voter turnout, as people may feel their vote doesn't matter or that the system is compromised. It can also lead individuals to make decisions based on faulty premises, potentially altering election outcomes.\n\nTo counter this threat, news organizations, fact-checkers, and electoral authorities work diligently to identify and correct misinformation. They provide accurate, verified information through official channels and reputable news sources. Citizens also play a vital role by being discerning consumers of information. Before sharing or believing election-related content, it is crucial to verify its accuracy with multiple trusted sources. Protecting the electoral process from misinformation is essential for maintaining a healthy democracy.", "vocab": [{"word": "integrity", "definition": "The quality of being honest and having strong moral principles; here, the state of being whole and fair."}, {"word": "undermine", "definition": "To make something weaker or less effective, often gradually."}, {"word": "circulates", "definition": "Spreads or moves around freely from one person or place to another."}, {"word": "allegations", "definition": "Claims or assertions that someone has done something illegal or wrong, typically without proof."}, {"word": "discerning", "definition": "Showing good judgment and understanding."}, {"word": "reputable", "definition": "Having a good reputation; respected and trusted."}, {"word": "verify", "definition": "To check that something is true or accurate."}]}, "Advanced": {"text": "In the crucial days leading up to Election Day, often within a week of ballots being cast, the democratic process faces a persistent and evolving threat: the pervasive spread of misinformation. This phenomenon, characterized by the dissemination of false or inaccurate information, poses a significant challenge to electoral integrity, capable of eroding public confidence and distorting voter behavior. While often distinct from \"disinformation\" (which implies deliberate intent to deceive), misinformation can be equally damaging, particularly when amplified by digital platforms.\n\nThe digital landscape, especially social media, serves as a fertile ground for the rapid propagation of election-related falsehoods. These can range from erroneous logistical details about voting procedures—such as incorrect polling hours or locations—to more insidious narratives questioning the legitimacy of voter registration databases, the security of ballot counting, or the overall fairness of the electoral system. Such narratives are designed, whether by malicious actors or through unwitting propagation, to foster confusion, suppress voter turnout, or manipulate public sentiment, thereby potentially altering election outcomes.\n\nThe consequences of widespread misinformation are profound. It can lead to a significant erosion of trust in democratic institutions, making citizens skeptical of official pronouncements and legitimate news reporting. This skepticism can manifest as decreased civic participation, as voters become disillusioned or convinced that their engagement is futile. Furthermore, decisions made based on inaccurate information can have tangible impacts on policy and representation, undermining the very foundation of informed self-governance. The challenge is exacerbated by algorithmic amplification, which can inadvertently prioritize engaging but false content, and by the echo chambers that reinforce existing biases.\n\nCombating this complex issue requires a multi-faceted approach. Electoral commissions and government agencies are tasked with proactively issuing clear, accurate guidance and debunking prevalent myths. News organizations and independent fact-checkers play a vital role in scrutinizing claims and providing verified information, often in real-time. Crucially, citizens bear a collective responsibility to cultivate media literacy, critically evaluate sources, and resist the urge to share unverified content. Platforms themselves are increasingly pressured to implement more robust content moderation policies and transparency measures. Safeguarding the electoral process from the corrosive effects of misinformation is paramount for the health and resilience of democratic governance.", "vocab": [{"word": "pervasive", "definition": "Spreading widely throughout an area or a group of people; present everywhere."}, {"word": "dissemination", "definition": "The act of spreading information, ideas, or beliefs widely."}, {"word": "electoral integrity", "definition": "The principle that elections should be conducted fairly, transparently, and in accordance with established rules, ensuring public trust in the outcome."}, {"word": "propagation", "definition": "The action of widely spreading and promoting an idea, theory, or belief."}, {"word": "insidious", "definition": "Proceeding in a gradual, subtle way, but with harmful effects; often refers to something that is dangerous but seems harmless."}, {"word": "erosion", "definition": "The gradual destruction or diminution of something, often referring to trust, confidence, or values."}, {"word": "exacerbated", "definition": "Made a problem, bad situation, or negative feeling worse or more severe."}, {"word": "paramount", "definition": "More important than anything else; supreme in importance."}]}}, "questions": [{"q": "What is misinformation, and why is it a problem during elections?", "a": "Misinformation is false or wrong information. It is a problem during elections because it can confuse voters, make them distrust the election process, or cause them to vote based on incorrect facts."}, {"q": "How do news organizations and fact-checkers try to combat the spread of false information about elections?", "a": "News organizations and fact-checkers work to identify and correct misinformation by providing accurate, verified information through official channels and reputable sources, and by scrutinizing claims."}], "id": "a1dd0cd8847", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMizgFBVV95cUxNNzFTdFVScnNRWlM0cGd0QWtZX2htcU5vc19iUkcyR1QzTkFfeGV4cXk4ZzBkQ1lqMUtkZjZyOXN3emZLLWpfak0zVU80NDRHSGtLeFd3RTdWcEVLenRYMmNpVzdrSG1oLTVPZ0NOdE1NWmhhaDhUMldqTDhPZEduaHliZDlwNTVWbDlqR3g4YW5JMkpYRGlvZkk2VGZyRGxfakJuU3NzLTh5WkNHbzlaSTJseFZxV25TbEdpck1GU1hvZEM1SXB3d3YtMzhnUQ?oc=5", "published": "2026-10-30T09:50:38+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Sports Leaders Struggle to Separate Games from Global Politics", "excerpt": "Sports organizations find it increasingly difficult to keep political issues separate from major athletic events.", "levels": {"Beginner": {"text": "Sports leaders want to keep sports simple. They believe games should be about playing and having fun, not about politics. But this is becoming very hard to do. Many people think that sports and politics are mixing more and more.\n\nWhen big sports events happen, like the Olympics, many countries come together. Athletes from different nations compete. Sometimes, these athletes or the countries they represent have different ideas about the world. These ideas are often political.\n\nIt is hard for sports organizations to stop this. Athletes are people too, and they have their own thoughts. They might want to talk about important issues like fairness or peace. When they do, it brings politics into the sport.\n\nSports leaders are trying hard to keep these two things separate. They want to protect the spirit of sport. But it feels like a \"losing battle\" for them. This means it's a very difficult fight, and they might not win. The world is connected, and politics often finds its way into everything, even sports.", "vocab": [{"word": "leaders", "definition": "People who guide or direct others."}, {"word": "politics", "definition": "Ideas and activities about how a country is governed."}, {"word": "separate", "definition": "To keep two or more things apart."}, {"word": "compete", "definition": "To try to win against others in a game or contest."}, {"word": "issues", "definition": "Important topics or problems that people discuss."}, {"word": "spirit", "definition": "The main idea or feeling of something."}]}, "Intermediate": {"text": "Sports organizations globally are facing a growing challenge: how to maintain the separation between athletic competition and political affairs. Despite their long-standing efforts to promote sport as a neutral ground, the line between the two is becoming increasingly blurred, leading many to believe it's a \"losing battle\" for sports chiefs.\n\nHistorically, major international sporting events like the Olympic Games and the FIFA World Cup have aimed to foster unity and fair play among nations. The ideal has always been that athletes compete based purely on skill and dedication, free from the complexities of global politics. However, the reality is often different.\n\nPolitics can enter sports in various ways. Host countries for major events often face scrutiny over human rights records or domestic policies, leading to calls for boycotts or protests. Athletes themselves, as prominent public figures, frequently use their platforms to express views on social justice, environmental concerns, or other political issues. National anthems, flags, and team affiliations inherently carry political symbolism, especially in a competitive international setting.\n\nThe rise of global media and social media has amplified these connections. Every statement, gesture, or controversy within the sporting world can quickly gain international attention, making it harder for governing bodies to control the narrative or enforce strict rules against political expression. Sports leaders are under pressure from governments, sponsors, and even fans, who often have strong opinions on these matters.\n\nWhile sports officials continue to advocate for the purity of sport, the interconnectedness of the modern world makes it nearly impossible to completely isolate athletic events from the broader geopolitical landscape. The struggle to keep sport apolitical is an ongoing and increasingly difficult endeavor.", "vocab": [{"word": "globally", "definition": "All over the world."}, {"word": "separation", "definition": "The act of keeping things apart."}, {"word": "blurred", "definition": "Not clear or distinct; hard to tell apart."}, {"word": "foster", "definition": "To encourage the development of something good."}, {"word": "scrutiny", "definition": "Careful and close examination or observation."}, {"word": "amplified", "definition": "Made something stronger, louder, or more noticeable."}, {"word": "endeavor", "definition": "An attempt to achieve a goal."}]}, "Advanced": {"text": "Sports governing bodies worldwide are confronting an increasingly formidable challenge: upholding the long-cherished principle of separating athletic competition from the intricate web of political affairs. Despite their persistent endeavors to position sport as an apolitical arena, the demarcation between the two domains is becoming progressively indistinct, leading many observers to conclude that sports chiefs are engaged in a \"losing battle.\"\n\nThe aspiration for sporting neutrality has deep roots. Major international spectacles such as the Olympic Games and the FIFA World Cup were conceived, in part, to transcend national rivalries and foster universal camaraderie through fair play. The foundational premise is that athletic prowess and dedication should be the sole determinants of success, unburdened by geopolitical complexities. Yet, contemporary realities frequently diverge from this ideal.\n\nThe infiltration of politics into sport manifests in myriad forms. Prospective host nations for mega-events often undergo intense scrutiny regarding their human rights records, labor practices, or domestic policies, prompting calls for diplomatic boycotts or athlete protests. Furthermore, athletes themselves, often possessing immense public platforms, increasingly leverage their visibility to articulate stances on social justice, environmental advocacy, or other contentious political issues. The inherent symbolism embedded in national anthems, flags, and team allegiances becomes particularly pronounced and politically charged within an international competitive framework.\n\nThe pervasive influence of global media and the instantaneous reach of social media have dramatically amplified these interconnections. Any statement, gesture, or perceived controversy within the sporting ecosystem can instantaneously reverberate across continents, severely complicating efforts by governing bodies to control narratives or enforce stringent regulations against political expression. Sports leaders find themselves navigating a complex matrix of pressures emanating from national governments, commercial sponsors, fan bases, and the athletes themselves, all of whom often hold divergent and deeply held convictions on political matters.\n\nHistorically, sport has never been entirely immune to political currents, from Cold War-era boycotts to sanctions against apartheid regimes. However, the current era presents a unique confluence of factors: heightened global awareness of social inequities, the democratization of information, and the individual empowerment of athletes as agents of change. While officials continue to champion the \"purity\" and unifying power of sport, the inextricable linkage between athletic endeavors and the broader geopolitical landscape makes complete isolation an increasingly untenable proposition. The ongoing struggle to maintain sport's apolitical facade is thus not merely a logistical challenge but a profound philosophical dilemma for its custodians.", "vocab": [{"word": "formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "upholding", "definition": "Maintaining or affirming (a custom or principle)."}, {"word": "demarcation", "definition": "The action of fixing the boundary or limits of something; a dividing line."}, {"word": "aspirations", "definition": "A hope or ambition of achieving something."}, {"word": "transcend", "definition": "To go beyond the limits of; to rise above."}, {"word": "myriad", "definition": "A countless or extremely great number of people or things."}, {"word": "pervasive", "definition": "Spreading widely throughout an area or a group of people."}, {"word": "untenable", "definition": "Not able to be maintained or defended against attack or objection."}]}}, "questions": [{"q": "What is the main challenge sports leaders are facing according to the article?", "a": "The main challenge is keeping sports separate from politics."}, {"q": "Name two ways politics can become involved in sports events.", "a": "Politics can become involved through host countries' human rights records, athletes expressing political views, or the symbolism of national anthems and flags."}], "id": "a7a4177e677", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPb0UwX054VU9Sd3BVY3RPcGhEUEUtQWcyVjZhWGlVT29fQUhGamZrNkFma2YxUTlIajBSdzRsMEREV2lJTlhXNkZYb1RMMEkzUi1sNGpzSm0zbzdad2hQUllydzE1QXA1Zlh3YmRiWi1CcVFyZ2dWY1drR2dUR09rNmMwREdLbzJX?oc=5", "published": "2026-10-30T10:19:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Sports Planner for Friday - The Republic News", "excerpt": "Sports Planner for Friday The Republic News", "levels": {"Beginner": {"text": "Sports Planner for Friday The Republic News", "vocab": []}, "Intermediate": {"text": "Sports Planner for Friday The Republic News", "vocab": []}, "Advanced": {"text": "Sports Planner for Friday The Republic News", "vocab": []}}, "questions": [], "id": "ac8331ad718", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMieEFVX3lxTE5aWm9OMmc3RzFTM2FBN1lBdHF0SzkzdHJjRjVKQzNJZHk5VFFCMDZzOTQxelpzcHhac25MWFlYQkE0YXhEeWxqT2VqOWlnWnozMnEyaUN6dkstZzJMb0hfZ2FnQlhOSjEtdGxnNC15SnpYSlB1VmlTdw?oc=5", "published": "2026-10-30T10:15:58+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Crypto worth billions frozen after suspected Binance hack", "excerpt": "The firm said transactions are suspended while it conducts security checks and will \"cover all losses\".", "levels": {"Beginner": {"text": "The firm said transactions are suspended while it conducts security checks and will \"cover all losses\".", "vocab": []}, "Intermediate": {"text": "The firm said transactions are suspended while it conducts security checks and will \"cover all losses\".", "vocab": []}, "Advanced": {"text": "The firm said transactions are suspended while it conducts security checks and will \"cover all losses\".", "vocab": []}}, "questions": [], "id": "a4ea100d2eb", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cwg7xp8kx4v5o?at_medium=RSS&at_campaign=rss", "published": "2026-10-30T10:20:57+09:00", "category": "finance", "category_title": ourney There,' Hong Sangsoo Film Sell Variety", "levels": {"Beginner": {"text": "'Beef' Actor Justin H. Min's 'Journey There,' Hong Sangsoo Film Sell Variety", "vocab": []}, "Intermediate": {"text": "'Beef' Actor Justin H. Min's 'Journey There,' Hong Sangsoo Film Sell Variety", "vocab": []}, "Advanced": {"text": "'Beef' Actor Justin H. Min's 'Journey There,' Hong Sangsoo Film Sell Variety", "vocab": []}}, "questions": [], "id": "a61f5685f31", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxNNTV3Tk1TNTdqb2UwR3ZEQkRwdmRpc0w5Rm9tTjluZ2NBVTBOZENwQXdlZUVqZGpWRURGZm9JMkdSVUZaM0xFcXk4RXhDQkZya1o0TElWN2tmSk1CdkFtOFF6ckZLb1pybVFaMzBsR3Awck9CMl9XWGp5Umh1TEluSE1PVEwtR242eGFtUm51b01YeFlQTG5WTWhqZTcwNGRXOUJ3V0psOXZGMzZy?oc=5", "published": "2026-10-30T10:16:58+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
