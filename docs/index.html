. The prediction pages reflect the current standings in the race and do not reflect personal preferences for any individual […]", "vocab": []}}, "questions": [], "id": "a989dd97e00", "source": "Variety", "link": "https://variety.com/lists/2027-oscars-predictions/", "published": "2026-10-23T09:10:00+09:00", "category": "entertainment"}, {"headline": "Chappell Roan held a fundraiser. Our Gen X music critic and Gen Z video journalist went. - Los Angeles Times", "excerpt": "Chappell Roan held a fundraiser. Our Gen X music critic and Gen Z video journalist went. Los Angeles Times", "levels": {"Beginner": {"text": "Chappell Roan held a fundraiser. Our Gen X music critic and Gen Z video journalist went. Los Angeles Times", "vocab": []}, "Intermediate": {"text": "Chappell Roan held a fundraiser. Our Gen X music critic and Gen Z video journalist went. Los Angeles Times", "vocab": []}, "Advanced": {"text": "Chappell Roan held a fundraiser. Our Gen X music critic and Gen Z video journalist went. Los Angeles Times", "vocab": []}}, "questions": [], "id": "ae430ac3812", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMickFVX3lxTE1kRnRlVFo5eVpJVVVxUldiTFZxQXE2SDZPWFhrQ1F3c1ZTOHJfVzhlanlXNi1aaTIwX2l5ODhFZVJ5TFpOZkJkQ3ZWZml5OU5BY0JmOEpHRkFHT3htQlk2emhjVUtyS29nclpWTEwyaHNzdw?oc=5", "published": "2026-10-23T09:06:00+09:00", "category": "entertainment"}, {"headline": "Hunter Berry returns to Carter Fold this Saturday night - The Rogersville Review", "excerpt": "Hunter Berry returns to Carter Fold this Saturday night The Rogersville Review", "levels": {"Beginner": {"text": "Hunter Berry returns to Carter Fold this Saturday night The Rogersville Review", "vocab": []}, "Intermediate": {"text": "Hunter Berry returns to Carter Fold this Saturday night The Rogersville Review", "vocab": []}, "Advanced": {"text": "Hunter Berry returns to Carter Fold this Saturday night The Rogersville Review", "vocab": []}}, "questions": [], "id": "a1e291fa2d3", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxOalZubGgtZDd3QmVPZGp3U1RkVFFSNXZSR1h5Z2c3NUxmSXpua1c3blBKWUw5MjU2QldBaFNVMjhhTkZZRkZzRFFnTDhJYTBfSTdfckctV1RGbzN5TTBWSlNNMlZkdmtxenlhWndlRURySWQ4Y2FscjB1eDlOZUlmT3BDY0R5enJnN25fVm8yMWdGM1ZGZmcwQklTN2FiMmQ5RXVXQnNtX2dIVWRv?oc=5", "published": "2026-10-23T09:00:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Amazon Sued Over Mishandled Rape Report", "excerpt": "An Amazon employee has filed a lawsuit against the company, alleging it mishandled her report of a serious crime.", "levels": {"Beginner": {"text": "An Amazon worker is taking the company to court. She says Amazon did not handle her report of a serious crime well. This worker reported a rape, but she claims Amazon did not do enough to help or investigate properly.\n\nWhen someone works for a company, they expect to be safe. Companies should have clear rules to help workers if something bad happens, especially a serious crime. This lawsuit means the worker believes Amazon did not follow these important rules.\n\nAmazon is a very big company that sells many things online and has many employees. This case is about how big companies protect their staff and respond to very serious issues. The worker wants Amazon to be responsible for how it managed her report. This is a serious claim about safety at work and how companies support their people. The court will now look closely at what happened and decide if Amazon acted correctly. It is important for all workplaces to be safe for everyone.", "vocab": [{"word": "employee", "definition": "a person who works for a company or another person."}, {"word": "sues", "definition": "takes someone to court to solve a problem, often about money."}, {"word": "claiming", "definition": "saying that something is true, often without proof yet."}, {"word": "mishandled", "definition": "managed or dealt with something badly or incorrectly."}, {"word": "report", "definition": "to tell someone in authority about something that happened."}, {"word": "safety", "definition": "the condition of being protected from danger or harm."}]}, "Intermediate": {"text": "An Amazon employee has filed a lawsuit against the company, alleging it mishandled her report of a rape. The worker claims that Amazon failed to properly respond to or investigate her serious complaint, leading her to take legal action against her employer.\n\nThis case highlights the critical issue of workplace safety and corporate responsibility. Employees expect their employers to provide a safe working environment and to have robust protocols in place for addressing serious incidents, especially crimes. The lawsuit suggests that Amazon's response to the rape report was inadequate, prompting the employee to seek justice through the legal system. When such serious allegations are made, companies are typically expected to conduct thorough investigations and offer appropriate support to the affected employee.\n\nAmazon, one of the world's largest e-commerce and technology companies, employs millions of people globally. Such a large organization is expected to have comprehensive procedures for employee welfare and incident management. The legal action will likely scrutinize Amazon's internal processes for handling sensitive reports, its support systems for victims, and its investigative practices. This kind of lawsuit can put a company's policies and their adherence to them under intense public and legal review.\n\nThe outcome of this lawsuit could have significant implications for Amazon, potentially affecting its reputation and setting a precedent for how large corporations are held accountable for their handling of employee safety reports. It underscores the importance of transparent and effective mechanisms for employees to report crimes and for companies to respond with due diligence and care. The court will now examine the evidence to determine the validity of the employee's claims and whether Amazon met its obligations.", "vocab": [{"word": "alleging", "definition": "stating something as a fact, but without proof yet."}, {"word": "lawsuit", "definition": "a case in a court of law brought by one person or group against another."}, {"word": "protocols", "definition": "official procedures or rules that must be followed."}, {"word": "investigate", "definition": "to carry out a systematic inquiry to discover and examine the facts of an incident."}, {"word": "accountability", "definition": "the fact or condition of being responsible for one's actions and expected to explain them."}, {"word": "implications", "definition": "the possible results or effects of an action or decision."}, {"word": "reputation", "definition": "the beliefs or opinions that are generally held about someone or something."}]}, "Advanced": {"text": "An Amazon employee has initiated legal proceedings against the e-commerce giant, alleging that the company egregiously mishandled her report of a rape. The lawsuit claims that Amazon's response to the serious criminal allegation was insufficient, failing to provide adequate support or conduct a proper investigation, thereby compelling the employee to seek redress through the judicial system. This action underscores a growing demand for greater corporate accountability in addressing workplace misconduct and ensuring employee safety.\n\nThis litigation brings into sharp focus the paramount importance of corporate responsibility and the imperative for employers to cultivate and maintain a secure working environment. Employees are entitled to expect that their workplaces are safe and that robust, transparent protocols are firmly established for addressing grave incidents, particularly violent crimes. The plaintiff's claim posits that Amazon's handling of her rape report fell significantly short of these expectations, necessitating legal intervention to secure accountability and justice. The case highlights the often-complex challenges victims face when reporting such crimes within a corporate structure, where power dynamics and internal processes can sometimes impede justice.\n\nAmazon, a global behemoth in e-commerce and cloud computing, commands a vast workforce spanning numerous countries and diverse operational environments. An organization of this magnitude is inherently expected to possess sophisticated and comprehensive frameworks for employee welfare, incident management, and crisis response. The legal action will undoubtedly subject Amazon's internal policies, their practical implementation, and the efficacy of its support mechanisms for victims to intense judicial and public scrutiny. This includes examining the thoroughness of its investigations, its adherence to established procedures, and the overall corporate culture surrounding such sensitive disclosures. The outcome will be closely watched by other major corporations, as it could influence best practices for handling similar reports across industries.\n\nThe ramifications of this lawsuit could be far-reaching for Amazon. Beyond the immediate legal costs and potential financial penalties, the case carries substantial reputational risks, potentially eroding public trust and impacting employee morale across its global operations. Furthermore, a ruling against Amazon could establish a significant precedent regarding the scope of corporate liability and the standards of care expected from large enterprises in responding to serious employee complaints. It underscores the critical necessity for organizations to not only have policies in place but to ensure their diligent, empathetic, and effective execution. The judicial process will now meticulously evaluate the evidence presented by both parties to ascertain the veracity of the employee's allegations and determine whether Amazon fulfilled its legal and ethical obligations in this grave matter, ultimately shaping expectations for workplace safety and corporate conduct.", "vocab": [{"word": "initiated legal proceedings", "definition": "formally started a lawsuit or legal action in court."}, {"word": "egregiously", "definition": "outstandingly bad; shockingly poor."}, {"word": "redress", "definition": "remedy or compensation for a wrong or grievance."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "litigation", "definition": "the process of taking legal action."}, {"word": "scrutiny", "definition": "critical observation or examination."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}, {"word": "veracity", "definition": "conformity to facts; accuracy; truthfulness."}]}}, "questions": [{"q": "What is the main reason an Amazon employee is suing the company?", "a": "The employee is suing Amazon because she claims the company mishandled her report of a rape."}, {"q": "What do employees generally expect from their employers regarding workplace safety?", "a": "Employees generally expect their employers to provide a safe working environment and to have clear rules for dealing with serious incidents."}], "id": "afd7877990c", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMingFBVV95cUxQbkdqZXNLamxyaHlBVDN1bFA4b0RmOHZwT1JWZTVxVlMxWEZNQktzWHF1QndwdS1WbjJsZ3UxWjBGVmZ4a01fb2QwMXhkbWMzckVuR2ttUTFBanFVN0dKaFJQSWQzY2RYZ1lIVUk2VzNHWXFycHY1bDZ3MVNpbXBKZ1FoblJYRWVXakFmaUhuVzVUVTAtNUdRQmpYbDVWZw?oc=5", "published": "2026-10-23T09:06:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Independent Contractors Boost Small Business Growth", "excerpt": "A new report from the SBE Council emphasizes how independent contractors are vital for small business growth and success.", "levels": {"Beginner": {"text": "Small businesses need help to grow. A group called the Small Business & Entrepreneurship Council says that independent contractors are very important for this.\n\nWhat are independent contractors? They are people who work for themselves. They offer their skills to different companies, but they are not full-time employees. For example, a small shop might need help with its website. Instead of hiring a full-time person, they can ask an independent contractor to build it.\n\nThis way of working is called the \"collaboration economy.\" It means businesses and workers work together in flexible ways. Small businesses like this because it helps them save money. They only pay for the work they need, when they need it. They don't have to pay for benefits like health insurance for these workers.\n\nUsing contractors helps small businesses grow faster. They can get special skills without big costs. This makes them stronger and helps them compete. The SBE Council believes that these flexible workers are key to a healthy economy.", "vocab": [{"word": "grow", "definition": "to get bigger or develop"}, {"word": "important", "definition": "having a lot of meaning or value"}, {"word": "skills", "definition": "abilities to do something well"}, {"word": "flexible", "definition": "able to change easily"}, {"word": "save money", "definition": "to spend less money"}, {"word": "compete", "definition": "to try to be better or more successful than others"}]}, "Intermediate": {"text": "Small businesses are vital to the economy, and a recent report from the Small Business & Entrepreneurship Council (SBE Council) emphasizes a key factor in their success: independent contractors. These self-employed professionals are increasingly seen as essential for growth and adaptability in the modern business landscape.\n\nIndependent contractors are individuals who offer their specialized services to multiple clients or businesses, rather than being a permanent employee of one company. This arrangement is a cornerstone of what is often called the \"collaboration economy,\" where businesses and workers engage in flexible, project-based relationships. For a small business, this means they can access specific expertise – like marketing, web design, or accounting – without the long-term commitment and overhead costs associated with hiring a full-time employee.\n\nThe benefits for small businesses are significant. Firstly, it provides financial flexibility. Businesses pay for services as needed, avoiding expenses like salaries, benefits packages, and payroll taxes that come with traditional employment. This allows them to manage their budget more efficiently and invest in other areas of growth. Secondly, contractors bring diverse skills and experience. A small company might not need a full-time graphic designer, but can hire a contractor for a specific project, gaining high-quality work without the permanent cost.\n\nThis model enables small businesses to be more agile and responsive to market changes. They can scale up or down their workforce quickly based on demand, which is crucial in today's fast-paced environment. The SBE Council champions this approach, stating that independent contractors are not just a convenient option, but a fundamental driver of innovation and expansion for small enterprises, helping them to thrive and create more jobs indirectly.", "vocab": [{"word": "vital", "definition": "very important or necessary"}, {"word": "emphasizes", "definition": "gives special importance to something"}, {"word": "adaptability", "definition": "the ability to change to new conditions"}, {"word": "specialized", "definition": "having or needing specific knowledge or skills"}, {"word": "overhead costs", "definition": "the regular expenses of running a business, like rent or utilities, not directly related to making a product"}, {"word": "agile", "definition": "able to move quickly and easily; flexible"}, {"word": "champions", "definition": "strongly supports or defends a cause or person"}]}, "Advanced": {"text": "In an increasingly dynamic and interconnected global marketplace, the Small Business & Entrepreneurship Council (SBE Council) has issued a compelling statement underscoring the indispensable role of independent contractors in fostering the growth and resilience of small businesses. This perspective positions self-employed professionals not merely as a convenient staffing option, but as a foundational pillar of what is widely recognized as the \"collaboration economy.\"\n\nIndependent contractors, often referred to as freelancers or consultants, are distinct from traditional employees. They operate as autonomous entities, offering specialized services on a project-by-project or contractual basis to multiple clients. This model allows businesses, particularly small and emerging enterprises, to leverage a vast talent pool without incurring the extensive overheads and long-term commitments associated with conventional employment. This strategic flexibility is paramount in an economic climate characterized by rapid technological shifts and fluctuating market demands.\n\nFor small businesses, the advantages are multifaceted. Financially, engaging independent contractors provides unparalleled budgetary control. Companies can procure specific expertise precisely when needed, thereby optimizing resource allocation and avoiding the fixed costs of salaries, comprehensive benefits packages, payroll taxes, and office space that accompany full-time hires. This lean operational structure frees up capital that can be reinvested into core business functions, product development, or market expansion. Moreover, contractors often bring a breadth of experience from working with diverse clients, offering fresh perspectives and innovative solutions that might be inaccessible through a singular internal team.\n\nThe collaboration economy, facilitated by digital platforms and evolving work paradigms, empowers small businesses to achieve scalability and agility previously reserved for larger corporations. They can rapidly augment their capabilities to meet surges in demand or undertake ambitious projects, then scale back down without the complexities of layoffs. This responsiveness is critical for maintaining competitiveness and seizing fleeting market opportunities. The SBE Council's advocacy highlights that this symbiotic relationship – where contractors gain autonomy and varied work, and businesses gain specialized skills and flexibility – is a potent engine for economic vitality.\n\nWhile the regulatory landscape surrounding worker classification continues to evolve in various jurisdictions, the SBE Council's stance firmly asserts that policies must recognize and support the integral contribution of independent contractors. Their ability to provide specialized, on-demand services allows small businesses to innovate, expand their reach, and ultimately contribute more robustly to job creation and overall economic prosperity, making them an essential component of a thriving entrepreneurial ecosystem.", "vocab": [{"word": "compelling", "definition": "evoking interest, attention, or admiration in a powerfully irresistible way; convincing"}, {"word": "underscoring", "definition": "emphasizing the importance of something"}, {"word": "indispensable", "definition": "absolutely necessary or essential"}, {"word": "fostering", "definition": "encouraging the development of something, especially something desirable"}, {"word": "autonomous", "definition": "(of a person or entity) acting independently or having the freedom to do so"}, {"word": "incurring", "definition": "becoming subject to (something unwelcome or unpleasant) as a result of one's own behavior or actions"}, {"word": "multifaceted", "definition": "having many different aspects or features"}, {"word": "symbiotic", "definition": "a relationship between different people or groups that live together and depend on each other"}]}}, "questions": [{"q": "What organization states that independent contractors are important for small businesses?", "a": "The Small Business & Entrepreneurship Council (SBE Council)."}, {"q": "Name one benefit that independent contractors offer to small businesses.", "a": "They offer flexibility, specialized skills, or help businesses grow without hiring full-time staff."}], "id": "a84d3d9c07a", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxPQm5wbi1feEhtTXFGVVFNS2NHanc4Wm5vMFltRlFjOENYRVBNZnJVREg3d1IwTHVUTERDWUZ0RUJ0enNJNXIxTTh5WUt2SFN1VkR5TTNKWjZGWVFNRUV1bXFwYUVrdGdnWldRZm9GUDBNaFFwMjhLdEZnYzRCeGc2WVd2VFhRSnVHMVJqZUNfNnFmYVROWVR3SUZNMG04T0Uyb2ZUTldpVlZCWlRKR0FLc1VVanRJRGJXb2pzMExWdUc?oc=5", "published": "2026-10-23T09:04:16+09:00", "category": "business", "category_title": "Business"}, {"headline": "Japan's Inflation Exceeds Target, Rate Hike Expected", "excerpt": "Japan's core inflation has risen above the central bank's goal, making an interest rate increase likely in the near future.", "levels": {"Beginner": {"text": "Japan's prices are going up. This is called inflation. The Bank of Japan (BOJ) is the country's central bank. It has a goal for how much prices should increase each year. This goal is usually 2%. Recently, prices have been going up more than this goal. This is important news for Japan's economy.\n\nWhen prices go up too much, the central bank often tries to slow them down. One way to do this is to raise interest rates. If interest rates go up, it costs more money to borrow. For example, loans for cars or houses become more expensive. When borrowing is more expensive, people and businesses might spend less money. This can help to slow down inflation.\n\nJapan has had very low inflation, or even falling prices (deflation), for many years. So, having prices go above the BOJ's target is a big change. Many people now think the BOJ will raise interest rates soon. This would be the first time in a long while that Japan's central bank has made such a move to control rising prices. It shows that the economy is changing.", "vocab": [{"word": "Inflation", "definition": "When prices for goods and services go up over time."}, {"word": "Central bank", "definition": "A main bank that controls a country's money and banking system."}, {"word": "Target", "definition": "A goal or level that something is trying to reach."}, {"word": "Raise", "definition": "To increase something, like a price or a rate."}, {"word": "Borrow", "definition": "To take money from a bank or person with the promise to pay it back later."}, {"word": "Deflation", "definition": "When prices for goods and services go down over time."}]}, "Intermediate": {"text": "Japan's economy is seeing a significant shift as core inflation has now exceeded the Bank of Japan's (BOJ) long-standing target. The core consumer price index (CPI), which measures the average change in prices paid by consumers for goods and services (excluding volatile fresh food prices), has risen above the central bank's 2% goal. This development strongly suggests that the BOJ is likely to implement an interest rate hike in the near future.\n\nFor decades, Japan has struggled with persistent deflation or very low inflation, a unique challenge among major global economies. To combat this, the BOJ maintained an ultra-loose monetary policy, including negative interest rates and massive asset purchases, aimed at stimulating economic activity and encouraging price increases. The current rise in inflation above the target marks a potential turning point after years of these efforts.\n\nAn interest rate hike is a key tool used by central banks to manage inflation. When rates increase, the cost of borrowing money for consumers and businesses rises. This can lead to reduced spending and investment, which in turn helps to cool down an overheating economy and bring inflation back to a desired level. The BOJ's potential move would align it more closely with other major central banks around the world, which have already raised rates to counter their own inflationary pressures.\n\nThe implications of this shift are considerable. While higher inflation can erode purchasing power, a sustained period of moderate inflation is often seen as healthy for an economy, indicating robust demand. For Japan, moving away from deflationary pressures could signal a new phase of economic growth, though the BOJ will need to carefully balance controlling prices with supporting the ongoing recovery. The market is now closely watching for the timing of this anticipated policy adjustment.", "vocab": [{"word": "Exceeded", "definition": "Went beyond a set limit or target."}, {"word": "Core inflation", "definition": "A measure of inflation that removes volatile items like fresh food, to show a clearer trend."}, {"word": "Monetary policy", "definition": "Actions taken by a central bank to control the money supply and interest rates."}, {"word": "Deflation", "definition": "A general decrease in prices and an increase in the purchasing power of money."}, {"word": "Stimulating", "definition": "Encouraging or making something more active."}, {"word": "Implications", "definition": "The possible results or effects of something."}, {"word": "Sustained", "definition": "Continuing for an extended period without interruption."}]}, "Advanced": {"text": "A significant economic inflection point appears to be on the horizon for Japan as its core inflation has demonstrably surpassed the Bank of Japan's (BOJ) long-held 2% target. The core consumer price index (CPI), which meticulously tracks the average change in prices for goods and services, excluding the highly volatile fresh food component, has now consistently registered above this critical benchmark. This development firmly cements the likelihood of a near-term interest rate hike by the BOJ, a monumental shift after decades of an aggressively accommodative monetary stance.\n\nFor an extended period, Japan grappled with the formidable challenge of deflationary pressures and stagnant economic growth, an anomaly among advanced economies. In response, the BOJ embarked on an unprecedented ultra-loose monetary policy, characterized by negative interest rates, an expansive asset purchase program, and a yield curve control (YCC) framework designed to keep long-term borrowing costs exceptionally low. The primary objective was to extricate the economy from its deflationary spiral and foster a sustained, moderate level of inflation. The current trajectory of inflation, exceeding the target, suggests these efforts are finally bearing fruit, albeit with new policy challenges.\n\nA pivot towards monetary tightening, specifically an interest rate hike, serves as the central bank's primary mechanism to temper inflationary pressures. By increasing the cost of borrowing for both businesses and consumers, it aims to cool aggregate demand, thereby moderating price increases. This anticipated move would bring the BOJ into closer alignment with its global counterparts, many of whom have already aggressively raised rates to combat post-pandemic inflation surges. However, for Japan, the decision is particularly nuanced given its unique economic history and the potential impact on the still-fragile recovery.\n\nThe ramifications of such a policy adjustment are multifaceted. While a sustained period of inflation above zero is generally viewed as a healthy indicator of robust economic activity and demand, excessive inflation can erode purchasing power and destabilize financial markets. The BOJ faces the delicate task of normalizing its policy without stifling nascent wage growth or derailing the economic momentum it has painstakingly cultivated. Market participants are now keenly scrutinizing economic data and BOJ communications for definitive signals regarding the timing and magnitude of this historic policy recalibration, which could bolster the yen and reshape investment strategies across the globe. This represents not merely a technical adjustment but a profound reorientation of Japan's economic landscape.", "vocab": [{"word": "Inflection point", "definition": "A moment of significant change or turning point in a situation."}, {"word": "Demonstrably", "definition": "In a way that can be clearly shown or proven."}, {"word": "Cements", "definition": "Makes something stronger or more certain."}, {"word": "Accommodative", "definition": "(Monetary policy) Designed to stimulate economic growth, typically through low interest rates."}, {"word": "Deflationary pressures", "definition": "Economic forces that cause a general decline in prices."}, {"word": "Yield curve control (YCC)", "definition": "A monetary policy tool where a central bank targets a specific yield for government bonds of a certain maturity."}, {"word": "Monetary tightening", "definition": "A central bank policy to reduce the money supply and raise interest rates, usually to combat inflation."}, {"word": "Ramifications", "definition": "The complex or unwelcome results of an action or event."}]}}, "questions": [{"q": "What is happening to Japan's core inflation rate?", "a": "It has exceeded the Bank of Japan's target."}, {"q": "What action is the Bank of Japan likely to take soon because of this?", "a": "They are likely to raise interest rates."}], "id": "abc2fbbc9fe", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxPVmYtaWVyd0RXWG04QndjdXNBdnVVUXMyMUQwUGx0VGpiMW9QbDhiOGs5V1VyVWxTRF9NRE1jWG9wNkIzejl6SFkxMng3Vk15bFV3VjM3eUV6UUdhN1lLenh6Nnlpd09LZ1pDc3lJZDc0U0NXLUpXNUxJNDFjWkR4QTllQ0s1Y05MU2M0c0FIT2ptakJ4cEMtYzAxcGRUSXVqRjlDeXJpVHI?oc=5", "published": "2026-10-23T09:12:13+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Japan's Rising Inflation Paves Way for Potential Interest Rate Hike", "excerpt": "Japan's consumer prices are increasing, which could lead its central bank to raise interest rates for the first time in years.", "levels": {"Beginner": {"text": "Prices for things people buy in Japan are going up. This is called consumer inflation. For a long time, prices in Japan did not go up much, or they even went down. Now, things are changing.\n\nThe Bank of Japan (BOJ) is like the country's main bank. It helps keep the economy stable. One way it does this is by setting interest rates. Interest rates are what banks charge to lend money. For many years, the BOJ kept interest rates very low. This was to help the economy grow.\n\nNow that prices are rising, the BOJ might decide to raise interest rates. If interest rates go up, it means borrowing money will cost more. This can help slow down how fast prices are rising. This change would be important for Japan. It shows that the economy is moving in a new direction after a long time. People will watch to see what the BOJ decides to do next.", "vocab": [{"word": "Inflation", "definition": "When prices for many things go up."}, {"word": "Bank of Japan (BOJ)", "definition": "Japan's main bank that helps manage the country's money."}, {"word": "Interest rates", "definition": "The extra money you pay when you borrow money, or earn when you save it."}, {"word": "Economy", "definition": "How a country makes and uses money and goods."}, {"word": "Stable", "definition": "Staying steady and not changing much."}]}, "Intermediate": {"text": "Japan is currently experiencing a notable increase in consumer inflation, a development that could signal a significant shift in the country's long-standing economic policy. For decades, Japan has grappled with deflation, a period where prices generally fall, or very low inflation, which prompted its central bank to maintain ultra-loose monetary policies. This unique economic situation has made Japan an outlier among major global economies.\n\nThe Bank of Japan (BOJ), the nation's central bank, has kept interest rates at extremely low, even negative, levels for many years. This strategy aimed to stimulate economic growth, encourage spending, and boost investment. However, the recent uptick in consumer prices, as reported by financial news outlets, is now providing a \"tailwind\" – a favorable condition – for the BOJ to consider raising its benchmark interest rate. This would be a crucial step towards normalizing its monetary policy.\n\nA rate hike would mark a pivotal moment for Japan. When interest rates rise, borrowing money becomes more expensive for both businesses and consumers, affecting everything from mortgages to business loans. This action is typically taken to cool down an overheating economy and bring inflation under control, aligning with the BOJ's long-held goal of achieving stable price growth, typically around a 2% target. While the BOJ has been cautious about tightening policy too soon, fearing a return to deflation, the sustained rise in inflation offers a stronger justification for such a move. This potential policy change reflects a broader global trend where central banks are adjusting to higher inflation environments following years of accommodative policies, indicating Japan might finally be moving past its deflationary era.", "vocab": [{"word": "Consumer inflation", "definition": "A general rise in the prices of goods and services that people buy."}, {"word": "Deflation", "definition": "A general fall in prices, often seen as harmful to the economy."}, {"word": "Bank of Japan (BOJ)", "definition": "Japan's central bank, responsible for monetary policy."}, {"word": "Monetary policies", "definition": "Actions taken by a central bank to control the money supply and credit conditions."}, {"word": "Interest rates", "definition": "The cost of borrowing money or the return on savings."}, {"word": "Tailwind", "definition": "A factor or situation that helps or supports progress."}, {"word": "Normalize", "definition": "To return to a usual or standard condition."}]}, "Advanced": {"text": "Japan is witnessing a significant uptick in consumer inflation, a development that is increasingly being viewed as a crucial \"tailwind\" for the Bank of Japan (BOJ) to finally consider a long-anticipated interest rate hike. This potential policy pivot would represent a monumental shift for an economy that has, for decades, been an anomaly among developed nations, grappling with persistent deflation or stubbornly low price growth. The Wall Street Journal's observation underscores the growing consensus that conditions are aligning for a departure from an era of ultra-loose monetary policy.\n\nFor years, the BOJ has maintained an unprecedented accommodative stance, characterized by negative interest rates, massive asset purchases (quantitative easing), and yield curve control, in a determined effort to escape the deflationary spiral and stimulate economic activity. This unconventional approach was designed to encourage lending, investment, and consumer spending, aiming to achieve a sustainable 2% inflation target that has largely remained elusive. However, the recent data indicating a sustained rise in consumer prices, driven by a combination of global commodity price increases, supply chain disruptions, and a weaker yen boosting import costs, is now providing the central bank with the necessary conditions to contemplate a normalization of its monetary policy.\n\nA decision to raise interest rates would not merely be a technical adjustment but a profound signal that Japan's economy might finally be exiting its protracted deflationary era. Such a move would make borrowing more expensive across the board, impacting everything from corporate investment decisions to household mortgages and consumer credit. The primary objective of a rate hike is to temper inflationary pressures by reducing aggregate demand, thereby bringing price growth back towards the BOJ's target in a controlled and sustainable manner.\n\nThe BOJ has historically been exceptionally cautious, wary of tightening policy prematurely and risking a relapse into deflation, a fear deeply ingrained after decades of economic stagnation. However, the current inflationary environment, while partly influenced by external factors, also shows nascent signs of domestic demand picking up and wage growth beginning to materialize, providing a more robust foundation for a policy adjustment. This potential shift aligns Japan with a global trend where major central banks have already embarked on tightening cycles to combat elevated inflation. Successfully navigating this transition will be critical for the BOJ, as it seeks to unwind years of unconventional policy without destabilizing the fragile economic recovery or stifling nascent wage growth. The world will be watching closely as Japan's central bank weighs the implications of this pivotal moment, potentially ushering in a new, more conventional chapter for the world's third-largest economy.", "vocab": [{"word": "Uptick", "definition": "A small increase or rise."}, {"word": "Tailwind", "definition": "A favorable circumstance or factor that aids progress."}, {"word": "Monetary policy", "definition": "The actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "Deflationary spiral", "definition": "A vicious cycle where falling prices lead to reduced production, lower wages, and further price drops."}, {"word": "Accommodative stance", "definition": "A central bank policy designed to stimulate economic growth by keeping interest rates low and increasing the money supply."}, {"word": "Elusive", "definition": "Difficult to find, achieve, or remember."}, {"word": "Normalization", "definition": "The process of returning to a standard or typical state, often referring to monetary policy after a period of unconventional measures."}, {"word": "Protracted", "definition": "Lasting for a long time or longer than expected or usual."}]}}, "questions": [{"q": "What is happening to consumer prices in Japan?", "a": "Consumer prices in Japan are increasing, which is called an uptick in consumer inflation."}, {"q": "What action might the Bank of Japan (BOJ) take because of rising prices?", "a": "The Bank of Japan (BOJ) might decide to raise interest rates."}], "id": "af64ed0ab5b", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipAFBVV95cUxOcXhvQ0E5MTVrZnNzVU5fZk1NcU90OVFoRkZkSV94eWgwd3BGSUstSEEtN3I5d0VQX0tsT3BTU0stY0ZzS0EyZU1EckJiQ3Fna05yVzFhbkpOdlBhWE1ma05jMHFxZTlZaTNySmRLTkgyWUFkeWZXSUVzNW9lOW5ubm5NVTAxMVRuT0pHMUc1eFRoMTU5R3VDYkRiSUpMMW1EUWh1eQ?oc=5", "published": "2026-10-23T08:58:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Trump Ordered to Testify Under Oath in BBC Lawsuit", "excerpt": "Former US President Donald Trump must answer questions under oath in his lawsuit against the BBC over an edited 2021 speech.", "levels": {"Beginner": {"text": "Donald Trump, who used to be the President of the United States, is suing the BBC. The BBC is a big news company from Britain. Mr. Trump is unhappy about a TV show called \"Panorama.\" This show used parts of a speech he made in 2021. He says the show put two different parts of his speech together in a way that changed what he meant.\n\nNow, a judge has told Mr. Trump that he must answer questions about the lawsuit. He has to do this \"under oath.\" This means he must promise to tell the truth when he answers. This is part of a legal case. Mr. Trump believes the BBC's editing made his speech look bad. He thinks it made people think he was saying something he wasn't. The lawsuit is about whether the BBC showed his speech fairly.\n\nThe judge's order means Mr. Trump will have to explain his side of the story directly. This is an important step in the lawsuit between the former President and the British news company.", "vocab": [{"word": "President", "definition": "The leader of a country."}, {"word": "Suing", "definition": "Taking someone to court because you think they did something wrong."}, {"word": "News company", "definition": "A business that tells people what is happening in the world."}, {"word": "Speech", "definition": "A talk given to a group of people."}, {"word": "Edited", "definition": "Changed or put together in a different way, like a video or text."}, {"word": "Under oath", "definition": "Promising to tell the truth in a legal setting."}]}, "Intermediate": {"text": "Former U.S. President Donald Trump is currently involved in a significant legal dispute with the British Broadcasting Corporation (BBC), one of the world's largest public broadcasters. The lawsuit originated from an episode of the BBC's well-known investigative program, \"Panorama,\" which was broadcast in 2021.\n\nMr. Trump's central complaint is that the \"Panorama\" program unfairly edited a speech he delivered in 2021. He specifically alleges that the show combined two distinct parts of his address, thereby creating a misleading impression of his original message. The former President contends that this selective editing misrepresented his intentions and portrayed his remarks in a negative and damaging light, particularly concerning the political climate following the events of January 6th, 2021.\n\nIn a recent and notable development, a judge has issued an order requiring Mr. Trump to answer questions under oath as part of the ongoing legal proceedings. This process is known as a deposition, where a witness provides sworn testimony outside of court. During a deposition, Mr. Trump will be questioned by lawyers representing the BBC, and he must swear to tell the truth. Depositions are a standard and crucial part of the \"discovery\" phase in civil lawsuits, allowing both parties to gather essential information and evidence before a potential trial.\n\nThe lawsuit seeks financial damages from the BBC, with Mr. Trump arguing that the broadcaster defamed him through its alleged selective and misleading editing. He asserts that the program's presentation of his speech caused significant harm to his reputation and public image. The judge's decision to compel Mr. Trump to give a deposition is a critical juncture in the case. It means he will directly have to provide detailed answers about his claims and the specific circumstances surrounding the speech and the BBC's broadcast. This legal battle underscores the ongoing scrutiny and potential conflicts between prominent political figures and media organizations over the accurate and fair portrayal of public statements.", "vocab": [{"word": "Legal dispute", "definition": "A disagreement that is settled in court."}, {"word": "Alleges", "definition": "States something is true, often without proof yet."}, {"word": "Misleading", "definition": "Giving a wrong idea or impression."}, {"word": "Under oath", "definition": "Swearing to tell the truth in a legal setting."}, {"word": "Deposition", "definition": "A formal statement made by a witness outside of court, under oath."}, {"word": "Defamed", "definition": "Damaged someone's good reputation by saying or writing bad things."}, {"word": "Compel", "definition": "To force someone to do something."}]}, "Advanced": {"text": "Former U.S. President Donald Trump is embroiled in a high-profile legal battle with the British Broadcasting Corporation (BBC), a globally recognized public service broadcaster. The genesis of the lawsuit traces back to a 2021 episode of \"Panorama,\" the BBC's flagship investigative current affairs program, which focused on the tumultuous period surrounding the end of his presidency.\n\nAt the heart of Mr. Trump's complaint is the assertion that the \"Panorama\" broadcast egregiously misrepresented a speech he delivered in 2021. He specifically contends that the program selectively spliced together two disparate sections of his address, thereby fabricating a distorted and misleading impression of his original message. The former President maintains that this editorial decision was not merely inaccurate but deliberately crafted to portray his remarks in an inflammatory and damaging light, particularly within the charged political atmosphere that followed the January 6th Capitol attack. His legal team argues that the BBC's editing created a false narrative, implying incitement or a call to violence where none was intended by the full context of his statements. This alleged misrepresentation, according to Trump, constitutes a grave breach of journalistic ethics and a direct attack on his character.\n\nIn a significant procedural development, a judge has issued a directive compelling Mr. Trump to provide testimony under oath as part of the ongoing litigation. This process, formally known as a deposition, requires a witness to give sworn evidence outside of a courtroom setting, typically in a lawyer's office. During this deposition, Mr. Trump will be subjected to rigorous questioning by legal counsel representing the BBC, and he will be legally bound to attest to the veracity of his statements. Depositions constitute a fundamental component of the \"discovery\" phase in civil lawsuits, enabling both litigants to meticulously gather pertinent information, scrutinize evidence, and assess the strengths and weaknesses of each other's arguments prior to a potential trial. It allows the BBC's lawyers to probe the specifics of Trump's claims, his understanding of the speech's context, and the alleged harm to his reputation.\n\nThe lawsuit seeks substantial financial recompense from the BBC, with Mr. Trump alleging that the broadcaster committed defamation through its purported selective and misleading editing. He posits that the program's presentation of his speech inflicted considerable damage upon his public reputation and political standing, potentially influencing public perception and future political endeavors. The court's decision to mandate Mr. Trump's deposition represents a pivotal juncture in the proceedings. It necessitates his direct engagement with detailed inquiries concerning his claims, the precise context of the original speech, and the specific editorial choices made by the BBC. This legal confrontation underscores the persistent tensions and complex interplay between prominent political figures and influential media organizations, particularly regarding the faithful and impartial representation of public discourse. The outcome of this case could set important precedents for how media outlets handle political speeches and the extent of their editorial latitude.", "vocab": [{"word": "Embroiled", "definition": "Deeply involved in a conflict or dispute."}, {"word": "Genesis", "definition": "The origin or beginning of something."}, {"word": "Egregiously", "definition": "Outstandingly bad; shockingly."}, {"word": "Disparate", "definition": "Essentially different in kind; not able to be compared."}, {"word": "Fabricating", "definition": "Inventing or concocting (something, typically a lie) with deceitful intent."}, {"word": "Compelling", "definition": "Forcing or obliging someone to do something."}, {"word": "Veracity", "definition": "Conformity to facts; accuracy; truthfulness."}, {"word": "Litigation", "definition": "The process of taking legal action."}]}}, "questions": [{"q": "Why is Donald Trump suing the BBC?", "a": "He is suing the BBC because he claims an episode of their \"Panorama\" program unfairly edited a speech he gave in 2021, creating a misleading impression of his message."}, {"q": "What does it mean for Mr. Trump to answer questions \"under oath\"?", "a": "It means he must promise to tell the truth while being questioned in a legal setting, such as a deposition."}], "id": "a4918cfecd2", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmy0ryjx7741o?at_medium=RSS&at_campaign=rss", "published": "2026-10-23T09:10:46+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Powerful Earthquake Kills 16 in Remote Tibet", "excerpt": "A strong earthquake in a remote, mountainous part of north-eastern Tibet has reportedly killed 16 people, highlighting the region's seismic activity.", "levels": {"Beginner": {"text": "A strong earthquake has hit a part of Tibet, killing 16 people. The news reports say the ground shook powerfully in north-eastern Tibet.\n\nThis area is very mountainous, meaning it has many tall hills and peaks. It is also a sparsely-populated region, which means not many people live there. Because of this, the area is quiet and remote, far from big cities.\n\nWhen an earthquake happens, the Earth's surface moves and shakes. This can cause buildings to break or fall down, which is very dangerous. For the people living there, it can be a frightening experience.\n\nGetting help to this mountainous and remote area can be difficult. Roads might be damaged, or it might be hard for rescue teams to travel quickly. Rescue workers will try their best to reach anyone who is hurt or trapped under debris. They will work to find survivors and provide aid.\n\nTibet is known to have earthquakes sometimes. This is because of the way the Earth's big land plates move under the ground. People are sad about the lives lost and hope that those affected will receive the help they need.", "vocab": [{"word": "earthquake", "definition": "when the ground shakes strongly"}, {"word": "killed", "definition": "caused the death of someone"}, {"word": "mountainous", "definition": "having many mountains"}, {"word": "region", "definition": "an area of land"}, {"word": "remote", "definition": "far away from cities or towns"}, {"word": "rescue teams", "definition": "groups of people who help others in danger"}]}, "Intermediate": {"text": "A powerful earthquake has struck a remote, mountainous region in north-eastern Tibet, reportedly causing the deaths of 16 people. The seismic event occurred in an area characterized by its rugged terrain and sparse population, according to initial reports from the BBC.\n\nThe earthquake's impact in such an isolated location presents significant challenges for emergency responders. Access to the affected zone can be difficult due to the mountainous landscape and potentially damaged infrastructure, such as roads and communication lines. Rescue teams are mobilizing to reach the site, assess the full extent of the damage, and provide urgent assistance to any survivors. This often involves navigating treacherous paths and working against time.\n\nTibet, situated on the vast Tibetan Plateau, is part of a seismically active zone. This means earthquakes are relatively common here. The region lies near the boundary where the Indian and Eurasian tectonic plates meet and push against each other. This ongoing geological activity causes immense stress in the Earth's crust, which is periodically released as earthquakes, sometimes powerful ones.\n\nWhile the sparse population of the affected area may have limited the number of immediate casualties compared to a densely populated city, it simultaneously complicates search and rescue operations. It can take longer to locate people in need, transport medical supplies, and deliver humanitarian aid to scattered communities.\n\nAuthorities are working to coordinate relief efforts and ensure that necessary resources are deployed to help the communities impacted by this natural disaster. The focus is on finding any remaining survivors, treating the injured, and supporting those who have lost loved ones or homes. The full scale of the damage is still being assessed as teams reach more remote villages.", "vocab": [{"word": "seismic event", "definition": "an earthquake or other shaking of the Earth"}, {"word": "rugged terrain", "definition": "land that is rough and uneven, often with rocks and mountains"}, {"word": "sparse population", "definition": "an area where very few people live"}, {"word": "infrastructure", "definition": "basic systems and structures (like roads, bridges, communication networks) that a country or organization needs to function"}, {"word": "tectonic plates", "definition": "large pieces of the Earth's outer layer that move slowly"}, {"word": "casualties", "definition": "people who are killed or injured in an accident or war"}, {"word": "humanitarian aid", "definition": "help given to people in need, especially after a disaster"}]}, "Advanced": {"text": "A significant seismic event has claimed at least 16 lives in a remote, high-altitude expanse of north-eastern Tibet, according to initial reports from BBC News. The earthquake's epicenter was located in a rugged, sparsely populated mountainous region, presenting formidable logistical hurdles for emergency responders attempting to assess the full scope of the disaster and provide immediate assistance.\n\nThe Tibetan Plateau, often referred to as the \"Roof of the World,\" is situated within one of the planet's most seismically active zones. This geological dynamism is a direct consequence of the ongoing collision between the Indian and Eurasian tectonic plates, a colossal process that has been shaping the Himalayas and the plateau for millions of years. The immense pressures generated by this continental convergence frequently trigger tremors and more powerful quakes across the Himalayan arc, making such events a recurrent natural hazard for the region's inhabitants. The specific magnitude of this recent quake, while not detailed in initial reports, was clearly sufficient to cause significant structural damage and fatalities.\n\nThe low population density of the affected area, while tragic for those lost, may have inadvertently mitigated a higher casualty count compared to a quake of similar magnitude striking a densely populated urban center. However, this very remoteness simultaneously complicates rapid damage assessment and the efficient deployment of humanitarian aid. Infrastructure, including roads, bridges, and communication networks, is often rudimentary or non-existent in these isolated territories. If landslides, a common secondary effect of powerful earthquakes in mountainous regions, have occurred, access routes could be completely severed, further impeding rescue efforts and the delivery of essential supplies like food, water, and medical provisions.\n\nAuthorities are mobilizing substantial resources, including specialized search and rescue teams, to conduct comprehensive operations, evaluate the structural integrity of remaining buildings, and provide essential relief to any survivors. The challenging topography and extreme weather conditions prevalent at high altitudes add another layer of complexity to these efforts, demanding specialized equipment and highly trained personnel capable of operating in such arduous environments.\n\nThe long-term recovery efforts in such a harsh and isolated environment will undoubtedly pose considerable challenges, requiring sustained support to rebuild homes, restore livelihoods, and ensure the resilience of local communities against future seismic events. Understanding the specific geological characteristics of the affected fault lines will be crucial for future hazard mitigation strategies and for informing more robust building codes in this perpetually active tectonic landscape. This incident serves as a stark reminder of the constant geological forces at play in this part of the world and the vulnerability of human settlements to their immense power.", "vocab": [{"word": "seismic event", "definition": "a phenomenon resulting from forces originating in the Earth's interior, such as an earthquake or volcanic eruption."}, {"word": "epicenter", "definition": "the point on the Earth's surface directly above the focus of an earthquake."}, {"word": "logistical hurdles", "definition": "significant difficulties or obstacles related to the planning, organization, and execution of complex operations."}, {"word": "tectonic plates", "definition": "large, rigid slabs of the Earth's lithosphere that move slowly over the underlying mantle, causing geological phenomena like earthquakes and volcanoes."}, {"word": "mitigated", "definition": "made less severe, serious, or painful."}, {"word": "rudimentary", "definition": "relating to an undeveloped or basic form; primitive."}, {"word": "resilience", "definition": "the capacity to recover quickly from difficulties; toughness."}, {"word": "hazard mitigation", "definition": "actions taken to reduce or eliminate the long-term risk to human life and property from natural hazards."}]}}, "questions": [{"q": "Where did the earthquake happen?", "a": "The earthquake happened in a mountainous, sparsely-populated region in north-eastern Tibet."}, {"q": "How many people were reported to have died?", "a": "Sixteen people were reported to have died."}], "id": "a6b2bd0d91e", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ck5ynd1z6e83o?at_medium=RSS&at_campaign=rss", "published": "2026-10-23T09:00:38+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "New York Jets Can't Look Past the Miami Dolphins - Yahoo Sports", "excerpt": "New York Jets Can't Look Past the Miami Dolphins Yahoo Sports", "levels": {"Beginner": {"text": "New York Jets Can't Look Past the Miami Dolphins Yahoo Sports", "vocab": []}, "Intermediate": {"text": "New York Jets Can't Look Past the Miami Dolphins Yahoo Sports", "vocab": []}, "Advanced": {"text": "New York Jets Can't Look Past the Miami Dolphins Yahoo Sports", "vocab": []}}, "questions": [], "id": "af54f2490b9", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMifkFVX3lxTE52ZDlycVNmMFM4XzRUaGQ1QVRKZFdzM2gxaEU3NHpWc1NxZlRBck15amdJRzdreUNyZ1BnNXlLRVZveHdYaE92Ti1NZDA5RjRFLW9GWG4yblJUUC00N3NZQ0RHOTFqaFNWdzRXaTVJaVIybDFXY3J0LUd0azY2UQ?oc=5", "published": "2026-10-23T09:05:11+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Hall of Famer Marshall Faulk reveals he's been diagnosed with Parkinson's disease - Yahoo Sports", "excerpt": "Hall of Famer Marsh o answer questions under oath in BBC lawsuit", "excerpt": "Trump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave in 2021.", "levels": {"Beginner": {"text": "Trump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave in 2021.", "vocab": []}, "Intermediate": {"text": "Trump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave in 2021.", "vocab": []}, "Advanced": {"text": "Trump is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave in 2021.", "vocab": []}}, "questions": [], "id": "a4918cfecd2", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmy0ryjx7741o?at_medium=RSS&at_campaign=rss", "published": "2026-10-23T09:10:46+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
