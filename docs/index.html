: "a832e8c5fd2", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMif0FVX3lxTFBxWjJJNXVGckZjM1FCSWZnQ0V3dEdUTlljXzF4eE11UzM1WnVmZGppQUtPZFQzbGlLY3hYdlpUWGRMcHV5Xzd3Q0R2cjZRaGE2SGpORDNaMzJVOE5oblZ5TnN6SjNpSURDSHFzVEhPa1NTbC1XNnQwSHpuVDlaUEU?oc=5", "published": "2026-09-08T08:00:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Zero Company's Characters Win Praise for Unique Animation", "excerpt": "Zero Company is earning acclaim for its animated characters, which blend human and alien features with charming and expressive touches.", "levels": {"Beginner": {"text": "Zero Company is getting a lot of praise for its animated characters. People are saying these characters are very special and lovely. They have a mix of human and alien looks, which makes them unique.\n\nThe company's animators have done a great job. They made the characters move in a way that feels real and full of feeling. These \"human/alien touches\" mean the characters show emotions that people can understand, even if they look a bit like aliens. This makes them very easy to like.\n\nMany people who have seen Zero Company's latest work are happy. They enjoy how different these characters are. The animation is clear and smooth, bringing the characters to life on screen. This positive reaction shows that good character design and animation are very important. Zero Company has found a way to make characters that stand out and connect with audiences. Their work is being talked about because it's fresh and well-made. This success is a good sign for the company and for future animated projects.", "vocab": [{"word": "praise", "definition": "good words about someone or something."}, {"word": "animated", "definition": "made to look like it is moving, like in cartoons."}, {"word": "unique", "definition": "very special, one of a kind."}, {"word": "emotions", "definition": "strong feelings like happiness or sadness."}, {"word": "audiences", "definition": "groups of people who watch or listen."}, {"word": "connect", "definition": "to feel a bond or understanding with something."}]}, "Intermediate": {"text": "Zero Company is receiving significant acclaim for its animated characters, which are being celebrated for their distinctive blend of human and alien qualities. The company's recent project has garnered widespread positive attention, with many viewers and critics highlighting the captivating and expressive nature of these unique designs. This praise marks a notable success for the animation studio, solidifying its reputation for creative excellence.\n\nThe animation team at Zero Company has clearly put immense effort into crafting characters that resonate deeply with audiences. By incorporating \"human/alien touches,\" they have managed to create beings that, while visually otherworldly, convey relatable emotions and gestures. This thoughtful approach allows viewers to form a strong connection with the characters, making them feel authentic and alive despite their fantastical appearances. The smooth and detailed animation further enhances this connection, bringing a rich depth to every movement and expression. This careful attention to detail ensures that each character's personality shines through, making them memorable.\n\nThe positive reception following the release of Zero Company's latest work underscores the power of innovative character design and high-quality animation. Industry observers note that the company has successfully pushed creative boundaries, offering a fresh perspective on how characters can be imagined and brought to life. This success not only boosts Zero Company's reputation but also sets a new benchmark for character development in the animation industry. The ability to create characters that are both visually striking and emotionally engaging is a testament to the skill and vision behind their creative process. This achievement suggests a promising future for the company, potentially influencing trends in character animation across various media.", "vocab": [{"word": "acclaim", "definition": "strong public praise and approval."}, {"word": "distinctive", "definition": "easy to recognize because it is different from others."}, {"word": "blend", "definition": "a mixture of different things."}, {"word": "expressive", "definition": "showing feelings or thoughts clearly."}, {"word": "captivating", "definition": "holding your attention completely."}, {"word": "resonate", "definition": "to have a strong effect or impact on someone."}, {"word": "benchmark", "definition": "a standard or point of reference against which things may be compared."}]}, "Advanced": {"text": "Zero Company is currently basking in widespread critical and popular acclaim for its groundbreaking animated characters, which are being lauded for their innovative and nuanced integration of human and alien characteristics. The aftermath of their latest project's release has seen a surge of positive commentary, with industry analysts and audiences alike commending the studio's exceptional ability to craft figures that are both visually arresting and deeply evocative. This significant artistic achievement is cementing Zero Company's position as a formidable creative force within the competitive animation landscape, setting a new standard for character design and emotional resonance.\n\nThe meticulous approach taken by Zero Company's animation department is evident in every frame. Their \"human/alien touches\" are not merely cosmetic; they represent a sophisticated design philosophy that allows for the portrayal of complex emotions and universal experiences through a non-human lens. This intricate balance ensures that while the characters possess otherworldly attributes, their core expressions and reactions remain profoundly relatable, fostering an immediate and powerful connection with viewers. The technical prowess displayed in the animation itself—characterized by fluid motion, intricate detailing, and subtle facial cues—further elevates these designs, imbuing them with a palpable sense of life and personality that transcends conventional character archetypes. This level of craftsmanship not only captivates the audience but also serves as a masterclass in how to achieve depth and authenticity in fantastical creations.\n\nThe overwhelmingly positive reception underscores the profound impact of thoughtful character development and superior animation quality on audience engagement and critical discourse. Experts suggest that Zero Company has not only expanded the visual lexicon of animated storytelling but has also demonstrated a keen understanding of narrative empathy, proving that unique aesthetics can amplify emotional resonance. This success is more than just a win for the company; it establishes a new benchmark for character design, potentially influencing future trends across the global animation industry. The ability to consistently produce characters that are both aesthetically innovative and emotionally compelling speaks volumes about the studio's creative vision and technical mastery, positioning them as pioneers in the evolving art form of animation. This triumph is likely to inspire a new generation of animators and designers, pushing the boundaries of what is possible in character creation and solidifying Zero Company's market leadership. The sustained positive \"aftermath\" indicates a strong foundation for future projects, attracting top talent and securing a loyal fanbase eager for their next imaginative venture.", "vocab": [{"word": "acclaim", "definition": "enthusiastic and public praise."}, {"word": "lauded", "definition": "highly praised or admired."}, {"word": "nuanced", "definition": "characterized by subtle shades of meaning or expression."}, {"word": "evocative", "definition": "bringing strong images, memories, or feelings to mind."}, {"word": "intricate", "definition": "very complicated or detailed."}, {"word": "prowess", "definition": "skill or expertise in a particular activity or field."}, {"word": "lexicon", "definition": "the vocabulary of a person, language, or branch of knowledge."}, {"word": "benchmark", "definition": "a standard or point of reference against which things may be compared or assessed."}]}}, "questions": [{"q": "What is Zero Company receiving praise for?", "a": "Zero Company is receiving praise for its animated characters, specifically their unique blend of human and alien features."}, {"q": "What makes Zero Company's characters special and relatable to audiences?", "a": "The characters are special because they combine human and alien looks, and they are relatable because their animation conveys understandable emotions and gestures, despite their fantastical appearance."}], "id": "a25a7064af0", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMigAFBVV95cUxQY2MxODdJM2w1ZlVjRmY4bnBDcjJOZDV3bVZuc3cxZ2F3SWFKbXpxNm9hTFpQSDVaTUdtb3JYell1aFQ1YzlaSTNyRGJZakdtVFJWUm1wS3h2YTFKT19JaTNXZmlqMGpCMkVHWUszZ3I3Zmk5bWlZUy1hM2xuRUZSbA?oc=5", "published": "2026-09-08T08:42:46+09:00", "category": "business", "category_title": "Business"}, {"headline": "Idlewild Park Spotlights Trade Careers at Fifth LaborFest", "excerpt": "Idlewild Park recently hosted its fifth annual LaborFest, an event designed to introduce people to valuable trade careers and skilled jobs.", "levels": {"Beginner": {"text": "Idlewild Park recently held a special event called LaborFest. This was the fifth time the park hosted LaborFest. The event wanted to show people many different jobs that need special skills. These jobs are called trade careers.\n\nAt LaborFest, visitors could learn about jobs like building houses, fixing cars, or working with electricity. These jobs are very important for our community. Many young people and families came to the park to see what trade careers are like.\n\nThey could watch people do their jobs and even try some simple tasks. This helps them understand what these jobs involve. LaborFest helps students think about different paths for their future. It shows that not all good jobs need a college degree. Trade careers can offer good pay and steady work. The event helps our community by making sure we have enough skilled workers for the future.", "vocab": [{"word": "event", "definition": "a planned public or social occasion."}, {"word": "skills", "definition": "abilities that you get from training or experience."}, {"word": "trade careers", "definition": "jobs that need special practical skills, like plumbing or carpentry."}, {"word": "community", "definition": "the people living in one particular area or town."}, {"word": "steady", "definition": "regular and not changing; reliable."}]}, "Intermediate": {"text": "Idlewild Park recently hosted its fifth annual LaborFest, an important event designed to introduce community members to the wide world of trade careers. This yearly festival aims to highlight the value and opportunities available in skilled trades, offering a practical and often lucrative alternative path to traditional four-year college degrees.\n\nThe LaborFest welcomed a diverse group of attendees, including students, job seekers, and families, all eager to explore various vocational fields. Organized by local labor unions and community partners, the event featured numerous booths where professionals from different trades showcased their skills. Visitors had the chance to engage with experts in construction, electrical work, plumbing, welding, automotive repair, and even some healthcare support roles. Many booths featured live demonstrations and hands-on activities, allowing visitors to experience what these jobs entail firsthand. For example, some might have tried basic welding techniques, learned about circuit wiring, or practiced using common tools.\n\nA primary goal of LaborFest is to address the growing demand for skilled workers across many industries. As older generations of tradespeople retire, there's a significant need for new talent to fill these essential roles. Trade careers often provide excellent wages, strong job security, and the satisfaction of working with one's hands to create tangible results. They are fundamental for maintaining infrastructure, building new homes, and keeping local economies strong and functional. By showcasing these vital professions, LaborFest encourages young people to consider vocational training and apprenticeships as viable and rewarding career options. The event helps ensure that the community will have a robust and skilled workforce for years to come, benefiting both individuals seeking employment and the region's overall economic health.", "vocab": [{"word": "annual", "definition": "happening once every year."}, {"word": "alternative", "definition": "a different choice or option."}, {"word": "vocational", "definition": "relating to an occupation or employment."}, {"word": "demonstrations", "definition": "acts of showing how something works or is done."}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., buildings, roads, power supplies) needed for the operation of a society or enterprise."}, {"word": "apprenticeships", "definition": "periods of training for a skilled job, often while working for an employer."}]}, "Advanced": {"text": "Idlewild Park recently served as the vibrant venue for its fifth annual LaborFest, a pivotal community event aimed at elevating the profile of skilled trade careers. This recurring festival plays a crucial role in addressing the persistent national and local demand for qualified tradespeople, presenting a compelling alternative to the often-emphasized four-year university track.\n\nThe event, meticulously organized by a coalition of local labor unions, educational institutions, and community development organizations, drew a substantial and diverse attendance. Students contemplating their post-secondary options, individuals seeking career changes, and families exploring future pathways for their children converged to interact with a broad spectrum of vocational fields. Exhibitors represented essential sectors such as construction, advanced manufacturing, electrical engineering, plumbing, welding, automotive technology, culinary arts, and even specialized healthcare support.\n\nA hallmark of LaborFest was its interactive approach. Booths were not merely informational; they offered dynamic, hands-on experiences. Visitors could engage in simulated tasks, from operating miniature excavators and practicing intricate welding techniques to exploring augmented reality tools used in modern construction and troubleshooting electrical circuits. These practical engagements provided tangible insights into the daily realities and technical demands of various professions, demystifying complex trades and sparking genuine interest.\n\nThe strategic importance of events like LaborFest cannot be overstated. The United States, like many developed nations, faces a significant skilled labor gap, with an aging workforce and a societal bias towards academic degrees often leaving vital trade positions unfilled. This shortage impacts everything from infrastructure maintenance and housing development to technological innovation and public services. Trade careers, often requiring rigorous vocational training and apprenticeships, offer competitive salaries, robust benefits, and remarkable job security, frequently surpassing the earning potential of many bachelor's degrees without the burden of substantial student debt.\n\nBy proactively showcasing these indispensable professions, LaborFest not only empowers individuals to make informed career choices but also strengthens the regional economy by cultivating a pipeline of skilled talent. It underscores the dignity of manual labor and the intellectual rigor involved in mastering a trade, challenging outdated perceptions and ensuring the community's continued prosperity and functional capacity. The festival stands as a testament to the enduring value of practical skills in a rapidly evolving economic landscape.", "vocab": [{"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "persistent", "definition": "continuing firmly or obstinately in a course of action in spite of difficulty or opposition."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "coalition", "definition": "a temporary alliance for combined action, especially of political parties forming a government or of states."}, {"word": "demystifying", "definition": "making a difficult or mysterious subject clearer and easier to understand."}, {"word": "indispensable", "definition": "absolutely necessary."}, {"word": "cultivating", "definition": "trying to acquire or develop (a quality, sentiment, or skill)."}, {"word": "testament", "definition": "something that serves as a sign or evidence of a specified fact, event, or quality."}]}}, "questions": [{"q": "What was the main purpose of the LaborFest event at Idlewild Park?", "a": "The main purpose was to show people different jobs that need special skills, also known as trade careers."}, {"q": "According to the articles, why are trade careers considered important for the community and economy?", "a": "Trade careers are important because they provide good wages, job security, are essential for maintaining infrastructure and building, and help address the demand for skilled workers as older generations retire."}], "id": "a51655e20e2", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipwFBVV95cUxPcXhpcmREQjljckxDdm9yRHVwTjdNSHpvNmF1dFdLelZhWDk5aWx1SmpqelkyNnUwQV9QRXBwakNFbS00SlE2T3NrUmlnQVVpdTU4MFhtZ2FiRjBYTW1iYnRoUzNOVEMxamJ0eFVwQnJKV2VSY1JwbC00RWpOMHoyd3RldjdsZkY2b1FmM21HRWVNRW5Dd1dNX2dPelhhNTl0d3o0V3A4RdIBuwFBVV95cUxPV05mQmVoQnI0cVhNRGt4TExfdU93X09KQXJ4OHNnbHlHUFp3cHFIMlF3VG5VdUtrVzZDeDBHbG5zcUxSZnFQa0J0QTA1N0ZXYjB6bGlYcWdUM243Wk5QbHVmMVlhTjlqZVRKZ05meXlIYUIyOVMxNHRkbkEyTHRNT1ZDSGZ4WTk3UGdDTEh5UVhQSWMzQy1lTGoyRFNFS2NhemtNQks2ZHVOZzlHR2RxTDk3NDQwS1UzZXl3?oc=5", "published": "2026-09-08T08:40:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Trump Threatens Ban on Canadian Jets Amid Trade Dispute", "excerpt": "Former US President Donald Trump threatens to stop Canadian Bombardier jet sales in the US, intensifying a trade dispute.", "levels": {"Beginner": {"text": "Donald Trump, a former leader of the United States, has made a new threat. He said he might stop Canadian Bombardier jets from being sold in America. Bombardier is a very big company in Canada. It makes airplanes.\n\nThis threat is part of a bigger problem between the United States and Canada. These two countries are neighbors. They are having a trade fight. A trade fight means they disagree about how goods are bought and sold between them.\n\nMr. Trump's threat is serious for Bombardier. If its jets cannot be sold in the US, the company could lose a lot of money. The United States is a very important market for many Canadian products, including planes.\n\nThis is not the first time there have been trade problems between the US and Canada. Sometimes, countries put extra taxes on things from other countries. This makes those things more expensive. This new threat shows the trade fight is getting bigger. People are watching to see what will happen next for Bombardier and for trade between the two countries.", "vocab": [{"word": "threaten", "definition": "to say you will do something bad to someone."}, {"word": "stop", "definition": "to make something not continue."}, {"word": "sale", "definition": "the act of selling something."}, {"word": "jets", "definition": "a type of airplane that flies very fast."}, {"word": "company", "definition": "a business that makes or sells things."}, {"word": "fight", "definition": "an argument or disagreement."}]}, "Intermediate": {"text": "Former US President Donald Trump has issued a significant threat, stating he might block the sale of Canadian-made Bombardier jets within the United States. This move targets one of Canada's largest aerospace companies and signals an escalation in trade tensions between the two neighboring countries.\n\nBombardier, a major Canadian manufacturer, produces various aircraft, including commercial jets. The potential ban on their sales in the lucrative US market could have serious economic repercussions for the company and for Canada's economy. The United States represents a crucial market for many Canadian exports, and aerospace products are a significant part of that trade.\n\nThis threat comes amid an ongoing \"trade war\" between the US and Canada. A trade war typically involves countries imposing tariffs, which are extra taxes, on goods imported from another nation. These measures are often used to protect domestic industries or to pressure another country into making trade concessions. In the past, the US and Canada have had disputes over various products, including softwood lumber and steel and aluminum tariffs. The CSeries jet, now known as the Airbus A220, was also at the center of a major trade dispute involving US aerospace giant Boeing.\n\nMr. Trump's latest statement suggests a continuation of his protectionist trade policies, which prioritize American businesses and jobs. Such actions can strain bilateral relations and create uncertainty for businesses operating across the border. The situation highlights the delicate balance of economic ties between the two close allies and raises questions about the future of their trade relationship. The outcome of this threat will be closely watched by industries in both nations.", "vocab": [{"word": "escalation", "definition": "a rapid increase; a situation becoming more serious."}, {"word": "dispute", "definition": "a disagreement or argument."}, {"word": "tariffs", "definition": "taxes placed on imported goods."}, {"word": "aerospace", "definition": "the industry that deals with building and operating aircraft and spacecraft."}, {"word": "repercussions", "definition": "unintended consequences of an action, usually negative."}, {"word": "protectionist", "definition": "policies that protect domestic industries from foreign competition, often by taxing imports."}, {"word": "bilateral", "definition": "involving two groups or countries."}]}, "Advanced": {"text": "Former US President Donald Trump has issued a stark warning, threatening to implement a ban on the sale of Canadian-made Bombardier jets within the highly lucrative United States market. This unilateral declaration targets a cornerstone of Canada's aerospace sector and underscores a significant escalation in the persistent trade friction between the two North American allies.\n\nBombardier, a venerable Canadian aerospace and transportation company, has historically been a key player in the global aircraft manufacturing industry. While the specific jet model was not named in the immediate threat, past disputes have often centered around its CSeries aircraft, now rebranded as the Airbus A220 following a strategic partnership. A prohibition on sales in the vast US market would undoubtedly inflict substantial economic repercussions on Bombardier, potentially jeopardizing jobs and revenue, and sending ripples through Canada's broader economy, which relies heavily on exports to its southern neighbor.\n\nThis latest development is set against the backdrop of an enduring \"trade war\" that characterized much of the Trump administration's foreign economic policy. This approach frequently involved the imposition of punitive tariffs on imported goods, ostensibly to safeguard American industries and employment. Previous flashpoints in US-Canada trade relations have included contentious disputes over softwood lumber, as well as the imposition of tariffs on steel and aluminum imports, which Canada met with retaliatory measures. The CSeries controversy, where US aerospace giant Boeing alleged unfair subsidies to Bombardier, led to significant duties being proposed before the deal with Airbus altered the landscape.\n\nMr. Trump's re-emergence into the political discourse with such protectionist rhetoric suggests a potential return to an \"America First\" trade agenda should he regain office. Such policies, while aimed at bolstering domestic manufacturing, often strain established bilateral relations, disrupt global supply chains, and invite tit-for-tat responses from trading partners. For Canada, a nation whose economic prosperity is intricately linked to its trade relationship with the US, these threats represent a significant source of uncertainty and a challenge to its economic sovereignty.\n\nThe implications extend beyond mere economics, touching upon geopolitical considerations and the future of North American economic integration. Businesses on both sides of the border will be closely monitoring these developments, bracing for potential disruptions and reassessing their investment strategies. The ongoing saga serves as a potent reminder of the vulnerability of international trade to political shifts and the complex interplay between national interests and global commerce.", "vocab": [{"word": "stark", "definition": "severe or bare in appearance or outline; sharply clear."}, {"word": "unilateral", "definition": "(of an action or decision) performed by or affecting only one person, group, or country involved in a situation, without the agreement of another or the others."}, {"word": "punitive", "definition": "inflicting or intended as punishment."}, {"word": "ostensibly", "definition": "apparently or purportedly, but perhaps not actually."}, {"word": "retaliatory", "definition": "(of an action) characterized by a desire for revenge; intended to harm someone who has harmed you."}, {"word": "sovereignty", "definition": "supreme power or authority; the authority of a state to govern itself or another state."}, {"word": "interplay", "definition": "the way in which two or more things have an effect on each other."}, {"word": "vulnerability", "definition": "the state of being exposed to the possibility of being attacked or harmed, either physically or emotionally."}]}}, "questions": [{"q": "What company makes the jets that Donald Trump threatened to stop selling in the US?", "a": "Bombardier, a Canadian company, makes the jets."}, {"q": "What is a \"trade war\" as described in the articles?", "a": "A \"trade war\" is when countries disagree about how goods are bought and sold, often involving them putting extra taxes (tariffs) on each other's products."}], "id": "a4560c27bf4", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c4gj8xx5010o?at_medium=RSS&at_campaign=rss", "published": "2026-09-08T08:29:12+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "South Korea's Economy Sees Fastest Growth in 47 Years", "excerpt": "South Korea's economy recorded its fastest nominal GDP growth in 47 years in Q2, showing strong economic activity.", "levels": {"Beginner": {"text": "South Korea's economy grew very fast in the second part of this year. This is the fastest growth in 47 years. The country's \"nominal GDP\" went up a lot. GDP means Gross Domestic Product. It is a way to measure how much money a country makes from all the goods and services it produces. \"Nominal\" means we look at the prices as they are now, without taking out the effect of rising prices (inflation). \n\nThe second part of the year, called Q2, includes the months of April, May, and June. During these three months, South Korea's economy showed strong activity. This kind of growth is usually a good sign for a country. It can mean that businesses are doing well, people are buying more things, and there might be more jobs. This news means that South Korea's economy is getting stronger.", "vocab": [{"word": "economy", "definition": "The system by which a country's money and goods are produced and used."}, {"word": "grew", "definition": "Increased in size, amount, or strength."}, {"word": "fastest", "definition": "Moving or happening at the highest speed."}, {"word": "nominal GDP", "definition": "A way to measure how much money a country makes, using current prices."}, {"word": "produces", "definition": "Makes or creates something."}, {"word": "Q2", "definition": "The second three-month period of a year (April, May, June)."}]}, "Intermediate": {"text": "South Korea's economy experienced its most rapid expansion in 47 years during the second quarter of the year. The country's nominal Gross Domestic Product (GDP) recorded an unprecedented growth rate, signaling robust economic activity. Nominal GDP measures the total value of all goods and services produced within a country's borders, calculated using current market prices. Unlike real GDP, nominal GDP does not adjust for inflation, meaning that a portion of its growth can be attributed to rising prices.\n\nThe second quarter, or Q2, covers the months of April, May, and June. This significant growth indicates a strong recovery and increased momentum in the South Korean economy. Factors contributing to such a surge typically include healthy consumer spending, increased business investment, and strong export performance. When the economy grows quickly, it often leads to more job opportunities and higher incomes for people.\n\nThis news suggests that South Korea's businesses are thriving and that domestic demand is picking up. While high nominal growth can sometimes be influenced by inflation, it still reflects a substantial increase in the overall economic output and transaction values. For policymakers, this strong performance provides a positive outlook, though they will also be mindful of managing potential inflationary pressures to ensure sustainable growth.", "vocab": [{"word": "expansion", "definition": "The act of becoming larger or more extensive; growth."}, {"word": "nominal GDP", "definition": "The total value of goods and services produced in a country, calculated at current market prices, without adjusting for inflation."}, {"word": "robust", "definition": "Strong and healthy; vigorous."}, {"word": "inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "momentum", "definition": "The force or speed with which something moves; the impetus gained by a moving object."}, {"word": "consumer spending", "definition": "The total money spent by individuals and households on goods and services."}, {"word": "sustainable", "definition": "Able to be maintained at a certain rate or level; causing little or no damage to the environment and therefore able to continue for a long time."}]}, "Advanced": {"text": "South Korea's economy has achieved an unprecedented milestone, recording its fastest nominal Gross Domestic Product (GDP) growth in 47 years during the second quarter. This significant surge underscores a period of robust economic activity and recovery, though its implications are multifaceted, particularly concerning inflationary dynamics.\n\nNominal GDP represents the total monetary value of all goods and services produced within a country's borders over a specific period, calculated at current market prices. Unlike real GDP, which is adjusted for inflation to provide a clearer picture of actual output volume, nominal GDP reflects both an increase in production and an increase in prices. Therefore, while the 47-year high indicates a substantial rise in economic transactions and overall value, a portion of this growth can be attributed to elevated inflationary pressures that have been prevalent globally.\n\nThe second quarter (Q2), spanning April through June, saw various sectors contributing to this impressive performance. Key drivers likely include resilient domestic consumption, bolstered by easing pandemic restrictions and pent-up demand, coupled with a strong export sector that continues to benefit from global demand for South Korean products, particularly semiconductors and automobiles. Government fiscal policies and monetary accommodation by the central bank may also have played a role in stimulating economic activity.\n\nFor policymakers at the Bank of Korea, this data presents a complex scenario. While strong nominal growth is generally positive, indicating a vibrant economy and potentially leading to higher employment and wages, the underlying inflationary component necessitates careful consideration. The central bank must weigh the benefits of economic expansion against the imperative of price stability. Sustained high nominal growth, if primarily driven by inflation, could prompt further monetary tightening measures to prevent the economy from overheating.\n\nThis historical growth trajectory positions South Korea as one of the more dynamic economies in the current global landscape, navigating ongoing supply chain challenges and geopolitical uncertainties. The focus now shifts to whether this momentum can be sustained in the face of potential global economic slowdowns and how effectively authorities can manage the balance between fostering growth and containing inflation.", "vocab": [{"word": "unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "nominal GDP", "definition": "The total value of all goods and services produced within a country's borders over a specific period, calculated at current market prices, without adjusting for inflation."}, {"word": "robust", "definition": "Strong and healthy; vigorous and resilient, indicating substantial activity or performance."}, {"word": "inflationary dynamics", "definition": "The forces and patterns related to the general increase in prices and fall in the purchasing value of money."}, {"word": "resilient", "definition": "Able to withstand or recover quickly from difficult conditions; showing an ability to bounce back."}, {"word": "fiscal policies", "definition": "Government policies relating to taxation and public spending, used to influence the economy."}, {"word": "monetary accommodation", "definition": "Actions by a central bank to increase the money supply and lower interest rates to stimulate economic activity."}, {"word": "trajectory", "definition": "The path followed by a projectile flying or an object moving under the action of given forces; in economics, the course or path of development."}]}}, "questions": [{"q": "What is the main news about South Korea's economy?", "a": "South Korea's nominal GDP grew at its fastest rate in 47 years in the second quarter."}, {"q": "What does \"nominal GDP\" mean?", "a": "Nominal GDP measures the total value of goods and services produced in a country, calculated using current market prices, without adjusting for inflation."}], "id": "a0cc6bdcb71", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5qTzZXTS1qUy1vd0xNZTBCMlBiS0xsMzR1X0pzU1BLd2NpbE9fNnFaM1FBaGFYQkxiajVvNzlvZ0JuVE9Wa1A0OWpiOWZoR0N5Zkx2VFZwNA?oc=5", "published": "2026-09-08T08:27:51+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Eiffel Tower Closed After Staff Protest Over Women Moved for Religious Group", "excerpt": "Eiffel Tower staff protested and closed the landmark after female employees were asked to move for a religious group, sparking an official investigation.", "levels": {"Beginner": {"text": "The Eiffel Tower in Paris, France, was closed recently. This happened because workers there stopped working. They were unhappy about something that happened.\n\nSome women who work at the Eiffel Tower were asked to move from their usual places. This was done to make space for a group of people who were visiting for a religious reason. A person who speaks for the workers said the women felt very bad, or \"humiliated,\" because of this.\n\nThe workers felt this was not fair. They decided to protest by closing the famous tower. Many tourists who wanted to visit could not go inside.\n\nThe mayor of Paris, Anne Hidalgo, heard about the problem. She said that officials will now look into what happened. This is called an investigation. The goal is to find out why the women were asked to move and if it was wrong.\n\nThe Eiffel Tower is a very important place in Paris. It is visited by millions of people every year. The workers want to make sure everyone is treated with respect at their job.", "vocab": [{"word": "closed", "definition": "Not open for people to enter or use."}, {"word": "unhappy", "definition": "Not pleased or satisfied."}, {"word": "religious", "definition": "Related to a belief in God or gods."}, {"word": "protest", "definition": "To show that you disagree with something, often publicly."}, {"word": "investigation", "definition": "An official examination of facts to find out the truth."}, {"word": "respect", "definition": "To treat someone with politeness and care."}]}, "Intermediate": {"text": "The iconic Eiffel Tower in Paris, France, experienced a temporary closure recently due to a staff protest. Employees decided to stop working after an incident involving female colleagues and a visiting religious group.\n\nAccording to a union representative, several female staff members were reportedly asked to move from their posts to accommodate a religious delegation visiting the landmark. This request left the women feeling \"humiliated\" and sparked outrage among their co-workers, who viewed it as discriminatory and disrespectful.\n\nThe protest led to the complete closure of the Eiffel Tower, disrupting thousands of tourists who had planned to visit one of the world's most famous attractions. The workers' action highlighted their demand for fair treatment and a workplace free from discrimination.\n\nParis Mayor Anne Hidalgo swiftly announced that an official investigation would be launched into the incident. The inquiry aims to determine the exact circumstances surrounding the request made to the female employees and whether any workplace policies or French laws, particularly those concerning secularism, were violated.\n\nFrance has strong principles of secularism, known as 'laïcité,' which separate state and religious affairs. This incident has raised questions about how these principles apply within a public workplace like the Eiffel Tower, a symbol of French culture and universal values. The outcome of the investigation is eagerly awaited to ensure such situations do not recur and that all employees feel valued and respected.", "vocab": [{"word": "iconic", "definition": "Very famous and recognized, representing something important."}, {"word": "colleagues", "definition": "People you work with."}, {"word": "accommodate", "definition": "To provide space or a place for someone; to adjust to meet needs."}, {"word": "delegation", "definition": "A group of people chosen to represent others."}, {"word": "discriminatory", "definition": "Treating one person or group worse than others, often unfairly."}, {"word": "disrupting", "definition": "Interrupting an event, activity, or process."}, {"word": "secularism", "definition": "The principle of separating government institutions and persons mandated to represent the state from religious institutions and religious dignitaries."}]}, "Advanced": {"text": "The Eiffel Tower, France's most globally recognized landmark, recently experienced an unprecedented closure stemming from a staff protest. The industrial action was triggered by an incident where female employees were reportedly asked to vacate their positions to facilitate a visit by a religious delegation, a situation that union representatives described as deeply \"humiliating.\"\n\nThe controversy erupted when members of the tower's staff, represented by various unions, initiated a walkout. They alleged that several women working at the site were instructed to move from their designated areas to accommodate a specific religious group, an act perceived as a clear instance of gender-based discrimination and an affront to workplace dignity. The protest effectively shut down the monument, causing significant disruption for thousands of international tourists and highlighting the profound discontent among the workforce.\n\nParis Mayor Anne Hidalgo swiftly responded to the escalating situation, announcing a comprehensive investigation into the matter. The inquiry aims to ascertain the precise directives given to the female employees, the rationale behind them, and whether these actions contravened established workplace regulations or the broader principles of French law. France upholds a strict interpretation of secularism, known as 'laïcité,' which mandates the separation of religious and state affairs and ensures neutrality in public spaces and services. This incident has ignited a debate about the application of these principles within a public-facing commercial entity like the Eiffel Tower, which, while privately managed, operates under a public service delegation.\n\nUnion officials have emphasized the need for a thorough examination, not only to address the specific incident but also to reinforce a culture of respect and equality for all employees. They argue that such demands create an uncomfortable and potentially hostile work environment, undermining the professional integrity of staff members. The outcome of the municipal investigation will be crucial in determining accountability, implementing corrective measures, and potentially shaping future policies regarding religious accommodations and employee rights within prominent public attractions. The incident underscores the delicate balance required to manage a global icon while upholding fundamental social values and ensuring equitable treatment for its diverse workforce.", "vocab": [{"word": "unprecedented", "definition": "Never done or known before; without previous instance."}, {"word": "stemming from", "definition": "Originating from or caused by something."}, {"word": "vacate", "definition": "To leave a place that you previously occupied."}, {"word": "facilitate", "definition": "To make an action or process easier."}, {"word": "affront", "definition": "An action or remark that causes outrage or offense."}, {"word": "ascertain", "definition": "To find out something for certain; to make sure of."}, {"word": "contravened", "definition": "Violated the prohibition or order of (a law, treaty, or code of conduct)."}, {"word": "equitable", "definition": "Fair and impartial; just."}]}}, "questions": [{"q": "Why did staff at the Eiffel Tower go on strike and close the landmark?", "a": "Staff went on strike because female employees were reportedly asked to move from their posts to accommodate a religious visiting group, which made the women feel humiliated."}, {"q": "What action did Paris Mayor Anne Hidalgo take in response to the incident?", "a": "Paris Mayor Anne Hidalgo announced that an official investigation would be launched to look into the incident."}], "id": "a3c29e4233c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/clyenxp540vo?at_medium=RSS&at_campaign=rss", "published": "2026-09-08T08:46:44+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Indian Food Safety Officer Becomes Social Media Star", "excerpt": "Tukaram Mundhe, a food safety officer in India, has gone viral online for his strict inspections of restaurants.", "levels": {"Beginner": {"text": "Tukaram Mundhe is a food safety officer in India. His important job is to make sure that restaurants are clean and safe for everyone. He visits many different places, like hotels and eateries, to check their kitchens and how they prepare food. He looks carefully for things that are not clean, such as dirty counters, old food, or bad storage.\n\nMr. Mundhe is known for being very strict. If a restaurant is found to be unclean or not following safety rules, he takes quick action. He might close the place down temporarily or give a big fine to the owners. Videos of him doing these inspections have become very popular online. People in India are watching and sharing these videos on social media platforms like crazy.\n\nBecause of these widely shared videos, Mr. Mundhe has become a social media star. Many people like his work because they believe it is important to have safe food. They appreciate that he is working hard to keep food healthy for everyone. His efforts help ensure that people can eat out without worrying about getting sick.", "vocab": [{"word": "Officer", "definition": "A person with an important job, often in the government or police."}, {"word": "Restaurants", "definition": "Places where people go to buy and eat food."}, {"word": "Clean", "definition": "Not dirty; free from dirt or marks."}, {"word": "Strict", "definition": "Demanding that rules are obeyed exactly."}, {"word": "Popular", "definition": "Liked by many people."}, {"word": "Safe", "definition": "Not in danger; protected from harm."}]}, "Intermediate": {"text": "Tukaram Mundhe, a dedicated food safety officer in India, has achieved unexpected social media stardom due to his rigorous inspections of restaurants. His proactive and uncompromising approach to ensuring public health standards has resonated widely with citizens across the country, turning routine checks into viral content.\n\nMundhe's critical role involves visiting various food establishments, from small eateries to larger restaurants and hotels, to assess their hygiene practices and food preparation methods. He meticulously checks for common hygiene lapses such as unsanitary kitchen conditions, improper food storage, the use of expired ingredients, and a general disregard for cleanliness. Unlike some officials, Mundhe is known for his strict enforcement. When he identifies violations, he takes immediate and decisive action, which can include issuing substantial fines, temporarily shutting down premises, or even revoking business licenses.\n\nVideos capturing these \"aggressive inspections\" have rapidly gone viral on social media platforms. These clips often show Mundhe directly confronting restaurant owners or staff about their hygiene failings, sometimes in a stern and direct manner. The public's reaction has been overwhelmingly positive, with many praising his commitment to accountability and transparency in public service. His popularity largely stems from a widespread desire among the populace for better enforcement of food safety regulations, which are crucial for preventing foodborne illnesses and protecting consumers.\n\nMundhe's newfound fame highlights a growing public awareness of food safety issues in India and the appreciation for officials who are willing to tackle these challenges head-on. His actions serve as a powerful reminder to food businesses about the importance of maintaining high hygiene standards, not just for regulatory compliance but for the health, safety, and trust of their customers. This phenomenon underscores how digital platforms can amplify the impact of dedicated public servants.", "vocab": [{"word": "Stardom", "definition": "The state of being famous, especially in entertainment."}, {"word": "Rigorous", "definition": "Extremely thorough and careful."}, {"word": "Hygiene", "definition": "Conditions or practices conducive to maintaining health and preventing disease, especially through cleanliness."}, {"word": "Lapses", "definition": "Temporary failures or slips; mistakes."}, {"word": "Enforcement", "definition": "The act of compelling observance of or compliance with a law, rule, or obligation."}, {"word": "Viral", "definition": "Spreading rapidly and widely from one internet user to another."}, {"word": "Accountability", "definition": "The fact or condition of being accountable; responsibility."}]}, "Advanced": {"text": "Tukaram Mundhe, a prominent food safety officer in India, has garnered unprecedented social media attention, transforming routine regulatory inspections into viral content. His uncompromising approach to upholding public health standards has resonated deeply with a populace often frustrated by lax enforcement and systemic inefficiencies within the bureaucracy.\n\nMundhe's mandate involves comprehensive scrutiny of diverse food establishments, ranging from bustling street vendors to upscale restaurants and catering services, to ascertain their adherence to stringent hygiene protocols and food safety regulations. He meticulously probes for a spectrum of common hygiene lapses, including but not limited to, unsanitary kitchen environments, inadequate refrigeration, cross-contamination risks, the presence of expired or adulterated ingredients, and a general dereliction of cleanliness. What distinguishes Mundhe is his unwavering resolve: upon identifying violations, he initiates immediate and often drastic measures. These can encompass imposing substantial financial penalties, ordering temporary or permanent closures of premises, and even revoking operational licenses, often on the spot and in full public view.\n\nThe catalyst for his widespread recognition has been the rapid proliferation of videos documenting these \"aggressive inspections\" across various digital platforms. These clips frequently depict Mundhe directly confronting proprietors or staff, employing a stern and unequivocal demeanor to highlight their non-compliance and demand immediate rectification. The public's response has been overwhelmingly laudatory, with many commending his commitment to transparency and accountability within the civil service, a sector sometimes perceived as opaque. His burgeoning popularity is emblematic of a broader societal yearning for robust enforcement of public health statutes, which are paramount in mitigating the pervasive threat of foodborne illnesses in a densely populated nation with diverse culinary practices.\n\nMundhe's ascent to social media prominence underscores several critical dynamics. Firstly, it highlights the significant challenges inherent in maintaining consistent food safety standards across India's vast and diverse culinary landscape, where informal sectors often operate with minimal oversight. Secondly, it demonstrates the potent capacity of digital platforms to amplify the actions of individual public servants, effectively creating a public mandate for their efforts and putting pressure on the wider regulatory framework. His actions serve as a powerful deterrent to non-compliant businesses, compelling them to re-evaluate their operational practices beyond mere superficial compliance, fostering a genuine shift towards better standards. Furthermore, this phenomenon reflects a growing civic consciousness regarding consumer rights and the expectation of uncompromised public services. Mundhe's work, therefore, transcends mere regulatory compliance; it fosters a culture of vigilance, sets a benchmark for public officials striving for systemic improvement, and ultimately contributes to enhanced public welfare and trust in governance.", "vocab": [{"word": "Garners", "definition": "Gathers or acquires (something desired, such as attention or approval)."}, {"word": "Unprecedented", "definition": "Never done or known before; without previous instance."}, {"word": "Regulatory", "definition": "Relating to the supervision and control of a system or industry by rules and laws."}, {"word": "Scrutiny", "definition": "Critical observation or examination."}, {"word": "Adherence", "definition": "Obedience to a rule, law, or custom; faithful attachment."}, {"word": "Dereliction", "definition": "The state of having been abandoned or neglected; a willful neglect of duty."}, {"word": "Proliferation", "definition": "Rapid increase in numbers or extent."}, {"word": "Laudatory", "definition": "Expressing praise and commendation."}]}}, "questions": [{"q": "What is Tukaram Mundhe's job?", "a": "Tukaram Mundhe is a food safety officer in India."}, {"q": "Why has Tukaram Mundhe become popular on social media?", "a": "He has become popular because videos of his strict inspections of restaurants to find hygiene problems have gone viral online."}], "id": "ab6085d5c4f", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c1wx3v11de7o?at_medium=RSS&at_campaign=rss", "published": "2026-09-08T08:40:39+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "The Nuggets felt strongly that Watson could’ve suited … - sports.yahoo.com", "excerpt": "The Nuggets felt strongly that Watson could’ve suited … sports.yahoo.com", "levels": {"Beginner": {"text": "The Nuggets felt strongly that Watson could’ve suited … sports.yahoo.com", "vocab": []}, "Intermediate": {"text": "The Nuggets felt strongly that Watson could’ve suited … sports.yahoo.com", "vocab": []}, "Advanced": {"text": "The Nuggets felt strongly that Watson could’ve suited … sports.yahoo.com", "vocab": []}}, "questions": [], "id": "ac23ec872a8", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxOUmxRVldSclZmZlZFc0pVYVRXbVdKMmUxMmdyZ3FVenYwd2FITXdUMjRzNmdmLWpiZ1VpQ3RiZjVMTWozMzhtVHVwZ1ByVWJjWUVONGEzUmJuenNqUWZqc0pWVnJsX2NzcVd5MTdXOVVYOVF1VWNlYjFjN3dUa045ZkNWM1FTQ0tWUTBz?oc=5", "published": "2026-09-08T08:36:56+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Intel: More positive recruit reactions from Michigan Football vs WMU - sports.yahoo.com", "excerpt": "Intel: More positive recruit reactions from Michigan Football vs WMU sports.yahoo.com", "levels": {"Beginner": {"text": "Intel: More positive recruit reactions from Michigan Football vs WMU sports.yahoo.com", "vocab": []}, "Intermediate": {"text": "Intel: More positive recruit reactions from Michigan Football vs WMU sport  and media consolidation. Speaking to Variety at the event, he […]", "vocab": []}, "Advanced": {"text": "French President Emmanuel Macron said the Lumière Summit in Saint-Paul-de-Vence, which he co-chaired with South Korean President Lee Jae Myung on Monday, was deliberately held at a moment of dramatic upheaval for the entertainment business, from the growing dominance of YouTube and TikTok to AI and media consolidation. Speaking to Variety at the event, he […]", "vocab": []}}, "questions": [], "id": "ad2b1346580", "source": "Variety", "link": "https://variety.com/2026/film/global/french-president-emmanuel-macron-youtube-finance-content-1236854274/", "published": "2026-09-08T08:07:56+09:00", "category": "entertainment", "category_title": "Entertainment"}, {"headline": "Macron Calls on YouTube to Finance Content, Warns of Threat to Culture - Variety", "excerpt": "Macron Calls on YouTube to Finance Content, Warns of Threat to Culture Variety", "levels": {"Beginner": {"text": "Macron Calls on YouTube to Finance Content, Warns of Threat to Culture Variety", "vocab": []}, "Intermediate": {"text": "Macron Calls on YouTube to Finance Content, Warns of Threat to Culture Variety", "vocab": []}, "Advanced": {"text": "Macron Calls on YouTube to Finance Content, Warns of Threat to Culture Variety", "vocab": []}}, "questions": [], "id": "ab00cb36743", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxQY01saHZReFhadDN2TXhkNGUyQm8yOHUxd3ZPWnc2dk5CYnBHNF93bVRiQTV2SjNTNVQ1LWNWT2VrM3RUWGQ2dTgydlpweVpPc0VsU3QzWkNDVjNKUy1QMjVWeVo4cmwwRERlbXBnam91OHZna2ZtMm1IQlM3T0pUSU1FajdRYXpXZ2Y3OHl5b1Y2YW5JdUpGYTdnRkZiclg2WEdtV0ZaQ2Q?oc=5", "published": "2026-09-08T08:07:00+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
