gle News", "link": "https://news.google.com/rss/articles/CBMipwFBVV95cUxQaWUxOWV5RnB2R1BETnk2M09uTmltd0dXbE9nb0lJUFpBOWZQV1YySWxFNjFiRFpqeHQ1aC1lNmx0elQ2cDBKdkxiZF9rTmVfLWVCYWRHa0JuUzQ3ZHV4dVEwSkJ3bEh0Z01YcWRUcm9DV1ZvMU16NlpzSHhIUkU5ZFhEdzdQUXhnMVA5U25LUG5OTy1FNUs0bzZhTjJUeHdpdm0zTXZJYw?oc=5", "published": "2026-10-31T10:07:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Kucherov Requests Trade, Won't Re-Sign with Lightning", "excerpt": "Star forward Nikita Kucherov has told the Tampa Bay Lightning he will not re-sign and wants a trade.", "levels": {"Beginner": {"text": "Nikita Kucherov is a very good hockey player. He plays for the Tampa Bay Lightning team. Many people know him as a star player. He helps his team score many goals and win games.\n\nNow, Kucherov has told the Lightning team something important. He does not want to sign a new contract with them. A contract is like an agreement to keep playing for the team. So, he will not stay with the Lightning after his current contract ends.\n\nInstead, Kucherov wants to leave the team. He has asked the Lightning to trade him. When a player is traded, he moves to a different team. The Lightning would send him to another team, and in return, they might get other players or future draft picks.\n\nThis news is a big deal for the Lightning. Kucherov is one of their best players. He helped them win big games, including championships. The team will now need to decide what to do. They might look for a new team for him. Fans are surprised by this news. It means a big change for the team.", "vocab": [{"word": "Star", "definition": "A very famous and successful person, especially in sports or entertainment."}, {"word": "Contract", "definition": "A written agreement between two or more people or groups."}, {"word": "Trade", "definition": "To exchange something for something else; in sports, to send a player to another team."}, {"word": "Current", "definition": "Happening or existing now; present."}, {"word": "Goals", "definition": "Points scored in sports like hockey or soccer."}, {"word": "Surprised", "definition": "Feeling or showing wonder, astonishment, or sudden shock."}]}, "Intermediate": {"text": "Star forward Nikita Kucherov has delivered significant news to the Tampa Bay Lightning organization. He has informed the team that he will not sign a new contract to remain with them beyond his current deal. Instead, the highly skilled winger has formally requested a trade, signaling his desire to play for a different franchise.\n\nKucherov is widely regarded as one of the National Hockey League's elite players. He has been a cornerstone of the Lightning's success for many years, consistently leading the team in scoring and playing a crucial role in their deep playoff runs, including their Stanley Cup victories. His offensive prowess and playmaking abilities make him an invaluable asset on the ice.\n\nThe decision not to re-sign and to request a trade is a major development for both Kucherov and the Lightning. For the team, losing a player of his caliber would create a significant void. They would need to explore options to replace his production or acquire valuable assets in return for his departure. Trading a star player often involves receiving other players, promising prospects, or high draft picks.\n\nWhile the specific reasons behind Kucherov's request have not been publicly detailed, such moves often stem from various factors. These can include disagreements during contract negotiations, a desire for a new challenge, or a team's long-term strategic direction. The Lightning front office will now face the complex task of navigating this situation, aiming to make the best decision for the team's future while respecting Kucherov's wishes. This news will undoubtedly send ripples through the NHL as teams consider the possibility of acquiring such a talent.", "vocab": [{"word": "Organization", "definition": "A group of people who work together for a specific purpose, like a sports team."}, {"word": "Formally", "definition": "In a proper or official way."}, {"word": "Franchise", "definition": "A professional sports team, or the business that owns it."}, {"word": "Cornerstone", "definition": "An essential, important, or basic part of something."}, {"word": "Prowess", "definition": "Great skill or ability."}, {"word": "Caliber", "definition": "The quality of someone or something, especially a high level of quality."}, {"word": "Navigating", "definition": "To plan and direct the course of a situation or process."}]}, "Advanced": {"text": "Nikita Kucherov, the electrifying forward and perennial Hart Trophy candidate, has sent shockwaves through the National Hockey League by formally informing the Tampa Bay Lightning that he will not pursue a contract extension and has instead requested a trade. This pivotal development signals a potential seismic shift for one of the league's most consistently competitive franchises and its long-standing superstar.\n\nKucherov's tenure with the Lightning has been nothing short of legendary. Since his debut, he has consistently ranked among the NHL's offensive elite, showcasing unparalleled vision, puck-handling artistry, and a lethal shot. He was instrumental in the Lightning's back-to-back Stanley Cup championships, earning a Conn Smythe Trophy as playoff MVP during one of those runs. His departure would leave an immense void, not only in terms of raw offensive production but also in leadership and strategic on-ice presence.\n\nThe decision to forgo re-signing and actively seek a trade typically arises from a confluence of factors. While the specifics of Kucherov's motivations remain undisclosed, potential catalysts could include stalled contract negotiations, a desire for a fresh challenge in a different market, or perhaps differing visions for the team's future trajectory. Given the NHL's salary cap constraints, even highly successful teams often face difficult decisions regarding their star players, especially as contracts expire and younger talent emerges. Kucherov's current contract status, which would likely make him an unrestricted free agent in the near future without an extension, adds urgency to the situation for both player and club.\n\nFor the Lightning's general manager, Julien BriseBois, this presents a formidable challenge. Trading a player of Kucherov's immense value requires meticulous negotiation to maximize the return. The team would undoubtedly seek a package comprising high-end prospects, promising young players, and significant draft capital to mitigate the impact of losing such a generational talent. The market for a player of Kucherov's caliber would be robust, with numerous contenders eager to bolster their rosters for a championship push.\n\nThis situation underscores the complex interplay between player agency, team management, and the financial realities of professional sports. The outcome will not only redefine the Lightning's immediate future but also set a precedent for how star players navigate their careers in an increasingly dynamic league landscape. The hockey world will be watching closely as this high-stakes scenario unfolds.", "vocab": [{"word": "Electrifying", "definition": "Very exciting and thrilling; having a sudden and dramatic effect."}, {"word": "Perennial", "definition": "Lasting for a very long time, or happening again and again; enduring."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Seismic", "definition": "Of enormous proportions or effect; having a very great and usually destructive impact."}, {"word": "Tenure", "definition": "The period during which someone holds an important position or office."}, {"word": "Instrumental", "definition": "Serving as a crucial means, agent, or tool; very important in causing something to happen."}, {"word": "Confluence", "definition": "A coming together of two or more things; a meeting or gathering, especially of circumstances or events."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}]}}, "questions": [{"q": "What is Nikita Kucherov's main decision regarding his future with the Tampa Bay Lightning?", "a": "He has decided not to sign a new contract with the team and has requested a trade."}, {"q": "Why is Kucherov's request considered significant for the Lightning?", "a": "He is a star player and a cornerstone of the team's success, so his departure would create a major void and require the team to make big changes."}], "id": "a57d0ad3c26", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijwFBVV95cUxOLVBpcEdYVGlBclNpWi1sb3R6cy1vX0lRUzNlVjN0UTRxWnM5UWk5LTZka2lFN2dudTI0Y1RkRW5ZU3JOaXh6U0d6WW1PU0xBNE1hajVjZ3JPR0pEb1o2dlVKeFBDd1BGWWRWMzRONm5qZk51VkVpR1A1TmQyYVQtMnlTWVVvMGF3TlV2MGhFQQ?oc=5", "published": "2026-10-31T09:54:27+09:00", "category": "business", "category_title": "Business"}, {"headline": "Taiwan Central Bank Members Supported Rate Hike", "excerpt": "Two members of Taiwan's central bank board recently argued for an increase in interest rates to help control rising prices.", "levels": {"Beginner": {"text": "Taiwan has a central bank. This bank is very important for the country's money and economy. Its job is to keep prices stable and help the economy grow. Recently, two people who work on the bank's main board thought it was a good idea to raise interest rates.\nWhat are interest rates? They are like the extra cost you pay when you borrow money, for example, to buy a house or a car. If interest rates go up, borrowing money becomes more expensive for everyone.\nWhy did these two members want to raise rates? They wanted to stop prices from going up too fast. When prices for food, gas, and other things get much higher, it is called inflation. Inflation means your money buys less than it used to.\nIf borrowing money is more expensive, people might buy fewer new things. Businesses might also slow down their spending. This can help to cool down the economy and make prices stop rising so quickly. The goal is to keep prices stable so that people's money keeps its value. This discussion shows that important decisions about the economy often involve different ideas from experts. They work to find the best way to help Taiwan's economy stay healthy.", "vocab": [{"word": "central bank", "definition": "A very important bank that helps manage a country's money."}, {"word": "interest rates", "definition": "The extra money you pay when you borrow money."}, {"word": "inflation", "definition": "When prices for things like food and gas go up a lot."}, {"word": "stable", "definition": "Staying mostly the same, not changing much."}, {"word": "economy", "definition": "How a country makes and uses money and goods."}, {"word": "healthy", "definition": "In good condition; working well."}]}, "Intermediate": {"text": "Taiwan's central bank plays a crucial role in managing the nation's economy, primarily through its monetary policy. Its key objectives include maintaining price stability and fostering sustainable economic growth. Recently, an internal discussion within the bank's board revealed differing perspectives on the appropriate course of action, with two members advocating for an increase in interest rates.\nAn interest rate hike is a significant tool used by central banks. When rates rise, the cost of borrowing money for consumers and businesses increases. This affects everything from mortgages and car loans to business investments, making them more expensive. The rationale behind such a move is typically to combat inflation, which is a sustained increase in the general price level of goods and services, eroding purchasing power and making everyday life more costly for households.\nThe two board members likely argued that higher borrowing costs would dampen consumer demand and business spending. This reduction in overall economic activity can help to slow down the pace of price increases. Taiwan, like many other economies globally, has faced inflationary pressures, driven by factors such as disruptions in global supply chains and rising energy costs.\nWhile raising rates can help control inflation, it also carries the risk of slowing economic growth too much, potentially leading to job losses or reduced investment. Central banks must carefully balance these competing objectives. The fact that only two members explicitly backed a rate hike suggests that the board as a whole may have opted for a more cautious approach, or that other members felt the current economic conditions did not warrant such a strong measure at that time. This internal debate highlights the complexities involved in setting monetary policy and the careful consideration given to various economic indicators before making a decision that impacts the entire nation.", "vocab": [{"word": "crucial", "definition": "Extremely important."}, {"word": "monetary policy", "definition": "The actions a central bank takes to control the money supply and credit conditions."}, {"word": "advocating", "definition": "Publicly supporting a particular idea or policy."}, {"word": "rationale", "definition": "The reasons or principles on which a particular decision or action is based."}, {"word": "eroding", "definition": "Gradually destroying or reducing something."}, {"word": "dampen", "definition": "To make something less strong or active."}, {"word": "objectives", "definition": "Goals or aims."}]}, "Advanced": {"text": "Taiwan's central bank, a pivotal institution in the nation's economic architecture, consistently navigates the intricate balance of maintaining price stability and fostering robust economic growth through its calibrated monetary policy. Recent deliberations within its esteemed board have brought to light a divergence of opinion, with two members explicitly advocating for a pre-emptive interest rate hike. This internal discourse underscores the perennial challenges faced by monetary authorities in responding to evolving economic landscapes.\nAn interest rate adjustment is a primary lever in a central bank's toolkit. A hike typically involves raising the benchmark interest rate, which in turn influences borrowing costs across the economy – from consumer credit and mortgages to corporate loans and government bonds. The fundamental economic rationale for such a move is to temper inflationary pressures. Inflation, characterized by a persistent and broad-based increase in the general price level, erodes purchasing power, distorts investment decisions, and can destabilize an economy if left unchecked.\nThe proponents of the rate hike likely posited that elevated borrowing costs would effectively cool aggregate demand. By making credit more expensive, households might defer discretionary spending, and businesses could postpone capital expenditures, thereby reducing overall economic activity. This deceleration in demand-side pressures is intended to alleviate upward pressure on prices. Taiwan, an export-oriented economy deeply integrated into global supply chains, has not been immune to the global inflationary wave, exacerbated by geopolitical tensions, commodity price volatility, and lingering supply-side bottlenecks.\nHowever, the decision to raise rates is fraught with trade-offs. While it can be an effective antidote to inflation, an overly aggressive tightening of monetary policy risks stifling economic expansion, potentially leading to a recession or an increase in unemployment. Central banks, therefore, must meticulously weigh the benefits of inflation containment against the potential costs to economic output and employment. The fact that only a minority of the board members supported an immediate rate hike indicates a broader consensus, or at least a prevailing sentiment, for a more measured or wait-and-see approach. This could stem from concerns about the fragility of global growth, the potential impact on Taiwan's export competitiveness, or a belief that current inflationary trends might be transitory.\nThe internal debate within the central bank's decision-making body is a testament to the complex and often contentious nature of monetary policy formulation. It reflects the careful scrutiny of a multitude of economic indicators, including GDP growth, employment figures, consumer price indices, and global economic forecasts. Such deliberations are crucial for ensuring that policy interventions are appropriate, timely, and aligned with the long-term economic welfare of the nation.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "calibrated", "definition": "Carefully adjusted or set to achieve a specific outcome."}, {"word": "deliberations", "definition": "Long and careful consideration or discussion."}, {"word": "divergence", "definition": "The process or state of separating or moving in different directions."}, {"word": "temper", "definition": "To improve the consistency or resiliency of something, often by making it less extreme; to moderate."}, {"word": "aggregate demand", "definition": "The total demand for all goods and services produced in an economy."}, {"word": "exacerbated", "definition": "Made a problem, bad situation, or negative feeling worse."}, {"word": "transitory", "definition": "Not permanent or lasting; temporary."}]}}, "questions": [{"q": "What was the main suggestion made by two members of Taiwan's central bank board?", "a": "They suggested raising interest rates."}, {"q": "Why might a central bank choose to raise interest rates?", "a": "A central bank might raise interest rates to combat inflation (rising prices) by making borrowing more expensive, which can slow down spending and cool the economy."}], "id": "a3d92bcab1f", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxPdWhFNV9XMlF3ejNOelA4R1lMWDZ0cFpLNG84a0Z2V04tc08tTllhRnV1b25idGpGcXJuWEhDZDFPOGtNNThyTFdQaklCdGJJTC1WSG1tNy1FWGZpX2o4UmhTdFRjVjhOUUZNZnFGT3BtUUZfbGttVTV1TUlpRjRTb2lkS2t1SzFGVFd6THJwaVhNei1xR0JBbHBzSm1qU05WZWFFMFIya3lPVmU1amR4R21aMA?oc=5", "published": "2026-10-31T09:12:39+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US Midterms: Australian Markets Brace for Potential Shifts", "excerpt": "The upcoming US midterm elections could bring significant changes to Australian markets, affecting sectors like renewable energy and technology stocks.", "levels": {"Beginner": {"text": "The United States (US) is getting ready for important elections. These are called midterm elections. They happen in the middle of a president's time in office. On November 3rd, Americans will vote for new members of Congress. Congress is the group that makes laws for the country. It has two main parts: the House of Representatives and the Senate.\n\nRight now, the Republican party has more members in both parts. The Democratic party wants to win more seats. If they win enough seats, they can change which party controls Congress. This is a big deal because the party in control decides what laws get made.\n\nRecent reports suggest that the Democratic party might win more seats in the House of Representatives. However, the race for the Senate is very close, and it's hard to say who will win.\n\nThese elections in the US can affect other countries, like Australia. For example, if Democrats win, there might be more interest in clean energy around the world. This could be good for Australian companies that work with renewable energy. The elections could also make some technology company stocks, like those related to Artificial Intelligence (AI), go up or down. Overall, markets might become less stable for a while.\n\nSo, what happens in the US midterms is important for Australian businesses and how money moves in their markets.", "vocab": [{"word": "elections", "definition": "a time when people vote to choose their leaders."}, {"word": "Congress", "definition": "the group of people who make laws in the US."}, {"word": "party", "definition": "a group of people with similar ideas who work together in politics."}, {"word": "seats", "definition": "positions or places in a government group, like Congress."}, {"word": "renewable energy", "definition": "power that comes from natural sources like sun or wind, which never run out."}, {"word": "stocks", "definition": "small parts of a company that people can buy and sell."}]}, "Intermediate": {"text": "The United States is preparing for its significant midterm elections, which occur halfway through a president's four-year term. These elections, scheduled for November 3rd, will determine the control of the US Congress, which is made up of the House of Representatives and the Senate. All 435 seats in the House and about one-third of the 100 Senate seats are contested.\n\nCurrently, the Republican party holds narrow majorities in both chambers. However, recent polling data suggests a potential shift. Democrats are favored to reclaim control of the House of Representatives, needing to flip four seats. The contest for the Senate, where Democrats also need to gain four seats to secure a majority, is considered too close to call, indicating a highly competitive race.\n\nThe outcome of these elections carries direct consequences for global markets, including Australia. A change in control of Congress could lead to different policy priorities in the US, which in turn influences international economic trends.\n\nSpecifically, Australian markets could see several impacts. For instance, if Democrats gain more power, there might be increased US government support for initiatives related to climate change and renewable energy. This could boost global demand for clean energy technologies and resources, potentially benefiting Australian companies in this sector. Conversely, the elections could introduce volatility for Artificial Intelligence (AI) stocks, depending on new regulatory discussions or shifts in investor sentiment.\n\nOverall, the uncertainty surrounding the election results, and the potential for a divided government (where different parties control the presidency and Congress), could spark broader market volatility. Investors and businesses in Australia are closely watching the US midterms, understanding that the political landscape in Washington has tangible effects on their financial outlook.", "vocab": [{"word": "midterm elections", "definition": "elections held in the middle of a president's term."}, {"word": "Congress", "definition": "the legislative body of the US government, comprising the House and Senate."}, {"word": "majorities", "definition": "when one political party has more than half of the seats in a legislative body."}, {"word": "polling data", "definition": "information gathered from surveys of public opinion before an election."}, {"word": "reclaim", "definition": "to get back something that was lost or taken away."}, {"word": "volatility", "definition": "the quality of being subject to rapid and unpredictable change, especially in prices or value."}, {"word": "tangible", "definition": "clear and definite; real."}]}, "Advanced": {"text": "The upcoming US midterm elections, slated for November 3rd, represent a pivotal moment for American domestic policy and global economic landscapes, with particular implications for Australian markets. These elections, occurring halfway through a president's four-year term, serve as a critical barometer of public sentiment and often act as a referendum on the incumbent administration's performance. All 435 seats in the House of Representatives and approximately one-third of the 100 Senate seats are up for contention, determining the legislative control of the bicameral US Congress.\n\nCurrently, the Republican party maintains slender majorities in both the House and Senate, a position former President Donald Trump has actively campaigned to preserve. However, recent sophisticated polling analyses suggest a significant potential shift in power. Democrats are widely favored to reclaim the House, requiring them to flip a net of four seats. The battle for the Senate, where Democrats also need to secure four additional seats to achieve a working majority, remains exceptionally tight and is largely considered a toss-up, underscoring the high stakes and unpredictable nature of the contest.\n\nThe ramifications of these electoral outcomes extend far beyond US borders, directly influencing international trade, investment flows, and sector-specific demand, notably impacting Australian financial markets. A change in congressional control could usher in distinct policy agendas, particularly concerning economic regulation, environmental initiatives, and technological development.\n\nFor Australian markets, several key areas are under scrutiny. A Democratic-controlled Congress might prioritize climate action and renewable energy, potentially leading to increased federal incentives and investment in the US. This policy shift could amplify global demand for clean energy technologies and resources, offering a significant uplift for Australia's burgeoning renewable energy sector and related exports. Conversely, the tech sector, particularly Artificial Intelligence (AI) stocks, could experience heightened volatility. Potential Democratic legislative efforts around data privacy, antitrust, or algorithmic accountability might introduce regulatory headwinds or reshape investor sentiment, leading to price fluctuations.\n\nFurthermore, the broader macroeconomic environment could be affected. The prospect of a divided government – where the presidency and Congress are controlled by different parties – often introduces legislative gridlock and policy uncertainty, which typically translates into increased market volatility. Investors in Australia are therefore keenly observing the election results, understanding that the political dynamics in Washington have profound and multifaceted effects on their portfolio performance and the national economic outlook. The interplay of US domestic politics and global economic interconnectedness highlights the critical importance of these midterms for distant economies like Australia.", "vocab": [{"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "barometer", "definition": "something that reflects or indicates changes in something else."}, {"word": "incumbent", "definition": "currently holding an office or position."}, {"word": "bicameral", "definition": "(of a legislative body) having two branches or chambers."}, {"word": "slender majorities", "definition": "very small or narrow advantages in terms of numbers of seats."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}, {"word": "scrutiny", "definition": "critical observation or examination."}, {"word": "volatility", "definition": "the liability to change rapidly and unpredictably, especially for the worse; instability."}]}}, "questions": [{"q": "Which two parts make up the US Congress?", "a": "The US Congress is made up of the House of Representatives and the Senate."}, {"q": "According to polling, which part of Congress are Democrats most likely to win control of?", "a": "Polling suggests Democrats are most likely to reclaim control of the House of Representatives."}], "id": "a33125cf78d", "source": "Economics | The Guardian", "link": "https://www.theguardian.com/australia-news/2026/oct/31/how-will-the-us-midterms-affect-australian-markets", "published": "2026-10-31T08:00:26+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Police Deployed Amid Polish Court Control Dispute", "excerpt": "Police have been deployed in Poland during a serious disagreement over who controls the country's highest court, following government actions against senior judges.", "levels": {"Beginner": {"text": "Police officers have been sent to Poland's top court. This happened because there is a big fight over who should be in charge of the court. The government in Poland has taken strong actions. They stopped two important judges from working. The government also wants to charge these judges with crimes. This situation is called a 'stand-off' because both sides disagree strongly.\n\nThe top court, often called the Supreme Court, is very important. It makes sure that laws are fair and that the government follows the rules. If the government controls the court, it can change laws more easily without anyone checking them. Many people, including leaders in the European Union, are worried about this. They believe that courts should be independent, meaning they should be free from government control. This disagreement shows a serious problem in Poland about how the country is run.", "vocab": [{"word": "deployed", "definition": "sent out to a place for a special purpose, like police or soldiers."}, {"word": "stand-off", "definition": "a situation where two sides cannot agree and stop moving forward."}, {"word": "justices", "definition": "important judges in a high court."}, {"word": "suspended", "definition": "stopped someone from doing their job for a period of time."}, {"word": "charges", "definition": "official statements accusing someone of a crime."}, {"word": "independent", "definition": "not controlled by others; free to make its own decisions."}]}, "Intermediate": {"text": "Police have been deployed to Poland's Supreme Court amid a growing stand-off over control of the nation's highest judicial body. This escalation follows the government's decision to suspend two senior justices and initiate criminal charges against them. The move has intensified a long-running dispute between Poland's ruling Law and Justice (PiS) party and the judiciary, raising significant concerns about the rule of law and judicial independence.\n\nThe Supreme Court plays a crucial role in a democratic system, acting as a check on government power and ensuring that laws are applied fairly and constitutionally. Critics argue that the government's actions are an attempt to undermine the court's autonomy and bring it under political control. The PiS government has, for several years, pursued a series of controversial judicial reforms, claiming they are necessary to improve efficiency and combat corruption. However, opponents and international bodies, including the European Union, view these reforms as an erosion of democratic standards.\n\nThe European Union has repeatedly expressed alarm over the situation, initiating legal procedures against Poland and even imposing financial penalties in past disputes related to judicial independence. The deployment of police to the court building highlights the seriousness of the confrontation, signaling a direct challenge to the separation of powers within the country. The outcome of this stand-off will have significant implications for Poland's democratic future and its relationship with the wider European community.", "vocab": [{"word": "escalation", "definition": "a rapid increase; a situation becoming more intense or serious."}, {"word": "judiciary", "definition": "the system of courts of law and the judges who work in them."}, {"word": "independence", "definition": "freedom from outside control or influence; the ability to act on one's own."}, {"word": "reforms", "definition": "changes made to improve something, often a system or law."}, {"word": "rule of law", "definition": "the principle that all people and institutions are subject to and accountable to law that is fairly applied and enforced."}, {"word": "dispute", "definition": "a disagreement, argument, or debate."}, {"word": "implications", "definition": "the possible results or effects of an action or decision."}]}, "Advanced": {"text": "Police have been deployed to Poland's Supreme Court, marking an unprecedented escalation in the protracted stand-off between the government and the nation's judiciary. The move follows the ruling Law and Justice (PiS) party's decision to suspend two senior justices and initiate criminal proceedings against them, a direct challenge to the court's autonomy and the fundamental principle of the separation of powers.\n\nThis confrontation is the latest chapter in a broader judicial overhaul pursued by the PiS government since it came to power in 2015. The party argues that its reforms are necessary to purge the judiciary of remnants from the communist era and improve efficiency. However, critics, both domestically and internationally, contend that these actions are designed to consolidate political control over the courts, thereby undermining democratic checks and balances. Past reforms have included lowering the retirement age for judges, establishing new disciplinary chambers, and attempting to exert influence over judicial appointments, all of which have been met with fierce resistance from judges and legal bodies.\n\nFor the European Union, the situation in Poland represents a profound challenge to its core values. The EU has repeatedly launched infringement procedures against Warsaw, citing violations of rule of law principles. The European Court of Justice has issued rulings against Poland's judicial reforms, and the bloc has even withheld funds and imposed daily fines in an effort to compel compliance. The current deployment of police to a judicial institution underscores the gravity of the situation, transforming a legal and political dispute into a potentially physical confrontation over institutional control.\n\nThe Supreme Court serves as the ultimate arbiter of legal disputes and the guardian of the constitution. Its independence is considered paramount for upholding citizens' rights and ensuring government accountability. The government's latest actions are seen by many as an arbitrary exercise of power, further eroding democratic norms and potentially pushing Poland towards democratic backsliding. The outcome of this high-stakes stand-off will not only shape Poland's future constitutional landscape but also critically influence its standing and relationship within the European Union.", "vocab": [{"word": "unprecedented", "definition": "never done or known before; without previous instance."}, {"word": "judiciary", "definition": "the judicial branch of government, comprising the courts and judges, responsible for interpreting and applying the law."}, {"word": "autonomy", "definition": "the right or condition of self-government; freedom from external control or influence."}, {"word": "overhaul", "definition": "a thorough examination and repair of machinery or a system, or a complete change or restructuring."}, {"word": "infringement", "definition": "the action of breaking the terms of a law, agreement, or right; a violation."}, {"word": "constitutional", "definition": "relating to an established set of principles governing a state, or in accordance with such a constitution."}, {"word": "arbitrary", "definition": "based on random choice or personal whim, rather than any reason or system; despotic or tyrannical."}, {"word": "democratic backsliding", "definition": "the gradual decline in the quality of democracy in a country, often characterized by the weakening of democratic institutions and norms."}]}}, "questions": [{"q": "What specific actions did the Polish government take against two senior justices that led to the stand-off?", "a": "The Polish government suspended two senior justices from their duties and moved to bring criminal charges against them."}, {"q": "Why is the control of the top court considered so important for a country's democracy and its relationship with the European Union?", "a": "Control of the top court is crucial because it acts as an independent check on government power, ensuring laws are fair and constitutional. Its independence is vital for upholding the rule of law and democratic principles, which are core values for the European Union, making disputes over it a significant factor in a country's democratic health and its relations with the EU."}], "id": "af012ae2cb3", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/crz9824d5e88o?at_medium=RSS&at_campaign=rss", "published": "2026-10-31T10:11:43+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "US Approves Major Patriot Missile Sale to Ukraine", "excerpt": "The United States has approved selling 500 advanced Patriot interceptor missiles to Ukraine, providing a crucial defense against Russia's dangerous ballistic missile attacks.", "levels": {"Beginner": {"text": "The United States is helping Ukraine. It has approved a big sale of 500 Patriot missiles. These special missiles are very important for Ukraine. They can stop dangerous rockets that Russia fires. Russia uses fast rockets called ballistic missiles. These rockets are hard to stop. But Patriot missiles are the only effective weapon that can shoot them down. This means they can protect Ukrainian cities and people from attacks. Patriot missiles work by finding and hitting enemy rockets in the sky. This keeps buildings and homes safe from damage. The US has sent Patriot systems to Ukraine before. This new sale of 500 interceptors will give Ukraine many more missiles to use. It shows that the US continues to support Ukraine in its fight. The war in Ukraine has been going on for some time. Protecting its skies is very important for Ukraine's safety and for saving lives.", "vocab": [{"word": "Approved", "definition": "Said yes to something officially."}, {"word": "Missiles", "definition": "Rockets that fly and hit targets."}, {"word": "Effective", "definition": "Works well; gets the job done."}, {"word": "Protect", "definition": "To keep someone or something safe."}, {"word": "Defend", "definition": "To fight to keep something safe."}, {"word": "Support", "definition": "To help someone."}]}, "Intermediate": {"text": "The United States has officially approved a significant sale of 500 Patriot interceptor missiles to Ukraine. This decision provides a critical boost to Ukraine's air defense capabilities as it continues to face ongoing aggression from Russia. Patriot missiles are advanced American-made systems specifically designed to intercept and destroy incoming threats, including aircraft, cruise missiles, and, crucially, ballistic missiles. Russia has frequently used ballistic missiles in its attacks on Ukraine, targeting cities and vital infrastructure across the country. These high-speed, high-altitude weapons are notoriously difficult to intercept due to their trajectory and speed, posing a significant challenge to air defense systems. However, the Patriot system is currently considered the only effective weapon in Ukraine's arsenal capable of reliably downing these dangerous projectiles. The sale of 500 interceptors means Ukraine will have a substantial supply of these vital defensive weapons. While the US has previously provided complete Patriot missile defense systems to Ukraine, this new approval focuses on replenishing and expanding Ukraine's stock of the interceptor missiles themselves. This ensures that the existing Patriot launchers can continue to operate effectively and maintain a strong defensive posture. The ongoing conflict has highlighted the critical importance of robust air defense for Ukraine, not only to protect its military assets but also to safeguard civilian populations and essential services from devastating aerial attacks. The ability to counter ballistic missile threats is paramount for maintaining stability and minimizing casualties. This latest approval underscores the United States' continued commitment to supporting Ukraine's sovereignty and its ability to defend itself against unprovoked aggression. The delivery of these interceptors will significantly enhance Ukraine's capacity to protect its skies and its people.", "vocab": [{"word": "Approved", "definition": "Officially agreed to or sanctioned."}, {"word": "Interceptor", "definition": "A missile designed to shoot down other missiles or aircraft."}, {"word": "Capabilities", "definition": "The power or ability to do something."}, {"word": "Aggression", "definition": "Forceful action or attack."}, {"word": "Ballistic missiles", "definition": "Rockets that follow a high-arching path to a target."}, {"word": "Infrastructure", "definition": "Basic facilities and systems serving a country (e.g., roads, power plants)."}, {"word": "Sovereignty", "definition": "The authority of a state to govern itself."}]}, "Advanced": {"text": "The United States has formally sanctioned the sale of 500 Patriot interceptor missiles to Ukraine, a move poised to significantly bolster Kyiv's beleaguered air defense architecture against persistent Russian aerial assaults. This substantial procurement underscores the critical role of advanced missile defense in the ongoing conflict, particularly in countering Russia's formidable ballistic missile capabilities. Patriot systems, manufactured by Raytheon, are sophisticated surface-to-air missile platforms renowned for their multi-target engagement capacity, capable of intercepting a spectrum of aerial threats including aircraft, cruise missiles, and, most critically, high-velocity ballistic missiles. Russia has extensively deployed ballistic missiles, such as the Iskander-M, to target Ukrainian urban centers and vital infrastructure, including energy facilities and transportation hubs. These projectiles are notoriously challenging to intercept due to their steep trajectory, hypersonic re-entry speeds, and complex evasive maneuvers, often designed to overwhelm existing defense systems. Crucially, the Patriot system remains the sole proven effective countermeasure within Ukraine's current arsenal against these specific threats, offering a vital layer of protection that other systems struggle to provide. The approval for 500 interceptors represents a significant replenishment and expansion of Ukraine's defensive munitions. While the US and its allies have previously supplied complete Patriot missile defense batteries to Ukraine, the continuous expenditure of interceptors in active combat necessitates a steady supply chain to maintain operational readiness and prevent critical shortages. This latest tranche ensures that existing Patriot launchers can sustain their protective umbrella over key strategic locations and population centers, thereby mitigating the devastating impact of long-range strikes. The strategic imperative for robust air defense cannot be overstated in this conflict. Beyond safeguarding military assets, effective air defense is paramount for protecting civilian lives, preserving economic stability, and maintaining national morale amidst relentless bombardment. The ability to neutralize ballistic missile threats directly impacts Ukraine's resilience and its capacity to continue resisting aggression, preventing strategic paralysis. This approval reaffirms the United States' unwavering commitment to Ukraine's territorial integrity and its inherent right to self-defense. The provision of these advanced interceptors will not only enhance Ukraine's immediate defensive posture but also signal a long-term dedication to equipping Kyiv with the necessary tools to secure its airspace against future incursions, thereby influencing the broader geopolitical dynamics of the region and reinforcing the resolve of Western allies.", "vocab": [{"word": "Sanctioned", "definition": "Officially approved or authorized, often by a governing body."}, {"word": "Bolster", "definition": "To support or strengthen something, often to improve it."}, {"word": "Architecture", "definition": "The complex structure or design of something, referring to its organized system."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Interceptor", "definition": "A missile designed to detect and destroy an incoming enemy missile or aircraft."}, {"word": "Trajectory", "definition": "The path followed by a projectile flying or an object moving under the action of given forces."}, {"word": "Imperative", "definition": "Of vital importance; crucial or essential."}, {"word": "Resilience", "definition": "The capacity to recover quickly from difficulties; toughness and adaptability."}]}}, "questions": [{"q": "What type of weapon did the US approve selling to Ukraine?", "a": "The US approved selling Patriot interceptor missiles to Ukraine."}, {"q": "Why are these specific missiles important for Ukraine's defense?", "a": "Patriot missiles are important because they are currently the only effective weapon Ukraine has for downing Russia's ballistic missiles."}], "id": "a252e660d81", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c3vgxznlx7jzo?at_medium=RSS&at_campaign=rss", "published": "2026-10-31T09:40:43+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Ozarks High School Football Playoffs Underway", "excerpt": "High school football teams in the Ozarks region are competing in the district quarterfinals, with live updates available from Ozarks Sports Zone.", "levels": {"Beginner": {"text": "Football season is very exciting in the Ozarks. Many high school teams play important games. Right now, teams are playing in the 'District Quarterfinals.' These are special games where teams try to win to keep playing. If they win, they go to the next round. If they lose, their season ends.\n\nThe Ozarks Sports Zone helps people follow these games. They give 'live updates.' This means they share scores and news about the games as they happen. Fans, families, and friends can check the Ozarks Sports Zone to see how their favorite teams are doing.\n\nThese football games are important for the towns. People gather to watch and cheer for their local schools. It's a big event for the community. Everyone hopes their team can win and move closer to the big championship game. It's a fun time for sports fans in the Ozarks.", "vocab": [{"word": "Football", "definition": "A sport played with an oval ball, popular in the US."}, {"word": "Playoffs", "definition": "Important games at the end of a season to find the best team."}, {"word": "Teams", "definition": "Groups of players who play a sport together."}, {"word": "Games", "definition": "Competitions where people play a sport."}, {"word": "News", "definition": "New information about events."}, {"word": "Important", "definition": "Having a lot of meaning or value."}]}, "Intermediate": {"text": "The excitement of high school football is reaching a peak in the Ozarks region as teams enter the crucial District Quarterfinal stage of the playoffs. This phase marks a significant step in the journey toward a potential state championship title. Local schools, having battled through the regular season, are now competing in a high-stakes, single-elimination tournament where every game determines whether their season continues or comes to an end. For these young athletes, it's a chance to showcase their talent and represent their communities with pride.\n\nOzarks Sports Zone is serving as a primary source for fans to stay informed about all the action. The platform is providing comprehensive live updates, including real-time scores, key plays, and game summaries from various matchups across the district. This immediate coverage allows parents, students, alumni, and community members to follow their favorite teams closely, even if they can't be at every game. The ability to get instant information adds to the overall excitement and engagement during this important playoff period.\n\nHigh school football holds a special place in the Ozarks, fostering strong community pride and tradition. These playoff games bring towns together, with stadiums filling up with fervent supporters cheering on their young athletes. The atmosphere is often electric, reflecting the deep connection people feel to their local schools and their athletic programs. For many, Friday night lights are a cherished part of the local culture. As teams vie for advancement, the dream of a state title remains a powerful motivator, making these quarterfinal contests particularly intense and memorable for everyone involved. Each victory brings a team one step closer to achieving that ultimate goal, fueling the hopes of their entire town.", "vocab": [{"word": "Quarterfinal", "definition": "A stage in a tournament where eight teams or players compete."}, {"word": "Updates", "definition": "New information or changes."}, {"word": "Community", "definition": "A group of people living in the same place or having a particular characteristic in common."}, {"word": "Tradition", "definition": "A belief, custom, or way of doing something that has existed for a long time."}, {"word": "Competitive", "definition": "Wanting to win or be more successful than others."}, {"word": "Advance", "definition": "To move forward or make progress."}, {"word": "Fervent", "definition": "Having or displaying a passionate intensity."}]}, "Advanced": {"text": "The annual fervor surrounding high school football in the Ozarks region has reached a pivotal juncture as teams engage in the District Quarterfinal matchups. This stage represents a critical hurdle in the arduous journey toward a coveted state championship title, demanding peak performance and strategic acumen from every participating squad. Following a grueling regular season, these local athletic programs are now immersed in a high-stakes, single-elimination playoff bracket, where the outcome of each contest directly dictates the continuation or cessation of their championship aspirations. For the student-athletes, these games are not merely competitions but a culmination of years of dedication, teamwork, and sacrifice, offering a profound opportunity to etch their names into local lore and potentially secure collegiate opportunities.\n\nOzarks Sports Zone has positioned itself as the definitive digital hub for comprehensive, real-time coverage of these crucial playoff encounters. Its platform is delivering dynamic live updates, encompassing minute-by-minute score changes, pivotal play-by-play analyses, and insightful game summaries from various district matchups. This immediate dissemination of information is indispensable for a diverse audience, including parents, current students, dedicated alumni, and the broader community, enabling them to remain intimately connected to their respective teams regardless of their physical presence at the venues. Such comprehensive journalistic efforts amplify the engagement and collective experience during this intense playoff period, ensuring that no significant moment goes unrecorded for the region's passionate fan base.\n\nThe cultural significance of high school football in the American Midwest, particularly within the Ozarks, cannot be overstated. It serves as an integral thread in the fabric of community identity, fostering deep-seated pride and perpetuating cherished local traditions. These playoff games transform Friday nights into communal celebrations, with packed stadiums resonating with the fervent cheers of supporters united in their backing of young athletes. The palpable energy and collective anticipation underscore the profound emotional investment residents have in their local schools' athletic endeavors. Beyond the gridiron, these events often serve as economic drivers and social gathering points, strengthening local bonds. As teams navigate the competitive landscape, the allure of a state title acts as a potent catalyst, imbuing these quarterfinal showdowns with an exceptional degree of intensity and memorability. Each hard-fought victory propels a team closer to realizing that ultimate aspiration, galvanizing the hopes and dreams of an entire town and adding another chapter to the rich narrative of Ozarks sports, a narrative built on grit, determination, and community spirit.", "vocab": [{"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Arduous", "definition": "Involving or requiring strenuous effort; difficult and tiring."}, {"word": "Acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "Culmination", "definition": "The highest or climactic point of something, especially as attained after a long time."}, {"word": "Dissemination", "definition": "The act of spreading something, especially information, widely."}, {"word": "Indispensable", "definition": "Absolutely necessary."}, {"word": "Integral", "definition": "Necessary to make a whole complete; essential or fundamental."}, {"word": "Galvanizing", "definition": "Shocking or exciting (someone) into taking action."}]}}, "questions": [{"q": "What stage of the football playoffs are teams in the Ozarks currently playing?", "a": "Teams in the Ozarks are currently playing in the District Quarterfinal stage of the playoffs."}, {"q": "Which organization is providing live updates for these football games?", "a": "Ozarks Sports Zone is providing live updates for these football games."}], "id": "accdf8c041c", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxNWkN5V0hEZVE2QU95VloyYjlGWV9aRVI5cnNKSHA2T1hXemtSckZmTTYwZ1R6cHd1dGhSQi1pNkpQOW1QX0RackptOXVyQk1zRjVmd3hxeENRaWxNeU1jTEZGUFF0RzJyaTdmLU5JOVRZOXhoc3A5T1BQWW5sN09oaEYtYXlYb1VsNUZMTHY5VWF2UjJi?oc=5", "published": "2026-10-31T10:07:30+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Murray dominates with 16 kills in win over Michigan - The Daily Nebraskan", "excerpt": "Murray dominates with 16 kills in win over Michigan The Daily Nebraskan", "levels": {"Beginner": {"text": "Murray dominates with 16 kills in win over Michigan The Daily Nebraskan", "vocab": []}, "Intermediate": {"text": "Murray dominates with 16 kills in win over Michigan The Daily Nebraskan", "vocab": []}, "Advanced": {"text": "Murray dominates with 16 kills in win over Michigan The Daily Nebraskan", "vocab": []}}, "questions": [], "id": "a41a3c6d334", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi1gFBVV95cUxNb1NiRExrTkVxZVUyNGlWZkhObWtmWWkwaFpxSmR0ZmlkdVdhNjFKWmZjMjM1bVN2TDRJcjBHX2dTWUllR1hld3hFZmtsRWdsSzEzVzlZLW9qSGNMWThmMnpnZXl5WjNyb1oycUluOE1LQTVTNk1xWXBDblNYVWk2ZHV0X3RPVDl5LXNnWUhiU0RPbTVQYm1mR3A4X0NvNTRQOHJHclhRNlpESUpSN3pGUzV4R3FNLW5uMUNkZU1BVmJQaTI2djlJR0pDN2hhY2ZMZ3BKMDJn?oc=5", "published": "2026-10-31T09:58:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "CoreWeave Executive Sells Over $400,000 in Company Stock", "excerpt": "A key financial officer at CoreWeave, Jeff Baker, recently sold company stock worth more than $400,000, a common practice in the corporate world.", "levels": {"Beginner": {"text": "Jeff Baker, an important manager at a company called CoreWeave, recently sold some of his company stock. He is the Principal Accounting Officer at CoreWeave. This means he helps manage the company's money and financial records. The stock he sold was worth $407,946.\n\nCoreWeave is a technology company. It helps other businesses use powerful computers for complex tasks, like artificial intelligence. Many companies today need strong computer systems, and CoreWeave provides these services.\n\nWhen someone owns stock, they own a small part of a company. People who work for a company, especially managers, often get stock as part of their pay. Selling stock is a normal thing for people to do. They might sell it for personal reasons, like buying a house or saving money.\n\nThis sale was reported because it's important for the public to know when company leaders buy or sell shares. This helps keep things fair and open in the stock market. Mr. Baker's sale is a routine financial action for a company executive.", "vocab": [{"word": "manager", "definition": "A person who is in charge of a part of a company or organization."}, {"word": "stock", "definition": "Small parts of a company that people can buy and sell. Owning stock means you own a piece of the company."}, {"word": "sold", "definition": "Past tense of sell; to give something to someone in exchange for money."}, {"word": "technology", "definition": "The use of scientific knowledge for practical purposes, especially in industry."}, {"word": "services", "definition": "Work that someone does for other people, often for money."}, {"word": "reported", "definition": "To tell people about something, usually in a newspaper or on TV."}]}, "Intermediate": {"text": "Jeff Baker, CoreWeave's Principal Accounting Officer, recently executed a significant stock sale, divesting shares valued at $407,946. This transaction, while substantial in value, represents a common financial activity for executives in publicly tracked or high-profile private companies.\n\nCoreWeave is a prominent technology firm specializing in high-performance cloud computing, particularly for artificial intelligence (AI) workloads. It provides essential infrastructure, including powerful graphics processing units (GPUs), that businesses need to develop and run complex AI models and other data-intensive applications. As the Principal Accounting Officer, Mr. Baker plays a crucial role in overseeing the company's financial reporting, ensuring accuracy and compliance with accounting standards.\n\nExecutives often receive company stock or stock options as part of their compensation package. These holdings can become a significant portion of their personal wealth. Selling shares allows executives to diversify their investments, manage personal finances, or convert their equity into cash for various needs, such as purchasing property or planning for retirement.\n\nSuch sales are typically disclosed to ensure transparency in financial markets. For companies like CoreWeave, even if privately held but with significant investment, these disclosures help stakeholders understand executive compensation and financial movements. This particular sale by Mr. Baker is generally viewed as a routine personal financial decision rather than an indication of the company's performance or future outlook. It reflects a standard practice among corporate leaders to manage their personal portfolios.", "vocab": [{"word": "executed", "definition": "Carried out or performed a plan or action."}, {"word": "divesting", "definition": "Selling off assets, especially company shares."}, {"word": "prominent", "definition": "Important and well-known."}, {"word": "infrastructure", "definition": "The basic physical and organizational structures and facilities needed for the operation of a society or enterprise."}, {"word": "overseeing", "definition": "Supervising someone or something and making sure that everything is done correctly."}, {"word": "diversify", "definition": "To spread investments across different types of assets to reduce risk."}, {"word": "disclosed", "definition": "Made known; revealed."}]}, "Advanced": {"text": "Jeff Baker, who serves as the Principal Accounting Officer for CoreWeave, a rapidly expanding cloud computing provider, recently executed a stock sale totaling $407,946. This transaction, while noteworthy due to the executive's position and the sum involved, is a standard occurrence within the financial landscape for corporate insiders.\n\nCoreWeave has emerged as a critical player in the high-performance computing sector, specializing in GPU-accelerated cloud infrastructure tailored for demanding workloads such as artificial intelligence (AI) development, machine learning, and visual effects rendering. The company provides scalable and robust computing resources that are essential for enterprises pushing the boundaries of AI innovation. As Principal Accounting Officer, Mr. Baker holds a pivotal role in ensuring the integrity and accuracy of CoreWeave's financial statements and compliance with intricate accounting regulations, which is especially vital for a company experiencing rapid growth and substantial investment.\n\nExecutive stock sales are a common facet of compensation and personal financial management. Senior leaders often accumulate a significant portion of their wealth in company stock, acquired through grants, options, or performance-based awards. Selling these shares allows for portfolio diversification, liquidity for major personal expenditures (like real estate or educational funding), or strategic tax planning. These sales are typically pre-scheduled or occur within specific trading windows to comply with insider trading regulations and company policies.\n\nTransparency is a cornerstone of financial markets. For publicly traded companies, such transactions are mandatorily disclosed to regulatory bodies like the U.S. Securities and Exchange Commission (SEC) through forms like Form 4. While CoreWeave is currently a private entity, its high valuation and significant investor interest mean that executive financial activities are often tracked and reported by financial news outlets, providing a degree of market transparency. It is generally understood that such individual sales, unless part of a broader pattern or accompanied by other significant corporate news, are usually driven by personal financial planning rather than signaling a change in the company's fundamental health or future prospects. This particular sale by Mr. Baker aligns with routine executive financial management practices.", "vocab": [{"word": "executing", "definition": "Carrying out or performing a plan, action, or order."}, {"word": "noteworthy", "definition": "Deserving attention or notice; important or interesting."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "integrity", "definition": "The quality of being honest and having strong moral principles; also, the state of being whole and undivided."}, {"word": "accumulate", "definition": "To gather or acquire an increasing number or quantity of something over time."}, {"word": "liquidity", "definition": "The availability of liquid assets to a market or company; liquid assets are cash or assets that can be quickly converted to cash."}, {"word": "mandatorily", "definition": "In a way that is required by law or rule; obligatorily."}, {"word": "fundamental", "definition": "Forming a necessary base or core; of central importance."}]}}, "questions": [{"q": "Who is Jeff Baker and what company does he work for?", "a": "Jeff Baker is the Principal Accounting Officer at CoreWeave."}, {"q": "How much stock did Jeff Baker sell?", "a": "Jeff Baker sold $407,946 worth of stock."}], "id": "a327b57af6b", "source": "\"stock market OR finance OR markets OR investing when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi0wFBVV95cUxNUDJjZGdxVC1OQ2FKTWhHelBlMjVrYTlMTEgxZ0xJVWRKWEpjR0pob1VmbEloMzZNMmJzUTI3WTNoc3lNbFd1ZmtrOHBUVWcwQlhkRWFYR3JaUnVXRElCX1dYdm53Tmx2MVQ1NG54LTdsSjNaZDQtVnl0U2dpazJpWE5fTlgxaXdTQUNYam1USzNHR21EblQ4SHpKNU50SURYUjRQQldicXhPSy12dnZFaUtDSnFyODlzZ1l2d2ExR2Q2eXZCWXNxdjRITE1FOFZuUHlB?oc=5", "published": "2026-10-31T10:08:50+09:00", "category": "finance", "category_title": "Finance"}, {"headline": "Why Merck Stock Flew Higher on Friday - The Motley Fool", "excerpt": "Why Merck Stock Flew Higher on Friday The Motley Fool", "levels": {"Beginner": {"text": "Why Merck Stock Flew Higher on Friday The Motley Fool", "vocab": []}, "Intermediate": {"text": "Why Merck Stock Flew Higher on Friday The Motley Fool", "vocab": []}, "Advanced": {"text": "Why Merck Stock Flew Higher on Friday The Motley Fool", "vocab": []}}, "quest ": []}, "Advanced": {"text": "SBIFF McHurley Film Center Now Showing a New Marquee News Channel 3-12", "vocab": []}}, "questions": [], "id": "a967421b764", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxNbW01N0NsSWNXLW94aG1xV3ZVdll6RHpGeV9QSm5zYnR5UEZKcHlmUWdEcDNVRVFHTEpYZGx1V2FQa0V3Q2Z4SnBiZ2EyV2lDMWhjU1VodkxvOVB3dkRsSUc2Q3d5SzJHR1FxQk12c1docXJOdUFIZjhJVEdwTUc0NENDbHQ0cUtTN1pTWVBCa0VzRTNjTGx0ZVVfT3VKbUlEbmtYandEbWo?oc=5", "published": "2026-10-31T09:46:52+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
