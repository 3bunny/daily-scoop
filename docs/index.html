areful and close examination"}]}, "Advanced": {"text": "Eric Trump, a prominent figure in his father's political orbit, has recently offered a robust defense of former President Donald Trump's foreign policy decisions concerning Iran and his economic campaign rhetoric. These statements arrive as the elder Trump continues his presidential campaign, often prompting a re-evaluation of his past administration's record.\n\nCentral to Eric Trump's defense was the Trump administration's approach to Iran. He staunchly supported his father's unilateral withdrawal in 2018 from the Joint Comprehensive Plan of Action (JCPOA), the multinational nuclear accord designed to curb Iran's nuclear ambitions in exchange for sanctions relief. Eric Trump reiterated the long-standing critique that the JCPOA was fundamentally flawed, citing its sunset clauses, which allowed restrictions on Iran's nuclear program to expire over time, and its failure to address Iran's ballistic missile development or its support for regional proxies. He argued that the \"maximum pressure\" campaign, characterized by stringent economic sanctions, was a necessary and more effective strategy to compel Iran to negotiate a more comprehensive agreement and to counter its destabilizing influence across the Middle East. This stance, he maintained, prioritized American national security and global stability over what he described as a weak and ineffectual deal.\n\nFurthermore, Eric Trump addressed a memorable economic promise made by his father during a campaign rally, which suggested that American families could potentially receive financial benefits of up to $5,000. He contextualized this pledge, explaining it as a direct outcome of the Trump administration's broader economic philosophy. This philosophy centered on significant tax cuts, particularly the Tax Cuts and Jobs Act of 2017, deregulation across various sectors, and the renegotiation of international trade agreements, all aimed at fostering domestic economic growth. Eric Trump contended that these policies were designed to unleash American business potential, create jobs, and ultimately translate into tangible financial gains for households. He highlighted the robust economic indicators prior to the COVID-19 pandemic, such as low unemployment rates and a surging stock market, as evidence that the administration was on track to deliver such prosperity, implying the $5,000 figure was a realistic aspiration stemming from a thriving economy.\n\nThese public defenses by a key surrogate like Eric Trump serve to shape the narrative around the former president's legacy, particularly as his past actions are frequently scrutinized and re-litigated in the current political discourse.", "vocab": [{"word": "prominent figure", "definition": "an important or well-known person"}, {"word": "robust defense", "definition": "a strong and forceful argument in support of something"}, {"word": "unilateral withdrawal", "definition": "the act of one country pulling out of an agreement or situation without the agreement of others"}, {"word": "Joint Comprehensive Plan of Action (JCPOA)", "definition": "the formal name for the international agreement on Iran's nuclear program"}, {"word": "ballistic missiles", "definition": "self-propelled weapons that follow a high, arching path to a target"}, {"word": "regional proxies", "definition": "groups or states that act on behalf of a larger power in a specific region"}, {"word": "economic rhetoric", "definition": "the language and arguments used by politicians about economic policies"}, {"word": "scrutinized", "definition": "examined very carefully and critically"}]}}, "questions": [{"q": "What two main topics did Eric Trump defend his father's actions on?", "a": "Eric Trump defended his father's record on Iran and an economic promise."}, {"q": "What was the general idea behind the economic promise Eric Trump defended?", "a": "The general idea was that his father's policies would lead to a stronger economy and financial benefits for people."}], "id": "a232d73fbf6", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipwFBVV95cUxNZ0IyY3FRRnd2OENfQjZUbC1fQUpoeTJkR2Y5UnBLbE02ZGNEMmVCZC1TT1VkXzRSa0prRmFnUEVDMVgxdjlKRmMwWkdiaUFIWGwwcHRVRXF2Sy0taDc2dHkwalA4dWlLQ3VVdDVmSFBJaW0zOVdxT1pCVkctQ201MkdFS1hfdXlkLVFqcGw1WEM0RHQ0bERldHJkdHEtV2IyM3oxMS1BQQ?oc=5", "published": "2026-09-12T07:21:25+09:00", "category": "politics"}, {"headline": "Houthis Claim Major Gains, Red Sea Shipping Under Threat", "excerpt": "The Iran-backed Houthi group has reportedly made significant advances in Yemen and seized a strategic island, increasing concerns for Red Sea shipping.", "levels": {"Beginner": {"text": "The Houthi group in Yemen says it has made big gains in the country. This group is supported by Iran. They also say they have taken control of Perim Island. This island is very important because of where it is located.\n\nPerim Island sits in a key part of the Red Sea. This area is a major path for ships carrying goods around the world. Many ships use this route to go between Europe, Asia, and Africa. When the Houthis control this island, it means they have a stronger hold on this important shipping lane.\n\nThis news makes people worried about global shipping. If the Houthis can control this area, it could make it harder or more dangerous for ships to pass. This might affect how goods are moved and could make things more expensive for people everywhere. The conflict in Yemen has been going on for a long time, and this new claim shows the Houthis are still a strong force.", "vocab": [{"word": "claim", "definition": "to say that you have done something or that something is true"}, {"word": "gains", "definition": "improvements or advantages"}, {"word": "seized", "definition": "took control of something quickly and by force"}, {"word": "strategic", "definition": "important for achieving a plan or goal"}, {"word": "shipping", "definition": "the activity of sending goods by ship"}, {"word": "route", "definition": "a path or way between two places"}]}, "Intermediate": {"text": "The Iran-backed Houthi movement in Yemen has announced significant territorial advances within the country. Alongside these claims, reports indicate that the group has also seized Perim Island, a small but strategically vital piece of land located in the Bab al-Mandeb strait, a crucial maritime chokepoint in the Red Sea.\n\nThis development is part of the ongoing civil war in Yemen, where the Houthis have been fighting against the internationally recognized government, which is supported by a Saudi-led military coalition. The Houthis' assertion of control over Perim Island has major implications for global shipping and international trade. The Bab al-Mandeb strait is one of the world's busiest shipping lanes, connecting the Mediterranean Sea (via the Suez Canal) to the Indian Ocean. Millions of barrels of oil and vast amounts of cargo pass through this narrow waterway daily.\n\nIf the Houthis consolidate their grip on Perim Island, it would give them a stronger position to potentially disrupt or threaten commercial vessels navigating the Red Sea. This raises concerns for international security and the global economy, as any significant disruption to this vital maritime route could lead to increased shipping costs, delays, and instability in energy markets. The situation underscores the complex and far-reaching consequences of the protracted conflict in Yemen.", "vocab": [{"word": "movement", "definition": "a group of people working together to achieve a shared goal"}, {"word": "territorial", "definition": "relating to land or an area"}, {"word": "internationally recognized", "definition": "accepted and acknowledged by many countries around the world"}, {"word": "crucial", "definition": "extremely important or necessary"}, {"word": "maritime", "definition": "connected with the sea or ships"}, {"word": "chokepoint", "definition": "a narrow passage or area where traffic can be easily stopped or controlled"}, {"word": "implications", "definition": "the possible effects or results of something"}]}, "Advanced": {"text": "The Iran-backed Houthi insurgency in Yemen has declared substantial territorial gains, signaling a potential shift in the protracted conflict. Concurrently, reports indicate that the group has seized Perim Island, a strategically pivotal landmass situated within the Bab al-Mandeb strait, a critical maritime chokepoint connecting the Red Sea to the Gulf of Aden and the Indian Ocean.\n\nThis development occurs amidst a complex geopolitical landscape, where the Houthis have been engaged in a civil war against Yemen's internationally recognized government, supported by a Saudi-led coalition. The alleged capture of Perim Island, if confirmed, would significantly bolster the Houthis' capacity to exert influence over one of the world's most vital shipping lanes. The Bab al-Mandeb strait facilitates the passage of an estimated 10% of global trade and a substantial portion of the world's oil supply, making it indispensable for international commerce and energy security.\n\nControl over such a strategic location raises serious ramifications for global shipping, potentially increasing the risk of disruptions, piracy, or targeted attacks on commercial vessels. This could lead to heightened insurance premiums, longer transit times as ships seek alternative, more costly routes, and ultimately, a ripple effect on global supply chains and commodity prices. The Houthis have previously demonstrated a willingness to target shipping in the Red Sea, underscoring the gravity of their potential enhanced control over this maritime artery.\n\nFurthermore, this advance could complicate efforts to achieve a lasting peace in Yemen, exacerbating the already dire humanitarian crisis. The international community views the Houthis' actions with growing concern, as their expanded reach threatens regional stability and the free flow of international trade. The situation highlights the intricate interplay of local conflict dynamics with broader global economic and security interests.", "vocab": [{"word": "insurgency", "definition": "an active revolt or rebellion against an established government or authority"}, {"word": "protracted", "definition": "lasting for a long time or longer than expected or usual; prolonged"}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors"}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else"}, {"word": "bolster", "definition": "to support or strengthen; to give a boost to"}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event, especially one that is not immediately obvious"}, {"word": "exacerbating", "definition": "making a problem, bad situation, or negative feeling worse"}, {"word": "underscore", "definition": "to emphasize the importance of something"}]}}, "questions": [{"q": "What strategic island have the Houthis reportedly seized?", "a": "The Houthis have reportedly seized Perim Island."}, {"q": "Why is the location of Perim Island important for global trade?", "a": "Perim Island is important because it is located in the Bab al-Mandeb strait, a crucial maritime chokepoint in the Red Sea, which is a major shipping lane for global trade and oil supply."}], "id": "a4735558be3", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c23x72yx2rvo?at_medium=RSS&at_campaign=rss", "published": "2026-09-12T07:17:45+09:00", "category": "politics"}, {"headline": "Reform UK Receives Record £36 Million Donation from Crypto Billionaire", "excerpt": "Reform UK has received an unprecedented £36 million donation from British cryptocurrency billionaire Ben Delo, setting a new UK political funding record.", "levels": {"Beginner": {"text": "A political party in the UK, called Reform UK, has received a very large gift of money. The gift is £36 million. This is the biggest political donation ever given in the UK. The money came from a man named Ben Delo. He is a very rich British man who made his money from cryptocurrency. Cryptocurrency is a type of digital money.\n\nMr. Delo had a problem in the past. He was found guilty in the United States. He did not follow rules that stop bad money from being used. These rules are called anti-money laundering controls. But later, a former US President, Donald Trump, forgave him for this. This is called a pardon.\n\nBen Delo used to live in Hong Kong, but he has now moved back to the UK. His donation to Reform UK is much bigger than another large gift the party received. Before this, a man named Christopher Harborne gave Reform UK £15 million. This new gift from Mr. Delo is more than twice as big. It shows how much money some people are giving to political parties in the UK.", "vocab": [{"word": "Donation", "definition": "a gift of money or something else to a charity or organization."}, {"word": "Party", "definition": "a group of people with similar ideas who work together to win elections and run the government."}, {"word": "Cryptocurrency", "definition": "a type of digital money that uses special computer rules to keep it safe."}, {"word": "Convicted", "definition": "found guilty of a crime by a court of law."}, {"word": "Pardon", "definition": "when a leader officially forgives someone for a crime, removing their punishment."}, {"word": "Rules", "definition": "instructions that tell you what you can or cannot do."}]}, "Intermediate": {"text": "Reform UK, a prominent political party in Britain, has received an unprecedented financial contribution, setting a new record for political donations in the United Kingdom. The party announced a massive gift of £36 million from Ben Delo, a British entrepreneur who amassed his fortune in the cryptocurrency sector. This substantial sum significantly surpasses previous donations, making Delo the largest individual political donor in UK history.\n\nBen Delo's background includes a notable legal issue in the United States. He was convicted for failing to implement adequate anti-money laundering (AML) controls at a cryptocurrency exchange he co-founded. AML regulations are crucial measures designed to prevent illegal funds from being disguised as legitimate income. However, Delo later received a presidential pardon from former US President Donald Trump, effectively forgiving him for the conviction.\n\nAfter living abroad in Hong Kong for some time, Mr. Delo has since returned to the UK. His decision to donate such a large amount to Reform UK highlights the significant role of wealthy individuals in funding political campaigns. This £36 million donation dwarfs the party's previous largest contribution of £15 million, which came from Thailand-based businessman Christopher Harborne.\n\nPolitical donations are a vital part of democratic systems, enabling parties to fund their operations, campaigns, and outreach efforts. However, such large sums often draw scrutiny regarding transparency and potential influence. Reform UK, known for its populist stance and focus on issues like Brexit and immigration, will now have considerable financial resources as it prepares for upcoming elections, potentially reshaping the landscape of British politics.", "vocab": [{"word": "Unprecedented", "definition": "never done or known before; unparalleled."}, {"word": "Contribution", "definition": "a gift or payment to a common fund or for a common purpose."}, {"word": "Entrepreneur", "definition": "a person who starts a business, taking on financial risks in the hope of profit."}, {"word": "Amassed", "definition": "gathered together a large amount of something, especially money or information, over a period of time."}, {"word": "Regulations", "definition": "official rules or laws that control how something is done."}, {"word": "Pardon", "definition": "an official act of forgiving a person for a crime and removing any remaining punishment."}, {"word": "Scrutiny", "definition": "careful and thorough examination or observation."}]}, "Advanced": {"text": "Reform UK, a burgeoning political force in the British landscape, has become the recipient of an extraordinary £36 million donation, establishing a new benchmark for political contributions in the United Kingdom. This colossal sum, provided by British cryptocurrency magnate Ben Delo, positions him as the preeminent individual political benefactor in UK history, significantly overshadowing all prior financial endorsements.\n\nDelo's financial ascendancy stems from his pioneering role in the cryptocurrency industry. However, his past is marked by a notable legal entanglement in the United States. He was previously convicted for failing to implement robust anti-money laundering (AML) protocols at BitMEX, a prominent cryptocurrency derivatives exchange he co-founded. AML frameworks are critical regulatory mechanisms designed to detect and prevent the illicit flow of funds, often associated with criminal activities such as drug trafficking or terrorism financing. Despite this conviction, Delo was subsequently granted a presidential pardon by former US President Donald Trump, a controversial act that expunged his record in the US.\n\nHaving resided in Hong Kong for an extended period, Mr. Delo has since repatriated to the UK. His monumental donation to Reform UK underscores the increasing influence of high-net-worth individuals in shaping political discourse and electoral outcomes. This contribution far eclipses the party's previous record donation of £15 million, which originated from Christopher Harborne, a businessman based in Thailand.\n\nThe influx of such substantial capital into a political party invariably sparks intense scrutiny regarding transparency, potential undue influence, and the ethical implications of large-scale political funding. Critics often raise concerns about how such donations might sway policy decisions or provide disproportionate access to political leaders. Reform UK, which has gained traction with its populist platform advocating for stricter immigration controls and a more decisive break from European Union regulations, now possesses unprecedented financial leverage as it gears up for forthcoming general elections. This financial windfall could significantly bolster its campaign infrastructure, outreach initiatives, and media presence, potentially altering the competitive dynamics of British politics.\n\nThe case also reignites discussions about the regulatory environment surrounding cryptocurrency and the background of its pioneers. Delo's conviction, even if pardoned, highlights the historical challenges in enforcing traditional financial compliance standards within the nascent and often less regulated crypto sphere. As political parties increasingly rely on private funding, the provenance and conditions of these donations will remain a focal point for public debate and regulatory oversight, especially when donors have complex legal histories or derive their wealth from sectors with evolving regulatory landscapes.", "vocab": [{"word": "Burgeoning", "definition": "beginning to grow or increase rapidly; flourishing."}, {"word": "Recipient", "definition": "a person or thing that receives something."}, {"word": "Magnate", "definition": "a wealthy and influential businessman or businesswoman."}, {"word": "Preeminent", "definition": "surpassing all others; very distinguished in some way."}, {"word": "Ascendancy", "definition": "occupation of a position of dominant power or influence."}, {"word": "Protocols", "definition": "the official procedure or system of rules governing affairs of state or diplomatic occasions."}, {"word": "Repatriated", "definition": "returned to one's own country."}, {"word": "Underscores", "definition": "emphasizes the importance of something."}, {"word": "Invariably", "definition": "in every case or on every occasion; always."}, {"word": "Provenance", "definition": "the place of origin or earliest known history of something."}]}}, "questions": [{"q": "What is the name of the political party that received the record donation, and how much money was it?", "a": "The political party is Reform UK, and they received a record £36 million donation."}, {"q": "Who is Ben Delo, and what was his past legal issue in the United States?", "a": "Ben Delo is a British cryptocurrency billionaire. He was convicted in the US for failing to implement adequate anti-money laundering controls at a company he co-founded, but he later received a presidential pardon."}], "id": "a17641bb67f", "source": "Politics | The Guardian", "link": "https://www.theguardian.com/politics/2026/sep/11/reform-uk-given-record-36m-donation-by-british-crypto-billionaire", "published": "2026-09-12T07:00:18+09:00", "category": "politics"}, {"headline": "French Train Derails in Normandy, Injuring Dozens", "excerpt": "A passenger train traveling in Normandy, France, has derailed, leaving at least 44 people injured and prompting an investigation.", "levels": {"Beginner": {"text": "A train accident happened in France. A passenger train went off its tracks in a place called Normandy. This happened on a route between two cities, Rouen and Caen.\n\nThere were 180 people on the train when it derailed. At least 44 people got hurt. Some people might have minor injuries, and others might be more seriously hurt.\n\nEmergency workers quickly came to help everyone. They helped the injured passengers. The transport minister of France said how many people were on the train.\n\nWhen a train derails, it means it leaves the railway tracks. This can be dangerous. The authorities will now look into why the train went off the tracks. They want to find out what caused this accident. It is important to make sure trains are safe for everyone who travels.\n\nThis news was reported by BBC News. People hope that all the injured passengers will recover soon. Train travel is a common way for many people to move around in France. Safety is very important for all train journeys.", "vocab": [{"word": "train", "definition": "a vehicle that runs on railway tracks."}, {"word": "derailed", "definition": "when a train leaves its tracks."}, {"word": "injured", "definition": "hurt or harmed."}, {"word": "passengers", "definition": "people traveling on a train, bus, or plane."}, {"word": "route", "definition": "a path or direction from one place to another."}, {"word": "minister", "definition": "an important government official."}]}, "Intermediate": {"text": "A passenger train in France has derailed, causing injuries to dozens of people. The incident occurred in the Normandy region, on the route connecting the cities of Rouen and Caen. According to reports, at least 44 individuals sustained injuries when the train went off its tracks.\n\nThere were 180 passengers on board the train at the time of the accident. France's transport minister confirmed this number, highlighting the scale of the incident. Emergency services were quickly dispatched to the scene to assist the injured and manage the situation. Rescue workers helped passengers get off the train and provided immediate medical attention. While many injuries are believed to be minor, some passengers may have sustained more serious harm, requiring hospital treatment. The immediate impact saw a significant emergency response, with medical teams and firefighters working together.\n\nA train derails when its wheels come off the railway tracks, which can be a very dangerous event. This can happen for various reasons, such as issues with the tracks themselves, problems with the train's mechanical parts, or other operational factors. The exact cause of this particular incident is not yet known. Authorities have launched a full investigation to determine what led to the derailment. This inquiry will likely examine various factors, including the condition of the tracks, the train's mechanical state, and operational procedures, to ensure a comprehensive understanding of the accident.\n\nRail safety is a high priority in France, where trains are a popular and essential mode of transport for both commuters and travelers across the country. This accident will undoubtedly lead to a thorough review of safety protocols on this specific line and potentially across the national rail network. The focus now remains on the recovery of the injured passengers and understanding how to prevent similar incidents in the future, ensuring public confidence in train travel.", "vocab": [{"word": "incident", "definition": "an event, often an unpleasant one."}, {"word": "sustained", "definition": "experienced or suffered (an injury or loss)."}, {"word": "dispatched", "definition": "sent off to a destination for a special purpose."}, {"word": "operational", "definition": "relating to the way equipment or a system works."}, {"word": "inquiry", "definition": "an official investigation."}, {"word": "protocols", "definition": "official procedures or rules."}, {"word": "commuters", "definition": "people who travel regularly between home and work."}]}, "Advanced": {"text": "A passenger train operating on a regional route in France has experienced a significant derailment, resulting in injuries to at least 44 individuals. The incident occurred in the picturesque Normandy region, specifically on the rail line connecting the cities of Rouen and Caen, a vital artery for local transport. The train, carrying approximately 180 passengers, veered off its tracks, prompting a swift and extensive emergency response that mobilized considerable resources.\n\nFrance's transport minister provided confirmation regarding the number of passengers on board, underscoring the scale of the emergency and the immediate governmental attention it garnered. Immediately following the derailment, emergency responders, including firefighters, paramedics, and medical personnel, were rapidly dispatched to the scene. Their paramount objective was to secure the area, provide urgent medical care to the injured, and safely evacuate all passengers. Initial reports suggest a range of injuries, from minor cuts and bruises to more serious conditions requiring hospitalization, though thankfully, no fatalities have been reported. The coordinated efforts of these multidisciplinary teams were crucial in managing the immediate aftermath of the accident, ensuring that all affected individuals received prompt attention.\n\nA train derailment, where the wheels of a train leave the railway tracks, can be caused by a multitude of factors, including infrastructure failures, mechanical malfunctions, or operational errors. While the precise cause of this particular incident remains under investigation, authorities have promptly initiated a comprehensive inquiry. This preliminary investigation will meticulously examine the condition of the track infrastructure, the mechanical integrity of the train itself, and the operational procedures in place at the time of the accident. Investigators will analyze data recorders, witness testimonies, and physical evidence from the site to reconstruct the events leading to the derailment, aiming for a complete understanding.\n\nRail safety is a cornerstone of France's extensive and heavily utilized national transport network, which carries millions of passengers annually. Incidents of this nature, while relatively rare, invariably trigger intense scrutiny of existing safety protocols and maintenance regimes. The French national railway company, SNCF, will undoubtedly cooperate fully with the investigation, which aims not only to ascertain culpability but, more importantly, to identify systemic weaknesses and implement preventative measures to preclude future occurrences. This incident serves as a stark reminder of the continuous need for vigilance in maintaining the highest standards of safety across all modes of public transportation, ensuring the confidence and well-being of millions of daily commuters and travelers. The focus now shifts to the recovery of those injured and the implementation of findings to bolster future rail operations and reinforce public trust.", "vocab": [{"word": "derailment", "definition": "an accident in which a train comes off its tracks."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "comprehensive", "definition": "including or dealing with all or nearly all elements or aspects of something."}, {"word": "inquiry", "definition": "an official investigation."}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., roads, power supplies) needed for the operation of a society or enterprise."}, {"word": "scrutiny", "definition": "critical observation or examination."}, {"word": "ascertain", "definition": "find something out for certain; make sure of."}, {"word": "preclude", "definition": "prevent from happening; make impossible."}]}}, "questions": [{"q": "What kind of vehicle was involved in the accident in France?", "a": "A passenger train was involved in the accident."}, {"q": "How many people were reported to be injured in the train derailment?", "a": "At least 44 people were reported to be injured."}], "id": "a073c6019d8", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c8d37dm8d8mo?at_medium=RSS&at_campaign=rss", "published": "2026-09-12T06:25:32+09:00", "category": "politics"}]}, {"key": "sports", "title": "Sports", "articles": [{"headline": "Packers Key to Victory: Chuck it deep - Yahoo Sports", "excerpt": "Packers Key to Victory: Chuck it deep Yahoo Sports", "levels": {"Beginner": {"text": "Packers Key to Victory: Chuck it deep Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Packers Key to Victory: Chuck it deep Yahoo Sports", "vocab": []}, "Advanced": {"text": "Packers Key to Victory: Chuck it deep Yahoo Sports", "vocab": []}}, "questions": [], "id": "a4d7893db75", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNVVlxQnpFd0JKYkp0OXNTaEVITWZwcFlDWlNlV1hmeEFob3pKSDlIMmo1aTRWVVg0VWdhSXFjOEdWajRmZ1ZJWDVLdl9VNVZsbHh3cnVBVHZRaWxueFNPVlBTeHZQLUFZeXFkSDgxdTFfT1o4WGZuMVFuQk5mY1lmVDhCRkludw?oc=5", "published": "2026-09-12T08:31:44+09:00", "category": "sports"}, {"headline": "US Open tennis 2026 men’s semi-final: Frances Tiafoe v Ben Shelton – live buildup", "excerpt": "Updates from the second men’s semi-final in New York Zverev takes out Khachanov in straight sets to make final Andrew Lawrence: in praise of", "levels": {"Beginner": {"text": "Updates from the second men’s semi-final in New York Zverev takes out Khachanov in straight sets to make final Andrew Lawrence: in praise of five-set tennis | Mail Bryan Before the players emerge tonight, Arthur Ashe Stadium is pausing to mark the 25th anniversary of the September 11 attacks. A pre-match ceremony is honoring the nearly 3,000 people killed, their families and the first responders. After a moment of silence, the recording artist Jojo is performing the US national anthem. Shelton is attempting to become the youngest American man to reach a US Open final since Andy Roddick won the title here at 21 in 2003. The 23-year-old has been remarkably efficient when reaching the business end of tournaments this season: he has made four previous semi-finals – Dallas, Munich, Stuttgart and Montreal – and won the title every time. Those trophies also made him the first American man since Sam Querrey in 2010 to win tour titles on hard, clay and grass in the same season. Tonight he will ", "vocab": []}, "Intermediate": {"text": "Updates from the second men’s semi-final in New York Zverev takes out Khachanov in straight sets to make final Andrew Lawrence: in praise of five-set tennis | Mail Bryan Before the players emerge tonight, Arthur Ashe Stadium is pausing to mark the 25th anniversary of the September 11 attacks. A pre-match ceremony is honoring the nearly 3,000 people killed, their families and the first responders. After a moment of silence, the recording artist Jojo is performing the US national anthem. Shelton is attempting to become the youngest American man to reach a US Open final since Andy Roddick won the title here at 21 in 2003. The 23-year-old has been remarkably efficient when reaching the business end of tournaments this season: he has made four previous semi-finals – Dallas, Munich, Stuttgart and Montreal – and won the title every time. Those trophies also made him the first American man since Sam Querrey in 2010 to win tour titles on hard, clay and grass in the same season. Tonight he will ", "vocab": []}, "Advanced": {"text": "Updates from the second men’s semi-final in New York Zverev takes out Khachanov in straight sets to make final Andrew Lawrence: in praise of five-set tennis | Mail Bryan Before the players emerge tonight, Arthur Ashe Stadium is pausing to mark the 25th anniversary of the September 11 attacks. A pre-match ceremony is honoring the nearly 3,000 people killed, their families and the first responders. After a moment of silence, the recording artist Jojo is performing the US national anthem. Shelton is attempting to become the youngest American man to reach a US Open final since Andy Roddick won the title here at 21 in 2003. The 23-year-old has been remarkably efficient when reaching the business end of tournaments this season: he has made four previous semi-finals – Dallas, Munich, Stuttgart and Montreal – and won the title every time. Those trophies also made him the first American man since Sam Querrey in 2010 to win tour titles on hard, clay and grass in the same season. Tonight he will ", "vocab": []}}, "questions": [], "id": "a934c5ae5fd", "source": "Sport | The Guardian", "link": "https://www.theguardian.com/sport/live/2026/sep/11/us-open-tennis-2026-mens-semi-final-frances-tiafoe-v-ben-shelton-live-buildup", "published": "2026-09-12T08:30:41+09:00", "category": "sports"}, {"headline": "Bayern Munich extends partnership with SSV Ulm 1846 - Yahoo Sports", "excerpt": "Bayern Munich extends partnership with SSV Ulm 1846 Yahoo Sports", "levels": {"Beginner": {"text": "Bayern Munich extends partnership with SSV Ulm 1846 Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Bayern Munich extends partnership with SSV Ulm 1846 Yahoo Sports", "vocab": []}, "Advanced": {"text": "Bayern Munich extends partnership with SSV Ulm 1846 Yahoo Sports", "vocab": []}}, "questions": [], "id": "a3732df84c2", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijwFBVV95cUxNc1NtaUM4ZXR3c0VETVlUUXFsdWpnTjR1ZTJieUhLRXZhZ29IZGg2d21LMWVWemlXazJzQ0FaR1RlREJWeXZSY1NGQm1MN2FTV1RaZGN0MTQ2alI2Rm0yNFRYaFVGN0xLczdHY0YyRFdSZDRPblRvMi1mS2VJSGpyUXRwTFhWTGlZa2xVTWljZw?oc=5", "published": "2026-09-12T08:30:00+09:00", "category": "sports"}, {"headline": "Reds and Brewers Set for Pitching Showdown", "excerpt": "Baseball fans are excited for the upcoming game between the Cincinnati Reds and Milwaukee Brewers, featuring a key pitching matchup.", "levels": {"Beginner": {"text": "Baseball fans are getting ready for an exciting game. The Cincinnati Reds will play against the Milwaukee Brewers. This game is important for both teams. It will happen soon.\n\nTwo main players in this game are the pitchers. For the Reds, Andrew Abbott will pitch. For the Brewers, Dustin May will pitch. Pitchers throw the ball to the batters. They try to stop the other team from scoring points, called runs.\n\nThe Reds and Brewers are both baseball teams from America. They play in a big league called Major League Baseball (MLB). Games like this are part of their long season. Teams want to win many games to have a good chance to play in the playoffs later.\n\nThis game is expected to be a good one because both pitchers are strong. Fans will watch to see which team's pitcher performs better. It's a chance for players to show their skills and for teams to try and win. Everyone hopes for a fun game.", "vocab": [{"word": "Pitcher", "definition": "A player who throws the ball to the batter."}, {"word": "Batter", "definition": "A player who tries to hit the ball thrown by the pitcher."}, {"word": "Runs", "definition": "Points scored in baseball."}, {"word": "League", "definition": "A group of sports teams that play against each other."}, {"word": "Season", "definition": "The period of the year when a sport is played."}, {"word": "Playoffs", "definition": "Special games at the end of the season to decide the champion."}]}, "Intermediate": {"text": "Baseball enthusiasts are anticipating a significant matchup as the Cincinnati Reds prepare to face the Milwaukee Brewers. This upcoming game is drawing attention due to its potential impact on the standings and the intriguing pitching duel scheduled. Both teams are members of Major League Baseball (MLB), America's premier professional baseball league, and are competing in a long regular season.\n\nA key highlight of this contest will be the pitchers on the mound. Andrew Abbott is slated to start for the Cincinnati Reds. Abbott is known for his strategic approach to pitching, aiming to keep opposing batters off balance and prevent them from getting on base. Across the field, Dustin May will take the mound for the Milwaukee Brewers. May is recognized for his powerful throws and ability to strike out hitters, often overpowering opponents with his fastball. The performance of these starting pitchers often dictates the flow and outcome of a baseball game, setting the tone for their respective teams.\n\nThe Reds and Brewers are division rivals, meaning their games often carry extra weight beyond a typical regular season contest. Each victory is crucial as teams strive to improve their win-loss record and secure a spot in the highly coveted postseason playoffs. A strong pitching performance can give a team a significant advantage, limiting the opponent's scoring opportunities and allowing their own offense to capitalize on their chances. These head-to-head matchups are vital for gaining an edge in the competitive Central Division.\n\nFans and analysts alike will be closely watching this game to see which pitcher can dominate and lead their team to victory. It's not just about individual skill, but also how well each pitcher executes their strategy against the opposing lineup, managing the game's pace and pressure. This game promises to be a compelling display of professional baseball, with both teams eager to gain an edge in the competitive league standings and move closer to their ultimate goal of a championship.", "vocab": [{"word": "Anticipating", "definition": "Expecting something to happen."}, {"word": "Matchup", "definition": "A contest or game between two opponents."}, {"word": "Slated", "definition": "Scheduled or planned to happen."}, {"word": "Strategic", "definition": "Relating to a plan of action designed to achieve a major goal."}, {"word": "Dictates", "definition": "Controls or determines something."}, {"word": "Rivals", "definition": "Opponents in a competition."}, {"word": "Postseason", "definition": "The period of games played after the regular season to determine a champion."}]}, "Advanced": {"text": "Major League Baseball aficionados are keenly anticipating a pivotal encounter between the Cincinnati Reds and the Milwaukee Brewers. This upcoming contest, featuring a compelling pitching duel, is poised to significantly influence the National League Central Division standings. Both franchises, integral components of MLB's competitive landscape, are navigating the arduous demands of a lengthy regular season, where every victory contributes to their ultimate playoff aspirations. The intensity of these divisional matchups often elevates the stakes, making each pitch and every at-bat feel more consequential.\n\nThe mound will be the focal point of this highly anticipated game, showcasing two distinct pitching philosophies. For the Cincinnati Reds, Andrew Abbott is scheduled to toe the rubber. Abbott, a left-handed hurler, is renowned for his finesse and precision, often employing a diverse repertoire of pitches to induce weak contact and generate ground balls. His strategic acumen allows him to effectively navigate opposing lineups, minimizing hard-hit balls and managing pitch counts efficiently, thereby preserving his arm strength deep into games.\n\nConversely, the Milwaukee Brewers will counter with Dustin May, a formidable right-handed pitcher. May is distinguished by his powerful arm and an arsenal highlighted by a blistering fastball and a sharp breaking ball. His approach often involves overpowering hitters, aiming for strikeouts and quick outs through sheer velocity and movement, often leaving batters bewildered. The contrast between Abbott's nuanced artistry and May's raw power sets the stage for a fascinating tactical battle, where different strengths will be tested against elite hitting.\n\nThis divisional clash carries considerable weight beyond a typical regular season fixture. Both the Reds and Brewers are vying for supremacy in the NL Central, a division often characterized by tight races and fierce competition. Securing wins in head-to-head matchups against direct competitors is paramount for improving a team's win-loss differential and bolstering their chances of clinching a playoff berth, either as a division champion or a wild card entrant. The outcome of such games can have ripple effects throughout the division, impacting momentum, confidence, and ultimately, the final standings. Teams often build rivalries over these series, adding another layer of intensity.\n\nThe performance of these starting pitchers will undoubtedly be a critical determinant of the game's trajectory. A dominant outing from either Abbott or May could provide their team with a crucial early advantage, allowing the offense to play with less pressure and potentially extend their lead. Conversely, an early struggle could force the bullpen into action prematurely, taxing relief pitchers for subsequent games in the series and potentially weakening the team's pitching depth. Analysts will scrutinize pitch selection, command, and the ability to execute under pressure in high-leverage situations. This contest promises to be a sophisticated display of professional baseball, where strategic decisions, individual brilliance, and team cohesion will all converge in pursuit of a vital divisional victory, pushing both teams closer to their seasonal objectives.", "vocab": [{"word": "Aficionados", "definition": "People who are very knowledgeable and enthusiastic about an activity."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Arduous", "definition": "Involving or requiring strenuous effort; difficult and tiring."}, {"word": "Repertoire", "definition": "A stock of plays, dances, or pieces that a company or performer knows or is prepared to perform. In pitching, it refers to the variety of pitches a pitcher throws."}, {"word": "Acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Paramount", "definition": "More important than anything else; supreme."}, {"word": "Trajectory", "definition": "The path followed by a projectile flying or an object moving under the action of given forces. In this context, it refers to the course or development of the game."}]}}, "questions": [{"q": "What two baseball teams are playing in the game mentioned?", "a": "The Cincinnati Reds and the Milwaukee Brewers."}, {"q": "Who are the two main pitchers expected to play in this game?", "a": "Andrew Abbott for the C
