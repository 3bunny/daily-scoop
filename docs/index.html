e past six years, according to People. The transition back to Britain, which the outlet says will last for “an extended period,” is set to begin in the coming weeks. The Duke and Duchess of Sussex […]", "vocab": []}, "Intermediate": {"text": "Prince Harry and Meghan Markle are moving back to the U.K. with their children after living in California for the past six years, according to People. The transition back to Britain, which the outlet says will last for “an extended period,” is set to begin in the coming weeks. The Duke and Duchess of Sussex […]", "vocab": []}, "Advanced": {"text": "Prince Harry and Meghan Markle are moving back to the U.K. with their children after living in California for the past six years, according to People. The transition back to Britain, which the outlet says will last for “an extended period,” is set to begin in the coming weeks. The Duke and Duchess of Sussex […]", "vocab": []}}, "questions": [], "id": "a0b05829051", "source": "Variety", "link": "https://variety.com/2026/film/news/prince-harry-meghan-markle-moving-back-to-uk-1236838650/", "published": "2026-08-20T06:50:40+09:00", "category": "entertainment"}]}], "home": [{"headline": "US and Canada Announce Trade Deal, Details Await Clarity", "excerpt": "President Trump announced a new trade agreement between the United States and Canada, though specific terms are still being clarified.", "levels": {"Beginner": {"text": "President Donald Trump said that the United States and Canada have made a new trade deal. This is big news for both countries. Trade means buying and selling things between countries. The US and Canada are very important trade partners. They buy and sell many goods, like cars and food, to each other.\n\nThis new deal aims to change an older agreement called NAFTA. NAFTA has been in place for many years, helping trade between the US, Canada, and Mexico. President Trump wanted to make a new deal because he felt NAFTA was not fair for the US.\n\nRight now, we know there is a deal, but we do not know all the small details. These are called 'key terms.' It means the important rules and parts of the agreement are not fully public yet. People are waiting to learn more about what the new deal means for businesses and workers in both countries. This agreement is important for the future of trade in North America.", "vocab": [{"word": "deal", "definition": "an agreement."}, {"word": "trade", "definition": "buying and selling goods and services between countries."}, {"word": "partners", "definition": "countries or people who work together."}, {"word": "agreement", "definition": "a decision or promise made by two or more people or groups."}, {"word": "details", "definition": "small facts or pieces of information."}]}, "Intermediate": {"text": "President Donald Trump has announced that the United States and Canada have reached a new trade agreement. This development marks a significant step in the ongoing efforts to reshape trade relations across North America. While the announcement signals a breakthrough, many of the specific details, often referred to as 'key terms,' of the deal are still unclear to the public.\n\nFor over a year, the Trump administration has been working to renegotiate the North American Free Trade Agreement (NAFTA), a pact that has governed trade between the U.S., Canada, and Mexico since 1994. President Trump had frequently criticized NAFTA, arguing it was unfair to American workers and businesses, and pushed for a new accord. Mexico had already finalized its own updated trade agreement with the United States earlier, leaving Canada as the last major partner to reach a consensus.\n\nThe relationship between the U.S. and Canada is one of the world's largest bilateral trading partnerships, with billions of dollars in goods and services exchanged annually. Key areas of contention during the negotiations included Canada's dairy market access for U.S. farmers, rules of origin for automobiles, and dispute resolution mechanisms.\n\nThe new agreement is expected to be known as the United States-Mexico-Canada Agreement (USMCA). Although the general framework has been agreed upon, the precise language and implications of various provisions are yet to be fully disclosed. Businesses, investors, and policymakers in both countries are keenly awaiting the release of the full text to understand the economic impacts and operational changes that will result from this new North American trade pact.", "vocab": [{"word": "agreement", "definition": "a formal decision or understanding between two or more parties."}, {"word": "renegotiate", "definition": "to discuss and change the terms of an existing agreement."}, {"word": "pact", "definition": "a formal agreement or treaty between individuals or parties."}, {"word": "accord", "definition": "a formal agreement or treaty."}, {"word": "contention", "definition": "disagreement or argument."}, {"word": "provisions", "definition": "specific conditions or terms within a legal agreement."}]}, "Advanced": {"text": "President Donald Trump has declared that the United States and Canada have successfully forged a new trade agreement, signaling a potential resolution to over a year of contentious negotiations aimed at revamping the North American Free Trade Agreement (NAFTA). While the announcement marks a significant diplomatic achievement, the specific intricacies and 'key terms' of the accord remain largely undisclosed, prompting anticipation among stakeholders eager to scrutinize its full implications.\n\nThe renegotiation of NAFTA, a trilateral pact established in 1994, has been a cornerstone of President Trump's protectionist trade agenda. He consistently lambasted the original agreement as detrimental to American manufacturing and jobs, advocating for a more favorable deal for the U.S. Mexico had already concluded its updated bilateral trade arrangement with the U.S. weeks prior, placing considerable pressure on Canada to reach a consensus and avoid being excluded from a modernized North American trade framework.\n\nThe economic relationship between the U.S. and Canada is one of the most robust and integrated globally, with annual two-way trade exceeding hundreds of billions of dollars. The protracted negotiations were characterized by several flashpoints. Canada's supply management system for dairy products, which limits imports and supports domestic farmers, was a major point of contention, with the U.S. pushing for greater market access. Automobile rules of origin, dictating the percentage of a car's components that must be sourced from North America to qualify for tariff-free trade, also proved to be a complex issue, alongside the future of NAFTA's Chapter 19 dispute resolution mechanism, which the U.S. sought to eliminate.\n\nThe new agreement, anticipated to be formally known as the United States-Mexico-Canada Agreement (USMCA), is poised to replace NAFTA. However, the absence of publicly available detailed text means that the precise concessions made by each party, the revised regulatory landscape for various industries, and the mechanisms for enforcement are still subject to speculation. Businesses, from agriculture to automotive, are keenly awaiting the official publication to assess the operational adjustments and economic shifts this new pact will engender.\n\nThe political ramifications are also noteworthy. For Trump, securing a deal with Canada fulfills a key campaign promise. For Canadian Prime Minister Justin Trudeau, navigating the demands of the U.S. administration while protecting national interests has been a delicate balancing act. Once the full text is released, it will undergo review by respective legislatures, a process that could still present hurdles before the USMCA is fully ratified and implemented, ushering in a new era for North American commerce.", "vocab": [{"word": "forged", "definition": "created or formed, often with effort."}, {"word": "contentious", "definition": "causing or likely to cause an argument; controversial."}, {"word": "revamping", "definition": "giving new and improved form, structure, or appearance to."}, {"word": "intricacies", "definition": "the complex or detailed aspects of something."}, {"word": "lambasted", "definition": "criticized (someone or something) harshly."}, {"word": "trilateral", "definition": "involving three parties or countries."}, {"word": "protracted", "definition": "lasting for a long time or longer than expected or usual."}, {"word": "engender", "definition": "cause or give rise to (a feeling, situation, or condition)."}]}}, "questions": [{"q": "What is the main news announced by President Trump?", "a": "President Trump announced that the United States and Canada have reached a new trade deal."}, {"q": "What was the name of the old trade agreement that the new deal aims to replace?", "a": "The old trade agreement that the new deal aims to replace was called NAFTA (North American Free Trade Agreement)."}], "id": "ad95f42a135", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxPODV5anhEeWJCMDZkdTcxMnRsMURLMW96MG1ITkxmNjMyeVJDQ0pzMDZNLW91Vlc4c3pKcllFVnZJanB3a29jOHlWaDFtR0UzbkJoU3E3eElVaHZxQUYzOHpzd1N2Q05GMllpMXB0QktacmdaSXg4YmM3RW1pN08wb1dZRDRHQUtGd1ptOGpFcXduTl9aRlhMYTB1YnUwVW93N2ZKUmw5Z1hSeTg?oc=5", "published": "2026-08-20T07:04:42+09:00", "category": "business", "category_title": "Business"}, {"headline": "Market Watch: Key Sectors Discussed on CNBC's Final Trade", "excerpt": "A recent CNBC \"Final Trade\" segment highlighted important sectors like technology, energy, and biotechnology for investors to consider.", "levels": {"Beginner": {"text": "CNBC has a TV show called \"Final Trade.\" On this show, experts talk about different kinds of companies and their stocks. Stocks are small parts of a company that people can buy.\n\nRecently, the show talked about a few important areas. One was \"SMH,\" which stands for a group of technology companies that make computer chips. These chips are in phones, computers, and many other devices.\n\nAnother area was \"XLE.\" This is about energy companies, like those that get oil and gas. Energy is important for cars and heating homes.\n\nThey also talked about \"DRAM.\" This means memory chips, which are special computer parts that help devices remember things. Companies that make these chips are a big part of the technology world.\n\nFinally, \"INSM\" was mentioned. This is a company that makes medicine. It works on new drugs to help people who are sick.\n\nThese discussions help people who buy stocks understand what is happening in different parts of the market. It gives them ideas about where to invest their money.", "vocab": [{"word": "stocks", "definition": "small parts of a company that people can buy"}, {"word": "experts", "definition": "people who know a lot about a certain topic"}, {"word": "technology", "definition": "things like computers, phones, and other electronic devices"}, {"word": "energy", "definition": "power from sources like oil, gas, or electricity"}, {"word": "medicine", "definition": "drugs or treatments used to help sick people"}, {"word": "invest", "definition": "to put money into something to make more money"}]}, "Intermediate": {"text": "CNBC's \"Final Trade\" is a popular daily segment on financial television that wraps up the trading day. During this program, market analysts and experts share their final thoughts and recommendations on various stocks, exchange-traded funds (ETFs), and key market sectors. It serves as a valuable resource for investors seeking insights into market dynamics and potential investment opportunities.\n\nRecently, the segment brought attention to several diverse areas of the market. One prominent discussion centered on SMH, which represents the VanEck Semiconductor ETF. This ETF tracks companies involved in the semiconductor industry, a foundational component of modern technology. Semiconductors, or computer chips, are essential for everything from smartphones and computers to artificial intelligence and automotive systems, making this sector a crucial indicator of technological advancement and economic health.\n\nAnother focus was XLE, the Energy Select Sector SPDR Fund. This ETF comprises major U.S. companies in the oil, gas, and consumable fuels industries. Discussions around XLE often involve global energy prices, supply and demand dynamics, and geopolitical events that can significantly impact the sector's performance.\n\nThe topic of DRAM, or Dynamic Random-Access Memory, also came up. While not a direct stock ticker itself, DRAM refers to a specific type of memory chip vital for computers, servers, and mobile devices. Companies that manufacture DRAM, such as Micron Technology, are significant players in the broader technology hardware market, and their performance is often tied to global demand for electronics and data centers.\n\nLastly, INSM, representing Insmed Inc., a biopharmaceutical company, was highlighted. Insmed focuses on developing treatments for serious and rare diseases. Investments in biopharmaceutical companies like Insmed are often driven by the progress of their clinical trials, potential drug approvals, and the unmet medical needs they aim to address.\n\nThese discussions on \"Final Trade\" provide investors with a snapshot of expert sentiment across critical sectors, helping them understand the forces shaping the market as the trading day concludes.", "vocab": [{"word": "segment", "definition": "a part of a television or radio show"}, {"word": "analysts", "definition": "people who study and explain financial markets"}, {"word": "exchange-traded funds (ETFs)", "definition": "investment funds that hold a collection of stocks and can be traded like individual stocks"}, {"word": "semiconductor", "definition": "a material or device used in electronic circuits, like computer chips"}, {"word": "biopharmaceutical", "definition": "related to drugs and medicines made using biological processes"}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors"}, {"word": "dynamics", "definition": "the forces or properties that stimulate growth, development, or change within a system or process"}]}, "Advanced": {"text": "CNBC's \"Final Trade\" segment stands as a daily bellwether for end-of-day market sentiment, offering a concise yet comprehensive synthesis of expert opinions on pivotal stocks, exchange-traded funds (ETFs), and overarching sector trends. For discerning investors, this program provides invaluable insights into the forces shaping market trajectories, often highlighting areas poised for significant movement or requiring strategic consideration.\n\nA recent iteration of this segment brought into focus a diverse quartet of market components, each representing distinct facets of the global economy. The discussion prominently featured SMH, the VanEck Semiconductor ETF, which serves as a crucial proxy for the health and innovation within the broader technology sector. Semiconductors are the foundational bedrock of the digital economy, underpinning advancements in artificial intelligence, cloud computing, 5G infrastructure, and autonomous systems. Consequently, SMH's performance is often scrutinized for indicators of global economic growth, supply chain resilience, and the geopolitical dynamics influencing technological leadership, particularly between major economic powers.\n\nAnother key area of discourse was XLE, the Energy Select Sector SPDR Fund. This ETF encapsulates the performance of major U.S. energy companies, primarily those engaged in exploration, production, and refining of oil and gas. Its trajectory is highly susceptible to macro-economic shifts, global commodity price fluctuations, OPEC+ production decisions, and the evolving landscape of renewable energy transition. Analysts often leverage XLE's movements to gauge investor sentiment regarding inflation, industrial demand, and geopolitical stability in energy-producing regions.\n\nThe topic of DRAM, or Dynamic Random-Access Memory, also garnered attention. While not a direct tradable ticker, \"DRAM\" refers to a critical type of volatile memory chip indispensable for modern computing, from data centers and enterprise servers to consumer electronics like smartphones and PCs. Discussions surrounding DRAM typically delve into its cyclical pricing nature, the supply-demand equilibrium, capital expenditure cycles of major manufacturers (e.g., Samsung, SK Hynix, Micron Technology), and the burgeoning demand driven by AI workloads and high-performance computing. It represents a vital, albeit often volatile, sub-sector within the technology hardware ecosystem.\n\nFinally, INSM, representing Insmed Inc., a biopharmaceutical firm, was highlighted. Investments in the biopharmaceutical space are inherently high-risk, high-reward propositions, contingent upon successful clinical trial outcomes, stringent regulatory approvals, and the commercial viability of novel therapies. Insmed's focus on developing treatments for rare and serious diseases positions it within a specialized niche, where market potential is often tied to orphan drug designations and the ability to address significant unmet medical needs.\n\nCollectively, these diverse picks from the \"Final Trade\" segment underscore the multifaceted considerations for investors navigating today's complex financial markets, spanning technological innovation, commodity cycles, and advancements in healthcare. The program's utility lies in its capacity to distill intricate market narratives into actionable insights, guiding participants through an often-unpredictable investment landscape.", "vocab": [{"word": "bellwether", "definition": "something that serves as an indicator of future trends"}, {"word": "synthesis", "definition": "the combination of ideas to form a theory or system"}, {"word": "proxy", "definition": "a figure that can be used to represent the value of something else in a calculation"}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors"}, {"word": "cyclical", "definition": "characterized by cycles; recurring in cycles"}, {"word": "stringent", "definition": "strict, precise, and exacting"}, {"word": "inherently", "definition": "in a permanent, essential, or characteristic way"}, {"word": "distill", "definition": "to extract the essential meaning or most important aspects of"}]}}, "questions": [{"q": "What is the purpose of CNBC's \"Final Trade\" segment?", "a": "It's a daily program where market experts discuss stocks, ETFs, and sectors to provide insights and recommendations to investors at the end of the trading day."}, {"q": "Which of the discussed items is related to memory chips for computers?", "a": "DRAM (Dynamic Random-Access Memory) is related to memory chips."}], "id": "a89edbd067f", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMifEFVX3lxTE5XVERWS0o2OGwtdUxaZE5IWFFSZ0s5ZjhUeWFnOGlsOWo0R3hFMWdHOHo0Z3dYbjNMWDlHQlBNTjVGNlZXZjYyNG1YUFJ2WWNQMzIzTUhhZG5tZzExdGlHRV9KemVBUEMwOXlXNGF1TW5BRjVDcktWQngyck0?oc=5", "published": "2026-08-20T07:04:41+09:00", "category": "business", "category_title": "Business"}, {"headline": "UAE's First Central Bank-Backed Stablecoin USDU Added to Bitcoin.com Wallet", "excerpt": "Bitcoin.com has added USDU, the United Arab Emirates' first stablecoin with central bank backing, to its digital wallet for users.", "levels": {"Beginner": {"text": "Bitcoin.com has added a new digital money called USDU to its online wallet. This is big news for people who use digital money. USDU is special because it is the first \"stablecoin\" from the United Arab Emirates (UAE) that has support from a central bank.\n\nA stablecoin is a type of digital money that tries to keep a steady value. Unlike Bitcoin, which can change its price a lot, a stablecoin usually stays close to the value of a regular currency, like the US dollar. This makes it more reliable for everyday use.\n\nThe central bank in the UAE is helping to make sure USDU is safe and stable. This means more trust for users. Bitcoin.com's wallet lets people store, send, and receive digital money easily. By adding USDU, it gives users in the UAE and around the world a new, stable option. This move shows that digital money is becoming more accepted and part of the regular financial world. It's an important step for digital money in the UAE.", "vocab": [{"word": "wallet", "definition": "A digital place to keep your money safe online."}, {"word": "digital money", "definition": "Money that exists only on computers or the internet, not as physical coins or paper."}, {"word": "stablecoin", "definition": "A type of digital money that tries to keep a steady value, often by being linked to a regular currency."}, {"word": "central bank", "definition": "A main bank in a country that controls the money supply and helps keep the economy stable."}, {"word": "users", "definition": "People who use a service or product, like an app or a website."}, {"word": "reliable", "definition": "Can be trusted to work well or be accurate."}]}, "Intermediate": {"text": "Bitcoin.com, a prominent cryptocurrency platform, has announced the integration of USDU into its digital wallet, making it accessible to retail users. USDU is notable as the United Arab Emirates' (UAE) first stablecoin to receive backing from a central bank, marking a significant development in the region's digital asset landscape.\n\nStablecoins are a class of cryptocurrencies designed to minimize price volatility by pegging their value to a stable asset, such as a fiat currency like the US dollar, or to a basket of assets. This stability makes them attractive for transactions, savings, and as a bridge between traditional finance and the broader cryptocurrency ecosystem. The \"central bank-backed\" aspect of USDU implies a level of official oversight or assurance from the UAE's monetary authority, aiming to enhance trust and regulatory compliance. This distinguishes it from many privately issued stablecoins, which rely solely on their issuers' reserves.\n\nThe addition of USDU to Bitcoin.com's widely used wallet platform means that individuals can now easily store, send, and receive this stable digital asset. This move is expected to boost the adoption of digital currencies in the UAE, providing a stable and officially supported option for digital transactions. For the UAE, this represents a step forward in its ambition to become a global hub for financial technology and innovation. It also highlights a growing trend where central banks are exploring ways to integrate digital assets into their financial systems, either through direct issuance of Central Bank Digital Currencies (CBDCs) or by providing regulatory frameworks and backing for private stablecoins. This development could pave the way for more secure and efficient digital payments for everyday consumers.", "vocab": [{"word": "prominent", "definition": "Important and well-known."}, {"word": "integration", "definition": "The process of combining two or more things so they work together."}, {"word": "retail users", "definition": "Individual customers who buy products or services for their own use, not for business."}, {"word": "cryptocurrency", "definition": "A digital currency in which transactions are verified and records maintained by a decentralized system using cryptography, rather than by a centralized authority."}, {"word": "volatility", "definition": "The quality of being subject to rapid and unpredictable change, especially price changes."}, {"word": "fiat currency", "definition": "Government-issued currency that is not backed by a physical commodity like gold or silver, but by the government's promise."}, {"word": "regulatory compliance", "definition": "Adhering to rules, laws, and standards set by authorities."}]}, "Advanced": {"text": "Bitcoin.com, a leading global cryptocurrency ecosystem, has announced a significant expansion of its digital wallet offerings with the integration of USDU, the United Arab Emirates' (UAE) inaugural central bank-backed stablecoin. This strategic addition makes USDU readily available to a broad base of retail users, underscoring a pivotal moment in the evolution of digital finance within the Gulf region and beyond.\n\nUSDU distinguishes itself within the burgeoning stablecoin market by its unique endorsement from a central bank. While many stablecoins are privately issued and rely on their own audited reserves to maintain a peg to a fiat currency, USDU's \"central bank-backed\" status implies a higher degree of official oversight, regulatory assurance, or even direct support from the UAE's monetary authority. This institutional backing is designed to instill greater confidence in its stability and solvency, mitigating some of the inherent risks associated with purely private digital assets. Such a model could serve as a crucial bridge, fostering greater interoperability between the nascent cryptocurrency sector and the established traditional financial system.\n\nThe availability of USDU on Bitcoin.com's widely utilized wallet platform is poised to significantly accelerate the mainstream adoption of digital currencies in the UAE. It offers consumers a stable, transparent, and officially sanctioned digital asset for a myriad of transactions, from everyday purchases to cross-border remittances. This initiative aligns with the UAE's ambitious vision to position itself as a global leader in financial technology and innovation, actively exploring and embracing the potential of blockchain technology and digital assets. The move also reflects a broader global trend where central banks are increasingly engaging with digital currencies, either through the development of their own Central Bank Digital Currencies (CBDCs) or by establishing robust regulatory frameworks to govern private stablecoins. This proactive approach by the UAE's central bank, by providing backing to a stablecoin, signals a sophisticated understanding of the need for both innovation and stability in the rapidly evolving digital economy. It sets a precedent for how other nations might approach the integration of private digital assets into their national financial infrastructure, potentially enhancing financial inclusion and efficiency across various economic sectors.", "vocab": [{"word": "ecosystem", "definition": "A complex network or interconnected system, especially of businesses or technologies."}, {"word": "inaugural", "definition": "Marking the beginning of an institution, activity, or series."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "endorsement", "definition": "The act of giving one's public approval or support to someone or something."}, {"word": "solvency", "definition": "The ability of a company or individual to pay their debts."}, {"word": "interoperability", "definition": "The ability of computer systems or software to exchange and make use of information."}, {"word": "nascent", "definition": "(Especially of a process or organization) just coming into existence and beginning to display signs of future potential."}]}}, "questions": [{"q": "What makes USDU different from many other stablecoins?", "a": "USDU is unique because it is the first stablecoin from the UAE that has backing or official support from a central bank, which aims to provide greater trust and stability."}, {"q": "How might the addition of USDU to Bitcoin.com's wallet benefit users in the UAE?", "a": "It provides users in the UAE with a new, stable, and officially supported digital asset for various transactions, potentially boosting the adoption of digital currencies and enhancing financial efficiency."}], "id": "ab4e1331ff3", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipwFBVV95cUxNbWtzdXFzX2RLWVpWYUpQdXFHSGpHVExEbmN1TnFEZnhFLVRSN3BmUkNCRlBDSUZCQVhRYWFRRjRsNDZ2blRrZkc3anFrRUtjRjZQQy1RaXE3emh0WGRqTlF4cG12RERvNFRxS1k0S25UdnlHZzhWLWxyMWRNemhTYURuSkNzQjlYX2NoSXdBcG9abklWbF9fZzRwV3R0cmZEWndJekd2WQ?oc=5", "published": "2026-08-20T06:35:07+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Central Florida Food Banks Benefit from State Surplus Program", "excerpt": "A new state program is helping Central Florida food banks provide fresh produce to families in need by using food that farms would otherwise waste.", "levels": {"Beginner": {"text": "Central Florida food banks are getting help to feed people. A new program from the state is giving them extra food. This food comes from farms. Sometimes, farms grow too much food, or some food doesn't look perfect. This food is still good to eat, but it might not be sold in stores.\n\nThe state program helps collect this extra food. Then, it sends the food to places like food banks in Central Florida. Food banks give food to families who need it. Many people in the area struggle to buy enough food. This new program means more fresh fruits and vegetables for them.\n\nThis is good news for everyone. Farms don't have to throw away good food. Food banks get more healthy food to share. And families in Central Florida get fresh, nutritious meals. It helps reduce waste and makes sure more people have enough to eat.", "vocab": [{"word": "food banks", "definition": "Places that collect and give out food to people who need it."}, {"word": "program", "definition": "A plan or system to do something."}, {"word": "farms", "definition": "Places where food is grown or animals are raised."}, {"word": "extra", "definition": "More than what is needed or usual."}, {"word": "struggle", "definition": "To have difficulty doing something."}, {"word": "nutritious", "definition": "Good for your health; full of vitamins."}]}, "Intermediate": {"text": "Food banks in Central Florida are receiving a significant boost thanks to a new state-level initiative: a farm food surplus program. This program is designed to connect farms with excess produce directly to organizations that help feed communities, ensuring that good food doesn't go to waste.\n\nMany farms often produce more food than they can sell, or some crops might not meet strict cosmetic standards for grocery stores, even though they are perfectly fresh and safe to eat. Historically, this surplus food might have been discarded, leading to significant waste. The state's new program steps in to prevent this by organizing the collection and distribution of these valuable resources.\n\nFor Central Florida food banks, this means a reliable supply of fresh fruits and vegetables. These items are often expensive for families facing food insecurity, making them a crucial addition to the non-perishable goods typically available. By providing fresh produce, food banks can offer more balanced and healthy meals to individuals and families struggling to make ends meet.\n\nThe initiative benefits multiple parties. Farmers can reduce waste and potentially recover some costs associated with harvesting and transporting the surplus. Food banks gain access to high-quality, fresh ingredients, enhancing the nutritional value of their offerings. Most importantly, residents in Central Florida who rely on these services receive much-needed support, helping to combat hunger and improve community well-being. This collaborative effort highlights a practical solution to both food waste and food insecurity.", "vocab": [{"word": "significant", "definition": "Important or noticeable."}, {"word": "initiative", "definition": "A new plan or process to achieve something."}, {"word": "excess", "definition": "More than what is needed or usual."}, {"word": "cosmetic standards", "definition": "Rules about how food should look to be sold in stores."}, {"word": "discarded", "definition": "Thrown away."}, {"word": "food insecurity", "definition": "Not having enough food or not knowing where your next meal will come from."}, {"word": "collaborative", "definition": "Involving two or more people or groups working together."}]}, "Advanced": {"text": "Food banks across Central Florida are poised to significantly enhance their capacity to serve vulnerable populations, thanks to a robust state-level initiative: a farm food surplus program. This innovative program establishes a crucial link between agricultural producers with excess inventory and the charitable organizations dedicated to alleviating hunger, thereby addressing both food waste and food insecurity simultaneously.\n\nThe agricultural sector frequently grapples with the challenge of surplus produce. Factors such as unpredictable market demand, bumper harvests, or stringent cosmetic standards imposed by retailers often result in perfectly edible fruits and vegetables being deemed unsellable. Historically, this surplus has often been tilled back into fields or sent to landfills, representing a considerable economic loss for farmers and an environmental burden, while millions simultaneously face hunger. The state's new program intervenes by facilitating the efficient collection, storage, and distribution of these valuable, often perishable, commodities.\n\nFor Central Florida's network of food banks, this initiative translates into a consistent and expanded supply of fresh, high-quality produce. Fresh fruits and vegetables are vital components of a healthy diet but are often the most difficult and expensive items for food banks to acquire in sufficient quantities. Their inclusion significantly elevates the nutritional profile of food parcels distributed to clients, moving beyond reliance on shelf-stable, processed goods. This direct pipeline from farm to food bank ensures that recipients, many of whom are low-income families, seniors, and children, gain access to the essential vitamins and minerals crucial for well-being.\n\nBeyond the direct benefit to food-insecure individuals, the program offers multifaceted advantages. Farmers can mitigate financial losses associated with crop disposal and potentially benefit from tax incentives for donating produce. It also fosters a more sustainable food system by diverting perfectly good food from waste streams. This collaborative ecosystem, involving state agencies, agricultural businesses, and non-profit food distribution networks, exemplifies a proactive governmental approach to complex societal challenges. By transforming potential waste into vital sustenance, the program not only addresses immediate hunger but also contributes to the long-term health and resilience of Central Florida communities.", "vocab": [{"word": "poised", "definition": "Ready and prepared for something specific to happen or to do something."}, {"word": "robust", "definition": "Strong and healthy; well-developed and unlikely to fail."}, {"word": "initiative", "definition": "A new plan or process to achieve something, often a large-scale or important one."}, {"word": "alleviating", "definition": "Making suffering, deficiency, or a problem less severe or easier to bear."}, {"word": "grapples", "definition": "Struggles to deal with or overcome a difficulty or challenge."}, {"word": "stringent", "definition": "Strict, precise, and exacting rules or conditions."}, {"word": "perishable", "definition": "Likely to decay or go bad quickly, especially food."}, {"word": "mitigate", "definition": "Make less severe, serious, or painful; lessen the gravity of an offense or mistake."}]}}, "questions": [{"q": "What is the main purpose of the state farm food surplus program?", "a": "The main purpose is to collect extra food from farms that would otherwise be wasted and give it to food banks to help feed people in need."}, {"q": "Besides helping people get food, what is another benefit of this program mentioned in the article?", "a": "Another benefit is that it helps reduce food waste from farms and can provide farmers with benefits like reducing disposal costs."}], "id": "aa621a83328", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitwFBVV95cUxQSzZtaV9JY1VUSDBMdXY4QnpIR1M1S2FKVlBoRDF2eEIxMU52ZldPSmUwREJuOS1jYnlZUzFRWF80dTNRWW1wNDVGYlJvcnF4bFpBbVhPUnNRa3BfMW1GYXk0a3dFRjJ2QmxHT3IxelFGcnZPb2dvMVBTT1RoVS1uTGNjVXdEOE9zWFR0WE5TSzBBa2VtU3RadXEtRm52UEtsMW80SkYzTmJGblowQVJTbU5fNkFhbTg?oc=5", "published": "2026-08-20T06:32:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Australia 'Outraged' Over Gaza Aid Worker Prosecution Decision", "excerpt": "Australia's foreign minister expressed outrage, summoning Israel's ambassador over a decision not to prosecute for an aid worker's death.", "levels": {"Beginner": {"text": "Australia is very upset with Israel. Australia's foreign minister, Penny Wong, said she is \"outraged.\" This is because Israel decided not to punish anyone for killing an Australian aid worker. The aid worker was named Zomi Frankcom. She worked for a group called World Central Kitchen.\n\nZomi Frankcom was killed in Gaza on April 1st. She was helping to give food to people who needed it. Her convoy, which was a group of cars, was hit by Israeli army strikes. Six other aid workers from different countries also died.\n\nAustralia wants Israel to be responsible for what happened. Minister Wong will ask Israel's ambassador to come to a meeting. She called Israel's decision \"insulting.\" This means Australia feels disrespected and angry. Australia believes there should be a proper trial for those involved.\n\nIsrael had said sorry for the deaths. They also said they would look into it. Two officers were fired. But Australia says this is not enough. They want more justice for Zomi Frankcom and the other aid workers.", "vocab": [{"word": "aid worker", "definition": "a person who helps people in need, often in other countries."}, {"word": "convoy", "definition": "a group of vehicles traveling together."}, {"word": "strikes", "definition": "attacks, often by bombs or missiles."}, {"word": "insulting", "definition": "making someone feel disrespected or offended."}, {"word": "justice", "definition": "fairness in the way people are treated."}]}, "Intermediate": {"text": "Australia has expressed strong anger and disappointment with Israel's decision not to prosecute any military personnel over the killing of Australian aid worker Zomi Frankcom in Gaza. Australia's Foreign Minister Penny Wong stated she was \"outraged\" by the move and announced she would summon Israel's ambassador to convey Australia's deep displeasure.\n\nZomi Frankcom was one of seven World Central Kitchen (WCK) aid workers killed on April 1st when their convoy was hit by Israeli drone strikes in Gaza. The incident sparked international condemnation and calls for a thorough investigation. The other victims included citizens from the UK, Poland, Palestine, and a dual US-Canadian national. These aid workers were delivering much-needed food supplies to a population facing severe hunger.\n\nIsrael's military initially acknowledged \"grave errors\" and apologized for the incident, stating that the strikes were a \"mistake\" and that the convoy was mistakenly identified as Hamas operatives. Following an internal investigation, two officers were dismissed, and other commanders were reprimanded. However, Israel's military advocate general recently announced that no criminal charges would be filed against those involved, concluding that the incident did not meet the threshold for criminal prosecution.\n\nMinister Wong described this decision as \"insulting\" and \"completely inadequate.\" She emphasized that Australia expects full accountability for the deaths of humanitarian workers and that the current outcome falls short of those expectations. The Australian government has consistently called for a transparent and credible investigation, and now demands a higher level of responsibility than the internal military review has provided. The summoning of the ambassador signals a significant diplomatic protest, highlighting the seriousness with which Australia views the matter.", "vocab": [{"word": "prosecute", "definition": "to officially accuse someone of a crime and try to prove them guilty in court."}, {"word": "displeasure", "definition": "a feeling of annoyance or disapproval."}, {"word": "condemnation", "definition": "strong disapproval; a statement of severe criticism."}, {"word": "humanitarian", "definition": "concerned with or seeking to promote human welfare."}, {"word": "accountability", "definition": "the fact or condition of being responsible for one's actions and being expected to explain them."}, {"word": "inadequate", "definition": "not enough or not good enough."}, {"word": "diplomatic protest", "definition": "a formal expression of disapproval by one government to another."}]}, "Advanced": {"text": "Australia has voiced profound outrage and disappointment following Israel's decision not to pursue criminal prosecutions against military personnel involved in the killing of Australian aid worker Zomi Frankcom and six colleagues in Gaza. Foreign Minister Penny Wong unequivocally stated her \"outrage\" at the outcome and announced the immediate summoning of Israel's ambassador to Canberra to convey Australia's severe diplomatic rebuke.\n\nThe tragic incident occurred on April 1st when a convoy belonging to the World Central Kitchen (WCK) humanitarian organization was struck by Israeli drone missiles in central Gaza. Zomi Frankcom, an Australian national, was among the seven aid workers who perished while delivering vital food supplies to a population on the brink of famine. The other victims included citizens from the United Kingdom, Poland, Palestine, and a dual US-Canadian national. This event drew widespread international condemnation and intensified scrutiny of Israel's conduct in the ongoing conflict, particularly regarding the safety of humanitarian operations.\n\nInitially, the Israel Defense Forces (IDF) acknowledged \"grave errors\" and expressed deep regret, attributing the strikes to a mistaken identification of the WCK vehicles as Hamas operatives. An internal IDF investigation led to the dismissal of two officers and formal reprimands for other senior commanders. However, the IDF's Military Advocate General, Major General Yifat Tomer-Yerushalmi, recently concluded that the findings did not warrant criminal charges, asserting that the incident did not meet the legal threshold for gross negligence or intent. This decision effectively closes the door on further legal action within the Israeli military justice system, a move that has been met with significant international skepticism.\n\nMinister Wong vehemently rejected this conclusion, describing it as \"insulting\" and \"completely inadequate.\" She underscored Australia's unwavering expectation of full accountability for the deaths of humanitarian workers, particularly those operating in conflict zones under established deconfliction protocols. The protection of aid workers is a fundamental principle of international humanitarian law, and their targeting, even if accidental, demands rigorous investigation and appropriate legal consequences. The Australian government has consistently advocated for a transparent, credible, and independent investigation, arguing that an internal military review, while a first step, has proven insufficient in delivering the necessary justice.\n\nThe summoning of Ambassador Amir Maimon represents a significant escalation of diplomatic pressure, signaling Australia's profound dissatisfaction and its demand for a more robust form of redress. This diplomatic move highlights the broader international concern regarding the protection of aid workers and adherence to international humanitarian law amidst the hostilities in Gaza. The incident has strained bilateral relations, with Australia reiterating its commitment to ensuring that those responsible are held to account through a process that is perceived as fair and just by the international community. Australia's stance reflects a broader global call for greater transparency and justice in incidents involving civilian casualties and humanitarian personnel during armed conflicts.", "vocab": [{"word": "profound", "definition": "very great or intense."}, {"word": "prosecutions", "definition": "the institution and conducting of legal proceedings against someone in respect of a criminal charge."}, {"word": "unequivocally", "definition": "in a way that leaves no doubt; unambiguously."}, {"word": "diplomatic rebuke", "definition": "a strong, formal expression of disapproval or criticism from one government to another."}, {"word": "perished", "definition": "died, especially in a violent or sudden way."}, {"word": "scrutiny", "definition": "critical observation or examination."}, {"word": "deconfliction protocols", "definition": "agreed-upon procedures or systems to avoid accidental conflict or interference, especially in military operations or humanitarian aid delivery."}, {"word": "redress", "definition": "remedy or compensation for a wrong or grievance."}]}}, "questions": [{"q": "What is Australia's main concern regarding Israel's decision?", "a": "Australia is outraged and disappointed that Israel decided not to prosecute any military personnel for the killing of Australian aid worker Zomi Frankcom and six others."}, {"q": "Who was Zomi Frankcom, and what was she doing in Gaza?", "a": "Zomi Frankcom was an Australian aid worker for World Central Kitchen. She was in Gaza delivering vital food supplies to people in need when she was killed."}], "id": "ad943ab90a3", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cp87g29r718o?at_medium=RSS&at_campaign=rss", "published": "2026-08-20T07:04:21+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Ecuador intelligence chief and five Americans killed in Kenya helicopter crash", "excerpt": "Michele Sensi-Contugi, and his wife Stephany Hollihan among the seven people killed in the crash.", "levels": {"Beginner": {"text": "Michele Sensi-Contugi, and his wife Stephany Hollihan among the seven people killed in the crash.", "vocab": []}, "Intermediate": {"text": "Michele Sensi-Contugi, and his wife Stephany Hollihan among the seven people killed in the crash.", "vocab": []}, "Advanced": {"text": "Michele Sensi-Contugi, and his wife Stephany Hollihan among the seven people killed in the crash.", "vocab": []}}, "questions": [], "id": "aae260c416b", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/clylkv4z59vo?at_medium=RSS&at_campaign=rss", "published": "2026-08-20T06:32:15+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Champions League play-offs, first legs", "excerpt": "Featuring Celtic v LASK and six more matches", "levels": {"Beginner": {"text": "Featuring Celtic v LASK and six more matches", "vocab": []}, "Intermediate": {"text": "Featuring Celtic v LASK and six more matches", "vocab": []}, "Advanced": {"text": "Featuring Celtic v LASK and six more matches", "vocab": []}}, "questions": [], "id": "a65bfc3aef1", "source": "BBC Sport", "link": "https://www.bbc.co.uk/iplayer/live/bbcone?at_medium=RSS&at_campaign=rss", "published": "2026-08-20T07:26:45+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Munich Bids for 2028 Champions League Final", "excerpt": "Munich's city council has given its approval for a bid to host the prestigious 2028 UEFA Champions League final at the Allianz Arena.", "levels": {"Beginner": {"text": "The city of Munich wants to host a very big football game. This game is called the Champions League final. It would happen in the year 2028. The city council, which is like the city's government, said \"yes\" to try and get this game. \n\nIf Munich hosts the final, it will be played at the Allianz Arena. This is a famous football stadium in Munich. Munich has hosted this big game before, for example, in 2012. Hosting the Champions League final is good for the city. Many football fans from all over the world come to watch. This brings a lot of visitors and money to Munich. \n\nThe Champions League is Europe's most important club football competition. Teams from different countries play against each other to win. A group called UEFA decides which city will host the final game. Munich hopes its bid will be chosen for 2028.", "vocab": [{"word": "host", "definition": "To provide the place for an event or party."}, {"word": "final", "definition": "The last game or match in a competition, which decides the winner."}, {"word": "council", "definition": "A group of people chosen to make decisions for a city or area."}, {"word": "stadium", "definition": "A large building, usually without a roof, where sports events are held."}, {"word": "competition", "definition": "An organized event in which people or teams try to win."}]}, "Intermediate": {"text": "The German city of Munich has officially approved its intention to bid for the right to host the 2028 UEFA Champions League final. The city council gave its endorsement, signaling Munich's strong desire to bring Europe's most prestigious club football event back to the Bavarian capital.\n\nShould Munich's bid be successful, the grand finale would take place at the iconic Allianz Arena. This modern stadium, known for its distinctive exterior and capacity for over 75,000 spectators, is home to FC Bayern Munich and has a proven track record of hosting major international football matches. Munich previously hosted the Champions League final in 2012, when Chelsea famously defeated Bayern Munich on penalties in their home stadium.\n\nHosting an event of this magnitude offers significant benefits to the host city. It attracts tens of thousands of international visitors, boosting tourism, local businesses, and the hospitality sector. Furthermore, it enhances the city's global profile and reputation as a premier destination for major sporting events. The UEFA Champions League final is watched by hundreds of millions worldwide, providing unparalleled global exposure.\n\nUEFA, European football's governing body, will ultimately make the decision on the host city for the 2028 final. Cities submit detailed bids outlining their facilities, infrastructure, and ability to manage such a large-scale event. Munich's rich history of successfully organizing major tournaments, including FIFA World Cup matches, positions it as a formidable contender.", "vocab": [{"word": "approved", "definition": "To officially agree to something or say that something is acceptable."}, {"word": "endorsement", "definition": "Official support or approval for something."}, {"word": "prestigious", "definition": "Respected and admired as important or of high quality."}, {"word": "iconic", "definition": "Very famous and recognized, often representing something important."}, {"word": "magnitude", "definition": "The great size or importance of something."}, {"word": "reputation", "definition": "The opinion that people generally have about someone or something."}]}, "Advanced": {"text": "The city of Munich has taken a significant step towards securing the hosting rights for the 2028 UEFA Champions League final, with its city council formally endorsing a bid. This strategic move underscores Munich's ambition to once again welcome one of the most prestigious events in the global sporting calendar, leveraging its world-class infrastructure and proven track record in staging major international competitions.\n\nIf successful, the climactic match of Europe's premier club football tournament would be held at the state-of-the-art Allianz Arena. This architecturally distinctive stadium, with a seating capacity exceeding 75,000, has previously demonstrated its capability to host high-profile fixtures, including the 2012 Champions League final where Chelsea triumphed over local favorites Bayern Munich. The venue's modern amenities, coupled with Munich's robust public transport network and extensive accommodation options, present a compelling case for UEFA.\n\nHosting the Champions League final is not merely about football; it's a powerful economic impetus and a significant boost to a city's international profile. The event draws tens of thousands of affluent international visitors, generating substantial revenue for the hospitality, retail, and tourism sectors. Moreover, the final's global television audience, which often surpasses hundreds of millions, offers unparalleled marketing and branding opportunities for the host city, solidifying its reputation as a vibrant, capable, and attractive destination.\n\nUEFA, as the ultimate decision-maker, evaluates bids based on a stringent set of criteria, encompassing stadium quality, logistical capabilities, security provisions, fan experience, and governmental support. Munich's consistent success in organizing major sporting events, including matches for the FIFA World Cup and the UEFA European Championship, positions it as a formidable and reliable candidate. The city's proactive endorsement of the bid signals a unified civic commitment, which is often a crucial factor in UEFA's selection process. The formal submission and subsequent evaluation by UEFA will determine if Munich will indeed be the stage for the 2028 continental club football showpiece.", "vocab": [{"word": "endorsing", "definition": "Giving official approval or support to something, often publicly."}, {"word": "underscores", "definition": "Emphasizes the importance of something; highlights."}, {"word": "leveraging", "definition": "Using something to const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
