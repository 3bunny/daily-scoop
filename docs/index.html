od players. But Paul Skenes says he still believes in the team. He thinks the Pirates can be a good team in the future. He is a young player with a lot of talent. His belief is important because he is a big part of the team's future. He wants to help the Pirates win. His words give hope to fans and other players. He wants to stay and build a winning team in Pittsburgh. This shows he is committed to the Pirates.", "vocab": [{"word": "player", "definition": "A person who plays a sport or game."}, {"word": "team", "definition": "A group of people who play a sport or game together."}, {"word": "believe", "definition": "To think that something is true or real."}, {"word": "future", "definition": "The time that is to come."}, {"word": "hope", "definition": "A feeling that something good will happen."}, {"word": "committed", "definition": "Dedicated to a cause or activity."}]}, "Intermediate": {"text": "Paul Skenes, the highly-touted rookie pitcher for the Pittsburgh Pirates, has publicly affirmed his belief in the team's long-term potential as the Major League Baseball trade deadline approaches. The trade deadline, typically at the end of July, is a critical period when teams decide whether to buy players to strengthen their roster for a playoff push or sell veteran players to acquire younger prospects for future rebuilding efforts. Teams often make these strategic decisions based on their current standing and future outlook.\n\nThe Pirates have experienced a challenging season, often hovering below a .500 winning percentage and struggling to compete consistently in their division. This performance has led to widespread speculation that the team might opt to trade some of its established players, particularly those on expiring contracts or with high trade value. Such a strategy would signal a focus on the future rather than a push for the current season's playoffs, aiming to restock their farm system with promising young talent.\n\nHowever, Skenes, who made his much-anticipated MLB debut earlier this year and has quickly become a cornerstone of the pitching staff, offers a different perspective. His declaration of faith in the organization's trajectory is significant. As a top prospect and a key component of the Pirates' future, his commitment sends a powerful message to both the fanbase and the clubhouse. It suggests that despite current struggles or potential roster changes, there is a core belief among important players that Pittsburgh can develop into a competitive team. His presence and positive outlook are vital for maintaining morale and fostering a winning culture as the team navigates this crucial period, hoping to build around young stars like Skenes. His words provide a beacon of hope for a fanbase eager for sustained success, reinforcing the idea that the team's future remains bright with talent like his.", "vocab": [{"word": "prospect", "definition": "A player who has a good chance of becoming a successful professional athlete."}, {"word": "deadline", "definition": "A specific time or date by which something must be completed."}, {"word": "affirmed", "definition": "Stated strongly and publicly that something is true."}, {"word": "speculation", "definition": "Ideas or guesses about something that is not known for sure."}, {"word": "cornerstone", "definition": "A very important part or foundation of something."}, {"word": "trajectory", "definition": "The path or direction that something is moving or developing."}, {"word": "morale", "definition": "The confidence, enthusiasm, and discipline of a person or group at a particular time."}]}, "Advanced": {"text": "As the Major League Baseball trade deadline looms, signaling a pivotal moment for franchises to recalibrate their strategies, Paul Skenes, the Pittsburgh Pirates' prodigious rookie pitcher, has unequivocally voiced his enduring belief in the team's long-term vision and potential. The trade deadline, typically observed in late July, represents a critical juncture where teams must make consequential decisions: either bolster their current roster with acquisitions to fortify a playoff contention bid or divest veteran assets in exchange for promising prospects, thereby committing to a future-oriented rebuilding phase. For a team like the Pirates, which has historically operated with a more conservative payroll and often finds itself in a developmental cycle, this decision carries significant implications.\n\nThe Pirates have navigated a season marked by inconsistency, frequently oscillating around the .500 mark and struggling to establish sustained competitiveness within their division. This middling performance has fueled considerable speculation among analysts and fans alike that the organization might opt to become \"sellers\" at the deadline. This would entail trading valuable, established players—particularly those nearing the end of their contracts or possessing high market value—to acquire a deeper pool of young talent for their farm system. Such a move, while potentially sacrificing immediate competitiveness, is often viewed as a pragmatic approach for teams aiming to construct a sustainable winning foundation over several years.\n\nYet, Skenes, who burst onto the MLB scene with immense fanfare and has rapidly solidified his status as a potential ace, presents a counter-narrative to the prevailing sentiment of a team in flux. His public affirmation of faith in the Pirates' trajectory is profoundly significant. As the consensus top pitching prospect in baseball and a foundational piece of the franchise's future, his commitment transcends mere platitudes. It serves as a powerful declaration to the entire organization, from the front office to the clubhouse, and most importantly, to a long-suffering fanbase. Skenes's belief suggests that despite the immediate challenges and the potential for roster upheaval, there is an internal conviction that Pittsburgh is on the cusp of cultivating a genuinely competitive squad. His presence, coupled with his resolute optimism, is imperative for fostering a cohesive team culture and maintaining morale during a period of strategic uncertainty. It underscores the notion that even if the team undergoes short-term adjustments, the long-term vision, anchored by talents like Skenes, remains robust and aspirational. His statement implicitly challenges the narrative of perpetual rebuilding, instead framing the current period as a necessary step towards sustained excellence. For a franchise often perceived as a stepping stone for talent, Skenes's vocal commitment offers a refreshing counterpoint, suggesting a genuine desire to be part of the solution in Pittsburgh. This kind of internal fortitude from a key player can be instrumental in attracting and retaining other talent, ultimately shaping the team's identity for years to come.", "vocab": [{"word": "prodigious", "definition": "Remarkably or impressively great in extent, size, or degree."}, {"word": "unequivocally", "definition": "In a way that leaves no doubt; unambiguously."}, {"word": "recalibrating", "definition": "Adjusting or fine-tuning a strategy or approach."}, {"word": "consequential", "definition": "Important; significant."}, {"word": "divest", "definition": "To sell off assets (like players) for financial or strategic reasons."}, {"word": "platitudes", "definition": "Statements that are obvious, unoriginal, or used too often to be interesting or thoughtful."}, {"word": "imperative", "definition": "Of vital importance; crucial."}, {"word": "fortitude", "definition": "Courage in pain or adversity."}]}}, "questions": [{"q": "What is the main topic of the article?", "a": "The main topic is Paul Skenes's belief in the Pittsburgh Pirates' future as the MLB trade deadline approaches."}, {"q": "What are the two main strategic options teams face at the MLB trade deadline?", "a": "Teams can either acquire players to strengthen their roster for a playoff push (buy) or trade veteran players for younger prospects for future rebuilding efforts (sell)."}], "id": "a0cb1224ecf", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMizgFBVV95cUxQaVNLdUNpeEd4MmpLQnZGcTUtUjV4LWVlaDJHNERUUEk5QVVIMmx2MzlvVzA5VkNqNlhFWkwwUVdvZHd3Q2I4RUVWTUZsSGt2RER0OHhfXy05ZXE5dDFKUTlocnFUSmdUb3ZjdHJySUFSSTFRQ29OemxiaUJNMmZNQ21jYWtIX25CVXBuM1JNa3ZSVEU4YU1DU0ZRWVZZOTQ4d3UtOWJpdnkwazZUNTdiY0RqY3hQS0hTbEhiZXpnOFc0Q2ZodGV2M1Mxdm9Ndw?oc=5", "published": "2026-08-02T07:31:32+09:00", "category": "business", "category_title": "Business"}, {"headline": "Guardians Acquire Yoho, Perkins in Trade with Brewers", "excerpt": "The Cleveland Guardians have completed a trade, acquiring players Craig Yoho and Blake Perkins from the Milwaukee Brewers to strengthen their roster.", "levels": {"Beginner": {"text": "The Cleveland Guardians baseball team has made a trade. They got two new players. Their names are Craig Yoho and Blake Perkins. These players came from another team, the Milwaukee Brewers. This is big news for the Guardians.\n\nIn baseball, teams often trade players. This means one team sends players to another team. Teams do this to make their team stronger and better. They want to win more games and try to be the best team. When a team gets new players, it can help them in many ways.\n\nCraig Yoho and Blake Perkins will now play for the Guardians. They will join their new teammates very soon. The Guardians hope these new players will help them play better and score more runs. This trade is a way for the team to get new talent and improve their chances of winning. It is a common thing in sports for teams to change their players. The leaders of the Guardians decided this trade was a good move for their team. They are always looking for ways to build a winning team for their fans.", "vocab": [{"word": "team", "definition": "a group of people who play a sport together."}, {"word": "trade", "definition": "when teams exchange players."}, {"word": "players", "definition": "people who play a sport."}, {"word": "join", "definition": "to become a part of a group."}, {"word": "improve", "definition": "to make something better."}, {"word": "winning", "definition": "getting first place or being the best."}]}, "Intermediate": {"text": "The Cleveland Guardians have announced a recent player transaction, acquiring two new athletes, Craig Yoho and Blake Perkins, from the Milwaukee Brewers. This move is part of the team's ongoing strategy to strengthen its roster and enhance its competitive position in the league. Such trades are a common occurrence in professional sports, allowing teams to adjust their lineup and talent pool.\n\nIn professional baseball, trades are a fundamental aspect of roster management. Teams frequently exchange players, prospects (young players still developing), or even draft picks to address specific needs, develop future talent, or balance their payroll. For the Guardians, bringing in Yoho and Perkins signifies an effort to bolster certain areas of their team. While the specific roles these players will fill are often determined after they join the organization, such acquisitions are typically made with a clear strategic purpose in mind, aiming to improve either immediate performance or long-term potential.\n\nCraig Yoho and Blake Perkins will now integrate into the Guardians' system. Depending on their current development stage and the team's immediate requirements, they could join either the major league club or one of its minor league affiliates. The Guardians' front office, led by its general manager, will assess their skills and determine the best placement for them to contribute effectively to the team's success. This trade reflects the continuous effort by sports franchises to optimize their player personnel and build a championship-contending squad. Fans will be eager to see how these new additions perform and impact the team's performance throughout the season, hoping they will help the Guardians achieve their goals.", "vocab": [{"word": "transaction", "definition": "an act of buying or selling something, or exchanging players."}, {"word": "acquiring", "definition": "getting or obtaining something."}, {"word": "strategy", "definition": "a plan of action designed to achieve a major goal."}, {"word": "roster", "definition": "a list of players on a team."}, {"word": "prospects", "definition": "young players who are still developing their skills."}, {"word": "bolster", "definition": "to support or strengthen."}, {"word": "integrate", "definition": "to combine with another to form a complete whole."}]}, "Advanced": {"text": "The Cleveland Guardians' front office has executed a strategic maneuver, officially announcing the acquisition of players Craig Yoho and Blake Perkins from the Milwaukee Brewers. This transaction underscores the continuous efforts by Major League Baseball franchises to refine their organizational philosophy and optimize player personnel in pursuit of competitive advantage within the league. Such moves are integral to modern sports management, reflecting a complex interplay of scouting, analytics, and financial considerations.\n\nTrades are an intrinsic component of professional sports, serving as a critical mechanism for roster construction and long-term planning. Teams engage in these exchanges to address immediate deficiencies, cultivate future talent through their farm system, manage salary cap considerations, or reconfigure their team's chemistry and skill set. For the Guardians, the decision to bring Yoho and Perkins into the fold suggests a targeted approach to bolster specific areas of their depth chart or to add promising prospects to their player development pipeline. The precise rationale behind such moves is often multifaceted, balancing immediate competitive aspirations with future organizational stability and the development of a robust talent pool. This particular acquisition, while not detailing the assets sent to Milwaukee, is typical of transactions aimed at enhancing overall team depth.\n\nUpon joining the Guardians, Yoho and Perkins will undergo a comprehensive evaluation by the coaching staff and player development department. Their placement within the organization – whether assigned to the major league club or one of its minor league affiliates – will be meticulously determined based on their current skill set, developmental trajectory, and the team's pressing needs. Such decisions are pivotal in maximizing a player's potential and ensuring their seamless integration into the team's strategic framework. The general manager and his team are constantly assessing the market for opportunities to enhance the club's overall talent pool, often looking for players who fit a specific mold or address a particular weakness. The long-term vision of the franchise heavily influences these personnel decisions.\n\nThis latest trade exemplifies the dynamic nature of professional baseball, where strategic player movement is a constant. It reflects a proactive stance by the Guardians to maintain a competitive edge and build a sustainable winning culture. The success of such acquisitions is often measured not just by immediate performance but by their long-term contributions to the franchise's overarching objectives, including sustained competitiveness and the development of homegrown talent. Fans and analysts alike will closely monitor the progress of Yoho and Perkins, anticipating how their contributions will shape the Guardians' trajectory in the current and upcoming seasons. The implications of these personnel decisions can resonate throughout an organization for years, influencing everything from on-field performance to fan engagement and the overall perception of the team's management.", "vocab": [{"word": "strategic maneuver", "definition": "a carefully planned action or movement designed to achieve a specific goal."}, {"word": "acquisition", "definition": "the act of gaining possession of something, in this case, players."}, {"word": "organizational philosophy", "definition": "the fundamental beliefs and principles that guide an organization's actions and decisions."}, {"word": "intrinsic component", "definition": "an essential or natural part of something."}, {"word": "cultivate", "definition": "to develop or improve (a skill, talent, or quality)."}, {"word": "depth chart", "definition": "a list of players at each position, ranked by their skill or importance."}, {"word": "developmental trajectory", "definition": "the path or course of growth and improvement over time."}, {"word": "implications", "definition": "the possible results or effects of an action or decision."}]}}, "questions": [{"q": "Which two players did the Cleveland Guardians acquire in the trade?", "a": "The Cleveland Guardians acquired Craig Yoho and Blake Perkins."}, {"q": "What is one general reason why baseball teams make trades?", "a": "Baseball teams make trades to strengthen their roster, get new talent, address specific needs, or improve their chances of winning."}], "id": "ab708739227", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxPaW84R0w5MVJ2NkdHdmxfUGszb3A1Q1R2eTFGOUZwSm9WYjZweWlwZEtjY205cjMtN0RTM3lyM1JCWUFYT21SVlM1ODBPVlNad1MxYkJkTk1LRlppeXZ6OW9NOEI2VzdhT05jVURrX1I5Y01XeG9fS3hnRkdVbkhjSjF5TjF6VVo5QlRqaG1udWlPMVBEZ3dIQ3FwV1ZXd09naS1HZFZyRVg1cF9mZVlIQTlaUXNGVWxlUk1wVngtNTh2ZjBfU0JkTDB6V2VGN1BLaFREV2JxcEpuSFZCcmgtYmd2RTMwWExYME03dXlodHBzRVROeHFiSllWOEw?oc=5", "published": "2026-08-02T07:22:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Wall Street Watches Kevin Warsh: Market Indicator Reveals Trust", "excerpt": "Financial markets are watching Kevin Warsh; a key indicator will reveal if Wall Street trusts his economic views.", "levels": {"Beginner": {"text": "Kevin Warsh is an important person in the world of money. He used to work at the Federal Reserve, which is like America's main bank. The Federal Reserve makes big decisions about money, like how much it costs to borrow. Mr. Warsh often talks about the economy, which is how money and goods are made and used in the country. He sometimes says very strong things about what he thinks will happen next. People call this \"talking a big game.\"\n\nWall Street is where many big banks and investors work. They listen closely to what people like Mr. Warsh say. But do they really believe him? There is a special \"market indicator\" that will show us. An indicator is like a sign or a tool that helps people understand something. This market indicator shows what investors are actually doing with their money. If the indicator moves in a way that matches what Mr. Warsh says, it means Wall Street trusts his ideas. If it doesn't move much, or moves differently, it might mean they don't trust him as much.\n\nSo, this sign will tell us if Wall Street thinks Mr. Warsh is right about the economy. What Wall Street does can influence many things, so knowing if they believe him is important.", "vocab": [{"word": "Federal Reserve", "definition": "America's main bank that helps manage the country's money."}, {"word": "Economy", "definition": "How money and goods are made and used in a country."}, {"word": "Wall Street", "definition": "The part of the financial world where big banks and investors work."}, {"word": "Indicator", "definition": "A sign or a tool that shows how something is doing."}, {"word": "Trust", "definition": "To believe that someone or something is honest and reliable."}, {"word": "Influence", "definition": "To have an effect on how someone thinks or acts."}]}, "Intermediate": {"text": "Kevin Warsh, a former governor of the Federal Reserve, is a prominent voice in U.S. economic discussions. The Federal Reserve serves as the nation's central bank, responsible for setting monetary policy, including interest rates, to manage inflation and promote economic growth. Warsh is known for expressing strong opinions on the economy's future, often described as \"talking a big game\" due to his confident pronouncements.\n\nHis insights draw significant attention from Wall Street, the hub of the financial industry, where investors and analysts constantly seek guidance on market direction. However, the true measure of his influence and credibility isn't just in his words, but in how financial markets respond. A specific \"market indicator\" is being watched closely to serve as a barometer for investor sentiment regarding Warsh's economic outlook.\n\nMarket indicators are various data points, such as stock indexes, bond yields, or commodity prices, that reflect the collective belief and actions of investors. If this particular indicator moves in alignment with Warsh's predictions, it suggests that Wall Street is factoring his views into their investment strategies. Conversely, if the indicator shows little reaction or moves in a contrary direction, it implies a degree of skepticism or a divergence of opinion among market participants.\n\nThis dynamic is important because when influential figures like Warsh speak, their perspectives can shape expectations for inflation, economic growth, and future actions by the Federal Reserve. Wall Street's collective trust, as revealed by the market indicator, can have significant implications for investment flows and broader economic stability, highlighting the ongoing interplay between expert commentary and the responsive nature of financial markets.", "vocab": [{"word": "Governor", "definition": "A high-ranking official, here at the Federal Reserve."}, {"word": "Monetary policy", "definition": "Actions taken by a central bank to control the money supply and interest rates."}, {"word": "Pronouncements", "definition": "Formal or important statements."}, {"word": "Barometer", "definition": "Something that shows or indicates changes in something else."}, {"word": "Sentiment", "definition": "A general feeling or opinion, especially among a group of people."}, {"word": "Credibility", "definition": "The quality of being trusted and believed in."}, {"word": "Implications", "definition": "Possible future effects or results of a decision or event."}]}, "Advanced": {"text": "Kevin Warsh, a distinguished former governor of the Federal Reserve, remains an influential voice in the intricate discourse surrounding U.S. economic policy and financial markets. His tenure at the central bank, particularly during the tumultuous period of the 2008 financial crisis, endowed him with a profound understanding of monetary policy mechanisms and market dynamics. Today, Warsh is known for articulating robust, often contrarian, perspectives on the nation's economic trajectory, inflation outlook, and the strategic direction of the Federal Reserve. The phrase \"talking a big game\" aptly captures his confident, assertive communication style, which frequently challenges prevailing economic narratives.\n\nThese pronouncements carry considerable weight, garnering significant attention from institutional investors, analysts, and policymakers across Wall Street. Given his pedigree, Warsh's insights are not merely observations but potential catalysts for shifts in market expectations. However, the ultimate arbiter of his analytical prowess and the perceived validity of his views is not rhetorical assent, but the tangible reaction of the financial markets themselves. A specific \"market indicator\" has emerged as a crucial barometer, signaling whether Wall Street genuinely trusts Warsh's economic assessments.\n\nThis indicator is likely a sophisticated metric sensitive to investor expectations regarding monetary policy shifts, inflation hedging strategies, or specific asset classes that Warsh's commentary might impact. For instance, movements in Treasury yields, the performance of inflation-protected securities (TIPS), or sector-specific equity valuations could all serve as proxies for market sentiment. If the indicator affirms Warsh's stance, it suggests a broad consensus is forming around his outlook, potentially influencing capital flows, risk assessments, and corporate strategies. Such alignment could reinforce existing market trends or even precipitate new ones.\n\nConversely, if the indicator remains unresponsive or moves counter to his implied direction, it signals that investors are discounting his views. This could be due to conflicting macroeconomic data, alternative expert analyses, or a perception that Warsh's arguments are out of sync with the prevailing market narrative. In an era characterized by heightened economic uncertainty and intense scrutiny of central bank independence and efficacy, voices like Warsh's contribute substantially to the public and professional debate. The market's reaction, as reflected in this chosen indicator, provides a tangible, albeit often nuanced, feedback loop on the resonance and perceived accuracy of such expert commentary. Ultimately, while Warsh's rhetoric may be compelling, the collective wisdom, or skepticism, of the financial markets delivers the definitive judgment on his economic insights.", "vocab": [{"word": "Pedigree", "definition": "The background or history of a person, especially showing high quality or experience."}, {"word": "Trajectory", "definition": "The path or course that something is following."}, {"word": "Arbiter", "definition": "A person or agency with the power to decide a dispute or judge an issue."}, {"word": "Consensus", "definition": "A general agreement among a group of people."}, {"word": "Precipitate", "definition": "To cause an event or situation, typically a bad one, to happen suddenly, unexpectedly, or prematurely."}, {"word": "Efficacy", "definition": "The ability to produce a desired or intended result."}, {"word": "Nuanced", "definition": "Characterized by subtle shades of meaning or expression."}, {"word": "Discourse", "definition": "Written or spoken communication or debate."}]}}, "questions": [{"q": "What is Kevin Warsh's background, and what is the Federal Reserve?", "a": "Kevin Warsh is a former governor of the Federal Reserve. The Federal Reserve is the central bank of the United States, responsible for managing the country's money supply and setting monetary policy, such as interest rates."}, {"q": "How will Wall Street's trust in Kevin Warsh be measured, according to the article?", "a": "Wall Street's trust in Kevin Warsh will be measured by a specific 'market indicator.' This indicator reflects what investors are actually doing with their money and how they are reacting to his economic views."}], "id": "aac4a09c475", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipwFBVV95cUxPbVZvUTZaMHdvcmFxRDNzdEJlcllyRUFXbzc0YjhfUFVGaTVLZnQ3NXMtLVhlODhBOVhLS2Y0RGJuWGVyWHZyTDBXdHhERno5ZU1mSWZrUElaQ1BUMUpQNm90MmlaTVVuVFJjSG5sRXplRGp3TDUyLXZOZUhZNDU0Vm9mWWZtak1LUUlKMDlRZHpEM3dBUTlnSGZRblRBc2xWSkY0STZZMA?oc=5", "published": "2026-08-02T05:27:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "US Economy Grows Slowly as Mortgage Rates Reach One-Year High", "excerpt": "The American economy is expanding at a slower pace, while mortgage rates have reached their highest point in a year, impacting homebuyers.", "levels": {"Beginner": {"text": "The United States economy is growing slowly. This means that businesses are not making much more money, and people are not buying many more things. Experts say the economy is moving at a \"sluggish pace.\"\n\nAt the same time, it is now more expensive to buy a house. The money people borrow to buy a home is called a mortgage. The cost of borrowing this money is called the mortgage rate. These rates have gone up a lot. They are now the highest they have been in a whole year.\n\nWhen mortgage rates are high, it costs more each month to pay for a house. This can make it harder for people to buy new homes. It can also make the housing market slow down.\n\nThe government wants the economy to grow steadily. It also wants prices to stay stable. High mortgage rates are often a way to try and slow down rising prices, also called inflation. But this can also make the economy grow more slowly. So, the US economy is facing some challenges right now.", "vocab": [{"word": "economy", "definition": "How a country makes and uses money and goods."}, {"word": "expands", "definition": "To grow bigger or increase."}, {"word": "sluggish", "definition": "Moving or working slowly."}, {"word": "mortgage", "definition": "A loan from a bank to buy a house."}, {"word": "rate", "definition": "The cost of borrowing money, usually shown as a percentage."}, {"word": "highest", "definition": "At the top level; more than any other."}]}, "Intermediate": {"text": "The United States economy is currently experiencing a period of slower growth, described by experts as a \"sluggish pace.\" This means that the overall production of goods and services, measured by the Gross Domestic Product (GDP), is increasing but not as quickly as many would hope. Slower economic expansion can affect job creation, consumer spending, and business investment, leading to concerns about the overall health of the market.\n\nA key factor influencing the economy is the rising cost of borrowing money. Mortgage rates, which are the interest rates applied to loans used to purchase homes, have reached their highest level in a year. This significant increase makes homeownership more expensive for potential buyers, as their monthly payments will be higher. As a result, the housing market often sees a slowdown in sales and construction when rates are elevated, making it harder for people to afford new properties.\n\nThe Federal Reserve, the central bank of the U.S., plays a crucial role in these trends. To combat inflation—the general increase in prices for goods and services—the Federal Reserve has been raising its benchmark interest rates. While this strategy aims to cool down an overheating economy and bring prices under control, it also leads to higher borrowing costs across the board, including for mortgages, credit cards, and business loans.\n\nThe current economic situation presents a delicate balance for policymakers. They aim to reduce inflation without pushing the economy into a recession, which is a significant and prolonged downturn. The combination of sluggish economic growth and high mortgage rates suggests that both consumers and businesses are feeling the effects of these efforts to stabilize the economy, creating uncertainty for future financial planning and investment decisions.", "vocab": [{"word": "sluggish pace", "definition": "A slow speed of growth or activity."}, {"word": "Gross Domestic Product (GDP)", "definition": "The total value of goods and services produced in a country."}, {"word": "mortgage rates", "definition": "The interest percentage charged on a loan to buy a house."}, {"word": "Federal Reserve", "definition": "The central bank of the United States, which controls money and banking."}, {"word": "inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "housing market", "definition": "The system of buying and selling homes."}, {"word": "recession", "definition": "A period of economic decline, when trade and industrial activity are reduced."}]}, "Advanced": {"text": "The United States economy is currently navigating a period characterized by a \"sluggish pace\" of expansion, a development that is drawing close scrutiny from economists and policymakers alike. Recent data indicates that the nation's Gross Domestic Product (GDP), the broadest measure of economic activity, is growing, but at a rate that suggests underlying pressures. This subdued growth trajectory can impact various facets of the economy, including job creation, consumer confidence, and corporate investment strategies, potentially signaling a broader deceleration from the robust post-pandemic recovery.\n\nCompounding this moderate economic expansion is the significant escalation in mortgage rates, which have soared to their highest point in a year. These elevated borrowing costs directly affect the affordability of housing, presenting substantial challenges for prospective homebuyers and those looking to refinance existing loans. Higher interest rates translate into larger monthly mortgage payments, effectively reducing purchasing power and dampening demand within the residential real estate sector. Consequently, the housing market often experiences a deceleration in sales volume and new construction starts, which can have ripple effects throughout related industries, from building materials to home furnishings.\n\nThe primary driver behind these rising interest rates is the Federal Reserve's aggressive monetary policy. In its sustained effort to curb persistent inflation—the widespread increase in prices for goods and services—the U.S. central bank has systematically raised its benchmark interest rate. This strategy aims to cool an overheated economy by making borrowing more expensive, thereby reducing overall demand and inflationary pressures. However, a direct consequence of this tightening monetary stance is the upward pressure on a wide range of lending products, including mortgages, auto loans, and business credit, impacting both consumer and corporate balance sheets.\n\nPolicymakers are currently walking a tightrope, attempting to achieve a \"soft landing\" – a scenario where inflation is brought under control without triggering a severe economic downturn or recession. The interplay between decelerating economic growth and elevated borrowing costs creates a complex environment. Businesses may become more cautious about hiring and expansion, while consumers might scale back discretionary spending due to increased financial burdens and uncertainty about future economic prospects. The resilience of the labor market, despite the slower growth, remains a critical indicator, but the combination of a sluggish economy and high mortgage rates underscores the ongoing challenges in achieving both price stability and robust economic expansion. The trajectory of these key economic indicators will be closely watched as the Federal Reserve weighs its future policy decisions, with potential implications for global financial markets.", "vocab": [{"word": "sluggish pace", "definition": "A noticeably slow rate of progress or activity, often indicating weakness."}, {"word": "Gross Domestic Product (GDP)", "definition": "The total monetary or market value of all the finished goods and services produced within a country's borders in a specific time period."}, {"word": "mortgage rates", "definition": "The percentage of interest charged by a lender on a loan used to purchase real estate, typically a house."}, {"word": "monetary policy", "definition": "Actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "inflation", "definition": "A sustained increase in the general price level of goods and services in an economy over a period of time, resulting in a fall in the purchasing value of money."}, {"word": "affordability", "definition": "The degree to which something is affordable, measured by its cost relative to the amount that a person is able to pay."}, {"word": "residential real estate sector", "definition": "The segment of the property market that deals with the buying, selling, and renting of homes and housing."}, {"word": "soft landing", "definition": "A scenario in which the economy slows down enough to avoid high inflation but not so much as to cause a recession."}]}}, "questions": [{"q": "What is the current state of the US economy's growth?", "a": "The US economy is expanding at a sluggish (slow) pace."}, {"q": "What has happened to mortgage rates in the past year?", "a": "Mortgage rates have hit their highest level in a year."}], "id": "a2ef0b9ffde", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi6AFBVV95cUxQaFMtaURFZk5SWi1rak1IZUk4SXlPd1FybHR4R0pUa3lZYm54YlpENVhhVU5IaEg5YUdFYzIxRjVLZnk3VlFYdnB3TThoWnNkY3Y5U0tsbjQwbFgzUHR5Rnpwb1VtZGVLQzI2akp5VnUxem9DQU5MY3ZZX1ZoU0J1OHB6OTVrZGM0a01qWnNvYUtyZmE5NjFVbkJkODNZNUhJV2lBZnRXSTN0WmVfeExUNDNQRWx4b0tlVHNfSXd5Ujd5M19zU0RRQ1dqNHJtOTItd0llSjgxX2VpUnpXMUYzM0pEZjBJYmZi?oc=5", "published": "2026-08-02T05:04:40+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Tourist Plane Crash in Peru Kills 13 Near Nazca Lines", "excerpt": "A small tourist plane crashed near Peru's famous Nazca Lines, killing 13 people, including visitors and crew members.", "levels": {"Beginner": {"text": "A small plane crashed in Peru, a country in South America. This sad event happened near the Nazca Lines. The Nazca Lines are very old and famous drawings on the ground in the desert. Many people visit Peru to see these big drawings from an airplane.\nThe plane that crashed was a tourist plane. It was taking people on a sightseeing flight to see the lines from the sky. There were 13 people on the plane. Sadly, all 13 people died in the crash. This includes the pilot, who was flying the plane, and the passengers, who were tourists.\nLocal news reports said the plane crashed while it was flying over the archaeological site. This site is a special place where old things are found.\nThe accident happened in the Nazca region of Peru. Now, officials are working to find out why the plane crashed. They will investigate to understand what caused this terrible accident. It is a very sad day for the families of the people who died and for Peru.", "vocab": [{"word": "crashed", "definition": "fell from the sky and hit the ground very hard."}, {"word": "drawings", "definition": "pictures made on a surface."}, {"word": "tourist", "definition": "a person who travels to visit a place for pleasure."}, {"word": "sightseeing", "definition": "visiting interesting places, especially as a tourist."}, {"word": "pilot", "definition": "the person who flies an aircraft."}, {"word": "investigate", "definition": "to try to find out the facts about something."}]}, "Intermediate": {"text": "A small tourist aircraft crashed in Peru, resulting in the deaths of all 13 people on board. The tragic incident occurred near the world-renowned Nazca Lines, an ancient archaeological site famous for its massive geoglyphs etched into the desert floor.\nThe plane, reportedly a Cessna, was carrying passengers on a sightseeing tour over the Nazca Lines when it went down. Local reports confirmed that the victims included the pilot and 12 passengers. These passengers were likely international tourists eager to view the mysterious figures from an aerial perspective, a common way to experience the UNESCO World Heritage site.\nThe Nazca Lines are a series of enormous designs created by the ancient Nazca culture over 2,000 years ago. These impressive figures, which include animals, plants, and geometric shapes, are best appreciated from high above. This unique characteristic makes aerial tours a highly popular and almost essential activity for visitors to the region, offering a panoramic view of the intricate artwork.\nThe crash site is located in the Nazca region, south of Lima, the capital of Peru. Authorities have launched an immediate investigation to determine the cause of the accident. Aviation experts will meticulously examine the wreckage, review flight data recorders, and consider weather conditions to piece together what led to the fatal crash.\nThis incident marks a somber moment for Peru's tourism industry, especially for the Nazca area, which relies heavily on visitors drawn to its unique historical treasures. The families of the victims are being notified, and consular services are likely assisting with identification and repatriation. The full details of the investigation are expected to emerge in the coming weeks as experts work to understand this devastating event.", "vocab": [{"word": "incident", "definition": "an event or occurrence, often one that is unpleasant."}, {"word": "renowned", "definition": "famous for something."}, {"word": "archaeological site", "definition": "a place where people study old cultures by digging up objects and buildings."}, {"word": "geoglyphs", "definition": "large designs or motifs produced on the ground, typically by arranging stones or removing topsoil."}, {"word": "perspective", "definition": "a particular way of viewing things or a position from which something is seen."}, {"word": "intricate", "definition": "very complicated or detailed."}, {"word": "repatriation", "definition": "the process of returning someone to their own country."}]}, "Advanced": {"text": "A small sightseeing aircraft tragically crashed in Peru, claiming the lives of all 13 individuals on board. The fatal incident occurred in close proximity to the iconic Nazca Lines, a UNESCO World Heritage site renowned for its enigmatic geoglyphs etched across the arid landscape.\nThe ill-fated plane, identified by local media as a Cessna 207, was reportedly conducting a routine aerial tour over the ancient wonders when it plummeted to the ground. Initial reports from local authorities confirm that the deceased include the pilot and 12 passengers, who were predominantly international tourists drawn to the unique opportunity of viewing the colossal desert figures from an elevated vantage point.\nThe Nazca Lines, a testament to the sophisticated engineering and artistic capabilities of the pre-Incan Nazca culture, comprise hundreds of designs spanning vast distances. These include stylized animals, geometric patterns, and anthropomorphic figures, whose precise purpose remains a subject of intense archaeological debate – theories range from astronomical calendars to ritualistic pathways or even astronomical observatories. Their sheer scale necessitates an aerial perspective for full appreciation, making flights over the site a cornerstone of regional tourism and a bucket-list item for many global travelers.\nThe crash site is situated in the Nazca region, approximately 400 kilometers south of the Peruvian capital, Lima. Peruvian aviation authorities have promptly initiated a comprehensive investigation into the circumstances surrounding the catastrophe. Experts from the Air Accident Investigation Commission (CIAA) will meticulously analyze the aircraft's wreckage, retrieve and interpret flight data recorders, and scrutinize air traffic control communications and prevailing meteorological conditions. The inquiry will also likely consider the aircraft's maintenance history, the operator's safety record, and the pilot's qualifications and flight hours.\nThis devastating event casts a somber shadow over Peru's vital tourism sector, particularly impacting the Nazca area, which is heavily reliant on the influx of visitors eager to explore its unparalleled historical legacy. The international nature of the casualties means that consular officials from various nations will be involved in assisting with victim identification, notification of next of kin, and the complex process of repatriation. Such incidents often trigger a review of existing safety protocols for aerial tours.\nWhile specific details regarding the cause of this particular crash are yet to emerge, incidents involving small aircraft in tourist areas sometimes prompt broader discussions about aviation safety regulations, particularly concerning older planes, maintenance schedules, and the frequency of flights in popular sightseeing corridors. The outcome of the ongoing investigation will be crucial not only for understanding this specific tragedy but also for potentially informing future safety enhancements and regulatory adjustments within Peru's aerial tourism industry, aiming to prevent similar occurrences.", "vocab": [{"word": "proximity", "definition": "nearness in space, time, or relationship."}, {"word": "enigmatic", "definition": "difficult to understand; mysterious."}, {"word": "plummeted", "definition": "fell straight down at high speed."}, {"word": "vantage point", "definition": "a position or place that provides a good view of something."}, {"word": "anthropomorphic", "definition": "attributing human characteristics or behavior to animals or inanimate objects."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very thoroughly."}, {"word": "scrutinize", "definition": "examine or inspect closely and thoroughly."}, {"word": "catastrophe", "definition": "an event causing great and often sudden damage or suffering; a disaster."}]}}, "questions": [{"q": "Where did the plane crash happen?", "a": "The plane crash happened in Peru, near the Nazca Lines archaeological site."}, {"q": "How many people died in the plane crash?", "a": "All 13 people on board the plane, including the pilot and passengers, died in the crash."}], "id": "a07e61deeec", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c70g132erlko?at_medium=RSS&at_campaign=rss", "published": "2026-08-02T07:34:20+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Three Killed in Moscow Restaurant Bombing", "excerpt": "A bomb attack at a Moscow restaurant has killed three people after a woman with explosives was stopped by a security guard.", "levels": {"Beginner": {"text": "A sad event happened in Moscow, Russia. A bomb exploded at a restaurant, and three people died. Security officials said a woman tried to go into the restaurant. She had explosives with her. A security guard saw her and stopped her. The bomb then went off. It is not clear if the woman also died or if she was arrested. This news comes from state media, which means government news channels reported it. Police and emergency services quickly went to the restaurant. They helped people and started to investigate what happened. People in Moscow are sad and worried about this event. Security in public places is very important to keep everyone safe.", "vocab": [{"word": "exploded", "definition": "blew up with a loud noise"}, {"word": "died", "definition": "stopped living"}, {"word": "explosives", "definition": "materials that can blow up"}, {"word": "stopped", "definition": "prevented from moving or continuing"}, {"word": "investigate", "definition": "to find out facts about something"}, {"word": "worried", "definition": "feeling anxious or concerned"}]}, "Intermediate": {"text": "Three people have been killed after a bomb detonated at a restaurant in Moscow, Russia. State media reported the incident, citing security officials who provided details about the attack. According to these officials, a woman attempted to enter the establishment carrying explosives. Her entry was reportedly thwarted by a vigilant security guard who intervened before she could fully gain access to the restaurant's interior. The explosives then detonated, causing the fatalities. It remains unclear at this time whether the woman herself was among the casualties or if she was apprehended by authorities following the blast. Emergency services, including police and medical teams, quickly arrived at the scene to assist the injured and begin an investigation into the circumstances surrounding the explosion. The area around the restaurant was secured, and forensic experts are now examining the site for clues. Such incidents raise concerns about public safety and security measures in busy urban centers. Authorities are expected to provide more information as their investigation progresses, aiming to understand the motive behind the attack and identify any other individuals involved.", "vocab": [{"word": "detonated", "definition": "exploded or caused to explode"}, {"word": "incident", "definition": "an event or occurrence, often one that is unpleasant"}, {"word": "attempted", "definition": "tried to do something"}, {"word": "thwarted", "definition": "prevented someone from accomplishing something"}, {"word": "vigilant", "definition": "keeping careful watch for possible danger or difficulties"}, {"word": "apprehended", "definition": "arrested someone for a crime"}, {"word": "forensic", "definition": "relating to the application of scientific methods to criminal investigation"}]}, "Advanced": {"text": "A tragic incident unfolded in Moscow, Russia, resulting in the deaths of three individuals after an explosive device was detonated at a local restaurant. The information was disseminated by state media outlets, which cited reports from security officials detailing the sequence of events. According to these official accounts, a woman attempted to gain entry into the establishment while in possession of explosives. Her endeavor was reportedly intercepted by a vigilant security guard, whose timely intervention prevented her from fully breaching the restaurant's premises. The device subsequently detonated, leading to the fatal casualties. The precise status of the woman involved—whether she perished in the blast or was taken into custody—has not yet been definitively confirmed by authorities. Following the explosion, a significant deployment of emergency services, including law enforcement and medical personnel, rapidly converged on the scene. Their immediate priorities were to provide assistance to any injured parties and to secure the perimeter for a comprehensive investigation. Forensic teams have commenced a meticulous examination of the blast site, gathering evidence that could shed light on the nature of the explosive, the perpetrator's identity, and any potential accomplices. This event underscores persistent concerns regarding urban security and the challenges of safeguarding public spaces against such acts of violence. Major cities globally often face the complex task of balancing open access with robust security measures. Authorities are expected to release further details as the investigation progresses, aiming to ascertain the motive behind this deadly attack and to ensure accountability for those responsible. The incident serves as a stark reminder of the unpredictable nature of such threats and the critical role of security personnel in mitigating potential harm.", "vocab": [{"word": "disseminated", "definition": "spread or dispersed (information) widely"}, {"word": "cited", "definition": "referred to (a source) as evidence or justification"}, {"word": "endeavor", "definition": "an attempt to achieve a goal"}, {"word": "intercepted", "definition": "prevented someone or something from reaching its intended destination"}, {"word": "breaching", "definition": "forcing an entry into or through something"}, {"word": "subsequently", "definition": "afterward; at a later time"}, {"word": "meticulous", "definition": "showing great attention to detail; very careful and precise"}, {"word": "mitigating", "definition": "making something less severe, serious, or painful"}]}}, "questions": [{"q": "How many people were killed in the Moscow restaurant incident?", "a": "Three people were killed."}, {"q": "What action did a security guard take that was mentioned in the news item?", "a": "A security guard stopped a woman who was trying to enter the restaurant with explosives."}], "id": "a9bb71021d4", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c86n4ljxp63o?at_medium=RSS&at_campaign=rss", "published": "2026-08-02T06:13:17+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Olympic Medalist Josh Kerr Wins Emotional 'Scrap' in Glasgow", "excerpt": "Olympic medalist Josh Kerr secured an emotional victory in a challenging, no-frills running race in his home country, Scotland.", "levels": {"Beginner": {"text": "Josh Kerr, a famous runner from Scotland, won a special race in Glasgow. It was a Saturday night and the race was called a \"scrap\" because it was very hard. It was like a fight, but with running.\n\nIn this race, there were no special helpers called \"pacers.\" Pacers usually run ahead to help athletes keep a fast speed. There were also no \"wave lights,\" which are lights that show runners how fast they should go. This meant Josh Kerr had to run with all his own strength and plan his own race.\n\nJosh Kerr is an Olympic medalist, which means he won a medal at the Olympic Games. Winning this race in Glasgow was very important to him. He was very emotional and happy when he crossed the finish line. He showed everyone that he is a strong and determined runner, especially when racing in his home country. He did not want anyone to beat him in this tough competition.", "vocab": [{"word": "Runner", "definition": "A person who runs, especially in races."}, {"word": "Won", "definition": "Got first place in a game or competition."}, {"word": "Race", "definition": "A competition of speed, often involving running or driving."}, {"word": "Hard", "definition": "Difficult; needing a lot of effort or strength."}, {"word": "Emotional", "definition": "Showing strong feelings like happiness or sadness."}, {"word": "Medalist", "definition": "An athlete who has won a medal in a competition."}]}, "Intermediate": {"text": "Olympic medalist Josh Kerr achieved an emotional victory in a unique running event held in Glasgow, Scotland. The race, colloquially dubbed a \"Saturday night scrap\" under \"Glasgow rules,\" presented a raw and direct challenge, distinct from the highly structured professional track races typically seen. This format often creates a more unpredictable and exciting contest for both athletes and spectators.\n\nThis particular competition was notable for its lack of standard athletic aids. There were no dedicated pacers, who are runners employed to set a specific speed for the competitors, nor were there wave lights, which are visual guides used to help athletes maintain a target pace. This meant that participants, including Kerr, had to rely purely on their individual strategy, competitive instinct, and physical endurance from start to finish. It was a true test of who could push hardest without external prompts.\n\nKerr, a renowned middle-distance runner and an Olympic bronze medalist, approached the event with immense determination. The \"scrap\" metaphor perfectly captured the intense, head-to-head nature of the contest, where every stride was a direct battle against his rivals. Winning on home soil, in front of a Scottish crowd, under these unvarnished conditions, clearly resonated deeply with him, manifesting in a visibly emotional reaction at the finish line. The roar of the crowd likely added to the intensity and personal significance of the moment.\n\nHis triumph underscored not only his athletic prowess but also his mental fortitude. It demonstrated his ability to excel when stripped of external assistance, emphasizing a fundamental competitive spirit that thrives in direct, challenging environments. For Kerr, this Glasgow win was more than just another race; it was a powerful statement of grit and a testament to his enduring will to win, especially in a setting that celebrated raw athletic combat.", "vocab": [{"word": "Achieved", "definition": "Successfully brought about or gained (a desired result or goal)."}, {"word": "Unique", "definition": "Being the only one of its kind; very special or unusual."}, {"word": "Distinct", "definition": "Clearly separate and different from something else."}, {"word": "Prowess", "definition": "Skill or expertise in a particular activity or field."}, {"word": "Determination", "definition": "Firmness of purpose; resolve; strong will."}, {"word": "Fortitude", "definition": "Courage in pain or adversity; mental and emotional strength."}, {"word": "Resonated", "definition": "Evoked or produced a strong feeling of empathy or sympathy; had a deep impact."}]}, "Advanced": {"text": "In a compelling departure from the meticulously orchestrated events often seen in elite athletics, Olympic medalist Josh Kerr secured a profoundly emotional victory in Glasgow, Scotland, in what was colloquially termed a \"Saturday night scrap\" governed by \"Glasgow rules.\" This particular contest was notable for its stripped-down nature, eschewing the technological and strategic aids common in high-level track and field, thereby emphasizing raw competitive spirit over precision pacing and external guidance.\n\nThe absence of dedicated pacers, who are typically employed to dictate tempo and ensure fast times, meant that athletes had to manage their own race strategy and energy expenditure from the gun. This placed a greater onus on individual judgment and the ability to react dynamically to competitors' moves. Similarly, the lack of wave lights – visual cues that guide runners to maintain a specific pace – removed an element of external assistance, forcing competitors to rely solely on their internal clock, tactical acumen, and sheer will. This created a more primal, head-to-head battle, where individual grit and direct confrontation took precedence over pre-planned race dynamics. The \"Glasgow rules\" moniker itself suggested an unyielding, no-holds-barred approach, characteristic of a fiercely contested local event that prioritizes direct competition.\n\nKerr, a formidable presence in middle-distance running and an Olympic bronze medalist, approached the event with an unwavering resolve. The \"scrap\" metaphor perfectly underscored the intense, unyielding competition, where every stride was a direct challenge to his rivals and a personal test of endurance. Winning on home soil, amidst a fervent Scottish crowd, under these uniquely unvarnished conditions, clearly resonated deeply with him. His visibly emotional reaction at the finish line was a testament to the profound personal significance of this triumph, perhaps a validation of his fundamental competitive drive beyond the pursuit of records or personal bests. It was const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
