are news about our local economy. It helps us understand who the key players are in our local work world.", "vocab": [{"word": "published", "definition": "made a book, magazine, or newspaper available for people to read."}, {"word": "special article", "definition": "a news story that is important or different from others."}, {"word": "companies", "definition": "groups of people who work together to make or sell things."}, {"word": "promotion", "definition": "moving to a higher position or job."}, {"word": "economy", "definition": "how money and jobs work in a country or area."}, {"word": "community", "definition": "all the people living in one area or town."}]}, "Intermediate": {"text": "On September 21, 2026, MassLive, a prominent local news outlet, released its latest \"People in Business\" feature. This recurring segment is dedicated to highlighting the achievements and career milestones of professionals within the local business community. It serves as an important platform for recognizing individuals who contribute significantly to the region's economic landscape.\n\nTypically, MassLive's \"People in Business\" articles spotlight various developments. These often include announcements of new hires in key positions, promotions within established companies, and individuals receiving awards or special recognition for their work. The feature also frequently covers entrepreneurs who have launched new ventures, or business leaders involved in significant community initiatives. By sharing these stories, MassLive aims to keep its readership informed about the dynamic nature of the local economy and the individuals driving its progress.\n\nThe purpose of such a feature extends beyond mere reporting. It fosters a sense of community among local professionals, allowing them to learn about their peers and potential collaborators. It also provides inspiration for aspiring business owners and employees, showcasing pathways to success within the local market. Recognizing these individuals not only celebrates their personal successes but also underscores the collective effort that drives economic growth and job creation in the area. For MassLive, publishing these features reinforces its commitment to local journalism, offering valuable insights into the people and organizations shaping the region's commercial future. This particular edition on September 21, 2026, continued that tradition, providing a snapshot of the vibrant local business scene and reinforcing the importance of local talent and enterprise.", "vocab": [{"word": "prominent", "definition": "important and well-known."}, {"word": "recurring segment", "definition": "a part of a newspaper or website that appears regularly."}, {"word": "milestones", "definition": "important events or stages in a person's career or life."}, {"word": "economic landscape", "definition": "the overall situation of business and money in an area."}, {"word": "entrepreneurs", "definition": "people who start their own businesses."}, {"word": "fosters", "definition": "helps to develop or grow."}, {"word": "enterprise", "definition": "a business or company, or the activity of starting businesses."}]}, "Advanced": {"text": "On September 21, 2026, MassLive, a leading digital news platform serving Western and Central Massachusetts, published its highly anticipated \"People in Business\" feature. This regular editorial segment is a cornerstone of its local coverage, meticulously chronicling the professional advancements, noteworthy achievements, and community contributions of individuals within the region's diverse business ecosystem. Far from a mere listing, these features offer valuable insights into the dynamic forces shaping the local economy and the human capital that propels it forward.\n\nThe \"People in Business\" articles typically encompass a broad spectrum of professional news. This includes announcements of significant executive appointments, strategic promotions within established corporations, and the recognition of individuals who have garnered prestigious industry awards or accolades. Furthermore, the feature often shines a light on innovative entrepreneurs launching groundbreaking ventures, as well as seasoned business leaders spearheading impactful civic or philanthropic initiatives. It also frequently highlights individuals transitioning into new roles, retiring after distinguished careers, or being appointed to significant board positions. By consistently documenting these developments, MassLive provides its readership with an essential barometer of the region's economic vitality and the talent pool driving its progress across various sectors, from manufacturing and technology to healthcare and retail.\n\nThe strategic rationale behind such a dedicated feature is multifaceted. Firstly, it serves as a vital mechanism for fostering professional networking and collaboration among local stakeholders, enabling them to identify peers, potential partners, and mentors. Secondly, it acts as a powerful source of inspiration, illustrating pathways to success and encouraging aspiring professionals and nascent entrepreneurs within the community. Beyond individual recognition, these articles collectively underscore the symbiotic relationship between individual achievement and broader economic prosperity, highlighting how local talent directly translates into job creation, innovation, and regional growth. Such features also play a crucial role in enhancing the visibility of local businesses, attracting investment, and fostering a sense of community pride in local accomplishments.\n\nFor MassLive, this commitment to local business journalism reinforces its editorial mission to inform, connect, and empower its community. By spotlighting the movers and shakers, it not only celebrates success but also provides critical intelligence for businesses navigating the local market. The September 21, 2026, edition, in particular, offered a comprehensive snapshot of the vibrant commercial activity and the dedicated professionals who are instrumental in propelling the region's economic narrative forward. It underscores the critical role of local media in celebrating success, disseminating vital information, and strengthening the fabric of the business community, ensuring that the contributions of local leaders do not go unnoticed.", "vocab": [{"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "ecosystem", "definition": "a complex network or interconnected system, especially of businesses or organizations."}, {"word": "encompass", "definition": "to include a wide range of things."}, {"word": "accolades", "definition": "an award or privilege granted as a special honor or as an acknowledgment of merit."}, {"word": "spearheading", "definition": "leading an attack or movement; being the leader of."}, {"word": "multifaceted", "definition": "having many different aspects or features."}, {"word": "symbiotic", "definition": "a relationship between different people or groups that is mutually beneficial."}, {"word": "barometer", "definition": "something that reflects changes or indicates trends."}]}}, "questions": [{"q": "What is the name of the news feature discussed in the article?", "a": "The news feature is called \"People in Business.\""}, {"q": "Which local news outlet published this feature?", "a": "MassLive published the feature."}], "id": "af529838344", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihAFBVV95cUxNQnJFWDAtWmN5aGxIa3pkdl9XSGthSFAwZEpzVWlINFF5S0ctc2xrTlFDYkVFdUdEV0lLQTJlLUpRLU1NY19zV0R4cUFwZURxMmtqWjVHc28waEZCZktUOUhrRmNBV1dYSy1mQ29RM3JHQ0pzdXQ1eWZHMHdDMDZ4dzFaX1I?oc=5", "published": "2026-09-01T09:35:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Japan's Factories See Strongest Growth in New Orders Since 2018", "excerpt": "Japan's manufacturing sector is experiencing its fastest growth in new business orders since 2018, signaling a positive shift for the economy.", "levels": {"Beginner": {"text": "Japan's factories are getting many new orders. This is good news for the country's economy. A new report shows that new business for factories is growing very fast. It is the fastest growth since 2018. This means companies are asking Japanese factories to make more products. Manufacturing is very important for Japan. It makes cars, electronics, and many other goods that are sold all over the world.\n\nThe report is called the Purchasing Managers' Index, or PMI. It is a survey that asks factory managers about their business. They answer questions about new orders, how much they produce, and if they are hiring more workers. When the PMI goes up, it means factories are doing better. This time, the PMI shows a big rise in new orders. This is a positive sign.\n\nThis strong growth suggests that people and other businesses want to buy more things made in Japan. More orders mean factories might make more products and hire more people. This can help the whole economy grow stronger. It is a hopeful sign for Japan's future business and jobs.", "vocab": [{"word": "manufacturing", "definition": "the process of making goods in factories."}, {"word": "economy", "definition": "how a country makes and uses money and goods."}, {"word": "orders", "definition": "requests to buy or make something."}, {"word": "fastest pace", "definition": "happening quicker than before."}, {"word": "report", "definition": "a document that gives information."}, {"word": "positive sign", "definition": "something that shows a good future."}]}, "Intermediate": {"text": "Japan's manufacturing sector is experiencing its most robust expansion in new business orders since 2018, according to the latest Purchasing Managers' Index (PMI) data. This significant increase signals a positive shift for the nation's economy, which relies heavily on its industrial output and exports. The surge indicates growing demand both domestically and from international markets for Japanese-made products.\n\nThe PMI is a crucial economic indicator, providing an early look at the health of the manufacturing sector. It is derived from a monthly survey of purchasing managers at hundreds of companies, who provide insights into various aspects of their operations. Key components tracked by the PMI include new orders, production levels, employment, supplier delivery times, and inventories. A reading above 50 generally indicates expansion in the sector, while a reading below 50 suggests contraction. The recent data highlights a strong surge in new orders, pushing the overall index higher and signaling a period of growth.\n\nThis acceleration in new business suggests that Japanese factories are receiving more requests to produce a wide range of goods, from automobiles and industrial machinery to electronics and precision instruments. Such a trend is vital for Japan, a country known globally for its high-quality manufactured products and technological innovation. Increased orders often lead to higher production, which can, in turn, create more jobs, boost wages, and stimulate overall economic activity.\n\nThe improved performance in manufacturing offers a hopeful outlook for Japan's economic recovery and growth prospects. It indicates that businesses are becoming more confident about future demand, and consumers are showing a greater willingness to spend. This positive momentum could help Japan navigate global economic challenges, such as supply chain disruptions and inflationary pressures, and strengthen its position in international trade. It's a key sign that the economy might be regaining strength after recent slowdowns.", "vocab": [{"word": "robust", "definition": "strong and healthy."}, {"word": "expansion", "definition": "an increase in size or amount."}, {"word": "Purchasing Managers' Index (PMI)", "definition": "a survey-based economic indicator showing business conditions in manufacturing."}, {"word": "crucial", "definition": "extremely important."}, {"word": "indicator", "definition": "something that shows the state or level of something."}, {"word": "output", "definition": "the amount of something produced."}, {"word": "demand", "definition": "the desire of consumers for a good or service."}]}, "Advanced": {"text": "Japan's manufacturing sector is currently experiencing its most robust surge in new business orders since 2018, according to the latest S&P Global Purchasing Managers' Index (PMI) data. This significant uptick signals a potent positive shift for the nation's economy, which is heavily reliant on its sophisticated industrial output and export prowess. The acceleration reflects a notable increase in both domestic and international demand for Japanese-made products, providing a much-needed impetus for economic revitalization after periods of sluggish growth.\n\nThe PMI is a highly regarded economic gauge, offering a forward-looking snapshot of the manufacturing sector's health. Compiled from a monthly survey of purchasing managers across hundreds of Japanese companies, it meticulously tracks key operational metrics. These include new orders (both domestic and export), production volumes, employment levels, supplier delivery times, and inventories of purchases. A headline PMI reading above the 50-point threshold typically denotes an expansion in activity, while a reading below 50 suggests contraction. The recent data reveals a substantial rise in the new orders component, underpinning the overall index's upward trajectory and indicating a period of sustained growth that could ripple through the broader economy.\n\nThis renewed vigor in new business suggests that Japanese factories are fielding a greater volume of requests to produce a diverse array of goods, ranging from high-tech automobiles and industrial machinery to advanced electronics and precision instruments. This trend is particularly vital for Japan, a global manufacturing powerhouse renowned for its commitment to quality, technological innovation, and efficiency. Elevated order books typically translate into increased production schedules, which, in turn, can stimulate job creation, foster wage growth, and invigorate broader economic activity, potentially alleviating some of the deflationary pressures that have long challenged the Japanese economy.\n\nThe improved performance in manufacturing offers a cautiously optimistic outlook for Japan's economic recovery and future growth trajectory. It implies that corporate confidence is strengthening, and consumer spending sentiment is improving, potentially driven by a rebound in tourism and domestic consumption. This positive momentum could empower Japan to better navigate persistent global economic headwinds, such as ongoing supply chain vulnerabilities, geopolitical uncertainties, and inflationary pressures emanating from rising commodity prices. Furthermore, a resilient manufacturing sector enhances Japan's competitive edge in international trade, reinforcing its role as a key global supplier. Analysts will be closely watching if this momentum can be sustained, as a prolonged period of manufacturing expansion could influence the Bank of Japan's future monetary policy decisions, particularly regarding its ultra-loose stance and its long-term inflation targets. This data provides a crucial piece of the puzzle for policymakers assessing the nation's economic health.", "vocab": [{"word": "robust", "definition": "strong, healthy, and vigorous."}, {"word": "Purchasing Managers' Index (PMI)", "definition": "a composite index indicating the health of the manufacturing sector, based on a survey of purchasing managers."}, {"word": "impetus", "definition": "a force that makes something happen or happen more quickly."}, {"word": "gauge", "definition": "an instrument or device for measuring the magnitude, amount, or contents of something; used metaphorically for an economic indicator."}, {"word": "trajectory", "definition": "the path followed by a moving object; used metaphorically to describe the course or direction of economic development."}, {"word": "alleviate", "definition": "make (suffering, deficiency, or a problem) less severe."}, {"word": "headwinds", "definition": "a force or influence that makes progress more difficult; used metaphorically for economic challenges."}, {"word": "ultra-loose stance", "definition": "a very relaxed or accommodative approach to monetary policy, typically involving low interest rates and quantitative easing."}]}}, "questions": [{"q": "What does the PMI report indicate about Japan's manufacturing sector?", "a": "The PMI report indicates that Japan's manufacturing sector is experiencing its fastest growth in new business orders since 2018."}, {"q": "Why is the growth in new business orders important for Japan's economy?", "a": "The growth in new business orders is important because it suggests increased demand for Japanese products, which can lead to higher production, more jobs, and overall economic growth."}], "id": "a01b3a939b2", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixgFBVV95cUxQYkxDOUwzUElWajNwWVg5dFlVVUVFWFd2U2lkc3BOMHcwNFJOUlhhbzkyVkRBSDlWYVQyU3hqa3Z6LVR3RmtnbXdlS1NKWC1HaTU1SklsM0RHNThKaU1YOE9RV3FTZENkaG5TYXV0ZWNaaXJUeTlLQzd4SmJSRWRxU2gyazJYTzZDMEswbFZtbHlfaDNtYXl0R1Frc0g3b09vUGlkdnFYQV9MYmQ3aHNKVUcwS2FVRHZfWnp0amlvbms1LTNPbGc?oc=5", "published": "2026-09-01T09:34:56+09:00", "category": "business", "category_title": "Business"}, {"headline": "Warsh Prioritizes Inflation Control as Bank of China Shows Strong Profit Growth", "excerpt": "A former US central bank official emphasizes fighting rising prices, while the Bank of China leads profit growth among major Chinese banks.", "levels": {"Beginner": {"text": "Prices for goods and services are going up. This is called inflation. When inflation is high, people's money buys less. A man named Kevin Warsh, who used to work at the main bank in the United States (the Federal Reserve), thinks stopping inflation is the most important thing right now. He believes the central bank should focus on making prices stable. This means prices should not go up too fast.\n\nMeanwhile, in China, a big bank called Bank of China is doing very well. It has made more money than other large banks in China. There are five very big state-owned banks in China, and Bank of China is leading them in profit growth. This shows that the bank is strong and making good business decisions. When big banks make more money, it can be a sign that the country's economy is also doing well. This news comes from a financial website called theasianbanker.com.\n\nSo, we see two different economic stories: one about fighting rising prices in the US, and another about strong bank profits in China. Both are important for understanding the world's money situation.", "vocab": [{"word": "inflation", "definition": "when prices for things go up."}, {"word": "central bank", "definition": "the main bank of a country that controls money."}, {"word": "stable", "definition": "staying mostly the same, not changing a lot."}, {"word": "profit", "definition": "the money a business makes after paying costs."}, {"word": "economy", "definition": "how a country makes and uses money and goods."}]}, "Intermediate": {"text": "Former Federal Reserve Governor Kevin Warsh has highlighted the critical importance of prioritizing the fight against inflation. Inflation, which refers to the general increase in prices for goods and services over time, erodes the purchasing power of money. When inflation is high, consumers find that their savings buy less, and businesses face higher costs. Warsh's stance suggests that central banks, like the U.S. Federal Reserve, should focus primarily on price stability, even if it means making difficult decisions that might affect other economic factors like employment or growth in the short term. This approach is often adopted when inflation becomes a significant concern for an economy.\n\nAcross the globe, in China, the banking sector is showing robust performance. The Bank of China has reported the highest profit growth among the nation's \"Big Five\" state-owned commercial banks. These five major banks—Industrial and Commercial Bank of China (ICBC), China Construction Bank (CCB), Agricultural Bank of China (ABC), Bank of China (BOC), and Bank of Communications (BoCom)—play a crucial role in the Chinese economy. The Bank of China's strong financial results indicate its effective management and potentially a healthy lending environment. Strong bank profits can often be a positive indicator for the broader economy, suggesting that businesses are borrowing and investing, and consumers are spending. This news, reported by theasianbanker.com, offers a glimpse into the varied economic priorities and performances across different global regions.", "vocab": [{"word": "critical", "definition": "very important."}, {"word": "prioritizing", "definition": "deciding which thing is most important to do first."}, {"word": "erodes", "definition": "slowly wears away or reduces something."}, {"word": "purchasing power", "definition": "how much goods and services your money can buy."}, {"word": "price stability", "definition": "when prices in an economy do not change much or rise too quickly."}, {"word": "robust", "definition": "strong and healthy."}, {"word": "crucial", "definition": "extremely important."}]}, "Advanced": {"text": "Former Federal Reserve Governor Kevin Warsh has unequivocally underscored the paramount importance of combating inflation, advocating for a monetary policy stance that places price stability at the forefront of economic objectives. Inflation, characterized by a sustained increase in the general price level of goods and services, systematically diminishes the purchasing power of currency. This erosion of value can lead to significant economic instability, impacting household budgets, business investment decisions, and overall market confidence. Warsh's perspective aligns with a hawkish approach, suggesting that central banks should be prepared to implement stringent measures, such as interest rate hikes, to rein in inflationary pressures, even if such actions might entail short-term trade-offs with economic growth or employment levels. This emphasis reflects a traditional central banking mandate to maintain stable prices as a foundational element for long-term economic prosperity.\n\nConcurrently, the financial landscape in China presents a contrasting narrative of robust institutional performance. The Bank of China has emerged as the leader in profit growth among the nation's \"Big Five\" state-owned commercial banks. These behemoth institutions—comprising Industrial and Commercial Bank of China (ICBC), China Construction Bank (CCB), Agricultural Bank of China (ABC), Bank of China (BOC), and Bank of Communications (BoCom)—are integral to China's financial architecture, acting as primary conduits for capital allocation and economic development. The Bank of China's superior financial results are indicative of several factors: potentially astute management strategies, effective risk mitigation, and a favorable operating environment within the Chinese market. Such strong performance within the banking sector often serves as a bellwether for the broader economic health, signaling active lending, corporate expansion, and consumer engagement.\n\nThe divergence in these economic highlights—a Western focus on taming inflationary pressures and an Eastern demonstration of strong financial sector profitability—underscores the multifaceted and often disparate challenges and successes characterizing the global economy. As reported by theasianbanker.com, these developments offer valuable insights into the distinct economic trajectories and policy priorities currently shaping major world economies.", "vocab": [{"word": "unequivocally", "definition": "in a way that leaves no doubt; clearly."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "combating", "definition": "taking action to reduce or prevent something bad."}, {"word": "systematically", "definition": "in a methodical or organized way."}, {"word": "hawkish", "definition": "aggressive in policy, especially in advocating for higher interest rates to control inflation."}, {"word": "stringent", "definition": "strict, precise, and exacting."}, {"word": "behemoth", "definition": "a huge or monstrous creature or organization."}, {"word": "conduits", "definition": "channels or means for transmitting something."}]}}, "questions": [{"q": "What is Kevin Warsh's main concern for the economy?", "a": "Kevin Warsh's main concern is fighting inflation, which means stopping prices from rising too quickly."}, {"q": "Which Chinese bank is leading in profit growth among the \"Big Five\"?", "a": "The Bank of China is leading in profit growth among the \"Big Five\" Chinese banks."}], "id": "af5bee7926a", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivgFBVV95cUxNWVFlbzhJcDc3ZTNpSmFSRXBJdEtZX0Zja195dzhJY19tU3Ewc19Qd2ZOaVRQSXptNk9ueExjYzhxZUVrcHpYZHdjeVFPeUdhcktYTXBmdm1xWVFRdzJiZ0p5Y3Q4cmdQcElzWjBlYmZNbnZkU2tJRVBVdl95THJQY2ozY2ZvbnhrUmF0QWVTbGV4QmozeTJHWnlYbER0QXNlYm1PbzJ2TGN3Mi1Za3NJODFCWks2UXAxQXZjNXp3?oc=5", "published": "2026-09-01T09:24:59+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "No Economic Relief for Russia Until Ukraine War Ends", "excerpt": "A senior Western official reportedly told a Russian minister that economic relief for Russia is impossible until the conflict in Ukraine concludes.", "levels": {"Beginner": {"text": "A Western official named Bessent recently spoke with a Russian minister. Bessent told the minister that Russia will not get help with its economy. This economic help, which could mean fewer rules or financial support, will only happen when the war in Ukraine stops.\n\nMany countries around the world, especially Western nations, have put special rules on Russia. These rules are called sanctions. They were put in place after Russia started fighting in Ukraine in February 2022. Sanctions make it harder for Russia to do business with other countries and hurt its economy.\n\nThe G7 group of rich countries, which includes the United States, Canada, France, Germany, Italy, Japan, and the United Kingdom, has strongly supported Ukraine. They want Russia to end the fighting and leave Ukrainian land.\n\nBessent's message shows that Western countries are united. They believe that peace in Ukraine is the most important thing. Until the war ends, Russia should not expect its economy to get better with help from these countries. This is a clear message that stopping the war is key for Russia's future.", "vocab": [{"word": "official", "definition": "A person who has an important job, especially in the government."}, {"word": "minister", "definition": "A high-ranking government official, often in charge of a department."}, {"word": "economy", "definition": "The system by which a country's money and goods are produced and used."}, {"word": "war", "definition": "Fighting between countries or groups using weapons."}, {"word": "sanctions", "definition": "Official orders or laws stopping trade or communication with another country as a punishment."}, {"word": "peace", "definition": "A time when there is no war or fighting."}]}, "Intermediate": {"text": "A senior Western official, identified as Bessent, has reportedly conveyed a firm message to a Russian minister: there will be no economic relief for Russia until the conflict in Ukraine concludes. This statement, reported by Reuters, underscores the unified stance of Western nations regarding the ongoing geopolitical crisis.\n\nSince Russia's full-scale invasion of Ukraine in February 2022, numerous countries, particularly those in the G7 group (Canada, France, Germany, Italy, Japan, the United Kingdom, and the United States), have imposed extensive economic sanctions on Moscow. These measures target various sectors of the Russian economy, including finance, energy, and technology, aiming to limit Russia's ability to fund its military operations and pressure it to withdraw from Ukrainian territory.\n\nThe concept of \"economic relief\" would typically involve the easing or removal of these sanctions, or potentially new financial cooperation. Bessent's communication makes it clear that such considerations are off the table as long as the war continues. This position reflects the broader international community's demand for Russia to respect Ukraine's sovereignty and territorial integrity.\n\nThe G7 nations and their allies have consistently affirmed their unwavering support for Ukraine, providing significant military, financial, and humanitarian aid. Bessent's message serves as a direct reiteration of the conditionality attached to any future normalization of economic relations with Russia. It signals that the path to economic recovery and integration for Russia is directly tied to a peaceful resolution of the conflict, based on international law and respect for Ukraine's borders. This firm stance aims to maintain pressure on the Kremlin to end the hostilities.", "vocab": [{"word": "official", "definition": "A person holding an important position in an organization or government."}, {"word": "economic relief", "definition": "Actions taken to lessen financial burdens or improve a country's economic situation, often by lifting restrictions."}, {"word": "sanctions", "definition": "Economic or political penalties imposed by one country on another to coerce a change in policy."}, {"word": "invasion", "definition": "An act of entering a country or region with an armed force to occupy it."}, {"word": "G7 nations", "definition": "A group of seven of the world's most advanced economies."}, {"word": "international community", "definition": "The countries of the world considered collectively."}, {"word": "conflict", "definition": "A serious disagreement or argument, often involving armed fighting."}]}, "Advanced": {"text": "A senior Western official, identified as Bessent, has reportedly delivered an unequivocal message to a Russian minister: any prospect of economic normalization or relief for Russia remains contingent upon the cessation of hostilities in Ukraine. This assertion, conveyed via an unnamed source to Reuters, highlights the steadfast resolve of the G7 nations and their allies in linking Russia's economic future directly to a peaceful resolution of the ongoing conflict.\n\nSince the full-scale invasion of Ukraine in February 2022, the international community, led by the G7, has implemented an unprecedented regime of comprehensive sanctions against Russia. These punitive measures target critical pillars of the Russian economy, including its financial institutions, energy sector, defense industry, and access to advanced technology. The objective has been multifaceted: to degrade Russia's capacity to wage war, to impose significant economic costs, and to compel a withdrawal from Ukraine's sovereign territory.\n\n\"Economic relief\" in this context would encompass a range of actions, from the gradual unwinding of existing sanctions to the re-establishment of normal trade relations and potential access to international financial mechanisms. Bessent's communication underscores that such considerations are entirely predicated on Russia's adherence to international law and a verifiable end to its aggression. This position is a cornerstone of the collective Western strategy, emphasizing that there can be no return to \"business as usual\" while the conflict persists.\n\nThe G7 nations — Canada, France, Germany, Italy, Japan, the United Kingdom, and the United States — have consistently demonstrated a united front in supporting Ukraine's defense and sovereignty. Their coordinated efforts extend beyond sanctions to substantial military, financial, and humanitarian assistance for Kyiv. Bessent's statement serves as a potent reminder of the diplomatic and economic leverage Western powers continue to exert. It reinforces the message that Russia's long-term economic prosperity and reintegration into the global economic order are inextricably linked to its respect for international norms and the territorial integrity of its neighbors. This firm stance aims to maintain sustained pressure on the Kremlin, signaling that the costs of its military actions will continue to mount until a just and lasting peace is achieved.", "vocab": [{"word": "senior official", "definition": "A high-ranking person in a government or organization with significant authority."}, {"word": "economic normalization", "definition": "The process of returning economic relations and conditions to a regular, stable state after a period of disruption or sanctions."}, {"word": "comprehensive sanctions", "definition": "A broad range of economic penalties covering multiple sectors, designed to exert maximum pressure on a target country."}, {"word": "geopolitical landscape", "definition": "The political relations between countries or regions, especially those influenced by geography and economics."}, {"word": "diplomatic engagement", "definition": "Formal communication and interaction between countries, often aimed at resolving disputes or fostering cooperation."}, {"word": "leverage", "definition": "The power to influence a situation or person."}, {"word": "sovereign territory", "definition": "The land area over which a state or country exercises independent authority and control."}, {"word": "unequivocal", "definition": "Leaving no doubt; unambiguous."}]}}, "questions": [{"q": "What is the main condition Bessent stated for Russia to receive economic relief?", "a": "Bessent stated that Russia will not receive economic relief until the war in Ukraine ends."}, {"q": "Which group of countries has imposed sanctions on Russia and supports Ukraine?", "a": "The G7 group of countries (Canada, France, Germany, Italy, Japan, the United Kingdom, and the United States) has imposed sanctions on Russia and supports Ukraine."}], "id": "a994ee33b52", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivgFBVV95cUxQNmFhem94cGh1dF9LbEJGWFptV094TFA2S0dwWFBadjFBTTdTa2p3a1RZMHY4UkVPeE5DVkVabG1JWVdtd19zSWg3MFVZZDFzUFJ1djd0UXFOQ1cyV2RmVkFhSWpKbFJvQlowUkp4Y29ndU5Pc3Z0b1VjVFFBOFpNMnBKQkx5d2RiS0Y2QWNaUFZVaE4xc0RFOTFBQ3VWemZSYVdXOUJiOVZsSU5TemRNdlM5T3BsZVprazgyejBR?oc=5", "published": "2026-09-01T08:33:57+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Man Found Guilty in Tupac Shakur Murder Case After Decades", "excerpt": "After decades of mystery, a man has been found guilty in the 1996 murder of iconic rapper Tupac Shakur.", "levels": {"Beginner": {"text": "Tupac Shakur was a very famous rapper. He was killed in 1996. His death became a big mystery. Many people wondered who did it for a long time. For almost 30 years, no one was arrested for his murder. This changed in 2023. A man named Duane 'Keffe D' Davis was arrested then. Now, a court has found Duane 'Keffe D' Davis guilty of Tupac's murder. This happened in Las Vegas, USA. This news is very important. It means a famous mystery has finally been solved. Tupac Shakur was a big star in music. His songs were loved by many. His death was a sad event for his fans. The police kept working on the case for many years. Finding someone guilty after so long shows that justice can still happen. It brings an end to a long period of questions and theories about what happened that night. Many people will feel a sense of peace knowing the case is closed.", "vocab": [{"word": "Rapper", "definition": "A person who performs rap music."}, {"word": "Killed", "definition": "To cause someone to die."}, {"word": "Mystery", "definition": "Something that is difficult to understand or explain."}, {"word": "Arrested", "definition": "Taken by the police because they think you did a crime."}, {"word": "Guilty", "definition": "Having done a crime."}, {"word": "Unsolved", "definition": "A problem or mystery that has not been explained or found an answer to."}]}, "Intermediate": {"text": "Tupac Shakur, one of the most famous and influential rappers of all time, was tragically murdered in 1996. His death, which occurred during a drive-by shooting in Las Vegas, became one of popular culture's biggest unsolved cases. For nearly three decades, countless theories circulated about who was responsible for the fatal shots, but no arrests were made, leaving the case a persistent and frustrating mystery for fans and law enforcement alike. This long-standing situation changed dramatically in September 2023 when Duane 'Keffe D' Davis was arrested. Davis was accused of being involved in the fatal shooting that claimed Shakur's life, a crime that sent shockwaves through the music industry and beyond. Recently, a court has found Duane 'Keffe D' Davis guilty of Tupac Shakur's murder. This conviction marks a major and long-awaited development in what had become known as a \"cold case.\" The murder of Tupac Shakur had been a source of intense fascination and speculation for fans, music historians, and investigators alike. His music continues to be celebrated globally, and his untimely death left a profound void in the hip-hop world, cementing his legend while leaving a cloud of unanswered questions. The verdict brings a significant sense of closure to a mystery that has captivated the world for generations. It highlights the persistence of law enforcement in pursuing justice, demonstrating that even after many years, accountability can be sought. This outcome is a testament to the dedication of those who continued to work on the case, finally providing answers to a question that has lingered for nearly 30 years and offering a measure of peace to Shakur's family and admirers.", "vocab": [{"word": "Influential", "definition": "Having a lot of power to affect others."}, {"word": "Unsolved case", "definition": "A crime that has not been explained or for which no one has been caught."}, {"word": "Circulated", "definition": "To move around or pass from person to person."}, {"word": "Accused", "definition": "To say that someone has done something wrong."}, {"word": "Drive-by shooting", "definition": "A shooting in which the person who fires the gun is in a moving vehicle."}, {"word": "Conviction", "definition": "The act of proving that a person is guilty of a crime."}, {"word": "Closure", "definition": "The feeling that a difficult or unpleasant event has been concluded."}]}, "Advanced": {"text": "The long-standing enigma surrounding the 1996 murder of iconic rapper Tupac Shakur has finally seen a significant breakthrough. Duane 'Keffe D' Davis has been found guilty of Shakur's murder, bringing a definitive legal conclusion to one of popular culture's most enduring mysteries. Shakur, a prodigious artist and a central figure in the intense East Coast-West Coast hip-hop rivalry, was fatally shot in a drive-by incident in Las Vegas on September 7, 1996. He succumbed to his injuries six days later, at the age of 25, leaving behind a monumental musical legacy that continues to resonate globally. For nearly three decades, the case remained a notorious cold case, fueling myriad conspiracy theories, countless documentaries, and intense public speculation across various media platforms. Despite Shakur's immense fame and the high-profile nature of his death, which occurred just hours after attending a Mike Tyson fight, no arrests were made until September 2023, when Davis was taken into custody in Henderson, Nevada. Davis, a self-proclaimed former gang leader, had previously admitted in various interviews and in his 2019 memoir, \"Compton Street Legend,\" to being in the vehicle from which the fatal shots were fired. These admissions, coupled with other investigative efforts, reportedly played a crucial role in the renewed investigation and his eventual indictment by a grand jury. The prosecution argued that Davis orchestrated the shooting in retaliation for an earlier altercation involving Shakur and Davis's nephew, Orlando Anderson, who was also in the car that night and has since died. This conviction represents a monumental moment for the criminal justice system and for the millions of fans who have sought answers for generations. It underscores the relentless pursuit of justice, demonstrating that even when decades have passed and initial leads have gone cold, accountability can still be achieved. The verdict not only provides a measure of closure for Shakur's family and admirers but also serves as a testament to the enduring power of investigative journalism and the potential for new evidence or admissions to revive dormant cases. This development closes a significant chapter on a saga that has profoundly shaped discussions about hip-hop history, celebrity, and the complexities of urban crime, offering a long-awaited resolution to a mystery that has captivated the global imagination for nearly 30 years and continues to influence cultural narratives.", "vocab": [{"word": "Enigma", "definition": "A person or thing that is mysterious, puzzling, or difficult to understand."}, {"word": "Iconic", "definition": "Very famous and recognized by many people, often representing a particular idea or era."}, {"word": "Prodigious", "definition": "Remarkably great in extent, size, or degree; exceptional."}, {"word": "Myriad", "definition": "A countless or extremely great number of people or things."}, {"word": "Indictment", "definition": "A formal accusation by a grand jury that there is enough evidence for a criminal trial."}, {"word": "Orchestrated", "definition": "Planned and coordinated the elements of a complex situation or event to produce a desired effect."}, {"word": "Retaliation", "definition": "The action of harming someone because they have harmed oneself; revenge."}, {"word": "Dormant", "definition": "(Of a case or issue) temporarily inactive or in abeyance."}]}}, "questions": [{"q": "What year was Tupac Shakur murdered?", "a": "Tupac Shakur was murdered in 1996."}, {"q": "Who was found guilty of Tupac Shakur's murder?", "a": "Duane 'Keffe D' Davis was found guilty of Tupac Shakur's murder."}], "id": "a20667f7667", "source": "BBC News", "link": "https://www.bbc.co.uk/news/videos/ckg7yrwp70qo?at_medium=RSS&at_campaign=rss", "published": "2026-09-01T09:31:20+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Supreme Court Allows White House Ballroom Construction", "excerpt": "The U.S. Supreme Court has allowed a White House ballroom project to continue, despite a top judge's concerns about its legality.", "levels": {"Beginner": {"text": "The U.S. Supreme Court has made a big decision about a building project. It said that a plan to build a ballroom at the White House can continue. This project was started when Donald Trump was president.\n\nA ballroom is a large room used for parties and important events. The White House is where the U.S. President lives and works. So, building a new room there is a big deal.\n\nHowever, not all the judges agreed with this decision. Chief Justice John Roberts, who is the most important judge on the Supreme Court, did not agree. He wrote that the building work is \"likely unlawful.\" This means he thinks it might be against the law or not follow the correct rules.\n\nThe Supreme Court is the highest court in the United States. Its job is to decide important legal questions and make sure laws are followed. In this case, the court's decision means that the construction of this White House ballroom can go forward for now. Chief Justice Roberts' disagreement shows that there are serious questions about whether this building project is fully legal. The court's ruling allows the work to keep going, even with these legal concerns from a top judge. People will be watching to see what happens next with the ballroom.", "vocab": [{"word": "Supreme Court", "definition": "The highest court in a country."}, {"word": "ballroom", "definition": "A large room used for dancing and parties."}, {"word": "Chief Justice", "definition": "The main or head judge of the Supreme Court."}, {"word": "unlawful", "definition": "Not allowed by law; illegal."}, {"word": "construction", "definition": "The process of building something."}, {"word": "ruling", "definition": "An official decision by a court or judge."}]}, "Intermediate": {"text": "The U.S. Supreme Court has given the green light for a controversial construction project at the White House to proceed. The nation's highest judicial body cleared the way for a ballroom project, initiated during the presidency of Donald Trump, to continue despite significant legal challenges.\n\nThis decision means that work on the White House ballroom can move forward. However, the ruling was not unanimous. Chief Justice John Roberts, the head of the Supreme Court, issued a notable dissent. In his written statement, Chief Justice Roberts expressed strong reservations, stating that the \"construction is likely unlawful.\" This indicates a belief that the project may not comply with existing laws or regulations governing federal property and presidential authority.\n\nThe Supreme Court's role is to interpret the Constitution and federal laws, and its decisions are final. When it \"clears the way,\" it often means it has overturned a lower court's order that had paused the project, or it has declined to intervene to stop it. In this instance, the court's action allows the legal dispute surrounding the ballroom to continue, but without halting the physical construction in the meantime.\n\nThe dissent from the Chief Justice highlights the serious nature of the legal questions involved. Such a statement from the court's most senior member underscores that the project's legality remains a significant point of contention. While the court's majority decision permits the building to continue, the Chief Justice's warning suggests that the project could still face future legal hurdles if it is ultimately found to violate federal statutes or constitutional principles. This ongoing legal battle reflects broader debates about presidential powers and the use of government resources.", "vocab": [{"word": "controversial", "definition": "Causing a lot of disagreement or public discussion."}, {"word": "judicial body", "definition": "A group of people who make legal decisions, like a court."}, {"word": "unanimous", "definition": "Agreed to by everyone involved; all members agreeing."}, {"word": "dissent", "definition": "A strong disagreement with an official decision or opinion."}, {"word": "reservations", "definition": "Feelings of doubt or hesitation about something."}, {"word": "comply", "definition": "To follow rules or laws."}, {"word": "statutes", "definition": "Written laws passed by a legislative body."}]}, "Advanced": {"text": "The U.S. Supreme Court has issued a significant order, effectively clearing the path for the continuation of a controversial ballroom construction project at the White House. This decision by the nation's highest judicial authority allows the building work, initiated during the administration of former President Donald Trump, to proceed, despite persistent legal challenges concerning its legitimacy.\n\nThe Court's action, often interpreted as a refusal to intervene or an overturning of a lower court's injunction, means that the physical construction of the White House ballroom can move forward without immediate judicial impediment. However, the ruling was far from a consensus, notably drawing a sharp dissent from Chief Justice John Roberts. In a rare and pointed written statement, Chief Justice Roberts articulated profound reservations, asserting unequivocally that the \"construction is likely unlawful.\" This powerful declaration from the Court's most senior member signals deep concerns regarding the project's adherence to federal statutes, appropriations law, or constitutional provisions governing the use of government property and presidential authority.\n\nThe Supreme Court's primary function is to serve as the ultimate arbiter of constitutional and federal law. Its decisions carry immense weight and often set precedents. In this specific context, while the majority's order permits the construction to continue, it does not definitively rule on the ultimate legality of the project itself. Instead, it allows the underlying legal dispute to unfold in lower courts, but without imposing a halt on the physical work in the interim. This procedural posture means that while the project can advance, it remains subject to potential future legal scrutiny and could theoretically be ordered to cease or even be dismantled if a final judicial determination finds it to be unlawful.\n\nChief Justice Roberts' dissent is particularly salient. As the institutional leader of the judiciary, his public questioning of the project's legality lends considerable gravitas to the concerns raised by its opponents. Such a statement from the Chief Justice often reflects a fundamental disagreement over legal principles or the proper scope of executive power. The ongoing legal challenge likely involves questions about whether the project received proper congressional authorization, whether federal funds were appropriately allocated, or if it constitutes an impermissible private enhancement of public property.\n\nThis episode underscores the intricate interplay between executive initiatives, judicial oversight, and the enduring debates surrounding the boundaries of presidential prerogative. The decision, while clearing a procedural hurdle for the construction, simultaneously amplifies the legal cloud hanging over the White House ballroom project, ensuring that its ultimate fate will likely remain a subject of intense legal and public discourse.", "vocab": [{"word": "effectively", "definition": "In effect; in actual fact, though not officially or explicitly."}, {"word": "legitimacy", "definition": "The quality of being rightful, valid, or acceptable according to law or established principles."}, {"word": "injunction", "definition": "An official order from a court telling someone to stop doing something or to do something."}, {"word": "impediment", "definition": "A hindrance or obstruction in doing something; a barrier."}, {"word": "consensus", "definition": "General agreement among a group of people; a shared opinion or position."}, {"word": "articulated", "definition": "Expressed clearly and distinctly; put into words."}, {"word": "unequivocally", "definition": "In a way that leaves no doubt; unambiguously and clearly."}, {"word": "salient", "definition": "Most noticeable or important; prominent."}]}}, "questions": [{"q": "What did the U.S. Supreme Court decide regarding the White House ballroom project?", "a": "The Supreme Court decided to allow the construction of the White House ballroom to continue."}, {"q": "Who disagreed with the Supreme Court's decision, and what was their main reason?", "a": "Chief Justice John Roberts disagreed with the decision, stating that the construction is \"likely unlawful.\""}], "id": "a10836e6b82", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c9w457e7ydlo?at_medium=RSS&at_campaign=rss", "published": "2026-09-01T07:38:24+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Chiefs Sign Preseason Standout to Practice Squad", "excerpt": "The Kansas City Chiefs have added a promising player who performed well in preseason games to their practice squad, offering a chance for development.", "levels": {"Beginner": {"text": "The Kansas City Chiefs football team has signed a new player. This player did very well in the games before the regular season started. These games are called the preseason. The Chiefs decided to sign him to their practice squad.\n\nA practice squad is a group of players who train with the main team. They are not on the active roster, which means they don't play in regular games yet. But they practice with the team and can learn a lot. It's a chance for them to get better and maybe join the main team later.\n\nFor the Chiefs, signing a player who stood out in the preseason is a good move. It means they saw talent and potential. This player will now work hard with the team, hoping to show he can play in the big games. It's an important step for any young player hoping to make it in professional football. The Chiefs are the current champions of the NFL, so joining them is a great opportunity.", "vocab": [{"word": "signed", "definition": "agreed to hire someone for a job or team"}, {"word": "preseason", "definition": "games played before the main sports season begins"}, {"word": "practice squad", "definition": "a group of players who train with a team but don't play in games yet"}, {"word": "roster", "definition": "a list of players on a team"}, {"word": "potential", "definition": "the ability to develop or achieve something in the future"}, {"word": "champions", "definition": "the winners of a competition or league"}]}, "Intermediate": {"text": "The Kansas City Chiefs, the reigning Super Bowl champions, have made a strategic move by signing a player who performed exceptionally well during the recent preseason games. This player has been added to the team's practice squad, providing him with an opportunity to further develop his skills within a top-tier NFL organization.\n\nThe preseason is a crucial period for teams to evaluate new talent and for players to showcase their abilities in a competitive environment. For a player to be identified as a \"standout\" means he demonstrated significant promise and skill against other professional athletes. While not immediately joining the 53-man active roster, a spot on the practice squad is a valuable stepping stone.\n\nMembers of the practice squad train daily with the active roster, participate in team meetings, and learn the team's plays and strategies. This intensive exposure allows players to refine their techniques and adapt to the demanding pace of the National Football League. They are essentially on standby, ready to be promoted to the active roster if injuries occur or if their performance warrants a spot.\n\nFor the Chiefs, securing a promising player for their practice squad ensures they retain talent that impressed during the evaluation phase. It also offers depth and flexibility, allowing the team to call upon a familiar player if needed during the long NFL season. This move reflects the team's ongoing commitment to scouting and player development, even after the initial roster cuts.", "vocab": [{"word": "reigning", "definition": "currently holding a title, like a champion"}, {"word": "strategic", "definition": "done as part of a plan to achieve a goal"}, {"word": "exceptionally", "definition": "in a way that is much greater than usual; outstandingly"}, {"word": "crucial", "definition": "extremely important or necessary"}, {"word": "showcase", "definition": "to display or present something in its best light"}, {"word": "stepping stone", "definition": "an event or opportunity that helps one to achieve a goal"}, {"word": "refine", "definition": "to improve something by making small changes"}]}, "Advanced": {"text": "The Kansas City Chiefs, fresh off their Super Bowl victory, have bolstered their organizational depth by signing a notable preseason performer to their practice squad. This acquisition underscores the team's meticulous approach to roster management and player development, even as the regular season looms.\n\nThe preseason serves as a critical proving ground for aspiring NFL players, a crucible where talent is tested against professional competition. For an individual to be singled out as a \"standout\" indicates a level of performance that transcended mere participation, suggesting a player who demonstrated significant upside and potential for future contribution. While the initial 53-man roster represents the immediate competitive core, the practice squad is an indispensable component of any successful NFL franchise.\n\nPlayers on the practice squad are integral to the team's operations. They participate in daily practices, often simulating opposing teams' schemes and personnel, thereby contributing directly to the preparation of the active roster. This immersive environment provides an invaluable opportunity for these players to acclimate to the professional regimen, absorb complex playbooks, and hone their physical and technical skills under the tutelage of NFL coaches. Furthermore, it offers a pathway to the active roster, as practice squad members can be elevated at any point during the season to fill vacancies created by injuries or strategic adjustments.\n\nFor the Chiefs, securing a player who impressed during the evaluation period is a shrewd move. It allows them to retain a promising asset within their system, preventing him from potentially signing with another team. This strategic foresight provides a crucial layer of roster flexibility and injury insurance, ensuring that the team has readily available, system-familiar talent to draw upon. This ongoing commitment to cultivating talent, from the draft through the preseason and onto the practice squad, is a hallmark of well-managed organizations and a key factor in sustained competitive success in the demanding landscape of the National Football League.", "vocab": [{"word": "bolstered", "definition": "supported or strengthened something"}, {"word": "acquisition", "definition": "the act of gaining possession of something; in sports, a new player"}, {"word": "meticulous", "definition": "showing great attention to detail; very careful and precise"}, {"word": "crucible", "definition": "a severe test or trial; a place or situation in which concentrated forces interact to cause or influence change or development"}, {"word": "transcended", "definition": "went beyond the limits of; surpassed"}, {"word": "indispensable", "definition": "absolutely necessary or essential"}, {"word": "acclimate", "definition": "to become accustomed to a new climate or to new conditions"}, {"word": "shrewd", "definition": "having or showing sharp powers of judgment; astute"}]}}, "questions": [{"q": "What is a practice squad in professional football?", "a": "A practice squad is a group of players who train with the main team but are not on the active roster, meaning they don't play in regular games yet. They can be promoted to the active roster if needed."}, {"q": "Why is signing a 'preseason standout' to the practice squad considered a good move for a team?", "a": "It's a good move because it allows the team to retain a promising player who showed talent during evaluation games, providing depth, flexibility, and an opportunity for the player to develop further within the team's system."}], "id": "a54ee89ff87", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxORWRHUDJFcHI2TlJtM0dBT1pLbVlqWkdvb2h4RlExck1EbmpaQWlrR2FST0dGOUVYc0lCaEU4aVlzYld1cWx1REs2b3k2QURXT0JrT3o0NFpuSUd2UGFoWl91RGE4LTRneUlMUExhSkEzUTdHMURGRjZCb2IxU3FTYW1LV0hoclE3M0ZR?oc=5", "published": "2026-09-01T09:38:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Trae Young, a former Norman North and OU basketball … - Yahoo Sports", "excerpt": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "levels": {"Beginner": {"text": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Trae Young, a former Norman North and OU basketball … Yahoo Sports", "vocab": []}, "Advanced" const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
