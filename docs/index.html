 one game is a big achievement. It means their offense was very good. Not letting the other team score any goals means their defense was also strong.\n\nThis victory is important for Gustavus College. It helps the team feel confident for future games. Fans of the team are happy with this excellent result. The team is looking forward to playing more games and trying to win again. This 5-0 win shows they are a good team.", "vocab": [{"word": "score", "definition": "the number of points or goals a team gets in a game."}, {"word": "victory", "definition": "winning a game or competition."}, {"word": "teamwork", "definition": "when people work together well as a group."}, {"word": "offense", "definition": "the part of a team that tries to score points or goals."}, {"word": "defense", "definition": "the part of a team that tries to stop the other team from scoring."}, {"word": "confident", "definition": "feeling sure about yourself or your abilities."}]}, "Intermediate": {"text": "The Gustavus Adolphus College men's soccer team delivered a commanding performance, securing a decisive 5-0 victory over Saint Mary's. This significant win highlights the team's strong offensive capabilities and robust defensive strategy, as they prevented their opponents from scoring any goals while netting five of their own. The match, which saw Gustavus \"take care of business,\" demonstrated a high level of cohesion and execution from the players from start to finish.\n\nA 5-0 scoreline in soccer is often indicative of a team's dominance, reflecting not just individual skill but also effective tactical play and teamwork throughout the game. The Gustavus offense was particularly potent, converting multiple opportunities into goals through well-coordinated attacks. Their ability to find the back of the net five times against an opponent speaks volumes about their attacking prowess and clinical finishing. Simultaneously, the defense remained impenetrable, thwarting Saint Mary's attempts to create scoring chances and ensuring their goalkeeper faced minimal threats. This solid defensive effort ensured a clean sheet, a testament to their organization and discipline.\n\nThis victory is crucial for the Gustavus men's soccer program, especially as they navigate their collegiate season. Such a comprehensive win can significantly boost team morale and confidence, setting a positive tone for upcoming fixtures. It also sends a clear message to other teams about Gustavus's competitive strength within their league. For college athletes, consistent performance like this is key to achieving season objectives, whether it's improving their standing within their conference or preparing for potential playoff contention. The team's ability to perform so effectively against Saint Mary's bodes well for their aspirations moving forward, suggesting they are a formidable force this season. This result will undoubtedly be a source of pride for the college community and a motivator for the team's continued success.", "vocab": [{"word": "commanding", "definition": "having great power or control; very strong."}, {"word": "decisive", "definition": "settling an issue or producing a definite result; clear and definite."}, {"word": "cohesion", "definition": "the act or state of sticking together tightly; unity."}, {"word": "potent", "definition": "having great power, influence, or effect; strong."}, {"word": "impenetrable", "definition": "impossible to pass through or enter; very strong and secure."}, {"word": "morale", "definition": "the confidence, enthusiasm, and discipline of a person or group at a particular time."}, {"word": "aspirations", "definition": "strong hopes or ambitions."}]}, "Advanced": {"text": "Gustavus Adolphus College's men's soccer team delivered a comprehensive and emphatic performance, securing a dominant 5-0 victory over Saint Mary's. This decisive outcome underscores the team's formidable capabilities, showcasing both a highly effective offensive strategy and an unyielding defensive resolve that completely nullified their opponents' efforts. The phrase \"taking care of business\" aptly describes Gustavus's approach, as they executed their game plan with precision and professionalism from the opening whistle to the final moments, leaving no doubt about their superiority on the pitch.\n\nA 5-0 scoreline in collegiate soccer is a significant statement, indicative of a team's profound superiority across multiple facets of the game. Gustavus demonstrated exceptional tactical discipline, with players seamlessly transitioning between defensive duties and attacking formations. Their offensive unit exhibited clinical finishing and creative playmaking, converting numerous opportunities into goals through well-orchestrated movements and individual brilliance. This attacking prowess was complemented by an impenetrable backline and a vigilant goalkeeper, who collectively ensured a clean sheet by effectively shutting down Saint Mary's attempts to penetrate their defensive third and generate meaningful scoring chances. The control exerted by Gustavus throughout the match was palpable, reflecting meticulous preparation and a deep understanding of their opponent's strengths and weaknesses. This level of execution suggests a squad that is not only talented but also strategically astute.\n\nThis resounding triumph carries substantial implications for the Gustavus men's soccer program as they progress through their competitive season. Such a comprehensive victory not only provides a significant boost to team morale and collective confidence but also solidifies their standing within their conference, potentially improving their RPI (Ratings Percentage Index) and overall league position. In the highly competitive landscape of collegiate athletics, consistent and dominant performances are paramount for achieving season objectives, whether those involve securing a top seed in conference tournaments, vying for regional recognition, or ultimately contending for national honors. The ability to maintain such a high level of performance against a collegiate rival suggests a well-coached and highly motivated squad, capable of executing complex strategies under pressure.\n\nFurthermore, this result sends a potent message to future adversaries, establishing Gustavus as a formidable contender. The psychological advantage gained from such a one-sided affair can be invaluable in subsequent high-stakes encounters, potentially influencing opponents' game plans and confidence. As the season unfolds, the challenge for Gustavus will be to sustain this momentum and replicate their disciplined execution against increasingly challenging opponents, adapting their strategies as needed. This 5-0 win against Saint Mary's serves as a powerful testament to their current form and a promising indicator of their potential to achieve their ambitious goals this season, positioning them as a team to watch in their division.", "vocab": [{"word": "emphatic", "definition": "showing or giving emphasis; expressing something forcibly and clearly."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "nullified", "definition": "made of no use or value; canceled out."}, {"word": "aptly", "definition": "in a manner that is appropriate or suitable in the circumstances."}, {"word": "palpable", "definition": "(of a feeling or atmosphere) so intense as to be almost touched or felt; easily perceived."}, {"word": "resounding", "definition": "(of a success or failure) complete and unequivocal."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "adversaries", "definition": "one's opponent in a contest, conflict, or dispute."}]}}, "questions": [{"q": "What was the final score of the soccer game?", "a": "The final score was 5-0."}, {"q": "Which team won the game?", "a": "Gustavus Adolphus College's men's soccer team won the game."}], "id": "a94331a48cf", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxOSFdIYndnZ0dsSFFGR3k5ZmhrVU8zTmRBMVlYSm5RWnBEV0ZPcmhjZjVubnlKTFdfQXdtTnctQjd3eWF3OENScVJSUHhfQUl1am5VQTNSUTEzdEZUU0JQSDVobXpCQTkzd3I4Z2tLWDB4OTJLMldYSlo2ZUQyMkpLZnV3eGEtRmFLaDM1OGJEbk1fcU1JLWFOZ2c2SFBpYm80?oc=5", "published": "2026-10-14T09:10:20+09:00", "category": "business", "category_title": "Business"}, {"headline": "NFC Contender Eyes Bucs Starter in Potential Trade", "excerpt": "A top team in the NFC is reportedly looking to trade for a key starter from the Tampa Bay Buccaneers, according to Yahoo Sports.", "levels": {"Beginner": {"text": "A football team from the NFC wants to get a player from the Tampa Bay Buccaneers. This news comes from Yahoo Sports. The team that wants the player is a \"contender,\" which means they are a strong team that hopes to win big games.\n\nThe player from the Buccaneers is a \"starter.\" This means they play at the beginning of games and are important for their team. When teams \"trade\" players, they exchange them for other players or for future choices in the draft. Teams do this to make their team stronger.\n\nThe Buccaneers are in the National Football Conference, or NFC. Many teams in the NFC want to be the best. This news means a strong NFC team thinks a Buccaneers player can help them win a championship. It is a big story in the world of American football. We do not know the player's name yet, but it is a key player for the Bucs. This kind of trade can change a team a lot.", "vocab": [{"word": "Team", "definition": "A group of players who play a sport together."}, {"word": "Trade", "definition": "To exchange something for something else."}, {"word": "Starter", "definition": "A player who begins the game."}, {"word": "Contender", "definition": "A team that is expected to compete for a championship."}, {"word": "News", "definition": "New information about recent events."}, {"word": "Football", "definition": "A sport played with an oval-shaped ball, popular in America."}]}, "Intermediate": {"text": "A significant development in the National Football League (NFL) has emerged, with a top team from the National Football Conference (NFC) reportedly showing interest in acquiring a key starter from the Tampa Bay Buccaneers. The report, first published by Yahoo Sports, indicates that this NFC \"contender\" is actively exploring a trade to bolster its roster.\n\nIn American football, a \"contender\" is a team widely considered to have a strong chance of competing for and winning a championship. Their pursuit of a Buccaneers \"starter\" suggests they believe this player could provide a crucial boost to their current lineup. A starter is a player who regularly plays from the beginning of a game and is typically one of the most important members of the team.\n\nTrades are a common part of NFL team management. Franchises often engage in trades to improve their roster, gain valuable draft picks for future talent, or manage their salary cap. While the specific player from the Buccaneers has not been named in the report, the fact that a \"starter\" is being targeted implies a player with significant on-field impact.\n\nThis potential move highlights the strategic decisions teams make to gain a competitive edge. For the Buccaneers, trading a starter could mean acquiring assets for a future rebuild or freeing up salary cap space. For the acquiring NFC team, it signifies an immediate push for a championship, demonstrating their commitment to winning now. Such a trade, if it materializes, could have notable implications for both teams involved as the NFL season progresses or in preparation for the next one.", "vocab": [{"word": "Acquiring", "definition": "Getting or obtaining something."}, {"word": "Contender", "definition": "A team or person that is expected to compete for a championship or win."}, {"word": "Bolster", "definition": "To make something stronger or better."}, {"word": "Roster", "definition": "A list of players on a sports team."}, {"word": "Speculation", "definition": "Ideas or guesses about something that is not known for sure."}, {"word": "Implications", "definition": "The possible results or effects of something."}, {"word": "Strategic", "definition": "Relating to a plan of action designed to achieve a major goal."}]}, "Advanced": {"text": "A significant development in the National Football League (NFL) landscape has surfaced, with a formidable contender from the National Football Conference (NFC) reportedly emerging as a trade suitor for a key starter currently on the Tampa Bay Buccaneers' roster. The initial report, attributed to Yahoo Sports, underscores the strategic maneuvering prevalent in professional football as teams constantly vie for a competitive advantage and optimize their championship aspirations.\n\nAn \"NFC contender\" refers to a team within the National Football Conference that possesses a strong, established roster and is widely considered to be a legitimate candidate for a deep playoff run and a potential Super Bowl championship. Their interest in a Buccaneers \"starter\" signals a clear intent to fortify their existing lineup with proven talent, aiming to address a specific need or simply elevate their overall team strength. A starter, in NFL parlance, is a player who consistently features in the opening lineup, often holding a critical role that significantly impacts game outcomes and team performance. The term \"trade suitor\" further emphasizes the active pursuit, indicating a team that is not merely interested but is actively exploring and potentially negotiating terms for an acquisition.\n\nThe rationale behind such a trade can be multifaceted. For the acquiring team, it's often an imperative to leverage existing draft capital or other players to secure an immediate upgrade, particularly if they perceive a championship window to be open and require that final piece. This aggressive approach demonstrates a commitment to winning now. For the Buccaneers, parting with a starter, even a valuable one, could be a strategic decision related to salary cap management, a long-term roster construction plan, or an opportunity to accumulate future draft picks, especially if they are looking towards a rebuild or retooling phase. This type of transaction allows franchises to recalibrate their assets and objectives in response to their current competitive standing.\n\nWhile the specific identity of the Buccaneers' starter remains undisclosed in the initial reports, the nature of the interest suggests a player with a substantial contract and a significant on-field impact, someone whose departure would be felt by Tampa Bay but whose addition could be transformative for another team. Sports media often engages in widespread speculation following such reports, attempting to deduce the player's identity based on team needs, contract situations, and recent performance, though official confirmation is rare until a deal is finalized.\n\nThis potential trade highlights the dynamic and often ruthless nature of NFL team building. General managers constantly navigate a complex web of player contracts, draft capital, and competitive pressures, always evaluating how to best allocate resources. Should this deal materialize, it would undoubtedly have considerable ramifications for both franchises, potentially altering their trajectories for the upcoming season and beyond, influencing everything from team chemistry and fan expectations to salary cap flexibility and future draft positioning. It exemplifies how teams are always looking to optimize their roster to achieve ultimate success in a highly competitive league.", "vocab": [{"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Strategic", "definition": "Relating to the identification of long-term or overall aims and interests and the means of achieving them."}, {"word": "Maneuvering", "definition": "A movement or series of moves requiring skill and care, often to gain an advantage."}, {"word": "Imperative", "definition": "Of vital importance; crucial."}, {"word": "Leverage", "definition": "To use something to maximum advantage."}, {"word": "Recalibrate", "definition": "To adjust or reset something, often to align with new circumstances or goals."}, {"word": "Undisclosed", "definition": "Not revealed or made known."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}]}}, "questions": [{"q": "What kind of team is reportedly interested in trading for a Tampa Bay Buccaneers starter?", "a": "An NFC (National Football Conference) contender is reportedly interested in trading for a Tampa Bay Buccaneers starter."}, {"q": "According to the article, what are some common reasons why NFL teams engage in player trades?", "a": "NFL teams engage in trades to improve their roster, gain valuable draft picks for future talent, manage their salary cap, or to secure an immediate upgrade for a championship push."}], "id": "a89ea2c9987", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxOeHQ2TmxpN3pZYTk3ZjlVajk4bTVIV1hUeFdFVk1wd3RZN1EzRnAtUFRNTzFXSmxXTXVUY3h5aGhmXzU4SGwyOUUzY3NtN1BNOVNIaFdEbmRtTHE2anhNNVVGUVVVM0p5VXhxaVgxTV9FRDUzUm1CeWRHS0hRWXJNZFF6bW01MkJhOGVz?oc=5", "published": "2026-10-14T09:02:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Singapore Central Bank Holds Policy Steady Amid Economic Outlook", "excerpt": "Singapore's central bank, the MAS, has decided to keep its monetary policy unchanged, signaling confidence in the current economic trajectory.", "levels": {"Beginner": {"text": "Singapore's main money bank, the Monetary Authority of Singapore (MAS), recently announced that it will keep its monetary policy unchanged. This means the bank decided not to make any changes to its current rules for managing the country's money supply. Central banks like MAS work to keep prices stable and help the economy grow. When prices go up too much, it's called inflation. MAS watches how much things cost and how well businesses are doing.\n\nSingapore is a small country that trades a lot with other nations. So, what happens in the world economy is very important for Singapore. MAS uses its currency, the Singapore dollar, as its main tool to manage the economy. Unlike many other countries' central banks, MAS does not mainly change interest rates.\n\nBy keeping its policy unchanged, MAS is signaling that it believes its current plan is working well for now. It suggests they are confident about Singapore's economic path and that no immediate changes are needed. This decision helps businesses and people in Singapore plan for the future with more certainty.", "vocab": [{"word": "Central bank", "definition": "A country's main bank that manages money and keeps prices stable."}, {"word": "Monetary policy", "definition": "The rules a central bank uses to control a country's money supply."}, {"word": "Unchanged", "definition": "Not changed; staying the same."}, {"word": "Inflation", "definition": "When the prices of goods and services go up over time."}, {"word": "Economy", "definition": "The system by which a country's money, industry, and trade are organized."}, {"word": "Currency", "definition": "The type of money used in a particular country (e.g., Singapore dollar)."}]}, "Intermediate": {"text": "The Monetary Authority of Singapore (MAS), which functions as the nation's central bank, has announced its decision to maintain the prevailing monetary policy settings. This means MAS will not adjust the pace at which the Singapore dollar is allowed to strengthen or weaken against a basket of currencies. MAS uniquely employs the exchange rate as its primary instrument for managing the economy, a distinct approach compared to many other central banks that predominantly rely on interest rate adjustments.\n\nThis decision indicates that MAS assesses the current policy stance as appropriate for effectively managing inflationary pressures and supporting sustainable economic growth. While global inflation has been a significant concern, Singapore has observed signs of moderating price increases. The central bank noted that core inflation, which excludes more volatile components like food and energy, is anticipated to ease further in the coming months.\n\nHowever, the global economic outlook continues to present uncertainties. Slower demand from major trading partners and ongoing geopolitical factors pose potential risks to Singapore's growth prospects. As a highly open economy heavily reliant on international trade, Singapore is particularly sensitive to shifts in global economic conditions.\n\nBy keeping its monetary policy unchanged, MAS signals a degree of confidence that its existing framework is adequately balancing these various factors. The aim is to ensure price stability while simultaneously fostering a conducive environment for economic expansion. This steady approach provides a measure of predictability for businesses and consumers, allowing them to plan amidst a dynamic global economic landscape.", "vocab": [{"word": "Monetary Authority of Singapore (MAS)", "definition": "Singapore's central bank, responsible for managing its money and economy."}, {"word": "Exchange rate", "definition": "The value of one country's currency compared to another's."}, {"word": "Policy stance", "definition": "The overall position or approach a central bank takes regarding its monetary policy."}, {"word": "Moderating", "definition": "Becoming less intense, extreme, or severe; slowing down."}, {"word": "Core inflation", "definition": "A measure of inflation that removes price changes for volatile items like food and energy."}, {"word": "Outlook", "definition": "What is expected to happen in the future regarding a situation or economy."}, {"word": "Sustainable", "definition": "Able to be maintained at a certain rate or level without causing harm."}]}, "Advanced": {"text": "The Monetary Authority of Singapore (MAS), serving as the nation's central bank, has opted to maintain its prevailing monetary policy settings. This widely anticipated decision underscores MAS's continued commitment to its unique exchange rate-centered framework. Unlike most global central banks that primarily manipulate interest rates, MAS manages the Singapore dollar's nominal effective exchange rate (S$NEER) within an undisclosed policy band, adjusting its slope, width, and center. The decision to hold steady implies MAS's assessment that the current trajectory of the S$NEER remains appropriate for navigating the complex economic environment.\n\nMAS's dual mandate is to ensure price stability and foster sustainable economic growth. In its latest policy review, the central bank likely weighed persistent, albeit moderating, inflationary pressures against a backdrop of a softening global economic outlook. While both headline and core inflation in Singapore have shown a gradual deceleration from their peaks, they continue to register at elevated levels. MAS's forward guidance typically projects a further, gradual moderation of inflation, attributed to the cumulative tightening measures implemented in preceding policy reviews, which have allowed the Singapore dollar to appreciate. This appreciation helps to dampen imported inflation.\n\nNevertheless, the external economic landscape presents considerable headwinds. Global demand is projected to decelerate, inevitably impacting Singapore's export-oriented economy. Major economies are grappling with their own challenges, from persistent inflation in some Western nations to slower-than-expected recovery in others. Geopolitical tensions, persistent supply chain vulnerabilities, and financial market volatility further contribute to an uncertain global growth trajectory. Singapore, as a small and exceptionally open economy, is particularly susceptible to these external dynamics, making a stable domestic policy stance crucial.\n\nThe decision to maintain the status quo suggests that MAS believes its previous policy adjustments are still effectively transmitting through the economy. It indicates that further monetary tightening is not immediately warranted, nor is an easing stance justified given the lingering inflation risks and tight labor market conditions domestically. This cautious and data-dependent approach provides a crucial degree of stability and predictability for businesses operating within Singapore, enabling them to strategize amidst global economic flux. It reaffirms MAS's dedication to anchoring inflation expectations while simultaneously bolstering the economy's resilience against external shocks, ensuring a delicate balance between curbing price pressures and supporting growth in a challenging global environment.", "vocab": [{"word": "Prevailing", "definition": "Existing at a particular time; current or dominant."}, {"word": "Nominal effective exchange rate (S$NEER)", "definition": "A measure of the Singapore dollar's value against a weighted average of currencies of its major trading partners and competitors."}, {"word": "Mandate", "definition": "An official order or commission to do something; a central bank's official objective or duty."}, {"word": "Trajectory", "definition": "The path or course followed by a moving object or an evolving situation."}, {"word": "Cumulative", "definition": "Increasing or increased in quantity, degree, or force by successive additions."}, {"word": "Headwinds", "definition": "Factors or circumstances that make progress difficult or slow."}, {"word": "Warranted", "definition": "Justified or necessary for a particular situation."}, {"word": "Resilience", "definition": "The capacity to recover quickly from difficulties; toughness or adaptability."}]}}, "questions": [{"q": "What is the main decision made by the Monetary Authority of Singapore (MAS)?", "a": "The Monetary Authority of Singapore (MAS) decided to keep its monetary policy unchanged."}, {"q": "What is unique about how MAS manages its monetary policy compared to many other central banks?", "a": "MAS primarily uses the exchange rate of the Singapore dollar as its main tool, rather than adjusting interest rates directly, which is common for many other central banks."}], "id": "a583b023641", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxQRFRvWlBEbmFBZ2hFVUhFSVh5d2RrTjdxMmYwamV4bEdtSWNLUm93ZGxZOGI1a3NWZHlHVElRbXBxODhCY05PYlpRc0RPNi1Sam9rcGZpbWtEQ0p6SEpmWVNRcFlBOHQ2UWxQZjF0VG05aG1WQTV1NldrU3dWU0Y5Q2ZPWWdZQTJSZUFkR045ay16bUhGZWxsVWpqLWUxUE0?oc=5", "published": "2026-10-14T09:43:29+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Singapore Central Bank Holds Policy Steady, Surprising Markets", "excerpt": "Singapore's central bank surprised markets by keeping its monetary policy unchanged, a decision that goes against many economists' predictions.", "levels": {"Beginner": {"text": "Singapore's central bank, called the Monetary Authority of Singapore (MAS), made an important decision recently. They decided to keep their money policy the same. This means they did not change how they manage the country's money supply and currency value.\n\nMany people, like economists and market experts, thought the MAS would change its policy. They expected the bank to make money tighter, perhaps to help control rising prices. But the MAS chose to keep things steady.\n\nCentral banks like MAS try to keep prices stable and help the economy grow. When they keep policy steady, it shows they are watching the economy closely. They might be worried about inflation, which is when prices go up too much. But they also might be thinking about how the economy is growing, which could be slowing down. This unexpected decision will affect how much things cost and how businesses operate in Singapore.", "vocab": [{"word": "central bank", "definition": "A main bank that manages a country's money and economy."}, {"word": "policy", "definition": "A plan or set of rules made by a government or organization."}, {"word": "steady", "definition": "Not changing; staying the same."}, {"word": "unexpected", "definition": "Something that happens that was not thought would happen."}, {"word": "inflation", "definition": "When prices for goods and services go up over time."}]}, "Intermediate": {"text": "The Monetary Authority of Singapore (MAS), which acts as the nation's central bank, announced its decision to maintain its current monetary policy stance. This move came as a surprise to many economists and market analysts who had largely predicted a tightening of policy to address ongoing inflationary pressures.\n\nUnlike most central banks that primarily use interest rates to manage the economy, MAS conducts its monetary policy by managing the Singapore dollar's exchange rate against a basket of currencies. By holding its policy steady, MAS signals a cautious approach, indicating it believes the current settings are appropriate for now.\n\nThe decision suggests a delicate balance. While inflation remains elevated, there are also growing concerns about a potential slowdown in global economic growth. Singapore, being a highly open and trade-dependent economy, is particularly vulnerable to external economic conditions. The MAS might be weighing these risks, opting for stability amidst an uncertain global outlook. This unexpected hold will influence business costs, consumer prices, and the overall economic trajectory in Singapore in the coming months, as markets digest the implications of the central bank's assessment.", "vocab": [{"word": "monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit to achieve economic goals."}, {"word": "stance", "definition": "A particular way of thinking or feeling about something; a position."}, {"word": "analysts", "definition": "People who study and examine information carefully to understand it."}, {"word": "exchange rate", "definition": "The value of one country's currency in relation to another country's currency."}, {"word": "elevated", "definition": "Higher than normal or expected."}, {"word": "vulnerable", "definition": "Easily hurt or affected by something."}, {"word": "trajectory", "definition": "The path or course that something follows."}]}, "Advanced": {"text": "The Monetary Authority of Singapore (MAS), functioning as the nation's de facto central bank, delivered an unexpected decision by opting to maintain its prevailing monetary policy settings. This move defied consensus expectations among economists and market participants, many of whom had anticipated a further tightening of policy to combat persistent inflationary pressures.\n\nMAS primarily conducts monetary policy through managing the Singapore dollar's effective exchange rate against a basket of currencies, rather than adjusting interest rates directly. Its decision to keep the slope, width, and center of the policy band unchanged signals a nuanced assessment of the current economic landscape. This framework allows MAS to influence imported inflation and manage aggregate demand.\n\nThe central bank's accompanying statement acknowledged that core inflation remains elevated, though it is projected to moderate gradually over the course of the year. However, the unexpected hold suggests that MAS is increasingly weighing the risks of a global economic slowdown against the imperative to curb price increases. Singapore, a highly open and trade-dependent economy, is particularly vulnerable to external demand fluctuations. The global manufacturing downturn and geopolitical uncertainties likely contributed to the cautious stance, indicating a potential shift in focus towards safeguarding growth momentum.\n\nMarket reactions to the announcement were notable, with the Singapore dollar experiencing some volatility as investors recalibrated their positions. The unexpected nature of the decision underscores the complexity of policy-making in an environment characterized by both inflationary headwinds and decelerating global growth. Analysts will now scrutinize upcoming economic data, particularly inflation figures and GDP growth, for further clues on MAS's future trajectory. This decision reflects a delicate balancing act, aiming to anchor inflation expectations while mitigating downside risks to economic activity in the face of an evolving global economic outlook.", "vocab": [{"word": "de facto", "definition": "In fact, or in reality, though not officially established."}, {"word": "prevailing", "definition": "Existing at a particular time; current."}, {"word": "consensus", "definition": "A general agreement among a group of people."}, {"word": "persistent", "definition": "Continuing firmly or obstinately in a course of action in spite of difficulty or opposition; lasting for a long time."}, {"word": "inflationary pressures", "definition": "Factors that cause prices to rise in an economy."}, {"word": "nuanced assessment", "definition": "A careful evaluation that considers subtle differences and complexities."}, {"word": "moderate", "definition": "To become less extreme, intense, or severe."}, {"word": "recalibrated", "definition": "Adjusted or reset in response to new information or circumstances."}]}}, "questions": [{"q": "What did Singapore's central bank decide to do with its monetary policy?", "a": "It decided to keep its monetary policy unchanged or steady."}, {"q": "Why was this decision considered \"unexpected\" by markets?", "a": "Many economists and market analysts had predicted that the central bank would change or tighten its policy."}], "id": "a08a25e7988", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxPZ0JPbVNsWFBfNUozUEwzSUZfaDdMNXc3YjVkYTBGRXlyaWZkN3kxVUVqdkUtU0ZGODhTYVI3VzVfc09JSkMweDV1c2lBN1ZHa1o1NEhMWkFwVzM5TTVXVWlqV2poaWtfQlNaWUdBQVpEdDZMdlgyUFFIWUY2VVNWWVpDV2hMUUVGLUozdG9idVpvbFBNV3VucjktOTNEQTRuSDBfbnc4TmlLd3Jz?oc=5", "published": "2026-10-14T09:40:19+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "New York Prepares for Key 2026 Elections", "excerpt": "New York State is looking ahead to the 2026 elections, which will decide important leadership roles from the Governor's office.", "levels": {"Beginner": {"text": "New York State will have important elections in 2026. An election is when people vote to choose their leaders. These leaders make decisions for everyone.\n\nIn 2026, people in New York will vote for a new Governor. The Governor is the top leader of the state. They help manage schools, roads, and hospitals. Voters will also choose other state leaders, like the Attorney General, who works on legal matters, and the Comptroller, who handles state money.\n\nPeople will also vote for members of the State Legislature. These people make laws for New York. Some people will also vote for members of the U.S. House of Representatives. These leaders go to Washington D.C. to make laws for the whole country.\n\nTo vote, you must be 18 years old and registered. Registering means putting your name on a list. It is very important for people to vote. Voting lets you choose who will lead and make rules for your community and state. The elections will happen in November 2026. It's a chance for New Yorkers to have their say.", "vocab": [{"word": "election", "definition": "When people vote to choose leaders."}, {"word": "Governor", "definition": "The main leader of a state."}, {"word": "voters", "definition": "People who vote."}, {"word": "registered", "definition": "To have your name on an official list to vote."}, {"word": "legislature", "definition": "A group of people who make laws."}, {"word": "community", "definition": "A group of people living in the same place."}]}, "Intermediate": {"text": "New York State is preparing for significant elections in 2026, which will determine many key leadership positions across the state. These elections are a fundamental part of the democratic process, allowing citizens to choose who will represent them and make important decisions.\n\nOne of the most prominent races will be for Governor. The Governor serves as the chief executive of New York, overseeing state agencies, proposing budgets, and setting policy priorities. Voters will also elect other statewide officials, including the Lieutenant Governor, Attorney General, and State Comptroller. The Attorney General acts as the state's chief legal officer, while the Comptroller manages state finances.\n\nBeyond statewide offices, New Yorkers will also cast ballots for members of the State Legislature, which includes the State Senate and State Assembly. These legislative bodies are responsible for creating and passing laws that affect daily life in New York. Additionally, all of New York's seats in the U.S. House of Representatives will be contested. These representatives serve in the federal government in Washington D.C., advocating for their districts and participating in national lawmaking.\n\nBefore the general election in November 2026, primary elections will take place, typically in the summer. During primaries, voters choose which candidates from each political party will advance to the main election. To participate, eligible citizens must be registered to vote. Voter registration ensures that every qualified individual has the opportunity to exercise their right to vote. Key issues like the economy, education, public safety, and healthcare are expected to be central to the campaigns, as candidates present their visions for the future of New York.", "vocab": [{"word": "significant", "definition": "Important or notable."}, {"word": "democratic process", "definition": "The way a democracy works, especially through elections."}, {"word": "chief executive", "definition": "The main leader or head of an organization or state."}, {"word": "statewide", "definition": "Happening or existing throughout a whole state."}, {"word": "legislative bodies", "definition": "Groups of people who make laws."}, {"word": "primary elections", "definition": "Elections where voters choose candidates from their party for the main election."}, {"word": "eligible", "definition": "Having the right to do something."}]}, "Advanced": {"text": "New York State is gearing up for a pivotal election cycle in 2026, a period that will reshape the political landscape and determine critical leadership roles from Albany to Washington D.C. These mid-term elections, falling between presidential contests, often serve as a referendum on the incumbent administration and can significantly influence policy direction at both state and federal levels.\n\nThe gubernatorial race will undoubtedly be the marquee contest. The Governor, as the state's chief executive, wields substantial power over New York's vast bureaucracy, budget allocation, and legislative agenda. Alongside the Governor, voters will elect the Lieutenant Governor, Attorney General, and State Comptroller. The Attorney General functions as the state's top legal officer, prosecuting cases, defending state laws, and acting as a consumer advocate. The Comptroller, an independent fiscal watchdog, audits state agencies and manages the state's pension funds, playing a crucial role in financial oversight.\n\nBeyond these prominent statewide offices, all 150 seats in the New York State Assembly and all 63 seats in the State Senate will be on the ballot. These legislative bodies are instrumental in crafting and enacting laws concerning everything from environmental protection and housing policy to education funding and criminal justice reform. The composition of the State Legislature can dictate the feasibility of the Governor's agenda, making these races highly consequential. Furthermore, all of New York's congressional districts will hold elections for the U.S. House of Representatives, sending delegates to the federal legislature where they contribute to national policy debates and represent constituent interests.\n\nThe election process commences with primary elections, typically held in late June, where registered voters select their party's nominees. This internal party contest can often be as vigorous as the general election, particularly in districts with strong partisan leanings. Voter registration efforts will intensify in the months leading up to the November general election, aiming to maximize participation among eligible citizens. New York, a predominantly Democratic state, nonetheless sees competitive races, especially in suburban and upstate regions, where shifts in voter sentiment can lead to significant upsets.\n\nCampaigns are expected to focus on a range of pressing issues, including economic development, affordability, public safety, healthcare access, and climate change initiatives. Candidates will articulate their policy platforms, vying for public trust and support. The 2026 elections will not only decide who governs New York but also reflect the evolving priorities and political temperament of its diverse electorate, underscoring the enduring vitality of democratic engagement.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "referendum", "definition": "A direct vote by the electorate on a particular proposal or issue."}, {"word": "incumbent", "definition": "The current holder of a political office."}, {"word": "wields", "definition": "Holds and uses (power or influence)."}, {"word": "bureaucracy", "definition": "A system of government in which most of the important decisions are made by state officials rather than by elected representatives."}, {"word": "instrumental", "definition": "Serving as a means of pursuing an aim or policy; important."}, {"word": "consequential", "definition": "Important; significant."}, {"word": "electorate", "definition": "All the people in a country or area who are entitled to vote in an election."}]}}, "questions": [{"q": "What major statewide office will New Yorkers vote for in 2026?", "a": "New Yorkers will vote for Governor in 2026."}, {"q": "Why are primary elections important before the general election?", "a": "Primary elections are important because voters choose which candidates from each political party will advance to the main election."}], "id": "ab78253b228", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitgFBVV95cUxNQlU4cTdRZkY5REVaN1hMMlVHY3FpOWFQU2QxOTBlMGhSRHVpT2tBQy1mSUtCMHlOYk1ySWxsbWtJSW12a25LQWg3LWRER09QeDg5Q0VVNkJVWFozdjZlTzFJRm1XX3JicHZUZXNOV2YtVnBnNlNxdzdMeUh2TlZSTGt2dUhad1ExSmNudnRUQWdKWVJnejZYSnVYZVJZYW5CSFNwQ2gtVy1hMG9TdWw3bGVlRGdSQQ?oc=5", "published": "2026-10-14T09:36:17+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "DOJ Subpoenas Issued to Relatives of Rep. Ilhan Omar", "excerpt": "The Department of Justice has issued subpoenas to family members of U.S. Representative Ilhan Omar, signaling a federal inquiry.", "levels": {"Beginner": {"text": "The U.S. government's Department of Justice (DOJ) has sent important papers, called subpoenas, to people related to Representative Ilhan Omar. Ms. Omar is a well-known politician who works in the U.S. Congress. She helps make laws for the country.\n\nThese subpoenas are legal orders. They ask people to give information or documents to the DOJ. When the DOJ sends subpoenas, it usually means they are looking into something. This is called an investigation.\n\nRight now, we do not know why the DOJ sent these papers to Ms. Omar's relatives. The government has not said what the investigation is about. It is important to remember that getting a subpoena does not mean someone has done something wrong. It just means the DOJ wants more information.\n\nMs. Omar is a Representative for Minnesota. She is a very public person. When the government looks into things involving politicians or their families, it is often big news. People will be watching to see what happens next with this investigation.", "vocab": [{"word": "subpoenas", "definition": "Official papers from a court or government asking someone to give information."}, {"word": "politician", "definition": "A person who works in government."}, {"word": "Congress", "definition": "The group of people who make laws for the U.S."}, {"word": "investigation", "definition": "An official search to find facts about something."}, {"word": "relatives", "definition": "People who are part of the same family."}]}, "Intermediate": {"text": "The U.S. Department of Justice (DOJ) has issued subpoenas to several relatives of Representative Ilhan Omar, a prominent Democratic member of Congress from Minnesota. This development indicates that the federal government is conducting an investigation that involves individuals connected to the congresswoman.\n\nA subpoena is a legal document that compels an individual to provide specific documents or to testify under oath. It is a standard tool used by law enforcement agencies like the DOJ to gather information during an inquiry. While the issuance of subpoenas signifies a serious step in a federal investigation, the specific nature or target of this particular inquiry has not been publicly disclosed by the Department of Justice.\n\nRepresentative Omar is a high-profile figure in American politics, known for representing Minnesota's 5th congressional district. She is a member of the House of Representatives, where she participates in lawmaking and oversight. Due to her public role, any federal action involving her family members naturally draws significant attention and scrutiny.\n\nIt is crucial to understand that receiving a subpoena does not equate to an accusation of wrongdoing or guilt. Instead, it is a formal request for information that the DOJ believes is relevant to an ongoing investigation. Neither Representative Omar's office nor the Department of Justice has released further details about the subpoenas or the underlying investigation at this time. The situation remains fluid as more information is awaited regarding the scope and focus of the inquiry.", "vocab": [{"word": "issued", "definition": "Officially sent out or given."}, {"word": "prominent", "definition": "Important and well-known."}, {"word": "compels", "definition": "Forces someone to do something."}, {"word": "testify", "definition": "To give evidence or information, usually in court or to an official body."}, {"word": "disclosed", "definition": "Made known or revealed."}, {"word": "scrutiny", "definition": "Careful and close examination."}, {"word": "equate", "definition": "To consider one thing to be the same as or equal to another."}]}, "Advanced": {"text": "The United States Department of Justice (DOJ) has reportedly issued subpoenas to several relatives of U.S. Representative Ilhan Omar, a high-profile Democratic congresswoman representing Minnesota's 5th congressional district. This action signals a significant progression in a federal inquiry, though the precise nature and scope of the investigation remain largely undisclosed to the public.\n\nSubpoenas are potent legal instruments, compelling individuals to either produce specified documents or records, or to appear and provide sworn testimony before a grand jury or other investigative body. Their issuance underscores the seriousness of an ongoing federal probe, as they carry the force of law, and non-compliance can result in legal penalties, including contempt charges. However, it is imperative to distinguish between the issuance of a subpoena and an accusation of criminal wrongdoing; a subpoena is a fact-finding tool, not an indictment.\n\nRepresentative Omar, a member of the House of Representatives, holds a prominent position in American political discourse. Her public profile and past political controversies often place her under intense media and public scrutiny. Consequently, any federal investigative activity involving her immediate or extended family members invariably attracts considerable attention, prompting questions about the potential implications for the congresswoman herself.\n\nWhile the specific details surrounding the DOJ's interest in Omar's relatives have not been officially divulged, such investigations can stem from a variety of federal statutes, ranging from financial crimes to campaign finance irregularities or other matters. Without official statements from the DOJ or Representative Omar's office, speculation regarding the inquiry's focus is inevitable. The Department of Justice typically maintains strict confidentiality regarding ongoing investigations to protect their integrity and the privacy of those involved, unless charges are formally filed.\n\nThis development highlights the delicate balance between federal law enforcement's mandate to investigate potential legal infractions and the political sensitivities inherent when elected officials or their close associates become subjects of such inquiries. The principle of due process dictates that all individuals are presumed innocent until proven guilty, and the issuance of subpoenas is merely one step in a potentially lengthy legal process aimed at gathering information. Observers will be closely monitoring any further disclosures or developments from federal authorities or Representative Omar's legal representatives.", "vocab": [{"word": "reportedly", "definition": "According to what some people say, though not yet proven or officially confirmed."}, {"word": "potent", "definition": "Having great power, influence, or effect."}, {"word": "compelling", "definition": "Forcing or obliging someone to const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
