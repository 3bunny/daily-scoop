y. More people might visit Santa Fe for outdoor activities, which brings more money to the area. It's a way to help local companies succeed and make Santa Fe an even better place for outdoor adventures.", "vocab": [{"word": "outdoor", "definition": "Happening or located outside, not inside a building."}, {"word": "businesses", "definition": "Companies or organizations that sell goods or services."}, {"word": "program", "definition": "A planned series of activities or events."}, {"word": "free", "definition": "Not costing any money."}, {"word": "grow", "definition": "To become larger or more successful."}, {"word": "advice", "definition": "Suggestions about what someone should do."}]}, "Intermediate": {"text": "Santa Fe is actively seeking outdoor recreation businesses to participate in a new, free business accelerator program. This initiative aims to provide significant support to companies operating within the outdoor adventure sector, such as guided tours, equipment rentals, adventure sports providers, and related retail outlets.\n\nA business accelerator program is designed to help new or existing businesses develop rapidly. Participants typically receive mentorship from experienced professionals, attend workshops on various business topics like marketing and finance, and gain access to valuable resources. The goal is to equip entrepreneurs with the skills and knowledge needed to overcome challenges and achieve sustainable growth.\n\nFor Santa Fe, supporting the outdoor recreation industry is crucial. New Mexico, with its stunning natural landscapes, relies on this sector for tourism and local economic development. By strengthening these businesses, the program can help create more jobs, attract more visitors, and diversify the local economy beyond traditional sectors. It offers a unique opportunity for local entrepreneurs to refine their business models, expand their customer base, and contribute more effectively to the region's prosperity. This free program represents a strategic investment in the future of Santa Fe's vibrant outdoor community.", "vocab": [{"word": "participate", "definition": "To take part in an activity or event."}, {"word": "initiative", "definition": "A new plan or process to achieve something."}, {"word": "mentorship", "definition": "Guidance and advice provided by an experienced person to a less experienced one."}, {"word": "entrepreneurs", "definition": "People who start and run their own businesses, taking on financial risks."}, {"word": "sustainable", "definition": "Able to be maintained at a certain rate or level; causing little or no damage to the environment and therefore able to continue for a long time."}, {"word": "crucial", "definition": "Extremely important or necessary."}, {"word": "diversify", "definition": "To make something more varied or different."}]}, "Advanced": {"text": "Santa Fe is launching a significant economic development initiative, actively recruiting outdoor recreation businesses for a complimentary business accelerator program. This strategic move underscores the region's commitment to fostering growth within its vibrant outdoor adventure sector, encompassing enterprises ranging from specialized gear outfitters and guided expedition services to innovative outdoor tech startups.\n\nBusiness accelerator programs are intensive, structured initiatives designed to rapidly scale promising ventures. They typically offer a comprehensive suite of resources, including bespoke mentorship from industry veterans, hands-on workshops covering critical business functions like market analysis, financial modeling, and strategic planning, and often provide access to a network of potential investors and collaborators. The overarching goal is to equip entrepreneurs with the robust frameworks and practical skills necessary to navigate market complexities, optimize operations, and achieve accelerated, sustainable growth.\n\nFor New Mexico, and particularly Santa Fe, the outdoor recreation industry is a pivotal economic driver. The state's unique natural landscapes attract a substantial volume of tourists and residents seeking activities such as hiking, mountain biking, skiing, and river rafting. Strengthening the local entrepreneurial ecosystem within this sector is not merely about individual business success; it's about enhancing regional competitiveness, creating high-quality employment opportunities, and diversifying the economic base beyond traditional industries. This accelerator program serves as an invaluable catalyst for innovation, enabling local businesses to refine their value propositions, expand their market reach, and contribute more significantly to the state's overall prosperity. By providing this support free of charge, Santa Fe is making a clear investment in its future, aiming to solidify its reputation as a premier destination for outdoor enthusiasts and a fertile ground for related enterprises.", "vocab": [{"word": "complimentary", "definition": "Given free of charge; without cost."}, {"word": "fostering", "definition": "Encouraging the development of something, especially something good."}, {"word": "encompassing", "definition": "Including a wide range of elements; covering comprehensively."}, {"word": "bespoke", "definition": "Made for a particular customer or user; custom-made."}, {"word": "overarching", "definition": "Comprehensive or all-embracing; forming an arch over or above everything else."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "catalyst", "definition": "A person or thing that precipitates an event or change; something that speeds up a process."}, {"word": "entrepreneurial ecosystem", "definition": "A network of individuals and organizations that support the creation and growth of new businesses, including investors, mentors, universities, and government agencies."}]}}, "questions": [{"q": "What kind of businesses is the free accelerator program in Santa Fe looking for?", "a": "The program is looking for outdoor recreation businesses, such as those involved in hiking, biking, camping, guided tours, or equipment rentals."}, {"q": "What is the main benefit for businesses that join an accelerator program?", "a": "Businesses joining an accelerator program receive support, advice, mentorship, and resources to help them grow faster, become stronger, and succeed in the market."}], "id": "a607f9cf9ce", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi-AFBVV95cUxNR2EyU1RFci1PMnN5dFdRUWdVeE4zcS1SaUdfRlN5YUxSdUtCaXhtS2EwVDZBeXZDbkhmT3NFeXBwZXhjV1VpLUVvbWs4VXEzQ0ZGTVBVZHNCYVowVWoyc3R6ZDdmcjA0UzFfX3lETVRabk1qdGRXai1FX1R1ZUZ6SlZsaG9GRlZFRUVndElRMXdRME5KN3dnak52WjVaYnNHYi1lWFpqbXk4LTF6ZkoxSXRXczkybGdiNjRpcDRPZktXdWxzb01POVJVWERLMERYYlhvU195WWUtYjRIOVFjUUw2OWFQc00ta0o0dVNseV9td1dmendUOA?oc=5", "published": "2026-08-05T07:43:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Tulsa Plan: $100M Campus Blends Business and Bible", "excerpt": "A Tulsan is proposing a $100 million campus designed to combine business education with teachings from the Bible.", "levels": {"Beginner": {"text": "A person in Tulsa wants to build a big new place. This new place will be a campus, like a school or university. It will cost a lot of money, about $100 million. The idea is to teach two main things there: business and the Bible. \n\nBusiness means learning how to run companies, make money, and work in trade. The Bible is a holy book for Christians, teaching about faith and life. The person wants to mix these two ideas. So, students would learn about business, but also about how their faith can help them in their work. It's a new way to think about education in Tulsa. This project is still a plan, but it shows a big dream for the city.", "vocab": [{"word": "campus", "definition": "A place with buildings for a school or university."}, {"word": "million", "definition": "The number 1,000,000."}, {"word": "business", "definition": "Work related to making, buying, or selling goods or services."}, {"word": "Bible", "definition": "A holy book for Christians."}, {"word": "faith", "definition": "Strong belief in a religion or set of ideas."}]}, "Intermediate": {"text": "A significant new development is being proposed in Tulsa, Oklahoma. A local resident plans to establish a $100 million campus designed to integrate business education with biblical principles. This ambitious project aims to create a unique learning environment where students can develop strong business skills while also grounding their professional lives in faith-based ethics and values.\n\nThe proponent believes that combining these two areas can lead to more responsible and purpose-driven leadership in the business world. Instead of separating professional pursuits from spiritual beliefs, the campus would offer a curriculum that shows how faith can inform decision-making, ethical practices, and community engagement within a commercial context. \n\nThis initiative represents a substantial investment in the future of education in Tulsa. While specific details about the curriculum and faculty are still in the planning stages, the core vision is clear: to cultivate a new generation of business leaders who are not only successful in their careers but also guided by a strong moral compass rooted in biblical teachings. The project highlights a growing interest in blending spiritual development with professional training.", "vocab": [{"word": "proposed", "definition": "Suggested for consideration or discussion."}, {"word": "integrate", "definition": "To combine two or more things to make them work together."}, {"word": "principles", "definition": "Basic rules or beliefs that guide actions or behavior."}, {"word": "ambitious", "definition": "Having a strong desire to succeed or achieve something."}, {"word": "ethics", "definition": "Moral principles that govern a person's or group's behavior."}, {"word": "curriculum", "definition": "The subjects taught in a school or college."}]}, "Advanced": {"text": "An ambitious and potentially transformative initiative is taking shape in Tulsa, Oklahoma, where a local visionary is spearheading plans for a sprawling $100 million campus. This proposed institution seeks to forge a distinctive educational paradigm by seamlessly integrating rigorous business curricula with profound biblical teachings. The underlying philosophy posits that true leadership and sustainable enterprise are best cultivated when commercial acumen is inextricably linked to a robust ethical framework, informed by spiritual principles.\n\nProponents envision a dynamic hub where future entrepreneurs and executives are not only equipped with cutting-edge market strategies but also imbued with a sense of moral stewardship and a commitment to societal betterment. This blending of the sacred and the secular reflects a growing trend among faith-based organizations to engage more directly with contemporary professional spheres, aiming to instill values-driven decision-making at the highest levels of commerce. The project's substantial investment underscores the scale of its ambition, aiming to establish a model for holistic professional development that resonates beyond traditional academic boundaries.\n\nThe campus would likely offer programs designed to explore topics such as ethical finance, servant leadership, faith-based entrepreneurship, and corporate social responsibility, all viewed through a theological lens. This approach challenges the conventional separation of faith and work, advocating for a worldview where one's spiritual convictions actively shape their professional conduct and impact. While specific details regarding accreditation, faculty recruitment, and program offerings are yet to be fully articulated, the conceptual framework suggests a comprehensive educational experience.\n\nSuch an endeavor could attract students seeking an education that prioritizes both professional competency and spiritual formation, potentially drawing a diverse cohort from across the nation. It represents a bold statement about the role of faith in modern commerce and the potential for a new generation of leaders to navigate complex business landscapes with integrity and purpose.", "vocab": [{"word": "visionary", "definition": "A person with original ideas about what the future will or could be like."}, {"word": "paradigm", "definition": "A typical example or pattern of something; a model."}, {"word": "acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "inextricably", "definition": "In a way that is impossible to disentangle or separate."}, {"word": "stewardship", "definition": "The careful and responsible management of something entrusted to one's care."}, {"word": "secular", "definition": "Not connected with religious or spiritual matters."}, {"word": "theological", "definition": "Relating to the study of religious faith, practice, and experience."}, {"word": "cohort", "definition": "A group of people with a shared characteristic, typically age or academic background."}]}}, "questions": [{"q": "What two main subjects will the proposed Tulsa campus combine?", "a": "The proposed campus will combine business education and biblical teachings."}, {"q": "What is the estimated cost of the new campus project?", "a": "The estimated cost of the new campus project is $100 million."}], "id": "a8f0a4e670a", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxOelJIRXBRQzRUYm1ic09RNkJ4UndoUEtVM1BnRXdVOU5QaHMtVFJZd21FVy1lTVlSZHZpemh2a2t1T0dTWDJHcGZORTFIQzNKMmRQeVNMbmQ2XzFrSUxpUy00enRaWTd0Zzg5NlR3M2UyUUxrMkl5N19hcmZkMzdVQ1ZQVjA4cHBE?oc=5", "published": "2026-08-05T07:41:58+09:00", "category": "business", "category_title": "Business"}, {"headline": "Switzerland Defies Global Trend with Near-Zero Inflation", "excerpt": "While much of the world battles rising costs, Switzerland stands out with remarkably low inflation, according to Haver Analytics.", "levels": {"Beginner": {"text": "Switzerland is a country in Europe. Right now, many countries around the world have a problem called inflation. Inflation means that prices for things like food, clothes, and gas go up a lot. This makes it harder for people to buy what they need because their money buys less. But in Switzerland, something different is happening. A company called Haver Analytics says that Switzerland has almost no inflation. This means prices there are very stable and are not going up much at all. This is good news for people living in Switzerland. They can buy things without worrying that prices will be much higher next week or next month. Switzerland has a strong economy and its money, called the Swiss Franc, is also very strong. A strong Swiss Franc helps to keep prices low for things that Switzerland buys from other countries. So, while many places are seeing prices increase, Switzerland enjoys a very stable situation where prices stay almost the same. This makes Switzerland's economy quite special compared to many others right now.", "vocab": [{"word": "inflation", "definition": "When prices for things go up a lot."}, {"word": "prices", "definition": "How much money you pay for something."}, {"word": "stable", "definition": "Not changing much; staying the same."}, {"word": "strong", "definition": "Powerful; not weak."}, {"word": "economy", "definition": "How a country makes and uses money and goods."}, {"word": "buy", "definition": "To get something by paying money for it."}]}, "Intermediate": {"text": "Switzerland is currently experiencing a striking economic situation, standing apart from many other nations grappling with rising costs. According to a recent assessment by Haver Analytics, the Alpine nation is characterized by \"nonexistent\" inflation, a term used to highlight its remarkably stable price environment. This contrasts sharply with the global trend, where numerous major economies have been battling elevated inflation rates, prompting central banks worldwide to raise interest rates to cool down their economies.\n\nInflation refers to a sustained increase in the general price level of goods and services over time, which reduces the purchasing power of money. For Swiss consumers, this low inflation means their money retains its value, allowing them to buy goods and services without significant price increases. This stability is a significant advantage for Swiss households and businesses.\n\nSeveral factors contribute to Switzerland's unique position. The Swiss Franc is widely regarded as a strong and stable currency, often sought after as a safe haven during times of global economic uncertainty. A strong franc makes imported goods cheaper, which helps to suppress domestic price increases. Furthermore, the Swiss National Bank (SNB) has a long-standing commitment to price stability and has actively managed monetary policy to achieve this goal. Its proactive measures, including interventions in foreign exchange markets, have helped to keep inflation in check. While other countries are tightening their belts due to inflation, Switzerland's economy offers a rare example of price stability, making it a notable outlier in the current global economic landscape.", "vocab": [{"word": "inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "stable", "definition": "Not likely to change or fail; firmly established."}, {"word": "currency", "definition": "The system of money used in a particular country."}, {"word": "central bank", "definition": "A national bank that provides financial and banking services for its country's government and commercial banking system, and implements monetary policy."}, {"word": "imports", "definition": "Goods or services brought into a country from abroad for sale."}, {"word": "consumers", "definition": "People who buy goods and services for their own use."}, {"word": "economy", "definition": "The system by which a country's money and goods are produced and used."}]}, "Advanced": {"text": "Switzerland continues to present a striking anomaly in the global economic landscape, characterized by an almost \"nonexistent\" rate of inflation, as recently highlighted by Haver Analytics. This assessment underscores a profound divergence from the prevailing macroeconomic conditions experienced by most major economies, which have been contending with persistent and often elevated inflationary pressures. While central banks across the globe, including the U.S. Federal Reserve and the European Central Bank, have embarked on aggressive monetary tightening cycles to curb rising prices, Switzerland's price stability remains remarkably steadfast.\n\nInflation, defined as a sustained increase in the general price level of goods and services, erodes purchasing power and can destabilize economic planning. For Swiss households and businesses, the absence of significant inflation translates into a consistent preservation of their financial assets' value and predictable operational costs. This macroeconomic stability fosters a high degree of confidence and supports long-term investment, distinguishing Switzerland as a beacon of economic predictability.\n\nSeveral interconnected factors underpin this exceptional disinflationary environment. Foremost among them is the formidable strength and stability of the Swiss Franc. Often considered a safe-haven currency, the franc tends to appreciate during periods of global uncertainty, making imports significantly cheaper. This strong exchange rate acts as a powerful disinflationary force, offsetting potential domestic price pressures. The Swiss National Bank (SNB) also plays a crucial role. With a deeply ingrained mandate for price stability, the SNB has historically employed a range of sophisticated monetary policy tools, including foreign exchange interventions, to manage the franc's value and prevent imported inflation. Its proactive and often unconventional strategies have proven effective in anchoring inflation expectations.\n\nFurthermore, Switzerland's robust and diversified economy, coupled with prudent fiscal policies, contributes to its resilience. The country's high productivity, efficient supply chains, and relatively moderate wage growth compared to some other developed nations also help to mitigate cost-push inflationary pressures. While the global economy navigates supply chain disruptions and geopolitical tensions that have fueled inflation elsewhere, Switzerland's unique structural characteristics and diligent monetary stewardship allow it to maintain an enviable degree of price stability. This enduring low inflation environment provides a significant competitive advantage, enhancing the purchasing power of its citizens and reinforcing its status as one of the world's most stable economies.", "vocab": [{"word": "anomaly", "definition": "Something that deviates from what is standard, normal, or expected."}, {"word": "macroeconomic", "definition": "Relating to the branch of economics concerned with large-scale or general economic factors, such as interest rates and national productivity."}, {"word": "monetary policy", "definition": "The actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "disinflationary", "definition": "Relating to a reduction in the rate of inflation."}, {"word": "franc", "definition": "The basic monetary unit of Switzerland."}, {"word": "safe-haven", "definition": "An asset that is expected to retain or increase in value during times of market turbulence."}, {"word": "purchasing power", "definition": "The financial ability to buy products and services."}, {"word": "stewardship", "definition": "The careful and responsible management of something entrusted to one's care."}]}}, "questions": [{"q": "What is the main economic situation in Switzerland, according to Haver Analytics?", "a": "According to Haver Analytics, Switzerland is experiencing \"nonexistent\" or very low inflation, meaning prices are very stable and not rising much."}, {"q": "Name two reasons why Switzerland might have such low inflation compared to other countries.", "a": "Two reasons are the strong and stable Swiss Franc, which makes imports cheaper, and the proactive monetary policy of the Swiss National Bank (SNB) aimed at maintaining price stability."}], "id": "a6e60e22e0c", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihgFBVV95cUxPdzR2dzZBOXJLd1JpS3FOcWNWQVh0RW9ENTFLZFBGMkxMTG9iUzJobXBKVXFzRG9RV3I5eVhCRVFVVmF1WFpEZExsM21DVjNFemNZY3EwVm1LVVdFSjBnbl9pMldGSDZPbFkwWjhXa3RzRTBkWnJnUzVoWWphTnliMHJGVGZNdw?oc=5", "published": "2026-08-05T07:42:52+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Congressman Cloud Seeks to Ban Digital Dollar", "excerpt": "U.S. Congressman Michael Cloud has introduced a bill aiming to permanently stop the creation of a Central Bank Digital Currency in the United States.", "levels": {"Beginner": {"text": "Congressman Michael Cloud wants to stop a new kind of money in the United States. This money is called a Central Bank Digital Currency, or CBDC. It would be a digital dollar, meaning it exists only on computers, not as physical cash.\n\nRight now, people use paper money, coins, and bank cards. A CBDC would be like digital cash that the government issues directly. Many countries around the world are thinking about making their own CBDCs or are already testing them.\n\nHowever, Congressman Cloud does not like this idea for the U.S. He thinks a CBDC could let the government see all your money transactions. He worries it could give the government too much power over what people buy and sell, and how they use their money.\n\nHe has introduced a new law proposal called the \"Permanent CBDC Ban Act.\" If this act becomes a law, the U.S. government cannot create a digital dollar. Congressman Cloud believes that people should have financial privacy. He wants to protect how people use their money without the government watching every transaction. He also thinks a CBDC could change how regular banks work.\n\nThis proposal is an important step. Other lawmakers will now look at his idea. It shows there is a big discussion about digital money and privacy in the country.", "vocab": [{"word": "digital", "definition": "existing as data, not physical."}, {"word": "currency", "definition": "the money used in a country."}, {"word": "privacy", "definition": "keeping personal things secret."}, {"word": "government", "definition": "the group of people who rule a country."}, {"word": "proposal", "definition": "an idea or plan offered for consideration."}, {"word": "transaction", "definition": "an act of buying or selling something."}]}, "Intermediate": {"text": "U.S. Congressman Michael Cloud has introduced new legislation aimed at preventing the creation of a Central Bank Digital Currency (CBDC) in the United States. The bill, titled the \"Permanent CBDC Ban Act,\" seeks to permanently prohibit the Federal Reserve from developing or implementing a digital dollar.\n\nA CBDC is a digital form of a country's fiat currency, issued and backed by its central bank. Unlike cryptocurrencies such as Bitcoin, which are decentralized and not controlled by a single entity, a CBDC would be centralized, meaning it would be directly controlled by the government or central bank. Many nations globally are exploring or piloting CBDCs, seeing them as a potential way to modernize financial systems, improve payment efficiency, and enhance financial inclusion for those without traditional bank accounts.\n\nHowever, Congressman Cloud and other critics express significant concerns about the implications of a U.S. CBDC. A primary worry is financial privacy. They argue that a government-issued digital currency could allow the central bank to monitor and control individual spending habits, potentially leading to a loss of personal financial freedom. This level of surveillance, they contend, could be used to restrict certain types of transactions or even implement expiration dates on money.\n\nAnother concern revolves around the potential impact on the existing commercial banking system. If citizens hold their money directly with the central bank in digital accounts, it could reduce deposits in commercial banks, potentially affecting their ability to lend and operate. Congressman Cloud's act reflects a broader debate within the U.S. about the role of government in financial transactions and the balance between innovation and individual liberties.\n\nThe introduction of this act marks an important legislative step. It signals a clear stance against a digital dollar and will likely spark further discussion and debate among policymakers, financial experts, and the public regarding the future of money in America.", "vocab": [{"word": "legislation", "definition": "a law or set of laws."}, {"word": "prohibit", "definition": "to formally forbid something."}, {"word": "fiat currency", "definition": "money that a government declares to be legal tender, not backed by a physical commodity."}, {"word": "decentralized", "definition": "not controlled by a single authority."}, {"word": "implications", "definition": "the possible results or effects of something."}, {"word": "surveillance", "definition": "close observation, especially of a suspected spy or criminal."}, {"word": "liberties", "definition": "the state of being free within society from oppressive restrictions."}]}, "Advanced": {"text": "U.S. Representative Michael Cloud (R-TX) has introduced a significant piece of legislation, the \"Permanent CBDC Ban Act,\" aimed at precluding the Federal Reserve from ever developing or implementing a Central Bank Digital Currency (CBDC) in the United States. This move underscores a growing apprehension among some lawmakers regarding the potential ramifications of a government-issued digital dollar.\n\nA CBDC represents a digital iteration of a nation's sovereign currency, issued and backed by its central bank. Unlike decentralized cryptocurrencies such as Bitcoin, which operate on distributed ledger technology, a CBDC would be a centralized digital asset, directly controlled and managed by the monetary authority. Globally, numerous central banks are actively exploring, piloting, or have already launched CBDCs, citing potential benefits such as enhanced payment efficiency, reduced transaction costs, greater financial inclusion for the unbanked, and bolstering monetary policy transmission mechanisms.\n\nHowever, Congressman Cloud and a coalition of critics articulate profound reservations about a U.S. CBDC. A paramount concern centers on financial privacy and the specter of government overreach. Proponents of the ban contend that a CBDC could furnish the central bank with unprecedented visibility into individual financial transactions, potentially enabling pervasive surveillance of citizens' spending habits. This level of granular data, they argue, could be weaponized to impose social controls, restrict specific purchases, or even implement programmable money with expiration dates, thereby eroding fundamental personal economic freedoms.\n\nFurthermore, the act highlights anxieties about the structural integrity of the existing commercial banking system. Should a significant portion of the populace opt to hold their funds directly with the central bank in CBDC accounts, it could precipitate a substantial disintermediation of traditional commercial banks. This shift might diminish their deposit bases, impairing their capacity for lending and credit creation, which are vital for economic growth. Critics also question the necessity of a CBDC, given the robust and innovative private sector payment systems already in place.\n\n The introduction of the \"Permanent CBDC Ban Act\" is a pivotal legislative maneuver that crystallizes the ideological schism surrounding digital currency policy in the U.S. It forces a critical examination of the trade-offs between technological innovation, governmental authority, and individual autonomy. The bill's progression will undoubtedly catalyze extensive debate among economists, financial regulators, privacy advocates, and the broader public, shaping the trajectory of America's monetary future.", "vocab": [{"word": "precluding", "definition": "preventing something from happening or making it impossible."}, {"word": "ramifications", "definition": "the complex or unwelcome consequences of an action or event."}, {"word": "iteration", "definition": "a new version of a computer program or a new attempt at a task."}, {"word": "monetary authority", "definition": "a central bank or other body responsible for controlling the money supply and interest rates."}, {"word": "paramount", "definition": "more important than anything else; of supreme importance."}, {"word": "specter", "definition": "a haunting possibility or threat of something bad happening."}, {"word": "disintermediation", "definition": "the process of removing the middleman or intermediary from transactions, often leading to direct interaction between parties."}, {"word": "schism", "definition": "a split or division between strongly opposed parties, caused by differences in opinion or belief."}]}}, "questions": [{"q": "What is the main goal of the \"Permanent CBDC Ban Act\" introduced by Congressman Cloud?", "a": "The main goal of the act is to permanently stop the Federal Reserve from creating or using a Central Bank Digital Currency (CBDC) in the United States."}, {"q": "What are two main concerns critics have about a Central Bank Digital Currency (CBDC)?", "a": "Two main concerns are the potential loss of financial privacy due to government surveillance of transactions, and the possible negative impact on the existing commercial banking system."}], "id": "a623a8dc083", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimAFBVV95cUxQQktWS2EwUzNhZzZaZFMwdEVDWl80bmthOUlocTJ1aDlKRnNWTjJad21NSDBKRjdObFgzbEdqTVlLa0FRTV9aR2YyRGJzOVRuSXN0R3B0Y1NEU19SLVJLSmNZa3RKWC1ybnRWbjl1YW1xakgwU1ZMTmV6UEVBakZ1dDRzMUhUVWpTM3lqdy1JeWNPVTAtOXRSdg?oc=5", "published": "2026-08-05T06:34:33+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Trump Administration Revokes Brazilian Ambassador's Visa Amid Spat with Lula", "excerpt": "The Trump administration revoked the visa of Brazil's ambassador to the U.S., a significant diplomatic move linked to a political disagreement involving former Brazilian President Lula.", "levels": {"Beginner": {"text": "The Trump administration took a strong step against Brazil. It canceled the visa of Brazil's ambassador to the United States. This happened because of a disagreement with Luiz Inácio Lula da Silva, often called Lula. Lula is a very important political leader in Brazil. He was Brazil's president before and is known for his left-wing politics.\n\nAt the time, the Trump administration had a good relationship with Brazil's president, Jair Bolsonaro. Bolsonaro and Trump shared similar political ideas and were allies. The decision to revoke the ambassador's visa was seen as a way to show disapproval of Lula and his political influence.\n\nCanceling an ambassador's visa is a big deal in diplomacy. It means the ambassador cannot stay in the country and must leave. This action was a clear political message from the U.S. government. It highlighted the tensions between the Trump administration's policies and the political views represented by Lula in Brazil. This event was an unusual move in international relations.", "vocab": [{"word": "administration", "definition": "The group of people who manage a country or organization."}, {"word": "canceled", "definition": "To stop something that was planned or agreed."}, {"word": "visa", "definition": "An official mark in a passport that allows someone to enter or leave a country."}, {"word": "ambassador", "definition": "A high-ranking official who represents their country in another country."}, {"word": "disagreement", "definition": "A situation where people have different opinions."}, {"word": "diplomacy", "definition": "The activity of managing relationships between countries."}]}, "Intermediate": {"text": "During its term, the Trump administration took an unusual diplomatic step by revoking the visa of Brazil's ambassador to the United States. This significant action was reportedly linked to a political \"spat\" involving Luiz Inácio Lula da Silva, a prominent left-wing figure and former president of Brazil.\n\nLula, who previously served two terms as Brazil's president, is a highly influential politician known for his progressive policies and strong social programs. His political ideology often stood in contrast to the conservative principles championed by then-U.S. President Donald Trump and his close ally, Brazil's then-President Jair Bolsonaro. The Trump administration and Bolsonaro shared a strong ideological alignment, fostering a close bilateral relationship during their respective tenures.\n\nThe decision to revoke an ambassador's visa is a serious diplomatic measure, typically reserved for severe breaches of conduct or a declaration of \"persona non grata,\" which signifies that a diplomat is no longer welcome. In this instance, the action was interpreted as a direct political message from the Trump administration, signaling its strong disapproval of Lula and his ongoing political activities and influence in Brazil. While the specific details of the \"spat\" were not fully elaborated, it underscored the deep ideological divisions that characterized international relations during that period.\n\nThis move created a stir in diplomatic circles, as targeting an ambassador over disagreements with an opposition political leader, rather than the sitting government, is uncommon. It reflected the Trump administration's willingness to use diplomatic tools to exert political pressure and convey its stance on internal political dynamics within allied nations. The ambassador, whose name was not widely publicized in connection with this specific event, was effectively forced to leave the United States, marking a notable moment in U.S.-Brazil relations under the Trump presidency.", "vocab": [{"word": "revoking", "definition": "To officially cancel or take back a decision or right."}, {"word": "prominent", "definition": "Important and well-known."}, {"word": "ideology", "definition": "A set of beliefs or ideas, especially political ones."}, {"word": "alignment", "definition": "A position of agreement or alliance."}, {"word": "bilateral", "definition": "Involving two groups or countries."}, {"word": "disapproval", "definition": "The act of showing that you do not like or agree with something."}, {"word": "exert", "definition": "To use power or influence to make something happen."}]}, "Advanced": {"text": "The Trump administration initiated a rare and significant diplomatic maneuver by revoking the visa of Brazil's ambassador to the United States. This extraordinary action was reportedly a direct consequence of a political \"spat\" involving Luiz Inácio Lula da Silva, a towering figure in Brazilian politics and a former two-term president. The move underscored the highly personalized and ideologically driven nature of foreign policy during the Trump era.\n\nLula, a charismatic leader of the Workers' Party, is renowned for his left-wing populist policies, which include extensive social welfare programs and a focus on reducing inequality. His political trajectory and worldview often placed him in stark opposition to the conservative and nationalist agenda espoused by then-U.S. President Donald Trump and his close ideological ally, Brazil's then-President Jair Bolsonaro. The Trump-Bolsonaro alliance represented a significant convergence of right-wing populist movements, characterized by a shared skepticism towards multilateral institutions and a preference for strongman leadership.\n\nThe revocation of an ambassador's visa is a potent diplomatic tool, typically reserved for severe breaches of diplomatic protocol, espionage, or a formal declaration of \"persona non grata.\" Such a measure effectively expels a diplomat, signaling a profound deterioration in bilateral relations. In this particular instance, the rationale appeared less about the ambassador's personal conduct and more about leveraging diplomatic pressure in response to Lula's continued political influence and his vocal criticisms of right-wing governments, including potentially the Trump administration itself. This suggested a willingness by the Trump administration to intervene, albeit indirectly, in the internal political landscape of an allied nation.\n\nDiplomatic observers noted the unusual nature of targeting an ambassador over disagreements with an opposition political leader rather than the incumbent government. This departure from conventional diplomatic practice highlighted the Trump administration's unconventional approach to international relations, where personal loyalties and ideological alignment often superseded traditional state-to-state protocols. The incident served as a stark illustration of how political animosities between leaders could spill over into formal diplomatic channels, potentially straining the broader relationship between nations. While the specific details of Lula's \"spat\" with the Trump administration remained largely unelaborated in public discourse, the action unequivocally conveyed Washington's displeasure with his political standing and activities, forcing the unnamed Brazilian envoy to depart the U.S. This episode remains a notable example of the intricate interplay between domestic politics and international diplomacy during a period of significant global political realignment.", "vocab": [{"word": "maneuver", "definition": "A carefully planned action or movement, especially one that is clever or skillful."}, {"word": "consequence", "definition": "A result or effect of an action or condition."}, {"word": "trajectory", "definition": "The path or course of development of something, often referring to a career or political movement."}, {"word": "espoused", "definition": "Adopted or supported (a cause, belief, or way of life)."}, {"word": "deterioration", "definition": "The process of becoming progressively worse."}, {"word": "leverage", "definition": "To use something to maximum advantage; to use a small amount of force to produce a greater effect."}, {"word": "incumbent", "definition": "Currently holding an office or position."}, {"word": "animosities", "definition": "Strong feelings of dislike or hostility."}]}}, "questions": [{"q": "What specific action did the Trump administration take against Brazil's ambassador?", "a": "The Trump administration revoked or canceled the visa of Brazil's ambassador to the United States."}, {"q": "Who is Luiz Inácio Lula da Silva, and why was he involved in this situation?", "a": "Lula is a prominent former president of Brazil and a significant political leader. The Trump administration's action was linked to a political disagreement or \"spat\" with him, signaling disapproval of his political influence."}], "id": "af196510f21", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxNQUhpY0g4bUd2WnVuZjBacktqVUZMTzNMcEk4Sm9vTU95MjhjcWV6M0REMlRhR05NWDZoRlo1aTBzZ19ueTh6T0NmVnBYTXNXVkIta1VYN2poLWVVWlVqRDN6QnJOVmlqdkluMmpEOFNJemJVeWdaS3E5cEhjUXRDZXRCbk1MVTQyUDJvOE9veFBhZjdhdmZFZl96aDBJZTA1bzQtX0RFNHF0VkM2ak5NbDZkX2tfRS1lamhBeHBqNzM2UDNvamZPa3VUZ1hSZndTZ0hJMnQ5Z0VfUXM?oc=5", "published": "2026-08-05T07:45:29+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Missouri Election Chief Blocks Public Vote on Congressional Map", "excerpt": "Missouri's top election official has rejected a proposal for citizens to vote on new congressional districts, which were supported by former President Trump.", "levels": {"Beginner": {"text": "Missouri's top election official said no to a plan. People wanted to vote on new maps for congressional districts. These maps decide how areas vote for lawmakers in Washington D.C. The maps were supported by former President Trump.\n\nThe official who said no is called the Secretary of State. This person checks if public votes can happen. To get a public vote, people need to collect many signatures. The group that wanted the vote did not collect enough good signatures. So, the Secretary of State rejected their request.\n\nCongressional districts are important. They help choose who represents people in the U.S. House of Representatives. These maps are redrawn every ten years. This happens after the country counts all its people. Sometimes, new maps can help one political party more than another. The group wanted citizens to have a say on these new maps. They believed the maps were not fair. But now, there will be no public vote on them.", "vocab": [{"word": "official", "definition": "a person who has an important job in a government or organization."}, {"word": "reject", "definition": "to say no to something; to not accept."}, {"word": "congressional districts", "definition": "areas drawn on a map that elect one person to the U.S. Congress."}, {"word": "signatures", "definition": "your name written by yourself, often to show you agree with something."}, {"word": "fair", "definition": "treating everyone equally and honestly."}]}, "Intermediate": {"text": "Missouri's chief election official has turned down a proposal that would have allowed citizens to vote on the state's new congressional district map. The Secretary of State, who oversees elections and ballot initiatives, announced the rejection, stating that the group pushing for the referendum failed to gather enough valid signatures from registered voters. This decision means the map, which has been described as \"Trump-backed\" due to its perceived partisan leanings, will not be put to a statewide public vote.\n\nCongressional districts are geographic areas within a state, each electing a representative to the U.S. House of Representatives. These district lines are redrawn every ten years following the national census, a process known as redistricting. The way these lines are drawn can significantly impact election outcomes, often favoring one political party over another. Critics argue that the current map in Missouri was drawn to give an unfair advantage to Republicans, a practice sometimes called gerrymandering.\n\nThe group advocating for the public vote aimed to challenge the new map, believing it did not accurately reflect the state's political balance. They sought to give Missouri voters a direct say on the boundaries that will determine their representation for the next decade. However, state law requires a specific number of verified signatures from different parts of the state to place a measure on the ballot. The Secretary of State's office found that a significant portion of the submitted signatures were invalid, falling short of the legal threshold. This outcome is a setback for those hoping to reform the state's electoral map.\n\nThis rejection effectively ends the effort to overturn the current congressional map through a public referendum. The map, which was approved by the state legislature, will remain in place for upcoming elections, shaping the political landscape of Missouri for years to come. The group behind the petition expressed disappointment but did not immediately indicate further legal action.", "vocab": [{"word": "proposal", "definition": "a plan or suggestion, especially a formal one."}, {"word": "referendum", "definition": "a direct vote by the people on a particular issue or law."}, {"word": "valid", "definition": "legally or officially acceptable; based on truth or fact."}, {"word": "redistricting", "definition": "the process of redrawing electoral district boundaries, usually after a census."}, {"word": "gerrymandering", "definition": "the practice of drawing electoral districts to give an unfair advantage to one political party."}, {"word": "threshold", "definition": "a level or point at which something starts to happen or is considered acceptable."}]}, "Advanced": {"text": "Missouri's top election official has definitively rejected a citizen-led initiative seeking to place the state's contentious congressional district map before voters for a statewide referendum. The Secretary of State, whose office is responsible for verifying ballot petition signatures, announced the decision, citing a significant shortfall in the number of legally valid signatures required to qualify the measure for the ballot. This ruling effectively thwarts efforts by activists to challenge a map widely perceived as a partisan gerrymander, solidifying its use for the foreseeable future.\n\nThe rejected petition aimed to empower Missourians to directly approve or disapprove the congressional boundaries drawn by the state legislature following the 2020 decennial census. The process of redistricting, undertaken every ten years, is a critical exercise in American democracy, determining the composition of the U.S. House of Representatives and shaping political power for a decade. However, it is frequently fraught with political maneuvering, as parties in power often seek to draw lines that maximize their electoral advantage, a practice known as gerrymandering.\n\nThe current Missouri map, passed by the Republican-controlled legislature and signed into law, has been heavily criticized by Democrats and non-partisan groups for creating districts that disproportionately favor Republican candidates. Proponents of the referendum argued that the map does not accurately reflect the state's political demographics and undermines fair representation. They contended that a public vote was essential to restore electoral integrity and ensure that voters, rather than politicians, have the ultimate say in how their communities are represented in Washington D.C.\n\nTo qualify a ballot initiative in Missouri, proponents must collect a minimum number of signatures from registered voters, distributed across a majority of the state's congressional districts. The Secretary of State's office conducted a meticulous review of the submitted petitions, a process that often involves cross-referencing signatures with voter registration databases and verifying addresses. In this instance, a substantial portion of the collected signatures was deemed invalid due to various issues, including duplicate entries, unregistered signatories, or incorrect addresses, ultimately failing to meet the statutory threshold.\n\nThis administrative rejection represents a significant blow to advocates for electoral reform in Missouri. With the referendum path now closed, the \"Trump-backed\" map – so named for its perceived alignment with the former president's political objectives and its strong Republican lean – will govern the state's federal elections for the remainder of the decade. Opponents of the map may explore other avenues, such as legal challenges in state or federal courts, though such efforts are often protracted and face high legal hurdles. The outcome underscores the formidable challenges faced by citizen movements attempting to bypass legislative processes through direct democracy, particularly when confronting well-entrenched political interests.", "vocab": [{"word": "definitively", "definition": "in a way that is final and cannot be changed or questioned."}, {"word": "contentious", "definition": "causing or likely to cause an argument; controversial."}, {"word": "partisan", "definition": "strongly supporting one political party or cause; biased."}, {"word": "decennial census", "definition": "a population count conducted every ten years, used for redistricting."}, {"word": "fraught", "definition": "filled with or destined to result in (something undesirable)."}, {"word": "disproportionately", "definition": "to an extent that is too large or too small in comparison with something else."}, {"word": "statutory threshold", "definition": "a minimum level or limit established by law."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}]}}, "questions": [{"q": "What was the main reason the Missouri election chief rejected the bid for a public vote?", "a": "The main reason was that the group failed to collect enough valid signatures from registered voters to qualify the measure for the ballot."}, {"q": "What is 'redistricting' and how often does it usually happen?", "a": "Redistricting is the process of redrawing the boundaries of electoral districts (like congressional districts). It usually happens every ten years after the national census."}], "id": "a4baa7e78aa", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi3gFBVV95cUxPVnBPeE4ta2lhREpNVDFTRWU2eGMtMk9PZlNsVnA2ZFN3WENCWklSS0J5NWNvbWRZMGVfb18ySkJIeWQtUzBPVHh1X1hoQ0pWSTdJY19xR0RyTmFSdzgwcEp4RU4xTkdKaGZBQWg0ZGhCOVQwNS1CZjBrODZpYThmT0lDSzhBaVhpOG1qSnBaWGxfbTMyLWRCa2dxcUpnZlRmZmR2SFpNRXJRODRnTEYwNUtRbERHYlA5U0xhc3ZkTUtjZlVaeXBRUnc2eDBZU2lXWW5xc2hwSW05MlV3Nmc?oc=5", "published": "2026-08-05T07:36:35+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Giants Continue Training Camp Preparations", "excerpt": "The New York Giants are deep into their training camp, working hard to prepare for the upcoming NFL football season.", "levels": {"Beginner": {"text": "The New York Giants football team is at their training camp. This is where players practice a lot to get ready for the new season. It was their sixth practice day. Players run, catch, and throw the ball. Coaches watch everyone very closely. They want to see who plays well. New players, called rookies, try to show they are good enough to stay on the team. Older players, called veterans, work to keep their spots. Training camp is important because it helps the team get strong and learn to play together. They practice different plays and get in good shape. Soon, they will play games against other teams. The hard work now helps them win later. Everyone hopes for a great season.", "vocab": [{"word": "Giants", "definition": "A professional American football team from New York."}, {"word": "training camp", "definition": "A special time before the season when sports teams practice a lot."}, {"word": "coaches", "definition": "People who teach and train athletes."}, {"word": "rookies", "definition": "Players who are new to the professional team."}, {"word": "veterans", "definition": "Players who have been on the team or in the sport for a long time."}]}, "Intermediate": {"text": "The New York Giants are currently in the midst of their rigorous training camp, with their sixth practice session recently concluded. This crucial period is where the team hones its skills and builds cohesion in anticipation of the upcoming National Football League (NFL) season. During camp, players participate in a variety of drills, from offensive and defensive plays to special teams exercises. Coaches meticulously observe each player's performance, evaluating their strengths and weaknesses. For rookies, training camp is a vital opportunity to prove their worth and secure a spot on the final roster. Veterans, on the other hand, use this time to solidify their positions, refine their techniques, and demonstrate leadership. Beyond individual performance, a key objective of training camp is to foster teamwork and chemistry. Players learn new strategies, understand their roles, and develop trust with their teammates. The physical demands are intense, designed to get players into peak physical condition. The insights gained from each practice, including identifying top performers and areas needing improvement, are essential for the coaching staff as they shape the team for preseason games and ultimately, the regular season.", "vocab": [{"word": "rigorous", "definition": "Very strict, thorough, and demanding."}, {"word": "cohesion", "definition": "The act or state of sticking together tightly; unity."}, {"word": "anticipation", "definition": "A feeling of looking forward to something; expectation."}, {"word": "meticulously", "definition": "In a way that shows great attention to detail; very carefully."}, {"word": "roster", "definition": "A list of players on a team."}, {"word": "foster", "definition": "To encourage the development of something good."}]}, "Advanced": {"text": "The New York Giants are deep into their annual training camp, a pivotal phase in the National Football League (NFL) calendar that lays the groundwork for the demanding season ahead. Their sixth practice session offered further opportunities for evaluation and refinement, as players continue to vie for roster spots and coaches work to implement their strategic vision. Training camp is an intense crucible where individual talent is assessed under pressure and collective chemistry is forged. Rookies face the daunting task of adapting to the professional pace and proving they belong, often competing directly against seasoned veterans who are simultaneously striving to maintain their elite performance levels and secure their roles. The daily grind involves a comprehensive regimen of drills, tactical walkthroughs, and full-contact scrimmages, all designed to push players to their physical and mental limits. Coaching staff meticulously analyze every rep, identifying standout performers, areas of concern, and potential adjustments to schemes and personnel. The concept of 'winners, losers, and takeaways' from each practice, as often highlighted by sports media, underscores the constant state of assessment. A 'winner' might be a player who consistently executes plays flawlessly or demonstrates exceptional leadership, while a 'loser' could be someone struggling with assignments or conditioning. The 'takeaways' are the crucial lessons learned, informing decisions about depth charts, player development, and overall team strategy. This iterative process of practice, evaluation, and adjustment is fundamental to building a competitive team capable of navigating the rigors of the NFL season. The ultimate goal is to cultivate a cohesive unit, physically primed and strategically astute, ready to contend when the regular season commences.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else; central."}, {"word": "refinement", "definition": "The process of improving something by making small changes, in particular, making it more subtle and precise."}, {"word": "crucible", "definition": "A severe test or trial; a place or situation in which concentrated forces interact to cause or influence change or development."}, {"word": "regimen", "definition": "A prescribed course of medical treatment, diet, or exercise for the promotion or restoration of health; a routine."}, {"word": "meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "iterative", "definition": "Relating to or involving iteration, especially of a procedure or process; repetitive."}, {"word": "astute", "definition": "Having or showing an ability to accurately assess situations or people and turn this to one's advantage; shrewd."}]}}, "questions": [{"q": "What is the main purpose of a football team's training camp?", "a": "The main purpose of a football team's training camp is to prepare players for the upcoming season, evaluate their performance, build team chemistry, and implement strategic plays."}, {"q": "What is the difference in focus for rookies and veterans during training camp?", "a": "Rookies primarily focus on proving their worth to secure a spot on the team's roster, while veterans aim to solidify their positions, refine their techniques, and demonstrate leadership."}], "id": "a36a7419aa1", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxQVFJ2bUs2dVNuVWNTem5KcWhUX1BNVWRpRzVKT2Z5Z1JYN1pJYmpVRWJwd3ZzcnVBaHFMN3p2TDRIMmV4eDFsU3BNWjVjSGt4ODdneThOQm84Y20xbm5nd3ZNRDFCeW1lUXQySlM3Qk5zM0FVV1hrRzFsZWpWWlNZNUx6UkpWS2dq?oc=5", "published": "2026-08-05T07:36:26+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Aquinas' return to the football field comes with hunger for redemption - news8000.com", "excerpt": "Aquinas' return to the football field comes with hunger for redemption news8000.com", "levels": {"Beginner": {"text": "Aquinas' return to the football field comes with hunger for redemption news8000.com", "vocab": []}, "Intermediate": {"text": "Aquinas' return to the football field comes with hunger for redemption news8000.com", "vocab": []}, "Advanced": {"text": "Aquinas' return to the football field comes with hunger for redemption news8000.com", "vocab": []}}, "questions": [], "id": "a9d2beac48d", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi5gFBVV95cUxOUUhLLVZWX3Y1S043d0xMQ0lCaVVIYWw1Qk1kcGZKTUN1TG9QanVWaVhjQjducUdVRG5NQjJfd2g0MTRkS3BnVFlqSGY4SHZnTkRrSWhLRVUtZDdjVWplcl9kYmFsMUxJY3hUdTBkc3Q3X3dyT3lYOTVSbmF6Y3pHODNSVUhOdnJ2emVSWjN5bzJHZDJMZDY1QlNKcXR2eWlhWE1jUkVQWEx0aC1DUWpWNGRRVDNxNXdwand2ckFmS2NVUm80RGlFVEpJbkNnbkx2V2g1cnVVQkdWRGxxU2JzWGRYU3ZtUQ?oc=5", "published": "2026-08-05T07:36:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Stock Market Sh const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
