 []}, "Advanced": {"text": "The \"Sultan of Sequins\" created iconic and dazzling costumes for stars including Cher, Tina Turner and Elton John.", "vocab": []}}, "questions": [], "id": "acd3f9f8f8c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmpq04wx8l4eo?at_medium=RSS&at_campaign=rss", "published": "2026-09-15T06:29:12+09:00", "category": "politics"}, {"headline": "Protester Removed from Cuba Talk at Heritage Foundation", "excerpt": "An activist from Code Pink was removed from a Heritage Foundation event after disrupting a discussion on Cuba, protesting U.S. sanctions.", "levels": {"Beginner": {"text": "A person from a group called Code Pink was asked to leave a meeting. This meeting was about Cuba and was held by the Heritage Foundation. The Code Pink person shouted, \"Sanctions kill!\"\n\nCode Pink is a group that wants peace and changes in how the U.S. acts in the world. The Heritage Foundation is a group that thinks about government rules and ideas. They often have different ideas.\n\nThe person was protesting against \"sanctions.\" Sanctions are like special rules that one country puts on another. For example, the U.S. has had sanctions on Cuba for a long time. These rules stop some trade and business between the two countries.\n\nPeople who support sanctions say they can help change a country's government or actions. But people who are against sanctions, like Code Pink, say they hurt regular people in that country. They believe these rules make life very hard for families.\n\nThe meeting was about Cuba, and the activist wanted to show that many people do not like the sanctions. Because the person was shouting and stopping the talk, they were removed from the room. This happened in Washington D.C., where many important meetings take place.", "vocab": [{"word": "protest", "definition": "to show you are against something, often by shouting or holding signs."}, {"word": "sanctions", "definition": "special rules that one country puts on another, often to stop trade."}, {"word": "disrupt", "definition": "to stop something from continuing in a normal way."}, {"word": "activist", "definition": "a person who works to make changes in society or government."}, {"word": "removed", "definition": "taken away from a place."}, {"word": "trade", "definition": "buying and selling goods and services between people or countries."}]}, "Intermediate": {"text": "An activist representing the anti-war advocacy group Code Pink was removed from a discussion on Cuba hosted by the conservative think tank, the Heritage Foundation. The disruption occurred when the activist began shouting \"Sanctions kill!\" during the event, expressing strong opposition to U.S. economic policies toward Cuba.\n\nCode Pink is a women-led grassroots organization known for its direct action and protests against U.S. military interventions and economic sanctions. The Heritage Foundation, on the other hand, is a prominent conservative institution in Washington D.C. that influences public policy with research and analysis, often advocating for policies that support free markets and a strong national defense, including robust stances on foreign policy.\n\nThe incident highlights the long-standing and contentious debate surrounding the U.S. embargo on Cuba. The United States imposed an economic embargo on Cuba in the early 1960s, following the Cuban Revolution and the rise of Fidel Castro's communist government. This embargo restricts trade, travel, and financial transactions between the two countries.\n\nSupporters of the sanctions argue they are a necessary tool to pressure the Cuban government to improve human rights and move towards democracy. They believe the embargo limits the resources available to the communist regime. However, critics, including Code Pink, contend that these sanctions primarily harm the Cuban people by limiting access to essential goods, medicines, and economic opportunities. They argue that the policy is ineffective in achieving its stated goals and instead causes humanitarian suffering.\n\nThe activist's removal underscores the clash of ideologies and the passionate feelings surrounding U.S.-Cuba relations. While the Heritage Foundation aims to foster policy discussions, Code Pink's action was a deliberate attempt to inject a dissenting voice and draw attention to the humanitarian impact they attribute to the sanctions. The event took place in Washington D.C., a hub for political discourse and advocacy.", "vocab": [{"word": "advocacy group", "definition": "a group that works to support or promote a particular cause or policy."}, {"word": "think tank", "definition": "an organization that does research and offers ideas on social, political, or economic issues."}, {"word": "disruption", "definition": "an interruption or disturbance of an event or process."}, {"word": "embargo", "definition": "an official ban on trade or other commercial activity with a particular country."}, {"word": "contentious", "definition": "causing or likely to cause an argument; controversial."}, {"word": "humanitarian", "definition": "concerned with or seeking to promote human welfare."}, {"word": "ideologies", "definition": "a system of ideas and ideals, especially one which forms the basis of economic or political theory and policy."}]}, "Advanced": {"text": "A Code Pink activist was forcibly removed from a Heritage Foundation event focused on Cuba after vociferously disrupting the proceedings with the chant, \"Sanctions kill!\" The incident, reported by The Australian, underscores the persistent ideological divide and impassioned debate surrounding U.S. foreign policy towards the Caribbean nation.\n\nCode Pink, a prominent women-led grassroots organization, is renowned for its anti-war stance and direct action protests against U.S. military interventions and economic sanctions globally. Their intervention at the conservative Heritage Foundation, a highly influential Washington D.C. think tank that shapes public policy through research and advocacy, highlights a stark contrast in their respective approaches to international relations. The Heritage Foundation typically champions policies rooted in free enterprise, limited government, and a robust national defense, often supporting assertive foreign policy measures.\n\nThe protest specifically targeted the long-standing U.S. economic embargo against Cuba, a policy initiated in the early 1960s in the aftermath of the Cuban Revolution and the establishment of a communist government under Fidel Castro. This comprehensive embargo, often referred to as a blockade by its critics, severely restricts trade, financial transactions, and travel between the two nations, aiming to pressure the Cuban government into democratic reforms and improved human rights.\n\nHowever, the efficacy and ethical implications of these sanctions remain a deeply contentious issue. Proponents argue that the embargo is a legitimate instrument of foreign policy, designed to deny resources to an authoritarian regime and foster a transition to democracy. They contend that the Cuban government, not the sanctions, is primarily responsible for the economic hardships faced by its citizens. Conversely, opponents, including Code Pink, vehemently argue that the unilateral coercive measures disproportionately inflict suffering on the Cuban populace, impeding access to essential goods, medicines, and vital economic development. They assert that the embargo has largely failed to achieve its political objectives and instead serves to entrench the regime by providing a convenient scapegoat for domestic problems.\n\nThe activist's removal from the Heritage Foundation's platform illustrates the challenges of fostering civil discourse on highly polarized geopolitical issues. While the Heritage Foundation provides a forum for policy experts to present their analyses, Code Pink's disruptive tactic was a deliberate attempt to inject a dissenting narrative directly into a space often perceived as aligned with pro-sanctions viewpoints. This confrontation in Washington D.C., a nexus of political power and advocacy, serves as a microcosm of the broader international debate on the humanitarian consequences of economic statecraft.", "vocab": [{"word": "vociferously", "definition": "in a loud and forceful manner, often expressing strong opinions."}, {"word": "ideological divide", "definition": "a significant difference in beliefs, values, and political philosophies between groups."}, {"word": "impassioned", "definition": "filled with or showing great emotion."}, {"word": "renowned", "definition": "known or talked about by many people; famous."}, {"word": "assertive", "definition": "having or showing a confident and forceful personality."}, {"word": "efficacy", "definition": "the ability to produce a desired or intended result; effectiveness."}, {"word": "unilateral coercive measures", "definition": "actions taken by one country to force another country to change its policies, often through economic pressure."}, {"word": "microcosm", "definition": "a place or situation that is seen as a small version of something much larger."}]}}, "questions": [{"q": "What organization did the activist who disrupted the event belong to?", "a": "The activist belonged to Code Pink."}, {"q": "What was the main reason the activist was protesting?", "a": "The activist was protesting against U.S. sanctions on Cuba, believing they cause harm to the Cuban people."}], "id": "aaefe0d6f7f", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxPQkJYdUozMHB0SlRva3FPQmd0NzNEVDEzNUt2RzgwVEhIeUw1bnpTWFJyTl9YbUZmREpTR1MycDMweDNYQWhIZ2VWRXc3V0JlbVNEek5OT0JtX1dISFZCQ2EtczdUU0dDSUFPMGxBWXVrV19pQnlybGdaM0wwYjEzcEcwRXJoeDMwTTN4ZGJZVWRxVzVpdjNkUGZLYmNsUzZiQmNKS19tV3RpTk5RLWc3WG1Ka1R2RzJSVzZYMnFFQVZKUGcwVzBCOXk4SDJWR0x2RGFESkJ6RTlhcG1zRDlvZHA1dzRsd201RlM2ZE9QRVJNZzBPR0ZodmExVlRUNDR0aVJvOEluMNIBhwJBV mand for skilled trade workers cbs19.tv", "vocab": []}, "Advanced": {"text": "Texas construction boom fuels demand for skilled trade workers cbs19.tv", "vocab": []}}, "questions": [], "id": "a985028b135", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxPMjNxU0tDWlltdmhhajhuMklybzktMFF2RV9Ra0NUWVo0Zzg4Qm5oYUNIQXI3MDRkLXhEc2NNcUlkaHdRcXRQN3o5YjI5SnZ1Z3ZSbEtCSXIzZkJ5YWFCeElKdEJJakFCVWxDN0ZaWm1fdlJGbWlyWi1lNk0tSDZYVGlheXk5bllCR2N6dWEwSHhuUGRzLW9MNHNSaFZMb1NpZWR5bFBpWXp5WlpIWGgwMQ?oc=5", "published": "2026-09-15T08:47:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Cincinnati Schools Hold Meeting on Upcoming Tax Levy", "excerpt": "Cincinnati Public Schools held a business meeting to discuss an upcoming tax levy, which will soon be presented to voters.", "levels": {"Beginner": {"text": "Cincinnati Public Schools (CPS) recently had an important meeting. This meeting was about money for the schools. Schools need money to pay teachers, buy books, and keep buildings safe.\n\nThe schools get some money from local taxes. Sometimes, they need more money. When they need more, they ask people in the city to vote on a special tax. This special tax is called a \"tax levy.\"\n\nThe meeting was held before this tax levy goes to a \"ballot.\" A ballot is like a list of choices people vote on in an election. So, people in Cincinnati will soon vote on whether to approve this new tax for their schools.\n\nThe school leaders talked about what the money would be used for. They want to make sure students have good schools. Voting \"yes\" on the levy means giving more money to the schools. Voting \"no\" means the schools will not get this extra money. It is an important decision for the community.\n\nThe school district wants to tell everyone why this money is needed. They hope the community will support the schools. This meeting was a step to prepare for the upcoming vote.", "vocab": [{"word": "Schools", "definition": "Places where children learn."}, {"word": "Meeting", "definition": "When people come together to talk about something."}, {"word": "Tax", "definition": "Money people pay to the government to help run things like schools."}, {"word": "Vote", "definition": "To make a choice in an election."}, {"word": "Ballot", "definition": "A paper or system used to record votes."}, {"word": "Support", "definition": "To help or agree with something."}]}, "Intermediate": {"text": "Cincinnati Public Schools (CPS) recently conducted a business meeting to discuss a critical financial matter: an upcoming tax levy. This meeting took place in advance of the levy being placed on the ballot for local voters to consider.\n\nPublic schools, like those in Cincinnati, rely heavily on local funding to operate effectively. A tax levy is a specific local tax measure that, if approved by voters, provides additional financial resources to the school district. These funds are essential for covering a wide range of expenses, including teachers' salaries, classroom materials, maintenance of school buildings, and various educational programs that benefit students.\n\nThe purpose of the business meeting was likely to review the district's financial needs, discuss the specifics of the proposed levy, and strategize on how to communicate its importance to the community. School board members and administrators would have examined the budget implications of the levy, considering what programs or services might be affected if the measure does not pass.\n\nPlacing the levy on the ballot means that residents of Cincinnati will have the opportunity to vote on whether to approve this additional funding for their schools. It's a democratic process that allows the community to directly influence the quality and resources available to local education. School districts often engage in public awareness campaigns to inform voters about the necessity of such levies and how the funds will be utilized.\n\nThe outcome of the vote will have significant implications for Cincinnati Public Schools, impacting its ability to maintain current services or implement new initiatives. This meeting was a preparatory step, ensuring the district is ready to present its case to the electorate and secure the necessary support for its educational mission.", "vocab": [{"word": "Levy", "definition": "A tax or fee imposed by a government or other authority."}, {"word": "Funding", "definition": "Money provided for a particular purpose."}, {"word": "Operate", "definition": "To function or run."}, {"word": "Ballot", "definition": "The list of candidates or issues on which people vote."}, {"word": "Implications", "definition": "The possible results or effects of something."}, {"word": "Electorate", "definition": "All the people in a country or area who are entitled to vote in an election."}, {"word": "Initiatives", "definition": "New plans or strategies designed to achieve a particular aim."}]}, "Advanced": {"text": "Cincinnati Public Schools (CPS) recently convened a pivotal business meeting, a strategic move preceding the placement of a crucial tax levy on the upcoming electoral ballot. This gathering underscores the district's proactive approach to securing its fiscal future and ensuring the continued provision of quality education for its students.\n\nPublic education systems across the United States, particularly urban districts like Cincinnati's, are largely dependent on local property taxes for their operational budgets. A tax levy represents a direct appeal to the electorate for additional financial resources, typically earmarked for specific educational purposes. If approved by voters, these funds are instrumental in sustaining core functions such as competitive teacher salaries, updated curriculum materials, essential building maintenance, technological infrastructure, and a diverse array of academic and extracurricular programs. Without adequate funding, districts often face difficult choices, potentially leading to reductions in staff, larger class sizes, or the curtailment of valuable student services.\n\nThe business meeting likely involved a comprehensive review of the district's current financial standing, a detailed presentation of the proposed levy's specifics, and an in-depth discussion on the strategic communication plan to engage the community. School board members, superintendents, and financial officers would have meticulously analyzed the budgetary ramifications of both the levy's passage and its potential failure. Such deliberations are critical for developing contingency plans and ensuring transparency with the public regarding the district's needs and how the requested funds would be allocated.\n\nThe democratic process of placing a levy on the ballot empowers Cincinnati residents to directly influence the trajectory of their local schools. It necessitates a robust public awareness campaign from the district, designed to inform voters about the rationale behind the levy, the specific uses of the funds, and the broader impact on educational outcomes. The success of such a measure often hinges on the community's understanding of the district's challenges and its perceived value of public education.\n\nThe outcome of this forthcoming vote carries significant implications for Cincinnati Public Schools. A successful levy would provide the necessary financial stability to maintain and enhance educational offerings, while a failure could precipitate budgetary constraints, potentially affecting everything from staffing levels to student support services. This recent meeting was a foundational step in preparing the district to articulate its case compellingly to the electorate, emphasizing its commitment to fostering an environment conducive to student success and community well-being.", "vocab": [{"word": "Convened", "definition": "To call people together for a meeting."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Fiscal", "definition": "Relating to government revenue, especially taxes."}, {"word": "Electorate", "definition": "All the people in a country or area who are entitled to vote in an election."}, {"word": "Instrumental", "definition": "Serving as a means of pursuing an aim or policy."}, {"word": "Infrastructure", "definition": "The basic physical and organizational structures and facilities (e.g., buildings, roads, power supplies) needed for the operation of a society or enterprise."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "Precipitate", "definition": "To cause (an event or situation, typically one that is bad or undesirable) to happen suddenly, unexpectedly, or prematurely."}]}}, "questions": [{"q": "What did Cincinnati Public Schools hold a business meeting about?", "a": "They held a business meeting to discuss an upcoming tax levy."}, {"q": "Why is a tax levy important for public schools?", "a": "A tax levy provides additional financial resources to schools, which are essential for covering expenses like teachers' salaries, classroom materials, building maintenance, and educational programs."}], "id": "a48f7838734", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinAFBVV95cUxNWmlaeU1yc3dLM1lKQ2pLVVQ5Z0RyWWxpSTU4MFp1ZllyLTRkbFZpT3NQYTZlS3B6TUZfbDJRM213MnIzX254QXFKbmpteVdjSnF3ODRPN0xHMVp0Q29GWUExN0VkUWlGbEs2YzViTjllWG9WWlRrcm1udVd3czM5QlkwbjEwRW1LVHdkMTVsNGpZSWhzYUZkQjA5WXg?oc=5", "published": "2026-09-15T08:42:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "U.S. Bond Yields Hit 5% Amid Inflation Fears", "excerpt": "U.S. government bond yields recently reached 5%, a significant milestone driven by concerns about rising oil prices and persistent inflation.", "levels": {"Beginner": {"text": "The U.S. government borrows money by selling special papers called bonds. When you buy a bond, you are lending money to the government. In return, the government promises to pay you back later, plus extra money called \"yield\" or interest.\n\nRecently, the \"yield\" on a very important U.S. government bond went above 5%. This is a big deal because it means the government has to pay more interest to borrow money. When the government pays more, it often means other loans, like for houses or cars, also become more expensive for regular people.\n\nWhy is this happening? One big reason is \"inflation.\" Inflation means that prices for things like food and clothes are going up. People are worried that prices will keep rising. Another reason is the price of oil. When oil prices go up, it costs more to make and transport goods, which also makes prices higher.\n\nWhen the government has to pay more interest, it can slow down the economy. The central bank, called the Federal Reserve, tries to control inflation by making borrowing more expensive. This high bond yield shows that people are concerned about how much things cost and the future of the economy.", "vocab": [{"word": "Yield", "definition": "The extra money you get back when you lend money."}, {"word": "Breaches", "definition": "Goes above or passes a certain level."}, {"word": "Inflation", "definition": "When prices for many things go up over time."}, {"word": "Borrow", "definition": "To take money from someone with the promise to pay it back later."}, {"word": "Economy", "definition": "The system of how a country makes, spends, and uses money and resources."}]}, "Intermediate": {"text": "The yield on a key U.S. government bond, specifically the 10-year Treasury note, recently climbed above 5%. This event marks a significant milestone in the financial markets and has important implications for the broader economy. A bond yield represents the return an investor receives on a bond, and when it rises, it generally means borrowing costs are increasing across the board.\n\nThis surge in yields is primarily driven by mounting concerns over persistent inflation and rising oil prices. Inflation, the rate at which prices for goods and services increase, has remained stubbornly high, prompting fears that the Federal Reserve, the U.S. central bank, will need to keep interest rates elevated for a longer period. Higher interest rates make it more expensive for businesses to borrow and invest, and for consumers to take out loans for homes (mortgages) or cars.\n\nOil prices play a crucial role in inflation. When crude oil becomes more expensive, it increases the cost of transportation, manufacturing, and energy for businesses and households. These higher costs are often passed on to consumers, contributing to overall price increases.\n\nThe Federal Reserve has been actively raising its benchmark interest rate to combat inflation. When the Fed raises rates, it aims to cool down the economy by making borrowing less attractive, thereby reducing demand and slowing price growth. The rising bond yield reflects investors' expectations that the Fed's \"higher for longer\" interest rate policy might continue, or even intensify, to bring inflation under control.\n\nFor everyday Americans, a 5% 10-year Treasury yield can translate into higher mortgage rates, increased costs for credit card debt, and potentially slower job growth as businesses become more cautious. It signals a period of tighter financial conditions and a more challenging economic outlook.", "vocab": [{"word": "Benchmark", "definition": "A standard or point of reference against which things can be measured or compared."}, {"word": "Treasury note", "definition": "A type of bond issued by the U.S. government to borrow money."}, {"word": "Implications", "definition": "The possible results or effects of something."}, {"word": "Mortgages", "definition": "Loans specifically for buying a house or property."}, {"word": "Federal Reserve", "definition": "The central bank of the United States, responsible for monetary policy."}, {"word": "Persistent", "definition": "Continuing to exist or happen, especially for a long time or in a way that is difficult to stop."}, {"word": "Outlook", "definition": "The likely future situation or prospect."}]}, "Advanced": {"text": "The yield on the benchmark U.S. 10-year Treasury note recently breached the critical 5% threshold, a level not seen in over a decade. This significant ascent in sovereign debt yields underscores growing investor apprehension regarding persistent inflationary pressures, the trajectory of monetary policy, and the broader economic outlook. The 10-year Treasury is a bellwether for global financial markets, influencing everything from mortgage rates to corporate borrowing costs and the valuation of equities.\n\nThe primary catalysts for this surge are multifaceted. Foremost among them are entrenched inflation concerns. Despite a series of aggressive interest rate hikes by the Federal Reserve, the U.S. economy has demonstrated remarkable resilience, with robust job growth and consumer spending. This strength, coupled with elevated energy prices — particularly crude oil, which directly impacts transportation and manufacturing costs — fuels expectations that inflation may prove more stubborn than initially anticipated. Geopolitical tensions further exacerbate oil price volatility, adding another layer of uncertainty.\n\nInvestors are also grappling with the Federal Reserve's \"higher for longer\" narrative. Fed officials have consistently signaled their commitment to bringing inflation down to their 2% target, even if it entails maintaining restrictive monetary policy for an extended duration. This hawkish stance has led market participants to price in the likelihood of sustained elevated interest rates, pushing bond yields higher. The inverse relationship between bond prices and yields means that as investors sell off existing bonds in anticipation of higher future rates, yields rise.\n\nFurthermore, increasing government debt and fiscal deficits contribute to upward pressure on yields. When the government issues more debt to finance its spending, it increases the supply of bonds, which can depress prices and elevate yields, especially if demand does not keep pace.\n\nThe implications of a 5% 10-year Treasury yield are far-reaching. For consumers, it translates into higher borrowing costs for mortgages, auto loans, and credit card debt, potentially dampening housing market activity and discretionary spending. For businesses, it raises the cost of capital, which can curtail investment, slow hiring, and compress corporate earnings. In equity markets, higher yields make \"risk-free\" government bonds more attractive relative to stocks, potentially leading to a reallocation of capital and downward pressure on stock valuations. This environment also heightens the risk of a potential economic slowdown or recession as the cumulative effect of tighter financial conditions takes hold. The Federal Reserve faces the delicate balancing act of taming inflation without triggering an undue economic contraction.", "vocab": [{"word": "Sovereign debt", "definition": "Debt issued by a national government."}, {"word": "Bellwether", "definition": "Something that indicates a trend or is a leading indicator of future events."}, {"word": "Inverse relationship", "definition": "A relationship between two variables where one variable increases as the other decreases."}, {"word": "Fiscal policy", "definition": "The use of government spending and taxation to influence the economy."}, {"word": "Monetary policy", "definition": "Actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "Hawkish stance", "definition": "An aggressive or firm approach, especially in monetary policy, often focused on controlling inflation even at the risk of slower economic growth."}, {"word": "Recessionary pressures", "definition": "Economic conditions or factors that increase the likelihood of an economic downturn or recession."}, {"word": "Taming", "definition": "To bring under control; to reduce the power or intensity of something."}]}}, "questions": [{"q": "What is the main reason U.S. bond yields are rising?", "a": "U.S. bond yields are rising primarily due to concerns about persistent inflation and increasing oil prices, which suggest the Federal Reserve may keep interest rates high for longer."}, {"q": "How might rising bond yields affect everyday people?", "a": "Rising bond yields can make borrowing more expensive for everyday people, leading to higher interest rates on mortgages, car loans, and credit card debt, and potentially slowing job growth."}], "id": "a86c3c4d0d1", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2gFBVV95cUxONWlDQUlzOEx1YkJrcGhZc010VzdXajdZMWRyLUZQQ0FvRmJOMk05Z0h4YjRGMGtOMWxUY0plQzcyOWNEbkxFZ2tTcHRkZTUxazU1Sm1IUlE2ZUx2WTM5YlNkWE9EMXVMdWFBMFY3dWwyNmpjQllxSUEwYTc2ZFN2Wk9OVk9VSUlZenZTbERCZjlCWk81aDNjb0VYZTFFZHRWOWdVNVhoMUJaUi1JaVNlcm9UaXo1TEFGbTlDc0I2Zng4Wi03M0pWNkQ1cWpvdFFYM09HNE9hMDdMZw?oc=5", "published": "2026-09-15T08:25:10+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Why cash continues to thrive even as India's digital payments grow - BBC", "excerpt": "Why cash continues to thrive even as India's digital payments grow BBC", "levels": {"Beginner": {"text": "Why cash continues to thrive even as India's digital payments grow BBC", "vocab": []}, "Intermediate": {"text": "Why cash continues to thrive even as India's digital payments grow BBC", "vocab": []}, "Advanced": {"text": "Why cash continues to thrive even as India's digital payments grow BBC", "vocab": []}}, "questions": [], "id": "a75e9a6c115", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiWkFVX3lxTFBmOHNhenZrX05RWjg4U1pLX251RkhOUWxoV0p3UUZGQ19oaFJuTFNMdUplV1c0bHluY25sekRPR0p4YnJkMmZPTVhTNFNnMDdQRGlkWWw3a0RuUQ?oc=5", "published": "2026-09-15T08:15:29+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "The Supreme Court rejects Trump's mail voting restrictions for this year's midterms", "excerpt": "The Supreme Court has rejected the Trump administration's request to allow mail-in voting restrictions under a U.S. Postal Service plan for ", "levels": {"Beginner": {"text": "The Supreme Court has rejected the Trump administration's request to allow mail-in voting restrictions under a U.S. Postal Service plan for the midterm general election.", "vocab": []}, "Intermediate": {"text": "The Supreme Court has rejected the Trump administration's request to allow mail-in voting restrictions under a U.S. Postal Service plan for the midterm general election.", "vocab": []}, "Advanced": {"text": "The Supreme Court has rejected the Trump administration's request to allow mail-in voting restrictions under a U.S. Postal Service plan for the midterm general election.", "vocab": []}}, "questions": [], "id": "ad6b1e10e4d", "source": "NPR Topics: Politics", "link": "https://www.npr.org/2026/09/14/nx-s1-5962190/supreme-court-mail-in-voting-trump", "published": "2026-09-15T08:38:40+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Mitch McConnell Returns to Senate After Medical Absence", "excerpt": "Senate Minority Leader Mitch McConnell has returned to work after a fall caused him to be away for several weeks.", "levels": {"Beginner": {"text": "Mitch McConnell is a very important leader in the U.S. Senate. He is the leader of the Republican Party in the Senate. This group is called the Senate Minority. Recently, he was away from work for many weeks. This was because he fell down. When he fell, he was briefly unconscious. This means he passed out for a short time. He had to go to the hospital to get help. After the hospital, he needed a lot of time to get better. This time was called a recovery process. He spent weeks getting well and resting. Now, he is back at his job in the Senate. He returned to Washington D.C. to continue his work. Many people are happy to see him return. His return means he can continue his important work as a senator. He helps make important decisions for the country. His absence was noticed by many, and his return is a big news story in politics. He is a very experienced politician.", "vocab": [{"word": "leader", "definition": "a person who guides or directs a group."}, {"word": "Senate", "definition": "one of the two parts of the U.S. Congress."}, {"word": "unconscious", "definition": "not awake; passed out."}, {"word": "hospital", "definition": "a place where sick or hurt people get medical care."}, {"word": "recovery", "definition": "the process of getting better after being sick or hurt."}, {"word": "absence", "definition": "a time when someone is not present."}]}, "Intermediate": {"text": "Senate Minority Leader Mitch McConnell has officially returned to the U.S. Capitol, ending an extended medical absence that lasted several weeks. The Kentucky Republican, a prominent figure in American politics, had been away from his duties after suffering a fall. The incident occurred in early March, leading to his hospitalization. McConnell later revealed that he was \"briefly unconscious\" following the fall, which necessitated a period of intensive recovery. His absence created a temporary void in Republican leadership within the Senate. As the longest-serving Senate Republican leader in history, McConnell's presence is crucial for guiding his party's legislative strategy and negotiating with the Democratic majority. During his recovery, other Republican senators stepped up to manage daily operations, but his return brings back his experienced hand to the helm. His return was met with relief by many of his colleagues and supporters. McConnell's office confirmed his return, stating he was eager to resume his full responsibilities. The fall and subsequent recovery highlighted the physical demands of a high-profile political career, even for seasoned veterans. His return allows him to re-engage directly in ongoing legislative debates, including budget negotiations and other key policy discussions. This marks a significant moment for the Senate, as one of its most influential members is back in action after a health scare. His long tenure in the Senate means he has a deep understanding of the legislative process and strong relationships across the aisle. His colleagues expressed well wishes during his time away, and his return signals a return to full strength for the Republican caucus.", "vocab": [{"word": "officially", "definition": "in a formal and authorized way."}, {"word": "prominent", "definition": "important and well-known."}, {"word": "duties", "definition": "tasks or responsibilities that are part of one's job."}, {"word": "necessitated", "definition": "made something necessary."}, {"word": "void", "definition": "an empty space or feeling of absence."}, {"word": "crucial", "definition": "extremely important or essential."}, {"word": "legislative", "definition": "relating to the process of making laws."}]}, "Advanced": {"text": "Senate Minority Leader Mitch McConnell has concluded his extended medical leave, making a highly anticipated return to the U.S. Capitol after several weeks of recuperation. The Kentucky Republican, a towering figure in American politics and the longest-serving Senate Republican leader in history, had been sidelined since early March following a fall. The incident, which occurred at a private dinner, led to his hospitalization and a subsequent period of intensive recovery. McConnell later disclosed that he had been \"briefly unconscious\" after the fall, prompting concerns about his health and the stability of Republican leadership in the upper chamber. His absence created a palpable void within the Senate's Republican caucus, particularly given his unparalleled experience in legislative strategy and his pivotal role in navigating complex political landscapes. During his recuperation, other senior Republican senators temporarily assumed some of his responsatorial duties, but none could fully replicate his unique influence and institutional knowledge. McConnell's return has been met with a collective sigh of relief from his colleagues and party loyalists. His office confirmed his readiness to fully re-engage, emphasizing his commitment to his responsibilities. The health scare underscored the rigorous demands of a high-profile political career, even for a seasoned veteran like McConnell, who has served in the Senate for decades. His presence is indispensable for guiding the Republican agenda, particularly as the party faces critical legislative battles, including ongoing budget negotiations, debt ceiling discussions, and debates over judicial appointments. McConnell's ability to unify his caucus, even amidst internal divisions, and to strategically counter the Democratic majority is a cornerstone of his leadership. His return ensures that the Republican voice will be articulated with its customary force and strategic acumen in the nation's capital. This event marks a significant moment for the Senate, signaling the return to full operational capacity of one of its most influential and enduring members. His long tenure has afforded him a deep reservoir of political capital and a nuanced understanding of congressional dynamics, making his active participation vital for both his party and the broader legislative process. The episode serves as a reminder of the fragility of even the most robust political careers and the constant scrutiny faced by public figures. His return is not merely symbolic; it restores a key negotiator and strategist to the forefront of Washington's political machinations, especially as the country heads into a presidential election cycle.", "vocab": [{"word": "recuperation", "definition": "the process of recovering from illness or exertion."}, {"word": "towering", "definition": "extremely tall or high; (figuratively) very important or influential."}, {"word": "palpable", "definition": "(of a feeling or atmosphere) so intense as to be almost touched or felt."}, {"word": "unparalleled", "definition": "having no equal or peer; unmatched."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "indispensable", "definition": "absolutely necessary."}, {"word": "acumen", "definition": "the ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "machinations", "definition": "a plot or scheme."}]}}, "questions": [{"q": "Why was Mitch McConnell away from the Senate for several weeks?", "a": "He was away because he fell down, was briefly unconscious, and needed time to recover after being hospitalized."}, {"q": "What is Mitch McConnell's role in the U.S. Senate?", "a": "He is the Senate Minority Leader, meaning he leads the Republican Party in the Senate."}], "id": "acac1f2967e", "source": "NPR Topics: Politics", "link": "https://www.npr.org/2026/09/14/nx-s1-5968909/mitch-mcconnell-senate-return", "published": "2026-09-15T07:36:33+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Ravens Rookie Punter Had An Excellent Debut - Yahoo Sports", "excerpt": "Ravens Rookie Punter Had An Excellent Debut Yahoo Sports", "levels": {"Beginner": {"text": "Ravens Rookie Punter Had An Excellent Debut Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Ravens Rookie Punter Had An Excellent Debut Yahoo Sports", "vocab": []}, "Advanced": {"text": "Ravens Rookie Punter Had An Excellent Debut Yahoo Sports", "vocab": []}}, "questions": [], "id": "ab8fc441bf1", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwF  that give information or help."}]}, "Intermediate": {"text": "The New York Times' daily word puzzle, Connections, continues to captivate players worldwide. For September 15th, enthusiasts tackled puzzle number 722, a special \"Sports Edition\" that challenged their knowledge of athletic terminology and related concepts. The game has quickly become a popular addition to the New York Times' renowned suite of daily puzzles, which also includes the famous Wordle and the classic Crossword.\n\nConnections requires players to identify hidden relationships between 16 seemingly random words, grouping them into four sets of four. Each group shares a common theme, but the categories can be tricky, ranging from obvious associations to more subtle linguistic connections. The game's appeal lies in its blend of logic, vocabulary, and lateral thinking, offering a fresh mental workout each day. Players must be careful, as they only get a limited number of mistakes before failing the puzzle.\n\nWhile many players pride themselves on solving the puzzle independently, the daily challenge can sometimes prove formidable. This is where resources like CNET come into play, offering hints and even full solutions for those who find themselves stumped. These guides help players understand the logic behind the day's categories, allowing them to complete the puzzle and learn from the experience, rather than simply giving up.\n\nThe \"Sports Edition\" often tests players' familiarity with various sports, equipment, or famous figures, adding an extra layer of difficulty for some. The availability of assistance ensures that the game remains accessible and enjoyable for a broad audience, fostering a sense of accomplishment even when a little help is needed. The widespread popularity of Connections highlights a growing interest in daily brain-teasing games that offer both entertainment and mental stimulation, making it a beloved part of many people's morning routines.", "vocab": [{"word": "captivate const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
