 political debate for centuries, marked by periods of conflict and peace efforts, notably the Good Friday Agreement in 1998, which brought an end to decades of violence. This agreement established a framework for power-sharing and included a provision for a future vote on unification if the people of Northern Ireland wished for it.\n\nAnalysts suggest that Trump's remarks were likely aimed at a specific audience: Irish-American voters in the United States. There is a large and influential Irish diaspora in the U.S., and appealing to this demographic can be a strategic move for politicians seeking support. By voicing support for a united Ireland, Trump may be trying to gain favor with this important voter base.\n\nWhile the idea of a united Ireland is a deeply sensitive topic with various viewpoints on its feasibility and implications, Trump's intervention has brought it back into the global spotlight. His statement is seen by many as a calculated political gesture rather than a direct policy proposal, designed to resonate with a particular segment of the American electorate.", "vocab": [{"word": "Headlines", "definition": "main news stories, often printed in large letters at the top of newspapers."}, {"word": "United", "definition": "joined together as one nation or group."}, {"word": "Complex", "definition": "having many different parts and difficult to understand."}, {"word": "History", "definition": "the study of past events."}, {"word": "Agreement", "definition": "a decision or promise made by two or more people or groups."}, {"word": "Diaspora", "definition": "a group of people who have spread from their original homeland to other parts of the world."}, {"word": "Strategic", "definition": "done as part of a plan, especially in politics or business."}]}, "Advanced": {"text": "Former U.S. President Donald Trump recently ignited a global discussion by voicing his aspiration for a united Ireland, a statement that quickly became a prominent international headline. His remarks suggest a desire for Northern Ireland, currently a constituent part of the United Kingdom, to integrate with the Republic of Ireland, forming a singular sovereign state. This intervention, while seemingly abrupt, is widely interpreted by political commentators as a strategically calculated appeal to a specific demographic across the Atlantic.\n\nThe issue of Irish unification is steeped in centuries of intricate history, marked by periods of intense sectarian conflict and subsequent peace processes. The landmark 1998 Good Friday Agreement, which largely brought an end to \"The Troubles,\" established a framework for peace and power-sharing, while also including a mechanism for a border poll on unification, should conditions warrant it. This delicate balance has been a cornerstone of stability in the region for decades.\n\nTrump's comments are largely understood as an overture to the substantial and politically active Irish-American community in the United States. This diaspora has historically maintained a keen interest in Irish affairs, often advocating for a united Ireland, and their electoral support can be a significant factor in American politics, particularly in swing states. By expressing solidarity with the concept of a united Ireland, Trump may be seeking to galvanize this voter base ahead of future political endeavors, tapping into a deep-seated cultural and historical connection.\n\nWhile the prospect of a united Ireland remains a deeply sensitive and multifaceted issue, with varying opinions on its economic, social, and political implications, Trump's statement has undeniably propelled it back into the international discourse. Recent political shifts, particularly Brexit, have reignited debates about Northern Ireland's constitutional status and its relationship with both the UK and the Republic of Ireland, adding another layer of complexity to the discussion. Analysts emphasize that such pronouncements from a former head of state carry symbolic weight, even if they do not represent immediate policy shifts, and serve primarily as a tool for domestic political maneuvering rather than a blueprint for international diplomacy.", "vocab": [{"word": "Aspiration", "definition": "a strong desire to achieve something high or great."}, {"word": "Constituent", "definition": "forming a part of a whole."}, {"word": "Integrate", "definition": "to combine two or more things to make them work together as one."}, {"word": "Sovereign", "definition": "having supreme power or authority; independent."}, {"word": "Intricate", "definition": "very complicated or detailed."}, {"word": "Sectarian", "definition": "relating to religious or political groups that are often in conflict."}, {"word": "Landmark", "definition": "an event, discovery, or change that marks an important stage in something."}, {"word": "Diaspora", "definition": "the dispersion of any people from their original homeland."}]}}, "questions": [{"q": "What is a \"united Ireland\" according to the article?", "a": "It refers to the idea of Northern Ireland joining the Republic of Ireland to form one country."}, {"q": "Why do analysts believe Donald Trump made these comments?", "a": "Analysts suggest he made the comments to appeal to Irish-American voters in the United States."}], "id": "aa0bd5c46e0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cwyzppd1d5lo?at_medium=RSS&at_campaign=rss", "published": "2026-09-13T06:25:28+09:00", "category": "politics"}, {"headline": "Anthropic boss Dario Amodei calls for AI development to slow down", "excerpt": "The call comes amid growing concerns that AI models may become able to inflict serious damage worldwide.", "levels": {"Beginner": {"text": "The call comes amid growing concerns that AI models may become able to inflict serious damage worldwide.", "vocab": []}, "Intermediate": {"text": "The call comes amid growing concerns that AI models may become able to inflict serious damage worldwide.", "vocab": []}, "Advanced": {"text": "The call comes amid growing concerns that AI models may become able to inflict serious damage worldwide.", "vocab": []}}, "questions": [], "id": "a12635b5026", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c14dpgm0rg4o?at_medium=RSS&at_campaign=rss", "published": "2026-09-13T06:16:47+09:00", "category": "politics"}, {"headline": "Ukrainian Tennis Star's Home Hit by Missile in Odesa", "excerpt": "Ukrainian tennis player Dayana Yastremska's Odesa flat was destroyed by a Russian missile, leaving only her Roland Garros towel.", "levels": {"Beginner": {"text": "Ukrainian tennis player Dayana Yastremska shared sad news. Her home in the city of Odesa was hit by a Russian missile. She said it was a \"direct hit.\" This means the missile hit her flat right away. Dayana Yastremska is a well-known athlete from Ukraine. She plays tennis around the world. \n\nAfter the missile strike, she lost almost everything she owned. Her flat was badly damaged. It was a very hard moment for her. She posted a picture showing the damage. In her message, she said that only one item was left from her home: a special towel from the Roland Garros tennis tournament. This towel is a memory from her tennis career. \n\nThe war in Ukraine has caused much destruction. Many people have lost their homes and belongings. Dayana Yastremska's story shows how the conflict affects everyone, even famous sports stars. It is a reminder of the difficult times people in Ukraine are facing every day.", "vocab": [{"word": "hit", "definition": "To strike or be struck by something with force."}, {"word": "missile", "definition": "A weapon that flies through the air to hit a target."}, {"word": "damaged", "definition": "Harm or injury that makes something less valuable or useful."}, {"word": "lost", "definition": "No longer having something; unable to find something."}, {"word": "destruction", "definition": "The act of causing so much damage that something is completely ruined."}, {"word": "conflict", "definition": "A serious disagreement or fight, often between countries."}]}, "Intermediate": {"text": "Ukrainian tennis star Dayana Yastremska has revealed that her apartment in the port city of Odesa suffered a \"direct hit\" from a Russian missile. The athlete, who is a prominent figure in international tennis, shared the devastating news on social media, highlighting the personal impact of the ongoing conflict in her home country. She expressed profound sadness over the loss of her belongings, stating that virtually everything in her flat was destroyed.\n\nIn a poignant message, Yastremska noted that amidst the wreckage, only one item remained intact: a towel from the prestigious Roland Garros tennis tournament. This single surviving memento serves as a powerful symbol of her career and the sudden, indiscriminate nature of the destruction caused by the war. Odesa, a strategically important city on Ukraine's Black Sea coast, has been a frequent target of Russian attacks since the full-scale invasion began in February 2022.\n\nYastremska's experience underscores the widespread devastation affecting Ukrainian civilians, regardless of their public profile. Her story brings a human face to the broader humanitarian crisis, reminding the world that the conflict continues to disrupt lives and cause immense suffering. The loss of her home is a stark reminder of the daily challenges and dangers faced by millions in Ukraine, as they navigate a reality marked by constant threats and the destruction of their communities.", "vocab": [{"word": "revealed", "definition": "Made known to others; disclosed."}, {"word": "prominent", "definition": "Important or famous."}, {"word": "devastating", "definition": "Causing a lot of damage or destruction."}, {"word": "profound", "definition": "Very great or intense."}, {"word": "poignant", "definition": "Evoking a keen sense of sadness or regret."}, {"word": "indiscriminate", "definition": "Done at random or without careful judgment; affecting many people or things in a careless way."}, {"word": "humanitarian", "definition": "Concerned with or seeking to promote human welfare."}]}, "Advanced": {"text": "Ukrainian tennis professional Dayana Yastremska has publicly disclosed that her apartment in Odesa, a vital port city on the Black Sea, sustained a direct hit from a Russian missile. The 24-year-old athlete, a familiar presence on the WTA Tour, conveyed the profound personal toll of the ongoing conflict through a social media post, lamenting the near-total destruction of her personal effects.\n\nIn a particularly poignant detail, Yastremska highlighted that amidst the extensive wreckage, the sole surviving item was a towel from the esteemed Roland Garros Grand Slam tournament. This artifact, a tangible link to her professional career, now stands as a stark emblem of both personal loss and the indiscriminate nature of modern warfare, where civilian infrastructure frequently becomes collateral damage. Odesa, with its strategic maritime importance, has been a recurring target for Russian aerial assaults since the full-scale invasion commenced in February 2022, facing barrages of missiles and drones.\n\nYastremska's experience transcends a mere personal anecdote; it serves as a powerful microcosm of the broader humanitarian crisis unfolding across Ukraine. Her public profile lends visibility to the plight of countless civilians who have lost their homes, livelihoods, and sense of security. The psychological trauma associated with such sudden and devastating loss, particularly in one's sanctuary, is immense. This incident underscores the relentless challenges faced by Ukrainians, who must navigate a precarious existence under the shadow of conflict, striving for normalcy while their communities endure persistent threats and reconstruction efforts remain paramount. The international community often grapples with the long-term ramifications of such widespread destruction, both material and psychological.", "vocab": [{"word": "disclosed", "definition": "Revealed or made known, often something previously secret or private."}, {"word": "vital", "definition": "Absolutely necessary or important; essential for life or success."}, {"word": "conveyed", "definition": "Communicated or expressed an idea, feeling, or message."}, {"word": "lamenting", "definition": "Expressing passionate grief or sorrow; regretting deeply."}, {"word": "extensive", "definition": "Covering a large area; considerable in amount or degree."}, {"word": "indiscriminate", "definition": "Done or acting without careful judgment; affecting many people or things in a careless or random way."}, {"word": "microcosm", "definition": "A community, place, or situation regarded as encapsulating in miniature the characteristic features or qualities of something much larger."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event, especially one that is not immediately obvious."}]}}, "questions": [{"q": "What city was Dayana Yastremska's flat located in?", "a": "Dayana Yastremska's flat was located in Odesa."}, {"q": "According to Dayana Yastremska, what was the only item left after her flat was hit?", "a": "The only item left after her flat was hit was a towel from the Roland Garros tennis tournament."}], "id": "a765a8232d8", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c4gr33g3evlo?at_medium=RSS&at_campaign=rss", "published": "2026-09-13T05:27:25+09:00", "category": "politics"}, {"headline": "Deadly Fire at Chilean Nursing Home Claims 16 Lives", "excerpt": "A devastating fire at a nursing home in Chile's Araucanía region killed 16 residents, with ten people evacuated.", "levels": {"Beginner": {"text": "A very sad fire happened in Chile. It was at a home for old people, called a nursing home. The fire killed 16 people who lived there. These people were residents of the home. The nursing home is in a place called Araucanía region. This region is in the middle of Chile.\n\nWhen the fire started, many people tried to help. Firefighters came quickly. They worked hard to stop the fire. Ten other people who lived in the home were saved. They were evacuated, which means they were taken out to a safe place.\n\nIt is a very sad day for Chile. Many families are sad because their loved ones died. The police will now look into why the fire started. They want to know what happened. It is important to keep old people safe in their homes. This fire shows how dangerous fires can be, especially for people who cannot move easily. Everyone hopes such a sad event does not happen again.", "vocab": [{"word": "Killed", "definition": "Made someone die."}, {"word": "Residents", "definition": "People who live in a place."}, {"word": "Evacuated", "definition": "Moved people out of a dangerous place to a safe one."}, {"word": "Home", "definition": "A place where people live."}, {"word": "Region", "definition": "A large area of a country."}, {"word": "Dangerous", "definition": "Not safe, can cause harm."}]}, "Intermediate": {"text": "A tragic fire has claimed the lives of 16 residents at a nursing home in Chile. The devastating incident occurred in the Araucanía region, located in central Chile. This facility provided care for elderly individuals, many of whom have limited mobility or require assistance with daily tasks. The fire broke out, causing widespread damage and a rapid emergency response.\n\nAuthorities confirmed that in addition to the fatalities, ten other residents were successfully evacuated from the burning building. Emergency services, including firefighters and paramedics, responded swiftly to the scene. Their quick actions helped prevent an even higher death toll by rescuing those who could be reached and by containing the blaze. The evacuated residents were taken to nearby hospitals or other care facilities for assessment and support, many suffering from smoke inhalation or minor injuries.\n\nThe loss of life is a profound tragedy for the community and the families of the victims. Nursing home residents are often among the most vulnerable members of society, making such incidents particularly heartbreaking. The Chilean government and local authorities have expressed their condolences and pledged support to those affected, promising a thorough inquiry into the circumstances.\n\nAn investigation into the cause of the fire is now underway. Officials will examine fire safety protocols, the building's structure, and any potential factors that contributed to the rapid spread of the blaze. This includes looking at alarm systems, sprinkler systems, and emergency exit routes. The goal is to understand exactly what happened to prevent similar tragedies in the future. Ensuring the safety of elderly care facilities is a critical concern, and this incident highlights the importance of stringent safety measures and regular inspections to protect vulnerable populations across the country.", "vocab": [{"word": "Tragic", "definition": "Very sad or unfortunate."}, {"word": "Facility", "definition": "A place built for a special purpose, like a nursing home."}, {"word": "Authorities", "definition": "Official groups or people in charge, like the police or government."}, {"word": "Vulnerable", "definition": "Easily hurt or harmed, physically or emotionally."}, {"word": "Investigation", "definition": "An official examination to find out the truth about something."}, {"word": "Protocols", "definition": "Official rules or procedures to be followed."}, {"word": "Stringent", "definition": "Very strict and precise."}]}, "Advanced": {"text": "A catastrophic fire has tragically claimed the lives of 16 residents at a nursing home in Chile, underscoring the critical vulnerabilities within care facilities for the elderly. The devastating inferno erupted in the Araucanía region, a central area of Chile, leaving a community reeling from the profound loss. The facility, which provided essential long-term care for its elderly inhabitants, housed many individuals with significant mobility impairments or complex health needs, rendering them particularly susceptible in an emergency. The intensity of the fire and its rapid spread posed immense challenges for both residents and first responders.\n\nIn the wake of the blaze, authorities confirmed that while 16 fatalities were recorded, a further ten residents were successfully evacuated from the engulfed structure. Emergency services, including multiple fire brigades and medical personnel, mounted a swift and coordinated response. Their immediate actions were instrumental in preventing an even greater loss of life, as they battled the flames and rescued those who could be reached amidst the chaos. The survivors, many suffering from smoke inhalation and varying degrees of trauma, were promptly transported to local hospitals and alternative care facilities for urgent medical assessment and ongoing support. The emotional toll on staff, residents, and their families is immeasurable, as they grapple with the sudden and violent loss.\n\nThis incident represents a poignant tragedy, deeply affecting the families of the victims and the broader community. Elderly care residents constitute one of society's most vulnerable demographics, making such catastrophic events profoundly distressing. Both the Chilean government and local municipal authorities have extended their deepest condolences to the bereaved and have committed to a comprehensive and transparent inquiry into the circumstances surrounding the fire. This commitment includes ensuring psychological support for those traumatized by the event.\n\nThe ongoing investigation aims to meticulously unravel the precise cause of the conflagration. Investigators will scrutinize existing fire safety protocols, the structural integrity of the building, and any potential deficiencies in emergency preparedness and response mechanisms. This includes a thorough review of fire alarm systems, sprinkler installations, emergency lighting, and the accessibility of evacuation routes. Experts will also assess the training of staff for emergency situations and the effectiveness of evacuation plans for residents with limited mobility. The overarching objective is to ascertain the factors that contributed to the rapid escalation of the blaze and to implement corrective measures to avert similar future calamities. This tragic event serves as a stark reminder of the imperative for stringent safety standards, rigorous compliance, and regular, unannounced inspections across all elderly care facilities to safeguard the lives of their vulnerable occupants, ensuring that such a devastating loss is never repeated.", "vocab": [{"word": "Catastrophic", "definition": "Causing sudden, great damage or suffering."}, {"word": "Inferno", "definition": "A large, uncontrolled and destructive fire."}, {"word": "Vulnerabilities", "definition": "Weaknesses or susceptibilities that make something easily harmed or attacked."}, {"word": "Poignant", "definition": "Evoking a keen sense of sadness or regret."}, {"word": "Conflagration", "definition": "An extensive and destructive fire."}, {"word": "Scrutinize", "definition": "To examine or inspect something very closely and thoroughly."}, {"word": "Imperative", "definition": "Of vital importance; crucial."}, {"word": "Avert", "definition": "To prevent (an anticipated undesirable event) from occurring."}]}}, "questions": [{"q": "How many residents died in the nursing home fire?", "a": "Sixteen residents died in the fire."}, {"q": "Where in Chile did the fire occur?", "a": "The fire occurred in a nursing home in the Araucanía region of central Chile."}], "id": "a225b124e79", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cy4zpp20w77o?at_medium=RSS&at_campaign=rss", "published": "2026-09-13T04:36:50+09:00", "category": "politics"}, {"headline": "Alien Terrorist Removal Court deports legal US resident to Afghanis  as the first Punjabi singer to headline the iconic music venue.", "levels": {"Beginner": {"text": "Wembley Stadium billed Diljit Dosanjh as the first Punjabi singer to headline the iconic music venue.", "vocab": []}, "Intermediate": {"text": "Wembley Stadium billed Diljit Dosanjh as the first Punjabi singer to headline the iconic music venue.", "vocab": []}, "Advanced": {"text": "Wembley Stadium billed Diljit Dosanjh as the first Punjabi singer to headline the iconic music venue.", "vocab": []}}, "questions": [], "id": "ab690eb1959", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c780zvq7xlvo?at_medium=RSS&at_campaign=rss", "published": "2026-09-13T08:06:08+09:00", "category": "entertainment"}, {"headline": "Currently in Pop Culture: Daisy Chain Fields Music Festival - sjuhawknews.com", "excerpt": "Currently in Pop Culture: Daisy Chain Fields Music Festival sjuhawknews.com", "levels": {"Beginner": {"text": "Currently in Pop Culture: Daisy Chain Fields Music Festival sjuhawknews.com", "vocab": []}, "Intermediate": {"text": "Currently in Pop Culture: Daisy Chain Fields Music Festival sjuhawknews.com", "vocab": []}, "Advanced": {"text": "Currently in Pop Culture: Daisy Chain Fields Music Festival sjuhawknews.com", "vocab": []}}, "questions": [], "id": "ac75c7cbda6", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxQM045QW1GWW1VUWpHZWowNHFOYTl2SUxtOU1UaS00NFlyNkpoQnVYdkVFMmcwMTlxb3VZWmRMeHo2VHVmOWtwY0ViMVp0UXNNU3JiRlBKRktYbmtDTjBxMFVfT2gzRnZQSWxKRzJrTEVBSlRFVFgtcFYyRFVtcFNXd2VrbkJHRm54UDRzRFBOdFJ1QVhKS1ltc3VzNWdFTHM?oc=5", "published": "2026-09-13T08:05:03+09:00", "category": "entertainment"}]}], "home": [{"headline": "Fleetville Fall Fair Boosts Local Fire Company Funds", "excerpt": "The annual Fleetville Fall Fair, a beloved community event, serves as the primary fundraiser for a vital Lackawanna County fire company.", "levels": {"Beginner": {"text": "The Fleetville Fall Fair is a big event in Lackawanna County. It is the biggest fundraiser for a local fire company. A fire company helps keep people safe from fires. They need money for their important work.\n\nThe fair is a fun time for everyone. People can enjoy food, games, and other activities. Families come together to have a good day. Many people from the community visit the fair.\n\nThis event helps the firefighters. They are volunteers. This means they do not get paid for their work. But they need money for their equipment and training. Fire trucks and tools are expensive. The fair helps them buy what they need.\n\nSo, the Fleetville Fall Fair is important. It brings the community together. And it helps the brave people who protect us. It is a good way to support our local heroes. The fair makes sure the fire company can keep doing its important job.", "vocab": [{"word": "Fundraiser", "definition": "An event to collect money for a good cause."}, {"word": "Fire company", "definition": "A group of people who put out fires."}, {"word": "Community", "definition": "All the people living in one area."}, {"word": "Volunteers", "definition": "People who work without pay."}, {"word": "Equipment", "definition": "Tools or machines needed for a job."}, {"word": "Support", "definition": "To help or give money to someone or something."}]}, "Intermediate": {"text": "The Fleetville Fall Fair, a cherished annual event in Lackawanna County, recently served as the primary fundraiser for a local fire company. This significant gathering is crucial for sustaining the operations of the volunteer firefighters who dedicate themselves to protecting the community.\n\nFall fairs are a long-standing tradition, offering a vibrant atmosphere for families and individuals. Visitors to the Fleetville fair typically enjoy a variety of attractions, including delicious local food, engaging games, craft vendors, and often live entertainment. It's a time for neighbors to connect, celebrate the season, and contribute to a vital local cause. The fair not only provides much-needed funds but also strengthens community bonds, bringing people together for a shared purpose.\n\nFor many rural areas, volunteer fire companies are an essential part of emergency services. Unlike larger, paid municipal departments, these dedicated individuals volunteer their time and effort without receiving a salary. Their duties extend beyond just extinguishing fires; they often respond to vehicle accidents, natural disasters, medical emergencies, and provide public safety education. However, operating a modern fire company requires substantial financial resources. The cost of advanced fire trucks, specialized safety gear, ongoing training programs, and station maintenance is considerable.\n\nFundraisers like the Fleetville Fall Fair are therefore indispensable, providing the necessary funds to ensure firefighters have the proper equipment and training to respond effectively to a wide range of emergencies. The success of this annual fair highlights the strong community spirit in Lackawanna County. Residents understand the importance of their local fire company and actively participate in events that ensure its continued readiness. By attending and supporting the Fleetville Fall Fair, community members directly contribute to the safety and well-being of their neighbors, allowing the volunteer firefighters to continue their invaluable service.", "vocab": [{"word": "Annual", "definition": "Happening once every year."}, {"word": "Cherished", "definition": "Valued greatly; loved."}, {"word": "Sustaining", "definition": "Keeping something going or continuing."}, {"word": "Indispensable", "definition": "Absolutely necessary; essential."}, {"word": "Substantial", "definition": "Large in amount or degree."}, {"word": "Municipal", "definition": "Relating to a city or town or its governing body."}, {"word": "Invaluable", "definition": "Extremely useful or important."}]}, "Advanced": {"text": "The Fleetville Fall Fair, a venerable and eagerly anticipated annual tradition in Lackawanna County, recently concluded, serving its pivotal role as the primary fundraising engine for a local volunteer fire company. This significant community gathering is not merely a seasonal festivity but an indispensable mechanism for ensuring the operational viability of the dedicated firefighters who selflessly commit to safeguarding the community.\n\nFall fairs, deeply embedded in the cultural fabric of many American communities, offer a vibrant tableau of autumnal celebration. Attendees at the Fleetville fair are typically treated to a diverse array of attractions, including gourmet food stalls featuring local delicacies, engaging carnival games, artisanal craft vendors, and often live musical performances. Beyond the immediate entertainment, these events foster a profound sense of civic camaraderie, providing a crucial platform for neighbors to reconnect, celebrate shared heritage, and collectively contribute to a vital local institution. The fair's success underscores its dual function: generating critical financial resources while simultaneously reinforcing the social cohesion of the community.\n\nIn numerous rural and semi-rural regions, volunteer fire departments constitute the bedrock of emergency response infrastructure. Diverging from larger, professionalized municipal departments, these courageous individuals volunteer their time, expertise, and often personal risk without remuneration. Their responsibilities extend far beyond the conventional image of extinguishing structural fires; they are frequently the first responders to vehicular accidents, natural disaster relief efforts, medical emergencies, and play a proactive role in public safety education and prevention initiatives. Maintaining a modern, effective fire company in the 21st century demands considerable financial outlay. The procurement of advanced fire apparatus, specialized personal protective equipment, continuous professional development programs, and the upkeep of station facilities represent substantial and recurring expenses.\n\nConsequently, philanthropic endeavors such as the Fleetville Fall Fair are not merely supplementary but absolutely imperative. They furnish the essential capital required to equip and train firefighters to the highest standards, enabling them to respond with efficacy and professionalism to a comprehensive spectrum of emergencies. The consistent success of this annual fair is a testament to the robust community spirit prevalent in Lackawanna County. Residents exhibit a keen awareness of the critical importance of their local fire company and actively participate in initiatives designed to bolster its perpetual readiness. By contributing to and engaging with the Fleetville Fall Fair, community members directly invest in the collective safety and resilience of their locale, thereby empowering their volunteer firefighters to perpetuate their invaluable and often heroic service.", "vocab": [{"word": "Venerable", "definition": "Accorded a great deal of respect, especially because of age, wisdom, or character."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Indispensable", "definition": "Absolutely necessary; essential."}, {"word": "Operational viability", "definition": "The ability of an organization or system to function effectively and continue to exist."}, {"word": "Civic camaraderie", "definition": "A feeling of trust and friendship among citizens, often related to community involvement."}, {"word": "Remuneration", "definition": "Money paid for work or a service."}, {"word": "Philanthropic endeavors", "definition": "Efforts or activities aimed at promoting the welfare of others, typically through charitable donations."}, {"word": "Efficacy", "definition": "The ability to produce a desired or intended result."}]}}, "questions": [{"q": "What is the main purpose of the Fleetville Fall Fair?", "a": "The main purpose of the Fleetville Fall Fair is to raise money for a local fire company."}, {"q": "Why do volunteer fire companies need fundraisers like this fair?", "a": "Volunteer fire companies need fundraisers to cover the costs of expensive equipment, training, and station maintenance, as their members are not paid salaries."}], "id": "af800ab5146", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxQRGRBT3V6V0U5ak1FdFJEQTdXeEV1NUdCNkZKZm5tdFJBdnJDY1hxeWlPMVhqd1UzRG9CTkhnWEpaMWNxS0RKck5pcVI5MGJYZUlBdm91QWxDeXM0eWM4cTJmeWktQzBIenpIVDFQRnF2Skpkb2tMN1B1MDQ4TnZyVXBxeDBJdVNJTExPS0JtWWJtUVZoSHZHZ1hPNE5pbVhCVzRwNEpudDJYUC1xS2daWnBueXg3QlVmRlMxSS11UU1Zd2ltNjhSWmFvZHlmeWQtNU50T1QwRC0zX2hSckpnT0lWZmYzbllsNlhjY0Y3Zi1WVzF1RWt5ZDUtZGVyRVNVMU9yTVZtSFdPSU9FSGJCTXMwVm9QbGVEYWthdi1Uc1M?oc=5", "published": "2026-09-13T08:31:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Mavericks Evaluate Trade Assets for Roster Improvement", "excerpt": "The Dallas Mavericks are assessing their players, draft picks, and contracts to make strategic trades and strengthen their team.", "levels": {"Beginner": {"text": "The Dallas Mavericks basketball team is looking at its \"trade assets.\" These are things the team can use to get new players. The main assets are players, draft picks, and contracts.\n\nPlayers on the team can be traded to other teams. If a player is good, another team might want them. Draft picks are like chances to choose young players who want to play basketball. Teams get these picks each year. Contracts are agreements about how much money a player gets. Some contracts can be useful in trades.\n\nThe Mavericks want to make their team better. They have a very good player, and they want to add more good players to play with him. To do this, they might trade some of their current players, or their draft picks, or use their contracts in a smart way. The goal is to build a stronger team that can win more games. This is a common way for sports teams to improve. They carefully decide which assets to use to get the best new talent. It's like a puzzle where they try to find the right pieces to win a championship.", "vocab": [{"word": "trade", "definition": "to exchange something for something else."}, {"word": "assets", "definition": "useful or valuable things that a team owns."}, {"word": "picks", "definition": "choices, especially in a sports draft where teams select new players."}, {"word": "contracts", "definition": "official agreements, often about money for work or services."}, {"word": "improve", "definition": "to make something better."}, {"word": "team", "definition": "a group of people playing a sport together."}]}, "Intermediate": {"text": "The Dallas Mavericks basketball team is reportedly evaluating its \"trade assets\" as it seeks to enhance its roster. In professional sports, trade assets are crucial components a team can leverage to acquire new talent. These typically include current players, future draft picks, and various player contracts.\n\nPlayers are perhaps the most straightforward asset. A player's value in a trade depends on their skill, age, contract status, and potential. Good players are highly sought after by other teams. Draft picks represent the right to select promising young athletes from college or international leagues. These picks are especially valuable because they offer a chance to acquire future stars at a relatively low cost, and they are often used to entice teams to part with established veterans. Player contracts, which detail a player's salary and length of employment, also play a significant role. Some contracts can be attractive to other teams for salary cap reasons, while others might be seen as liabilities.\n\nFor the Mavericks, the strategic imperative is to build a championship contender around their superstar player. This means acquiring players who complement his skills and fill existing gaps in the team's lineup. By carefully assessing their current roster, available draft capital, and contractual obligations, the Mavericks aim to identify the most effective combinations of assets to offer in potential trades. The goal is to bring in talent that can immediately contribute to winning and elevate the team's overall performance. This process requires a deep understanding of the league's landscape, other teams' needs, and the intricate rules governing player movement and team finances, such as the salary cap.", "vocab": [{"word": "evaluating", "definition": "carefully judging something to decide its value or importance."}, {"word": "enhance", "definition": "to improve the quality, value, or attractiveness of something."}, {"word": "leverage", "definition": "to use something to maximum advantage or to gain an advantage."}, {"word": "acquire", "definition": "to get or obtain something, often by buying or trading for it."}, {"word": "strategic", "definition": "relating to a plan of action designed to achieve a major or overall goal."}, {"word": "contender", "definition": "a person or team that has a good chance to win a competition."}, {"word": "complement", "definition": "to add to something in a way that improves or completes it."}]}, "Advanced": {"text": "The Dallas Mavericks organization is reportedly undertaking a comprehensive evaluation of its \"trade assets\" as it strategically positions itself for potential roster enhancements. In the intricate ecosystem of professional basketball, trade assets are the fundamental currency teams utilize to navigate the market, address deficiencies, and ultimately cultivate a championship-caliber squad. These assets primarily encompass current players, future draft capital, and the various contractual obligations tied to athletes.\n\nThe valuation of players as trade commodities is multifaceted, factoring in their on-court production, age, remaining contract duration, and perceived upside. A highly productive player on a team-friendly contract is an invaluable asset, while an aging star with a burdensome long-term deal might be more challenging to move. Draft picks, particularly those in the early rounds, are often the most liquid and universally desired assets. They represent the potential to infuse the roster with young, cost-controlled talent and are frequently the linchpin in blockbuster trades. The specific protections attached to these picks (e.g., top-10 protected) significantly influence their market value. Player contracts themselves are not merely financial commitments but can also serve as strategic tools. Expiring contracts can be attractive to teams looking for salary cap relief, while larger, longer deals can be aggregated in trades to match salaries, a crucial aspect of NBA transaction rules.\n\nFor the Mavericks, the strategic imperative is clear: to optimize the supporting cast around their generational superstar and transform the team into a perennial championship contender. This necessitates a discerning assessment of which assets offer the greatest leverage in the trade market. The team must weigh the immediate impact of acquiring an established veteran against the long-term potential of retaining or trading draft picks for future talent. Furthermore, navigating the complexities of the collective bargaining agreement, including salary cap implications and luxury tax thresholds, is paramount. The goal is to identify and execute trades that not only address current roster imbalances—such as defensive prowess or secondary playmaking—but also maintain fiscal flexibility for future moves. This meticulous process of asset management is critical for a franchise aiming to capitalize on its star player's prime years and achieve sustained success in a highly competitive league.", "vocab": [{"word": "comprehensive", "definition": "including or dealing with all or nearly all elements or aspects of something; thorough."}, {"word": "ecosystem", "definition": "a complex network or interconnected system, especially of organizations or activities."}, {"word": "leverage", "definition": "to use (something) to maximum advantage; to gain an advantage through the use of a tool or influence."}, {"word": "commodity", "definition": "a raw material or primary agricultural product that can be bought and sold; in this context, something valuable that can be traded."}, {"word": "multifaceted", "definition": "having many different aspects or features."}, {"word": "imperative", "definition": "an essential or urgent thing; a command or order."}, {"word": "optimize", "definition": "to make the best or most effective use of a situation, resource, or system."}, {"word": "fiscal flexibility", "definition": "the ability of an organization to adjust its spending and financial decisions easily and adapt to changing economic conditions."}]}}, "questions": [{"q": "What are the three main types of trade assets mentioned for the Mavericks?", "a": "The three main types of trade assets are players, draft picks, and contracts."}, {"q": "Why do basketball teams like the Mavericks use trade assets?", "a": "Basketball teams use trade assets to acquire new talent, improve their roster, and build a stronger team that can win more games or compete for a championship."}], "id": "a2263e9c8cb", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxQVTU0TzVxYW9ZeGg3d2FuMElmUThua0p4cTNzV0tVQ2xlcHdTZFQwaFJpTVZFdk56YkJvc0V5M1dkTlk0S2NNRmNLQzY4Rk16YzdKM0hWTEVpS1dLRHJWdkpTTE1NOE82UHRLUjBDSHNQT2NQMzZYeHg4c2VzbVJGUnU2X1VHemUtaUEwd0dmX2ttNk10dExfdm9oSm1SNEtKV3RJenYxMHpyVkJIaUVQSmZZTEVLWlRFTllOd2g3aFBTY2c?oc=5", "published": "2026-09-13T08:05:19+09:00", "category": "business", "category_title": "Business"}, {"headline": "Low-Rate Era Ends as Central Banks Hike Rates", "excerpt": "Central banks are raising interest rates, ending a long era of low borrowing costs and affecting global financial markets.", "levels": {"Beginner": {"text": "Central banks around the world are changing how much money costs. For a long time, it was cheap to borrow money. This was called the \"low-rate era.\" Now, this time is ending. Central banks are raising interest rates.\nInterest rates are like a price you pay to borrow money. When rates are low, it's cheaper to get a loan for a house or a car. When rates go up, loans cost more.\nWhy are central banks doing this? Prices for many things have been going up quickly. This is called inflation. Central banks want to slow down inflation. By making money more expensive to borrow, they hope people and businesses will spend less. This can help prices stop rising so fast.\nMany people and businesses will feel this change. It means that getting new loans will be more costly. The world's economy is getting ready for this big change.", "vocab": [{"word": "Central banks", "definition": "Important banks that control a country's money."}, {"word": "Borrow", "definition": "To take money from someone with the promise to pay it back."}, {"word": "Interest rates", "definition": "The extra money you pay when you borrow money."}, {"word": "Inflation", "definition": "When prices for things go up a lot."}, {"word": "Economy", "definition": "How money and goods are made and used in a country."}]}, "Intermediate": {"text": "A significant shift is underway in the global economy as central banks worldwide are ending a long period of historically low interest rates. This \"low-rate era,\" which made borrowing money very cheap for many years, is now firmly over. Financial markets are actively preparing for a series of interest rate hikes.\nCentral banks, such as the U.S. Federal Reserve and the European Central Bank, play a crucial role in managing a country's money supply and economic health. For over a decade, especially after the 2008 financial crisis and more recently during the COVID-19 pandemic, these institutions kept interest rates very low. The goal was to stimulate economic growth by encouraging people and businesses to borrow and spend, thereby boosting investment and job creation.\nHowever, this strategy has led to a new challenge: high inflation. Prices for goods and services have been rising rapidly, eroding the purchasing power of money. To combat this, central banks are now reversing course. By raising interest rates, they make borrowing more expensive for consumers and businesses. This is intended to cool down economic activity, reduce demand, and ultimately bring inflation back under control.\nThe implications of these rate hikes are far-reaching. Consumers may face higher costs for mortgages, car loans, and credit card debt. Businesses might find it more expensive to invest and expand. Financial markets, including stock and bond markets, are reacting to these changes, adjusting asset prices to reflect the new economic reality. The world is entering a new phase of monetary policy, where the cost of money will be significantly higher than what many have grown accustomed to.", "vocab": [{"word": "Central banks", "definition": "National financial institutions that manage a country's money supply and interest rates."}, {"word": "Low-rate era", "definition": "A long period when the cost of borrowing money was very low."}, {"word": "Stimulate", "definition": "To encourage something to grow or become more active."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Combat", "definition": "To fight against something, like a problem or a challenge."}, {"word": "Implications", "definition": "The possible results or effects of something."}, {"word": "Monetary policy", "definition": "The actions taken by a central bank to control the supply of money and credit to achieve economic goals."}]}, "Advanced": {"text": "The global financial landscape is undergoing a profound transformation as central banks across major economies signal the definitive conclusion of an unprecedented era of ultra-low interest rates. Financial markets are now bracing for a sustained period of rate hikes, a stark departure from the accommodative monetary policies that have characterized the past decade and a half.\nFor many years, central banks, including the U.S. Federal Reserve, the European Central Bank, and others, maintained near-zero or even negative interest rates. This strategy was primarily a response to major economic crises: first, to mitigate the fallout from the 2008 global financial crisis and foster recovery, and later, to cushion the economic shock of the COVID-19 pandemic. The rationale was to inject liquidity into the financial system, reduce borrowing costs, and thus stimulate investment, consumption, and overall economic growth. This period also saw extensive quantitative easing, where central banks purchased vast amounts of government bonds and other assets to further depress long-term yields.\nHowever, the prolonged period of expansive monetary policy, combined with supply chain disruptions and robust consumer demand post-pandemic, has ignited significant inflationary pressures. Inflation rates in many developed nations have surged to multi-decade highs, eroding household purchasing power and posing a threat to economic stability. In response, central banks are now pivoting sharply, prioritizing price stability over growth stimulation.\nThe current tightening cycle involves a series of aggressive interest rate increases designed to cool overheated economies. By making credit more expensive, central banks aim to dampen demand, reduce speculative investment, and ultimately bring inflation back to their target levels, typically around 2%. This shift has profound implications for various sectors. Households face higher mortgage payments and increased costs for consumer credit. Businesses may find capital expenditure more expensive, potentially leading to slower expansion and hiring. Governments, too, will face higher borrowing costs on their national debt.\nFinancial markets are already exhibiting significant volatility as investors recalibrate their portfolios for a higher-rate environment. Bond yields have surged, and equity markets have experienced corrections as the prospect of higher discount rates impacts valuations. The challenge for central banks is to navigate this transition carefully, engineering a \"soft landing\" that brings down inflation without triggering a severe economic deceleration or a full-blown recession. This delicate balancing act will define global monetary policy for the foreseeable future, marking a fundamental reorientation of economic priorities.", "vocab": [{"word": "Profound", "definition": "Very great or intense; having a deep impact or meaning."}, {"word": "Unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "Accommodative monetary policies", "definition": "Central bank actions aimed at stimulating economic growth by keeping interest rates low and increasing the money supply."}, {"word": "Mitigate", "definition": "To make less severe, serious, or painful; to lessen the gravity of a situation."}, {"word": "Quantitative easing (QE)", "definition": "A monetary policy where a central bank buys government securities or other securities from the market to lower interest rates and increase the money supply."}, {"word": "Inflationary pressures", "definition": "Forces or factors that tend to cause prices to rise and the purchasing power of money to fall."}, {"word": "Pivoting", "definition": "Changing direction or strategy sharply and significantly."}, {"word": "Economic deceleration", "definition": "A slowdown in the rate of economic growth, indicating a weakening economy."}]}}, "questions": [{"q": "What is ending in the global economy, according to the article?", "a": "The era of low interest rates is ending."}, {"q": "Why are central banks raising interest rates?", "a": "Central banks are raising interest rates to combat high inflation and slow down rising prices."}], "id": "a2af258eb03", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2gFBVV95cUxQRzYwdlZPRzhLVkhxYUpLWExGMEtEbVFvcVY1NDZ4VHdpRzg3d2V0LXZvb0ZsMDJBazlMbENaV19vNGh3ZEJwUW5oTHBvZEI3M096ZnM4NkRfS3NxUVBTc1JqSWFGeERvNVl2RVcxSkJ3UTlWVnFaTlZwRG4tSVNwNm1wN2NKVmpQTHlFNGRjeHl2Y0QtcFNLeGl6T1Nnc08tYjNNVFpyZEpEMVpHMkpkSDF1ODdBbUhwZTlHYURuaUJLTW54eHlaajVOcVpaYngybjROTTRQZGRvZw?oc=5", "published": "2026-09-13T07:00:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Singapore Urges Financial Sector to Prepare for AI Future", "excerpt": "Singapore's central bank is encouraging its financial industry to get ready for big changes coming from artificial intelligence.", "levels": {"Beginner": {"text": "Singapore's main bank, called the Monetary Authority of Singapore (MAS), wants all financial companies to get ready for something new: Artificial Intelligence, or AI. AI means computers can do smart things, like learning and solving problems, much like people do. \n\nThe MAS believes AI will change how banks and other money businesses work. It will help them do things faster and better. For example, AI can help check for fraud, make customer service quicker, and manage money more wisely. This is a big 'transformation' for the financial world.\n\nThe MAS is telling companies they need to learn about AI and start using these new computer tools. They should train their workers to understand AI. The goal is to make Singapore's financial sector strong and modern. The MAS wants to make sure that as companies use AI, they also keep things safe and fair for everyone. This preparation is important for the future of money and banking in Singapore.", "vocab": [{"word": "financial", "definition": "relating to money or how money is managed."}, {"word": "sector", "definition": "a part of a country's economy, like the banking sector."}, {"word": "transformation", "definition": "a complete change in someone or something."}, {"word": "fraud", "definition": "the crime of deceiving someone to get money or goods."}, {"word": "modern", "definition": "using the newest ideas, designs, or methods."}]}, "Intermediate": {"text": "The Monetary Authority of Singapore (MAS), the nation's central bank and financial regulator, is urging the financial sector to proactively prepare for the significant changes brought about by Artificial Intelligence (AI). This call to action emphasizes the profound transformation AI is expected to bring to banking, insurance, and other financial services.\n\nAI involves computer systems that can perform tasks normally requiring human intelligence, such as learning, problem-solving, and decision-making. The MAS foresees AI enhancing efficiency, improving risk management, and personalizing customer experiences across the industry. For instance, AI can automate routine tasks, analyze vast amounts of data to detect fraudulent activities, and offer tailored financial advice to clients.\n\nTo embrace this future, the MAS is encouraging financial institutions to invest in AI technologies, develop new capabilities, and upskill their workforce. The aim is to ensure that Singapore remains a leading global financial hub, capable of leveraging advanced technologies responsibly. The central bank also stresses the importance of addressing potential risks, such as data privacy, ethical considerations, and the need for robust regulatory frameworks, as the sector integrates more AI-driven solutions. This strategic preparation is crucial for maintaining stability and fostering innovation in Singapore's financial landscape.", "vocab": [{"word": "regulator", "definition": "an official who controls a system or industry with rules and laws."}, {"word": "proactively", "definition": "acting in advance to deal with an expected difficulty or change."}, {"word": "profound", "definition": "very great or intense; having a strong effect."}, {"word": "efficiency", "definition": "the state or quality of being efficient; achieving maximum productivity with minimum wasted effort or expense."}, {"word": "upskill", "definition": "to teach an employee additional skills."}, {"word": "leveraging", "definition": "using something to maximum advantage."}]}, "Advanced": {"text": "The Monetary Authority of Singapore (MAS), acting as both the nation's central bank and its integrated financial regulator, has issued a compelling directive to the financial sector: prepare for an impending, AI-driven paradigm shift. This proactive stance underscores Singapore's strategic imperative to maintain its competitive edge as a premier global financial hub amidst rapid technological evolution.\n\nArtificial Intelligence, encompassing machine learning, natural language processing, and advanced analytics, is poised to fundamentally reshape operational paradigms across banking, asset management, insurance, and fintech. The MAS anticipates AI will not only drive unprecedented levels of efficiency and cost reduction through automation of mundane tasks but also revolutionize areas like predictive analytics for market trends, sophisticated fraud detection, personalized financial advisory services, and enhanced risk assessment frameworks. By processing colossal datasets with unparalleled speed and accuracy, AI promises to deliver deeper insights and more agile decision-making capabilities.\n\nTo navigate this transformative era successfully, the MAS is advocating for a multi-pronged approach. Financial institutions are urged to significantly invest in AI infrastructure, cultivate specialized talent pools, and implement comprehensive upskilling programs for their existing workforce. Beyond technological adoption, the central bank emphasizes the critical need to address the complex ethical implications, data governance challenges, and potential for algorithmic bias inherent in AI systems. Furthermore, the MAS is committed to fostering a robust regulatory environment that supports innovation while simultaneously mitigating systemic risks and ensuring consumer protection. This involves developing adaptive frameworks that can accommodate novel AI applications without stifling progress. Singapore's ambition is to cultivate an ecosystem where AI can flourish responsibly, cementing its status as a leader in the digital finance landscape.", "vocab": [{"word": "compelling", "definition": "evoking interest, attention, or admiration in a powerfully irresistible way; convincing."}, {"word": "paradigm shift", "definition": "a fundamental change in approach or underlying assumptions."}, {"word": "imperative", "definition": "of vital importance; crucial."}, {"word": "encompassing", "definition": "including or covering a wide range of things."}, {"word": "unprecedented", "definition": "never done or known before."}, {"word": "colossal", "definition": "extremely large or great."}, {"word": "mitigating", "definition": "making something less severe, serious, or painful."}, {"word": "fostering", "definition": "encouraging the development of something good or desirable."}]}}, "questions": [{"q": "Which organization in Singapore is encouraging the financial sector to prepare for AI?", "a": "The Monetary Authority of Singapore (MAS) is encouraging the financial sector to prepare for AI."}, {"q": "Name two ways AI is expected to change how financial companies work.", "a": "AI is expected to enhance efficiency, improve risk management, personalize customer experiences, automate routine tasks, and detect fraudulent activities."}], "id": "a085529db48", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxQeG5jdlE4blc4aG9Ib0hNSF9reDlNUjhfSjVJSlRuVlpNSDM0UXlqc1lOQ1ppbW1NSmpHUGVmZ1R3b2hnSXFEYzhpSTAwR0plZDFhdVBIMlBiMHlpZGdKVkFXYVdTSjJEZnpYMkduSnFIbXprenU5b01kNExrSGo0THpRaHprLWk4eDNOSzN3YUpWcFRxT1VQUDU1a1JLcE02Wk02d3M1eWpKV1NUTUZESzQwUDUxVkVzejlPSWY5RldSMDBwSHZwNmw2cjR4ZHc?oc=5", "published": "2026-09-13T06:54:15+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Trump's Comments on United Ireland Spark Discussion", "excerpt": "Former President Donald Trump's recent remarks about a united Ireland are seen as a move to appeal to voters across the Atlantic.", "levels": {"Beginner": {"text": "Former U.S. President Donald Trump recently talked about Ireland. He said he wants Northern Ireland and the Republic of Ireland to become one country. This idea is called a \"united Ireland.\" Northern Ireland is currently part of the United Kingdom, while the Republic of Ireland is an independent nation.\n\nTrump's words made news around the world. Many people are discussing why he said this now. Experts believe he might be trying to get support from people in the United States who have Irish family. There are many Irish-Americans in the U.S., and their votes are important to politicians.\n\nThe idea of a united Ireland is a very old and important topic. It has a long history and is a big political issue for both Ireland and the UK. Trump's comments have brought this discussion back into the spotlight, making people think about the future of Ireland.", "vocab": [{"word": "United", "definition": "joined together as one."}, {"word": "Country", "definition": "a nation or a land."}, {"word": "Family", "definition": "a group of people related to each other."}, {"word": "Vote", "definition": "to choose a leader or a law in an election."}, {"word": "Topic", "definition": "a subject that people talk or write about."}, {"word": "Issue", "definition": "an important problem or subject that people discuss."}]}, "Intermediate": {"text": "Former U.S. President Donald Trump recently made headlines by expressing his desire for a united Ireland. This means he hopes Northern Ireland, which is part of the United Kingdom, would join the Republic of Ireland to form a single nation. Trump's comments have drawn significant attention, especially considering the long and complex history surrounding the status of Northern Ireland.\n\nThe issue of a united Ireland has been a central political debate for centuries, marked by periods of conflict and peace efforts, notably the Good Friday Agreement in 1998, which brought an end to decades of violence. This agreement established a framework for power-sharing and included a provision for a future vote on unification if the people of Northern Ireland wished for it.\n\nAnalysts suggest that Trump's remarks were likely aimed at a specific audience: Irish-American voters in the United States. There is a large and influential Irish diaspora in the U.S., and appealing to this demographic can be a strategic move for politicians seeking support. By voicing support for a united Ireland, Trump may be trying to gain favor with this important voter base.\n\nWhile the idea of a united Ireland is a deeply sensitive topic with various viewpoints on its feasibility and implications, Trump's intervention has brought it back into the global spotlight. His statement is seen by many as a calculated political gesture rather than a direct policy proposal, designed to resonate with a particular segment of the American electorate.", "vocab": [{"word": "Headlines", "definition": "main news stories, often printed in large letters at the top of newspapers."}, {"word": "United", "definition": "joined together as one nation or group."}, {"word": "Complex", "definition": "having many different parts and difficult to understand."}, {"word": "History", "definition": "the study of past events."}, {"word": "Agreement", "definition": "a decision or promise made by two or more people or groups."}, {"word": "Diaspora", "definition": "a group of people who have spread from their original homeland to other parts of the world."}, {"word": "Strategic", "definition": "done as part of a plan, especially in politics or business."}]}, "Advanced": {"text": "Former U.S. President Donald Trump recently ignited a global discussion by voicing his aspiration for a united Ireland, a statement that quickly became a prominent international headline. His remarks suggest a desire for Northern Ireland, currently a constituent part of the United Kingdom, to integrate with the Republic of Ireland, forming a singular sovereign state. This intervention, while seemingly abrupt, is widely interpreted by political commentators as a strategically calculated appeal to a specific demographic across the Atlantic.\n\nThe issue of Irish unification is steeped in centuries of intricate history, marked by periods of intense sectarian conflict and subsequent peace processes. The landmark 1998 Good Friday Agreement, which largely brought an end to \"The Troubles,\" established a framework for peace and power-sharing, while also including a mechanism for a border poll on unification, should conditions warrant it. This delicate balance has been a cornerstone of stability in the region for decades.\n\nTrump's comments are largely understood as an overture to the substantial and politically active Irish-American community in the United States. This diaspora has historically maintained a keen interest in Irish affairs, often advocating for a united Ireland, and their electoral support can be a significant factor in American politics, particularly in swing states. By expressing solidarity with the concept of a united Ireland, Trump may be seeking to galvanize this voter base ahead of future political endeavors, tapping into a deep-seated cultural and historical connection.\n\nWhile the prospect of a united Ireland remains a deeply sensitive and multifaceted issue, with varying opinions on its economic, social, and political implications, Trump's statement has undeniably propelled it back into the international discourse. Recent political shifts, particularly Brexit, have reignited debates about const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
