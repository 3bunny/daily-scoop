 "Advanced": {"text": "Jacked Film Threat", "vocab": []}}, "questions": [], "id": "a6fad76ea58", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE5USDlhVWlfTWVIQ2Z1VnVlSElmejZYangzVkw3R1BmUWNPUFpha3BUSmZmaDViNnVSc3ZFM3BDZ2pHOEtYdnlfeTVSeWUwYWJfdUdoZXl3S2RfMndKeTFVT29YSTdOUQ?oc=5", "published": "2026-07-12T06:52:32+09:00", "category": "entertainment"}]}], "home": [{"headline": "Brady Street Businesses Seek Unity, More Police Amid Crime Surge", "excerpt": "Business owners on Brady Street are asking for more police and community cooperation to address a recent increase in summer crime.", "levels": {"Beginner": {"text": "Brady Street is a busy place with many shops and restaurants. Recently, people who own these businesses have been worried. They say there has been more crime this summer. This makes it hard for their businesses to do well.\n\nThe business owners want two main things. First, they want more police officers to be on Brady Street. They believe more police will help stop crime and make the area safer. When people feel safe, they will come to Brady Street more often.\n\nSecond, the owners want everyone to work together. They call for \"unity.\" This means they want the businesses, people who live nearby, and the police to all help each other. If everyone works together, they think they can make Brady Street a better and safer place for everyone.\n\nCrime can scare customers away. It can also make it difficult for shops to stay open. The business owners hope that with more police and community help, Brady Street will be safe and welcoming again. They want their street to be a fun place for people to visit and shop, without worrying about crime. They believe that a strong community can solve these problems together.", "vocab": [{"word": "worried", "definition": "feeling uneasy or anxious about something."}, {"word": "crime", "definition": "illegal activities."}, {"word": "safer", "definition": "more protected from danger."}, {"word": "unity", "definition": "a state of being united or working together."}, {"word": "customers", "definition": "people who buy goods or services from a shop or business."}, {"word": "welcoming", "definition": "friendly and pleasant to new arrivals."}]}, "Intermediate": {"text": "Business owners along Brady Street, a popular commercial district, are expressing significant concerns over a recent increase in criminal activity. They report a noticeable surge in crime incidents throughout the summer months, which they fear is negatively impacting their establishments and the overall vibrancy of the area. This situation has prompted a collective call for action from the local business community.\n\nThe primary requests from these owners are twofold. Firstly, they are advocating for an enhanced police presence on Brady Street. They believe that a greater number of officers patrolling the area would serve as a deterrent to potential offenders and help to restore a sense of security among residents and visitors alike. Increased visibility of law enforcement is often seen as a key strategy in combating urban crime.\n\nSecondly, the business community is emphasizing the importance of \"unity.\" This call extends beyond just law enforcement, urging residents, local organizations, and businesses themselves to collaborate more closely. The idea is that a united front, working together on community safety initiatives, can create a more resilient and secure environment. Such collaboration might involve neighborhood watch programs, improved lighting, or shared security resources.\n\nThe impact of rising crime on businesses can be substantial. It can deter potential customers, reduce foot traffic, and even lead to property damage or theft. This, in turn, can affect revenue and the ability of businesses to thrive. Owners are concerned that if the trend continues, it could undermine the unique character and economic health of Brady Street. They hope that by working with police and the wider community, they can reverse this trend and ensure Brady Street remains a safe and attractive destination for everyone.", "vocab": [{"word": "commercial district", "definition": "an area of a city with many businesses and shops."}, {"word": "criminal activity", "definition": "actions that are against the law."}, {"word": "surge", "definition": "a sudden, strong increase."}, {"word": "advocating", "definition": "publicly supporting or recommending a particular cause or policy."}, {"word": "deterrent", "definition": "something that discourages or prevents an action."}, {"word": "collaboration", "definition": "the action of working with someone to produce something."}, {"word": "resilient", "definition": "able to recover quickly from difficulties."}]}, "Advanced": {"text": "Business proprietors operating along Brady Street, a vibrant and historically significant commercial corridor, are voicing profound apprehension regarding a discernible escalation in criminal incidents. This summer has reportedly witnessed a significant surge in illicit activities, ranging from petty theft and vandalism to more serious disturbances, prompting a unified plea from the local business community for robust interventions to safeguard their enterprises and the district's unique character. The perceived erosion of public safety poses a substantial threat to the economic vitality and social fabric of this popular urban destination.\n\nThe core demands articulated by these stakeholders are multifaceted. Foremost, they are advocating for a markedly enhanced law enforcement presence within the Brady Street precinct. The rationale posits that an increased deployment of uniformed officers would serve as a potent deterrent to potential transgressors, thereby fostering a renewed sense of security among patrons, residents, and employees. Proponents argue that visible policing is an indispensable component of any comprehensive strategy aimed at mitigating urban crime and restoring public confidence, particularly in areas reliant on pedestrian traffic and evening commerce.\n\nFurthermore, the business owners are underscoring the critical imperative of community \"unity.\" This appeal transcends mere law enforcement efforts, extending to a broader call for synergistic collaboration among diverse stakeholders: local residents, community organizations, property owners, and the businesses themselves. The vision is to cultivate a collective responsibility for public safety, potentially through initiatives such as formalized neighborhood watch programs, strategic urban planning for improved visibility and lighting, and shared intelligence networks. Such integrated approaches are often crucial for building long-term community resilience against crime and fostering a sense of collective ownership over public spaces.\n\nThe ramifications of sustained criminal activity on a commercial district are far-reaching. Beyond immediate concerns of property damage and theft, a pervasive sense of insecurity can drastically diminish foot traffic, deter new investment, and ultimately erode the customer base vital for local businesses to flourish. This economic downturn can, in turn, lead to business closures, job losses, and a decline in the overall appeal of the area, creating a detrimental cycle where reduced activity further emboldens criminal elements. The Brady Street proprietors are thus seeking proactive measures to reverse this trajectory, aiming to preserve the district's reputation as a safe, welcoming, and economically thriving hub. Their concerted efforts highlight the intricate relationship between public safety, community engagement, and economic prosperity, underscoring how a secure environment is foundational for urban development and the flourishing of local economies.", "vocab": [{"word": "proprietors", "definition": "the owner of a business or a property."}, {"word": "discernible", "definition": "able to be perceived or recognized."}, {"word": "escalation", "definition": "a rapid increase; a rise."}, {"word": "illicit activities", "definition": "actions that are forbidden by law, rules, or custom."}, {"word": "potent deterrent", "definition": "a very strong factor that discourages or prevents something."}, {"word": "transgressors", "definition": "people who break a law or rule."}, {"word": "synergistic collaboration", "definition": "working together to produce a combined effect greater than the sum of their separate effects."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}]}}, "questions": [{"q": "What two main things are Brady Street business owners asking for?", "a": "They are asking for more police presence and for the community to work together (unity)."}, {"q": "How do business owners believe crime is affecting their businesses?", "a": "They believe crime is making it hard for their businesses to do well, scaring customers away, reducing foot traffic, and potentially leading to property damage or theft."}], "id": "a23ab7c6db9", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi-wFBVV95cUxOZ2djRllYUkZWTXJZaE9SSDRsUDM4TkNMQVRjNm9nTG1OM2FIc2stYzA0dU9Eb1ZHdjFqTjNrRmpxajIyVFB1MnAxTEdZMTB5YUoxUHVCOUdPcFdZLTNmLWJNbW01ZktLY0dZaHRwTGM4SElxLW95dWs4eGxNeWtSWXcwV1c1bS1KWEdmbDdTaFZURHFrM0xhQm9wakZ2RUM1clRKcVFHZXZfQnZmUW1pYWlnTF9KRTZCYUxlaE9GLTQ5TzJIS1B5QmN6dk5GcEItSjVPeWJDSkxnV0NaXzRvV01WQ2YybE5wQU8wYTZhLVA3MnV0YVVKbUE5VQ?oc=5", "published": "2026-07-12T07:21:29+09:00", "category": "business", "category_title": "Business"}, {"headline": "SoundHound AI's Strategic Growth: What It Means for Investors", "excerpt": "SoundHound AI is expanding its voice technology platform and navigating business combinations, actions that hold significant implications for its shareholders.", "levels": {"Beginner": {"text": "SoundHound AI is a company that uses special computer programs, called Artificial Intelligence (AI), to understand and respond to human voices. Think of it like talking to a smart assistant. The company has been making big business moves. One big move was a \"business combination,\" which is like two companies joining together or a company becoming public on the stock market. This helped SoundHound AI get more money to grow.\n\nNow, SoundHound AI is also working on \"platform expansion.\" This means they are making their voice AI technology bigger and better. They want to offer their voice services to more places, like in cars, smart devices, and customer service centers. By expanding, they can reach more customers and find new ways for people to use their voice AI.\n\nThese changes are very important for people who own shares in SoundHound AI. These owners are called shareholders. When a company grows and its technology becomes more popular, it can be good for shareholders. It means the company might make more money, and the value of their shares could go up. SoundHound AI hopes these steps will help them succeed and make their investors happy.", "vocab": [{"word": "AI (Artificial Intelligence)", "definition": "Smart computer programs that can learn and solve problems."}, {"word": "Business combination", "definition": "When companies join together or one company goes public."}, {"word": "Platform", "definition": "A system or service that a company offers."}, {"word": "Expansion", "definition": "Making something bigger or wider."}, {"word": "Shareholders", "definition": "People who own parts (shares) of a company."}, {"word": "Value", "definition": "How much something is worth."}]}, "Intermediate": {"text": "SoundHound AI, a company at the forefront of conversational Artificial Intelligence (AI), is making strategic moves to solidify its market position and accelerate growth. The company, known for its advanced voice AI technology that enables natural human-computer interaction, has undergone significant corporate actions, including a \"business combination.\" This typically refers to the process of a company becoming publicly traded, often through a merger with a Special Purpose Acquisition Company (SPAC), which was SoundHound AI's path to the stock market. Such a combination provides capital for expansion and increases public visibility.\n\nIn parallel with its corporate structuring, SoundHound AI is heavily focused on \"platform expansion.\" This initiative involves broadening the application and reach of its core voice AI technology. The company aims to integrate its voice assistants into a wider array of products and services, such as automotive systems, smart home devices, and customer service solutions. By enhancing its platform, SoundHound AI seeks to attract more enterprise clients and expand its user base, thereby diversifying its revenue streams.\n\nFor shareholders, these strategic developments carry significant implications. A successful platform expansion could lead to increased market share and revenue growth, potentially boosting the company's valuation. The initial business combination provided the necessary funding and public exposure, while ongoing expansion demonstrates a clear strategy for long-term sustainability and profitability. Investors closely monitor these moves as indicators of the company's future performance and its ability to compete effectively in the rapidly evolving AI sector. The goal is to translate technological advancement and market penetration into tangible returns for those invested in the company.", "vocab": [{"word": "Conversational AI", "definition": "Computer programs that can understand and talk like humans."}, {"word": "Strategic moves", "definition": "Important plans or actions a company takes to achieve goals."}, {"word": "Business combination", "definition": "A process where companies merge or one becomes publicly traded."}, {"word": "Platform expansion", "definition": "Making a company's main service or product bigger and available to more users."}, {"word": "Enterprise clients", "definition": "Large businesses or organizations that are customers."}, {"word": "Revenue streams", "definition": "Different ways a company makes money."}, {"word": "Valuation", "definition": "The estimated worth of a company."}]}, "Advanced": {"text": "SoundHound AI, a prominent player in the burgeoning field of conversational Artificial Intelligence, is navigating a critical phase of corporate development marked by strategic business combinations and aggressive platform expansion. The company specializes in delivering advanced voice AI solutions that facilitate natural language understanding and generation, enabling seamless human-computer interaction across various domains. Its journey to the public market involved a significant \"business combination,\" specifically a de-SPAC transaction with Khosla Ventures Acquisition Co. II in 2022. This process, often detailed in an S-4 filing with the U.S. Securities and Exchange Commission, outlines the terms of the merger, financial projections, and the strategic rationale, providing crucial transparency for prospective and existing shareholders. Such a combination typically injects substantial capital, enabling ambitious growth initiatives and enhancing market visibility.\n\nComplementing its corporate structuring, SoundHound AI is vigorously pursuing \"platform expansion.\" This multifaceted strategy involves not only enhancing the capabilities of its core voice AI technology but also extending its integration across a broader ecosystem. The company is actively targeting new vertical markets, including the automotive industry for in-car voice assistants, hospitality for interactive guest experiences, and customer service centers for automated support. This expansion entails developing more sophisticated features, supporting additional languages, and forging strategic partnerships to embed its technology into a wider array of devices and applications. The objective is to solidify its competitive advantage, diversify its revenue streams beyond initial licensing agreements, and capture a larger share of the rapidly growing voice AI market.\n\nFor shareholders, these strategic maneuvers carry profound implications for long-term value creation. The successful execution of platform expansion is pivotal for demonstrating scalable growth and achieving profitability. Increased adoption of SoundHound AI's technology translates into higher recurring revenues and potentially improved gross margins. Investors scrutinize these developments for indicators of market penetration, operational efficiency, and the company's ability to fend off competition from tech giants and agile startups alike. While the initial business combination provided the foundational capital and public listing, the ongoing expansion is the engine for sustainable growth and enhanced market valuation. However, such aggressive growth strategies also present inherent risks, including execution challenges, increased operational expenditures, and the need for continuous innovation to maintain technological leadership. Shareholders are thus keenly observing how SoundHound AI balances these opportunities and challenges to deliver tangible returns.", "vocab": [{"word": "Burgeoning", "definition": "Beginning to grow or develop rapidly."}, {"word": "De-SPAC transaction", "definition": "The process where a private company merges with a Special Purpose Acquisition Company (SPAC) to become publicly traded."}, {"word": "S-4 filing", "definition": "A registration statement filed with the U.S. Securities and Exchange Commission for business combinations, providing detailed information to investors."}, {"word": "Strategic rationale", "definition": "The underlying reasons or logic behind a company's strategic decisions."}, {"word": "Multifaceted", "definition": "Having many different aspects or features."}, {"word": "Vertical markets", "definition": "Specific industries or sectors that a company targets with its products or services."}, {"word": "Gross margins", "definition": "The profit a company makes after deducting the costs associated with making and selling its products or services."}, {"word": "Operational expenditures", "definition": "The ongoing costs incurred from the normal day-to-day running of a business."}]}}, "questions": [{"q": "What is SoundHound AI known for?", "a": "SoundHound AI is known for its advanced voice Artificial Intelligence (AI) technology that allows natural human-computer interaction."}, {"q": "What are two key strategic actions SoundHound AI is taking?", "a": "SoundHound AI is undertaking a \"business combination\" (referring to its public listing via SPAC) and \"platform expansion.\""}], "id": "a71bde378b8", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimgFBVV95cUxPSmpIUWYwSWFDNVotaFpSb1d6Z2FWQWxkdUh4VUg2dXN3WFd3emVMYmh5dlpzNUl6N1FyTE9KS3d0UjBaQnlXLVA5S3YzQTVQQ3FNUkkxVTdUeG15RVI0aXhaY0tlZjJucTJzX1ZyZXBnamFBOVhOQkwtZGt4cXcxaFBwUHBlMVhMQkE2Q1JRUS1jbnlYdHo3Q2hR?oc=5", "published": "2026-07-12T07:07:47+09:00", "category": "business", "category_title": "Business"}, {"headline": "Korea Plans Growth Strategy as Central Bank Considers Rate Hike", "excerpt": "South Korea is preparing to announce new plans to boost its economy while its central bank is thinking about raising interest rates to control prices.", "levels": {"Beginner": {"text": "South Korea is getting ready to announce new plans to help its economy grow. The government wants to make businesses stronger and create more jobs for people. These new ideas are called a \"growth strategy.\" At the same time, the country's main bank, which is called the central bank, is thinking about a big decision. It might raise \"interest rates.\" When interest rates go up, it costs more money to borrow from banks. The central bank often does this to stop prices from going up too quickly. When prices for things like food and gas keep getting higher, it's called \"inflation.\" The central bank's job is to keep the economy stable and control inflation. The government's new strategy will focus on different ways to boost the economy. This could mean helping new industries or making it easier for companies to invest. Both the government and the central bank are working to make sure Korea's economy stays healthy for the future.", "vocab": [{"word": "Economy", "definition": "How a country makes and uses money."}, {"word": "Grow", "definition": "To become bigger or more successful."}, {"word": "Central bank", "definition": "The main bank of a country that controls money."}, {"word": "Interest rates", "definition": "The extra money you pay when you borrow money."}, {"word": "Inflation", "definition": "When prices for things go up over time."}, {"word": "Strategy", "definition": "A plan to achieve a goal."}]}, "Intermediate": {"text": "South Korea is preparing to unveil a new national \"growth strategy\" aimed at strengthening its economy and ensuring future prosperity. This significant initiative comes as the Bank of Korea, the nation's central bank, is simultaneously considering a potential increase in interest rates. These two developments underscore the country's proactive approach to managing its economic future amidst a complex global landscape.\n\nThe government's growth strategy is expected to outline specific measures to boost key industries, encourage both domestic and foreign investment, and create more high-quality employment opportunities. The overarching goal is to foster sustainable economic expansion and enhance the overall competitiveness of South Korean businesses on the international stage. Details of this strategy are eagerly anticipated by businesses and citizens alike.\n\nConcurrently, the central bank's deliberation on raising interest rates is primarily a response to persistent concerns about inflation. When inflation rises, the cost of goods and services increases, eroding the purchasing power of consumers and businesses. By making borrowing money more expensive, a rate hike can slow down overall spending and investment, thereby helping to cool down an overheating economy and bring price increases under control. This is a standard monetary policy tool used by central banks worldwide to maintain price stability.\n\nThe Bank of Korea's decision will be carefully watched, as it balances the critical need to curb inflation with the desire to support robust economic growth. Raising rates too aggressively could potentially hinder the very growth the government is trying to achieve. The interplay between the government's proactive growth plans and the central bank's independent monetary policy adjustments will be crucial for South Korea's economic trajectory in the coming months, as policymakers navigate both domestic challenges and global economic headwinds.", "vocab": [{"word": "Unveil", "definition": "To show or announce something new for the first time."}, {"word": "Strategy", "definition": "A careful plan or method for achieving a particular goal, usually over a long period."}, {"word": "Initiative", "definition": "A new plan or process to achieve something or solve a problem."}, {"word": "Deliberation", "definition": "Careful consideration or discussion of something."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit."}, {"word": "Trajectory", "definition": "The path or direction that something is taking."}]}, "Advanced": {"text": "South Korea is poised to unveil a comprehensive national \"growth strategy\" designed to invigorate its economy and secure long-term prosperity. This significant policy announcement coincides with the Bank of Korea's (BOK) ongoing deliberations regarding a potential hike in its benchmark interest rate. These parallel developments underscore the multifaceted approach Seoul is taking to navigate a complex domestic and global economic environment.\n\nThe government's forthcoming growth strategy is anticipated to detail specific policy initiatives aimed at fostering innovation, bolstering key export-oriented industries, attracting foreign direct investment, and enhancing labor market flexibility. The overarching objective is to stimulate sustainable economic expansion and elevate the nation's competitiveness on the global stage, particularly as it contends with demographic shifts, evolving technological landscapes, and geopolitical uncertainties. Analysts expect the strategy to address structural challenges, identify new engines of growth beyond traditional sectors, and potentially outline reforms to improve productivity and regulatory efficiency.\n\nConcurrently, the BOK's consideration of an interest rate increase is primarily a response to persistent inflationary pressures. Global supply chain disruptions, elevated commodity prices, and robust domestic demand have contributed to a sustained rise in the consumer price index. A rate hike serves as a critical monetary policy tool to temper aggregate demand, thereby cooling down an overheating economy and anchoring inflation expectations. By making borrowing more expensive, the central bank aims to reduce discretionary spending and investment, which can help stabilize prices and prevent a wage-price spiral.\n\nHowever, the BOK faces a delicate balancing act. While curbing inflation is paramount, an aggressive tightening of monetary policy could potentially stifle economic growth, particularly at a time when global demand might be softening due to similar rate hikes in other major economies. Furthermore, higher interest rates could exacerbate household debt burdens, a significant and long-standing concern in South Korea, potentially leading to financial instability if not managed carefully. The central bank's decision will reflect its nuanced assessment of the trade-offs between achieving price stability and maintaining economic momentum, considering both domestic indicators and international economic trends.\n\nThe interplay between the government's fiscal stimulus and industrial policies outlined in the growth strategy, and the BOK's independent monetary policy adjustments, will be pivotal for South Korea's economic trajectory. Policymakers must coordinate effectively to ensure that their respective actions are complementary, rather than contradictory, in steering the economy through a period marked by both opportunities for innovation and formidable headwinds. The success of these combined efforts will determine the resilience and dynamism of the South Korean economy in the coming years, shaping its ability to adapt to future challenges and capitalize on emerging global trends.", "vocab": [{"word": "Poised", "definition": "Ready and prepared for something to happen."}, {"word": "Invigorate", "definition": "To give new energy or strength to something."}, {"word": "Concurrently", "definition": "Happening at the same time."}, {"word": "Bolstering", "definition": "Supporting or strengthening."}, {"word": "Deliberations", "definition": "Long and careful consideration or discussion."}, {"word": "Paramount", "definition": "More important than anything else; supreme."}, {"word": "Exacerbate", "definition": "To make a problem, bad situation, or negative feeling worse."}, {"word": "Trajectory", "definition": "The path or direction that something is taking or will take."}]}}, "questions": [{"q": "What is the government's main goal with its new \"growth strategy\"?", "a": "The government aims to strengthen the economy, boost industries, encourage investment, and create jobs."}, {"q": "Why is the Bank of Korea considering raising interest rates?", "a": "The Bank of Korea is considering raising interest rates to control inflation, which means stopping prices from going up too quickly."}], "id": "aa7b2255584", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxONVB4dGRTMVFEVUFfTjBpWHZLVFo5RXlXR3lQLWlmLXktbW9lVzVYdlFNTmZOemx5WE83RWR6ZWZBVTJOdW96UmV4T3RpRW8tWGl2UVg4S1M1Q2oyWm9UZmpMMFIwSGZaOFRlUG5JV1ZQT0Jad1BmUEs2VmZYSnVvbGtGbFlTWmdFTmhOdll0WlZRMlNaTkc2d0xvTm80OUdFTDRr?oc=5", "published": "2026-07-12T07:00:05+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Central Bank Reminds Public: Don't Copy Banknotes", "excerpt": "The Philippine central bank recently reminded everyone that copying or reproducing local banknotes without permission is strictly against the law.", "levels": {"Beginner": {"text": "The central bank in the Philippines has an important message for everyone. It wants people to know that copying Philippine money is not allowed. This includes paper money, which we call banknotes.\n\nThe bank sent out a reminder on July 11. It said that a rule from 2014, called Circular No. 829, stops people from making copies of money without special permission.\n\nWhat does \"copying\" mean? It means you cannot print money, photocopy it, or share pictures of it if you don't have official permission. You also cannot use fake copies of money. This rule helps keep our money safe.\n\nMoney is very important for a country. It helps people buy and sell things every day. If many people start copying money, it can cause big problems. It can make real money lose its value. This is why countries have strict rules about copying money.\n\nThe central bank is in charge of a country's money. It makes sure the money is real and safe to use for everyone. So, if you see Philippine banknotes, remember they are real and should not be copied. Always use real money for shopping and payments. This rule helps keep the country's money system strong and trustworthy.", "vocab": [{"word": "central bank", "definition": "The main bank of a country that manages its money."}, {"word": "banknotes", "definition": "Paper money used as currency."}, {"word": "permission", "definition": "Official approval to do something."}, {"word": "reproduce", "definition": "To make a copy of something."}, {"word": "value", "definition": "How much something is worth."}, {"word": "trustworthy", "definition": "Able to be relied on as honest or truthful."}]}, "Intermediate": {"text": "The Bangko Sentral ng Pilipinas (BSP), which serves as the central bank of the Philippines, recently issued a public reminder regarding the unauthorized reproduction of Philippine banknotes. On July 11, the BSP reiterated that its existing regulation, Circular No. 829, Series of 2014, strictly prohibits any person or entity from copying the nation's currency without official permission.\n\nThis regulation specifically states that no one is allowed to print, photocopy, distribute, or use any image or facsimile of a Philippine banknote if they do not have prior authorization from the central bank. The rule applies to all forms of reproduction, whether for personal, commercial, or artistic purposes, unless explicitly approved by the BSP.\n\nThe primary reason behind such stringent rules is to protect the integrity and stability of the country's financial system. Unauthorized reproduction of currency, often referred to as counterfeiting, can have severe economic consequences. If fake money circulates widely, it can erode public trust in the national currency, potentially leading to inflation and disrupting economic transactions. Businesses might become hesitant to accept cash, and the overall value of real money could decrease.\n\nMaintaining the stability of the currency is a crucial role of the central bank. It is responsible for designing, printing, and issuing banknotes and coins, ensuring their authenticity and security. By reminding the public about Circular No. 829, the BSP aims to prevent potential counterfeiting activities and educate citizens about the legal implications of such actions.\n\nThis reminder serves as a warning to individuals and organizations alike that violating this circular can lead to legal penalties. It underscores the importance of respecting national currency regulations to safeguard the economy and ensure that all financial dealings remain secure and legitimate. The BSP's statement emphasizes its commitment to upholding the integrity of the Philippine peso.", "vocab": [{"word": "reproduction", "definition": "The act of making a copy of something."}, {"word": "reiterated", "definition": "Repeated something already said for emphasis or clarity."}, {"word": "prohibits", "definition": "Officially forbids something by law or rule."}, {"word": "facsimile", "definition": "An exact copy, especially of a document or image."}, {"word": "integrity", "definition": "The quality of being whole and undivided; soundness or completeness."}, {"word": "counterfeiting", "definition": "Illegally copying something, especially money, to deceive."}, {"word": "stringent", "definition": "Strict, precise, and exacting rules or requirements."}]}, "Advanced": {"text": "The Bangko Sentral ng Pilipinas (BSP), the nation's central monetary authority, recently issued a salient reminder to the public concerning the illicit reproduction of Philippine banknotes. In its statement on July 11, the BSP underscored the enduring validity and stringent provisions of Circular No. 829, Series of 2014, which unequivocally prohibits any individual or entity from engaging in the unauthorized replication of the country's currency.\n\nSpecifically, the circular stipulates that \"No person or entity may print, photocopy, distribute, or use any image or facsimile of a Philippine banknote\" without explicit prior authorization from the central bank. This comprehensive prohibition extends beyond physical replication to encompass digital dissemination and any form of visual representation that could be mistaken for genuine currency or used to facilitate counterfeiting. The rationale behind such a robust regulatory framework is multifaceted, primarily aimed at safeguarding the integrity and stability of the Philippine financial ecosystem.\n\nCounterfeiting poses a significant threat to economic stability. The proliferation of fake currency can erode public confidence in the national tender, leading to a devaluation of legitimate banknotes and potentially triggering inflationary pressures. Businesses and consumers alike could become wary of cash transactions, disrupting commerce and increasing transaction costs. Historically, central banks worldwide have implemented rigorous security features in banknotes and enacted strict laws against counterfeiting to mitigate these risks. The BSP, in line with international best practices, continuously updates its currency designs with advanced anti-counterfeiting measures while simultaneously reinforcing legal deterrents.\n\nThe central bank's mandate extends beyond merely issuing currency; it is also tasked with maintaining price stability, ensuring a sound financial system, and regulating the country's money supply. By proactively reminding the populace about Circular No. 829, the BSP is not only enforcing a specific regulation but also fulfilling its broader responsibility to educate the public on financial literacy and the severe legal ramifications associated with currency forgery. Violators of this circular face substantial penalties, which may include imprisonment and hefty fines, underscoring the gravity with which such offenses are treated.\n\nIn an increasingly digital age, the challenge of unauthorized reproduction has evolved. The ease with which high-quality images can be captured, manipulated, and distributed online necessitates constant vigilance from monetary authorities. While the circular predates some of the more advanced digital tools, its broad language regarding \"any image or facsimile\" is designed to cover contemporary methods of reproduction. This proactive communication from the BSP serves as a critical reinforcement of existing statutes, ensuring that both traditional and modern forms of currency misuse are addressed, thereby preserving the sanctity and trustworthiness of the Philippine peso in both domestic and international transactions.", "vocab": [{"word": "salient", "definition": "Most noticeable or important; prominent."}, {"word": "illicit", "definition": "Forbidden by law, rules, or custom; unlawful."}, {"word": "underscored", "definition": "Emphasized the importance of something."}, {"word": "unequivocally", "definition": "In a way that leaves no doubt; unambiguously."}, {"word": "proliferation", "definition": "Rapid increase in the number or amount of something."}, {"word": "devaluation", "definition": "The reduction or underestimation of the worth or importance of something, especially currency."}, {"word": "mitigate", "definition": "Make less severe, serious, or painful; alleviate."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event."}]}}, "questions": [{"q": "What is the main purpose of the central bank's reminder?", "a": "The main purpose is to remind the public that it is illegal to copy or reproduce Philippine banknotes without official permission."}, {"q": "What specific actions are prohibited by Circular No. 829, Series of 2014?", "a": "The circular prohibits printing, photocopying, distributing, or using any image or facsimile of a Philippine banknote without authorization."}], "id": "aa4c6f19df9", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxQUFJSZzVNY2I0cVZ2ZnNZaDRvX3hrRzQxUlozcWQtOXJaemZJN3B2VktMR1FnU1M3OEFyRTZTM1pjb1hvR2lob3djamlpM3NsZVRoMjlIUS1vQWxrR1pXMWExS3hnN01fcjZFYW5UelBxaGVXSXIzTEhxMVRNcTNsSnlIM0xISGNVWlQwMkREZVJGMndnVkdFTnVZV2pLV2NMdEIzZTVpQ0paTzFZaTZqRWdEeHVRM0NZcWxnaXdBbXlvZFEwdHBJeE9LZXJVWjZtYWViYmgzVmNWM2lV?oc=5", "published": "2026-07-12T06:35:51+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Poland Pledges Memorial for WW2 Victims Amid Ukraine Tensions", "excerpt": "Poland's Prime Minister pledges a memorial for Polish victims of World War Two killings by Ukrainian nationalists, highlighting a deep historical disagreement.", "levels": {"Beginner": {"text": "Poland's leader, Prime Minister Donald Tusk, has said his country will build a special place to remember people who died a long time ago. This memorial will be for Polish people killed during World War Two. These killings happened because of Ukrainian nationalists.\n\nWorld War Two was a very big war many years ago. During this war, many Polish people were killed in a region called Volhynia. Polish leaders say these killings were a terrible crime, like a genocide. Ukrainian groups, called nationalists, were involved in these acts.\n\nFor many years, Poland and Ukraine have not agreed about this part of history. They have been \"at loggerheads,\" which means they have strongly disagreed. Poland wants everyone to remember these victims and what happened.\n\nToday, Poland is a very good friend to Ukraine. Poland helps Ukraine a lot in its fight against Russia. But even with this friendship, remembering history is still very important for both countries. The new memorial will help Poland honor those who were lost.", "vocab": [{"word": "memorial", "definition": "A statue or building that helps people remember a person or event."}, {"word": "killed", "definition": "To cause someone to die."}, {"word": "nationalists", "definition": "People who strongly believe their own country is the best and should be independent."}, {"word": "disagreed", "definition": "To have a different opinion from someone else."}, {"word": "honor", "definition": "To show great respect for someone or something."}, {"word": "victims", "definition": "People who have been hurt, killed, or suffered because of a crime or event."}]}, "Intermediate": {"text": "Poland's Prime Minister, Donald Tusk, has announced plans to establish a memorial dedicated to Polish victims of World War Two. This monument will specifically commemorate the thousands of civilians killed by Ukrainian nationalists during the conflict, particularly in the Volhynia region.\n\nThe killings, which took place between 1943 and 1945, are a deeply sensitive and contested issue between Warsaw and Kyiv. Polish historians and officials often describe these events as an act of genocide or ethnic cleansing, where Ukrainian nationalist groups, primarily the Ukrainian Insurgent Army (UPA), targeted Polish communities. Ukraine, while acknowledging the tragic events, often places them within the broader, brutal context of World War Two, where multiple groups fought for survival and control, and where both sides committed atrocities.\n\nFor decades, Poland and Ukraine have been \"at loggerheads\" over the interpretation of these historical events, meaning they have been in strong disagreement. The Polish government views the memorial as a crucial step to honor the victims and ensure that their suffering is not forgotten.\n\nDespite this historical friction, Poland has emerged as one of Ukraine's staunchest allies in its current conflict with Russia. This strong contemporary alliance, however, does not erase the need to address difficult historical narratives. Prime Minister Tusk's pledge underscores Poland's commitment to historical truth and remembrance, even as it maintains robust support for its neighbor. The memorial aims to provide a lasting tribute to those who perished.", "vocab": [{"word": "establish", "definition": "To set up or create something."}, {"word": "commemorate", "definition": "To remember and show respect for someone or something important in the past."}, {"word": "sensitive", "definition": "Easily upset or offended; requiring careful handling."}, {"word": "contested", "definition": "Something that is argued about or disagreed upon."}, {"word": "atrocities", "definition": "Extremely cruel, violent, or shocking acts."}, {"word": "friction", "definition": "Disagreement or conflict between people or groups."}, {"word": "staunchest", "definition": "Most loyal and committed."}]}, "Advanced": {"text": "Poland's Prime Minister, Donald Tusk, has formally pledged the creation of a memorial dedicated to the Polish victims of World War Two, specifically addressing the mass killings perpetrated by Ukrainian nationalists. This announcement reignites a long-standing and profoundly sensitive historical dispute that has, for decades, placed Warsaw and Kyiv at loggerheads.\n\nThe planned memorial will honor the thousands of Polish civilians who perished, primarily in the Volhynia and Eastern Galicia regions, between 1943 and 1945. These events, often referred to as the Volhynia Massacres, saw Ukrainian nationalist formations, most notably the Ukrainian Insurgent Army (UPA), systematically target Polish communities. From the Polish perspective, these actions constituted an act of genocide and ethnic cleansing, aimed at eradicating the Polish presence in territories claimed by Ukrainian nationalists.\n\nUkrainian historical narratives, while acknowledging the tragic loss of life, often frame these events within the complex and brutal multi-sided conflict of World War Two. They highlight the UPA's struggle for an independent Ukraine against both Soviet and Nazi occupation, and also against Polish underground forces. They point to instances of Polish retaliatory actions and argue that the UPA's actions, while horrific, were part of a broader struggle for national self-determination, rather than solely an act of ethnic extermination. This divergence in interpretation has been a persistent source of diplomatic tension.\n\nPrime Minister Tusk's commitment underscores Poland's unwavering resolve to ensure historical truth and remembrance for its victims. This pledge comes at a time when Poland has emerged as one of Ukraine's most steadfast allies in its defense against Russian aggression. The geopolitical imperative of supporting Ukraine has, at times, led to a temporary de-emphasis of these historical grievances in public discourse. However, the Polish government's move signals that while contemporary alliances are crucial, the historical memory of these atrocities remains a foundational element of Polish national identity and foreign policy.\n\nThe memorial is intended not only as a tribute to the deceased but also as a statement that historical accountability cannot be sidestepped, even amidst pressing current events. Navigating this delicate balance between honoring a painful past and fostering a vital present-day alliance continues to be a significant challenge for both nations, requiring nuanced diplomacy and a commitment to open, albeit difficult, dialogue. The initiative aims to provide a permanent testament to the scale of the suffering endured.", "vocab": [{"word": "perpetrated", "definition": "Carried out or committed (a harmful, illegal, or immoral action)."}, {"word": "reignites", "definition": "Starts again or causes to start again (a strong feeling or conflict)."}, {"word": "profoundly", "definition": "To a great depth; intensely."}, {"word": "divergence", "definition": "The process or state of separating and going in different directions."}, {"word": "unwavering", "definition": "Steady or resolute; not changing or becoming weaker."}, {"word": "geopolitical imperative", "definition": "A crucial need or requirement related to international politics and geography."}, {"word": "grievances", "definition": "Real or imagined wrongs or causes for complaint or protest."}, {"word": "nuanced", "definition": "Characterized by subtle shades of meaning or expression."}]}}, "questions": [{"q": "What historical event is the Polish Prime Minister pledging a memorial for?", "a": "The Polish Prime Minister is pledging a memorial for Polish civilians killed by Ukrainian nationalists during World War Two, particularly in the Volhynia region."}, {"q": "How is the historical disagreement between Poland and Ukraine described, and how does it relate to their current relationship?", "a": "The historical disagreement is described as a long-standing and sensitive issue where Poland and Ukraine have been \"at loggerheads\" over the interpretation of the killings. Poland views them as genocide, while Ukraine places them within the broader context of WW2. Despite this historical friction, Poland is currently one of Ukraine's staunchest allies against Russia, creating a delicate balance between remembering the past and maintaining a vital present-day alliance."}], "id": "a2ea87ab9a5", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cze94x4361po?at_medium=RSS&at_campaign=rss", "published": "2026-07-12T06:56:52+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Ebonyi Government, CSOs Clash Over $500M World Bank Grant", "excerpt": "A significant disagreement has emerged between the Ebonyi State government and civil society organizations regarding the management of a $500 million World Bank grant.", "levels": {"Beginner": {"text": "There is a problem in Ebonyi State, Nigeria. The government of Ebonyi State and some groups called Civil Society Organizations (CSOs) are not agreeing. They are clashing over a lot of money. This money is a grant of $500 million from the World Bank.\n\nCSOs are groups of people who work to help communities. They are not part of the government. They often speak for the people and want to make sure things are done fairly. The World Bank is a big organization that gives money to countries. This money helps countries with important projects, like building schools, hospitals, or roads. These projects are for development, which means making life better for everyone.\n\nThe CSOs and the Ebonyi government are disagreeing about how this $500 million grant should be used. They also disagree on who should manage the money. It is important for them to find a way to agree. This way, the money can be used well to help the people of Ebonyi State. When they work together, they can solve problems and make good things happen for the community.", "vocab": [{"word": "clash", "definition": "to disagree strongly or fight"}, {"word": "grant", "definition": "money given by an organization for a special purpose"}, {"word": "organizations", "definition": "groups of people who work together for a specific goal"}, {"word": "development", "definition": "the process of making things better or growing"}, {"word": "manage", "definition": "to control or be in charge of something"}, {"word": "community", "definition": "a group of people living in the same place or having a particular characteristic in common"}]}, "Intermediate": {"text": "A significant dispute has arisen in Ebonyi State, Nigeria, between the state government and various Civil Society Organizations (CSOs). The disagreement centers on the management and allocation of a substantial $500 million grant provided by the World Bank.\n\nCivil Society Organizations are independent groups that operate outside of government and business. They often represent the interests of citizens, advocate for specific causes, and play a crucial role in promoting transparency and accountability in public affairs. The World Bank, an international financial institution, offers grants and loans to developing countries to support projects aimed at reducing poverty and fostering sustainable development. These funds are typically earmarked for critical sectors such as infrastructure, health, education, and social welfare programs.\n\nThe core of the clash in Ebonyi State involves how the $500 million grant should be utilized and who should oversee its implementation. CSOs are likely raising concerns about the transparency of the fund allocation process, ensuring that the money reaches its intended beneficiaries, and the overall accountability of government spending. Such grants often come with specific conditions from the World Bank, requiring proper oversight and community involvement.\n\nThis disagreement highlights the ongoing tension that can occur between government bodies and civil society groups over public resources, particularly large development funds. For the people of Ebonyi State, resolving this dispute is vital to ensure that the $500 million grant effectively contributes to much-needed development initiatives and improves living standards across the state. Collaboration between all parties is essential to achieve these goals.", "vocab": [{"word": "dispute", "definition": "a disagreement or argument"}, {"word": "allocation", "definition": "the action or process of distributing something"}, {"word": "transparency", "definition": "the quality of being open, honest, and clear"}, {"word": "accountability", "definition": "the responsibility to explain one's actions and accept blame for failures"}, {"word": "oversee", "definition": "to supervise someone or something, especially in an official capacity"}, {"word": "initiatives", "definition": "new plans or strategies designed to achieve a particular aim"}, {"word": "collaboration", "definition": "the action of working with someone to produce or create something"}]}, "Advanced": {"text": "A significant point of contention has emerged in Ebonyi State, Nigeria, as the state government and a coalition of Civil Society Organizations (CSOs) find themselves at odds over the management and disbursement of a substantial $500 million grant from the World Bank. This dispute underscores the complex dynamics often present in the governance of development aid and the critical role civil society plays in ensuring public accountability.\n\nCivil Society Organizations are non-governmental, non-profit entities that represent a diverse range of interests and causes. They serve as vital watchdogs, advocating for community needs, promoting human rights, and often providing oversight on government projects and expenditures. The World Bank, a preeminent international financial institution, provides financial and technical assistance to developing countries worldwide, with a core mandate to reduce poverty and support sustainable development. Its grants are typically allocated for transformative projects in sectors such as infrastructure, healthcare, education, and economic empowerment, often with stringent conditions regarding financial management and impact assessment.\n\nAt the heart of the current clash in Ebonyi State are likely concerns raised by CSOs regarding the transparency of the grant's allocation process, the efficacy of proposed implementation strategies, and the overall accountability mechanisms for the substantial funds. Such large-scale grants are susceptible to mismanagement or diversion if robust oversight is not in place. CSOs often demand participatory approaches, ensuring that local communities, the ultimate beneficiaries, have a voice in how these funds are utilized and monitored.\n\nThis disagreement is not an isolated incident but rather reflects a broader pattern in many developing nations where the relationship between state actors and civil society can be fraught with tension, particularly concerning resource control and governance. For the World Bank, ensuring that its funds achieve their intended developmental impact requires not only governmental commitment but also a strong, independent civil society capable of monitoring and advocating for prudent resource utilization.\n\nResolving this impasse is imperative for the socio-economic advancement of Ebonyi State. A constructive dialogue, coupled with clear, mutually agreed-upon frameworks for transparency, accountability, and community engagement, will be essential. The effective deployment of this $500 million grant holds the potential to significantly uplift the living standards and developmental trajectory of the state, provided all stakeholders can align on its judicious management.", "vocab": [{"word": "contention", "definition": "a point or issue that causes disagreement"}, {"word": "disbursement", "definition": "the act of paying out money, especially from a fund"}, {"word": "governance", "definition": "the action or manner of governing a state, organization, etc."}, {"word": "preeminent", "definition": "surpassing all others; very distinguished in some way"}, {"word": "efficacy", "definition": "the ability to produce a desired or intended result"}, {"word": "susceptible", "definition": "likely or liable to be influenced or harmed by a particular thing"}, {"word": "imperative", "definition": "of vital importance; crucial"}, {"word": "judicious", "definition": "having, showing, or done with good judgment or sense"}]}}, "questions": [{"q": "What is the main issue causing the clash between the Ebonyi government and CSOs?", "a": "The main issue is a disagreement over the management and use of a $500 million grant from the World Bank."}, {"q": "What is the general purpose of grants like the one from the World Bank?", "a": "Grants from the World Bank are generally given to support development projects, such as improving infrastructure, health, and education, and reducing poverty."}], "id": "aa45c732cae", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMigwFBVV95cUxPbUZybnZ2WExldXpUMUV0cVd2MHVqSWM3c19OSnZxYkNid0d1RnljOVp0T0JxbkhyYW1uX3c2cXBfYkZfRHY1QzJFZnBwOU5ES29wYlFaZ3VwNEIzMFppUEhoVVBXbU9PaVNZTDhxbUloTlRnbGhDR2VkekpmSkdZTWV6WQ?oc=5", "published": "2026-07-12T05:00:11+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Norway v England: World Cup 2026 quarter-final – live", "excerpt": "⚽️ World Cup kick-off: 5pm EDT/10pm BST/7am AEST ⚽️ Player guide | Bracketology | Golden Boot | Mail Scott You won’t need reminding that ton", "levels": {"Beginner": {"text": "⚽️ World Cup kick-off: 5pm EDT/10pm BST/7am AE perience, connecting a geographically dispersed fanbase and amplifying the communal aspect of sports spectatorship. This particular Saturday night game, therefore, was not merely an athletic competition; it was also a focal point for widespread fan engagement and online interaction, underscoring the multifaceted appeal and cultural significance of Major League Baseball as America's enduring national pastime.", "vocab": [{"word": "installment", "definition": "one of several parts of something published or broadcast at intervals; a single event in a series"}, {"word": "undisclosed", "definition": "not revealed or made known; secret"}, {"word": "gravitas", "definition": "dignity, seriousness, or solemnity of manner"}, {"word": "palpable", "definition": "able to be touched or felt; easily perceived"}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely"}, {"word": "intricate", "definition": "very complicated or detailed"}, {"word": "discourse", "definition": "written or spoken communication or debate"}, {"word": "multifaceted", "definition": "having many different aspects or features"}]}}, "questions": [{"q": "What sport was played on Saturday night?", "a": "Baseball was played on Saturday night."}, {"q": "What time did the game start?", "a": "The game started at 7:05 PM."}], "id": "ae2622e156a", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihAFBVV95cUxPMk9JX3liNGZOdVNKWGw1QzZ2Vi1oaDRVZ2xJcFlwWEFaV1M5eUNhWFM5RS1xSy1VeWhEcUFaTXNPTERsWTBILWxhdjF2MkN2QWRFMFRJVzJleDRJeEFhaF9XbG15dmhZV290QUlZVFZ1a2c0bjBaV0RnZ3gtc2tvUklNT0o?oc=5", "published": "2026-07-12T07:30:00+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Retail investors talk it out, cook at home as market madness takes a toll - Korea JoongAng Daily", "excerpt": "Retail investors talk it out, cook at home as market madness takes a toll Korea JoongAng Daily", "levels": {"Beginner": { const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
