s and interviews with current and former federal officers and individuals close […]", "vocab": []}}, "questions": [], "id": "a18a1239c54", "source": "Variety", "link": "https://variety.com/2026/tv/news/pima-county-sheriff-department-mistakes-nancy-guthrie-1236826065/", "published": "2026-08-03T07:13:10+09:00", "category": "entertainment"}]}], "home": [{"headline": "Cubs Eyeing Key Players in MLB Trade Rumors", "excerpt": "The Chicago Cubs are reportedly exploring potential trades for veteran players Soriano, Weaver, and Hoffman to strengthen their roster.", "levels": {"Beginner": {"text": "The Chicago Cubs, a famous baseball team, are looking to make their team stronger. Recent news reports talk about \"trade rumors.\" This means the Cubs might want to get some new players from other teams. They are reportedly interested in three well-known players: Soriano, Weaver, and Hoffman.\n\nIn baseball, teams often trade players. A trade happens when one team gives a player to another team. In return, they usually get other players or young players for the future. Teams do this to improve their roster, which is the list of players on their team. They want to fill any weak spots or add more talent.\n\nSoriano is known for being a strong hitter and can play in different positions. Weaver is a starting pitcher, meaning he throws the ball to start games. Hoffman is a famous relief pitcher, often called a \"closer,\" who comes in at the end of games to secure a win. The Cubs hope that bringing in players like these could help them win more games and become a top team. However, these are just rumors for now, and no deals have been made. Fans are watching closely to see if these trades will happen.", "vocab": [{"word": "team", "definition": "A group of people who play a sport together."}, {"word": "rumors", "definition": "Stories or news that might not be true."}, {"word": "trade", "definition": "To give something and get something else in return."}, {"word": "player", "definition": "A person who plays a sport."}, {"word": "pitcher", "definition": "A baseball player who throws the ball to the batter."}, {"word": "improve", "definition": "To make something better."}]}, "Intermediate": {"text": "The Chicago Cubs are reportedly exploring options to bolster their roster, with recent MLB trade rumors linking them to three prominent players: Soriano, Weaver, and Hoffman. These discussions highlight the team's potential strategy to enhance its competitiveness.\n\nIn Major League Baseball, trade rumors are a common part of the season, especially as teams approach the trade deadline. Teams engage in trades to acquire players who can address specific needs, whether it's strengthening their batting lineup, improving their pitching rotation, or solidifying their bullpen. When a team expresses \"interest\" in a player, it means they are evaluating the possibility of making a deal, though no formal agreement has been reached.\n\nSoriano is known as a versatile player, capable of playing both in the infield and outfield, and is particularly recognized for his power hitting. Acquiring a player like Soriano could provide a significant boost to the Cubs' offensive capabilities. Jered Weaver, a seasoned starting pitcher, could bring stability and experience to the Cubs' pitching rotation, helping them to control games from the start. Trevor Hoffman, a legendary closer, would be a major addition to the bullpen. Closers are crucial for securing wins in tight games, and Hoffman's track record speaks for itself.\n\nThe Cubs' interest in these veterans suggests a desire to add proven talent to their squad. Such moves are often aimed at making a strong push for the playoffs or building a more competitive team for future seasons. While these are currently just rumors, they indicate the Cubs' active participation in the player market as they seek to optimize their team composition. Fans are eagerly awaiting any official announcements regarding these potential acquisitions.", "vocab": [{"word": "bolster", "definition": "To make something stronger or better."}, {"word": "prominent", "definition": "Important or well-known."}, {"word": "competitiveness", "definition": "The ability to be as good as or better than others."}, {"word": "acquire", "definition": "To get or obtain something."}, {"word": "versatile", "definition": "Able to do many different things well."}, {"word": "stability", "definition": "The quality of being steady and not changing."}, {"word": "crucial", "definition": "Extremely important or necessary."}]}, "Advanced": {"text": "The Chicago Cubs are reportedly engaged in preliminary discussions and evaluations concerning potential roster enhancements, with prominent Major League Baseball trade rumors indicating their interest in acquiring veteran talents Alfonso Soriano, Jered Weaver, and Trevor Hoffman. This strategic exploration underscores the franchise's ongoing efforts to fortify its competitive standing within the league, signaling a proactive approach to team building.\n\nMLB trade rumors are a perennial fixture of the baseball calendar, intensifying particularly as the non-waiver trade deadline approaches. These speculative reports often precede significant roster adjustments, as front offices meticulously analyze their team's strengths and weaknesses. The objective of such transactions is multifaceted: to address immediate deficiencies, augment existing strengths, or strategically position the team for future success by acquiring players who can contribute across various facets of the game. A reported \"interest\" signifies that the Cubs' management is actively assessing the feasibility and strategic fit of these players, though it remains far from a confirmed deal, often involving complex negotiations over player compensation and prospects.\n\nAlfonso Soriano, a dynamic and powerful offensive force, has historically demonstrated versatility across both infield and outfield positions. His potential acquisition could inject a much-needed jolt of power and run production into the Cubs' lineup, providing a veteran presence capable of impacting games with his bat and potentially elevating the team's overall offensive output. Jered Weaver, a seasoned right-handed starting pitcher, is renowned for his consistent command, durability, and ability to log significant innings, often serving as an ace or a reliable number two in a rotation. Integrating a pitcher of Weaver's caliber would undoubtedly stabilize the Cubs' rotation, offering a reliable anchor and potentially alleviating pressure on younger arms, crucial for sustained success over a long season. Trevor Hoffman, a future Hall of Famer and one of the most iconic closers in baseball history, would represent a monumental upgrade to the Cubs' bullpen. His unparalleled ability to navigate high-leverage situations and consistently secure saves is a rare commodity, essential for a team aspiring to deep playoff runs and protecting late-game leads.\n\nThe Cubs' pursuit of these established players suggests a clear intent to elevate the team's immediate performance and potentially contend more vigorously for a championship. Such moves are often calculated gambits, balancing the cost of acquisition (typically prospects or other players) against the anticipated on-field impact and the potential for a deeper postseason run. While the veracity of trade rumors can vary widely, their prevalence indicates a proactive approach by the Cubs' front office to optimize their roster composition and capitalize on market opportunities. Fans and analysts alike will be keenly observing developments as the trade market evolves, anticipating whether these rumored interests will materialize into concrete transactions that could significantly reshape the team's trajectory for the current season and beyond.", "vocab": [{"word": "preliminary", "definition": "Happening before something more important, an initial stage."}, {"word": "fortify", "definition": "To strengthen or reinforce."}, {"word": "perennial", "definition": "Lasting for a very long time, or happening repeatedly."}, {"word": "meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "augment", "definition": "To make something greater by adding to it; to increase."}, {"word": "versatility", "definition": "The ability to adapt or be adapted to many different functions or activities."}, {"word": "caliber", "definition": "The quality of someone or something, especially their ability or level of excellence."}, {"word": "unparalleled", "definition": "Having no equal or rival; unmatched."}]}}, "questions": [{"q": "Which baseball team is reportedly interested in new players?", "a": "The Chicago Cubs."}, {"q": "Name two types of players (by position) that the Cubs are rumored to be interested in.", "a": "A hitter/outfielder/infielder (Soriano) and a pitcher (Weaver, Hoffman)."}], "id": "acbe23de269", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijgFBVV95cUxPdVJsTmpzX1Z3U05JdGtHVjRSd1BLUmFsWGF4N1RJcElTVDF4STQ4X1o4UHFTbWQ1YnpuOU1lZHhUYzBpcVFTSkhwaUZ5LVJqV2tRRl9ONWhvYXpHQWRzUWFNR05ZUkhHNHRDZ1VKSnNOY0dEaHFxelR6LUFtUkVEUzVsU1ctYkxyMk5UWHZR?oc=5", "published": "2026-08-03T07:25:19+09:00", "category": "business", "category_title": "Business"}, {"headline": "Yankees Acquire Luis Garcia Jr., Bolstering Offense with Lefty Bat", "excerpt": "The New York Yankees acquired Luis Garcia Jr., a powerful left-handed hitter, a strategic move praised by analysts to boost their lineup.", "levels": {"Beginner": {"text": "The New York Yankees baseball team has a new player. His name is Luis Garcia Jr. The Yankees got him in a trade. A trade is when teams exchange players. Luis Garcia Jr. is a good hitter. He bats with his left hand. This is important because the Yankees needed more players who hit left-handed. Having left-handed hitters can make it harder for other teams' pitchers. Sports experts are happy about this trade for the Yankees. They say it was a smart move. Luis Garcia Jr. is known as a \"big bat,\" which means he can hit the ball very hard and far. This will help the Yankees score more runs. Many people think this new player will make the Yankees a stronger team. The team hopes he will help them win more games in the future. This trade is seen as a good step for the Yankees as they try to improve their roster.", "vocab": [{"word": "trade", "definition": "when teams give players to each other."}, {"word": "hitter", "definition": "a player who bats the ball."}, {"word": "left-handed", "definition": "using the left hand to bat."}, {"word": "score", "definition": "to get points in a game."}, {"word": "team", "definition": "a group of players working together."}, {"word": "roster", "definition": "the list of players on a team."}]}, "Intermediate": {"text": "The New York Yankees baseball club has completed a significant player acquisition, bringing Luis Garcia Jr. to their roster. This move, widely reported and analyzed by sports media, addresses a key strategic need for the Bronx Bombers: a powerful left-handed bat. In professional baseball, a \"trade\" involves teams exchanging players, often to fill specific gaps or improve overall team balance.\n\nLuis Garcia Jr. is recognized as a formidable left-handed hitter, capable of driving the ball with authority. The Yankees' lineup, like many in professional baseball, often seeks to achieve a balance between left-handed and right-handed batters. This balance makes it more challenging for opposing pitchers, who might specialize in facing one type of hitter. By adding Garcia Jr., the Yankees aim to create more offensive versatility and depth, making their batting order less predictable for opponents.\n\nSports analysts and publications, including Sports Illustrated, have been quick to issue \"trade grades\" for this transaction. The consensus suggests that the Yankees have made a shrewd move, earning positive evaluations for securing a player who fits their requirements so well. A \"big bat\" like Garcia Jr. is expected to contribute significantly to run production, potentially hitting home runs and driving in teammates from scoring position. This acquisition is anticipated to strengthen the Yankees' chances as they compete in their league, providing a valuable asset to their offensive strategy. The addition of a player with Garcia Jr.'s profile is often seen as a way to boost a team's performance, especially in crucial moments of a game. Fans and team management alike will be watching to see how this new talent integrates into the team and impacts their pursuit of championship success.", "vocab": [{"word": "acquisition", "definition": "getting or buying something."}, {"word": "roster", "definition": "the list of players on a team."}, {"word": "strategic", "definition": "related to a plan for achieving a goal."}, {"word": "formidable", "definition": "inspiring respect or fear; powerful."}, {"word": "versatility", "definition": "the ability to do many different things."}, {"word": "shrewd", "definition": "having sharp powers of judgment; clever."}, {"word": "consensus", "definition": "a general agreement."}]}, "Advanced": {"text": "The New York Yankees have executed a notable player transaction, securing the services of Luis Garcia Jr., a move that has garnered considerable attention and largely positive \"trade grades\" from prominent sports outlets, including Sports Illustrated. This acquisition is strategically significant, as it addresses a long-identified void within the Yankees' offensive architecture: the need for a potent, left-handed power bat. In the intricate landscape of Major League Baseball, team executives constantly seek to optimize their rosters through shrewd trades, aiming to enhance specific facets of play or to achieve a more balanced overall composition that can exploit pitching matchups.\n\nGarcia Jr. is heralded as a formidable left-handed slugger, possessing the capacity to impact games with his ability to drive the ball for extra bases and home runs. The strategic imperative for a balanced lineup cannot be overstated in modern baseball. A diverse batting order, featuring both left-handed and right-handed hitters, presents a more complex challenge for opposing pitching staffs. Pitchers often develop specialties against particular handedness, and a lineup that can seamlessly alternate between the two forces opponents to make difficult bullpen decisions and can disrupt their game plans. Garcia Jr.'s inclusion is expected to provide this crucial offensive equilibrium, particularly against right-handed pitching, which often dominates the league and can expose a lineup overly reliant on right-handed bats. His presence could also protect other key hitters in the lineup, making it harder for opposing managers to pitch around them.\n\nThe positive \"trade grades\" reflect an analytical consensus that the Yankees have made a sagacious decision. These evaluations, common in contemporary sports journalism, assess the immediate and potential long-term benefits of a player exchange for all parties involved, considering factors like player talent, contract value, and the assets surrendered. For the Yankees, the calculus appears straightforward: they have acquired a player who not only fills a specific positional and handedness requirement but also brings a track record of offensive production. This move is anticipated to bolster the team's run-scoring capabilities, injecting a much-needed jolt of power and situational hitting into the middle or lower third of the batting order, thereby increasing the overall threat level of their offense.\n\nBeyond the immediate statistical contributions, the addition of a player like Garcia Jr. can have a ripple effect on team morale and competitive posture. It signals to both the clubhouse and the fan base a commitment to contending for championships and a willingness to make necessary adjustments. As the Yankees navigate a highly competitive division and league, such calculated roster enhancements are paramount to maintaining a competitive edge. The integration of Garcia Jr. into the team's offensive scheme will be closely monitored, with expectations high that his presence will translate into tangible improvements in the team's overall performance and its pursuit of postseason glory, potentially altering the trajectory of their season.", "vocab": [{"word": "transaction", "definition": "an instance of buying or selling something; a business deal."}, {"word": "garnered", "definition": "gathered or acquired (something, especially information or approval)."}, {"word": "potent", "definition": "having great power, influence, or effect."}, {"word": "architecture", "definition": "the complex or carefully designed structure of something."}, {"word": "imperative", "definition": "of vital importance; crucial."}, {"word": "sagacious", "definition": "having or showing keen mental discernment and good judgment; shrewd."}, {"word": "bolster", "definition": "support or strengthen."}, {"word": "paramount", "definition": "more important than anything else; supreme."}]}}, "questions": [{"q": "What kind of player did the Yankees acquire?", "a": "The Yankees acquired Luis Garcia Jr., a powerful left-handed hitter."}, {"q": "Why was this acquisition considered important for the Yankees?", "a": "This acquisition was important because the Yankees needed a left-handed bat to balance their lineup and make it more challenging for opposing pitchers."}], "id": "a8461800a80", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMid0FVX3lxTE1CM0V4bG5TbWxWbkVhWUNqMGMydGp0OXNPOHdFNUd5X0o2aXlkQzN3YjNBcjljVUp4M1RWOXFFelNCb0dkMmIyX3lUVUJMdzZyay1JZkdoMEZqZGhSZmh3cE1xM200eGJ6emNnb0dRcDh6LUlEZjM4?oc=5", "published": "2026-08-03T07:04:23+09:00", "category": "business", "category_title": "Business"}, {"headline": "China's Central Bank to Bolster Real Economy with Enhanced Financial Support", "excerpt": "China's central bank plans to significantly increase financial assistance for businesses and job-creating sectors in the second half of the year.", "levels": {"Beginner": {"text": "China's main bank, called the central bank, will give more money help to the country's economy. This will happen in the second half of the year, from July to December. The central bank wants to make sure businesses can grow and people have jobs.\n\nThe \"real economy\" means all the companies that make things, offer services, and create jobs. It's about factories, shops, and workers, not just money markets. By giving more support, the central bank hopes to make the economy stronger.\n\nWhen the economy is strong, more people have work, and companies can sell more products. This helps the whole country. The central bank's job is to keep the economy stable and help it grow. This new plan is part of that important job. They will work to make sure money is available for important projects and businesses. This is good news for China's economic future.", "vocab": [{"word": "central bank", "definition": "The main bank of a country that manages its money."}, {"word": "economy", "definition": "How a country makes and uses money, goods, and services."}, {"word": "support", "definition": "Help or assistance."}, {"word": "businesses", "definition": "Companies that make or sell things."}, {"word": "grow", "definition": "To get bigger or increase."}, {"word": "stable", "definition": "Not easily changed; steady."}]}, "Intermediate": {"text": "China's central bank, the People's Bank of China (PBOC), has announced plans to significantly enhance financial support for the nation's \"real economy\" during the second half of the year. This strategic move, expected from July to December, aims to bolster economic growth and ensure stability across various sectors.\n\nThe \"real economy\" refers to the part of the economy that produces goods and services, such as manufacturing, agriculture, and retail, directly creating jobs and wealth. It contrasts with the financial sector, which deals with money, investments, and banking. By focusing support here, the central bank intends to stimulate production, encourage investment, and boost consumer spending, thereby strengthening the foundations of the national economy.\n\nCentral banks typically use various tools to influence economic activity, including adjusting interest rates, managing the money supply, and providing lending facilities. While specific measures were not detailed, \"enhancing financial support\" often implies making it easier and cheaper for businesses to borrow money, or directing funds towards key industries and projects. This could involve lowering borrowing costs for companies, increasing the availability of loans, or even targeted support for small and medium-sized enterprises (SMEs) which are vital for job creation.\n\nThis initiative comes as China, like many global economies, navigates a complex economic outlook, facing challenges such as global demand fluctuations and domestic adjustments. Ensuring robust growth and job creation remains a key priority for policymakers. The central bank's proactive stance signals its commitment to providing the necessary liquidity and favorable financial conditions to help businesses thrive and the overall economy maintain a healthy trajectory in the coming months. This strategic focus is crucial for China's continued economic development and its role in the global market.", "vocab": [{"word": "enhance", "definition": "To improve or increase."}, {"word": "financial support", "definition": "Money or help with money."}, {"word": "real economy", "definition": "The part of the economy that makes goods and services, not just money."}, {"word": "stimulate", "definition": "To encourage something to grow or become more active."}, {"word": "stability", "definition": "The state of being steady and not changing much."}, {"word": "measures", "definition": "Actions taken to achieve a goal."}, {"word": "outlook", "definition": "What is likely to happen in the future."}]}, "Advanced": {"text": "China's central bank, the People's Bank of China (PBOC), has signaled its intent to significantly enhance financial support for the nation's \"real economy\" throughout the second half of the current year. This proactive stance, spanning from July to December, underscores Beijing's commitment to bolstering economic growth and ensuring macroeconomic stability amidst a complex global and domestic landscape. The PBOC, as the country's monetary authority, plays a pivotal role in managing the money supply, credit conditions, and overall financial system to achieve national economic objectives.\n\nThe \"real economy\" is a critical concept, distinguishing the productive sectors—manufacturing, agriculture, services, and infrastructure development—from purely financial activities. By channeling robust financial support into these areas, the PBOC aims to stimulate tangible output, foster investment in productive capacity, and safeguard employment. This strategic emphasis helps to mitigate risks of financial speculation while underpinning sustainable economic expansion, ensuring that financial resources are directed towards wealth-creating activities rather than speculative ventures.\n\nCentral banks globally deploy a suite of monetary policy instruments to manage economic conditions. For the PBOC, \"enhancing financial support\" could manifest through various mechanisms. These might include targeted reductions in policy interest rates for specific sectors, adjustments to the reserve requirement ratio (RRR) for commercial banks to free up lending capital, or the implementation of structural monetary policy tools designed to direct credit towards strategic emerging industries, small and medium-sized enterprises (SMEs), or green development initiatives. The overarching goal is to lower financing costs and improve credit accessibility for businesses engaged in actual production and service delivery, thereby boosting their capacity to invest and expand.\n\nThis policy directive arrives at a juncture where China's economy, while demonstrating resilience, faces several headwinds. These include fluctuating global demand, persistent geopolitical tensions, and ongoing structural adjustments within its domestic property sector. Maintaining a steady growth trajectory and ensuring ample job creation are paramount objectives for Chinese policymakers. The central bank's commitment to providing adequate liquidity and fostering favorable financial conditions is crucial for navigating these challenges and sustaining the momentum of recovery and high-quality development.\n\nMoreover, the PBOC's approach often balances growth imperatives with the need for prudent risk management and inflation control. The calibrated provision of financial support aims to avoid excessive stimulus that could lead to asset bubbles or inflationary pressures, instead focusing on precise interventions that address specific economic bottlenecks and support high-quality development. This nuanced strategy reflects a sophisticated understanding of the interplay between monetary policy and the broader economic ecosystem, striving for a balanced, robust, and sustainable economic future for China. Such measures are vital for reinforcing market confidence and ensuring a stable environment for businesses and consumers alike.", "vocab": [{"word": "enhance", "definition": "To intensify, improve, or increase the quality, value, or extent of something."}, {"word": "monetary policy", "definition": "The actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "robust", "definition": "Strong and healthy; able to withstand difficult conditions."}, {"word": "underpinning", "definition": "Providing a basis of support, strength, or truth."}, {"word": "headwinds", "definition": "Factors or circumstances that make progress more difficult or slow it down."}, {"word": "liquidity", "definition": "The availability of liquid assets to a market or company; ease with which assets can be converted into cash."}, {"word": "prudent", "definition": "Acting with or showing care and thought for the future; wise and cautious."}, {"word": "calibrate", "definition": "To adjust or fine-tune something precisely to achieve a desired outcome."}]}}, "questions": [{"q": "What part of the year will China's central bank increase financial support?", "a": "The central bank will increase financial support in the second half of the year, from July to December."}, {"q": "What is the main goal of the central bank's plan to support the \"real economy\"?", "a": "The main goal is to boost economic growth, stimulate production, encourage investment, safeguard employment, and ensure overall macroeconomic stability."}], "id": "a226a8ed7d3", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxQazd5aG9Lb1VZRXpvbEUya3BHelhBZUU5NGJsaW5KdU5CSnNNWjlENTB1bHp2NFN4amhtQms2em5BdGVTZkxzQWM0SmVHQTB6QjlZenVkQjZFRDBJck53T0VnMU5WVXYwbVBCaUJGQTJMR0cxQ1NHSXVZZlY4OUV0OHNNbkkxVTcxRGxIVDdXaG01dXJxTWJhRnRLWDI1dWM?oc=5", "published": "2026-08-03T06:41:02+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Bangladesh Bank Cuts Key Interest Rate After Two Years", "excerpt": "Bangladesh's central bank has lowered its main interest rate for the first time in two years, aiming to boost the economy.", "levels": {"Beginner": {"text": "Bangladesh Bank, which is the central bank of Bangladesh, has made an important change. It has cut its main interest rate by 0.50%. This is the first time they have lowered this rate in two years. \n\nWhat does this mean? When the central bank cuts its interest rate, it usually makes it cheaper for other banks to borrow money. In turn, these banks might then offer cheaper loans to businesses and people. \n\nFor businesses, cheaper loans mean they might borrow more money to grow, buy new machines, or hire more workers. For people, it could mean cheaper loans for homes or cars. \n\nThis move is often done to help the economy grow. When borrowing is cheaper, people and businesses are more likely to spend and invest. This can make the economy stronger. The central bank hopes this change will encourage more economic activity in Bangladesh.", "vocab": [{"word": "central bank", "definition": "The main bank of a country that controls money and other banks."}, {"word": "interest rate", "definition": "The extra money you pay when you borrow money, or the extra money you earn when you save money."}, {"word": "cut", "definition": "To make something smaller or lower."}, {"word": "borrow", "definition": "To take money from someone with the promise to pay it back later."}, {"word": "economy", "definition": "The system of how a country makes and uses money, goods, and services."}]}, "Intermediate": {"text": "Bangladesh Bank, the country's central financial authority, has announced a significant shift in its monetary policy. For the first time in two years, the central bank has decided to cut its key policy rate by 50 basis points, which is equivalent to 0.50 percentage points. This decision marks a notable change after a period where rates were either held steady or increased, often to combat inflation.\n\nThe policy rate, also known as the repurchase agreement (repo) rate, is the rate at which commercial banks borrow money from the central bank. When this rate is lowered, it typically reduces the cost of borrowing for commercial banks. These savings are then often passed on to consumers and businesses in the form of lower interest rates on loans for mortgages, car purchases, and business investments.\n\nThe primary goal of such a rate cut is to stimulate economic activity. By making credit more affordable, Bangladesh Bank aims to encourage greater investment by businesses and increased spending by consumers. This can lead to job creation, higher production, and overall economic growth. The move suggests the central bank believes the economy needs a boost, or that inflationary pressures have eased enough to allow for such a measure.\n\nThis adjustment comes after a two-year period during which the central bank maintained a tighter monetary stance. The decision reflects a strategic effort to support the nation's economic expansion and ensure financial stability.", "vocab": [{"word": "monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit to influence the economy."}, {"word": "basis points", "definition": "A common unit of measure for interest rates and other financial percentages, where one basis point equals one-hundredth of a percentage point (0.01%)."}, {"word": "commercial banks", "definition": "Banks that offer services to the general public and to companies, like taking deposits and giving loans."}, {"word": "stimulate", "definition": "To encourage something to grow, develop, or become more active."}, {"word": "inflationary pressures", "definition": "Factors that cause prices to rise, reducing the purchasing power of money."}, {"word": "economic expansion", "definition": "A period when a country's economy is growing, typically measured by an increase in goods and services produced."}]}, "Advanced": {"text": "Bangladesh Bank, the nation's apex monetary authority, has implemented a significant recalibration of its monetary policy, opting to reduce its key policy rate by 50 basis points. This marks the first such reduction in two years, signaling a strategic pivot aimed at invigorating economic activity and fostering a more accommodative financial environment. The cut, equivalent to 0.50 percentage points, brings the policy rate to a new level, though the specific new rate was not detailed in the initial report.\n\nThe policy rate, often referred to as the repurchase agreement (repo) rate, serves as a crucial benchmark. It dictates the cost at which commercial banks can borrow short-term funds from the central bank. A reduction in this rate typically translates into lower lending rates across the banking sector, making credit more accessible and affordable for businesses and individual consumers. This mechanism is designed to stimulate investment, encourage consumption, and ultimately propel economic growth.\n\nThis decision follows a protracted period of monetary tightening, or at least a steady stance, during which Bangladesh Bank, like many central banks globally, prioritized reining in persistent inflationary pressures. For the past two years, the focus has largely been on stabilizing prices and managing the exchange rate. The current move suggests that the central bank perceives a sufficient easing of these pressures, or that the imperative to bolster economic expansion has gained precedence.\n\nEconomists will be closely monitoring the impact of this rate cut on various sectors. Lower borrowing costs could incentivize businesses to undertake new projects, expand operations, and create employment opportunities. For consumers, it might translate into more favorable terms for mortgages, personal loans, and credit card debt, potentially boosting aggregate demand. However, the central bank will also need to carefully balance the growth impetus against any resurgence of inflation, especially in an economy still navigating global economic volatilities. This policy adjustment underscores Bangladesh Bank's proactive approach to macroeconomic management, aiming to strike an optimal balance between price stability and sustainable economic development.", "vocab": [{"word": "apex monetary authority", "definition": "The highest or most powerful institution responsible for controlling a country's money supply and financial system, typically the central bank."}, {"word": "recalibration", "definition": "The process of adjusting or fine-tuning a system, policy, or instrument to achieve a desired outcome or restore accuracy."}, {"word": "invigorating", "definition": "Giving strength, energy, or life to something; making it more active or lively."}, {"word": "accommodative", "definition": "In economics, referring to a policy (like monetary policy) that aims to stimulate growth by making credit more available and cheaper."}, {"word": "protracted", "definition": "Lasting for a long time or longer than expected or usual; prolonged."}, {"word": "reining in", "definition": "Controlling or limiting something, often by applying strict measures or discipline."}, {"word": "imperative", "definition": "Something that is extremely important or urgent; a crucial necessity."}, {"word": "aggregate demand", "definition": "The total demand for all goods and services produced in an economy at a given overall price level and in a given time period."}]}}, "questions": [{"q": "What institution made the decision to cut the policy rate?", "a": "Bangladesh Bank, the central bank of Bangladesh, made the decision."}, {"q": "What is the main goal of cutting the policy rate?", "a": "The main goal is to stimulate economic activity, encourage investment, and boost consumer spending by making borrowing cheaper."}], "id": "a05d6d0c8dd", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMingFBVV95cUxOXzYwR01iU01ram9ZWlhRZmM1TDRhMTJPT19YVUE4YWl0TWtuOTdPNnRlQzk1Y0ltcHAzZ25OaERoOE8tYy11cW9IaVFKR1NfT2FtemNTOTZCSS1QeVpabTRndF9NdnVBMno5SzBBbXRQZVV2R2FCa0gzYUJyM1c0UWZ0Z1NaeE9pd21ScndaM2pNRTF1UHV4dF9SbXJjZ9IBowFBVV95cUxPakJGVzhFZ1JjNmk2czBDYkVvUDVOUHZudnlwZjhNcVV0bHpiVUxneWMxNmpDZ0RxYU5iaXM1eXZpWXdJOFhYaUo0dkNIWjd1R3ZWdkNWY0lnWmlvVDJGTjhMQldzLUZWSGNaLUdIVHZ6VFhmNU5FbEkzdHlOSFVYbmpHME9ielI3QnJGNHdmY2RDMEVZbTNJWGs0Wi14ME1aSVBN?oc=5", "published": "2026-08-03T05:28:20+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "U.S. State Department Restores Global Health Aid with Big Donations", "excerpt": "The U.S. State Department is restoring some global health aid programs, thanks to significant donations from private philanthropic organizations.", "levels": {"Beginner": {"text": "The U.S. State Department helps people around the world with health. This is called global health aid. Sometimes, this help is cut. But now, the State Department has more money for it. This money comes from big donations. These donations mean the U.S. can give more help again.\n\nThis help is very important. It fights diseases like HIV/AIDS and malaria. It also helps mothers and children stay healthy. The donations let the U.S. bring back some of this important work. This is good news for many people who need health support.\n\nThe U.S. State Department works with other countries. It wants to make the world a healthier place. Global health aid means giving money and support for health programs. These programs teach people about health. They also give medicines and vaccines. In the past, some of this aid was stopped or made smaller. But now, kind people and groups have given a lot of money. These 'big donations' mean the State Department can start helping more again. This support is very important for countries that need it most. It helps save lives and makes communities stronger. The State Department is happy to restore some of these vital health programs thanks to these gifts.", "vocab": [{"word": "State Department", "definition": "Part of the U.S. government that works with other countries."}, {"word": "Global health aid", "definition": "Help given to other countries for health problems."}, {"word": "Donations", "definition": "Money or gifts given to help a cause."}, {"word": "Restore", "definition": "To bring back something that was lost or stopped."}, {"word": "Diseases", "definition": "Sicknesses that can make people ill."}, {"word": "Programs", "definition": "Planned activities or projects."}]}, "Intermediate": {"text": "The U.S. State Department has announced that it is restoring a portion of its global health aid programs. This positive development is largely due to a series of significant donations from private philanthropic organizations. Global health aid refers to financial and technical assistance provided by the U.S. government to other countries to improve health outcomes worldwide.\n\nThese programs often target critical areas such as combating infectious diseases like HIV/AIDS, tuberculosis, and malaria, as well as supporting maternal and child health initiatives, family planning, and vaccine distribution. In recent years, U.S. global health funding has faced reductions, often influenced by shifts in foreign policy priorities or budget constraints. These cuts sometimes led to concerns about the U.S.'s commitment to global health leadership and the potential impact on vulnerable populations.\n\nThe new influx of private funding allows the State Department to reverse some of these previous reductions. While the exact amount of the donations and the specific programs being restored have not been fully detailed, this move signals a renewed effort to address pressing health challenges globally. Experts often emphasize that global health initiatives are not just humanitarian efforts but also crucial for U.S. national security and economic stability, as health crises in one part of the world can quickly spread and affect others. The restoration of this aid is expected to strengthen health systems in developing countries and help prevent outbreaks, ultimately contributing to a healthier and more stable global community. This collaborative approach, combining government efforts with private philanthropy, highlights a shared commitment to improving public health on an international scale.", "vocab": [{"word": "Restoring", "definition": "Bringing back or re-establishing something."}, {"word": "Philanthropic organizations", "definition": "Groups that give money to help people, often for good causes."}, {"word": "Outcomes", "definition": "The results or effects of something."}, {"word": "Infectious diseases", "definition": "Sicknesses that can spread from one person to another."}, {"word": "Constraints", "definition": "Limits or restrictions."}, {"word": "Vulnerable populations", "definition": "Groups of people who are easily hurt or affected."}, {"word": "Initiatives", "definition": "New plans or programs."}]}, "Advanced": {"text": "The U.S. State Department has initiated a significant restoration of its global health aid portfolio, a move largely facilitated by a substantial infusion of private philanthropic donations. This development marks a pivotal moment, signaling a renewed commitment to international health initiatives after periods of fluctuating governmental support. Global health aid, a cornerstone of U.S. foreign policy, encompasses a broad spectrum of programs designed to enhance health outcomes in developing nations.\n\nThese critical interventions range from robust campaigns against infectious diseases such as HIV/AIDS, tuberculosis, and malaria, to comprehensive maternal and child health services, family planning resources, and extensive vaccination programs. Historically, U.S. global health funding has experienced ebbs and flows, often reflecting shifts in presidential administrations' foreign policy doctrines and domestic budgetary pressures. For instance, the previous administration notably curtailed funding for certain global health programs, particularly those related to reproductive health, prompting widespread concern among public health advocates and international partners regarding the U.S.'s role as a global health leader. The current administration has generally sought to re-establish U.S. leadership in multilateral efforts and global health diplomacy.\n\nThe recent series of considerable donations from various philanthropic organizations has provided the necessary impetus to reverse some of these prior reductions. While specific figures and the precise allocation of these funds across programs have yet to be fully disclosed, the impact is expected to be considerable, enabling the State Department to bolster vital health infrastructure and service delivery in numerous vulnerable regions. Experts consistently underscore that global health initiatives transcend mere humanitarianism; they are intrinsically linked to U.S. national security, economic stability, and diplomatic influence. Uncontrolled epidemics or weak health systems in one region can quickly precipitate global crises, as evidenced by recent pandemics. By investing in global health, the U.S. not only fulfills a moral imperative but also proactively safeguards its own interests by preventing the spread of diseases, fostering stable societies, and building goodwill. This collaborative model, where governmental agencies leverage significant private sector contributions, highlights an evolving landscape of international development funding. It underscores a collective recognition that addressing complex global health challenges requires diversified resources and a unified approach, ultimately contributing to a more resilient and equitable global health architecture.", "vocab": [{"word": "Portfolio", "definition": "A collection of investments or programs managed by an organization."}, {"word": "Facilitated", "definition": "Made easier or possible."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Doctrine", "definition": "A belief or set of beliefs held and taught by a political party, church, or other group."}, {"word": "Curtailed", "definition": "Reduced in extent or quantity; imposed a restriction on."}, {"word": "Impetus", "definition": "The force or energy with which a body moves; a driving force."}, {"word": "Intrinsic", "definition": "Belonging naturally; essential."}, {"word": "Precipitate", "definition": "Cause (an event or situation, typically one that is bad or undesirable) to happen suddenly, unexpectedly, or prematurely."}]}}, "questions": [{"q": "What is helping the State Department restore global health aid?", "a": "Big donations from private philanthropic organizations are helping the State Department restore global health aid."}, {"q": "Why is global health aid considered important, according to the article?", "a": "Global health aid is important because it fights diseases, helps mothers and children, strengthens health systems, and is crucial for national security and economic stability."}], "id": "aae59c862f3", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivwFBVV95cUxQdHhISW1ZNTk3dm5SRFAtZlgzLWt3Q3M3elp2aFJfR2hsYkpfSUdhMWxqVzcyV2dtbGtrVWdQWXJUYjZ0UmNXQU1aNnRaUTdhQzFsNzM0QkthdzN5Y0pXeXpqZG55NC1TX1F2UW1zZEx4dzhmSUVrOS05dkc0Tk81aUR5SEZZV1hOaThzYTh5ZTZsTjBpaW40T2FlZHd5Y01VaHpjUjdsOVo0YzV6Z0pMakNDNlh1UlV3c3BKREhNZw?oc=5", "published": "2026-08-03T07:28:08+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Lula Launches Re-election Bid, Vows to Protect Brazil's Sovereignty", "excerpt": "Brazilian President Luiz Inácio Lula da Silva has announced his intention to seek re-election, promising to safeguard the nation's independence.", "levels": {"Beginner": {"text": "Lula is the President of Brazil. He recently said he wants to be president again. This is called a re-election bid. He wants to lead Brazil for another term. Lula made a promise. He said he will defend Brazil's sovereignty. This means he will protect Brazil's right to govern itself. Brazil should make its own decisions. No other country should tell Brazil what to do. Lula believes Brazil's land, like the Amazon rainforest, is very important. He wants to keep it safe. He also wants to protect the people of Brazil. Lula was president before, from 2003 to 2010. He won the election again in 2022. Now, he is thinking about the next election. He wants to continue his work. His party is the Workers' Party. They focus on helping working people. Defending sovereignty also means protecting Brazil's economy and its place in the world. He wants Brazil to be strong and independent. This announcement shows his plans for the future of the country. He is ready to campaign again. He wants to make sure Brazil stays strong and makes its own choices.", "vocab": [{"word": "President", "definition": "The leader of a country."}, {"word": "Re-election", "definition": "When a leader tries to be chosen again for their job."}, {"word": "Defend", "definition": "To protect something from harm."}, {"word": "Sovereignty", "definition": "A country's right to rule itself."}, {"word": "Campaign", "definition": "A series of actions to win an election."}, {"word": "Independent", "definition": "Not controlled by others."}]}, "Intermediate": {"text": "Brazilian President Luiz Inácio Lula da Silva has officially announced his intention to seek re-election, signaling an early start to the country's next presidential campaign cycle. The veteran politician, who returned to office in January 2023 after serving two previous terms from 2003 to 2010, made the declaration while emphasizing a core promise: to vigorously defend Brazil's sovereignty.\n\nLula's pledge to protect national sovereignty carries significant weight in Brazil, a nation rich in natural resources, particularly the Amazon rainforest. This concept refers to a country's supreme authority within its own territory and its independence from external control. For Brazil, defending sovereignty often involves asserting control over its vast natural wealth, managing environmental policies without foreign interference, and shaping its own foreign policy agenda.\n\nHis Workers' Party (PT) leader highlighted that Brazil must maintain its autonomy in international relations and economic decisions. This includes safeguarding its industries, promoting national development, and ensuring that the benefits of its resources primarily serve its own citizens. The announcement positions Lula as a strong advocate for national self-determination as he looks ahead to another potential term.\n\nThe decision to declare his re-election bid relatively early suggests a strategic move to consolidate his political position and set the agenda for the upcoming electoral contest. Lula's return to power in 2022 was a notable political comeback, and his current administration has focused on social programs, economic recovery, and re-establishing Brazil's presence on the global stage. His commitment to sovereignty will likely be a central theme in his future campaign, resonating with voters who value national pride and independence.", "vocab": [{"word": "Officially", "definition": "In a formal and public way."}, {"word": "Veteran", "definition": "Someone who has a lot of experience in a particular field."}, {"word": "Vigorously", "definition": "In a strong, active, and forceful way."}, {"word": "Pledge", "definition": "A serious promise or commitment."}, {"word": "Autonomy", "definition": "The right or condition of self-government."}, {"word": "Consolidate", "definition": "To make something stronger or more secure."}, {"word": "Resonating", "definition": "Evoking a strong emotional response or connection."}]}, "Advanced": {"text": "Brazilian President Luiz Inácio Lula da Silva has formally declared his intention to seek re-election, signaling an early commencement to what promises to be a highly contested presidential campaign cycle. The announcement, made with characteristic resolve, underscores Lula's unwavering commitment to a core tenet of his political philosophy: the robust defense of Brazil's national sovereignty.\n\nLula, a towering figure in Brazilian politics, returned to the presidency in January 2023, marking a remarkable political comeback after a period of legal challenges and imprisonment that had previously barred him from running. His previous two terms, from 2003 to 2010, were largely characterized by significant social programs that lifted millions out of poverty and robust economic growth, propelled by a commodities boom. Now, as the leader of the Workers' Party (PT), he is positioning himself for another potential mandate, emphasizing the imperative of national self-determination in a complex global landscape.\n\nThe concept of sovereignty holds particular resonance in Brazil, a nation grappling with immense geopolitical, economic, and environmental pressures. For Lula, defending sovereignty extends beyond mere territorial integrity; it encompasses asserting Brazil's autonomous control over its vast natural resources, most notably the Amazon rainforest, and resisting external dictates on environmental policy and resource exploitation. It also involves forging an independent foreign policy, free from undue alignment with any single global power, and prioritizing national interests in trade negotiations, technological development, and economic partnerships. This stance often translates into advocating for multilateralism and strengthening South-South cooperation, aiming to enhance Brazil's influence as a leader among developing nations.\n\nHis current administration has already focused on re-establishing Brazil's international standing and recalibrating its environmental policies, a stark contrast to the approach of the previous government. The early declaration of his re-election bid can be interpreted as a strategic maneuver to consolidate his political base, deter potential challengers from within and outside his broad coalition, and proactively shape the narrative for the upcoming election. By anchoring his campaign in the defense of sovereignty, Lula aims to tap into a deep vein of national pride and address persistent concerns about foreign influence over Brazil's strategic assets and policy choices, particularly in sensitive areas like agriculture and energy.\n\nThis commitment is not merely rhetorical; it informs his government's approach to international agreements, trade negotiations, and resource management. Lula's vision for Brazil is one of a robust, self-reliant nation capable of charting its own course on the global stage, while simultaneously addressing pressing domestic issues such as poverty reduction, social inequality, and sustainable development. The forthcoming campaign will undoubtedly see this theme amplified, as Lula seeks to secure a further term to solidify his legacy and implement his ambitious agenda for Brazil's future, ensuring the nation's autonomy and prosperity in an ever-evolving world order.", "vocab": [{"word": "Commencement", "definition": "The beginning of something; a start."}, {"word": "Resolve", "definition": "Firm determination to do something; strong will."}, {"word": "Unwavering", "definition": "Steady and resolute; not giving way to pressure or doubt."}, {"word": "Imperative", "definition": "Of vital importance; crucial or essential."}, {"word": "Geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "Autonomous", "definition": "Having the freedom to govern itself or control its own affairs; independent."}, {"word": "Multilateralism", "definition": "The principle of multiple countries working together on a given issue or towards a common goal."}, {"word": "Recalibrating", "definition": "Adjusting or fine-tuning something, often to improve its accuracy, effectiveness, or alignment with new conditions."}]}}, "questions": [{"q": "What is the main announcement made by President Lula?", "a": "President Lula announced his intention to seek re-election for another term as Brazil's leader."}, {"q": "What key promise did President Lula make regarding Brazil's future?", "a": "He promised to vigorously defend Bra const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
