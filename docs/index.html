tizens. They want to make sure people can live without fear of crime and that laws are followed.", "vocab": [{"word": "arrested", "definition": "caught by police and taken to a police station."}, {"word": "seized", "definition": "taken by force or by law."}, {"word": "illegal", "definition": "not allowed by law."}, {"word": "business", "definition": "an organization that sells goods or services."}, {"word": "safer", "definition": "more protected from danger."}, {"word": "community", "definition": "a group of people living in the same place."}]}, "Intermediate": {"text": "Birmingham Police have successfully shut down an illegal business operation in the city, leading to three arrests and the seizure of multiple firearms and illicit drugs. This action was taken recently as part of ongoing efforts by law enforcement to combat crime and enhance public safety within Birmingham.\n\nOfficers conducted an operation targeting the unlawful enterprise, which was reportedly engaged in activities that violated state and federal laws. During the intervention, police apprehended three individuals connected to the illegal activities. These arrests are a significant step in disrupting criminal networks operating within the city.\n\nIn addition to the arrests, authorities confiscated a significant quantity of guns and various types of illegal narcotics. The presence of both firearms and drugs often indicates a serious criminal enterprise, such as drug trafficking or illegal arms dealing, which can fuel violence and other crimes in a community.\n\nWhile the specific nature of the illegal business was not fully detailed in initial reports, such operations typically pose a direct threat to community welfare. Shutting down these types of illicit operations is a crucial step in reducing crime rates and making neighborhoods safer for residents. It helps to remove dangerous items from the streets and deter further criminal activity.\n\nThe Birmingham Police Department emphasized its commitment to proactively addressing criminal behavior and ensuring the security of its citizens. This successful operation underscores the department's dedication to upholding the law and protecting the community from the dangers associated with illegal trade and its related criminal elements. The police continue to encourage citizens to report suspicious activities to help maintain a safe environment.", "vocab": [{"word": "operation", "definition": "a planned activity involving many people, especially by the police or military."}, {"word": "enterprise", "definition": "a project or undertaking, especially a difficult or important one; often used for a business."}, {"word": "apprehended", "definition": "caught and arrested someone."}, {"word": "confiscated", "definition": "officially took something away from someone."}, {"word": "narcotics", "definition": "illegal drugs."}, {"word": "illicit", "definition": "forbidden by law, rules, or custom."}, {"word": "proactively", "definition": "by taking action to prevent something from happening rather than reacting to it after it has happened."}]}, "Advanced": {"text": "Birmingham Police have successfully dismantled an illicit business operation within the city, culminating in the apprehension of three individuals and the substantial seizure of firearms and various controlled substances. This decisive action, undertaken recently, forms part of a broader strategic initiative by local law enforcement to vigorously combat criminal enterprises and bolster public safety across Birmingham's communities. Such proactive measures are critical in disrupting the flow of illegal goods and reducing the overall incidence of crime.\n\nOfficers meticulously planned and executed an intervention targeting the unlawful venture, which was reportedly engaged in activities that contravened both state and federal statutes. The precise nature of the illegal business, while not fully disclosed in preliminary reports, typically encompasses grave offenses such as drug trafficking, illegal arms dealing, or other sophisticated criminal endeavors that profoundly jeopardize community well-being. The presence of both weaponry and narcotics often signifies a deeply entrenched criminal network capable of fueling violence, exacerbating other societal ills, and undermining the fabric of urban life.\n\nDuring the operation, law enforcement personnel successfully apprehended three suspects directly implicated in the illegal activities. These arrests represent a significant disruption to the criminal infrastructure operating within the city, potentially dismantling key nodes in the local illicit trade. The individuals taken into custody will face charges related to their involvement in the unlawful enterprise, with investigations likely continuing to identify any further connections or co-conspirators. This ongoing investigative work is crucial for understanding the full scope of such operations and preventing their resurgence.\n\nBeyond the arrests, authorities confiscated a considerable cache of firearms and a diverse array of illegal narcotics. The removal of these dangerous items from circulation is paramount to mitigating potential violence and drug-related harm within the community. Such seizures not only prevent these materials from reaching the streets but also send a clear message to other criminal elements that their activities will not be tolerated. The impact of removing illegal firearms and drugs extends beyond immediate safety, contributing to a long-term reduction in crime and an improvement in public health outcomes.\n\nThe Birmingham Police Department has reiterated its unwavering commitment to proactively addressing criminal behavior and safeguarding the security of its citizenry. This successful operation underscores the department's dedication to upholding the rule of law and protecting the public from the pervasive dangers associated with organized illegal trade and its ancillary criminal elements. It highlights the ongoing challenges faced by urban police forces in combating sophisticated criminal networks and the importance of sustained vigilance and community cooperation in maintaining a secure environment. The department encourages residents to remain vigilant and report any suspicious activities, reinforcing the collaborative effort required to foster a safer city and ensure the welfare of all its inhabitants.", "vocab": [{"word": "dismantled", "definition": "took apart or broke up an organization or system."}, {"word": "culminating", "definition": "ending with a particular result or at a particular point."}, {"word": "apprehension", "definition": "the act of arresting someone."}, {"word": "illicit", "definition": "forbidden by law, rules, or custom; illegal."}, {"word": "contravenes", "definition": "violates the prohibition or order of (a law, treaty, or code of conduct)."}, {"word": "exacerbating", "definition": "making a problem, bad situation, or negative feeling worse."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "ancillary", "definition": "providing necessary support to the primary activities or operation of an organization, system, etc."}]}}, "questions": [{"q": "What did the Birmingham Police shut down?", "a": "They shut down an illegal business."}, {"q": "What two main types of items did the police seize?", "a": "They seized guns and drugs."}], "id": "aa6e913ed71", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPYmowRGlQQ0ZpbGRhUWJqZTF6SjdWVzMzYkJoVGdZMzZGRlhtSjF6ZEdybVZIQjRyNmZfbEczbzR3Z3lTSU92QmpjdW40ejI0YXZvVnVCWlFQWm1kSmZqSjVqSlVTMDJzaFVRQzd0NXNqel83TEdpSWNfX1JvdmE2VFdjTDRBNVJuaGZsSV96Q3FyeW1WT25ISmhvYWo4RDlJZEdnNFRuWUxINGdKNGRsM0lR?oc=5", "published": "2026-07-04T07:34:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Costa Rica's Colón Strengthens as US Dollar Weakens", "excerpt": "The Costa Rican Colón has been gaining value against the US dollar, a trend influenced by strong tourism and economic policies.", "levels": {"Beginner": {"text": "Costa Rica's money, called the Colón, is getting stronger. This means you need fewer Colón to buy one US dollar. For people in Costa Rica, this makes things like imported goods cheaper. The US dollar, on the other hand, is becoming weaker in Costa Rica.\n\nWhy is this happening? One big reason is tourism. Many people visit Costa Rica from other countries, especially from the United States. When tourists come, they bring US dollars. They need to change their dollars into Colón to pay for hotels, food, and activities. This creates a high demand for the Colón. When many people want to buy something, its value usually goes up.\n\nAlso, Costa Rica has a stable economy. This makes foreign companies want to invest money there. When they invest, they also change their foreign money into Colón. This also helps the Colón get stronger. The Central Bank of Costa Rica watches the money market closely. They try to keep the economy stable. A strong Colón can be good for the country, but too strong can make exports more expensive.", "vocab": [{"word": "stronger", "definition": "having more power or value."}, {"word": "weaker", "definition": "having less power or value."}, {"word": "tourism", "definition": "the business of helping people travel for fun."}, {"word": "demand", "definition": "a need or desire for something."}, {"word": "stable", "definition": "not easily changed; steady."}, {"word": "invest", "definition": "to put money into something to make more money."}]}, "Intermediate": {"text": "The Costa Rican Colón has been experiencing a period of significant appreciation against the US dollar, a trend that has drawn considerable attention. This means that the Colón is gaining value, requiring fewer Colón to purchase one US dollar. Conversely, the US dollar is weakening within Costa Rica's economy.\n\nSeveral key factors contribute to this phenomenon. A primary driver is Costa Rica's robust tourism sector. The country is a popular destination for international travelers, particularly from the United States. When these tourists arrive, they exchange their US dollars for Colón to cover their expenses, such as accommodation, meals, and activities. This consistent influx of foreign currency creates a high demand for the Colón, naturally pushing its value upward.\n\nBeyond tourism, foreign direct investment (FDI) also plays a crucial role. Costa Rica's reputation for political stability, environmental sustainability, and a growing economy attracts international businesses and investors. These entities often convert substantial amounts of foreign currency into Colón to fund their operations and projects within the country, further bolstering the Colón's strength.\n\nThe Central Bank of Costa Rica (BCCR) actively monitors the foreign exchange market. While a strong Colón can make imported goods cheaper for consumers and reduce the cost of foreign debt, an excessively strong currency can make Costa Rican exports more expensive and less competitive on the global market. The BCCR aims to maintain economic stability and manage inflation, sometimes intervening in the market to smooth out sharp fluctuations in the exchange rate. However, the current trend suggests that the underlying demand for the Colón is strong enough to sustain its appreciation despite any potential interventions. This strength reflects broader confidence in Costa Rica's economic outlook.", "vocab": [{"word": "appreciation", "definition": "an increase in value."}, {"word": "conversely", "definition": "in an opposite way."}, {"word": "robust", "definition": "strong and healthy."}, {"word": "influx", "definition": "an arrival of a large number of people or things."}, {"word": "bolstering", "definition": "supporting or strengthening."}, {"word": "fluctuations", "definition": "irregular rising and falling in number or amount."}, {"word": "outlook", "definition": "the likely future situation."}]}, "Advanced": {"text": "The Costa Rican Colón has demonstrated remarkable resilience and appreciation against the US dollar in recent times, a development that has significant implications for the nation's economy. This sustained strengthening of the Colón means that its purchasing power relative to the US dollar has increased, making imports more affordable for Costa Rican consumers and reducing the local currency cost of servicing foreign-denominated debt. Conversely, the US dollar has experienced a notable depreciation within the Costa Rican foreign exchange market.\n\nSeveral interconnected macroeconomic factors underpin this trend. Foremost among them is the vigorous performance of Costa Rica's tourism sector. As a premier ecotourism destination, the country consistently attracts a substantial volume of international visitors, particularly from key markets like the United States. These tourists inject considerable amounts of foreign currency, predominantly US dollars, into the local economy as they convert it into Colón to cover accommodation, transportation, dining, and recreational activities. This continuous and robust inflow of foreign exchange creates persistent upward pressure on the Colón's value.\n\nFurthermore, Costa Rica's attractiveness as a destination for foreign direct investment (FDI) cannot be overstated. The nation's political stability, commitment to environmental sustainability, skilled workforce, and strategic geographic location have made it a magnet for multinational corporations. These investments, ranging from manufacturing to services, necessitate the conversion of significant foreign capital into Colón, thereby augmenting demand for the local currency. The country's prudent fiscal management and relatively low inflation rates also contribute to investor confidence, further solidifying the Colón's position.\n\nThe role of the Central Bank of Costa Rica (BCCR) in managing monetary policy and exchange rate stability is crucial. While a stronger Colón offers benefits such as mitigating inflationary pressures from imported goods and easing the burden of external debt, an overly strong currency can pose challenges for export-oriented industries by making their products more expensive and less competitive on international markets. The BCCR typically intervenes in the foreign exchange market to smooth out excessive volatility and prevent abrupt shifts that could disrupt economic stability. However, the sustained appreciation of the Colón suggests that the underlying market forces, driven by robust tourism and FDI, are powerful enough to maintain this trajectory, even with potential BCCR interventions aimed at moderating the pace of appreciation or accumulating international reserves.\n\nThis phenomenon also reflects a broader confidence in Costa Rica's economic fundamentals and its capacity to generate foreign exchange. While beneficial for consumers and debt management, policymakers must carefully navigate the implications for exporters and the overall balance of trade to ensure long-term sustainable growth. The current strength of the Colón is a testament to the country's economic appeal, but it also presents a complex balancing act for monetary authorities.", "vocab": [{"word": "resilience", "definition": "the ability to recover quickly from difficulties; toughness."}, {"word": "appreciation", "definition": "an increase in the value or worth of an asset or currency."}, {"word": "implications", "definition": "the possible results or effects of something; consequences."}, {"word": "depreciation", "definition": "a reduction in the value of an asset or currency over time."}, {"word": "macroeconomic", "definition": "relating to the branch of economics concerned with large-scale or general economic factors, such as interest rates and national productivity."}, {"word": "augmenting", "definition": "making something greater by adding to it; increasing."}, {"word": "prudent", "definition": "acting with or showing care and thought for the future; wise and careful."}, {"word": "mitigating", "definition": "making something less severe, serious, or painful; alleviating."}]}}, "questions": [{"q": "What is the name of Costa Rica's currency?", "a": "Costa Rica's currency is called the Colón."}, {"q": "Name two reasons why the Costa Rican Colón is getting stronger against the US dollar.", "a": "Two reasons are strong tourism and foreign direct investment (FDI) in Costa Rica."}], "id": "a6a3bc17f37", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMifEFVX3lxTE10QmhjQlNreHJWZlBWc3BJczdxaHpnTllrbzV1VVR6TUx2c2RTNDlEZnd6TlRjYmphUGxiUDVhaG9DZXU2NGdrQUNGYXVoa3pWVHJIWFd3RUxLN2c5R2ZNSHFkUVlBWk80Y2ptOW5UQ2ROR3FEUm81Z2VsTmQ?oc=5", "published": "2026-07-04T07:14:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "The Central Bank of the Russian Federation set the official euro exchange rate on July 4 at 88.0304 rubles. - AKM.RU", "excerpt": "The Central Bank of the Russian Federation set the official euro exchange rate on July 4 at 88.0304 rubles. AKM.RU", "levels": {"Beginner": {"text": "The Central Bank of the Russian Federation set the official euro exchange rate on July 4 at 88.0304 rubles. AKM.RU", "vocab": []}, "Intermediate": {"text": "The Central Bank of the Russian Federation set the official euro exchange rate on July 4 at 88.0304 rubles. AKM.RU", "vocab": []}, "Advanced": {"text": "The Central Bank of the Russian Federation set the official euro exchange rate on July 4 at 88.0304 rubles. AKM.RU", "vocab": []}}, "questions": [], "id": "a928be02a1e", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiyAFBVV95cUxPZ3Y0S2E3a0hEUkV1YUpzWmpXRFhPWmpTbldYM1lyc3dWRTFzQ3BWc2VpOHRGekpsSDY1cmNtcEttZmdKQlNUWjd6M1FYZFp0a2JLZ2ZpV2dfZmJKSHRiaHNUTm52SzlXN2hZOFVQNkZKNHNCY3RXRHp3d3VRVy1uOTFDODVydFh3dlNGVkRiakRmOUhGVUthWGdodFAzYlJNdnU5cWRLVzczbjdFN0UwTGUxbUUxeUtwWGxrWHp2WFpyeVV2dkVheQ?oc=5", "published": "2026-07-04T06:15:25+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Anguished families left to identify Venezuela quake victims at makeshift morgue", "excerpt": "The disaster has overwhelmed local services, with bodies put outside or in tents for identification.", "levels": {"Beginner": {"text": "The disaster has overwhelmed local services, with bodies put outside or in tents for identification.", "vocab": []}, "Intermediate": {"text": "The disaster has overwhelmed local services, with bodies put outside or in tents for identification.", "vocab": []}, "Advanced": {"text": "The disaster has overwhelmed local services, with bodies put outside or in tents for identification.", "vocab": []}}, "questions": [], "id": "a0dabe5132d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c20y2p9qqqko?at_medium=RSS&at_campaign=rss", "published": "2026-07-04T06:00:53+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "The Times of India's Live Channels Cover Politics", "excerpt": "A major Indian newspaper, The Times of India, uses its live channels to provide real-time news on politics, government, and elections to its readers.", "levels": {"Beginner": {"text": "The Times of India is a very big newspaper in India. It tells people important news every day. Now, The Times of India also uses \"live channels.\" These are like TV shows or internet videos that show things happening right now.\n\nThe newspaper uses these live channels to talk about politics. Politics is about how a country is run. They show news about the government, which makes rules for everyone. They also show news about elections. Elections are when people vote for new leaders.\n\nSo, when something important happens in politics, like a big meeting or a new law, The Times of India can show it live. This means people can watch the news as it happens. They can learn about leaders, new government plans, and who might win an election. This helps people understand what is happening in their country and sometimes in other countries too. It makes it easy to get important news quickly. The Times of India wants to keep its readers well-informed about these big topics.", "vocab": [{"word": "newspaper", "definition": "A printed paper with news, stories, and ads."}, {"word": "live channels", "definition": "TV or internet programs that show events as they happen."}, {"word": "politics", "definition": "The activities of government and how a country is run."}, {"word": "government", "definition": "The group of people who control a country or state."}, {"word": "elections", "definition": "When people vote to choose their leaders."}, {"word": "leaders", "definition": "People who guide or rule others."}]}, "Intermediate": {"text": "The Times of India, one of India's most prominent and widely-read newspapers, has significantly expanded its news delivery methods to meet the demands of a fast-paced information age. Beyond its traditional print editions, the publication now leverages \"live channels\" to provide immediate and in-depth coverage of crucial events. These live channels, accessible through various digital platforms and sometimes television, offer a dynamic way for audiences to stay informed in real time.\n\nThe focus of this real-time coverage often centers on the critical areas of politics, government, and elections, both within India and globally. For instance, during major political developments, such as parliamentary debates, significant policy announcements, or crucial court rulings, The Times of India's live channels offer direct feeds and expert analysis. This allows viewers to witness events unfold as they happen and hear immediate reactions and interpretations from seasoned journalists and political analysts.\n\nElections, whether national or state-level, receive particularly extensive live coverage. From candidate rallies and voter turnout updates to election night results and post-election commentary, these channels ensure that the public is continuously updated on the democratic process. Furthermore, the newspaper uses these platforms to report on global political events, offering insights into international relations and their potential impact on India. By embracing live digital formats, The Times of India aims to maintain its role as a comprehensive news provider, ensuring its vast readership has access to timely and relevant information across the political spectrum. This modern approach helps foster a more engaged and informed citizenry, keeping them connected to the pulse of governance and public life.", "vocab": [{"word": "prominent", "definition": "Important and well-known."}, {"word": "leverages", "definition": "Uses something to maximum advantage."}, {"word": "dynamic", "definition": "Constantly changing or active."}, {"word": "crucial", "definition": "Extremely important."}, {"word": "parliamentary", "definition": "Relating to a parliament (a country's law-making body)."}, {"word": "extensive", "definition": "Covering a large area; great in amount."}, {"word": "citizenry", "definition": "The citizens of a place regarded collectively."}]}, "Advanced": {"text": "In an increasingly digitized and rapidly evolving media landscape, traditional news powerhouses like The Times of India are strategically adapting to meet the demands of contemporary information consumption. Beyond its venerable print legacy, the publication has significantly invested in \"live channels,\" fundamentally transforming its approach to delivering real-time news and in-depth analysis. These sophisticated digital platforms, encompassing streaming video, live blogs, and interactive commentary, are pivotal in maintaining its relevance and expansive reach in a competitive and often fragmented information environment.\n\nThe core mandate of these live channels is to offer comprehensive, immediate coverage of domestic and international politics, governmental proceedings, and intricate electoral cycles. During periods of intense political activity, such as parliamentary sessions, critical legislative debates, or the unveiling of significant policy reforms, The Times of India provides direct, unfiltered access to events as they transpire. This is often augmented by expert commentary, in-depth interviews with key stakeholders, and data-driven analysis, allowing for a multifaceted understanding of complex issues and their potential societal ramifications. The immediacy of live reporting ensures that breaking news, from policy shifts to judicial pronouncements, is conveyed without delay, fostering a well-informed public.\n\nElectoral processes, from the initial campaign trail to the final declaration of results, represent a prime focus for these live platforms. The channels meticulously track candidate movements, public rallies, voter sentiment, and turnout statistics, culminating in minute-by-minute updates on election night. This real-time reporting extends to post-election analysis, examining coalition formations, policy implications, and the broader political ramifications for governance and public life. Furthermore, the newspaper utilizes these platforms to dissect global political developments, offering nuanced perspectives on international relations, geopolitical shifts, and their specific resonance within India's strategic interests and foreign policy objectives.\n\nThis strategic pivot towards live digital content underscores The Times of India's unwavering commitment to journalistic integrity, public enlightenment, and fostering democratic engagement. By providing immediate, accessible, and analytical coverage, the publication not only informs its vast readership but also actively contributes to a more engaged and discerning public discourse. It ensures that citizens are not merely passive const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
