-written a graphic novel and are developing a new game. The news comes as Singer, the project’s writer […]", "vocab": []}, "Advanced": {"text": "Lucy Liu and Eloise Singer are preparing to take “The Pirate Queen: No Safe Waters,” their immersive experience about Chinese pirate leader Cheng Shih, on an international tour next year, Singer tells Variety. The pair have also co-written a graphic novel and are developing a new game. The news comes as Singer, the project’s writer […]", "vocab": []}}, "questions": [], "id": "a9a04133b82", "source": "Variety", "link": "https://variety.com/2026/gaming/news/lucy-liu-pirate-queen-graphic-novel-game-tour-1236938962/", "published": "2026-11-04T10:09:16+09:00", "category": "entertainment"}]}], "home": [{"headline": "Buffalo Bills Ponder Key Position Ahead of NFL Trade Deadline", "excerpt": "With the NFL trade deadline nearing, the Buffalo Bills are reportedly evaluating which player position to target to bolster their roster for a strong playoff run.", "levels": {"Beginner": {"text": "The Buffalo Bills football team is thinking about how to make their team better. Soon, there will be a special day called the NFL trade deadline. This is the last day that teams can trade players with each other. Teams trade players to get stronger. They want to win more games and try to reach the playoffs. The Bills are a good team, but they might need help in some areas. For example, maybe they need a stronger player for their offense, like a wide receiver who catches the ball. Or maybe they need a better player for their defense, like someone who stops other teams from scoring. The team's coaches and managers are looking at all their players. They are deciding which part of the team needs the most help. They will also think about which players they can trade away, or what draft picks they can give up. A draft pick is a chance to choose a new player in the future. Making a trade is a big decision because it can change the team a lot. The Bills want to make the right choice to help them win the championship.", "vocab": [{"word": "trade", "definition": "To exchange one thing for another, like players between teams."}, {"word": "deadline", "definition": "A specific time or date by which something must be completed."}, {"word": "offense", "definition": "The part of a team that tries to score points."}, {"word": "defense", "definition": "The part of a team that tries to stop the other team from scoring."}, {"word": "playoffs", "definition": "A series of games played after the regular season to decide the champion."}, {"word": "championship", "definition": "The final game or series to decide the best team."}]}, "Intermediate": {"text": "The Buffalo Bills are approaching a crucial point in their season: the NFL trade deadline. This annual event marks the final opportunity for teams to exchange players before the end of the regular season, often with the goal of strengthening their roster for a playoff push. For a competitive team like the Bills, making a strategic acquisition at this time can significantly impact their chances of success. Teams typically consider trades for several reasons. They might have injuries to key players, creating unexpected gaps in their lineup. Alternatively, certain positions might not be performing as well as expected, requiring an upgrade. The Bills, known for their strong performance in recent years, are likely evaluating their current squad to identify any areas that could benefit from an external boost. Common positions teams target include offensive linemen to protect the quarterback, wide receivers to enhance the passing game, or defensive players like cornerbacks or defensive linemen to fortify their defense. The decision involves a careful balance. The Bills' management must weigh the immediate benefit of a new player against the cost, which often includes future draft picks or existing players. They also need to consider the player's salary and how they will fit into the team's culture. The objective is clear: to make a move that helps the team not just qualify for the playoffs, but also compete for the Super Bowl championship. As the deadline looms, fans and analysts alike will be watching closely to see what strategic decisions the Buffalo Bills make to enhance their championship aspirations.", "vocab": [{"word": "crucial", "definition": "Extremely important or essential."}, {"word": "deadline", "definition": "A specific time or date by which something must be completed."}, {"word": "roster", "definition": "A list of the players on a sports team."}, {"word": "acquisition", "definition": "The act of getting or buying something, often a player for a team."}, {"word": "strategic", "definition": "Relating to a plan of action designed to achieve a major or overall aim."}, {"word": "fortify", "definition": "To strengthen or improve something, often to make it more effective."}, {"word": "aspirations", "definition": "Strong hopes or ambitions to achieve something."}]}, "Advanced": {"text": "As the NFL season progresses, the Buffalo Bills find themselves at a pivotal juncture, contemplating their strategy ahead of the impending trade deadline. This annual event represents the final opportunity for franchises to augment their rosters through player exchanges, a critical period for teams with championship aspirations. For a perennial contender like the Bills, a judicious acquisition could be the catalyst that propels them deeper into the postseason. The calculus behind trade deadline decisions is multifaceted. Teams often seek to address unforeseen vulnerabilities, such as those arising from significant injuries to key personnel, or to rectify underperforming positional groups. A team's current record, salary cap flexibility, and available draft capital all play a crucial role in determining the feasibility and prudence of potential moves. The Bills' front office must meticulously assess their existing talent pool, identifying any areas where an external infusion of skill or experience could provide a tangible uplift. Common targets for such mid-season enhancements include offensive linemen to bolster pass protection or run blocking, wide receivers to diversify the aerial attack, or defensive stalwarts like edge rushers or cornerbacks to fortify the secondary. The dilemma lies in balancing immediate competitive gains against long-term organizational health. Trading away valuable future draft picks, for instance, can expedite a Super Bowl window but might compromise future team building. Conversely, failing to capitalize on a strong season by making a necessary upgrade could be viewed as a missed opportunity. The integration of a new player also presents challenges, including acclimatization to a new system, playbook, and team culture. However, a well-executed trade can provide a significant psychological boost and inject fresh talent precisely when it's most needed. As the deadline approaches, the Bills' management faces the imperative task of making a strategic decision that aligns with their championship ambitions, potentially solidifying their status as a formidable force in the league. The football world watches keenly to see if they will make a decisive move to fortify their roster for a deep playoff run.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "impending", "definition": "About to happen; imminent."}, {"word": "augment", "definition": "To make something greater by adding to it; increase."}, {"word": "judicious", "definition": "Having, showing, or done with good judgment or sense."}, {"word": "catalyst", "definition": "An agent that provokes or speeds significant change or action."}, {"word": "multifaceted", "definition": "Having many different aspects or features."}, {"word": "prudence", "definition": "The quality of being cautious and sensible."}, {"word": "imperative", "definition": "Of vital importance; crucial."}]}}, "questions": [{"q": "What is the main purpose of the NFL trade deadline for teams like the Buffalo Bills?", "a": "The main purpose is to allow teams to exchange players to strengthen their roster before the end of the regular season, often to improve their chances in the playoffs or for a championship."}, {"q": "What are some factors that teams consider when deciding whether to make a trade?", "a": "Teams consider factors such as injuries to current players, underperforming positions, the immediate benefit of a new player versus the cost (like draft picks), the player's salary, how they fit into the team, and their overall championship aspirations."}], "id": "a1407f198dd", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxQcENqMmNpQnphbVNEenZPTnNvbjEtMzM4ellqWm5xQ1hzYVh4TTFHaU5tRnpVOGR1UnRMbkVIX1pMY25teVBHNEhjQmI2MEJhUUVQQWdseDZtR2p6UkRyWUd0VzRiWGhrRjY2YnNtd0pJdFdsb2ZTSEwwcjZyU2xrQWRudTVzYkQ2a1E?oc=5", "published": "2026-11-04T09:57:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Las Vegas Eateries Adapt to Soaring Import Prices", "excerpt": "Las Vegas restaurants are adjusting their operations to manage the increasing costs of imported ingredients and supplies, impacting their business models.", "levels": {"Beginner": {"text": "Las Vegas restaurants are seeing higher prices for food and other things they buy from other countries. This means it costs more for them to make the meals we enjoy. These higher prices are because it costs more to ship goods around the world. Also, things like gas and other materials are more expensive now.\n\nTo deal with these extra costs, restaurants in Las Vegas are making changes. Some might change their menus. This could mean using different ingredients that cost less, or finding new places to buy their food from. Other restaurants might need to make their dishes a little more expensive for customers. This helps them cover the new costs and keep their doors open.\n\nLas Vegas has many restaurants, and they all want to offer great food. By changing how they work, these businesses can continue to serve visitors and local people. It's a way for them to stay strong even when prices go up. They are working hard to make sure customers still have a good experience.", "vocab": [{"word": "higher prices", "definition": "when things cost more money than before."}, {"word": "other countries", "definition": "nations or places outside of one's own country."}, {"word": "ship goods", "definition": "to send products from one place to another, often by boat, plane, or truck."}, {"word": "extra costs", "definition": "additional money that needs to be spent."}, {"word": "deal with", "definition": "to handle or manage a problem or situation."}, {"word": "menus", "definition": "lists of food and drinks offered in a restaurant."}]}, "Intermediate": {"text": "Restaurants across Las Vegas are currently navigating a challenging economic landscape as they face significantly higher prices for imported goods. Many popular dining establishments rely on ingredients, wines, and specialty items sourced from international markets to create their unique culinary experiences. However, global supply chain disruptions, increased shipping costs, and general inflation have driven up the expense of bringing these products to the city.\n\nThis rise in import prices means that the cost of doing business has increased for many Las Vegas eateries. To absorb these additional expenses, restaurants are implementing various strategies. Some are carefully reviewing their menus, opting to substitute certain imported ingredients with high-quality local alternatives when possible. Others are negotiating more aggressively with suppliers or exploring new international vendors to find better deals.\n\nAnother common adjustment is a modest increase in menu prices. Restaurant owners explain that this helps them cover the elevated costs without compromising the quality of their food or service. They are also focusing on operational efficiencies, such as managing inventory more tightly to reduce waste.\n\nLas Vegas is a highly competitive market, known for its diverse and high-end dining scene. Restaurants are striving to maintain their appeal to both tourists and local residents while ensuring their financial viability. These adjustments are crucial for the hospitality sector to continue thriving amidst evolving global economic pressures, allowing them to keep offering the diverse culinary options that the city is famous for.", "vocab": [{"word": "navigating", "definition": "finding a way to deal with a difficult situation."}, {"word": "economic landscape", "definition": "the current state of the economy."}, {"word": "imported goods", "definition": "products brought into one country from another."}, {"word": "supply chain disruptions", "definition": "problems that stop or slow down the process of making and delivering products."}, {"word": "inflation", "definition": "a general increase in prices and fall in the purchasing value of money."}, {"word": "implementing", "definition": "putting a decision or plan into effect."}, {"word": "operational efficiencies", "definition": "ways to make a business work better and save money."}]}, "Advanced": {"text": "The vibrant culinary scene of Las Vegas is currently grappling with a significant economic challenge: the escalating costs of imported goods. From exotic spices and premium seafood to fine wines and specialized kitchen equipment, many of the city's renowned dining establishments depend heavily on a global supply chain to deliver the diverse and high-quality experiences their patrons expect. Recent global economic shifts, including persistent supply chain disruptions, elevated shipping and logistics expenses, and a broader inflationary environment, have collectively pushed these import prices to unprecedented levels.\n\nFor Las Vegas restaurants, particularly those catering to a discerning clientele, absorbing these amplified costs presents a complex balancing act. Owners and executive chefs are compelled to re-evaluate their entire business model, seeking innovative solutions to maintain profitability without compromising the exceptional standards that define the city's hospitality sector. One primary strategy involves meticulous menu engineering, where dishes are analyzed for their cost-effectiveness and potential for ingredient substitution. This might entail sourcing high-quality domestic alternatives for certain items or adjusting portion sizes to manage food costs more effectively.\n\nFurthermore, procurement strategies are being refined. Restaurants are engaging in more aggressive negotiations with existing international suppliers, exploring new vendor relationships, and even considering direct import channels to bypass intermediary markups. Inventory management has become more critical, with a focus on just-in-time ordering and reduced waste to mitigate financial exposure to fluctuating prices.\n\nInevitably, some of these increased operational burdens are being passed on to consumers through measured menu price adjustments. However, in a market as competitive and luxury-oriented as Las Vegas, such decisions are made with careful consideration to avoid alienating a price-sensitive segment of the customer base while preserving the perception of value. The challenge lies in communicating these necessary adjustments transparently, ensuring patrons understand the underlying economic pressures.\n\nThe long-term implications for the Las Vegas dining landscape could involve a greater emphasis on local and regional sourcing, fostering stronger relationships with domestic producers. This strategic pivot not only addresses cost pressures but also aligns with growing consumer preferences for sustainability and traceability. Ultimately, the resilience and adaptability of Las Vegas restaurateurs will determine their ability to navigate these turbulent economic waters, continuing to offer the world-class culinary experiences that are a cornerstone of the city's appeal.", "vocab": [{"word": "grappling with", "definition": "struggling to deal with a difficult problem or situation."}, {"word": "escalating costs", "definition": "prices that are increasing rapidly."}, {"word": "discerning clientele", "definition": "customers who are knowledgeable and have high standards."}, {"word": "amplified costs", "definition": "increased or magnified expenses."}, {"word": "meticulous menu engineering", "definition": "the careful and detailed process of designing a restaurant menu to maximize profitability."}, {"word": "procurement strategies", "definition": "methods and plans for obtaining goods and services for a business."}, {"word": "mitigate financial exposure", "definition": "to reduce the risk of financial loss."}, {"word": "turbulent economic waters", "definition": "a period of instability and difficulty in the economy."}]}}, "questions": [{"q": "What is the main reason Las Vegas restaurants are adjusting their business practices?", "a": "They are facing higher prices for imported goods and ingredients."}, {"q": "Name two ways restaurants are trying to deal with these increased costs.", "a": "Restaurants are changing menus, finding local alternatives, increasing menu prices, negotiating with suppliers, and managing inventory more tightly."}], "id": "a676485c701", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPNGhTaXp4RlV4SHpZZUpBQ1dldWJaenRiVHlWN3BhUENpWFhSUTg0cVctY1ludzhkSThuLXJlSUlEMGhCay1XeVJIc0pvNjJ4REJuajVHdUNkMTdJcjhkR3l3U2IwTXNtS3N3aHBYb3FLVWVyUE5fTW9abEdOLUxoR2ZNTVU5NXFKbUhpd0JWM1llTFMzM0J2YXpFemU3VnJLclNOeGRYZ21GWnFvTE01Q09n?oc=5", "published": "2026-11-04T09:52:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "BOE Set to Raise Interest Rate Amid Global Trend", "excerpt": "The Bank of England is expected to increase its main interest rate, joining other central banks in a move to control rising prices.", "levels": {"Beginner": {"text": "The Bank of England (BOE) is planning to raise a key interest rate. This means it will cost more to borrow money. The BOE is like the main bank for the United Kingdom. Its job is to keep prices stable and help the economy.\n\nLately, prices for many things have been going up quickly. This is called inflation. When prices go up, your money buys less. The BOE wants to stop prices from rising too fast. By making borrowing money more expensive, people and businesses might spend less. When people spend less, the demand for goods and services can slow down, which can help stop prices from going up so fast.\n\nOther big banks in the world are also raising their interest rates. For example, central banks in the United States and Europe have already done this. The BOE is joining them to help control inflation not just in the UK, but also as part of a global effort. This decision is important for the UK economy. It will affect things like loans for houses, car payments, and business investments. The goal is to make sure money keeps its value.", "vocab": [{"word": "raise", "definition": "to make something higher."}, {"word": "interest rate", "definition": "the extra money you pay when you borrow money, or get when you save money."}, {"word": "borrow", "definition": "to take money from someone with the promise to pay it back."}, {"word": "stable", "definition": "not changing much; steady."}, {"word": "inflation", "definition": "when prices for goods and services go up over time."}, {"word": "economy", "definition": "the system of how money is made and used in a country."}]}, "Intermediate": {"text": "The Bank of England (BOE) is widely expected to increase its main interest rate, a move that would align it with other major central banks around the world. This decision is part of a broader strategy to combat rising inflation, which has been a significant concern for economies globally.\n\nA central bank's key interest rate influences the cost of borrowing money throughout the economy. When the BOE raises this rate, it typically makes it more expensive for commercial banks to borrow from the central bank. These higher costs are then passed on to consumers and businesses through increased rates on loans, mortgages, and credit cards. The intention behind this is to cool down spending. When borrowing becomes more expensive, people and companies tend to spend and invest less, which can reduce demand for goods and services. This reduction in demand can help to slow down the pace at which prices are increasing.\n\nInflation, the general rise in prices for goods and services, has reached multi-decade highs in many countries, including the United Kingdom. This erodes the purchasing power of money and can create economic uncertainty. The BOE's primary mandate is to maintain price stability, aiming for a specific inflation target, usually around 2%.\n\nCentral banks like the U.S. Federal Reserve and the European Central Bank have already implemented similar rate hikes to address their own inflationary pressures. By joining its peers, the BOE is participating in a coordinated global effort to bring inflation under control. While higher interest rates can help tame inflation, they also carry the risk of slowing economic growth, potentially leading to a recession if not managed carefully. The BOE's Monetary Policy Committee will weigh these factors when making its final decision.", "vocab": [{"word": "expected", "definition": "believed likely to happen."}, {"word": "align", "definition": "to put something in a straight line or in agreement with something else."}, {"word": "strategy", "definition": "a plan of action designed to achieve a long-term or overall aim."}, {"word": "combat", "definition": "to fight against something."}, {"word": "commercial banks", "definition": "regular banks that offer services to the public and businesses."}, {"word": "mandate", "definition": "an official order or instruction to do something."}, {"word": "recession", "definition": "a period of economic decline when trade and industrial activity are reduced."}]}, "Advanced": {"text": "The Bank of England (BOE) is poised to implement another increase in its benchmark interest rate, a move that would solidify its position alongside other leading global central banks in a concerted effort to curb persistent inflationary pressures. This anticipated decision underscores the BOE's commitment to its primary mandate of maintaining price stability amidst a challenging economic landscape.\n\nThe mechanism through which a central bank's policy rate impacts the broader economy is multifaceted. By raising its key rate, the BOE effectively increases the cost of borrowing for commercial banks. These institutions, in turn, typically pass on these elevated costs to consumers and businesses in the form of higher interest rates on a wide array of financial products, including mortgages, consumer loans, and corporate credit. The intended consequence is a deceleration of aggregate demand. As borrowing becomes more expensive, both households and firms are incentivized to reduce spending and investment, thereby alleviating demand-side inflationary pressures. This monetary tightening aims to bring the rate of price increases back towards the BOE's symmetrical 2% inflation target.\n\nThe current inflationary environment is complex, driven by a confluence of factors including robust post-pandemic demand, supply chain disruptions, and elevated energy prices, exacerbated by geopolitical events. Consumer price index (CPI) figures in the UK have soared to levels not seen in decades, significantly eroding household purchasing power and fostering economic uncertainty. The BOE, like its counterparts such as the U.S. Federal Reserve and the European Central Bank, has been actively engaged in a cycle of rate hikes to anchor inflation expectations and prevent a wage-price spiral.\n\nWhile the primary objective is to restore price stability, the BOE faces a delicate balancing act. Aggressive monetary tightening, though necessary to rein in inflation, carries the inherent risk of stifling economic growth, potentially tipping the economy into a recession. Policymakers must carefully assess the incoming economic data, including employment figures, retail sales, and manufacturing output, to gauge the appropriate pace and magnitude of further rate adjustments. The global synchronicity in monetary policy tightening reflects a shared concern among central bankers regarding the pervasive nature of inflation, yet it also amplifies the potential for a collective slowdown in global economic activity. The forthcoming decision by the Monetary Policy Committee will be closely scrutinized for signals regarding the BOE's forward guidance on future policy trajectory.", "vocab": [{"word": "poised", "definition": "ready or prepared for something."}, {"word": "benchmark interest rate", "definition": "a standard interest rate used by central banks to influence other rates in the economy."}, {"word": "concerted", "definition": "jointly arranged or carried out; coordinated."}, {"word": "curb", "definition": "to restrain or control something."}, {"word": "mandate", "definition": "an official order or instruction; a central bank's primary duty."}, {"word": "multifaceted", "definition": "having many different aspects or features."}, {"word": "deceleration", "definition": "a reduction in the speed or rate of something."}, {"word": "aggregate demand", "definition": "the total demand for goods and services in an economy at a given price level and in a given time period."}]}}, "questions": [{"q": "What is the main action the Bank of England is expected to take?", "a": "The Bank of England is expected to raise its key interest rate."}, {"q": "What is the primary reason central banks like the BOE raise interest rates?", "a": "They raise interest rates to combat inflation, which means to slow down the rate at which prices for goods and services are increasing."}], "id": "a1e1dbe7662", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMioAFBVV95cUxPSUhEZEpVdlkxUG5nVXB4SGZYRlFWMV9SZkVUNFdzM25uRk43UUY5NEVLWlJyUlZKOVdHYmNIVk5zcmZHY2tYNDJtaGtUREFSeEVxRmxoTDdhMVlDOGh0eGtiekpLY1phLWl3M0JRZHFYbGpNRFR1R2hMYnk2bEF4bHJsY1lVMlYxNFV5ZnNDSG1hUm43cU5xZzBoT0lia0o4?oc=5", "published": "2026-11-04T10:29:50+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "China Boosts Stock Market with $30 Billion Re-lending", "excerpt": "China's financial system is seeing a major influx of funds, with nearly $30 billion in applications for stock re-lending aimed at market stability.", "levels": {"Beginner": {"text": "China is taking steps to help its stock market. Recently, banks and other financial groups asked for a lot of money – almost $30 billion. This money is part of a special plan called \"re-lending.\"\n\nWhat is re-lending? It means the central bank lends money to other banks. These banks then lend that money to companies or investors. The goal is to make the stock market stronger and help the economy grow.\n\nChina's economy has been facing some challenges. So, the government wants to make sure businesses have enough money to work and expand. By giving this money, they hope more people will invest in stocks. This can make stock prices go up and help companies get more funds.\n\nThe nearly $30 billion in requests shows there is a big need for this help. It also shows that China is serious about supporting its financial markets. This move could bring more trust and activity to the market, helping China's economy become more stable.", "vocab": [{"word": "steps", "definition": "actions taken to achieve something."}, {"word": "special", "definition": "different from what is usual; not ordinary."}, {"word": "goal", "definition": "something you want to achieve."}, {"word": "challenges", "definition": "difficult situations or problems."}, {"word": "expand", "definition": "to become larger or make something larger."}, {"word": "stable", "definition": "not likely to change or fail; firm."}]}, "Intermediate": {"text": "China's financial authorities are implementing a significant measure to bolster the country's stock market. Applications for a special \"re-lending\" program have reached nearly $30 billion, indicating a strong demand for liquidity within the financial system. This initiative is designed to inject capital into the market and support economic stability.\n\nRe-lending is a monetary policy tool where the central bank, in China's case, the People's Bank of China (PBOC), provides funds to commercial banks. These commercial banks are then encouraged to lend this money onwards, often for specific purposes such as supporting small and medium-sized enterprises, agricultural businesses, or, as in this instance, boosting the stock market. The aim is to stimulate investment and improve market sentiment.\n\nChina's economy has been navigating a period of slower growth and challenges, including issues in its property sector and concerns about consumer spending. Against this backdrop, the government is keen to ensure that financial markets remain robust and contribute positively to overall economic health. By making substantial funds available through re-lending, authorities hope to increase investor confidence and encourage more active participation in the stock market.\n\nThe nearly $30 billion in applications underscores the scale of this effort and the perceived need for such support among financial institutions. It reflects a proactive approach by Beijing to mitigate potential risks and foster a more vibrant investment environment. This move is expected to provide a much-needed boost, helping companies access capital more easily and potentially leading to a more stable and growing stock market, which is crucial for China's broader economic recovery.", "vocab": [{"word": "authorities", "definition": "official groups or people who have the power to make decisions."}, {"word": "bolster", "definition": "to make something stronger or better; to support."}, {"word": "liquidity", "definition": "the availability of liquid assets to a market or company; ease of converting assets to cash."}, {"word": "initiative", "definition": "an important new plan or program."}, {"word": "stimulate", "definition": "to encourage something to grow, develop, or become active."}, {"word": "navigating", "definition": "to deal with a difficult or complicated situation successfully."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}]}, "Advanced": {"text": "China's financial landscape is witnessing a substantial intervention aimed at shoring up its equity markets, with applications for a specialized \"re-lending\" facility reportedly nearing $30 billion. This significant uptake underscores a concerted effort by Beijing to inject crucial liquidity into the financial system and bolster investor confidence amidst ongoing macroeconomic headwinds.\n\nThe re-lending mechanism is a key monetary policy instrument employed by the People's Bank of China (PBOC). Under this scheme, the central bank extends low-cost funds to commercial banks, which are then mandated or incentivized to channel these funds towards specific sectors or objectives. In this particular instance, the focus on stock re-lending suggests a direct intent to support the capital markets, potentially by enabling brokerages or investment firms to access cheaper funding for their operations, or by encouraging lending for stock-backed activities. The ultimate goal is to enhance market stability, stimulate trading activity, and facilitate corporate financing.\n\nThis policy comes at a critical juncture for the Chinese economy. The nation has been grappling with a protracted slowdown, marked by significant challenges in its vast property sector, persistent deflationary pressures, and subdued consumer spending. These factors have exerted downward pressure on corporate earnings and investor sentiment, leading to volatility in the stock markets. By deploying such a substantial re-lending program, authorities are signaling their commitment to counter these pressures and foster a more resilient financial environment.\n\nThe nearly $30 billion in applications highlights not only the scale of the government's commitment but also the perceived need for such capital injections within the financial sector. It represents a proactive measure to mitigate systemic risks and cultivate a more vibrant investment climate. Analysts suggest that while direct market interventions can provide temporary relief, the long-term efficacy of such measures hinges on addressing the underlying structural issues plaguing the economy. Nevertheless, this liquidity infusion is expected to provide a near-term boost, potentially stabilizing market valuations and providing companies with easier access to capital, which is vital for sustaining economic growth and navigating the current complexities. The move also reflects a broader strategy to ensure that financial markets play their role in supporting the real economy's recovery.", "vocab": [{"word": "intervention", "definition": "the act of becoming involved in a difficult situation to improve or prevent it from getting worse."}, {"word": "shoring up", "definition": "supporting or strengthening something that is weak or likely to fail."}, {"word": "equity markets", "definition": "financial markets where stocks are bought and sold; stock markets."}, {"word": "concerted", "definition": "jointly arranged or carried out; coordinated."}, {"word": "macroeconomic headwinds", "definition": "unfavorable economic conditions or trends that make growth more difficult on a large scale."}, {"word": "mandated", "definition": "given official authority to do something; required by law or official order."}, {"word": "protracted", "definition": "lasting for a long time or longer than expected or usual."}, {"word": "efficacy", "definition": "the ability to produce a desired or intended result."}]}}, "questions": [{"q": "How much money was applied for in China's stock re-lending program?", "a": "Nearly $30 billion was applied for in China's stock re-lending program."}, {"q": "What is the main goal of China's re-lending initiative for its stock market?", "a": "The main goal is to strengthen the stock market, inject liquidity, boost investor confidence, and support overall economic stability and growth."}], "id": "a6e91d3f3ac", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPWVdQSjJqMGpIeERfb1F1dFByNElNdGhObklvVngxejlNb0V4NXlFZ1EyTGRZbElicDNfX3pNR053VlVoYnZKLW82cE0xWVh4cVNWaE8yMWFaNEthMGdaa3hLMTdPLVJxRlNEbE52MXc3VjBFTzFmeEV5QzdVdjhxQ1d1bHFjYmJOQ1FpNTZlRy1DSmpGNVdtd21vV2xjN2pPWFlIYkpSbWNrWHNMeG9FVmVn?oc=5", "published": "2026-11-04T10:29:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Democrat Roy Cooper Wins North Carolina Senate Race", "excerpt": "Democrat Roy Cooper has secured a crucial U.S. Senate seat in North Carolina, marking an important victory for his party.", "levels": {"Beginner": {"text": "Roy Cooper, a Democrat, has won a big election in North Carolina. He will now be a U.S. Senator for the state. This means he will go to Washington D.C. to help make laws for the country.\n\nThe election was for an \"open seat.\" This means no one from either party was already holding it, so it was a new chance for someone to win. The Associated Press, a news group, said that Roy Cooper won the race.\n\nThis win is very good news for the Democratic Party. It helps their party get more seats in the U.S. Senate. When a party gets more seats, it has more power to pass laws and make decisions. North Carolina is an important state, and this victory shows many people voted for Mr. Cooper. He will now represent the people of North Carolina in the Senate.", "vocab": [{"word": "Democrat", "definition": "A member of the Democratic Party, one of the two main political parties in the U.S."}, {"word": "Senate", "definition": "One part of the U.S. government that makes laws. Senators represent their states."}, {"word": "seat", "definition": "A position or place in a government body, like the Senate."}, {"word": "election", "definition": "A time when people vote to choose their leaders."}, {"word": "party", "definition": "A group of people with similar ideas about how the government should work."}, {"word": "victory", "definition": "A win in a competition or election."}]}, "Intermediate": {"text": "Democrat Roy Cooper has successfully won the open U.S. Senate seat in North Carolina, a significant outcome that will impact the national political landscape. The Associated Press officially called the race, confirming Cooper's victory and providing the Democratic Party with a key gain in the Senate.\n\nAn \"open seat\" election occurs when the current officeholder does not seek re-election, meaning there is no incumbent running. This often makes such races highly competitive, as both major parties see an opportunity to claim the position. Cooper's win means the Democratic Party has flipped this seat, changing its political affiliation from what it might have been or securing it in a competitive state.\n\nThe U.S. Senate is one of two chambers in the U.S. Congress, responsible for creating and passing federal laws. Each state has two senators, who serve six-year terms. Gaining a Senate seat is crucial for a political party, as it contributes to their overall strength and ability to form a majority, which is essential for advancing their legislative agenda.\n\nNorth Carolina is often considered a swing state, meaning it can vote for either Democrats or Republicans in different elections. This makes Cooper's victory particularly noteworthy, highlighting the competitive nature of its electorate. His success will bolster the Democratic presence in Washington D.C. and could influence the balance of power within the Senate, affecting future policy debates and decisions.", "vocab": [{"word": "successfully", "definition": "Achieving a desired result or outcome."}, {"word": "significant", "definition": "Important or noteworthy."}, {"word": "outcome", "definition": "The way a situation ends; a result."}, {"word": "incumbent", "definition": "The person currently holding an office or position."}, {"word": "flipped", "definition": "To change the political control of a seat or district from one party to another."}, {"word": "crucial", "definition": "Extremely important or essential."}, {"word": "bolster", "definition": "To support or strengthen something."}]}, "Advanced": {"text": "Democrat Roy Cooper has clinched the open U.S. Senate seat in North Carolina, a pivotal victory that significantly reshapes the national political calculus. The Associated Press formally declared Cooper the winner, confirming a crucial 'flip' for the Democratic Party in a highly contested race.\n\nAn 'open seat' contest, by definition, lacks an incumbent, often leading to some of the most competitive and expensive electoral battles. With no established officeholder defending their position, both major parties invest heavily, viewing such races as prime opportunities to gain or retain influence. Cooper's triumph in North Carolina, a state frequently characterized as a key battleground, underscores the Democratic Party's capacity to mobilize its base and appeal to swing voters, thereby altering the partisan composition of the Senate.\n\nThe U.S. Senate, comprising 100 members with two from each state serving six-year terms, plays a critical role in the federal legislative process, including confirming presidential appointments and ratifying treaties. A shift in its partisan balance can have profound ramifications for the executive branch's agenda, judicial appointments, and the overall direction of national policy. Cooper's win not only adds another Democratic vote but also potentially narrows the path for the opposing party to achieve or maintain a governing majority, which is essential for controlling committee assignments and the legislative calendar.\n\nNorth Carolina's electoral dynamics are complex, often reflecting a blend of urban progressive strongholds and rural conservative areas. This makes any statewide victory particularly telling about broader political trends and voter sentiment. Cooper's success is a testament to effective campaign strategy and voter engagement in a state that has seen its political identity evolve. This outcome will undoubtedly be scrutinized by political analysts seeking to understand the evolving electoral map and the prospects for future legislative initiatives in Washington D.C. His presence in the Senate will contribute to the Democratic caucus's strength, potentially influencing key votes on critical issues ranging from economic policy to social reforms.", "vocab": [{"word": "clinched", "definition": "Successfully won or secured something, especially a victory or an agreement."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else; central."}, {"word": "calculus", "definition": "A particular method or system of calculation or reasoning, often used in a political or strategic context."}, {"word": "contested", "definition": "Disputed or challenged in an election or competition; highly competitive."}, {"word": "ramifications", "definition": "A complex or unwelcome consequence of an action or event, especially one that is not immediately obvious."}, {"word": "electoral dynamics", "definition": "The forces and patterns that influence voting behavior and election outcomes in a specific area or context."}, {"word": "caucus", "definition": "A meeting of the members of a legislative body who are members of a particular political party, to select candidates or decide policy."}, {"word": "scrutinized", "definition": "Examined or inspected closely and thoroughly."}]}}, "questions": [{"q": "Who won the U.S. Senate seat in North Carolina?", "a": "Democrat Roy Cooper won the U.S. Senate seat in North Carolina."}, {"q": "Which political party did this victory help?", "a": "This victory helped the Democratic Party."}], "id": "a4c675f3e78", "source": "NPR Topics: Politics", "link": "https://www.npr.org/2026/11/03/g-s1-150958/north-carolina-senate-results", "published": "2026-11-04T10:24:24+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "US Midterms: Suhas Subramanyam Re-elected to House from Virginia", "excerpt": "Suhas Subramanyam, an Indian-origin politician, has won re-election to the US House of Representatives from Virginia during the recent US midterm elections.", "levels": {"Beginner": {"text": "Suhas Subramanyam has won an election in the United States. He will continue to work in the US House of Representatives. This is a very important part of the US government. Mr. Subramanyam is from Virginia, a state in the USA. He is also of Indian origin. This means his family came from India.\n\nThe election he won was part of the \"midterm elections.\" These elections happen in the middle of a president's time in office. People vote for new members of Congress, like the House of Representatives. These members help make laws for the country.\n\nWinning re-election means that voters in Virginia chose Mr. Subramanyam again. He will keep his job and continue to represent the people of his area. His win shows that people from many different backgrounds can be leaders in the US government. It is important for all voices to be heard when making decisions for the country. He will help decide on new rules and spending for the nation.", "vocab": [{"word": "election", "definition": "a time when people choose their leaders by voting."}, {"word": "government", "definition": "the group of people who control a country or state."}, {"word": "state", "definition": "a part of a country, like Virginia in the USA."}, {"word": "origin", "definition": "where someone or something comes from."}, {"word": "midterm", "definition": "elections that happen in the middle of a president's term."}, {"word": "represent", "definition": "to speak or act for a group of people."}]}, "Intermediate": {"text": "Suhas Subramanyam, a politician of Indian origin, has successfully secured re-election to the U.S. House of Representatives. He will continue to serve the people of Virginia, a key state in the United States. This victory occurred during the recent U.S. midterm elections, which are significant events in American politics.\n\nThe U.S. House of Representatives is one of the two chambers that make up the U.S. Congress, responsible for creating and passing federal laws. Members of the House, like Mr. Subramanyam, represent specific districts within their states. His re-election means that the voters in his Virginia district have chosen him again to voice their concerns and interests in Washington D.C.\n\nMidterm elections are held approximately halfway through a president's four-year term. Unlike presidential elections, midterms focus on congressional seats, as well as some state and local offices. The results of these elections can significantly influence the political landscape, potentially shifting the balance of power in Congress. This, in turn, can affect the president's ability to pass legislation and implement their agenda.\n\nMr. Subramanyam's win highlights the increasing diversity within American political leadership. As an Indian-origin representative, his presence in Congress reflects the changing demographics of the United States and ensures that a broader range of perspectives contributes to national decision-making. His continued service will involve debating bills, voting on important issues, and overseeing the executive branch.", "vocab": [{"word": "secured", "definition": "successfully obtained or achieved something."}, {"word": "chambers", "definition": "the two main parts of a legislative body, like the U.S. Congress."}, {"word": "federal", "definition": "relating to the central government of a country, not just one state."}, {"word": "districts", "definition": "specific geographical areas represented by a politician."}, {"word": "political landscape", "definition": "the current state of politics and government."}, {"word": "demographics", "definition": "the statistical characteristics of human populations, like age, race, or origin."}, {"word": "executive branch", "definition": "the part of government responsible for carrying out laws (like the President)."}]}, "Advanced": {"text": "Suhas Subramanyam, a prominent politician of Indian origin, has successfully clinched re-election to the U.S. House of Representatives, affirming his mandate from the constituents of Virginia. This significant victory transpired during the recent U.S. midterm elections, pivotal contests that often recalibrate the national political trajectory.\n\nThe U.S. House of Representatives stands as one of the bicameral legislative bodies comprising the U.S. Congress, tasked with the formidable responsibility of drafting, debating, and enacting federal legislation. Representatives, such as Mr. Subramanyam, serve two-year terms and are directly accountable to the specific congressional districts they represent within their respective states. His re-election underscores the continued confidence of his Virginia electorate in his capacity to articulate their interests and advocate for their priorities on Capitol Hill.\n\nMidterm elections, typically held two years into a president's four-year term, serve as a crucial barometer of public sentiment regarding the incumbent administration and its policies. These elections are distinct from presidential contests, primarily focusing on all 435 seats in the House, approximately one-third of the Senate, and numerous state and local offices. The outcomes can profoundly reshape the legislative agenda, potentially altering the balance of power in Congress and thereby influencing the president's ability to advance their policy initiatives and nominations. A shift in congressional control can lead to legislative gridlock or, conversely, facilitate the passage of previously stalled reforms.\n\nMr. Subramanyam's continued tenure in Congress is emblematic of the increasing diversification of American political leadership. As a representative of Indian heritage, his presence contributes to a more inclusive legislative body that better reflects the multifaceted demographic tapestry of the United States. This growing representation ensures that a wider array of cultural perspectives and lived experiences informs the national discourse and policy formulation. His role will encompass rigorous legislative duties, including committee work, constituent services, and oversight of the executive branch, all while navigating the complex dynamics of contemporary American politics. His re-election reinforces the notion that diverse backgrounds are increasingly integral to the fabric of American governance.", "vocab": [{"word": "clinched", "definition": "successfully secured or won something definitively."}, {"word": "mandate", "definition": "the authority given by voters to an elected official to act on their behalf."}, {"word": "constituents", "definition": "the people who live in and vote in a particular area, represented by an elected official."}, {"word": "transpired", "definition": "occurred or happened."}, {"word": "recalibrate", "definition": "to adjust or reset something, often implying a change in direction or focus."}, {"word": "bicameral", "definition": "(of a legislative body) having two chambers or houses."}, {"word": d": "a206b431e90", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMimgFBVV95cUxPaHZHYjlBeEpNd3BiX01hTkxUdDJhUmJwMnU4Mkx6WndYWlpxZE9zUWJfekxLa1RXY3FUZ3ppenhrVGduZlhlUFB0TENnQzBPWWlVOTJJdkNsU3B0RUJmZUdoeFpuS1N5anVKeC1JUDc3VVUzcVdYd2FfUzU4SW5RdWdQTTY1UU9FNHF6QTRORjRQN05takJjbWVB?oc=5", "published": "2026-11-04T10:37:10+09:00", "category": "entertainment", "category_title": "Entertainment"}, {"headline": "Weta FX and TAICCA Partner for AI Screen Production in Asia", "excerpt": "New Zealand's Weta FX and Taiwan's TAICCA are joining forces to make Taiwan a leading center for AI-driven film and TV production in Asia.", "levels": {"Beginner": {"text": "Weta FX, a famous company from New Zealand, is working with TAICCA from Taiwan. Weta FX makes special effects for big movies like \"The Lord of the Rings\" and \"Avatar.\" TAICCA helps creative businesses in Taiwan.\n\nTogether, they want to make Taiwan an important place for making movies and TV shows using AI, which means Artificial Intelligence. This new partnership will help the film and TV industry in Asia.\n\nThe goal is for Taiwan to become a main center where people use new AI technology to create screen content. This means making films, TV series, and other digital videos. They hope to train people and develop new ways to use AI in making these shows.\n\nThe two groups will officially start their work on November 6th. This launch will happen at a big event in Taiwan called the Taiwan Creative Content Fest (TCCF). This is an exciting step for both companies and for Taiwan's creative future.", "vocab": [{"word": "famous", "definition": "known by many people"}, {"word": "special effects", "definition": "unusual images or sounds in a movie, often made by computers"}, {"word": "partnership", "definition": "when two or more groups work together"}, {"word": "Artificial Intelligence (AI)", "definition": "computer technology that can do things like humans, such as learning"}, {"word": "center", "definition": "a main place where a lot of activity happens"}, {"word": "officially", "definition": "in a formal and public way"}]}, "Intermediate": {"text": "Weta FX, the renowned visual effects company from New Zealand, is collaborating with the Taiwan Creative Content Agency (TAICCA). Weta FX is globally recognized for its groundbreaking work on blockbuster films such as \"The Lord of the Rings\" and \"Avatar,\" setting high standards in cinematic visual effects.\n\nTAICCA is a government-backed organization in Taiwan dedicated to promoting and developing the nation's creative content industries. Their joint initiative aims to transform Taiwan into a leading hub for AI-driven screen production across Asia.\n\nThis strategic partnership signifies a major step towards integrating advanced Artificial Intelligence technologies into the filmmaking process. The vision is to establish Taiwan as a key region where AI tools and techniques are developed and applied to create high-quality films, television series, and other digital media. This could involve AI in various stages, from pre-production planning and script analysis to post-production effects and animation.\n\nBy fostering an environment for AI innovation in screen production, the collaboration seeks to attract talent, encourage technological development, and boost Taiwan's position in the global creative economy. It also offers significant opportunities for Asian filmmakers to access cutting-edge AI resources and expertise.\n\nThe formal launch of this partnership is scheduled for November 6th at the Taiwan Creative Content Fest (TCCF), a prominent event showcasing Taiwan's creative industries. This event will mark the official beginning of their efforts to build a robust AI screen production ecosystem.", "vocab": [{"word": "renowned", "definition": "known and admired by many people for a special quality or achievement"}, {"word": "collaborating", "definition": "working together with another person or group to achieve something"}, {"word": "groundbreaking", "definition": "using new methods or making important new discoveries"}, {"word": "initiative", "definition": "an important new plan or process to achieve a particular aim or to solve a particular problem"}, {"word": "integrating", "definition": "combining two or more things so that they work together effectively"}, {"word": "hub", "definition": "a central and most important part of an area of activity"}, {"word": "ecosystem", "definition": "a complex network or interconnected system"}]}, "Advanced": {"text": "Weta FX, the New Zealand-based visual effects powerhouse celebrated for its pioneering contributions to cinematic artistry, is embarking on a strategic alliance with the Taiwan Creative Content Agency (TAICCA). Weta FX's indelible mark on blockbusters like \"The Lord of the Rings\" and \"Avatar\" has consistently pushed the boundaries of what's achievable in digital filmmaking, making them a formidable partner in this endeavor.\n\nTAICCA, a governmental entity established to invigorate and internationalize Taiwan's diverse creative content sectors, views this collaboration as a pivotal step in positioning the island nation at the vanguard of AI-driven screen production across the Asian continent. The partnership's overarching goal is to cultivate an advanced ecosystem in Taiwan where Artificial Intelligence is not merely integrated but fundamentally interwoven into every facet of screen content creation.\n\nThis ambitious initiative extends beyond simply utilizing existing AI tools; it aims to foster the development of bespoke AI technologies, cultivate a highly skilled workforce, and attract significant investment into Taiwan's burgeoning digital media landscape. The vision encompasses leveraging AI for sophisticated tasks such as procedural generation of environments, intelligent character animation, advanced script analysis, predictive analytics for audience engagement, and streamlining complex post-production workflows. By doing so, Taiwan seeks to offer unparalleled resources and expertise to both domestic and international filmmakers.\n\nTaiwan's robust technological infrastructure, coupled with its strategic geographical location and TAICCA's proactive governmental support for creative industries, provides a fertile ground for this venture. The collaboration is poised to become a catalyst for innovation, potentially reshaping how films and television series are conceived, produced, and consumed throughout Asia, and by extension, globally. It signifies a proactive approach to embracing the transformative potential of AI in an industry constantly seeking efficiency and creative expansion.\n\nThe formal inauguration of this consequential partnership is slated for November 6th, coinciding with the Taiwan Creative Content Fest (TCCF). This high-profile event will serve as a platform to unveil the specifics of their joint roadmap and underscore Taiwan's commitment to becoming a preeminent hub for future-forward screen production, solidifying its role as a key player in the global digital content arena.", "vocab": [{"word": "powerhouse", "definition": "a very powerful and influential organization or person"}, {"word": "pioneering", "definition": "involving new ideas or methods; being the first to do something important"}, {"word": "indelible", "definition": "making a mark that cannot be removed or forgotten; lasting"}, {"word": "invigorate", "definition": "to give new energy or strength to something"}, {"word": "vanguard", "definition": "the leading position in a trend or movement"}, {"word": "bespoke", "definition": "made to order for a particular customer or user"}, {"word": "catalyst", "definition": "a person or thing that precipitates an event or change"}, {"word": "preeminent", "definition": "surpassing all others; very distinguished in some way"}]}}, "questions": [{"q": "Which two organizations are partnering to make Taiwan an AI screen production hub?", "a": "Weta FX from New Zealand and the Taiwan Creative Content Agency (TAICCA) are partnering."}, {"q": "When and where will this new partnership be formally launched?", "a": "The partnership will be formally launched on November 6th at the Taiwan Creative Content Fest (TCCF)."}], "id": "a809630753f", "source": "Variety", "link": "https://variety.com/2026/film/markets-festivals/weta-fx-taicca-partner-taiwan-ai-screen-production-hub-1236938968/", "published": "2026-11-04T10:32:43+09:00", "category": "entertainment", "category_title": "Entertainment"}]};

  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
