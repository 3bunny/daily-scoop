<style>
:root{--paper:#f7f3ea;--ink:#1c1a17;--muted:#6b6358;--rule:#d8cfbf;--accent:#8a1f1f;--accent2:#2a3d54;--pill:#efe8da;--ok:#2e7d4f}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
  line-height:1.65;overflow-wrap:break-word;word-break:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent2)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 120px}
header.top{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px}
header.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;letter-spacing:.03em;margin:.1em 0;font-size:clamp(30px,8vw,50px)}
.tag{font-style:italic;color:var(--muted);font-size:14px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tab{flex:0 0 auto;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
  background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 10px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.viewtitle{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:22px 0 4px;color:var(--accent)}
.card{padding:18px 0;border-bottom:1px solid var(--rule)}
.card:last-child{border-bottom:none}
.cat-tag{display:inline-block;font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent2);background:var(--pill);border:1px solid var(--rule);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.3}
.card .src{font-family:Helvetica,Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.excerpt{margin:0 0 10px;font-size:16px;color:var(--ink)}
.more{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}
/* article view */
.crumb{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.art-h{font-family:'Playfair Display',Georgia,serif;font-size:26px;line-height:1.25;margin:0 0 6px}
.art-src{font-family:Helvetica,Arial,sans-serif;font-size:12px;color:var(--muted);margin-bottom:16px}
.levels{display:flex;gap:0;border:1px solid var(--rule);border-radius:24px;overflow:hidden;margin:0 0 18px;background:#fff}
.levels button{flex:1;font-family:Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;border:none;background:none;padding:9px 6px;cursor:pointer;color:var(--muted)}
.levels button.active{background:var(--accent2);color:#fff}
.panel{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:14px 16px;margin:0 0 18px}
.panel h4{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
dl.vocab{margin:0}
dl.vocab dt{font-weight:700;margin-top:9px}
dl.vocab dd{margin:2px 0 0;font-size:15.5px}
.article-body p{font-size:17px;margin:0 0 15px}
.q{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.q:first-child{border-top:none;padding-top:0;margin-top:0}
.q .qq{font-weight:700;font-size:16px;margin:0 0 6px}
.q details summary{cursor:pointer;color:var(--accent2);font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;list-style:none}
.q details summary::-webkit-details-marker{display:none}
.q details summary::before{content:"Show answer ▸"}
.q details[open] summary::before{content:"Answer ▾"}
.q details p{margin:6px 0 0;font-size:15.5px}
.srclink{display:inline-block;margin-top:6px;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700}
/* bottom bar */

<script>
const ED = {"built": "2026-07-09", "categories": [{"key": "business", "title": "Business", "articles": [{"headline": "Europe's Biggest Port Sued Over Climate Goals", "excerpt": "Europe's biggest port, Rotterdam, is being sued to accelerate its transition away from fossil fuels and become greener.", "levels": {"Beginner": {"text": "The Port of Rotterdam is a very big port in Europe. It is the biggest one. Many ships come and go from this port. They carry goods and fuel all over the world. This port is very important for trade.\n\nNow, some groups want the port to be \"greener.\" This means they want the port to use less fossil fuels. Fossil fuels are things like oil and gas. They make pollution and are bad for the Earth's climate. When we burn them, they release harmful gases.\n\nA group has started a lawsuit against the Port of Rotterdam. A lawsuit is when people go to court to ask for something. This group wants the port to change faster. They want it to stop working so much with companies that use fossil fuels. They believe the port should move more quickly to clean energy.\n\nThe port says it is already working to be greener. It wants to use more clean energy and reduce its environmental impact. But the groups say it is not fast enough. They want the port to do more, and do it quickly. This is a big challenge for the port. It needs to find new ways to power ships and port activities without harming the planet so much. This lawsuit adds more pressure on the port to make these changes happen sooner.", "vocab": [{"word": "Port", "definition": "A place where ships can load and unload goods."}, {"word": "Greener", "definition": "More friendly to the environment; causing less pollution."}, {"word": "Fossil fuels", "definition": "Natural fuels like coal, oil, or gas, formed from dead plants and animals."}, {"word": "Pollution", "definition": "Harmful things in the air, water, or land."}, {"word": "Lawsuit", "definition": "A case in a court of law involving a claim by one party against another."}, {"word": "Challenge", "definition": "A difficult task or problem."}]}, "Intermediate": {"text": "The Port of Rotterdam, recognized as Europe's largest port, is facing increasing pressure to accelerate its transition towards more sustainable operations. Environmental organizations have initiated a lawsuit, demanding that the port significantly reduce its dependence on fossil fuel companies and embrace greener practices more rapidly.\n\nThis legal action highlights a growing global concern about the environmental impact of major industrial hubs. Ports like Rotterdam are crucial gateways for international trade, but they also contribute to carbon emissions through shipping, logistics, and the handling of fossil fuels such as oil and gas. These fuels are a primary source of greenhouse gases, which are linked to climate change and global warming.\n\nThe lawsuit, filed by environmental groups, argues that the Port of Rotterdam's current plans to become carbon neutral are too slow. They contend that the port, as a major player in the global energy supply chain, has a responsibility to act more decisively in phasing out fossil fuel activities. The groups are pushing for concrete commitments and a faster timeline for the port to shift towards renewable energy sources and cleaner logistics.\n\nPort authorities have stated that they are already committed to sustainability and have various initiatives underway to reduce their environmental footprint. These include projects focused on providing shore power for ships, developing renewable energy generation within the port area, and promoting cleaner fuels. However, the plaintiffs in the lawsuit believe these efforts are insufficient given the urgency of the climate crisis. The outcome of this legal challenge could set a precedent for other major ports worldwide, influencing how quickly they adopt more environmentally friendly policies and adapt to global climate goals.", "vocab": [{"word": "Transition", "definition": "The process or a period of changing from one state or condition to another."}, {"word": "Sustainable", "definition": "Able to be maintained at a certain rate or level, often referring to environmental friendliness."}, {"word": "Initiated", "definition": "Began or started something, especially a formal process or action."}, {"word": "Dependence", "definition": "The state of relying on or being controlled by someone or something else."}, {"word": "Emissions", "definition": "The production and discharge of something, especially gas or radiation into the atmosphere."}, {"word": "Precedent", "definition": "An earlier event or action that is regarded as an example or guide to be considered in subsequent similar circumstances."}, {"word": "Insufficient", "definition": "Not enough; inadequate for a particular purpose."}]}, "Advanced": {"text": "The Port of Rotterdam, a colossal nexus of global trade and Europe's preeminent maritime gateway, finds itself at the epicenter of a burgeoning legal and environmental dispute. A coalition of environmental organizations has launched a significant lawsuit, compelling the port to drastically accelerate its divestment from fossil fuel operations and expedite its transition to a more sustainable, carbon-neutral future.\n\nThis legal challenge underscores the escalating global imperative to decarbonize industrial infrastructure, particularly those critical to international logistics and energy supply chains. As a pivotal hub for the transshipment and refining of oil and gas, Rotterdam's operations inherently contribute to substantial greenhouse gas emissions, exacerbating the climate crisis. The plaintiffs argue that despite the port's stated sustainability ambitions, its current trajectory is woefully inadequate to meet the urgent demands of climate action. They contend that the port's strategic plans do not reflect the necessary urgency to phase out its deep-seated reliance on fossil fuel firms and infrastructure.\n\nThe lawsuit seeks judicial intervention to mandate a more aggressive timeline for the port's green transformation. This includes demanding concrete, measurable steps towards integrating renewable energy sources, electrifying port operations, and fostering a supply chain that prioritizes cleaner fuels and sustainable shipping practices. The environmental groups assert that the port, given its immense economic leverage and strategic importance, bears a profound responsibility to lead in this global shift, rather than merely adapt incrementally.\n\nPort authorities, while acknowledging their commitment to environmental stewardship, maintain that they are already implementing a comprehensive suite of initiatives aimed at reducing their ecological footprint. These encompass pioneering projects in shore power for vessels, developing infrastructure for alternative fuels like hydrogen and ammonia, and investing in carbon capture technologies. However, the plaintiffs view these efforts as piecemeal and lacking the systemic overhaul required to align with the Paris Agreement's objectives. The outcome of this high-stakes litigation could establish a significant legal precedent, influencing regulatory frameworks and corporate responsibilities for major industrial complexes across Europe and beyond, compelling them to recalibrate their operational strategies in the face of mounting climate pressure. The case highlights the tension between economic imperatives and environmental exigencies in the modern global economy.", "vocab": [{"word": "Colossal", "definition": "Extremely large or great in size, extent, or degree."}, {"word": "Nexus", "definition": "A connection or series of connections linking two or more things; a central and most important point or place."}, {"word": "Preeminent", "definition": "Surpassing all others; very distinguished in some way, holding a superior position."}, {"word": "Divestment", "definition": "The action or process of selling off subsidiary business interests or investments, often for ethical or financial reasons."}, {"word": "Expedite", "definition": "To make an action or process happen sooner or be accomplished more quickly."}, {"word": "Imperative", "definition": "Of vital importance; crucial, or an urgent need or demand."}, {"word": "Exacerbating", "definition": "Making a problem, bad situation, or negative feeling worse."}, {"word": "Judicial intervention", "definition": "The act of a court or judge becoming involved in a matter to resolve a dispute or enforce a law."}]}}, "questions": [{"q": "What is the main reason environmental groups are suing the Port of Rotterdam?", "a": "They want the port to cut its dependence on fossil fuel firms and become greener faster."}, {"q": "What is the Port of Rotterdam's significance in Europe?", "a": "It is Europe's biggest port and a major hub for global trade."}], "id": "a860c5a021c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c39y78rwrmno?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:51+09:00", "category": "business"}, {"headline": "We saved £6,000 on holidays by swapping homes with strangers", "excerpt": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "levels": {"Beginner": {"text": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "vocab": []}, "Intermediate": {"text": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "vocab": []}, "Advanced": {"text": "The BBC looks at the growing trend of people swapping homes to cut holiday costs.", "vocab": []}}, "questions": [], "id": "ac1c018dc47", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ce8kkerxz74o?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:38+09:00", "category": "business"}, {"headline": "Political Figure's Influence on Virginia's Business Standing", "excerpt": "A recent report suggests that a prominent political figure is seen as a significant factor affecting Virginia's business appeal and ranking.", "levels": {"Beginner": {"text": "News reports say that a big political name is making it harder for Virginia to get good business rankings. Virginia wants to attract new companies and create jobs for its people. When a state has a good business ranking, it means many companies want to move there or start new businesses there. This brings money and work. However, some people think that the words and actions of a well-known political leader can make companies not want to come to Virginia. This can make the state's business environment seem less stable or welcoming to some investors. A newspaper article from The Washington Post talked about this idea. It suggests that the political climate, influenced by this leader, might be a challenge for Virginia's efforts to grow its economy. State leaders often work hard to show that their state is a great place for businesses to succeed, but political issues can sometimes make this job more difficult. They want to make sure Virginia is seen as a friendly place for all kinds of companies.", "vocab": [{"word": "ranking", "definition": "a position on a list, showing how good something is compared to others."}, {"word": "attract", "definition": "to make someone or something want to come to a place."}, {"word": "environment", "definition": "the conditions around a place or situation."}, {"word": "stable", "definition": "not likely to change or fall; steady."}, {"word": "investors", "definition": "people or companies who put money into a business to make more money."}]}, "Intermediate": {"text": "Virginia's efforts to maintain and improve its standing as a favorable state for businesses may be facing a unique challenge, according to recent reports. The Washington Post highlighted that a prominent national political figure is perceived by some as a significant 'drag' on Virginia's business ranking. This perspective suggests that the political climate, often shaped by the rhetoric and policies associated with such a figure, can influence how businesses view a state's appeal.\n\nStates like Virginia actively compete to attract new companies, foster job creation, and stimulate economic growth. A high business ranking typically reflects factors such as a skilled workforce, reasonable taxes, good infrastructure, and a predictable regulatory environment. However, political factors, including perceived instability or controversial national discourse, can sometimes overshadow these traditional advantages.\n\nFor companies considering relocation or expansion, the overall political atmosphere can be a crucial element in their decision-making process. Uncertainty about future policies, or a state's association with divisive national politics, might deter potential investors who prioritize a stable and welcoming business climate. While Virginia's state government often works to present a unified and attractive front to the business community, the influence of national political figures can complicate these efforts, potentially affecting the state's brand image and its ability to draw in diverse industries and talent. This ongoing discussion underscores the complex interplay between politics and economic development.", "vocab": [{"word": "favorable", "definition": "showing approval; positive or good for something."}, {"word": "prominent", "definition": "important and well-known."}, {"word": "rhetoric", "definition": "the art of effective or persuasive speaking or writing, often used to describe political speech."}, {"word": "stimulate", "definition": "to encourage something to grow, develop, or become more active."}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., buildings, roads, power supplies) needed for the operation of a society or enterprise."}, {"word": "deter", "definition": "to discourage someone from doing something, often by instilling doubt or fear."}]}, "Advanced": {"text": "Virginia's economic development strategy, focused on attracting investment and fostering job growth, is reportedly encountering headwinds from an unexpected quarter: the influence of a prominent national political figure. A recent analysis by The Washington Post suggests that this individual's presence and associated political discourse are perceived by some as a significant impediment to the Commonwealth's business ranking and overall appeal.\n\nStates meticulously cultivate their business environments, emphasizing attributes such as a skilled labor force, competitive tax structures, robust infrastructure, and a predictable regulatory framework. These elements are critical for securing high rankings in national business surveys, which in turn serve as powerful marketing tools for attracting corporate relocation and expansion. However, the contemporary political landscape introduces a layer of complexity, where national political figures and their rhetoric can cast a long shadow over state-level economic aspirations.\n\nFor corporations and investors, the decision to establish or expand operations in a particular state is multifaceted. Beyond traditional economic indicators, factors like political stability, social climate, and a state's perceived alignment with broader national values can play an increasingly pivotal role. When a state becomes closely associated with a polarizing national political figure, it can inadvertently create an environment of uncertainty or controversy that deters certain types of investment or talent. Businesses, particularly those with diverse workforces or global market exposure, often seek jurisdictions that project an image of inclusivity and stability.\n\nWhile Virginia's state leadership consistently endeavors to showcase the Commonwealth's unique advantages, the article implies that the national political narrative can complicate these efforts. It suggests that the 'brand' of Virginia, as a desirable business destination, might be indirectly impacted by the national political figure's public persona and policy positions, regardless of the state's independent economic policies. This dynamic highlights the evolving interplay between national politics, public perception, and regional economic competitiveness, underscoring how non-economic factors can significantly influence a state's attractiveness to the corporate world.", "vocab": [{"word": "headwinds", "definition": "a wind blowing from directly in front, hindering progress; metaphorically, circumstances or conditions that make progress difficult."}, {"word": "impediment", "definition": "a hindrance or obstruction in doing something; something that delays or blocks progress."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "attributes", "definition": "qualities or characteristics belonging to or inherent in someone or something."}, {"word": "robust", "definition": "strong and healthy; able to withstand or overcome adverse conditions."}, {"word": "multifaceted", "definition": "having many facets or aspects; complex and diverse."}, {"word": "polarizing", "definition": "dividing into two sharply contrasting groups or sets of opinions or beliefs."}, {"word": "inadvertently", "definition": "without intention; accidentally."}]}}, "questions": [{"q": "What is identified as a 'drag' on Virginia's business ranking?", "a": "A prominent national political figure and their associated political discourse are identified as a 'drag' on Virginia's business ranking."}, {"q": "Besides traditional economic factors, what other elements are mentioned as influencing a state's appeal to businesses?", "a": "Political stability, social climate, and a state's perceived alignment with broader national values are mentioned as other influencing elements."}], "id": "a58b5aa89f8", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxPUXJFdGh4N0tXeG5vUmlBWkNUSzBTZ2JHYXFjcWsyT2F2eWZWUHo4aTBtNnNVMHBDY0d6U2U2eVg1ZDVvSXp6VmwwSzhBMVQ1TV9UMmpmTjh5Nmx0eXJXbHNUWWFNelhmOTRMcEtSV0kzNmJ6eVdOMF9PdDZHb1duMzc1OGt6MWJpQXotY2VfT1ZUUnRsMkdlOW9OV0xsY3JKMHRCS3pzYmFydDN6LTVQTA?oc=5", "published": "2026-07-10T07:47:30+09:00", "category": "business"}, {"headline": "California Avocado Growers Seek Trade Changes After Women's Survey", "excerpt": "Avocado growers in Monterey County, California, are advocating for new trade policies following insights from a recent survey focused on women in agriculture.", "levels": {"Beginner": {"text": "Avocado farmers in Monterey County, California, want new rules for trade. Trade means buying and selling things between countries. These farmers grow avocados, a popular fruit. They want to sell more of their avocados. \n\nA special survey was done with women who work in farming. This survey helped show what changes are needed. The women farmers shared their ideas and problems. Now, the avocado growers are asking for help from the government. They want trade rules that are fair. \n\nMany avocados are sold in the United States. Some come from California, but many also come from other countries, like Mexico. California growers want to compete fairly. They believe new trade rules can help them grow their businesses and keep their farms strong. This is important for jobs and for getting fresh avocados to people.", "vocab": [{"word": "trade", "definition": "buying and selling things, especially between countries."}, {"word": "farmers", "definition": "people who grow crops or raise animals."}, {"word": "survey", "definition": "a set of questions asked to many people to get information."}, {"word": "compete", "definition": "to try to be better or more successful than others."}, {"word": "rules", "definition": "instructions that say how things must be done."}]}, "Intermediate": {"text": "Avocado growers in Monterey County, California, are actively pushing for significant changes to current trade policies. This effort comes after a recent survey specifically gathered insights from women involved in the agricultural sector in the region. The growers believe that revised trade regulations are essential to support the local avocado industry and ensure its long-term viability.\n\nCalifornia is a major producer of avocados in the United States, known for its high-quality fruit. However, its growers face considerable competition from imported avocados, particularly from Mexico, which is the world's largest exporter. These imports often come at lower prices, making it challenging for local farmers to compete effectively in the market. The cost of labor, water, and land in California is generally higher, adding to the pressure on domestic producers.\n\nThe survey of women in agriculture likely highlighted specific economic pressures, operational challenges, or market access issues that local growers experience due to existing trade agreements. Women play a vital role in many agricultural businesses, often managing finances, marketing, and labor, making their perspectives crucial for understanding the industry's needs.\n\nBy advocating for new trade policies, the Monterey County avocado growers aim to create a more level playing field. This could involve seeking adjustments to tariffs on imported goods, stricter import standards to ensure fair competition, or other measures designed to protect and promote domestic production. Their goal is to safeguard jobs, maintain the economic health of agricultural communities in regions like Monterey County, and ensure consumers continue to have access to locally grown produce. The collective voice of women farmers, amplified by the survey, is proving to be a key driver in this important push for policy reform.", "vocab": [{"word": "policies", "definition": "official rules or plans made by a government or organization."}, {"word": "viability", "definition": "the ability to work successfully or survive."}, {"word": "competition", "definition": "the situation in which people or businesses are trying to be more successful than others."}, {"word": "imported", "definition": "brought into one country from another for selling."}, {"word": "tariffs", "definition": "taxes placed on goods coming into a country."}, {"word": "advocating", "definition": "publicly supporting a particular cause or policy."}, {"word": "amplified", "definition": "made stronger, louder, or more noticeable."}]}, "Advanced": {"text": "In Monterey County, California, avocado growers are intensifying their efforts to advocate for substantial modifications to existing international trade policies. This concerted push is significantly informed by the findings of a recent survey that specifically engaged women stakeholders within the region's agricultural sector. The growers contend that a recalibration of trade regulations is imperative to bolster the domestic avocado industry and secure its enduring economic sustainability amidst global market dynamics.\n\nCalifornia has historically been a cornerstone of U.S. avocado production, renowned for its premium-quality fruit and innovative farming practices. Yet, the industry grapples with formidable competition from a surge of imported avocados, predominantly from Mexico, which commands a dominant share of the global export market. These foreign imports frequently benefit from lower production costs, often due to differing labor standards and less stringent environmental regulations, allowing them to enter the U.S. market at price points that severely undercut those of California-grown avocados. Domestic producers, conversely, face higher operational expenses, including escalating labor wages, complex water rights management, and premium land values, exacerbating their competitive disadvantage within the framework of existing trade agreements like the USMCA (United States-Mexico-Canada Agreement).\n\nThe comprehensive survey of women in agriculture served as a critical diagnostic tool, illuminating specific economic pressures, logistical hurdles, and market access impediments that local growers encounter. Women often occupy pivotal roles in agricultural enterprises, from financial management and marketing strategies to labor oversight and regulatory compliance. Their nuanced perspectives are therefore invaluable in formulating effective policy recommendations. The survey's insights are now being strategically leveraged by advocacy groups to articulate precise demands for policy reform, moving beyond general grievances to data-backed proposals.\n\nThe Monterey County avocado growers are not merely seeking protectionism but rather a more equitable trading environment that acknowledges the true cost of sustainable domestic production. Their advocacy encompasses a range of potential policy adjustments, such as the re-evaluation of tariffs on imported agricultural commodities, the implementation of more stringent phytosanitary or quality standards for imports to ensure fair competition, or the negotiation of trade agreements that better account for the unique economic realities of domestic producers. Such measures aim to mitigate the impact of unfair trade practices and ensure that California's commitment to high environmental and labor standards does not render its produce uncompetitive.\n\nThe overarching objective is to foster a level playing field that allows California's avocado industry to thrive, safeguarding thousands of jobs across the agricultural supply chain, preserving the economic vitality of agricultural communities in regions like Monterey County, and ensuring a resilient supply of locally sourced, high-quality produce for American consumers. The collective and articulate voice of women farmers, strategically amplified through the survey's findings, is proving to be an indispensable catalyst in this crucial drive for policy recalibration, highlighting the intersection of gender, agriculture, and international trade.", "vocab": [{"word": "intensifying", "definition": "becoming or making something more intense or stronger."}, {"word": "stakeholders", "definition": "people with an interest or concern in something, especially a business."}, {"word": "recalibration", "definition": "the process of adjusting or re-evaluating something to bring it back into alignment or to a more accurate state."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "exacerbating", "definition": "making a problem, bad situation, or negative feeling worse."}, {"word": "phytosanitary", "definition": "relating to the health of plants, especially with respect to the international transfer of plant diseases and pests."}, {"word": "equitable", "definition": "fair and impartial."}, {"word": "catalyst", "definition": "a person or thing that precipitates an event or change."}]}}, "questions": [{"q": "What kind of farmers in Monterey County, California, are pushing for trade changes?", "a": "Avocado farmers."}, {"q": "What specific group's survey findings are helping to inform the push for new trade policies?", "a": "Women involved in agriculture / women farmers."}], "id": "ad8de9cc945", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxPZzJvZklIUDlNc1VzYlp1azdrU21YRGhrTDF4RE93SXB0X2FJSUxPSEFzREFPM1ZVUjgtQWdQckdfM010cU83QkF3MmNENkV2Y0UtUnJid3RVTEt6WnE4OGo5Nlh2NHRFNlRxdVJIRG9ZTEtNV1lvaUFhM2p1YWNtWklyTms4aHQzVmlDeFBhZUV2MDI0aFhfOFgwV0lZa1E3QXFyUzRrclVMUGhVUlVGWU5BX0h4YU0tZ0luSFVJSURZQQ?oc=5", "published": "2026-07-10T07:47:00+09:00", "category": "business"}, {"headline": "The Fed's new task forces feature big names in business, from Marc Andreessen to Asha Sharma - Business Insider", "excerpt": "The Fed's new task forces feature big names in business, from Marc Andreessen to Asha Sharma Business Insider", "levels": {"Beginner": {"text": "The Fed's new task forces feature big names in business, from Marc Andreessen to Asha Sharma Business Insider", "vocab": []}, "Intermediate": {"text": "The Fed's new task forces feature big names in business, from Marc Andreessen to Asha Sharma Business Insider", "vocab": []}, "Advanced": {"text": "The Fed's new task forces feature big names in business, from Marc Andreessen to Asha Sharma Business Insider", "vocab": []}}, "questions": [], "id": "add1d892040", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMifkFVX3lxTFBQdUFZZVBYbl9tbDF1RVpuRkJnc2lXamZNQnR2RDh0d2ZZQ053SW5hTDlNZmM1OXZxNmtqbjBMLWF5TGpYdW1ZSVdIS3Q2cnNFTnZ4bkVfRjNEZ2FIZjRHelgtenVKMjB4ZGZubnFxRlRlYjR0VVdzZTFzNG5Fdw?oc=5", "published": "2026-07-10T07:43:29+09:00", "category": "business"}]}, {"key": "economics", "title": "Economics", "articles": [{"headline": "Pressure builds on Europe's biggest port to be greener", "excerpt": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "levels": {"Beginner": {"text": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "vocab": []}, "Intermediate": {"text": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "vocab": []}, "Advanced": {"text": "A lawsuit demands that the Port of Rotterdam moves faster to cut its dependence on fossil fuel firms.", "vocab": []}}, "questions": [], "id": "a860c5a021c", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c39y78rwrmno?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:51+09:00", "category": "economics"}, {"headline": "Home Swapping: A Smart Way to Save on Holidays", "excerpt": "Many people are now choosing to swap homes with strangers to enjoy affordable holidays and explore new places without high accommodation costs.", "levels": {"Beginner": {"text": "More and more people are finding a new way to go on holiday without spending too much money. They are swapping homes with other people. This means you stay in someone else's house for your holiday, and they stay in your house for theirs. It's like a big exchange.\n\nThe BBC News talked about this growing idea. People can save a lot of money, sometimes thousands of pounds, because they don't have to pay for a hotel or a rented flat. Instead, their place to stay is free. This makes holidays much cheaper.\n\nWhen you swap homes, you get to live like a local person. You can cook your own food and feel comfortable, just like in your own house. It's a fun and easy way to see new places. This trend is becoming popular because it helps families and friends travel more often. It's a smart choice for holidays.", "vocab": [{"word": "swap", "definition": "to give something and get something else in return."}, {"word": "holiday", "definition": "a time when you do not have to work or go to school, and can relax or travel."}, {"word": "save", "definition": "to keep money so that you can use it later, especially to buy something."}, {"word": "cost", "definition": "the amount of money needed to buy, do, or get something."}, {"word": "trend", "definition": "a general direction in which something is developing or changing."}, {"word": "comfortable", "definition": "feeling physically relaxed and free from pain."}]}, "Intermediate": {"text": "A growing number of travelers are discovering an innovative approach to vacationing: home swapping. This trend involves individuals or families exchanging their residences for a period, allowing them to enjoy holidays in new locations without the significant expense of hotels or rental properties. The BBC has highlighted this practice, noting its increasing popularity as a cost-effective travel solution that is gaining traction globally.\n\nThe core appeal of home swapping lies in its substantial financial benefits. By completely eliminating accommodation costs, travelers can achieve significant savings, often amounting to thousands of pounds or dollars per trip. These savings can then be allocated to other aspects of their holiday, such as activities, dining, or extended stays, making travel more accessible and frequent for many families and individuals. This economic advantage is particularly attractive in times of rising living costs.\n\nBeyond the financial advantages, home exchange offers a unique and authentic travel experience. Guests stay in a real home, often fully equipped with all the amenities of daily life, from kitchens to comfortable living spaces. This allows for a more immersive experience, enabling travelers to live like locals, shop at neighborhood markets, and explore areas beyond typical tourist zones. It provides a sense of comfort and familiarity that a hotel often cannot. Online platforms specifically designed for home exchange facilitate these arrangements, providing tools for matching homes, setting clear agreements, and building trust through detailed profiles, reviews, and secure messaging systems. While the idea of swapping homes with strangers might seem daunting to some, the structured nature of these platforms helps mitigate risks and fosters a community of like-minded travelers seeking genuine and affordable adventures. This method is transforming how many people plan and enjoy their getaways, offering both economic relief and enriching experiences.", "vocab": [{"word": "innovative", "definition": "introducing new ideas, methods, or ways of doing something."}, {"word": "significant", "definition": "important, large, or noticeable."}, {"word": "accommodation", "definition": "a place to live or stay, especially on holiday or for study."}, {"word": "authentic", "definition": "real, true, or genuine; not fake."}, {"word": "immersive", "definition": "providing a feeling of being completely involved in something."}, {"word": "facilitate", "definition": "to make an action or process easier."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}]}, "Advanced": {"text": "The burgeoning trend of home swapping is revolutionizing the travel industry, offering a compelling alternative to traditional holiday accommodation. As highlighted by BBC News, an increasing number of individuals and families are embracing the concept of exchanging residences, enabling them to explore diverse destinations without the prohibitive costs associated with hotels or short-term rentals. This practice is gaining unprecedented traction globally, driven by a confluence of economic pressures and a desire for more authentic and sustainable travel experiences.\n\nAt its heart, home exchange is a testament to financial prudence. By circumventing the need to pay for lodging, travelers can realize substantial savings, often amounting to thousands of currency units per trip. These considerable financial dividends can then be strategically reallocated towards enriching cultural activities, gourmet dining, or extending the duration of their sojourns. This economic advantage is particularly pertinent in an era of escalating living expenses and discretionary spending constraints, making international and domestic travel more attainable for a broader demographic.\n\nBeyond the fiscal benefits, home swapping offers a profound experiential dimension. Unlike the standardized offerings of hotels, staying in a private residence provides a unique window into local life. Guests are afforded the opportunity for genuine cultural immersion, living within a community, utilizing local amenities, and discovering hidden gems far removed from typical tourist trails. The comfort and familiarity of a fully equipped home – complete with kitchens, living areas, and often gardens – foster a sense of belonging and flexibility that is rarely found in commercial lodging. This allows for a more relaxed pace of travel, catering to families, remote workers, and those seeking a deeper connection with their temporary surroundings.\n\nThe operational framework for these exchanges has evolved significantly, moving from informal agreements to sophisticated online platforms. These dedicated websites and apps streamline the matching process, allowing users to create detailed profiles, specify their preferences, and browse a global inventory of homes. Crucially, these platforms incorporate robust mechanisms to foster trust and security, including comprehensive review systems, identity verification, and standardized exchange agreements. While the initial notion of entrusting one's home to a stranger might seem daunting, the established communities and protocols within these platforms effectively mitigate potential risks, cultivating a network of discerning travelers committed to mutual respect and shared experiences. This innovative model not only democratizes travel but also champions a more sustainable and community-oriented approach to exploring the world.", "vocab": [{"word": "burgeoning", "definition": "rapidly growing or developing; flourishing."}, {"word": "compelling", "definition": "powerfully evoking interest, attention, or admiration; irresistible."}, {"word": "prohibitive", "definition": "(especially of costs) so high as to prevent or deter most people from doing something."}, {"word": "unprecedented", "definition": "never having happened or existed before; without previous instance."}, {"word": "confluence", "definition": "a coming together of two or more things, typically ideas, events, or circumstances."}, {"word": "financial prudence", "definition": "the wise and careful management of money and resources."}, {"word": "cultural immersion", "definition": "the deep engagement with and absorption into a different culture, often by living within it."}, {"word": "discerning", "definition": "having or showing good judgment and understanding; perceptive."}]}}, "questions": [{"q": "What is the primary benefit of home swapping for holidays?", "a": "The primary benefit of home swapping is saving a significant amount of money on accommodation costs, as travelers do not have to pay for hotels or rental properties."}, {"q": "Besides saving money, what other advantages does home swapping offer to travelers?", "a": "Beyond financial savings, home swapping offers an authentic and immersive travel experience, allowing travelers to live like locals, enjoy the comfort of a fully equipped home, and explore areas beyond typical tourist spots."}], "id": "ac1c018dc47", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/ce8kkerxz74o?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:00:38+09:00", "category": "economics"}, {"headline": "Fed chief taps Trump ally Marc Andreessen to advise on how AI reshapes work - The Washington Post", "excerpt": "Fed chief taps Trump ally Marc Andreessen to advise on how AI reshapes work The Washington Post", "levels": {"Beginner": {"text": "Fed chief taps Trump ally Marc Andreessen to advise on how AI reshapes work The Washington Post", "vocab": []}, "Intermediate": {"text": "Fed chief taps Trump ally Marc Andreessen to advise on how AI reshapes work The Washington Post", "vocab": []}, "Advanced": {"text": "Fed chief taps Trump ally Marc Andreessen to advise on how AI reshapes work The Washington Post", "vocab": []}}, "questions": [], "id": "aa7d29d1539", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiswFBVV95cUxOaEJvR2pQT3YyWkdHQnNwRWZrcmJzZExBVFpwcXBJRldwM0JZdm42S3VKbkhfVWNwUGxjRXBqbmtWRW56T3VFOWEtc1dOVGJYbmNvc0NsMFdWUUtncE4xU2xLUW9iRmhTbUFBYlNkWmp2MWZ3TnpkeTlteFUxYnlTRWQ4UlNsVE1RUXc1MlB0SlR1U1FVWkRkLUNMNXZnaTNhQmYxZXctM2xOWFJWUzlDMVBQOA?oc=5", "published": "2026-07-10T07:45:21+09:00", "category": "economics"}, {"headline": "Andreessen, Chetty among leaders of Fed's new task forces evaluating operations - The Washington Post", "excerpt": "Andreessen, Chetty among leaders of Fed's new task forces evaluating operations The Washington Post", "levels": {"Beginner": {"text": "Andreessen, Chetty among leaders of Fed's new task forces evaluating operations The Washington Post", "vocab": []}, "Intermediate": {"text": "Andreessen, Chetty among leaders of Fed's new task forces evaluating operations The Washington Post", "vocab": []}, "Advanced": {"text": "Andreessen, Chetty among leaders of Fed's new task forces evaluating operations The Washington Post", "vocab": []}}, "questions": [], "id": "a31b1fc5d9d", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxPOVE2VElad254QzBJSjFrQXpld0N2RklHbXJQMGRpeHJCalUtaEc5ZExIWFNTUDJJNDlvZGp3azdCa1N6dExZWk1NYjdjLVJ2S192M3k0dUhtN0FyN0QyUEVLRFFRaDBvM09uRkRqaExGMnhYd3l3MVg1U3R6OUw0WjBFeEhsNEdQUmVWOVpZOGtzeUNKTkw1WTA0UzZqMDY0VHRWRkJLQXhPTnV1QUxoNDJyYjJOR1JrYXI1elBXbXJUSThSWTZidnBZc1Y4VmlfZ0FIOUxMUFc5U3M?oc=5", "published": "2026-07-10T07:27:31+09:00", "category": "economics"}, {"headline": "Fed Appoints Tech and Retail Leaders to Economic Task Forces", "excerpt": "The U.S. Federal Reserve has named prominent figures Marc Andreessen and Doug McMillon to new task forces aimed at advising on key economic issues.", "levels": {"Beginner": {"text": "The Federal Reserve, often called the Fed, is very important for the U.S. economy. It helps manage money and prices in the country. Now, the Fed has created new groups called \"task forces.\" These groups will help the Fed understand the economy better and make good decisions.\n\nTwo well-known people have joined these task forces. One is Marc Andreessen. He is famous for technology and investing in new companies. The other is Doug McMillon. He used to be the leader of Walmart, a very big store. These two people bring different kinds of experience.\n\nKevin Warsh, who used to work at the Fed, is leading these new groups. The task forces will give advice on important economic topics. This move helps the Fed get new ideas from people outside the government. Their goal is to help the U.S. economy stay strong and stable for everyone.", "vocab": [{"word": "economy", "definition": "The system of how money is made and used in a country."}, {"word": "task forces", "definition": "Small groups of people formed to study a specific problem and suggest solutions."}, {"word": "investing", "definition": "Putting money into something, like a company, to make more money."}, {"word": "leader", "definition": "A person who guides or directs a group or organization."}, {"word": "advice", "definition": "Suggestions about what someone should do."}, {"word": "stable", "definition": "Not likely to change or fail; steady."}]}, "Intermediate": {"text": "The U.S. Federal Reserve, the country's central bank, plays a crucial role in managing the nation's monetary policy, aiming for stable prices and maximum employment. To enhance its understanding of complex economic challenges, the Fed has established new advisory task forces.\n\nThese task forces will benefit from the expertise of two highly prominent figures from the private sector: Marc Andreessen and Doug McMillon. Marc Andreessen is a renowned venture capitalist and co-founder of Netscape, known for his deep insights into technology and innovation. Doug McMillon previously served as the CEO of Walmart, the world's largest retailer, bringing extensive experience from the consumer and retail sectors.\n\nKevin Warsh, a former Federal Reserve governor, has been appointed to lead these important groups. The primary objective of these task forces is to provide external perspectives and fresh ideas on various economic issues, such as inflation, economic growth, and the impact of technological advancements. By incorporating diverse viewpoints from leaders in technology and retail, the Fed hopes to gain a more comprehensive understanding of the real-world economy.\n\nThis initiative reflects the Fed's commitment to gathering broad expertise to inform its policy decisions, ensuring it can effectively navigate the evolving economic landscape and support the long-term health and stability of the U.S. economy.", "vocab": [{"word": "monetary policy", "definition": "Actions taken by a central bank to control the money supply and interest rates to influence the economy."}, {"word": "crucial", "definition": "Extremely important or necessary."}, {"word": "venture capitalist", "definition": "A person or company that invests in new businesses, especially those with high growth potential."}, {"word": "prominent", "definition": "Important and well-known."}, {"word": "external perspectives", "definition": "Ideas and viewpoints from people or groups outside the main organization."}, {"word": "comprehensive", "definition": "Including all or nearly all elements or aspects of something."}, {"word": "evolving", "definition": "Developing gradually, especially from a simple to a more complex form."}]}, "Advanced": {"text": "The Federal Reserve, the United States' preeminent central bank, is tasked with a dual mandate: fostering maximum employment and maintaining price stability. In an era marked by unprecedented economic shifts, including post-pandemic inflation, supply chain disruptions, and rapid technological advancement, the Fed is proactively seeking diverse insights to inform its complex monetary policy decisions. To this end, it has established new advisory task forces, drawing expertise from outside its traditional economic circles.\n\nTwo highly influential figures from the private sector have been appointed to these critical groups: Marc Andreessen and Doug McMillon. Andreessen, a legendary figure in Silicon Valley, is a co-founder of Netscape and a founding partner at Andreessen Horowitz, a prominent venture capital firm. His deep understanding of technological innovation, digital transformation, and the startup ecosystem offers invaluable perspectives on how these forces are reshaping labor markets, productivity, and economic growth. McMillon, who recently stepped down as the CEO of Walmart, brings unparalleled experience from the retail behemoth, having navigated global supply chains, consumer behavior shifts, and labor dynamics on a massive scale. His insights into Main Street economics and operational realities are particularly pertinent in understanding inflation's impact and consumer resilience.\n\nThese task forces will be led by Kevin Warsh, a former Federal Reserve governor and a respected voice in macroeconomic policy. Warsh's previous tenure at the Fed and his subsequent work in academia and finance position him well to synthesize the diverse viewpoints offered by these private sector leaders. The initiative underscores the Fed's recognition that traditional economic models may not fully capture the nuances of today's economy, particularly the rapid pace of innovation and its structural implications.\n\nBy integrating these external perspectives, the Fed aims to enrich its understanding of contemporary economic challenges, from the drivers of persistent inflation to the future of work and the impact of digital currencies. This strategic move is designed to ensure that the central bank's policy frameworks are robust, adaptable, and well-informed by real-world business and technological developments, ultimately bolstering the long-term stability and prosperity of the U.S. economy.", "vocab": [{"word": "preeminent", "definition": "Surpassing all others; very distinguished in some way."}, {"word": "dual mandate", "definition": "A situation where an organization, especially a central bank, has two primary goals or responsibilities, such as maximum employment and price stability."}, {"word": "unprecedented", "definition": "Never done or known before; unparalleled."}, {"word": "venture capital", "definition": "Capital invested in a project in which there is a substantial element of risk, typically a new or expanding business."}, {"word": "behemoth", "definition": "A thing of monstrous size or power."}, {"word": "macroeconomic", "definition": "Relating to the branch of economics concerned with large-scale or general economic factors, such as interest rates and national productivity."}, {"word": "structural implications", "definition": "The long-term, fundamental effects or consequences that change the basic way something is organized or operates."}, {"word": "bolstering", "definition": "Supporting or strengthening something."}]}}, "questions": [{"q": "Who are the two prominent individuals appointed to the Fed's new task forces?", "a": "Marc Andreessen and Doug McMillon."}, {"q": "What is the main purpose of these task forces, and what kind of expertise are they expected to bring?", "a": "The task forces are formed to advise the Federal Reserve on economic issues. They are expected to bring diverse perspectives from the private sector, specifically from technology/venture capital and retail, to help inform the Fed's policy decisions."}], "id": "a8b09866522", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilwFBVV95cUxPMmItTjJST0ZOck9HYXB1aTZwakRMYm1la2J6aGZIUTJjZXVDcERHRWRkYUsxTEd4OURxdzRIcHJfQ0pTQTY3N2dMUHhEczlFMlBjMkw1UEVZNzZuUmJkN1FyMEwtcE1kN0JFS1M0UWJlTHhmUkhqMjQwSEpjSnp5SmVRQ1NmOURCRHM1WGRqR0Y5Q3YwWnVj?oc=5", "published": "2026-07-10T07:23:00+09:00", "category": "economics"}]}, {"key": "politics", "title": "Politics", "articles": [{"headline": "US and Iran Exchange Strikes Amidst Regional Tensions", "excerpt": "The United States and Iran have recently exchanged military strikes, leading to casualties and increasing regional tensions.", "levels": {"Beginner": {"text": "The United States and Iran have been involved in recent attacks. The US military, through a group called Centcom, said it hit many targets. These targets were linked to Iran. Centcom stated it attacked 90 different places. These attacks happened in the Middle East.\n\nSadly, these events have caused people to die. Iran's health ministry reported that 14 people have been killed. These deaths happened since Tuesday. This shows that the situation between the US and Iran is difficult. Both sides have taken action. The US says its attacks are a response to earlier actions. These actions make the region more tense. People are worried about what might happen next. It is important for countries to talk and find peaceful ways to solve problems. This news highlights the ongoing challenges in the area.", "vocab": [{"word": "attacks", "definition": "acts of violence or fighting."}, {"word": "targets", "definition": "places or things chosen to be hit or attacked."}, {"word": "killed", "definition": "caused someone to die."}, {"word": "military", "definition": "the armed forces of a country."}, {"word": "tensions", "definition": "feelings of anger or worry between people or countries."}, {"word": "region", "definition": "a large area of a country or the world."}]}, "Intermediate": {"text": "The United States and Iran have recently engaged in a series of military strikes, escalating tensions in the Middle East. The U.S. Central Command (CENTCOM) announced that its forces conducted retaliatory strikes against 90 targets linked to Iran. These targets were reportedly associated with Iran's Islamic Revolutionary Guard Corps (IRGC) and its affiliated militia groups. The strikes aimed at facilities used for command and control, intelligence, missile and drone storage, and logistics.\n\nThese actions by the U.S. come in response to recent attacks on U.S. personnel in the region. Meanwhile, Iran's health ministry has reported a tragic outcome, stating that 14 people have been killed since Tuesday due to these ongoing hostilities. The exact locations of these casualties were not specified in the initial reports, but they underscore the human cost of the escalating conflict.\n\nThe situation reflects a dangerous cycle of action and reaction between Washington and Tehran. The U.S. maintains that its strikes are defensive, intended to deter further aggression and protect its forces. However, Iran views such actions as a violation of sovereignty and a threat to regional stability. International observers are closely monitoring the developments, expressing concerns that the tit-for-tat exchanges could further destabilize an already volatile region. The continued exchange of strikes highlights the deep-seated animosity and the complex geopolitical challenges facing the Middle East.", "vocab": [{"word": "engaged", "definition": "involved in an activity."}, {"word": "retaliatory", "definition": "done as a response to an attack or injury."}, {"word": "affiliated", "definition": "officially attached or connected to an organization."}, {"word": "casualties", "definition": "people killed or injured in a war or accident."}, {"word": "escalating", "definition": "increasing rapidly in intensity."}, {"word": "deter", "definition": "discourage someone from doing something by instilling doubt or fear."}, {"word": "volatile", "definition": "likely to change rapidly and unpredictably, especially for the worse."}]}, "Advanced": {"text": "The geopolitical landscape of the Middle East has been further destabilized by a recent surge in military exchanges between the United States and Iran, marking a significant escalation of long-standing tensions. The U.S. Central Command (CENTCOM) confirmed it executed a substantial series of retaliatory strikes, targeting approximately 90 sites associated with Iran's Islamic Revolutionary Guard Corps (IRGC) and its various proxy militia groups across the region. These precision strikes reportedly hit command and control centers, intelligence facilities, missile and drone storage depots, and logistical infrastructure, all critical components supporting the operational capabilities of these Iranian-backed entities.\n\nThese robust U.S. actions were undertaken in direct response to a recent deadly drone attack on a U.S. military outpost, which resulted in the deaths of American service members. Washington has consistently stated its intent to protect its personnel and assets in the region, viewing these strikes as a necessary measure to re-establish deterrence and prevent further aggression. Conversely, the Iranian Health Ministry has issued a grim report, confirming that 14 individuals have been killed since Tuesday amidst these heightened hostilities. While the specific locations and circumstances of these fatalities remain somewhat ambiguous in initial reports, they undeniably underscore the tragic human cost inherent in this ongoing cycle of violence.\n\nThe timing of these intensified exchanges coincides with a period of heightened regional sensitivity, including significant internal events within Iran. Analysts suggest that both sides are navigating a precarious balance, aiming to project strength and resolve without inadvertently triggering a broader, unmanageable conflict. The intricate web of alliances and rivalries in the Middle East means that such direct confrontations carry substantial risks of wider regional ramifications, potentially drawing in other state and non-state actors. Diplomatic efforts, though often fraught, are seen as crucial to de-escalate the situation and prevent a full-scale conflagration. The persistent belligerent posturing from both Washington and Tehran continues to fuel concerns among international observers about the long-term stability of an already volatile and strategically vital part of the world.", "vocab": [{"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "retaliatory", "definition": "characterized by an act of returning an injury or wrong."}, {"word": "proxy", "definition": "a person or entity authorized to act on behalf of another; in this context, groups supported by a state to fight its battles indirectly."}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., buildings, roads, power supplies) needed for the operation of a society or enterprise."}, {"word": "deterrence", "definition": "the action of discouraging an action or event through instilling doubt or fear of the consequences."}, {"word": "ramifications", "definition": "a complex or unwelcome consequence of an action or event."}, {"word": "belligerent", "definition": "hostile and aggressive; showing a readiness to fight."}, {"word": "conflagration", "definition": "an extensive and destructive fire; used metaphorically for a large-scale conflict."}]}}, "questions": [{"q": "What U.S. military command stated it hit 90 targets?", "a": "The U.S. Central Command (CENTCOM) reported hitting 90 targets."}, {"q": "How many people did Iran's health ministry report were killed since Tuesday?", "a": "Iran's health ministry reported that 14 people were killed since Tuesday."}], "id": "afdcbbff025", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cz75zjj5wp8o?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T08:02:18+09:00", "category": "politics"}, {"headline": "How an app in South Korea will let victims track their stalkers", "excerpt": "Officials say the app will help stalking victims, but some experts question the impact it might have.", "levels": {"Beginner": {"text": "Officials say the app will help stalking victims, but some experts question the impact it might have.", "vocab": []}, "Intermediate": {"text": "Officials say the app will help stalking victims, but some experts question the impact it might have.", "vocab": []}, "Advanced": {"text": "Officials say the app will help stalking victims, but some experts question the impact it might have.", "vocab": []}}, "questions": [], "id": "afc3031e6a5", "source": "BBC News", "link": "https://www.bbc.co.uk/news/videos/c2dyw4zygrko?at_medium=RSS&at_campaign=rss", "published": "2026-07-10T07:09:57+09:00"
