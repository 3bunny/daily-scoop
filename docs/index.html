wns something."}, {"word": "community", "definition": "the people living in one particular area or town."}, {"word": "benefits", "definition": "advantages or good things that something gives you."}, {"word": "tips", "definition": "small pieces of practical advice."}, {"word": "succeed", "definition": "to achieve something that you have been trying to do."}]}, "Intermediate": {"text": "A special event is being organized for small business owners in the local community, as reported by ABC Columbia. This gathering provides a valuable opportunity for entrepreneurs to connect, share insights, and access resources designed to foster growth and success within their ventures.\n\nSmall businesses are often considered the backbone of local economies. They contribute significantly by creating jobs, offering unique goods and services, and fostering a distinct local character that makes a community appealing. When these businesses thrive, the entire community experiences positive effects, including increased employment, a broader tax base, and a more vibrant marketplace. Supporting them is crucial for sustained economic health.\n\nThe upcoming event is expected to feature various activities aimed at supporting these vital enterprises. Attendees will likely have the chance to network with fellow business owners, allowing for the exchange of experiences and the formation of potential collaborations. Such interactions can lead to new ideas, partnerships, and a stronger local business ecosystem, helping businesses overcome common challenges.\n\nFurthermore, the event will probably offer educational sessions or workshops. These sessions often cover key topics relevant to small business operations, such as effective marketing strategies, sound financial management, enhancing customer engagement, and adapting to new technologies. Experts and local leaders might be present to offer guidance and answer questions, providing practical advice that can be directly applied to their businesses for immediate improvement.\n\nBy providing a platform for learning and connection, this event aims to empower small business owners with the tools and knowledge necessary to navigate challenges and seize opportunities. It underscores the importance of local support systems in ensuring the long-term health and prosperity of the community's economic landscape, ultimately benefiting everyone who lives and works there.", "vocab": [{"word": "entrepreneurs", "definition": "people who start and run their own businesses."}, {"word": "foster", "definition": "to encourage the development or growth of something."}, {"word": "backbone", "definition": "the most important part of a system or organization, providing support."}, {"word": "thrive", "definition": "to grow, develop, or be successful."}, {"word": "ecosystem", "definition": "a complex network or interconnected system."}, {"word": "navigate", "definition": "to find one's way through a difficult or complex situation."}, {"word": "prosperity", "definition": "the state of being successful, especially financially."}]}, "Advanced": {"text": "A significant local initiative, highlighted by ABC Columbia, is set to convene small business owners for a specialized event. This gathering represents a crucial opportunity for entrepreneurs to engage in strategic networking, acquire pertinent insights, and access vital resources tailored to cultivate sustainable growth and bolster their operational resilience within the competitive market.\n\nSmall and medium-sized enterprises (SMEs) are unequivocally the bedrock of regional economies. Their collective impact is profound, encompassing substantial job creation, the provision of diverse and often niche goods and services, and the cultivation of a unique local identity that enhances community appeal and livability. A robust SME sector directly correlates with economic stability, a broader tax base, and a dynamic marketplace, making their sustained success a paramount objective for local governance and community development.\n\nThe forthcoming event is anticipated to feature a comprehensive agenda designed to address the multifaceted challenges and opportunities confronting contemporary small businesses. Participants will be afforded extensive opportunities for peer-to-peer networking, facilitating the exchange of best practices, fostering mentorship relationships, and exploring potential synergistic collaborations. Such interactions are instrumental in catalyzing innovation, forging strategic alliances, and strengthening the overall local business ecosystem, enabling enterprises to collectively surmount common obstacles and leverage shared strengths.\n\nMoreover, the program is expected to incorporate a series of expert-led educational workshops and seminars. These sessions will delve into critical operational domains, including advanced digital marketing strategies, sophisticated financial planning and capital acquisition, optimizing customer relationship management, and effectively integrating emerging technologies like AI and e-commerce platforms. Distinguished local leaders, industry veterans, and policy makers are likely to contribute their expertise, offering actionable guidance and facilitating Q&A sessions that provide practical, implementable solutions for business enhancement.\n\nBeyond immediate learning, these events serve as a vital conduit for disseminating information regarding available government grants, local incentive programs, and regulatory updates that can significantly impact small business viability. They also foster a sense of community among business owners, reducing isolation and building a collective voice for advocacy on local economic issues.\n\nBy providing a multifaceted platform for knowledge transfer, skill development, and strategic connection, this initiative aims to empower small business owners with the acumen and support necessary to not only navigate current economic complexities but also to proactively seize future opportunities. It emphatically underscores the indispensable role of robust local support mechanisms in ensuring the enduring vitality and economic prosperity of the community, ultimately yielding widespread benefits for all stakeholders.", "vocab": [{"word": "convene", "definition": "to come or bring together for a meeting or activity."}, {"word": "pertinent", "definition": "relevant or applicable to a particular matter; apposite."}, {"word": "resilience", "definition": "the capacity to recover quickly from difficulties; toughness."}, {"word": "unequivocally", "definition": "in a way that leaves no doubt; unambiguously."}, {"word": "paramount", "definition": "more important than anything else; supreme."}, {"word": "synergistic", "definition": "relating to the interaction or cooperation of two or more organizations, substances, or other agents to produce a combined effect greater than the sum of their separate effects."}, {"word": "conduit", "definition": "a channel for conveying water or other fluid, or a means by which something is transmitted."}, {"word": "acumen", "definition": "the ability to make good judgments and quick decisions, typically in a particular domain."}]}}, "questions": [{"q": "What is the main purpose of the special event mentioned in the news item?", "a": "The main purpose of the event is to help small business owners meet others, share ideas, learn new things, and get advice to help their businesses grow and succeed."}, {"q": "According to the article, why are small businesses considered important for local economies?", "a": "Small businesses are considered important because they create jobs, provide unique goods and services, foster a distinct local character, contribute to the tax base, and create a vibrant marketplace, all of which are crucial for sustained economic health and community appeal."}], "id": "aa5b6a99e95", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilwFBVV95cUxQV2dpb01TS2JzU1B0THhQVFp3Y1cyN2FnYlhkdEJKNEJRdnh1eXE2d29ScVZHc3BFVzhST1A0T2h4M2Q2dk9LdmttaUdWdERCRlN3V0pWU2o4TnllbVlvRmFlSFZWS0RFVmhCQkZDUUE1TWRuWTI5cmZLczAtd0xBRlFGTVhRRkNLZ3N2UGRsQjJJZ184a1U4?oc=5", "published": "2026-08-18T07:03:01+09:00", "category": "business", "category_title": "Business"}, {"headline": "Canada's Economy: Inflation Up, Bank of Canada Holds Steady, Sales Surge", "excerpt": "Canada's economy faces rising inflation, but the central bank remains patient as manufacturing sales show a strong increase.", "levels": {"Beginner": {"text": "Canada's economy is seeing some changes. Prices for goods and services, which we call inflation, are slowly going up. This means things might cost a little more.\n\nThe Bank of Canada is like the country's main bank. It watches the economy closely. Right now, the Bank of Canada is not in a hurry to change its main interest rate. This rate affects how much it costs to borrow money. They want to see more information before making big decisions.\n\nGood news comes from Canadian factories. Companies that make things, like cars or food, are selling a lot more. This is called manufacturing sales, and they have gone up a lot. This shows that businesses are busy and the economy is active.\n\nSo, while prices are rising a bit, factories are doing well. The Bank of Canada is taking its time to decide what to do next for the country's money.", "vocab": [{"word": "economy", "definition": "How a country makes and uses money and goods."}, {"word": "inflation", "definition": "When prices for things go up over time."}, {"word": "Bank of Canada", "definition": "The main bank of Canada that helps control money and prices."}, {"word": "interest rate", "definition": "The extra money you pay when you borrow money."}, {"word": "manufacturing", "definition": "Making goods in factories."}, {"word": "sales", "definition": "The amount of goods or services sold."}]}, "Intermediate": {"text": "Canada's economic landscape is presenting a mix of trends. Recent reports indicate that inflation, the rate at which prices for goods and services increase, has started to creep higher. This upward movement in prices means that consumers might notice their money buying slightly less over time, impacting household budgets. The Consumer Price Index (CPI) is typically used to measure these changes, reflecting costs for items like food, energy, and housing.\n\nIn response to these economic signals, the Bank of Canada, the nation's central bank, has stated it is \"in no rush\" to adjust its key interest rate. This suggests a cautious approach, as the bank aims to balance controlling inflation with supporting overall economic stability and growth. The central bank uses interest rates as a primary tool to influence borrowing costs for businesses and individuals, thereby affecting spending and investment in the economy. They are likely waiting for more data to confirm if the rise in inflation is temporary or a more lasting trend.\n\nOn a more positive note, Canada's manufacturing sector has shown significant strength. Manufacturing sales have surged, indicating a robust increase in the amount of goods produced and sold by Canadian factories. This surge points to healthy demand for Canadian products, both domestically and internationally, and can contribute positively to the country's Gross Domestic Product (GDP) and employment levels. This strong performance in manufacturing provides a counterpoint to the rising inflation, suggesting underlying resilience in parts of the Canadian economy.", "vocab": [{"word": "economic landscape", "definition": "The current state of a country's economy."}, {"word": "inflation", "definition": "The general increase in prices and fall in the purchasing value of money."}, {"word": "Consumer Price Index (CPI)", "definition": "A measure of the average change over time in the prices paid by urban consumers for a market basket of consumer goods and services."}, {"word": "central bank", "definition": "A national bank that provides financial and banking services for its country's government and commercial banking system, as well as implementing monetary policy."}, {"word": "key interest rate", "definition": "The main interest rate set by a central bank, influencing all other rates in the economy."}, {"word": "manufacturing sector", "definition": "The part of the economy that makes goods in factories."}, {"word": "Gross Domestic Product (GDP)", "definition": "The total value of goods and services produced in a country in a year."}]}, "Advanced": {"text": "Canada's economic narrative is currently characterized by a nuanced interplay of inflationary pressures and robust sectoral performance, prompting a measured stance from its central monetary authority. Recent economic indicators reveal that inflation, a persistent concern for policymakers and households alike, has begun to creep higher, suggesting a potential re-acceleration in the cost of living. This uptick, often measured by the Consumer Price Index (CPI), reflects broad price increases across various categories, including essential goods and services, which can erode purchasing power and impact consumer confidence. While specific drivers for this latest rise were not detailed, global supply chain dynamics, energy price fluctuations, and domestic demand factors typically contribute to such movements, making the Bank of Canada's assessment particularly intricate.\n\nIn light of these developments, the Bank of Canada (BoC), the nation's central bank, has signaled a deliberate and cautious approach, indicating it is \"in no rush\" to alter its benchmark interest rate. This posture suggests the BoC is likely prioritizing a comprehensive assessment of incoming economic data, including core inflation metrics that exclude volatile items like food and energy, before committing to any policy shifts. The central bank's mandate is to maintain price stability and support sustainable economic growth, often targeting an inflation rate of around two percent. Adjusting the overnight rate is its primary tool to manage monetary policy, influencing everything from mortgage rates to business investment. A patient approach allows the bank to avoid premature tightening that could stifle growth, while also monitoring whether current inflationary trends are transitory or indicative of more entrenched pressures within the economy. This careful calibration is crucial to avoid either over-tightening, which could trigger a recession, or under-tightening, which could allow inflation to become embedded.\n\nConversely, the Canadian manufacturing sector has delivered a strong performance, providing a significant counterpoint to the inflationary concerns. Manufacturing sales have surged, a clear sign of heightened industrial activity and robust demand for Canadian-produced goods. This surge is a positive economic indicator, reflecting not only increased production volumes but also potentially stronger export performance and domestic consumption. Such growth in manufacturing contributes directly to the nation's Gross Domestic Product (GDP), supports employment, and can signal underlying resilience within the broader economy. This strong showing could also help to offset some of the economic drag from other sectors or global uncertainties, offering a degree of stability amidst evolving economic conditions. The confluence of rising inflation and strong manufacturing activity presents a complex challenge for the Bank of Canada, requiring careful calibration of its monetary policy to navigate these divergent forces effectively and guide the economy towards a stable and prosperous future. The bank's next decisions will be closely watched for clues on its outlook for both inflation and growth.", "vocab": [{"word": "nuanced interplay", "definition": "A complex and subtle interaction between different factors."}, {"word": "inflationary pressures", "definition": "Forces or factors that cause prices to rise."}, {"word": "monetary authority", "definition": "The institution (like a central bank) responsible for controlling the money supply and credit conditions."}, {"word": "Consumer Price Index (CPI)", "definition": "A key economic indicator measuring the average change over time in the prices paid by urban consumers for a market basket of consumer goods and services."}, {"word": "benchmark interest rate", "definition": "The standard interest rate set by a central bank, which serves as a reference point for other interest rates in the economy."}, {"word": "monetary policy", "definition": "Actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "transitory", "definition": "Lasting only for a short time; temporary."}, {"word": "Gross Domestic Product (GDP)", "definition": "The total monetary or market value of all the finished goods and services produced within a country's borders in a specific time period."}]}}, "questions": [{"q": "What are two main economic trends mentioned in the article regarding Canada?", "a": "Inflation is creeping higher, and manufacturing sales have surged."}, {"q": "What is the Bank of Canada's current stance on changing its key interest rate, and why?", "a": "The Bank of Canada is \"in no rush\" to change its key interest rate. It is taking a cautious approach, waiting for more data to assess if the rise in inflation is temporary or a lasting trend, and to balance controlling inflation with supporting economic stability."}], "id": "afaf894c559", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxPeHdaQzVvRFlxb0JOYllRVWdQa0ktVGVxNk9JYzV6aDRORHRfQ1NfVndSQmJma2xsTFhPQXRqTWMyNzR0WHQ1UGs2VDl3SFN1YjNjbTJTREpiamRzUGhETG1ickFLU3N1dU9YeVZRTE9neDlPWUo3aEF0ZFJzMktSdERsVnI0ajdpOE9UbndPdzdYM1dnajNpeDlNMklHN0pUaVp0YlFsSUdxdWpJYUVyOFNGV2JXMFNOdFMzSXdDUXhMODZCR0U2bWdjQkJhczd1N2F5NEQzRzBHY0FISDZ4OFhfUmZBVzFabjlpRFJsNkN5RFZLUUtIeWkwRTBVLWxzT0JYU3d3QzVOQVlHZU1BZlYxejY?oc=5", "published": "2026-08-18T07:08:34+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "FIFA Official Sacked After Criticizing President Infantino", "excerpt": "A top FIFA official, Kevin Lamour, was fired just weeks after he spoke out against the organization's president, Gianni Infantino.", "levels": {"Beginner": {"text": "A man named Kevin Lamour lost his job at FIFA. FIFA is a big organization that runs world football. Mr. Lamour was a senior person there. He said some critical things about FIFA's president, Gianni Infantino. This happened three weeks ago. After his criticism, FIFA decided to sack him. To sack someone means to fire them from their job. So, Kevin Lamour is no longer working for FIFA. This news shows that criticizing powerful leaders in big organizations can sometimes lead to losing your position. FIFA manages major football events like the World Cup. It is a very important body in sports. Many people are watching what happens inside FIFA.", "vocab": [{"word": "sacked", "definition": "Fired from a job."}, {"word": "criticism", "definition": "Saying that something or someone is bad or wrong."}, {"word": "senior", "definition": "High in rank or important."}, {"word": "president", "definition": "The main leader of an organization or country."}, {"word": "organization", "definition": "A group of people working together for a special purpose."}]}, "Intermediate": {"text": "Kevin Lamour, a senior figure within FIFA, the global governing body for football, has been dismissed from his position. This decision comes just three weeks after he publicly voiced criticism of FIFA's president, Gianni Infantino. Lamour held an important role within the organization, which oversees international football competitions, including the prestigious World Cup. His sacking raises questions about internal dissent and the consequences of speaking out against leadership within powerful sports institutions. While the specific details of Lamour's criticism were not immediately made public, the timing of his dismissal strongly suggests a direct link to his comments regarding President Infantino's plans or leadership. FIFA is responsible for setting the rules of football, organizing tournaments, and promoting the sport worldwide. As such, its internal politics and governance are often under scrutiny. The departure of a high-ranking official under such circumstances is likely to attract further attention to the organization's operations and leadership style.", "vocab": [{"word": "dismissed", "definition": "Formally removed from a job."}, {"word": "governing body", "definition": "An organization that controls and manages a particular activity or sport."}, {"word": "voiced", "definition": "Expressed or said something aloud."}, {"word": "dissent", "definition": "Strong disagreement with an official opinion or decision."}, {"word": "consequences", "definition": "The results or effects of an action or situation."}, {"word": "scrutiny", "definition": "Close and careful observation or examination."}]}, "Advanced": {"text": "Kevin Lamour, a prominent senior official within FIFA, the world's most influential football governing body, has been summarily dismissed from his role. This significant development occurred merely three weeks after Lamour publicly articulated criticism directed at FIFA President Gianni Infantino. The abrupt nature of his departure has ignited discussions regarding the implications for internal governance and the tolerance for dissent within powerful international sports organizations. FIFA, headquartered in Zurich, Switzerland, wields immense global influence, dictating the rules of football, orchestrating major tournaments like the FIFA World Cup, and overseeing the sport's development across its 211 member associations. Given its history of controversies and ongoing efforts to enhance transparency and accountability, the sacking of a high-ranking figure like Lamour, particularly in the wake of public criticism, is likely to draw considerable scrutiny. While the precise nature of Lamour's critical remarks has not been fully disclosed, the temporal proximity between his comments and his dismissal strongly suggests a causal link. This incident underscores the delicate balance between organizational loyalty and the freedom of expression for senior executives within hierarchical structures. Critics often argue that such actions can stifle open debate and hinder genuine reform efforts, potentially fostering an environment where challenging leadership is perceived as a career-ending risk. Conversely, organizations often emphasize the need for a unified front and adherence to strategic directives. The episode will undoubtedly prompt observers to question the extent of internal democracy and the mechanisms in place to protect whistleblowers or those who voice legitimate concerns within FIFA. This event adds another layer to the complex narrative surrounding FIFA's ongoing evolution under President Infantino's leadership, particularly as the organization navigates various challenges, from financial management to human rights issues associated with major sporting events.", "vocab": [{"word": "prominent", "definition": "Important or well-known."}, {"word": "summarily", "definition": "Done quickly and without following the normal process; immediately."}, {"word": "articulated", "definition": "Expressed an idea or feeling fluently and coherently."}, {"word": "implications", "definition": "The possible results or effects of an action or decision."}, {"word": "wields", "definition": "Holds and uses power or influence."}, {"word": "temporal proximity", "definition": "Closeness in time between two events."}, {"word": "stifle", "definition": "To prevent something from happening, developing, or being expressed."}, {"word": "hierarchical", "definition": "Arranged in order of rank, with some people having more authority than others."}]}}, "questions": [{"q": "Who was sacked from FIFA?", "a": "Kevin Lamour was sacked from FIFA."}, {"q": "Why was Kevin Lamour sacked?", "a": "He was sacked three weeks after criticizing FIFA President Gianni Infantino."}], "id": "a7811bdc105", "source": "BBC News", "link": "https://www.bbc.co.uk/sport/football/articles/cn7n4d6vy03o?at_medium=RSS&at_campaign=rss", "published": "2026-08-18T05:46:08+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Actress Hayden Panettiere Dies at 36, Tributes Pour In", "excerpt": "American actress Hayden Panettiere, known for her roles in 'Heroes' and 'Nashville,' has sadly passed away at the age of 36.", "levels": {"Beginner": {"text": "Hayden Panettiere, a famous actress from the United States, has died. She was 36 years old. Many people are sad about this news. Hayden Panettiere was well-known for her work on TV shows. She starred in popular series like \"Heroes\" and \"Nashville.\" In \"Heroes,\" she played a character with special powers. In \"Nashville,\" she sang and acted as a country music star. Both shows were very popular and helped her become a big name in television. \n\nThe news of her death was shared by the BBC. People who knew her, and her fans, are sending messages of sadness and respect. The police looked into her death. A coroner, who is a special doctor, said there were no signs of trauma on her body. This means there were no marks of injury or violence. This information helps to understand that her death was not caused by an accident or harm from another person. The exact reason for her death has not been fully shared, but the news brings much sadness to her many fans around the world.", "vocab": [{"word": "actress", "definition": "A woman who performs in plays or films."}, {"word": "died", "definition": "Stopped living."}, {"word": "shows", "definition": "Television programs or series."}, {"word": "sad", "definition": "Feeling unhappy."}, {"word": "coroner", "definition": "A doctor who checks the cause of death."}, {"word": "trauma", "definition": "Physical injury or wound."}]}, "Intermediate": {"text": "Hayden Panettiere, the acclaimed American actress known for her prominent roles in the television series \"Heroes\" and \"Nashville,\" has passed away at the age of 36. The news of her death has led to an outpouring of tributes from fans, colleagues, and the entertainment industry worldwide.\n\nPanettiere began her career at a young age, gaining significant recognition for her portrayal of cheerleader Claire Bennet in the science fiction drama \"Heroes,\" which aired from 2006 to 2010. Her character's catchphrase, \"Save the cheerleader, save the world,\" became iconic. Later, she captivated audiences as Juliette Barnes, a troubled country music star, in the musical drama \"Nashville\" from 2012 to 2018, showcasing her singing talent alongside her acting prowess.\n\nThe BBC reported the news, noting that a coroner's examination found no signs of trauma. This finding is significant as it indicates that there were no external injuries or evidence of foul play, suggesting that her death was not the result of violence or an accident. While the specific cause of death has not been publicly disclosed, the absence of trauma helps to clarify the circumstances surrounding her passing. Her sudden death at a relatively young age has deeply saddened many who followed her career and admired her talent.", "vocab": [{"word": "acclaimed", "definition": "Praised or celebrated by many people."}, {"word": "prominent", "definition": "Important and well-known."}, {"word": "outpouring", "definition": "A strong expression of feeling, like sadness or support."}, {"word": "portrayal", "definition": "The way an actor plays a character."}, {"word": "iconic", "definition": "Very famous and recognized as a symbol of something."}, {"word": "coroner", "definition": "An official who investigates deaths, especially those not clearly due to natural causes."}, {"word": "trauma", "definition": "A serious injury to a person's body."}]}, "Advanced": {"text": "The entertainment world is mourning the untimely passing of Hayden Panettiere, the acclaimed American actress who left an indelible mark on television audiences. Panettiere, aged 36, was renowned for her compelling performances in the hit series \"Heroes\" and \"Nashville.\" The BBC has confirmed her death, noting that a coroner's report indicated no signs of trauma, which typically rules out foul play or external violence as a cause.\n\nPanettiere's career trajectory began in her infancy, appearing in commercials before transitioning to soap operas like \"One Life to Live\" and \"Guiding Light.\" However, it was her role as the seemingly indestructible cheerleader Claire Bennet in NBC's \"Heroes\" (2006-2010) that propelled her to international stardom. Her character's ability to regenerate from any injury became a central theme of the sci-fi drama, resonating deeply with viewers and solidifying her status as a pop culture icon.\n\nFollowing \"Heroes,\" Panettiere further showcased her versatility in the musical drama \"Nashville\" (2012-2018), where she played Juliette Barnes, a volatile yet talented country music sensation. Her portrayal earned her critical accolades, including two Golden Globe nominations, and allowed her to demonstrate her vocal prowess, performing many of the show's original songs. Her ability to embody complex characters, often grappling with personal demons, garnered a loyal fanbase.\n\nThe news of her sudden death has triggered a profound outpouring of grief across social media and from her peers in Hollywood. Tributes have highlighted her vibrant spirit, immense talent, and the significant contributions she made to television during her relatively short but impactful career. The coroner's finding of 'no signs of trauma' is a crucial piece of information in the initial investigation, suggesting that her passing was not the result of an assault or a violent accident. While the precise cause of death has not been publicly detailed, the absence of such indicators helps to frame the circumstances, allowing for further medical inquiry if necessary. Her legacy as a gifted performer, who brought memorable characters to life, will undoubtedly endure.", "vocab": [{"word": "untimely", "definition": "Happening too soon or before the expected time."}, {"word": "acclaimed", "definition": "Highly praised and celebrated for achievements or qualities."}, {"word": "indelible", "definition": "Making a mark that cannot be removed or forgotten; lasting."}, {"word": "trajectory", "definition": "The path followed by a projectile flying or an object moving under the action of given forces; in this context, the course or path of a career."}, {"word": "propelled", "definition": "Driven, pushed, or caused to move in a particular direction; to cause to move forward."}, {"word": "versatility", "definition": "The ability to adapt or be adapted to many different functions or activities; flexibility."}, {"word": "accolades", "definition": "An award or privilege granted as a special honor or as an acknowledgment of merit; praise."}, {"word": "profound", "definition": "Very great or intense; showing great knowledge or insight."}]}}, "questions": [{"q": "How old was Hayden Panettiere when she died?", "a": "Hayden Panettiere was 36 years old when she died."}, {"q": "What did the coroner's report indicate about her death?", "a": "The coroner's report indicated that there were no signs of trauma."}], "id": "aaa32ce9cb9", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cq5665zgg1po?at_medium=RSS&at_campaign=rss", "published": "2026-08-18T06:43:57+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "England to Scrap Bus Pass Time Limits for Disabled People", "excerpt": "Disabled people in England will soon be able to use their free bus passes at any time of day, removing previous weekday time restrictions.", "levels": {"Beginner": {"text": "England will change how disabled people use their free bus passes. Right now, these passes can only be used at certain times on weekdays. For example, you can use them from 9:30 AM to 11:00 PM. You cannot use them in the early morning.\n\nBut soon, this will change. The Prime Minister has said that disabled people can use their passes all day, every day. This means they can travel for free on local buses at any time, day or night. This new rule will start on April 1, 2027.\n\nThis change will help many people. It will make it easier for disabled people to go to work, appointments, or visit friends and family. They will have more freedom to travel when they need to. Andy Burnham, a mayor in England, first started a similar plan in his area. Now, the whole country will follow.", "vocab": [{"word": "passes", "definition": "special cards that let you do something, like travel."}, {"word": "certain", "definition": "specific; not all."}, {"word": "weekdays", "definition": "Monday to Friday."}, {"word": "freedom", "definition": "the ability to do what you want."}, {"word": "plan", "definition": "an idea for how to do something."}]}, "Intermediate": {"text": "Significant changes are on the horizon for disabled people who use free bus passes across England. At present, these passes, which grant free travel on local bus services, come with notable time restrictions during weekdays. Specifically, pass holders are only permitted to use them between 9:30 AM and 11:00 PM from Monday to Friday. This often means that essential early morning journeys, such as commuting to work or attending medical appointments, necessitate paying a standard fare, creating an additional financial burden.\n\nHowever, a major nationwide policy shift has been announced by the Prime Minister. Effective from April 1, 2027, these weekday time limitations will be entirely abolished. This means that disabled pass holders will gain the freedom to travel free on local bus services at any hour of the day or night, every day of the week. This comprehensive removal of restrictions aims to provide unparalleled flexibility.\n\nThis initiative is widely anticipated to substantially enhance the independence, social inclusion, and overall mobility of disabled individuals. It directly addresses a long-standing challenge where existing restrictions hindered access to employment opportunities, educational institutions, crucial healthcare services, and various social activities, particularly during the busy morning peak hours. The ability to travel without time constraints will not only offer greater flexibility but also significantly alleviate financial pressures associated with public transport.\n\nThe expansion of this policy draws inspiration from a successful initiative pioneered by Andy Burnham, the Mayor of Greater Manchester, who had already introduced unrestricted travel for disabled pass holders within his region. The national government is now adopting this progressive approach, aiming to standardize and markedly improve access to public transportation for all disabled people throughout England, ensuring more equitable opportunities for daily life.", "vocab": [{"word": "restrictions", "definition": "rules that limit what you can do."}, {"word": "necessitate", "definition": "to make something necessary."}, {"word": "abolished", "definition": "completely ended."}, {"word": "enhance", "definition": "to improve something."}, {"word": "independence", "definition": "the ability to do things by yourself."}, {"word": "alleviate", "definition": "to make something less severe or difficult."}, {"word": "pioneered", "definition": "developed or first used something new."}]}, "Advanced": {"text": "A significant policy overhaul is set to transform public transport access for disabled individuals across England. The Prime Minister has announced the complete removal of weekday time restrictions on free bus passes, a move poised to grant unparalleled freedom and enhance social inclusion for a substantial segment of the population. This national change, effective from April 1, 2027, will allow disabled pass holders to utilize local bus services free of charge at any time of day or night, seven days a week.\n\nCurrently, the concessionary travel scheme for disabled people in England imposes notable limitations. Passes are valid only between 9:30 AM and 11:00 PM on weekdays. This means that essential early morning journeys, such as commuting to work, attending medical appointments, or accessing educational facilities, often require disabled individuals to pay standard fares. This not only presents a financial barrier but also significantly curtails their ability to participate fully in daily life, particularly during peak hours when public transport is most vital. While some local councils have opted to fund extended travel hours beyond the national minimum, this has led to a postcode lottery, creating inconsistencies in access across different regions.\n\nThe forthcoming national policy aims to rectify these disparities and foster greater equity. By abolishing the 9:30 AM restriction, the government seeks to empower disabled people with the flexibility to travel when it best suits their needs, rather than being constrained by arbitrary timeframes. This is expected to have a profound impact on their autonomy, enabling better access to employment opportunities, fostering greater engagement in community life, and facilitating more seamless access to essential services. The financial relief from not having to pay for early morning travel will also be a welcome benefit for many.\n\nThis national initiative builds upon successful regional models. Andy Burnham, the Mayor of Greater Manchester, notably spearheaded a similar policy within his conurbation, demonstrating the tangible benefits of unrestricted travel for disabled residents. His proactive stance highlighted the potential for such reforms to genuinely improve quality of life. The government's decision to adopt this approach nationally underscores a growing recognition of the importance of inclusive public transport infrastructure as a cornerstone of a fair and accessible society. Critics of the previous system often pointed to its inherent contradiction: a scheme designed to support disabled people inadvertently created barriers during crucial parts of the day. The 2027 implementation date provides a lead-in period for local authorities and transport operators to adapt to the new framework, ensuring a smooth transition for all stakeholders. This comprehensive reform represents a crucial step towards dismantling systemic barriers and promoting genuine equality for disabled citizens throughout England.", "vocab": [{"word": "overhaul", "definition": "a complete change or renovation of a system."}, {"word": "poised", "definition": "ready to do something; in a state of readiness."}, {"word": "concessionary", "definition": "offered at a reduced rate or with special conditions, often for specific groups."}, {"word": "curtails", "definition": "reduces or restricts something."}, {"word": "disparities", "definition": "great differences, often unfair ones."}, {"word": "autonomy", "definition": "the right or condition of self-government; independence."}, {"word": "spearheaded", "definition": "led or initiated an action or movement."}, {"word": "cornerstone", "definition": "an essential, founding, or main part of something."}]}}, "questions": [{"q": "What is the main change announced for disabled people's bus passes in England?", "a": "The main change is that weekday time restrictions on free bus passes will be removed, allowing disabled people to travel free at any time of day or night."}, {"q": "When will the new policy for unrestricted bus pass use come into effect across England?", "a": "The new policy will come into effect on April 1, 2027."}], "id": "a9b88c5abb8", "source": "Politics | The Guardian", "link": "https://www.theguardian.com/politics/2026/aug/17/burnham-scraps-restrictions-disabled-people-bus-passes-england", "published": "2026-08-18T06:30:05+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Tracy Rietzke Inducted Into Kansas Sports Hall of Fame", "excerpt": "Legendary college softball coach Tracy Rietzke has been inducted into the Kansas Sports Hall of Fame, recognizing her impactful career.", "levels": {"Beginner": {"text": "Tracy Rietzke is a very famous softball coach. She has now joined the Kansas Sports Hall of Fame. This is a big honor for her. It means she is one of the best sports figures in Kansas history.\n\nTracy Rietzke coached college softball for many years. She worked at Washburn University in Kansas and also at the University of Nebraska Omaha. She was a very successful coach. Her teams won many, many games. In total, she won over 1,000 games during her career. This is a huge number of wins for any coach.\n\nShe stopped coaching in 2019. Her induction into the Hall of Fame shows how important she was to the sport. The Kansas Sports Hall of Fame celebrates people who have done great things in sports for Kansas. Tracy Rietzke's work helped many young athletes and made softball popular.", "vocab": [{"word": "coach", "definition": "A person who trains a sports team or athlete."}, {"word": "inducted", "definition": "Formally welcomed into an organization or group."}, {"word": "honor", "definition": "Something given to show respect or admiration."}, {"word": "university", "definition": "A high-level educational institution where students study for degrees."}, {"word": "successful", "definition": "Achieving a desired aim or result."}, {"word": "retired", "definition": "Stopped working, usually because of age."}]}, "Intermediate": {"text": "Tracy Rietzke, a highly successful college softball coach, has been officially inducted into the Kansas Sports Hall of Fame. This prestigious honor recognizes her remarkable career and significant impact on the sport of softball, particularly within the state of Kansas and the surrounding region.\n\nRietzke's coaching career spanned more than three decades, during which she led teams at Washburn University in Topeka, Kansas, and later at the University of Nebraska Omaha. She is renowned for her exceptional winning record, accumulating an impressive 1,011 victories before her retirement in 2019. This places her among the elite group of coaches with over 1,000 wins in NCAA history across all divisions, a testament to her consistent excellence.\n\nAt Washburn, Rietzke built a strong program, guiding the Ichabods to numerous successful seasons. Her subsequent tenure at Nebraska-Omaha further solidified her reputation, as she consistently led the Mavericks to national tournament appearances and high-level competition. Her teams were known for their strong performance and development of student-athletes.\n\nThe Kansas Sports Hall of Fame celebrates individuals who have made outstanding contributions to sports within the state. Rietzke's induction highlights her legacy as a coaching legend and her lasting influence on countless student-athletes and the broader collegiate sports landscape.", "vocab": [{"word": "officially", "definition": "In a formal or authorized manner."}, {"word": "prestigious", "definition": "Inspiring respect and admiration; high-status."}, {"word": "remarkable", "definition": "Worthy of attention; striking."}, {"word": "renowned", "definition": "Known or talked about by many people; famous."}, {"word": "exceptional", "definition": "Unusually good; outstanding."}, {"word": "accumulating", "definition": "Gathering or acquiring an increasing number or quantity of something."}, {"word": "legacy", "definition": "Something handed down from an ancestor or from the past."}]}, "Advanced": {"text": "Tracy Rietzke, a towering figure in collegiate softball, has been formally inducted into the Kansas Sports Hall of Fame, an esteemed recognition of her illustrious career and profound impact on the sport. This honor solidifies her place among the most distinguished athletes and coaches associated with the Sunflower State, celebrating decades of unparalleled success and dedication.\n\nRietzke's coaching tenure spanned more than three decades, during which she amassed an extraordinary record, particularly noted for her time at Washburn University in Topeka, Kansas, and the University of Nebraska Omaha (UNO). Her career culminated in 2019 with an astounding 1,011 wins against just 260 losses, yielding a remarkable .795 winning percentage. This places her among the elite echelon of NCAA coaches across all divisions, a testament to her consistent excellence and strategic acumen.\n\nAt Washburn, she guided the Ichabods to numerous successful seasons, establishing a foundation of competitive softball and developing a reputation for strong team performance. Her subsequent move to UNO saw her elevate the Mavericks program to national prominence, consistently leading them to NCAA tournament appearances and deep runs in postseason play. Rietzke's coaching philosophy emphasized not only athletic prowess but also academic achievement and personal growth for her student-athletes.\n\nThe Kansas Sports Hall of Fame, established to celebrate individuals who have made exceptional contributions to sports in Kansas, acknowledges not only athletic achievements but also the dedication, leadership, and positive influence demonstrated by figures like Rietzke. Her induction underscores a legacy built on developing well-rounded individuals, fostering a culture of sustained success, and setting a benchmark for coaching achievement in collegiate athletics. This recognition serves as a fitting tribute to a career defined by unwavering commitment and an enduring influence on the landscape of softball.", "vocab": [{"word": "towering figure", "definition": "A person who is very important or influential in a particular field."}, {"word": "formally inducted", "definition": "Officially and ceremonially welcomed into an organization or position."}, {"word": "esteemed recognition", "definition": "Highly respected acknowledgment or honor."}, {"word": "illustrious", "definition": "Well known, respected, and admired for past achievements."}, {"word": "profound impact", "definition": "A very great or intense effect or influence."}, {"word": "tenure", "definition": "The period during which someone holds an important job or position."}, {"word": "amassed", "definition": "Gathered together or accumulated over a period of time."}, {"word": "strategic acumen", "definition": "The ability to make good judgments and quick decisions, especially in a particular domain like strategy."}]}}, "questions": [{"q": "Who was recently inducted into the Kansas Sports Hall of Fame?", "a": "Tracy Rietzke was recently inducted into the Kansas Sports Hall of Fame."}, {"q": "What sport did Tracy Rietzke coach?", "a": "Tracy Rietzke coached college softball."}], "id": "a9494970d43", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijwFBVV95cUxOeXVpRzBXYmhnX3RVWW9RNlh2WlVMTXc1eWtxUmNleG1Ka0xPVXkzQkl6amFGUzdZLWlKcEg4MXJNc2pOZ1VrV2dRYi1CV1RDd29EVUFJalAzcWlyMUs4Z3pXUF90ZFZWdV96LXRWTXdYSHpsaXNtS1JWeUo2WnhBVUhlZ0NRMk1YSTVpRFo0TQ?oc=5", "published": "2026-08-18T07:10:27+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Badgers Coach Emphasizes Simple Goals: Protect QB, Score Touchdowns", "excerpt": "The Badgers' running backs coach focuses on two key tasks: keeping the quarterback safe and scoring points.", "levels": {"Beginner": {"text": "The Badgers football team has a running backs coach. His job is to teach the players who run with the ball. This coach has a simple plan for his team. He wants his running backs to do two main things well.\n\nFirst, they must protect the quarterback. The quarterback is a very important player. He throws the ball. Other teams try to tackle him. Running backs need to block these players. This helps the quarterback stay safe. When the quarterback is safe, he can throw the ball better.\n\nSecond, the running backs must score touchdowns. A touchdown is when a player carries the ball into the end zone. This gives the team points. Scoring points helps the team win games.\n\nSo, the coach's message is clear: protect the quarterback and score touchdowns. These are important jobs for running backs. If they do these things, the Badgers team can play well and win. This simple idea helps the players know what to focus on during practices and games. It makes their roles easy to understand.", "vocab": [{"word": "coach", "definition": "A person who teaches and trains a sports team."}, {"word": "protect", "definition": "To keep someone or something safe from harm."}, {"word": "quarterback", "definition": "The player in American football who leads the team's offense and throws the ball."}, {"word": "touchdown", "definition": "A way to score points in American football by carrying the ball into the opponent's end zone."}, {"word": "block", "definition": "To stand in the way of an opponent to stop them."}, {"word": "focus", "definition": "To give all your attention to one thing."}]}, "Intermediate": {"text": "The Badgers football team's running backs coach has outlined a straightforward philosophy for his players. His approach emphasizes two fundamental responsibilities for the running backs: protecting the quarterback and scoring touchdowns. This clear and concise message is designed to simplify their roles and maximize their effectiveness on the field.\n\nIn American football, running backs are crucial offensive players. While their primary role often involves carrying the ball and gaining yards, their responsibilities extend beyond just running. One vital task is pass protection. When the quarterback attempts to throw the ball, opposing defensive players try to tackle him before he can release it. Running backs are often tasked with blocking these rushers, creating a protective pocket around the quarterback. This protection allows the quarterback more time to find open receivers and make accurate throws, which is essential for a successful offense.\n\nBeyond protection, the coach stresses the importance of scoring. Running backs are frequently involved in plays designed to gain significant yardage and ultimately cross the goal line for a touchdown. A touchdown is the highest-scoring play in football, earning six points for the team. Whether through powerful runs up the middle or elusive moves to the outside, the ability of running backs to consistently put points on the board is a major factor in a team's success.\n\nBy focusing on these two core objectives, the Badgers' running backs coach aims to instill discipline and clarity in his players. This simple yet powerful strategy helps the team's running backs understand their most critical contributions, both with and without the ball, ultimately contributing to the Badgers' overall performance and pursuit of victory.", "vocab": [{"word": "philosophy", "definition": "A set of beliefs or principles that guide a person's actions."}, {"word": "emphasizes", "definition": "Gives special importance or attention to something."}, {"word": "fundamental", "definition": "Basic and essential; forming a necessary part of something."}, {"word": "crucial", "definition": "Extremely important or necessary."}, {"word": "offensive", "definition": "Related to the part of a sports team that tries to score points."}, {"word": "instill", "definition": "To gradually but firmly establish an idea or attitude in a person's mind."}, {"word": "contributions", "definition": "The part played by a person or thing in bringing about a result or helping something to advance."}]}, "Advanced": {"text": "The running backs coach for the University of Wisconsin Badgers football program has articulated a remarkably succinct and potent coaching philosophy for his players. His mandate distills the complex role of a running back into two paramount objectives: quarterback protection and touchdown production. This streamlined approach aims to foster clarity and tactical efficiency among his athletes, ensuring they understand their most critical contributions to the team's offensive scheme.\n\nIn the intricate ballet of American football, running backs are multifaceted offensive assets. While their primary function often involves carrying the football to gain crucial yardage, their responsibilities extend significantly into the realm of pass protection. During passing plays, the quarterback, a pivotal figure in the offense, is vulnerable to relentless pressure from opposing defensive linemen and linebackers. Running backs are frequently deployed to \"pick up\" blitzing defenders or block edge rushers, thereby creating a secure pocket and affording the quarterback the requisite time to execute throws. This defensive assignment is not merely supplementary; it is foundational to the success of any aerial attack, directly influencing the quarterback's ability to deliver accurate passes and avoid costly turnovers.\n\nBeyond their protective duties, the coach unequivocally stresses the imperative of scoring. Running backs are often the linchpin of a team's ground game, tasked with converting red-zone opportunities into points. Whether through powerful, decisive runs that break tackles or agile, elusive maneuvers that exploit defensive gaps, their capacity to consistently cross the goal line for a touchdown is a defining metric of offensive prowess. A touchdown, yielding six points, is the most impactful scoring play, and a reliable running game can dictate the tempo of a contest and wear down an opponent's defense.\n\nBy distilling these roles into such clear, actionable directives, the Badgers' running backs coach seeks to cultivate a disciplined and goal-oriented mindset. This pragmatic strategy not only simplifies decision-making for players under pressure but also reinforces the symbiotic relationship between protecting the team's most valuable asset (the quarterback) and maximizing scoring potential. Ultimately, this focused methodology is designed to enhance the Badgers' offensive cohesion and bolster their pursuit of competitive excellence.", "vocab": [{"word": "articulated", "definition": "Expressed an idea or feeling fluently and coherently."}, {"word": "succinct", "definition": "(Especially of something written or spoken) brief and clearly expressed."}, {"word": "mandate", "definition": "An official order or commission to do something."}, {"word": "paramount", "definition": "More important than anything else; supreme."}, {"word": "multifaceted", "definition": "Having many different aspects or features."}, {"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "unequivocally", "definition": "In a way that leaves no doubt; unambiguously."}, {"word": "pragmatic", "definition": "Dealing with things sensibly and realistically in a way that is based on practical rather than theoretical considerations."}]}}, "questions": [{"q": "What are the two main things the Badgers' running backs coach wants his players to do?", "a": "The coach wants his running backs to protect the quarterback and score touchdowns."}, {"q": "Why is protecting the quarterback important in football?", "a": "Protecting the quarterback is important because it gives him more time to throw the ball and helps him stay safe from tackles."}], "id": "a5ffb4455be", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxOMDU0b0thaTdfZHhjSkZZRjV1QUN0WXlQQTFiejFPWkFRa0RBQjdQdmY2cEsxZS1oRVBJaEJ0eGp2YWZ4TG1CSzlyY3Q4NTRqOGtpdVBPVW9tMUVtQURuZkNiaEF4OVcxMnJJanhTUEN6bUlyZTlmRjJxUTFSUkgzVmUyUmlQZGU3QTVrRTFOY3Z4MjFsN0FWOTNXOUhvbVZlbVUxZERxcFFTWFZsa3g1Rmpod2JXcHJ3U05KSTJZdjdiMVNEZDlFSEd4WUlqWEk1OXphbDhyRz m OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihwFBVV95cUxPNmV5UXpiU3UxNmRzOVd1RTFac1Z6NTVReERjMjZyaUNNbzV6OVRRLWxoV1kwYmxvY0llRVEzOWxzN2diSk5NUVdNcHJ6cjBpTzNTenVoSm8xODc1RlBTaTl3VDFtdlVieHkybnpTTzBmTGhyN2Qyc1VyYzM0aFlhRXNDUHdlTk0?oc=5", "published": "2026-08-18T07:11:28+09:00", "category": "entertainment", "category_title": "Entertainment"}]};
const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
