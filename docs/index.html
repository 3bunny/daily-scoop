ancer Gospel Benefit Concert Southern Illinoisan", "vocab": []}, "Intermediate": {"text": "Hoppers returning for 2026 Cancer Gospel Benefit Concert Southern Illinoisan", "vocab": []}, "Advanced": {"text": "Hoppers returning for 2026 Cancer Gospel Benefit Concert Southern Illinoisan", "vocab": []}}, "questions": [], "id": "a49c39359ef", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi6wFBVV95cUxPS1pPaVlOQWVoTVMwYWk1UExOcm9XMVFMdU9pdEVWVmtDYzlBVlFlZVl3cFZqUDNjMnNmVE9RRk9OTjNKMzZtd2FIeU9iWFpVanNYeEczUVh6V3IxRFRxenlVaFZUeHE2Z2RRYmV4ZW9LQTY1YjRxZldPQTdBbEJ0SHdyNjlHS2VTaVNlUVhON0lva2pXWHZxZlc1dHIwOXNBc3lBeFY0bVZhcnB2ckttNzlRbjlhTkVWeVY5enVJTDJ4NnhYVlFtNU5zWWZFbUFsLXN3elR4Ny01ZXhPTWpaNTF6SWhZcmFHYmtZ?oc=5", "published": "2026-08-09T06:39:52+09:00", "category": "entertainment"}, {"headline": "Chester celebrates 10th Teapot Day with food, music and local pride - WTOV", "excerpt": "Chester celebrates 10th Teapot Day with food, music and local pride WTOV", "levels": {"Beginner": {"text": "Chester celebrates 10th Teapot Day with food, music and local pride WTOV", "vocab": []}, "Intermediate": {"text": "Chester celebrates 10th Teapot Day with food, music and local pride WTOV", "vocab": []}, "Advanced": {"text": "Chester celebrates 10th Teapot Day with food, music and local pride WTOV", "vocab": []}}, "questions": [], "id": "ad5522bee06", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMigwJBVV95cUxPZWRDS1BpcWNkbE5hYzJSUDhCc3lVSnRmVGZTOVM2Vjhaamt6UUhqU1VCcFBrZ0RhYndteFlQUG1ZNUxMNlJqaFY2Q1ZjY0lpbGN2QlFhYUQ5S1l4NXpDQmNSUFY1Y1RHSC1qYUJxSXo0WGYtUEJlR2VMbzVpTWViMmRrNXdTdlJyejRtUEE1QUdfeDhnckczUTE2M3Q2MWl0VWdyYW40MXRqbzN0T3FSTnN2NW1TRHE2MElRYVZDbWQ2QzBFdUNsYWM2T3JjZ3RPenVjZVE5OUNzQVhNR19haUgtTEd5RG5INy0yS28xcGUxUG5hWGxnUjZvcXAxVUNSY000?oc=5", "published": "2026-08-09T06:38:18+09:00", "category": "entertainment"}]}], "home": [{"headline": "Google Accelerates AI Development, Unveiling \"Next Chapter\"", "excerpt": "Google is advancing its artificial intelligence efforts, announcing new tools and how AI will enhance its popular products.", "levels": {"Beginner": {"text": "Google is working hard on Artificial Intelligence, or AI. AI helps computers learn and think like people. Google says it is starting a \"next chapter\" for its AI work. This means they are making new plans and tools for AI.\n\nGoogle wants to make its products better with AI. For example, AI can help Google Search give you smarter answers. It can also help with other Google apps you use every day.\n\nOne important AI tool from Google is called Gemini. Gemini is a powerful AI model that can understand different kinds of information, like words and pictures. Google wants Gemini to help many people.\n\nMany big technology companies are working on AI. Google wants to be a leader in this important area. They believe AI will change how we use computers and the internet in the future. This push shows Google's strong focus on making AI useful and helpful for everyone.", "vocab": [{"word": "Artificial Intelligence (AI)", "definition": "Computers that can learn and think like humans."}, {"word": "chapter", "definition": "A new part or stage of something."}, {"word": "tools", "definition": "Things used to do a job or task."}, {"word": "products", "definition": "Things a company makes and sells, like apps or services."}, {"word": "improve", "definition": "To make something better."}, {"word": "future", "definition": "The time that is coming after now."}]}, "Intermediate": {"text": "Google is significantly accelerating its development in Artificial Intelligence (AI), signaling a \"next chapter\" in its strategic focus. The company is actively integrating advanced AI capabilities across its core product ecosystem, aiming to enhance user experience and maintain its competitive edge in the rapidly evolving tech landscape.\n\nThis renewed momentum includes significant advancements in Google's foundational AI models, such as Gemini. Gemini is designed to be a multimodal AI, meaning it can understand and process various types of information, including text, images, audio, and video. Google is leveraging Gemini to power new features and improve existing services, making them more intelligent and intuitive.\n\nA key area of integration is Google Search. The company is incorporating generative AI features into Search, allowing users to receive more comprehensive and conversational answers to complex queries. Beyond Search, AI is also being woven into other popular Google products like Workspace (for productivity apps like Gmail and Docs) and Android devices, promising smarter assistance and personalized interactions.\n\nGoogle's commitment to AI reflects its belief that artificial intelligence will be the next major computing platform. This intense focus is also driven by a competitive race among global tech giants, all vying to lead in AI innovation. By pushing forward with new AI tools and integrations, Google aims to solidify its position as a leader, shaping how people interact with technology in the years to come.", "vocab": [{"word": "accelerating", "definition": "Making something happen faster or increasing its speed."}, {"word": "strategic", "definition": "Relating to a plan for achieving a major goal or advantage."}, {"word": "integrating", "definition": "Combining different parts or elements so they work together as a whole."}, {"word": "multimodal", "definition": "Able to understand and use different types of information, such as text, images, and audio."}, {"word": "leveraging", "definition": "Using something effectively to achieve a goal or advantage."}, {"word": "generative AI", "definition": "Artificial intelligence that can create new content, like text, images, or code."}, {"word": "competitive edge", "definition": "An advantage that a company has over its competitors."}]}, "Advanced": {"text": "Google is embarking on what it terms the \"next chapter\" of its Artificial Intelligence (AI) momentum, signaling an intensified and pervasive integration of advanced AI capabilities across its vast product ecosystem. This strategic imperative underscores the company's commitment to maintaining its leadership position in the fiercely competitive generative AI landscape.\n\nThe core of this acceleration lies in the continuous evolution and deployment of Google's foundational AI models, most notably Gemini. Designed from the ground up as a multimodal AI, Gemini possesses the unique ability to seamlessly understand, operate across, and combine different types of information—including text, code, audio, image, and video. This sophisticated architecture allows Google to infuse its products with more nuanced intelligence and responsiveness.\n\nA significant focus of this \"next chapter\" is the transformative impact on Google Search. The company is actively deploying generative AI features, such as the Search Generative Experience (SGE), which provides users with AI-powered overviews and conversational follow-up questions for complex queries, fundamentally reimagining information retrieval. Beyond its flagship search engine, AI integration is also deepening within Google Workspace, offering intelligent assistance for drafting emails and documents, and enhancing the capabilities of Android devices through smarter personalization and predictive functions.\n\nGoogle's aggressive pursuit of AI innovation is not merely a technological endeavor; it is a critical business strategy. The company views AI as the foundational computing platform of the future, essential for driving growth and relevance in an era increasingly defined by intelligent automation. This robust investment is also a direct response to the intense competitive pressures from other tech behemoths, all vying for dominance in AI research, development, and commercialization. By continually pushing the boundaries of AI, Google aims to solidify its market position, foster new avenues for innovation, and shape the ethical frameworks governing the responsible deployment of these powerful technologies globally.", "vocab": [{"word": "embarking", "definition": "Beginning a new and often difficult or exciting undertaking or journey."}, {"word": "pervasive", "definition": "Spreading widely throughout an area or a group of people; present everywhere."}, {"word": "imperative", "definition": "An urgent need or demand; something that is essential or crucial."}, {"word": "foundational", "definition": "Forming a base or basis upon which something is built or developed; fundamental."}, {"word": "multimodal", "definition": "Characterized by several different modes of activity or occurrence; in AI, able to process and generate various data types (text, image, audio, video, etc.)."}, {"word": "transformative", "definition": "Causing a marked and often dramatic change in someone or something."}, {"word": "reimagining", "definition": "Reinterpreting or rethinking something in a new, different, or creative way."}, {"word": "behemoths", "definition": "Something enormous, especially a big and powerful organization or company."}]}}, "questions": [{"q": "What is the name of Google's advanced AI model mentioned in the article?", "a": "Google's advanced AI model is called Gemini."}, {"q": "How is Google integrating AI into its products, according to the article?", "a": "Google is integrating AI into products like Google Search (with generative AI features), Workspace (for productivity apps), and Android devices to enhance user experience and provide smarter assistance."}], "id": "a3d9080ed6d", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijAFBVV95cUxQcFZsVmdKNHhSVnQ0VDZwRXY1VmZWQno1V3MwUzMxM2VJMW5UeFFmODZXa1VDcXVBS0dOMldjY0dwcTI1V05Pc0hHUzJWcGFzMnhVMnlVLW96U0J1ZjJFQWpQVENFdnRvd0dNUFpMU003dlFlbWhSQUJDNG9qX3ZkdmJFeWloYnQ4VmNVeQ?oc=5", "published": "2026-08-09T07:17:24+09:00", "category": "business", "category_title": "Business"}, {"headline": "Verizon Phones Hit by Outage", "excerpt": "Verizon customers experienced a widespread phone outage, with the company confirming the disruption via social media.", "levels": {"Beginner": {"text": "Verizon is a very large phone company in the United States. Many people use Verizon for their mobile phones. Recently, some Verizon phones stopped working. This problem is called an \"outage.\" During this outage, customers could not make phone calls or use the internet on their mobile devices.\n\nThe company, Verizon, told people about the problem. They used social media to share the news. Social media platforms are websites like Twitter or Facebook where companies can quickly talk to many people. Verizon said they knew about the outage and were working hard to fix it.\n\nPhone outages can be very frustrating for customers. People rely on their phones for many things. They use them to talk to family and friends, for work, and sometimes for emergencies. When phones don't work, it can be difficult to communicate important messages or get help.\n\nVerizon did not say what caused the outage. They also did not say exactly how many people were affected or where the outage happened. However, they assured customers that their teams were trying to restore service as quickly as possible. It is important for phone companies to keep their networks working well so people can stay connected.", "vocab": [{"word": "outage", "definition": "a time when a service, like electricity or phone service, stops working."}, {"word": "mobile phones", "definition": "phones that you can carry with you, not connected by a wire."}, {"word": "social media", "definition": "websites and apps that people use to share information and talk to each other, like Twitter or Facebook."}, {"word": "frustrating", "definition": "making you feel annoyed or upset because you cannot do something."}, {"word": "rely on", "definition": "to need or depend on someone or something."}, {"word": "restore", "definition": "to bring something back to its original condition."}]}, "Intermediate": {"text": "Verizon, one of the largest telecommunications providers in the United States, recently experienced a significant service disruption, affecting many of its mobile phone customers. The issue, commonly referred to as an \"outage,\" prevented users from making calls, sending texts, or accessing mobile data services.\n\nThe company acknowledged the problem promptly, utilizing its social media channels to inform the public. This approach is standard practice for major corporations during widespread technical issues, allowing for rapid dissemination of information to a broad customer base. Verizon stated that its technical teams were actively investigating the cause of the disruption and working diligently to restore full service.\n\nSuch outages can have considerable repercussions for individuals and businesses alike. In today's interconnected world, mobile phones are essential tools for communication, work, education, and even emergency services. A sudden loss of service can disrupt daily routines, impede critical communications, and cause significant inconvenience. For businesses that rely on mobile connectivity for operations, an outage can lead to lost productivity and revenue.\n\nWhile the exact cause and geographical scope of this particular outage were not immediately detailed by Verizon, telecommunications networks are complex systems. Disruptions can stem from various factors, including hardware failures, software glitches, or even external events. Companies like Verizon invest heavily in infrastructure and redundancy to minimize such occurrences, but they are not entirely preventable.\n\nVerizon's commitment to resolving the issue quickly was emphasized in their public statements. Customers were advised to monitor the company's social media for updates as technicians worked to bring services back online. Reliable mobile service is a cornerstone of modern life, and providers are under constant pressure to ensure uninterrupted connectivity for their millions of subscribers.", "vocab": [{"word": "telecommunications providers", "definition": "companies that offer phone, internet, and TV services."}, {"word": "service disruption", "definition": "a problem that stops a service from working normally."}, {"word": "acknowledged", "definition": "accepted or admitted that something is true or exists."}, {"word": "dissemination", "definition": "the act of spreading information widely."}, {"word": "repercussions", "definition": "the bad effects that something has on other things."}, {"word": "impeded", "definition": "made it difficult for something to happen or progress."}, {"word": "redundancy", "definition": "having extra systems or parts that can be used if the main ones fail."}]}, "Advanced": {"text": "Verizon, a dominant force in the U.S. telecommunications landscape, recently faced a significant network outage that impacted a substantial segment of its mobile subscriber base. The disruption rendered many customers unable to utilize core services such as voice calls, text messaging, and mobile data, underscoring the critical reliance on uninterrupted connectivity in contemporary society.\n\nIn line with modern crisis communication protocols, Verizon swiftly leveraged its official social media platforms to inform the public about the service interruption. This immediate digital outreach serves as a vital conduit for disseminating real-time updates and managing customer expectations during widespread technical incidents. The company confirmed that its engineering teams were actively engaged in diagnosing the root cause of the problem and implementing corrective measures to restore full functionality across its network.\n\nThe ramifications of such an outage extend far beyond mere inconvenience. For individuals, a sudden loss of mobile service can sever vital links to family, work, and emergency services, potentially compromising personal safety and professional obligations. Businesses, particularly those heavily reliant on mobile point-of-sale systems, remote workforces, or just-in-time logistics, can incur substantial financial losses due to operational paralysis and diminished productivity. The incident highlights the intricate dependency of the digital economy on robust and resilient telecommunications infrastructure.\n\nWhile Verizon did not immediately disclose specific details regarding the outage's origin or its precise geographical footprint, network disruptions in large-scale, complex systems can arise from a multitude of factors. These can range from sophisticated software glitches and hardware failures within data centers or cell towers to fiber optic cable cuts or even cyberattacks. Telecommunications giants routinely invest billions in network maintenance, upgrades, and redundant systems designed to mitigate the impact of localized failures and ensure high availability. However, the sheer scale and complexity of these networks mean that complete immunity from service interruptions remains an elusive goal.\n\nThe incident serves as a salient reminder of the inherent vulnerabilities within our increasingly interconnected digital ecosystem. Service providers like Verizon are not only expected to deliver seamless connectivity but also to maintain transparent communication during periods of instability. Customers, in turn, are increasingly accustomed to instant information and rapid resolution. As technicians worked assiduously to rectify the issue, the focus remained on restoring the integrity of Verizon's network and reaffirming its commitment to delivering reliable service to its vast clientele. The episode will undoubtedly prompt internal reviews to identify areas for further network hardening and improved incident response.", "vocab": [{"word": "dominant force", "definition": "a powerful and influential presence in a particular area or industry."}, {"word": "subscriber base", "definition": "the total number of customers who pay for a service."}, {"word": "underscoring", "definition": "emphasizing the importance of something."}, {"word": "conduit", "definition": "a channel or means for conveying something, especially information or ideas."}, {"word": "ramifications", "definition": "the complex or unwelcome consequences of an action or event."}, {"word": "resilient", "definition": "able to withstand or recover quickly from difficult conditions."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}, {"word": "assiduously", "definition": "with great care and persistent effort."}]}}, "questions": [{"q": "How did Verizon inform its customers about the outage?", "a": "Verizon informed its customers about the outage using social media channels."}, {"q": "What are some ways a phone outage can affect people?", "a": "A phone outage can prevent people from making calls, sending texts, or using the internet, which can disrupt daily routines, impede critical communications, affect work, and even impact emergency services."}], "id": "a76a146ef39", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMigAFBVV95cUxPeWdQWnhYWmhIWW1aN3FFVHJxY0tIYzA2TDc4ZnBFa0xZOHYxUjNKOFlIV0hnTmdSVGJjWXhWeFJqNEp1d2JIN29yaF9xVEtFOXhJVnFsdGp0RVZSQllPYkIwWHBBSlhLZ2VnRElvLTZoWFVDa1RmNWd0MVNiUnBCRw?oc=5", "published": "2026-08-09T07:10:31+09:00", "category": "business", "category_title": "Business"}, {"headline": "Global Fight Against Rising Prices Continues", "excerpt": "Many countries are still working hard to control inflation, as the job of bringing down high prices is not yet finished.", "levels": {"Beginner": {"text": "Many countries around the world are still working to stop prices from going up too fast. This problem is called inflation. When there is inflation, things like food, clothes, and fuel cost more money. This means your money buys less than it used to.\n\nCentral banks are important groups in each country that try to keep the economy stable. They have been trying to fight inflation. One way they do this is by making it more expensive to borrow money. This can slow down how much people spend, which helps prices stop rising so quickly.\n\nFor a while, prices went up a lot because of things like problems with getting goods to stores and the cost of energy. Now, some prices are not rising as fast as before. This is good news. However, leaders and central banks say that the job of bringing inflation under control is not yet finished. They need to keep working to make sure prices stay stable for everyone. It's a big task to make sure people's money keeps its value.", "vocab": [{"word": "Inflation", "definition": "When prices for many things go up over time."}, {"word": "Prices", "definition": "How much money you pay for something."}, {"word": "Central bank", "definition": "A main bank in a country that manages money and tries to keep the economy stable."}, {"word": "Economy", "definition": "The system of how money, goods, and services are made and used in a country."}, {"word": "Borrow", "definition": "To take money from someone with the promise to pay it back later."}]}, "Intermediate": {"text": "The global effort to curb rising prices, known as inflation, remains an ongoing challenge for many nations. Inflation signifies a sustained increase in the general price level of goods and services, which effectively reduces the purchasing power of money. This means that consumers can buy less with the same amount of money, impacting household budgets and overall economic stability.\n\nCentral banks worldwide have been at the forefront of this battle. Their primary tool is monetary policy, specifically adjusting interest rates. By raising interest rates, central banks make it more expensive for individuals and businesses to borrow money. This strategy aims to cool down economic activity, reduce demand, and thereby slow the pace of price increases.\n\nThe recent surge in inflation was largely driven by a combination of factors, including disruptions to global supply chains during and after the pandemic, increased consumer demand, and higher energy costs. While there have been signs of progress, with inflation rates beginning to moderate in some regions, economic authorities emphasize that the task is far from complete.\n\nPolicymakers are keenly aware that while headline inflation may be easing, underlying price pressures can persist. They remain committed to their goal of achieving price stability, which is crucial for long-term economic health and predictable financial planning. The persistent message from financial institutions is that vigilance is still required to ensure inflation is brought firmly back to target levels and does not rebound.", "vocab": [{"word": "Curb", "definition": "To control or limit something."}, {"word": "Sustained", "definition": "Continuing for a long time without interruption."}, {"word": "Purchasing power", "definition": "The amount of goods and services that can be bought with a unit of currency."}, {"word": "Monetary policy", "definition": "Actions taken by a central bank to control the supply of money and credit in an economy."}, {"word": "Interest rates", "definition": "The cost of borrowing money, or the return on saving money."}, {"word": "Supply chains", "definition": "The system of people and organizations involved in getting a product from its source to the customer."}, {"word": "Vigilance", "definition": "The action of keeping careful watch for possible danger or difficulties."}]}, "Advanced": {"text": "The global economic landscape continues to grapple with persistent inflationary pressures, despite concerted efforts by central banks and governments worldwide. The assertion that \"the job is not done yet\" resonates across numerous economies, underscoring the ongoing commitment required to fully restore price stability. Inflation, characterized by a sustained and broad-based increase in the general price level, erodes the purchasing power of currency, impacting everything from household budgets to long-term investment strategies.\n\nCentral banks have largely responded with aggressive monetary tightening cycles, primarily through significant hikes in benchmark interest rates. The rationale behind these actions is to dampen aggregate demand, thereby alleviating demand-pull inflationary pressures. Higher borrowing costs are intended to discourage consumer spending and business investment, slowing economic activity sufficiently to bring inflation back to target levels, typically around 2%. However, this strategy carries the inherent risk of triggering an economic slowdown or even a recession, presenting a delicate balancing act for policymakers.\n\nThe recent inflationary surge was multifaceted, stemming from a confluence of factors. Post-pandemic demand rebound, exacerbated by fiscal stimulus measures, collided with significant supply-side constraints, including disruptions to global supply chains and elevated commodity prices, particularly energy. Geopolitical tensions, such as the conflict in Ukraine, further complicated the picture by impacting energy and food markets.\n\nWhile headline inflation rates have shown signs of moderation in many advanced economies, often attributed to base effects and easing energy prices, core inflation—which excludes volatile food and energy components—has proven more stubborn. This persistence suggests that underlying domestic price pressures, potentially fueled by tight labor markets and wage growth, remain a concern. The risk of a wage-price spiral, where rising wages lead to higher prices, which in turn prompt demands for further wage increases, is a scenario central banks are keen to avoid.\n\nPolicymakers are now navigating a complex environment, balancing the need for continued disinflationary policies with the imperative to avoid an overly restrictive stance that could stifle economic growth. The ongoing narrative emphasizes sustained vigilance and a data-dependent approach, acknowledging that while significant progress has been made, the journey to firmly anchor inflation expectations and achieve durable price stability is still underway. The global economy remains susceptible to new shocks, necessitating a cautious and adaptive policy framework.", "vocab": [{"word": "Persistent", "definition": "Continuing to exist or happen, especially for longer than desirable or expected."}, {"word": "Erodes", "definition": "Gradually destroys or wears away (something). In economics, it means to diminish the value or effectiveness of something."}, {"word": "Monetary tightening", "definition": "A central bank policy aimed at reducing the money supply and increasing interest rates to curb inflation."}, {"word": "Aggregate demand", "definition": "The total demand for all goods and services produced in an economy."}, {"word": "Fiscal stimulus", "definition": "Government actions, such as increased spending or tax cuts, intended to boost economic activity."}, {"word": "Geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "Core inflation", "definition": "A measure of inflation that excludes volatile items like food and energy prices to give a clearer picture of underlying price trends."}, {"word": "Vigilance", "definition": "The action or state of keeping careful watch for possible danger or difficulties."}]}}, "questions": [{"q": "What is inflation and why is it a problem for people?", "a": "Inflation is when the prices of goods and services go up over time. It's a problem because it means people's money can buy less than it used to, reducing their purchasing power."}, {"q": "What is one main way central banks try to fight inflation?", "a": "Central banks try to fight inflation by raising interest rates, which makes it more expensive to borrow money and helps slow down spending and price increases."}], "id": "a8dd202d264", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxNcURiNllsbElsclhRR2kybnAyV2FRRnQ1MGtFU2pGb194eURwa0UzVi14TU1Lb1hFTGY4WTVCOTlTWVZ5M25TcHZKRVY2NWRBWll6MTU3SUs4UGhuQ0hidTNxNjNKck4yOU1SSzBiLW9KcHBueng0WWpHN1c4NElVa0NqanBxcmduMFk5SjFhWTFkcVRZZl92bkdseHNEWk8xUUpBNjlJQXZkTG1w0gGsAUFVX3lxTE1xRGI2WWxsSWxyWFFHaTJucDJXYVFGdDUwa0VTakZvX3h5RHBrRTNWLXhNTUtvWEVMZjhZNUI5OVNZVnkzblNwdkpFVjY1ZEFaWXoxNTdJSzhQaG5DSGJ1M3E2M0pyTjI5TVJLMGItb0pwcG56eDRZakc3Vzg0SVVrQ2pqcHFyZ24wWTlKMWFZMWRxVFlmX3ZuR2x4c0RaTzFRSkE2OUlBdmRMbXA?oc=5", "published": "2026-08-09T05:22:18+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Brazil's Pix Payment System Catches US Attention", "excerpt": "Brazil's innovative Pix payment system, known for its instant and free transactions, is gaining global recognition and prompting discussions in the United States.", "levels": {"Beginner": {"text": "Brazil has a new way to pay called Pix. It's a very popular system for sending and receiving money. Pix lets people send money instantly, any time of day or night, even on weekends. It's also free for individuals to use.\n\nMany people in Brazil now use Pix instead of cash or old bank transfers. You can pay for things in stores, send money to friends, or pay bills very easily with just a phone. You don't need a bank account number; you can use a phone number or a special code.\n\nThis system was created by Brazil's Central Bank. It has made digital payments much faster and simpler for everyone. Because Pix is so successful in Brazil, other countries are now looking at it. The United States, for example, is watching how Pix works. They are thinking about how their own payment systems could be better and faster, similar to Brazil's Pix. Pix shows how new technology can change how we handle money.", "vocab": [{"word": "system", "definition": "a way of doing things."}, {"word": "instantly", "definition": "right away, very quickly."}, {"word": "individuals", "definition": "single people."}, {"word": "digital", "definition": "using computers or the internet."}, {"word": "successful", "definition": "working well and achieving good results."}, {"word": "technology", "definition": "new machines or methods."}]}, "Intermediate": {"text": "Brazil's innovative payment system, Pix, has rapidly transformed how people and businesses handle money in the country, drawing significant attention from around the world, including the United States. Launched by the Central Bank of Brazil in late 2020, Pix allows for instant money transfers 24 hours a day, seven days a week, at no cost for individuals.\n\nThe system is incredibly user-friendly. Users can make payments or send money using simple identifiers like a phone number, email address, or national ID (CPF), or by scanning a QR code. This ease of use, combined with its immediate settlement, has led to widespread adoption. Millions of Brazilians now use Pix for everything from paying utility bills and shopping to splitting restaurant checks with friends. It has significantly reduced the reliance on cash and traditional bank transfers, fostering greater financial inclusion, especially for those previously underserved by formal banking.\n\nPix's success has prompted other nations to examine their own payment infrastructures. In the United States, for instance, while systems like Zelle offer instant peer-to-peer transfers and FedNow provides real-time gross settlement for financial institutions, the overall payment landscape remains more fragmented and often involves fees or delays for certain transactions. The \"unsettling\" aspect for the US comes from Pix demonstrating a highly efficient, ubiquitous, and low-cost national payment solution that has quickly become a cornerstone of Brazil's digital economy. This success encourages discussions about how the US could further modernize and unify its diverse payment methods to offer similar benefits to its population.", "vocab": [{"word": "innovative", "definition": "new and creative."}, {"word": "transformed", "definition": "changed something completely."}, {"word": "settlement", "definition": "the act of completing a payment or transaction."}, {"word": "widespread adoption", "definition": "many people starting to use something."}, {"word": "financial inclusion", "definition": "making financial services available to everyone."}, {"word": "infrastructure", "definition": "the basic systems and services that a country or organization uses."}, {"word": "ubiquitous", "definition": "found everywhere."}]}, "Advanced": {"text": "Brazil's Pix, a real-time payment system launched by the Central Bank of Brazil in November 2020, has profoundly reshaped the nation's financial landscape and is now serving as a compelling case study for global financial innovation, particularly \"unsettling\" established paradigms in countries like the United States. Designed to be instant, free for individuals, and available 24/7, Pix facilitates direct transfers between bank accounts, leveraging a robust and interoperable infrastructure. Users can initiate payments using simple \"keys\" such as a phone number, email address, national ID (CPF/CNPJ), or a QR code, bypassing traditional intermediaries and their associated fees.\n\nThe rapid and extensive adoption of Pix within Brazil is unprecedented. Within its first year, it surpassed credit and debit cards as the most used payment method, processing billions of transactions monthly. This success is attributable not only to its convenience and cost-effectiveness but also to its strategic design for financial inclusion. Pix has brought millions of unbanked and underbanked Brazilians into the formal financial system, enabling them to participate in the digital economy, receive wages, and make payments without needing a traditional bank account or incurring high transaction costs. It has also significantly reduced the circulation of physical cash and stimulated competition among financial service providers.\n\nThe \"unsettling\" effect on the United States stems from Pix's demonstration of a highly centralized, universally accessible, and efficient national payment rail. While the US possesses advanced payment technologies, its ecosystem is notably more fragmented. Systems like Zelle offer instant peer-to-peer transfers, and the Federal Reserve's recent launch of FedNow provides a real-time gross settlement service for participating financial institutions. However, neither offers the comprehensive, nationwide interoperability and direct-to-consumer ubiquity of Pix. US consumers and businesses often contend with varying transaction speeds, fees, and a lack of seamless integration across different banking platforms.\n\nPix's success highlights the potential for a public utility approach to payment systems, challenging the predominantly private-sector driven innovation in the US. It underscores the benefits of a unified national standard for instant payments, which can drive down costs, enhance competition, and foster greater financial equity. For American policymakers and financial institutions, Pix serves as a powerful benchmark, prompting critical examination of existing legacy infrastructure, regulatory hurdles, and the strategic imperative to evolve towards a more integrated, real-time, and cost-efficient payment future to remain competitive on the global stage.", "vocab": [{"word": "profoundly", "definition": "Deeply or intensely; to a great extent."}, {"word": "paradigms", "definition": "Typical patterns or models of something; a distinct set of concepts or thought patterns."}, {"word": "interoperable", "definition": "Able to exchange and make use of information or services with other systems or products."}, {"word": "unprecedented", "definition": "Never done or known before; without previous instance."}, {"word": "financial inclusion", "definition": "The provision of affordable, useful, and responsible financial products and services to individuals, especially those traditionally underserved by formal financial systems."}, {"word": "ubiquity", "definition": "The state of being everywhere or seeming to be everywhere at once; widespread presence."}, {"word": "fragmented", "definition": "Broken into small, separate parts; lacking unity or coherence."}, {"word": "imperative", "definition": "Something that is extremely important or urgent; a command or order."}]}}, "questions": [{"q": "What is Pix and what are two main benefits it offers users?", "a": "Pix is an instant payment system from Brazil. Two main benefits are that it allows money to be sent instantly and it is free for individuals to use."}, {"q": "Why is Pix's success considered 'unsettling' for countries like the United States?", "a": "Pix's success is unsettling because it demonstrates a highly efficient, ubiquitous, and low-cost national payment solution, highlighting areas where US payment systems might be slower, more fragmented, or involve more fees."}], "id": "a713da9530d", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMijwFBVV95cUxQNmFLck5jZUlNZDlDRFJsSDZNQVRmUXc1bUJCMjRWYzZDMUtOSUQzSW52Y3p5ZlpPeXcxY3VxYVhyV1pNNUt4RjctRUZsOHZ1NUItUXVtYU5rbGwzSmVCaUxSX3FiR0xmeEpfSk0zeVNLT3dhWmZxLVJ1NUJfZDR0OHRLZVdDeGZxeGlNaTQzUQ?oc=5", "published": "2026-08-09T04:30:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Canada Wildfire Doubles, Forces Thousands to Flee Homes", "excerpt": "A large wildfire in British Columbia, Canada, has rapidly grown, forcing many people to leave their homes for safety.", "levels": {"Beginner": {"text": "A big fire is burning in Canada. It is called the Bald Range wildfire. This fire is in a place called British Columbia. The fire is moving very fast. It has gotten much bigger. The fire was already large, but now it has doubled in size. This means it is twice as big as before.\n\nThe fire is now burning over 36 square miles. That is a very large area. Because of the fire, many people have to leave their homes. Thousands of people are told to go to a safe place. They must leave their houses quickly.\n\nFirefighters are working hard to stop the fire. But the fire is still \"out of control.\" This means it is still spreading and hard to stop. Canada often has big fires in the summer. It can be very dry and hot. These conditions make fires start and spread easily. People hope the firefighters can stop the Bald Range wildfire soon and that everyone stays safe.", "vocab": [{"word": "fire", "definition": "a burning flame that produces heat and light."}, {"word": "burning", "definition": "on fire; actively consuming fuel."}, {"word": "doubled", "definition": "became twice as large or as many."}, {"word": "leave", "definition": "to go away from a place."}, {"word": "homes", "definition": "houses or places where people live."}, {"word": "safe", "definition": "not in danger or harmed."}]}, "Intermediate": {"text": "A rapidly expanding wildfire in British Columbia, Canada, has forced thousands of residents to evacuate their homes. The Bald Range wildfire, located in the western province, has more than doubled in size, now covering over 36 square miles (95 square kilometers). Authorities describe the blaze as \"out of control,\" indicating the significant challenge firefighters face in containing its spread.\n\nThe fire's rapid growth has led to urgent evacuation orders for communities in its path. Residents have been advised to leave their properties immediately to ensure their safety as the flames advance quickly. Emergency services are coordinating efforts to provide temporary shelter and support for those displaced by the disaster, ensuring they have access to essential resources. The emotional and practical toll on affected families is considerable, as many leave behind their belongings with uncertainty about their return.\n\nBritish Columbia, like many parts of Canada, experiences a regular wildfire season, typically from spring through autumn. However, recent years have seen increasingly severe and prolonged fire seasons, often linked to hotter, drier conditions exacerbated by climate change. These conditions create a landscape highly susceptible to ignition and rapid fire propagation, making large-scale blazes more common and harder to manage.\n\nFirefighting crews are working tirelessly on the ground and with air support, deploying water bombers and helicopters to douse hot spots and create fire breaks. Despite these extensive efforts, the sheer scale and speed of the Bald Range wildfire make their task extremely difficult. The primary goal is to protect lives and critical infrastructure, while also attempting to establish containment lines to prevent further expansion. The situation remains dynamic, and officials continue to monitor the fire's behavior closely, updating evacuation alerts and orders as necessary. The hope is for cooler weather or rain to help firefighters gain an advantage against this destructive force.", "vocab": [{"word": "evacuate", "definition": "to move people from a dangerous place to a safe one."}, {"word": "residents", "definition": "people who live in a particular place."}, {"word": "authorities", "definition": "official organizations or people who have the power to make decisions."}, {"word": "containing", "definition": "keeping something within limits; preventing it from spreading."}, {"word": "displaced", "definition": "forced to leave one's home or country."}, {"word": "exacerbated", "definition": "made worse or more severe."}, {"word": "infrastructure", "definition": "the basic physical and organizational structures and facilities (e.g., buildings, roads, power supplies) needed for the operation of a society or enterprise."}]}, "Advanced": {"text": "A formidable wildfire in British Columbia, Canada, has escalated dramatically, compelling thousands of residents to abandon their homes as it continues its rapid and uncontrolled expansion. The Bald Range wildfire, situated in the province's interior, has more than doubled its footprint, now engulfing an area exceeding 36 square miles (95 square kilometers). Emergency services have unequivocally declared the blaze \"out of control,\" underscoring the immense operational challenges confronting firefighting personnel.\n\nThe wildfire's aggressive propagation has necessitated immediate and widespread evacuation orders across several communities lying in its trajectory. Residents have received urgent directives to vacate their properties, prioritizing personal safety as the conflagration advances with alarming speed. Local and provincial emergency management agencies are meticulously coordinating relief efforts, establishing temporary shelters, and providing essential provisions for those displaced by the unfolding catastrophe. The psychological and material impact on affected families is profound, as they face the uncertainty of returning to potentially devastated homes and livelihoods, with many leaving behind cherished possessions and memories.\n\nBritish Columbia is perennially susceptible to wildfires, with its extensive forests and dry summers creating an environment ripe for ignition. However, the frequency and intensity of these events have demonstrably increased in recent decades, a trend widely attributed to the escalating effects of climate change. Prolonged periods of elevated temperatures, reduced precipitation, and earlier snowmelt contribute to parched landscapes, rendering them highly combustible and conducive to the rapid spread of large-scale blazes. This year's fire season, like several preceding ones, is proving to be particularly challenging, following a record-breaking year for wildfires across Canada that saw millions of hectares burned and significant smoke plumes affecting air quality across North America.\n\nFirefighting crews, comprising both ground personnel and aerial support, are engaged in a relentless battle against the inferno. Water bombers and helicopters are strategically deployed to douse active hotspots and establish robust firebreaks, aiming to curtail the fire's relentless march. Despite these exhaustive endeavors, the sheer magnitude and velocity of the Bald Range wildfire present an extraordinary operational hurdle. The paramount objectives remain the safeguarding of human life and critical infrastructure, alongside the establishment of effective containment perimeters to mitigate ecological damage. The situation remains highly volatile, with officials continuously monitoring meteorological conditions and fire behavior to issue updated evacuation alerts and orders as circumstances evolve. Hopes are pinned on a significant shift in weather patterns, specifically cooler temperatures or substantial rainfall, to provide a much-needed advantage in subduing this destructive force. The long-term recovery for affected regions will undoubtedly be a complex and arduous undertaking, requiring substantial resources for rebuilding and ecological restoration.", "vocab": [{"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "escalated", "definition": "increased rapidly in intensity or magnitude."}, {"word": "unequivocally", "definition": "in a way that leaves no doubt; unambiguously."}, {"word": "propagation", "definition": "the action of spreading or being spread."}, {"word": "conflagration", "definition": "an extensive fire that destroys a great deal of land or property."}, {"word": "perennially", "definition": "in a way that lasts for an indefinitely long time; perpetually or recurring regularly."}, {"word": "combustible", "definition": "able to catch fire and burn easily."}, {"word": "curtail", "definition": "reduce in extent or quantity; impose a restriction on."}]}}, "questions": [{"q": "What is the name of the wildfire mentioned in the article?", "a": "The wildfire is called the Bald Range wildfire."}, {"q": "What is the current status of the Bald Range wildfire?", "a": "It is currently considered \"out of control.\""}], "id": "a16ffb56829", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cx25dkwk3e3o?at_medium=RSS&at_campaign=rss", "published": "2026-08-09T07:01:54+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Senate Confirms Todd Blanche as Attorney General, a Win for Trump", "excerpt": "The Senate confirmed Todd Blanche as U.S. Attorney General, a victory for President Trump's approach to the Justice Department.", "levels": {"Beginner": {"text": "The U.S. Senate has chosen Todd Blanche to be the new Attorney General. This is a very important job. The Attorney General is the country's top lawyer and leads the Department of Justice. This department helps make sure laws are followed across the nation.\n\nMr. Blanche used to be a personal lawyer for President Trump. The Senate, which has more members from the Republican Party, voted to approve him. The vote was very close, meaning many senators did not agree with the choice. But in the end, Mr. Blanche got the job.\n\nThis decision is seen as a big win for President Trump. It shows that President Trump wants the Department of Justice to work closely with the White House. Usually, this department tries to stay separate from political influence. This helps it make fair decisions about the law.\n\nMany people are watching this news closely. They want to see how the new Attorney General will do his important work. He will start his new role soon, leading a very powerful part of the government.", "vocab": [{"word": "Senate", "definition": "A part of the U.S. government that makes laws."}, {"word": "Attorney General", "definition": "The main lawyer for the country."}, {"word": "Department of Justice", "definition": "The part of the government that makes sure laws are followed."}, {"word": "Lawyer", "definition": "A person who helps people with legal problems."}, {"word": "Approved", "definition": "Said yes to something; agreed to something."}, {"word": "Influence", "definition": "The power to change how someone thinks or acts."}]}, "Intermediate": {"text": "The U.S. Senate has confirmed Todd Blanche as the new Attorney General, a significant development for President Trump's administration. Blanche, who previously served as a personal attorney for President Trump, secured the position after a narrow vote in the Republican-controlled Senate. This confirmation is widely viewed as a major victory for the President, aligning with his stated desire to maintain a close relationship between the White House and the Department of Justice.\n\nThe Attorney General holds one of the most powerful positions in the U.S. government, serving as the nation's chief law enforcement officer and head of the Department of Justice. This department is responsible for enforcing federal laws, prosecuting cases, and providing legal advice to the President and other government agencies. Traditionally, the Department of Justice operates with a degree of independence from the White House to ensure that legal decisions are made without political interference.\n\nThe confirmation process for such a high-ranking official involves a thorough review by the Senate. Senators examine the nominee's qualifications, past work, and judicial philosophy. The close vote for Blanche suggests division among senators, with some expressing concerns about his prior role as President Trump's personal lawyer and the potential impact on the Justice Department's independence. Critics often argue that an Attorney General should be seen as impartial, focusing solely on the law rather than political allegiances.\n\nPresident Trump has consistently advocated for an Attorney General who is loyal to his agenda. The appointment of Todd Blanche is seen as a fulfillment of this approach. Supporters of Blanche emphasize his legal experience and argue that his past work does not disqualify him from serving the country impartially. As he steps into this crucial role, all eyes will be on how Attorney General Blanche navigates the balance between serving the administration and upholding the Department of Justice's commitment to independent justice.", "vocab": [{"word": "Confirmed", "definition": "Officially approved or validated, especially for an appointment."}, {"word": "Significant", "definition": "Important or notable."}, {"word": "Administration", "definition": "The group of people who manage the government at a particular time."}, {"word": "Chief law enforcement officer", "definition": "The highest-ranking official responsible for enforcing laws."}, {"word": "Independent", "definition": "Not controlled by others; free to make one's own decisions."}, {"word": "Interference", "definition": "The act of getting involved in a situation without being wanted or invited, often causing problems."}, {"word": "Impartial", "definition": "Treating all rivals or disputants equally; fair and unbiased."}]}, "Advanced": {"text": "In a move that underscores the ongoing political tensions surrounding the independence of federal law enforcement, the U.S. Senate has narrowly confirmed Todd Blanche as the nation's new Attorney General. Blanche, a former personal attorney for President Trump, secured the pivotal role following a contentious vote in the Republican-controlled chamber. This confirmation represents a substantial victory for President Trump, signaling a successful implementation of his strategy to align the Department of Justice more closely with the executive branch.\n\nThe Attorney General serves as the chief legal officer of the United States, heading the Department of Justice (DOJ), which is tasked with enforcing federal laws, prosecuting cases, and providing legal counsel to the President and other government entities. Historically, the DOJ has strived to maintain a degree of autonomy from the White House, a principle considered vital for upholding the rule of law and ensuring that justice is administered without political bias or undue influence. This institutional independence is a cornerstone of the American system of checks and balances.\n\nBlanche's confirmation process was marked by intense scrutiny, particularly concerning his prior professional relationship with President Trump. Critics voiced apprehension that his appointment could erode the perceived impartiality of the DOJ, potentially blurring the lines between the President's personal legal interests and the department's broader mandate to serve the public interest. The narrow margin of his confirmation vote reflects these deep-seated concerns among senators, even within the President's own party, regarding the politicization of the nation's top law enforcement agency.\n\nProponents of Blanche's nomination, however, highlighted his extensive legal background and argued that his previous representation of the President should not automatically disqualify him from leading the Justice Department. They contended that Blanche possesses the requisite legal acumen and integrity to fulfill the demanding responsibilities of the Attorney General impartially. For President Trump, the successful confirmation of Blanche fulfills a long-standing objective to appoint an Attorney General who shares his vision for the department and is perceived as loyal to his administration's agenda. This approach contrasts sharply with the traditional expectation that the Attorney General acts as an independent arbiter of justice, rather than a political operative.\n\nAs Attorney General Blanche assumes his critical responsibilities, he will face the formidable challenge of navigating the complex interplay between the executive branch's policy objectives and the DOJ's constitutional obligation to enforce laws equitably. His tenure will undoubtedly be closely watched by legal scholars, political observers, and the public alike, as it will offer a significant barometer of the administration's commitment to the foundational principles of judicial independence and the rule of law in American governance. The implications of this appointment extend beyond the immediate political landscape, potentially reshaping the institutional norms governing the relationship between the White House and the Department of Justice for years to come.", "vocab": [{"word": "Underscores", "definition": "Emphasizes or highlights something."}, {"word": "Contentious", "definition": "Causing or likely to cause an argument; controversial."}, {"word": "Executive branch", "definition": "The part of government responsible for implementing and enforcing the laws (headed by the President)."}, {"word": "Autonomy", "definition": "The right or condition of self-government; independence."}, {"word": "Erode", "definition": "Gradually destroy or be destroyed."}, {"word": "Impartiality", "definition": "The principle of treating all equally; fairness, lack of bias."}, {"word": "Acumen", "definition": "The ability to make good judgments and quick decisions, typically in a particular domain."}, {"word": "Arbiter", "definition": "A person who settles a dispute or has ultimate authority in a matter."}]}}, "questions": [{"q": "Who was confirmed as the new U.S. Attorney General?", "a": "Todd Blanche."}, {"q": "What was a key reason this confirmation was seen as a 'win' for President Trump?", "a": "It aligns with his desire to keep the Justice Department working closely with the White House."}], "id": "a0c7a7a7bf4", "source": "NPR Topics: Politics", "link": "https://www.npr.org/2026/08/08/nx-s1-5925869/gop-controlled-senate-delivers-win-for-trump-with-blanche-confirmation", "published": "2026-08-09T06:19:17+09:00", "category": "politics" const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
