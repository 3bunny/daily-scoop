rs of entertainment across more than 12 Asian languages alongside interactive features, personalized recommendations and new subscription options. The expansion moves beyond a straightforward catalog rollout, introducing audiences in the three markets to a redesigned […]", "vocab": []}, "Intermediate": {"text": "India’s leading streamer JioHotstar has launched internationally in the U.K., Canada and Singapore, bringing its catalog of more than 160,000 hours of entertainment across more than 12 Asian languages alongside interactive features, personalized recommendations and new subscription options. The expansion moves beyond a straightforward catalog rollout, introducing audiences in the three markets to a redesigned […]", "vocab": []}, "Advanced": {"text": "India’s leading streamer JioHotstar has launched internationally in the U.K., Canada and Singapore, bringing its catalog of more than 160,000 hours of entertainment across more than 12 Asian languages alongside interactive features, personalized recommendations and new subscription options. The expansion moves beyond a straightforward catalog rollout, introducing audiences in the three markets to a redesigned […]", "vocab": []}}, "questions": [], "id": "a44016f3695", "source": "Variety", "link": "https://variety.com/2026/tv/news/jiohotstar-uk-canada-singapore-launch-1236848067/", "published": "2026-09-02T08:00:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "China Dissents from G20 Statement on 'Cheap Exports'", "excerpt": "China recently disagreed with other major economies at a G20 meeting over concerns about 'cheap exports' flooding global markets.", "levels": {"Beginner": {"text": "At a recent big meeting called the G20, countries talked about world trade. The G20 is a group of the world's largest economies. Many countries at the meeting were worried about products that are sold very cheaply. They said these \"cheap exports\" from some places are making it hard for other countries' businesses to sell their own goods. This can hurt jobs and companies in those countries.\n\nChina was at this meeting. But China did not agree with a statement that other countries wanted to make. This statement was against these very cheap exports. China's disagreement means that the big countries do not all have the same ideas about how trade should work. It shows there are different views on how countries should sell things to each other. This kind of disagreement can make it harder for countries to work together on trade rules in the future.", "vocab": [{"word": "G20", "definition": "A group of 20 major economies in the world."}, {"word": "exports", "definition": "Products that one country sells to another country."}, {"word": "worried", "definition": "Feeling concerned or anxious about something."}, {"word": "disagreement", "definition": "When people or groups have different opinions or do not agree."}, {"word": "businesses", "definition": "Companies or organizations that sell goods or services."}]}, "Intermediate": {"text": "China recently expressed its dissent from a statement proposed by other G20 nations regarding concerns over 'cheap exports' flooding global markets. The G20, which comprises the world's leading economies, held discussions where several members voiced worries about the impact of unusually low-priced goods on international trade.\n\nThese nations argue that when products are sold at prices significantly below their true cost or market value, it can create unfair competition. This practice, often referred to as 'dumping' in trade terms, can harm local industries in importing countries, leading to job losses and reduced economic activity. Countries like the United States and European Union members have frequently raised concerns about China's manufacturing capacity and its effect on global prices, particularly in sectors like steel, solar panels, and electric vehicles.\n\nChina's refusal to endorse the G20 statement highlights ongoing tensions in global trade. While other nations seek to protect their domestic markets from what they perceive as market-distorting practices, China often emphasizes its competitive advantage and the benefits of its efficient production. This divergence in views makes it challenging for major economic powers to establish unified approaches to global trade regulations and fair market practices, potentially leading to continued trade disputes.", "vocab": [{"word": "dissent", "definition": "To disagree with an official opinion or decision."}, {"word": "comprises", "definition": "To be made up of; to include."}, {"word": "unusually", "definition": "Not normal or typical; in a way that is different from what is expected."}, {"word": "competition", "definition": "The struggle among businesses to attract customers."}, {"word": "endorse", "definition": "To publicly support or approve of something."}, {"word": "divergence", "definition": "The process or state of separating and going in different directions."}]}, "Advanced": {"text": "China has reportedly dissented from a G20 statement that aimed to address concerns over 'cheap exports' inundating global markets. This development, highlighted by comments from officials like Bessent, underscores the persistent friction within the world's leading economies regarding international trade practices and market fairness. The G20, a forum for major industrialized and emerging economies, has increasingly become a platform for discussing the ramifications of global overcapacity and state-backed subsidies.\n\nMany G20 members, particularly Western nations, contend that certain countries, notably China, engage in practices that lead to the export of goods at artificially low prices. This phenomenon, often termed 'dumping,' is seen as a consequence of significant state subsidies and excess production capacity, which can distort global markets. The argument is that these 'cheap exports' create an uneven playing field, making it difficult for industries in importing countries to compete, ultimately leading to factory closures, job losses, and a decline in domestic manufacturing capabilities. Sectors such as steel, aluminum, solar technology, and more recently, electric vehicles, have been at the forefront of these trade disputes.\n\nChina's refusal to align with the proposed G20 statement signals its firm stance on its economic model and trade policies. Beijing often frames its competitive pricing as a natural outcome of efficient production and economies of scale, rather than unfair subsidies or market manipulation. This fundamental disagreement between China's approach to industrial policy and the free-market principles advocated by many G20 members complicates efforts to forge a consensus on global trade rules. Such divergences can lead to increased protectionist measures, retaliatory tariffs, and a fragmentation of the global trading system, posing significant challenges to multilateral cooperation and economic stability. The incident at the G20 meeting reflects the broader geopolitical and economic tensions that continue to shape international relations.", "vocab": [{"word": "dissented", "definition": "Expressed disagreement with a prevailing opinion, decision, or statement, especially in an official context."}, {"word": "inundating", "definition": "Flooding or overwhelming with a large quantity of something, often implying an excessive or problematic amount."}, {"word": "underscores", "definition": "Emphasizes the importance or truth of something; highlights."}, {"word": "ramifications", "definition": "The complex or unwelcome consequences of an action or event, especially when they are not immediately obvious."}, {"word": "contend", "definition": "Assert something as a position in an argument; to argue or debate."}, {"word": "artificially", "definition": "In a way that is not natural or genuine, often implying manipulation or contrivance."}, {"word": "divergences", "definition": "Instances of moving or developing in different directions; differences in opinion, policy, or approach."}, {"word": "multilateral", "definition": "Involving three or more parties, especially governments or international organizations."}]}}, "questions": [{"q": "What specific type of goods were G20 members concerned about, and what country dissented from the statement regarding them?", "a": "G20 members were concerned about 'cheap exports' or 'low-priced goods' flooding global markets. China dissented from the statement regarding these exports."}, {"q": "According to the articles, what are some potential negative impacts of 'cheap exports' on importing countries?", "a": "Potential negative impacts include unfair competition, harm to local industries, job losses, reduced economic activity, factory closures, and a decline in domestic manufacturing capabilities."}], "id": "a5121d8447a", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMigwFBVV95cUxPNW1KTnpvMXFBWjZzMFlqYjEwNWFsM2dWcXJrbDdJUkVFY0JiVk9BTERmZTlNWkNuNDlIa0k3aDRqVjZJbTM4X29LQm5YdTBucUd4MEMwRWZwY1dhRUozMVAzT0lTLVUzaHRobnRTVGJqTWVscHhYZ1czQ2hzeWhmd3ZCRdIBiAFBVV95cUxNeXlXMTVEMHcxYzJhRzl1X2Q4Qmc2dGl3SVJlMTAzWVNmcDNUazZfTjBzclRRNjlMVUtva1ROUUJYSFlYWG55ZWx4NVJfVnBOSjY1XzFPZVh4MFFMNVpROWRKeWhraW5HS3BxSmJ4Nk43eU5rVjM4YkZiaUdSSXdrNEtjQ0pwM3hN?oc=5", "published": "2026-09-02T08:33:42+09:00", "category": "business", "category_title": "Business"}, {"headline": "Self-Flying Planes: Crop Sprayers Lead the Way to Autonomous Skies", "excerpt": "Pilot-free aircraft, especially those used for crop spraying, are showing how self-flying technology could change the future of aviation.", "levels": {"Beginner": {"text": "Self-flying planes are coming. These planes fly without a pilot inside. They are called 'autonomous' aircraft. One important use for these planes is spraying crops. Farmers use them to spray fields with water or special liquids. This helps plants grow well.\n\nThese crop-spraying planes are showing us how pilot-free flying can work safely. They are like the first step to a future where more planes fly themselves.\n\nRight now, most planes still have pilots. But technology is getting better. Soon, we might see more self-flying planes in different jobs. They could deliver packages or even carry people one day.\n\nThe idea is to make flying safer and more efficient. Without a pilot, planes might fly more directly. They could also fly more often. This new way of flying could change how we travel and move goods around the world. Crop-spraying drones are leading the way for this big change in the sky.", "vocab": [{"word": "Pilot", "definition": "A person who flies an aircraft."}, {"word": "Autonomous", "definition": "Able to work or fly by itself without a person controlling it."}, {"word": "Crops", "definition": "Plants grown by farmers, like corn or wheat."}, {"word": "Spray", "definition": "To send out a liquid in small drops."}, {"word": "Efficient", "definition": "Doing something well without wasting time or energy."}, {"word": "Technology", "definition": "The use of science for practical purposes, like making machines."}]}, "Intermediate": {"text": "The concept of self-flying planes, or autonomous aircraft, is moving from science fiction to reality. While commercial passenger flights still rely on human pilots, a significant advancement is occurring in specialized areas, particularly with crop-spraying aircraft. These pilot-free drones are demonstrating the practical capabilities and potential of autonomous flight.\n\nFarmers are increasingly using autonomous aircraft to spray their fields. These drones can apply water, fertilizers, or pesticides precisely, often reaching areas that are difficult for traditional manned aircraft or ground vehicles. This precision helps reduce waste and can improve crop yields. More importantly, it removes human pilots from potentially hazardous low-altitude flying conditions, enhancing safety.\n\nThese crop-spraying drones are at the forefront of developing and testing autonomous flight technology. They operate in controlled environments, which makes them ideal for refining the systems needed for pilot-free operation. The data and experience gained from these operations are crucial for the broader adoption of autonomous aviation.\n\nThe future implications of self-flying planes extend beyond agriculture. Proponents suggest that autonomous flight could lead to safer skies by eliminating human error, which is a factor in many accidents. It could also make air travel more efficient and potentially less expensive by optimizing flight paths and reducing operational costs.\n\nHowever, challenges remain. Regulators need to establish clear rules for autonomous aircraft, and public acceptance is vital, especially for passenger transport. The technology must also prove its reliability and security in diverse conditions. Nevertheless, the success of autonomous crop-spraying planes indicates a promising trajectory for the transformation of aviation.", "vocab": [{"word": "Autonomous", "definition": "Operating independently without human control."}, {"word": "Specialized", "definition": "Designed or developed for a particular purpose or area."}, {"word": "Pesticides", "definition": "Chemicals used to destroy insects or other organisms harmful to cultivated plants or animals."}, {"word": "Hazardous", "definition": "Dangerous or risky."}, {"word": "Forefront", "definition": "The leading or most important position or place."}, {"word": "Proponents", "definition": "People who support an idea or plan."}, {"word": "Trajectory", "definition": "The path followed by a moving object; here, a path of development."}]}, "Advanced": {"text": "The long-held vision of autonomous aircraft, once confined to the realm of science fiction, is steadily transitioning into a tangible reality. While the prospect of pilot-free commercial passenger jets remains a distant, albeit increasingly plausible, future, the groundwork for this revolutionary shift is being meticulously laid by specialized applications, most notably in the agricultural sector. Autonomous crop-spraying aircraft are not merely novelties; they are pioneering the operational protocols and technological advancements that will underpin broader autonomous aviation.\n\nThese sophisticated drones are transforming agricultural practices by offering unparalleled precision in the application of water, fertilizers, and pesticides. Equipped with advanced GPS, sensors, and artificial intelligence, they can navigate complex terrains, identify specific areas requiring treatment, and dispense substances with minimal waste. This targeted approach not only enhances crop yields and reduces environmental impact but also significantly mitigates the inherent risks associated with low-altitude flying for human pilots, thereby improving safety for agricultural workers.\n\nThe success of these crop-spraying operations is critical. They serve as real-world laboratories for refining the intricate systems required for truly autonomous flight, including obstacle avoidance, real-time decision-making, and robust communication protocols. The data gathered from thousands of hours of flight time in diverse environmental conditions provides invaluable insights for engineers and regulators alike, accelerating the development cycle for more complex autonomous platforms.\n\nBeyond agriculture, the implications of fully autonomous aviation are profound. Advocates contend that removing human error, a primary contributor to aviation accidents, could dramatically enhance air safety. Furthermore, autonomous systems promise greater operational efficiency through optimized flight paths, reduced fuel consumption, and the potential for continuous operation without crew rest requirements. This could lead to substantial cost savings for airlines and logistics companies, potentially making air travel and cargo transport more accessible and affordable.\n\nHowever, the path to widespread adoption is fraught with significant challenges. Regulatory frameworks worldwide are still grappling with how to certify and oversee autonomous aircraft, particularly concerning air traffic control integration and liability in the event of an incident. Public perception and acceptance also represent a formidable hurdle, especially for passenger transport, where trust in technology must supersede traditional reliance on human oversight. Cybersecurity concerns, ensuring these systems are impervious to malicious attacks, are paramount.\n\nDespite these obstacles, the trajectory is clear. The incremental successes in niche applications like crop spraying are paving the way for a phased introduction of autonomous capabilities across various aviation sectors, from cargo delivery and surveillance to urban air mobility. The transformation of the skies, spearheaded by these pilot-free pioneers, appears not a question of if, but when.", "vocab": [{"word": "Tangible", "definition": "Perceptible by touch; clear and definite; real."}, {"word": "Meticulously", "definition": "In a way that shows great attention to detail; very carefully and precisely."}, {"word": "Unparalleled", "definition": "Having no equal or rival; exceptional."}, {"word": "Mitigates", "definition": "Makes something less severe, serious, or painful."}, {"word": "Profound", "definition": "Very great or intense; having or showing great knowledge or insight."}, {"word": "Fraught", "definition": "Filled with or destined to result in (something undesirable)."}, {"word": "Formidable", "definition": "Inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "Impervious", "definition": "Not allowing fluid to pass through; unable to be affected by."}]}}, "questions": [{"q": "What kind of self-flying aircraft are mentioned as leading the way in pilot-free flying?", "a": "Autonomous crop-spraying aircraft are mentioned as leading the way in pilot-free flying."}, {"q": "Besides crop spraying, what are some potential benefits or future uses of self-flying planes mentioned in the articles?", "a": "Self-flying planes could make flying safer and more efficient, deliver packages, carry people, optimize flight paths, reduce operational costs, and be used for cargo delivery, surveillance, and urban air mobility."}], "id": "a3f3291157d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c1l123mmrg7o?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:27:35+09:00", "category": "business", "category_title": "Business"}, {"headline": "Self-Flying Planes: Autonomous Aircraft Lead Aviation's Future", "excerpt": "Autonomous crop-spraying aircraft are pioneering pilot-free flight, demonstrating how self-flying technology could transform the future of aviation.", "levels": {"Beginner": {"text": "Imagine planes flying without a pilot inside. This is happening now! These are called 'self-flying planes' or 'autonomous aircraft'.\nRight now, small self-flying planes are very busy helping farmers. They spray crops with water or special liquids. This job used to be done by pilots in regular planes.\nUsing self-flying planes for crop spraying has many good points. First, it can be safer. Pilots don't have to fly low over fields, which can be a risky job. These autonomous planes can do the work without putting a human pilot in danger.\nSecond, these planes can work very precisely. They use special technology to spray only where needed. This saves money because less liquid is wasted. It also helps the environment by using fewer chemicals overall.\nThese special planes are showing us a new way to fly. They are like a first step for future planes that might fly people or deliver packages without a pilot. It's an exciting change for the sky and how we think about flying!", "vocab": [{"word": "Pilot", "definition": "A person who flies an aircraft."}, {"word": "Autonomous", "definition": "Able to work by itself, without human control."}, {"word": "Crops", "definition": "Plants grown by farmers for food."}, {"word": "Spray", "definition": "To send out small drops of liquid."}, {"word": "Precisely", "definition": "Exactly and carefully."}, {"word": "Environment", "definition": "The natural world around us."}]}, "Intermediate": {"text": "The future of aviation is taking flight, not with human pilots at the controls, but with autonomous aircraft. These self-flying planes are currently making significant advancements, particularly in the agricultural sector. Crop-spraying drones and aircraft are leading the way, demonstrating the practical applications and potential of pilot-free technology.\nTraditionally, crop spraying has been a hazardous task for human pilots, requiring low-altitude flights over uneven terrain. Autonomous aircraft eliminate this risk by performing these operations without a person on board. Equipped with advanced GPS and sensor technology, these planes can navigate fields with remarkable accuracy. They can identify specific areas requiring treatment, applying pesticides or fertilizers precisely where needed. This targeted approach not only reduces the amount of chemicals used, leading to environmental benefits, but also improves efficiency and lowers operational costs for farmers.\nThe success of autonomous crop-spraying is paving the way for broader adoption of pilot-free aviation. While passenger flights without pilots are still a distant prospect, the technology is being explored for cargo delivery, surveillance, and other specialized tasks. The development in agriculture serves as a crucial testing ground, allowing engineers to refine systems for navigation, safety protocols, and emergency responses.\nHowever, the widespread integration of autonomous aircraft faces challenges. Regulatory frameworks need to be established to ensure safety standards are met. Public acceptance is another key factor, as people become accustomed to the idea of flying in or alongside pilot-free vehicles. Despite these hurdles, the progress in autonomous crop-spraying suggests a transformative era for the skies, promising safer, more efficient, and environmentally friendly aerial operations.", "vocab": [{"word": "Aviation", "definition": "The activity of flying aircraft."}, {"word": "Autonomous", "definition": "Operating independently without human control."}, {"word": "Sector", "definition": "A part or division of an area or activity."}, {"word": "Hazardous", "definition": "Dangerous or risky."}, {"word": "Terrain", "definition": "A stretch of land, especially with regard to its physical features."}, {"word": "Precisely", "definition": "With great accuracy or exactness."}, {"word": "Regulatory", "definition": "Relating to the control or supervision of something by rules."}]}, "Advanced": {"text": "The aerospace industry is on the cusp of a profound transformation, spearheaded by the burgeoning field of autonomous aircraft. While the concept of pilotless planes might evoke images of science fiction, practical applications are already taking flight, most notably within the agricultural sector. Autonomous crop-spraying aircraft are not merely experimental prototypes; they are operational workhorses, demonstrating the tangible benefits and robust capabilities of pilot-free technology, thereby setting a precedent for wider adoption across various aviation domains.\n\nHistorically, aerial crop dusting and spraying have been among the most perilous tasks in aviation, demanding exceptional skill and exposing pilots to significant risks, including low-altitude flight, proximity to obstacles, and exposure to chemicals. Autonomous systems fundamentally mitigate these dangers. Equipped with sophisticated GPS, LiDAR, and advanced sensor arrays, these aircraft navigate agricultural landscapes with unparalleled precision. Integrated with artificial intelligence and machine learning algorithms, they can analyze real-time data to identify specific areas requiring treatment, optimizing the application of pesticides, fertilizers, or water. This targeted approach dramatically reduces chemical runoff, minimizes environmental impact, and enhances resource efficiency, translating into substantial cost savings for farmers and promoting sustainable agricultural practices.\n\nThe success witnessed in agricultural aviation serves as a critical proving ground for the maturation of autonomous flight technology. It allows engineers to rigorously test and refine complex systems for navigation, obstacle avoidance, redundant safety protocols, and emergency management in real-world, dynamic environments. The data and insights gleaned from these operations are invaluable for developing the robust certification standards and operational guidelines that will be essential for future applications.\n\nLooking beyond agriculture, the implications for the broader aviation ecosystem are immense. While fully autonomous passenger airliners remain a long-term aspiration, the technology is rapidly advancing for cargo logistics, surveillance, infrastructure inspection, and even urban air mobility. The transition to pilot-free operations promises to enhance safety by eliminating human error, increase operational efficiency by allowing for continuous flight cycles, and potentially reduce operational costs.\n\nHowever, the path to widespread integration is fraught with significant challenges. Establishing comprehensive regulatory frameworks that address air traffic management, cybersecurity, and liability is paramount. Public perception and trust represent another formidable hurdle; convincing the populace of the inherent safety and reliability of autonomous flight systems will require transparent communication and a flawless safety record. Ethical considerations, such as the role of human oversight in critical situations and the potential impact on aviation employment, also demand careful deliberation.\n\nDespite these complexities, the pioneering role of autonomous crop-spraying aircraft underscores a pivotal shift. They are not just spraying crops; they are cultivating the future of aviation, demonstrating that pilot-free flight is not only feasible but also offers compelling advantages that could revolutionize how we utilize our skies.", "vocab": [{"word": "Profound", "definition": "Very great or intense; having a deep impact or effect."}, {"word": "Spearheaded", "definition": "Led or initiated (an attack, movement, or project)."}, {"word": "Burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "Perilous", "definition": "Full of danger or risk; hazardous."}, {"word": "Mitigate", "definition": "To make less severe, serious, or painful."}, {"word": "Unparalleled", "definition": "Having no equal or comparison; exceptional or unmatched."}, {"word": "Redundant", "definition": "Not needed or useful; (in engineering) designed to be duplicated to ensure continued operation in case of failure."}, {"word": "Fraught", "definition": "Filled with or destined to result in (something undesirable)."}]}}, "questions": [{"q": "What kind of autonomous aircraft are currently leading the way in pilot-free flying?", "a": "Autonomous crop-spraying aircraft."}, {"q": "Name one benefit of using autonomous aircraft for crop spraying.", "a": "It can be safer for pilots, more precise in spraying, saves money, or helps the environment."}], "id": "a3f3291157d", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c1l123mmrg7o?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:27:35+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Smart Tips to Save Money When Eating Out", "excerpt": "With restaurant prices rising, many people are looking for clever ways to enjoy meals out without spending too much money.", "levels": {"Beginner": {"text": "Eating out at restaurants can be fun, but it is also getting more expensive. Many people want to enjoy a meal outside their home without spending too much money. Luckily, there are smart ways to save.\n\nOne good way is to look for \"soft launches.\" This is when a new restaurant opens. They often give discounts to attract new customers. You can get a cheaper meal and try a new place.\n\nAnother tip is to eat at special times. Sometimes, restaurants have cheaper prices for lunch instead of dinner. Or they might have \"early bird\" deals if you eat before the busiest time. Eating later in the evening, after the main rush, can also sometimes offer deals.\n\nYou can also look for special offers online. Many websites and apps give discount codes for restaurants. Joining a restaurant's email list can also get you special deals and vouchers. Some restaurants have loyalty programs where you earn points for free food.\n\nBy planning a little, you can still enjoy tasty meals out and save your money. It's all about being smart before you go.", "vocab": [{"word": "expensive", "definition": "costs a lot of money."}, {"word": "discounts", "definition": "lower prices than usual."}, {"word": "attract", "definition": "to make someone interested in something."}, {"word": "deals", "definition": "special offers or agreements."}, {"word": "vouchers", "definition": "pieces of paper or codes that give you a discount."}, {"word": "loyalty programs", "definition": "systems where you get rewards for using a service many times."}]}, "Intermediate": {"text": "The pleasure of dining out has become increasingly costly for many consumers. With inflation impacting food prices, energy bills, and staff wages, restaurants are often forced to raise their menu prices. This trend means that enjoying a meal away from home now requires more careful planning to manage expenses.\n\nHowever, there are several effective strategies diners can employ to reduce the cost of eating out. One popular method involves seeking out \"soft launches.\" These are trial periods for new restaurants, during which they often offer significant discounts on food to gather feedback and build a customer base before their official grand opening. This presents a great opportunity to sample new cuisine at a reduced price.\n\nAnother smart approach is to consider dining during off-peak hours. Many establishments offer \"early bird\" menus or lunch specials that are considerably cheaper than their dinner counterparts. Similarly, some restaurants provide late-sitting deals, where prices are lower for tables booked later in the evening, after the main rush.\n\nLeveraging technology can also lead to savings. Many online platforms and restaurant-specific apps provide exclusive discount codes, vouchers, or \"buy-one-get-one-free\" offers. Signing up for restaurant newsletters or loyalty programs can also unlock personalized deals and accumulate points that can be redeemed for future meals or discounts. Furthermore, some restaurants allow customers to \"bring your own bottle\" (BYOB) for a small corkage fee, saving significantly on drink costs.\n\nBy being strategic and doing a little research, individuals can continue to enjoy the social and culinary experience of dining out without breaking the bank.", "vocab": [{"word": "inflation", "definition": "a general increase in prices and fall in the purchasing value of money."}, {"word": "consumers", "definition": "people who buy goods and services."}, {"word": "strategies", "definition": "plans of action designed to achieve a goal."}, {"word": "establishments", "definition": "businesses or organizations, often referring to restaurants or hotels."}, {"word": "off-peak hours", "definition": "times when a service is less busy or in demand."}, {"word": "leveraging", "definition": "using something to maximum advantage."}, {"word": "redeemed", "definition": "exchanged for money or goods/services."}]}, "Advanced": {"text": "The escalating cost of living has made the simple pleasure of dining out a luxury increasingly out of reach for many households. Restaurants themselves are grappling with a confluence of economic pressures, including soaring ingredient costs due to supply chain disruptions and climate change, rising energy prices, and the necessity of offering competitive wages to attract and retain staff. These factors inevitably translate into higher menu prices, prompting consumers to seek innovative ways to mitigate expenses without sacrificing the social and culinary experience.\n\nSavvy diners can employ a range of sophisticated strategies to navigate this challenging landscape. A prime opportunity often arises during \"soft launches\" – the preliminary operational phase of new eateries. During this period, establishments frequently offer substantial introductory discounts, sometimes up to 50% off food, to fine-tune their service, gather crucial customer feedback, and generate initial buzz before their official grand opening. This allows patrons to experience novel culinary concepts at a significantly reduced outlay.\n\nTiming is another critical element. Opting for off-peak dining, such as early bird specials or lunch menus, can yield considerable savings compared to prime dinner service. Many restaurants also introduce late-sitting deals, providing incentives for bookings later in the evening when the initial rush has subsided. Additionally, some venues offer fixed-price \"prix fixe\" menus or tasting menus that, while seemingly expensive, can offer better value than ordering à la carte, especially if they include multiple courses or wine pairings.\n\nFurthermore, digital engagement is paramount. Subscribing to restaurant newsletters, following social media channels, and utilizing dedicated dining apps often unlocks exclusive promotional codes, two-for-one offers, or loyalty points that accrue towards future discounts or complimentary meals. Some establishments permit \"Bring Your Own Bottle\" (BYOB) policies, charging a modest corkage fee, which can drastically reduce the overall bill given the typically high mark-ups on alcoholic beverages. Exploring restaurant aggregators and review sites can also reveal hidden gems offering excellent value.\n\nUltimately, a proactive and informed approach to dining out allows individuals to continue indulging in gastronomic experiences. By strategically planning visits, leveraging available promotions, and understanding the dynamics of restaurant pricing, consumers can effectively balance their desire for culinary exploration with their budgetary constraints.", "vocab": [{"word": "escalating", "definition": "increasing rapidly."}, {"word": "confluence", "definition": "a coming together of two or more things."}, {"word": "mitigate", "definition": "to make something less severe, serious, or painful."}, {"word": "patrons", "definition": "customers, especially of a restaurant or hotel."}, {"word": "outlay", "definition": "an amount of money spent on something."}, {"word": "culinary", "definition": "relating to cooking or the kitchen."}, {"word": "paramount", "definition": "more important than anything else."}, {"word": "gastronomic", "definition": "relating to the art or science of good eating."}]}}, "questions": [{"q": "What is one reason why eating out has become more expensive?", "a": "Eating out has become more expensive because of rising food prices, energy costs, and staff wages."}, {"q": "Name three different strategies people can use to save money when dining at restaurants.", "a": "Three strategies people can use are looking for \"soft launches\" at new restaurants, dining during off-peak hours (like lunch or early bird specials), and using online discount codes or loyalty programs."}], "id": "a70e2ea80c0", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c2dy8kz867go?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:26:38+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Jury Faces Complex Choices in Lindsay Clancy Murder Trial", "excerpt": "A jury faces complex choices in the trial of Lindsay Clancy, accused of killing her three children, with more than just two possible verdicts.", "levels": {"Beginner": {"text": "Lindsay Clancy, a former nurse, is on trial. She is accused of a very sad crime: killing her three young children. This happened in Duxbury, Massachusetts. The children were Cora, Dawson, and Callan. They were only five, three, and eight months old.\n\nNow, a group of people called a jury must decide what happened. This is a very important job. Usually, a jury decides if someone is \"guilty\" or \"not guilty.\" But in this case, the jury has more choices. They have five different options to pick from.\n\nThese options are important because they consider different things. For example, the defense lawyers might say that Ms. Clancy was very sick in her mind when the sad events happened. This is called a mental illness defense. The jury will need to think about all the evidence. They will listen to many people, like doctors and witnesses. Their decision will be very difficult. It will decide what happens next for Lindsay Clancy.", "vocab": [{"word": "accused", "definition": "said to have done something wrong."}, {"word": "crime", "definition": "an illegal act."}, {"word": "jury", "definition": "a group of people who decide if someone is guilty or not guilty in court."}, {"word": "options", "definition": "choices."}, {"word": "defense", "definition": "the lawyers who try to show that someone is not guilty."}, {"word": "mental illness", "definition": "a sickness of the mind."}]}, "Intermediate": {"text": "The trial of Lindsay Clancy, a former nurse from Duxbury, Massachusetts, is currently underway, drawing significant public attention. She stands accused of the tragic murders of her three young children: five-year-old Cora, three-year-old Dawson, and eight-month-old Callan. The devastating events occurred in January 2023, sending shockwaves through the community and raising difficult questions about maternal mental health.\n\nA jury has been tasked with the profound responsibility of determining Clancy's fate. Unlike many criminal trials where the primary decision is a straightforward \"guilty\" or \"not guilty\" verdict, this jury faces a more complex set of choices. They are presented with five distinct options, reflecting the nuanced legal considerations involved in cases where a defendant's mental state is a central factor.\n\nThe defense team is expected to argue that Clancy was suffering from severe mental illness, possibly postpartum psychosis, at the time of the incident. This severe condition can cause delusions, hallucinations, and impaired judgment, leading individuals to act in ways they normally wouldn't. If the jury accepts this argument, it could lead to a verdict of \"not guilty by reason of insanity\" or a similar finding. Such a verdict would typically mean Clancy would receive mandatory psychiatric treatment in a secure facility rather than a traditional prison sentence.\n\nConversely, the prosecution aims to prove that Clancy acted with premeditation and criminal intent, arguing for a conviction of murder. The jury will meticulously review all evidence presented, including testimonies from medical experts, police officers, and other witnesses. Their decision will hinge on their interpretation of Clancy's state of mind and actions at the time of the alleged crimes. This difficult verdict will have significant implications for her future and for how justice is served in this deeply distressing case, balancing accountability with mental health considerations.", "vocab": [{"word": "underway", "definition": "happening now."}, {"word": "accused", "definition": "formally charged with a crime."}, {"word": "profound", "definition": "very great or intense; deep."}, {"word": "nuanced", "definition": "subtle differences in meaning or expression."}, {"word": "postpartum psychosis", "definition": "a severe mental illness that can affect new mothers, causing delusions and hallucinations."}, {"word": "premeditation", "definition": "planning a crime beforehand."}, {"word": "meticulously", "definition": "with great attention to detail."}]}, "Advanced": {"text": "The high-profile trial of Lindsay Clancy, a former labor and delivery nurse from Duxbury, Massachusetts, has commenced, captivating national attention due to the profoundly tragic nature of the allegations. Clancy stands accused of the murders of her three young children – Cora, five; Dawson, three; and eight-month-old Callan – in January 2023. This devastating incident not only shattered a family but also ignited a broader societal discourse on the complexities of maternal mental health and the legal system's capacity to address such harrowing circumstances.\n\nCentral to this judicial proceeding is the jury's formidable task: to navigate a spectrum of five distinct verdict options, moving beyond the binary choice of \"guilty\" or \"not guilty\" that characterizes many criminal cases. This expanded range of choices underscores the intricate legal framework designed to accommodate situations where a defendant's mental state at the time of the alleged offense is a pivotal consideration.\n\nThe defense is anticipated to mount a robust argument centered on severe mental illness, specifically postpartum psychosis. This rare but devastating condition, which can manifest rapidly after childbirth, is characterized by extreme confusion, delusions, hallucinations, and impaired reality testing. Should the jury be persuaded that Clancy was legally insane – meaning she lacked the capacity to understand the wrongfulness of her actions or to conform her conduct to the law – a verdict of \"not guilty by reason of insanity\" could be rendered. Such an outcome would typically mandate her commitment to a secure psychiatric facility for treatment, rather than a conventional penal sentence, reflecting a legal philosophy that distinguishes between culpability and mental incapacitation.\n\nConversely, the prosecution is poised to contend that Clancy acted with premeditation and malicious intent, seeking convictions for murder. Their strategy will likely involve presenting evidence to demonstrate a rational thought process and a deliberate course of action, despite any potential mental health struggles. The jury will be tasked with meticulously evaluating a vast array of evidence, including extensive expert testimonies from psychiatrists and psychologists, forensic analyses, and accounts from first responders and other witnesses.\n\nThe deliberations will undoubtedly be emotionally taxing, requiring jurors to grapple with deeply disturbing facts while applying complex legal standards. Their ultimate decision will hinge on whether the prosecution proves criminal intent beyond a reasonable doubt, or if the defense successfully establishes that Clancy's mental state precluded such intent under the law. This verdict will not only determine the trajectory of Lindsay Clancy's life but will also contribute to the ongoing societal dialogue regarding justice, accountability, and the compassionate treatment of severe mental illness within the criminal justice system.", "vocab": [{"word": "commenced", "definition": "began; started."}, {"word": "captivating", "definition": "holding one's attention completely; fascinating."}, {"word": "profoundly", "definition": "deeply or intensely."}, {"word": "allegations", "definition": "claims or assertions that someone has done something illegal or wrong, typically without proof."}, {"word": "discourse", "definition": "written or spoken communication or debate."}, {"word": "harrowing", "definition": "acutely distressing; extremely disturbing or frightening."}, {"word": "formidable", "definition": "inspiring fear or respect through being impressively large, powerful, intense, or capable."}, {"word": "binary", "definition": "relating to, composed of, or involving two things."}, {"word": "postpartum psychosis", "definition": "a severe mental illness that can affect new mothers, causing delusions and hallucinations."}, {"word": "culpability", "definition": "responsibility for a fault or wrong; blame."}, {"word": "precluded", "definition": "prevented from happening or made impossible."}, {"word": "trajectory", "definition": "the path or course that something or someone is following."}]}}, "questions": [{"q": "What is Lindsay Clancy accused of?", "a": "Lindsay Clancy is accused of murdering her three young children."}, {"q": "Why does the jury in this trial have more than just two options (guilty/not guilty)?", "a": "The jury has more options because the defendant's mental state at the time of the alleged crime is a central factor, allowing for considerations like a mental illness defense."}], "id": "a76a5a1cfd5", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c93vgv4kr49o?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:17:10+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Think Tank Suggests Middle-Class Tax Rise for UK Defence Spending", "excerpt": "A UK think tank proposes raising taxes on middle earners to fund higher defence spending, a move supported by former Chancellor John Healey.", "levels": {"Beginner": {"text": "A group called the Resolution Foundation, which studies public money, says the UK needs to spend more on defence. To do this, they suggest that people who earn a middle amount of money might need to pay more taxes. This idea comes after John Healey, a politician, said the government was not spending enough on defence. Mr. Healey even left his job in June because he felt defence spending was too low. The Resolution Foundation says that the UK's taxes on people's earnings are lower than in many other countries. They believe that if the UK wants to have a stronger military, it needs to find more money. Raising taxes on middle earners is one way they think the government could get this money. This would mean that people earning an average salary would see a small increase in the amount of tax they pay. The money would then go towards making the country's defence stronger.", "vocab": [{"word": "defence", "definition": "Protecting a country from attacks."}, {"word": "suggest", "definition": "To offer an idea or plan."}, {"word": "earners", "definition": "People who work and get paid money."}, {"word": "taxes", "definition": "Money people pay to the government."}, {"word": "military", "definition": "The armed forces of a country."}, {"word": "salary", "definition": "The money a person gets paid for their job."}]}, "Intermediate": {"text": "A prominent UK think tank, the Resolution Foundation, has put forward a proposal to increase defence spending by raising taxes on middle-income earners. The organization argues that the United Kingdom's current 'tax wedge' – the total amount of tax paid on income by employees and employers – is relatively low compared to other major economies. This low tax burden, they suggest, makes it difficult to fund ambitious defence goals without significant changes.\n\nThe recommendation comes as the UK government faces pressure to boost its military capabilities amidst evolving global security challenges. John Healey, a key figure in the Labour Party and former Chancellor, has been a vocal advocate for increased defence funding. He notably resigned from Keir Starmer's shadow government in June, citing the then-Prime Minister's perceived failure to adequately fund the nation's defence. Healey's stance highlights a growing concern within political circles about the adequacy of current defence budgets.\n\nThe Resolution Foundation's analysis indicates that if the UK genuinely intends to significantly enhance its defence capabilities, it must consider politically challenging options for revenue generation. Raising taxes on middle earners, while potentially unpopular, is presented as a realistic mechanism to achieve the necessary financial uplift. This approach would broaden the tax base, ensuring that the burden of increased defence investment is shared more widely across the population, rather than relying solely on other, potentially less stable, funding sources.", "vocab": [{"word": "prominent", "definition": "Important and well-known."}, {"word": "proposal", "definition": "A plan or suggestion put forward for consideration."}, {"word": "tax wedge", "definition": "The difference between what an employer pays for an employee and what the employee receives in net pay, including all taxes."}, {"word": "advocate", "definition": "A person who publicly supports or recommends a particular cause or policy."}, {"word": "adequately", "definition": "In a way that is sufficient or suitable for a particular purpose."}, {"word": "mechanism", "definition": "A process or system that is used to achieve a particular result."}, {"word": "revenue generation", "definition": "The process of creating income for a government or organization."}]}, "Advanced": {"text": "The Resolution Foundation, a respected UK think tank, has issued a stark recommendation: the United Kingdom must contemplate a tax increase on middle earners to adequately finance its escalating defence ambitions. This counsel emerges amidst a broader debate regarding the sustainability of the nation's public finances and its commitment to national security in an increasingly volatile geopolitical landscape. The think tank's analysis posits that the UK's 'tax wedge' – the cumulative burden of income tax, national insurance contributions, and employer social security contributions – remains comparatively low when benchmarked against other advanced economies, thereby limiting fiscal headroom for significant new spending commitments.\n\nThis call to action resonates with the long-standing concerns articulated by figures such as John Healey, a prominent Labour Party politician and former Chancellor. Healey's principled resignation from Keir Starmer's shadow cabinet in June underscored his conviction that the then-Prime Minister's administration was failing to allocate sufficient resources to defence. His departure highlighted the political salience of defence funding and the growing consensus across the political spectrum that current expenditure levels may be insufficient to meet contemporary threats and international obligations.\n\nThe Resolution Foundation contends that relying on existing revenue streams or marginal adjustments will prove insufficient to bridge the funding gap required for a substantial uplift in defence capabilities. They argue that a broad-based approach, specifically targeting middle earners, is a pragmatic, albeit politically challenging, necessity. Such a move would broaden the tax base and ensure a more equitable distribution of the financial responsibility for national security, moving beyond the traditional reliance on austerity measures or targeted levies. The implications of such a policy are significant, potentially impacting household disposable incomes and sparking considerable public and political debate. However, the think tank frames it as an unavoidable reality if the UK is serious about bolstering its military strength and fulfilling its role on the global stage, suggesting that the era of low taxation may need to be re-evaluated in light of evolving strategic imperatives.", "vocab": [{"word": "stark", "definition": "Severe or bare in appearance or outline; sharply clear and uncompromising."}, {"word": "contemplate", "definition": "To look thoughtfully for a long time at; to think about deeply and at length."}, {"word": "escalating", "definition": "Increasing rapidly in intensity or magnitude."}, {"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "posits", "definition": "Assumes as a fact; puts forward as a basis of argument."}, {"word": "fiscal headroom", "definition": "The amount of financial flexibility a government has to increase spending or cut taxes without jeopardizing its financial stability."}, {"word": "salience", "definition": "The quality of being particularly noticeable or important; prominence."}, {"word": "pragmatic", "definition": "Dealing with things sensibly and realistically in a way that is based on practical rather than theoretical considerations."}]}}, "questions": [{"q": "What is the main suggestion made by the Resolution Foundation regarding UK defence spending?", "a": "The Resolution Foundation suggests that the UK should raise taxes on middle earners to fund significantly higher defence spending."}, {"q": "Why did John Healey resign from Keir Starmer's government in June?", "a": "John Healey resigned because he believed the government was failing to adequately fund defence."}], "id": "ab4b8ef963f", "source": "Politics | The Guardian", "link": "https://www.theguardian.com/politics/2026/sep/02/fund-defence-spending-from-tax-rise-on-middle-earners-thinktank-tells-healey", "published": "2026-09-02T08:01:16+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Camara's £47.1m Chelsea Transfer Collapses, Stays at Monaco", "excerpt": "Senegalese midfielder Lamine Camara will remain at Monaco after his significant £47.1 million transfer to Chelsea collapsed, a major development in the football world.", "levels": {"Beginner": {"text": "Lamine Camara is a football player. He plays in the middle of the field. He is from Senegal. Camara plays for a team called Monaco. Monaco is a club in France.\n\nChelsea is another big football team. Chelsea plays in England. They wanted Lamine Camara to play for them. Chelsea offered a lot of money for him. They offered £47.1 million.\n\nBut the move did not happen. The deal collapsed. This means Camara will not go to Chelsea. He will stay with his team, Monaco.\n\nSometimes, football players want to change teams. This is called a transfer. Clubs agree on a price. Then the player agrees. But sometimes, things go wrong. The deal stops.\n\nFor Lamine Camara, his transfer to Chelsea stopped. He will keep playing for Monaco. Fans of both teams might be surprised. Chelsea fans might be sad. Monaco fans might be happy he is staying. It is a big story in football news.", "vocab": [{"word": "player", "definition": "A person who plays a sport."}, {"word": "team", "definition": "A group of people who play a sport together."}, {"word": "club", "definition": "Another word for a sports team."}, {"word": "offered", "definition": "Said they would give something, like money."}, {"word": "collapsed", "definition": "Failed or stopped working."}, {"word": "transfer", "definition": "When a sports player moves from one team to another."}]}, "Intermediate": {"text": "Senegalese midfielder Lamine Camara will remain with French club Monaco after his significant £47.1 million transfer to English Premier League side Chelsea collapsed. The highly anticipated move, which had been widely reported across football news outlets, will no longer proceed, meaning Camara will continue to play in France's top division, Ligue 1.\n\nCamara, a 20-year-old talent known for his dynamic play in the midfield, was expected to make a high-profile switch to Stamford Bridge, Chelsea's home ground. Chelsea, a club renowned for its substantial spending in the transfer market, had reportedly agreed on a substantial fee with Monaco for the young player. This potential acquisition was seen by many as part of Chelsea's strategy to invest in promising young talent to build a strong squad for the future, especially given the competitive nature of the Premier League.\n\nHowever, for reasons not fully disclosed, the deal could not be finalized. Football transfers often involve complex negotiations between the buying club, the selling club, and the player's representatives. Many factors can lead to a deal collapsing, such as disagreements over personal terms, issues arising during the player's medical examination, or last-minute changes in club strategy or financial terms. In this instance, the specific reasons for the breakdown have not been publicly detailed, but the outcome is clear: Camara will not be joining Chelsea.\n\nThis development will undoubtedly be a major talking point for fans and pundits alike. Chelsea supporters might express disappointment, as the club had seemingly identified Camara as a key target to strengthen their midfield options. Conversely, Monaco fans will likely be pleased to retain a promising young player who has been a valuable asset to their team. Lamine Camara will now focus on his commitments with Monaco for the upcoming season, while Chelsea will presumably look at alternative targets to bolster their squad.", "vocab": [{"word": "midfielder", "definition": "A football player who plays in the middle of the field."}, {"word": "transfer", "definition": "The process of a player moving from one club to another for a fee."}, {"word": "anticipated", "definition": "Expected or looked forward to."}, {"word": "proceed", "definition": "To continue or go forward."}, {"word": "disclosed", "definition": "Revealed or made known."}, {"word": "negotiations", "definition": "Discussions between people trying to reach an agreement."}, {"word": "disappointment", "definition": "Sadness because something did not happen as hoped."}]}, "Advanced": {"text": "The anticipated £47.1 million transfer of Senegalese international midfielder Lamine Camara from French Ligue 1 club AS Monaco to English Premier League giants Chelsea has definitively collapsed, ensuring the highly-rated talent will remain in the Principality. This development marks a significant turn of events in the summer transfer window, leaving both clubs and the player in an altered position and prompting a re-evaluation of strategies.\n\nCamara, a dynamic 20-year-old central midfielder, had been widely tipped for a move to Stamford Bridge, with reports suggesting that Chelsea had reached an agreement in principle with Monaco for his services. The potential acquisition aligned with Chelsea's recent strategy of investing heavily in young, high-potential players, aiming to build a formidable squad for sustained success in domestic and European competitions. The substantial fee underscored the club's perceived value of Camara's abilities and future prospects, positioning him as a key component in their long-term vision.\n\nHowever, despite the advanced stage of discussions and the reported agreement on a transfer fee, the deal ultimately failed to materialize. The intricacies of modern football transfers are multifaceted, often involving a confluence of factors that can derail even the most promising negotiations. These can range from a failure to agree on personal terms, such as wages or contract length, to issues arising during the mandatory medical examination, or even last-minute shifts in club priorities or financial parameters. The intense pressure of the transfer window, with its tight deadlines and competitive environment, often exacerbates these complexities. While the specific reasons for the breakdown in Camara's case have not been publicly elucidated, the outcome is unambiguous: he will not be donning the blue shirt of Chelsea.\n\nThis collapse will undoubtedly prompt considerable discussion among football aficionados and analysts. For Chelsea, it represents a setback in their squad-building efforts, potentially forcing them to pivot to alternative targets to reinforce their midfield ahead of the new season. The club's recent history of aggressive recruitment means that failing to secure a player after such a substantial investment of time and resources can be a point of scrutiny, raising questions about their efficiency in closing high-profile deals.\n\nConversely, AS Monaco will likely view Camara's retention as a considerable boost. Keeping a player of his calibre, especially one who attracted such a hefty valuation, strengthens their squad depth and competitive ambitions in Ligue 1, allowing them to maintain a key asset. For Lamine Camara himself, while a move to a Premier League powerhouse might have been an attractive proposition for career progression and exposure, remaining at Monaco offers continuity and a familiar environment to further hone his burgeoning talent. He will now be expected to redouble his focus on his commitments with the French club, aiming to continue his development and contribute significantly to their campaign, perhaps with an eye on future transfer opportunities.", "vocab": [{"word": "anticipated", "definition": "Expected or looked forward to with excitement."}, {"word": "definitively", "definition": "In a way that is final and cannot be changed."}, {"word": "acquisition", "definition": "The act of getting or buying something, in this case, a player."}, {"word": "materialize", "definition": "To happen or become real, after being planned or hoped for."}, {"word": "intricacies", "definition": "The complex or detailed aspects of something."}, {"word": "elucidated", "definition": "Made clear or explained."}, {"word": "aficionados", "definition": "People who are very knowledgeable and enthusiastic about a particular subject, such as football."}, {"word": "burgeoning", "definition": "Developing or growing quickly."}]}}, "questions": [{"q": "What is the main outcome of the news item regarding Lamine Camara?", "a": "Lamine Camara's transfer to Chelsea collapsed, and he will remain with his current club, Monaco."}, {"q": "Which two football clubs were involved in the potential transfer?", "a": "The two clubs involved were Monaco (from France) and Chelsea (from England)."}], "id": "ae60c363c98", "source": "BBC Sport", "link": "https://www.bbc.co.uk/sport/football/articles/ce8emxm7xmzo?at_medium=RSS&at_campaign=rss", "published": "2026-09-02T08:34:53+09:00", "category": "sports", "category_title": "Sports"}, {"headline": "Sunderland Secures Malick Fofana in £30m Transfer Deal", "excerpt": "Sunderland AFC has success rscoring Fofana's perceived value and potential. \n\nMalick Fofana is expected to bring fresh energy and skill to Sunderland's midfield or attack. His arrival is seen as a strategic move to bolster the team's chances in the competitive Championship league. Football transfers, where players move between clubs for a fee, are a common part of the sport, especially during specific 'transfer windows' when deals can be officially completed. Sunderland's management hopes that Fofana will quickly integrate into the team and contribute to their goal of achieving promotion to the Premier League in the coming seasons. This high-profile signing demonstrates Sunderland's commitment to building a competitive team capable of challenging at the top.", "vocab": [{"word": "acquisition", "definition": "The act of getting or buying something."}, {"word": "significant", "definition": "Important or noticeable."}, {"word": "competition", "definition": "The act of trying to win or gain something against others."}, {"word": "prevailed", "definition": "Won or succeeded after a struggle."}, {"word": "substantial", "definition": "Of considerable importance, size, or worth."}, {"word": "bolster", "definition": "To support or strengthen."}, {"word": "integrate", "definition": "To become a part of a group or system."}]}, "Advanced": {"text": "Sunderland AFC has concluded a high-profile transfer, securing the services of promising talent Malick Fofana from French Ligue 1 outfit Lyon. The deal, reportedly worth a substantial £30 million, represents a significant statement of intent from the Championship club as they aim to bolster their squad for a promotion push. This considerable outlay underscores the club's ambition and Fofana's perceived value in the competitive football market.\n\nThe acquisition of Fofana was a keenly contested affair, with Sunderland successfully fending off interest from Premier League side Crystal Palace. The fact that a Championship club managed to outbid and persuade a const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
</body></html>
