<style>
:root{--paper:#f7f3ea;--ink:#1c1a17;--muted:#6b6358;--rule:#d8cfbf;--accent:#8a1f1f;--accent2:#2a3d54;--pill:#efe8da;--ok:#2e7d4f}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;

  background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 10px;cursor:pointer;white-space:nowrap}

.more{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}

<script>
const ED = {"built": "2026-09-16", "categories": [{"key": "business", "title": "Business", "articles": [{"headline": "Australia's Trade Adjustment Too Slow, Warns Lowy Institute", "excerpt": "A new report from the Lowy Institute suggests Australia is not changing its trade strategies fast enough to keep up with global shifts.", "levels": {"Beginner": {"text": "Australia needs to change how it trades with other countries. This is what a group called the Lowy Institute says. The world of trade is changing fast. For a long time, Australia sold many things, like iron ore, to China. This was good for Australia's economy. But now, trade with China is sometimes harder because of new rules or different relationships between countries. The Lowy Institute thinks Australia, also known as Canberra, is too slow to adjust. It means Australia is not finding new countries to sell things to quickly enough. It also means Australia is not selling enough new kinds of products. If Australia changes faster, it can find new friends to trade with. It can also make and sell new things that other countries want. This will help Australia's economy stay strong and create jobs for people. It is important for Australia to look for new opportunities in places like Southeast Asia or India. This way, Australia will not rely too much on just one country for trade.", "vocab": [{"word": "trade", "definition": "The act of buying and selling goods and services between countries."}, {"word": "economy", "definition": "The system of how a country makes and uses money and goods."}, {"word": "adjust", "definition": "To change something slightly to make it better or more suitable."}, {"word": "rely", "definition": "To need or depend on someone or something."}, {"word": "opportunities", "definition": "Chances to do something good or successful."}]}, "Intermediate": {"text": "The global trade environment is undergoing significant changes, and a recent report from the Lowy Institute indicates that Australia, often referred to by its capital Canberra, is struggling to adapt quickly enough. For many decades, Australia's economy has heavily relied on its strong trade relationship with China, particularly for exports of raw materials such as iron ore and coal. This partnership has been a major driver of Australia's economic growth. However, geopolitical tensions and China's evolving economic priorities have introduced new complexities and risks to this traditional trade model. The Lowy Institute, a prominent Australian think tank, argues that Australia needs to diversify its trade partners and export products more aggressively. This means actively exploring new markets in regions like Southeast Asia, India, and other growing economies. It also involves developing new industries and services for export, moving beyond its traditional focus on commodities. The report suggests that a slow adjustment could leave Australia vulnerable to future economic shocks and limit its long-term growth potential. Diversifying trade is crucial for building economic resilience and ensuring prosperity in a rapidly changing world. By expanding its network of trading partners and the range of goods and services it offers, Australia can reduce its dependence on any single market and better navigate the uncertainties of global commerce.", "vocab": [{"word": "environment", "definition": "The conditions and influences that affect how something develops or operates."}, {"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "diversify", "definition": "To make something more varied or different."}, {"word": "commodities", "definition": "Raw materials or primary agricultural products that can be bought and sold, like iron ore or wheat."}, {"word": "vulnerable", "definition": "Exposed to the possibility of being attacked or harmed, either physically or emotionally."}, {"word": "resilience", "definition": "The ability to recover quickly from difficulties; toughness."}, {"word": "prosperity", "definition": "The state of being successful, especially financially."}]}, "Advanced": {"text": "The geopolitical tectonic plates are shifting, fundamentally reshaping the global trade architecture, and a recent assessment from the Lowy Institute underscores a critical concern: Australia's pace of adjustment to these profound transformations is proving to be dangerously sluggish. For an economy historically characterized by its deep reliance on commodity exports, particularly to the burgeoning Chinese market, the current environment presents both an imperative for strategic recalibration and significant challenges. The Lowy Institute, a highly respected independent think tank, contends that Canberra's policy responses and business strategies have yet to fully grasp the magnitude of these changes, risking Australia's long-term economic resilience and prosperity. The report implicitly highlights the vulnerabilities inherent in Australia's concentrated trade portfolio, especially its historical dependence on China for a substantial portion of its exports, including iron ore, coal, and agricultural products. While this relationship has fueled decades of growth, escalating geopolitical tensions, China's domestic economic rebalancing towards consumption, and its pursuit of greater self-sufficiency in key sectors necessitate a proactive and comprehensive diversification strategy. This involves not only cultivating deeper trade ties with emerging economies in Southeast Asia, India, and beyond, but also fostering innovation and competitiveness in new export sectors, such as advanced manufacturing, technology, and specialized services. The institute's analysis suggests that a failure to accelerate this pivot could expose Australia to heightened economic volatility, supply chain disruptions, and a diminished capacity to influence regional economic norms. The imperative is clear: Australia must proactively de-risk its trade profile, build robust supply chain resilience, and strategically position itself within a multipolar global economy, rather than passively reacting to an already altered landscape. This demands a concerted effort from government and industry to identify new market opportunities, invest in future-proof industries, and negotiate comprehensive trade agreements that reflect the evolving global economic order.", "vocab": [{"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors and global power dynamics."}, {"word": "architecture", "definition": "The complex or carefully designed structure of something, in this context, the global system of trade."}, {"word": "sluggish", "definition": "Slow-moving or inactive; lacking energy or quickness."}, {"word": "recalibration", "definition": "The act of adjusting or fine-tuning something to a new standard or set of circumstances."}, {"word": "imperative", "definition": "Of vital importance; crucial or essential."}, {"word": "diversification", "definition": "The process of varying products, markets, or investments to reduce risk."}, {"word": "volatility", "definition": "The tendency of something to change rapidly and unpredictably, especially for the worse."}, {"word": "multipolar", "definition": "Describing a system or world order in which power is distributed among multiple major poles or centers of influence."}]}}, "questions": [{"q": "According to the Lowy Institute, what is Australia doing too slowly?", "a": "Australia is adjusting too slowly to the changing global trade climate."}, {"q": "What is one key strategy the Lowy Institute suggests for Australia to improve its trade situation?", "a": "The Lowy Institute suggests Australia needs to diversify its trade partners and export products more aggressively, exploring new markets and developing new industries."}], "id": "af8b34f1f0e", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivwFBVV95cUxQdXNfQXlmdTBvR0NxaTVUalIzUlNQamRiaGNudG5XbkZoYXdkbzZmcnRLdW1MWndEdlpaV2ZUb241RXkzT2lJejhucmdVM2YzNEpWZUM4YzBqSFpydzR1Y0pSZ2JuN3NDeWdESjVKNlNiRHlSWXFBMHZoMFpYTGxrbUtxYkNwN29GXzNPNHl3NjdnaTRyeGVyRVlKNHRnYUk3akFUcVdaSE1FYlRHX1hGYjJvd0RtZVlmaW53NExMdw?oc=5", "published": "2026-09-17T08:50:54+09:00", "category": "business"}, {"headline": "Palm Beaches Board Highlights Economic Growth and Job Creation", "excerpt": "The Business Development Board of the Palm Beaches is celebrating recent successes in bringing new jobs and investments to the region.", "levels": {"Beginner": {"text": "The Business Development Board of the Palm Beaches is talking about good news for the area. This board helps new businesses come to the Palm Beaches. When new businesses come, they create new jobs for people. This is called economic advancement.\n\nThe board works hard to show companies why the Palm Beaches is a great place to be. They tell businesses about the good weather, nice places to live, and skilled workers. More businesses mean more jobs. More jobs mean people have money to spend. This helps local shops and restaurants.\n\nHaving a strong economy is important for everyone. It means better services for the community, like schools and parks. The Business Development Board wants to make sure the Palm Beaches keeps growing. They are happy about the progress made in helping the economy get stronger. They believe this will make life better for all residents.", "vocab": [{"word": "Board", "definition": "A group of people who manage an organization."}, {"word": "Businesses", "definition": "Companies or shops that sell things or services."}, {"word": "Jobs", "definition": "Work that people do to earn money."}, {"word": "Economy", "definition": "How money is made and used in a country or area."}, {"word": "Residents", "definition": "People who live in a particular place."}]}, "Intermediate": {"text": "The Business Development Board (BDB) of the Palm Beaches recently highlighted significant economic advancements in the region, signaling a period of robust growth and opportunity. The BDB's primary mission is to foster economic growth by attracting new businesses and supporting existing ones, ultimately leading to job creation, increased capital investment, and a more diversified local economy.\n\nThe board actively promotes the Palm Beaches as an attractive destination for companies seeking to relocate or expand their operations. They showcase the region's strategic advantages, which include a highly skilled workforce, an exceptional quality of life, a favorable business climate, and robust infrastructure. These efforts are crucial for diversifying the local economy beyond traditional sectors like tourism and real estate, bringing in industries such as technology, finance, and life sciences.\n\nEconomic advancements, as touted by the BDB, typically involve a rise in employment opportunities across various sectors, an increase in capital investment from new and expanding companies, and the development of high-wage industries. Such growth benefits the entire community in multiple ways. More businesses contribute to a stronger tax base, which can fund improved public services, better schools, and essential infrastructure projects like roads and public transportation. This creates a positive cycle, making the region even more appealing.\n\nThe BDB's strategic initiatives aim to ensure sustainable prosperity for Palm Beach County. By continually working to bring in diverse industries and support local entrepreneurship, they help create a more resilient economy that is less vulnerable to fluctuations in any single sector. This ongoing commitment to economic development is vital for enhancing the overall quality of life for residents, providing better career paths, and securing the region's long-term success and global competitiveness.", "vocab": [{"word": "Highlighted", "definition": "Drew attention to something important."}, {"word": "Foster", "definition": "To encourage the development of something."}, {"word": "Diversifying", "definition": "Making something more varied or different."}, {"word": "Infrastructure", "definition": "Basic physical and organizational structures needed for a society to function (e.g., roads, power)."}, {"word": "Strategic", "definition": "Relating to a plan of action designed to achieve a major goal."}, {"word": "Prosperity", "definition": "The state of being successful, especially financially."}, {"word": "Resilient", "definition": "Able to recover quickly from difficulties."}]}, "Advanced": {"text": "The Business Development Board (BDB) of the Palm Beaches has recently touted significant economic advancements, underscoring a period of dynamic growth and enhanced regional competitiveness. As a pivotal catalyst for economic expansion, the BDB's core mandate is to cultivate a vibrant business ecosystem by proactively attracting new enterprises and providing robust support for existing corporations, thereby stimulating job creation, fostering substantial capital investment, and promoting strategic diversification of the local economy.\n\nThe board employs a multifaceted strategy to position the Palm Beaches as a premier destination for corporate relocation and expansion. This involves meticulously showcasing the region's compelling advantages: a highly educated and skilled workforce, an unparalleled quality of life, a business-friendly regulatory environment, and sophisticated infrastructure. These concerted efforts are instrumental in broadening the economic base beyond its traditional reliance on tourism and real estate, successfully drawing in high-growth sectors such as financial services, life sciences, aerospace, and technology. The BDB actively engages with site selectors and corporate executives, presenting tailored proposals that highlight the unique benefits of establishing or expanding operations within Palm Beach County.\n\nThe \"economic advancements\" championed by the BDB encompass a broad spectrum of positive indicators. These include a measurable increase in high-wage employment opportunities across various industries, a substantial influx of private capital investment, and the successful establishment and expansion of innovative companies. Such sustained growth yields profound socio-economic benefits for the entire community. An expanded and diversified business base strengthens the municipal and county tax revenues, enabling greater investment in critical public services, educational institutions, and essential infrastructure upgrades, including transportation networks, digital connectivity, and green initiatives. This virtuous cycle further enhances the region's appeal to both businesses seeking optimal operating conditions and residents desiring a high quality of life.\n\nFurthermore, the BDB's strategic initiatives are meticulously designed to ensure long-term, sustainable prosperity for Palm Beach County. By continuously engaging in targeted outreach, facilitating access to resources for entrepreneurs, and advocating for policies that support business growth, the board cultivates a more resilient economy. This resilience is crucial for mitigating the impact of economic downturns and fluctuations in specific market sectors, ensuring stability and continued progress. The BDB also plays a critical role in talent retention and development, collaborating with educational institutions to align workforce skills with industry needs. This unwavering commitment to proactive economic development is indispensable for elevating the overall quality of life for its citizenry, cultivating superior career pathways, and solidifying the region's stature as a formidable player in the global economic landscape, attracting both domestic and international investment.", "vocab": [{"word": "Touts", "definition": "To publicly praise or promote something enthusiastically."}, {"word": "Catalyst", "definition": "A person or thing that precipitates an event or change."}, {"word": "Mandate", "definition": "An official order or commission to do something."}, {"word": "Multifaceted", "definition": "Having many different aspects or features."}, {"word": "Instrumental", "definition": "Serving as a crucial means, agent, or tool."}, {"word": "Socio-economic", "definition": "Relating to or concerned with the interaction of social and economic factors."}, {"word": "Mitigating", "definition": "Making something less severe, serious, or painful."}, {"word": "Stature", "definition": "The importance or reputation gained by ability or achievement."}]}}, "questions": [{"q": "What is the main goal of the Business Development Board of the Palm Beaches?", "a": "The main goal of the Business Development Board of the Palm Beaches is to foster economic growth by attracting new businesses and supporting existing ones, leading to job creation and increased investment."}, {"q": "How do economic advancements benefit the community, according to the articles?", "a": "Economic advancements benefit the community by creating more jobs, increasing tax revenues for better public services (like schools and infrastructure), and improving the overall quality of life for residents."}], "id": "a22eedf6b01", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilwFBVV95cUxOaEhoZGtBTTBrTmZxaDVVOXVkMktpY1V0cGVSVml1SzZyLTlwc0RZMGR6YnJmNWxTTDZJSmlMSk8wQ2NwU2Z3SjNoZ1NzMUpZTkxrQVFVUTRQLVhMTk5rYnpMNzI1cXM5SzRrZ0JkNlJlSGZWR0RiVmhvRzFyZTJCbnplSHB6OVZ1NTdJbnBQN3BPOW9Ic29B?oc=5", "published": "2026-09-17T08:42:00+09:00", "category": "business"}, {"headline": "Minnesota Opens Nominations for 41st International Trade Awards", "excerpt": "Minnesota businesses excelling in global markets can now be nominated for the 41st annual Governor’s International Trade Awards.", "levels": {"Beginner": {"text": "Minnesota is opening nominations for special awards. These are called the Governor’s International Trade Awards. This is the 41st year for these awards.\n\nThe awards honor companies in Minnesota. These companies are good at selling their products and services to other countries. Selling things to other countries is called international trade.\n\nWhy are these awards important? When Minnesota companies sell goods abroad, it helps the state's economy. It can create new jobs for people in Minnesota. It also helps Minnesota businesses grow bigger.\n\nThe Governor of Minnesota wants to celebrate these successful companies. They show how Minnesota businesses can do well in the world.\n\nCompanies can be nominated now. People can suggest companies they think deserve an award. The awards will be given later this year. This is a chance to recognize businesses that help Minnesota connect with the world.\n\nThese awards encourage more companies to think about selling their products outside the United States. It helps Minnesota stay strong and connected globally.", "vocab": [{"word": "Awards", "definition": "Special prizes given to someone for doing something well."}, {"word": "Companies", "definition": "Businesses that make or sell things."}, {"word": "International", "definition": "Involving different countries."}, {"word": "Trade", "definition": "The activity of buying and selling goods and services."}, {"word": "Economy", "definition": "How a country or state makes and uses money."}, {"word": "Nominate", "definition": "To suggest someone or a company for an award or position."}]}, "Intermediate": {"text": "Minnesota has announced that nominations are now officially open for the 41st annual Governor’s International Trade Awards. This well-established program serves to recognize and celebrate Minnesota companies that have demonstrated exceptional achievement and excellence in expanding their business into global markets.\n\nThe awards play a crucial role in highlighting the significant contributions of Minnesota businesses to the state's economy through international trade. By successfully exporting a wide range of goods and services, these companies not only generate substantial revenue but also create valuable jobs for Minnesotans and foster robust economic growth across the state. International trade is particularly vital for Minnesota, which boasts a diverse economy encompassing key sectors such as agriculture, manufacturing, and medical technology.\n\nThe Governor’s International Trade Awards are designed to commend businesses of all sizes, from small and emerging enterprises to large, established corporations, for their success in navigating the complexities of global commerce. These accolades encourage other Minnesota companies to explore opportunities beyond domestic borders, thereby strengthening the state's overall economic resilience and enhancing its competitiveness on the world stage.\n\nThe nomination period is currently active, inviting individuals, business associations, and organizations to submit candidates who have shown outstanding achievements in international trade over the past year. A distinguished panel of experts, often from state agencies and the private sector, will meticulously review the nominations and select the deserving winners. These award recipients will then be honored at a special ceremony later in the year, often attended by the Governor and other state officials.\n\nCelebrating these achievements underscores Minnesota's commitment to being a key player in the global marketplace. It also provides valuable recognition for companies that are driving innovation, expanding Minnesota's reach, and contributing to the state's prosperity across the world.", "vocab": [{"word": "Nominations", "definition": "Formal suggestions for someone or a company to receive an award or position."}, {"word": "Exceptional", "definition": "Unusually good; outstanding."}, {"word": "Global markets", "definition": "The worldwide system of buying and selling goods and services."}, {"word": "Crucial", "definition": "Extremely important or essential."}, {"word": "Foster", "definition": "To encourage the development or growth of something."}, {"word": "Resilience", "definition": "The ability to recover quickly from difficulties or adapt to change."}, {"word": "Accolades", "definition": "An award or privilege granted as a special honor or recognition."}]}, "Advanced": {"text": "Minnesota has formally announced the opening of nominations for the 41st annual Governor’s International Trade Awards, a prestigious program designed to commend and celebrate the state's leading companies for their exceptional achievements in global commerce. This long-standing initiative underscores Minnesota's commitment to fostering a robust export economy and recognizing the pivotal role businesses play in expanding the state's economic footprint worldwide. The awards highlight how local innovation and entrepreneurship translate into global success, benefiting the entire state.\n\nThese awards are more than mere recognition; they serve as a strategic instrument to highlight the profound impact of international trade on Minnesota’s economic vitality. Companies that successfully navigate the complexities of global markets, exporting a diverse array of goods and services—from agricultural products and advanced manufacturing components to cutting-edge medical technologies—not only generate substantial revenue streams but also stimulate job creation, attract foreign investment, and enhance the state's overall prosperity. Minnesota's economy, characterized by its innovation and diversification, relies heavily on its ability to compete effectively in the globalized marketplace. International trade helps insulate the state from domestic economic fluctuations and opens up new avenues for growth.\n\nThe Governor’s International Trade Awards acknowledge businesses across the spectrum, from burgeoning small and medium-sized enterprises (SMEs) to established multinational corporations. The criteria typically evaluate factors such as sustained growth in export sales, successful market penetration in new territories, innovative approaches to international business, and significant contributions to Minnesota's economy through job creation and investment. By publicly honoring these trailblazers, the state aims to inspire other local firms to explore and capitalize on the vast opportunities beyond domestic borders, thereby bolstering Minnesota's competitive advantage and economic resilience. This recognition also provides a valuable marketing tool for the winning companies, enhancing their credibility and visibility on an international scale.\n\nThe nomination process is now active, inviting submissions from individuals, industry associations, and economic development organizations. Prospective candidates are expected to demonstrate a clear track record of excellence in international trade over the past year. A distinguished panel, comprising experts from the Minnesota Department of Employment and Economic Development (DEED) and the private sector, will undertake a rigorous evaluation of all nominations. The selected recipients will be celebrated at an esteemed ceremony, often graced by the Governor and other high-ranking state officials, providing a prominent platform for their achievements and allowing for networking opportunities among the state's top exporters.\n\nThis annual event not only provides well-deserved accolades to successful exporters but also reinforces Minnesota's identity as a dynamic and globally-oriented participant in the world economy. It serves as a powerful testament to the ingenuity and entrepreneurial spirit of Minnesota businesses, driving economic growth, projecting the state's capabilities onto the international stage, and ultimately strengthening the state's position in an increasingly interconnected world.", "vocab": [{"word": "Prestigious", "definition": "Inspiring respect and admiration; havi word": "trade", "definition": "The act of buying and selling goods and services between countries."}, {"word": "economy", "definition": "The system of how a country makes and uses money and goods."}, {"word": "adjust", "definition": "To change something slightly to make it better or more suitable."}, {"word": "rely", "definition": "To need or depend on someone or something."}, {"word": "opportunities", "definition": "Chances to do something good or successful."}]}, "Intermediate": {"text": "The global trade environment is undergoing significant changes, and a recent report from the Lowy Institute indicates that Australia, often referred to by its capital Canberra, is struggling to adapt quickly enough. For many decades, Australia's economy has heavily relied on its strong trade relationship with China, particularly for exports of raw materials such as iron ore and coal. This partnership has been a major driver of Australia's economic growth. However, geopolitical tensions and China's evolving economic priorities have introduced new complexities and risks to this traditional trade model. The Lowy Institute, a prominent Australian think tank, argues that Australia needs to diversify its trade partners and export products more aggressively. This means actively exploring new markets in regions like Southeast Asia, India, and other growing economies. It also involves developing new industries and services for export, moving beyond its traditional focus on commodities. The report suggests that a slow adjustment could leave Australia vulnerable to future economic shocks and limit its long-term growth potential. Diversifying trade is crucial for building economic resilience and ensuring prosperity in a rapidly changing world. By expanding its network of trading partners and the range of goods and services it offers, Australia can reduce its dependence on any single market and better navigate the uncertainties of global commerce.", "vocab": [{"word": "environment", "definition": "The conditions and influences that affect how something develops or operates."}, {"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "diversify", "definition": "To make something more varied or different."}, {"word": "commodities", "definition": "Raw materials or primary agricultural products that can be bought and sold, like iron ore or wheat."}, {"word": "vulnerable", "definition": "Exposed to the possibility of being attacked or harmed, either physically or emotionally."}, {"word": "resilience", "definition": "The ability to recover quickly from difficulties; toughness."}, {"word": "prosperity", "definition": "The state of being successful, especially financially."}]}, "Advanced": {"text": "The geopolitical tectonic plates are shifting, fundamentally reshaping the global trade architecture, and a recent assessment from the Lowy Institute underscores a critical concern: Australia's pace of adjustment to these profound transformations is proving to be dangerously sluggish. For an economy historically characterized by its deep reliance on commodity exports, particularly to the burgeoning Chinese market, the current environment presents both an imperative for strategic recalibration and significant challenges. The Lowy Institute, a highly respected independent think tank, contends that Canberra's policy responses and business strategies have yet to fully grasp the magnitude of these changes, risking Australia's long-term economic resilience and prosperity. The report implicitly highlights the vulnerabilities inherent in Australia's concentrated trade portfolio, especially its historical dependence on China for a substantial portion of its exports, including iron ore, coal, and agricultural products. While this relationship has fueled decades of growth, escalating geopolitical tensions, China's domestic economic rebalancing towards consumption, and its pursuit of greater self-sufficiency in key sectors necessitate a proactive and comprehensive diversification strategy. This involves not only cultivating deeper trade ties with emerging economies in Southeast Asia, India, and beyond, but also fostering innovation and competitiveness in new export sectors, such as advanced manufacturing, technology, and specialized services. The institute's analysis suggests that a failure to accelerate this pivot could expose Australia to heightened economic volatility, supply chain disruptions, and a diminished capacity to influence regional economic norms. The imperative is clear: Australia must proactively de-risk its trade profile, build robust supply chain resilience, and strategically position itself within a multipolar global economy, rather than passively reacting to an already altered landscape. This demands a concerted effort from government and industry to identify new market opportunities, invest in future-proof industries, and negotiate comprehensive trade agreements that reflect the evolving global economic order.", "vocab": [{"word": "geopolitical", "definition": "Relating to politics, especially international relations, as influenced by geographical factors and global power dynamics."}, {"word": "architecture", "definition": "The complex or carefully designed structure of something, in this context, the global system of trade."}, {"word": "sluggish", "definition": "Slow-moving or inactive; lacking energy or quickness."}, {"word": "recalibration", "definition": "The act of adjusting or fine-tuning something to a new standard or set of circumstances."}, {"word": "imperative", "definition": "Of vital importance; crucial or essential."}, {"word": "diversification", "definition": "The process of varying products, markets, or investments to reduce risk."}, {"word": "volatility", "definition": "The tendency of something to change rapidly and unpredictably, especially for the worse."}, {"word": "multipolar", "definition": "Describing a system or world order in which power is distributed among multiple major poles or centers of influence."}]}}, "questions": [{"q": "According to the Lowy Institute, what is Australia doing too slowly?", "a": "Australia is adjusting too slowly to the changing global trade climate."}, {"q": "What is one key strategy the Lowy Institute suggests for Australia to improve its trade situation?", "a": "The Lowy Institute suggests Australia needs to diversify its trade partners and export products more aggressively, exploring new markets and developing new industries."}], "id": "af8b34f1f0e", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivwFBVV95cUxQdXNfQXlmdTBvR0NxaTVUalIzUlNQamRiaGNudG5XbkZoYXdkbzZmcnRLdW1MWndEdlpaV2ZUb241RXkzT2lJejhucmdVM2YzNEpWZUM4YzBqSFpydzR1Y0pSZ2JuN3NDeWdESjVKNlNiRHlSWXFBMHZoMFpYTGxrbUtxYkNwN29GXzNPNHl3NjdnaTRyeGVyRVlKNHRnYUk3akFUcVdaSE1FYlRHX1hGYjJvd0RtZVlmaW53NExMdw?oc=5", "published": "2026-09-17T08:50:54+09:00", "category": "business", "category_title": "Business"}, {"headline": "Palm Beaches Board Highlights Economic Growth and Job Creation", "excerpt": "The Business Development Board of the Palm Beaches is celebrating recent successes in bringing new jobs and investments to the region.", "levels": {"Beginner": {"text": "The Business Development Board of the Palm Beaches is talking about good news for the area. This board helps new businesses come to the Palm Beaches. When new businesses come, they create new jobs for people. This is called economic advancement.\n\nThe board works hard to show companies why the Palm Beaches is a great place to be. They tell businesses about the good weather, nice places to live, and skilled workers. More businesses mean more jobs. More jobs mean people have money to spend. This helps local shops and restaurants.\n\nHaving a strong economy is important for everyone. It means better services for the community, like schools and parks. The Business Development Board wants to make sure the Palm Beaches keeps growing. They are happy about the progress made in helping the economy get stronger. They believe this will make life better for all residents.", "vocab": [{"word": "Board", "definition": "A group of people who manage an organization."}, {"word": "Businesses", "definition": "Companies or shops that sell things or services."}, {"word": "Jobs", "definition": "Work that people do to earn money."}, {"word": "Economy", "definition": "How money is made and used in a country or area."}, {"word": "Residents", "definition": "People who live in a particular place."}]}, "Intermediate": {"text": "The Business Development Board (BDB) of the Palm Beaches recently highlighted significant economic advancements in the region, signaling a period of robust growth and opportunity. The BDB's primary mission is to foster economic growth by attracting new businesses and supporting existing ones, ultimately leading to job creation, increased capital investment, and a more diversified local economy.\n\nThe board actively promotes the Palm Beaches as an attractive destination for companies seeking to relocate or expand their operations. They showcase the region's strategic advantages, which include a highly skilled workforce, an exceptional quality of life, a favorable business climate, and robust infrastructure. These efforts are crucial for diversifying the local economy beyond traditional sectors like tourism and real estate, bringing in industries such as technology, finance, and life sciences.\n\nEconomic advancements, as touted by the BDB, typically involve a rise in employment opportunities across various sectors, an increase in capital investment from new and expanding companies, and the development of high-wage industries. Such growth benefits the entire community in multiple ways. More businesses contribute to a stronger tax base, which can fund improved public services, better schools, and essential infrastructure projects like roads and public transportation. This creates a positive cycle, making the region even more appealing.\n\nThe BDB's strategic initiatives aim to ensure sustainable prosperity for Palm Beach County. By continually working to bring in diverse industries and support local entrepreneurship, they help create a more resilient economy that is less vulnerable to fluctuations in any single sector. This ongoing commitment to economic development is vital for enhancing the overall quality of life for residents, providing better career paths, and securing the region's long-term success and global competitiveness.", "vocab": [{"word": "Highlighted", "definition": "Drew attention to something important."}, {"word": "Foster", "definition": "To encourage the development of something."}, {"word": "Diversifying", "definition": "Making something more varied or different."}, {"word": "Infrastructure", "definition": "Basic physical and organizational structures needed for a society to function (e.g., roads, power)."}, {"word": "Strategic", "definition": "Relating to a plan of action designed to achieve a major goal."}, {"word": "Prosperity", "definition": "The state of being successful, especially financially."}, {"word": "Resilient", "definition": "Able to recover quickly from difficulties."}]}, "Advanced": {"text": "The Business Development Board (BDB) of the Palm Beaches has recently touted significant economic advancements, underscoring a period of dynamic growth and enhanced regional competitiveness. As a pivotal catalyst for economic expansion, the BDB's core mandate is to cultivate a vibrant business ecosystem by proactively attracting new enterprises and providing robust support for existing corporations, thereby stimulating job creation, fostering substantial capital investment, and promoting strategic diversification of the local economy.\n\nThe board employs a multifaceted strategy to position the Palm Beaches as a premier destination for corporate relocation and expansion. This involves meticulously showcasing the region's compelling advantages: a highly educated and skilled workforce, an unparalleled quality of life, a business-friendly regulatory environment, and sophisticated infrastructure. These concerted efforts are instrumental in broadening the economic base beyond its traditional reliance on tourism and real estate, successfully drawing in high-growth sectors such as financial services, life sciences, aerospace, and technology. The BDB actively engages with site selectors and corporate executives, presenting tailored proposals that highlight the unique benefits of establishing or expanding operations within Palm Beach County.\n\nThe \"economic advancements\" championed by the BDB encompass a broad spectrum of positive indicators. These include a measurable increase in high-wage employment opportunities across various industries, a substantial influx of private capital investment, and the successful establishment and expansion of innovative companies. Such sustained growth yields profound socio-economic benefits for the entire community. An expanded and diversified business base strengthens the municipal and county tax revenues, enabling greater investment in critical public services, educational institutions, and essential infrastructure upgrades, including transportation networks, digital connectivity, and green initiatives. This virtuous cycle further enhances the region's appeal to both businesses seeking optimal operating conditions and residents desiring a high quality of life.\n\nFurthermore, the BDB's strategic initiatives are meticulously designed to ensure long-term, sustainable prosperity for Palm Beach County. By continuously engaging in targeted outreach, facilitating access to resources for entrepreneurs, and advocating for policies that support business growth, the board cultivates a more resilient economy. This resilience is crucial for mitigating the impact of economic downturns and fluctuations in speci const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
