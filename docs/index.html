<style>
:root{--paper:#f7f3ea;--ink:#1c1a17;--muted:#6b6358;--rule:#d8cfbf;--accent:#8a1f1f;--accent2:#2a3d54;--pill:#efe8da;--ok:#2e7d4f}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
  line-height:1.65;overflow-wrap:break-word;word-break:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent2)}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 120px}
header.top{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px}

.tag{font-style:italic;color:var(--muted);font-size:14px;margin:4px 0 12px}

.tab{flex:0 0 auto;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
  background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 10px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.viewtitle{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:22px 0 4px;color:var(--accent)}
.card{padding:18px 0;border-bottom:1px solid var(--rule)}
.card:last-child{border-bottom:none}
.cat-tag{display:inline-block;font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent2);background:var(--pill);border:1px solid var(--rule);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.3}
.card .src{font-family:Helvetica,Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.excerpt{margin:0 0 10px;font-size:16px;color:var(--ink)}
.more{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}
/* article view */
.crumb{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.art-h{font-family:'Playfair Display',Georgia,serif;font-size:26px;line-height:1.25;margin:0 0 6px}
.art-src{font-family:Helvetica,Arial,sans-serif;font-size:12px;color:var(--muted);margin-bottom:16px}
.levels{display:flex;gap:0;border:1px solid var(--rule);border-radius:24px;overflow:hidden;margin:0 0 18px;background:#fff}
.levels button{flex:1;font-family:Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;border:none;background:none;padding:9px 6px;cursor:pointer;color:var(--muted)}
.levels button.active{background:var(--accent2);color:#fff}
.panel{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:14px 16px;margin:0 0 18px}
.panel h4{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
dl.vocab{margin:0}
dl.vocab dt{font-weight:700;margin-top:9px}
dl.vocab dd{margin:2px 0 0;font-size:15.5px}
.article-body p{font-size:17px;margin:0 0 15px}
.q{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.q:first-child{border-top:none;padding-top:0;margin-top:0}
.q .qq{font-weight:700;font-size:16px;margin:0 0 6px}
.q details summary{cursor:pointer;color:var(--accent2);font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;list-style:none}
.q details summary::-webkit-details-marker{display:none}
.q details summary::before{content:"Show answer ▸"}
.q details[open] summary::before{content:"Answer ▾"}
.q details p{margin:6px 0 0;font-size:15.5px}
.srclink{display:inline-block;margin-top:6px;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700}
/* bottom bar */
.navbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:1px;background:var(--rule);z-index:50;
  box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.navbar button{flex:1;background:var(--paper);border:none;padding:13px 8px;font-family:Helvetica,Arial,sans-serif;
  font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer}
.navbar button:disabled{opacity:.35}
#bionic-toggle{position:fixed;right:12px;bottom:62px;z-index:60;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;
  background:var(--accent2);color:#fff;border:none;border-radius:20px;padding:9px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.92}

 Million Star’s Vikings Trade Rumors Gain Steam - Yahoo Sports", "excerpt": "Indianapolis Colts’ $44 Million Star’s Vikings Trade Rumors Gain Steam Yahoo Sports", "levels": {"Beginner": {"text": "Indianapolis Colts’ $44 Million Star’s Vikings Trade Rumors Gain Steam Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Indianapolis Colts’ $44 Million Star’s Vikings Trade Rumors Gain Steam Yahoo Sports", "vocab": []}, "Advanced": {"text": "Indianapolis Colts’ $44 Million Star’s Vikings Trade Rumors Gain Steam Yahoo Sports", "vocab": []}}, "questions": [], "id": "aaa8fb995e5", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxQX1pWc184V0R5RG1HV0wyOExjeFllYVJieUlLQ0JDaE1Ib0JZUUQ5c0JPU2gwRVlBbTU0bXdUOFZpdGZIRjE3RlhRUXl3Q3lvY0VvNVdiWWtSTkJiUEhRNzlhcEJ3SGRqazhJclR5TE1LaGxYLU41MDF3am1Ua2VQSHc3b0JPSkt6bk9v?oc=5", "published": "2026-10-27T09:23:00+09:00", "category": "business"}, {"headline": "AI Companies Face Challenge: Can They Deliver on Big Promises?", "excerpt": "Many artificial intelligence companies have made big promises, but the question remains whether they can turn their advanced technology into real business success.", "levels": {"Beginner": {"text": "AI companies are very popular now. They make big promises about what artificial intelligence can do. They say AI can change how we live and work, making things faster and smarter. But it is hard for these companies to keep all these big promises.\n\nBuilding AI technology costs a lot of money. Companies need powerful computers, which are expensive. They also need many smart people, like engineers and scientists, to create and improve the AI. And they need a lot of data to train the AI, which also has costs. All these things are very expensive to get and maintain.\n\nAfter building AI, companies need to sell it. They need to find good ways for other businesses and people to use their AI products. For example, AI might help doctors, or make cars safer, or help people write. And they need to make money from these sales. This is called making a profit.\n\nMany AI companies are still spending a lot of money. They are trying to find the best way to make their AI useful and profitable for a long time. It is a big challenge for them to turn their great ideas into real business success. The future of many AI businesses depends on showing they can earn money.", "vocab": [{"word": "AI", "definition": "Short for Artificial Intelligence, which means computers that can think or learn like people."}, {"word": "promises", "definition": "Things that companies say they will do or achieve in the future."}, {"word": "technology", "definition": "The use of science for practical purposes, like making machines or systems."}, {"word": "costs", "definition": "The money that needs to be spent to get or do something."}, {"word": "profit", "definition": "The money a business earns after paying all its costs."}, {"word": "challenge", "definition": "A difficult task or situation that needs a lot of effort."}]}, "Intermediate": {"text": "Artificial intelligence (AI) companies have captured global attention with their ambitious promises. They envision AI transforming various sectors, from healthcare and finance to transportation and creative industries, by offering unprecedented efficiency and innovation. However, a significant question looms: can these companies truly deliver on their business potential and achieve sustainable profitability?\n\nDeveloping cutting-edge AI, especially advanced models like large language models, requires immense investment. Companies must acquire and maintain vast computing infrastructure, including powerful servers and specialized chips. They also need to attract and retain top-tier talent, such as AI researchers, data scientists, and engineers, who command high salaries. Furthermore, gathering, cleaning, and processing the massive datasets necessary to train AI models is a costly and complex endeavor.\n\nThe challenge extends beyond development. AI companies must translate their technological breakthroughs into practical, scalable applications that businesses and consumers are willing to pay for. Many are currently operating with substantial capital expenditure, investing heavily in research and development without yet seeing equivalent revenue streams. The market is also highly competitive, with numerous startups and established tech giants vying for market share.\n\nUltimately, the long-term success of these AI ventures hinges on their ability to move past the initial hype. They need to demonstrate clear value propositions, integrate AI solutions effectively into existing workflows, and establish viable business models that generate consistent income. The journey from groundbreaking innovation to sustainable profitability is proving to be a complex one for many in the AI industry.", "vocab": [{"word": "ambitious", "definition": "Having a strong desire to achieve something difficult; requiring great effort."}, {"word": "transforming", "definition": "Changing something completely, usually in a positive way."}, {"word": "unprecedented", "definition": "Never done or known before; new and remarkable."}, {"word": "sustainable", "definition": "Able to be maintained at a certain level or rate; able to continue over a long time."}, {"word": "infrastructure", "definition": "The basic physical and organizational structures and facilities (e.g., buildings, roads, power) needed for the operation of a society or enterprise."}, {"word": "breakthroughs", "definition": "Significant discoveries or developments that help to solve a problem or make progress."}, {"word": "profitability", "definition": "The ability of a business or activity to make a profit."}]}, "Advanced": {"text": "The burgeoning field of artificial intelligence has ignited a wave of optimism, with companies making audacious claims about its transformative potential across virtually every industry. From revolutionizing healthcare diagnostics and financial analytics to automating complex creative tasks and enhancing operational efficiencies, the vision for AI's impact is expansive. Yet, as the initial fervor subsides, a critical question emerges regarding the long-term viability of these AI enterprises: can they genuinely deliver on their profound business promises and establish enduring, profitable ventures?\n\nThe path to commercializing advanced AI, particularly sophisticated generative models and large language models, is fraught with significant hurdles. The capital expenditure required for developing and deploying these technologies is staggering. Companies must invest colossal sums in state-of-the-art computing infrastructure, including specialized GPUs and vast data centers, alongside the continuous operational costs of power consumption and cooling. Equally crucial is the acquisition and retention of elite AI talent—researchers, machine learning engineers, and data ethicists—whose expertise is in high demand and commands premium compensation. Moreover, the curation and annotation of proprietary, high-quality datasets, essential for training robust AI, represent another substantial financial and logistical undertaking.\n\nBeyond the immense upfront and ongoing costs, AI firms face the strategic imperative of translating technological prowess into tangible, scalable business solutions. Many are currently navigating a landscape characterized by heavy investment in research and development, often without immediate, corresponding revenue streams. This creates pressure from investors seeking a clear return on capital. The market is also intensely competitive, with a proliferation of startups and established behemoths vying for dominance, necessitating defensible moats and differentiated offerings.\n\nFurthermore, companies must contend with the complex interplay of ethical considerations, regulatory frameworks, and public perception. Issues such as data privacy, algorithmic bias, and the societal impact of automation require careful navigation to foster trust and ensure widespread adoption. The ultimate success of these ventures will hinge not merely on their innovative capabilities but on their strategic acumen to identify genuine market needs, integrate AI seamlessly into existing enterprise workflows, and cultivate robust, sustainable business models that transcend the initial hype cycle. The journey from groundbreaking innovation to consistent, long-term profitability remains a formidable challenge for many within the AI ecosystem.", "vocab": [{"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "audacious", "definition": "Showing a willingness to take surprisingly bold risks; daring."}, {"word": "transformative", "definition": "Causing a complete or dramatic change."}, {"word": "viability", "definition": "The ability to work successfully; feasibility; the capacity to survive or live successfully."}, {"word": "capital expenditure", "definition": "Money spent by a business or organization on acquiring or maintaining fixed assets, such as buildings, land, or equipment."}, {"word": "operational costs", "definition": "The expenses associated with the day-to-day running of a business, such as salaries, utilities, and raw materials."}, {"word": "defensible moats", "definition": "Unique advantages that protect a company from competition, making it difficult for others to replicate its success."}, {"word": "strategic acumen", "definition": "The ability to make good judgments and quick decisions, especially in a particular domain like business strategy."}]}}, "questions": [{"q": "What is one major reason why developing AI technology is expensive for companies?", "a": "Developing AI technology is expensive because companies need powerful computers, smart engineers and scientists, and a lot of data to train the AI."}, {"q": "What does \"sustainable profitability\" mean for AI companies?", "a": "For AI companies, \"sustainable profitability\" means they can consistently earn more money than they spend over a long period, making their business successful and able to continue."}], "id": "ae4b72b60f9", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMitAFBVV95cUxNakRZMVBBaFZqQmdjY1lPYjlMd3llMmk3SFNZU3dpTnZnRXppRHhkVk45MjFtNTBDZlQ0UjhZZGY4ekxCaldMb2lWZm1DZlBNMk5aeW1DWm0tOFB3R0RnZkMwUmdQajhWSUg3VC1RTTA4eHhXZHRWUUsyaEIzTzg5Sm1ORTJuVUtyYlBDZUJ0cEFKUFpYX3lRcm5UTmptVXJyQ3I4RW1zdWtEamVwcVJ5dXlqV0M?oc=5", "published": "2026-10-27T09:20:00+09:00", "category": "business"}]}, {"key": "economics", "title": "Economics", "articles": [{"headline": "French Bond Rout Overshadows ECB Succession - Bloomberg.com", "excerpt": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "levels": {"Beginner": {"text": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "vocab": []}, "Intermediate": {"text": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "vocab": []}, "Advanced": {"text": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "vocab": []}}, "questions": [], "id": "af42dbbeb12", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMingFBVV95cUxQMzRPQm5hMnFIYWhiZHhSY1lBbFRJNGRIMGZBVVZmbS1JSVYwcVVuSVdRNkNjZVdmQ0dTWjhPbURySXFaQVJwdlVWalhoNml4bzNlQlYwdzJUUlFFUWJWcjRNQTdKUEM2d0JYc3JIakIyLWJzOGc5ZE1sNTdzT2NmYVcyQWFqVlhwZVo0RVVZaVpfaGx6aFFva3pJQXVMQQ?oc=5", "published": "2026-10-27T09:31:53+09:00", "category": "economics"}, {"headline": "South Korea's Economy Surges, Growing Faster Than Expected in Q3", "excerpt": "South Korea's economy grew much faster than predicted in the third quarter, signaling strong performance and potential positive impacts.", "levels": {"Beginner": {"text": "South Korea's economy grew quickly in the third quarter of the year. This means the country made more goods and services. The growth was three times faster than people thought it would be. This is good news for South Korea.\n\nWhen an economy grows, it often means more jobs for people. Businesses might make more money, and people might spend more. This helps the country's overall health. South Korea is known for making many things like electronics and cars, which it sells to other countries. These sales help its economy.\n\nExperts watch how fast an economy grows. They call this measure Gross Domestic Product, or GDP. A higher GDP growth number usually shows that the economy is strong. The fast growth in Q3 shows that South Korea's economy is doing well right now, even better than many expected. This can make people feel more hopeful about the future.", "vocab": [{"word": "economy", "definition": "how a country makes and uses money, goods, and services."}, {"word": "grew", "definition": "got bigger or increased."}, {"word": "expected", "definition": "thought something would happen."}, {"word": "goods", "definition": "things that people make or grow to sell."}, {"word": "services", "definition": "work that someone does for others, like teaching or fixing things."}, {"word": "jobs", "definition": "paid work that people do."}]}, "Intermediate": {"text": "South Korea's economy experienced a significant surge in the third quarter of the year, growing three times faster than initial forecasts. This robust performance indicates a stronger-than-anticipated recovery and resilience within the nation's economic landscape, surprising many experts who had predicted a more modest expansion.\n\nEconomic growth is primarily measured by Gross Domestic Product (GDP), which represents the total monetary value of all finished goods and services produced within a country over a specific period. For South Korea, a major global exporter heavily reliant on international trade, this accelerated growth is particularly noteworthy. The actual figures have been a positive surprise for financial markets and policymakers alike.\n\nSeveral factors likely contributed to this strong showing. South Korea's export sector, a key driver of its economy, appears to have benefited from improving global demand for its high-tech products, such as semiconductors, and other manufactured goods like automobiles. Strong international sales provide a significant boost. Additionally, domestic consumer spending and business investment could have played a crucial role, signaling increased confidence among households and companies within the country. Government spending on infrastructure or social programs might also have contributed.\n\nWhile rapid economic growth is generally positive, indicating job creation and increased prosperity, it also brings considerations for the central bank. The Bank of Korea monitors economic data closely to manage inflation and maintain price stability. A booming economy might lead to concerns about rising prices, potentially influencing future monetary policy decisions, such as interest rate adjustments. Overall, the Q3 results paint an optimistic picture for South Korea's economic trajectory in the near term, suggesting a solid foundation for continued expansion.", "vocab": [{"word": "surge", "definition": "a sudden, strong increase."}, {"word": "forecasts", "definition": "predictions about what will happen in the future."}, {"word": "resilience", "definition": "the ability to recover quickly from difficulties."}, {"word": "Gross Domestic Product (GDP)", "definition": "the total value of all goods and services produced in a country."}, {"word": "exporter", "definition": "a country or company that sells goods to other countries."}, {"word": "domestic", "definition": "relating to one's own country; not foreign."}, {"word": "inflation", "definition": "a general increase in prices and fall in the purchasing value of money."}]}, "Advanced": {"text": "South Korea's economy demonstrated exceptional vitality in the third quarter, expanding at a rate three times faster than initial projections. This robust performance, significantly exceeding market expectations, underscores the nation's economic resilience amidst a complex global environment and signals a potent recovery trajectory.\n\nThe preliminary data for Gross Domestic Product (GDP) revealed a substantial uptick, surprising economists and financial analysts who had anticipated a more moderate expansion. GDP, the broadest measure of economic activity, encompasses consumer spending, business investment, government expenditure, and net exports. For an export-oriented powerhouse like South Korea, which is deeply integrated into global supply chains, such an acceleration is particularly impactful, reflecting both internal strengths and favorable external conditions.\n\nSeveral key drivers likely underpinned this impressive growth. The export sector, a perennial engine of the South Korean economy, appears to have capitalized on a rebound in global demand, particularly for its high-value technological products such as semiconductors, displays, and advanced electronics, alongside strong sales of automobiles and petrochemicals. This robust external demand, coupled with potentially easing supply chain bottlenecks, provided a significant impetus. Domestically, a resurgence in private consumption, fueled by improving labor market conditions and potentially pent-up demand, alongside solid business investment in areas like manufacturing capacity and research and development, also contributed substantially. Government fiscal measures, while not explicitly detailed in the summary, often play a counter-cyclical role in supporting economic momentum.\n\nThe unexpectedly strong Q3 figures carry significant implications for monetary policy and the broader economic outlook. The Bank of Korea (BOK) meticulously monitors economic indicators, including GDP growth and inflation, to guide its decisions on interest rates and liquidity management. While rapid growth is generally desirable, fos r on year in October, a sharp rise compared with 1.4% in September, and an indication that retailers were beginning to pass on the rising costs of energy and food ingredients since the Middle East conflict broke out. Continue reading...", "vocab": []}}, "questions": [], "id": "ab9b7e22ee7", "source": "Economics | The Guardian", "link": "https://www.theguardian.com/business/2026/oct/27/uk-shop-price-inflation-highest-since-2024-as-retailers-struggle-to-limit-price-rises", "published": "2026-10-27T09:01:02+09:00", "category": "economics"}, {"headline": "'I'm a single mum on £41,000 and limit my weekly shop to £40.' What do you want from the Budget?", "excerpt": "People earning from £380 a month to £150,000 a year tell the BBC what they want to see in this year's Budget.", "levels": {"Beginner": {"text": "People earning from £380 a month to £150,000 a year tell the BBC what they want to see in this year's Budget.", "vocab": []}, "Intermediate": {"text": "People earning from £380 a month to £150,000 a year tell the BBC what they want to see in this year's Budget.", "vocab": []}, "Advanced": {"text": "People earning from £380 a month to £150,000 a year tell the BBC what they want to see in this year's Budget.", "vocab": []}}, "questions": [], "id": "a364f404f61", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cmx235r9wr3yo?at_medium=RSS&at_campaign=rss", "published": "2026-10-27T09:01:00+09:00", "category": "economics"}]}, {"key": "politics", "title": "Politics", "articles": [{"headline": "Trump administration attempting to prosecute former FBI Director James Comey again - The Seattle Times", "excerpt": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "levels": {"Beginner": {"text": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "vocab": []}, "Intermediate": {"text": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "vocab": []}, "Advanced": {"text": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "vocab": []}}, "questions": [], "id": "a560068a432", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxNX1BZNl8td3pKaDh4OVN0ckFTNEN2YWU0UlNOUDg3MUU2RjFSeHdjX3lRdkpfcy1KNmdQdGkxQk5wOFlhTGljQlJkTGtpUm5WNDNYNVNPanM5RlJyY0FXb2lzSjZkV0l3a2k2aGV4TkRUczhtTzY1QnJqWXR2RkZfcXFsQkFBN2dIWG93ZGk1T1dYNDJiS1ZxQXR5S2JKRmpHNDZlN2Y5WklJVjZPc0hZMXpMM1A3d3FLWm9uYUdKaUNEX0lNcWlNaUhBYldGV1paczE3TGd1LXM?oc=5", "published": "2026-10-27T09:47:14+09:00", "category": "politics"}, {"headline": "Lula's Digital Strategy Secured Brazil's Presidency", "excerpt": "Luiz Inácio Lula da Silva's successful campaign for Brazil's presidency was significantly boosted by a strategic and effective social media presence.", "levels": {"Beginner": {"text": "Lula da Silva won the election to become Brazil's president again. His team used social media a lot to help him win. Social media means websites and apps like Facebook and Instagram.\n\nLula's campaign used these tools to talk to many people across Brazil. They shared his ideas and plans for the country. They also showed videos and pictures of Lula. This helped voters learn about him and what he wanted to do.\n\nThe election was very important for Brazil. Lula's team knew that many people use social media every day. So, they made sure their messages reached these people. They worked hard to share positive news about Lula. They also tried to correct wrong information that was shared online.\n\nBy using social media well, Lula's campaign could connect with voters directly. This was a big part of why he won the election and became president for a new term. It shows how important online tools are in politics today.", "vocab": [{"word": "election", "definition": "when people vote to choose a leader."}, {"word": "campaign", "definition": "a series of activities to try to win an election."}, {"word": "social media", "definition": "websites and apps where people share information and talk to each other."}, {"word": "win", "definition": "to be successful in a competition or election."}, {"word": "president", "definition": "the leader of a country."}, {"word": "helped", "definition": "made it easier for someone to do something."}]}, "Intermediate": {"text": "Luiz Inácio Lula da Silva secured a significant victory in Brazil's presidential election, returning to office after a previous tenure. A crucial element of his successful campaign was a sophisticated and highly effective social media strategy. This digital approach allowed Lula's team to connect with a vast electorate across the diverse nation.\n\nThe campaign utilized various social media platforms, including WhatsApp, Facebook, and TikTok, to disseminate its messages. They focused on sharing Lula's policy proposals, highlighting his past achievements, and presenting a positive vision for Brazil's future. This direct communication was vital in reaching voters, especially younger demographics and those in remote areas.\n\nBeyond simply sharing information, Lula's social media team actively worked to counter misinformation and disinformation, which were prevalent during the intensely contested election. They developed rapid response mechanisms to address false narratives about the candidate and his platform. This proactive engagement helped to shape public opinion and maintain the integrity of their message.\n\nFurthermore, social media was instrumental in mobilizing supporters. The campaign used these platforms to organize events, encourage voter turnout, and foster a sense of community among Lula's followers. This grassroots mobilization, combined with a clear and consistent digital presence, proved to be a powerful force. The strategic use of social media platforms played a pivotal role in Lula's ability to overcome his opponent, Jair Bolsonaro, and ultimately win the presidency, underscoring the growing importance of digital campaigns in modern politics.", "vocab": [{"word": "secured", "definition": "successfully obtained or achieved something."}, {"word": "crucial", "definition": "extremely important or necessary."}, {"word": "strategy", "definition": "a plan of action designed to achieve a long-term or overall aim."}, {"word": "disseminate", "definition": "to spread or disperse something widely."}, {"word": "misinformation", "definition": "false or inaccurate information, especially that which is intended to deceive."}, {"word": "mobilizing", "definition": "preparing and organizing people for a specific purpose, such as a political campaign."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}]}, "Advanced": {"text": "Luiz Inácio Lula da Silva's triumphant return to Brazil's presidency was significantly underpinned by a meticulously crafted and executed social media campaign. In a deeply polarized political landscape, where digital spaces often serve as primary battlegrounds for public opinion, Lula's team leveraged an astute digital strategy to connect with, persuade, and mobilize a diverse electorate across the vast South American nation.\n\nThe campaign's digital ecosystem spanned a multitude of platforms, from the ubiquitous WhatsApp, a key communication channel in Brazil, to Facebook, Instagram, and the rapidly growing TikTok. This multi-platform approach allowed for tailored content delivery, addressing different demographics and their preferred modes of consumption. Content ranged from concise policy explainers and nostalgic retrospectives of Lula's previous administrations to engaging short videos designed to resonate with younger voters. The objective was not merely to inform but to foster a strong emotional connection and a sense of shared purpose.\n\nA critical component of the digital strategy was the proactive and reactive management of information. The election was rife with disinformation and fake news, often targeting Lula and his Workers' Party. The campaign established robust rapid-response units dedicated to identifying, debunking, and counter-narrating false claims. By presenting verifiable facts and consistent messaging, they aimed to inoculate supporters against harmful narratives and provide clarity amidst the digital noise. This sophisticated counter-disinformation effort was pivotal in safeguarding the campaign's integrity and credibility.\n\nFurthermore, social media proved indispensable for grassroots mobilization and community building. Platforms were used to organize rallies, coordinate volunteer efforts, and encourage voter turnout, particularly in the crucial second round against incumbent Jair Bolsonaro. The digital outreach extended to engaging with influencers, creating shareable content, and empowering supporters to become digital ambassadors. This organic, decentralized propagation of messages amplified the campaign's reach far beyond traditional media channels. Ultimately, Lula's strategic mastery of the digital realm, transforming it from a mere communication tool into a powerful engine for political persuasion and organization, was a decisive factor in his narrow but significant victory, setting a new benchmark for modern electoral campaigns in emerging democracies.", "vocab": [{"word": "underpinned", "definition": "supported, strengthened, or formed the basis for something."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "polarized", "definition": "divided into two sharply contrasting groups or sets of opinions."}, {"word": "astute", "definition": "having or showing an ability to accurately assess situations or people and turn this to one's advantage."}, {"word": "ubiquitous", "definition": "present, appearing, or found everywhere."}, {"word": "disinformation", "definition": "false information, especially that which is intended to deceive."}, {"word": "inoculate", "definition": "to protect someone from something undesirable by introducing a small amount of it, thereby building up resistance. (Here, metaphorically, protecting against false narratives)."}, {"word": "grassroots", "definition": "the ordinary people regarded as the main body of an organization or political party. (Here, referring to local, community-level political activity)."}]}}, "questions": [{"q": "What role did social media play in Lula's election victory?", "a": "Social media was crucial for Lula's campaign to communicate his ideas, mobilize supporters, and counter misinformation, helping him connect with a wide range of voters across Brazil."}, {"q": "Who was Lula's main opponent in the Brazilian presidential election mentioned in the article?", "a": "Lula's main opponent in the Brazilian presidential election was Jair Bolsonaro."}], "id": "abe5966adf0", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOT081dU1aanAtQ25Hd3h1SkxKOGNuUHpaZTBkZVVqcFFOUkgyT1ZCT0VMT1ZsblNueERaRFQ0TXV0ZUpRNnEwRmw2Z3VscndEcVg3RDVINkhSMWdOeFJGTWtWUmRlSFc3cGVPQnZSSk5vaDF2WWs1ZGY0c29IcUw5UzI2YzM1YWJnMXNHUTVBakRlZw?oc=5", "published": "2026-10-27T09:45:26+09:00", "category": "politics"}, {"headline": "Israel Election: What Happens After Polls Close? - NDTV", "excerpt": "Israel Election: What Happens After Polls Close? NDTV", "levels": {"Beginner": {"text": "Israel Election: What Happens After Polls Close? NDTV", "vocab": []}, "Intermediate": {"text": "Israel Election: What Happens After Polls Close? NDTV", "vocab": []}, "Advanced": {"text": "Israel Election: What Happens After Polls Close? NDTV", "vocab": []}}, "questions": [], "id": "ad37e66bd6b", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBM s OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMivgFBVV95cUxPWEpWbWh2RTFLaVhGTkxsbERRMnNOZ2M2YjJ5Y1VhMWR2TmlVUU91NkF2em5qTVdNUUhfS2s1cno0YzhCbWkzUzNNaGFmWGlUSEIxWXNiVDRGR0pVNUxSUDh2RTU1MGlJcDJ1TllzM0pzVElleWVTdWlBekZGdV9TNEFTeU93UjA3RV9ES0t0eEZpT1NFSHVnU1d0bWNNWkE3NE81c01PR0dxUHdpX0syYVM5RWo4Z19BSE5jNFVR0gHSAUFVX3lxTE5HaTBWNkVCOWg0Q1A2YTRKTl8zV1Y5MGRQWmxhUG1HMWdlbWlSUmIwSW93R19qWmp6QlUtMkZKMHRpLUJaSWFubGlVenVGVUNMd00tWlB5OUd1TGpleE1fR0h2MFlPTzRzMUNtbllmUDNONWJpaDhvalJZbHpycnoxYlp3am5ldGdqbjRGbEZlODZRbVFma0VtaV9kSVQ0TTF0T1YwSHdBQTRHUWJhQ3NvVUVWU3U5YndHdDRKMUlGMUZKTkw0MFJmLWJyMzR1eGxrUQ?oc=5", "published": "2026-10-27T09:41:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "French Bond Rout Overshadows ECB Succession - Bloomberg.com", "excerpt": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "levels": {"Beginner": {"text": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "vocab": []}, "Intermediate": {"text": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "vocab": []}, "Advanced": {"text": "French Bond Rout Overshadows ECB Succession Bloomberg.com", "vocab": []}}, "questions": [], "id": "af42dbbeb12", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMingFBVV95cUxQMzRPQm5hMnFIYWhiZHhSY1lBbFRJNGRIMGZBVVZmbS1JSVYwcVVuSVdRNkNjZVdmQ0dTWjhPbURySXFaQVJwdlVWalhoNml4bzNlQlYwdzJUUlFFUWJWcjRNQTdKUEM2d0JYc3JIakIyLWJzOGc5ZE1sNTdzT2NmYVcyQWFqVlhwZVo0RVVZaVpfaGx6aFFva3pJQXVMQQ?oc=5", "published": "2026-10-27T09:31:53+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "South Korea's Economy Surges, Growing Faster Than Expected in Q3", "excerpt": "South Korea's economy grew much faster than predicted in the third quarter, signaling strong performance and potential positive impacts.", "levels": {"Beginner": {"text": "South Korea's economy grew quickly in the third quarter of the year. This means the country made more goods and services. The growth was three times faster than people thought it would be. This is good news for South Korea.\n\nWhen an economy grows, it often means more jobs for people. Businesses might make more money, and people might spend more. This helps the country's overall health. South Korea is known for making many things like electronics and cars, which it sells to other countries. These sales help its economy.\n\nExperts watch how fast an economy grows. They call this measure Gross Domestic Product, or GDP. A higher GDP growth number usually shows that the economy is strong. The fast growth in Q3 shows that South Korea's economy is doing well right now, even better than many expected. This can make people feel more hopeful about the future.", "vocab": [{"word": "economy", "definition": "how a country makes and uses money, goods, and services."}, {"word": "grew", "definition": "got bigger or increased."}, {"word": "expected", "definition": "thought something would happen."}, {"word": "goods", "definition": "things that people make or grow to sell."}, {"word": "services", "definition": "work that someone does for others, like teaching or fixing things."}, {"word": "jobs", "definition": "paid work that people do."}]}, "Intermediate": {"text": "South Korea's economy experienced a significant surge in the third quarter of the year, growing three times faster than initial forecasts. This robust performance indicates a stronger-than-anticipated recovery and resilience within the nation's economic landscape, surprising many experts who had predicted a more modest expansion.\n\nEconomic growth is primarily measured by Gross Domestic Product (GDP), which represents the total monetary value of all finished goods and services produced within a country over a specific period. For South Korea, a major global exporter heavily reliant on international trade, this accelerated growth is particularly noteworthy. The actual figures have been a positive surprise for financial markets and policymakers alike.\n\nSeveral factors likely contributed to this strong showing. South Korea's export sector, a key driver of its economy, appears to have benefited from improving global demand for its high-tech products, such as semiconductors, and other manufactured goods like automobiles. Strong international sales provide a significant boost. Additionally, domestic consumer spending and business investment could have played a crucial role, signaling increased confidence among households and companies within the country. Government spending on infrastructure or social programs might also have contributed.\n\nWhile rapid economic growth is generally positive, indicating job creation and increased prosperity, it also brings considerations for the central bank. The Bank of Korea monitors economic data closely to manage inflation and maintain price stability. A booming economy might lead to concerns about rising prices, potentially influencing future monetary policy decisions, such as interest rate adjustments. Overall, the Q3 results paint an optimistic picture for South Korea's economic trajectory in the near term, suggesting a solid foundation for continued expansion.", "vocab": [{"word": "surge", "definition": "a sudden, strong increase."}, {"word": "forecasts", "definition": "predictions about what will happen in the future."}, {"word": "resilience", "definition": "the ability to recover quickly from difficulties."}, {"word": "Gross Domestic Product (GDP)", "definition": "the total value of all goods and services produced in a country."}, {"word": "exporter", "definition": "a country or company that sells goods to other countries."}, {"word": "domestic", "definition": "relating to one's own country; not foreign."}, {"word": "inflation", "definition": "a general increase in prices and fall in the purchasing value of money."}]}, "Advanced": {"text": "South Korea's economy demonstrated exceptional vitality in the third quarter, expanding at a rate three times faster than initial projections. This robust performance, significantly exceeding market expectations, underscores the nation's economic resilience amidst a complex global environment and signals a potent recovery trajectory.\n\nThe preliminary data for Gross Domestic Product (GDP) revealed a substantial uptick, surprising economists and financial analysts who had anticipated a more moderate expansion. GDP, the broadest measure of economic activity, encompasses consumer spending, business investment, government expenditure, and net exports. For an export-oriented powerhouse like South Korea, which is deeply integrated into global supply chains, such an acceleration is particularly impactful, reflecting both internal strengths and favorable external conditions.\n\nSeveral key drivers likely underpinned this impressive growth. The export sector, a perennial engine of the South Korean economy, appears to have capitalized on a rebound in global demand, particularly for its high-value technological products such as semiconductors, displays, and advanced electronics, alongside strong sales of automobiles and petrochemicals. This robust external demand, coupled with potentially easing supply chain bottlenecks, provided a significant impetus. Domestically, a resurgence in private consumption, fueled by improving labor market conditions and potentially pent-up demand, alongside solid business investment in areas like manufacturing capacity and research and development, also contributed substantially. Government fiscal measures, while not explicitly detailed in the summary, often play a counter-cyclical role in supporting economic momentum.\n\nThe unexpectedly strong Q3 figures carry significant implications for monetary policy and the broader economic outlook. The Bank of Korea (BOK) meticulously monitors economic indicators, including GDP growth and inflation, to guide its decisions on interest rates and liquidity management. While rapid growth is generally desirable, fostering job creation and national prosperity, an overheated economy could precipitate inflationary pressures. The BOK will need to carefully assess whether this accelerated growth is sustainable and if it warrants a more hawkish stance to preempt potential price instability. Conversely, sustained strong growth could provide the central bank with more flexibility to manage other economic challenges.\n\nLooking ahead, the global economic landscape remains dynamic. While South Korea's Q3 performance is a strong positive, ongoing geopolitical tensions, commodity price volatility, and the pace of global economic recovery will continue to shape its trajectory. However, the latest data provides a solid foundation, suggesting that South Korea's economy possesses considerable momentum and adaptability, positioning it favorably for continued expansion in the coming quarters.", "vocab": [{"word": "vitality", "definition": "the state of being strong and active; energy and vigor."}, {"word": "projections", "definition": "estimates or forecasts of future situations or trends, often based on current data and analysis."}, {"word": "resilience", "definition": "the capacity to recover quickly from difficulties; the ability of an economy or system to withstand or adjust to shocks and maintain its function."}, {"word": "encompasses", "definition": "includes or covers a wide range of things; to surround and have or hold within."}, {"word": "perennial", "definition": "lasting or existing for a long or apparently infinite time; enduring or continually recurring."}, {"word": "impetus", "definition": "the force or energy with which a body moves; a driving force, stimulus, or incentive that causes something to happen or develop."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "precipitate", "definition": "cause (an event or situation, typically one that is bad or undesirable) to happen suddenly, unexpectedly, or prematurely."}]}}, "questions": [{"q": "What is the main news about South Korea's economy in the third quarter?", "a": "South Korea's economy grew three times faster than expected in the third quarter."}, {"q": "What is GDP and why is it important for measuring economic health?", "a": "GDP (Gross Domestic Product) is the total value of all goods and services produced in a country. It's important because it shows how much a country's economy is growing or shrinking, indicating its overall health and prosperity."}], "id": "a6669b63d2d", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMifEFVX3lxTE12WXBKQWVSUWJCdUsyUGEyVUtxVExDel9EN0c2MlVwVWk0Q0dXT2Vza052Vm43ZEprZUZXaldfcExhMjVSYmJUT0d5cS01bVZnSlREb0hEek15cWxzNW5xSTRZRTVlOVpIRHJVNEx3d2pJamFYQU1VYUJtNjg?oc=5", "published": "2026-10-27T09:08:00+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Trump administration attempting to prosecute former FBI Director James Comey again - The Seattle Times", "excerpt": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "levels": {"Beginner": {"text": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "vocab": []}, "Intermediate": {"text": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "vocab": []}, "Advanced": {"text": "Trump administration attempting to prosecute former FBI Director James Comey again The Seattle Times", "vocab": []}}, "questions": [], "id": "a560068a432", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxNX1BZNl8td3pKaDh4OVN0ckFTNEN2YWU0UlNOUDg3MUU2RjFSeHdjX3lRdkpfcy1KNmdQdGkxQk5wOFlhTGljQlJkTGtpUm5WNDNYNVNPanM5RlJyY0FXb2lzSjZkV0l3a2k2aGV4TkRUczhtTzY1QnJqWXR2RkZfcXFsQkFBN2dIWG93ZGk1T1dYNDJiS1ZxQXR5S2JKRmpHNDZlN2Y5WklJVjZPc0hZMXpMM1A3d3FLWm9uYUdKaUNEX0lNcWlNaUhBYldGV1paczE3TGd1LXM?oc=5", "published": "2026-10-27T09:47:14+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Lula's Digital Strategy Secured Brazil's Presidency", "excerpt": "Luiz Inácio Lula da Silva's successful campaign for Brazil's presidency was significantly boosted by a strategic and effective social media presence.", "levels": {"Beginner": {"text": "Lula da Silva won the election to become Brazil's president again. His team used social media a lot to help him win. Social media means websites and apps like Facebook and Instagram.\n\nLula's campaign used these tools to talk to many people across Brazil. They shared his ideas and plans for the country. They also showed videos and pictures of Lula. This helped voters learn about him and what he wanted to do.\n\nThe election was very important for Brazil. Lula's team knew that many people use social media every day. So, they made sure their messages reached these people. They worked hard to share positive news about Lula. They also tried to correct wrong information that was shared online.\n\nBy using social media well, Lula's campaign could connect with voters directly. This was a big part of why he won the election and became president for a new term. It shows how important online tools are in politics today.", "vocab": [{"word": "election", "definition": "when people vote to choose a leader."}, {"word": "campaign", "definition": "a series of activities to try to win an election."}, {"word": "social media", "definition": "websites and apps where people share information and talk to each other."}, {"word": "win", "definition": "to be successful in a competition or election."}, {"word": "president", "definition": "the leader of a country."}, {"word": "helped", "definition": "made it easier for someone to do something."}]}, "Intermediate": {"text": "Luiz Inácio Lula da Silva secured a significant victory in Brazil's presidential election, returning to office after a previous tenure. A crucial element of his successful campaign was a sophisticated and highly effective social media strategy. This digital approach allowed Lula's team to connect with a vast electorate across the diverse nation.\n\nThe campaign utilized various social media platforms, including WhatsApp, Facebook, and TikTok, to disseminate its messages. They focused on sharing Lula's policy proposals, highlighting his past achievements, and presenting a positive vision for Brazil's future. This direct communication was vital in reaching voters, especially younger demographics and those in remote areas.\n\nBeyond simply sharing information, Lula's social media team actively worked to counter misinformation and disinformation, which were prevalent during the intensely contested election. They developed rapid response mechanisms to address false narratives about the candidate and his platform. This proactive engagement helped to shape public opinion and maintain the integrity of their message.\n\nFurthermore, social media was instrumental in mobilizing supporters. The campaign used these platforms to organize events, encourage voter turnout, and foster a sense of community among Lula's followers. This grassroots mobilization, combined with a clear and consistent digital presence, proved to be a powerful force. The strategic use of social media platforms played a pivotal role in Lula's ability to overcome his opponent, Jair Bolsonaro, and ultimately win the presidency, underscoring the growing importance of digital campaigns in modern politics.", "vocab": [{"word": "secured", "definition": "successfully obtained or achieved something."}, {"word": "crucial", "definition": "extremely important or necessary."}, {"word": "strategy", "definition": "a plan of action designed to achieve a long-term or overall aim."}, {"word": "disseminate", "definition": "to spread or disperse something widely."}, {"word": "misinformation", "definition": "false or inaccurate information, especially that which is intended to deceive."}, {"word": "mobilizing", "definition": "preparing and organizing people for a specific purpose, such as a political campaign."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}]}, "Advanced": {"text": "Luiz Inácio Lula da Silva's triumphant return to Brazil's presidency was significantly underpinned by a meticulously crafted and executed social media campaign. In a deeply polarized political landscape, where digital spaces often serve as primary battlegrounds for public opinion, Lula's team leveraged an astute digital strategy to connect with, persuade, and mobilize a diverse electorate across the vast South American nation.\n\nThe campaign's digital ecosystem spanned a multitude of platforms, from the ubiquitous WhatsApp, a key communication channel in Brazil, to Facebook, Instagram, and the rapidly growing TikTok. This multi-platform approach allowed for tailored content delivery, addressing different demographics and their preferred modes of consumption. Content ranged from concise policy explainers and nostalgic retrospectives of Lula's previous administrations to engaging short videos designed to resonate with younger voters. The objective was not merely to inform but to foster a strong emotional connection and a sense of shared purpose.\n\nA critical component of the digital strategy was the proactive and reactive management of information. The election was rife with disinformation and fake news, often targeting Lula and his Workers' Party. The campaign established robust rapid-response units dedicated to identifying, debunking, and counter-narrating false claims. By presenting verifiable facts and consistent messaging, they aimed to inoculate supporters against harmful narratives and provide clarity amidst the digital noise. This sophisticated counter-disinformation effort was pivotal in safeguarding the campaign's integrity and credibility.\n\nFurthermore, social media proved indispensable for grassroots mobilization and community building. Platforms were used to organize rallies, coordinate volunteer efforts, and encourage voter turnout, particularly in the crucial second round against incumbent Jair Bolsonaro. The digital outreach extended to engaging with influencers, creating shareable content, and empowering supporters to become digital ambassadors. This organic, decentralized propagation of messages amplified the campaign's reach far beyond traditional media channels. Ultimately, Lula's strategic mastery of the digital realm, transforming it from a mere communication tool into a powerful engine for political persuasion and organization, was a decisive factor in his narrow but significant victory, setting a new benchmark for modern electoral campaigns in emerging democracies.", "vocab": [{"word": "underpinned", "definition": "supported, strengthened, or formed the basis for something."}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely."}, {"word": "polarized", "definition": "divided into two sharply contrasting groups or sets of opinions."}, {"word": "astute", "definition": "having or showing an ability to accurately assess situations or people and turn this to one's advantage."}, {"word": "ubiquitous", "definition": "present, appearing, or found everywhere."}, {"word": "disinformation", "definition": "false information, especially that which is intended to deceive."}, {"word": "inoculate", "definition": "to protect someone from something undesirable by introducing a small amount of it, thereby building up resistance. (Here, metaphorically, protecting against false narratives)."}, {"word": "grassroots", "definition": "the ordinary people regarded as the main body of an organization or political party. (Here, referring to local, commun const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
