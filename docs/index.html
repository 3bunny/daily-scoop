ly across the sports world, signifying not just the introduction of a new competition but a powerful affirmation of the burgeoning commercial and cultural viability of women's sports globally.\n\nThe descriptor \"surreal\" encapsulates the profound sense of achievement and almost disbelief for those who have tirelessly advocated for greater equity and opportunity. It represents the culmination of sustained efforts by athletes, administrators, and fans, transforming long-held aspirations into a concrete, high-profile reality. This sentiment highlights the significant shift in perception and investment that has propelled women's sports into an unprecedented era of growth, challenging traditional narratives and fostering a more inclusive sporting culture.\n\nThe strategic importance of establishing new professional leagues such as WTGL cannot be overstated. These platforms are instrumental in expanding professional pathways for female athletes, offering enhanced remuneration, state-of-the-art facilities, and unparalleled media exposure. This directly addresses historical disparities, enabling more women to pursue viable, full-time careers and reach their athletic zenith. Furthermore, these leagues are critical drivers of fan engagement, attracting diverse demographics and fostering a deeper connection with the sport, thereby amplifying its cultural footprint and economic impact through merchandise, ticketing, and media rights.\n\nThe WTGL's inauguration aligns with a broader, undeniable global trend: the escalating popularity and commercial appeal of women's sports. From record-breaking viewership figures in major tournaments to increasing corporate sponsorships and media rights deals, the market is demonstrating a robust appetite for female athletic excellence. While the establishment and long-term sustainability of any nascent league present inherent challenges—including securing consistent funding, cultivating a dedicated fan base, and navigating competitive sports markets—the current tailwinds for women's sports are formidable, suggesting a strong foundation for success.\n\nThis new league is poised to contribute significantly to a more diverse, inclusive, and equitable sports ecosystem. By providing additional opportunities for elite competition and inspiring the next generation of athletes, WTGL is not merely launching a season; it is actively shaping the future trajectory of women's professional sports. Its debut underscores a collective commitment to fostering environments where female athletic prowess is celebrated, valued, and given the platform it unequivocally deserves, promising a vibrant and impactful future that extends beyond the playing field, influencing societal perceptions of women's capabilities and achievements.", "vocab": [{"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Landscape", "definition": "The distinctive features of a particular situation or area of activity."}, {"word": "Burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "Culmination", "definition": "The highest or climactic point of something, especially as attained after a long time."}, {"word": "Advocated", "definition": "Publicly recommended or supported a particular cause or policy."}, {"word": "Remuneration", "definition": "Money paid for work or a service."}, {"word": "Nascent", "definition": "(Especially of a process or organization) just coming into existence and beginning to display signs of future potential."}, {"word": "Equitable", "definition": "Fair and impartial; dealing fairly and equally with all concerned."}]}}, "questions": [{"q": "What is WTGL?", "a": "WTGL is a new professional sports league for women."}, {"q": "What does the article say about the general trend of women's sports?", "a": "The article states that women's sports are becoming more popular, growing, and attracting more investment and viewership."}], "id": "ab43e9245f6", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiXkFVX3lxTFBPTFBiMlA3QXFFOVBLY3BQNXk4NVJtc3UtN3gzRDJPVVpKRV9WbkEyZjN0enRBS1VYNWNocE45ZmtjQUxmbzFORW9zalB5c2d5ZFFXc29TR2pCenktOGc?oc=5", "published": "2026-11-09T10:12:49+09:00", "category": "sports"}, {"headline": "Cardinals still cannot beat Seahawks, as Minshew Mania bubble bursts - Arizona Sports", "excerpt": "Cardinals still cannot beat Seahawks, as Minshew Mania bubble bursts Arizona Sports", "levels": {"Beginner": {"text": "Cardinals still cannot beat Seahawks, as Minshew Mania bubble bursts Arizona Sports", "vocab": []}, "Intermediate": {"text": "Cardinals still cannot beat Seahawks, as Minshew Mania bubble bursts Arizona Sports", "vocab": []}, "Advanced": {"text": "Cardinals still cannot beat Seahawks, as Minshew Mania bubble bursts Arizona Sports", "vocab": []}}, "questions": [], "id": "aca7fb106ed", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxPdC1jc0xYWFhDeEZ4RTdQSkdOTmZuc3hET28zRFhGMHdKNXpBT1VYNklIdGhUTVJHVEVGWnBFQ0RGVUFIMS11WDBESFQxeGI5Zmpmdjh3RnU1S2VmSWw2VlZWaGViOEE5aFMtWVk0MzVOM21TT2NqOUlfVll0cjd5WG5mTGE4WDFHdEpRZjAxemQwZzYy?oc=5", "published": "2026-11-09T10:07:16+09:00", "category": "sports"}, {"headline": "Darren Waller top pass catcher for CAR in Week 9 - Yahoo Sports", "excerpt": "Darren Waller top pass catcher for CAR in Week 9 Yahoo Sports", "levels": {"Beginner": {"text": "Darren Waller top pass catcher for CAR in Week 9 Yahoo Sports", "vocab": []}, "Intermediate": {"text": "Darren Waller top pass catcher for CAR in Week 9 Yahoo Sports", "vocab": []}, "Advanced": {"text": "Darren Waller top pass catcher for CAR in Week 9 Yahoo Sports", "vocab": []}}, "questions": [], "id": "abe6d45f5e3", "source": "\"sports when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMihgFBVV95cUxOV185RnF5LWVONWxSa05LaXNiZUdYU3JuYkVlTTVMeVZXcmhmSVBqNTFxR21MWmdtcTNzaF ms on display at Sioux City film festival KCAU 9 News", "vocab": []}, "Advanced": {"text": "Unique short films on display at Sioux City film festival KCAU 9 News", "vocab": []}}, "questions": [], "id": "aaba4eba916", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiygFBVV95cUxNdkVSbXhaNHJQakJBR0wyWU4yRENLNHB1VVYzR050UHVLQ3htTTNMbFpDUW9rMlItSW14R0xaVndPTVR5bDg0SXVkU29TVEhZNU40QjNtVFBaWEdZbFVNc05CSGFVVVBZTkZRTzkwT1NTOHhpQkJ1Z3FRUXJPMEVvdVpXRkFpWUc2aC1XbmZqemdZRmFUaDhKbTYydWRlaU1ycW1ibC1CZ3ZtSjNaMTZfQ0dWVmRHcEFuN0lWbi1pdXNoS1Nza2pNcTd3?oc=5", "published": "2026-11-09T09:58:11+09:00", "category": "entertainment"}]}], "home": [{"headline": "Bears Acquire Simmons: SI Explains Trade", "excerpt": "Sports Illustrated recently detailed how and why the Chicago Bears acquired star defensive tackle Jeffery Simmons in a key trade.", "levels": {"Beginner": {"text": "Sports Illustrated recently wrote about a big football trade. The article explained how and why the Chicago Bears got a new player. His name is Jeffery Simmons, and he is a very good defensive tackle. He is known as a \"star player\" in the NFL.\n\nThe Bears wanted Simmons to make their team stronger. A defensive tackle helps stop other teams from running with the ball. They also try to tackle the quarterback. Simmons is one of the best at this job. Getting him means the Bears' defense could be much better.\n\nTrading for a player like Simmons is a big deal. Teams usually give up future draft picks or other players to get someone so talented. Sports Illustrated looked at why the Bears would make this move. They need strong players to help them win more games. Simmons brings a lot of skill and power to the team. This trade shows the Bears want to improve their team quickly.", "vocab": [{"word": "trade", "definition": "when teams exchange players or picks."}, {"word": "defensive tackle", "definition": "a player who stops the other team's offense."}, {"word": "star player", "definition": "a very famous and skilled player."}, {"word": "defense", "definition": "the part of the team that tries to stop the other team from scoring."}, {"word": "draft picks", "definition": "choices teams get to select new players each year."}, {"word": "skill", "definition": "ability to do something well."}]}, "Intermediate": {"text": "Sports Illustrated recently published an in-depth article explaining a significant transaction involving the Chicago Bears. The piece detailed the strategic reasons behind the Bears' acquisition of star defensive tackle Jeffery Simmons and explored the potential mechanisms of such a trade. Simmons is widely recognized as one of the premier defensive linemen in the National Football League (NFL), known for his exceptional ability to disrupt opposing offenses with his powerful play and consistent performance.\n\nThe primary motivation for the Bears to acquire a player of Simmons' caliber would be to significantly bolster their defensive line. A dominant defensive tackle is crucial for stopping the run game and applying pressure on the quarterback, both areas where Simmons excels. His presence would immediately elevate the performance of the entire defense, making it more formidable against strong offensive units. For a team like the Bears, which has been in a rebuilding phase, adding an established Pro Bowl talent like Simmons signals a clear intent to accelerate their competitive timeline and contend for success sooner rather than later.\n\nAcquiring a player of Simmons' stature typically involves a substantial cost. While the specific details of what the Bears would have given up were not outlined in the summary, such a trade would generally require multiple high-value draft picks or a combination of picks and promising young players. Sports Illustrated's analysis likely delved into the considerable trade value Simmons commands and how the Bears might structure a deal to secure his services without completely mortgaging their future. This move underscores the Bears' commitment to building a winning roster by investing in elite talent at critical positions, aiming to transform their defense into one of the league's best.", "vocab": [{"word": "transaction", "definition": "a business deal or exchange."}, {"word": "acquisition", "definition": "the act of getting or buying something."}, {"word": "premier", "definition": "best or most important."}, {"word": "disrupt", "definition": "to break up or disturb something."}, {"word": "bolster", "definition": "to support or strengthen."}, {"word": "caliber", "definition": "the quality or level of something."}, {"word": "stature", "definition": "importance or reputation gained by ability."}]}, "Advanced": {"text": "Sports Illustrated recently published a comprehensive analysis detailing the strategic rationale and potential intricacies surrounding the Chicago Bears' acquisition of star defensive tackle Jeffery Simmons. The article delved into how and why such a high-profile transaction would materialize, positioning Simmons as a transformative asset for a franchise actively seeking to solidify its competitive foundation. Simmons, a perennial Pro Bowl selection, is widely regarded as one of the NFL's elite interior defensive linemen, celebrated for his rare combination of explosive power, agility, and relentless motor that consistently disrupts opposing offensive schemes and collapses pockets.\n\nFor the Bears, the impetus behind pursuing a player of Simmons' magnitude is multifaceted. Primarily, it addresses a critical need to fortify their defensive front, which is foundational to any successful NFL defense. Simmons' ability to command double-teams not only halts opposing run games at the point of attack but also frees up edge rushers and linebackers to penetrate the backfield and pressure quarterbacks more effectively. His presence would instantaneously elevate the entire defensive unit, fostering a more aggressive and suffocating approach against both the pass and the run. This move would signal a decisive shift from a protracted rebuilding phase towards an accelerated timeline for contention, demonstrating a clear organizational commitment to winning now and capitalizing on the development of other young talents on the roster.\n\nThe \"how\" of such an acquisition, as explored by Sports Illustrated, would undoubtedly involve a substantial outlay of capital. Given Simmons' status as a cornerstone player under a significant contract, any trade package would likely necessitate multiple high-value draft selections, potentially including a first-round pick, alongside promising young talent. The financial implications, including cap space management and potential contract restructuring to accommodate Simmons' salary, would also be a central component of the deal's feasibility. Sports Illustrated's explanation would likely have dissected various trade scenarios, evaluating the delicate balance between immediate impact and long-term roster sustainability, a common challenge for teams making such blockbuster moves. Such a bold maneuver would reflect the Bears' strategic intent to leverage their existing assets to acquire proven, game-changing talent, aiming to establish a formidable defensive identity capable of anchoring a championship-caliber team. This kind of move is often a calculated risk, but for a team striving for immediate relevance and a return to playoff contention, the potential rewards of securing a player of Simmons' caliber are immense, potentially altering the trajectory of the franchise for years to come.", "vocab": [{"word": "comprehensive", "definition": "covering all or nearly all elements or aspects of something."}, {"word": "rationale", "definition": "the fundamental reason or reasons for something; a logical basis."}, {"word": "intricacies", "definition": "the complex or complicated details of something."}, {"word": "materialize", "definition": "to happen or come into being; to become actual fact."}, {"word": "perennial", "definition": "lasting or existing for a long or apparently infinite time; constantly recurring."}, {"word": "impetus", "definition": "the force or energy with which a body moves; a driving force or motivation."}, {"word": "fortify", "definition": "to strengthen (a place) with defensive works so as to protect it against attack."}, {"word": "outlay", "definition": "an amount of money spent on something."}]}}, "questions": [{"q": "What team did Sports Illustrated explain acquired Jeffery Simmons?", "a": "Sports Illustrated explained that the Chicago Bears acquired Jeffery Simmons."}, {"q": "According to the article, what is one main reason the Bears would want a player like Jeffery Simmons?", "a": "One main reason the Bears would want Jeffery Simmons is to make their defensive line stronger, stop the run, and pressure the quarterback."}], "id": "a7089910bde", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxORU9CcVMxMnVrZkxvd3ROcGd1ZTc0bjhkS1hJQXZ3Wkp4bEJidGw2amxtazZ2YXVmSlluZEpvZURWY0lqR19lZUVlYkU2aUdFQUV0MnB1a0x4bEVIazlqN01IbDBOSW1ZazJHQy13R2VNU2ZMSUZWVmNLdTd1cWNMOVoxS29fbjlQVElpTy14LXNjcTJ3Q3RVMWZGci1nd3FMU3FN?oc=5", "published": "2026-11-09T10:12:01+09:00", "category": "business", "category_title": "Business"}, {"headline": "Steelers might be more interested in adding depth at NFL trade deadline - Pittsburgh Post-Gazette", "excerpt": "Steelers might be more interested in adding depth at NFL trade deadline Pittsburgh Post-Gazette", "levels": {"Beginner": {"text": "Steelers might be more interested in adding depth at NFL trade deadline Pittsburgh Post-Gazette", "vocab": []}, "Intermediate": {"text": "Steelers might be more interested in adding depth at NFL trade deadline Pittsburgh Post-Gazette", "vocab": []}, "Advanced": {"text": "Steelers might be more interested in adding depth at NFL trade deadline Pittsburgh Post-Gazette", "vocab": []}}, "questions": [], "id": "a31ffcd758b", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMipwFBVV95cUxNd0RubzltVkZjVExsdFVnMTdMNmlTMTk1OWZYb1pjY2dPSVZ4ZGlBWWY5Tl9KbGhLN1V5anhJQ0tEUWg5WEF1NmZSVEFBU2paY2J5TWRFNmNfSENLeDRiQmZ1OXV3S3MyekptTFhtTVM1SC1sbnRQLU5HRnRkZm1sT3JrU1o4SDROVmZGS3JyM2ZCcHQxZ1RoYTVzLVZUY2pVUVdhSm5rdw?oc=5", "published": "2026-11-09T10:08:45+09:00", "category": "business", "category_title": "Business"}, {"headline": "Investors Shift Worries: From Rising Prices to Slowing Economy Amid Tech Stock Falls", "excerpt": "Investors are now more worried about the economy slowing down than about rising prices, especially as technology stocks continue to fall.", "levels": {"Beginner": {"text": "Investors, who are people that put money into companies, are changing what they worry about. Before, they were mostly worried that prices for goods and services were going up too fast. This is called inflation. When inflation is high, your money buys less.\n\nNow, investors are more worried about the economy growing too slowly. A slow economy means businesses might not make as much money, and fewer jobs could be created. This worry is getting bigger because many technology company stocks are falling a lot. When stocks fall, it means the value of these companies is going down.\n\nThis change in worry shows that people who invest are now thinking more about how the economy's speed will affect their money. They are watching closely to see if the economy will slow down too much, which could be bad for businesses and jobs. The big drop in tech stocks is a clear sign of this new concern.", "vocab": [{"word": "Investors", "definition": "People who put money into businesses to try and make more money."}, {"word": "Inflation", "definition": "When prices for things like food and clothes go up, so your money buys less."}, {"word": "Economy", "definition": "The system of making and selling goods and services in a country."}, {"word": "Stocks", "definition": "Small parts of a company that people can buy and sell."}, {"word": "Falling", "definition": "Going down in value or amount."}]}, "Intermediate": {"text": "Investors are shifting their primary concern from rapidly rising prices, known as inflation, to the potential for a significant slowdown in economic growth. This change in focus comes as technology stocks continue to experience a sharp decline, signaling broader anxieties in the financial markets.\n\nFor many months, the main worry for central banks, like the Federal Reserve in the United States, and investors alike was persistent inflation. To combat this, central banks began raising interest rates, making it more expensive to borrow money. The goal was to cool down the economy and bring prices under control. However, these higher interest rates also make it harder for businesses to grow and for consumers to spend, increasing the risk of an economic downturn, or even a recession.\n\nNow, the market's attention has turned to the health of the economy itself. The deepening \"rout\" in technology stocks is a key indicator of this new concern. Technology companies, which often rely on future growth and easy access to borrowed money, are particularly vulnerable when interest rates rise. Higher rates mean their future earnings are worth less today, and borrowing to expand becomes more costly. This has led to a widespread sell-off in the sector, with many tech company valuations falling sharply.\n\nThis pivot suggests that investors are increasingly weighing the risks of aggressive inflation-fighting policies against the potential for an economic contraction. The current environment presents a challenging balancing act for policymakers and a period of uncertainty for global markets.", "vocab": [{"word": "Primary concern", "definition": "The most important worry or issue."}, {"word": "Inflation", "definition": "A general increase in prices and fall in the purchasing value of money."}, {"word": "Economic growth", "definition": "The increase in the amount of goods and services produced in a country over time."}, {"word": "Interest rates", "definition": "The cost of borrowing money, or the money earned from saving it."}, {"word": "Rout", "definition": "A sudden and heavy defeat or collapse, often used for a sharp fall in stock prices."}, {"word": "Vulnerable", "definition": "Easily hurt or affected by something."}, {"word": "Valuations", "definition": "The process of estimating how much something is worth, especially a company or its stocks."}]}, "Advanced": {"text": "A significant shift in market sentiment is underway, as investor anxiety pivots from the persistent threat of inflation to the escalating risk of an economic slowdown. This reorientation of concerns is underscored by the deepening rout in the technology sector, signaling a broader re-evaluation of market fundamentals and future growth prospects.\n\nFor the better part of the past year, global financial markets have been preoccupied with surging inflation, driven by supply chain disruptions, robust consumer demand, and geopolitical tensions. Central banks, notably the U.S. Federal Reserve, responded with aggressive monetary tightening, implementing a series of interest rate hikes designed to cool an overheated economy and bring price stability back into equilibrium. While these measures aim to curb inflationary pressures, they inherently increase the cost of capital and dampen overall economic activity, raising the specter of a recession.\n\nNow, the focus has distinctly moved to the potential for growth deceleration. Analysts from institutions like Metrobank Wealth Insights observe that traders are increasingly pricing in the likelihood of a significant economic contraction rather than continued inflationary spirals. This apprehension is particularly pronounced in the technology sector, which has been a bellwether for market sentiment. Tech companies, often characterized as \"growth stocks,\" derive much of their valuation from projected future earnings. Higher interest rates, however, diminish the present value of those future cash flows, making these stocks less attractive. Furthermore, a slowing economy means reduced consumer and business spending, directly impacting the revenue streams of many tech giants.\n\nThe ongoing \"tech rout\" is not merely a sector-specific correction but a reflection of a fundamental recalibration of risk appetite across the market. Investors are withdrawing from speculative assets and reallocating capital towards more defensive sectors, anticipating a period of economic turbulence. This shift highlights the delicate balancing act faced by policymakers: taming inflation without inadvertently triggering a severe downturn. The current environment suggests that the market believes central banks' efforts to control inflation are now posing a substantial threat to economic expansion, leading to heightened volatility and uncertainty as investors navigate this complex landscape.", "vocab": [{"word": "Pivot", "definition": "To change direction or focus, often suddenly or significantly."}, {"word": "Persistent", "definition": "Continuing firmly or obstinately in a course of action in spite of difficulty or opposition; lasting for a long time."}, {"word": "Monetary tightening", "definition": "Actions taken by a central bank to reduce the amount of money and credit in the economy, typically by raising interest rates, to combat inflation."}, {"word": "Specter", "definition": "Something widely feared as a possible unpleasant or dangerous occurrence; a potential threat."}, {"word": "Deceleration", "definition": "The process of slowing down or reducing speed; a decrease in the rate of growth."}, {"word": "Apprehension", "definition": "Anxiety or fear that something bad or unpleasant will happen."}, {"word": "Bellwether", "definition": "A person or thing that shows the existence or direction of a trend; an indicator of future trends."}, {"word": "Recalibration", "definition": "The process of adjusting or re-evaluating something to ensure accuracy or suitability for a new situation or standard."}]}}, "questions": [{"q": "What was the main worry for investors before, and what is it now?", "a": "Before, investors worried about inflation (prices going up). Now, they worry about the economy growing too slowly."}, {"q": "What is happening to technology stocks, and what does this indicate?", "a": "Technology stocks are falling sharply (a \"rout\"). This indicates growing investor concern about economic growth and market uncertainty."}], "id": "aeb2671e519", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxPQ09SdkRrQlpXbEpaQUxoLTZVUzNCajBnaHpESkZ2UEpTWlhhUUN4MnJMODYxeVlpcmtFc3loM2xnb2dpTnhkbHlQV1AyYXJHNEVIOGxxV0RxckE3bnk1a1daR25uZjNGY3JjTVFpNEZhWUVKR2pkLXhQbl9ncnBQeWgybkdvbjZZdm1hYTdmTGRyRXhZTy1nVFBWcjQ0dFB5dTJ1WVhNMmJxZ3BTMEtjTTZwQzN1Vl9fTTBn?oc=5", "published": "2026-11-09T09:53:05+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Nvidia CEO Under Investigation Over Suspected Spy Affair", "excerpt": "Nvidia's CEO, Jensen Huang, faces investigation after admitting an affair with a person suspected of being a Chinese spy.", "levels": {"Beginner": {"text": "Nvidia is a very big technology company. It makes important computer parts. The boss of Nvidia is Jensen Huang. News says that Mr. Huang is now part of an investigation.\n\nMr. Huang said he was \"unfaithful\" to his wife. This means he had a secret relationship with someone else. The person he had this relationship with is thought to be a spy from China. This is a serious problem for security.\n\nNvidia has started its own investigation. Also, a security investigation is happening. Mr. Huang has said he will help with these investigations. He will tell them what he knows.\n\nThis situation is important because Nvidia makes technology that is very advanced. Some people worry that important company secrets or national secrets could be at risk if a spy was involved. The investigations will try to find out exactly what happened and if any secrets were shared.", "vocab": [{"word": "company", "definition": "a business that makes or sells things."}, {"word": "boss", "definition": "the person in charge of a company or group."}, {"word": "unfaithful", "definition": "having a secret romantic relationship with someone who is not your husband or wife."}, {"word": "suspected", "definition": "believed to be true or to have done something, but not yet proven."}, {"word": "spy", "definition": "a person who secretly collects information about an enemy country or company."}, {"word": "investigation", "definition": "an official process to find out the truth about something."}]}, "Intermediate": {"text": "Jensen Huang, the prominent CEO of Nvidia, a leading technology company known for its advanced graphics processing units (GPUs) and artificial intelligence (AI) chips, is currently under the spotlight. Nvidia has launched an investigation into Mr. Huang following his admission of an affair with an individual suspected of being a Chinese spy.\n\nMr. Huang publicly acknowledged that he had been \"unfaithful\" to his wife. This personal admission has quickly escalated into a matter of significant corporate and national security concern. The core issue revolves around the identity of the other person involved in the affair, who is believed to be an intelligence operative working for China. Such a connection could pose a serious risk, especially for a company at the forefront of critical technological innovation.\n\nGiven Nvidia's crucial role in developing cutting-edge technology, including components vital for military applications, data centers, and advanced computing, any potential link between its CEO and a foreign intelligence agent raises serious questions. There are concerns about the possible compromise of sensitive company data, intellectual property, or even broader national security secrets that could be exploited by a foreign power. The company's products are essential for many sectors, making any security vulnerability a major concern.\n\nBoth Nvidia and wider security agencies have initiated probes into the matter. Mr. Huang has stated his full commitment to cooperate with these investigations, aiming to provide transparency and clarity. The goal is to determine the full extent of the relationship, assess any security breaches, and understand the potential implications for Nvidia's operations and national interests. This incident highlights the increasing scrutiny on tech executives and the complex interplay between personal conduct and geopolitical security, especially in an era of heightened international competition over technology.", "vocab": [{"word": "prominent", "definition": "important and well-known."}, {"word": "admitted", "definition": "said that something is true, often something bad or embarrassing."}, {"word": "unfaithful", "definition": "having a romantic relationship with someone other than your husband, wife, or partner."}, {"word": "national security", "definition": "the protection of a country from threats or dangers."}, {"word": "intellectual property", "definition": "creations of the mind, such as inventions, literary and artistic works, designs, and symbols, which are protected by law."}, {"word": "implications", "definition": "possible future effects or results."}, {"word": "cooperate", "definition": "to work together or help someone to achieve something."}]}, "Advanced": {"text": "Nvidia, a global titan in the semiconductor industry and a pivotal player in the artificial intelligence revolution, finds its CEO, Jensen Huang, at the center of a high-stakes security investigation. The company has initiated an internal probe following Huang's candid admission of an extramarital affair with an individual reportedly suspected of being an operative for Chinese intelligence. This development has rapidly transcended a personal indiscretion, morphing into a significant corporate governance challenge and a matter of profound national security concern.\n\nHuang's acknowledgment of having been \"unfaithful\" to his wife has opened a Pandora's Box of potential ramifications. The alleged involvement of a suspected Chinese spy introduces a potent geopolitical dimension, placing the incident squarely within the broader context of intense technological rivalry and corporate espionage between the United States and China. Nvidia's dominance in designing graphics processing units (GPUs) and AI accelerators makes its technology indispensable across numerous strategic sectors, from advanced computing and data centers to defense applications and autonomous systems. Any compromise of its leadership or proprietary information could have far-reaching implications for national economic competitiveness and military capabilities, potentially altering the balance of power in critical technological domains.\n\nThe primary concern revolves around the potential for intellectual property theft, sensitive data exfiltration, or the establishment of vulnerabilities within Nvidia's supply chain or product development processes. A foreign intelligence operative, particularly one targeting a company at the cutting edge of AI, could seek to gain insights into future technological roadmaps, exploit design flaws, or even influence strategic decisions regarding market access or partnerships. Such actions could confer a significant, illicit advantage to rival nations or entities, undermining fair competition and national security. The nature of the relationship, its duration, and the extent of information shared, whether intentionally or inadvertently, will be crucial points of inquiry.\n\nBoth Nvidia's board of directors and relevant national security agencies are reportedly conducting parallel, rigorous investigations. Huang has publicly committed to full cooperation, a stance critical for mitigating reputational damage and demonstrating transparency to shareholders and the public. However, the incident raises serious questions regarding corporate governance, executive vetting processes, and the inherent risks faced by leaders of strategically vital technology firms. It underscores the imperative for robust internal security protocols and comprehensive awareness among senior executives regarding the sophisticated methods employed by state-sponsored actors to infiltrate key industries and compromise critical infrastructure. The outcome of these investigations will not only shape Huang's future at Nvidia but could also influence broader policies concerning national security oversight in the tech sector, potentially leading to stricter regulations for executives in sensitive roles. The incident serves as a stark reminder of the intricate nexus between personal conduct, corporate integrity, and geopolitical security in the 21st century.", "vocab": [{"word": "titan", "definition": "a person or thing of very great strength, intellect, or importance."}, {"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "extramarital", "definition": "(of a sexual relationship) occurring outside marriage."}, {"word": "transcended", "definition": "went beyond the range or limits of (something abstract, typically a conceptual field or division)."}, {"word": "geopolitical", "definition": "relating to politics, especially international relations, as influenced by geographical factors."}, {"word": "exfiltration", "definition": "the unauthorized removal of data from a computer or network."}, {"word": "proprietary", "definition": "relating to an owner or ownership; made and sold by a particular company."}, {"word": "nexus", "definition": "a connection or series of connections linking two or more things."}]}}, "questions": [{"q": "Who is the CEO of Nvidia mentioned in the article?", "a": "Jensen Huang"}, {"q": "What is the primary concern raised by the CEO's affair?", "a": "The primary concern is that the other person involved is a suspected Chinese spy, which raises significant national security issues and concerns about the potential compromise of sensitive technology or intellectual property."}], "id": "a687e31f120", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/c3dxw10rjn9no?at_medium=RSS&at_campaign=rss", "published": "2026-11-09T09:50:06+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Israel's Eisenkot Asked to Form New Government", "excerpt": "In a significant political move, Israeli opposition figure Gadi Eisenkot has been tasked with the challenge of forming the nation's next government.", "levels": {"Beginner": {"text": "Gadi Eisenkot, an important leader in Israel's opposition, has been asked to form the country's next government. This means he needs to get enough political parties to work together. In Israel, the President usually asks someone to do this after an election or if the current government stops working.\n\nTo form a government, Mr. Eisenkot must find enough support from different parties in the Knesset. The Knesset is like Israel's parliament, where laws are made. He needs more than half of the members to agree to join his government. If he succeeds, he will become the new Prime Minister, leading the country.\n\nForming a government in Israel can be hard because there are many different political parties. Each party has its own ideas. Mr. Eisenkot will have a set time to talk to these parties and try to build a team. If he cannot get enough support, the President might ask someone else, or there could be new elections. This is a big step for Israel's politics.", "vocab": [{"word": "Leader", "definition": "A person who guides or directs a group or country."}, {"word": "Government", "definition": "The group of people who control a country or state."}, {"word": "Asked", "definition": "To request someone to do something."}, {"word": "Form", "definition": "To create or establish something."}, {"word": "Parties", "definition": "Groups of people with similar political ideas who work to win elections."}, {"word": "Country", "definition": "A nation or a land with its own government."}]}, "Intermediate": {"text": "Gadi Eisenkot, a prominent figure within Israel's political opposition, has received a mandate to form the country's next government. This development signals a potentially significant shift in the nation's political landscape. In Israel's parliamentary democracy, the President typically assigns this crucial task to a member of the Knesset (parliament) after a general election or if the existing government collapses.\n\nThe process of forming a government involves extensive negotiations. Mr. Eisenkot must secure the support of a majority of the 120 members of the Knesset. This means he needs at least 61 votes from various political parties to create a stable coalition. Israel's political system is known for its multi-party environment, often making it challenging to achieve a clear majority for any single party. Therefore, coalition governments, where several parties agree to work together, are common.\n\nMr. Eisenkot will be given a specific timeframe, usually around 28 days, with a possible extension, to conduct these negotiations. His goal is to unite different factions under a common platform and present a new government to the Knesset for approval. If he succeeds in building a viable coalition, he will be appointed as the new Prime Minister, leading the executive branch of the government.\n\nHowever, if Mr. Eisenkot fails to gather sufficient support within the allotted time, the President may then offer the mandate to another candidate. Should that also prove unsuccessful, the country could face the prospect of another general election, a scenario not uncommon in Israel's often volatile political arena. This current request to Mr. Eisenkot highlights the ongoing complexities of Israeli politics and the continuous efforts to establish stable governance.", "vocab": [{"word": "Opposition", "definition": "Political parties or groups that are not part of the government."}, {"word": "Mandate", "definition": "An official order or permission to do something, especially from the people to their representatives."}, {"word": "Coalition", "definition": "A temporary alliance of political parties forming a government or working together."}, {"word": "Knesset", "definition": "The parliament of Israel, its legislative body."}, {"word": "Negotiate", "definition": "To discuss something formally in order to reach an agreement."}, {"word": "Political landscape", "definition": "The current state of politics in a particular place, including the different parties and their influence."}, {"word": "Volatile", "definition": "Likely to change rapidly and unpredictably, especially for the worse."}]}, "Advanced": {"text": "Gadi Eisenkot, a seasoned figure within Israel's political opposition, has reportedly been entrusted with the pivotal mandate to construct the nation's forthcoming government. This development underscores the intricate and often fluid nature of Israeli parliamentary democracy, where the formation of a stable administration frequently hinges on complex coalition negotiations. In this system, the largely ceremonial but constitutionally significant role of the President involves consulting with party leaders following a general election or a governmental collapse, subsequently tasking the Knesset member deemed most likely to succeed with the challenge of forming a cabinet.\n\nEisenkot, a former Chief of Staff of the Israel Defense Forces, brings a background of military leadership and public service to this political endeavor. His immediate task is to forge a viable coalition that commands the support of a majority in the 120-seat Knesset, requiring at least 61 legislative votes. Israel's political arena is characterized by a multi-party system and significant ideological fragmentation, making the assembly of a broad-based government a formidable undertaking. Parties often represent diverse religious, secular, nationalist, and economic interests, necessitating considerable compromise to achieve consensus on a governing platform.\n\nTypically, the candidate receives an initial period, often 28 days, to conduct these intensive negotiations, with the possibility of a 14-day extension. During this time, Eisenkot will engage in intricate discussions with leaders of various factions, attempting to bridge ideological divides and allocate ministerial portfolios. Success in this endeavor would see him sworn in as Prime Minister, leading the executive branch and steering national policy. The stability of such a government would then depend on its ability to maintain internal cohesion and navigate the country's pressing domestic and security challenges.\n\nShould Eisenkot fail to secure the requisite parliamentary majority within the allotted timeframe, the mandate could then be passed to another Knesset member. If that individual also proves unsuccessful, or if no other candidate can demonstrate sufficient support, the President may be compelled to dissolve the Knesset and call for new general elections. This cycle of frequent elections and shifting coalitions has been a recurring feature of Israeli politics, reflecting deep societal divisions and the challenges of achieving sustained political stability. The current request to Eisenkot highlights the ongoing political calculus and the continuous quest for effective governance in a nation accustomed to dynamic political shifts.", "vocab": [{"word": "Entrusted", "definition": "Given the responsibility for something important."}, {"word": "Pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "Intricate", "definition": "Very complicated or detailed."}, {"word": "Parliamentary democracy", "definition": "A system of government where citizens elect representatives to a legislative body (parliament), and the executive branch (government) is formed by the party or coalition with the most seats in parliament."}, {"word": "Coalition government", "definition": "A cabinet of a parliamentary government in which several political parties cooperate, reducing the dominance of any one party within that coalition."}, {"word": "Fragmentation", "definition": "The process or state of breaking or being broken into small or separate parts. In politics, this refers to many small parties."}, {"word": "Consensus", "definition": "A general agreement among various groups or parties."}, {"word": "Ramifications", "definition": "A complex or unwelcome consequence of an action or event."}, {"word": "Political calculus", "definition": "The process of making strategic decisions in politics, often involving complex calculations of potential gains and losses."}]}}, "questions": [{"q": "Who has been asked to form the next government in Israel?", "a": "Gadi Eisenkot."}, {"q": "What is the name of Israel's parliament?", "a": "The Knesset."}], "id": "a87b83ee3df", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiY0FVX3lxTFA2OWlOZm0wN1QxV3JudldWUUF2cFpBdjdBZy00RWNFZnJ2RU1xTC1kdnUwQVdaUVZDUU9hSFM5N3RUTFU3TjFia0NLOUdOcmN1X2V0bXM5TDlXSTBpNXdtZGhjYw?oc=5", "published": "2026-11-09T09:15:51+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "New Zealand Election: No Clear Winner as Talks Set for Nov. 27 - JournalArta", "excerpt": "New Zealand Election: No Clear Winner as Talks Set for Nov. 27 JournalArta", "levels": {"Beginner": {"text": "New Zealand Election: No Clear Winner as Talks Set for Nov. 27 JournalArta", "vocab": []}, "Intermediate": {"text": "New Zealand Election: No Clear Winner as Talks Set for Nov. 27 JournalArta", "vocab": []}, "Advanced": {"text": "New Zealand Election: No Clear Winner as Talks Set for Nov. 27 JournalArta", "vocab": []}}, "questions": [], "id": "a5ac2cbf87a", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxNZGZQTS1sTG9iNHloc1FrN1N0RUdTSlc5M2ZwYTFyUEZsQlR3OXJtZjdSNFpoUU53ckZaWnJRazRyQXZ1VDBURGpnWXdKdVZNR0hjUWQ1Q0syMTJYNXFETDZmZkZyaFV5Ml9rYmQ5eHhyR0o1YVZrYUFIRFdUc3NobUFPQVJFeWFEb3pBZDh0X2IxTlplSUdTMTVBZnVBM19LMkVn?oc=5", "published": "2026-11-09T09:07:08+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "WTGL Makes 'Surreal' Debut, Boosting Women's Sports", "excerpt": "The new WTGL league has launched, marking a significant and 'surreal' moment for the growing world of women's professional sports.", "levels": {"Beginner": {"text": "WTGL is a new sports league for women. It just started its first games. This is called a \"debut.\" Many people felt very excited about it. They said it felt \"surreal.\" This means it felt like a dream, almost too good to be true, because it was such a big moment.\n\nThe new league is a big step for women's sports. It gives more women a chance to play sports professionally. Before, there were fewer places for women to play at a high level. Now, more athletes can follow their dreams and have a career in sports. This is very important for equality in sports.\n\nFans are also very happy. They can watch more exciting games and cheer for their favorite teams. This shows that women's sports are becoming more popular around the world. More people want to see women compete and succeed. The start of WTGL helps women's sports grow even bigger. It is an important time for athletes and fans everywhere, looking forward to many great seasons ahead.", "vocab": [{"word": "League", "definition": "a group of sports teams that play against each other."}, {"word": "Debut", "definition": "the first public appearance of something or someone."}, {"word": "Surreal", "definition": "feeling strange, like a dream; very exciting or unbelievable."}, {"word": "Professionally", "definition": "doing something as a job, usually for money."}, {"word": "Equality", "definition": "the state of being equal, especially in status, rights, or opportunities."}, {"word": "Succeed", "definition": "to achieve something that you planned or tried to do."}]}, "Intermediate": {"text": "The world of women's sports recently celebrated a significant milestone with the \"surreal\" debut of the WTGL, a brand-new professional league. The launch has been met with widespread excitement, marking a pivotal moment in the ongoing expansion and recognition of female athletics.\n\nThe term \"surreal\" captures the profound sense of accomplishment and anticipation surrounding the league's inauguration. For many involved, from athletes to organizers and fans, it represents the culmination of years of effort and a dream realized, transforming aspirations into a tangible reality. This sentiment underscores the growing momentum behind women's sports globally.\n\nNew professional leagues like WTGL are crucial for several reasons. Firstly, they provide more opportunities for talented female athletes to pursue full-time careers in their chosen sport, offering better pay, facilities, and visibility. This helps to close the gap in professional pathways that has historically existed between men's and women's sports. Secondly, these leagues boost fan engagement and media coverage, attracting new audiences and increasing the overall profile of women's competitions.\n\nThe establishment of WTGL reflects a broader trend of increasing investment and interest in women's sports. From football to basketball and beyond, viewership numbers are rising, and corporate sponsorships are growing. While launching any new sports league comes with its own set of challenges, including building a sustainable fan base and securing long-term financial stability, the current climate for women's sports is exceptionally positive. The debut of WTGL is a clear indicator that the future for female athletes and their leagues is bright, promising more thrilling competitions and inspiring role models for generations to come.", "vocab": [{"word": "Milestone", "definition": "an important event in the development or history of something."}, {"word": "Pivotal", "definition": "very important or crucial to the success of something."}, {"word": "Inauguration", "definition": "the formal beginning or introduction of something."}, {"word": "Culmination", "definition": "the highest or final point of a series of actions or events."}, {"word": "Tangible", "definition": "able to be touched or felt; real or actual."}, {"word": "Visibility", "definition": "the state of being seen or known by many people."}, {"word": "Sustainable", "definition": "able to be maintained at a certain rate or level; able to continue for a long time."}]}, "Advanced": {"text": "The recent \"surreal\" debut of the WTGL league marks a truly pivotal moment in the rapidly evolving landscape of professional women's athletics. The launch has resonated deeply across the sports world, signifying not just the introduction of a new competition but a powerful affirmation of the burgeoning commercial and cultural viability of women's sports globally.\n\nThe descriptor \"surreal\" encapsulates the profound sense of achievement and almost disbelief for those who have tirelessly advocated for greater equity and opportunity. It represents the culmination of sustained efforts by athletes, administrators, and fans, transforming long-held aspirations into a concrete, high-profile reality. This sentiment highlights the significant shift in perception and investment that has propelled women's sports into an unprecedented era of growth, challenging traditional narratives and fostering a more inclusive sporting culture.\n\nThe strategic importance of establishing new professional leagues such as WTGL cannot be overstated. These platforms are instrumental in expanding professional pathways for female athletes, offering enhanced remuneration, state-of-the-art facilities, and unparalleled media exposure. This directly addresses historical disparities, enabling more women to pursue viable, full-time careers and reach their athletic zenith. Furthermore, these leagues are critical drivers of fan engagement, attracting diverse demographics and fostering a deeper connection with the sport, thereby amplifying its cultural footprint and economic impact through merchandise, ticketing, and media rights.\n\nThe WTGL's inauguration aligns with a broader, undeniable global trend: the escalating popularity and commercial appeal of women's sports. From record-breaking viewership figures in major tournaments to increasing corporate sponsorships and media rights deals, the market is demonstrating a robust appetite for female athletic excellence. While the establishment and long-term sustainability of any nascent league present inherent challenges—including securing consistent funding, cultivating a dedicated fan base, and navigating competitive sports markets—the current tailwinds for women's sports are formidable, suggesting a strong foundation for success.\n\nThis new league is poised to contribute significantly to a more diverse, inclusive, and equitable sports ecosystem. By providing additional opportunities for elite competition and inspiring the next generation of athletes, WTGL is not merely launching a season; it is actively shaping the future trajectory of women's professional sports. Its debut underscores a collective commitment to fostering environments where female athletic prowess is celebrated, valued, and given the platform it unequivocally deserves, promising a vibrant and impactful future that extends beyond the playing field, influencing societal perceptions of women's capabilities and achievements.", "vocab": [{"word": const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
