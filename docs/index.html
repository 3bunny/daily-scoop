,” now streaming on Apple TV. The Soviet Union took an unexpected leap into the history books, again, in the Season 1 finale of Apple TV’s “Star City,” which saw the cosmonaut program actually make it to Venus and do […]", "vocab": []}}, "questions": [], "id": "a767e95eebe", "source": "Variety", "link": "https://variety.com/2026/tv/news/star-city-finale-creators-killing-valya-venus-1236806705/", "published": "2026-07-11T07:30:00+09:00", "category": "entertainment"}, {"headline": "Singer Huey Lewis says music is 'not part of my life' after going deaf - USA Today", "excerpt": "Singer Huey Lewis says music is 'not part of my life' after going deaf USA Today", "levels": {"Beginner": {"text": "Singer Huey Lewis says music is 'not part of my life' after going deaf USA Today", "vocab": []}, "Intermediate": {"text": "Singer Huey Lewis says music is 'not part of my life' after going deaf USA Today", "vocab": []}, "Advanced": {"text": "Singer Huey Lewis says music is 'not part of my life' after going deaf USA Today", "vocab": []}}, "questions": [], "id": "ad1a368aaba", "source": "\"entertainment OR film OR music OR celebrity OR television when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMixgFBVV95cUxOUG5UY2djd0NORnZNUkc5R01pQWM0OWxaSTJrb2RWTjkzYWEwUFVDVlc1OFdCdUMwczM1cFJfU05qeVVOb0pzM2k3Y09BX2dXN0UzTUxjaVZacks5QTlGT1JDWWlySFZfZ0JjUUtQSUlxeFRfZkZBVm92TlR6SHVOOC1KWnQtRlZEaHdDUXdzYXFZeEk5V3JYbzZuX3JlZWFVbEd3cW5IbjlRMWhtT09rb3FzWW5NNURZeVBjOW9fRTVZQmJ6aXc?oc=5", "published": "2026-07-11T07:21:00+09:00", "category": "entertainment"}]}], "home": [{"headline": "Apple Sues OpenAI Over Alleged Trade Secret Theft", "excerpt": "Tech giant Apple has filed a lawsuit against AI firm OpenAI, claiming the company stole valuable trade secrets.", "levels": {"Beginner": {"text": "Apple, a very big technology company, has started a legal case against OpenAI. OpenAI is another company that makes special computer programs called AI. Apple says that OpenAI stole important company secrets. These are called 'trade secrets.'\n\nWhen a company starts a legal case, it means they are taking another company to court. Apple believes OpenAI took information that helps Apple make its products special. This information is not public and is very important for Apple's business.\n\nBoth Apple and OpenAI are well-known in the world of technology. Apple makes iPhones and computers. OpenAI makes AI tools like ChatGPT. This lawsuit shows that big companies are very serious about protecting their special ideas and information. It is a big step for Apple to sue another major tech company. The court will now look into Apple's claims.", "vocab": [{"word": "legal case", "definition": "A problem or disagreement that is decided in a court of law."}, {"word": "AI", "definition": "Short for Artificial Intelligence; computer programs that can think and learn like humans."}, {"word": "trade secrets", "definition": "Important, private information that helps a company succeed."}, {"word": "protecting", "definition": "Keeping something safe from harm or loss."}, {"word": "claims", "definition": "Statements that something is true, often needing proof."}]}, "Intermediate": {"text": "Apple, the global technology giant, has initiated a lawsuit against OpenAI, a leading artificial intelligence company. Apple alleges that OpenAI engaged in the theft of its valuable trade secrets. This legal action highlights the intense competition and the critical importance of intellectual property in the rapidly evolving tech industry.\n\nA lawsuit is a formal complaint filed in a court of law, where one party seeks a legal remedy from another. In this instance, Apple is accusing OpenAI of unlawfully acquiring and using confidential information that gives Apple a competitive edge. Trade secrets can include a wide range of proprietary information, such as designs, algorithms, formulas, or business strategies, that are not generally known and provide economic value to their owner.\n\nBoth Apple and OpenAI are prominent players in the technology sector. Apple is renowned for its consumer electronics and software, while OpenAI has gained significant recognition for its generative AI models, including ChatGPT. This legal dispute underscores the high stakes involved as tech companies race to develop and dominate the artificial intelligence landscape. The outcome of this case could have significant implications for how intellectual property is protected and shared within the AI community, potentially setting a precedent for future collaborations and rivalries. The court will now examine the evidence to determine the validity of Apple's allegations.", "vocab": [{"word": "initiated", "definition": "Started or began something."}, {"word": "alleges", "definition": "States that someone has done something wrong, but without proof yet."}, {"word": "intellectual property", "definition": "Creations of the mind, such as inventions, literary and artistic works, designs, and symbols, for which a person or company can claim ownership."}, {"word": "proprietary", "definition": "Relating to an owner or ownership; something that is owned and protected by a company."}, {"word": "prominent", "definition": "Important and well-known."}, {"word": "implications", "definition": "Possible future effects or results of an action or decision."}]}, "Advanced": {"text": "In a significant development reverberating through the tech industry, Apple has filed a comprehensive lawsuit against OpenAI, the trailblazing artificial intelligence research company. The Cupertino-based titan asserts that OpenAI has committed intellectual property infringement by illicitly acquiring and utilizing its highly sensitive trade secrets. This litigation underscores the escalating stakes and fierce competition characterizing the burgeoning generative AI sector.\n\nA trade secret, as defined legally, encompasses confidential business information that provides an enterprise with a competitive advantage because it is not generally known or ascertainable by others. Such secrets can range from intricate algorithms and proprietary data sets to unique manufacturing processes or strategic business plans. Apple's complaint suggests that OpenAI's alleged actions undermine the integrity of its innovation and potentially compromise its market position.\n\nThis legal battle pits two of the most influential entities in modern technology against each other. Apple, a global leader in consumer electronics and software ecosystems, is increasingly integrating AI capabilities across its product lines. OpenAI, on the other hand, has rapidly ascended to prominence with its groundbreaking large language models like ChatGPT, which have revolutionized public perception and application of AI. The lawsuit emerges amidst a broader industry trend where tech giants are aggressively investing in and vying for dominance in AI development, often leading to complex partnerships and intense rivalries.\n\nThe outcome of this high-profile case could establish crucial precedents for intellectual property protection in the age of artificial intelligence. It raises fundamental questions about data sourcing, model training, and the ethical boundaries of competitive intelligence within the AI landscape. Should Apple's allegations be substantiated, it could lead to substantial financial penalties for OpenAI and potentially force a re-evaluation of its operational practices. Conversely, if OpenAI successfully defends against the claims, it could embolden further aggressive innovation. The proceedings will undoubtedly be closely watched by industry observers, legal experts, and policymakers, as they may shape the future trajectory of AI innovation and collaboration.", "vocab": [{"word": "reverberating", "definition": "Having a far-reaching and significant impact or effect; echoing throughout."}, {"word": "trailblazing", "definition": "Being a pioneer in a particular field or area; introducing new methods or ideas."}, {"word": "illicitly", "definition": "In a manner forbidden by law, rules, or custom; illegally or improperly."}, {"word": "litigation", "definition": "The process of taking legal action; a lawsuit."}, {"word": "burgeoning", "definition": "Beginning to grow or increase rapidly; flourishing."}, {"word": "ascertainable", "definition": "Able to be found out or discovered; capable of being determined."}, {"word": "substantiated", "definition": "Provided with evidence to support or prove the truth of something; confirmed."}, {"word": "trajectory", "definition": "The path or course followed by a moving object; a course of development or progress."}]}}, "questions": [{"q": "Why is Apple suing OpenAI?", "a": "Apple is suing OpenAI because it alleges the AI company stole trade secrets."}, {"q": "What kind of information can be considered a 'trade secret'?", "a": "Trade secrets can include confidential business information like designs, algorithms, formulas, business strategies, or unique processes that give a company a competitive advantage."}], "id": "a17fa1767ab", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxQODNobDNCbmdoNkJfQldXUEVZdm9XQkVISmhDaEF1QVBtNlUtSE1TNFBYM21HTU9sYm1feENtLUN1d1BVb1dBVE5iY0wyWEw0Y1N5Sm01bnphWm4wVEtHbmE4SVlZODV1VEQ0Slhiam82U25FeXlqRVdyVExvVkVJUGdXY1BlRkthWjdaRFBqb1dXdy1FZGFOUjcyaHBxRjVWbkk4OG5WS215N294d0dWag?oc=5", "published": "2026-07-11T07:50:13+09:00", "category": "business", "category_title": "Business"}, {"headline": "Savannah Liquor License Dispute: Business Owner and City Respond", "excerpt": "A disagreement has emerged in Savannah regarding a liquor license, involving a local business owner and city officials.", "levels": {"Beginner": {"text": "A business owner in Savannah wants a special paper called a liquor license. This paper lets them sell drinks like beer and wine. But there is a problem, or a \"dispute,\" about it. City leaders in Savannah are talking about this.\n\nThe business owner wants to open a new place or make their current business bigger. They say it will bring new jobs and help the city's money. They want to serve drinks to customers.\n\nBut some people who live near the business are worried. They might worry about noise late at night. They might worry about more cars on their streets. These people want their neighborhood to stay quiet and safe.\n\nCity leaders have to listen to everyone. They need to think about what is good for the business and what is good for the people living nearby. They have rules about where businesses can sell drinks. They must decide if this business follows the rules and if it is right for the area.\n\nThis kind of problem happens often in cities. It is important for everyone to talk and try to find a good answer. The city leaders will make a choice soon.", "vocab": [{"word": "license", "definition": "A special paper that lets you do something, like sell drinks."}, {"word": "dispute", "definition": "A disagreement or problem between people."}, {"word": "leaders", "definition": "People who guide or make decisions for a group or city."}, {"word": "worried", "definition": "Feeling uneasy or anxious about something."}, {"word": "neighborhood", "definition": "An area where people live, often close to each other."}, {"word": "rules", "definition": "Instructions that tell you what you can or cannot do."}]}, "Intermediate": {"text": "A controversy has emerged in Savannah concerning a liquor license application, drawing responses from both a local business owner and city officials. The dispute centers on a proposal for a new or expanded establishment that would serve alcoholic beverages.\n\nThe business owner argues that granting the license would foster economic growth within the city. They highlight potential benefits such as job creation, increased tax revenue, and a boost to local commerce. The owner emphasizes their commitment to operating a responsible establishment that contributes positively to Savannah's vibrant economy and social scene. They believe their business will attract customers and enhance the city's appeal.\n\nHowever, the application has met with opposition from some community members, particularly residents living in the vicinity of the proposed location. Their concerns often revolve around quality-of-life issues. These include potential increases in noise levels, traffic congestion, and parking difficulties, especially during late hours. Residents also express worries about public safety and maintaining the residential character of their neighborhood.\n\nCity leaders are now tasked with carefully reviewing the application and weighing these competing interests. They must consider local zoning ordinances, public safety regulations, and the overall impact on the community. Public hearings are typically held to allow all stakeholders—the business owner, residents, and other interested parties—to voice their perspectives. The city council or relevant municipal body will ultimately make a decision, aiming to strike a balance between supporting local businesses and preserving the quality of life for its citizens. This situation reflects a common challenge faced by growing urban centers.", "vocab": [{"word": "controversy", "definition": "A public disagreement or debate."}, {"word": "application", "definition": "A formal request for something, like a permit or a license."}, {"word": "foster", "definition": "To encourage the development or growth of something."}, {"word": "vicinity", "definition": "The area near or surrounding a particular place."}, {"word": "congestion", "definition": "A situation where something is too full or blocked, such as traffic."}, {"word": "ordinances", "definition": "Laws or rules made by a city or town government."}, {"word": "stakeholders", "definition": "People or groups who have an interest or concern in a particular matter."}]}, "Advanced": {"text": "Savannah is currently grappling with a contentious liquor license dispute, which has elicited strong responses from both a local entrepreneur and municipal authorities. At its core, the disagreement revolves around an application for a new or expanded establishment seeking the necessary permits to dispense alcoholic beverages. This situation underscores the perennial challenge faced by urban centers in balancing economic dynamism with community preservation.\n\nThe business owner, advocating for the license, articulates a vision of economic revitalization and job creation. They contend that approving the application would not only generate direct employment opportunities but also stimulate ancillary businesses and contribute significantly to the city's tax base. Furthermore, the entrepreneur often highlights their commitment to responsible business practices, emphasizing adherence to regulations and a desire to enhance Savannah's appeal as a vibrant destination. They view their venture as an investment in the city's future, promising a positive contribution to its commercial and social fabric.\n\nConversely, the proposal has encountered considerable opposition from a segment of the community, particularly residents residing in close proximity to the prospective location. Their objections frequently center on quality-of-life concerns, including the potential for increased ambient noise, exacerbated traffic congestion, and a strain on available parking resources, especially during peak operating hours. Residents also voice apprehensions regarding public safety, the potential for disruptive behavior, and the erosion of their neighborhood's residential character. They implore city leaders to prioritize the existing community's well-being over commercial expansion in sensitive areas.\n\nMunicipal authorities are thus confronted with the intricate task of adjudicating this matter. Their decision-making process involves a thorough review of the application against established zoning ordinances, public safety protocols, and the broader comprehensive plan for urban development. Public hearings serve as crucial forums where all pertinent stakeholders—including the applicant, neighborhood associations, law enforcement, and other interested parties—can present their arguments and evidence. The city council or designated regulatory body must engage in due diligence, weighing the potential economic benefits against the documented or anticipated social costs. The outcome will inevitably reflect the city's prevailing policy stance on fostering commercial growth while safeguarding residential amenities. This ongoing dialogue is characteristic of a maturing urban landscape striving for sustainable development.", "vocab": [{"word": "grappling", "definition": "Struggling to deal with a difficult problem or challenge."}, {"word": "contentious", "definition": "Causing or likely to cause an argument; controversial."}, {"word": "elicited", "definition": "Drew forth (a response, answer, or fact) from someone."}, {"word": "perennial", "definition": "Lasting or existing for a long or apparently infinite time; enduring."}, {"word": "ancillary", "definition": "Providing necessary support to the primary activities or operation of an organization or system."}, {"word": "exacerbated", "definition": "Made (a problem, bad situation, or negative feeling) worse."}, {"word": "apprehensions", "definition": "Anxieties or fears that something bad will happen."}, {"word": "adjudicating", "definition": "Making a formal judgment or decision about a problem or disputed matter."}, {"word": "due diligence", "definition": "Reasonable steps taken by a person or organization to satisfy a legal requirement, especially in making a thorough investigation before entering into an agreement or a transaction."}]}}, "questions": [{"q": "What is the main issue being discussed in Savannah?", "a": "The main issue is a dispute over a business owner's application for a liquor license in Savannah."}, {"q": "What are two different perspectives on the liquor license application?", "a": "The business owner sees it as an opportunity for economic growth and job creation, while some residents are concerned about potential issues like noise, traffic, and public safety."}], "id": "ac575903956", "source": "\"business OR company OR trade when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMiogFBVV95cUxQZEYyb0JMOU5oUGs4Ri1nS3R4Q3lmMHNWbkQzTVRyVVV0SFBuMnZDZ0pmZ1M5aDNhbG5pYlAyQUpkZGx5R0hxZnVTMFZZX2JNaVR4WEZKNnRlcFpmdGlsOGt6SXNpWVZ2YUFMaXh0ODNKYzdYWm5SQXc3ZVVhZGdLS1NpeWpma016LVVVRGo3MlhWcjdQZ01DZndTdVU2eFl3blHSAbYBQVVfeXFMTk5UdVhwQl9PcEV4d0tPM2tnZzNwQTAzcWpfeURUdElmZlNtckxycXdXVl93UHV0Z2R5SzZwSGlsdThwT2Z2UEgtUFdBWlBKYUhiOGt0UTQ3a3lQNDVPNkpwVVY2U1BFc2tuMFpVQ0NYWjA5VFhUWGh1aDhTZkFiZzlkdGIxTzJoaUtuWFFDQ3VhMWd6eXZaTkQyQ1NjSURydUFoc1Y4UFFsa3o4NFNmZ3d4V0pzY1E?oc=5", "published": "2026-07-11T07:30:00+09:00", "category": "business", "category_title": "Business"}, {"headline": "Circle Wins OCC Approval for National Trust Bank", "excerpt": "Crypto firm Circle received approval from a top U.S. regulator to operate a national trust bank, causing its shares to jump significantly.", "levels": {"Beginner": {"text": "Circle, a company that works with digital money, got good news. A big US government group called the OCC said \"yes\" to Circle. This means Circle can now open a special kind of bank. It's called a national trust bank.\n\nThis approval is very important for Circle. It helps the company work more closely with regular banks and financial rules. Circle is known for a digital coin called USDC. This coin is like digital US dollars. With the new bank, Circle can manage digital money and other assets in a safer, more official way.\n\nWhen this news came out, Circle's shares went up a lot. They jumped by 7.7% even before the stock market officially opened. This shows that investors are happy about Circle getting this approval. It means more trust and growth for the company in the world of digital finance. This step helps digital money become more accepted and used by more people and businesses.", "vocab": [{"word": "digital money", "definition": "money that exists only on computers or online, not as physical cash."}, {"word": "government group", "definition": "an organization that is part of the country's leadership or administration."}, {"word": "approval", "definition": "official permission to do something."}, {"word": "special kind", "definition": "a particular type or category that is different from others."}, {"word": "shares", "definition": "small parts of a company that people can buy and sell."}, {"word": "jumped", "definition": "went up quickly and suddenly."}]}, "Intermediate": {"text": "Circle, a prominent company in the digital finance sector, has achieved a significant milestone by securing approval from the U.S. Office of the Comptroller of the Currency (OCC). This federal agency oversees and regulates national banks. The approval allows Circle to establish and operate as a national trust bank, a move that signals growing legitimacy for the cryptocurrency industry within traditional financial frameworks.\n\nCircle is widely recognized as the issuer of USDC, a stablecoin pegged to the U.S. dollar. This means one USDC is designed to always be worth one U.S. dollar, making it a crucial tool for transactions and stability in the volatile crypto market. The national trust bank charter enables Circle to provide a range of trust services, including the secure custody and management of digital assets for institutional clients. This integration into the regulated banking system is expected to enhance trust and facilitate broader adoption of digital currencies.\n\nThe market reacted positively to the news. Circle's shares saw a notable increase of 7.7% in premarket trading, indicating strong investor confidence in the company's future prospects. This regulatory green light positions Circle to bridge the gap between conventional finance and the burgeoning digital asset economy. By operating under federal oversight, Circle can offer greater assurance to businesses and investors, potentially paving the way for more mainstream financial institutions to engage with digital assets. This development underscores a maturing regulatory environment for cryptocurrencies in the United States.", "vocab": [{"word": "prominent", "definition": "important and well-known."}, {"word": "milestone", "definition": "a very important stage or event in the development of something."}, {"word": "oversees", "definition": "supervises or manages an activity or organization."}, {"word": "legitimacy", "definition": "the quality of being legal, valid, or acceptable."}, {"word": "issuer", "definition": "a company or organization that produces or distributes something, especially financial instruments."}, {"word": "stablecoin", "definition": "a type of cryptocurrency designed to maintain a stable value, often pegged to a fiat currency like the U.S. dollar."}, {"word": "custody", "definition": "the legal right or duty to care for someone or something."}]}, "Advanced": {"text": "Circle, a pivotal player in the digital asset ecosystem and the primary issuer of the USDC stablecoin, has secured a landmark approval from the U.S. Office of the Comptroller of the Currency (OCC). This federal charter grants Circle the authority to operate as a national trust bank, a development that carries profound implications for the integration of digital assets into the traditional financial system. The OCC, an independent bureau within the U.S. Department of the Treasury, is responsible for chartering, regulating, and supervising all national banks and federal savings associations, ensuring their safety, soundness, and fair treatment of customers. This oversight is critical for maintaining stability and public trust in the financial sector.\n\nThis regulatory endorsement is a strategic coup for Circle, enabling it to offer a comprehensive suite of trust services, including the secure custody, management, and administration of digital assets for institutional clients. For a company like Circle, whose USDC stablecoin is a cornerstone of the decentralized finance (DeFi) landscape and a critical conduit for value transfer in the crypto economy, operating under a federal banking charter significantly bolsters its credibility and operational resilience. It provides a robust regulatory framework that can instill greater confidence among institutional investors and corporate treasuries hesitant to engage with less regulated crypto entities. This move is particularly significant as it allows Circle to manage reserves for USDC within a federally supervised entity, enhancing transparency and stability for the stablecoin.\n\nThe market's immediate response was unequivocally positive. Circle's shares experienced a substantial surge of 7.7% in premarket trading, reflecting investor optimism regarding the company's enhanced regulatory standing and expanded business opportunities. This approval not only validates Circle's commitment to regulatory compliance but also sets a precedent for other digital asset firms seeking to bridge the divide between nascent crypto markets and established financial infrastructure. By operating within the purview of federal banking law, Circle can facilitate a more seamless and secure environment for the adoption of digital currencies and blockchain-based financial services. This move is indicative of a broader trend towards regulatory maturation within the U.S. digital asset space, potentially accelerating the mainstream acceptance and utility of stablecoins and other digital assets. It signals a growing recognition by federal regulators of the permanence and potential of digital assets, encouraging further institutional engagement and innovation within a regulated framework. This could lead to increased capital inflows and a more robust, secure digital economy.", "vocab": [{"word": "pivotal", "definition": "of crucial importance in relation to the development or success of something else."}, {"word": "landmark", "definition": "an event or discovery marking an important stage or turning point in something."}, {"word": "profound implications", "definition": "deep and far-reaching effects or consequences."}, {"word": "strategic coup", "definition": "a sudden, brilliant, or highly successful move or achievement, especially in business or politics."}, {"word": "comprehensive suite", "definition": "a complete and extensive set of related services or products."}, {"word": "cornerstone", "definition": "an important quality or feature on which a particular thing depends or is based; a fundamental element."}, {"word": "bolster", "definition": "to support or strengthen; to improve something or make it stronger."}, {"word": "unequivocally", "definition": "in a way that is clear and unambiguous; leaving no doubt."}]}}, "questions": [{"q": "What U.S. government agency approved Circle to operate a national trust bank?", "a": "The U.S. Office of the Comptroller of the Currency (OCC)."}, {"q": "How did Circle's shares react to the news of the approval?", "a": "Circle's shares jumped by 7.7% in premarket trading."}], "id": "a0e59f07a66", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPV3kyRzBIYWdrMU5NOXVEZ1pMc0ktWDBxbTMzSVVRQWlLYl9tRU9KYllnb3dMV3IyYV9GVHRQcUx4WjBKRUhpaFg4Nm83V19KUGI1UG9ZemV5ZmJyTjhPR1I5MnRGbVpCZUg1V2hRVGx3LVFRN3lOQXBwZE9ITXo5aUJKeEJiVUd2M3lnODBNeTVBY1drMG9sbGw1Tl9aZ2xXYVo4QnhKZkNFOHFQTmFRRkdB?oc=5", "published": "2026-07-11T05:35:45+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Key Economic Reports Set to Shape Week Ahead", "excerpt": "A pivotal inflation report and major bank earnings are set to guide economic discussions and market trends in the week ahead.", "levels": {"Beginner": {"text": "This week, people are watching two big things in the news. First, there will be a report about inflation. Inflation means that prices for things like food and clothes are going up. When prices go up, your money buys less. The government and big banks want to keep prices stable. This report will tell us if prices are still rising fast or if they are slowing down. This information is very important for how the economy is doing.\n\nSecond, big banks will share their earnings. Earnings show how much money banks have made. When banks make a lot of money, it can mean that businesses are doing well and people are borrowing and spending. If banks are not making much money, it might mean the economy is slowing down. These bank reports can tell us a lot about the health of the economy.\n\nBoth the inflation report and the bank earnings will help people understand what might happen next with money and jobs. Everyone is waiting to see what the numbers will say. These reports will be the main news for the week ahead. They will help us know if the economy is getting stronger or weaker.", "vocab": [{"word": "inflation", "definition": "When prices for goods and services go up."}, {"word": "prices", "definition": "The amount of money you pay for something."}, {"word": "economy", "definition": "How a country makes and uses money, goods, and services."}, {"word": "banks", "definition": "Places where people keep money and borrow money."}, {"word": "earnings", "definition": "The money a company or bank makes."}, {"word": "report", "definition": "An official statement or document that gives information."}]}, "Intermediate": {"text": "The upcoming week is set to be a significant one for economic observers, with two pivotal events expected to shape market sentiment and policy discussions. The first major highlight is a key inflation report, which economists and central bankers will scrutinize closely. Inflation refers to the rate at which the general level of prices for goods and services is rising, and, consequently, the purchasing power of currency is falling. High inflation can erode savings and make everyday life more expensive for consumers.\n\nCentral banks, such as the U.S. Federal Reserve, actively monitor inflation data to make decisions about monetary policy, particularly regarding interest rates. If inflation remains stubbornly high, the central bank might consider keeping interest rates elevated or even raising them further to cool down the economy. Conversely, if inflation shows signs of easing, it could open the door for potential interest rate cuts, which can stimulate economic growth. This report will provide crucial insights into whether previous efforts to control inflation have been effective.\n\nIn addition to the inflation data, several major banks are scheduled to release their quarterly earnings reports. These financial statements offer a detailed look into the banks' profitability, loan performance, and overall health. Bank earnings are often seen as a barometer for the broader economy. Strong earnings can signal robust consumer spending and business investment, while weaker results might suggest economic headwinds. Investors will be looking for clues about how higher interest rates have impacted bank profits and lending activity, as well as their outlook for the coming months. Together, these two sets of reports will provide a comprehensive picture of the current economic landscape and influence expectations for future economic trends.", "vocab": [{"word": "pivotal", "definition": "Very important, crucial, or central to something."}, {"word": "inflation", "definition": "The general increase in prices and fall in the purchasing value of money."}, {"word": "central bank", "definition": "A national bank that provides financial and banking services for its country's government and commercial banking system, and implements monetary policy."}, {"word": "interest rates", "definition": "The cost of borrowing money or the return for saving money, expressed as a percentage."}, {"word": "earnings", "definition": "The profit made by a company or individual."}, {"word": "economy", "definition": "The system by which a country's money, industry, and trade are organized."}, {"word": "financial", "definition": "Relating to money or the management of money."}]}, "Advanced": {"text": "The economic calendar for the upcoming week is poised to deliver critical insights into the health and trajectory of the global economy, with a pivotal inflation report and a series of major bank earnings announcements taking center stage. These events are anticipated to significantly influence monetary policy decisions, market sentiment, and investor strategies.\n\nThe inflation report, likely encompassing key indicators such as the Consumer Price Index (CPI), will be meticulously scrutinized by economists, policymakers, and financial markets alike. Inflation, the sustained increase in the general price level of goods and services, directly impacts the purchasing power of consumers and the profitability of businesses. Central banks, notably the U.S. Federal Reserve, employ monetary policy tools, primarily adjusting benchmark interest rates, to manage inflation and achieve price stability alongside maximum employment. A higher-than-expected inflation figure could reinforce the argument for maintaining restrictive monetary conditions or even signal the need for further rate hikes, potentially dampening economic growth. Conversely, a clear deceleration in price pressures might provide the impetus for central banks to consider easing their hawkish stance, potentially paving the way for future rate cuts and stimulating economic activity. The report's nuances regarding core inflation (excluding volatile food and energy prices) will be particularly telling for assessing underlying inflationary trends.\n\nConcurrently, the release of quarterly corporate earnings from several prominent banks will offer a granular view into the financial sector's performance and, by extension, the broader economic landscape. Bank earnings reports detail revenue, net income, loan growth, credit quality, and capital adequacy. These metrics serve as vital economic indicators, reflecting consumer spending patterns, business investment levels, and the overall health of the credit market. Analysts will be keen to observe how banks have navigated the current high-interest-rate environment, assessing their net interest margins (the difference between interest earned on loans and interest paid on deposits) and any potential uptick in loan defaults. The outlook provided by bank executives on future lending activity, economic growth, and risk management will also be crucial for investors seeking to gauge the resilience of the financial system and the economy's forward momentum. The confluence of these two significant data releases will undoubtedly frame the economic narrative for the immediate future, providing essential data points for navigating an evolving global economic climate.", "vocab": [{"word": "pivotal", "definition": "Of crucial importance in relation to the development or success of something else."}, {"word": "monetary policy", "definition": "The actions undertaken by a central bank to influence the availability and cost of money and credit to help promote national economic goals."}, {"word": "economic indicators", "definition": "Statistics about economic activity that allow analysis of economic performance and predictions of future performance."}, {"word": "corporate earnings", "definition": "The profit a company makes, often reported quarterly, providing insight into its financial health."}, {"word": "consumer spending", "definition": "The total money spent by individuals and households on goods and services."}, {"word": "market sentiment", "definition": "The overall attitude of investors toward a particular security or financial market."}, {"word": "hawkish stance", "definition": "An aggressive approach to monetary policy, typically favoring higher interest rates to combat inflation."}, {"word": "confluence", "definition": "The flowing together of two or more streams or, metaphorically, the coming together of events or circumstances."}]}}, "questions": [{"q": "What two main types of economic reports are expected to be important this week?", "a": "An inflation report and bank earnings reports."}, {"q": "Why are central banks interested in inflation reports?", "a": "Central banks use inflation data to make decisions about monetary policy, such as adjusting interest rates, to manage price stability and economic growth."}], "id": "a490abc513e", "source": "\"economy OR inflation OR GDP OR central bank when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxPRERJRTliMnZtSk9DR2pLNjZqeVpRM2dmZi0weU5pRGtnTHlScXdCLUQ2bjVnOXl5N1M4ZG5FYzZVcU5yZmUzSmZwWkJOaHo5N2VMTFoxXzh2UDBBdzAtbThpamdiSnNBdWVsaVp4MS01OXNVVWktUm5wa0p0RHFmV1IxQ2x4UXRsNTlCOXVaUXpMSDJxNVlsOUFabkhtQkpETGFLRl9ONmdvejFlWmtQOA?oc=5", "published": "2026-07-11T05:22:23+09:00", "category": "economics", "category_title": "Economics"}, {"headline": "Man Fatally Shot by ICE Was Not Intended Target", "excerpt": "Immigration agents in Houston fatally shot a man during a traffic stop who was not the person they were looking for.", "levels": {"Beginner": {"text": "A man named Lorenzo Salgado Araujo died in Houston, Texas. He was shot by immigration agents. These agents work for a group called ICE, which helps enforce immigration laws. Officials say that Mr. Salgado Araujo was not the person ICE agents wanted to find. They were looking for someone else during a traffic stop. This means it was a mistake. The agents stopped a car, and then the shooting happened. The Department of Homeland Security (DHS) is now looking into what happened. DHS is a big government department that ICE is part of. It is a very sad event. People want to know why this happened and what went wrong. The investigation will try to find answers. This kind of event makes people think about how police and agents do their jobs.", "vocab": [{"word": "fatally", "definition": "in a way that causes death"}, {"word": "agents", "definition": "people who work for a government agency"}, {"word": "enforce", "definition": "to make sure rules or laws are followed"}, {"word": "intended", "definition": "planned or meant"}, {"word": "traffic stop", "definition": "when police or agents make a car pull over"}]}, "Intermediate": {"text": "Lorenzo Salgado Araujo was fatally shot by immigration agents in Houston, Texas. Officials have confirmed that Mr. Salgado Araujo was not the person agents from U.S. Immigration and Customs Enforcement (ICE) intended to apprehend. The tragic incident occurred during a traffic stop where agents were attempting to locate a different individual. The Department of Homeland Security (DHS), which oversees ICE, has stated that the shooting is under review. This means they are investigating the circumstances surrounding the event.\n\nICE is a federal law enforcement agency responsible for enforcing immigration laws within the United States. Its agents conduct operations to identify, apprehend, and deport individuals who are in the country illegally or have violated immigration statutes. In this particular case, the agents' operation led to a fatal encounter with someone who was not their target.\n\nThe investigation by DHS will examine the sequence of events, the actions taken by the agents, and whether established protocols were followed. Such incidents often raise significant public concern about law enforcement procedures, the use of force, and accountability. The community and Mr. Salgado Araujo's family will be seeking answers regarding this profound mistake and how such a tragic outcome could have been prevented. The findings of the review will be important for understanding what went wrong.", "vocab": [{"word": "apprehend", "definition": "to catch and arrest someone"}, {"word": "incident", "definition": "an event or occurrence, often one that is unpleasant"}, {"word": "oversees", "definition": "supervises or manages something"}, {"word": "enforcing", "definition": "making sure rules or laws are obeyed"}, {"word": "protocols", "definition": "official procedures or rules of behavior"}, {"word": "accountability", "definition": "the state of being responsible for something and having to explain your actions"}]}, "Advanced": {"text": "A tragic incident in Houston, Texas, has drawn significant scrutiny after U.S. Immigration and Customs Enforcement (ICE) agents fatally shot Lorenzo Salgado Araujo, who authorities now confirm was not their intended target. The Department of Homeland Security (DHS), which exercises oversight over ICE, stated that agents were conducting a traffic stop in an attempt to apprehend a different individual when the shooting occurred. This critical incident has prompted an internal review by DHS, underscoring the serious implications of law enforcement operations involving mistaken identity.\n\nICE, a principal enforcement arm of DHS, is tasked with upholding immigration laws within the United States, including identifying, apprehending, and detaining individuals who violate these statutes. The agency's operations often involve complex and potentially volatile situations, requiring agents to adhere strictly to established protocols regarding engagement and the use of force. In this instance, the operation tragically diverged from its objective, resulting in the death of an unintended victim.\n\nThe ongoing investigation by DHS will meticulously examine the sequence of events leading up to the shooting, the tactical decisions made by the agents, and whether all standard operating procedures and training guidelines were rigorously followed. Such events invariably spark public debate regarding agent conduct, accountability mechanisms, and the broader scope of federal immigration enforcement. Critics often point to these incidents as evidence of potential systemic issues within law enforcement agencies, advocating for enhanced training, stricter oversight, and greater transparency.\n\nThe outcome of this review will be crucial for understanding the precise circumstances that led to Mr. Salgado Araujo's death and for addressing any deficiencies in operational planning or execution. It will also be vital for restoring public trust and ensuring that measures are put in place to prevent similar tragic errors in the future. The family of Mr. Salgado Araujo and the community await a thorough and transparent accounting of the events.", "vocab": [{"word": "scrutiny", "definition": "close and careful examination or observation"}, {"word": "oversight", "definition": "the action of supervising something or someone"}, {"word": "apprehend", "definition": "to seize and take into custody; to arrest"}, {"word": "implications", "definition": "the possible results or effects of an action or a decision"}, {"word": "volatile", "definition": "likely to change rapidly and unpredictably, especially for the worse; unstable"}, {"word": "adhere", "definition": "to stick firmly to a belief, practice, or rule"}, {"word": "meticulously", "definition": "in a way that shows great attention to detail; very carefully and precisely"}, {"word": "deficiencies", "definition": "shortcomings or imperfections; a lack of something necessary"}]}}, "questions": [{"q": "Who was fatally shot by ICE agents in Houston?", "a": "Lorenzo Salgado Araujo was fatally shot by ICE agents."}, {"q": "What government department is investigating the shooting?", "a": "The Department of Homeland Security (DHS) is investigating the shooting."}], "id": "aca49ceedb4", "source": "BBC News", "link": "https://www.bbc.co.uk/news/articles/cm2rm66xd17o?at_medium=RSS&at_campaign=rss", "published": "2026-07-11T07:38:03+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Trump Replaces Election Officials Amid Voting Process Push", "excerpt": "Donald Trump has removed members of a federal election commission, signaling a continued effort to reshape the US voting system.", "levels": {"Beginner": {"text": "Donald Trump has made changes to a group that helps with elections. This group is called the Election Assistance Commission (EAC). He has removed some of its members. Now, he is putting new people in their places. This move is part of his plan to change how people vote in the United States.\n\nThe EAC's job is to make sure elections are fair and safe. It gives advice to states about voting rules and machines. It also helps check that voting equipment works correctly. The commission is usually made up of people from different political parties, working together.\n\nMr. Trump has often said that past elections were not fair. He believes there were problems with how votes were counted. By changing who is on the EAC, he wants to influence how elections are run in the future. Some people are worried about these changes. They think it could affect how elections are managed and whether they are seen as fair by everyone. This is an important topic for American democracy.", "vocab": [{"word": "commission", "definition": "A group of people given a special job or task."}, {"word": "removed", "definition": "Taken away from a position or job."}, {"word": "influence", "definition": "To have an effect on someone or something."}, {"word": "managed", "definition": "Controlled or organized something."}, {"word": "democracy", "definition": "A system of government where people choose their leaders by voting."}]}, "Intermediate": {"text": "Donald Trump has initiated a significant shift within the federal body responsible for advising on election administration, the Election Assistance Commission (EAC). He has ousted current members and is moving to appoint new individuals to these key positions. This action is seen as a continuation of his broader strategy to reform and influence the United States' voting processes.\n\nEstablished after the contested 2000 presidential election, the EAC's primary mandate is to help states improve election administration. It provides guidance on best practices, certifies voting equipment, and offers support to ensure secure and accessible elections. Traditionally, the commission is designed to be bipartisan, with members from both major political parties working collaboratively to build trust in the electoral system.\n\nTrump's decision to replace commission members comes amidst his persistent claims of widespread fraud in previous elections, allegations that have largely been unsubstantiated by evidence. By installing new appointees, he aims to steer the commission's direction, potentially aligning its work more closely with his views on election integrity and security measures. Critics express concern that such unilateral changes could undermine the EAC's non-partisan role and potentially politicize its functions, impacting public confidence in election outcomes. The move highlights ongoing national debates about the balance between ensuring voter access and implementing stricter election security protocols.", "vocab": [{"word": "initiated", "definition": "Started or began something."}, {"word": "ousted", "definition": "Forced someone out of a position or job."}, {"word": "mandate", "definition": "An official order or commission to do something."}, {"word": "bipartisan", "definition": "Involving the agreement or cooperation of two political parties."}, {"word": "unsubstantiated", "definition": "Not supported or proven by evidence."}, {"word": "politicize", "definition": "To make something political or controversial."}]}, "Advanced": {"text": "In a decisive move signaling his continued intent to reshape the nation's electoral landscape, Donald Trump has unilaterally replaced members of the Election Assistance Commission (EAC). This federal body, tasked with advising states on election administration and best practices, is now poised for a significant shift in its composition and potentially its strategic direction, as Trump moves to install his own appointees.\n\nThe EAC was established by the Help America Vote Act (HAVA) of 2002, a bipartisan legislative response to the controversies surrounding the 2000 presidential election. Its core mission is to assist states in improving election administration, including setting voluntary guidelines for voting systems, accrediting testing laboratories, and serving as a clearinghouse for election information. Crucially, the commission is designed to operate on a bipartisan basis, with its four commissioners typically split between the two major parties to foster consensus and maintain public trust in the integrity of federal elections.\n\nTrump's decision to oust existing members and appoint new ones aligns with his long-standing narrative regarding election integrity, which has frequently included unsubstantiated claims of widespread voter fraud. Critics argue that these appointments are an attempt to exert greater partisan control over a body intended to be non-partisan, potentially influencing its guidance on voter registration, ballot access, and voting machine certification. Such actions raise concerns about the politicization of election oversight and the potential erosion of public confidence in the impartiality of election processes.\n\nThe implications of these changes could be far-reaching. A commission with a new ideological bent might prioritize different aspects of election security, potentially advocating for stricter voter ID laws or more stringent ballot verification processes, which some argue could disproportionately impact voter access. Conversely, proponents of the changes might contend that they are necessary to bolster election security and address perceived vulnerabilities. This development underscores the ongoing, contentious national debate over the balance between ensuring broad voter participation and implementing robust safeguards against potential fraud, a debate that continues to define the future of American democracy.", "vocab": [{"word": "unilaterally", "definition": "Done by one person or group without the agreement of others."}, {"word": "electoral landscape", "definition": "The overall situation or environment related to elections and voting."}, {"word": "poised", "definition": "Ready and prepared for something to happen."}, {"word": "mandate", "definition": "An official order or commission to do something; the authority to carry out a policy."}, {"word": "accrediting", "definition": "Officially recognizing someone or something as having a particular status or being qualified to perform a particular activity."}, {"word": "narrative", "definition": "A way of presenting or understanding a situation or series of events that reflects a particular viewpoint."}, {"word": "erosion", "definition": "The gradual destruction or reduction of something."}, {"word": "contentious", "definition": "Causing or likely to cause an argument; controversial."}]}}, "questions": [{"q": "What is the main purpose of the Election Assistance Commission (EAC)?", "a": "The EAC's main purpose is to help states improve election administration, provide guidance on best practices, certify voting equipment, and ensure secure and accessible elections."}, {"q": "Why are some people concerned about Donald Trump replacing members of the EAC?", "a": "Some people are concerned that replacing EAC members could politicize the commission's non-partisan role, undermine public confidence in election outcomes, and potentially influence election rules in a way that affects voter access or security."}], "id": "a154d458ce5", "source": "\"world politics OR government OR election when:2d\" - Google News", "link": "https://news.google.com/rss/articles/CBMi1wFBVV95cUxQbHBGTnBfTGtLSk9yNnhBdWNWcDFMZ0lOZUxUVnBMNEk4a25XUFFvQ0JUTmZmSXUzaUVNVG9ocWlqYTZPNGUzTlpBaHotek9YVG42NW16bkxMSFRPQ1R1VTEyQVpPMTFGZmwtM0V3TUdHSjQ3QUNkWlFkeU42NXptOW9JRzQ5a3dLanQ2N24wYTA5NTE2eElsc0dHbHVDXzZNekJUZ3JwdEwzNmpWVFo4ZlVadmI5TEs0Q00tZ2dCd1V6SXI5TGhoWkxCNGRUQUE4SzB6MExFOA?oc=5", "published": "2026-07-11T06:46:25+09:00", "category": "politics", "category_title": "Politics"}, {"headline": "Local Pickleball Event Celebrates New Champions", "excerpt": "A recent local pickleball event, the Pat Webber tournament, has concluded, celebrating new champions in the popular sport.", "levels": {"Beginner": {"text": "A fun sports event just finished. It was called the Pat Webber pickleball tournament. Many people played pickleball and had a good time. Pickleball is a sport that uses paddles and a special ball. It is played on a small court, like a tennis court but smaller. It is easy to learn and many people like to play it. The Pat Webber event celebrated the winners. These players worked hard and played well. Local sports news, like the Peninsula Daily News, shared the results. This shows that pickleball is growing in our area. People of all ages can play pickleball. It is a great way to get exercise and meet new friends. The tournament brought the community together. Everyone enjoyed watching the games and cheering for the players. Congratulations to all the winners and everyone who played in the Pat Webber pickleball event!", "vocab": [{"word": "event", "definition": "a planned public or social occasion."}, {"word": "sport", "definition": "an activity involving physical exertion and skill in which an individual or team competes."}, {"word": "paddle", "definition": "a short oar with a wide blade, used to hit a ball in sports."}, {"word": "court", "definition": "a place marked out for playing a game like tennis or basketball."}, {"word": "community", "definition": "a group of people living in the same place or having things in common."}]}, "Intermediate": {"text": "The local sports scene recently celebrated the conclusion of the Pat Webber pickleball tournament, an event that brought together enthusiasts of the rapidly growing sport. Winners were announced, marking the successful end of a competition that showcased skill and sportsmanship within the community.\n\nPickleball, a dynamic paddle sport, combines elements of tennis, badminton, and table tennis. It is played on a smaller court than tennis, typically with a solid paddle and a plastic ball with holes. Its relatively easy learning curve and engaging gameplay have contributed to its immense popularity across various age groups, from young athletes to seniors seeking active recreation. This accessibility makes it a truly inclusive sport.\n\nThe Pat Webber tournament, as reported by local outlets like the Peninsula Daily News, highlights the vibrant pickleball culture in the area. Such local events are crucial for fostering community spirit and providing platforms for friendly competition. Participants not only vie for victory but also enjoy the social interaction and physical benefits the sport offers, making it a well-rounded activity. The tournament likely featured different divisions, such as men's doubles, women's doubles, and mixed doubles, allowing players of various skill levels to compete fairly.\n\nThe success of tournaments like the Pat Webber event underscores pickleball's status as more than just a passing trend; it's becoming a staple in local recreational activities. Organizers and players alike contributed to a well-run event, ensuring a positive experience for everyone involved. Congratulations are extended to all the champions who demonstrated exceptional play, as well as to every participant who made the tournament a memorable occasion. These local competitions play a vital role in promoting healthy lifestyles and strengthening community bonds through shared athletic pursuits.", "vocab": [{"word": "enthusiasts", "definition": "people who are very interested in a particular activity or subject."}, {"word": "showcased", "definition": "displayed or presented something in an impressive way."}, {"word": "dynamic", "definition": "characterized by constant change, activity, or progress.  the pickleball experience, highlighting its strong social dimension. The tournament likely featured various divisions, including singles, doubles, and mixed doubles, catering to different skill sets and fostering a spirit of fair play among competitors.\n\nThe organizational prowess behind the Pat Webber event, coupled with the enthusiastic participation, speaks volumes about the dedication of local sports advocates. These grassroots efforts are indispensable for nurturing talent, promoting healthy lifestyles, and strengthening social bonds. They provide crucial infrastructure for the sport's expansion. Local media coverage, epitomized by the Peninsula Daily News's brief, plays a crucial role in validating these community endeavors, providing recognition for participants and encouraging broader public interest, thereby reinforcing the positive feedback loop between local sports and local journalism.\n\nAs pickleball continues its upward trajectory, local tournaments like the Pat Webber event will remain foundational. They not only celebrate athletic achievement but also reinforce the communal fabric, proving that sports can be a powerful catalyst for positive social outcomes. The champions of the Pat Webber tournament now join a growing roster of local athletes contributing to the sport's rich tapestry, embodying the spirit of competition and community that pickleball so uniquely offers.", "vocab": [{"word": "culminated", "definition": "reached a climax or point of highest development; ended with a particular result."}, {"word": "underscored", "definition": "emphasized the importance of something; drew attention to."}, {"word": "burgeoning", "definition": "beginning to grow or increase rapidly; flourishing."}, {"word": "ingeniously", "definition": "in a clever, original, and inventive way."}, {"word": "meteoric", "definition": "resembling a meteor in speed and brilliance; very rapid and impressive."}, {"word": "microcosm", "definition": "a community, place, or situ const LEVELS = ["Beginner","Intermediate","Advanced"];
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level = LS.get('scoopLevel','Intermediate');
let bionic = LS.get('scoopBionic', false);
let view = {type:'home'};
let history = [];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function byId(id){for(const c of ED.categories)for(const a of c.articles)if(a.id===id)return a;return null;}
function catTitle(key){const c=ED.categories.find(c=>c.key===key);return c?c.title:key;}

function paras(text){return String(text||'').split(/\n{2,}|\n/).filter(t=>t.trim()).map(t=>'<p>'+esc(t)+'</p>').join('')||'<p></p>';}

function bw(w){const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9]+)([\s\S]*)$/);if(!m)return w;const n=Math.max(1,Math.round(m[2].length*0.45));return m[1]+'<b>'+m[2].slice(0,n)+'</b>'+m[2].slice(n)+m[3];}
function applyBionic(root){root.querySelectorAll('.article-body p, .excerpt').forEach(el=>{const wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const ns=[];while(wk.nextNode())ns.push(wk.currentNode);ns.forEach(t=>{if(!t.nodeValue.trim())return;const sp=document.createElement('span');sp.innerHTML=t.nodeValue.split(/(\s+)/).map(tk=>tk.trim()?bw(tk):tk).join('');t.parentNode.replaceChild(sp,t);});});}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const tabs=[{key:'__home',title:'Home'}].concat(ED.categories.map(c=>({key:c.key,title:c.title})));
  tabs.forEach(tab=>{const b=document.createElement('button');
    const active=(tab.key==='__home'&&view.type==='home')||(view.type==='category'&&view.key===tab.key);
    b.className='tab'+(active?' active':'');b.textContent=tab.title;
    b.onclick=()=>{history=[];view=tab.key==='__home'?{type:'home'}:{type:'category',key:tab.key};render();};
    t.appendChild(b);});
}

function cardHTML(a, showCat){
  const tag=showCat?'<span class="cat-tag">'+esc(a.category_title||catTitle(a.category))+'</span>':'';
  return '<div class="card">'+tag+'<h3>'+esc(a.headline)+'</h3>'+
    '<div class="src">'+esc(a.source)+'</div>'+
    '<p class="excerpt">'+esc(a.excerpt)+'</p>'+
    '<button class="more" data-id="'+a.id+'">Read more →</button></div>';
}

function renderList(title, articles, showCat){
  let h='<div class="viewtitle">'+esc(title)+'</div>';
  h+=articles.map(a=>cardHTML(a,showCat)).join('') || '<div class="excerpt" style="color:var(--muted)">No stories today. Check back tomorrow.</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{history.push(view);view={type:'article',id:b.getAttribute('data-id')};render();});
}

function renderArticle(a){
  const lv=LEVELS.includes(level)?level:'Intermediate';
  let h='<div class="crumb">'+esc(catTitle(a.category))+'</div>';
  h+='<h2 class="art-h">'+esc(a.headline)+'</h2>';
  h+='<div class="art-src">'+esc(a.source)+'</div>';
  h+='<div class="levels">'+LEVELS.map(l=>'<button data-lv="'+l+'" class="'+(l===lv?'active':'')+'">'+l+'</button>').join('')+'</div>';
  const lo=((a.levels||{})[lv])||{};
  if((lo.vocab||[]).length){h+='<div class="panel"><h4>Vocabulary — '+lv+'</h4><dl class="vocab">'+
    lo.vocab.map(v=>'<dt>'+esc(v.word)+'</dt><dd>'+esc(v.definition)+'</dd>').join('')+'</dl></div>';}
  h+='<div class="article-body">'+paras(lo.text)+'</div>';
  if((a.questions||[]).length){h+='<div class="panel"><h4>Comprehension</h4>'+
    a.questions.map((q,i)=>'<div class="q"><p class="qq">'+(i+1)+'. '+esc(q.q)+'</p><details><summary></summary><p>'+esc(q.a)+'</p></details></div>').join('')+'</div>';}
  if(a.link){h+='<a class="srclink" href="'+esc(a.link)+'" target="_blank" rel="noopener">Read the original ↗</a>';}
  const el=document.getElementById('view');el.innerHTML=h;
  el.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{level=b.getAttribute('data-lv');LS.set('scoopLevel',level);renderArticle(a);});
  if(bionic)applyBionic(el);
  window.scrollTo(0,0);
}

function render(){
  renderTabs();
  document.getElementById('nav-back').disabled = (history.length===0);
  if(view.type==='home') renderList('Today’s Headlines', ED.home||[], true);
  else if(view.type==='category'){const c=ED.categories.find(c=>c.key===view.key);renderList(c?c.title:'', c?c.articles:[], false);}
  else if(view.type==='article'){const a=byId(view.id);a?renderArticle(a):(view={type:'home'},render());}
}

document.getElementById('built').textContent = ED.built||'';
document.getElementById('nav-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('nav-back').onclick=()=>{if(history.length){view=history.pop();render();}};
// Fast Reading toggle
const fb=document.createElement('button');fb.id='bionic-toggle';
function flbl(){fb.textContent='⚡ Fast Reading: '+(bionic?'ON':'OFF');}
fb.onclick=()=>{bionic=!bionic;LS.set('scoopBionic',bionic);flbl();render();};
document.body.appendChild(fb);flbl();
render();
</script>
