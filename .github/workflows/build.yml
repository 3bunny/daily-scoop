name: Build Daily Scoop
on:
  schedule:
    - cron: "0 22 * * *"     # 22:00 UTC = 07:00 KST — fresh edition each morning
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-scoop
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate today's edition (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/generate.py
      - name: Build the site
        run: python src/build_site.py
      - name: Commit
        run: |
          git config user.name  "daily-scoop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Edition $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "retry $i"; sleep 5
          done
          exit 1
